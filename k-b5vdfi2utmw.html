<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a6feb">
<meta name="robots" content="noindex, nofollow">
<title>核电入职刷题</title>
<style>
:root{
  --bg:#f2f4f8; --card:#fff; --text:#1c2330; --sub:#6b7486; --line:#e5e9f0;
  --pri:#1a6feb; --pri-weak:#e8f1fe; --ok:#18a058; --ok-weak:#e8f7ef;
  --bad:#d93a3a; --bad-weak:#fdeeee; --warn:#d97706; --warn-weak:#fdf3e3;
  --gen:#7c3aed; --gen-weak:#f1eafe; --note:#0e9488; --note-weak:#e5f7f5;
  --shadow:0 1px 4px rgba(16,24,40,.08); --radius:12px;
}
[data-theme="dark"]{
  --bg:#12161d; --card:#1c222c; --text:#e7ebf2; --sub:#8d97a8; --line:#2a323f;
  --pri:#4d8dfa; --pri-weak:#1a2740; --ok:#2eb872; --ok-weak:#12291d;
  --bad:#f06d6d; --bad-weak:#331a1a; --warn:#e9a23b; --warn-weak:#332711;
  --gen:#a78bfa; --gen-weak:#241d3a; --note:#2eb8a6; --note-weak:#12302c;
  --shadow:0 1px 4px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.55;}
body{padding-bottom:calc(58px + env(safe-area-inset-bottom));}
#hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);}
#hdr .back{width:34px;height:34px;border:none;background:none;color:var(--pri);
  font-size:22px;line-height:1;flex:none;cursor:pointer;padding:0;}
#hdr .title{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hdr .hbtn{border:none;background:none;color:var(--pri);font-size:13px;cursor:pointer;padding:6px 4px;flex:none;}
#view{padding:14px 12px 20px;max-width:720px;margin:0 auto;}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
#nav .tab{flex:1;border:none;background:none;color:var(--sub);font-size:11px;
  cursor:pointer;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
#nav .tab .ic{font-size:20px;line-height:1;}
#nav .tab.on{color:var(--pri);font-weight:600;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;}
.mcard{display:block;width:100%;text-align:left;border:none;cursor:pointer;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;color:var(--text);}
.mcard .mtop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mcard .mic{font-size:26px;}
.mcard .mname{font-size:18px;font-weight:700;flex:1;}
.mcard .mgo{color:var(--sub);font-size:13px;}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--pri),#67b0ff);border-radius:4px;transition:width .3s;}
.mmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--sub);}
.brow{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.brow:last-child{border-bottom:none;}
.brow .binfo{flex:1;min-width:0;}
.brow .bname{font-weight:600;font-size:15.5px;}
.brow .bcount{font-size:12.5px;color:var(--sub);margin-top:2px;}
.brow .bprog{font-size:12.5px;color:var(--pri);flex:none;}
.sec-title{font-size:14px;font-weight:600;color:var(--sub);margin:16px 2px 8px;}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px;}
.mode-btn{border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:10px 2px;font-size:12.5px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;}
.mode-btn .mi{font-size:19px;}
.mode-btn.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);font-weight:600;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
.chip.on{border-color:var(--pri);color:var(--pri);background:var(--pri-weak);font-weight:600;}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qno{font-size:13px;color:var(--sub);}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex:none;}
.t-single{background:var(--pri-weak);color:var(--pri);}
.t-multi{background:var(--warn-weak);color:var(--warn);}
.t-judge{background:var(--note-weak);color:var(--note);}
.s-official{background:var(--ok-weak);color:var(--ok);}
.s-wrongmark{background:var(--bad-weak);color:var(--bad);}
.s-favmark{background:var(--warn-weak);color:var(--warn);}
.s-ppt-notes{background:var(--note-weak);color:var(--note);}
.s-generated{background:var(--gen-weak);color:var(--gen);}
.t-course{background:var(--pri-weak);color:var(--pri);}
.course-line{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:-4px 2px 10px;}
.course-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.course-nav .chip{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gate-card{text-align:center;padding:30px 16px;}
.gate-ic{font-size:40px;}
.gate-done{font-weight:700;font-size:17px;margin-top:8px;}
.gate-next{font-weight:700;font-size:16px;margin-top:16px;color:var(--pri);}
.stem{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);
  background:var(--card);border-radius:10px;padding:11px 12px;cursor:pointer;
  font-size:15.5px;line-height:1.5;text-align:left;color:var(--text);}
.opt .ol{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--sub);}
.opt.picked{border-color:var(--pri);background:var(--pri-weak);}
.opt.picked .ol{border-color:var(--pri);color:var(--pri);background:var(--pri-weak);}
.opt.right{border-color:var(--ok);background:var(--ok-weak);}
.opt.right .ol{border-color:var(--ok);color:#fff;background:var(--ok);}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-weak);}
.opt.wrongpick .ol{border-color:var(--bad);color:#fff;background:var(--bad);}
.opt.dim{opacity:.55;}
.judge-row{display:flex;gap:10px;}
.judge-btn{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  padding:14px;font-size:16px;font-weight:600;cursor:pointer;color:var(--text);}
.judge-btn.right{border-color:var(--ok);background:var(--ok-weak);color:var(--ok);}
.judge-btn.wrongpick{border-color:var(--bad);background:var(--bad-weak);color:var(--bad);}
.judge-btn.picked{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);}
.confirm-bar{margin-top:12px;}
.big-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;
  font-weight:600;cursor:pointer;background:var(--pri);color:#fff;}
.big-btn:disabled{opacity:.45;}
.big-btn.ghost{background:none;border:1.5px solid var(--line);color:var(--text);}
.feedback{border-radius:10px;padding:11px 13px;margin-top:13px;font-size:14.5px;line-height:1.55;}
.feedback.ok{background:var(--ok-weak);color:var(--ok);}
.feedback.bad{background:var(--bad-weak);color:var(--bad);}
.feedback b{font-weight:700;}
.expl{border-radius:10px;padding:11px 13px;margin-top:9px;font-size:14px;line-height:1.6;
  background:var(--pri-weak);color:var(--text);white-space:pre-wrap;}
.expl .elabel{font-size:12px;color:var(--sub);margin-bottom:4px;display:flex;gap:6px;align-items:center;}
.pbar-wrap{margin-bottom:12px;}
.pbar-wrap .ptxt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:5px;}
.qfoot{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:40;
  background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;
  padding:8px 12px;gap:8px;max-width:720px;margin:0 auto;}
body.no-nav .qfoot{bottom:0;}
.qfoot .fbtn{border:none;background:none;color:var(--sub);font-size:13px;cursor:pointer;
  padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;}
.qfoot .fbtn .fi{font-size:18px;}
.qfoot .fbtn.on{color:var(--warn);}
.qfoot .navbtn{flex:1;border:none;border-radius:9px;padding:10px 0;font-size:15px;
  font-weight:600;cursor:pointer;}
.qfoot .prev{background:var(--bg);color:var(--text);margin-right:2px;}
.qfoot .next{background:var(--pri);color:#fff;}
.qfoot .next:disabled{opacity:.4;}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;
  align-items:flex-end;}
.sheet{background:var(--card);width:100%;max-height:75vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 10px;font-size:16px;}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;}
.sq{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;cursor:pointer;color:var(--text);}
.sq.done-ok{background:var(--ok-weak);border-color:var(--ok);color:var(--ok);}
.sq.done-bad{background:var(--bad-weak);border-color:var(--bad);color:var(--bad);}
.sq.done{background:var(--pri-weak);border-color:var(--pri);color:var(--pri);}
.sq.cur{outline:2.5px solid var(--pri);outline-offset:1px;font-weight:700;}
.timer{font-size:13.5px;font-weight:600;color:var(--warn);background:var(--warn-weak);
  border-radius:14px;padding:3px 11px;}
.timer.danger{color:var(--bad);background:var(--bad-weak);}
.stat-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-cell{background:var(--card);border-radius:10px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);}
.stat-cell .v{font-size:21px;font-weight:700;color:var(--pri);}
.stat-cell .k{font-size:12px;color:var(--sub);margin-top:2px;}
.bank-stat{margin-bottom:10px;}
.bank-stat .bs-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.bank-stat .bs-top b{font-weight:600;}
.dailies{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px;}
.dailies .dbar{flex:1;background:var(--pri-weak);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
.dailies .dbar>div{position:absolute;bottom:0;left:0;right:0;background:var(--pri);border-radius:3px 3px 0 0;}
.dailies .dbar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:var(--sub);white-space:nowrap;}
.dailies-wrap{padding-bottom:20px;}
.search-input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:15px;margin-bottom:10px;outline:none;}
.search-input:focus{border-color:var(--pri);}
.res-item{padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.res-item .rs{font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.res-item .rmeta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;}
.empty{ text-align:center;color:var(--sub);padding:44px 10px;font-size:14px;}
.empty .eic{font-size:40px;margin-bottom:8px;}
.score-circle{width:130px;height:130px;border-radius:50%;margin:6px auto 10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--pri);}
.score-circle.pass{border-color:var(--ok);}
.score-circle.fail{border-color:var(--bad);}
.score-circle .sv{font-size:34px;font-weight:800;}
.score-circle .sk{font-size:12px;color:var(--sub);}
.result-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.exam-setup label{display:block;font-size:13.5px;color:var(--sub);margin:12px 0 7px;}
.exam-setup .cnt-row{display:flex;gap:8px;}
.about{font-size:12.5px;color:var(--sub);line-height:1.7;text-align:center;padding:8px 0 4px;}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(28,35,48,.92);
  color:#fff;font-size:13.5px;border-radius:20px;padding:8px 18px;z-index:99;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:80vw;}
.toast.show{opacity:1;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mut{color:var(--sub);font-size:13px;}
h2.pg{font-size:19px;font-weight:700;margin:4px 2px 12px;}
.divider{height:1px;background:var(--line);margin:10px 0;}
button{font-family:inherit;}
input,button{-webkit-user-select:none;user-select:none;}
</style>
</head>

</header>

"量子","中子"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"原子由带正电的原子核和核外带负电的电子组成，原子整体呈电中性。"},{"id":"basics_jc_0021","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪项属于技术规格书中的不可识别泄漏。","options":["来自设备可能的泄漏，该泄漏预计将被收集（如稳压器安全阀的泄漏、压力容器密封环泄漏、一些密封阀泄漏）","收集在密封环路、可以进行测量的系统之间的泄漏","蒸汽发生器传热管泄漏","机组正常运行时存在的泄漏"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽发生器传热管泄漏属于不可识别泄漏（无法确定具体泄漏源），是技术规格书重点限制的对象。"},{"id":"basics_jc_0022","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪一项属于压水堆核电厂与研究堆运行的共同特点。","options":["反应堆堆芯保护系统的原则是对功率、轴向功率分布、冷却剂的流量、温度和压力等确定一个允许的运行区间，当运行超过该区间限值时，实现紧急停堆","载硼运","汽轮机快速降负荷功能"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆核电厂与研究堆运行的共同特点是反应堆堆芯保护系统的原则一致（均要求可靠的反应性控制和保护）。"},{"id":"basics_jc_0023","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"技术规格书不适用于异常或事故工况，在这种工况下的安全保证是通过( )来实现的。","options":["事故程序","正常运行规程","操作单"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"技术规格书适用于正常运行，异常或事故工况下的安全通过事故程序（应急运行规程）来保证。"},{"id":"basics_jc_0024","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂的安全保障则包括核安全管理制度、核安全设计和( )三个方面。","options":["核安全理念","核安全法规","核安全文化"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"核电厂安全保障包括核安全管理制度、核安全设计和核安全文化三个方面。"},{"id":"basics_jc_0025","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"( )事件是指在核电厂功率运行、燃料更换、维修过程中频繁发生的事件。","options":["高频度","中等频度","低频度"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"中等频度事件指在功率运行、换料、维修过程中频繁发生的事件（如个别棒落棒、汽机跳闸等）。"},{"id":"basics_jc_0026","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"蒸汽发生器安装在（ ）。","options":["反应堆厂房","汽轮机厂房","燃料厂房"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽发生器属于一回路设备，安装在反应堆厂房（安全壳）内。"},{"id":"basics_jc_0027","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪一项属于压水堆核电厂运行特点（ ）","options":["反应堆超临界","反应堆内产生和积累了大量的放射性物质","停堆后停止释热"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆运行特点之一是反应堆内产生并积累大量放射性物质，停堆后仍持续释放衰变热。"},{"id":"basics_jc_0028","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"正常情况下，压水堆核电站只在（ ）中存在放射性。","options":["一回路","二回路","三回路"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正常情况下放射性只存在于一回路；二回路只有在蒸汽发生器传热管泄漏时才可能出现放射性。"},{"id":"basics_jc_0029","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"差压式流量计中节流装置输出差压与被测流量的关系为：( )","options":["差压与流量成正比","差压与流量成反比","差压与流量的平方成正比","差压与流量成线性关系"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"差压式流量计的节流装置输出差压与被测流量的平方成正比（ΔP∝Q²），因此流量与差压平方根成正比。"},{"id":"basics_jc_0030","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪个不是误差的表示方法？","options":["绝对误差","相对误差","引用误差","计算误差"],"answer":["D"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"误差的表示方法有绝对误差、相对误差、引用误差；\"计算误差\"不属于误差的表示方法。"},{"id":"basics_jc_0031","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下不是反应堆冷却剂系统的热工参数的（ ）。","options":["温度","压力","流量","放射性"],"answer":["D"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"温度、压力、流量是热工参数；放射性属于核测量（辐射监测）参数，不是热工参数。"},{"id":"basics_jc_0032","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂一回路冷却剂系统使用测量主管道温度的仪表类型多为：（ ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"一回路主管道（冷段/热段）温度测量多采用精度高、稳定性好的热电阻（铂电阻）。"},{"id":"basics_jc_0033","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂应用最多的测温仪表类型为：（ ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"核电厂应用最多的测温仪表是热电阻（铂电阻），用于中低温精确测量；热电偶多用于高温场合。"},{"id":"basics_jc_0034","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"冷却剂环路流量测量使用的仪表类型为：（ ）","options":["压差变送器","压力表","体积流量计","超声波流量计"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"冷却剂环路流量采用弯管（或节流装置）+压差变送器测量。"},{"id":"basics_jc_0035","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"仪控系统需要保证的三大核安全目标（要素）不包括：（ ）","options":["反应性控制","余热排出","放射性包容","工业安全"],"answer":["D"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"仪控系统保证的三大核安全要素（目标）是：反应性控制、余热排出、放射性包容；工业安全不在其中。"},{"id":"basics_jc_0036","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下哪项不是堆芯中子注量率测量系统在正常运行时的功能（ ）","options":["探测反应堆在装料中可能出现的差错","检查与燃耗对应的功率分布是否与设计所期望的功率分布相符","监测各燃料组件的燃耗，校准堆外核测量仪表","探测堆芯是否偏离正常运行"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"堆芯中子注量率测量系统正常运行时用于监测功率分布、校核燃耗、探测异常；装料期间的探测属于换料大修工况，不是正常运行功能。"},{"id":"basics_jc_0037","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"_____是压力容器用以储存物料或完成化学反应所需要的主要空间，是压力容器的最主要的受压元件之一。","options":["封头","筒体","密封装置"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"筒体是压力容器储存物料或完成化学反应的主要空间，是最主要的受压元件之一。"},{"id":"basics_jc_0038","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"泵是将机械能转换成流体的_____和动力能，实现流体定向输运的动力设备。","options":["速度能","压力能","热能"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"泵将机械能转换为流体的压力能和动能，实现流体定向输运。"},{"id":"basics_jc_0039","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂常用的叶轮泵有______、混流泵和轴流泵三类。","options":["齿轮泵","离心泵","柱塞泵"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"叶轮泵按叶轮内液体流向分为离心泵、混流泵和轴流泵三类。"},{"id":"basics_jc_0040","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"蒸汽流过汽轮机级时，首先在喷嘴叶栅中将部分的热能转变成为动能，然后在动叶珊中将其动能和热能转变为______，使得叶轮和轴转动。","options":["电能","热量","机械能"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽在喷嘴叶栅中把热能变为动能，在动叶栅中把动能和热能转变为机械能，推动叶轮和轴旋转。"},{"id":"basics_jc_0041","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"曲柄销中心与主轴颈中心之间的距离称曲柄半径R。连杆大、小端中心间的距离称连杆长度L。上、下止点间的距离称活塞行程（冲程）S。S=_____R。","options":["1.0","2.0","3.0"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"活塞行程（冲程）S等于曲柄半径R的两倍，即 S=2R（上下止点间距为曲柄半径的2倍）。"},{"id":"basics_jc_0042","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"阀门的用途广泛，种类繁多，分类方法也比较多，总体上可以分为自动型阀门和_____。","options":["气动型阀门","驱动型阀门","电动型阀门"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"阀门总体上分为自动型阀门（靠介质本身动作，如止回阀、安全阀）和驱动型阀门（靠外力驱动，如闸阀、截止阀）。"},{"id":"basics_jc_0043","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"离心泵启动时，出口阀开启时间与泵启动时间关系______。","options":["先启动泵，后开启出口阀","先开启出口阀，后启动泵","同时气动泵和出口阀"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"离心泵启动时应先启动泵、后开启出口阀（低流量启动降低启动电流和冲击），停运时先关出口阀再停泵。"},{"id":"basics_jc_0044","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"热交换器是将一种介质的_____传给另一种介质的设备。","options":["能量","流量","热量"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"热交换器是将一种介质的热量传给另一种介质的设备（加热器、冷凝器等）。"},{"id":"basics_jc_0045","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"轻水的酸碱性根据pH大小分＜7酸性、=7中性、＞7碱性，对于重水来说，测得pH=7时为______。","options":["酸性","碱性","中性"],"answer":["A"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"重水的离子积常数与轻水不同，中性点pH约7.35；对重水测得pH=7时呈酸性（低于其中性点）。"},{"id":"basics_jc_0046","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"在核电厂一回路系统中，其放射性物质通过水及其中杂质的活化、裂变产物的释放、腐蚀产物的活化和化学添加物的活化等途径持续不断产生，为了控制系统中的核素活度维持在较低水平，通常采用______方式进行处理。","options":["滤芯过滤","树脂离子交换","膜分离技术"],"answer":["B"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"一回路放射性控制主要靠化学与容积控制系统的树脂离子交换（除盐器）连续净化。"},{"id":"basics_jc_0047","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"在下述卤素元素中，______对包壳材料锆合金的腐蚀作用最明显。","options":["氟离子","氯离子","溴离子"],"answer":["A"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"卤素中氟离子对锆合金包壳的腐蚀作用最明显，因此严格控制一回路氟离子含量。"},{"id":"basics_jc_0048","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"水的pH值大小反映水的酸碱度，当水温升高时，pH中性值下降，纯水温度在300℃时，其pH为______。","options":["6.5","7.5","5.6"],"answer":["C"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"水的离子积随温度升高增大，中性pH值下降；300℃纯水的中性pH约为5.6。"},{"id":"basics_jc_0049","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"压水堆核电厂蒸发器泄漏监测仪用于监测蒸发器一次侧向二次侧的泄漏，监测对象为（ ）。","options":["N-13","N-16","I-131"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽发生器泄漏监测以N-16（一回路水中O-16活化产生）为监测对象，二次侧测到N-16即表明传热管泄漏。"},{"id":"basics_jc_0050","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"由于物品的表面污染的存在，会因为人员辐射工作接触而转移到工作人员体表，进而会通过吸入或食入途径进入人体产生内照射。场所污染防护措施一般有（ ）。","options":["建立表面污染隔离区，适时采取去污措施","放射性物质衰变减少辐射源","选择合适的屏蔽材料"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"表面污染防护首先建立表面污染污染隔离区，控制污染扩散；衰变等待和屏蔽主要针对外照射，不是场所表面污染防护的直接措施。"},{"id":"basics_jc_0051","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"1960 年的国际物理学会议和 1961 年的化学会议分别通过决议，确定以( )作为原子质量单位；","options":["1 个12C 原子质量的十二分之一","1 个14C 原子质量的十二分之一","1 个 16O 原子质量的十二分之一"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"1960年国际物理学会议和1961年化学会议确定以1个¹²C原子质量的十二分之一（1u）作为原子质量单位。"},{"id":"basics_jc_0052","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下用于体内污染监测的设备是（ ）。","options":["C1 门","C2 门","WBC"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"体内污染监测使用全身计数器（WBC）直接测量体内γ核素；C1门测出污染，C2门测出控制区人员污染。"},{"id":"basics_jc_0053","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"已知流体与壁面的对流传热系数为15W/（m2·℃），传热面积为10m2，流体的温度为10℃，壁面的温度为200℃，则单位时间内流体与壁面传递的热量为多少？","options":["29500J","28500J","27500J","26500J"],"answer":["B"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"牛顿冷却公式 Q=hAΔt=15×10×(200-10)=28500W，即每秒传递28500J热量。"},{"id":"basics_jc_0054","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"已知壁面的导热系数为15W/（m·℃），壁面厚度为1m，面积为1 m2，壁面的两侧的温度分别为10℃，和100℃，则单位时间内流体与壁面传递的热量为多少？","options":["1350J","1450J","1550J","1650J"],"answer":["A"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"傅里叶导热公式 Q=λAΔt/δ=15×1×(100-10)/1=1350W。"},{"id":"basics_jc_0055","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"防止水锤的措施包括（ ）。","options":["截止阀慢开慢关，尽可能降低压力的冲击","对不宜慢开、慢关的阀门，可采用小流量旁通阀先开（或后关）旁通阀，再开（或先关）主管道上截止阀","对管道进行疏水","以上都是"],"answer":["D"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"防止水锤：截止阀慢开慢关、不宜慢开慢关的阀门设置旁路、管道充分疏水排气等措施都有效，故选\"以上都是\"。"},{"id":"basics_jc_0056","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"在水与水蒸汽的温熵图（T-s图）中饱和水线和干饱和蒸汽线下方的区域对应的状态是：（ ）。","options":["饱和水","湿饱和蒸汽","过热蒸汽","超临界水或超临界蒸汽"],"answer":["B"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"T-s图中饱和水线与干饱和蒸汽线之间的区域是湿饱和蒸汽（两相区）。"},{"id":"basics_jc_0057","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"反应堆功率正比于反应堆的（ ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量"],"answer":["B"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"反应堆功率正比于堆芯热中子平均通量密度（功率是全堆裂变率的总和，对应平均通量）。"},{"id":"basics_jc_0058","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"比焓h的定义式：（ ）。","options":["u+pv","s+pv","u+s","u+Ts"],"answer":["A"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"比焓定义式 h=u+pv（比内能加压力位能项）。"},{"id":"basics_jc_0059","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下选项中是影响对流传热系数的因素是（ ）。","options":["换热面的几何形状","流体有无相变","流体的比容","以上都是"],"answer":["D"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"影响对流传热系数的因素包括换热面几何形状、流体有无相变、流体物性（比容/密度等），故\"以上都是\"。"},{"id":"basics_jc_0060","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下面描述不正确的是( )","options":["控制材料是指中子吸收截面小的元素、合金或陶瓷等材料，它是反应堆实现可控和自持核裂变反应不可缺少的材料。人们利用它来对反应堆的反应性进行控制。","慢化材料是指其在与高能中子发生弹性碰撞中能有效地吸收中子能量，将核裂变时放出的快中子能量降到对裂变元素反应截面大的热中子水平的材料；","冷却剂是在反应堆一回路循环的载热流体。它的功能除了将核裂变能带出反应堆外，还有冷却堆内所有部件、携带流体可燃毒物(如硼酸)、携带除氧剂和调节pH的添加剂、事故工况下能迅速带走燃料发出的热量，避免堆芯烧毁等功能。"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"控制材料（硼、镉、银铟镉等）是中子吸收截面大的材料，用于补偿和控制反应性；慢化剂用于慢化中子；冷却剂带出堆芯热量。"},{"id":"basics_jc_0061","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电站的寿命取决于（ ）","options":["核燃料","结构材料","功能材料"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"核电站寿命主要取决于结构材料的老化（如压力容器辐照脆化、混凝土老化等），燃料可更换。"},{"id":"basics_jc_0062","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"拉伸实验时，试样拉断前所能承受的最大应力称为材料的 ( )。","options":["屈服强度","抗拉强度","弹性极限"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"拉伸试验中试样拉断前承受的最大应力是抗拉强度（强度极限σb）。"},{"id":"basics_jc_0063","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"中国核电，反应堆设计和建造采用的核电标准是（ ）等。","options":["ASME、RCC-M、CSA、ГОСТ","ASME、RCC-M、ГОСТ、JIS","ASME、RCC-M、JIS、CSA"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"中国核电反应堆设计和建造采用ASME、RCC-M等核电标准。"},{"id":"basics_jc_0064","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"PWR反应堆中，引起燃料裂变的中子主要是（ ）","options":["热中子","快中子","超热中子","缓发中子"],"answer":["A"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆中引发燃料裂变的中子主要是热中子（经慢化剂慢化至热能区）。"},{"id":"basics_jc_0065","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"中子与原子核的相互作用常用截面来度量，它实际上是中子与原子核发生某类核反应的（ ）","options":["面积","长度","体积","几率"],"answer":["D"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"微观截面表征中子与原子核发生某类核反应的几率（几何意义为等效面积，物理本质是几率度量）。"},{"id":"basics_jc_0066","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"U-235吸收热中子会产生（ ）","options":["只会发生裂变反应","只会发生辐射俘获反应","会发生裂变反应或辐射俘获反应","不确定"],"answer":["C"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"U-235吸收热中子后可能发生裂变反应，也可能发生辐射俘获反应（生成U-236），两者都存在。"},{"id":"basics_jc_0067","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下图为中子循环的基本过程，其中按顺序填写括号中的内容为（ ）。","options":["热中子、热中子、快中子、快中子","热中子、快中子、热中子、快中子","快中子、热中子、快中子、热中子","快中子、快中子、热中子、热中子"],"answer":["D"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"中子循环：裂变放出快中子→慢化剂慢化成热中子→热中子被燃料吸收再引发裂变；按图序为快中子、快中子、热中子（以题库标注为准）。"},{"id":"basics_jc_0068","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"反应堆功率正比于反应堆的（ ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量","快中子平均通量密度"],"answer":["B"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"反应堆功率正比于热中子平均通量密度。"},{"id":"basics_jc_0069","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核反应堆的反应性ρ=0，则表示该反应堆（ ）","options":["临界","超临界","次临界","无法判断"],"answer":["A"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"反应性ρ=0（即keff=1）时反应堆恰好临界，中子产生与消失平衡，功率维持不变。"},{"id":"basics_jc_0070","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"压水堆的自稳定性能是由（ ）实现的。","options":["调节控制棒","负温度系数反馈","A+B","正温度系数反馈"],"answer":["B"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆的自稳定性由燃料多普勒系数和慢化剂温度系数等负温度系数反馈实现：功率升高→温度升高→负反应性反馈→功率回落。"},{"id":"basics_jc_0071","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"一个质量为1kg的Sr-90的半衰期为25小时，另外一个质量为mCo的Co-60的半衰期为6小时，两个碎片的放射性活度一样，则另外一片Co-60的质量为（ ）。","options":["mCo =0.16kg","mCo =0.238kg","mCo =0.25kg","mCo =1kg"],"answer":["A"],"score":1.73,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"活度 A=λN∝(m/M)/T½。活度相等：m_Sr/(M_Sr·T_Sr)=m_Co/(M_Co·T_Co)，代入 Sr-90（M≈90，T½=25h）、Co-60（M≈59，T½=6h，注意Co半衰期此处按题设6h计算）得 mCo≈0.16kg。"},{"id":"basics_jc_0072","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"游离过程大于去游离过程，电弧将持续燃烧；游离过程小于去游离过程，电弧将最终熄灭。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。游离（电离）过程强于去游离（复合）过程时电弧持续燃烧；去游离占优则电弧最终熄灭。"},{"id":"basics_jc_0073","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"发电机逆功率保护的目标是发电机定子。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。逆功率保护的目标是保护汽轮机（防止主汽门关闭后发电机变为电动机运行、汽轮机叶片鼓风过热），不是发电机定子。"},{"id":"basics_jc_0074","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电压互感器为二次设备。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。互感器一次侧接于一次高压回路，是连接一次与二次回路的元件，其本体不属于二次设备。"},{"id":"basics_jc_0075","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电流互感器二次侧禁止短路，电压互感器二次侧禁止开路。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。正好说反：电流互感器二次侧禁止开路（会产生高压），电压互感器二次侧禁止短路（会产生大电流）。"},{"id":"basics_jc_0076","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反时限过电流保护的特点是当通过保护装置的电流越大，保护动作时间越长。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。反时限过电流保护的特点是电流越大、动作时间越短。"},{"id":"basics_jc_0077","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电力系统主要是由电源、输配电和用户等环节组成的电能生产与消费的系统。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。电力系统由电源（发电）、输配电网络和用户（用电）等环节组成电能生产与消费系统。"},{"id":"basics_jc_0078","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"变压器能改变电压大小和频率。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。变压器只能改变电压（和电流）的大小，不能改变频率，频率由原动机转速决定。"},{"id":"basics_jc_0079","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电力系统故障时，仅距故障点最近的保护装置动作，将故障元件从电力系统中切除，体现的是继电保护的灵敏性。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。仅由距故障点最近的保护动作切除故障，体现的是继电保护的选择性，不是灵敏性。"},{"id":"basics_jc_0080","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"用余热排出系统维持反应堆冷却剂系统温度时，冷却剂温度不能超过160℃。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。余热排出系统运行时一回路温度上限通常为180℃（投入下限约160℃），并非不能超过160℃。"},{"id":"basics_jc_0081","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"压水堆核电厂运行有汽轮机快速降负荷功能。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。压水堆核电厂具有汽轮机快速降负荷（甩负荷）功能，配合蒸汽排放系统实现。"},{"id":"basics_jc_0082","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"沸水堆二回路介质没有放射性。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。沸水堆的蒸汽直接在堆芯产生并进入汽轮机，汽轮机侧介质带有放射性。"},{"id":"basics_jc_0083","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"α粒子没有静止质量，不带电荷，穿透力很强。应选择具有较大原子量的物质来屏蔽，比如铅板。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。该描述的是γ射线（无静止质量、不带电、穿透强、用铅等重物质屏蔽）；α粒子有质量、带正电、穿透力弱，一张纸即可屏蔽。"},{"id":"basics_jc_0084","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"国家核安全局对全国核设施安全实施统一监督，独立行使核安全监督权。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。国家核安全局（NNSA）对全国核设施安全实施统一监督，独立行使核安全监督权。"},{"id":"basics_jc_0085","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反应堆停闭后，堆芯不再有热量，可以立即停止冷却。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。停堆后堆芯仍有衰变热（余热），必须持续冷却，否则会烧毁燃料。"},{"id":"basics_jc_0086","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"高温气冷堆核电站发电效率比压水堆核电站高。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。高温气冷堆氦气出口温度高（可达700~950℃），发电效率高于压水堆。"},{"id":"basics_jc_0087","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"稀有事件所产生的放射性污染会导致停止或者限制使用隔离半径以外的公用地区，失去冷却剂系统或安全壳屏蔽的功能。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。稀有事件的放射性后果较小，不至于导致隔离半径外公用地区停止使用；题中描述的是更严重事故（极限事故）的后果。"},{"id":"basics_jc_0088","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂准备启动时，必须至少有一台反应堆冷却剂泵或余热排出系统处于运行状态，才能开始稀释反应堆冷却剂的硼浓度。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。稀释硼浓度前必须至少有一台主泵或余热排出系统运行，保证硼充分混合、避免局部低硼。"},{"id":"basics_jc_0089","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"我国总的核安全目标为：在核动力厂中建立并保持对放射性危害的有效防御，以保护人员、社会和环境免受危害。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。这是我国总的核安全目标：建立并保持对放射性危害的有效防御，保护人员、社会和环境。"},{"id":"basics_jc_0090","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"重水堆的慢化剂是重水。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。重水堆（如CANDU）以重水作慢化剂（重水吸收中子少，可用天然铀）。"},{"id":"basics_jc_0091","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"我国的核安全法规体系中，第一层次是国务院行政法规。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。我国核安全法规体系第一层次是国家法律（如《核安全法》），第二层次才是国务院行政法规。"},{"id":"basics_jc_0092","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"技术规格书是机组正常运行时所必须遵守的技术条件，任何对技术规格书的偏离，甚至是暂时的偏离都必须得到国家核安全局(NNSA)的批准。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。技术规格书是运行必须遵守的技术条件，任何偏离（包括暂时偏离）都必须得到国家核安全局批准。"},{"id":"basics_jc_0093","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂绝大多数使用过饱和蒸汽","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。压水堆核电厂绝大多数使用饱和蒸汽（蒸汽发生器产生的是饱和蒸汽，只带少量湿度）。"},{"id":"basics_jc_0094","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"快堆最大的特点是核燃料增殖。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。快堆最大的特点是核燃料增殖：快中子使U-238转变为Pu-239，可实现燃料增殖。"},{"id":"basics_jc_0095","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"技术规格书中监测要求部分与运行限制条件部分条数相同，即一条运行限制条件规范紧跟一条监测要求的形式。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。技术规格书中每条运行限制条件（LCO）都紧跟相应的监测要求（SR）。"},{"id":"basics_jc_0096","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"安全系统整定值是各种自动保护装置的触发点，它触发保护动作，以防止超过安全限值，并应付超设计基准事故。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。安全系统整定值用于防止超过安全限值，应对的是设计基准事故范围，并非超设计基准事故。"},{"id":"basics_jc_0097","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"轻核聚变的特点是不产生放射性。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。轻核聚变反应产物主要是氦核，反应本身不产生裂变产物那样的放射性（活化产物可控制）。"},{"id":"basics_jc_0098","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂棒控系统设计中，能够满足负荷变化率 ≤ ± 5%/min的负荷线性变化。","options":null,"answer":["正确"],"score":1.24,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。棒控系统设计能满足负荷线性变化率≤±5%/min的要求。"},{"id":"basics_jc_0099","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"当在各种运行模式或所指定的其他工况下，对技术规格书中运行限制条件的规定都要求遵从，如果不能满足其中的规定，则必须满足其相应的动作的要求。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。不满足运行限制条件时必须执行相应的动作（Action）要求，这是技术规格书的基本逻辑。"},{"id":"basics_jc_0100","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"汽轮发电机组通过汽轮机调节系统实现机组转速和负荷调节。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。汽轮发电机组通过汽轮机调节系统（DEH）实现转速和负荷调节。"},{"id":"basics_jc_0101","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂仪表与控制系统的功能可以归纳为三种：即监视功能、控制功能和保护功能。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。仪控系统三大功能：监视（测量显示）功能、控制功能、保护功能。"},{"id":"basics_jc_0102","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"流体流经节流装置时遵循伯努力方程。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。流体流经节流装置遵循伯努利方程（能量守恒），部分动能转为压力能形成差压。"},{"id":"basics_jc_0103","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"远程停堆站属于主控制室设备。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。远程（备用）停堆站是主控制室不可用时使用的独立设施，不属于主控制室设备。"},{"id":"basics_jc_0104","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"所谓控制就是为了达到一定的目的，对生产过程的设备进行控制操作，使其满足生产过程要求。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。控制就是为达到一定目的对生产过程设备进行操作，使其满足生产要求。"},{"id":"basics_jc_0105","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"控制对象：被控制的设备或生产过程为控制对象或被控制过程。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。被控制的设备或生产过程称为控制对象（被控对象/被控过程）。"},{"id":"basics_jc_0106","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"按安全等级划分，DCS系统设备可以分为安全级设备和非安全级设备。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。按安全等级DCS设备分为安全级（1E级）设备和非安全级设备。"},{"id":"basics_jc_0107","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"蒸汽排放控制系统只有一种模式，即蒸汽压力控制模式。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。蒸汽排放控制系统（GCT）有蒸汽压力控制模式、温度控制模式等多种模式，不止一种。"},{"id":"basics_jc_0108","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"压力容器的设计必须满足强度、刚度、稳定度、耐久性、密封性等要求。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。压力容器设计必须满足强度、刚度、稳定性、耐久性和密封性等要求。"},{"id":"basics_jc_0109","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"离心泵一般用电动机带动,在启动前无需向壳内灌满被输送的液体。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。离心泵启动前必须向泵壳内灌满被输送液体（灌泵），否则抽不上液且会损坏密封。"},{"id":"basics_jc_0110","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"离心通风机的启动顺序: 1)关好风机进出口调节阀；2)启动通风机；3)启动润滑油泵；4)启动冷却水泵，打开冷却水阀；5)打开入口调节阀使通风流量达到运行要求的参数。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。正确顺序是先启动润滑油泵、冷却水泵，最后启动风机；题中顺序颠倒。"},{"id":"basics_jc_0111","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"标准型号的阀门，其设计、制造、试验、验收等有相应的标准、规范作出详细的规定。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。标准型号阀门的设计、制造、试验、验收都有相应标准规范详细规定。"},{"id":"basics_jc_0112","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"止回阀属于驱动型阀门。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。止回阀靠介质自身流动自动动作，属于自动型阀门。"},{"id":"basics_jc_0113","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"一般轴流式通风机叶轮安装在圆筒形机壳中,且叶轮所在轴与电动机轴通过联轴器连接。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。轴流通风机叶轮一般与电动机轴直接连接（直联）或经传动装置连接，并非都通过联轴器连接。"},{"id":"basics_jc_0114","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"汽轮机冲转前后停机后，要使转子连续转动一段时间，以保证转子均匀受热和冷却。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。汽轮机冲转前后和停机后通过盘车使转子连续转动，保证转子均匀受热和冷却、防止弯曲。"},{"id":"basics_jc_0115","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反应堆压力容器是核电厂最重要的压力容器之一。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。反应堆压力容器是核电厂最重要的大型压力容器，包容堆芯燃料。"},{"id":"basics_jc_0116","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"AP1000型压水堆和CANDU重水堆在一回路冷却剂启动期间采用添加氢气的方式来实现化学除氧。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。AP1000和CANDU在一回路启动期间均采用添加氢气的方式实现化学除氧（抑制氧腐蚀）。"},{"id":"basics_jc_0117","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺、混合胺不同发展阶段。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。二回路pH控制剂经历了磷酸盐处理、氨水、有机胺（吗啉等）、混合胺等发展阶段。"},{"id":"basics_jc_0118","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"压水堆和重水堆一回路系统设备的主要材料均为锆合金、镍基合金和不锈钢等，为了控制腐蚀，都需要将系统介质的pH值控制在合适的碱性范围内。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。压水堆和重水堆一回路主要材料均为锆合金、镍基合金、不锈钢等，都需将pH控制在合适碱性范围以控制腐蚀。"},{"id":"basics_jc_0119","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"VVER机组中，氨对降低一回路结构材料和燃料包壳表面的沉积物有利，氨可以络合四氧化三铁形成可溶的铁氨络合物，经净化系统将铁去除。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。VVER机组中氨可络合四氧化三铁形成可溶性铁氨络合物，经净化系统除铁，减少沉积。"},{"id":"basics_jc_0120","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"辐射效应发生概率与受照剂量呈正比，剂量越大，危险性越高。无阈值为确定性效应，有阈值为随机性效应。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。说反了：无阈值的是随机性效应（概率随剂量增加），有阈值的是确定性效应。"},{"id":"basics_jc_0121","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"17N、 19O、 18F 和 14C 均属于压水堆堆芯的裂变产物。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。N-17、O-19、F-18、C-14是中子活化产物（活化腐蚀产物/活化核素），不是裂变产物。"},{"id":"basics_jc_0122","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"放射性废液排放前，首先应对排出物混匀，然后采取样品进行测量，测量达标后即可连续排放，不需要额外监测手段。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。废液排放除混匀取样测量达标外，还必须有排放连续监测等额外监测手段，确保受控排放。"},{"id":"basics_jc_0123","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"不稳定的原子核自发地放射出 α、β、γ 等各种射线的现象称为放射性，按原子核是否稳定，可把核素分为稳定性核素和放射性核素两类。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。不稳定的原子核自发放出α、β、γ射线的现象称为放射性；核素分为稳定性核素和放射性核素。"},{"id":"basics_jc_0124","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"单相流体的流动压降组成有：摩擦压降、提升压降和加速度压降。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。单相流体流动压降由摩擦压降、提升（重位）压降和加速压降组成。"},{"id":"basics_jc_0125","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"卡诺循环是一切热机循环效率最高的热力循环。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。卡诺循环是由两个等温过程和两个绝热过程组成的理想循环，是一切热机中效率最高的热力循环。"},{"id":"basics_jc_0126","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"固体导热遵循傅里叶定律。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。固体导热遵循傅里叶定律（导热速率与温度梯度和导热系数成正比）。"},{"id":"basics_jc_0127","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"自然循环是指在闭合回路内依靠热段（上行段）和冷段（下行段）的流体密度差所产生的驱动压头来实现的流动循环。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。自然循环依靠回路中热段与冷段流体密度差形成的驱动压头实现循环，无需泵驱动。"},{"id":"basics_jc_0128","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"对流传热由热传导和热对流组成。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。对流传热是热传导与热对流两种机理共同作用的结果。"},{"id":"basics_jc_0129","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"工质的热力学参数包括温度、压力、比体积、比内能、比焓、比熵。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。工质的热力学状态参数（比参数）包括温度、压力、比体积、比内能、比焓、比熵。"},{"id":"basics_jc_0130","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"对流传热遵循牛顿冷却定律。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。对流传热遵循牛顿冷却定律 q=h·Δt。"},{"id":"basics_jc_0131","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"再热循环一定能够提高热力循环效率。","options":null,"answer":["错误"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。再热循环不一定提高热效率，再热的主要目的是降低汽轮机末级排汽湿度；只有再热温度选择合适时才可能提高效率。"},{"id":"basics_jc_0132","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"DNBR是指实际热流密度与临界热流密度之比。","options":null,"answer":["错误"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。DNBR是临界热流密度与实际（局部）热流密度之比（大于1为安全裕量指标），题中说反。"},{"id":"basics_jc_0133","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"一般来说，硬度高的材料其强度也较高。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。一般硬度高的材料强度也较高（如淬火钢），但塑韧性往往下降。"},{"id":"basics_jc_0134","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"低碳钢的强度、硬度较低，但塑性、韧性及焊接性能较好。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。低碳钢强度硬度较低，但塑性、韧性和焊接性能好。"},{"id":"basics_jc_0135","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂可以参考国家的法规标准要求，对核岛以及常规岛相关承压部件进行定期无损检测，发现使用中出现的缺陷。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。核电厂核岛承压部件的定期无损检测必须按国家核安全局批准的规范和程序执行，不能仅\"参考\"一般法规标准自行安排。"},{"id":"basics_jc_0136","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"金属是指单一元素构成的具有特殊的光泽延展性导电性导热性的物质。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。金属是具有特殊光泽、良好延展性、导电性和导热性的物质（含合金）。"},{"id":"basics_jc_0137","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"如果中子和靶核发生某类反应的微观截面为σ，靶核的核子密度为N，那么中子和靶核发生该反应的宏观截面为 Nσ 。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。宏观截面Σ=Nσ（核子密度乘以微观截面），单位是1/m。"},{"id":"basics_jc_0138","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"中子核反应微观截面的大小和中子能量无关。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。微观截面大小与中子能量密切相关（截面随中子能量变化很大，如1/v规律）。"},{"id":"basics_jc_0139","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"放射性核素的衰变速率和物理化学环境无关。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。放射性衰变是原子核固有特性，衰变速率只取决于核素种类，与温度、压力、化学状态等物理化学环境无关。"},{"id":"basics_jc_0140","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"快中子不能引起U-238的裂变。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。快中子（能量超过约1MeV阈值）可以引起U-238裂变（快裂变）。"},{"id":"basics_jc_0141","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"功率亏损指的是功率因为一些因素而减小了。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。功率亏损指反应堆功率升高时由于多普勒效应和慢化剂温度效应引入的负反应性损失（从满功率到零功率所需补偿的反应性），不是功率减小。"},{"id":"basics_jc_0142","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反应堆的有效增值因数keff=中子的产生率/中子的吸收率。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。keff=中子产生率/中子消失率（消失=吸收+泄漏），题中漏掉了泄漏项。"},{"id":"basics_jc_0143","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"PWR常用的单位是MW/tU。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。功率的常用单位是W（MWt/MWe）；MW/tU实际是比功率单位，题干以题库标注为错误，注意区分功率与比功率的单位。"},{"id":"basics_jc_0144","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"热中子是指温度非常高的中子。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。热中子指与周围介质达到热平衡的中子（室温下能量约0.025eV），不是温度高的中子。"},{"id":"basics_th_0001","module":"basics","bank":"热工水力学","type":"judge","stem":"对流传热遵循牛顿冷却定律。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。对流传热遵循牛顿冷却定律 q=h·Δt（热流量与传热系数和温差成正比）。"},{"id":"basics_th_0002","module":"basics","bank":"热工水力学","type":"judge","stem":"固体导热遵循傅里叶定律。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。固体导热遵循傅里叶定律，导热量与温度梯度、导热系数成正比。"},{"id":"basics_th_0006","module":"basics","bank":"热工水力学","type":"single","stem":"反应堆功率正比于反应堆的（     ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"反应堆功率正比于堆芯热中子平均通量密度（功率对应全堆平均裂变率）。"},{"id":"basics_th_0007","module":"basics","bank":"热工水力学","type":"single","stem":"防止水锤的措施包括（     ）。","options":["截止阀慢开慢关，尽可能降低压力的冲击","对不宜慢开、慢关的阀门，可采用小流量旁通阀先开（或后关）旁通阀，再开（或先关）主管道上截止阀","对管道进行疏水","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"防止水锤的措施：截止阀慢开慢关、不宜慢动的阀门设旁路、管道充分疏水等都有效，故选以上都是。"},{"id":"basics_th_0008","module":"basics","bank":"热工水力学","type":"single","stem":"以下选项中是影响对流传热系数的因素是（     ）。","options":["换热面的几何形状","流体有无相变","流体的比容","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"换热面几何形状、流体有无相变、流体物性（含比容）都影响对流传热系数，故选以上都是。"},{"id":"basics_th_0009","module":"basics","bank":"热工水力学","type":"single","stem":"比焓h的定义式：（     ）。","options":["u+pv","s+pv","u+s","u+Ts"],"answer":["A"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"比焓定义式为 h=u+pv（比内能加压力比功项）。"},{"id":"basics_th_0010","module":"basics","bank":"热工水力学","type":"single","stem":"在水与水蒸汽的温熵图（T-s图）中饱和水线和干饱和蒸汽线下方的区域对应的状态是：（     ）。","options":["饱和水","湿饱和蒸汽","过热蒸汽","超临界水或超临界蒸汽"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"T-s图中饱和水线与干饱和蒸汽线之间的区域为湿饱和蒸汽区（汽液两相共存）。"},{"id":"basics_th_0011","module":"basics","bank":"热工水力学","type":"single","stem":"已知流体与壁面的对流传热系数为15W/（m2·℃），传热面积为10m2，流体的温度为10℃，壁面的温度为200℃，则单位时间内流体与壁面传递的热量为多少？","options":["29500J","28500J","27500J","26500J"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"牛顿冷却公式 Q=hAΔt=15×10×(200−10)=28500W，即每秒28500J。"},{"id":"basics_th_0012","module":"basics","bank":"热工水力学","type":"single","stem":"已知壁面的导热系数为15W/（m·℃），壁面厚度为1m，面积为1 m2，壁面的两侧的温度分别为10℃，和100℃，则单位时间内流体与壁面传递的热量为多少？","options":["1350J","1450J","1550J","1650J"],"answer":["A"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"傅里叶公式 Q=λAΔt/δ=15×1×(100−10)/1=1350W。"},{"id":"basics_th_0013","module":"basics","bank":"热工水力学","type":"multi","stem":"一定能够提高循环热效率的途径有：(      ).","options":["采取再热循环","采取回热循环","提高主蒸汽初温","提高主蒸汽初压"],"answer":["B","C","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"回热循环、提高主蒸汽初温、提高初压都能提高循环热效率；单独采用再热循环不一定提高效率（再热主要防止末级蒸汽湿度过高），故选BCD。"},{"id":"basics_th_0014","module":"basics","bank":"热工水力学","type":"multi","stem":"从燃料到冷却剂的传热过程包括：(     )。","options":["冷却剂的输热","燃料元件的导热","气隙传热","包壳导热"],"answer":["B","C","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"燃料到冷却剂的传热依次为：燃料芯块导热、气隙传热、包壳导热，之后是冷却剂的输热（对流换热带走），故选BCD（冷却剂输热属于对流输出环节，不计入\"到冷却剂\"的固体传热链）。"},{"id":"basics_th_0015","module":"basics","bank":"热工水力学","type":"multi","stem":"反应堆裂变能的释放形式有（      ）。","options":["X射线的能量","γ射线的能量","β射线的能量","α射线的能量"],"answer":["B","C"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"裂变能释放形式主要是裂变碎片的动能、裂变中子动能和γ射线（瞬发γ+衰变γ）能量以及β射线能量；α射线和X射线不是裂变能的主要形式，故选BC。"},{"id":"basics_th_0016","module":"basics","bank":"热工水力学","type":"multi","stem":"在均匀裸堆内径向热流密度分布与轴向热流密度分布分别为（      ）。","options":["截尾的零阶贝塞尔函数分布","截尾的一阶贝塞尔函数分布","截尾的正弦函数分布","截尾的余弦函数分布"],"answer":["A","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"均匀裸堆内径向热流密度服从截尾的零阶贝塞尔函数分布，轴向服从截尾的余弦函数分布，故选AD。"},{"id":"basics_th_0017","module":"basics","bank":"热工水力学","type":"multi","stem":"影响临界热流密度的因素有（     ）","options":["质量流速","工作压力","通道进口处水的欠热度","流体的传热系数"],"answer":["A","B","C"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"影响临界热流密度（CHF）的因素包括质量流速、工作压力、进口欠热度等；流体传热系数不是CHF的影响因素，故选ABC。"},{"id":"basics_th_0018","module":"basics","bank":"热工水力学","type":"judge","stem":"卡诺循环是一切热机循环效率最高的热力循环。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。卡诺循环由两个等温过程和两个绝热过程组成，是同温限下效率最高的理想热力循环。"},{"id":"basics_th_0019","module":"basics","bank":"热工水力学","type":"judge","stem":"饱和温度随饱和压力增大而增大。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。饱和温度随饱和压力升高而升高（水汽化性质，如100℃对应0.1MPa）。"},{"id":"basics_th_0020","module":"basics","bank":"热工水力学","type":"judge","stem":"对流传热由热传导和热对流组成。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。对流传热是热传导与热对流两种机理的综合作用。"},{"id":"basics_th_0021","module":"basics","bank":"热工水力学","type":"judge","stem":"DNBR是指实际热流密度与临界热流密度之比。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"错误。DNBR是临界热流密度与实际热流密度之比（大于1表示有裕量），题中说反了。"},{"id":"basics_th_0022","module":"basics","bank":"热工水力学","type":"judge","stem":"工质的热力学参数包括温度、压力、比体积、比内能、比焓、比熵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。工质的热力学（状态）参数包括温度、压力、比体积、比内能、比焓、比熵。"},{"id":"basics_th_0023","module":"basics","bank":"热工水力学","type":"judge","stem":"再热循环一定能够提高热力循环效率。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"错误。再热循环不一定提高热效率，只有再热温度等参数选择合适才可能提高；其主要目的是降低末级排汽湿度。"},{"id":"basics_th_0024","module":"basics","bank":"热工水力学","type":"judge","stem":"自然循环是指在闭合回路内依靠热段（上行段）和冷段（下行段）的流体密度差所产生的驱动压头来实现的流动循环。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。自然循环依靠闭合回路中热段与冷段流体密度差形成的驱动压头实现，无需泵驱动。"},{"id":"basics_th_0025","module":"basics","bank":"热工水力学","type":"judge","stem":"单相流体的流动压降组成有：摩擦压降、提升压降和加速度压降。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。单相流压降由摩擦压降、提升（重位）压降和加速压降三部分组成。"},{"id":"basics_rp_0001","module":"basics","bank":"反应堆物理","type":"judge","stem":"快中子不能引起U-238的裂变。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，能量超过约1MeV阈值的快中子可以引起U-238裂变（快裂变），并非不能。"},{"id":"basics_rp_0002","module":"basics","bank":"反应堆物理","type":"single","stem":"PWR反应堆中，引起燃料裂变的中子主要是（    ）","options":["热中子","快中子","超热中子","缓发中子"],"answer":["A"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"压水堆中快中子经慢化剂慢化为热中子，热中子引发U-235裂变的截面大，链式裂变主要由热中子维持。"},{"id":"basics_rp_0003","module":"basics","bank":"反应堆物理","type":"single","stem":"U-235吸收热中子会产生（    ）","options":["只会发生裂变反应","只会发生辐射俘获反应","会发生裂变反应或辐射俘获反应","不确定"],"answer":["C"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"U-235吸收热中子后既可能发生裂变（生成碎片并放出中子），也可能发生辐射俘获生成U-236，两种反应都存在。"},{"id":"basics_rp_0004","module":"basics","bank":"反应堆物理","type":"single","stem":"核反应堆的反应性ρ=0，则表示该反应堆（    ）","options":["临界","超临界","次临界","无法判断"],"answer":["A"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"反应性ρ=0对应有效增殖因数keff=1，中子产生与消失平衡，反应堆恰好处于临界状态。"},{"id":"basics_rp_0005","module":"basics","bank":"反应堆物理","type":"single","stem":"中子与原子核的相互作用常用截面来度量，它实际上是中子与原子核发生某类核反应的（    ）","options":["面积","长度","体积","几率"],"answer":["D"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"微观截面几何上是等效面积，物理本质是中子与原子核发生某类核反应的几率度量。"},{"id":"basics_rp_0006","module":"basics","bank":"反应堆物理","type":"single","stem":"压水堆的自稳定性能是由（    ）实现的。","options":["调节控制棒","负温度系数反馈","A+B","正温度系数反馈"],"answer":["B"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"压水堆具有负温度系数：功率升高→燃料和慢化剂温度升高→引入负反应性→功率回落，负温度系数反馈实现自稳定。"},{"id":"basics_rp_0007","module":"basics","bank":"反应堆物理","type":"single","stem":"反应堆功率正比于反应堆的（     ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量","快中子平均通量密度"],"answer":["B"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"反应堆功率是全堆裂变率的总和，正比于堆芯热中子平均通量密度。"},{"id":"basics_rp_0008","module":"basics","bank":"反应堆物理","type":"single","stem":"一个质量为1kg的Sr-90的半衰期为25小时，另外一个质量为mCo的Co-60的半衰期为6小时，两个碎片的放射性活度一样，则另外一片Co-60的质量为（    ）。","options":["mCo =0.16kg","mCo =0.238kg","mCo =0.25kg","mCo =1kg"],"answer":["A"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"活度A∝(m/M)/T½。活度相等：mCo=1×(59/90)×(6/25)≈0.16kg（半衰期按题设25h与6h计算）。"},{"id":"basics_rp_0009","module":"basics","bank":"反应堆物理","type":"judge","stem":"同位素具有相同的核特性和化学特性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，同位素质子数相同、化学性质基本相同，但中子数不同，核特性（半衰期、反应截面等）差异很大。"},{"id":"basics_rp_0010","module":"basics","bank":"反应堆物理","type":"judge","stem":"放射性核素的衰变速率和物理化学环境无关。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"正确，放射性衰变是原子核的固有特性，衰变速率只取决于核素种类，与温度、压力、化学状态等环境无关。"},{"id":"basics_rp_0011","module":"basics","bank":"反应堆物理","type":"judge","stem":"热中子是指温度非常高的中子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，热中子指与周围介质达到热平衡的中子（室温下能量约0.025eV），不是温度很高的中子。"},{"id":"basics_rp_0012","module":"basics","bank":"反应堆物理","type":"judge","stem":"中子核反应微观截面的大小和中子能量无关。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，微观截面与中子能量密切相关，截面随能量变化很大（如1/v规律和共振峰）。"},{"id":"basics_rp_0013","module":"basics","bank":"反应堆物理","type":"judge","stem":"中子只能引起U-235的裂变反应，而不能引起其他反应。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，中子与U-235除裂变外还可发生辐射俘获、散射等反应；中子也能引起其他核素（如Pu-239）裂变。"},{"id":"basics_rp_0014","module":"basics","bank":"反应堆物理","type":"judge","stem":"裂变过程中释放的总能量同反应堆可回收能量不同。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"正确，裂变释放的总能量中有部分以中微子形式逸出、不可回收，堆内可回收能量小于总释放能量。"},{"id":"basics_rp_0015","module":"basics","bank":"反应堆物理","type":"judge","stem":"可燃毒物棒毒物的含量会随着堆芯寿期的增加逐渐减小。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"正确，可燃毒物通过吸收中子补偿剩余反应性，随燃耗加深逐渐消耗，含量随堆芯寿期递减。"},{"id":"basics_rp_0016","module":"basics","bank":"反应堆物理","type":"judge","stem":"功率亏损指的是功率因为一些因素而减小了。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，功率亏损指功率升高时由多普勒效应和慢化剂温度效应引入的负反应性损失，不是功率本身减小。"},{"id":"basics_rp_0017","module":"basics","bank":"反应堆物理","type":"judge","stem":"如果中子和靶核发生某类反应的微观截面为σ，靶核的核子密度为N，那么中子和靶核发生该反应的宏观截面为 Nσ 。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"正确，宏观截面Σ=Nσ（核子密度乘微观截面），其倒数约为中子平均自由程。"},{"id":"basics_rp_0018","module":"basics","bank":"反应堆物理","type":"judge","stem":"PWR常用的单位是MW/tU。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，MW/tU是比功率（燃耗）单位；反应堆功率的常用单位是MW（MWt/MWe）。"},{"id":"basics_rp_0022","module":"basics","bank":"反应堆物理","type":"single","stem":"<ckeditor5><p>下图为中子循环的基本过程，其中按顺序填写括号中的内容为（ ）。<\/p><figure class='image'><img src='http://erpe-learning.cnnp.com.cn/sf-server/file/getFile/25bee204dbd72387b5ce746fc6ac9d5f-N_1523333333333/64eff5bce4b06e4b73b444ca_0100'><\/figure><\/ckeditor5>","options":["热中子、热中子、快中子、快中子","热中子、快中子、热中子、快中子","快中子、热中子、快中子、热中子","快中子、快中子、热中子、热中子"],"answer":["D"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"中子循环：裂变放出快中子→慢化剂慢化成热中子→热中子被燃料吸收再引发裂变，按图序依次为快中子、快中子、热中子、热中子。"},{"id":"basics_rp_0023","module":"basics","bank":"反应堆物理","type":"judge","stem":"<ckeditor5><p>反应堆的有效增值因数k<sub>eff<\/sub>=中子的产生率/中子的吸收率。<\/p><\/ckeditor5>","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"错误，keff=中子产生率/中子消失率，消失=吸收+泄漏，题中漏掉了泄漏项。"},{"id":"basics_rad_0001","module":"basics","bank":"辐射防护基础","type":"single","stem":"为了用同一尺度表示不同类型辐射照射对人体造成的生物效应，辐射防护采用（   ）这个辐射量。","options":["吸收剂量","待积剂量","剂量当量"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"剂量当量等于吸收剂量与辐射权重因子之积，修正了不同辐射类型生物效应的差异，能用同一尺度比较各种照射的危害；吸收剂量不区分辐射类型。"},{"id":"basics_rad_0002","module":"basics","bank":"辐射防护基础","type":"single","stem":"无论哪种照射，都应遵守辐射防护三原则，包括：（    ）原则、防护最优化原则、个人剂量限值的应用原则。","options":["正当性","ALARA","确定性"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"辐射防护三原则是正当性原则、防护最优化原则和个人剂量限值的应用原则。ALARA是最优化原则的内涵，正当性是本空应填的原则。"},{"id":"basics_rad_0003","module":"basics","bank":"辐射防护基础","type":"single","stem":"下列关于内照射防护措施，说法正确的是（     ）。","options":["包容、隔离、净化、稀释","缩短受照时间","增大与辐射源的距离"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"内照射防护重在控制放射性物质进入人体，基本措施是包容、隔离、净化、稀释；缩短受照时间、增大与源的距离属于外照射防护方法。"},{"id":"basics_rad_0004","module":"basics","bank":"辐射防护基础","type":"single","stem":"常用的中子屏蔽材料不包括（     ）。","options":["水","石蜡","铅"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"中子屏蔽主要依靠水、石蜡、聚乙烯等含氢材料慢化吸收。铅对中子的慢化能力弱，主要用于γ射线屏蔽，不是常用中子屏蔽材料。"},{"id":"basics_rad_0005","module":"basics","bank":"辐射防护基础","type":"single","stem":"通常情况下放射性物质进入人体的途径不包括（     ）。","options":["吸入","皮肤渗入","扩散"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"放射性物质进入人体主要通过吸入、食入、皮肤渗入及伤口等途径；扩散是物质在环境中的迁移现象，不属于进入人体的途径。"},{"id":"basics_rad_0006","module":"basics","bank":"辐射防护基础","type":"single","stem":"液态流出物的槽式排放，在排放前由实验室进行取样分析，符合排放限值后方可排放，排放过程中在线监测仪表对（     ）。","options":["废液的剂量率进行连续监测","环境剂量率进行连续监测","废液的放射性核素浓度进行连续监测"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"槽式排放先取样分析达标，排放过程中在线监测仪表对废液的放射性核素浓度进行连续监测，实时控制排放的放射性。"},{"id":"basics_rad_0007","module":"basics","bank":"辐射防护基础","type":"single","stem":"通常不需要专门的防护手段或安全措施，但需要经常对职业照射条件进行监督和评价的区域定为（    ）。","options":["监督区","控制区","非限制区"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"监督区指通常不需要专门防护手段，但需对职业照射条件经常监督和评价的区域；需要专门防护手段或安全措施的区域定为控制区。"},{"id":"basics_rad_0008","module":"basics","bank":"辐射防护基础","type":"single","stem":"外照射是指放射源在人体之外对人体产生的照射，外照射所致的剂量占电站集体剂量的绝大部分。降低外照射的方法有（     ）。","options":["减少在放射源附近工作的时间，增大与放射源之间的距离","避免吸入、摄入放射性物质","搭设空气负压棚降低空气污染水平"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"外照射防护三要素是时间、距离、屏蔽：缩短受照时间、增大与源的距离均可降低剂量；避免吸入摄入和搭设负压棚属于内照射防护措施。"},{"id":"basics_rad_0009","module":"basics","bank":"辐射防护基础","type":"single","stem":"为了解控制区辐射和污染水平，必须对控制区辐射和污染水平进行监测应定期使用便携式仪表对未设固定监测点的区域和固定监测点测量结果难以代表的区域进行测量，监测的内容包括（     ）。","options":["环境剂量率、表面污染和空气污染","体表污染","外照射、内照射"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"用便携式仪表对控制区定期监测的内容包括环境剂量率、表面污染和空气污染，全面掌握外照射与内照射风险。"},{"id":"basics_rad_0010","module":"basics","bank":"辐射防护基础","type":"single","stem":"由于物品的表面污染的存在，会因为人员辐射工作接触而转移到工作人员体表，进而会通过吸入或食入途径进入人体产生内照射。场所污染防护措施一般有（     ）。","options":["建立表面污染隔离区，适时采取去污措施","放射性物质衰变减少辐射源","选择合适的屏蔽材料"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"场所污染防护首先建立表面污染隔离区，防止污染扩散和向人员体表转移，并适时去污；衰变等待和屏蔽主要针对外照射，不是直接的去污措施。"},{"id":"basics_rad_0011","module":"basics","bank":"辐射防护基础","type":"single","stem":"压水堆核电厂蒸发器泄漏监测仪用于监测蒸发器一次侧向二次侧的泄漏，监测对象为（     ）。","options":["N-13","N-16","I-131"],"answer":["B"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"一回路冷却剂中的O-16经中子活化生成N-16，半衰期约7秒；二次侧监测到N-16即表明传热管泄漏，故监测对象选N-16。"},{"id":"basics_rad_0012","module":"basics","bank":"辐射防护基础","type":"single","stem":"1 Ci = （     ）","options":["<ckeditor5><p>3.7×10<sup>9<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>3.7×10<sup>10<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>3.7×1<span style='background-color:rgb(255,255,255);color:rgb(0,0,0);'>0<\/span><sup>12<\/sup>Bq<\/p><\/ckeditor5>"],"answer":["B"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"居里是活度单位，定义1Ci＝3.7×10¹⁰Bq，即每秒发生3.7×10¹⁰次衰变，约相当于1克镭-226的活度。"},{"id":"basics_rad_0013","module":"basics","bank":"辐射防护基础","type":"single","stem":"工作场所表面污染监测的主要目的是防止污染扩散以及检查污染控制是否失效，需要监测表面污染的主要辐射类型是（    ）。","options":["α、β放射性","γ放射性","中子"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"表面污染主要危害来自α、β核素造成的皮肤照射和内照射，故监测对象为α、β放射性；γ穿透力强，通常以剂量率监测反映。"},{"id":"basics_rad_0014","module":"basics","bank":"辐射防护基础","type":"single","stem":"以下用于体内污染监测的设备是（     ）。","options":["C1 门","C2 门","WBC"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"体内污染监测用全身计数器（WBC）直接测量体内γ核素；C1门、C2门测量的是人员体表污染，不是体内污染监测设备。"},{"id":"basics_rad_0015","module":"basics","bank":"辐射防护基础","type":"single","stem":"以下不属于工艺废物的是（    ）。","options":["各种离子交换器的废树脂","蒸发的浓缩液","检修使用过的辐射防护用品"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"工艺废物指工艺系统运行产生的废物，如废树脂、蒸发浓缩液；检修用过的辐射防护用品属于受污染的固体废弃物，不属于工艺废物。"},{"id":"basics_rad_0016","module":"basics","bank":"辐射防护基础","type":"single","stem":"当燃料元件破损时，（     ）有可能进入冷却剂。","options":["活化产物","裂变产物","腐蚀产物"],"answer":["B"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"燃料元件内积存大量裂变产物，元件包壳破损时裂变产物会泄漏进入冷却剂，是一回路放射性升高的重要来源。"},{"id":"basics_rad_0017","module":"basics","bank":"辐射防护基础","type":"judge","stem":"当重核裂变成两个中等核时，伴随很大的能量释放，这正是裂变反应堆的物理基础。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，重核裂变为两个中等质量核时因质量亏损释放巨大能量，链式反应使能量持续释放，这正是裂变反应堆的物理基础。"},{"id":"basics_rad_0018","module":"basics","bank":"辐射防护基础","type":"judge","stem":"X 和γ射线都是电磁波，X 射线是由原子核发射出来的辐射，γ射线是在原子核外部产生的辐射。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，两者均为电磁波但来源不同：γ射线由原子核能级跃迁发射；X射线产生于核外电子跃迁（特征X射线）或高速电子减速的轫致辐射。"},{"id":"basics_rad_0019","module":"basics","bank":"辐射防护基础","type":"judge","stem":"由于电离或激发的产生，内层轨道上一旦出现空位（空穴），外层的轨道电子便会向内层轨道跃迁，跃迁电子能级差的能量就会以电磁辐射的形式发射γ射线。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，核外电子填补内层空位跃迁释放的能量以特征X射线形式发射（或产生俄歇电子）；γ射线源于原子核内能级跃迁。"},{"id":"basics_rad_0020","module":"basics","bank":"辐射防护基础","type":"judge","stem":"不稳定的原子核自发地放射出 α、β、γ 等各种射线的现象称为放射性，按原子核是否稳定，可把核素分为稳定性核素和放射性核素两类。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，不稳定原子核自发发射α、β、γ射线衰变的性质称为放射性；按原子核是否稳定，核素分为稳定性核素和放射性核素两类。"},{"id":"basics_rad_0021","module":"basics","bank":"辐射防护基础","type":"judge","stem":"当电离室内的气体受到稳定照射时，离子对的产生率是恒定的，如果复合可以忽略并能有效地收集所有电荷，则所产生的稳定电流是对在该电离室内气体中离子对产生率的准确量度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，稳定照射下离子对产生率恒定，复合可忽略且电荷全部收集时，电离电流与离子对产生率成正比，可准确量度照射强度。"},{"id":"basics_rad_0022","module":"basics","bank":"辐射防护基础","type":"judge","stem":"闪烁探测器的能量分辨率主要决定于闪烁体和光电倍增管，相对于半导体探测器来说，闪烁探测器的能量分辨率更好。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，闪烁探测器能量分辨率取决于闪烁体和光电倍增管，但能量转换环节多、损失大，其分辨率比半导体探测器差得多。"},{"id":"basics_rad_0023","module":"basics","bank":"辐射防护基础","type":"judge","stem":"辐射效应发生概率与受照剂量呈正比，剂量越大，危险性越高。无阈值为确定性效应，有阈值为随机性效应。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，题述把两类效应颠倒了。无阈值、发生概率与剂量成正比的是随机性效应；确定性效应（组织反应）有阈值，严重程度随剂量增加。"},{"id":"basics_rad_0024","module":"basics","bank":"辐射防护基础","type":"judge","stem":"当量剂量的定义为：组织或器官的平均吸收剂量与辐射权重因子的乘积。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，当量剂量定义为组织或器官的平均吸收剂量与辐射权重因子的乘积，用于反映不同辐射生物效应的差异，单位是希沃特。"},{"id":"basics_rad_0025","module":"basics","bank":"辐射防护基础","type":"judge","stem":"辐射防护三原则是指：正当性原则、防护最优化原则、ALARA原则。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，辐射防护三原则是正当性原则、防护最优化原则和个人剂量限值的应用原则；ALARA是防护最优化原则的内涵，不是独立的原则。"},{"id":"basics_rad_0026","module":"basics","bank":"辐射防护基础","type":"judge","stem":"在考虑辐射防护时，要求剂量越低越好。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，剂量并非无条件越低越好，而应在考虑经济和社会因素的前提下合理可行尽量低（ALARA），即防护最优化。"},{"id":"basics_rad_0027","module":"basics","bank":"辐射防护基础","type":"judge","stem":"由于利益和代价在群体中分布的不一致性，虽然实践满足了正当性要求，辐射防护也做到了最优化，但还不一定能够对每个人提供足够的保护。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，正当性和最优化是在群体层面评价的，利益与代价分布不均，因此还需应用个人剂量限值，才能保证对每个人的充分保护。"},{"id":"basics_rad_0028","module":"basics","bank":"辐射防护基础","type":"judge","stem":"工作场所的表面污染控制水平只考虑松散污染。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，表面污染控制水平同时考虑固定污染和松散污染，其中松散污染易转移扩散、易进入人体，控制要求更严格。"},{"id":"basics_rad_0029","module":"basics","bank":"辐射防护基础","type":"judge","stem":"中子测量是通过中子与探测器灵敏介质材料原子核发生作用后产生的次级带电粒子来测量的，中子与原子核的相互作用主要有：核反应、核裂变、活化等。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，中子不带电，需先与介质原子核发生核反应、核裂变或活化等作用产生次级带电粒子，再由探测器测量。"},{"id":"basics_rad_0030","module":"basics","bank":"辐射防护基础","type":"judge","stem":"核电厂把需要和可能需要专门防护手段或安全措施的区域定为监督区。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，需要和可能需要专门防护手段或安全措施的区域应定为控制区；监督区通常不需专门防护，只需经常监督和评价照射条件。"},{"id":"basics_rad_0031","module":"basics","bank":"辐射防护基础","type":"judge","stem":"核电厂反应堆冷却剂和结构材料在中子辐照下都会活化成放射性物质，活化产物对电站工作人员的集体剂量贡献小于裂变产物。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，压水堆职业照射剂量贡献最大的是活化产物（如Co-58、Co-60），其贡献大于裂变产物。"},{"id":"basics_rad_0032","module":"basics","bank":"辐射防护基础","type":"judge","stem":"放射性废液排放前，首先应对排出物混匀，然后采取样品进行测量，测量达标后即可连续排放，不需要额外监测手段。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，排放前混匀取样达标只是前提，排放过程中还须用在线监测仪表连续监测废液浓度和排放量，不能无监测直接排放。"},{"id":"basics_rad_0033","module":"basics","bank":"辐射防护基础","type":"judge","stem":"放射性废物管理包括放射性废物的预处理、处理、整备、运输、贮存和处置在内的所有行政管理和运行活动。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，放射性废物管理涵盖废物的预处理、处理、整备、运输、贮存和处置等全部行政管理和运行活动。"},{"id":"basics_rad_0034","module":"basics","bank":"辐射防护基础","type":"judge","stem":"废物处置是指为废物安全和废物管理经济目的而采取一系列手段，从而改变废物物理及化学特性，如衰变、净化、浓缩、减容、从废物中去除放射性核素和改变其组成等。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，题述是废物处理的定义，即改变废物物理化学特性以实现安全和经济目的；处置是指将废物放置于经批准的处置设施中且不再回取。"},{"id":"basics_rad_0035","module":"basics","bank":"辐射防护基础","type":"judge","stem":"实现废物最小化的方法包括优化管理、减少源项、再利用和再循环和减容处理。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"正确，实现废物最小化的方法包括优化管理、减少源项、再利用和再循环以及减容处理，从源头控制废物产生量。"},{"id":"basics_rad_0039","module":"basics","bank":"辐射防护基础","type":"single","stem":"1960 年的国际物理学会议和 1961 年的化学会议分别通过决议，确定以(     )作为原子质量单位；","options":["<ckeditor5><p>1 个<sup>12<\/sup>C 原子质量的十二分之一<\/p><\/ckeditor5>","<ckeditor5><p>1 个<sup>14<\/sup>C 原子质量的十二分之一<\/p><\/ckeditor5>","<ckeditor5><p>1 个 <sup>16<\/sup>O 原子质量的十二分之一<\/p><\/ckeditor5>"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"1960年国际物理学会议和1961年化学会议确定，以1个¹²C原子质量的十二分之一（1u）作为统一的原子质量单位。"},{"id":"basics_rad_0040","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p>个人剂量当量指人体某一指定点下面某一深度 d 处的软组织内的剂量当量，记为Hp(d)，单位为 J•kg<sup>-1<\/sup>，剂量当量的单位是（ ）。<\/p><\/ckeditor5>","options":["希沃特","伦琴","居里"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"剂量当量的国际单位是希沃特（Sv），1Sv＝1J/kg；伦琴是照射量单位，居里是放射性活度单位。"},{"id":"basics_rad_0041","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p>已知<sup> 60<\/sup>Co的半衰期为5.26a，某时刻<sup>60<\/sup>Co样品的原子核数目为10<sup>14<\/sup>个，问该时刻该样品的活度是多少？<\/p><\/ckeditor5>","options":["<ckeditor5><p>4.18×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>0.625×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>0.526×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>5.26×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"活度A＝λN＝ln2/T½×N，半衰期5.26a≈1.66×10⁸s，λ≈4.18×10⁻⁹s⁻¹，乘以10¹⁴个核得约4.18×10⁵Bq。"},{"id":"basics_rad_0042","module":"basics","bank":"辐射防护基础","type":"judge","stem":"<ckeditor5><p><sup>17<\/sup>N、 <sup>19<\/sup>O、 <sup>18<\/sup>F 和 <sup>14<\/sup>C 均属于压水堆堆芯的裂变产物。<\/p><\/ckeditor5>","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"错误，¹⁷N、¹⁹O、¹⁸F、¹⁴C是冷却剂中氧、碳等元素经中子活化生成的核素，属于活化产物，不属于裂变产物。"},{"id":"basics_rad_0043","module":"basics","bank":"辐射防护基础","type":"single","stem":"放射性活度为一定数量放射性原子核在单位时间内发生衰变数量大小的物理量，以下有关活度单位的描述，正确的是（    ）。","options":["1贝可表示放射源发生1次衰变","<ckeditor5><p>1Ci＝3.7×10<sup>10<\/sup>Bq/秒<\/p><\/ckeditor5>","活度的国际单位为Bq"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"活度的国际单位是贝可（Bq），1Bq表示每秒发生1次衰变；贝可本身已含单位时间的含义，再附加\"每秒\"是错误表述。"},{"id":"basics_rad_0044","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p><span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线束强度减弱为入射强度一半时，吸收材料厚度称为半吸收厚度，或半值层，关于<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线的减弱系数，以下描述正确的是（ ）。<\/p><\/ckeditor5>","options":["水的减弱系数最大","<ckeditor5><p>石蜡是<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线理想的屏蔽材料<\/p><\/ckeditor5>","<ckeditor5><p>铅对<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线的减弱系数大于水和石蜡<\/p><\/ckeditor5>"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"γ射线减弱依靠光电、康普顿和电子对效应，铅原子序数和密度高，减弱系数大于水和石蜡；石蜡含氢多，适合屏蔽中子而非γ射线。"},{"id":"basics_mat_0001","module":"basics","bank":"材料基础","type":"single","stem":"材料品种繁多，数以十万计。为了便于认识和应用，从不同角度对其进行了分类。按化学成分、生产过程、结构及性能特点可分为（     ）。","options":["金属材料、无机非金属材料、有机高分子材料、复合材料","金属材料、结构材料、功能材料、复合材料","金属材料、无机非金属材料、有机高分子材料、结构材料"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"按化学成分、结构及性能特点，材料分为金属材料、无机非金属材料、有机高分子材料和复合材料四大类；结构材料与功能材料是按用途划分。"},{"id":"basics_mat_0002","module":"basics","bank":"材料基础","type":"single","stem":"核电站的寿命取决于（    ）","options":["核燃料","结构材料","功能材料"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"压力容器、一回路压力边界等结构材料长期承受高温高压、辐照和腐蚀，其性能退化不可更换，决定核电厂寿命；燃料可定期更换。"},{"id":"basics_mat_0003","module":"basics","bank":"材料基础","type":"single","stem":"材料是反应堆安全的基础，防止堆内放射性物质外逸，压水反应堆第一道安全屏障是（   ）。","options":["燃料包壳","压力容器和一回路压力边界","安全壳"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"压水堆三道安全屏障依次为燃料包壳、一回路压力边界和安全壳，包壳是第一道屏障，将放射性裂变产物封闭在燃料棒内。"},{"id":"basics_mat_0004","module":"basics","bank":"材料基础","type":"single","stem":"制造反应堆的材料活化截面也应该尽可能（ ），含长半衰期元素（  ），如Co。","options":["大，多","小，少","小，多"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"反应堆材料活化截面要小，以降低辐照后的活化放射性；含Co等长半衰期元素要少，避免产生长寿命放射性核素，便于检修与退役。"},{"id":"basics_mat_0005","module":"basics","bank":"材料基础","type":"single","stem":"拉伸实验时，试样拉断前所能承受的最大应力称为材料的 (   )。","options":["屈服强度","抗拉强度","弹性极限"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"抗拉强度是试样拉断前所能承受的最大应力；屈服强度是开始发生明显塑性变形时的应力，弹性极限是弹性变形的上限。"},{"id":"basics_mat_0006","module":"basics","bank":"材料基础","type":"single","stem":"零件在外力作用下形状和尺寸所发生的变化称为(    )。","options":["变形","断裂","磨损"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"变形指零件在外力作用下形状和尺寸的变化，含弹性与塑性变形；断裂指开裂折断，磨损指表面材料的损耗。"},{"id":"basics_mat_0007","module":"basics","bank":"材料基础","type":"single","stem":"零件在外力作用下发生开裂或折断称为(    )","options":["断裂","变形","磨损"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"断裂指零件在外力作用下发生开裂或折断；变形是形状尺寸改变，磨损是摩擦造成的表面损耗。"},{"id":"basics_mat_0008","module":"basics","bank":"材料基础","type":"single","stem":"因摩擦而使零件尺寸、表面形状和表面质量发生变化的现象称为(    )。","options":["变形","断裂","磨损"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"磨损指因摩擦使零件表面材料逐渐损耗的现象，表现为尺寸、表面形状和质量变化，与变形、断裂有本质区别。"},{"id":"basics_mat_0009","module":"basics","bank":"材料基础","type":"single","stem":"国产45钢的含碳量是（    ）。","options":["0.45","0.045","0.0045"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"45钢的牌号数字表示平均含碳量为0.45%（万分之四十五），换算成质量分数即0.0045。"},{"id":"basics_mat_0010","module":"basics","bank":"材料基础","type":"single","stem":"由于核反应堆材料暴露在辐照场内，经受α、β、γ射线，中子、裂变产物的强辐照，在辐照下材料会发生降级、老化；在这些辐照中，高能快中子辐照对结构材料的影响极大，它会造成材料的（    ）。","options":["软化和脆化","强化和脆化","软化和变形"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"高能快中子辐照造成原子位移损伤，缺陷聚集阻碍位错运动，使材料辐照硬化并伴随脆化，塑韧性下降、脆性转变温度升高。"},{"id":"basics_mat_0011","module":"basics","bank":"材料基础","type":"single","stem":"强度是指材料在外力的作用下（ ）的能力。","options":["抵抗变形和破坏","产生塑性变形而不被破坏","抵抗其它更硬物体压入其表面"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"强度是材料在外力作用下抵抗塑性变形和破坏的能力；产生塑性变形而不破坏是塑性，抵抗更硬物体压入表面是硬度。"},{"id":"basics_mat_0012","module":"basics","bank":"材料基础","type":"single","stem":"下面描述不正确的是(    )","options":["控制材料是指中子吸收截面小的元素、合金或陶瓷等材料，它是反应堆实现可控和自持核裂变反应不可缺少的材料。人们利用它来对反应堆的反应性进行控制。","慢化材料是指其在与高能中子发生弹性碰撞中能有效地吸收中子能量，将核裂变时放出的快中子能量降到对裂变元素反应截面大的热中子水平的材料；","冷却剂是在反应堆一回路循环的载热流体。它的功能除了将核裂变能带出反应堆外，还有冷却堆内所有部件、携带流体可燃毒物(如硼酸)、携带除氧剂和调节pH的添加剂、事故工况下能迅速带走燃料发出的热量，避免堆芯烧毁等功能。"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"控制材料用于吸收中子、控制反应性，应具有大中子吸收截面，A说\"截面小\"错误；B、C对慢化材料和冷却剂的描述正确。"},{"id":"basics_mat_0013","module":"basics","bank":"材料基础","type":"single","stem":"中国核电，反应堆设计和建造采用的核电标准是（    ）等。","options":["ASME、RCC-M、CSA、ГОСТ","ASME、RCC-M、ГОСТ、JIS","ASME、RCC-M、JIS、CSA"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"中国核电引进法、加、俄等国技术，采用ASME（美）、RCC-M（法）、CSA（加）、ГОСТ（俄）等标准，未采用日本JIS。"},{"id":"basics_mat_0014","module":"basics","bank":"材料基础","type":"single","stem":"屏蔽材料是为了减少人体所受的放射性照射，防止结构材料和机器设备受射线照射后发热、活化和性能下降，或者为了降低测量仪器的本底，采用屏蔽材料在辐射源和被照射物之间设置屏障。以下有关屏蔽材料不正确的是（   ）","options":["屏蔽g射线：原子序数越大的元素，屏蔽效果越差。","屏蔽中子：原子序数小的元素，尤其是含有大量氢的物质，通过弹性散射能使中子能量大幅度减小，屏蔽中子效果好。","屏蔽热量：可以采用多层不锈钢弧形瓦，通过拉大距离来实现热屏蔽的功能。"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"屏蔽γ射线要求材料原子序数大、密度高（如铅），原子序数越大屏蔽效果越好，A说法相反故错误；B、C描述正确。"},{"id":"basics_mat_0015","module":"basics","bank":"材料基础","type":"single","stem":"压水堆、重水堆的包壳材料采用（  ）合金；沸水堆则采用（   ）合金作包壳；而快堆用（   ）作包壳。","options":["Zr-4、Zr-2、不锈钢","Zr-4、Zr-2、Zr-2.5Nb","Zr-4、Zr-2.5Nb、Zr-2"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"锆合金中子吸收截面小、耐腐蚀，压水堆与重水堆包壳用Zr-4，沸水堆用Zr-2，钠冷快堆不慢化中子，包壳用不锈钢。"},{"id":"basics_mat_0016","module":"basics","bank":"材料基础","type":"single","stem":"焊接在核电厂建造中应用广泛且重要，尤其在压力容器建造时焊接质量更显其关键性作用，影响焊接质量的因素包括（    ）。","options":["焊接材质量、焊接工艺、焊接人员资格","焊接操作、焊接检验、焊接记录","以上都是"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"焊接质量受多重因素影响：焊接材料质量、焊接工艺、人员资格以及操作、检验、记录都须受控，故\"以上
