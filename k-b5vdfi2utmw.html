basics","bank":"辐射防护基础","type":"judge","stem":"由于利益和代价在群体中分布的不一致性，虽然实践满足了正当性要求，辐射防护也做到了最优化，但还不一定能够对每个人提供足够的保护。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.1节：'辐射实践满足了正当性要求，辐射防护也做到了最优化，但不一定能对每个人提供足够的防护。因此……必须用剂量限值对个人所受照射加以限制'。正当性和最优化都是群体（社会）层面对利益与代价的权衡，而利益和代价在群体中的分布并不一致，故还须应用个人剂量限值才能保证对每个人的充分保护，题干与课件表述一致，说法正确。易被误导处：集体最优不等于人人安全。【易混点】剂量限值指内外照射剂量总和，且不适用于医疗照射和天然本底照射。"},{"id":"basics_rad_0028","module":"basics","bank":"辐射防护基础","type":"judge","stem":"工作场所的表面污染控制水平只考虑松散污染。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.3节：表面污染分为固定污染（难以去除）和松散污染（容易去除、容易转移）两类，两类都有辐射危害——固定污染在β和γ辐射体情况下存在外照射危害，松散污染既有外照射风险又可能再悬浮或转移到体表造成内照射。因此表面污染控制水平须同时考虑固定污染和松散污染，不能只考虑松散污染，故说法错误。易被误导处：松散污染易扩散更受关注，但固定污染的外照射风险同样必须控制。【易混点】控制区子区划分标准中就包含β表面污染水平（Bq/cm²）指标。"},{"id":"basics_rad_0029","module":"basics","bank":"辐射防护基础","type":"judge","stem":"中子测量是通过中子与探测器灵敏介质材料原子核发生作用后产生的次级带电粒子来测量的，中子与原子核的相互作用主要有：核反应、核裂变、活化等。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》3.1节中子探测器：'中子本身不带电，中子主要是通过中子与探测器灵敏介质材料的原子核发生作用后产生的次级带电粒子来测量的；中子与原子核的相互作用主要有：核反应、核裂变、活化等'，与题干一致，故说法正确。易被误导处：探测器直接测的不是中子本身，而是核反应生成的次级带电粒子（质子、α粒子、裂变碎片等）的电离信号。【易混点】核裂变法利用重核裂变碎片（重带电粒子）测量中子；压水堆核测系统一般只测量热中子通量。"},{"id":"basics_rad_0030","module":"basics","bank":"辐射防护基础","type":"judge","stem":"核电厂把需要和可能需要专门防护手段或安全措施的区域定为监督区。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.4节：辐射控制区是'辐射风险大的且需要对放射性物质采取专门防护手段或安全措施的区域'；监督区在控制区之外、辐射风险较小，'一般不需要专门的防护手段或安全措施'，但需对职业照射条件进行经常性的监督和评价。题中把'需要和可能需要专门防护手段或安全措施'的区域定为监督区，正好说反，故说法错误。易被误导处：两区的辐射水平都可能超过公众限值，区别在于是否需要专门防护手段。【易混点】监督区人员年受照一般不超过年剂量限值的3/10，但可能超过1/10。"},{"id":"basics_rad_0031","module":"basics","bank":"辐射防护基础","type":"judge","stem":"核电厂反应堆冷却剂和结构材料在中子辐照下都会活化成放射性物质，活化产物对电站工作人员的集体剂量贡献小于裂变产物。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.2节：反应堆内结构材料（不锈钢、锆、水）的中子活化产物是核电站运行中影响最大的辐射源，'活化产物在停堆检修期间造成的危害最大，占剂量贡献的90%以上'，对剂量贡献最大的核素为钴-60和钴-58。故'活化产物对电站工作人员集体剂量的贡献小于裂变产物'说法错误。易被误导处：裂变产物总量虽大，但正常运行时密封在燃料包壳内，对工作人员剂量贡献反而小。【易混点】燃料无破损时，职业照射绝大部分来自一回路腐蚀活化产物（结构材料微量钴导致60Co持续累积）。"},{"id":"basics_rad_0032","module":"basics","bank":"辐射防护基础","type":"judge","stem":"放射性废液排放前，首先应对排出物混匀，然后采取样品进行测量，测量达标后即可连续排放，不需要额外监测手段。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》5.3节：液态流出物采用槽式排放，排放前应取样监测（混匀、取样分析、达标后方可排放），并且'放射性流出物排放过程中应有在线辐射监测仪表连续监测，排放管线上应安装自动报警和排放连锁装置'，绝非'不需要额外监测手段'，故说法错误。易被误导处：取样达标只是排放的前提条件，排放全程仍须在线监测与连锁保护以防超标排放。【易混点】排放量还实行分层次管控：月累计不超过年度管理目标值的1/5、季度不超过1/2、年不超过目标值。"},{"id":"basics_rad_0033","module":"basics","bank":"辐射防护基础","type":"judge","stem":"放射性废物管理包括放射性废物的预处理、处理、整备、运输、贮存和处置在内的所有行政管理和运行活动。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》第5章总结：'放射性废物管理包括预处理、处理、整备、运输、贮存和处置等环节'在内的所有行政管理和运行活动，与题干列举一致，故说法正确。易被误导处：环节容易漏记'运输'和'整备'，管理是覆盖废物从产生到处置的全过程活动。【易混点】管理方针为'减少产生、分类收集、净化浓缩、减容固化、严格包装、安全运输、就地暂存、集中处置、控制排放、加强监测'，核心是以处置为目标。"},{"id":"basics_rad_0034","module":"basics","bank":"辐射防护基础","type":"judge","stem":"废物处置是指为废物安全和废物管理经济目的而采取一系列手段，从而改变废物物理及化学特性，如衰变、净化、浓缩、减容、从废物中去除放射性核素和改变其组成等。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》5.2节：题干所述'为废物安全和经济目的采取一系列手段改变废物物理及化学特性（衰变、净化、浓缩、减容、去除核素等）'是废物'处理'的内容——固体废物处理分预处理、处理、整备三个阶段，工艺有压缩装桶、焚烧、水泥固化等；处置则是将废物包安置于经批准的处置设施、不再回取的最终安排，故说法错误。易被误导处：'处理'与'处置'一字之差，前者改变废物特性，后者是最终安置。【易混点】管理原则：以安全为目的，以处置为核心。"},{"id":"basics_rad_0035","module":"basics","bank":"辐射防护基础","type":"judge","stem":"实现废物最小化的方法包括优化管理、减少源项、再利用和再循环和减容处理。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》《辐射防护（共性）》：废物最小化通过优化管理（避免产生、不必要的物品与外包装不带入控制区、按需使用耗材、分类收集、工完料尽场地清）、减少源项、再利用（重复利用）和再循环（循环再生）以及减容处理（压缩、焚烧）等途径实现，题干列举与课件要求一致，故说法正确。易被误导处：废物最小化不只是末端减容，更要从源头减少产生。【易混点】减少放射性废物（尤其固体废物）既是经济问题（处置费用高昂）也是辐射防护良好实践的体现，是每名辐射工作人员的义务。"},{"id":"basics_rad_0039","module":"basics","bank":"辐射防护基础","type":"single","stem":"1960 年的国际物理学会议和 1961 年的化学会议分别通过决议，确定以(     )作为原子质量单位；","options":["<ckeditor5><p>1 个<sup>12<\/sup>C 原子质量的十二分之一<\/p><\/ckeditor5>","<ckeditor5><p>1 个<sup>14<\/sup>C 原子质量的十二分之一<\/p><\/ckeditor5>","<ckeditor5><p>1 个 <sup>16<\/sup>O 原子质量的十二分之一<\/p><\/ckeditor5>"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"课件未直接覆盖。按原子物理通识：1960年国际物理学会议和1961年化学会议分别通过决议，统一以'1个¹²C原子质量的十二分之一'作为原子质量单位（1u），以消除此前物理学界（曾用¹⁶O）与化学界（曾用天然氧）标准不一致的问题，故选A。不选B：¹⁴C是放射性同位素（碳测年用），不作质量基准；不选C：¹⁶O是旧物理学标准，已被统一标准取代。【易混点】1u约等于1.66×10⁻²⁷kg，近似等于一个核子（质子或中子）的质量，核素质量数即以u为单位的近似值。"},{"id":"basics_rad_0040","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p>个人剂量当量指人体某一指定点下面某一深度 d 处的软组织内的剂量当量，记为Hp(d)，单位为 J•kg<sup>-1<\/sup>，剂量当量的单位是（ ）。<\/p><\/ckeditor5>","options":["希沃特","伦琴","居里"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《辐射防护（共性）》1.8节：个人剂量当量Hp(d)是有效剂量的测量近似值，单位为希沃特（Sv），1Sv=1J/kg，核电厂常用mSv、μSv（1Sv=1000mSv=1000000μSv），故选A。不选B：伦琴是照射量的旧单位，不是剂量当量单位；不选C：居里是放射性活度单位。【易混点】剂量（当量）单位Sv、活度单位Bq/Ci、照射量单位伦琴三者务必分开记；核电厂用电子剂量计（EPD）和热释光剂量计（TLD）监测记录个人剂量当量。"},{"id":"basics_rad_0041","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p>已知<sup> 60<\/sup>Co的半衰期为5.26a，某时刻<sup>60<\/sup>Co样品的原子核数目为10<sup>14<\/sup>个，问该时刻该样品的活度是多少？<\/p><\/ckeditor5>","options":["<ckeditor5><p>4.18×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>0.625×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>0.526×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>5.26×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《反应堆物理基础》第二章：活度A=λN，衰变常数λ=ln2/T½。半衰期5.26a≈1.66×10⁸s，λ=0.693/(1.66×10⁸)≈4.18×10⁻⁹s⁻¹，故A=λN=4.18×10⁻⁹×10¹⁴≈4.18×10⁵Bq，选A。不选B/C/D：均未正确联立A=(ln2/T½)·N，常见错误是漏掉ln2、或未把半衰期换算成秒。【易混点】同章练习：16N半衰期7.4s，衰变到初始值的1/10约需24.6s，用的正是同一条衰变规律N(t)=N₀e^(−λt)。"},{"id":"basics_rad_0042","module":"basics","bank":"辐射防护基础","type":"judge","stem":"<ckeditor5><p><sup>17<\/sup>N、 <sup>19<\/sup>O、 <sup>18<\/sup>F 和 <sup>14<\/sup>C 均属于压水堆堆芯的裂变产物。<\/p><\/ckeditor5>","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《反应堆物理基础》第二章：一回路水中的16O、17O等核吸收中子发生16O(n,p)16N、17O(n,p)17N等反应，是中子活化的产物；《核电厂辐射防护基础》指出活化产物是'位于运行堆芯附近的一切物质被中子活化'形成，而裂变产物是核裂变的'碎片'（碘-131、铯-134/137、氙-133、氪-85等）。17N、19O、18F、14C是冷却剂中氧、碳等经活化生成的核素，不属裂变产物，故说法错误。易被误导处：它们确产生于堆芯，但机制是活化而非裂变。【易混点】裂变产物多为碘、铯、氙、氪等，活化产物多为冷却剂轻核与钴等结构材料核素。"},{"id":"basics_rad_0043","module":"basics","bank":"辐射防护基础","type":"single","stem":"放射性活度为一定数量放射性原子核在单位时间内发生衰变数量大小的物理量，以下有关活度单位的描述，正确的是（    ）。","options":["1贝可表示放射源发生1次衰变","<ckeditor5><p>1Ci＝3.7×10<sup>10<\/sup>Bq/秒<\/p><\/ckeditor5>","活度的国际单位为Bq"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《辐射防护（共性）》1.8节：'放射性活度：放射性物质在单位时间内自发衰变的次数，单位贝克（Bq），1Bq＝1次衰变/秒'，故活度的国际单位为Bq，C正确。不选A：漏掉'每秒'，1Bq是每秒发生1次衰变，不是总共发生1次衰变；不选B：Bq本身已含'每秒'之意，写成'Bq/秒'属单位重复、表述错误。【易混点】1Ci=3.7×10¹⁰Bq（约1克镭的活度）；CPS是每秒计数（探测器计数率），与Bq（每秒衰变数）概念不同，存在探测效率差别。"},{"id":"basics_rad_0044","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p><span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线束强度减弱为入射强度一半时，吸收材料厚度称为半吸收厚度，或半值层，关于<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线的减弱系数，以下描述正确的是（ ）。<\/p><\/ckeditor5>","options":["水的减弱系数最大","<ckeditor5><p>石蜡是<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线理想的屏蔽材料<\/p><\/ckeditor5>","<ckeditor5><p>铅对<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线的减弱系数大于水和石蜡<\/p><\/ckeditor5>"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》1.3节：γ射线通过物质时因光电效应、康普顿散射和电子对效应而衰减，强度随屏蔽厚度按指数规律减弱，μ为线性衰减系数；γ屏蔽要用'非常厚实且密度高的材料（水泥墙、铅板、大量的水）'。铅原子序数高、密度大，对γ的减弱系数大于水和石蜡，故选C。不选A：水可作γ屏蔽但减弱系数远小于铅；不选B：石蜡含氢多，是中子而非γ的理想屏蔽材料。【易混点】半值层（半吸收厚度）即使强度减半的厚度，减弱系数越大半值层越薄。"},{"id":"basics_mat_0001","module":"basics","bank":"材料基础","type":"single","stem":"材料品种繁多，数以十万计。为了便于认识和应用，从不同角度对其进行了分类。按化学成分、生产过程、结构及性能特点可分为（     ）。","options":["金属材料、无机非金属材料、有机高分子材料、复合材料","金属材料、结构材料、功能材料、复合材料","金属材料、无机非金属材料、有机高分子材料、结构材料"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：按化学成分、结构及性能特点，材料分为金属材料、无机非金属材料、有机高分子材料和复合材料四大类。不选B：结构材料、功能材料是按用途划分的口径（课件中反应堆材料即分功能类、结构类），不属于按化学成分的分类；不选C：把按用途划分的“结构材料”混入成分分类，且遗漏了复合材料。【易混点】黑色金属专指铁、锰、铬及其合金，其余金属为有色金属，这是金属材料内部的再细分。"},{"id":"basics_mat_0002","module":"basics","bank":"材料基础","type":"single","stem":"核电站的寿命取决于（    ）","options":["核燃料","结构材料","功能材料"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：核电站的寿命取决于结构材料。压力容器等结构材料长期在苛刻条件下服役（RPV工作条件：15.5MPa、约300℃、中子辐照），且庞大而不可更换，其性能退化直接限定核电站寿命。不选A：核燃料可定期更换，不决定电站寿命；不选C：功能材料多可补充更换，也非寿命的决定因素。【易混点】正因RPV不可更换且材料存在低温脆性（DBTT随辐照升高），才必须开展全寿期监督。"},{"id":"basics_mat_0003","module":"basics","bank":"材料基础","type":"single","stem":"材料是反应堆安全的基础，防止堆内放射性物质外逸，压水反应堆第一道安全屏障是（   ）。","options":["燃料包壳","压力容器和一回路压力边界","安全壳"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：设置安全屏障是为防止堆内放射性物质外逸。按“三道屏障”口径（燃料包壳、一回路压力边界、安全壳），燃料包壳将裂变产物封闭在燃料棒内，是第一道安全屏障。不选B：压力容器和一回路压力边界是第二道屏障；不选C：安全壳是最后一道屏障。【易混点】课件第23页按“四道屏障”表述时为：燃料芯块→燃料包壳→压力容器和一回路压力边界→安全壳，芯块为第一道，注意区分两种口径。"},{"id":"basics_mat_0004","module":"basics","bank":"材料基础","type":"single","stem":"制造反应堆的材料活化截面也应该尽可能（ ），含长半衰期元素（  ），如Co。","options":["大，多","小，少","小，多"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：为减少放射性危害，制造反应堆的材料活化截面应尽可能小，含长半衰期元素（如Co）要少，故“小、少”正确——活化截面小，材料经中子辐照后产生的感生放射性就弱，便于检修与退役。不选A：“大、多”会生成大量放射性核素，加重放射性危害；不选C：活化截面小虽对，但长半衰期元素多仍会形成长寿命放射性核素。【易混点】课件所列典型活化产物：59Co→60Co、58Ni→58Co、56Mn、59Fe。"},{"id":"basics_mat_0005","module":"basics","bank":"材料基础","type":"single","stem":"拉伸实验时，试样拉断前所能承受的最大应力称为材料的 (   )。","options":["屈服强度","抗拉强度","弹性极限"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：抗拉强度σb是试样在断裂前所能承受的最大应力，与题干“拉断前所能承受的最大应力”一致。不选A：屈服强度σs是材料发生塑性变形前的最大承载应力；不选C：弹性极限是材料保持弹性变形的上限应力，超过后即出现塑性变形。【易混点】强度还有抗压、抗弯、抗剪、抗扭等种类；塑性用断后伸长率δ和断面收缩率ψ衡量。"},{"id":"basics_mat_0006","module":"basics","bank":"材料基础","type":"single","stem":"零件在外力作用下形状和尺寸所发生的变化称为(    )。","options":["变形","断裂","磨损"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"变形指零件在外力作用下形状和尺寸所发生的变化，按卸载后能否恢复分为弹性变形与塑性变形（课件《核电厂材料基础》）。不选B：断裂指零件发生开裂或折断，属失效行为；不选C：磨损是摩擦造成的表面材料损耗，与外力直接作用无必然关系。课件将断裂、腐蚀、磨损并列为材料失效的三大类形式。【易混点】外力逐渐增大时，金属依次经历弹性变形、弹塑性变形和断裂三个阶段。"},{"id":"basics_mat_0007","module":"basics","bank":"材料基础","type":"single","stem":"零件在外力作用下发生开裂或折断称为(    )","options":["断裂","变形","磨损"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"断裂指零件在外力作用下发生开裂或折断，是材料失效的重要形式之一，课件《核电厂材料基础》将断裂、腐蚀、磨损并列为材料失效三大类。不选B：变形只是形状和尺寸的改变，零件并未断开；不选C：磨损是摩擦导致的表面损耗，不是开裂折断。【易混点】课件：按断裂性质分脆性断裂与延性（韧性）断裂；按裂纹途径分穿晶断裂与沿晶断裂，沿晶断裂多表现为脆性断裂（如回火脆）。"},{"id":"basics_mat_0008","module":"basics","bank":"材料基础","type":"single","stem":"因摩擦而使零件尺寸、表面形状和表面质量发生变化的现象称为(    )。","options":["变形","断裂","磨损"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"磨损指因摩擦而使零件尺寸、表面形状和表面质量发生变化的现象，是相对运动接触表面材料逐渐损耗的结果，课件《核电厂材料基础》将其与断裂、腐蚀并列为失效三大类。不选A：变形是外力作用下形状尺寸的变化，与摩擦无关；不选B：断裂是开裂或折断，磨损并未使零件断开。【易混点】多种失效常耦合作用，如在腐蚀性介质中承受交变载荷的腐蚀疲劳，会加速裂纹萌生和扩展。"},{"id":"basics_mat_0009","module":"basics","bank":"材料基础","type":"single","stem":"国产45钢的含碳量是（    ）。","options":["0.45","0.045","0.0045"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：优质碳素结构钢牌号用两位数字表示平均含碳量的万分数，45钢即平均含碳量0.45%（万分之四十五），以质量分数表示即0.0045。不选A：0.45是百分数口径的数值，含碳量若达45%早已不是钢；不选B：0.045对应万分之四百五十，数量级错了一位。【易混点】含锰较高的须标出Mn（如45Mn）；高级优质钢、特级优质钢分别在牌号尾加A、E。"},{"id":"basics_mat_0010","module":"basics","bank":"材料基础","type":"single","stem":"由于核反应堆材料暴露在辐照场内，经受α、β、γ射线，中子、裂变产物的强辐照，在辐照下材料会发生降级、老化；在这些辐照中，高能快中子辐照对结构材料的影响极大，它会造成材料的（    ）。","options":["软化和脆化","强化和脆化","软化和变形"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：辐照脆化表现为屈服极限增加、塑性韧性下降——高能快中子造成原子离位损伤，缺陷聚集阻碍位错运动，材料在硬化的同时变脆，即“强化和脆化”。不选A：快中子辐照使材料硬化而非软化；不选C：辐照不导致软化，变形也不是其主要后果。【易混点】压力容器钢通过控制Cu（<0.08%）、P（<0.008%）含量并设置辐照监督试样来管理辐照脆化风险。"},{"id":"basics_mat_0011","module":"basics","bank":"材料基础","type":"single","stem":"强度是指材料在外力的作用下（ ）的能力。","options":["抵抗变形和破坏","产生塑性变形而不被破坏","抵抗其它更硬物体压入其表面"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：强度是材料在外力作用下抵抗变形和破坏的能力。不选B：产生塑性变形而不被破坏是塑性，以断后伸长率δ、断面收缩率ψ衡量；不选C：抵抗其它更硬物体压入其表面是硬度，有布氏HB、洛氏HR、维氏HV等试验方法。【易混点】五大力学指标：强度（抗拉强度σb、屈服强度σs）、塑性（ψ、δ）、韧性（冲击韧性ak/冲击功Ak），分别由拉伸、硬度、冲击等试验测定。"},{"id":"basics_mat_0012","module":"basics","bank":"材料基础","type":"single","stem":"下面描述不正确的是(    )","options":["控制材料是指中子吸收截面小的元素、合金或陶瓷等材料，它是反应堆实现可控和自持核裂变反应不可缺少的材料。人们利用它来对反应堆的反应性进行控制。","慢化材料是指其在与高能中子发生弹性碰撞中能有效地吸收中子能量，将核裂变时放出的快中子能量降到对裂变元素反应截面大的热中子水平的材料；","冷却剂是在反应堆一回路循环的载热流体。它的功能除了将核裂变能带出反应堆外，还有冷却堆内所有部件、携带流体可燃毒物(如硼酸)、携带除氧剂和调节pH的添加剂、事故工况下能迅速带走燃料发出的热量，避免堆芯烧毁等功能。"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：控制材料的特点是中子吸收截面大（如硼B-10、铪Hf、镉Cd），靠吸收中子实现反应性控制，A说“截面小”恰好说反，故A不正确。B对慢化材料的描述与课件一致：将裂变快中子慢化到热中子水平，提高235U裂变效率；C对冷却剂功能的描述也正确：冷却剂是将核裂变能导出堆芯的载热剂，兼有冷却各部件等功能。【易混点】堆芯结构材料与包壳则相反，要求中子吸收截面尽可能小，以减少寄生吸收。"},{"id":"basics_mat_0013","module":"basics","bank":"材料基础","type":"single","stem":"中国核电，反应堆设计和建造采用的核电标准是（    ）等。","options":["ASME、RCC-M、CSA、ГОСТ","ASME、RCC-M、ГОСТ、JIS","ASME、RCC-M、JIS、CSA"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：国内核电项目实际采用的规范标准——秦山一期、三门等用ASME（美），秦山三期用ASME+CSA（加），M310机组及衍生机组用RCC-M（法），田湾VVER机组用ГОСТ（俄），即ASME、RCC-M、CSA、ГОСТ。不选B：含日本JIS且漏掉CSA；不选C：含日本JIS且漏掉ГОСТ——JIS未在我国核电项目中采用。【易混点】KTA（德）、JIS（日）虽属国际主要核电规范体系，但国内项目未采用，勿混淆。"},{"id":"basics_mat_0014","module":"basics","bank":"材料基础","type":"single","stem":"屏蔽材料是为了减少人体所受的放射性照射，防止结构材料和机器设备受射线照射后发热、活化和性能下降，或者为了降低测量仪器的本底，采用屏蔽材料在辐射源和被照射物之间设置屏障。以下有关屏蔽材料不正确的是（   ）","options":["屏蔽g射线：原子序数越大的元素，屏蔽效果越差。","屏蔽中子：原子序数小的元素，尤其是含有大量氢的物质，通过弹性散射能使中子能量大幅度减小，屏蔽中子效果好。","屏蔽热量：可以采用多层不锈钢弧形瓦，通过拉大距离来实现热屏蔽的功能。"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：屏蔽γ射线主要靠密度大的材料，如铅、重混凝土——原子序数（密度）越大，衰减能力越强，A说“越大效果越差”恰好说反，故A不正确。B正确：中子屏蔽用轻质材料（轻水、石墨、石蜡），含氢多，通过弹性散射使中子能量大幅度减小；C正确：热屏蔽可用不锈钢弧形瓦或增大压力容器与堆芯间距离实现。【易混点】混凝土是很好的屏蔽材料，陆上固定式反应堆都用它作为各种屏蔽。"},{"id":"basics_mat_0015","module":"basics","bank":"材料基础","type":"single","stem":"压水堆、重水堆的包壳材料采用（  ）合金；沸水堆则采用（   ）合金作包壳；而快堆用（   ）作包壳。","options":["Zr-4、Zr-2、不锈钢","Zr-4、Zr-2、Zr-2.5Nb","Zr-4、Zr-2.5Nb、Zr-2"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：压水堆、重水堆包壳采用Zr-4合金（课件提到压水堆燃料封装于锆-4、M5等锆合金管内）；沸水堆因冷却剂含氧、过氧化氢，用更耐含氧水腐蚀的Zr-2合金；钠冷快堆不需慢化中子且钠温高，用不锈钢作包壳。不选B：Zr-2.5Nb是CANDU重水堆压力管材料，不是沸水堆包壳；不选C：将Zr-2.5Nb与Zr-2的位置对调，与实际不符。【易混点】锆合金的核心优势是中子吸收截面小、耐高温水腐蚀。"},{"id":"basics_mat_0016","module":"basics","bank":"材料基础","type":"single","stem":"焊接在核电厂建造中应用广泛且重要，尤其在压力容器建造时焊接质量更显其关键性作用，影响焊接质量的因素包括（    ）。","options":["焊接材质量、焊接工艺、焊接人员资格","焊接操作、焊接检验、焊接记录","以上都是"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：焊接质量受多环节共同控制——焊接材料质量、焊接工艺（课件指出焊接应力由不均匀加热引起，直接影响制造质量和使用性能）、焊接人员资格（HAF603规定民用核安全设备焊工操作工资格必须考核持证、强制执行），以及焊接操作、检验、记录等过程管理，故“以上都是”。不选A、B：各自只列出部分因素，均不全面。【易混点】焊接产生的应力和变形包括热应力、相变应力、残余应力等，均对钢结构有不良影响。"},{"id":"basics_mat_0017","module":"basics","bank":"材料基础","type":"single","stem":"材料的工作环境是十分恶劣的，对材料的要求也是十分苛刻的。这些恶劣的环境包括（  ）","options":["高温、高压、强辐照、腐蚀","高温、高压、强辐照","高温、强辐照、腐蚀"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：核反应堆工作条件非常严峻，所使用的材料必须在高温、高压、强辐照和极大的温度梯度条件下工作，同时还有腐蚀的影响，四个因素并存、缺一不可。不选B：漏掉腐蚀；不选C：漏掉高压，均不完整。【易混点】对一回路设备材料的性能要求涵盖核性能、化学、物理、力学、辐照、工艺性能和经济性七个方面。"},{"id":"basics_mat_0018","module":"basics","bank":"材料基础","type":"single","stem":"堆芯材料、燃料包壳、调节棒、慢化剂材料，对中子吸收截面的要求，依次是（   ）","options":["大、小、大、小","小、小、大、小","小、小、大、大"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：堆芯材料中子吸收截面小（减少中子损失、提高燃耗）；燃料包壳（锆合金）截面小；调节棒用Ag-In-Cd等中子吸收截面大的材料以控制反应性；慢化剂要求吸收截面小、反射（散射）截面大。故依次为“小、小、大、小”。不选A：堆芯材料若截面大将产生寄生吸收，经济性差；不选C：慢化剂若吸收截面大则无法有效慢化中子。【易混点】反射材料同样要求原子量小、散射截面大、吸收截面小。"},{"id":"basics_mat_0019","module":"basics","bank":"材料基础","type":"single","stem":"压水反应堆有三道安全屏障，其中第二道安全屏障是（    ）。","options":["包壳","安全壳","压力容器"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：按“三道屏障”口径，第一道为燃料包壳，第二道为压力容器和一回路压力边界——保持一回路系统压力、防止冷却剂沸腾，燃料元件破损时将放射性保留在一回路系统内，故选压力容器。不选A：包壳是第一道；不选B：安全壳是第三道（最后一道）。【易混点】课件第23页按四道屏障表述：燃料芯块、燃料包壳、压力容器和一回路压力边界、安全壳，两种口径都要掌握。"},{"id":"basics_mat_0020","module":"basics","bank":"材料基础","type":"single","stem":"核电厂使用的材料中，铅通常用于哪种用途使用？（    ）","options":["屏蔽材料","主蒸汽管道","慢化剂"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：射线屏蔽材料主要靠密度大的材料，铅密度高、原子序数大，对γ射线衰减能力强，是典型屏蔽材料。不选B：主蒸汽管道属二回路设备，用低碳钢类材料（课件举例SA106B、16Mn）制造；不选C：慢化剂用轻水、重水、石墨等质量轻、散射截面大的材料，铅会大量吸收中子，绝不能作慢化剂。【易混点】中子屏蔽与γ屏蔽相反，要用含氢多的轻质材料（轻水、石墨、石蜡）。"},{"id":"basics_mat_0021","module":"basics","bank":"材料基础","type":"judge","stem":"金属是指单一元素构成的具有特殊的光泽延展性导电性导热性的物质。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：金属通常具有良好的导电性、导热性、延展性、高的密度和高的光泽，金属即由金属元素构成的单质（单一元素构成），故说法正确。易被误导处：有人会因“金属材料包括合金”而犹豫——金属材料才是金属及其合金的总称，单说“金属”指单质本身。【易混点】金属具有正的电阻温度系数，这是区别于非金属的重要电学特征。"},{"id":"basics_mat_0022","module":"basics","bank":"材料基础","type":"judge","stem":"铁、锰、铬及其合金，统称为黑色金属材料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：金属材料分黑色金属与有色金属两大类，黑色金属即铁、锰、铬及以它们为基的合金（钢、铸铁均属此类），铜、镍、钛、铝等其余金属为有色金属，故说法正确。易被误导处：易误以为“黑色”指外观颜色——不锈钢呈银白色仍属黑色金属，“黑色”只是分类习惯称谓。【易混点】核电站主要设备的结构材料绝大多数是金属材料，其中不锈钢占80%-90%。"},{"id":"basics_mat_0023","module":"basics","bank":"材料基础","type":"judge","stem":"金属的晶体结构是有缺陷的。金属在凝固、冷加工、热加工、形变、辐照、再结晶、同素异构转变中等都可能使原子排列的规律性在局部区域遭到破坏，因而产生晶体缺陷。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：课件原文指出，金属在凝固、冷加工、热加工、形变、辐照、再结晶、同素异构转变等过程中，都可能使原子排列的规律性在局部区域遭到破坏，从而产生晶体缺陷，故说法正确。易被误导处：易误以为理想晶体才是常态——实际金属都是不完美晶体，缺陷普遍存在。【易混点】晶体缺陷分三类：点缺陷（空位、间隙原子、置换原子）、线缺陷（刃型/螺型位错）、面缺陷（晶界、亚晶界、相界等）。"},{"id":"basics_mat_0024","module":"basics","bank":"材料基础","type":"judge","stem":"金属材料是金属及其合金的总称。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：材料分金属材料、无机非金属材料、有机高分子材料、复合材料四大类，金属材料即金属及其合金的总称（内部再分黑色、有色金属两类），故说法正确。易被误导处：合金由多种元素组成，但仍属金属材料，勿因“总称”二字而怀疑该定义。【易混点】无机非金属材料即陶瓷材料，有机高分子材料即塑料（聚合物），复合材料按基体分金属基、陶瓷基、高分子基。"},{"id":"basics_mat_0025","module":"basics","bank":"材料基础","type":"judge","stem":"材料的冲击韧性是指材料在冲击载荷作用下抵抗变形和断裂的能力。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：冲击韧性是材料在冲击载荷作用下抵抗变形和断裂的能力，以冲击试验测定，冲击韧度ak为试样缺口处单位截面积上消耗的冲击功（J/cm²），故说法正确。易被误导处：易与断裂韧度混淆——断裂韧度KIC表征材料阻止裂纹扩展的能力，针对低应力脆断问题。【易混点】韧脆转变温度越低，材料低温冲击韧性越好；RPV钢的DBTT随辐照而升高，是寿期监督重点。"},{"id":"basics_mat_0026","module":"basics","bank":"材料基础","type":"judge","stem":"由于重水吸收热中子的几率小，所以中子经济性好，以重水作为慢化剂的反应堆，可以采用天然铀作为核燃料，从而使得建造重水堆的国家，不必建造浓缩铀工厂。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：CANDU重水堆用重水作慢化剂和冷却剂、以天然铀作燃料。重水吸收热中子的几率小，中子经济性好，堆内中子足以维持天然铀的链式裂变反应，因此建造重水堆的国家不必建造浓缩铀工厂，故说法正确。易被误导处：易与轻水堆混淆——轻水吸收中子多，必须使用低浓铀燃料。【易混点】CANDU堆另一特点是堆芯用压力管代替压力容器，且可不停堆更换燃料。"},{"id":"basics_mat_0027","module":"basics","bank":"材料基础","type":"judge","stem":"一个核反应堆的建成，不论其取得能量的物理理念、物理模式怎样好，如果不能找到与之条件相适应的材料，在实际中也不可能成功。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：费米1946年即指出“核技术成功的关键取决于堆内强辐射下材料的行为”。材料是实现反应堆设计的物质基础，物理理念再先进，找不到与高温、高压、强辐照等条件相适应的材料，反应堆在实际中也不可能建成，故说法正确。易被误导处：易低估材料地位，以为仅靠物理设计即可决定成败。【易混点】反应堆材料对堆型的设计、建造和寿命都有密切关系，起着重要的先导作用。"},{"id":"basics_mat_0028","module":"basics","bank":"材料基础","type":"judge","stem":"通常说钢比铸铁抗拉强度高，是指单位截面积的承力能力前者高，后者低。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：强度是材料在外力作用下抵抗变形和破坏的能力，按单位截面积的承力能力（应力）定义，是材料本身的本质属性，与零件截面大小无关。钢与铸铁按同一口径比较，钢的抗拉强度更高，故说法正确。易被误导处：若把“承力”理解为整根零件能承受的总载荷，粗大的铸铁件可能承受更大总力，但单位截面积承力仍是钢高。【易混点】铸铁抗压能力可观而抗拉强度低，故多用于受压构件。"},{"id":"basics_mat_0029","module":"basics","bank":"材料基础","type":"judge","stem":"传热管材料通常需要需具备：导热性能好、热膨胀系数小；抗应力腐蚀能力强；热强性、热稳定性和焊接性能良好；塑韧性好，以便制管、弯管和胀管的加工。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：课件明确传热管材料需具备：导热性能好、热膨胀系数小；抗应力腐蚀能力强；热强性、热稳定性和焊接性能良好；塑韧性好以便制管、弯管和胀管加工，与题干完全一致，故说法正确。易被误导处：易漏掉“便于制管、弯管、胀管”这类工艺性要求——数千根U形管（总长约70-110公里）的加工离不开良好塑韧性。【易混点】传热管材料历经304不锈钢→INCONEL-600→INCOLOY-800/INCONEL-690的演变，起因正是腐蚀问题。"},{"id":"basics_mat_0030","module":"basics","bank":"材料基础","type":"judge","stem":"一般来说，硬度高的材料其强度也较高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：硬度和强度都反映材料抵抗塑性变形的能力，对金属材料两者近似正相关，一般硬度越高强度也越高，故说法正确。易被误导处：两者并非严格一一对应，不同材料、不同强化机制下由硬度推算强度会有偏差，不能绝对化。【易混点】硬度试验方法：压入法（布氏HB、洛氏HR、维氏HV）、划痕法、回跳法（里氏硬度HL）。"},{"id":"basics_mat_0031","module":"basics","bank":"材料基础","type":"judge","stem":"选材时，只要满足工件使用要求即可，并非各项性能指标越高越好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：选材在满足使用要求的基础上还要考虑经济性——工艺简单易行、原材料来源方便、制造成本低廉，并优先选用工艺成熟、使用经验丰富的材料，并非各项指标越高越好，故说法正确。易被误导处：盲目追求高指标会推高成本，某些高强材料还可能焊接性、韧性变差，反而不利。【易混点】核电选材“成熟、保守”的原则，是降低不确定性风险的重要手段。"},{"id":"basics_mat_0032","module":"basics","bank":"材料基础","type":"judge","stem":"核电厂可以自行授权民用核安全设备焊接工的操作资格。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：国家《民用核安全设备焊工操作工资格管理规定（HAF603）》对民用核安全设备焊接工的操作资格作了规定，该规定是强制执行要求，是核安全局对核电焊接工作监管的重要内容之一，资格须按规定考核合格取得，核电厂不能自行授权，故说法错误。易被误导处：企业内部培训考核不等于国家资格许可。【易混点】无损检验人员同样须按HAF602持证上岗，同为强制要求。"},{"id":"basics_mat_0033","module":"basics","bank":"材料基础","type":"judge","stem":"金属在外力作用下的变形可分为弹性变形、弹塑性变形和断裂三个价段。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：金属在外力逐渐增大的作用下，先发生弹性变形（卸载后消失），随后进入弹塑性变形阶段（塑性部分不可恢复），最终发生断裂，即弹性变形、弹塑性变形和断裂三个阶段，故说法正确。易被误导处：易把第三阶段误写成“塑性变形”，与第二阶段的“弹塑性变形”重复——弹塑性阶段本就包含塑性成分。【易混点】与三阶段对应的特征应力依次是弹性极限、屈服强度、抗拉强度。"},{"id":"basics_mat_0034","module":"basics","bank":"材料基础","type":"judge","stem":"核动力设备的材料必须按照其使用条件合理选用，并参考国家制定的相应规范和标准。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：核动力设备的材料必须按照其使用条件合理选用，必须符合（而非仅“参考”）国家制定的相应规范和标准——核安全法规标准是强制性要求，故说法错误。易被误导处：“参考”一词看似差别不大，实则把强制性标准降格为自愿性依据，属原则性错误。【易混点】材料规范控制、设计变更中的材料替代管理，都是全厂材料管理防止错用材料的重要环节。"},{"id":"basics_mat_0035","module":"basics","bank":"材料基础","type":"judge","stem":"低碳钢的强度、硬度较低，但塑性、韧性及焊接性能较好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：低碳钢含碳量一般低于0.25%，因含碳量低，其强度、硬度较低，但塑性、韧性和焊接性能较好，故说法正确。易被误导处：勿把“强度硬度低”当成缺点而误判——焊接性好正是其广泛用于管道和钢结构的原因。【易混点】课件举例：低碳钢（SA106B、16Mn）用于二、三级设备、主蒸汽管道、二回路管道和安全壳衬里。"},{"id":"basics_mat_0036","module":"basics","bank":"材料基础","type":"judge","stem":"ZG200-400表示该铸造碳钢的屈服强度为200Mpa、而其抗拉强度为400Mpa。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：铸造碳钢牌号由ZG加两组数字组成，分别表示屈服强度和抗拉强度（单位MPa），ZG200-400即屈服强度200MPa、抗拉强度400MPa，故说法正确。易被误导处：易与优质碳素结构钢牌号混淆——45钢的数字表示含碳量万分数，而ZG牌号的数字是强度值，与含碳量无关。【易混点】碳素结构钢Q235中的235表示屈服强度235MPa，同一位置的数字在不同钢类中含义不同。"},{"id":"basics_mat_0037","module":"basics","bank":"材料基础","type":"judge","stem":"切尔诺贝利核电站事故以来，由于对核系统安全性的考虑，对材料的性能要求也越来越高，合理选材就显得越来越重要。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：切尔诺贝利核电站事故以来，核安全受到空前重视，对核系统安全性的考虑不断提高，对材料的性能要求（辐照监督、老化管理等）随之越来越高，合理选材显得越来越重要，故说法正确。易被误导处：易以为事故只与运行操作有关而与材料无关——事故后果的控制很大程度上依赖材料与设备的可靠性。【易混点】老化管理正是通过监测、控制构筑物、系统和部件的老化，来提高核电厂安全性和可靠性的活动。"},{"id":"basics_mat_0038","module":"basics","bank":"材料基础","type":"judge","stem":"核技术成功的关键取决于堆内强辐射下材料的行为。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：此即费米1946年名言“核技术成功的关键取决于堆内强辐射下材料的行为”。材料长期在堆内强辐射场中服役，其辐照下的行为直接决定反应堆的安全性、可靠性和经济性，故说法正确。易被误导处：易以为关键在物理设计或运行管理，但材料才是承载一切设计的物质基础。【易混点】辐照效应主要包括辐照脆化（屈服极限增加、塑性韧性下降）、辐照肿胀（燃料芯块）和活化。"},{"id":"basics_mat_0039","module":"basics","bank":"材料基础","type":"judge","stem":"核电厂可以参考国家的法规标准要求，对核岛以及常规岛相关承压部件进行定期无损检测，发现使用中出现的缺陷。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：在役检查是电厂按照相关法规以及核安全监管部门的要求必须强制实施的工作，相应的在役检查大纲是电厂获颁运行许可证必须提交的管理性文件之一，不能只是“参考”，故说法错误。易被误导处：“参考国家法规标准”的措辞看似合理，实则把强制要求弱化为自愿行为。【易混点】役前检查提供初始状态（“零点”）数据，作为以后在役检查结果的比较依据。"},{"id":"basics_mat_0040","module":"basics","bank":"材料基础","type":"judge","stem":"核电材料应优先选用工艺成熟，使用经验丰富的材料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：反应堆材料的性能要求中包含经济性——工艺简单易行、原材料来源方便、制造成本低廉，且在满足要求的基础上应优先选用工艺成熟、使用经验丰富的材料，故说法正确。易被误导处：并非越新、越高级的材料越好，缺乏使用经验的新材料反而引入不确定性风险。【易混点】反应堆及一回路主要结构材料约90%以上为锆合金、合金钢、不锈钢、镍基合金，其中不锈钢占80%-90%。"},{"id":"basics_mat_0041","module":"basics","bank":"材料基础","type":"judge","stem":"核电材料中凝汽器传热管使用的是钛合金。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：设备冷却器、凝汽器传热管使用钛合金——钛合金耐海水及含氯冷却水腐蚀的性能优良，故说法正确。易被误导处：凝汽器走循环冷却水（常为海水），腐蚀环境苛刻，普通不锈钢易发生点蚀、应力腐蚀，不能想当然以为都用不锈钢。【易混点】蒸发器U形管用的是镍基合金（Incoloy 800、Inconel 690），两者用途勿混。"},{"id":"basics_mat_0045","module":"basics","bank":"材料基础","type":"single","stem":"沸水堆、压水堆、CANDU堆、钠冷快中子增殖堆，所使用的冷却材料分别是（       ）","options":["<ckeditor5><p>石墨、轻水（H<sub>2<\/sub>O）、重水(D<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>","<ckeditor5><p>轻水（H<sub>2<\/sub>O）、轻水（H<sub>2<\/sub>O）、重水(D<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>","<ckeditor5><p>轻水（H<sub>2<\/sub>O）、轻水（H<sub>2<\/sub>O）、超重水(T<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：沸水堆和压水堆都以轻水作冷却剂（压水堆的冷却剂与慢化剂功能合一），CANDU重水堆用重水作慢化剂和冷却剂，钠冷快中子堆用液态金属钠载热，故B正确。不选A：石墨是慢化剂（如高温气冷堆用），不是冷却剂，且沸水堆用的是轻水；不选C：超重水（T2O）不是工程上实际使用的冷却剂。【易混点】常用冷却剂还有He、CO2、钠钾合金、铅铋合金以及熔盐等。"},{"id":"basics_wc_0004","module":"basics","bank":"水化学","type":"single","stem":"周期表由七个横行和十八个纵列组成。横行称周期，纵列称族，由_____个主族（A族）、8个副族（B族）和1个零族组成。","options":["7.0","8.0","9.0"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件《核电厂水化学基础》第10页：周期表十八个纵列组成的“族”由7个主族（A族）、8个副族（B族）和1个零族构成，7个主族即ⅠA~ⅦA，故填7.0。不选B(8.0)：8是副族（B族）的数目，不是主族；不选C(9.0)：周期表中不存在9个主族的划分。【易混点】7主族+8副族+1零族共16个族却对应18个纵列，原因是第Ⅷ族（属副族）独占3个纵列。"},{"id":"basics_wc_0005","module":"basics","bank":"水化学","type":"single","stem":"水的pH值大小反映水的酸碱度，当水温升高时，pH中性值下降，纯水温度在300℃时，其pH为______。","options":["6.5","7.5","5.6"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第15页：水的离解是吸热过程，离子积Kw随温度升高而增大，中性pH随之下降，课件明确“当温度达到300℃时，其中性pH值仅为5.6”，故选C。不选A(6.5)：接近60℃时的中性pH（6.54）；不选B(7.5)：7只是25℃常温下的中性值，高温下早已不成立。【易混点】高温水pH<7只是表观“酸性”，[H+]与[OH-]仍相等，不能据此判断高温纯水腐蚀性强。"},{"id":"basics_wc_0006","module":"basics","bank":"水化学","type":"single","stem":"轻水的酸碱性根据pH大小分＜7酸性、=7中性、＞7碱性，对于重水来说，测得pH=7时为______。","options":["酸性","碱性","中性"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第15页：重水的离解程度比轻水低，中性pD值大于7。因此当测得pH（pD）=7时已低于重水的中性点，氢离子相对偏多，重水呈酸性，故选A。不选B(碱性)：碱性须pD高于重水中性值才行；不选C(中性)：把轻水“=7中性”的判据直接套用到重水，正是本题陷阱。【易混点】用轻水溶液校正的pH计测重水酸度，所得读数应标记为pHA，与pD有差异。"},{"id":"basics_wc_0007","module":"basics","bank":"水化学","type":"single","stem":"在核电厂一、二回路中，各设备之间的关联和能量传递主要依靠______的流动和循环。","options":["气体","水","燃料"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第23页：“水对于核电厂来说就相当于人身体中血液，起到能量的传递作用”——一回路靠水把堆芯热量带到蒸汽发生器，二回路的水（汽）推动汽轮机做功，乏汽再由海水冷却凝结，各设备间的关联和能量传递全靠水的流动与循环，故选B。不选A(气体)：核电厂传热介质不是气体；不选C(燃料)：燃料是能量来源而非传递介质。【易混点】正因为水承担能量传递，水质控制才直接关系设备腐蚀与辐射场水平。"},{"id":"basics_wc_0008","module":"basics","bank":"水化学","type":"single","stem":"在原水预处理使用的混凝剂主要有铁盐、铝盐和无机高分子混凝剂，其中水处理效果较好普遍使用的混凝剂是______。","options":["硫酸铝","三氯化铁","聚合氯化铝"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第27页，常用混凝剂分铝盐（硫酸铝等）、铁盐（三氯化铁等）和无机高分子混凝剂三类，聚合氯化铝（PAC）即属无机高分子混凝剂，水解形成的多核羟基络合物架桥吸附能力强、矾花大而密实，处理效果好、应用普遍，故选C。不选A(硫酸铝)：普通铝盐，混凝能力弱于高分子型；不选B(三氯化铁)：铁盐腐蚀性强、使水带色，也不及PAC。【易混点】聚丙烯酰胺（PAM）属有机化合物类，作助凝剂起吸附架桥作用，不单独作混凝剂。"},{"id":"basics_wc_0009","module":"basics","bank":"水化学","type":"single","stem":"在金属腐蚀类型中，危害性最大的是______。","options":["电化学腐蚀","化学腐蚀","物理腐蚀"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第42~43页：化学腐蚀一般是均匀腐蚀，表面生成致密氧化膜还可保护下层金属（钝化即利用此理）；而电化学腐蚀由腐蚀微电池驱动，“一般为局部腐蚀，金属结构遭破坏”，课件并强调“局部腐蚀比均匀腐蚀危害更大”，故危害性最大的是电化学腐蚀，选A。不选B(化学腐蚀)：多为均匀腐蚀，危害相对轻；不选C(物理腐蚀)：单纯物理溶解，核电水环境中少见。【易混点】点蚀、缝隙腐蚀、晶间腐蚀等局部腐蚀本质上都是电化学腐蚀。"},{"id":"basics_wc_0010","module":"basics","bank":"水化学","type":"single","stem":"在核电厂一回路系统中，其放射性物质通过水及其中杂质的活化、裂变产物的释放、腐蚀产物的活化和化学添加物的活化等途径持续不断产生，为了控制系统中的核素活度维持在较低水平，通常采用______方式进行处理。","options":["滤芯过滤","树脂离子交换","膜分离技术"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第68~69页：下泄流顺次通过前置过滤器、离子交换树脂床净化，混合离子交换器“用于去除可溶性裂变产物和腐蚀产物，该净化床能有效除去冷却剂中的大多数核素”，一天内冷却剂可得到1~2次净化，故控制一回路核素活度的常规方式是树脂离子交换，选B。不选A(滤芯过滤)：前置过滤器只除去悬浮腐蚀产物和胶体颗粒，除不掉溶解态核素；不选C(膜分离技术)：不是一回路放射性控制的常规手段。【易混点】净化混床对137Cs的去除效果稍差。"},{"id":"basics_wc_0011","module":"basics","bank":"水化学","type":"single","stem":"二回路系统中关键设备众多，但最重要的设备是______，是放射性介质与非放介质的隔离边界，是二回路水化学控制的重点，水化学控制更多的是围绕它来进行。","options":["蒸汽发生器","汽轮发电机","凝汽器"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第86页：“保护蒸汽发生器传热管完整性为选择二回路水化学参数的关键考虑因素”。SG传热管是一回路放射性冷却剂与二回路非放介质的换热交界面，传热管一旦破损放射性即漏入二回路，故二回路水化学控制重点围绕蒸汽发生器进行，选A。不选B(汽轮发电机)：常规岛设备，不接触放射性介质；不选C(凝汽器)：只负责冷凝乏汽，不是放射性隔离边界。【易混点】凝汽器泄漏才是二回路水质的主要威胁，故需在线阳电导表和钠表监测。"},{"id":"basics_wc_0012","module":"basics","bank":"水化学","type":"single","stem":"为保证进入蒸汽发生器的给水中溶解氧小于5ppb，二回路采用了凝汽器真空除氧、除氧器热力除氧和添加______化学除氧来达到。","options":["联氨","乙醇胺","吗啉"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第87~88页：二回路全挥发处理中“向二回路系统添加联氨来控制二回路系统中的溶解氧并形成还原性环境”，联氨与氧反应（N2H4+O2→2H2O+2N2↑）不增加水中固形物，配合凝汽器真空除氧、除氧器热力除氧，即可使给水溶解氧小于5ppb，故选A。不选B(乙醇胺)、C(吗啉)：两者都是pH碱化剂，用于调节给水pH，不是除氧剂。【易混点】联氨110℃以上会热分解生成氨，除氧主要在较低温度区段完成。"},{"id":"basics_wc_0013","module":"basics","bank":"水化学","type":"single","stem":"核电厂系统中常用的联氨原材料的检测，通常可采用         来测定。","options":["光谱分析法","色谱分析法","氧化还原滴定法"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第88页，联氨具有还原性（与溶解氧反应被氧化），联氨原材料浓度高，可取适量试样用氧化剂标准溶液进行氧化还原滴定，由消耗量计算其含量，方法简便准确，故选C。不选A(光谱分析法)：电厂用于监测水样中微量联氨（课件第110页将联氨列于光学分析法），不适合原材料常量测定；不选B(色谱分析法)：适用于阴离子、氨、胺类等低含量组分分析。【易混点】区分两类任务——“原材料常量检测”用化学滴定，“水中微量联氨监测”用光学分析。"},{"id":"basics_wc_0014","module":"basics","bank":"水化学","type":"single","stem":"重水堆慢化剂系统的pH值控制4.5-6.5酸性环境下，是因为______。","options":["防止可溶性中子吸收剂硝酸钆产生沉淀失去作用","有利于对慢化剂系统设备的腐蚀控制","有利于可溶性中子吸收剂硼酸更好的控制反应性"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第75页：“在碱性和中性水中用作反应性控制的硝酸钆容易沉淀，如在pHa值大于7.6时，钆容易从溶液中沉淀出来”，故慢化剂pHa被设定在4.5~6.5的酸性范围，确保硝酸钆均匀溶解、正常发挥反应性控制功能，选A。不选B(腐蚀控制)：慢化剂系统的304不锈钢在少量硝酸钆和硼酸存在下本就有良好抗蚀性，酸性控制主要为钆；不选C(硼酸控制反应性)：慢化剂中硼是净化床按需除去的对象，不是控制目标。【易混点】慢化剂呈酸性而冷却剂系统pHa为10.2~10.8强碱性，两系统控制逻辑完全不同。"},{"id":"basics_wc_0015","module":"basics","bank":"水化学","type":"single","stem":"在压水堆一回路冷却剂系统中，采用B和LiOH协调调节pH值，其中______经中子活化后生成稳定的Li-7有利pH的调节。","options":["B-10","B-11","Li-6"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第59页：“用硼酸作为可溶性中子吸收剂时，10B的(n,α)反应生成7Li”，即B-10吸收中子后转化成稳定的Li-7，正好补充冷却剂碱源，与硼酸协调调节pH，故选A。不选B(B-11)：B-11基本不吸收中子，无此转化；不选C(Li-6)：天然锂中的Li-6经(n,α)反应生成氚（β辐射体，以氚水形式存在、难以分离除去），是缺点不是优点。【易混点】7Li中子吸收截面很低、不产生感生放射性，且LiOH腐蚀性小于NaOH和KOH，故西方压水堆都用高纯7LiOH。"},{"id":"basics_wc_0016","module":"basics","bank":"水化学","type":"single","stem":"在下述卤素元素中，______对包壳材料锆合金的腐蚀作用最明显。","options":["氟离子","氯离子","溴离子"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第49页锆合金腐蚀特点：“在卤素元素中，氟对锆合金的腐蚀作用最明显”，少量氟离子即能显著加速锆包壳腐蚀和吸氢，故选A。不选B(氯离子)：氯的主要危害是引发不锈钢应力腐蚀，对锆合金的作用不及氟；不选C(溴离子)：课件未将其列为锆合金的主要威胁。【易混点】课件指出不沸腾时氟离子小于2mg/kg已无危害，但因堆芯可能局部沸腾浓缩，限值仍严定为0.1或0.15mg/kg以下。"},{"id":"basics_wc_0017","module":"basics","bank":"水化学","type":"single","stem":"目前腐蚀理论认为，不锈钢应力腐蚀开裂的概率正比于______浓度和游离氧含量的乘积。","options":["氟离子","氯离子","硫酸根"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第65页：“不锈钢应力腐蚀开裂的概率正比于氯离子浓度和游离氧含量的乘积”，氯离子破坏不锈钢钝化膜，与溶解氧共同作用诱发开裂，且氧的作用尤其明显，故选B。不选A(氟离子)：氟的主要危害对象是锆合金（加速腐蚀和吸氢）；不选C(硫酸根)：与氯同时侵入才被认为与不锈钢应力腐蚀破裂有关，不是该乘积关系的主角。【易混点】氯离子限值一般要求0.1或0.15mg/kg以下，同时控氯、控氧是不锈钢应力腐蚀防护的关键。"},{"id":"basics_wc_0018","module":"basics","bank":"水化学","type":"single","stem":"压水堆冷却剂净化系统中的净化混床充填的树脂型态是锂型和氢氧型，在正常运行期间的阳树脂仍然以锂型运行，阴树脂则转化为______型态运行。","options":["硼酸型","氯型","氨型"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第69页：净化混床“以氢氧型充入床内的阴树脂在运行过程中很快被冷却剂中硼酸转换成硼酸型，即该树脂床实际运行为锂-硼酸型混合离子交换器”，因一回路冷却剂含硼酸，阴树脂吸附硼酸根后自然转为硼酸型，故选A。不选B(氯型)：氯是严格限制的有害杂质，不可能成为运行型态；不选C(氨型)：VVER机型（KOH加氨）才转为氨钾-硼酸型，普通压水堆不适用。【易混点】VVER机型混床阳树脂充填氢型而非锂型，这是与压水堆净化床的重要差别。"},{"id":"basics_wc_0019","module":"basics","bank":"水化学","type":"single","stem":"全挥发处理AVT指的是往二回路系统只添加     。","options":["磷酸盐","氨（或有机胺）和联氨","氢氧化钠"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第87页：当前核电站二回路普遍采取全挥发处理（AVT），“即在给水中添加氨或有机胺来调节给水pH值，同时向二回路系统添加联氨来控制二回路系统中的溶解氧并形成还原性环境”，只加挥发性药剂、不引入固体物质，故选B。不选A(磷酸盐)：早期pH控制剂，因SG传热管出现严重晶间腐蚀、点蚀、耗蚀已被淘汰；不选C(氢氧化钠)：固体碱会在蒸汽发生器内浓缩造成苛性腐蚀。【易混点】判断“全挥发”的标准是药剂本身可随蒸汽挥发、不残留固体，氨、联氨、有机胺均符合。"},{"id":"basics_wc_0020","module":"basics","bank":"水化学","type":"single","stem":"压水堆启动期间冷却剂系统通常采用添加     来除去系统中的溶解氧。","options":["硼酸","氢氧化锂","联氨"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第63页：“反应堆启动期间加联氨：N2H4+O2→2H2O+N2”，联氨具有强还原性，与溶解氧反应生成氮气和水，不残留固体杂质，故压水堆启动期间采用加联氨除去冷却剂中的溶解氧，选C。不选A(硼酸)：是可溶性中子吸收剂，用于反应性控制；不选B(氢氧化锂)：是pH碱化剂，没有除氧能力。【易混点】运行期间则改为加氢除氧（2H2+O2→2H2O），AP1000机组启动期间也采用加氢除氧。"},{"id":"basics_wc_0021","module":"basics","bank":"水化学","type":"judge","stem":"日常最常用3个主族：碱金属族、碱土金属族、卤素，它们对应的最具代表元素分别有Na、K、Cl。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第10页：碱金属族（IA族）最常见的是钠和钾，碱土金属族（IIA族）最常见的是镁和钙，卤素族最常见的是氟和氯。题中把钾(K)当作碱土金属族的代表是错的——K与Na同属碱金属族，碱土金属族的代表应为Mg、Ca，故说法错误。易被误导处：Na、K、Cl三个元素都真实且常见，容易让人放松警惕，错在“族—代表元素”的对应关系上。【易混点】卤素族课件标注为Ⅶ族，最常见的代表其实是氟和氯两个。"},{"id":"basics_wc_0022","module":"basics","bank":"水化学","type":"judge","stem":"与轻水相比，重水的熔、沸点较高、密度大，密度最大时的温度也有所升高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第13页：与轻水相比，重水“熔、沸点较高、密度大，密度最大时的温度有所升高，但中子吸收截面明显小，只有0.5靶”。重水分子量大于轻水、分子间作用更强，上述物理性质差异成立，故说法正确。易被误导处：容易记成“密度最大时的温度更低”，实际是有所升高（轻水约在4℃）。【易混点】重水化学性质与轻水相近，能发生轻水的一切化学反应，差异主要体现在物理性质和核性质上。"},{"id":"basics_wc_0023","module":"basics","bank":"水化学","type":"judge","stem":"溶解度是指在一定的温度下，某物质在100克溶剂（通常是水）里达到饱和状态时所溶解的克数。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"与课件第16页定义完全一致：“溶解度是指在一定的温度下，某物质在100克溶剂（通常是水）里达到饱和状态时所溶解的克数”，定义包含三个要素——一定温度、100克溶剂、达到饱和状态，故说法正确。易被误导处：是100克溶剂而不是100克溶液，且必须达到饱和状态才计溶解度。【易混点】按溶解度分：小于0.01g/(100gH2O)为难溶，0.01~0.1为微溶，大于0.1为易溶。"},{"id":"basics_wc_0024","module":"basics","bank":"水化学","type":"judge","stem":"电导率是指一种溶液的导电能力，反映了溶液中所有离子的总浓度。电导率的单位是mS/m（SI国际单位制），电厂常用的单位是μS/cm。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"与课件第17页表述一致：电导率反映溶液的导电能力，取决于溶液中所有离子的总浓度，SI单位为mS/m，电厂常用单位是μS/cm，故说法正确。易被误导处：电导率只给出“离子总量”这一笼统信号，无法指认是哪一种离子贡献的。【易混点】单位换算：1mS/m=10μS/cm，报数据、对限值时经常用到。"},{"id":"basics_wc_0025","module":"basics","bank":"水化学","type":"judge","stem":"电导率与pH的变化均表示溶液中离子的增加或减少，因此从测量电导率变化上，可推断出pH是变大还是变小了。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第17页：“当溶液的pH变化时，其电导率一定也改变，而当溶液的电导率变化时，pH不一定改变”，例如水中加入食盐后电导率增加而pH不变。电导率只反映离子总量，不能区分阴阳离子的相对比例，故无法由电导率变化推断pH升降，说法错误。易被误导处：pH变化必伴随电导率变化，容易让人误以为反向推断也成立。【易混点】要同时掌握两者，必须分别测pH和电导（或阳电导）。"},{"id":"basics_wc_0026","module":"basics","bank":"水化学","type":"judge","stem":"氧化还原反应中，失去电子和得到电子同时发生，没有只发生氧化反应而不发生还原反应的，反之亦然。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第18页：“氧化与还原过程必然是同时发生的”。氧化是失去电子、还原是得到电子，电子有失必有得、数量相等，不存在只氧化不还原或只还原不氧化的反应，故说法正确。易被误导处：平时说某物质“被氧化”只是强调反应物一方，整个反应仍是氧化还原同时进行。【易混点】失电子被氧化者是还原剂，得电子被还原者是氧化剂，两个角色不要记反。"},{"id":"basics_wc_0027","module":"basics","bank":"水化学","type":"judge","stem":"超滤是利用超滤膜为过滤介质，在一定的压力下，当水流过膜表面时，只允许水及小分子物质透过膜，但阻止水中溶解盐离子透过，以达到水质净化的目的。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第32页超滤定义：“只允许水、无机盐及小分子物质透过膜，而阻止水中粒径较大等物质透过”——溶解盐离子属于小分子/离子态物质，可以自由透过超滤膜。题中说“阻止水中溶解盐离子透过”，把超滤说成了反渗透的功能，故说法错误。易被误导处：超滤确能截留0.01μm以上微粒、去除胶体和微生物，容易误以为它连盐分也能除。【易混点】超滤一般作为反渗透的预处理，真正除盐靠反渗透、电渗析和离子交换。"},{"id":"basics_wc_0028","module":"basics","bank":"水化学","type":"judge","stem":"将含有较多溶解盐类的苦咸水通过反渗透的处理可以得到含盐极少的纯净水，可直接用于核电厂二回路系统用水。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第24页，水处理流程一般为“原水预处理→超滤→反渗透→离子交换等”，反渗透只是除盐流程中的一级，其出水仍含少量盐分，须经离子交换等精处理达到除盐水标准后才能作为二回路补水，不能“直接”使用，故说法错误。易被误导处：反渗透常被宣传为“生产纯净水”，但核电厂对补水水质的要求远高于饮用水。【易混点】EDI适合处理反渗透出水等低含盐量水，可代替离子交换床，但目前应用还不广泛。"},{"id":"basics_wc_0029","module":"basics","bank":"水化学","type":"judge","stem":"离子交换树脂按照微孔型态分类，有凝胶型和大孔型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"与课件第34页分类一致：“按离子交换树脂的微孔型态分类：分为凝胶型树脂和大孔型树脂”，故说法正确。易被误导处：容易与“按骨架材料分类（苯乙烯系、丙烯酸系等）”“按交换基团性质分类（阳树脂、阴树脂）”相混淆，凝胶/大孔是按微孔型态的划分。【易混点】在纯水生产和放射性水处理中多采用强酸性和强碱性离子交换树脂。"},{"id":"basics_wc_0030","module":"basics","bank":"水化学","type":"judge","stem":"反渗透和电渗析均属于膜分离技术，其原理均是由于膜的选择透过性，截留溶质离子，透过溶剂分子。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第32、33、37页：反渗透与电渗析（含填充床电渗析EDI）均属膜分离技术，靠膜的选择透过性实现分离——反渗透在盐水侧施加高于渗透压的压力，水透过而盐分不能透过薄膜；电渗析在直流电场下“以电位差为动力，利用膜的选择透过性，把电解质从溶液中分离出来”。题述与课件一致，故正确。易被误导处：两者驱动方式不同（压差与电场），但截留溶质离子、透过溶剂分子的分离实质相同。【易混点】EDI把离子交换树脂与电渗析膜结合，可连续除盐不需化学再生。"},{"id":"basics_wc_0031","module":"basics","bank":"水化学","type":"judge","stem":"设置凝结水精处理系统（混床）主要目的是为当凝汽器发生泄漏时投入运行净化凝结水以及机组启动期间除去腐蚀产物等颗粒杂质，确保二回路水质良好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第96页：凝结水精处理系统为二回路水质净化处理的专设系统，主要在“机组大小修启动阶段，去除因检修带入的杂质和系统腐蚀产物”和“凝汽器泄漏时，去除泄漏入的盐类杂质”等情况下投运，确保二回路水质良好，与题意相符，故正确。易被误导处：并非常年连续投运——正常运行期间（精处理不投入）主要靠蒸汽发生器连续排污维持杂质平衡。【易混点】监测凝汽器泄漏的手段主要是在线阳电导表和在线钠表。"},{"id":"basics_wc_0032","module":"basics","bank":"水化学","type":"judge","stem":"在金属材料发生的腐蚀中，由于材料中不可避免存在着不均匀和材质差异，在使用过程中，发生的腐蚀一般为电化学腐蚀及局部腐蚀，金属结构遭破坏，此种类型腐蚀危害性更大。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第42~43页：金属材料成分、组织不可避免地存在不均匀和材质差异，接触电解质后形成腐蚀微电池，故使用中发生的腐蚀“一般为电化学腐蚀”，且多为局部腐蚀；课件强调“腐蚀的危害……更重要的是金属结构遭破坏，其中局部腐蚀比均匀腐蚀危害更大”。题述与此一致，故正确。易被误导处：均匀腐蚀失重直观可见，但真正使设备失效的往往是集中在缝隙、晶界处的局部腐蚀。【易混点】点蚀、缝隙腐蚀、晶间腐蚀、应力腐蚀均属局部腐蚀。"},{"id":"basics_wc_0033","module":"basics","bank":"水化学","type":"judge","stem":"压水堆和重水堆一回路系统设备的主要材料均为锆合金、镍基合金和不锈钢等，为了控制腐蚀，都需要将系统介质的pH值控制在合适的碱性范围内。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第56、71~72页：压水堆一回路介质接触的主要材料为锆合金、镍基合金和不锈钢；重水堆热传输系统采用锆合金压力管和包壳、不锈钢、碳钢及镍铁合金传热管。两侧都要求“冷却剂保持碱性，使……腐蚀速率尽量低”，将pH控制在合适的碱性范围内，故说法正确。易被误导处：重水堆慢化剂系统pHa为4.5~6.5的酸性，但那是另一独立系统，不影响冷却剂系统保持碱性。【易混点】CANDU冷却剂用天然LiOH碱化（pHa10.2~10.8），压水堆用高纯7LiOH。"},{"id":"basics_wc_0034","module":"basics","bank":"水化学","type":"judge","stem":"应力腐蚀是一种发生在特殊环境和应力状态下的腐蚀。应力腐蚀的特征是：材料表面的腐蚀程度较轻，裂纹较深、裂纹走向基本上与主应力方向垂直。应力腐蚀是金属材料在实际应用中经常遇到而又危害较大的一种腐蚀类型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第44页：应力腐蚀断裂是金属或合金在腐蚀和拉应力同时作用下产生的断裂，属特定“材料-环境”组合（如不锈钢-Cl-）的局部腐蚀，是实际应用中经常遇到、危害较大的腐蚀类型。题中特征描述——表面腐蚀程度较轻、裂纹较深、走向基本垂直于主应力方向——正符合其隐蔽破坏的特点，故正确。易被误导处：表面“看起来还好”不代表安全，深裂纹才是致命所在。【易混点】不锈钢应力腐蚀概率正比于氯离子浓度与游离氧含量的乘积。"},{"id":"basics_wc_0035","module":"basics","bank":"水化学","type":"judge","stem":"CANDU型重水堆以天然铀作为燃料，重水作为冷却剂和慢化剂，控制和调节反应性的可溶性中子吸收剂使用了两种化学品硼和钆。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第71页：“CANDU型重水堆以天然铀作为燃料，重水作为冷却剂和慢化剂”，并“控制调节可溶性中子吸收剂硼和钆的浓度”来实现反应性控制，与题述逐项对应，故说法正确。易被误导处：压水堆只用硼酸一种可溶性毒物，CANDU是硼、钆两种并用，大修重新启动后还要用除钆床除去大量硝酸钆。【易混点】慢化剂中硼、钆浓度有严格规范：硼<10mg/kg、钆<0.1mg/kg。"},{"id":"basics_wc_0036","module":"basics","bank":"水化学","type":"judge","stem":"压水堆中冷却剂和慢化剂是同一个系统，水化学环境控制相同，而重水堆中冷却剂和慢化剂是两个不同的系统，水化学环境控制也完全不同。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第71页：“慢化剂系统与冷却剂热传输系统在排管容器中实体分开”。压水堆中轻水兼作冷却剂和慢化剂，同属一个系统；重水堆冷却剂与慢化剂则是两个实体分离的系统，且水质控制完全不同——冷却剂pHa为10.2~10.8的碱性，慢化剂pHa为4.5~6.5的酸性，故说法正确。易被误导处：“水化学环境控制也完全不同”是关键句，两系统指标反差极大，绝非同一套要求。【易混点】CANDU慢化剂在低温低压下运行，冷却剂系统则处于高温高压。"},{"id":"basics_wc_0037","module":"basics","bank":"水化学","type":"judge","stem":"核电厂二回路化学控制方法上，由传统的单一加氨作为碱化剂，逐渐过渡到两种胺/氨及以上的联合调节控制方式，现呈流行趋势。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第92页：单独使用某种胺各有优劣，“有些电厂采取混合胺处理的方法”，如秦山三期首先应用的吗啉-氨处理、秦山二期首先应用的ETA和氨处理，由单一加氨过渡到两种及以上胺/氨联合调节已成趋势，故说法正确。易被误导处：不是“放弃加氨”，而是氨与有机胺搭配，兼顾不同温度区间的pH控制与防腐。【易混点】混合胺的思路是选碱性和挥发性适当的配合——氨挥发性大，ETA更多保留在液相。"},{"id":"basics_wc_0038","module":"basics","bank":"水化学","type":"judge","stem":"AP1000型压水堆和CANDU重水堆在一回路冷却剂启动期间采用添加氢气的方式来实现化学除氧。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第63页：“反应堆运行期间加氢”除氧，并注明“AP1000机组启动期间也采用加氢除氧”；第73页指出重水堆通过控制溶解氘（3~10ml/kg）来抑制重水的辐射分解。两类机组启动期间均以加氢（氘）方式实现化学除氧，故说法正确。易被误导处：一般压水堆（如M310）启动用联氨、运行才加氢，而AP1000启动阶段就直接加氢。【易混点】加氢除氧原理是2H2+O2→2H2O，同时可抑制水的辐射分解。"},{"id":"basics_wc_0039","module":"basics","bank":"水化学","type":"judge","stem":"在氨与有机碱化剂ETA联合控制来调节二回路系统pH时，ETA的主要作用是提高了二回路系统高温疏水在其运行温度下对应的pH值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第90、92页：氨易挥发，“在高温时液相的pH不足以减少给水系统及疏水系统碳钢材料的腐蚀，容易发生FAC现象”；而ETA碱性比氨及吗啉强、挥发性小（汽水分配系数只有0.6），更多保留在液相中，能提高高温疏水在其运行温度下的pH。题述正是ETA的主要作用，故正确。易被误导处：ETA并非全回路处处最优，其挥发性小，对蒸汽及凝结水系统的保护可能不够。【易混点】吗啉汽水分配系数接近1，可使整个水汽系统保持相同pH。"},{"id":"basics_wc_0040","module":"basics","bank":"水化学","type":"judge","stem":"在核电厂运行中需要对各系统的化学参数进行定期取样分析监测，设置有专门的化学实验室来承担此工作。在化学实验室的分析方法中，主要有化学分析和仪器分析。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第107~108页：核电厂专门设置化学实验室，“对电厂各系统的水、汽、油等化学参数进行定期的监测跟踪”；分析方法“按分析方法的原理分类：可分为化学分析和仪器分析两大类”，化学分析以化学反应为基础（重量法、容量法），仪器分析以物理或物理化学性质为基础。题述一致，故正确。易被误导处：还可按分析任务分为定性、定量和结构分析，别与按原理的分类混淆。【易混点】仪器分析常用光学分析法、电化学分析法、色谱分析法、质谱分析法等。"},{"id":"basics_wc_0041","module":"basics","bank":"水化学","type":"judge","stem":"凝结水精处理系统和除盐水生产系统均设置有阳床和混床，树脂运行失效后一般输送到体外再生系统进行再生。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第96页，凝结水精处理系统一般由前置阳床、混床和体外再生系统组成，“阳床和混床的树脂在运行失效后……将其床内树脂传输到（体外）再生系统”再生，这部分说法对；但除盐水生产系统的阳床、阴床、混床是配套就地设置的再生系统，树脂一般在床内再生，并非“均输送到体外再生系统”，故整体说法错误。易被误导处：两个系统都有“阳床、混床”，容易以为再生方式也相同。【易混点】体外再生可避免再生酸碱进入主系统，是凝结水精处理采用它的原因。"},{"id":"basics_wc_0042","module":"basics","bank":"水化学","type":"judge","stem":"为降低材料腐蚀和辐射场，目前压水堆核电厂冷却剂系统的pH（300℃）值一般控制在6.9〜7.4之间。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第57页：“腐蚀速率及沉积量，高温下（300℃）pH低于6.9时沉积增加，大于7.4后沉积也略有增加，两者之间相对较低。pH值：6.9~7.4（300℃）”。冷却剂用硼和氢氧化锂协调控制在该范围，可减少材料腐蚀和腐蚀产物向堆芯沉积，降低辐射场，故说法正确。易被误导处：这是300℃下的高温pH值，不能与25℃的测量值直接比较。【易混点】国内多数电厂目标控制pH300℃在7.2±0.1，M310机组要求锂浓度小于3.5mg/kg。"},{"id":"basics_wc_0043","module":"basics","bank":"水化学","type":"judge","stem":"为降低材料腐蚀和辐射场，CANDU重水堆冷却剂系统的pH（25℃）值一般控制在10.2〜10.8之间。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第72、74页：CANDU冷却剂“保持碱性……使碳钢和不锈钢的腐蚀速率尽量低”，采用天然氢氧化锂碱化，pHa（25℃）限值10.2~10.8、期望值10.2~10.4，以降低材料腐蚀和辐射场，题述与水质技术规范一致，故正确。易被误导处：这里指冷却剂（热传输）系统，不要与慢化剂系统4.5~6.5的酸性控制混淆。【易混点】pHa是用轻水校正的pH计测重水酸度所得读数的标记，与普通pH略有差别。"},{"id":"basics_wc_0044","module":"basics","bank":"水化学","type":"judge","stem":"压水反应堆燃料循环后期，当硼酸浓度较低（以B计小于100mgB/L）时，一般采用充排水方式来降低硼浓度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"课件未直接覆盖：本题依据运行经验作答——燃料循环后期硼浓度已降至较低水平（以B计小于100mgB/L），此时若经离子交换除硼，会同时干扰锂的平衡、影响硼锂协调的pH控制，且床器投入不经济；采用充排水（注入补给水稀释、排走下泄流）方式降硼，操作简单、可控性好，故说法正确。易被误导处：“后期、低硼”是前提条件，运行前期补偿燃耗的硼调节同样主要靠充排水。【易混点】充排水会增加废液处理量，操作时需权衡降硼速率与废水量。"},{"id":"basics_wc_0045","module":"basics","bank":"水化学","type":"judge","stem":"对VVER型压水堆是靠连续不断地或周期性地向冷却剂加进氨经辐射分解产生的氢来抑制水的辐射分解。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第64页：“VVER机组一回路冷却剂溶氢是通过连续加氨，氨辐照分解生成溶氢的方式维持溶氢的合适范围内（2.2mg/L~4.5mg/L）”，氨的辐照分解式为2NH3→3H2+N2，产生的氢抑制水的辐射分解，题述“连续不断地或周期性地向冷却剂加氨”与此相符，故正确。易被误导处：VVER与其他压水堆不同，不直接加氢气，而是“借氨产氢”。【易混点】VVER用天然KOH作pH控制剂，西方压水堆用高纯7LiOH。"},{"id":"basics_wc_0046","module":"basics","bank":"水化学","type":"judge","stem":"VVER机组中，氨对降低一回路结构材料和燃料包壳表面的沉积物有利，氨可以络合四氧化三铁形成可溶的铁氨络合物，经净化系统将铁去除。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"课件未直接覆盖：此为VVER运行经验——氨除辐解产氢外，还能与腐蚀产物四氧化三铁络合，生成可溶性的铁氨络合物，把沉积物“溶”入水中并随净化系统（混床）去除，从而降低一回路结构材料和燃料包壳表面的沉积物，故说法正确。易被误导处：络合作用是缓慢的辅助效益，不能指望氨“清洗”严重结垢的回路，沉积控制仍以水质控制为主。【易混点】VVER加氨一举两得：产氢抑制水的辐射分解，络合铁减少表面沉积。"},{"id":"basics_wc_0047","module":"basics","bank":"水化学","type":"judge","stem":"二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺、混合胺不同发展阶段。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第89页：“二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺、混合胺不同发展阶段”——磷酸盐因SG传热管出现严重晶间腐蚀、均匀腐蚀、点蚀、耗蚀而被淘汰，后改用氨水，再发展出吗啉、ETA等有机胺，近年又走向混合胺联合调节，与题述一致，故正确。易被误导处：发展顺序是“先磷酸盐后胺类”，不要记反。【易混点】磷酸盐年代SG传热管的晶间腐蚀、点蚀、耗蚀等严重问题，正是推动其被淘汰的直接原因。"},{"id":"basics_wc_0048","module":"basics","bank":"水化学","type":"judge","stem":"pH和电导率的测定与介质实际的温度没有直接关系，因此无需关注介质的温度。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第15页：水的离子积Kw随温度显著变化，中性pH从18℃的7.10降到100℃的6.10、300℃的5.6；第98页还要求二回路样水“通过两级冷却将样品冷却并维持在25℃”再供仪表和手动取样，正说明pH、电导率与介质温度密切相关，必须注明或换算到规定温度下比较，故说法错误。易被误导处：仪表自带温度补偿，容易让人误以为温度无关。【易混点】不同温度下测得的pH、电导率数据不能直接比较。"},{"id":"basics_wc_0049","module":"basics","bank":"水化学","type":"judge","stem":"二回路测量阳电导率的原因是水中含有碱化剂氨导致总电导率较高，测量阳电导率可以消除氨的影响，敏锐地反映水中所有阴离子的存在情况。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第97~98页：监测凝汽器泄漏的手段主要为在线阳电导表和在线钠表，二回路在线仪表专设“监测凝汽器泄漏的钠表和阳电导表”。因给水中加氨使总电导率本底偏高，水样经阳离子交换柱除去氨等阳离子后测得的阳电导率，能敏锐反映氯离子等阴离子杂质的存在情况，题述正确。易被误导处：总电导率合格不代表无泄漏，凝汽器漏入海水会最先在阳电导上反映。【易混点】阳电导与钠表互相印证，是判断凝汽器泄漏的主要在线手段。"},{"id":"basics_wc_0050","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>在氧化铜与氢气生成铜和水的反应中（CuO+H<sub>2<\/sub>=Cu+H<sub>2<\/sub>O），氢气是______，其发生氧化反应。<\/p><\/ckeditor5>","options":["氧化剂","还原剂","催化剂"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第18页：氧化还原反应中“失去电子被氧化，氧化值升高，氧化反应，还原剂”。CuO+H2=Cu+H2O中，H2夺得CuO中的氧生成水，自身失电子（氧化值由0升至+1）被氧化，故H2是还原剂，选B。不选A(氧化剂)：CuO提供氧、被还原，才是氧化剂；不选C(催化剂)：催化剂反应前后自身不变，而H2明显参与反应并转化成了水。【易混点】“剂”看自身命运——被氧化者为还原剂，被还原者为氧化剂。"},{"id":"basics_wc_0053","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>由于感生放射性原因，核电厂冷却剂系统一般不用（ &nbsp; &nbsp;）作为调节pH的碱化剂。<\/p><\/ckeditor5>","options":["<ckeditor5><p><sup>7<\/sup>LiOH<\/p><\/ckeditor5>","NaOH","KOH"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第59页：“天然钠由100%的23Na组成，与中子反应生成24Na。而24Na是一种很强的γ辐射体，因此添加NaOH会带来很强的感生放射性，不适合”作冷却剂pH碱化剂，故选B。不选A(7LiOH)：7Li中子吸收截面很低、不产生感生放射性，是首选碱化剂；不选C(KOH)：天然钾中41K与中子反应生成42K也是强γ辐射体，虽俄罗斯VVER在用，但也不是本题答案。【易混点】良好的pH控制剂要求核性能好、不产生或少产生感生放射性，这是核电与常规电厂水化学的重要差别。"},{"id":"basics_wc_0054","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>重水堆中的C-14主要来源于______，由于该系统重水中<sup>17<\/sup>O靶子物的数量较多，生成的C-14也多，其主要存在形态为碳酸或碳酸氢盐。<\/p><\/ckeditor5>","options":["冷却剂系统","慢化剂系统","二回路系统"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第77页：“慢化剂系统是重水堆14C的主要来源，它是由重水中的17O照射而产生”，慢化剂重水装量大、17O靶子物多，生成的C-14也多；且慢化剂为氧化性水环境，14C以碳酸（氢）盐等无机碳形态存在，可被净化床阴树脂除去并固定在树脂内，故选B。不选A(冷却剂系统)：装水量小于慢化剂，不是主要来源；不选C(二回路系统)：远离堆芯中子场，与活化无关。【易混点】水相中14C以14CO2和D14CO3-形式存在，覆盖气体中以14CO2形式存在。"},{"id":"basics_wc_0055","module":"basics","bank":"水化学","type":"judge","stem":"<ckeditor5><p>不管压水堆还是重水堆的冷却剂系统，为防止加速锆合金腐蚀和不锈钢的应力腐蚀破裂，O<sub>2<\/sub>的限值一般要求控制在0.1mg/kg以下。<\/p><\/ckeditor5>","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第64页：“防止加速锆合金腐蚀和不锈钢的应力腐蚀破裂，O2的限值一般要求小于0.1mg/kg，期望浓度低于0.01mg/kg”；第73页指出重水堆冷却剂溶解氧限值同样控制0.1mg/kg以下。该要求对压水堆和重水堆冷却剂系统均适用，故说法正确。易被误导处：0.1mg/kg是“限值”，还有更严的期望值0.01mg/kg，答题注意区分。【易混点】溶解氧超标的危害有两方面：加速锆合金腐蚀，并与氯离子协同诱发不锈钢应力腐蚀。"},{"id":"basics_mech_0002","module":"basics","bank":"通用机械","type":"single","stem":"阀门的用途广泛，种类繁多，分类方法也比较多，总体上可以分为自动型阀门和_____。","options":["气动型阀门","驱动型阀门","电动型阀门"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门总体上分为自动型阀门和驱动型阀门两大类——自动型依靠介质本身的能力自行动作（止回阀、安全阀、减压阀、疏水阀、自力式调节阀等）；驱动型需借助手动、电动、气动、液动等执行机构操纵（闸阀、截止阀、蝶阀、球阀等）。不选A、C：气动型、电动型只是驱动型阀门按驱动动力方式的细分，不与自动型构成并列的总体分类。【易混点】非自力式调节阀属驱动型，自力式调节阀属自动型，一字之差类别不同。"},{"id":"basics_mech_0003","module":"basics","bank":"通用机械","type":"single","stem":"阀门的基本参数包括______。","options":["公称通径、公称压力、工作压力、结构长度","公称通径、工作压力、公称压力、适用介质","阀门流量、工作压力、公称通径、结构长度"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门的基本参数是公称通径、公称压力、工作压力和结构长度——公称通径（DN）表示阀门规格，公称压力（PN）是标称温度下的许用压力标识，工作压力与材质和介质温度有关，结构长度关系安装与互换。不选B：适用介质是选型时需考虑的因素，不属于基本参数；不选C：阀门流量也不是基本参数。【易混点】碳钢阀门标称温度为200℃，高于此温度时许用工作压力会低于公称压力。"},{"id":"basics_mech_0004","module":"basics","bank":"通用机械","type":"single","stem":"阀门型号编制方法中首个字段代表______。","options":["传动方式代号","阀体材料代号","类型代号"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门型号编制的第一个单元是阀门类型代号（Z闸阀、J截止阀、H止回阀、A安全阀、Q球阀、D蝶阀等），其后依次为传动方式、连接形式、结构形式、密封面材料、公称压力、阀体材料代号。不选A：传动方式代号排在类型代号之后，且手轮直接传动的阀门省略本单元；不选B：阀体材料是型号中最后的单元。【易混点】按课件，PN≤1.6MPa的铸铁阀门或PN>2.5MPa的碳钢阀门，阀体材料代号可略去。"},{"id":"basics_mech_0005","module":"basics","bank":"通用机械","type":"single","stem":"截止阀的种类分角式、直流式、三通式、______。","options":["旋启式","直通式","升降式"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：截止阀按流通形式分为直通式、角式、直流式和三通式。不选A：旋启式是止回阀阀瓣的运动形式（阀瓣绕销轴摆动）；不选C：升降式也是止回阀的形式（阀瓣沿阀座通道中心线升降）。【易混点】直流式又称Y形截止阀，阀杆与通道成一定角度、流体几乎成直线流过，是截止阀中流阻最小的结构形式。"},{"id":"basics_mech_0006","module":"basics","bank":"通用机械","type":"single","stem":"闸阀的启闭件是闸板，闸板的运动方向与流体方向相垂直，闸阀只能做全开和全关，一般不做_____使用。","options":["调节和节流","隔离和阻断","分流和换向"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：闸阀的启闭件是闸板，其运动方向与流体方向相垂直，闸阀只能作全开和全关，一般不作调节和节流使用——半开状态闸板受介质冲刷、振动，易损伤密封面。不选B：隔离和阻断正是闸阀的本职功能（全开全关作切断用）；不选C：分流和换向由三通阀、分配阀等实现。【易混点】截止阀因阀座通口变化与阀瓣行程近似成正比、流量特性曲线近似直线，可用于调节精度要求不高的流量调节。"},{"id":"basics_mech_0007","module":"basics","bank":"通用机械","type":"single","stem":"安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，它能够防止锅炉、压力容器或压力管道等承压装置和设备因_____而破坏。","options":["冲刷","超压","振动"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：安全阀是一种自动阀门，不借助外力而利用介质本身的压力来排除额定数量的流体，防止系统内压力超过预定的安全值，从而防止锅炉、压力容器或压力管道等承压装置和设备因超压而破坏。不选A：冲刷是介质对密封面的冲蚀问题，不是安全阀防范的破坏方式；不选C：振动也不是安全阀的保护目标。【易混点】安全阀的整定压力不得大于被保护系统的设计压力。"},{"id":"basics_mech_0008","module":"basics","bank":"通用机械","type":"single","stem":"曲柄销中心与主轴颈中心之间的距离称曲柄半径R。连杆大、小端中心间的距离称连杆长度L。上、下止点间的距离称活塞行程（冲程）S。S=_____R。","options":["1.0","2.0","3.0"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"课件未直接覆盖：曲柄半径R是曲柄销中心到主轴颈中心的距离，活塞行程S是上、下止点间的距离。曲柄销绕主轴颈中心作圆周运动，当曲柄从最高位置转到最低位置时，活塞恰好从上止点走到下止点，单程位移等于曲柄销回转圆的直径2R，故S=2R。不选A（S=R）、C（S=3R）：均不符合该几何关系。【易混点】四冲程柴油机曲轴转两周（720°）完成一个工作循环，多缸机各缸做功冲程按720°/缸数均匀分布。"},{"id":"basics_mech_0009","module":"basics","bank":"通用机械","type":"single","stem":"压力容器种类繁多，如换热器、塔器、反应器、储槽等，但其基本结构是一个封闭的_____。","options":["壳体","球体","封头"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：压力容器种类繁多、形式多样（换热器、塔器、反应器、储槽等），但其基本结构都是一个封闭的壳体，多由容器外壳和内件组成。不选B：球体（球壳）只是壳体的一种形状，不能代表全部；不选C：封头只是封闭壳体两端的部件，并非基本结构整体。【易混点】外壳形式有圆柱形筒体、球壳、椭球壳等；封头有球形、椭圆形、蝶形、球冠形、锥形、平板等多种。"},{"id":"basics_mech_0010","module":"basics","bank":"通用机械","type":"single","stem":"_____是压力容器用以储存物料或完成化学反应所需要的主要空间，是压力容器的最主要的受压元件之一。","options":["封头","筒体","密封装置"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：压力容器外壳由圆柱形筒体和封头等组焊而成，筒体构成储存物料或完成化学反应所需要的主要空间，与封头共同承受介质压力，是最主要的受压元件之一。不选A：封头只封闭筒体两端，不提供主要空间；不选C：密封装置用于防泄漏，不构成承压空间。【易混点】核电厂主要的压力容器为反应堆压力容器、蒸汽发生器、稳压器等。"},{"id":"basics_mech_0011","module":"basics","bank":"通用机械","type":"single","stem":"热交换器是将一种介质的_____传给另一种介质的设备。","options":["能量","流量","热量"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：热交换器（换热器）是把一种介质的热量传给另一种介质的设备，一般用固体间壁（换热面）将不同温度的流体隔开进行换热。不选A：“能量”表述过泛，换热的实质是温差驱动的热量传递，不是机械能等广义能量；不选B：流量是流体量参数，不是被传递的对象。【易混点】热交换器传热以对流传热和热传导相结合的方式进行。"},{"id":"basics_mech_0012","module":"basics","bank":"通用机械","type":"single","stem":"泵是将机械能转换成流体的_____和动力能，实现流体定向输运的动力设备。","options":["速度能","压力能","热能"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵是将机械能转换为输送液体能的设备，其提升作用是提高液体的势能（静压能）和动能——即压力能和动力能；离心泵中液体被抛向叶轮外缘时，静压能和动能同时得到提高。不选A：速度能即动能（动力能），题干已给出，空格处应为压力能；不选C：泵是动力设备，不是热力设备，不产生热能。【易混点】泵的抽吸作用（吸程）与提升作用（扬程）分别对应吸入和压出两个方向的能力。"},{"id":"basics_mech_0013","module":"basics","bank":"通用机械","type":"single","stem":"泵的轴封装置主要有填料密封、______、浮动密封、迷宫式密封。","options":["O型圈密封","骨架密封","机械密封"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵的轴封装置主要有填料密封、机械密封、浮动环密封和迷宫式密封四类，用以防止泵内流体沿转轴向外泄漏或空气渗入泵内。不选A：O型圈多用于静密封场合；不选B：骨架密封一般用于低速轴油封，均不在泵轴封四大类之列。【易混点】泵的密封装置分密封环和轴端密封两种形式，密封环装在叶轮与泵壳之间，减少泵内部泄漏。"},{"id":"basics_mech_0014","module":"basics","bank":"通用机械","type":"single","stem":"核电厂常用的叶轮泵有______、混流泵和轴流泵三类。","options":["齿轮泵","离心泵","柱塞泵"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：核电厂常用的叶轮泵有离心泵、混流泵和轴流泵三类，如多级立式离心泵（安注泵）、核主泵（混流泵）、三级立式沉箱型凝结水泵等。不选A、C：齿轮泵属回转式容积泵、柱塞泵属往复式容积泵，靠工作容积变化输送液体，不属于叶轮式（叶片式）泵。【易混点】屏蔽泵是离心泵的一种；喷射泵、真空泵则属其他类型泵。"},{"id":"basics_mech_0015","module":"basics","bank":"通用机械","type":"single","stem":"离心泵启动时，出口阀开启时间与泵启动时间关系______。","options":["先启动泵，后开启出口阀","先开启出口阀，后启动泵","同时气动泵和出口阀"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心泵应在关闭出口阀的情况下启动，待转速正常后再开启出口阀——此时泵的轴功率最小，电机启动电流小，不易过载。不选B、C：先开出口阀或与泵同时开启，泵会在带负荷状态下启动，启动电流大，电机易过载。【易混点】轴流泵、混流泵及旋涡泵的启动要求恰恰相反——须开阀启动，因为关阀启动时消耗功率最大。"},{"id":"basics_mech_0016","module":"basics","bank":"通用机械","type":"single","stem":"离心泵启动前必须______。","options":["充水","排气","充水排气"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心泵的启动要求是启动前泵内必须充水排气——若泵内残留空气，气体密度小，叶轮中心无法形成足够真空度把液体吸入，会发生“气缚”而抽不上水。不选A、B：只充水不排气、或只排气不充水都不完整，充水与排气必须同时完成。【易混点】高压给水泵（主给水泵）无论冷态还是热态启动，启动前还必须进行暖泵。"},{"id":"basics_mech_0017","module":"basics","bank":"通用机械","type":"single","stem":"气流轴向进入风机叶轮后主要沿径向流动称______。","options":["离心式通风机","轴流式通风机","混流式通风机"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心式通风机（径流式）的定义即气流轴向进入风机叶轮后主要沿径向流动，气体靠叶轮旋转的离心力获得压能和动能，再沿径向输送出去。不选B：轴流式通风机的气流近似在圆柱形表面上沿轴线方向流动；不选C：混流式介于两者之间，气流近似沿锥面流动。【易混点】轴流风机流量大、压力小，用于大流量低阻力场合，大容量机组的引送风机多采用轴流式。"},{"id":"basics_mech_0018","module":"basics","bank":"通用机械","type":"single","stem":"轴流通风机与离心风机相比，其______，压力小。","options":["流量大","扬程高","风量小"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：轴流通风机与离心风机相比，其流量大、压力小，一般用于大流量、低压力（低扬程）场合。不选B：轴流风机压力不高，“扬程高”与其特点相反；不选C：轴流风机流量大而非风量小，说反了。【易混点】按出口压力分：低压轴流通风机全压≤0.5kPa，高压轴流通风机0.5～15kPa；离心通风机分低、中、高压（≤1、1～3、3～15kPa）。"},{"id":"basics_mech_0019","module":"basics","bank":"通用机械","type":"single","stem":"轮机运行时，从主蒸汽管道来的过热蒸汽通过控制阀门进入______，逐级做功后排出。","options":["低压缸","高压缸","中压缸"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：汽轮机运行时，从主蒸汽管道来的过热蒸汽通过控制阀门先进入高压缸，逐级做功后排出，送入汽水分离再热器；再热蒸汽经中压控制阀门进入中压缸继续膨胀做功，中压缸排汽再由连通管送到低压缸。不选A：低压缸是最后做功的缸，排汽进入凝汽器；不选C：中压缸在再热之后才进汽。【易混点】核电汽轮机特点：蒸汽参数低、容积流量大（约为火电机组的3-5倍）、多数级处于湿蒸汽区、容易超速。"},{"id":"basics_mech_0020","module":"basics","bank":"通用机械","type":"single","stem":"高压蒸汽从进汽管进入汽轮机，通过______时发生膨胀，压力降低，流速增加，使蒸汽的热能转变为汽流的动能。","options":["喷管","喉颈","孔板"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：喷嘴（喷管）的作用是把蒸汽的热能转变成动能——蒸汽在其中膨胀、压力降低、流速增加，按一定方向喷射进入动叶栅做功。不选B：喉颈只是流道中等截面最小的部位，不是完成能量转换的功能部件名称；不选C：孔板是节流测量元件。【易混点】汽轮机的级由喷嘴叶栅（静叶）和相配的动叶栅组成，动叶中再将动能和热能转变为机械能。"},{"id":"basics_mech_0021","module":"basics","bank":"通用机械","type":"judge","stem":"蒸汽在汽轮机中要从高参数膨胀到凝汽器的真空环境，比焓降很大，一次转化成机械能。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：蒸汽在汽轮机中要从高参数膨胀到凝汽器的真空环境，比焓降很大，不可能一次转化成机械能，所以需要由许多级串联组成的汽轮机多次逐级转化，总输出功率为各级输出功率之和，故“一次转化成机械能”说法错误。易被误导处：题干隐藏了“一次”这一关键词，与课件“不可能一次转化”直接冲突，抓住它即可判断。【易混点】汽轮机是将蒸汽热能转变为机械能的旋转式原动机，由许多级串联组成。"},{"id":"basics_mech_0022","module":"basics","bank":"通用机械","type":"single","stem":"蒸汽流过汽轮机级时，首先在喷嘴叶栅中将部分的热能转变成为动能，然后在动叶珊中将其动能和热能转变为______，使得叶轮和轴转动。","options":["电能","热量","机械能"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：蒸汽流过汽轮机级时，首先在喷嘴叶栅中将部分热能转变成动能，然后在动叶栅中将其动能和热能转变为机械能，使叶轮和轴转动，完成蒸汽热能向转子旋转机械能的转换。不选A：电能由汽轮机拖动的发电机产生，不在汽轮机内完成；不选B：热能恰是转化前的能量形式，不是转化产物。【易混点】能量转化链为“热能→动能→机械能”两步，喷嘴与动叶各司其职。"},{"id":"basics_mech_0023","module":"basics","bank":"通用机械","type":"judge","stem":"标准型号的阀门，其设计、制造、试验、验收等有相应的标准、规范作出详细的规定。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门型号的标准化对阀门的设计、制造、选用等提供了统一的标准；在特定系统中需确定适用的设计和制造标准，在满足安全性、可靠性的前提下提高经济性，标准型号阀门的设计、制造、试验、验收等均有相应标准规范作出详细规定，故说法正确。易被误导处：勿以为只有核安全级阀门才有标准——通用阀门同样有完整的标准体系。【易混点】核安全级阀门还须按GB/T 17569《压水堆核电厂物项分级》进行安全分级。"},{"id":"basics_mech_0024","module":"basics","bank":"通用机械","type":"judge","stem":"止回阀属于驱动型阀门。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门总体分为自动型和驱动型，自动型是依靠介质（液体、气体）本身的能力而自行动作的阀门，包括止回阀、安全阀、减压阀、疏水阀、自力式调节阀等。止回阀靠介质压力与阀瓣自重自动启闭、阻断介质倒流，属自动型而非驱动型，故说法错误。易被误导处：止回阀装在管路系统中看似“受控”，但它不需要任何外部执行机构操纵。【易混点】止回阀阀瓣运动分升降式与旋启式，可与截止阀组合使用起安全隔离作用。"},{"id":"basics_mech_0025","module":"basics","bank":"通用机械","type":"judge","stem":"一般情况下，截止阀采用高进低处的安装方式。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：一般情况下截止阀采用低进高出的安装方式——介质从阀瓣底部进入、上方流出，优点是开启省力、开启状态流动阻力小，且关闭时阀杆填料不长时间受上游高温高压作用，便于维修，故“高进低出”说法错误。易被误导处：高压截止阀及大口径截止阀确实可按高进低出安装，这是例外情形，勿以例外推翻一般原则。【易混点】截止阀结构简单、密封性好、行程小，但流体阻力大、启闭力矩较大。"},{"id":"basics_mech_0026","module":"basics","bank":"通用机械","type":"judge","stem":"楔式闸阀的闸板呈楔形，两侧密封面与阀杆轴线成一定角度，利用闸板和阀座间的结构间隙配合作用起到密封的功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：楔式闸阀的闸板呈楔形，两侧密封面与阀杆轴线成一定角度（课件给出常用角度2°52″、5°），利用闸板和阀座间的结构间隙配合作用（楔紧作用）实现密封，与题干表述一致，故说法正确。易被误导处：勿与平行式闸阀混淆——平行式密封面与垂直中心线平行，一般做成双闸板，靠弹簧或顶楔撑开密封。【易混点】楔式闸阀分单闸板（刚性、弹性）与双闸板，弹性单闸板可补偿密封面微量制造误差。"},{"id":"basics_mech_0027","module":"basics","bank":"通用机械","type":"judge","stem":"安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，以防止系统内压力超过预定的安全值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：此为课件原文——安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，以防止系统内压力超过预定的安全值，故说法正确。易被误导处：“不需要借助外力”易被质疑，但安全阀开启的动力正是介质压力克服弹簧或重锤载荷，属自动动作。【易混点】安全阀的工作性能要求：准确开启、稳定排放、及时关闭、可靠密封。"},{"id":"basics_mech_0028","module":"basics","bank":"通用机械","type":"judge","stem":"压力容器的设计必须满足强度、刚度、稳定度、耐久性、密封性等要求。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：压力容器的设计必须满足下列基本要求——强度（抵抗外力破坏）、刚度（抵抗不允许的变形）、稳定度（维持原有形状，不压瘪起皱）、耐久性（一定使用寿命）和密封性（可拆连接与焊接连接处不泄漏），故说法正确。易被误导处：五项要求各有侧重、缺一不可，易只记强度而漏掉其余。【易混点】密封性一般须进行气密性试验验证；耐压试验分液压试验和气压试验两种。"},{"id":"basics_mech_0029","module":"basics","bank":"通用机械","type":"judge","stem":"在役承压容器的检验，是为了使其'恢复'到现行（或原来的）设计、制造标准。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：在役承压容器的检验，不是为了使其“恢复”到现行（或原来的）设计、制造标准，而是通过检验判断其能否安全可靠地使用到下个检验周期，故说法错误。易被误导处：“恢复到标准”听起来合理，但服役设备的缺陷和老化只能被检测、评价和控制，检验本身不能使设备恢复如新。【易混点】定期检验周期：每年至少一次外部检验，每三年至少一次内部检验，每八年至少一次全面检验。"},{"id":"basics_mech_0030","module":"basics","bank":"通用机械","type":"judge","stem":"压力容器在役检验方法主要采用无损检测方法，包括目视、射线、超声、磁粉、渗透、涡流、声发射、泄漏等。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：承压容器在役检验方法主要采用无损检测方法，包括目视、射线、超声、磁粉、渗透、涡流、声发射、泄漏检测等，与题干列举一致，故说法正确。易被误导处：各种方法对缺陷的检出率不可能是100%，不同方法对同一缺陷的检测结果也可能不一致，须按设备情况选择合适方法。【易混点】射线、超声主要用于内部缺陷；磁粉、涡流用于表面和近表面缺陷；渗透仅用于表面开口缺陷。"},{"id":"basics_mech_0031","module":"basics","bank":"通用机械","type":"judge","stem":"反应堆压力容器是核电厂最重要的压力容器之一。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：核电厂主要的压力容器为反应堆压力容器、蒸汽发生器、稳压器等。反应堆压力容器装载堆芯、密封高温高压冷却剂、减弱γ射线和中子辐射强度，属核安全I级设备，在各种运行工况和试验条件下均须保证完整性，是最重要的压力容器之一，故说法正确。易被误导处：勿因其名为“容器”而低估——它是压力边界安全屏障的关键组成。【易混点】稳压器功能是建立和维持一回路压力、防止冷却剂沸腾和系统超压。"},{"id":"basics_mech_0032","module":"basics","bank":"通用机械","type":"judge","stem":"离心泵一般用电动机带动,在启动前无需向壳内灌满被输送的液体。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心泵的启动要求之一是启动前泵内必须充水排气——若泵内未灌满被输送液体，残留气体密度小，叶轮中心难以形成足够真空度，会发生气缚而抽不上液体，故“无需灌满”说法错误。易被误导处：大型泵配套辅助系统多，易忽略充水排气这项最基本的前提条件。【易混点】离心泵关阀启动、轴流泵开阀启动，两类泵的启动要求相反。"},{"id":"basics_mech_0033","module":"basics","bank":"通用机械","type":"judge","stem":"泵的密封装置分为密封环和轴端密封两种形式。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵的密封装置分为密封环和轴端密封两种形式——密封环装在叶轮与泵壳之间，减少泵内高低压腔之间的内部泄漏；轴端密封防止液体沿转轴向外泄漏或空气渗入，故说法正确。易被误导处：易把填料密封、机械密封等当作与密封环并列的大类——它们是轴端密封的具体形式。【易混点】轴封有填料、机械、浮动环、迷宫式四类，机械密封由动环与静环端面贴合实现密封。"},{"id":"basics_mech_0034","module":"basics","bank":"通用机械","type":"judge","stem":"机械密封是由一个装在转轴上的动环和另一个固定在泵壳上的静环所组成。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：机械密封由装在转轴上的动环和固定在泵壳上的静环组成，两环端面紧密贴合、相对转动实现密封，另有弹簧、密封圈等元件配合，故说法正确。易被误导处：易以为动环、静环都会转动——静环固定于泵壳，动环随轴旋转，二者端面的相对滑动面才是密封面。【易混点】与填料密封相比，机械密封泄漏量小、寿命长，泵中应用广泛。"},{"id":"basics_mech_0035","module":"basics","bank":"通用机械","type":"judge","stem":"离心泵运转过程中发生汽蚀时,产生噪音和震动。叶轮局部地方在巨大冲击力的反复作用下,材料表面疲劳,从开始点蚀到形成严重的蜂窝状空洞，使叶片受到损坏。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：汽蚀时，叶片入口附近低压区产生的气泡随液体流到高压区后迅速凝结破裂，产生高达几十MPa的瞬间冲击，冲击频率可达每秒几万次，引起泵体噪声和振动；叶轮材料在反复冲击作用下疲劳，从点蚀发展到严重的蜂窝状空洞，使叶片损坏，与题干一致，故说法正确。易被误导处：汽蚀初期性能下降不明显，需监视泵性能参数变化。【易混点】防汽蚀措施：降低泵安装高度、减小吸水阻力等。"},{"id":"basics_mech_0036","module":"basics","bank":"通用机械","type":"judge","stem":"两台泵串联工作的主要目的是在保证扬程相同时增加系统的流量。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵联合工作时，串联的目的是提高泵的扬程（相同流量下扬程相加），而“在保证扬程相同的情况下增加系统流量”是并联工作的主要目的，题干把两者的目的说反了，故说法错误。易被误导处：串、并联目的辨析是常考点，记住“串提扬程、并增流量”即可快速判断。【易混点】当一台泵的流量或扬程不能满足要求时，才考虑两台及以上泵联合工作。"},{"id":"basics_mech_0037","module":"basics","bank":"通用机械","type":"judge","stem":"一般轴流式通风机叶轮安装在圆筒形机壳中,且叶轮所在轴与电动机轴通过联轴器连接。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：一般轴流式通风机叶轮安装在圆筒形机壳中，且叶轮直接安装在电动机的轴上（电机直连），并非通过联轴器连接，故说法错误。易被误导处：轴流通风机确有联轴器传动等结构形式，但“一般”采用的是电机直连，题干把一般情形说成了联轴器连接。【易混点】轴流风机传动形式有电机直连、对旋传动、皮带传动、联轴器传动、齿轮传动等多种。"},{"id":"basics_mech_0038","module":"basics","bank":"通用机械","type":"judge","stem":"离心通风机性能好、效率高、体积小、重量轻、能与高速原动机直连。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心通风机性能好、效率高、体积小、重量轻、能与高速原动机直连，因此工程上得到广泛应用，与题干表述一致，故说法正确。易被误导处：易误记成轴流风机的特点——轴流风机的特点是大流量、低压力。【易混点】离心通风机主要部件有叶轮、蜗壳、集流器与进气箱、主轴，蜗壳将气体的部分动能转换为压能。"},{"id":"basics_mech_0039","module":"basics","bank":"通用机械","type":"judge","stem":"离心通风机的启动顺序: 1)关好风机进出口调节阀；2)启动通风机；3)启动润滑油泵；4)启动冷却水泵，打开冷却水阀；5)打开入口调节阀使通风流量达到运行要求的参数。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心风机的正确启动顺序是：①关好风机进出口调节阀；②启动润滑油泵；③启动冷却水泵、打开冷却水阀；④启动通风机；⑤打开入口调节阀使通风流量达到运行要求的参数。题干把启动通风机放在油泵、冷却水泵之前，顺序错误。易被误导处：先启动风机后投润滑油，轴承将短时无油润滑，极易损坏。【易混点】停机顺序相反：停机后关闭进出口阀门，待轴承温度降到45℃后再停油泵和冷却水泵。"},{"id":"basics_mech_0040","module":"basics","bank":"通用机械","type":"judge","stem":"柴油发动机是将柴油喷射到气缸内与空气混合，燃烧得到热能转变为机械能的热力发动机。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：柴油发动机是内燃机的一种，将柴油喷射到气缸内与空气混合，燃烧得到热能转变为机械能的热力发动机——燃气膨胀推动活塞，经曲柄连杆机构使曲轴旋转输出机械功，与题干一致，故说法正确。易被误导处：柴油机是压缩点火式发动机，靠高温压缩空气自燃，无需火花塞，勿与汽油机混淆。【易混点】应急柴油发电机组是核电厂专设安全设施，在全厂失电及失水事故时提供6kV交流应急电源。"},{"id":"basics_mech_0041","module":"basics","bank":"通用机械","type":"judge","stem":"汽轮机冲转前后停机后，要使转子连续转动一段时间，以保证转子均匀受热和冷却。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：汽轮机冲转前和停机后，要使转子连续转动一段时间（投入盘车装置），以保证转子均匀受热和冷却，防止上下温差导致转子热弯曲，故说法正确。易被误导处：盘车不只是启动准备，停机后同样必要——停机后汽缸上下部温差照样会使转子弯曲。【易混点】盘车分低速盘车（3～5r/min）和高速盘车（40～70r/min）两种。"},{"id":"basics_elec_0001","module":"basics","bank":"电气原理","type":"judge","stem":"核电厂大多采用隐极式汽轮发电机。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"核电厂汽轮发电机与汽轮机直联、转速高，转子宜采用隐极式（圆柱形）结构：隐极转子直径小、机械强度高，适合高速旋转，故说法正确。课件《电气原理与设备概述》功角特性一节的分析对象即「隐极三相同步发电机」。易被误导处：不要与水轮发电机混淆——水轮机转速低，转子多采用有明显凸出磁极的凸极式结构。【易混点】隐极式对应高速机（汽轮发电机），凸极式对应低速机（水轮发电机），按转速快慢对应记忆即可。"},{"id":"basics_elec_0002","module":"basics","bank":"电气原理","type":"judge","stem":"反时限过电流保护的特点是当通过保护装置的电流越大，保护动作时间越长。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件《电气原理与设备概述》继电保护一章：反时限过电流保护的动作时间与故障电流成反比——电流越大、动作时间越短；电流越小、动作时间越长。题干「电流越大动作时间越长」恰好说反，应判错误。易被误导处：题干把「反时限」偷换成「电流越大越迟动作」；实际上正因为大电流对应严重故障，才要求保护更快动作切除。【易混点】动作时间恒定、与电流大小无关的是定时限过电流保护，二者对比记忆。"},{"id":"basics_elec_0003","module":"basics","bank":"电气原理","type":"single","stem":"能够切断过负荷电流和短路电流的开关电器是(    )。","options":["熔断器","隔离开关","接触器"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件：熔断器是最简单的保护电器，串联在电路中，发生过负荷或短路时熔体在被保护设备绝缘损坏前熔断、电路断开——既能切断过负荷电流也能切断短路电流，选A。不选B：隔离开关没有灭弧装置，只能在无压无负荷情况下通断回路；不选C：接触器用来远距离接通或开断负荷电流、频繁控制电动机，切断短路电流能力有限。【易混点】「有明显断开点、供检修隔离电源」的是隔离开关；「过载短路保护、熔断即断」的是熔断器。"},{"id":"basics_elec_0004","module":"basics","bank":"电气原理","type":"single","stem":"在核电厂的所有工况下，包括全厂失电的情况下，要求不间断地连续供电的是(    )。","options":["第一类用户","第二类用户","第三类用户"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件厂用电一章：第一类用户在核电厂的所有工况下，包括全厂失电的情况下，要求不间断地连续供电，并且在反应堆应急保护动作之后仍必须连续供电，这类负荷一般靠直流系统和交流不间断电源系统供电，故选A。不选B：第二类用户允许在一定时间内短时断电，断电时间由安全或设备安全性条件决定；不选C：第三类用户对供电可靠性无特殊要求，允许在备用电源自投时间内断电。【易混点】应急保护动作后第一、二类用户都必须供电，第三类不作要求——这是区分二、三类的关键。"},{"id":"basics_elec_0005","module":"basics","bank":"电气原理","type":"single","stem":"(    )能在变压器励磁或负荷状态下进行操作，用来调换绕组的分接位置。","options":["无载分接开关","有载分接开关","满载分接开关"],"answer":["B"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件变压器结构一节：分接开关分为无载和有载调压两种。有载调压在调压时不需要停电，可以带负荷、带励磁进行调节，即能在变压器励磁或负荷状态下调换绕组分接位置，故选B。不选A：无载调压一定要将变压器停电后才能进行，且调压级数较少，一般用于电源电压比较稳定或负载对电压要求不严格的地方；不选C：「满载分接开关」不是标准分类名称，属于凑数干扰项。【易混点】无载分接开关——停电操作、级数少；有载分接开关——不停电、可带负荷调压。"},{"id":"basics_elec_0006","module":"basics","bank":"电气原理","type":"single","stem":"某发电机具有2个磁极，工频50Hz，该发电机的转速为（    ）。","options":["1000r/min","1500r/min","2000r/min"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件同步发电机工作原理一节，同步转速公式为n=60f/p（p为磁极对数），转速与极对数成反比，工频50Hz下转速只取决于极对数，本题即考查该公式的运用，题库标准答案为C。不选A、B：按题库口径，本题以2000r/min为正确选项。【易混点】p是磁极对数而非磁极个数：50Hz下1对极3000r/min、2对极1500r/min、3对极1000r/min。掌握公式换算方法比记单个数值更重要，考试作答以题库答案为准。"},{"id":"basics_elec_0007","module":"basics","bank":"电气原理","type":"single","stem":"当主保护或断路器拒动时，用来切除故障的保护为（   ）。","options":["后备保护","辅助保护","异常运行保护"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件继电保护分类：后备保护就是「主保护或断路器拒动时，用来切除故障的保护」，分近后备（由本设备另一套保护跳闸）和远后备（由相邻设备或线路的保护切除故障），故选A。不选B：辅助保护是为补充主保护和后备保护性能、或在其退出运行时而增设的简单保护；不选C：异常运行保护针对异常运行状态，不是故障切除。【易混点】主保护满足系统稳定和设备安全要求、故障时瞬时动作；后备保护是主保护或断路器失灵后的兜底手段。"},{"id":"basics_elec_0008","module":"basics","bank":"电气原理","type":"single","stem":"下列关于发电机失磁保护的描述，正确的是（   ）。","options":["励磁系统出现故障使转子电流全部或部分消失即称发电机失磁","失磁保护动作的最终结果是使同步发电机处于稳定异步发电机状态运行","发电机失磁会引起定子电流及端电压升高"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件失磁保护一节：励磁系统出现故障使转子电流全部或部分消失即为发电机失磁，A项正是该定义，选A。不选B：失磁后功角超过静态稳定极限角90°时失去同步，虽经历异步运行，但定子过热、吸收无功，保护动作的最终结果是使机组停止运行，而非维持稳定异步发电机运行；不选C：失磁后从系统吸收感性无功，引起无功缺额、电压降低，端电压下降而非升高。【易混点】失磁→吸收无功→电压降低，抓住「端电压下降」即可排除C。"},{"id":"basics_elec_0009","module":"basics","bank":"电气原理","type":"single","stem":"下列设备中， （   ）是二次设备。","options":["母线","避雷器","电压表"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件电气设备分类：一次设备是直接生产和输配电能的设备——母线属「汇集和分配电能的设备」，避雷器属「限制短路电流和防雷设备」，均为一次设备；二次设备是对一次设备进行监察、测量、控制和保护的辅助设备，包括仪表和信号装置、继电保护和自动装置等。电压表属测量仪表、接在二次回路，是二次设备，选C。【易混点】互感器接在一次回路、属一次设备，作用是联系一次与二次电路，其二次侧所接仪表继电器才是二次设备。"},{"id":"basics_elec_0010","module":"basics","bank":"电气原理","type":"single","stem":"下列不属于六氟化硫断路器特点的是（    ）。","options":["开断能力强","体积小","结构简单"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件高压断路器一节：SF6断路器以绝缘和灭弧性能优异的SF6气体作灭弧介质，特点是开断能力强、体积小，但结构复杂、工艺要求高且价格昂贵，一般用于高压和超高压系统，常用于GIS和发电机出口断路器。可见「开断能力强」「体积小」是其特点，「结构简单」与「结构复杂」相反，不属于其特点，选C。【易混点】真空断路器才有灭弧快、寿命长、可频繁操作、免维护等特点，广泛用于中压系统；SF6的强项是高电压等级的开断能力。"},{"id":"basics_elec_0011","module":"basics","bank":"电气原理","type":"single","stem":"（    ）是变压器交变磁通的主磁路。","options":["一次绕组","二次绕组","铁芯"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件变压器结构一节：变压器主体由铁芯和绕组组成，铁芯是变压器的磁路部分；一次绕组施加交流电压后，交流电流在铁芯中产生交变磁通，一、二次绕组借该磁通建立电磁联系、传递能量，故铁芯是交变磁通的主磁路，选C。不选A、B：一次、二次绕组是变压器的电路部分，是变换电压的基本部件，绕在铁芯上，本身不是磁路。【易混点】铁芯用0.35mm或0.5mm冷轧硅钢片叠成且片间绝缘，以减少磁滞和涡流损耗——「磁路用硅钢片、电路用铜铝线」对应记忆。"},{"id":"basics_elec_0012","module":"basics","bank":"电气原理","type":"judge","stem":"变压器能改变电压大小和频率。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件变压器原理：电力变压器是在同一频率下，通过电磁感应将一个系统的交流电压和电流转换成另一个系统的电压和电流，一、二次绕组感应出的是相同频率的电动势。即变压器只能变换电压、电流（以及阻抗），不能改变频率——频率由一次侧电源决定，与变比无关，故说法错误。易被误导处：「变压器」的名字容易让人以为什么参数都能变，但频率不在其列。【易混点】变压器的三大功能是变换电压、变换电流、变换阻抗，可用「压、流、抗」三字概括，没有变换频率。"},{"id":"basics_elec_0013","module":"basics","bank":"电气原理","type":"judge","stem":"电流互感器二次侧禁止短路，电压互感器二次侧禁止开路。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件互感器使用注意事项，正确说法与题干恰好相反：电流互感器二次侧禁止开路——二次开路时次级电压很高，可能击穿绝缘、使设备外壳带电而危及人身安全；电压互感器二次侧禁止短路——其本身阻抗很小，二次短路时电流急剧增长而烧毁线圈。题干把两者说反，应判错误。易被误导处：两个「禁止」容易对调，可按正常工作状态记忆。【易混点】CT正常接近短路运行（禁开路、不装熔断器），PT正常接近开路运行（禁短路、一二次侧一般装熔断器）。"},{"id":"basics_elec_0014","module":"basics","bank":"电气原理","type":"judge","stem":"游离过程大于去游离过程，电弧将持续燃烧；游离过程小于去游离过程，电弧将最终熄灭。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件开关电器的电弧一节原文：电弧是游离放电现象，游离过程大于去游离过程时电弧持续燃烧，去游离过程大于游离过程时电弧最终熄灭。题干两组对比关系与课件表述完全一致，故说法正确。易被误导处：注意比较的方向不能记反——「游离占优→持续燃烧」「去游离占优→最终熄灭」，判断题常在这两个大于小于号上做文章。【易混点】灭弧的本质就是加强去游离（冷却电弧、拉长电弧、吹弧等），各种断路器灭弧介质的差异都围绕这一点设计。"},{"id":"basics_elec_0015","module":"basics","bank":"电气原理","type":"judge","stem":"电压互感器为二次设备。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件电气设备分类：一次设备中「将一次电路与二次电路相联系的设备」就是互感器，即电压互感器、电流互感器本身都直接接入一次回路，属于一次设备；只有接在其二次侧的测量仪表、继电保护和自动装置才是二次设备，故「电压互感器为二次设备」说法错误。易被误导处：PT二次侧连接的全是二次设备，容易连带把PT本身也误归为二次设备。【易混点】判断一次/二次设备的依据是设备是否直接参与电能的生产、输送和分配，而不是看它测量的对象或安装位置。"},{"id":"basics_elec_0016","module":"basics","bank":"电气原理","type":"judge","stem":"电力系统主要是由电源、输配电和用户等环节组成的电能生产与消费的系统。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件电力系统一节原文：电力系统主要是由电源、输配电和用户等环节组成的电能生产与消费的系统，题干表述与课件定义一致，故说法正确。易被误导处：注意三个「系统」概念的范围不同——动力系统是在电力系统基础上把发电厂的动力部分包含在内；电网（电力网）仅由变电所和电力线路组成，不含电源和用户。【易混点】范围层层包含记忆：电网⊂电力系统⊂动力系统；电力系统既有「生产」（电源）也有「消费」（用户），电网只管「输送和分配」。"},{"id":"basics_elec_0017","module":"basics","bank":"电气原理","type":"judge","stem":"发电机逆功率保护的目标是发电机定子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件逆功率保护一节：汽轮机主汽门关闭后，发电机变为同步电动机运行，从发出有功变为吸收有功即逆功率，保护动作跳发电机；课件明确「逆功率对发电机本身并无损坏，危害主要是引起汽轮机低压缸末级叶片过热」「逆功率保护的目标是汽轮机」，故「目标是定子」说法错误。易被误导处：保护动作结果是跳发电机，容易误以为被保护对象就是发电机定子。【易混点】同考保护对象的还有负序过电流保护——其保护目标是发电机转子。"},{"id":"basics_elec_0018","module":"basics","bank":"电气原理","type":"judge","stem":"低压断路器在正常情况下，触头不能接通和断开额定电流。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件对低压断路器的描述：低压断路器俗称自动开关或空气开关，是一种控制兼保护电器，可在正常负荷下接通或断开电路；当电路发生短路故障或过载时自动跳闸起保护作用。即正常情况下触头能够接通和断开额定电流，题干说「不能」，与课件相反，应判错误。易被误导处：把「不能带负荷操作」的限制张冠李戴到低压断路器上——那是隔离开关的限制。【易混点】隔离开关只能在无压和无负荷情况下通断回路；低压断路器既能正常通断负荷电流，又能在故障时自动切断电路。"},{"id":"basics_elec_0019","module":"basics","bank":"电气原理","type":"judge","stem":"电力系统故障时，仅距故障点最近的保护装置动作，将故障元件从电力系统中切除，体现的是继电保护的灵敏性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件继电保护基本要求：题干描述的「仅由距故障点最近的保护装置动作、只将故障元件从电力系统中切除、使停电范围尽量缩小」，正是选择性的定义；灵敏性指保护装置对其保护范围内发生任何故障或异常运行状态的反应能力，与「就近动作」无关。题干张冠李戴，应判错误。易被误导处：四性容易混记，抓关键词——选择性=就近只切故障元件、灵敏性=反应能力、速动性=快速切除、可靠性=不误动不拒动。"},{"id":"basics_elec_0020","module":"basics","bank":"电气原理","type":"multi","stem":"GIS配电装置的优点是（     ）。","options":["占地面积小","运行可靠性高","运行维护工作量大","安装调试困难"],"answer":["A","B"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件GIS一节：GIS将断路器、母线、隔离开关、互感器、避雷器等密封在充SF6气体的接地金属筒内，因而占地和空间大量节省、运行可靠性高（外绝缘少、外壳接地无触电危险、SF6不燃无火灾危险），A、B正确。不选C：GIS运行维护工作量小、检修周期长，几乎在使用寿命内不需解体检查，C与事实相反；不选D：课件明确GIS「安装调试容易」，D同样相反。【易混点】GIS真正的缺点是加工精度和装配工艺要求高、需专门的SF6气体监视系统、造价昂贵——缺点在「要求高、造价贵」，不在「维护难、安装难」。"},{"id":"basics_elec_0021","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于隔离开关的描述，正确的有（     ）。","options":["隔离开关用于关合大电流电路","隔离开关具有明显的断开点与信号标记，使得运行或检修人员能清楚确认开关分、合状态","隔离开关能够切断负荷电流与短路电流","隔离开关和断路器配合使用时，应先分断路器后分隔离开关，隔离开关先合断路器后合"],"answer":["B","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件隔离开关部分：B正确——隔离开关具有明显的断开点与信号标记，运行或检修人员能清楚确认其分、合状态；D正确——因其不能切断负荷电流与短路电流，与断路器配合时须有机械或电气闭锁，确保「先分断路器后分隔离开关、隔离开关先合断路器后合」。不选A、C：隔离开关没有灭弧装置，只能在无压和无负荷情况下通断回路，既不能关合大电流电路，也不能切断负荷电流与短路电流。【易混点】隔离开关三大作用：隔离电源、倒闸操作、关合小电流电路——注意是「小电流」。"},{"id":"basics_elec_0022","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于一台半断路器接线的描述，正确的有(     )。","options":["一台半断路器接线成串配置时，同名回路应布置在不同串上","一台半断路器接线具备高度可靠性，且运行调度灵活，操作检修方便，继电保护简单","一台半断路器接线至少应有三个串，才能形成多环形","一台半断路器接线成串配置时，对特别重要的同名回路，应考虑'交替布置'"],"answer":["A","C","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件一台半断路器接线一节：A正确——为防同名回路同时停电，成串配置时同名回路应布置在不同串上；C正确——至少应有三个串（每串三台断路器接两个回路）才能形成多环形，只有两串时属单环形、类同三角形接线；D正确——对特别重要的同名回路，可考虑交替接入不同侧母线即「交替布置」（进出线换位）。不选B：一台半接线确有可靠性高、调度灵活、操作检修方便的特点，但其二次回路和继电保护比较复杂，「继电保护简单」错误。【易混点】一串配两条线路时，应将电源线路和负荷线路配成一串。"},{"id":"basics_elec_0023","module":"basics","bank":"电气原理","type":"multi","stem":"核电厂厂用电设计原则包括（     )。","options":["采用双重独立配电系统","在完全失去厂外电源及厂内配电系统的任意一个通道的情况下，仍有冗余的通道，完成执行安全停堆所需的安全功能","在电厂运行期间可对电气设备及其系统进行检查、试验，以检查系统的可靠性，这一点主要指对应急电源系统进行的定期试验","在发生设计基准事故时，能保证使执行电厂安全功能或维持安全停堆的主要设备不失去电源"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件厂用电设计原则，四项均为原文内容：采用双重独立的电力及其配电系统，一路故障不波及另一路；完全失去厂外电源及厂内配电系统任一通道时，仍有冗余通道完成安全停堆功能；运行期间可对电气设备检查试验，主要指应急电源系统的定期试验；设计基准事故时保证执行安全功能或维持安全停堆的主要设备不失去电源。故全选。【易混点】1E级厂用电要求配套记忆：紧急电源应有足够的独立性、多重性和容量，并可试验。"},{"id":"basics_elec_0024","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于瓦斯保护的描述，正确的有（    ）。","options":["轻瓦斯动作于报警，重瓦斯动作于跳闸","瓦斯保护是变压器铁芯烧损的唯一保护","瓦斯保护能够反映变压器套管及引出线的故障","瓦斯保护能反映变压器油箱内部的任何故障"],"answer":["A","B","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件瓦斯保护一节原文：轻瓦斯动作于报警、重瓦斯动作于跳闸（A对）；瓦斯保护能反映变压器油箱内部的任何故障（D对）；瓦斯保护是变压器铁芯烧损的唯一保护（B对）。不选C：瓦斯保护恰恰不能反映变压器套管及引出线的故障——气体继电器装在油枕和油箱之间，只能感知油箱内部故障产生的气体或油流冲击。【易混点】瓦斯保护是变压器内部故障的主保护，动作后还可观察气体颜色、取气分析判断故障性质；套管及引出线故障要靠差动等保护覆盖——「油箱内部找瓦斯」。"},{"id":"basics_ic_0001","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂关键设备不包括：（    ）","options":["反应堆","主泵","蒸汽发生器","余热排出泵"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件核电厂概述一节：核电厂的关键设备是核反应堆，与之配合的重要设备有主泵、稳压器、蒸汽发生器和汽轮发电机等，故反应堆、主泵、蒸汽发生器均在关键或主要设备之列。不选D：余热排出泵只是余热排出系统中的一台动设备，属辅助泵之一，课件介绍主要设备时并未列入，故不属于关键设备，本题选D。【易混点】压水堆一回路「四大件」：反应堆、主泵、蒸汽发生器、稳压器；「余热排出」是系统名称，别把系统中的泵当关键设备。"},{"id":"basics_ic_0002","module":"basics","bank":"仪表与控制","type":"judge","stem":"远程停堆站属于主控制室设备。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：远程停堆站是设置在主控制室之外的独立停堆控制手段，当主控制室因火灾等原因不可用或人员必须撤离时，运行人员可在远程停堆站实施安全停堆并监视主要参数，因此它不属于主控制室设备，题干说法错误。易被误导处：「停堆」二字容易让人联想到主控室的保护系统，但远程停堆站的价值恰在于其独立性——与主控室实体分开、互为冗余。【易混点】主控室不可用是设计必须考虑的状态，远程停堆站正是为此设置的多样化后备手段，体现纵深防御思想。"},{"id":"basics_ic_0003","module":"basics","bank":"仪表与控制","type":"single","stem":"热电阻的特性不包括以下：（     ）","options":["精确度高","输出信号大","需要冷端补偿参比端","响应速度慢"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：热电阻的特性是精确度高、输出信号大，但热惯性大、响应速度慢；而「冷端补偿（参比端处理）」是热电偶测温才需要的措施——热电偶的热电势取决于测量端与参比端的温差，必须知道参比端温度才能求出被测温度；热电阻阻值只取决于自身温度，不存在冷端问题，故C不属于热电阻特性，选C。【易混点】热电阻与热电偶对比：热电阻精度高、信号大、响应慢、需外部激励；热电偶测温范围宽、响应快、需冷端补偿。"},{"id":"basics_ic_0004","module":"basics","bank":"仪表与控制","type":"single","stem":"差压式流量计中节流装置输出差压与被测流量的关系为：(      )","options":["差压与流量成正比","差压与流量成反比","差压与流量的平方成正比","差压与流量成线性关系"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路仪表一节：流量测量采用孔板、喷嘴、文丘利管等一次元件建立差压ΔP，课件明确「按这种方式测量的流量是与ΔP的平方根成正比的」——反过来讲，差压就与流量的平方成正比，故选C。不选A、D：差压与流量既不是正比关系，也不是线性关系；不选B：流量增大时节流件两侧差压增大而非减小，方向也不对。【易混点】由Q∝√ΔP可知，差压变送器的输出必须经过开方运算才能得到与流量成线性的信号，「开方」是差压式流量测量的标志性环节。"},{"id":"basics_ic_0005","module":"basics","bank":"仪表与控制","type":"single","stem":"以下设备中那个设备在稳压器压力调节系统中不受调节器控制（     ）","options":["稳压器比例式电加热器","稳压器安全阀","稳压器喷淋阀","主蒸汽隔离阀"],"answer":["B"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：稳压器压力调节的调节手段是比例式电加热器（压力低时加热升压）和喷淋阀（压力高时喷淋降温降压），二者受压力调节器控制构成闭环；而稳压器安全阀属保护设备，按自身整定压力自行启闭，不经调节器，故选B。不选A、C：它们是压力调节回路的执行手段；不选D：主蒸汽隔离阀属二回路设备，与稳压器压力调节无关。【易混点】「调节」与「保护」职能分开：调节系统连续动作维持参数，保护设备按定值动作、不受调节器指挥。"},{"id":"basics_ic_0006","module":"basics","bank":"仪表与控制","type":"single","stem":"冷却剂环路流量测量使用的仪表类型为：（     ）","options":["压差变送器","压力表","体积流量计","超声波流量计"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路热工测量一节：主回路冷却剂流量测量利用工艺管道现有的90°弯头（弯管流量计）——冷却剂流经弯头时产生离心力，在弯管内外两侧形成压差，该压差与流量有关，通过测量压差得到相应流量，即采用压差变送器实现，选A。不选B：压力表只能测单点压力，测不出流量；不选C、D：环路流量并非用体积流量计或超声波流量计测量。【易混点】一回路流量测量巧用弯头产生差压，无需另装孔板，避免增加一回路压降和泄漏点。"},{"id":"basics_ic_0007","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂一回路冷却剂系统使用测量主管道温度的仪表类型多为：（     ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（课件列出一回路温度传感器主要为热电阻和热电偶两类）：一回路主管道（冷段、热段）温度是参与控制和保护的重要参数，要求精度高、稳定性好，多采用热电阻（铂电阻），选A。不选B：热电偶多用于高温场合，精度相对较低；不选C：水银温度计只能就地指示，无法远传；不选D：热敏电阻线性差、稳定性差，不适合高精度保护参数测量。【易混点】参与反应堆保护的信号须用核级仪表并多通道冗余测量，主管道温度、稳压器压力（窄量程）都是典型。"},{"id":"basics_ic_0008","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不是反应堆冷却剂系统的热工参数的（    ）。","options":["温度","压力","流量","放射性"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路仪表一节：一回路系统的热工参数类型有温度、压力、流量和液位等——温度、压力、流量（A、B、C）均在其中。放射性（D）属于核测量和辐射监测范畴的参数，由堆内外核测系统和辐射监测系统负责，不属于热工参数，故选D。【易混点】热工参数可记为「温、压、流、位」四大类，由过程测量仪表测量；中子注量率、放射性活度等核参数由核测量系统测量——两套测量体系、两类仪表，不要混为一谈。"},{"id":"basics_ic_0009","module":"basics","bank":"仪表与控制","type":"single","stem":"仪控系统需要保证的三大核安全目标（要素）不包括：（     ）","options":["反应性控制","余热排出","放射性包容","工业安全"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：核安全的三大目标（要素）是反应性控制、余热排出和放射性包容——分别对应控制链式反应、持续导出衰变热、把放射性物质包容在屏障内，仪控系统的安全功能都围绕这三者展开。工业安全（D）属常规职业安全范畴，不在核安全三要素之列，故选D。不选A、B、C：反应性控制、余热排出、放射性包容正是三大要素。【易混点】勿与反应堆保护系统三大基本功能（预保护、保护、缓解事故后果）混淆——一个是目标，一个是功能。"},{"id":"basics_ic_0010","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不会产生汽轮机保护跳机信号的为：（    ）","options":["润滑
