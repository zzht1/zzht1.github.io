的两种沸腾危机是（   ）。","options":["过冷沸腾和膜态沸腾","偏离泡核沸腾和干涸","泡核沸腾和饱和沸腾","自然循环沸腾和强制循环沸腾"],"answer":["B"],"score":null,"source":"adapted","origin":"官方填空题 basics_th_0004 改编","explanation":"压水堆的两种典型沸腾危机：一是偏离泡核沸腾（DNB，Departure from Nucleate Boiling），发生在低含汽率的泡核沸腾区，因汽泡密集连片形成汽膜使传热系数骤降、壁温飞升，又称第一类传热恶化；二是干涸（Dryout），发生在高含汽率的环状流区，因液膜被蒸干或被汽流撕破使壁面失去液体冷却，又称第二类传热恶化。膜态沸腾是 DNB 之后的传热模式而非危机分类名；泡核沸腾、饱和沸腾属正常换热工况。"},{"id":"basics_th_0005c","module":"basics","bank":"热工水力学","type":"single","stem":"水和水蒸气按加热过程划分的五种状态是（   ）。","options":["过冷水、饱和水、饱和蒸汽、过热蒸汽、临界蒸汽","冰、水、湿蒸汽、干饱和蒸汽、过热蒸汽","未饱和水、湿蒸汽、饱和蒸汽、过热蒸汽、过热饱和蒸汽","未饱和水、饱和水、湿蒸汽、干饱和蒸汽、过热蒸汽"],"answer":["D"],"score":null,"source":"adapted","origin":"官方填空题 basics_th_0005 改编","explanation":"对水定压加热，工质依次经历五种状态：未饱和水（又称过冷水，温度低于该压力下的饱和温度）→ 饱和水（达到饱和温度，刚开始汽化）→ 湿蒸汽（汽水两相共存，用干度 x 表示含汽比例）→ 干饱和蒸汽（恰好全部汽化，x=1）→ 过热蒸汽（温度高于同压下的饱和温度）。临界状态是汽液差别消失的特殊状态点，不属常规五态序列；冰是固态，不属于汽液工质状态序列；过热饱和蒸汽的说法本身自相矛盾。"},{"id":"basics_th_0026c","module":"basics","bank":"热工水力学","type":"single","stem":"关于压水堆反应堆热工设计准则，下列说法错误的是（   ）。","options":["燃料元件芯块的最高温度应低于其熔点","正常运行及中等频度事故工况下不允许发生偏离泡核沸腾","只要堆芯出口平均温度达标，个别燃料元件局部超温可以接受","应保证堆芯在各种工况下都具有足够的热工安全裕度"],"answer":["C"],"score":null,"source":"adapted","origin":"官方简答题 basics_th_0026 改编","explanation":"反应堆热工设计准则的基本思想是限制局部最恶劣参数并留足安全裕度，而不是看平均值：燃料芯块最高温度必须低于熔点（UO₂ 熔点约 2800℃，留有裕度以防芯块熔化）；正常运行和中等频度事故工况下不允许发生 DNB，并用 DNBR（偏离泡核沸腾比）限值加以约束；必须通过热点因子、焓升因子等考核最热组件和最热燃料棒的局部参数。因此用堆芯出口平均温度代替局部参数、认为个别元件局部超温可接受，违背了热工设计的基本思想。"},{"id":"basics_rp_0019c","module":"basics","bank":"反应堆物理","type":"single","stem":"已知天然铀中 U-235 的丰度为 0.72%，则 10000 个天然铀原子中约含有 U-235 原子（   ）。","options":["72 个","7.2 个","720 个","0.72 个"],"answer":["A"],"score":null,"source":"adapted","origin":"官方填空题 basics_rp_0019 改编","explanation":"丰度是指某一同位素的原子数占该元素总原子数的百分比。10000 × 0.72% = 72，故约含 72 个 U-235 原子，其余绝大部分为 U-238（约 99.27%，即约 9927 个）。天然铀中 U-235 丰度远低于压水堆燃料所需的 3%～5%，因此必须经过铀浓缩（富集）才能制成燃料元件。"},{"id":"basics_rp_0020c","module":"basics","bank":"反应堆物理","type":"single","stem":"热中子反应堆中，影响最大的两种裂变产物毒物是（   ）。","options":["Xe-135 和 Kr-85","Xe-135 和 Sm-149","Sm-149 和 I-131","B-10 和 Gd-157"],"answer":["B"],"score":null,"source":"adapted","origin":"官方填空题 basics_rp_0020 改编","explanation":"裂变产物中吸收截面最大、对反应性影响最显著的是 Xe-135 和 Sm-149。Xe-135 的热中子吸收截面高达约 2.6×10⁶ 靶，主要由 I-135 经 β 衰变生成，停堆后出现碘坑、氙峰值，给反应堆再启动带来困难。Sm-149 截面约 4×10⁴ 靶，由 Pm-149 衰变而来，且其本身稳定、只能靠中子吸收消耗，随运行逐渐积累并趋于平衡，属稳定毒物。B-10 与 Gd-157 是人为加入的控制材料或可燃毒物，不是裂变产物；Kr-85 是惰性气体，吸收截面很小。"},{"id":"basics_rp_0021c","module":"basics","bank":"反应堆物理","type":"single","stem":"压水堆中常用的三种反应性控制方式是（   ）。","options":["控制棒、硼酸化学补偿控制、慢化剂温度控制","可燃毒物、控制棒、多普勒效应","硼酸化学补偿控制、可燃毒物、氙毒控制","控制棒、硼酸化学补偿控制、可燃毒物"],"answer":["D"],"score":null,"source":"adapted","origin":"官方填空题 basics_rp_0021 改编","explanation":"压水堆三大反应性控制手段：①控制棒（银铟镉等强吸收体材料，用于快速调节功率分布、负荷跟踪和紧急停堆，补偿快速的反应性变化）；②硼酸化学补偿控制（改变冷却剂中硼浓度，用于补偿燃耗、氙毒、温度等缓慢变化的反应性，并可降低控制棒插入深度以展平功率分布）；③可燃毒物（新燃料中装入硼玻璃或含钆燃料棒，随燃耗不断消耗，用于抵消堆芯寿期初期的过剩反应性，从而降低硼浓度、保证慢化剂温度系数为负）。多普勒效应、慢化剂温度系数属反应性固有反馈而非控制手段；氙毒是需要被补偿的对象。"},{"id":"basics_rp_0024c","module":"basics","bank":"反应堆物理","type":"single","stem":"某种放射性核素的半衰期为 T₁/₂，初始核子数为 N₀，经过两个半衰期后剩余的核子数为（   ）。","options":["1/2 N₀","1/4 N₀","1/8 N₀","3/4 N₀"],"answer":["B"],"score":null,"source":"adapted","origin":"官方填空题 basics_rp_0024 改编","explanation":"每经过一个半衰期，核子数减少一半：经过一个半衰期为 N₀/2，经过两个半衰期为 (N₀/2)/2 = N₀/4。通式为 N(t) = N₀ · (1/2)^(t/T₁/₂)，代入 t = 2T₁/₂ 得 N = N₀ · (1/2)² = N₀/4。相应地，已衰变的核子数为 3/4 N₀。"},{"id":"basics_rp_0025c","module":"basics","bank":"反应堆物理","type":"single","stem":"燃耗深度是指（   ）。","options":["反应堆运行单位时间所发出的总功率","燃料元件在堆内停留的总天数","单位质量核燃料在堆内所产生的总能量","单位体积堆芯所装载的燃料质量"],"answer":["C"],"score":null,"source":"adapted","origin":"官方填空题 basics_rp_0025 改编","explanation":"燃耗深度衡量核燃料被消耗（燃烧）的程度，定义为单位质量核燃料在堆内辐照期间所释放的总能量，常用单位为 MW·d/tU（兆瓦日/吨铀）或 MW·d/tHM（每吨重金属）。它是反映核燃料利用程度、决定卸料时机与换料方案的核心指标，也是燃料循环经济性分析的基础，与功率、停留天数、装载密度等概念不同。"},{"id":"basics_rad_0036c","module":"basics","bank":"辐射防护基础","type":"single","stem":"关于内照射的防护方法，下列说法正确的是（   ）。","options":["内照射防护的基本思路是切断放射性物质进入人体的途径，可概括为包容、净化与个体防护","内照射防护只需依靠服用稳定性碘片阻断甲状腺对放射性碘的摄取，无需采取其他措施","内照射防护的主要手段是缩短接触时间、增大距离和设置屏蔽，即外照射防护三要素","内照射无法通过任何措施预防，只能在摄入后采用促排药物加速体内放射性核素排出"],"answer":["A"],"score":null,"source":"adapted","origin":"官方简答题 basics_rad_0036 改编","explanation":"内照射是放射性核素经吸入、食入、皮肤伤口或黏膜进入体内并在器官组织中沉积造成的照射。防护原则是切断进入途径：①包容——用密闭容器、手套箱、通风柜和负压系统把放射性物质限制在有限空间，防止扩散到工作场所空气中；②净化——用高效过滤、洗涤、去污等手段降低空气中气溶胶浓度和表面污染水平；③个体防护——佩戴合适的呼吸防护器具和防护服，严格执行禁止在工作场所进食、饮水、吸烟等规定，做好个人去污。B 项稳定性碘片仅能阻断甲状腺对放射性碘的摄取，是针对特定核素的医学干预措施；C 项时间、距离、屏蔽是外照射防护三要素，对已进入体内的核素无效；D 项否定了可预防性，错误。"},{"id":"basics_rad_0037c","module":"basics","bank":"辐射防护基础","type":"single","stem":"核电站场所监测的主要内容和目的，下列说法最准确的是（   ）。","options":["监测工作人员的个人累积剂量，用以评价每个工作人员在一段时间内的受照剂量是否超过剂量限值","监测排入环境的放射性流出物及其在环境中的迁移，用以评价对周围公众造成的辐射影响","监测核电机组的运行参数与设备状态，用以判断机组是否处于安全稳定运行的状态","监测工作场所的辐射水平与空气、表面污染水平，用以评价防护条件并为分区管理提供依据"],"answer":["D"],"score":null,"source":"adapted","origin":"官方简答题 basics_rad_0037 改编","explanation":"场所监测（workplace monitoring）的对象是工作场所本身而非个人，内容包括：外照射剂量率（γ、中子剂量率）、空气中放射性气溶胶和惰性气体浓度、设备与地面墙壁的表面污染水平等。其目的是掌握场所辐射状况，判断通风、屏蔽、密闭等防护设施是否有效，为划定和调整控制区/监督区提供依据，并及时发现异常以便采取控制措施，防止人员受到意外照射。A 项是个人剂量监测，B 项是环境监测与流出物监测，C 项是工艺运行参数监测，均不属于场所监测。"},{"id":"basics_rad_0038c","module":"basics","bank":"辐射防护基础","type":"single","stem":"压水堆核电厂一回路冷却剂中的活化产物主要包括（   ）。","options":["燃料裂变产生的 Cs-137、I-131、Kr-85 等裂变产物，在包壳破损时进入冷却剂","冷却剂及杂质、腐蚀产物被中子活化生成的核素，如 N-16、氚以及 Co-60、Co-58 等","硼酸中添加的富集硼-10 在中子照射下发生核反应后生成的各种衰变子体","二回路给水带入的钠离子、氯离子等杂质进入一回路后，在堆芯内被活化生成的核素"],"answer":["B"],"score":null,"source":"adapted","origin":"官方简答题 basics_rad_0038 改编","explanation":"活化产物是指堆内材料或介质在中子照射下发生核反应而生成的放射性核素。压水堆一回路中的活化产物主要有三类：①冷却剂本身的活化，如水中氧-16 经 (n,p) 反应生成 N-16（半衰期约 7 秒，是主回路管道附近外照射的重要来源），以及氘、硼、锂等活化生成的氚（H-3）；②结构材料腐蚀产物被活化，如不锈钢和因科镍中的镍、钴经活化生成 Co-58、Co-60，以及 Mn-54、Fe-59 等，它们在管壁沉积形成辐射热点，是停堆检修期间工作人员受照的主要来源；③其他杂质活化产物。A 项的裂变产物只有在燃料包壳破损时才进入冷却剂，正常情况下不属于活化产物；C、D 项不成立。"},{"id":"basics_mat_0042c","module":"basics","bank":"材料基础","type":"single","stem":"材料的发展被视为人类文明里程碑，其根本原因是（   ）。","options":["材料的种类最为丰富，几乎覆盖了自然界中存在的所有物质形态","材料的生产成本在社会总生产成本中占比最高，直接决定了社会的经济总量","材料是人类制造工具、改造自然的物质基础，人类历史分期正是以主导材料的使用水平为标志","材料的性能只取决于其化学成分，与加工工艺和内部组织结构都没有关系"],"answer":["C"],"score":null,"source":"adapted","origin":"官方简答题 basics_mat_0042 改编","explanation":"材料是人类制造工具、从事生产活动的物质基础。人类文明的发展阶段正是以主导材料来命名的——石器时代、青铜时代、铁器时代，以及现代以硅和先进新材料为标志的时代；每一种关键材料的突破都会带来生产工具与生产力的飞跃，故材料被视为文明的里程碑。A 项只是现象描述而非原因；B 项经济总量由技术、劳动力、资源等多因素共同决定；D 项本身即错误，材料性能由化学成分、内部组织结构与加工工艺共同决定。"},{"id":"basics_mat_0043c","module":"basics","bank":"材料基础","type":"single","stem":"反应堆材料在核电站中的作用和地位十分重要，主要体现在（   ）。","options":["材料是构成安全屏障和实现反应堆功能的物质载体，其性能直接决定机组的安全性、可靠性与经济性","材料成本占核电站建设投资的比例最高，直接决定了电站的盈利能力与投资回报水平","材料重量占核电机组总重的绝大部分，主要影响厂房的结构设计与土建工程投资","材料的选用只影响机组的检修周期与备件储备规模，与核安全没有直接的关系"],"answer":["A"],"score":null,"source":"adapted","origin":"官方简答题 basics_mat_0043 改编","explanation":"反应堆材料的重要性体现在三个方面：①安全性——燃料包壳、一回路压力边界、安全壳共同构成压水堆的三道实体安全屏障，其完整性直接决定放射性物质能否被有效包容；②可靠性——堆内材料长期在高温、高压、强中子辐照和腐蚀性介质下服役，会发生辐照脆化、辐照肿胀、应力腐蚀开裂、蠕变与疲劳等性能退化，直接影响机组的安全运行和使用寿命；③经济性——材料性能决定换料周期、机组可用率、检修工作量与发电成本。B、C 项表述片面，且非其核心地位所在；D 项否认材料与核安全的直接关系，明显错误。"},{"id":"basics_mat_0044c","module":"basics","bank":"材料基础","type":"single","stem":"关于核电厂材料工作的内容，下列说法正确的是（   ）。","options":["材料工作仅指电厂投运后的维修换料与备件管理，工程建设期的材料质量控制由施工单位自行负责","材料工作只针对金属类材料，混凝土、密封件、电缆等非金属材料不受核安全法规的任何约束","材料工作全部属于企业内部的质量管理事项，没有任何强制性的法规要求和监管方面的规定","材料工作涵盖设计选材、采购验收、制造安装控制、在役检查与老化管理，其中与承压边界和安全功能相关的材料控制、检验属核安全法规强制内容"],"answer":["D"],"score":null,"source":"adapted","origin":"官方简答题 basics_mat_0044 改编","explanation":"核电厂材料工作贯穿全生命周期：①设计阶段选材，须满足设计规范与服役工况要求；②采购环节制定技术条件、进行入厂复验（质量证明文件审查、无损检测、理化性能复验）；③制造与安装过程控制，包括材料标识与可追溯性、焊接工艺评定、焊工资格管理；④在役阶段的定期检查与老化管理，如辐照监督试样定期取出试验、疲劳与腐蚀监测、寿命评估。其中与核安全相关的内容——承压部件材料、安全级设备用材、焊接与无损检验等——属于核安全法规和技术规范的强制要求，须接受监管部门的监督检查。A、B、C 项均缩小或否定了法规要求，错误。"},{"id":"basics_wc_0001c","module":"basics","bank":"水化学","type":"single","stem":"关于压水堆一回路冷却剂 pH 值的调节，下列说法正确的是（   ）。","options":["通过添加硼酸来提高 pH 值，pH 值越高越有利于抑制一回路设备的腐蚀","通过添加碱化剂中和硼酸带来的酸性，在高温下维持偏碱性 pH，以抑制腐蚀并减少腐蚀产物迁移","通过连续向一回路加入联氨等除氧剂来调节 pH 值，同时除去冷却剂中的溶解氧","一回路 pH 值无需刻意调节，依靠补给水的水质即可自然维持在合适的范围之内"],"answer":["B"],"score":null,"source":"adapted","origin":"官方简答题 basics_wc_0001 改编","explanation":"压水堆一回路为控制反应性必须加入硼酸，而硼酸是弱酸，会显著降低冷却剂的 pH 值。因此需要添加碱化剂——通常使用富集锂-7 的氢氧化锂（⁷LiOH，避免 ⁶Li 经中子活化生成氚）——把高温下的 pH 值（工程上常用 pH₃₀₀ 表征）控制在偏碱性范围（一般约为 7.0～7.4，并随硼浓度变化按协调曲线调整）。偏碱性条件有利于在金属表面形成致密稳定的氧化膜，抑制一回路材料的腐蚀，并减少腐蚀产物向堆芯迁移和活化，从而降低堆内辐射场。A 项因果颠倒，加硼酸会降低 pH；C 项联氨主要用作二回路的化学除氧剂；D 项错误，一回路 pH 必须刻意调节。"},{"id":"basics_wc_0002c","module":"basics","bank":"水化学","type":"single","stem":"压水堆一回路系统选用 ⁷LiOH 作为碱化剂，其主要优点和需要重点控制的方面是（   ）。","options":["优点是价格低廉、来源广泛且易于储存；需重点控制的是其在低温下溶解度较低容易析出结晶","优点是能同时除去冷却剂中的溶解氧；需重点控制的是其碱性较强会加速一回路设备腐蚀","优点是调节 pH 有效且不引入新杂质阴离子、不增加长寿命活化产物；需控制的是必须用高富集度锂-7，抑制锂-6 活化生成氚","优点是能替代硼酸参与反应性控制；需重点控制的是其浓度会随燃耗快速变化难以预测"],"answer":["C"],"score":null,"source":"adapted","origin":"官方简答题 basics_wc_0002 改编","explanation":"选用 ⁷LiOH 的主要理由：LiOH 是强碱，微量添加即可有效调节 pH；锂、氧、氢都是一回路系统中本已存在的轻元素，不会引入新的杂质阴离子，也不会产生长半衰期的活化产物，与 KOH、NaOH 相比避免了钾、钠被活化带来的问题。需要重点控制的是：必须使用高富集度的 ⁷Li（天然锂中 ⁷Li 约占 92.5%、⁶Li 约占 7.5%），因为 ⁶Li 会经 ⁶Li(n,α)T 反应生成氚，显著提高一回路氚的活度。此外锂浓度过高会促进锆合金包壳的腐蚀，因此也有上限控制。A、B、D 所述均不是其主要技术考量。"},{"id":"basics_wc_0003c","module":"basics","bank":"水化学","type":"single","stem":"核电厂以天然水为原水制取除盐水，主要的水处理流程是（   ）。","options":["澄清过滤除悬浮物和胶体 → 活性炭除有机物与余氯 → 离子交换或反渗透除溶解盐 → 除盐水箱储存","加氯杀菌 → 混凝沉淀 → 直接作为除盐水输送至除盐水箱储存备用","加热蒸馏 → 蒸汽冷凝 → 加盐调节水质 → 送入除盐水箱储存","离子交换除盐 → 澄清过滤 → 加氯消毒 → 送入除盐水箱储存"],"answer":["A"],"score":null,"source":"adapted","origin":"官方简答题 basics_wc_0003 改编","explanation":"以天然水（地表水或地下水）制取除盐水的典型流程为：①预处理——混凝澄清、过滤，去除悬浮物、胶体和部分有机物；②精细预处理——必要时经活性炭过滤去除有机物和余氯，以保护后续的离子交换树脂免受氧化降解；③除盐——一级除盐通常采用阳离子交换加阴离子交换（或先经反渗透预脱盐），再经混床或 EDI 精处理，去除溶解性阴、阳离子，使电导率、硅、钠等指标达到除盐水标准。B 项只完成常规净化，并未除盐；C 项蒸馏后又加盐，与除盐目的相反；D 项顺序颠倒，先除盐后过滤会使树脂被悬浮物堵塞污染。"},{"id":"basics_wc_0051c","module":"basics","bank":"水化学","type":"single","stem":"为实现二回路给水低氧、高 pH、低离子杂质的良好水化学环境，通常采用的手段是（   ）。","options":["向给水大量投加磷酸盐以提高 pH，并依靠定期排污来控制水中的含盐量","提高给水温度使溶解氧自行逸出，无需投加任何化学药剂即可达到除氧目的","仅在机组启动阶段进行除氧和加药处理，正常运行后不再需要连续控制","凝汽器真空除氧与热力除氧、投加联氨化学除氧、投加氨或胺类调节 pH，并通过凝结水精处理与监测控制杂质"],"answer":["D"],"score":null,"source":"adapted","origin":"官方简答题 basics_wc_0051 改编","explanation":"二回路水化学控制的目标是抑制碳钢、铜合金的腐蚀，并减少腐蚀产物向蒸汽发生器迁移沉积。实现低氧：凝汽器真空除氧 + 除氧器热力除氧 + 投加联氨（N₂H₄）等化学除氧剂进行深度除氧；实现高 pH：投加氨或胺类（如吗啉、乙醇胺）等挥发性碱，将给水 pH 控制在弱碱性（通常 9 以上），抑制碳钢的均匀腐蚀和流动加速腐蚀；实现低离子杂质：设置凝结水精处理系统（前置过滤器加混床）、严格监测钠、氯、硅、电导率等指标，并防止凝汽器泄漏使冷却水漏入。A 项磷酸盐处理一般用于汽包锅炉而非压水堆二回路给水；B 项仅靠升温达不到控制要求；C 项水化学控制必须全过程连续进行。"},{"id":"basics_wc_0052c","module":"basics","bank":"水化学","type":"single","stem":"联氨与水中溶解氧反应（N₂H₄ + O₂ → 2H₂O + N₂），其反应速度主要与（   ）有关。","options":["给水的电导率、含盐量以及凝结水精处理系统的运行方式","温度、pH 值、联氨浓度以及是否存在催化剂（如铜表面、活性炭等）","给水流速、管道直径以及给水泵的运行台数","厂房内的大气压力、空气湿度以及环境温度"],"answer":["B"],"score":null,"source":"adapted","origin":"官方简答题 basics_wc_0052 改编","explanation":"联氨除氧是化学反应过程，其反应速率主要取决于：①温度——温度升高反应显著加快，因此除氧器出口维持较高温度有利于联氨充分发挥除氧作用；②pH 值——在弱碱性条件（一般 pH 9～10）下反应速率较快；③联氨浓度——保持适当的过剩量可提高反应速率和除氧彻底程度；④催化条件——铜表面、活性炭、某些金属氧化物等可对该反应起催化作用，加快反应。A 项电导率主要反映杂质离子含量，与反应速率无直接因果关系；C 项流速与管径属水力学参数；D 项与密闭的给水系统无关。"},{"id":"basics_mech_0001c","module":"basics","bank":"通用机械","type":"single","stem":"关于离心泵的常见故障，下列现象与可能原因的对应关系中，错误的是（   ）。","options":["启动后不出水 —— 泵内未灌满水或吸入管路漏气","流量扬程不足 —— 叶轮磨损、密封环间隙过大或转速低于额定值","振动和噪声增大 —— 出口阀门开度过大","轴承过热 —— 润滑油不足或变质、联轴器对中不良"],"answer":["C"],"score":null,"source":"adapted","origin":"官方简答题 basics_mech_0001 改编","explanation":"离心泵振动与噪声增大的常见原因是：地脚螺栓松动或基础刚度不足、转子不平衡、联轴器对中不良、轴承磨损或损坏、发生汽蚀、泵内吸入空气，以及在过小流量区运行产生回流等。出口阀门开度过大使泵在大流量工况下运行，可能导致电机过载或诱发汽蚀，但并不是振动噪声增大的典型对应原因，故 C 的对应关系错误。A 项灌泵不足或吸入管路漏气使泵内无法建立真空而吸不上水，是启动后不出水的首要原因；B 项叶轮或密封环磨损使内漏增大、转速不足则直接降低性能；D 项润滑不良和联轴器对中不良是轴承发热的主要原因。"},{"id":"basics_mech_0042c","module":"basics","bank":"通用机械","type":"single","stem":"关于阀门的分类与驱动方式，下列说法正确的是（   ）。","options":["按用途可分为截断阀、调节阀、止回阀、安全阀等；驱动方式包括手动、电动、气动、液动和电磁驱动","阀门只能按驱动方式分类，按结构和用途的分类在工程中并不使用","安全阀属于截断阀的一种，主要作用是在检修时切断管路","止回阀依靠外部动力（如电动或气动装置）驱动阀瓣实现启闭"],"answer":["A"],"score":null,"source":"adapted","origin":"官方简答题 basics_mech_0042 改编","explanation":"阀门有多种分类维度。按用途或功能可分为：截断阀（闸阀、截止阀、球阀、蝶阀、旋塞阀，用于接通或切断管路）、调节阀（节流阀、减压阀，用于调节流量和压力）、止回阀（依靠介质自身流动自动防止倒流）、安全阀与泄压阀（系统超压时自动开启排放，保护系统与设备）。按驱动方式可分为：手动（手轮、手柄、齿轮传动）、电动、气动、液动、电磁驱动，以及依靠介质能量动作的自动/自力式阀门。B 项说法片面，结构与用途分类在工程中被广泛使用；C 项安全阀属安全泄压类而非截断阀；D 项止回阀靠介质流动自行启闭，不需要外部动力。"},{"id":"basics_mech_0043c","module":"basics","bank":"通用机械","type":"single","stem":"下列关于压水堆核电厂热交换器及其功能的对应关系，正确的是（   ）。","options":["凝汽器 —— 加热凝结水以提高循环热效率","稳压器 —— 通过热交换回收一回路余热用于厂房供暖","除氧器 —— 利用蒸汽冷却水以回收工质","蒸汽发生器 —— 将一回路冷却剂热量传给二回路给水，产生推动汽轮机的蒸汽"],"answer":["D"],"score":null,"source":"adapted","origin":"官方简答题 basics_mech_0043 改编","explanation":"蒸汽发生器是压水堆最重要、也是一、二回路之间唯一的热交换器，其功能是：把一回路高温冷却剂的热量传给二回路给水使之蒸发汽化，产生推动汽轮机做功的蒸汽；同时它还是带放射性的一回路介质与不带放射性的二回路之间的隔离边界（传热管及其管板是关键屏障）。凝汽器的作用是将汽轮机排汽冷凝成凝结水并建立与维持背压真空，属于向冷源放热而非加热凝结水；稳压器用于控制和维持一回路系统压力，不属于热交换器；除氧器是混合式加热器，用蒸汽加热凝结水并除去其中的溶解氧，而非冷却水。压水堆常见的热交换器还包括余热排出热交换器、再生热交换器、设备冷却水热交换器等。"},{"id":"basics_mech_0044c","module":"basics","bank":"通用机械","type":"single","stem":"汽轮机做功过程的正确描述是（   ）。","options":["蒸汽在喷嘴中膨胀降压、流速升高，高速汽流冲击动叶片推动叶轮旋转，将热能转换为机械能","蒸汽在动叶片中被压缩升压，将机械能转换为热能","蒸汽在汽缸内燃烧膨胀，直接推动活塞做功","蒸汽依靠自身的静压力直接推动转子旋转，无需经过喷嘴加速"],"answer":["A"],"score":null,"source":"adapted","origin":"官方简答题 basics_mech_0044 改编","explanation":"以冲动式汽轮机为例，能量转换分两步完成：第一步在喷嘴（静叶片）中，蒸汽膨胀降压降温、流速大幅升高，热能转化为动能；第二步在动叶片中，高速汽流改变流动方向并对叶片产生冲动力，推动叶轮和转子旋转，输出机械功（反动式汽轮机中蒸汽在动叶片内继续膨胀，同时利用反作用力做功，但喷嘴加速仍是基本环节）。B 项能量转换方向颠倒；C 项汽轮机内部不发生燃烧，且是旋转机械而非活塞式；D 项忽略了喷嘴加速这一关键环节，蒸汽主要以高速动能形式做功。"},{"id":"basics_elec_0025c","module":"basics","bank":"电气原理","type":"single","stem":"核电厂电气设备的安全分级通常分为（   ）。","options":["高压级、中压级和低压级","一级负荷、二级负荷和三级负荷","安全级（1E 级）、安全相关级和非安全级","主设备级、辅助设备级和备用设备级"],"answer":["C"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0025 改编","explanation":"核电厂电气设备按其承担的安全功能进行安全分级：安全级（1E 级）指为实现或支持安全功能（反应堆紧急停堆、堆芯余热排出、放射性物质包容等）所必需的电气设备，需满足设备鉴定、质量保证和抗震 I 类要求；安全相关级指对安全有间接影响但不属于 1E 级的设备；非安全级为其余常规电气设备。A 项是电压等级划分，B 项是供电负荷重要性划分，D 项是按运行角色的划分，都不是安全分级。"},{"id":"basics_elec_0026c","module":"basics","bank":"电气原理","type":"single","stem":"电气主接线应满足的三项基本要求是（   ）。","options":["可靠性、灵活性和经济性","安全性、美观性和经济性","可靠性、容量性和节能性","灵活性、经济性和小型化"],"answer":["A"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0026 改编","explanation":"电气主接线（一次接线）的三项基本要求：①可靠性——在各种正常运行方式和故障条件下能保证对负荷（尤其是安全级负荷）连续供电，故障停电范围小、恢复快；②灵活性——运行方式转换灵活，便于设备检修、系统倒闸操作和分期扩建，调度适应性强；③经济性——在满足可靠性和灵活性的前提下，尽量减少设备投资和占地面积、降低运行损耗。美观性和小型化不是主接线设计的基本要求。"},{"id":"basics_elec_0027c","module":"basics","bank":"电气原理","type":"single","stem":"变压器的基本功能包括（   ）。","options":["变换频率、变换电压和变换相位","变换功率、变换电压和变换电流","变换电压、变换功率因数和变换阻抗","变换电压、变换电流和变换阻抗"],"answer":["D"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0027 改编","explanation":"变压器基于电磁感应原理工作，三大基本功能：①变换电压——升压后远距离输电可大幅降低线路损耗，降压后供给用户使用；②变换电流——电压升高时电流按变比成比例降低，便于用较小截面的导线输送同等功率；③变换阻抗——在电子线路和测量回路中用于阻抗匹配，实现最大功率传输或信号适配。变压器不能变换频率，原、副边频率始终相同；理想变压器本身不产生功率，输入功率约等于输出功率；也不具备改变功率因数的功能。"},{"id":"basics_elec_0028c","module":"basics","bank":"电气原理","type":"single","stem":"继电保护的基本要求通常概括为（   ）。","options":["选择性、经济性、速动性和节能性","选择性、速动性、灵敏性和可靠性","灵敏性、可靠性、经济性和美观性","速动性、选择性、容量性和可靠性"],"answer":["B"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0028 改编","explanation":"继电保护的四项基本要求（四性）：①选择性——保护装置动作时只切除故障元件，尽量缩小停电范围，依靠时限和定值配合实现；②速动性——快速切除短路故障，减轻设备损伤、防止故障扩大并提高系统稳定性；③灵敏性——在保护范围内发生各种故障（包括最小运行方式下的轻微故障）时能可靠反映，用灵敏系数衡量；④可靠性——该动作时不拒动（可信赖性），不该动作时不误动（安全性）。经济性与节能性不是继电保护的技术性能指标。"},{"id":"basics_elec_0029c","module":"basics","bank":"电气原理","type":"single","stem":"设置发电机负序电流保护的主要目的是（   ）。","options":["防止发电机定子绕组因长时间过电流而发热烧毁","防止发电机失磁后从系统中吸收大量无功功率","防止负序电流在转子中产生反向旋转磁场，引起转子表面过热而损坏转子","防止发电机输出电压过高而损坏定子绕组绝缘"],"answer":["C"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0029 改编","explanation":"当电力系统发生不对称短路、非全相运行或三相负荷严重不平衡时，定子电流中会出现负序分量。负序电流在气隙中产生与转子转向相反的旋转磁场，以两倍同步频率切割转子，在转子表面（槽楔、护环、齿部、阻尼绕组）感应出倍频涡流，造成局部高温，严重时会烧伤转子。负序电流保护按发电机承受负序电流的能力（I₂²t 定值）整定动作。A 项是定子过负荷或过电流保护的任务；B 项是失磁保护的任务；D 项是过电压保护的任务。"},{"id":"basics_elec_0030c","module":"basics","bank":"电气原理","type":"single","stem":"同步发电机的工作原理基于（   ）。","options":["电磁感应定律","欧姆定律","焦耳—楞次定律","基尔霍夫定律"],"answer":["A"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0030 改编","explanation":"同步发电机由转子（励磁绕组通入直流电流建立恒定磁场）和定子（三相对称电枢绕组）组成。原动机拖动转子旋转时，定子绕组与转子磁场发生相对运动，绕组所交链的磁通周期性变化，按电磁感应定律（法拉第电磁感应定律）在定子绕组中感应出交变电动势，其频率与转速保持严格同步关系 f = pn/60。欧姆定律描述导体中电压与电流的关系，焦耳—楞次定律描述电流的热效应，基尔霍夫定律用于电路节点与回路分析，都不是发电机的发电原理。"},{"id":"basics_elec_0031c","module":"basics","bank":"电气原理","type":"single","stem":"对电力系统的基本要求包括（   ）。","options":["保证供电可靠性、提高电压等级、减少设备数量","提高电压等级、增大装机容量、减少线路损耗","保证电能质量、降低电价、简化接线","保证供电的可靠性、保证电能质量、提高运行的经济性"],"answer":["D"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0031 改编","explanation":"电力系统的三项基本要求：①保证供电可靠性——最大限度减少停电时间和停电范围，保证对用户连续供电，对核电厂而言还包括厂外电源与应急电源的配置；②保证电能质量——频率、电压、波形（谐波）应维持在规定范围内；③提高运行经济性——降低网络损耗和发电煤耗、提高设备利用率与运行效率。A、B、C 项中的提高电压等级、减少设备数量、降低电价等属于具体技术措施或经营目标，不是基本要求的表述。"},{"id":"basics_elec_0032c","module":"basics","bank":"电气原理","type":"single","stem":"继电保护装置一般由（   ）组成。","options":["电流互感器、电压互感器和断路器","测量部分、逻辑部分和执行部分","信号部分、操作部分和电源部分","采样部分、放大部分和显示部分"],"answer":["B"],"score":null,"source":"adapted","origin":"官方填空题 basics_elec_0032 改编","explanation":"继电保护装置的三个基本组成部分：①测量部分——将被保护对象的电流、电压等物理量经互感器变换为装置可处理的量，并与整定值进行比较，给出大于或小于的定性结果；②逻辑部分——根据测量部分的输出，按预设的逻辑关系（如与、或、非、延时、符合逻辑）判断故障的性质、范围和保护动作时间，决定保护应否动作；③执行部分——将逻辑判断的结果付诸实施，如驱动出口继电器发出跳闸命令或告警信号。A 项中的互感器和断路器属于一次设备和二次回路元件，不是装置内部的组成部分；C、D 不是标准的功能划分。"},{"id":"basics_elec_0033c","module":"basics","bank":"电气原理","type":"single","stem":"电气操作的五防不包括下列哪一项（   ）。","options":["防止误分、误合断路器","防止带负荷分、合隔离开关","防止过电压损坏电气设备","防止带电挂（合）接地线（接地开关）"],"answer":["C"],"score":null,"source":"adapted","origin":"官方简答题 basics_elec_0033 改编","explanation":"电气五防是防止电气误操作的强制性措施，完整内容为：①防止误分、误合断路器；②防止带负荷分、合隔离开关；③防止带电挂（合）接地线（接地开关）；④防止带接地线（接地开关）合断路器（隔离开关）；⑤防止误入带电间隔。五防通常通过机械联锁、电气联锁和微机防误闭锁系统实现。防止过电压损坏电气设备属于过电压保护与绝缘配合的范畴，由避雷器、避雷针等措施承担，不属于防止误操作的五防内容。"},{"id":"basics_elec_0034c","module":"basics","bank":"电气原理","type":"single","stem":"核电厂设置应急柴油发电机的主要目的是（   ）。","options":["在全厂断电时为安全级设备提供可靠应急电源，保证停堆、排出余热和包容放射性","在电网用电高峰时段向电网送电，以取得额外的经济效益","替代主发电机在正常运行期间承担全部厂用电负荷","为常规岛辅助设备提供备用电源，与核安全功能无关"],"answer":["A"],"score":null,"source":"adapted","origin":"官方简答题 basics_elec_0034 改编","explanation":"应急柴油发电机是核电厂应急交流电源系统的核心设备。在全厂断电（SBO，即厂外电源丧失且厂内交流应急母线也失电）工况下，它能在规定时间内快速启动并带载，为安全级（1E 级）应急母线供电，驱动安全级的泵、阀门、仪控、照明等设备，从而确保实现三大安全功能：反应堆紧急停堆并维持次临界、排出堆芯余热（含乏燃料池冷却）、包容放射性物质。B、C 项与应急电源的定位不符，正常运行时厂用电由厂外电源经主变压器或厂高变供给；D 项错误，应急电源首要任务是保障安全功能。"},{"id":"basics_elec_0035c","module":"basics","bank":"电气原理","type":"single","stem":"发电机励磁系统的主要功能是（   ）。","options":["调节发电机转速以维持系统频率稳定，并实现并网机组间有功功率的合理分配","调节有功功率输出以满足负荷需求，同时承担系统频率的一次调频功能","在发电机内部发生故障时迅速切断定子电流，防止故障范围进一步扩大","调节励磁电流以维持机端电压在给定水平，合理分配并列运行机组间的无功功率，并改善电力系统运行的稳定性"],"answer":["D"],"score":null,"source":"adapted","origin":"官方简答题 basics_elec_0035 改编","explanation":"励磁系统向发电机转子绕组提供可调的直流励磁电流，主要功能有：①维持机端电压——负荷变化时自动调节励磁，使机端电压保持在给定水平；②控制无功功率——并列运行时通过调节励磁改变发电机输出的无功功率，实现机组间无功的合理分配并为系统提供电压支撑；③改善稳定性——快速响应特性和强行励磁可提高静态与暂态稳定，电力系统稳定器（PSS）可抑制低频振荡。A 项频率由原动机调速系统维持；B 项有功功率由调速系统调节；C 项内部故障切除由继电保护装置与断路器完成。"},{"id":"basics_elec_0036c","module":"basics","bank":"电气原理","type":"single","stem":"纵联差动保护的基本原理是（   ）。","options":["检测被保护元件两端的电压之差，当电压差超过整定值时立即动作跳闸","比较被保护元件两端电流的相量和，正常运行或外部故障时差流近似为零，内部故障时差流显著增大使保护动作","根据故障电流随时间增大的速率来判断故障并动作于跳闸","依靠定时限过电流保护的动作时限配合来切除内部故障"],"answer":["B"],"score":null,"source":"adapted","origin":"官方简答题 basics_elec_0036 改编（原图已失效，改为纯原理考核）","explanation":"纵联差动保护基于基尔霍夫电流定律：在被保护元件（发电机、变压器、母线、线路）各端装设变比和特性一致的电流互感器，将各端电流按相量和进行比较形成差动电流。正常运行或保护区外故障时，流入被保护元件的电流等于流出电流，差流理论上为零（实际为数值较小的不平衡电流），保护不动作；保护区内发生故障时，各端电流相量和等于流入故障点的总短路电流，差流远大于整定值，保护瞬时动作跳闸。因此纵差保护具有绝对的选择性和良好的速动性，可作为元件的主保护。A 项不是差动原理；C 项是电流上升率保护；D 项是过电流保护靠时限配合获得选择性的方式，动作带延时。"},{"id":"basics_ic_0039c","module":"basics","bank":"仪表与控制","type":"single","stem":"在自动控制系统中，关于给定值和扰动值的说法，正确的是（   ）。","options":["给定值是系统的实际输出值，扰动值是系统的反馈值","给定值由扰动值决定，二者在数值上始终相等","给定值是希望被控量保持或跟随的目标值，扰动值是使被控量偏离给定值的外界影响因素","扰动值是控制器输出的调节量，给定值是被控对象的输入"],"answer":["C"],"score":null,"source":"adapted","origin":"官方简答题 basics_ic_0039 改编","explanation":"自动控制系统的基本要素中：被控量是表征被控对象工作状态、需要加以控制的物理量；给定值（设定值）是工艺上要求被控量维持或被控量需要跟随的目标值，由运行人员设定或由上级系统给出；扰动值（扰动量）是引起被控量偏离给定值的各种外界作用，如蒸汽流量变化、给水压力波动等，是系统的干扰输入；调节量则是控制器为克服扰动而输出的、作用于被控对象的量。控制系统的任务正是通过调节作用克服扰动的影响，使被控量等于或跟随给定值。A、B、D 项均混淆了被控量、给定值、扰动量与调节量的概念。"},{"id":"basics_ic_0040c","module":"basics","bank":"仪表与控制","type":"single","stem":"热电偶测温的基本原理是（   ）。","options":["两种不同导体组成闭合回路，当两接点温度不同时回路中产生热电势，通过测量热电势得到温度","导体电阻随温度变化，通过测量电阻值得到温度","半导体 PN 结电压随温度变化，通过测量结电压得到温度","物体热辐射强度随温度变化，通过接收辐射能量得到温度"],"answer":["A"],"score":null,"source":"adapted","origin":"官方简答题 basics_ic_0040 改编","explanation":"热电偶基于热电效应（塞贝克效应）工作：将两种不同材料的导体两端焊接构成闭合回路，若测量端（热端）与参比端（冷端）存在温差，回路中就会产生与温差相对应的热电势（由接触电势与温差电势两部分组成）；测得该热电势，并配合冷端温度补偿，即可求得被测温度。B 项是热电阻（如 Pt100 铂电阻、铜电阻）的测温原理；C 项是集成温度传感器、二极管温度传感器的原理；D 项是红外测温仪和光学高温计的原理。"},{"id":"basics_ic_0041c","module":"basics","bank":"仪表与控制","type":"single","stem":"压水堆蒸汽发生器水位控制系统的目的，下列说法最准确的是（   ）。","options":["通过调节给水温度使一回路冷却剂的平均温度保持恒定不变，从而稳定反应堆功率","通过调节蒸汽流量来维持汽轮机转速和机组输出功率的稳定，满足电网负荷需求","通过调节连续排污量使蒸汽发生器的二次侧运行压力保持恒定，防止超压","通过调节给水流量使二次侧水位维持整定值，既保证蒸汽品质与传热能力，又防止满水或失水危及安全"],"answer":["D"],"score":null,"source":"adapted","origin":"官方简答题 basics_ic_0041 改编","explanation":"蒸汽发生器水位是压水堆最重要的控制参数之一，控制目的在于维持二次侧水位在规定范围内：水位过高会压缩汽空间、使蒸汽带水，导致蒸汽品质恶化并可能损坏汽轮机叶片；水位过低会使传热管暴露、有效传热面积减少，削弱反应堆热量的排出能力，严重时会引起一回路超压。系统通过测量水位（常用差压式测量，配宽量程与窄量程）、给水流量、蒸汽流量，以及给水温度、蒸汽压力等信号，按随功率变化的水位程序定值，调节给水调节阀开度或给水泵转速。A、B、C 项分别属于冷却剂平均温度控制、汽轮机调速系统和压力控制系统的任务。"},{"id":"basics_ic_0042c","module":"basics","bank":"仪表与控制","type":"single","stem":"关于反应堆保护系统的设计准则，下列说法错误的是（   ）。","options":["保护系统应满足单一故障准则，采用冗余（如四取二）符合逻辑","为提高可靠性，保护系统应尽可能采用单通道结构以简化逻辑","保护系统应满足故障安全原则，即系统自身失效时趋向触发保护动作","保护系统应具备定期可试验性，并保持与其他控制系统的独立性"],"answer":["B"],"score":null,"source":"adapted","origin":"官方简答题 basics_ic_0042 改编","explanation":"反应堆保护系统的核心设计准则包括：①单一故障准则——任一通道发生单一故障不应丧失保护功能，故采用多重冗余并设置符合逻辑（如 4 取 2）；②冗余性与独立性——各通道之间实行实体分隔与电气隔离，并与其他控制系统隔离，防止共因故障；③故障安全——失电、断线、部件失效时输出趋向于触发停堆等安全动作；④可试验性——机组运行期间可对单个通道进行定期试验和校准而不影响保护功能；⑤多样性与快速性。因此主张采用单通道简化逻辑，直接违背了冗余配置和单一故障准则，是错误的。"}],"buildTime":"2026-09-05 10:42"};

function $(s,p){return (p||document).querySelector(s);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function qScore(q){return q.score!=null ? q.score : (DEFAULT_SCORE[q.type]||1);}
function ansText(q){
  if(q.type==="judge") return q.answer[0];
  if(!q.options) return "";
  return q.answer.map(l=>l+"．"+q.options[LETTERS.indexOf(l)]).join("　");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600);}

/* ================= 持久化状态 ================= */
const SKEY = "tiku_v1";
let S;
function loadState(){
  try{S=JSON.parse(localStorage.getItem(SKEY)||"{}");}
  catch(e){S={};}
  S.done=S.done||{};   // qid -> {c:对次数, w:累计错次数, t:最后作答时间}
  S.wrong=S.wrong||{}; // qid -> 当前连错次数（答错累加，错题重练答对后清除）
  S.fav=S.fav||{};     // qid -> 1
  S.autofav=S.autofav||{};   // qid -> 1（因累计错满 AUTO_FAV_TIMES 次被自动收藏的题）
  S.favSkip=S.favSkip||{};   // qid -> 1（用户主动取消过的自动收藏，之后不再自动加回）
  S.slay=S.slay||{};   // qid -> 1（斩杀：非常熟，不进随机/顺序/专项练习池，可在收藏页恢复）
  S.seq=S.seq||{};     // bankKey -> 断点：下次该练的题目 id（旧版存数字下标，读取时自动迁移）
  S.daily=S.daily||{}; // "YYYY-MM-DD" -> 题数
  // 迁移：旧版 S.wrong 存 1（布尔标记），统一转成数字次数
  for(const k in S.wrong){const v=S.wrong[k];
    if(typeof v!=="number"||!isFinite(v)||v<1)S.wrong[k]=1;}
  autoFavScan();  // 补齐历史数据：之前就累计错满 N 次的题，一并收进收藏
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function bumpDaily(){const d=today();S.daily[d]=(S.daily[d]||0)+1;save();}

/* ================= 自动收藏（错满 N 次） =================
   累计错满 AUTO_FAV_TIMES 次的题自动进收藏，收藏页用 🤖 标记区分手动收藏。
   用户手动取消收藏后写进 S.favSkip，之后不再自动加回（尊重手动操作）。 */
const AUTO_FAV_TIMES = 2;
/* 全量补齐：历史答题记录里累计错满 N 次的题收进收藏（启动时、导入后各跑一次） */
function autoFavScan(){
  let n=0;
  for(const id in S.done){
    if(!QMAP[id]||S.favSkip[id])continue;
    if((S.done[id].w||0)>=AUTO_FAV_TIMES&&!S.fav[id]){S.fav[id]=1;S.autofav[id]=1;n++;}
  }
  return n;
}
/* 单次作答后判断要不要自动收藏；返回 true 表示本次新收藏（调用方据此提示）。
   必须在 S.done[id].w 已更新之后调用。 */
function autoFavCheck(id,ok){
  const d=S.done[id];
  if(ok||!d||(d.w||0)<AUTO_FAV_TIMES||S.fav[id]||S.favSkip[id])return false;
  S.fav[id]=1;S.autofav[id]=1;return true;
}
function toggleFav(id){
  if(S.fav[id]){
    delete S.fav[id];
    if(S.autofav[id]){delete S.autofav[id];S.favSkip[id]=1;}  // 主动移出 → 不再自动收藏
    toast("已取消收藏");
  }else{
    S.fav[id]=1;delete S.favSkip[id];
    toast("已收藏，可在收藏页练习或导出");
  }
  save();
}

/* ================= 视图路由 ================= */
let stack = [];
function go(view, noPush){
  if(!noPush && curView) stack.push(curView);
  curView = view;
  render();
}
let curView = null;
function back(){
  if(stack.length){curView=stack.pop();render();}
  else go({name:"home"},true);
}

/* ================= 首页 ================= */
function modProgress(module){
  let total=0,done=0;
  for(const k in BANKS){const b=BANKS[k];if(b.module!==module)continue;
    total+=b.list.length;
    b.list.forEach(q=>{if(S.done[q.id])done++;});}
  return {total,done,pct:total?Math.round(done/total*100):0};
}

/* ================= 未做题（一网打尽） =================
   "未做" = 没答过（S.done 无记录）且未斩杀。
   斩杀题不进任何练习池（与顺序/随机/专项一致），所以这里一并排除。 */
function undonePool(bank){
  let l=questions.filter(q=>!S.done[q.id]&&!S.slay[q.id]);
  if(bank)l=l.filter(q=>q.module===bank);
  return l.sort((a,b)=>((MOD_ORDER[a.module]??9)-(MOD_ORDER[b.module]??9))||(a._pos-b._pos));
}
function undoneStat(bank){
  let total=0,undone=0,slain=0;
  for(const q of questions){
    if(bank&&q.module!==bank)continue;
    total++;
    if(S.done[q.id])continue;
    if(S.slay[q.id])slain++;else undone++;
  }
  const done=total-undone-slain;
  return {total,undone,slain,done,pct:total?Math.round(done/total*100):0};
}
function startUndone(bank){
  const us=undoneStat(bank);
  if(!us.undone){toast(bank?"本模块没有未做的题了 🎉":"全部题目都已练过 🎉");return;}
  startSession({mode:"undone",bank:bank||null});
}

/* ================= 练习视图 ================= */
function buildPool(bankK, srcFilter, typeFilter, excludeSlay){
  const b=BANKS[bankK];let list=b.list;
  if(excludeSlay)list=list.filter(q=>!S.slay[q.id]); // 斩杀题不进练习池（模拟考试除外）
  if(srcFilter && srcFilter!=="all"){
    const allow=srcFilter.split("+");
    list=list.filter(q=>allow.includes(q.source));
  }
  if(typeFilter&&typeFilter.length)list=list.filter(q=>typeFilter.includes(q.type));
  return list;
}
function newSession(v){
  let list;
  if(v.mode==="wrong")list=Object.keys(S.wrong).filter(id=>QMAP[id]);
  else if(v.mode==="fav")list=Object.keys(S.fav).filter(id=>QMAP[id]);
  else if(v.mode==="undone")list=undonePool(v.bank||null).map(q=>q.id);  // 未做专练：跨模块或单模块
  else{
    list=buildPool(v.bank,v.src,v.types,true);
    if(v.course)list=list.filter(q=>q.bank===v.course);
    if(v.mode==="rand")list=shuffle(list);
  }
  // wrong/fav/undone 分支里 list 已是 id 字符串，其余分支是题目对象，统一归一成 id
  const ids=list.map(q=>typeof q==="string"?q:q.id);
  return {list:ids, idx:0, mode:v.mode, bank:v.bank, course:v.course||null,
    src:v.src||"all", types:v.types||null, picked:{}, judged:{},
    seqPos: v.mode==="seq" ? seqResumeIdx(list,bankKeyOf(v)) : 0};
}
function bankKeyOf(v){return v.course? v.bank+"::"+v.course : (v.bank||v.mode);}
/* 断点定位：S.seq[bankKey] 存"下次该练的题目 id"而非数字下标——斩杀/恢复会改变
   练习池成员，数字下标会错位（跳题或清零），按 id 定位则总能落回原位。
   返回该题在当前题单 list（保持题库全序的子序列）中的下标；
   若目标题本身已被斩杀/筛掉，则落在它原位置之后的第一题；旧版数字下标首次读取时迁移。 */
function seqResumeIdx(list,key){
  let v=S.seq[key];
  if(!v)return 0;
  const idOf=x=>typeof x==="string"?x:x.id;   // 兼容题目对象数组与 id 数组
  if(typeof v==="number"){            // 旧版数据：数字下标 → 按当前题单转成 id
    v = v>0&&v<list.length ? idOf(list[v]) : "";
    S.seq[key]=v;save();
    if(!v)return 0;
  }
  const t=QMAP[v];
  if(!t||t._pos==null)return 0;
  let n=0;
  for(const it of list){const q=typeof it==="string"?QMAP[it]:it;if(q&&q._pos<t._pos)n++;else break;}
  return n;
}
/* 课节：会话题单中连续同课程（bank）题目的分组，用于顺序模式的课程导航 */
function courseRanges(s){
  if(s._ranges)return s._ranges;
  const rs=[];
  s.list.forEach((id,i)=>{
    const b=QMAP[id].bank;
    const last=rs[rs.length-1];
    if(last&&last.bank===b)last.end=i+1;
    else rs.push({bank:b,start:i,end:i+1});
  });
  return s._ranges=rs;
}
function isFullSeq(s){return s.mode==="seq"&&!s.course&&s.src==="all"&&!s.types;}
function startSession(v){
  const s=newSession(v);
  if(!s.list.length){toast("该筛选条件下没有题目");return;}
  if(s.mode==="seq"&&s.seqPos>=s.list.length)s.seqPos=0;
  s.idx=s.seqPos||0;
  go({name:"practice",s});
}

function practiceHeader(s){
  const idx=s.idx+1,total=s.list.length;
  const answered=Object.keys(s.judged).length;
  const pct=total?Math.round(answered/total*100):0;
  const modeName=s.mode==="recite"?"背题模式":s.mode==="wrong"?"错题重练":s.mode==="fav"?"收藏练习":s.mode==="undone"?"未做专练":s.mode==="rand"?"随机练习":"顺序练习";
  let courseLine="";
  if(s.mode==="seq"&&s.idx<s.list.length){
    const q=QMAP[s.list[s.idx]];
    const rs=courseRanges(s);
    const ri=rs.findIndex(r=>s.idx>=r.start&&s.idx<r.end);
    if(ri>=0){
      const r=rs[ri];
      courseLine=`<div class="course-line"><span class="tag t-course">📚 ${esc(q.bank)}</span>
        <span class="mut">第 ${ri+1}/${rs.length} 门 · 本节 ${s.idx-r.start+1}/${r.end-r.start}${s.course?"":" · 总进度 "+idx+"/"+total}</span></div>`;
    }
  }
  return `<div class="pbar-wrap"><div class="ptxt"><span>${modeName} · ${answered>idx?answered:idx}/${total}</span><span>${pct}%</span></div>
  <div class="pbar"><div style="width:${pct}%"></div></div></div>${courseLine}`;
}

function renderQ(s,q){
  const judged = q.id in s.judged ? s.judged[q.id] : undefined;
  const picked = s.picked[q.id]||[];
  let h=`<div class="qhead">
    <span class="tag ${SRC_CLASS[q.source]}">${SRC_NAME[q.source]}</span>
    <span class="tag t-${q.type}">${TYPE_NAME[q.type]}</span>
    <span class="qno">📚 ${esc(q.bank)}</span></div>`;
  h+=`<div class="stem">${esc(q.stem)}</div>`;
  if(q.type==="judge"){
    const right=q.answer[0];
    const p1=picked.includes("正确"),p2=picked.includes("错误");
    let c1="",c2="";
    if(judged!==undefined){
      c1 = right==="正确"?"right":(p1?"wrongpick":"");
      c2 = right==="错误"?"right":(p2?"wrongpick":"");
    }
    h+=`<div class="judge-row">
      <button class="judge-btn ${c1}" data-j="正确">✓ 正确</button>
      <button class="judge-btn ${c2}" data-j="错误">✗ 错误</button></div>`;
  }else{
    h+=`<div class="opts">`+q.options.map((o,i)=>{
      const L=LETTERS[i];let cls="";
      if(judged!==undefined){
        if(q.answer.includes(L))cls="right";
        else if(picked.includes(L))cls="wrongpick";
        else cls="dim";
      }else if(picked.includes(L))cls="picked";
      return `<button class="opt ${cls}" data-o="${L}"><span class="ol">${L}</span><span>${esc(o)}</span></button>`;
    }).join("")+`</div>`;
    if(q.type==="multi"&&!judged)
      h+=`<div class="confirm-bar"><button class="big-btn ghost" id="confirm-multi" ${picked.length?"":"disabled"}>确认（已选 ${picked.length} 项）</button></div>`;
  }
  if(judged!==undefined||s.mode==="recite"){
    const ok = s.mode==="recite"?null:judged;
    if(ok!==null)
      h+=`<div class="feedback ${ok?"ok":"bad"}">${ok?"<b>回答正确</b>":"<b>回答错误</b>"}　正确答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    else
      h+=`<div class="feedback ok">答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    if(q.type!=="judge"&&q.options)h+=`<div class="mut" style="margin-top:6px;font-size:13.5px;">${esc(ansText(q))}</div>`;
    if(q.explanation){
      const elabel = q.source==="ppt-notes"
        ?'<span class="tag s-ppt-notes" style="font-size:10px;">官方讲解</span>'
        :q.source==="official"
          ?'<span class="tag s-official" style="font-size:10px;">解析 · 依据培训课件</span>'
          :q.source==="adapted"
            ?'<span class="tag s-adapted" style="font-size:10px;">改编题解析 · 仅供参考</span>'
            :'<span class="tag s-generated" style="font-size:10px;">AI 解析 · 仅供参考</span>';
      h+=`<div class="expl"><div class="elabel">📖 ${elabel}</div>${esc(q.explanation)}</div>`;
    }
    if(q.source==="adapted")
      h+=`<div class="mut" style="margin-top:6px;font-size:12px;">原题：${esc(q.origin||"")}</div>`;
    else if(q.source!=="official")
      h+=`<div class="mut" style="margin-top:6px;font-size:12px;">依据课件：${esc(q.origin||"")}</div>`;
    // 斩杀（功能4）：答对且很熟 → 斩杀，不再进随机/顺序/专项练习池
    if(judged===true&&s.mode!=="recite"){
      const slayed=!!S.slay[q.id];
      h+=`<div style="margin-top:12px;">${
        slayed
          ?`<button class="big-btn ghost" id="btn-unslay">↩ 已斩杀 · 点击恢复（重新进入练习池）</button>`
          :`<button class="big-btn" id="btn-slay" style="background:var(--warn);">⚔️ 斩杀（很熟了，不再随机出现）</button>`
      }</div>`;
    }
  }
  return h;
}

function vPractice(v){
  const s=v.s;
  if(s.idx>=s.list.length){ // 完成
    const correct=Object.values(s.judged).filter(Boolean).length;
    const total=Object.keys(s.judged).length;
    const doneTitle=s.mode==="undone"?"未做题清空了！":isFullSeq(s)?"全部顺序练习完成！":s.course?`《${esc(s.course)}》练完了！`:"本组完成！";
    let h=`<div class="card" style="text-align:center;padding:30px 16px;">
      <div style="font-size:44px;">🎉</div><h2 style="margin:10px 0 4px;">${doneTitle}</h2>
      <div class="mut">共 ${total} 题 · 正确 ${correct} 题${total?` · 正确率 ${Math.round(correct/total*100)}%`:""}</div>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button class="big-btn ghost" id="btn-again">再来一轮</button>

/* 课程过渡关卡：顺序模式下做完一门课的最后一题、进入下一门课前显示 */
function vGate(v){
  const s=v.s;
  const rs=courseRanges(s);
  const nextR=rs.find(r=>r.start===s.idx);
  const prevR=rs.find(r=>r.end===s.idx);
  let done=0,ok=0;
  if(prevR)for(let i=prevR.start;i<prevR.end;i++){
    const id=s.list[i];
    if(id in s.judged){done++;if(s.judged[id])ok++;}
  }
  let h=`<div class="card gate-card">
    <div class="gate-ic">📚</div>`;
  if(prevR){
    h+=`<div class="gate-done">《${esc(prevR.bank)}》已完成</div>
    <div class="mut">共 ${prevR.end-prevR.start} 题 · 本次作答 ${done} 题${done?` · 对 ${ok} 题（${Math.round(ok/done*100)}%）`:""}</div>`;
  }
  if(nextR){
    h+=`<div class="gate-next">下一门：《${esc(nextR.bank)}》</div>
    <div class="mut">${nextR.end-nextR.start} 题</div>
    <button class="big-btn" id="gate-go" style="margin-top:14px;">开始《${esc(nextR.bank)}》</button>`;
  }
  h+=`<div style="display:flex;gap:10px;margin-top:10px;">
      <button class="big-btn ghost" id="gate-sheet">跳转到课程</button>
      <button class="big-btn ghost" id="gate-back">返回课程列表</button></div></div>`;
  return h;
}

/* 下一题（手动按钮与答对自动切换共用） */
function practiceNext(s){
  if(s.idx<s.list.length-1){
    s.idx++;
    if(s.mode==="seq"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}
    if(isFullSeq(s)&&courseRanges(s).some(r=>r.start===s.idx)){
      s.gateSeen=s.gateSeen||{};
      if(!s.gateSeen[s.idx]){s.gate=true;s.gateSeen[s.idx]=1;}
    }
    render();
  }
  else{s.idx++;if(s.mode==="seq"){S.seq[bankKeyOf(s)]="";save();}render();}
}
function bindPractice(v){
  const s=v.s;
  if(s.gate&&isFullSeq(s)){
    $("#gate-go").onclick=()=>{s.gate=false;render();};
    $("#gate-sheet").onclick=()=>openSheet(s,null);
    $("#gate-back").onclick=()=>{stack=[];go({name:"modes",bank:s.bank},true);};
    return;
  }
  const q = s.idx<s.list.length ? QMAP[s.list[s.idx]] : null;
  if(!q){
    const again=$("#btn-again");
    if(again){
      again.onclick=()=>{
        // 未做专练：刚做完的题都已入 S.done，池子可能已空，直接回首页并提示
        if(s.mode==="undone"&&!undonePool(s.bank||null).length){
          toast("没有未做的题了 🎉");stack=[];go({name:"home"},true);return;
        }
        const nv={...v,s:newSession({mode:s.mode,bank:s.bank,src:s.src,types:s.types,course:s.course})};if(s.mode==="seq")S.seq[bankKeyOf(s)]="",save();nv.s.idx=0;go(nv,true);};
      $("#btn-back-home").onclick=()=>{stack=[];go({name:"home"},true);};
    }
    return;
  }
  const qcard=$("#qcard");
  if(qcard)qcard.onclick=(e)=>{
    const jb=e.target.closest("[data-j]");
    const ob=e.target.closest("[data-o]");
    const cb=e.target.closest("#confirm-multi");
    const slayBtn=e.target.closest("#btn-slay");
    const unslayBtn=e.target.closest("#btn-unslay");
    if(slayBtn){clearTimeout(s._autoT);S.slay[q.id]=1;save();toast("已斩杀，不再随机出现");render();return;}
    if(unslayBtn){clearTimeout(s._autoT);delete S.slay[q.id];save();toast("已恢复，重新进入练习池");render();return;}
    if(s.mode==="recite")return;
    if(q.id in s.judged)return;
    if(q.type==="judge"&&jb){
      judge(q,[jb.dataset.j]);
    }else if(q.type==="single"&&ob){
      judge(q,[ob.dataset.o]);
      }else if(q.type==="multi"){
      if(ob){
        const p=(s.picked[q.id]=s.picked[q.id]||[]);
        const i=p.indexOf(ob.dataset.o);
        if(i>=0)p.splice(i,1);else p.push(ob.dataset.o);
        s.picked[q.id]=p.slice().sort();
        render();
      }else if(cb){
        if((s.picked[q.id]||[]).length)judge(q,s.picked[q.id].slice().sort());
      }
    }
  };
  function judge(q,picked){
    s.picked[q.id]=picked;
    const ok = q.type==="judge"
      ? picked[0]===q.answer[0]
      : picked.length===q.answer.length && picked.every((l,i)=>l===q.answer[i]);
    s.judged[q.id]=ok;
    const d=S.done[q.id]=S.done[q.id]||{c:0,w:0};
    if(ok)d.c++;else{d.w++;S.wrong[q.id]=(S.wrong[q.id]||0)+1;}
    d.t=Date.now();
    // 累计错满 AUTO_FAV_TIMES 次 → 自动进收藏（手动取消过的不再加回）
    const autoFaved = autoFavCheck(q.id, ok);
    let wn=0;  // 攻克前累计错的次数
    if(ok&&s.mode==="wrong"&&S.wrong[q.id]){wn=S.wrong[q.id];delete S.wrong[q.id];}
    bumpDaily();save();render();
    if(autoFaved)toast(`累计错 ${d.w} 次 → 已自动收藏，可在收藏页集中练`);
    else if(wn>1)toast(`已攻克（之前错了 ${wn} 次）`);
    // 答对自动切下一题（0.8 秒缓冲，手动操作可打断）
    if(ok){
      clearTimeout(s._autoT);
      s._autoT=setTimeout(()=>{
        if(curView&&curView.name==="practice"&&curView.s===s)practiceNext(s);
      },800);
    }
  }
}
function bindPracticeFoot(v){

/* ================= 模拟考试 ================= */
function vExamSetup(v){

      ${bankNames.map(n=>`<button class="chip ${ebank===n?"on":""}" data-ebank="${esc(n)}">${esc(n)}（${all.filter(q=>q.bank===n).length}）</button>`).join("")}
    </div>`;
  }
  h+=`<label>题目来源</label>
    <div class="filter-row" id="exam-src">
      ${official?`<button class="chip ${v.src==="official"?"on":""}" data-src="official">仅真题（${official}）</button>`:""}
      <button class="chip ${v.src==="all"?"on":""}" data-src="all">全部题源（${poolAll.length}）</button>
    </div>

    <div class="cnt-row" id="exam-cnt">
      ${caps.map(n=>`<button class="chip ${v.cnt===n?"on":""}" data-cnt="${n}">${n} 题</button>`).join("")}
    </div>
    <label>考试时长</label>
    <div class="filter-row" id="exam-time">
      ${[[1,"每题1分钟"],[0.5,"每题30秒"],[1.5,"每题1.5分钟"]].map(m=>
        `<button class="chip ${(v.min||1)===m[0]?"on":""}" data-min="${m[0]}">${m[1]}</button>`).join("")}
    </div>
    <div class="divider"></div>
    <button class="big-btn" id="exam-start">开始考试</button>
    <div class="mut" style="margin-top:10px;font-size:12.5px;">按题型比例随机抽题组卷；交卷后按题库原分值计分，80分及格；答错的题自动进错题本。</div>
  </div>`;

}
function bindExamSetup(v){
  const eb=$("#exam-bank");
  if(eb)eb.onclick=e=>{const c=e.target.closest("[data-ebank]");if(!c)return;
    v.ebank=c.dataset.ebank||null;v.cnt=null;render();};
  $("#exam-src").onclick=e=>{const c=e.target.closest("[data-src]");if(!c)return;
    v.src=c.dataset.src;render();};
  $("#exam-cnt").onclick=e=>{const c=e.target.closest("[data-cnt]");if(!c)return;
    v.cnt=+c.dataset.cnt;[...$("#exam-cnt").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-time").onclick=e=>{const c=e.target.closest("[data-min]");if(!c)return;
    v.min=+c.dataset.min;[...$("#exam-time").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-start").onclick=()=>{
    if(!v.cnt){toast("请选择题数");return;}
    const base=buildPool(v.bank,v.src,null).filter(q=>["single","multi","judge"].includes(q.type));
    const pool=v.ebank?base.filter(q=>q.bank===v.ebank):base;
    if(!pool.length){toast("该题库没有题目");return;}
    const need=Math.min(v.cnt,pool.length);
    // 按题型比例抽题
    const byType={};pool.forEach(q=>(byType[q.type]=byType[q.type]||[]).push(q));
    const picked=[];const total=pool.length;
    ["single","multi","judge"].forEach(t=>{
      if(!byType[t])return;
      const n=Math.min(byType[t].length,Math.round(need*byType[t].length/total));
      picked.push(...shuffle(byType[t]).slice(0,n));
    });
    if(picked.length<need){ // 比例取整可能差一两题，从剩余题里补齐
      const have=new Set(picked.map(q=>q.id));
      picked.push(...shuffle(pool.filter(q=>!have.has(q.id))).slice(0,need-picked.length));
    }
    const mins=v.min||1;
    let exam={list:shuffle(picked).map(q=>q.id),idx:0,picked:{},submitted:false,
      bank:v.bank,ebank:v.ebank||null,
      timeLimit:Math.round(need*mins*60),remain:Math.round(need*mins*60),startAt:Date.now()};
    go({name:"exam",s:exam});
  };
}
function vExam(v){

  h+=`<div class="card"><div class="qhead">

function bindExam(v){
  const s=v.s;

  $("#f-sheet").onclick=()=>openSheet(s,submitExam);

let examTimer=null;
function startExamTimer(v){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    const s=v.s;
    if(!s||s.submitted||curView!==v){clearInterval(examTimer);return;}
    s.remain--;
    const t=$("#exam-timer");
    if(t){t.textContent=fmtTime(s.remain);t.classList.toggle("danger",s.remain<60);}
    if(s.remain<=0){clearInterval(examTimer);toast("时间到，自动交卷");submitExam(v);}
  },1000);
}
function submitExam(v){
  const s=v.s;if(s.submitted)return;
  const unanswered=s.list.length-Object.keys(s.picked).length;
  const doSubmit=()=>{
    s.submitted=true;
    let score=0,full=0,correct=0,wrongList=[];
    s.list.forEach(id=>{
      const q=QMAP[id];full+=qScore(q);
      const picked=s.picked[id]||[];
      const ok=q.type==="judge"?picked[0]===q.answer[0]
        :picked.length===q.answer.length&&picked.slice().sort().every((l,i)=>l===q.answer[i]);
      if(ok){score+=qScore(q);correct++;}
      else{wrongList.push(id);
        const d=S.done[id]=S.done[id]||{c:0,w:0};d.w++;S.wrong[id]=(S.wrong[id]||0)+1;}
      const dd=S.done[id]=S.done[id]||{c:0,w:0};dd.t=Date.now();
      if(ok){dd.c++;}
      if(picked.length)bumpDaily();
    });
    s.score=score;s.full=full;s.correct=correct;s.wrongList=wrongList;
    clearInterval(examTimer);save();
    stack=stack.filter(x=>x.name!=="exam");
    go({name:"exam",s},true);
  };
  if(unanswered>0){
    if(confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`))doSubmit();
  }else doSubmit();
}
function vResult(v){

/* ================= 答题卡 ================= */
function openSheet(s,onSubmit){
  const isExam = typeof onSubmit==="function";
  let courseNav="";
  if(s.mode==="seq"&&s.list.length){
    const rs=courseRanges(s);
    if(rs.length>1){
      courseNav=`<div class="course-nav">${rs.map((r,i)=>{
        const cur=s.idx>=r.start&&s.idx<r.end;
        return `<button class="chip ${cur?"on":""}" data-ci="${i}" title="${esc(r.bank)}">${esc(r.bank)}（${r.end-r.start}）</button>`;
      }).join("")}</div>`;
    }
  }
  let gridHTML=s.list.map((id,i)=>{
    let cls="";
    if(isExam){if(s.picked[id])cls="done";}
    else{if(s.judged[id]!=null)cls=s.judged[id]?"done-ok":"done-bad";}
    if(i===s.idx)cls+=" cur";
    return `<button class="sq ${cls}" data-i="${i}">${i+1}</button>`;
  }).join("");
  const mask=document.createElement("div");
  mask.className="sheet-mask";
  mask.innerHTML=`<div class="sheet"><h3>答题卡（共 ${s.list.length} 题）</h3>
    ${courseNav}
    <div class="grid">${gridHTML}</div>
    ${isExam?`<div style="margin-top:14px;display:flex;gap:10px;">
      <button class="big-btn ghost" id="sheet-close">继续作答</button>
      <button class="big-btn" id="sheet-submit">交 卷</button></div>`
    :`<div style="margin-top:14px;"><button class="big-btn ghost" id="sheet-close">关 闭</button></div>`}
  </div>`;
  document.body.appendChild(mask);
  mask.addEventListener("click",e=>{
    if(e.target===mask)mask.remove();
    const cchip=e.target.closest("[data-ci]");
    if(cchip){
      const r=courseRanges(s)[+cchip.dataset.ci];
      s.idx=r.start;s.gate=false;
      if(s.mode==="seq"&&curView.name==="practice"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}
      mask.remove();render();return;
    }
    const sq=e.target.closest("[data-i]");
    if(sq){s.idx=+sq.dataset.i;s.gate=false;if(s.mode==="seq"&&curView.name==="practice"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}mask.remove();render();}
    if(e.target.id==="sheet-close")mask.remove();
    if(e.target.id==="sheet-submit"){mask.remove();onSubmit(curView);}
  });
}

    if(!n)return;

      Object.keys(S.slay).forEach(id=>{if(QMAP[id])delete S.slay[id];});
      save();render();
    }
  };
  const pw=$("#btn-practice-wrong");
  if(pw)pw.onclick=()=>{
    const ids=Object.keys(S.wrong).filter(id=>QMAP[id]);

  };
  const pf=$("#btn-practice-fav");

    const ids=Object.keys(S.fav).filter(id=>QMAP[id]);

  };
  const c=$("#btn-clear-list");

    const w=Object.keys(S.wrong).length, f=Object.keys(S.fav).length, k=Object.keys(S.slay).length;
    if(!w&&!f&&!k)return;

/* ================= 导出 / 导入 ================= */
const ID_MARK="#id:";   // txt 导出时附在每题末尾的隐藏题号，供再导入时识别
function download(name,text,mime){
  const blob=new Blob(["\ufeff"+text],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("已开始下载");
}
function exportQuestions(ids,label){
  const lines=[`${label}导出（核电入职刷题）`,`导出时间：${new Date().toLocaleString()}　共 ${ids.length} 题`,""];
  ids.forEach((id,i)=>{
    const q=QMAP[id];if(!q)return;
    lines.push(`${i+1}. [${DATA.modules[q.module]||""} · ${q.bank} · ${TYPE_NAME[q.type]}] ${q.stem}`);
    (q.options||[]).forEach((o,j)=>lines.push(`    ${LETTERS[j]}．${o}`));
    lines.push(`    ✅ 答案：${q.type==="judge"?q.answer[0]:q.answer.join("")}`);
    if(q.type!=="judge"&&q.options)lines.push(`    ${ansText(q)}`);
    if(q.explanation)lines.push(`    📖 解析：${q.explanation}`);
    lines.push(`    ${ID_MARK} ${id}`);   // 隐藏题号，便于这个文件再导入
    lines.push("");
  });
  download(`核电刷题_${label}_${today()}.txt`,lines.join("\n"));
}

/* ---------- 导入 / 恢复 ---------- */
function parsePayload(text){
  text=String(text||"").replace(/^\ufeff/,"");
  if(text.trim().charAt(0)==="{"){
    let o;try{o=JSON.parse(text);}catch(e){alert("备份文件解析失败："+e.message);return null;}
    if(!o||typeof o!=="object"||(!o.wrong&&!o.fav&&!o.done&&!o.slay)){alert("这不是本 App 的备份文件");return null;}
    return {kind:"backup",time:o.time||"",
      wrong:o.wrong||{},fav:o.fav||{},slay:o.slay||{},
      done:o.done||{},daily:o.daily||{},seq:o.seq||{}};
  }
  // txt：靠隐藏的题号识别
  const ids=[];const re=new RegExp(ID_MARK.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*(\\S+)","g");
  let m;while((m=re.exec(text)))ids.push(m[1]);
  if(!ids.length){alert("这个文件里没找到题号。\n请用本 App 导出的 txt，或导出时选择「备份全部进度（JSON）」。");return null;}
  return {kind:"txt",ids:ids};
}
function countOf(o){return o&&typeof o==="object"?Object.keys(o).length:0;}
function openImport(){
  const mask=document.createElement("div");
  mask.className="sheet-mask";
  mask.innerHTML=`<div class="sheet"><h3>⤒ 导入 / 恢复</h3>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="big-btn" id="imp-pick">选择备份文件（.json / .txt）</button>
      <button class="big-btn ghost" id="imp-close">取 消</button>
    </div>
    <div class="mut" style="margin-top:10px;">
      · <b>JSON 备份</b>：恢复错题（含错次）、收藏、斩杀、答题记录、每日统计<br>
      · <b>txt 题单</b>：按文件里的题号恢复成错题 / 收藏列表<br>
      · 导入时可选择「合并」或「覆盖」，只影响本机记录，不动题库
    </div>
    <input type="file" id="imp-file" accept=".json,.txt,application/json,text/plain" style="display:none;"></div>`;
  document.body.appendChild(mask);
  const file=mask.querySelector("#imp-file");
  mask.querySelector("#imp-pick").onclick=()=>file.click();
  file.onchange=()=>{
    const f=file.files&&file.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{mask.remove();afterReadImport(String(r.result||""),f.name);};
    r.onerror=()=>{alert("文件读取失败");};
    r.readAsText(f,"utf-8");
  };
  mask.addEventListener("click",e=>{if(e.target===mask||e.target.id==="imp-close")mask.remove();});
}
function afterReadImport(text,name){
  const p=parsePayload(text);if(!p)return;
  let miss=0;
  const chk=o=>{Object.keys(o||{}).forEach(id=>{if(!QMAP[id])miss++;});};
  if(p.kind==="backup"){chk(p.wrong);chk(p.fav);chk(p.slay);chk(p.done);}
  else p.ids.forEach(id=>{if(!QMAP[id])miss++;});
  confirmImport(p,name,miss);
}
function confirmImport(p,name,miss){
  let inW,inF,inK,inD,warn="";
  if(p.kind==="backup"){
    inW=countOf(p.wrong);inF=countOf(p.fav);inK=countOf(p.slay);inD=countOf(p.done);
  }else{
    // txt：让用户决定恢复到错题还是收藏；文件名带「收藏」就默认收藏
    const guess=/收藏/.test(name)&&!/错题/.test(name)?"fav":"wrong";
    inW=guess==="wrong"?p.ids.length:0;
    inF=guess==="fav"?p.ids.length:0;inK=0;inD=0;
    warn=`<div class="filter-row" id="imp-tgt" style="margin:10px 0 0;">
      <button class="chip ${guess==="wrong"?"on":""}" data-tgt="wrong">恢复到错题</button>
      <button class="chip ${guess==="fav"?"on":""}" data-tgt="fav">恢复到收藏</button>
    </div>`;
  }
  const curW=Object.keys(S.wrong).length,curF=Object.keys(S.fav).length,curD=Object.keys(S.done).length;
  const mask=document.createElement("div");
  mask.className="sheet-mask";
  mask.innerHTML=`<div class="sheet"><h3>确认导入</h3>
    <div class="mut" style="line-height:1.7;">文件：<b>${esc(name)}</b>${p.time?`<br>导出时间：${esc(String(p.time).slice(0,10))}`:""}
      <br>含：错题 ${inW}${p.kind==="backup"?`（其中反复错 ${Object.keys(p.wrong||{}).filter(id=>(p.wrong[id]||0)>1).length}）`:""} · 收藏 ${inF} · 斩杀 ${inK} · 答题记录 ${inD}
      ${miss?`<br><span style="color:var(--warn)">⚠ 有 ${miss} 条在当前题库中找不到对应题目，将忽略</span>`:""}
      <br>本机：错题 ${curW} · 收藏 ${curF} · 答题记录 ${curD}</div>
    ${warn}
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
      <button class="big-btn" id="mg-merge">合并（两边都留，错次取大）</button>
      <button class="big-btn ghost" id="mg-over">覆盖（用文件替换本机）</button>
      <button class="big-btn ghost" id="mg-close">取 消</button>
    </div></div>`;
  document.body.appendChild(mask);
  let tgt=(mask.querySelector("#imp-tgt .chip.on")||{}).dataset;
  tgt=tgt?tgt.tgt:"wrong";
  mask.addEventListener("click",e=>{
    const c=e.target.closest("[data-tgt]");
    if(c){mask.querySelectorAll("[data-tgt]").forEach(x=>x.classList.remove("on"));c.classList.add("on");tgt=c.dataset.tgt;return;}
    if(e.target===mask||e.target.id==="mg-close"){mask.remove();return;}
    if(e.target.id==="mg-merge"){mask.remove();applyImport(p,"merge",tgt);}
    if(e.target.id==="mg-over"){mask.remove();applyImport(p,"over",tgt);}
  });
}
function applyImport(p,mode,tgt){
  const merge=mode==="merge";
  let addedW=0,addedF=0,addedK=0,addedD=0;
  const putW=(o)=>Object.keys(o).forEach(id=>{
    if(!QMAP[id])return;
    const n=(typeof o[id]==="number"&&isFinite(o[id]))?Math.max(1,Math.floor(o[id])):1;
    const old=S.wrong[id]||0;
    const v=merge?Math.max(old,n):n;
    if(!old)addedW++;
    S.wrong[id]=v;
  });
  const put1=(box,o)=>Object.keys(o).forEach(id=>{
    if(!QMAP[id])return;
    if(!box[id]){box[id]=1;if(box===S.fav)addedF++;else addedK++;}
  });
  if(p.kind==="backup"){
    if(!merge){S.wrong={};S.fav={};S.slay={};S.done={};S.daily={};S.autofav={};S.favSkip={};}
    else{S.fav=S.fav||{};S.slay=S.slay||{};S.done=S.done||{};S.daily=S.daily||{};
      S.autofav=S.autofav||{};S.favSkip=S.favSkip||{};}
    putW(p.wrong);put1(S.fav,p.fav);put1(S.slay,p.slay);
    // 自动收藏标记（旧备份没有这两个字段，缺失时按空处理）
    put1(S.autofav,p.autofav||{});put1(S.favSkip,p.favSkip||{});
    Object.keys(p.done||{}).forEach(id=>{
      if(!QMAP[id])return;
      const o=p.done[id]||{},d=S.done[id];
      if(!d){S.done[id]={c:+o.c||0,w:+o.w||0,t:+o.t||0};addedD++;}
      else{
        d.c=merge?Math.max(d.c||0,+o.c||0):(+o.c||0);
        d.w=merge?Math.max(d.w||0,+o.w||0):(+o.w||0);
        d.t=Math.max(d.t||0,+o.t||0);
      }
    });
    Object.keys(p.daily||{}).forEach(d=>{
      S.daily[d]=merge?Math.max(S.daily[d]||0,+p.daily[d]||0):(+p.daily[d]||0);
    });
    Object.keys(p.seq||{}).forEach(k=>{if(QMAP[p.seq[k]])S.seq[k]=p.seq[k];});
  }else{
    const box={};p.ids.forEach(id=>{if(QMAP[id])box[id]=1;});
    if(tgt==="fav"){if(!merge)S.fav={};put1(S.fav,box);}
    else{if(!merge)S.wrong={};putW(box);}
  }
  autoFavScan();   // 导入的答题记录里，累计错满 N 次的题一并收进收藏
  save();render();
  const parts=[`错题 +${addedW}`,`收藏 +${addedF}`];
  if(p.kind==="backup")parts.push(`斩杀 +${addedK}`,`答题记录 +${addedD}`);
  toast(`${merge?"已合并":"已覆盖"}：${parts.join(" · ")}`);
}
function vQView(v){
  const q=QMAP[v.qid];
  const s={list:[v.qid],idx:0,mode:"recite",judged:{},picked:{}};
  return `<h2 class="pg">题目详情</h2><div class="card" id="qcard">${renderQ(s,q)}</div>
  <div style="display:flex;gap:10px;">
    <button class="big-btn ghost" id="qv-fav">${S.fav[q.id]?"★ 取消收藏":"☆ 收藏"}</button>
    <button class="big-btn" id="qv-back">返 回</button></div>`;
}
function bindQView(v){
  const q=QMAP[v.qid];
  $("#qv-back").onclick=back;
  $("#qv-fav").onclick=()=>{toggleFav(q.id);render();};
}

/* ================= 统计 ================= */
function vStats(){
  const doneIds=Object.keys(S.done);
  let attempts=0,correct=0;
  doneIds.forEach(id=>{attempts+=S.done[id].c+S.done[id].w;correct+=S.done[id].c;});
  const acc=attempts?Math.round(correct/attempts*100):0;
  let h=`<h2 class="pg">学习统计</h2>
  <div class="stat-nums">
    <div class="stat-cell"><div class="v">${doneIds.length}</div><div class="k">已刷题目</div></div>
    <div class="stat-cell"><div class="v">${acc}%</div><div class="k">总体正确率</div></div>
    <div class="stat-cell"><div class="v">${Object.keys(S.wrong).length}</div><div class="k">错题待攻克</div></div>
  </div>`;
  h+=`<div class="sec-title">各科进度</div><div class="card">`;
  for(const mid of ["qihang","basics","safety"]){
    const p=modProgress(mid);
    h+=`<div class="bank-stat"><div class="bs-top"><b>${esc(DATA.modules[mid]||mid)}</b><span>${p.done}/${p.total}（${p.pct}%）</span></div>
      <div class="pbar"><div style="width:${p.pct}%"></div></div></div>`;
  }
  h+=`</div>`;
  h+=`<div class="sec-title">近 14 天刷题量</div><div class="card dailies-wrap"><div class="dailies">`;
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
  }
  const max=Math.max(1,...days.map(d=>S.daily[d]||0));
  days.forEach((d,i)=>{
    const n=S.daily[d]||0;
    h+=`<div class="dbar"><div style="height:${Math.round(n/max*72)}px"></div><span>${i%2===0?d.slice(5):""}</span></div>`;
  });
  h+=`</div></div>`;
  // 反复错的题：累计错 ≥2 次，按错次降序（S.done.w 是历史累计，错题本移除后仍留痕）
  const rep=Object.keys(S.done).filter(id=>QMAP[id]&&(S.done[id].w||0)>=2)
    .sort((a,b)=>(S.done[b].w||0)-(S.done[a].w||0));
  if(rep.length){
    const repW=rep.filter(id=>S.wrong[id]).length;
    h+=`<div class="sec-title">反复错的题（${rep.length} 题${repW?` · ${repW} 题还在错题本`:" · 已全部攻克"}）</div>
      <div class="card" style="padding:4px 14px;" id="stats-rep">`+
      rep.slice(0,15).map(id=>{
        const q=QMAP[id],n=S.done[id].w;
        return `<div class="res-item" data-qid="${id}">
          <div class="rs">${esc(q.stem)}</div>
          <div class="rmeta"><span class="tag s-wrongx" style="font-size:10px;">✗ ${n} 次</span>
          ${S.wrong[id]?`<span class="tag s-wrongmark" style="font-size:10px;">待攻克</span>`:`<span class="tag s-official" style="font-size:10px;">已攻克</span>`}
          <span>${esc(DATA.modules[q.module]||"")} · ${esc(q.bank)}</span></div></div>`;
      }).join("")+`</div>`;
    if(rep.length>15)h+=`<div class="mut" style="margin:6px 2px 0;">按错次排序，仅显示前 15 题</div>`;
  }
  const slayN=Object.keys(S.slay).filter(id=>QMAP[id]).length;
  h+=`<div class="card"><div class="mut">⚔️ 已斩杀 <b>${slayN}</b> 题（答对后主动斩杀，不再进随机/顺序/专项练习；可在「收藏 / 错题」页恢复）</div></div>`;
  h+=`<div class="about">数据保存在本机浏览器中<br>共 ${questions.length} 题 · 构建时间：${DATA.buildTime}</div>`;
  return h;
}

function bindStats(){
  const box=$("#stats-rep");if(!box)return;
  box.querySelectorAll("[data-qid]").forEach(el=>el.onclick=()=>go({name:"qview",qid:el.dataset.qid}));
}

/* ================= 搜索 ================= */
function vSearch(){
  return `<h2 class="pg">搜题</h2>
  <input class="search-input" id="search-in" placeholder="输入关键词，搜索题干和选项…" value="${esc((curView.q||""))}">
  <div id="search-res"></div>`;
}
function doSearch(kw){
  const res=$("#search-res");
  if(!kw||kw.length<2){res.innerHTML=`<div class="empty">输入至少 2 个字开始搜索</div>`;return;}
  const k=kw.toLowerCase();
  const hits=questions.filter(q=>
    q.stem.toLowerCase().includes(k)||
    (q.options||[]).some(o=>o.toLowerCase().includes(k))).slice(0,80);
  if(!hits.length){res.innerHTML=`<div class="empty">没有找到「${esc(kw)}」相关题目</div>`;return;}
  res.innerHTML=`<div class="mut" style="margin:0 2px 6px;">找到 ${hits.length} 题</div><div class="card" style="padding:4px 14px;">`+
    hits.map(q=>`<div class="res-item" data-qid="${q.id}">
      <div class="rs">${esc(q.stem)}</div>
      <div class="rmeta"><span class="tag ${SRC_CLASS[q.source]}" style="font-size:10px;">${SRC_NAME[q.source]}</span>
      <span class="tag t-${q.type}" style="font-size:10px;">${TYPE_NAME[q.type]}</span>
      <span>${esc(DATA.modules[q.module]||"")} · ${esc(q.bank)}</span></div></div>`).join("")+`</div>`;
  res.querySelectorAll("[data-qid]").forEach(el=>el.onclick=()=>go({name:"qview",qid:el.dataset.qid}));
}
function bindSearch(){
  const inp=$("#search-in");
  inp.focus();
  let h;
  inp.oninput=()=>{clearTimeout(h);h=setTimeout(()=>{curView.q=inp.value;doSearch(inp.value);},250);};
  if(inp.value)doSearch(inp.value);
}

/* ================= 渲染分发 ================= */
function render(){
  const v=curView;
  const vw=$("#view");
  let h="",title="",showNav=true;
  switch(v.name){
    case "home":h=vHome();break;
    case "modes":h=vModes(v);title=BANKS[v.bank].bank;break;
    case "practice":h=vPractice(v);title="练习";showNav=!!(v.s.idx<v.s.list.length&&!v.s.gate);break;
    case "examsetup":h=vExamSetup(v);title="模拟考试";break;
    case "exam":
      if(v.s.submitted){h=vResult(v);title="考试结果";showNav=false;}
      else{h=vExam(v);title="模拟考试"+(v.s.ebank?" · "+v.s.ebank:"");showNav=true;}
      break;
    case "fav":h=vFav();break;
    case "stats":h=vStats();break;
    case "search":h=vSearch();break;
    case "qview":h=vQView(v);title="题目详情";showNav=false;break;
  }
  vw.innerHTML=h;
  renderNav();renderHeader(title);
  const footLive = (v.name==="practice"&&v.s.idx<v.s.list.length&&!v.s.gate)||(v.name==="exam"&&!v.s.submitted);
  if(!footLive){const qf=$("#qfoot");if(qf)qf.remove();}
  // 绑定
  document.querySelectorAll(".mcard").forEach(el=>el.onclick=()=>go({name:"modes",bank:el.dataset.mod}));
  // 未做专练入口（首页跨模块 / 模块页单模块，bank 为空串表示全部模块）
  document.querySelectorAll("[data-undone]").forEach(el=>
    el.onclick=()=>startUndone(el.dataset.undone||null));
  switch(v.name){
    case "modes":bindModes(v);break;
    case "practice":
      bindPractice(v);
      if(v.s.idx<v.s.list.length)bindFoot(v);
      break;
    case "examsetup":bindExamSetup(v);break;
    case "exam":
      if(v.s.submitted)bindResult(v);
      else{bindFoot(v);startExamTimer(v);window.scrollTo(0,0);}
      break;
    case "fav":bindList();break;
    case "stats":bindStats();break;
    case "search":bindSearch();break;
    case "qview":bindQView(v);break;
  }
}
function bindFoot(v){
  const s=v.s;
  const q=s.idx<s.list.length?QMAP[s.list[s.idx]]:null;
  const old=$("#qfoot");if(old)old.remove();
  const foot=document.createElement("div");
  foot.className="qfoot";foot.id="qfoot";
  foot.innerHTML=`
    <button class="fbtn" id="f-star"><span class="fi">${q&&S.fav[q.id]?"★":"☆"}</span>收藏</button>
    <button class="fnav navbtn prev" id="f-prev">上一题</button>
    <button class="fnav navbtn next" id="f-next">${s.idx>=s.list.length-1?(curView.name==="exam"?"交卷":"完成"):"下一题"}</button>
    <button class="fbtn" id="f-sheet"><span class="fi">▦</span>答题卡</button>`;
  document.body.appendChild(foot);
  if(curView.name==="practice")bindPracticeFoot(v);
  else if(curView.name==="exam")bindExam(v);
}

function bindModes(v){
  const b=BANKS[v.bank];
  const state={mode:null,src:"all",types:new Set(["single","multi","judge"])};
  const srcEl=$("#src-filter"),typeEl=$("#type-filter");
  // 更新专项练习各题型数量
  const cnt={};b.list.forEach(q=>cnt[q.type]=(cnt[q.type]||0)+1);
  typeEl.querySelectorAll("[data-type]").forEach(el=>{
    el.textContent=`${TYPE_NAME[el.dataset.type]}（${cnt[el.dataset.type]||0}）`;
    el.onclick=()=>{
      const t=el.dataset.type;
      if(state.types.has(t))state.types.delete(el.dataset.type);else state.types.add(t);
      el.classList.toggle("on");
    };
  });
  srcEl.querySelectorAll("[data-src]").forEach(el=>{
    el.onclick=()=>{state.src=el.dataset.src;
      srcEl.querySelectorAll("[data-src]").forEach(x=>x.classList.toggle("on",x===el));};
  });
  $("#mode-grid").querySelectorAll("[data-mode]").forEach(el=>{
    el.onclick=()=>{
      const m=el.dataset.mode;
      if(m==="type"){
        srcEl.style.display="flex";typeEl.style.display="flex";
        el.classList.toggle("on");
        return;
      }
      startSession({mode:m,bank:v.bank,src:"all",types:null});
    };
  });
  // 专项练习开始按钮
  const startBtn=document.createElement("button");
  startBtn.className="big-btn";startBtn.textContent="开始专项练习";
  startBtn.style.marginTop="10px";
  typeEl.parentNode.appendChild(startBtn);
  startBtn.onclick=()=>{
    if(!state.types.size){toast("请先勾选题型");return;}
    startSession({mode:"seq",bank:v.bank,src:state.src,types:[...state.types]});
  };
  // 课程列表：点哪门刷哪门（空值 = 全部课程整体顺序）
  document.querySelectorAll("[data-course]").forEach(el=>{
    el.onclick=()=>startSession({mode:"seq",bank:v.bank,src:"all",types:null,course:el.dataset.course||null});
  });
  // 断点续练（按题目 id 定位，斩杀/恢复不影响）
  const pool=buildPool(v.bank,"all",null,true);
  const rIdx=seqResumeIdx(pool,v.bank);
  if(rIdx>0&&rIdx<pool.length){
    const qAt=pool[rIdx];
    const where=qAt?`《${esc(qAt.bank)}》 `:"";
    $("#resume-info").innerHTML=`上次顺序练习到 ${where}第 <b>${rIdx+1}</b> 题　<button class="chip on" id="btn-resume">继续</button>`;
    $("#btn-resume").onclick=()=>startSession({mode:"seq",bank:v.bank,src:"all",types:null});
  }
  $("#exam-card").onclick=()=>go({name:"examsetup",bank:v.bank});
}

/* ================= 启动 ================= */
loadState();
$("#btn-back").onclick=back;
$("#btn-dk").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",cur?"light":"dark");
  try{localStorage.setItem("tiku_theme",cur?"light":"dark");}catch(e){}
};
try{
  const th=localStorage.getItem("tiku_theme");
  if(th==="dark"||( !th && false ))document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
$("#nav").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  stack=[];
  go({name:t.dataset.t},true);
});
go({name:"home"},true);
</script>
</body>
</html>
