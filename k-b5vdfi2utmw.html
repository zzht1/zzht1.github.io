的吊装作业还应提前编制吊装作业计划并召开工前会，明确人员任务、交流方法和风险应对。"},{"id":"safety_fsjx_0204","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"无肩有眼螺栓，只能用于垂直起重，有肩有眼螺栓，可用于有一定角度的起重。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：无肩有眼螺栓只用于垂直起重，在有角度拉动时会弯曲或折断导致失败；有肩有眼螺栓可用于有角度的起重。题干与课件一致，故说法正确。易被误导处：有肩螺栓若肩部没有100%接触到载荷表面，应被当成无肩螺栓对待（可用垫片创造100%接触效果），不能想当然地当作有肩使用。【易混点】有肩有眼螺栓还必须被导向，以便能在眼平面拉动载荷，且不用于小于45°的角度。"},{"id":"safety_fsjx_0205","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"单根吊装时，将吊带直接挂入吊钩受力中心位置，不能挂在吊钩钩尖部位。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：单根吊装时，将吊带直接挂入吊钩受力中心位置，不能挂在吊钩钩尖部位，且严禁超载使用，题干与课件一致，故说法正确。易被误导处：吊带挂在钩尖会使吊钩受力偏心，可能造成吊带滑脱或吊钩局部过载。【易混点】两根吊带作业时应挂在双钩对称受力中心位置，钩内吊带不能产生重叠和相互挤压；吊带使用时不允许打结、交叉、扭转。"},{"id":"safety_fsjx_0206","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"起重作业区域如有专人监管，可以不设置区域隔离。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：作业前应建立吊装隔离区域，进行明显隔断，并安排专人负责边界管控，确保所有非工作人员远离工作区域。隔离区域与专人监管是并行的两项要求，有专人监管不能替代区域隔离，故说法错误。易被误导处：没有物理隔离时，无关人员可能在监护人注意不到时进入吊装路径，仅靠人盯人不可靠。【易混点】吊装区域还应合理规划并提前清理，确保吊物下方没有人员和其它可能影响吊装安全的物品、设施。"},{"id":"safety_fsjx_0207","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"起重操作人员在明确了工作内容后，可以根据经验判断自行开展吊装具体操作。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：操作人员应听从指挥信号进行操作，不明确的指挥信号会造成误操作；重要或风险较大的吊装作业应提前编制吊装作业计划，工前会明确人员任务安排和交流方法。故操作人员不能凭经验自行判断开展吊装操作，说法错误。易被误导处：经验丰富不等于可以脱离指挥体系，多人配合作业时各自行动极易酿成事故。【易混点】“指挥信号不明或违章指挥不吊”正是十不吊的第一条。"},{"id":"safety_fsjx_0208","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"吊带可以用来垫在物体下方，便于使用吊带拖动物体。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：不应将物品压在吊带上，会造成吊带损坏；也不应试图将吊带从下面抽出，应用物体垫起、留出足够空间再取出吊带。故用吊带垫在物体下方拖动物体的做法错误。易被误导处：吊带是吊装索具而非拖拽耐磨件，重压和拖拉都会损伤织带纤维，造成外表难以察觉的强度下降。【易混点】吊带还不应在地面或粗糙表面拖拉；被吊物有锋利边时应加护套、护角保护；使用完毕应悬挂存放。"},{"id":"safety_fsjx_0209","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"吊升载荷时，重要的是尽量保持负荷水平。这样不仅可以更好地吊升，也可以提高安全性。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊升载荷时，重要的是尽量保持负荷水平，这样不仅可以更好地吊升，也可以提高安全性；当负荷被吊起时，重心会移动直至处于吊钩正下方。题干与课件一致，故说法正确。易被误导处：负荷倾斜时重心不在吊钩正下方，起升瞬间会发生不可控的翻转、摆动，威胁下方人员和设备安全。【易混点】重心是吊升过程中负荷全部重量的集中点，吊装计划中应事先确认负荷的重心位置。"},{"id":"safety_fsjx_0210","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"不属于特种作业范围的起重吊装工作，就不需要相应工作人员经过培训和考核。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》人员培训要求：起重指挥、起重司机属于特种设备作业人员，工作前必须取得相应的特种设备作业人员证；非特种作业人员也应经过公司专业培训并考核通过后，方可进行起重吊装作业。故“不需要培训和考核”说法错误。易被误导处：不属于特种作业不等于零门槛，起重作业的风险不因作业类别“非特种”而消失。【易混点】人员资质之外，起重机、手拉葫芦、吊带、吊链等设备还须定期检验并在有效期内使用。"},{"id":"safety_fsjx_0211","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"对埋在地下的物件进行评估后，可以用起吊设备进行起吊操作。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊埋在地下的物件会造成吊车翻车的重大事故；“十不吊”也明确规定“工件埋在地下、与地面建筑物或设备有钩挂不吊”。故即使经过评估，也不得对埋在地下的物件进行起吊操作，说法错误。易被误导处：“评估后可以吊”的错觉在于低估了地下物件与土壤的吸附咬合力量，强行起吊会导致吊车倾覆。【易混点】与地面建筑物或设备有钩挂的工件同样不吊，起吊前应确认吊物已完全脱离约束。"},{"id":"safety_fsjx_0212","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"起吊大的或不规则构件时，应在构件上系以牢固的拉绳，使其不摇摆不旋转。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：在起吊大的或不规则的构件时，应在构件上系以牢固的拉绳，使其不摇摆不旋转，题干与课件一致，故说法正确。易被误导处：大的或不规则构件的重心往往偏离几何中心，起吊后极易摆动旋转，仅靠吊车动作无法稳定构件，需地面人员借助拉绳控制。【易混点】配合拉绳的同时，还应先经试吊（吊离地面100-200mm）确认吊物处于可靠吊运状态，人员禁止在吊物、吊臂下通过或停留。"},{"id":"safety_fsjx_0213","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用有眼螺栓吊装时，可以用一根吊索穿过两个有眼螺栓。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：不应该用吊索穿过两个螺栓眼之间，这会造成起吊过程中吊物滑动，且螺栓会因同时承受横向力和纵向力而增大总受力，增大的整体受力可能超出螺栓承受能力。故“用一根吊索穿过两个有眼螺栓”的说法错误。易被误导处：一根吊索穿两个螺栓看似省事，实际两螺栓间吊索角度变化会使实际受力远超名义载荷。【易混点】使用多肢钢丝绳吊索时长度必须一致，避免相互缠绕挤压，且吊索肢间夹角不得大于120度。"},{"id":"safety_fry_0001","module":"safety","bank":"防人因","type":"judge","stem":"注意力不集中，或注意力仅集中于某一点而忽视其它方面，属于技能型失误。(        )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：技能型行为是对熟悉任务的熟练、近乎自动化的操作，其正确性主要靠注意力来保证；当注意力不集中，或只集中于某一点而忽视其它方面时，正是在执行阶段\"滑\"出的典型技能型失误，故说法正确。易被误导处：以为这属于规则型或知识型失误，但那两类失误发生在\"选规则\"\"用知识推理\"环节，本题描述的是执行层的注意力问题。【易混点】三类失误速记：技能型＝熟活走神；规则型＝用错规程；知识型＝新情况判断出错。"},{"id":"safety_fry_0002","module":"safety","bank":"防人因","type":"judge","stem":"规则型失误是指由于工作人员使用了本身有错误的规程所致。(        )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：规则型失误指工作人员在运用规则、规程解决问题时发生的失误，包括选错规则、误用规则、错误理解或套用规则以及规则本身有缺陷等多种情形；题干只讲\"使用了本身有错误的规程\"一种，定义过窄，故判错。易被误导处：把\"规程有错\"当成规则型失误的全部。【易混点】规程本身存在缺陷更多归为管理/组织屏障不完善；而人用错了正确的规程，同样是规则型失误。"},{"id":"safety_fry_0003","module":"safety","bank":"防人因","type":"judge","stem":"从事规则型任务时，发生失误的概率最小。(        )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：按任务熟悉程度和自动化程度排序，技能型任务最熟悉、自动化程度最高，失误概率最小；知识型任务面对新情况、需靠知识推理判断，失误概率最高；规则型居中。故\"从事规则型任务失误概率最小\"说法错误。易被误导处：以为有规程兜底就最保险，但规程还须人正确选用，其失误概率高于高度自动化的技能型任务。【易混点】概率排序口诀：技能型＜规则型＜知识型。"},{"id":"safety_fry_0004","module":"safety","bank":"防人因","type":"judge","stem":"人因管理是为了塑造完善无缺的个人。(        )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》人员绩效基本原理：\"人是容易犯错误的，即使最优秀的人也会犯错\"。人因管理承认人会犯错，目的不是塑造完善无缺的个人，而是通过识别失误先兆、设置和巩固多重屏障、优化组织管理来预防、探测和纠正失误，故说法错误。易被误导处：以为防人因培训是把个人训练成\"永不犯错的人\"。【易混点】相关原理：\"诱发人因失误的因素是可预见、可管理、可预防的\"\"个人行为深受组织管理过程和价值观的影响\"。"},{"id":"safety_fry_0005","module":"safety","bank":"防人因","type":"judge","stem":"事件可以通过分析犯错的原因和学习经验教训来避免。(        )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》人员绩效基本原理：\"可以通过分析犯错的原因和学习经验教训来避免事件的发生\"，题干与课件表述一致，故正确。这也是事件调查、经验反馈体系（工后会、状态报告等）的理论基础：分析原因、汲取教训，把个人的错误变成组织的财富。易被误导处：误以为\"人必然会犯错，事件无法避免\"，从而否定经验学习的作用。【易混点】对应预防策略\"预防—探测—纠正\"三环节，其中\"探测\"就包括报告并调查事件和事故。"},{"id":"safety_fry_0006","module":"safety","bank":"防人因","type":"single","stem":"人因管理培训的复训频率为(       )。","options":["每半年一次","每一年一次","每两年一次"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：人因管理培训设有定期复训要求，以保持和更新防人因知识与技能，复训频率为每两年一次，故选C。不选A：每半年一次过于频繁，无此规定；不选B：每年一次也不是规定的复训周期。【易混点】把复训周期与中国核电九大防人因工具分开记：自检、监护、独立验证、三向交流、使用和遵守程序、工前会、工后会、不确定时暂停、2分钟检查。"},{"id":"safety_fry_0007","module":"safety","bank":"防人因","type":"single","stem":"以下哪一项不是无人因时钟复位原则(       )。","options":["各级无人因时钟以周期年为周期进行自动复位","发生公司级复位，各级时钟均复位","发生单元复位的，单元所属时钟均复位"],"answer":["A"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：无人因时钟采用\"事件触发\"复位而非周期自动复位——发生公司级复位时，各级时钟均复位（B是复位原则）；发生单元复位的，该单元所属时钟均复位（C是复位原则）。A\"以周期年为周期自动复位\"与触发式复位逻辑相悖，不是复位原则，故选A。【易混点】复位方向是\"高级带动低级\"：公司级复位牵动全部时钟，单元复位只牵动本单元所属时钟；反之低级复位不会引起高级时钟复位。"},{"id":"safety_fry_0008","module":"safety","bank":"防人因","type":"single","stem":"屏障不包括(       )。","options":["个人屏障","管理屏障","设备屏障","制度屏障"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：核电厂屏障分为实体屏障、个人屏障、管理屏障、组织屏障四个层次，并无\"设备屏障\"这一层，故选C。不选A：个人屏障指知识、技能、态度、意识；不选B：管理屏障指规程、政策、技术规格书、培训、授权等；不选D：制度类内容（规程、管理条例等）课件归入管理屏障，可视为管理屏障的另一种表述，而设备类的物理防线课件统一称\"实体屏障\"。【易混点】实体屏障举例：防火门、安全阀、PPE、报警和信号灯、辐射屏障等。"},{"id":"safety_fry_0009","module":"safety","bank":"防人因","type":"single","stem":"失误先兆的四个方面不包括(       )。","options":["任务要求","个人能力","工作环境","组织机构"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：失误先兆根据任务的特点分为任务要求、个人能力、工作环境和人的本性四个方面，\"组织机构\"不在其中，故选D。不选A：任务要求如任务重、赶时间、关键操作、职责不明确；不选B：个人能力如不熟悉情况、缺乏知识、疲劳；不选C：工作环境如设备布置不合理、照明不足、干扰报警多。【易混点】\"人的本性\"指先天固有局限：短时记忆有限、注意力持续时间有限、思维定势、餐后犯困等；组织机构则属于组织屏障范畴。"},{"id":"safety_fry_0010","module":"safety","bank":"防人因","type":"single","stem":"组织缺陷不包括(       )。","options":["工作安排不合理","计划冲突","制度不完善"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》屏障划分：组织屏障涉及资源配置、组织机构、组织流程和价值观、文化氛围；而规程、工作票、管理条例等\"制度\"类内容课件明确归入管理屏障——纵深防御图中\"不完善的管理屏障\"的例子正是规程、工作票、管理条例。故\"制度不完善\"属管理屏障缺陷而非组织缺陷，选C。不选A、B：工作安排不合理、计划冲突均可归入资源配置与组织流程层面的组织缺陷。【易混点】组织屏障缺陷的典型例子：没有良好的组织文化氛围、资源配置不当。"},{"id":"safety_fry_0011","module":"safety","bank":"防人因","type":"judge","stem":"自检工具使用时可以连续快速执行多个操作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》自检部分：\"应避免的危险行为\"中明确列有\"一次或同时执行两个以上的操作\"\"连续、快速地执行多个操作\"。自检STAR要求对每项操作独立走完停—思—行—审，连续快速执行会使\"审\"（核实实际响应与预期相符）落空，故说法错误。易被误导处：自以为熟练即可提速、批量操作。【易混点】自检是连续的动作序列，一旦被打断（如有人提问）必须从头重新执行；自检通常是预防人因失误的最后一道屏障。"},{"id":"safety_fry_0012","module":"safety","bank":"防人因","type":"judge","stem":"监护操作中，验证者和 执行者可以合作执行操作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：监护是由一人执行操作、一人同步确认，角色必须严格分开；课件把\"操作人（组）和验证人（组）合作共同执行同一项工作任务\"列为应避免的风险行为，监护部分同样将\"操作人和监护人在执行任务时无意间交换了角色\"列为风险。若验证者与执行者合作执行，便失去独立性，两人可能犯同样的错，故说法错误。易被误导处：觉得\"搭把手\"更高效。【易混点】监护是二人同时同地；独立验证要求执行组与验证组在时间、空间、思维上隔离、先后执行。"},{"id":"safety_fry_0013","module":"safety","bank":"防人因","type":"judge","stem":"如果执行者的操作步骤与指定操作一致，监护者不必告知执行人'操作正确'。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护使用方法：监护人核对操作人的口颂指令及指向设备与程序一致后，要回答\"正确，请执行\"；操作人读出响应、确认正常后，监护人还要回答\"正确\"。基本原则也要求监护人对正确和错误的行动都给予回应。若操作正确却不告知，操作人得不到明确的放行与确认信号，容易演变为\"意见未达成一致就开始操作\"的风险，故说法错误。易被误导处：以为监护只负责挑错、不用肯定。【易混点】监护标准用语：执行前说\"正确，请执行\"，响应确认后说\"正确\"。"},{"id":"safety_fry_0014","module":"safety","bank":"防人因","type":"judge","stem":"监护操作中，如果执行者的操作和预期不一致，监护者立即阻止执行者。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护使用方法原文：\"操作人执行操作，监护人确认操作和预期一致，否则及时制止\"，题干与课件一致，故正确。监护的价值正在于监护人全程观察、发现偏离预期立即干预——监护适用于一旦失误即产生立即、不可逆重大后果的场合，事后补救来不及。易被误导处：以为等操作完成后再检查即可，那是独立验证（有滞后性、事后确认状态配置）的思路。【易混点】监护基本原则：监护人必须对执行人的行动全程观察，并对正确和错误的行动给予回应。"},{"id":"safety_fry_0015","module":"safety","bank":"防人因","type":"judge","stem":"涉及核安全、工业安全、辐射安全、环境安全以及电厂的稳定运行，可能立即产生不可逆影响的工作任务，不一定必须使用操作监护。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护使用条件：\"涉及核安全、工业安全、辐射安全、环境安全以及电厂的稳定运行，可能产生立即的、不可逆的影响的重大后果的操作任务或步骤\"必须使用监护。题干描述的正是这一硬性适用情形，却说\"不一定必须使用\"，把强制要求弱化为可选，故错误。易被误导处：以为任务熟练、人员经验丰富就可以豁免监护。【易混点】选工具口诀：立即且不可逆的重大后果→监护；不会立即产生严重后果但有潜在不良影响→独立验证。"},{"id":"safety_fry_0016","module":"safety","bank":"防人因","type":"single","stem":"独立验证和操作监护的不同点，下列说法正确的是（    ）。","options":["监护操作关注的是状态和配置是否正确","独立验证用于没有立即后果的场合","独立验证用于一旦操作失误或确认不到位将会产生立即的、重大后果的场合"],"answer":["B"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：独立验证适用于\"不会立即产生严重后果但是有潜在不良影响的操作\"，故B正确。不选A：关注状态和配置是否正确的是独立验证；自检和监护关注的是操作前、中、后全过程（含前提条件、操作对象、行动、响应）。不选C：\"一旦操作失误将产生立即的、重大后果\"是监护的适用场合。【易混点】课件对比表：自检——所有活动必须使用；监护——立即、不可逆重大后果的任务；独立验证——不会立即产生严重后果的重要任务，且两人（组）时间、空间隔离，先后执行。"},{"id":"safety_fry_0017","module":"safety","bank":"防人因","type":"single","stem":"监护操作执行时要避免以下情况（   ）。","options":["执行人执行速度过快以致监护人没有机会","监护人密切观察执行人的行为","监护人执行此项任务经验丰富"],"answer":["A"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护\"应避免的风险行为\"，其中明确列有\"操作人执行速度过快以致监护人没有机会进行干预和预防错误发生\"，故选A。不选B：监护人密切观察执行人的行为是正确要求，课件反而将\"监护人没有密切观察操作人的行为\"列为风险；不选C：监护人经验丰富是优点，课件警告的是\"监护人经验不足或资历比操作人浅、不愿纠正操作人错误\"的情形。【易混点】其他典型风险行为：过度监护、监护人授权低于操作人、双方无意间交换角色、监护人尚未做好准备操作人就开始行动等。"},{"id":"safety_fry_0018","module":"safety","bank":"防人因","type":"single","stem":"关于监护操作的特殊规定，正确的是（   ）。","options":["要求监护人的操作授权不得低于操作人","监护操作的正确性由监护人和执行人共同负责","以上都正确"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护基本原则：\"监护人的授权通常应当等同或高于执行人的授权\"，A正确；课件工具对比表中监护的后果责任为\"共同责任\"，即监护操作的正确性由监护人和执行人共同负责，B正确。两项均正确，故选C。【易混点】责任与资质对比：自检——操作人负责；监护——共同责任、监护人授权不低于操作人；独立验证——共同责任、验证人（组）授权不低于操作人。"},{"id":"safety_fry_0019","module":"safety","bank":"防人因","type":"single","stem":"监护操作是执行人和监护人同时检查整改操作过程，以确保整个过程（包括前提条件检查、操作过程中的确认、操作结束后的参数响应检查）的正确性，形成预防错误的（   ）屏障。","options":["第一道","第二道","第三道"],"answer":["B"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护的目的：通过设置\"二人小组\"形成预防错误的双重屏障——执行人的自检与执行是第一道屏障，监护人的同步确认构成第二道屏障。题干所述整个过程的同步确认即形成第二道屏障，故选B。不选A：第一道屏障是执行人的自检与执行；不选C：监护形成的是\"双重屏障\"，没有第三道之说。【易混点】课件同时指出\"自检通常是预防人因失误的最后一道屏障\"（对单人而言），监护在其上再叠加一道独立确认，故为双重。"},{"id":"safety_fry_0020","module":"safety","bank":"防人因","type":"single","stem":"以下不属于使用三向交流工具的作用的是(    )。","options":["提供准确、简明、清晰的信息传递","接收到的信息和想要提供的信息相一致","减少沟通成本","有效避免因信息传递失效而导致的人因失误"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》三向交流的目的：精确、准确、清楚并无误地传输信息（A）；确保收到的信息就是想要传达的信息（B）；尽量减少失误可能性、避免因信息传递失效导致的人因失误（D）。\"减少沟通成本\"不在其列——三向交流需要复述和确认，反而要花更多时间，故选C。【易混点】课件同时把\"在非关键信息传递时过度使用三向交流\"列为应避免的风险行为，可见该工具追求的是准确而非省时。"},{"id":"safety_fry_0021","module":"safety","bank":"防人因","type":"single","stem":"在工作中遇到如下哪一种情况时，应该召开工后会（   ）。","options":["出现了没有考虑到的异常情况","非常规的操作和复杂的操作","工作的参与者认为需要召开工后会的操作","以上所有"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》工后会使用条件：工作过程中出现了没有考虑到的异常或意外情况（A）；非常规的工作任务（三个月及以上才执行一次）以及复杂的工作任务（需要三个及以上工作组紧密配合执行）（B）；工作的参与者认为需要召开工后会的操作（C）。三者均属应召开工后会的情形，故选D。【易混点】工后会应在工作完成后立即召开，由工作负责人主持，以总结经验教训、改进绩效为目的，不追究责任，结论要形成记录并反馈。"},{"id":"safety_fry_0022","module":"safety","bank":"防人因","type":"single","stem":"以下属于使用工前会的原因的有（    ）。","options":["使参加工作的每个人更好的理解工作任务，识别风险，并明确预防风险的措施","工前会上针对人因失误陷阱，明确应该使用的防人因工具，从而降低人因失误的发生的概率","明确职责分工，减少由于职责不清导致的失误","以上所有"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》工前会内容：通过讨论帮助参加者清楚理解要完成什么任务、要避免什么，识别风险并明确预防措施（A）；针对关键步骤讨论选用哪种防人因失误工具，降低失误概率（B）；同时明确人员分工和顺序要求，避免职责不清导致失误（C）。三项均是使用工前会的原因，故选D。【易混点】工前会遵循SAFER原则：综述（识别关键步骤）、预测（易错情景）、预计（失误后果）、评估（选用工具与屏障完整性）、审查（回顾运行经验）。"},{"id":"safety_fry_0023","module":"safety","bank":"防人因","type":"single","stem":"下列关于工前会的说法，正确的是（   ）。","options":["简单操作不需要召开工前会","复杂工作看情况才需召开工前会","复杂工作不一定需要召开工前会","任何操作都需要召开工前会"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：在系统和设备的生产活动之前推荐使用工前会，且工前会分为简单工前会和标准工前会——简单、经常重复且没有严重后果的操作采用简单工前会；操作失误可能造成严重后果（如停机、停堆）的必须召开标准工前会。可见任何操作都需以相应形式召开工前会，故选D。不选A：简单操作也要开简单工前会；不选B、C：复杂工作必须开标准工前会，不是\"看情况\"\"不一定\"。【易混点】两种工前会分别填写简单工前会确认单和标准工前会确认单。"},{"id":"safety_fry_0024","module":"safety","bank":"防人因","type":"single","stem":"工前会指在执行一项任务/工作前，所有相关工作人员之间进行的（    ） 的准备会。","options":["面对面","电话交流","视频会议","各自筹备"],"answer":["A"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》工前会定义：在执行一项工作或任务前，相关工作人员之间进行的\"面对面的准备会\"，以便清楚理解任务目标、工作范围、工作风险、安全要点、防护措施和应急预案；召开形式原则也要求\"面对面讨论，主持人采用开放式的问题激励与会人员积极思考和发言\"，故选A。不选B、C：电话、视频缺少面对面互动与眼神沟通，影响讨论效果；不选D：\"各自筹备\"违背集体讨论、达成共识的宗旨。【易混点】工后会同样是面对面的总结会；工前会在时间上应尽量接近活动的实际开始时间。"},{"id":"qihang_fg_0001","module":"qihang","bank":"启航-法律法规与合规","type":"single","stem":"员工应遵守哪些舆情控制规范（      ）？","options":["对重大舆情不得隐瞒、缓报、谎报或者授意他人隐瞒、缓报、谎报","未经审核批准不得在任何媒体上私自发布、转发、评论或者泄露公司秘密；不得发布有关公司的虚假信息或造谣","公司内任何组织或个人不得私自印制外发宣传材料","以上都对"],"answer":["D"],"score":null,"source":"official","explanation":"三项均为舆情与宣传纪律要求：重大舆情不得隐瞒、缓报、谎报；未经审核批准不得私自发布、转发、评论或泄露公司秘密；不得私自印制外发宣传材料。故选“以上都对”。","origin":""},{"id":"qihang_fg_0002","module":"qihang","bank":"启航-法律法规与合规","type":"single","stem":"中国核安全观的内涵是：(       )","options":["理性 协调 并进","理性 协同 并进","理性 和谐 创新","法治意识、忧患意识、自律意识、协作意识"],"answer":["A"],"score":null,"source":"official","explanation":"正确答案：理性 协调 并进。核安全观：理性、协调、并进。","origin":""},{"id":"qihang_fg_0003","module":"qihang","bank":"启航-法律法规与合规","type":"single","stem":"“合规”有广义和狭义两层含义，（     ）主要指强化合规经营，反对商业贿赂。","options":["广义的‘合规’","狭义的‘合规’","标准的‘合规’","传统的‘合规’"],"answer":["B"],"score":null,"source":"official","explanation":"正确答案：狭义的‘合规’。狭义合规侧重反对商业贿赂。","origin":""},{"id":"qihan 职第一课》：中核集团以“科技赋能、产业造福”为企业使命，秉持“责任、安全、创新、卓越”的企业核心价值观，并积极践行“两弹一星”精神和“四个一切”核工业精神。不选B：“诚信、责任、创新、共赢”非课件表述，属拼凑干扰项；不选C：“事业、责任、严细、进取”是把“四个一切”（事业高于一切、责任重于一切、严细融入一切、进取成就一切）的关键词拼在一起，属混淆项；不选D：“科技赋能、产业造福”是中核集团的企业使命，不是核心价值观。【易混点】“使命”与“核心价值观”是企业文化体系的不同层面，“科技赋能、产业造福”对应使命，勿张冠李戴。"},{"id":"qihang_dyk_0002","module":"qihang","bank":"启航-入职第一课","type":"multi","stem":"“四个一切”核工业精神包括（　）。","options":["事业高于一切","责任重于一切","严细融入一切","效率高于一切"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《入职第一课》：“四个一切”核工业精神即事业高于一切、责任重于一切、严细融入一切、进取成就一切。其中“事业高于一切”体现“以身许国”“做隐姓埋名人、干惊天动地事”的抱负；“严细融入一切”倡导“严、细、实、快”的工作作风，严细是核工业的安全保障、质量文化的基石；“进取成就一切”是积极探索、奋发向上、永不言休的精神状态。故A、B、C正确。不选D：第四条应为“进取成就一切”，“效率高于一切”系偷换概念，课件无此表述。【易混点】“四个一切”是核工业精神（企业精神层面），与“两弹一星”精神、“强核报国、创新奉献”新时代核工业精神是并列的精神谱系，勿混淆。"},{"id":"qihang_dyk_0004","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"中国核电是中国最大的核电运营商之一，也是首家A股上市的纯核电公司。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《入职第一课》：中国核电（中国核能电力股份有限公司，股票代码601985）是中国最大的核电运营商之一，是首家A股上市的纯核电公司，注册资本205.68亿元，2015年6月10日在A股上市。题目两个表述均与课件原文一致，故判“正确”。若判“错误”，则同时否定了“中国最大核电运营商之一”和“首家A股上市的纯核电公司”这两项课件明确表述。【易混点】中国核电的控股股东是中国核工业集团有限公司（中核集团），不要与中广核集团混淆；公司简称“中国核电”、代码601985可一并记忆。"},{"id":"qihang_dyk_0008","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"1970年我国确定的中国发展核电站的方针是（　）。","options":["积极有序、稳妥推进","自主设计、自主建造、自主运营","安全、适用，经济、自力更生","安全第一、质量第一"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《入职第一课》：1970年我国成立核电站建设领导小组，大力推动核电厂建设，并确定“中国发展核电站的方针是：安全、适用，经济、自力更生”，自此核电研究建设全面启动，中核人开始谱写民族核电建设奋斗史。故选C。不选A：“积极安全有序发展核电”是2021年至今新阶段的方针，不是1970年方针；不选B：“自主设计、自主建造、自主运营”是秦山一期以来自主化建设的成就表述，非方针原文；不选D：“安全第一、质量第一”属安全质量工作要求，非该方针内容。【易混点】我国核电发展各阶段方针不同，1970年方针与福岛后的“积极安全有序”方针分属不同时期，勿错位。"},{"id":"qihang_dyk_0009","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"日本福岛核事故后，中国全面放缓核电建设，暂停所有内陆核电开发项目。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《入职第一课》：日本福岛核事故后，国务院常务会议强调要充分认识核安全的重要性和紧迫性，核电发展要把安全放在第一位，并做出立即组织全面安全检查、全面审查在建核电站、严格审批新上核电项目等决定；此后中国全面放缓核电建设，对运行和在建核电站进行严格审查，暂停所有内陆核电开发项目。题目表述与课件一致，判“正确”。若判“错误”，则与“全面放缓”“暂停所有内陆核电开发项目”的明确表述相悖。【易混点】福岛后是“放缓”而非“停滞”，2021年至今我国进入“积极安全有序发展核电”新阶段，两者程度不同。"},{"id":"qihang_dyk_0010","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"2015年我国核工业创建60周年之际，习近平总书记作出重要批示：“发展是第一要务，人才是（　），创新是第一动力”。","options":["第一要务","第一动力","第一责任","第一资源"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》引述的重要批示：“发展是第一要务，人才是第一资源，创新是第一动力”；战略规划课件也强调“以保障核安全为首责，以发展为第一要务，以人才为第一资源，以创新为第一动力”。人才对应“第一资源”，故选D。不选A、B：“第一要务”“第一动力”在题干中已分别配给发展、创新，选之即错位重复；不选C：批示中无“第一责任”表述，课件相关表述是“以保障核安全为首责”。【易混点】“首责”对应核安全，“第一要务、第一资源、第一动力”分别对应发展、人才、创新，四个定位勿相互错配。"},{"id":"qihang_dyk_0011","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"按照我国电力碳达峰、碳中和路径研究，2035年核电发电量在电力结构中的占比目标为（　）。","options":["5%","10%","15%","20%"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《入职第一课》：按照我国电力碳达峰、碳中和路径研究（舒印彪等，《中国工程科学》2021），核电发电量在电力结构中的占比目标为10%（2035年）、20%（2060年）；同时预计每年核准6-8台机组。故选B。不选A：5%接近我国核电发电量当前占比水平，是现状而非2035年目标；不选C：15%课件未提及；不选D：20%是2060年的目标，不是2035年。【易混点】“占比”考点有两套数字：发电量占比2035年10%、2060年20%；而中国工程院报告的装机目标是2030年2亿千瓦、2050年4亿千瓦，两套指标勿混淆。"},{"id":"qihang_dyk_0012","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"中国核电的控股股东是中国广核集团有限公司。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《入职第一课》：中国核电由中国核工业集团有限公司（中核集团）作为控股股东，联合中国长江三峡集团有限公司、中国远洋海运集团有限公司和航天投资控股有限公司共同出资设立。题目称控股股东为中国广核集团有限公司，与课件不符，故判“错误”。中国广核集团（中广核）是另一家核电运营商，与中国核电的控股股东中核集团是两个不同主体，本题正是利用“核”字头集团的相似性设错。【易混点】中核集团（CNNC）与中国广核集团（CGN）是我国两大核电集团，中国核电（601985）隶属中核集团体系。"},{"id":"qihang_flhg_0003","module":"qihang","bank":"启航-法律合规","type":"single","stem":"美国《反海外腐败法》（FCPA）的主要条款是（　）。","options":["反贿赂条款和会计条款","反垄断条款和反倾销条款","出口管制条款和制裁条款","反洗钱条款和数据合规条款"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：FCPA即美国《反海外腐败法》，1977年颁布，经1988、1994、1998年三次修改，主要条款为“反贿赂条款”和“会计条款”。反贿赂条款禁止为取得、维持业务或获取不当利益而向外国官员等行贿（含通过第三方）；会计条款要求保持准确账簿记录并建立内部财务控制制度。故选A。不选B：反垄断、反倾销属其他合规议题，非FCPA内容；不选C：出口管制与经济制裁是另一重点合规领域；不选D：反洗钱、数据合规非FCPA条款。【易混点】西门子事件中，西门子被美国司法部处罚正是因违反FCPA会计条款和内控规定，可与本考点关联记忆。"},{"id":"qihang_flhg_0005","module":"qihang","bank":"启航-法律合规","type":"single","stem":"SDN名单（特别指定国民和被禁实体名单）的发布机构是（　）。","options":["美国司法部","美国商务部","美国财政部外国资产管制办公室（OFAC）","美国证券交易委员会"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：SDN清单（特别指定国民和被禁实体名单）是由OFAC（美国财政部下属的外国资产管制办公室）发布并不定期更新的制裁名单，名单上的组织和个人均为制裁对象，“美国主体”不得与其开展任何交易，如其在美国主体持有或控制的财产中享有权益，美国主体还应冻结该等财产。故选C。不选A：美国司法部是执法机关，不是SDN发布机构；不选B：美国商务部主管出口管制事项，不发布SDN；不选D：美国证券交易委员会与FCPA执法相关，与SDN发布无关。【易混点】非美国人（如中国实体）与SDN进行重大交易的，可能受限于美国的二级制裁，这是SDN与二级制裁的关联点。"},{"id":"qihang_flhg_0006","module":"qihang","bank":"启航-法律合规","type":"single","stem":"关于二级制裁（Secondary Sanctions），下列说法正确的是（　）。","options":["主要针对美国主体与受制裁对象开展的特定行为","主要针对非美国主体在美国境外从事的违反美国制裁规定的行为","只针对外国政府机关的官方行为","只适用于联合国安理会决议列明的主体"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：二级制裁主要针对非美国主体在美国境外从事的违反美国制裁规定的行为，美国政府可对该等非美国主体实施二级制裁，包括将其列入SDN名单，以禁止美国主体与其交易。故选B。不选A：“主要针对美国主体与受制裁对象开展特定行为”是一级制裁的定义，题干问二级制裁，属混淆项；不选C：二级制裁对象不限于外国政府机关的官方行为，企业、个人均可被制裁；不选D：二级制裁依据美国国内制裁规定，与联合国安理会决议列名无关。【易混点】一级制裁管“美国主体”，二级制裁管“非美国主体在美国境外的行为”，后者正是中国企业最需警惕的合规风险。"},{"id":"qihang_flhg_0008","module":"qihang","bank":"启航-法律合规","type":"single","stem":"2010年英国出台《反贿赂法》，其新增的罪名是（　）。","options":["未有防止商业贿赂罪","跨境洗钱罪","商业间谍罪","内幕交易罪"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：2010年英国出台《反贿赂法》，新增“未有防止商业贿赂罪”，对未有防止商业贿赂的企业，即未建立有效合规体系的企业，可能面临承担处罚的风险与责任。这一罪名把防贿责任从行贿个人扩展到企业自身，倒逼企业建立有效合规体系。故选A。不选B、C、D：跨境洗钱罪、商业间谍罪、内幕交易罪均非该法新增罪名，属拼凑干扰项。【易混点】合规发展史可按时间线记忆：1977年美国FCPA、2004年美国《针对机构实体的联邦量刑指南》（明确有效合规体系可减轻处罚）、2010年英国《反贿赂法》。"},{"id":"qihang_flhg_0009","module":"qihang","bank":"启航-法律合规","type":"single","stem":"《中华人民共和国反外国制裁法》由（　）颁布实施。","options":["国务院","商务部","全国人大常委会","国家发展改革委"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：2021年6月10日，全国人大常委会颁布实施《中华人民共和国反外国制裁法》，针对外国国家以各种借口或依据其本国法律对我国进行遏制、打压，对我国公民、组织采取歧视性限制措施的行为，国务院有关部门可决定将参与制定、决定、实施歧视性限制措施的个人、组织列入反制清单。该法由全国人大常委会颁布，故选C。不选A、B、D：国务院、商务部、国家发展改革委均非该法颁布机关。【易混点】《反外国制裁法》（全国人大常委会颁布）与《阻断外国法律与措施不当域外适用办法》（国务院颁布、商务部令2021年第1号）两部反制工具的颁布主体最易互换设错。"},{"id":"qihang_flhg_0011","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"下列属于美国实施全面制裁的国家/地区有（　）。","options":["伊朗","朝鲜","古巴","俄罗斯"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：美国实施全面制裁的国家和地区为伊朗、朝鲜、古巴、叙利亚以及乌克兰克里米亚地区。在交易具有美国连接点因素（美国人、美元和美国金融机构、美国原产物项）的情形下，不得与上述全面制裁国家和地区进行任何交易或提供任何服务。故A、B、C均正确。不选D：俄罗斯不在课件所列的全面制裁国家名单之列，美国对俄主要采取其他制裁方式，课件仅提到美频繁宣布针对朝鲜、伊朗和俄罗斯交易的新限制措施。【易混点】全面制裁国家/地区共五个，考试常在“俄罗斯”“叙利亚”上设混淆，注意俄不属“全面制裁”名单。"},{"id":"qihang_flhg_0012","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"课件列出的重点合规领域包括（　）。","options":["经济制裁","出口管制","反垄断与国家安全审查","劳动用工保护"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》“重点合规领域”章节：课件列举的重点合规领域包括经济制裁、出口管制、反垄断与国家安全审查、反腐败与反商业贿赂等。故A、B、C正确。不选D：“劳动用工保护”不在课件所列重点合规领域之中，属拼凑干扰项；虽然企业经营中涉及用工问题，但并非本课件界定的涉外合规重点领域。【易混点】课件在合规定义中还提到个别国家运用经济制裁、出口管制、反垄断、反倾销、反补贴、反不正当竞争、反腐败、反洗钱等法律制度实施“长臂管辖”，可与重点合规领域章节对照记忆。"},{"id":"qihang_flhg_0013","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"在中国核电合规管理组织体系中，各业务部门是第一道防线。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：中国核电法律合规管理组织体系中，集团党组、总法律顾问/首席合规官（法治工作第一责任人）、法律合规部、各业务部门、纪检审计部等各司其职，其中各业务部门是第一道防线。这与国资委《中央企业合规管理办法》要求“强化业务部门、经营单位和项目一线主体责任”的精神一致。题目表述与课件一致，判“正确”。若判“错误”，则否定了业务部门在合规管理中的第一道防线和主体责任定位。【易混点】“第一道防线”强调合规要求嵌入岗位职责和业务流程、业务部门自我管控，法律合规部、纪检审计部则承担归口管理与监督职能，防线分工勿颠倒。"},{"id":"qihang_flhg_0014","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"《阻断外国法律与措施不当域外适用办法》由全国人大常委会颁布。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：《阻断外国法律与措施不当域外适用办法》系2021年1月9日国务院颁布实施，文号为商务部令2021年第1号，针对的是违反国际法和国际关系基本准则、不当禁止或限制中国企业与第三国企业正常经贸活动的外国法律与措施域外适用情形（即“二级制裁”）。该办法并非由全国人大常委会颁布，故判“错误”。由全国人大常委会颁布的是2021年6月10日实施的《反外国制裁法》。【易混点】“商务部令2021年第1号、国务院颁布（阻断办法）”与“全国人大常委会颁布（反外国制裁法）”两组成对考点，建议绑定记忆。"},{"id":"qihang_flhg_0016","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"长臂管辖遵循“最小接触”或称“最低联系”原则。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《法律合规管理培训》：长臂管辖是指在本国边境之外对非本国公民、企业、组织行使法律上的管辖权，本质上是法的域外效力，是司法上的概念；长臂管辖遵循“最小接触”或称“最低联系”原则，《美国冲突法重述》列举了行使长臂管辖的十项标准（如当事人在该州出现、有住所、从事业务活动等）。题目表述与课件一致，判“正确”。若判“错误”，则否定了课件明确给出的这一原则。【易混点】长臂管辖已从司法领域扩展到行政执法领域：一是基于经济制裁、出口管制的行政管辖（如中兴事件），二是基于商业行为的司法管辖（如孟晚舟事件）。"},{"id":"qihang_gcxm_0002","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"1996-2007年我国核电建设采用大业主+技术引进模式，业主负责设备采购，直接管理施工单位，并负责系统调试工作。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：我国核电工程建设第二阶段（1996-2007年）为“大业主+技术引进阶段”（核岛交钥匙），项目包括秦山二期、秦山三期、田湾一期，采用大业主的多合同模式进行管理：业主负责设备采购，直接管理施工单位，负责系统调试工作。秦山二期、三期项目取得较好业绩，秦山二期扩建项目在安全质量受控下建设工期53.8个月。题目表述与课件完全一致，判“正确”。【易混点】四阶段历程：1985-1996首堆起步→1996-2007大业主+技术引进→2008-2017 EPC总承包（小业主、专业化总包）→后福岛时代至今业主负责制总承包。"},{"id":"qihang_gcxm_0004","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"后福岛时代至今，福清5-6号、田湾5-6号、漳州1-2号机组采用的工程建设管理模式是（　）。","options":["大业主自建模式","大业主+技术引进模式","业主负责制总承包模式","EPC总承包模式"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：后福岛时代至今为第四阶段“业主负责制总承包阶段”，项目为福清5-6号、田湾5-6号、漳州1-2号机组，采用业主负责制的总承包管理模式：业主负责规划和建立项目总的质量保证体系并维护其有效运作，督促总包、监理及其分包商建立质保体系。故选C。不选A：“大业主自建模式”课件无此提法；不选B：“大业主+技术引进模式”是第二阶段（1996-2007，秦山二期等）的模式；不选D：EPC总承包是第三阶段（2008-2017，福清1-4号、方家山、海南一期）的模式。【易混点】二、三、四阶段的模式演进（大业主多合同→小业主专业化总包→业主负责制总承包）及其代表机组是必考点。"},{"id":"qihang_gcxm_0005","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"2002年5月第四代国际核能论坛（GIF）选定的第四代核电技术中，三种热中子堆不包括（　）。","options":["钠冷快堆","超临界水冷堆","高温气冷堆","熔盐堆"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：2002年5月第四代国际核能论坛（GIF）在巴黎举行研讨会，选定第四代核电技术6种设计概念，包括三种快中子堆和三种热中子堆。三种快中子堆是钠冷快堆、铅冷快堆和气冷快堆；三种热中子堆是超临界水冷堆、高温气冷堆和熔盐堆。钠冷快堆属快中子堆，不在三种热中子堆之列，故选A。不选B、C、D：超临界水冷堆、高温气冷堆、熔盐堆均属三种热中子堆。【易混点】“快堆/热堆”以中子能谱划分：钠冷、铅冷、气冷为快堆；超临界水冷、高温气冷、熔盐为热堆，干扰项常拿“钠冷快堆”冒充热堆。"},{"id":"qihang_gcxm_0006","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"秦山三期核电机组采用的堆型是（　）。","options":["压水堆","加拿大坎杜（CANDU）压力管式重水堆","沸水堆","高温气冷堆"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：秦山三期采用的是加拿大坎杜（CANDU）压力管式重水堆，重水堆以重水（氘和氧组成的化合物）作慢化剂。故选B。不选A：压水堆是我国大陆运行机组的主流堆型（用轻水作冷却剂和慢化剂，世界占比约62%），但秦山三期是大陆唯一的例外；不选C：我国台湾地区有沸水堆核电站，大陆地区没有；不选D：高温气冷堆以山东石岛湾20万千瓦级机组为代表，用氦气作冷却剂、石墨作慢化剂。【易混点】堆型与电站对应：秦山一期CNP300（自主设计压水堆）、三门AP1000（美国）、台山EPR（法国）、田湾VVER（俄罗斯）、秦山三期CANDU6（加拿大）。"},{"id":"qihang_gcxm_0007","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"除秦山三期外，我国大陆地区目前运行的核电机组全部为压水堆。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：除秦山三期（重水堆）外，我国大陆地区目前运行的核电机组全部为压水堆；同时课件指出我国台湾地区为2个沸水堆核电站及1个压水堆核电站，不在“大陆地区”范围内。题目表述与课件一致，判“正确”。若判“错误”，则忽视了课件对大陆机组堆型的明确归纳。【易混点】审题关键是“大陆地区”四字：若表述为“我国（含台湾地区）全部为压水堆”即为错误，因为台湾存在沸水堆；此外压水堆约占世界核电62%，是最主流堆型。"},{"id":"qihang_gcxm_0008","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"压水堆核电站一回路的运行压力约为（　）。","options":["15.5MPa","17.0MPa","17.5MPa","330MPa"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：压水堆核电站一回路设计压力17.0-17.5MPa、设计温度330-350摄氏度；运行压力15.5MPa、平均温度307-310摄氏度。本题问的是“运行压力”，故选A。不选B、C：17.0MPa、17.5MPa是一回路设计压力的数值，不是运行压力；不选D：330MPa是把设计温度“330（摄氏度）”的数字错误拼接到压力单位上，量纲完全错误。【易混点】“运行压力15.5MPa”与“设计压力17.0-17.5MPa”必须区分，本题干扰项正是拿设计压力数字设陷阱；运行温度也要与设计温度330-350℃区分。"},{"id":"qihang_gcxm_0009","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电站与火电站的差异主要在于常规岛部分。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》《核电厂概述》：核电站与火电站的能量转换原理相同，二者的差异主要在热源部分——核反应堆相当于火电站的锅炉，而反应堆、一回路主要设备、安全壳等均布置在核岛；常规岛（汽机厂房）内的汽轮发电机组、二回路汽水油系统与火电站的相应部分类似，功能是能量转换，并非差异所在。故题目称“差异主要在常规岛部分”判“错误”。【易混点】核岛的功能是放射性包容和布置一回路主要设备（华龙一号非能动安全系统主要设备也在核岛），常规岛的功能是能量转换，二者定位不同。"},{"id":"qihang_gcxm_0010","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"压水堆核电站的安全屏障中，第二道屏障是（　）。","options":["燃料芯块","燃料包壳","压力容器和密闭的一回路系统","反应堆安全壳"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：压水堆核电站在核燃料和外部环境之间共设置四道屏障。第一道屏障是燃料芯块——耐高温、耐腐蚀的二氧化铀陶瓷芯块，保存绝大部分裂变产物；第二道屏障是燃料包壳——芯块密封在锆合金包壳中构成燃料棒；第三道屏障是压力容器和密闭的一回路系统；第四道屏障是反应堆安全壳（内设钢衬里，抗商用大飞机撞击）。第二道屏障为燃料包壳，故选B。不选A、C、D：燃料芯块、一回路压力边界、安全壳分别对应第一、三、四道屏障。【易混点】有文件将屏障描述为“三道安全屏障”（不涉及燃料芯块），注意与“四道屏障”的计数口径差异，答题以题干口径为准。"},{"id":"qihang_gcxm_0011","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"华龙一号的三大设计特征包括（　）。","options":["177堆芯","单堆布置","双层安全壳","三环路布置"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：华龙一号符合国际三代核电技术标准的三大设计特征为177堆芯、单堆布置、双层安全壳。单堆布置可提供实体隔离、降低机组互相影响，并提高厂址选择灵活性；双层安全壳由钢衬里预应力混凝土内壳和钢筋混凝土外壳组成。故A、B、C正确。不选D：“三环路布置”不是华龙一号三大设计特征，属干扰项；华龙一号堆芯特征是采用177个燃料组件，功率大于120万千瓦。【易混点】课件还列出“三大能动+非能动系统”（二次侧非能动余热导出、安全壳热量排出、堆腔注水冷却）和“三大能力提高”（抗震、抗商用大飞机撞击、事故应急），三组“三大”勿混淆。"},{"id":"qihang_gcxm_0012","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"华龙一号双层安全壳延长的设计寿期为（　）。","options":["40年","50年","60年","80年"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：华龙一号双层安全壳的内壳为钢衬里的预应力混凝土结构，外壳为钢筋混凝土结构，环形空间保持负压以收集和过滤泄漏；安全壳自由容积增大至大于80000立方米，延长的设计寿期为60年，并能承受大型商用飞机撞击、飓风、飞射物、爆炸等外部事件。故选C。不选A、B：40年、50年是早期核电机组的常见设计寿期，不是华龙一号的指标；不选D：80年课件未提及，属拔高干扰。【易混点】“双层安全壳—设计寿期60年”可与“177堆芯”“单堆布置”串成三大设计特征一起记忆；区分“设计寿期”与实际运行年限。"},{"id":"qihang_gcxm_0013","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"华龙一号采用177个燃料组件，提高了功率，同时降低线功率密度，确保足够的堆芯热工裕量。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：华龙一号采用177个燃料组件，提高了功率（大于120万千瓦），同时降低线功率密度，确保足够的堆芯热工裕量；配套自主研发的CF3燃料组件，满足18个月长循环。功率提高与线功率密度降低并不矛盾：组件数量增多使总功率上升，而每个组件分担的线功率密度反而下降，安全裕量更足。题目表述与课件一致，判“正确”。【易混点】177堆芯是三大设计特征之一，也是华龙一号功率提升的核心；“提高功率”与“降低线功率密度”同时成立，这是易被误判为矛盾的表述组合。"},{"id":"qihang_gcxm_0015","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"在核电工程建设过程中，核岛浇灌第一罐混凝土（FCD）标志（　）。","options":["项目核准完成","土建阶段开始","安装阶段开始","调试阶段开始"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：核电工程建设以核岛浇灌第一罐混凝土（FCD）作为土建阶段开始的标志，土建阶段包括反应堆厂房实体施工、核岛其他厂房实体施工等；穹顶吊装完成则标志土建结束。故选B。不选A：项目核准完成是开工前的准备阶段成果，课件另有“FCD准备阶段”的提法，与FCD本身含义不同；不选C：安装阶段以穹顶吊装完成为开始标志；不选D：调试阶段以冷试开始为标志。【易混点】里程碑口诀：FCD—土建开始；穹顶吊装完成—土建结束、安装开始；冷试开始—安装结束、调试开始，一条链记牢。"},{"id":"qihang_gcxm_0016","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"反应堆厂房穹顶吊装完成，标志核电站安装阶段结束。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：反应堆厂房穹顶吊装完成，标志的是土建结束、安装阶段开始；安装阶段的结束以冷试开始为标志，冷试、热试、首次装料则标志调试开始，试运行（168小时考核）标志核电站建设和调试阶段全面结束。题目把穹顶吊装说成“标志安装阶段结束”，与课件不符，判“错误”。【易混点】完整里程碑链条：FCD（土建开始）→穹顶吊装完成（土建结束、安装开始）→冷试开始（安装结束、调试开始）→168小时试运行考核（建设与调试全面结束）。"},{"id":"qihang_gcxm_0017","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"核电工程的“四大控制”是指（　）。","options":["安全、质量、进度、投资","安全、质量、环保、保密","质量、进度、投资、环保","安全、进度、环保、廉洁"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：中国核电推行“六大控制七个零”高质量精细化管理：安全（安全零事故）、质量（质量零事件）、进度（进度零超期）、投资（投资零超概）、环保（环保零超标）、保密（保密零泄密）、廉洁（廉洁零问题）；课件明确“如果说核电工程的‘四大控制’，则指安全、质量、进度和投资”。故选A。不选B、D：环保、保密、廉洁属“六大控制/七个零”的扩展内容，不在四大控制之内；不选C：该选项缺失“安全”这一首要控制项且混入环保。【易混点】“四大控制”是“六大控制七个零”的子集：问“四大控制”答安全、质量、进度、投资；问“六个控制维度”则还要加环保、保密（廉洁为第七项）。"},{"id":"qihang_gcxm_0018","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"根据中国工程院《中国能源中长期（2030、2050）发展战略研究咨询项目报告》，2030年我国核电装机目标为2亿千瓦。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》引述中国工程院《中国能源中长期（2030、2050）发展战略研究咨询项目报告》：2020年核电装机7000万千瓦，2030年核电装机2亿千瓦，2050年核电装机4亿千瓦。题目“2030年核电装机目标为2亿千瓦”与课件一致，判“正确”。课件同页还给出：全球核电装机占电力装机5%左右、发电量占比10.1%；中国核电装机占电力装机2.27%、发电量占比5.1%，未来可期、大有可为。【易混点】注意区分两套指标：本题为“装机容量”目标（2030年2亿、2050年4亿千瓦）；“发电量在电力结构中占比”目标是2035年10%、2060年20%，两套数字勿互换。"},{"id":"qihang_gjhz_0011","module":"qihang","bank":"启航-国际合作","type":"multi","stem":"中国核电派遣优秀员工赴（　）等国际组织工作。","options":["IAEA","WANO","EPRI","国际货币基金组织"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：中国核电持续提升核安全文化建设，WANO综合指数连年提升、稳定排名世界前列，并派遣优秀员工赴国际组织工作：IAEA（国际原子能机构）6名、WANO（世界核电运营者协会）31名、EPRI（美国电力研究院）2名，另有集团海外代表处9名。故A、B、C正确。不选D：国际货币基金组织是金融领域的国际组织，与核电行业无关，课件未提及向其派遣员工，属常识性干扰项。【易混点】可借助数字记忆：WANO派遣最多（31名），IAEA 6名、EPRI 2名、海外代表处9名；IAEA管核领域政府间合作，WANO管核电运营安全，EPRI是电力行业研究机构。"},{"id":"qihang_hdczs_0001","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"核安全三要素是指（　）。","options":["反应性控制、余热导出、放射性包容","中子控制、压力控制、温度控制","临界控制、功率控制、剂量控制","散热、屏蔽、密封"],"answer":["A"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：核安全三要素为反应性控制、余热导出、放射性包容，这是核电从业者必须掌握的基本概念，也是核电从业者基本态度的重要内容。故选A。不选B：“中子控制、压力控制、温度控制”貌似相关专业词汇，但非课件表述；不选C：“临界控制、功率控制、剂量控制”同样是拼凑干扰项；不选D：“散热、屏蔽、密封”是对三要素的通俗化错误改写。【易混点】与三要素关联记忆“剩余功率”：停堆3小时约为1%额定功率、停堆4周约为0.1%，可见停堆后仍必须持续导出余热，这正是“余热导出”要素存在的原因。"},{"id":"qihang_hdczs_0002","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"反应堆停堆3小时后，剩余功率约为额定功率的（　）。","options":["10%","5%","1%","0.1%"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：反应堆停堆后链式裂变虽停止，但裂变产物的衰变仍持续放出热量，即剩余功率——停堆3小时约为1%额定功率，停堆4周约为0.1%额定功率。故选C。不选A、B：10%、5%明显高估了剩余功率，若停堆3小时仍有如此高的功率，余热排出系统将无法胜任冷却任务；不选D：0.1%是停堆4周后的水平，停堆仅3小时时衰变热还远高于此。【易混点】“停堆3h→1%、停堆4周→0.1%”两个数字成对记忆，考题常把时间与百分比互换设错；该数据同时是核安全三要素中“余热导出”的依据。"},{"id":"qihang_hdczs_0003","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"压水堆核电厂的链式裂变反应是由快中子维持的。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》章节回顾：压水堆核电厂的链式裂变反应是由热中子维持的。压水堆中轻水既是冷却剂又是慢化剂，裂变产生的快中子经水慢化后成为热中子，再引发铀-235核裂变，从而维持链式反应。题目称“由快中子维持”，与课件相悖，判“错误”。【易混点】“压水堆—热中子、快堆—快中子”的对应关系勿混淆：快中子堆不经慢化直接利用快中子引发裂变，其最大特点是核燃料增殖；沸水堆、重水堆同样依靠热中子维持链式反应。"},{"id":"qihang_hdczs_0004","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"正常情况下，压水堆核电站只在一回路中存在放射性。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》章节回顾：正常情况下，压水堆核电站只在一回路中存在放射性。一、二回路通过蒸汽发生器传热U型管的管壁隔离，放射性物质被包容在一回路内，二回路给水、蒸汽不携带放射性，汽轮机侧可按常规设备对待。题目表述与课件一致，判“正确”。【易混点】这正是压水堆与沸水堆的关键区别：沸水堆只有一个回路，堆内沸腾产生的蒸汽直接进入汽轮机，其二回路（汽轮机侧）介质带有放射性；对比记忆不易丢分。"},{"id":"qihang_hdczs_0005","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"典型的压水堆核电站每台机组共有（　）个回路。","options":["1","2","3","4"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：典型的压水堆核电站每台机组共有三个回路。一回路中冷却剂由主泵送入堆芯带走裂变热，经蒸汽发生器U型管将热量传给二回路给水后返回堆芯，密闭循环；二回路中给水受热变成蒸汽推动汽轮发电机组做功发电，乏汽冷凝后回送；三回路使用海水或淡水在冷凝器中冷却做功后的乏蒸汽。故选C。不选A：只有一个回路是沸水堆的特征（堆内沸腾直接供汽）；不选B、D：两个、四个回路均非典型压水堆配置。【易混点】三回路功能分工：一回路载出堆芯热量、二回路热功转换发电、三回路冷却乏蒸汽（最终热阱）。"},{"id":"qihang_hdczs_0006","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"人类历史上第一个反应堆“芝加哥一号”（CP-1）建成并实现首次运行的时间是（　）。","options":["1945年8月","1951年12月","1954年6月","1942年12月"],"answer":["D"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：人类历史上第一个反应堆“芝加哥一号”（Chicago Pile-1，CP-1）于1942年12月由费米领导的团队在芝加哥大学建成，12月2日首次运行成功，开启了人类原子能时代，芝加哥大学成为“原子能诞生地”。故选D。不选A、B、C：1945年8月、1951年12月、1954年6月均与CP-1的建成和首次运行时间不符，属时间干扰项。【易混点】记忆要点是“1942年12月”这一时间（12月2日首次运行成功），年份与月份缺一不可；“首个反应堆实现的是链式裂变反应，与首座核电站（20世纪50年代）不是一回事”。"},{"id":"qihang_hdczs_0007","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"我国台山核电站采用的核电堆型是（　）。","options":["美国AP1000","法国EPR","俄罗斯VVER1000","加拿大CANDU6"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》核电家族族谱：台山核电采用的是法国EPR堆型。故选B。不选A：美国AP1000对应三门核电；不选C：俄罗斯VVER1000对应田湾核电；不选D：加拿大CANDU6对应秦山三期。【易混点】堆型与电站对应关系是高频考点：AP1000—三门、EPR—台山、VVER—田湾、CANDU6—秦山三期、CNP300—秦山一期（自主设计）、M310—大亚湾（法国）；EPR与AP1000同属三代商用压水堆系列。"},{"id":"qihang_hdczs_0008","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"快中子堆（快堆）最大的特点是（　）。","options":["发电效率高","核燃料增殖","常压运行","不需要冷却剂"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》章节回顾：快中子堆（快堆）最大的特点是核燃料增殖。快堆以快中子引发裂变，课件介绍快堆采用一回路（钠）、二回路（钠）、三回路（水）的布置，快堆能增殖核燃料、提高资源利用率，先进压水堆和快堆是主流发展方向。故选B。不选A：发电效率并非快堆的最大特点（高温气冷堆的发电效率比压水堆高）；不选C：常压运行是熔盐堆的安全特性；不选D：快堆需要冷却剂（液态金属钠），任何反应堆都离不开冷却剂导出热量。【易混点】我国快堆布局：实验快堆CEFR在北京房山，示范快堆CFR600在霞浦；钠冷快堆属第四代核电三种快中子堆之一。"},{"id":"qihang_hdczs_0009","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"沸水堆核电站正常功率运行时，其二回路介质不带有放射性。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》章节回顾：沸水堆二回路介质带有放射性。原因是沸水堆只有一个回路，水在反应堆内沸腾产生蒸汽，直接进入汽轮机发电，蒸汽必然夹带放射性物质，汽轮机、冷凝器等二回路设备因此受到放射性污染，检修时须按辐射区对待。题目称“不带有放射性”，与课件相悖，判“错误”。【易混点】对比记忆：压水堆正常情况下只在一回路存在放射性（蒸汽发生器管壁隔离一、二回路），沸水堆因直接循环导致汽轮机侧带放射性，这是两种堆型放射性分布的核心区别。"},{"id":"qihang_hdczs_0010","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"高温气冷堆采用（　）作为冷却剂。","options":["轻水","重水","氦气","液态金属钠"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电工程项目管理》《核电厂概述》：高温气冷堆用氦气作冷却剂，石墨作慢化剂，堆芯出口温度较高，对反应堆材料的性能要求高；山东石岛湾建设了20万千瓦级高温气冷堆（示范气冷堆），高温气冷堆核电站发电效率比压水堆核电站高。故选C。不选A：轻水（普通净化水）是压水堆、沸水堆的冷却剂兼慢化剂；不选B：重水是重水堆（秦山三期）的慢化剂；不选D：液态金属钠是快堆的冷却剂。【易混点】各堆型冷却剂/慢化剂组合：压水堆—轻水/轻水；重水堆—重水/重水；高温气冷堆—氦气/石墨；快堆—液态钠/无慢化剂（快中子谱）。"},{"id":"qihang_hdczs_0011","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"熔盐堆的核燃料溶解在高温熔盐中形成流动的液态燃料，其工作温度约为（　）。","options":["300-400℃","500-600℃","700-800℃","900-1000℃"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：熔盐堆的核燃料（如铀-235、钚-239或钍-232）直接溶解在高温熔盐（如氟化锂、氟化铍等）中，形成流动的液态燃料，燃料盐既作核裂变介质又作热量载体；熔盐在常压下即呈液态，工作温度约700-800摄氏度，高热容、高沸点，天然具备被动安全性。故选C。不选A、B：300-400、500-600摄氏度均低于熔盐堆工作温度区间；不选D：900-1000摄氏度课件未提及，属拔高干扰项。【易混点】熔盐堆其他考点：常压运行无高压爆炸风险、负温度系数（遇高温膨胀裂变反应减速）、事故时熔盐凝固堵塞管道被动冷却、可增殖钍-232，适合模块化小型堆。"},{"id":"qihang_hdczs_0012","module":"qihang","bank":"启航-核电厂概述","type":"multi","stem":"中核集团863基本动作中，全体员工“六个做到”包括（　）。","options":["做到“讲安全”","做到“守规矩”","做到“重协作”","做到“勤汇报”"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：中核集团863基本动作中，全体员工“六个做到”为：做到“讲安全”、做到“守规矩”、做到“重协作”、做到“戒自满”、做到“善沟通”、做到“多思考”。故A、B、C正确。不选D：“勤汇报”不在六个做到之列，与沟通相关的一条是“善沟通”，内容包括工作过程的沟通和决策依据的沟通，“勤汇报”属偷换表述。【易混点】六个做到的含义易混：如“戒自满”指即使面临成功也要认识失误的可能性、避免经验主义；“多思考”包含不确定时暂停、对假设保持质疑、对变化保持敏感三条。"},{"id":"qihang_hdczs_0013","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"中核集团863基本动作中，组织“三大法宝”是指（　）。","options":["培训、监督、考核","认识核安全的重要性、问题识别与解决、持续改进","识别、评价、解决","严守设计裕量、设备可靠、高质量程序"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：中核集团863基本动作中，组织“三大法宝”为：一、认识核安全的重要性——认识到核技术的复杂性和特殊敏感性，任何失误和偏差都可能导致涉核舆情；二、问题识别与解决——包括识别、评价、解决、趋势分析四环节；三、持续改进——包括避免组织自满、经验反馈、评估、对标、培训、监督检查等。故选B。不选A：“培训、监督、考核”只是持续改进法宝下的部分手段；不选C：“识别、评价、解决”是问题识别与解决法宝中的步骤；不选D：“严守设计裕量、设备可靠、高质量程序”是“认识核安全的重要性”项下的具体要求。【易混点】“员工六个做到”与“组织三大法宝”是863基本动作的两个层面，考题常互相串项设错。"},{"id":"qihang_hdczs_0014","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"福岛核事故中，1、2、3号机组堆芯融化，1、3、4号机组发生氢爆。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：2011年3月11日14时46分，日本东北外海发生9级地震并引发巨大海啸，地面剧烈震动导致所有运行机组自动停堆，12台应急柴油发电机启动后因水淹失效，全厂断电、热阱丧失，造成1、2、3号机组堆芯融化，1、3、4号机组发生氢爆，土壤大面积受污染、产生120万方废水、20公里居民大撤离。题目机组编号与课件一致，判“正确”。【易混点】注意两组编号的区别：堆芯融化的是1、2、3号机组，氢爆的是1、3、4号机组，“融化”与“氢爆”的机组组合不同，最易互换设错；福岛机组堆型为沸水堆（BWR）。"},{"id":"qihang_hdczs_0015","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"2014年3月习近平总书记在第三届核安全峰会上提出要坚持的核安全观是（　）。","options":["理性、协调、并进","安全第一、预防为主","法治、忧患、自律","合作、共赢、共享"],"answer":["A"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：2014年3月，习近平总书记在出席第三届核安全峰会时提出：“加强核安全是一个持续过程。我们要坚持理性、协调、并进的核安全观，把核安全进程纳入健康持续发展轨道”。故选A。不选B：“安全第一、预防为主”是一般安全工作方针，非该核安全观表述；不选C：“法治、忧患、自律”取自总书记另一重要论述——“法治意识、忧患意识、自律意识、协作意识是核安全文化的核心”，属混淆项；不选D：“合作、共赢、共享”非课件表述。【易混点】“理性、协调、并进的核安全观”（核安全观）与“法治、忧患、自律、协作四个意识”（核安全文化核心）是两组不同考点，切勿互相拼串。"},{"id":"qihang_hdczs_0016","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"核电机组大约90%的时间是在100%功率运行。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：正常功率运行状态下，核电机组大约90%的时间是在100%功率运行，控制系统均在自动控制状态；运行日常主要是监盘、巡检（报缺）、试验（设备切换）、水质控制、调硼以及安措隔离/恢复、维修消缺等；每一年半进行一次换料大修，约30天（装卸料时间各约3天）。题目表述与课件一致，判“正确”。【易混点】“90%时间满功率运行”说明核电机组适合带基本负荷稳定运行、负荷因子高，这是核电与风电、光伏等间歇性能源在运行方式上的本质区别。"},{"id":"qihang_gckp_0002","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电站项目核准文件由国家核安全局印发，建造许可证由国家发展改革委印发。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：两者的发证机关正好说反了。项目核准批复由国家发展改革委印发；建造许可证与运行许可证由国家核安全局印发（不是国家能源局、发展改革委或国防科工局）。这是判断题高频陷阱，务必按「发改委核准、核安全局发证」记忆。"},{"id":"qihang_gckp_0003","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电项目由国家能源局核准，国家发展改革委只负责核电的行业管理。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：核准权在国家发展改革委，国家能源局并不核准核电项目，而是负责行业管理（例如消防验收）。分工口诀：发改委管核准批复、国家核安全局管建造与运行许可证、国家能源局管行业管理。"},{"id":"qihang_gckp_0004","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"厂址普选（厂址查勘）不属于项目建议书即初步可行性研究阶段的工作，而是在可行性研究阶段进行的。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：厂址普选（厂址查勘）是在较大范围内筛选候选厂址，属于项目建议书（初步可行性研究）阶段的工作，是前期流程的第一步。卡片明确把「厂址普选不属于项目建议书阶段」列为高频判断题错误说法。"},{"id":"qihang_gckp_0005","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"初步可行性研究报告初稿完成后，可以同步启动项目建议书的编制工作。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：初可研报告初稿完成后可以同步启动项目建议书编制，两项工作并行推进以争取时间。卡片明确把「初可研初稿完成后不可同步启动项目建议书编制」列为高频判断题错误说法。"},{"id":"qihang_gckp_0006","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电工程建设共有9个单项验收，其中消防验收由国家能源局负责。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：核电工程单项验收共9个，消防验收属国家能源局职责范围，这正是「国家能源局负责行业管理」的具体体现。注意与项目核准（发改委）、建造与运行许可证（国家核安全局）的分工相区别，不要混为一谈。"},{"id":"qihang_gckp_0007","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电项目初步设计阶段的建设成本以初步设计概算表示，项目建设各阶段的成本控制均以初步设计概算为标准，而可行性研究阶段对应的则是投资估算。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：初步设计阶段对应初步设计概算，并且各阶段成本控制都以初步设计概算为标准；可研阶段对应的是投资估算。易错点是把概算与估算的阶段归属记反，或误认为各阶段各有各的控制标准。"},{"id":"qihang_gckp_0008","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电工程采用总承包模式后，核安全主体责任随之转移给总承包方，业主不再承担核安全主体责任。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：采用总承包模式，业主仍承担核安全主体责任，不因总承包而免除；移交后出现的问题按法律与合同界定责任。核安全主体责任是法定的，不能通过合同方式转移。"},{"id":"qihang_gckp_0009","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"项目取得国家发展改革委下发的「路条」后，即意味着国家已同意项目建设，可以开工。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：路条＝同意开展前期工作，核准＝同意建设，两者含义不同，拿到路条不等于拿到核准。取得路条后还要完成可行性研究、两评报告，取得国家发展改革委的核准批复和国家核安全局的建造许可证，直至FCD才标志土建关键路径正式开始。"},{"id":"qihang_gckp_0010","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"关于核电项目前期的「小路条」与「路条」（大路条），下列说法正确的是（　）。","options":["小路条由省级发展改革委出具，是开展初步可行性研究的前提；路条由国家发展改革委下发，此后才能开展可行性研究","小路条由国家发展改革委出具，是开展可行性研究的前提；路条由省级发展改革委下发，此后才能开展初步可行性研究","小路条和路条都由国家发展改革委出具，只是下发时间不同","小路条即项目核准文件，取得后即可开工建设"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：记忆口诀「小路条看省级、路条看国家」。小路条是省级发改委的复函，厂址查勘报告预审查通过后取得，是开展初可研的前提；路条（大路条）由国家发改委下发，初可研报告与项目建议书审评后才下发，此后才能做可行性研究。小路条在前、路条在后，中间隔着初可研，且路条不等于核准。"},{"id":"qihang_gckp_0011","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"下列符合核电项目前期主要工作流程先后顺序的是（　）。","options":["厂址普选→初步可行性研究→小路条→可行性研究→两评报告→项目核准→建造许可证→FCD","初步可行性研究→厂址普选→小路条→可行性研究→两评报告→项目核准→建造许可证→FCD","厂址普选→初步可行性研究→小路条→可行性研究→项目核准→两评报告→建造许可证→FCD","厂址普选→初步可行性研究→小路条→可行性研究→两评报告→FCD→项目核准→建造许可证"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：前期流程主线为纳规→路条→核准，具体顺序为①厂址普选（属项目建议书、初可研阶段）②初步可行性研究③小路条（省级）④可行性研究⑤两评报告⑥项目核准（发改委）⑦建造许可证（国家核安全局）⑧FCD。两评报告是项目核准的重要前提条件，必须在核准之前；FCD是核准并取得建造许可证之后的节点。"},{"id":"qihang_gckp_0012","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"核电项目初步可行性研究阶段的核心任务是（　）。","options":["全面论证项目可行性，取得环保、海洋、水利、国土等支持性文件","排除厂址的颠覆性因素，争取项目列入国家规划","编制初步设计概算，作为各阶段成本控制的标准","申领建造许可证，开展核岛负挖等开工准备"],"answer":["B"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：初步可行性研究的主要任务是编制初可研报告、排除颠覆性因素、争取列入国家规划（纳规）。取得环保、海洋、水利、国土等支持性文件是可行性研究阶段的工作；初步设计概算属初步设计阶段；申领建造许可证与开工准备在核准之后。"},{"id":"qihang_gckp_0013","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"关于核电项目前期相关支持性文件的效力要求，下列说法正确的是（　）。","options":["只要主管部门口头同意即可，不要求形成书面意见","相关支持性文件须含有「原则同意」字样方为有效","支持性文件统一由项目所在地县级人民政府出具","支持性文件可在项目建成投产后一并补办"],"answer":["B"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：前期工作中相关支持性文件须含有「原则同意」字样方为有效，只写「已收悉」「可供参考」等不足以作为核准支持文件。这是前期工作容易被退回补正的实务要点。"},{"id":"qihang_gckp_0014","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"与运营（运管）这种持续性、重复性的活动不同，项目是有明确起点与终点的临时性、独特性活动，其项目内容随推进由粗到细逐步明确，这一特性称为（　）。","options":["临时性","独特性","渐进明细（逐步完善）","持续性"],"answer":["C"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：项目三大特性为临时性、独特性、渐进明细（也称逐步完善）。题干所述「由粗到细逐步明确」即渐进明细。凡看到「持续性、重复性」，应判断那是运营（运管）而非项目的特征。"},{"id":"qihang_gckp_0015","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"关于核电工程建设三大目标及其相互关系的说法，正确的是（　）。","options":["安全质量、工期、费用三大目标互相独立，可以分别实现各自最优","三大目标是安全质量、工期、费用，彼此互相联系、互相影响，应追求优化和平衡","三大目标是指安全、质量、进度，费用属于外部约束条件而非管理目标","三大目标中工期始终优先，必要时可适当降低安全质量要求"],"answer":["B"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：三大目标为安全质量、工期、费用，笔记用箭头表示三者互相联系、互相影响，追求的是优化和平衡，而非某一项单独最优。三大目标与六大控制中的安全、质量、进度、投资相对应。"},{"id":"qihang_gckp_0016","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"关于核电项目前期报告的编制与审查要求，下列说法正确的是（　）。","options":["可由项目业主自行编制，报主管部门备案即可","须委托有资格的设计院编制报告，并组织有资质的咨询机构审查","须委托有资格的施工单位编制，由业主自行组织审查","统一由项目所在地发展改革部门编制并组织审查"],"answer":["B"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：前期报告须委托有资格的设计院编制，并组织有资质的咨询机构审查；例如厂址查勘报告需通过电力咨询公司预审查，预审查通过后才能取得小路条。编制与审查都不能由业主自行替代。"},{"id":"qihang_gckp_0017","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"中核集团「六大控制七个零」标杆管理模式中，所指的「六大控制」包括（　）。","options":["安全","质量","进度","投资","环保、保密","廉洁"],"answer":["A","B","C","D","E"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：六大控制为安全、质量、进度、投资、环保、保密，记忆口诀「安质进投环保密」，缺一不可。必考陷阱：问六大控制时不选廉洁，廉洁只出现在「七个零」中。该模式由中核集团创建，2021年入选国务院国资委国有重点企业管理标杆创建行动十大标杆模式。"},{"id":"qihang_gckp_0018","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"中核集团「六大控制七个零」标杆管理模式中，「七个零」的卓越目标包括（　）。","options":["安全零事故、质量零事件","进度零超期、投资零超概","环保零超标、保密零泄密","廉洁零问题","投资零超限","保密零泄露"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：七个零＝安全零事故、质量零事件、进度零超期、投资零超概、环保零超标、保密零泄密，再加上廉洁零问题作为管理底线补充，故6→7。必考陷阱：问七个零时要选廉洁；同时注意官方用词是「投资零超概」「保密零泄密」，不是「超限」「泄露」。"},{"id":"qihang_gckp_0019","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"核电工程项目管理的基本管理原则（「四化」）包括（　）。","options":["标准化","集约化","一体化","契约化","精细化","信息化"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：基本管理原则为标准化、集约化、一体化、契约化，简称「四化」。笔记特别提示手写时易把「集约化」误抄成「集改推进」，以四化为准。"},{"id":"qihang_gckp_0020","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"核电工程项目管理目标的四项要求是（　）。","options":["绝对责任","最高标准","体系运行","经验反馈","纵深防御","持续改进"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：管理目标体现为「严之又严、慎之又慎、细之又细、实之又实」，四项要求为绝对责任、最高标准、体系运行、经验反馈，主要依据《核安全法》《安全生产法》。「纵深防御」属核安全技术原则，「持续改进」属通用管理用语，均非此处四项要求。"},{"id":"qihang_gckp_0021","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"与常规工程相比，核电工程的主要特点包括（　）。","options":["质量要求高","投资大、周期长","技术接口复杂","对核安全与核质量有特殊要求，审批环节多","建设周期短、投资回收快","管理标准可直接套用火电工程标准"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：核电工程特点是质量要求高、投资大周期长、技术接口复杂、对核安全与核质量有特殊要求、审批环节多。常见错误说法「火电工程标准全部适用于核电管理」是错误的，核电有独立且更严的标准体系，不能简单套用火电标准。"},{"id":"qihang_gckp_0022","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"按照笔记口径，核电项目全生命周期包括的阶段有（　）。","options":["工程基建","安装调试","商业运行","退役","土建施工","竣工验收"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：全生命周期四段为工程基建→安装调试→商业运行→退役，覆盖从基建到退役的全过程；而工程建设四阶段（土建施工→设备安装→系统调试→竣工验收）讲的是建设期内部的划分，两者是两套不同划分，答题时切勿混答。施工主线也常按土建→安装→调试三阶段讲，把竣工验收单独列出即为四阶段。"},{"id":"qihang_gsgk_0001","module":"qihang","bank":"启航-公司概况","type":"single","stem":"关于中核集团（CNNC）与中国核电（CNNP）两个主体，下列说法正确的是（　）。","options":["中核集团是中央直接管理的国有重要骨干企业，中国核电是中核集团核电业务的专业化平台","中国核电是中核集团的母公司，负责统筹集团全部军工与核电业务","CNNC 是中国核能电力股份有限公司的英文简称，CNNP 是中国核工业集团有限公司的英文简称","中核集团与中国核电是两块牌子、同一套业务，两者不存在主体差异"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：中核集团（CNNC）是中央直接管理的国有重要骨干企业，是核工业的国家队、主力军；中国核能电力股份有限公司（CNNP，简称中国核电）是中核集团核电业务的专业化平台。易错点在于把两个主体混为一谈，或用反简称与母子关系。"},{"id":"qihang_gsgk_0002","module":"qihang","bank":"启航-公司概况","type":"single","stem":"中核集团的集团定位是（　）。","options":["军民融合、军工兼具能源和建筑属性的战略高科技型企业","以核电投资运营为唯一业务的单一能源企业","以核燃料贸易为主业的国际化商贸企业","以工程建设总承包为主业的建筑类企业"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：中核集团定位为军民融合、军工兼具能源和建筑属性的战略高科技型企业。易错点是只看到「军工」或只看到「能源」，忽略其军民融合与多重属性叠加的战略高科技定位。"},{"id":"qihang_gsgk_0003","module":"qihang","bank":"启航-公司概况","type":"judge","stem":"中国核电的「五个业务板块」与中核集团的业务板块是同一套划分口径，答题时可以互换使用。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：两者主体不同、口径不同，不能混用。中国核电五个业务板块为核能发电、核能多用途利用、核电技术服务、非核清洁能源、敏捷清洁技术；中核集团业务板块为核燃料循环、能源、科研与工程技术、工程建设、产业协同、数智化、核环保、核技术应用。这是卡片标注的高频易混点。"},{"id":"qihang_gsgk_0004","module":"qihang","bank":"启航-公司概况","type":"single","stem":"下列关于中核集团产业链布局先后顺序的排列，正确的是（　）。","options":["铀矿地质 → 开采水冶 → 浓缩 → 组件制造 → 核电工程设计","开采水冶 → 铀矿地质 → 浓缩 → 组件制造 → 核电工程设计","铀矿地质 → 开采水冶 → 组件制造 → 浓缩 → 核电工程设计","铀矿地质 → 开采水冶 → 浓缩 → 核电工程设计 → 组件制造"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：产业链布局为铀矿地质 → 开采水冶 → 浓缩 → 组件制造 → 核电工程设计 → 工程建设 → 技术服务 → 核电运行 → 后处理 → 废物处理 → 再循环。易错点是把组件制造与浓缩的顺序颠倒，或漏掉工程设计环节直接跳到工程建设。"},{"id":"qihang_gsgk_0005","module":"qihang","bank":"启航-公司概况","type":"multi","stem":"到「十四五」末，中国核电初步形成的三大产业领域包括（　）。","options":["核能","非核清洁能源","敏捷端新产业（战略性新兴产业）","核技术应用","工程建设"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：三大产业领域为核能、非核清洁能源、敏捷端新产业（即战略性新兴产业）。易错点是误把集团业务板块中的核技术应用、工程建设当作中国核电的产业领域，注意「三大产业领域」与「五个业务板块」是两套不同划分。"},{"id":"qihang_gsgk_0006","module":"qihang","bank":"启航-公司概况","type":"multi","stem":"下列属于中国核电五个业务板块的有（　）。","options":["核能发电","核能多用途利用","核电技术服务","非核清洁能源","核燃料循环","产业协同"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：中国核电五个业务板块为核能发电、核能多用途利用、核电技术服务、非核清洁能源、敏捷清洁技术。核燃料循环与产业协同属于中核集团的业务板块，是本题设置的易混干扰项。"},{"id":"qihang_gsgk_0007","module":"qihang","bank":"启航-公司概况","type":"single","stem":"中核汇能是中国核电在（　）领域的专业化平台公司。","options":["风光类新能源开发","核电大修与专业维修","核电运行技术支持与核电信息化","核燃料循环与后处理"],"answer":["A"],"score":null,"source":"generated","origin":" 属于典型错误表述。"},{"id":"qihang_flkp_0001","module":"qihang","bank":"启航-法律合规","type":"single","stem":"关于《中华人民共和国原子能法》的性质与地位，下列说法正确的是（　）。","options":["我国原子能领域基础性、综合性法律，自2026年1月15日起施行","由国务院制定的行政法规，主要规范核电厂选址","由生态环境部制定的部门规章，仅适用于核安全监管","核电行业的推荐性标准，不具有强制约束力"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：《原子能法》于2025年9月12日经十四届全国人大常委会第十七次会议通过、2026年1月15日起施行，是我国原子能领域基础性、综合性法律，是原子能法律法规体系建设的重要里程碑。易错点是把它误认为行政法规或部门规章——它由全国人大常委会通过，属于「法律」位阶。"},{"id":"qihang_flkp_0002","module":"qihang","bank":"启航-法律合规","type":"single","stem":"下列关于我国法律效力位阶的排序，正确的是（　）。","options":["宪法 ＞ 法律 ＞ 行政法规 ＞ 地方性法规、规章","法律 ＞ 宪法 ＞ 行政法规 ＞ 地方性法规、规章","宪法 ＞ 行政法规 ＞ 法律 ＞ 地方性法规、规章","宪法 ＞ 法律 ＞ 地方性法规、规章 ＞ 行政法规"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：法律位阶为宪法 ＞ 法律 ＞ 行政法规 ＞ 地方性法规、规章。易错点是把行政法规排在法律之上，或把地方性法规、规章排在行政法规之上。"},{"id":"qihang_flkp_0003","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"我国法律适用的基本原则包括（　）。","options":["上位法优于下位法","特别法优于一般法","新法优于旧法","宪法原则","下位法优于上位法","一般法优于特别法"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：法律适用四原则为上位法优于下位法、特别法优于一般法、新法优于旧法、宪法原则，四条别漏，尤其不要漏掉「宪法原则」。干扰项把适用方向写反了。"},{"id":"qihang_flkp_0004","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"国家秘密的保密期限分别为：绝密级30年、机密级20年、秘密级10年。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：保密期限为绝密级30年、机密级20年、秘密级10年，该说法正确。记忆口诀按密级从高到低依次递减30、20、10。"},{"id":"qihang_flkp_0005","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"公司已向社会公开的财务数据仍属于内幕信息，员工不得对外引用。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：内幕信息不包括已公开的财务数据，已公开的信息不再具有内幕信息的未公开性特征，该说法错误。"},{"id":"qihang_flkp_0006","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"关于中国核电合规管理「三道防线」，下列说法正确的有（　）。","options":["第一道防线是业务部门（业务及职能部门），承担主体责任，落实管业务必须管合规","第二道防线是合规管理（法律合规）部门，牵头抓总、组织协调并开展合规审查","第三道防线是监督部门（审计、纪检监察），独立监督、执纪问责","第二道防线是业务部门，第三道防线是合规管理部门"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：三道防线顺序必背——业务部门（主体责任）→ 合规管理（法律合规）部门（牵头抓总）→ 监督部门（独立监督、执纪问责），口诀「谁管业务、谁管风险」。易错点是把顺序颠倒，或把监督部门放在第二道。"},{"id":"qihang_flkp_0007","module":"qihang","bank":"启航-法律合规","type":"single","stem":"中国核电合规工作的领导和决策机构是（　）。","options":["董事会","总经理部","法律合规部门","审计与纪检监察部门"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：董事会是中国核电合规工作的领导与决策机构；总经理部是公司分业务领域管理的最高决策机构，两者层级与职责不同，是卡片标注的易混点。"},{"id":"qihang_flkp_0009","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"关于公司舆情应对与信息发布规范，下列做法正确的有（　）。","options":["发生重大舆情及时报告，不得隐瞒、缓报、谎报","未经审核批准，不私自发布、转发、评论或泄露公司秘密","不私自印制、外发公司宣传材料","为争取主动，可先以个人名义发布未经审核的公司信息"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：舆情规范要求重大舆情不得隐瞒、缓报、谎报；未经审核批准不得私自发布、转发、评论或泄露公司秘密；不得私自印制外发宣传材料。以个人名义抢先发布未经审核的公司信息同样违规。"},{"id":"qihang_flkp_0010","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"下列属于我国核安全工作原则的有（　）。","options":["安全第一、预防为主","责任明确、严格管理","纵深防御、独立监管","全面保障","效益优先、事后追责","分级负责、属地管理为主"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：核安全工作原则为安全第一、预防为主、责任明确、严格管理、纵深防御、独立监管、全面保障。干扰项「效益优先、事后追责」与核安全「安全第一、预防为主」的取向相悖，不属于核安全工作原则。"},{"id":"qihang_gjkp_0001","module":"qihang","bank":"启航-国际合作","type":"judge","stem":"世界核电运营者协会（WANO）的中心体系由伦敦办公室与莫斯科、东京、多伦多、亚特兰大四个区域中心组成。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：WANO中心体系为伦敦办公室加莫斯科、东京、巴黎、亚特兰大四个区域中心。真题常把「巴黎」错写成「多伦多」，该说法判错误，这是卡片红笔标注的经典陷阱。"},{"id":"qihang_gjkp_0002","module":"qihang","bank":"启航-国际合作","type":"single","stem":"世界核电运营者协会（WANO）在我国设立的第五中心位于（　）。","options":["上海","北京","深圳","大连"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：WANO在中国设立第五中心，地点为上海。易错点是与集团、公司总部所在地北京混淆。"},{"id":"qihang_gjkp_0003","module":"qihang","bank":"启航-国际合作","type":"multi","stem":"下列属于国际原子能机构（IAEA）业务部门的有（　）。","options":["核能部","核安全和核安保部","技术合作部","总干事办公室"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：IAEA业务部门包括核能部、核安全和核安保部、技术合作部等；总干事办公室属于管理机构，不属于业务部门，是卡片明确点出的易错项。"},{"id":"qihang_gjkp_0004","module":"qihang","bank":"启航-国际合作","type":"single","stem":"国际原子能机构（IAEA）于1957年7月成立，是联合国系统内的专门机构，其总部设在（　）。","options":["维也纳","日内瓦","纽约","巴黎"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：IAEA总部设在维也纳。易错点是与联合国总部纽约、国际组织聚集地日内瓦，以及WANO区域中心之一的巴黎混淆。"},{"id":"qihang_gjkp_0005","module":"qihang","bank":"启航-国际合作","type":"judge","stem":"中国于1984年1月1日正式成为国际原子能机构（IAEA）成员国，并于同年6月被接纳为指定理事国。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：中国1984年1月1日加入IAEA、同年6月被接纳为指定理事国，该说法正确，是速记表中的稳定考点。"},{"id":"qihang_sckp_0001","module":"qihang","bank":"启航-市场开发","type":"single","stem":"我国电力市场化改革的路径可概括为（　）。","options":["三放开、一独立、三强化","三放开、两独立、三强化","四放开、一独立、两强化","两放开、一独立、三强化"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：电力市场化改革路径为「三放开、一独立、三强化」。易错点是把「一独立」（交易机构独立规范运行）记成「两独立」，或把「三放开」「三强化」的数量写错。"},{"id":"qihang_sckp_0002","module":"qihang","bank":"启航-市场开发","type":"single","stem":"下列不属于我国电力市场化改革方向的是（　）。","options":["加强政府定价及计划发电","有序放开发用电计划","推进售电侧改革","推进交易机构独立规范运行"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：「加强政府定价及计划发电」与市场化改革方向相反，不是改革方向，是真题常见错误表述。改革强调放开发用电计划、推进售电侧改革、推进交易机构独立规范运行。"},{"id":"qihang_sckp_0003","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"电力调度中应按照「核电、风光、水电、煤电」的固定顺序安排发电。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：并不存在「核电、风光、水电、煤电」的固定调度顺序，该说法错误。实际按清洁能源优先、安全与经济调度原则安排发电。"},{"id":"qihang_sckp_0004","module":"qihang","bank":"启航-市场开发","type":"single","stem":"下列工作中，能够直接扩大核电机组规模的是（　）。","options":["核电新项目开发","售电开发","新能源开发","技术服务市场"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：直接扩大核电机组规模的是核电新项目开发。售电开发、新能源开发、技术服务市场都不直接扩大核电机组规模，是高频干扰项。"},{"id":"qihang_sckp_0005","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"市场部项目经理的职责主要是对外沟通协调，项目内部事项应由其他部门统筹，项目经理不必过问。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：市场部项目经理既要对外沟通，也要统筹内部事项，不能只做对外，该说法错误。"},{"id":"qihang_sckp_0006","module":"qihang","bank":"启航-市场开发","type":"single","stem":"中国核电负责国际市场开发业务的部门是（　）。","options":["核能事业部","集团公司经营开发部","中核工程","各区域市场开发部"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：国际市场开发业务部门是核能事业部。集团公司经营开发部负责整体统筹、中核工程负责技术支撑、各区域市场开发部负责地方公共关系维护，这些属于国内项目开发的分工体系，与国际市场开发的归口部门不是同一维度，别串答。"},{"id":"qihang_whkp_0002","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"「追求卓越、挑战自我」是中国核电现行奋斗目标的第③项。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：现行奋斗目标第③项是「追求卓越、超越自我」，要认准「超越」二字。「追求卓越、挑战自我」是2008年至2015年6月期间的旧价值理念，已被迭代，是笔记标注的高频易错点。"},{"id":"qihang_whkp_0003","module":"qihang","bank":"启航-企业文化","type":"single","stem":"下列关于中国核电奋斗目标构成的说法，正确的是（　）。","options":["共五项，前三项为目标类表述，后两项「三化战略」「四个创造」为路径与价值类表述","共三项，只包含目标类表述","共五项，五项全部为目标类表述","「三化战略」和「四个创造」属于核心价值观的组成部分，不计入奋斗目标"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：奋斗目标为五项，①奉献安全高效能源，创造清洁低碳生活；②争做最具魅力的国际一流核能企业；③追求卓越、超越自我；④三化战略（集约化、标准化、数智化）；⑤四个创造。前三项是目标类，后两项是路径与价值类，不能只背前三条。"},{"id":"qihang_whkp_0004","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电「三化战略」中，「数智化」的核心内涵是（　）。","options":["以AI、大数据、5G等新技术赋能","通过资源配置整合提高效率","以标准提质增效","通过规模化扩张降低单位成本"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：三化战略为集约化、标准化、数智化，分别对应资源配置整合、标准提质增效、AI/大数据/5G赋能。易错点是把三者的内涵张冠李戴，或按旧表述把第三项说成「国际化」。"},{"id":"qihang_whkp_0005","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的经营宗旨是（　）。","options":["安全第一，质量第一，回报股东，服务社会，促进员工发展","奉献安全高效能源，创造清洁低碳生活","责任、安全、创新、卓越","集约化、标准化、数智化"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：经营宗旨为「安全第一，质量第一，回报股东，服务社会，促进员工发展」，其中「安全第一、质量第一」是根本方针。B 是企业使命，C 是核心价值观，D 是三化战略，四个选项分属不同理念条目，答题要看清类别。"},{"id":"qihang_whkp_0006","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电提出的职业化公式中，组织有效性等于（　）。","options":["有效领导力 ×（管理模式（体系）+ 核职业人员）","有效领导力 + 管理模式（体系）+ 核职业人员","战略 × 执行 × 文化","领导力 × 制度 − 风险"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：职业化公式为有效领导力 ×（管理模式（体系）+ 核职业人员）= 组织有效性。要注意是乘法关系，领导力作为乘数因子，任一短板都会整体放大影响组织有效性，这是该题的理解要点。"},{"id":"qihang_whkp_0007","module":"qihang","bank":"启航-企业文化","type":"multi","stem":"下列属于「两弹一星」精神完整表述内容的有（　）。","options":["热爱祖国、无私奉献","自力更生、艰苦奋斗","大力协同、勇于登攀","事业高于一切、责任重于一切","严细融入一切、进取成就一切"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：「两弹一星」精神24字为热爱祖国、无私奉献，自力更生、艰苦奋斗，大力协同、勇于登攀，可按情怀—作风—方法与追求三段记忆。D、E 出自「四个一切」核工业精神，是本题设置的易混干扰项。"},{"id":"qihang_whkp_0008","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"「四个一切」核工业精神中的正确表述是「严细融于一切」。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：正确表述是「严细融入一切」，不是「融于」。完整顺序为事业高于一切、责任重于一切、严细融入一切、进取成就一切，既要认准「入」字，也要认准事业→责任→严细→进取的先后顺序。"},{"id":"qihang_whkp_0009","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"我国核安全观的内涵是「理性、协同、并进」。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：中国核安全观的正确表述是「理性、协调、并进」，不能把「协调」写成「协同」。这是笔记一句话纠错中专门列出的高频易错点。"},{"id":"qihang_whkp_0010","module":"qihang","bank":"启航-企业文化","type":"multi","stem":"中国核电核安全文化的四个意识包括（　）。","options":["法治意识","忧患意识","自律意识","协作意识","竞争意识","创新意识"],"answer":["A","B","C","D"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：核安全文化四个意识为法治意识、忧患意识、自律意识、协作意识，同时也是卓越文化树体系中的四种意识。易错点是混入竞争意识、创新意识等看似正面但不在表述内的说法。"},{"id":"qihang_whkp_0011","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"根据核电安全行为准则，在安全与领导指示发生冲突时，员工应坚决执行领导指示。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：核电安全行为准则强调敬畏规章、绝不心存侥幸，严格执行标准、严守操作程序，任何情况下都不得降低安全标准。「坚决执行领导指示」是错误表述，安全上不能盲从，这是笔记标注的典型陷阱项。"},{"id":"qihang_whkp_0012","module":"qihang","bank":"启航-企业文化","type":"single","stem":"在中国核电卓越文化树模型中，作为文化「土壤」（基础）的是（　）。","options":["中国特色社会主义文化","核工业文化","核安全文化","子公司文化"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：卓越文化树以中国特色社会主义文化为土壤（基础），以核工业文化为源泉，以核安全文化为根本，以追求卓越为导向、以国际一流为目标，以子公司文化为枝叶（特色）。四个要素的定位要一一对应，不能错位。"},{"id":"qihang_whkp_0013","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电卓越文化徽章由五种颜色构成，其颜色与发展理念的对应关系正确的是（　）。","options":["蓝、黄、绿、红、紫 —— 创新、协调、绿色、开放、共享","蓝、黄、绿、红、紫 —— 创新、绿色、协调、开放、共享","蓝、绿、黄、红、紫 —— 创新、协调、绿色、开放、共享","黄、蓝、绿、红、紫 —— 协调、创新、绿色、开放、共享"],"answer":["A"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：卓越文化徽章五色为蓝、黄、绿、红、紫，依次对应创新、协调、绿色、开放、共享五大发展理念，徽章是卓越文化树的抽象表达。易错点是绿色与协调的次序颠倒。"},{"id":"qihang_zlkp_0001","module":"qihang","bank":"启航-战略规划","type":"judge","stem":"「安全高效发展核电」是我国核电发展早期使用过的表述，2026 年现行的核电发展基本方针是「积极安全有序发展核电」，并已写入《中华人民共和国原子能法》。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：现行核电发展基本方针为「积极安全有序发展核电」，已写入《原子能法》（2025 年 9 月通过、2026 年 1 月施行）；「安全高效发展核电」是早期旧表述，看到要能识别。易错点：部分旧题库仍以「安全高效发展核电」为标准答案，考生应按 2026 年最新口径作答，同时了解旧表述的沿革，不必在两个版本之间摇摆。"},{"id":"qihang_zlkp_0002","module":"qihang","bank":"启航-战略规划","type":"judge","stem":"中国核电现行的「三化战略」是「集约化、标准化、数智化」，为 2025 年提出的新「三化」，取代了早期的「规模化、标准化、国际化」。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：新「三化」指集约化、标准化、数智化，2025 年提出；旧「三化」为规模化、标准化、国际化，属 2025 年以前的表述。易错点：旧资料中出现的「三化战略＝规模化、标准化、国际化」是历史沿革中的老提法，2026 年口径以新「三化」为准。"},{"id":"qihang_zlkp_0003","module":"qihang","bank":"启航-战略规划","type":"judge","stem":"我国「十五五」规划纲要草案部署 12 个方面重大战略任务，共提出 109 项重大工程。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：纲要草案部署的是 16 个方面重大战略任务，并提出 6 个方面 109 项重大工程；12 个方面是党的二十届四中全会通过的《建议》分领域部署的重点任务数量。易错点：12 与 16 分属《建议》和规划纲要草案两个不同文件，最容易被互相套错。"},{"id":"qihang_zlkp_0004","module":"qihang","bank":"启航-战略规划","type":"judge","stem":"中核集团「十五五」「三期定位」中，「关键期」对应的是全面推动高质量发展、实现赶超跨越。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：三期定位（2026 年集团会议口径）为——冲刺期＝全面完成深化改革任务、建成世界一流核工业集团；关键期＝全面推动高质量发展、实现赶超跨越；攻坚期＝全面建成现代化先进核科技工业体系。易错点：注意与「三个关键期」是两套问法，不要混答。"},{"id":"qihang_zlkp_0005","module":"qihang","bank":"启航-战略规划","type":"judge","stem":"在 SWOT 分析中，SO（优势＋机会）组合对应的是增长型战略，也称进攻型战略。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：SWOT 组合中 SO（优势＋机会）对应增长型（进攻型）战略，即依托内部优势去抓住外部机会。易错点：WO 为扭转型、ST 为多元化、WT 为防御型，四个组合的战略类型不要张冠李戴。"},{"id":"qihang_zlkp_0006","module":"qihang","bank":"启航-战略规划","type":"judge","stem":"在中国核电「十五五」规划语境中，「静态能」指企业持续进化的能力，「动态能」指企业现有的基础能力。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"2026年入职培训知识点卡片","explanation":"依据2026年入职培训笔记卡片：两者含义恰好相反——静态能指企业现有基础能力，动态能指企业持续进化能力。配套还包括内外协同、产业链协同、基础协同、思想协同等协同机制。易错点：这是一组典型的成对概念，出题常故意说反。"},{"id":"qihang_zlkp_0007","module":"qihang","bank":"启航-战略规划","type":"judge","stem":"中国核电「十五五」规划编制的「五种创新」中，第五项是「宣贯式创新」。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin
