ted","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：企业愿景是企业对未来发展的美好憧憬和长期追求的理想，中国核电的企业愿景为“国际核科技发展的引领者”，背景是习近平总书记要求国有企业做强做优做大、培育具有全球竞争力的世界一流企业，核工业是高科技战略产业。不选A：A是中国核电的战略目标；不选C：C是企业使命；不选D：D是奋斗目标之一。【易混点】愿景（国际核科技发展的引领者）与战略目标（世界一流清洁能源服务商）最易混淆：愿景属核心理念层面的长期理想，战略目标是战略层面的具体指向。"},{"id":"qihang_qywh_0003","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的核心价值观是（　）。","options":["创新、协调、绿色、开放、共享","事业高于一切、责任重于一切、严细融入一切、进取成就一切","责任、安全、创新、卓越","责任、安全、创新、协同"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：核心价值观是企业和员工共同坚守的基本价值取向和价值判断标准，中国核电秉承“责任、安全、创新、协同”——责任是成就事业的基石，安全强调核安全高于一切。不选A：A是“创新、协调、绿色、开放、共享”的新发展理念；不选B：B是“四个一切”核工业精神的前两条，属企业精神；不选D：D是社会主义核心价值观国家层面的内容。【易混点】三层概念分清：核心价值观（责任、安全、创新、协同）、“四个一切”核工业精神（事业、责任、严细、进取）、新时代核工业精神（强核报国、创新奉献）。"},{"id":"qihang_qywh_0006","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的公司品牌传播语是（　）。","options":["魅力核电、美丽中国","中国核电、国家名片","追求卓越、超越自我","可靠、可亲、低碳、赋能"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：公司品牌传播语为“中国核电、国家名片”。依据是：中国自主核电事业1985年从秦山起步，秦山被誉为“国之光荣”；拥有完整知识产权的三代核电品牌华龙一号被誉为“国家名片”，成为党和国家领导人对外推介的自主核电品牌。不选A：A是公司形象传播语；不选C：C是奋斗目标之一；不选D：D是中国核电的品牌理念。【易混点】形象传播语（魅力核电、美丽中国）与品牌传播语（中国核电、国家名片）是并列概念，常互换设错；品牌理念另有“可靠、可亲、低碳、赋能”。"},{"id":"qihang_qywh_0007","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的经营理念是（　）。","options":["人才优先","质量创造价值、质量成就品牌","以客户为中心","尊重自然、绿色发展"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：经营理念是企业追求绩效的根据，中国核电的经营理念是“以客户为中心”——为客户服务是企业存在的根本理由，要把该理念贯穿于市场、研发、销售、制造、服务等全业务流程，讲求信用、有效履约。不选A：A是人才理念；不选B：B是质量理念；不选D：D是环保理念。【易混点】基本理念共十项，本组四项易互串：经营（以客户为中心）、人才（人才优先）、质量（质量创造价值、质量成就品牌）、环保（尊重自然、绿色发展），建议成组记忆。"},{"id":"qihang_qywh_0008","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的质量理念是（　）。","options":["上下同欲、凝心聚力","合规尽责、坚守底线","质量创造价值、质量成就品牌","充分准备、一丝不苟"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：质量理念是企业提供产品和服务时秉持的根本观念、是市场竞争制胜的基石，中国核电的质量理念为“质量创造价值、质量成就品牌”，要求员工对工作认真负责、绝不弄虚作假，遵循核安全质量相关“四个凡事”准则。不选A：A是团队理念；不选B：B是合规理念；不选D：D是工作理念的前半句。【易混点】质量理念与合规理念都含“底线”色彩但内容不同：质量理念讲价值与品牌，合规理念是“合规尽责、坚守底线”；工作理念则是周总理十六字要求。"},{"id":"qihang_qywh_0009","module":"qihang","bank":"启航-企业文化","type":"single","stem":"\"充分准备，一丝不苟，万无一失，一次成功\"这十六字要求是周恩来总理在（　）中提出的。","options":["我国第一颗原子弹研制试验","秦山核电站开工建设","华龙一号全球首堆建设","核潜艇动力装置陆上模式堆启堆试验"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：“充分准备，一丝不苟，万无一失，一次成功”是周恩来总理在核潜艇动力装置陆上模式堆启堆试验中提出的要求。1970年夏核潜艇研制进入最后关头，周总理于7月15日、16日连续主持中央专委会，汇报结束后强调这十六个字，后成为核潜艇研制、建造及使用中的警语。不选A：A对应“两弹一星”时期；不选B：秦山核电站1985年才开工；不选C：华龙一号是当代三代核电品牌。【易混点】“周总理—核潜艇模式堆—十六字”三要素绑定；十六字现已固化为公司的工作理念。"},{"id":"qihang_qywh_0010","module":"qihang","bank":"启航-企业文化","type":"single","stem":"在卓越文化树模型中，象征\"树屹立不倒的根系\"、代表公司安身立命文化根基的是（　）。","options":["核工业文化","核安全文化","中国特色社会主义文化","子公司文化"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：在卓越文化树模型中，核安全文化为根本，是树屹立不倒的“根系”，象征公司安身立命的文化根基——核安全是核工业的生命线，核安全文化是中国核电企业文化的灵魂和内核。不选A：核工业文化为源泉，是树的“养分”；不选C：中国特色社会主义文化为基础，是树的“土壤”；不选D：子公司文化为特色，是树的“枝叶”。【易混点】树的要素对号入座：土壤—中国特色社会主义文化、养分—核工业文化、根系—核安全文化、主干—追求卓越、枝叶—子公司文化、硕果—国际一流。"},{"id":"qihang_qywh_0011","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的保密理念是（　）。","options":["合规尽责、坚守底线","\"核\"铸基石、\"密\"不可分","上下同欲、凝心聚力","追求高尚情操、严守纪律底线"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：保密理念为“‘核’铸基石、‘密’不可分”。“核”铸基石贯彻了习近平总书记关于核工业是国家安全重要基石的批示精神；“密”不可分含保密、紧密、严密、亲密四层含义，体现保密工作与国家安全、业务工作的紧密关系。不选A：A是合规理念；不选C：C是团队理念；不选D：D是廉洁理念。【易混点】保密理念与合规理念（合规尽责、坚守底线）、廉洁理念（追求高尚情操、严守纪律底线）均含“底线”意味，需按关键词区分：“核”“密”二字锁定保密理念。"},{"id":"qihang_qywh_0012","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的公司歌曲与集团公司司歌保持一致，最新版本是（　）。","options":["《祖国需要我》","《我和我的祖国》","《核能是个好东西》","《核电小苹果》"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：公司歌曲与集团公司的司歌始终保持一致，最新版本为《祖国需要我》，故选A。不选B：《我和我的祖国》是广为传唱的爱国歌曲，但并非公司司歌；不选C、D：《核能是个好东西》《核电小苹果》均属趣味干扰项，课件未将其列为公司歌曲。【易混点】公司文化符号类考点成串出现：形象传播语（魅力核电、美丽中国）、品牌传播语（中国核电、国家名片）、司歌（《祖国需要我》），各自归属勿混。"},{"id":"qihang_qywh_0013","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"安全是核工业的生命线，核安全文化是中国核电企业文化的灵魂和内核。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：安全理念明确“安全是核工业的生命线”，核安全是核事业发展的前提、基础和生命线；卓越文化树模型中核安全文化为根本，是公司安身立命的文化根基，即核安全文化是中国核电企业文化的灵魂和内核。两句均为课件原文，故本判断正确。若判反，错在忽视核安全在公司一切价值理念中的统摄地位——公司始终坚持“安全第一，质量第一”方针。【易混点】“生命线”对应安全理念，“灵魂和内核”对应核安全文化，两句常成对出现，均为正确表述。"},{"id":"qihang_qywh_0014","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"\"四个创造\"是指创造企业价值、创造股东利润、创造员工幸福、创造社会财富。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：奋斗目标的第五部分即“四个创造”——创造企业价值、创造股东利润、创造员工幸福、创造社会财富。作为国有控股上市公司，公司履行保值增值职责，把满足或超越各利益相关方的需求和关切作为评判经营成效的重要准则。题干与课件一致，故本判断正确。若判反，可能是将“四个创造”与“三化战略”的内容混淆。【易混点】“四个创造”回答“为谁创造什么”，“三化战略”（规模化、标准化、国际化）回答“怎样发展壮大”，两者同属奋斗目标五部分。"},{"id":"qihang_qywh_0017","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"\"充分准备，一丝不苟，万无一失，一次成功\"这一要求是毛泽东主席提出的。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：十六字要求的提出者是周恩来总理而非毛泽东主席。1970年夏核潜艇研制进入最后关头，周总理于7月15日、16日连续两天主持中央专委会，听取汇报后提出“充分准备，一丝不苟，万无一失，一次成功”，故本判断错误。若判对，错在张冠李戴——“两弹一星”事业与毛主席相关，而这十六字出自周总理。【易混点】牢记“周总理—核潜艇动力装置陆上模式堆启堆试验—十六字要求”绑定，提出人与事件均常设错。"},{"id":"qihang_qywh_0018","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"中国核电以2008年公司正式成立为标志，进入了追求卓越、超越自我的文化引领期。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：1985年秦山开工到2008年公司成立是文化积淀期；2008年至2015年6月是以“追求卓越，挑战自我”为价值理念的文化成长期；以2015年6月公司上市为标志，才进入“追求卓越、超越自我”的文化引领期。故以2008年成立为标志进入文化引领期错误。若判对，错在混淆成长期与引领期的分界点。【易混点】三阶段：1985—2008积淀期、2008—2015.6成长期（挑战自我）、2015.6上市起引领期（超越自我）。"},{"id":"qihang_qywh_0019","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"企业文化只具有凝聚和激励两方面的作用。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：企业文化具有辐射、凝聚、激励、约束四方面作用——像“磁场”一样使原本无序的员工思想行为变得有序，向企业统一目标努力；对内增强凝聚力、对外打造影响力。“只具有凝聚和激励两方面”漏掉了辐射与约束，以偏概全，故本判断错误。若判对，错在把多方面作用窄化为两项。【易混点】四作用可记为“辐、凝、激、约”；课件还讲“三流企业做产品、二流做技术、一流做标准、超一流做文化”，可见文化作用远不止两方面。"},{"id":"qihang_qywh_0021","module":"qihang","bank":"启航-企业文化","type":"multi","stem":"下列属于中国核电基本理念的有（　）。","options":["以客户为中心","人才优先","尊重自然、绿色发展","强核强国、造福人类"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：基本理念共十项，其中经营理念为“以客户为中心”、人才理念为“人才优先”、环保理念为“尊重自然、绿色发展”，故ABC均属基本理念。不选D：“强核强国、造福人类”是核心理念中的企业使命，与基本理念分属不同层次——核心理念包括企业使命、企业愿景、核心价值观、企业精神，基本理念则是各业务领域的具体指导观念。【易混点】“强核强国、造福人类”虽是高频表述，但它属核心理念而非基本理念；基本理念十项还包括安全、质量、廉洁、合规、保密、团队、工作理念。"},{"id":"qihang_qywh_0022","module":"qihang","bank":"启航-企业文化","type":"multi","stem":"下列属于中国核电奋斗目标组成部分的有（　）。","options":["奉献安全高效能源、创造清洁低碳生活","争做最具魅力的国际一流核能企业","追求卓越、超越自我","国际核科技发展的引领者"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：奋斗目标由五部分组成——奉献安全高效能源、创造清洁低碳生活；争做最具魅力的国际一流核能企业；追求卓越、超越自我；“三化战略”；“四个创造”。A、B、C均在其列。不选D：“国际核科技发展的引领者”是核心理念中的企业愿景，不属于奋斗目标。【易混点】“争做最具魅力的国际一流核能企业”（奋斗目标）与“国际核科技发展的引领者”（企业愿景）、“世界一流清洁能源服务商”（战略目标）三个“一流/引领”表述最易互串，需按归属记忆。"},{"id":"qihang_rlzy_0001","module":"qihang","bank":"启航-人力资源","type":"single","stem":"新时代核工业精神是（　）。","options":["强核报国、创新奉献","事业高于一切、责任重于一切","自强务实、协同并进","忠诚使命、辛勤耕耘"],"answer":["A"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《中国核电企业文化》：中国核电的企业精神包括“两弹一星”精神、“四个一切”核工业精神和“强核报国、创新奉献”的新时代核工业精神，故选A。不选B：B是“四个一切”核工业精神的前两条内容，不是新时代核工业精神；不选C、D：均非课件中任何企业精神的表述，属自编干扰项。【易混点】企业精神三层分记：两弹一星精神、“四个一切”核工业精神（事业高于一切、责任重于一切、严细融入一切、进取成就一切）、新时代核工业精神（强核报国、创新奉献）。"},{"id":"qihang_rlzy_0003","module":"qihang","bank":"启航-人力资源","type":"single","stem":"本科毕业生从入职到取得RO（核反应堆操纵员）执照约需要（　）年。","options":["3年","5年","8年","10年"],"answer":["B"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：操纵人员是核电机组长期安全稳定运行的前提，持照人员培养周期长，本科毕业生从入职到取得RO（核反应堆操纵员）执照约需5年，取得SRO执照约需8年，成长为值长约需10年。不选A：3年不足以完成持照培养；不选C：8年是取得SRO执照的时间；不选D：10年是成长为值长的时间。【易混点】年限阶梯“5—8—10”对应RO—SRO—值长；另有“现操成长为RO约4-5年、RO到SRO约2-3年、SRO到值长约2-3年”一组也常考。"},{"id":"qihang_rlzy_0004","module":"qihang","bank":"启航-人力资源","type":"single","stem":"系统化培训方法（SAT）是由（　）推荐的培训管理方法。","options":["国际原子能机构（IAEA）","世界核电运营者协会（WANO）","世界卫生组织（WHO）","国际标准化组织（ISO）"],"answer":["A"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：为确保核电厂有足够数量、能力合格且具备良好安全文化素养的工作人员，采用国际原子能机构（IAEA）推荐的系统化培训方法（SAT）对培训活动进行管理和控制。不选B：WANO是世界核电运营者协会，侧重同行评估与经验反馈，不是SAT的推荐方；不选C、D：WHO、ISO与核电培训方法无关。【易混点】IAEA（政府间国际组织，推荐SAT）与WANO（核电运营者行业协会）是核电领域最易混淆的两个国际组织。"},{"id":"qihang_rlzy_0010","module":"qihang","bank":"启航-人力资源","type":"single","stem":"下列岗位中，采用选任制方式选拔的是（　）。","options":["工会主席、团委书记/副书记","部门主任","副值长","科长/副科长"],"answer":["A"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：干部选拔方式包括组织选拔（组织推荐、民主推荐，一般适用于跨部门交流提拔）、竞争性选拔（竞聘，一般适用于本部门内部提拔）和选任制，其中工会主席、团委书记/副书记采用选任制。不选B、C、D：部门主任、副值长、科长/副科长等管理岗位通过组织选拔或竞争性选拔产生，不走选任制。【易混点】选任制专门用于群团组织负责人（工会主席、团委书记/副书记）；另注意提任副值长还须满足核安全法规及有关规定的要求。"},{"id":"qihang_rlzy_0012","module":"qihang","bank":"启航-人力资源","type":"multi","stem":"中国核电标准职位体系包括（　）。","options":["经营管理序列","业务职能序列","后勤服务序列","技能作业序列"],"answer":["A","B","D"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：中国核电标准职位体系包括经营管理、业务职能、专业技术、运行操作、技能作业五个序列——分别对应组织领导指挥决策、业务领域运作职能、技术开发支持管理、电厂运行操作、系统设备巡检维护检修等职位，故A、B、D入选。不选C：课件中并无“后勤服务序列”，属自编干扰项。【易混点】五序列中“运行操作”与“技能作业”最易混：前者从事运行操作或直接指挥运行岗位，后者从事巡检、监测、保养、维护、维修、检修等直接作业。"},{"id":"qihang_rlzy_0013","module":"qihang","bank":"启航-人力资源","type":"judge","stem":"员工当年年度考核结果为“不称职”或连续两年年度考核结果为“基本称职”的，职级工资下调一级。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：绩效考核结果与薪酬分配紧密挂钩，薪酬分配政策明确“当年年度考核结果为‘不称职’或连续两年年度考核结果为‘基本称职’的，职级工资下调一级”，题干与课件表述一致，故本判断正确。若判反，注意区分两个条件的宽严：单年不称职即下调，而基本称职须连续两年才下调。【易混点】绩效等级为A优秀、B良好、C称职、D基本称职、E不称职，其中基本称职、不称职计0分，并与职级晋升、职称评审、薪酬分配等多方面挂钩。"},{"id":"qihang_rlzy_0014","module":"qihang","bank":"启航-人力资源","type":"judge","stem":"考核结果为不称职者，实行解聘专业技术职务。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：职称评审政策明确——考核结果为优秀、良好或称职者可以参评专业技术资格；考核结果为基本称职者，当年不得参评专业技术资格；考核结果为不称职者，实行解聘专业技术职务。题干与课件一致，故本判断正确。若判反，可能混淆了“不得参评”与“解聘”两档处理。【易混点】三档后果递进：称职以上可参评→基本称职当年不得参评→不称职解聘专业技术职务，处理力度逐级加重。"},{"id":"qihang_rlzy_0015","module":"qihang","bank":"启航-人力资源","type":"judge","stem":"前1年度绩效结果为“基本称职”的员工，仍可正常申报职位晋升。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：职级晋升政策明确“前1年度绩效结果为‘基本称职’或‘不称职’的，不能申报职位晋升”，故“仍可正常申报职位晋升”的说法错误。若判对，错在忽视绩效结果对晋升的刚性约束——绩效结果与职级晋升、干部选拔、职称评审、薪酬分配、岗位授权、劳动合同续签等紧密联系。【易混点】与薪酬政策对比记忆：晋升看“前1年度”的结果，职级工资下调看“当年不称职或连续两年基本称职”，时间口径不同。"},{"id":"qihang_rlzy_0016","module":"qihang","bank":"启航-人力资源","type":"judge","stem":"维修、设备方向本科毕业生自入职起，获得1级授权且独立负责SPV设备检修大约需要10年时间。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：维修设备检修工程师是核电厂关键岗位之一，各核电营运单位均基于IAEA推荐的SAT培训方法建立完善的人才培养体系；本科毕业生自入职起，获得1级授权且独立负责SPV设备检修大约需要10年时间，故本判断正确。若判反，可能将其与操纵员约5年取得RO执照的周期混淆。【易混点】两条成长时间线勿混：操纵线“RO约5年、SRO约8年、值长约10年”；维修线“获1级授权独立负责SPV设备检修约10年”。"},{"id":"qihang_sckf_0003","module":"qihang","bank":"启航-市场开发","type":"single","stem":"核能前期开发工作的首要原则是（　）。","options":["经济合理","核安全","进度优先","效益优先"],"answer":["B"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：核能前期开发工作的主要原则中，首要原则是核安全。核电项目投资大、风险高，核安全是核事业发展的前提、基础和生命线，一切前期工作都必须以核安全为先决条件。不选A：经济合理只是厂址比选的维度之一，服从于安全前提；不选C、D：“进度优先”“效益优先”与总体原则中“现场慎动”的审慎精神相悖。【易混点】主要原则共四层：首要原则（核安全）、总体工作原则（十六字方针）、与地方融合发展原则、稳健可预期适度超前，层次勿混。"},{"id":"qihang_sckf_0004","module":"qihang","bank":"启航-市场开发","type":"single","stem":"核能前期工作的总体工作原则是（　）。","options":["设计先行、设备跟进、积极核准、现场慎动","安全第一、预防为主、综合治理、持续改进","计划先行、投资匹配、动态调整、量入为出","国家主导、企业为辅、协同规划、循序渐进"],"answer":["A"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：核能前期工作的总体工作原则是“设计先行、设备跟进、积极核准、现场慎动”——设计先行稳定技术方案，长周期设备提前跟进采购策划，项目核准积极推进，而现场工程行动保持审慎，防止投资失控。不选B：B是安全生产领域的通用方针式表述，非前期工作原则；不选C：C是投资管理类干扰项；不选D：核电项目由企业作为开发主体推进，“国家主导、企业为辅”不成立。【易混点】总体工作原则（十六字，讲工作次序）与首要原则（核安全，讲价值排序）是两个考点，常搭配出题。"},{"id":"qihang_sckf_0005","module":"qihang","bank":"启航-市场开发","type":"single","stem":"厂址普选工作中，提出的候选厂址数量不宜少于（　）个。","options":["1","2","3","5"],"answer":["B"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：厂址普选是前期工作的基础，需从安全可靠性、环境相容性、技术可行性和经济合理性等方面对可能厂址进行综合分析、比选和排序，提出综合条件相对优越的可能厂址作为候选厂址，且候选厂址不宜少于2个，最终形成《厂址普选报告》。不选A、C：只提1个厂址便无从比选排序，失去“普选”意义；不选D：5个无课件依据。【易混点】“候选厂址不宜少于2个”与后续阶段衔接：普选提出不少于2个候选厂址，初可研再推荐优选厂址和备选厂址，层层收窄。"},{"id":"qihang_sckf_0007","module":"qihang","bank":"启航-市场开发","type":"single","stem":"核电项目前期许可证申领最初环节中的“两评报告”是指（　）。","options":["环境影响报告书（选址阶段）和厂址安全分析报告","初步安全分析报告和质量保证大纲（建造阶段）","厂址普选报告和初步可行性研究报告","环境影响报告书（建造阶段）和初步安全分析报告"],"answer":["A"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：环境影响报告书（选址阶段）与厂址安全分析报告合称“两评”报告，是核电项目前期许可证申领的最初环节；上报后国家核安全局批复的《核电厂场址选择审查意见书》是项目核准的支持性文件之一，也是可研报告收口的必要条件。不选B：初步安全分析报告、质保大纲属建造阶段文件；不选C：普选报告、初可研报告是项目建议书阶段成果；不选D：建造阶段环评与初安分并非“最初环节”。【易混点】“两评”锁定两个关键词：选址阶段＋“一环评一安全”，缺一即错。"},{"id":"qihang_sckf_0008","module":"qihang","bank":"启航-市场开发","type":"single","stem":"FCD是核电站前期工作的重要节点，它是指（　）。","options":["项目获得国务院核准","取得国家核安全局颁发的建造许可证","核岛基础混凝土浇注","首台机组并网发电"],"answer":["C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：FCD即核岛基础混凝土浇注，是核电站主体工程正式开工的标志点；核电厂建造阶段，国家核安全局颁发《核电厂建造许可证》后，营运单位才开始FCD。不选A：项目获得国务院核准是立项层面节点，先于FCD；不选B：取得建造许可证是进行FCD的前提条件，而非FCD本身；不选D：首台机组并网发电是建成投运节点。【易混点】前期工作链条：选址环评批复→四通一平→（经国家核安全局同意）核岛负挖→建造许可证→FCD开工；新厂址从普选到FCD约需5-6年。"},{"id":"qihang_sckf_0010","module":"qihang","bank":"启航-市场开发","type":"multi","stem":"市场开发“四方责任”包括（　）。","options":["集团产合部—主管责任","成员单位—主体责任","依托单位—保障责任","地方政府—属地责任"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：市场开发“四方责任”为——集团产合部负主管责任（建体系、定标准、强服务），成员单位负主体责任（强产业、谋发展），依托单位负保障责任（做协同、搭平台），市场开发部负属地责任（促协同、抓落实、强支撑），故A、B、C入选。不选D：属地责任由市场开发部承担而非地方政府，D把责任主体张冠李戴。【易混点】四方责任要一一对应：产合部—主管、成员单位—主体、依托单位—保障、市场开发部—属地；课件还以“作战部、参谋部、大使馆”作比喻。"},{"id":"qihang_sckf_0012","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"原则上，项目核准前不得开展长周期主设备实质性制造工作。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：主设备采购章节明确“原则上，项目核准前不得开展长周期主设备实质性制造工作”。设备材料费用占核电工程建设总费用的40%-70%，若核准前贸然启动实质性制造，一旦项目未获核准将造成巨额损失，故以项目核准作为实质性制造的闸门，本判断正确。若判反，错在忽视“实质性”三字——核准前仍可开展招标策划、潜在供方确定等工作。【易混点】两个时间点不同：采购策划和设备设计在项目获得“路条”后即可启动，实质性制造必须待项目核准后进行。"},{"id":"qihang_sckf_0013","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"已获得选址阶段环境影响报告书批复的厂址，可开展“四通一平”等工作，但未经国家核安全局同意不得进行核岛负挖。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：根据环函〔2015〕164号文规定，对于已获得选址阶段环境影响报告书批复的厂址，可开展“四通一平”等工作，但未经国家核安全局同意不得进行核岛负挖，题干与此一致，本判断正确。“四通一平”指主体工程动工前由项目业主完成通路、通水、通电、通信和场平工程（北方还需纳入通暖）。若判反，错在以为环评批复后现场工程可全部放开——负挖仍须国家核安全局同意。【易混点】两级门槛：四通一平——选址环评批复即可；核岛负挖——还须经国家核安全局同意。"},{"id":"qihang_sckf_0014","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"对于未开工的新核电厂址，在选址阶段环境影响报告书批复前即可开展“四通一平”等工作。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：根据环函〔2015〕164号文规定，对于未开工的新核电厂址，在选址阶段环境影响报告书批复前，不得开展“四通一平”等工作，故“批复前即可开展”的说法错误。若判对，颠倒了审批与现场施工的先后关系——选址阶段环评批复是开展四通一平等现场工作的前置条件。【易混点】对照记忆：未获批复的厂址→不得动；已获批复的厂址→可四通一平，但核岛负挖还须经国家核安全局同意，两级约束递进。"},{"id":"qihang_sckf_0015","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"新建厂址项目前期投资安排，华龙一号堆型原则上控制在15%以内。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：项目前期工作期间投资安排以不超过可研投资估算中项目计划总资金一定比例为宜，对于新建厂址，原则上华龙一号堆型控制在10%以内，AP1000堆型控制在15%以内，其他三代机型可参照执行，扩建项目比例原则上低于新厂址。故“华龙一号15%”错误，15%是AP1000的比例。若判对，错在将两种堆型的投资控制比例互串。【易混点】比例口诀“华龙10、AP1000 15”；配套还有核准前“动软不动硬”原则。"},{"id":"qihang_zlgh_0001","module":"qihang","bank":"启航-战略规划","type":"single","stem":"当前我国核电发展的基本方针是（　）。","options":["积极稳妥发展核电","高速大规模发展核电","积极安全有序发展核电","安全高效发展核电"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电战略发展与规划课件","explanation":"依据课件《中国核电战略发展与规划》：当前我国核电发展的基本方针是“安全高效发展核电”——在确保安全的基础上高效发展核电，安全是前提、高效是要求，两者缺一不可。不选A、D：“积极稳妥”“适度发展”均非课件所载的当前基本方针表述；不选B：“高速大规模”只讲速度规模、丢掉安全前提，与方针精神相悖。【易混点】“安全高效发展核电”（核电发展基本方针）与“安全第一、质量第一”（公司工作方针）表述相近：前者讲国家层面发展节奏，后者讲企业层面工作要求。"},{"id":"qihang_zlgh_0002","module":"qihang","bank":"启航-战略规划","type":"single","stem":"2020年9月22日，国家主席习近平在（　）上宣布，中国二氧化碳排放力争于2030年前达到峰值，努力争取2060年前实现碳中和。","options":["中央经济工作会议","第七十五届联合国大会","联合国气候雄心峰会","二十国集团领导人峰会"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电战略发展与规划课件","explanation":"依据课件《中国核电战略发展与规划》：2020年9月22日，国家主席习近平在第七十五届联合国大会宣布，中国二氧化碳排放力争于2030年前达到峰值，努力争取2060年前实现碳中和。不选A：中央经济工作会议是2020年12月首次将碳减排列为年度重点任务；不选C：气候雄心峰会宣布的是2030年风光装机12亿千瓦以上、非化石能源占比25%等目标；不选D：G20峰会并非宣布场合。【易混点】“双碳”目标（75届联大，2030达峰/2060中和）与“12亿千瓦、25%”（气候雄心峰会）分属两个场合、两批数字。"},{"id":"qihang_zlgh_0003","module":"qihang","bank":"启航-战略规划","type":"single","stem":"从碳达峰到碳中和，欧盟约70年、美国和日本40年左右，我国仅有约（　）年时间。","options":["60","40","50","30"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电战略发展与规划课件","explanation":"依据课件《中国核电战略发展与规划》：我国实现碳达峰碳中和面临碳排放总量大、经济发展任务艰巨、时间紧三重挑战，其中“时间紧”——从碳达峰到碳中和，欧盟约70年，美国、日本40年左右，我国仅有约30年时间（2030年前达峰、2060年前中和）。不选A、B、C：60、40、50均与课件数字不符，40年是美国、日本的周期。【易混点】三组数字绑定：欧盟约70年、美日40年左右、中国仅约30年；用“2060-2030=30”即可锁定答案。"},{"id":"qihang_zlgh_0005","module":"qihang","bank":"启航-战略规划","type":"single","stem":"中国核电的战略目标是（　）。","options":["国际核科技发展的引领者","争做最具魅力的国际一流核能企业","成为具有全球竞争力的世界一流清洁能源服务商","全面建成世界领先的核科技工业体系"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电战略发展与规划课件","explanation":"依据课件《中国核电战略发展与规划》：中国核电的战略目标是“成为具有全球竞争力的世界一流清洁能源服务商”，“十四五”期间将实现由核电生产企业向清洁能源生产与服务企业跨越。不选A：A是企业愿景（核心理念层面）；不选B：B是奋斗目标的组成部分；不选D：D是中核集团“三位一体”奋斗目标在本世纪中叶全面实现时的内容。【易混点】三个“一流/引领”句分归属：战略目标（世界一流清洁能源服务商）、企业愿景（国际核科技发展的引领者）、奋斗目标（争做最具魅力的国际一流核能企业）。"},{"id":"qihang_zlgh_0006","module":"qihang","bank":"启航-战略规划","type":"single","stem":"到2025年，中国核电电力装机容量目标为（　）万千瓦。","options":["4131.5","5600","2600","3000"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电战略发展与规划课件","explanation":"依据课件《中国核电战略发展与规划》：到2025年，中国核电电力装机容量目标为5600万千瓦，其中核电2600万千瓦、新能源3000万千瓦，两者相加恰为5600万千瓦。不选A：4131.5无课件依据；不选C：2600万千瓦只是其中核电装机的分量；不选D：3000万千瓦只是其中新能源装机的分量。【易混点】拆分数字勿误选：2600（核电）+3000（新能源）=5600（总目标）；2025年目标还有战略性新兴产业业务收入占比达10%以上等，数字多且易混。"},{"id":"qihang_zlgh_0008","module":"qihang","bank":"启航-战略规划","type":"single","stem":"中国核电在战略上定位为中核集团（　）。","options":["核电业务的开发主体和先进科技成果转化的主通道","核燃料产业的唯一运营商","集团金融投资的主要平台","核环保产业的核心企业"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电战略发展与规划课件","explanation":"依据课件《中国核电战略发展与规划》：中国核电定位为中核集团核电业务的开发主体和先进科技成果转化的主通道，以投资建设运营核电项目为核心业务，肩负推进“建成核工业强国”和“构建现代能源体系”双重责任。不选B、C、D：核燃料产业唯一运营商、集团金融投资主要平台、核环保产业核心企业等均非课件对中国核电的战略定位表述，属混淆项。【易混点】战略定位（在集团中扮演的角色）与战略目标（自身要成为什么）是两个概念：“开发主体、主通道”属前者，“世界一流清洁能源服务商”属后者。"},{"id":"qihang_zlgh_0009","module":"qihang","bank":"启航-战略规划","type":"single","stem":"到2035年，中国核电的发展目标是（　）。","options":["全面实现\"三位一体\"奋斗目标","电力装机容量达到5600万千瓦","全面建成世界领先的核科技工业体系","基本实现世界一流清洁能源服务商目标，进入世界500强行列"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电战略发展与规划课件","explanation":"依据课件《中国核电战略发展与规划》：到2035年，中国核电基本实现世界一流清洁能源服务商目标，进入世界500强行列，核电运行指标继续保持世界第一梯队。不选A：2035年是集团基本实现“三位一体”目标的节点，“全面实现”在本世纪中叶；不选B：装机5600万千瓦是2025年目标；不选C：全面建成世界领先的核科技工业体系是2036年至本世纪中叶的目标。【易混点】两个时间锚：2025——装机5600万千瓦；2035——基本实现一流目标、进世界500强；“基本实现”对应2035，“全面实现”对应本世纪中叶。"},{"id":"qihang_zlgh_0010","module":"qihang","bank":"启航-战略规划","type":"single","stem":"根据中核集团新时代发展战略，2021年到2035年集团处于（　）。","options":["强基固本阶段","跨越发展阶段","全面引领阶段","改革调整阶段"],"answer":["B"],"score":null," /* ================= 常量与工具 ================= */
const TYPE_NAME = {single:"单选", multi:"多选", judge:"判断", fill:"填空", qa:"问答"};
const SRC_NAME = {official:"真题", "ppt-notes":"课件题", generated:"生成题"};
const SRC_CLASS = {official:"s-official", "ppt-notes":"s-ppt-notes", generated:"s-generated"};
const DEFAULT_SCORE = {single:2, multi:3, judge:1};
const LETTERS = "ABCDEF";
const bankKey = m=>m;

const questions = DATA.questions;
const QMAP = {}; questions.forEach(q=>QMAP[q.id]=q);
const BANKS = {}; // key=module -> {module,bank(=模块名),list}
questions.forEach(q=>{
  const k = bankKey(q.module);
  (BANKS[k] = BANKS[k] || {module:q.module, bank:DATA.modules[q.module]||q.module, list:[]}).list.push(q);
});
for(const k in BANKS)BANKS[k].list.forEach((q,i)=>q._pos=i); // 题在题库内的全序位置，断点定位用

function $(s,p){return (p||document).querySelector(s);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function qScore(q){return q.score!=null ? q.score : (DEFAULT_SCORE[q.type]||1);}
function ansText(q){
  if(q.type==="judge") return q.answer[0];
  if(!q.options) return "";
  return q.answer.map(l=>l+"．"+q.options[LETTERS.indexOf(l)]).join("　");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600);}

/* ================= 持久化状态 ================= */
const SKEY = "tiku_v1";
let S;
function loadState(){
  try{S=JSON.parse(localStorage.getItem(SKEY)||"{}");}
  catch(e){S={};}
  S.done=S.done||{};   // qid -> {c:对次数, w:累计错次数, t:最后作答时间}
  S.wrong=S.wrong||{}; // qid -> 当前连错次数（答错累加，错题重练答对后清除）
  S.fav=S.fav||{};     // qid -> 1
  S.slay=S.slay||{};   // qid -> 1（斩杀：非常熟，不进随机/顺序/专项练习池，可在收藏页恢复）
  S.seq=S.seq||{};     // bankKey -> 断点：下次该练的题目 id（旧版存数字下标，读取时自动迁移）
  S.daily=S.daily||{}; // "YYYY-MM-DD" -> 题数
  // 迁移：旧版 S.wrong 存 1（布尔标记），统一转成数字次数
  for(const k in S.wrong){const v=S.wrong[k];
    if(typeof v!=="number"||!isFinite(v)||v<1)S.wrong[k]=1;}
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function bumpDaily(){const d=today();S.daily[d]=(S.daily[d]||0)+1;save();}

/* ================= 视图路由 ================= */
let stack = [];
function go(view, noPush){
  if(!noPush && curView) stack.push(curView);
  curView = view;
  render();
}
let curView = null;
function back(){
  if(stack.length){curView=stack.pop();render();}
  else go({name:"home"},true);
}

/* ================= 底部导航 ================= */
const TABS=[
  {name:"home",ic:"⌂",label:"首页"},
  {name:"fav",ic:"★",label:"收藏/错题"},
  {name:"stats",ic:"▤",label:"统计"},
  {name:"search",ic:"⌕",label:"搜题"},
];
function curTab(){return curView&&curView.name? (TABS.some(t=>t.name===curView.name)?curView.name:null):null;}
function renderNav(){
  const ct=curTab();
  $("#nav").innerHTML = TABS.map(t=>
    `<button class="tab ${ct===t.name?"on":""}" data-t="${t.name}"><span class="ic">${t.ic}</span>${t.label}</button>`).join("");
  $("#nav").style.display = ct?"flex":"none";
  document.body.classList.toggle("no-nav",!ct);
}

/* ================= 头部 ================= */
function renderHeader(title){
  const h=$("#hdr");
  const ct=curTab();
  if(ct&&!stack.length){h.style.display="none";return;}
  h.style.display="flex";
  $("#hdr-title").textContent=title||"";
  $("#btn-back").style.visibility = stack.length?"visible":"hidden";
}

/* ================= 首页 ================= */
function modProgress(module){
  let total=0,done=0;
  for(const k in BANKS){const b=BANKS[k];if(b.module!==module)continue;
    total+=b.list.length;
    b.list.forEach(q=>{if(S.done[q.id])done++;});}
  return {total,done,pct:total?Math.round(done/total*100):0};
}

    </button>`;
  }

     真题为官方题库；课件题出自 PPT 备注；生成题按课件内容 AI 出题（解析仅供参考）</div>`;

    <div class="binfo"><div class="bname">📖 全部 · 从头顺到尾</div>
    <div class="bcount">${b.list.length} 题 · 已练 ${allDone}（${allPct}%）</div>
    <div class="pbar" style="margin-top:6px;"><div style="width:${allPct}%"></div></div></div>
    <div class="bprog">›</div></div>`;
  order.forEach(name=>{
    const qs=b.list.filter(q=>q.bank===name);
    const done=qs.filter(q=>S.done[q.id]).length;
    const pct=qs.length?Math.round(done/qs.length*100):0;
    const hasOff=qs.some(q=>q.source==="official");
    const hasGen=qs.some(q=>q.source!=="official");
    const tag=hasOff&&hasGen?"真题+生成":hasOff?"真题":"生成题";
    const tagCls=hasOff?"s-official":"s-generated";
    rows+=`<div class="brow" data-course="${esc(name)}">
      <div class="binfo"><div class="bname">📚 ${esc(name)}</div>
      <div class="bcount">${qs.length} 题 · 已练 ${done}（${pct}%）　<span class="tag ${tagCls}" style="font-size:10px;">${tag}</span></div>
      <div class="pbar" style="margin-top:6px;"><div style="width:${pct}%"></div></div></div>
      <div class="bprog">›</div></div>`;
  });
  h+=`<div class="sec-title">顺序练习 · 按课程</div>
  <div class="card" style="padding:2px 14px;">${rows}</div>`;
  return h;
}

/* ================= 练习视图 ================= */
function buildPool(bankK, srcFilter, typeFilter, excludeSlay){
  const b=BANKS[bankK];let list=b.list;
  if(excludeSlay)list=list.filter(q=>!S.slay[q.id]); // 斩杀题不进练习池（模拟考试除外）
  if(srcFilter && srcFilter!=="all"){
    const allow=srcFilter.split("+");
    list=list.filter(q=>allow.includes(q.source));
  }
  if(typeFilter&&typeFilter.length)list=list.filter(q=>typeFilter.includes(q.type));
  return list;
}
function newSession(v){
  let list;
  if(v.mode==="wrong")list=Object.keys(S.wrong).filter(id=>QMAP[id]);
  else if(v.mode==="fav")list=Object.keys(S.fav).filter(id=>QMAP[id]);
  else{
    list=buildPool(v.bank,v.src,v.types,true);
    if(v.course)list=list.filter(q=>q.bank===v.course);
    if(v.mode==="rand")list=shuffle(list);
  }
  return {list:list.map(q=>q.id), idx:0, mode:v.mode, bank:v.bank, course:v.course||null,
    src:v.src||"all", types:v.types||null, picked:{}, judged:{},
    seqPos: v.mode==="seq" ? seqResumeIdx(list,bankKeyOf(v)) : 0};
}
function bankKeyOf(v){return v.course? v.bank+"::"+v.course : (v.bank||v.mode);}
/* 断点定位：S.seq[bankKey] 存"下次该练的题目 id"而非数字下标——斩杀/恢复会改变
   练习池成员，数字下标会错位（跳题或清零），按 id 定位则总能落回原位。
   返回该题在当前题单 list（保持题库全序的子序列）中的下标；
   若目标题本身已被斩杀/筛掉，则落在它原位置之后的第一题；旧版数字下标首次读取时迁移。 */
function seqResumeIdx(list,key){
  let v=S.seq[key];
  if(!v)return 0;
  const idOf=x=>typeof x==="string"?x:x.id;   // 兼容题目对象数组与 id 数组
  if(typeof v==="number"){            // 旧版数据：数字下标 → 按当前题单转成 id
    v = v>0&&v<list.length ? idOf(list[v]) : "";
    S.seq[key]=v;save();
    if(!v)return 0;
  }
  const t=QMAP[v];
  if(!t||t._pos==null)return 0;
  let n=0;
  for(const it of list){const q=typeof it==="string"?QMAP[it]:it;if(q&&q._pos<t._pos)n++;else break;}
  return n;
}
/* 课节：会话题单中连续同课程（bank）题目的分组，用于顺序模式的课程导航 */
function courseRanges(s){
  if(s._ranges)return s._ranges;
  const rs=[];
  s.list.forEach((id,i)=>{
    const b=QMAP[id].bank;
    const last=rs[rs.length-1];
    if(last&&last.bank===b)last.end=i+1;
    else rs.push({bank:b,start:i,end:i+1});
  });
  return s._ranges=rs;
}
function isFullSeq(s){return s.mode==="seq"&&!s.course&&s.src==="all"&&!s.types;}
function startSession(v){
  const s=newSession(v);
  if(!s.list.length){toast("该筛选条件下没有题目");return;}
  if(s.mode==="seq"&&s.seqPos>=s.list.length)s.seqPos=0;
  s.idx=s.seqPos||0;
  go({name:"practice",s});
}

function practiceHeader(s){
  const idx=s.idx+1,total=s.list.length;
  const answered=Object.keys(s.judged).length;
  const pct=total?Math.round(answered/total*100):0;
  const modeName=s.mode==="recite"?"背题模式":s.mode==="wrong"?"错题重练":s.mode==="fav"?"收藏练习":s.mode==="rand"?"随机练习":"顺序练习";
  let courseLine="";
  if(s.mode==="seq"&&s.idx<s.list.length){
    const q=QMAP[s.list[s.idx]];
    const rs=courseRanges(s);
    const ri=rs.findIndex(r=>s.idx>=r.start&&s.idx<r.end);
    if(ri>=0){
      const r=rs[ri];
      courseLine=`<div class="course-line"><span class="tag t-course">📚 ${esc(q.bank)}</span>
        <span class="mut">第 ${ri+1}/${rs.length} 门 · 本节 ${s.idx-r.start+1}/${r.end-r.start}${s.course?"":" · 总进度 "+idx+"/"+total}</span></div>`;
    }
  }
  return `<div class="pbar-wrap"><div class="ptxt"><span>${modeName} · ${answered>idx?answered:idx}/${total}</span><span>${pct}%</span></div>
  <div class="pbar"><div style="width:${pct}%"></div></div></div>${courseLine}`;
}

function renderQ(s,q){
  const judged = q.id in s.judged ? s.judged[q.id] : undefined;
  const picked = s.picked[q.id]||[];
  let h=`<div class="qhead">
    <span class="tag ${SRC_CLASS[q.source]}">${SRC_NAME[q.source]}</span>
    <span class="tag t-${q.type}">${TYPE_NAME[q.type]}</span>
    <span class="qno">📚 ${esc(q.bank)}</span></div>`;
  h+=`<div class="stem">${esc(q.stem)}</div>`;
  if(q.type==="judge"){
    const right=q.answer[0];
    const p1=picked.includes("正确"),p2=picked.includes("错误");
    let c1="",c2="";
    if(judged!==undefined){
      c1 = right==="正确"?"right":(p1?"wrongpick":"");
      c2 = right==="错误"?"right":(p2?"wrongpick":"");
    }
    h+=`<div class="judge-row">
      <button class="judge-btn ${c1}" data-j="正确">✓ 正确</button>
      <button class="judge-btn ${c2}" data-j="错误">✗ 错误</button></div>`;
  }else{
    h+=`<div class="opts">`+q.options.map((o,i)=>{
      const L=LETTERS[i];let cls="";
      if(judged!==undefined){
        if(q.answer.includes(L))cls="right";
        else if(picked.includes(L))cls="wrongpick";
        else cls="dim";
      }else if(picked.includes(L))cls="picked";
      return `<button class="opt ${cls}" data-o="${L}"><span class="ol">${L}</span><span>${esc(o)}</span></button>`;
    }).join("")+`</div>`;
    if(q.type==="multi"&&!judged)
      h+=`<div class="confirm-bar"><button class="big-btn ghost" id="confirm-multi" ${picked.length?"":"disabled"}>确认（已选 ${picked.length} 项）</button></div>`;
  }
  if(judged!==undefined||s.mode==="recite"){
    const ok = s.mode==="recite"?null:judged;
    if(ok!==null)
      h+=`<div class="feedback ${ok?"ok":"bad"}">${ok?"<b>回答正确</b>":"<b>回答错误</b>"}　正确答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    else
      h+=`<div class="feedback ok">答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    if(q.type!=="judge"&&q.options)h+=`<div class="mut" style="margin-top:6px;font-size:13.5px;">${esc(ansText(q))}</div>`;
    if(q.explanation){
      const elabel = q.source==="ppt-notes"
        ?'<span class="tag s-ppt-notes" style="font-size:10px;">官方讲解</span>'
        :q.source==="official"
          ?'<span class="tag s-official" style="font-size:10px;">解析 · 依据培训课件</span>'
          :'<span class="tag s-generated" style="font-size:10px;">AI 解析 · 仅供参考</span>';
      h+=`<div class="expl"><div class="elabel">📖 ${elabel}</div>${esc(q.explanation)}</div>`;
    }
    if(q.source!=="official")h+=`<div class="mut" style="margin-top:6px;font-size:12px;">依据课件：${esc(q.origin||"")}</div>`;
    // 斩杀（功能4）：答对且很熟 → 斩杀，不再进随机/顺序/专项练习池
    if(judged===true&&s.mode!=="recite"){
      const slayed=!!S.slay[q.id];
      h+=`<div style="margin-top:12px;">${
        slayed
          ?`<button class="big-btn ghost" id="btn-unslay">↩ 已斩杀 · 点击恢复（重新进入练习池）</button>`
          :`<button class="big-btn" id="btn-slay" style="background:var(--warn);">⚔️ 斩杀（很熟了，不再随机出现）</button>`
      }</div>`;
    }
  }
  return h;
}

function vPractice(v){
  const s=v.s;
  if(s.idx>=s.list.length){ // 完成
    const correct=Object.values(s.judged).filter(Boolean).length;
    const total=Object.keys(s.judged).length;
    const doneTitle=isFullSeq(s)?"全部顺序练习完成！":s.course?`《${esc(s.course)}》练完了！`:"本组完成！";
    let h=`<div class="card" style="text-align:center;padding:30px 16px;">
      <div style="font-size:44px;">🎉</div><h2 style="margin:10px 0 4px;">${doneTitle}</h2>
      <div class="mut">共 ${total} 题 · 正确 ${correct} 题${total?` · 正确率 ${Math.round(correct/total*100)}%`:""}</div>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button class="big-btn ghost" id="btn-again">再来一轮</button>
        <button class="big-btn" id="btn-back-home">返回</button></div></div>`;
    return h;
  }
  if(s.gate&&isFullSeq(s))return vGate(v);
  const q=QMAP[s.list[s.idx]];
  let h=practiceHeader(s);
  h+=`<div class="card" id="qcard">${renderQ(s,q)}</div>`;
  return h;
}

/* 课程过渡关卡：顺序模式下做完一门课的最后一题、进入下一门课前显示 */
function vGate(v){
  const s=v.s;
  const rs=courseRanges(s);
  const nextR=rs.find(r=>r.start===s.idx);
  const prevR=rs.find(r=>r.end===s.idx);
  let done=0,ok=0;
  if(prevR)for(let i=prevR.start;i<prevR.end;i++){
    const id=s.list[i];
    if(id in s.judged){done++;if(s.judged[id])ok++;}
  }
  let h=`<div class="card gate-card">
    <div class="gate-ic">📚</div>`;
  if(prevR){
    h+=`<div class="gate-done">《${esc(prevR.bank)}》已完成</div>
    <div class="mut">共 ${prevR.end-prevR.start} 题 · 本次作答 ${done} 题${done?` · 对 ${ok} 题（${Math.round(ok/done*100)}%）`:""}</div>`;
  }
  if(nextR){
    h+=`<div class="gate-next">下一门：《${esc(nextR.bank)}》</div>
    <div class="mut">${nextR.end-nextR.start} 题</div>
    <button class="big-btn" id="gate-go" style="margin-top:14px;">开始《${esc(nextR.bank)}》</button>`;
  }
  h+=`<div style="display:flex;gap:10px;margin-top:10px;">
      <button class="big-btn ghost" id="gate-sheet">跳转到课程</button>
      <button class="big-btn ghost" id="gate-back">返回课程列表</button></div></div>`;
  return h;
}

/* 下一题（手动按钮与答对自动切换共用） */
function practiceNext(s){
  if(s.idx<s.list.length-1){
    s.idx++;
    if(s.mode==="seq"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}
    if(isFullSeq(s)&&courseRanges(s).some(r=>r.start===s.idx)){
      s.gateSeen=s.gateSeen||{};
      if(!s.gateSeen[s.idx]){s.gate=true;s.gateSeen[s.idx]=1;}
    }
    render();
  }
  else{s.idx++;if(s.mode==="seq"){S.seq[bankKeyOf(s)]="";save();}render();}
}
function bindPractice(v){
  const s=v.s;
  if(s.gate&&isFullSeq(s)){
    $("#gate-go").onclick=()=>{s.gate=false;render();};
    $("#gate-sheet").onclick=()=>openSheet(s,null);
    $("#gate-back").onclick=()=>{stack=[];go({name:"modes",bank:s.bank},true);};
    return;
  }
  const q = s.idx<s.list.length ? QMAP[s.list[s.idx]] : null;
  if(!q){
    const again=$("#btn-again");
    if(again){
      again.onclick=()=>{const nv={...v,s:newSession({mode:s.mode,bank:s.bank,src:s.src,types:s.types,course:s.course})};if(s.mode==="seq")S.seq[bankKeyOf(s)]="",save();nv.s.idx=0;go(nv,true);};
      $("#btn-back-home").onclick=()=>{stack=[];go({name:"home"},true);};
    }
    return;
  }
  const qcard=$("#qcard");
  if(qcard)qcard.onclick=(e)=>{
    const jb=e.target.closest("[data-j]");
    const ob=e.target.closest("[data-o]");
    const cb=e.target.closest("#confirm-multi");
    const slayBtn=e.target.closest("#btn-slay");
    const unslayBtn=e.target.closest("#btn-unslay");
    if(slayBtn){clearTimeout(s._autoT);S.slay[q.id]=1;save();toast("已斩杀，不再随机出现");render();return;}
    if(unslayBtn){clearTimeout(s._autoT);delete S.slay[q.id];save();toast("已恢复，重新进入练习池");render();return;}
    if(s.mode==="recite")return;
    if(q.id in s.judged)return;
    if(q.type==="judge"&&jb){
      judge(q,[jb.dataset.j]);
    }else if(q.type==="single"&&ob){
      judge(q,[ob.dataset.o]);
      }else if(q.type==="multi"){
      if(ob){
        const p=(s.picked[q.id]=s.picked[q.id]||[]);
        const i=p.indexOf(ob.dataset.o);
        if(i>=0)p.splice(i,1);else p.push(ob.dataset.o);
        s.picked[q.id]=p.slice().sort();
        render();
      }else if(cb){
        if((s.picked[q.id]||[]).length)judge(q,s.picked[q.id].slice().sort());
      }
    }
  };
  function judge(q,picked){
    s.picked[q.id]=picked;
    const ok = q.type==="judge"
      ? picked[0]===q.answer[0]
      : picked.length===q.answer.length && picked.every((l,i)=>l===q.answer[i]);
    s.judged[q.id]=ok;
    const d=S.done[q.id]=S.done[q.id]||{c:0,w:0};
    if(ok)d.c++;else{d.w++;S.wrong[q.id]=(S.wrong[q.id]||0)+1;}
    d.t=Date.now();
    let wn=0;  // 攻克前累计错的次数
    if(ok&&s.mode==="wrong"&&S.wrong[q.id]){wn=S.wrong[q.id];delete S.wrong[q.id];}
    bumpDaily();save();render();
    if(wn>1)toast(`已攻克（之前错了 ${wn} 次）`);
    // 答对自动切下一题（0.8 秒缓冲，手动操作可打断）
    if(ok){
      clearTimeout(s._autoT);
      s._autoT=setTimeout(()=>{
        if(curView&&curView.name==="practice"&&curView.s===s)practiceNext(s);
      },800);
    }
  }
}
function bindPracticeFoot(v){
  const s=v.s;
  if(s.idx>=s.list.length)return;
  const q=QMAP[s.list[s.idx]];
  $("#f-prev").disabled=s.idx===0;
  $("#f-prev").onclick=()=>{clearTimeout(s._autoT);if(s.idx>0){s.idx--;render();}};
  // 功能3：多选题在点「确认」之前，下一题/完成按钮置灰禁用
  const multiUnjudged = s.mode!=="recite" && q.type==="multi" && !(q.id in s.judged);
  $("#f-next").disabled = multiUnjudged;
  $("#f-next").title = multiUnjudged ? "多选题请先点「确认」再进入下一题" : "";
  $("#f-next").onclick=()=>{clearTimeout(s._autoT);practiceNext(s);};
  const star=$("#f-star");
  star.classList.toggle("on",!!S.fav[q.id]);
  star.onclick=()=>{
    clearTimeout(s._autoT);
    if(S.fav[q.id]){delete S.fav[q.id];toast("已取消收藏");}
    else{S.fav[q.id]=1;toast("已收藏");}
    save();render();
  };
  $("#f-sheet").onclick=()=>{clearTimeout(s._autoT);openSheet(s,null);};
  // 自动滚动到顶部
  window.scrollTo(0,0);
}

/* ================= 模拟考试 ================= */
function vExamSetup(v){
  const all=buildPool(v.bank,"all",null).filter(q=>["single","multi","judge"].includes(q.type));
  const bankNames=[];all.forEach(q=>{if(!bankNames.includes(q.bank))bankNames.push(q.bank);});
  const ebank=v.ebank||null;
  const poolAll=ebank?all.filter(q=>q.bank===ebank):all;
  const official=poolAll.filter(q=>q.source==="official").length;
  if(v.src===undefined)v.src=official?"official":"all";
  if(v.src==="official"&&!official)v.src="all";
  const caps=[];[25,50,100].forEach(n=>{const c=Math.min(n,poolAll.length);if(c>0&&!caps.includes(c))caps.push(c);});
  if(v.cnt&&!caps.includes(v.cnt))v.cnt=null;
  let h=`<h2 class="pg">模拟考试 · ${esc(BANKS[v.bank].bank)}</h2><div class="card exam-setup">`;
  if(bankNames.length>1){
    h+=`<label>选择题库（正式考试按题库分开考）</label>
    <div class="filter-row" id="exam-bank">
      <button class="chip ${!ebank?"on":""}" data-ebank="">全部混合（${all.length}）</button>
      ${bankNames.map(n=>`<button class="chip ${ebank===n?"on":""}" data-ebank="${esc(n)}">${esc(n)}（${all.filter(q=>q.bank===n).length}）</button>`).join("")}
    </div>`;
  }
  h+=`<label>题目来源</label>
    <div class="filter-row" id="exam-src">
      ${official?`<button class="chip ${v.src==="official"?"on":""}" data-src="official">仅真题（${official}）</button>`:""}
      <button class="chip ${v.src==="all"?"on":""}" data-src="all">全部题源（${poolAll.length}）</button>
    </div>
    <label>试卷题数</label>
    <div class="cnt-row" id="exam-cnt">
      ${caps.map(n=>`<button class="chip ${v.cnt===n?"on":""}" data-cnt="${n}">${n} 题</button>`).join("")}
    </div>
    <label>考试时长</label>
    <div class="filter-row" id="exam-time">
      ${[[1,"每题1分钟"],[0.5,"每题30秒"],[1.5,"每题1.5分钟"]].map(m=>
        `<button class="chip ${(v.min||1)===m[0]?"on":""}" data-min="${m[0]}">${m[1]}</button>`).join("")}
    </div>
    <div class="divider"></div>
    <button class="big-btn" id="exam-start">开始考试</button>
    <div class="mut" style="margin-top:10px;font-size:12.5px;">按题型比例随机抽题组卷；交卷后按题库原分值计分，80分及格；答错的题自动进错题本。</div>
  </div>`;
  return h;
}
function bindExamSetup(v){
  const eb=$("#exam-bank");
  if(eb)eb.onclick=e=>{const c=e.target.closest("[data-ebank]");if(!c)return;
    v.ebank=c.dataset.ebank||null;v.cnt=null;render();};
  $("#exam-src").onclick=e=>{const c=e.target.closest("[data-src]");if(!c)return;
    v.src=c.dataset.src;render();};
  $("#exam-cnt").onclick=e=>{const c=e.target.closest("[data-cnt]");if(!c)return;
    v.cnt=+c.dataset.cnt;[...$("#exam-cnt").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-time").onclick=e=>{const c=e.target.closest("[data-min]");if(!c)return;
    v.min=+c.dataset.min;[...$("#exam-time").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-start").onclick=()=>{
    if(!v.cnt){toast("请选择题数");return;}
    const base=buildPool(v.bank,v.src,null).filter(q=>["single","multi","judge"].includes(q.type));
    const pool=v.ebank?base.filter(q=>q.bank===v.ebank):base;
    if(!pool.length){toast("该题库没有题目");return;}
    const need=Math.min(v.cnt,pool.length);
    // 按题型比例抽题
    const byType={};pool.forEach(q=>(byType[q.type]=byType[q.type]||[]).push(q));
    const picked=[];const total=pool.length;
    ["single","multi","judge"].forEach(t=>{
      if(!byType[t])return;
      const n=Math.min(byType[t].length,Math.round(need*byType[t].length/total));
      picked.push(...shuffle(byType[t]).slice(0,n));
    });
    if(picked.length<need){ // 比例取整可能差一两题，从剩余题里补齐
      const have=new Set(picked.map(q=>q.id));
      picked.push(...shuffle(pool.filter(q=>!have.has(q.id))).slice(0,need-picked.length));
    }
    const mins=v.min||1;
    let exam={list:shuffle(picked).map(q=>q.id),idx:0,picked:{},submitted:false,
      bank:v.bank,ebank:v.ebank||null,
      timeLimit:Math.round(need*mins*60),remain:Math.round(need*mins*60),startAt:Date.now()};
    go({name:"exam",s:exam});
  };
}

let examTimer=null;
function startExamTimer(v){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    const s=v.s;
    if(!s||s.submitted||curView!==v){clearInterval(examTimer);return;}
    s.remain--;
    const t=$("#exam-timer");
    if(t){t.textContent=fmtTime(s.remain);t.classList.toggle("danger",s.remain<60);}
    if(s.remain<=0){clearInterval(examTimer);toast("时间到，自动交卷");submitExam(v);}
  },1000);
}
function submitExam(v){
  const s=v.s;if(s.submitted)return;
  const unanswered=s.list.length-Object.keys(s.picked).length;
  const doSubmit=()=>{
    s.submitted=true;
    let score=0,full=0,correct=0,wrongList=[];
    s.list.forEach(id=>{
      const q=QMAP[id];full+=qScore(q);
      const picked=s.picked[id]||[];
      const ok=q.type==="judge"?picked[0]===q.answer[0]
        :picked.length===q.answer.length&&picked.slice().sort().every((l,i)=>l===q.answer[i]);
      if(ok){score+=qScore(q);correct++;}
      else{wrongList.push(id);
        const d=S.done[id]=S.done[id]||{c:0,w:0};d.w++;S.wrong[id]=(S.wrong[id]||0)+1;}
      const dd=S.done[id]=S.done[id]||{c:0,w:0};dd.t=Date.now();
      if(ok){dd.c++;}
      if(picked.length)bumpDaily();
    });
    s.score=score;s.full=full;s.correct=correct;s.wrongList=wrongList;
    clearInterval(examTimer);save();
    stack=stack.filter(x=>x.name!=="exam");
    go({name:"exam",s},true);
  };
  if(unanswered>0){
    if(confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`))doSubmit();
  }else doSubmit();
}

function openSheet(s,onSubmit){
  const isExam = typeof onSubmit==="function";
  let courseNav="";
  if(s.mode==="seq"&&s.list.length){
    const rs=courseRanges(s);
    if(rs.length>1){
      courseNav=`<div class="course-nav">${rs.map((r,i)=>{
        const cur=s.idx>=r.start&&s.idx<r.end;
        return `<button class="chip ${cur?"on":""}" data-ci="${i}" title="${esc(r.bank)}">${esc(r.bank)}（${r.end-r.start}）</button>`;
      }).join("")}</div>`;
    }
  }
  let gridHTML=s.list.map((id,i)=>{
    let cls="";
    if(isExam){if(s.picked[id])cls="done";}
    else{if(s.judged[id]!=null)cls=s.judged[id]?"done-ok":"done-bad";}
    if(i===s.idx)cls+=" cur";
    return `<button class="sq ${cls}" data-i="${i}">${i+1}</button>`;
  }).join("");
  const mask=document.createElement("div");
  mask.className="sheet-mask";
  mask.innerHTML=`<div class="sheet"><h3>答题卡（共 ${s.list.length} 题）</h3>
    ${courseNav}
    <div class="grid">${gridHTML}</div>
    ${isExam?`<div style="margin-top:14px;display:flex;gap:10px;">
      <button class="big-btn ghost" id="sheet-close">继续作答</button>
      <button class="big-btn" id="sheet-submit">交 卷</button></div>`
    :`<div style="margin-top:14px;"><button class="big-btn ghost" id="sheet-close">关 闭</button></div>`}
  </div>`;
  document.body.appendChild(mask);
  mask.addEventListener("click",e=>{
    if(e.target===mask)mask.remove();
    const cchip=e.target.closest("[data-ci]");
    if(cchip){
      const r=courseRanges(s)[+cchip.dataset.ci];
      s.idx=r.start;s.gate=false;
      if(s.mode==="seq"&&curView.name==="practice"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}
      mask.remove();render();return;
    }
    const sq=e.target.closest("[data-i]");
    if(sq){s.idx=+sq.dataset.i;s.gate=false;if(s.mode==="seq"&&curView.name==="practice"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}mask.remove();render();}
    if(e.target.id==="sheet-close")mask.remove();
    if(e.target.id==="sheet-submit"){mask.remove();onSubmit(curView);}
  });
}

const ID_MARK="#id:";   // txt 导出时附在每题末尾的隐藏题号，供再导入时识别
function download(name,text,mime){
  const blob=new Blob(["\ufeff"+text],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("已开始下载");
}
function exportQuestions(ids,label){
  const lines=[`${label}导出（核电入职刷题）`,`导出时间：${new Date().toLocaleString()}　共 ${ids.length} 题`,""];
  ids.forEach((id,i)=>{
    const q=QMAP[id];if(!q)return;
    lines.push(`${i+1}. [${DATA.modules[q.module]||""} · ${q.bank} · ${TYPE_NAME[q.type]}] ${q.stem}`);
    (q.options||[]).forEach((o,j)=>lines.push(`    ${LETTERS[j]}．${o}`));
    lines.push(`    ✅ 答案：${q.type==="judge"?q.answer[0]:q.answer.join("")}`);
    if(q.type!=="judge"&&q.options)lines.push(`    ${ansText(q)}`);
    if(q.explanation)lines.push(`    📖 解析：${q.explanation}`);
    lines.push(`    ${ID_MARK} ${id}`);   // 隐藏题号，便于这个文件再导入
    lines.push("");
  });
  download(`核电刷题_${label}_${today()}.txt`,lines.join("\n"));
}

/* ---------- 导入 / 恢复 ---------- */
function parsePayload(text){
  text=String(text||"").replace(/^\ufeff/,"");
  if(text.trim().charAt(0)==="{"){
    let o;try{o=JSON.parse(text);}catch(e){alert("备份文件解析失败："+e.message);return null;}
    if(!o||typeof o!=="object"||(!o.wrong&&!o.fav&&!o.done&&!o.slay)){alert("这不是本 App 的备份文件");return null;}
    return {kind:"backup",time:o.time||"",
      wrong:o.wrong||{},fav:o.fav||{},slay:o.slay||{},
      done:o.done||{},daily:o.daily||{},seq:o.seq||{}};
  }
  // txt：靠隐藏的题号识别
  const ids=[];const re=new RegExp(ID_MARK.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*(\\S+)","g");
  let m;while((m=re.exec(text)))ids.push(m[1]);
  if(!ids.length){alert("这个文件里没找到题号。\n请用本 App 导出的 txt，或导出时选择「备份全部进度（JSON）」。");return null;}
  return {kind:"txt",ids:ids};
}

  file.onchange=()=>{
    const f=file.files&&file.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{mask.remove();afterReadImport(String(r.result||""),f.name);};
    r.onerror=()=>{alert("文件读取失败");};
    r.readAsText(f,"utf-8");
  };
  mask.addEventListener("click",e=>{if(e.target===mask||e.target.id==="imp-close")mask.remove();});
}
function afterReadImport(text,name){
  const p=parsePayload(text);if(!p)return;
  let miss=0;
  const chk=o=>{Object.keys(o||{}).forEach(id=>{if(!QMAP[id])miss++;});};
  if(p.kind==="backup"){chk(p.wrong);chk(p.fav);chk(p.slay);chk(p.done);}
  else p.ids.forEach(id=>{if(!QMAP[id])miss++;});
  confirmImport(p,name,miss);
}
function confirmImport(p,name,miss){
  let inW,inF,inK,inD,warn="";
  if(p.kind==="backup"){
    inW=countOf(p.wrong);inF=countOf(p.fav);inK=countOf(p.slay);inD=countOf(p.done);
  }else{
    // txt：让用户决定恢复到错题还是收藏；文件名带「收藏」就默认收藏
    const guess=/收藏/.test(name)&&!/错题/.test(name)?"fav":"wrong";
    inW=guess==="wrong"?p.ids.length:0;
    inF=guess==="fav"?p.ids.length:0;inK=0;inD=0;
    warn=`<div class="filter-row" id="imp-tgt" style="margin:10px 0 0;">
      <button class="chip ${guess==="wrong"?"on":""}" data-tgt="wrong">恢复到错题</button>
      <button class="chip ${guess==="fav"?"on":""}" data-tgt="fav">恢复到收藏</button>
    </div>`;
  }
  const curW=Object.keys(S.wrong).length,curF=Object.keys(S.fav).length,curD=Object.keys(S.done).length;
  const mask=document.createElement("div");
  mask.className="sheet-mask";
  mask.innerHTML=`<div class="sheet"><h3>确认导入</h3>
    <div class="mut" style="line-height:1.7;">文件：<b>${esc(name)}</b>${p.time?`<br>导出时间：${esc(String(p.time).slice(0,10))}`:""}
      <br>含：错题 ${inW}${p.kind==="backup"?`（其中反复错 ${Object.keys(p.wrong||{}).filter(id=>(p.wrong[id]||0)>1).length}）`:""} · 收藏 ${inF} · 斩杀 ${inK} · 答题记录 ${inD}
      ${miss?`<br><span style="color:var(--warn)">⚠ 有 ${miss} 条在当前题库中找不到对应题目，将忽略</span>`:""}
      <br>本机：错题 ${curW} · 收藏 ${curF} · 答题记录 ${curD}</div>
    ${warn}
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
      <button class="big-btn" id="mg-merge">合并（两边都留，错次取大）</button>
      <button class="big-btn ghost" id="mg-over">覆盖（用文件替换本机）</button>
      <button class="big-btn ghost" id="mg-close">取 消</button>
    </div></div>`;
  document.body.appendChild(mask);
  let tgt=(mask.querySelector("#imp-tgt .chip.on")||{}).dataset;
  tgt=tgt?tgt.tgt:"wrong";
  mask.addEventListener("click",e=>{
    const c=e.target.closest("[data-tgt]");
    if(c){mask.querySelectorAll("[data-tgt]").forEach(x=>x.classList.remove("on"));c.classList.add("on");tgt=c.dataset.tgt;return;}
    if(e.target===mask||e.target.id==="mg-close"){mask.remove();return;}
    if(e.target.id==="mg-merge"){mask.remove();applyImport(p,"merge",tgt);}
    if(e.target.id==="mg-over"){mask.remove();applyImport(p,"over",tgt);}
  });
}
function applyImport(p,mode,tgt){
  const merge=mode==="merge";
  let addedW=0,addedF=0,addedK=0,addedD=0;
  const putW=(o)=>Object.keys(o).forEach(id=>{
    if(!QMAP[id])return;
    const n=(typeof o[id]==="number"&&isFinite(o[id]))?Math.max(1,Math.floor(o[id])):1;
    const old=S.wrong[id]||0;
    const v=merge?Math.max(old,n):n;
    if(!old)addedW++;
    S.wrong[id]=v;
  });
  const put1=(box,o)=>Object.keys(o).forEach(id=>{
    if(!QMAP[id])return;
    if(!box[id]){box[id]=1;if(box===S.fav)addedF++;else addedK++;}
  });
  if(p.kind==="backup"){
    if(!merge){S.wrong={};S.fav={};S.slay={};S.done={};S.daily={};}
    else{S.fav=S.fav||{};S.slay=S.slay||{};S.done=S.done||{};S.daily=S.daily||{};}
    putW(p.wrong);put1(S.fav,p.fav);put1(S.slay,p.slay);
    Object.keys(p.done||{}).forEach(id=>{
      if(!QMAP[id])return;
      const o=p.done[id]||{},d=S.done[id];
      if(!d){S.done[id]={c:+o.c||0,w:+o.w||0,t:+o.t||0};addedD++;}
      else{
        d.c=merge?Math.max(d.c||0,+o.c||0):(+o.c||0);
        d.w=merge?Math.max(d.w||0,+o.w||0):(+o.w||0);
        d.t=Math.max(d.t||0,+o.t||0);
      }
    });
    Object.keys(p.daily||{}).forEach(d=>{
      S.daily[d]=merge?Math.max(S.daily[d]||0,+p.daily[d]||0):(+p.daily[d]||0);
    });
    Object.keys(p.seq||{}).forEach(k=>{if(QMAP[p.seq[k]])S.seq[k]=p.seq[k];});
  }else{
    const box={};p.ids.forEach(id=>{if(QMAP[id])box[id]=1;});
    if(tgt==="fav"){if(!merge)S.fav={};put1(S.fav,box);}
    else{if(!merge)S.wrong={};putW(box);}
  }
  save();render();
  const parts=[`错题 +${addedW}`,`收藏 +${addedF}`];
  if(p.kind==="backup")parts.push(`斩杀 +${addedK}`,`答题记录 +${addedD}`);
  toast(`${merge?"已合并":"已覆盖"}：${parts.join(" · ")}`);
}
function vQView(v){
  const q=QMAP[v.qid];
  const s={list:[v.qid],idx:0,mode:"recite",judged:{},picked:{}};
  return `<h2 class="pg">题目详情</h2><div class="card" id="qcard">${renderQ(s,q)}</div>
  <div style="display:flex;gap:10px;">
    <button class="big-btn ghost" id="qv-fav">${S.fav[q.id]?"★ 取消收藏":"☆ 收藏"}</button>
    <button class="big-btn" id="qv-back">返 回</button></div>`;
}
function bindQView(v){
  const q=QMAP[v.qid];
  $("#qv-back").onclick=back;
  $("#qv-fav").onclick=()=>{if(S.fav[q.id])delete S.fav[q.id];else S.fav[q.id]=1;save();render();};
}

/* ================= 统计 ================= */
function vStats(){
  const doneIds=Object.keys(S.done);
  let attempts=0,correct=0;
  doneIds.forEach(id=>{attempts+=S.done[id].c+S.done[id].w;correct+=S.done[id].c;});
  const acc=attempts?Math.round(correct/attempts*100):0;
  let h=`<h2 class="pg">学习统计</h2>
  <div class="stat-nums">
    <div class="stat-cell"><div class="v">${doneIds.length}</div><div class="k">已刷题目</div></div>
    <div class="stat-cell"><div class="v">${acc}%</div><div class="k">总体正确率</div></div>
    <div class="stat-cell"><div class="v">${Object.keys(S.wrong).length}</div><div class="k">错题待攻克</div></div>
  </div>`;
  h+=`<div class="sec-title">各科进度</div><div class="card">`;
  for(const mid of ["qihang","basics","safety"]){
    const p=modProgress(mid);
    h+=`<div class="bank-stat"><div class="bs-top"><b>${esc(DATA.modules[mid]||mid)}</b><span>${p.done}/${p.total}（${p.pct}%）</span></div>
      <div class="pbar"><div style="width:${p.pct}%"></div></div></div>`;
  }
  h+=`</div>`;
  h+=`<div class="sec-title">近 14 天刷题量</div><div class="card dailies-wrap"><div class="dailies">`;
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
  }
  const max=Math.max(1,...days.map(d=>S.daily[d]||0));
  days.forEach((d,i)=>{
    const n=S.daily[d]||0;
    h+=`<div class="dbar"><div style="height:${Math.round(n/max*72)}px"></div><span>${i%2===0?d.slice(5):""}</span></div>`;
  });
  h+=`</div></div>`;
  // 反复错的题：累计错 ≥2 次，按错次降序（S.done.w 是历史累计，错题本移除后仍留痕）
  const rep=Object.keys(S.done).filter(id=>QMAP[id]&&(S.done[id].w||0)>=2)
    .sort((a,b)=>(S.done[b].w||0)-(S.done[a].w||0));
  if(rep.length){
    const repW=rep.filter(id=>S.wrong[id]).length;
    h+=`<div class="sec-title">反复错的题（${rep.length} 题${repW?` · ${repW} 题还在错题本`:" · 已全部攻克"}）</div>
      <div class="card" style="padding:4px 14px;" id="stats-rep">`+
      rep.slice(0,15).map(id=>{
        const q=QMAP[id],n=S.done[id].w;
        return `<div class="res-item" data-qid="${id}">
          <div class="rs">${esc(q.stem)}</div>
          <div class="rmeta"><span class="tag s-wrongx" style="font-size:10px;">✗ ${n} 次</span>
          ${S.wrong[id]?`<span class="tag s-wrongmark" style="font-size:10px;">待攻克</span>`:`<span class="tag s-official" style="font-size:10px;">已攻克</span>`}
          <span>${esc(DATA.modules[q.module]||"")} · ${esc(q.bank)}</span></div></div>`;
      }).join("")+`</div>`;
    if(rep.length>15)h+=`<div class="mut" style="margin:6px 2px 0;">按错次排序，仅显示前 15 题</div>`;
  }
  const slayN=Object.keys(S.slay).filter(id=>QMAP[id]).length;
  h+=`<div class="card"><div class="mut">⚔️ 已斩杀 <b>${slayN}</b> 题（答对后主动斩杀，不再进随机/顺序/专项练习；可在「收藏 / 错题」页恢复）</div></div>`;
  h+=`<div class="about">数据保存在本机浏览器中<br>共 ${questions.length} 题 · 构建时间：${DATA.buildTime}</div>`;
  return h;
}

function bindStats(){
  const box=$("#stats-rep");if(!box)return;
  box.querySelectorAll("[data-qid]").forEach(el=>el.onclick=()=>go({name:"qview",qid:el.dataset.qid}));
}

/* ================= 搜索 ================= */
function vSearch(){
  return `<h2 class="pg">搜题</h2>
  <input class="search-input" id="search-in" placeholder="输入关键词，搜索题干和选项…" value="${esc((curView.q||""))}">
  <div id="search-res"></div>`;
}
function doSearch(kw){
  const res=$("#search-res");
  if(!kw||kw.length<2){res.innerHTML=`<div class="empty">输入至少 2 个字开始搜索</div>`;return;}
  const k=kw.toLowerCase();
  const hits=questions.filter(q=>
    q.stem.toLowerCase().includes(k)||
    (q.options||[]).some(o=>o.toLowerCase().includes(k))).slice(0,80);
  if(!hits.length){res.innerHTML=`<div class="empty">没有找到「${esc(kw)}」相关题目</div>`;return;}
  res.innerHTML=`<div class="mut" style="margin:0 2px 6px;">找到 ${hits.length} 题</div><div class="card" style="padding:4px 14px;">`+
    hits.map(q=>`<div class="res-item" data-qid="${q.id}">
      <div class="rs">${esc(q.stem)}</div>
      <div class="rmeta"><span class="tag ${SRC_CLASS[q.source]}" style="font-size:10px;">${SRC_NAME[q.source]}</span>
      <span class="tag t-${q.type}" style="font-size:10px;">${TYPE_NAME[q.type]}</span>
      <span>${esc(DATA.modules[q.module]||"")} · ${esc(q.bank)}</span></div></div>`).join("")+`</div>`;
  res.querySelectorAll("[data-qid]").forEach(el=>el.onclick=()=>go({name:"qview",qid:el.dataset.qid}));
}
function bindSearch(){
  const inp=$("#search-in");
  inp.focus();
  let h;
  inp.oninput=()=>{clearTimeout(h);h=setTimeout(()=>{curView.q=inp.value;doSearch(inp.value);},250);};
  if(inp.value)doSearch(inp.value);
}

/* ================= 渲染分发 ================= */
function render(){
  const v=curView;
  const vw=$("#view");
  let h="",title="",showNav=true;
  switch(v.name){
    case "home":h=vHome();break;
    case "modes":h=vModes(v);title=BANKS[v.bank].bank;break;
    case "practice":h=vPractice(v);title="练习";showNav=!!(v.s.idx<v.s.list.length&&!v.s.gate);break;
    case "examsetup":h=vExamSetup(v);title="模拟考试";break;
    case "exam":
      if(v.s.submitted){h=vResult(v);title="考试结果";showNav=false;}
      else{h=vExam(v);title="模拟考试"+(v.s.ebank?" · "+v.s.ebank:"");showNav=true;}
      break;
    case "fav":h=vFav();break;
    case "stats":h=vStats();break;
    case "search":h=vSearch();break;
    case "qview":h=vQView(v);title="题目详情";showNav=false;break;
  }
  vw.innerHTML=h;
  renderNav();renderHeader(title);
  const footLive = (v.name==="practice"&&v.s.idx<v.s.list.length&&!v.s.gate)||(v.name==="exam"&&!v.s.submitted);
  if(!footLive){const qf=$("#qfoot");if(qf)qf.remove();}
  // 绑定
  document.querySelectorAll(".mcard").forEach(el=>el.onclick=()=>go({name:"modes",bank:el.dataset.mod}));
  switch(v.name){
    case "modes":bindModes(v);break;
    case "practice":
      bindPractice(v);
      if(v.s.idx<v.s.list.length)bindFoot(v);
      break;
    case "examsetup":bindExamSetup(v);break;
    case "exam":
      if(v.s.submitted)bindResult(v);
      else{bindFoot(v);startExamTimer(v);window.scrollTo(0,0);}
      break;
    case "fav":bindList();break;
    case "stats":bindStats();break;
    case "search":bindSearch();break;
    case "qview":bindQView(v);break;
  }
}
function bindFoot(v){
  const s=v.s;
  const q=s.idx<s.list.length?QMAP[s.list[s.idx]]:null;
  const old=$("#qfoot");if(old)old.remove();
  const foot=document.createElement("div");
  foot.className="qfoot";foot.id="qfoot";
  foot.innerHTML=`
    <button class="fbtn" id="f-star"><span class="fi">${q&&S.fav[q.id]?"★":"☆"}</span>收藏</button>
    <button class="fnav navbtn prev" id="f-prev">上一题</button>
    <button class="fnav navbtn next" id="f-next">${s.idx>=s.list.length-1?(curView.name==="exam"?"交卷":"完成"):"下一题"}</button>
    <button class="fbtn" id="f-sheet"><span class="fi">▦</span>答题卡</button>`;
  document.body.appendChild(foot);
  if(curView.name==="practice")bindPracticeFoot(v);
  else if(curView.name==="exam")bindExam(v);
}

function bindModes(v){
  const b=BANKS[v.bank];
  const state={mode:null,src:"all",types:new Set(["single","multi","judge"])};
  const srcEl=$("#src-filter"),typeEl=$("#type-filter");
  // 更新专项练习各题型数量
  const cnt={};b.list.forEach(q=>cnt[q.type]=(cnt[q.type]||0)+1);
  typeEl.querySelectorAll("[data-type]").forEach(el=>{
    el.textContent=`${TYPE_NAME[el.dataset.type]}（${cnt[el.dataset.type]||0}）`;
    el.onclick=()=>{
      const t=el.dataset.type;
      if(state.types.has(t))state.types.delete(el.dataset.type);else state.types.add(t);
      el.classList.toggle("on");
    };
  });
  srcEl.querySelectorAll("[data-src]").forEach(el=>{
    el.onclick=()=>{state.src=el.dataset.src;
      srcEl.querySelectorAll("[data-src]").forEach(x=>x.classList.toggle("on",x===el));};
  });
  $("#mode-grid").querySelectorAll("[data-mode]").forEach(el=>{
    el.onclick=()=>{
      const m=el.dataset.mode;
      if(m==="type"){
        srcEl.style.display="flex";typeEl.style.display="flex";
        el.classList.toggle("on");
        return;
      }
      startSession({mode:m,bank:v.bank,src:"all",types:null});
    };
  });
  // 专项练习开始按钮
  const startBtn=document.createElement("button");
  startBtn.className="big-btn";startBtn.textContent="开始专项练习";
  startBtn.style.marginTop="10px";
  typeEl.parentNode.appendChild(startBtn);
  startBtn.onclick=()=>{
    if(!state.types.size){toast("请先勾选题型");return;}
    startSession({mode:"seq",bank:v.bank,src:state.src,types:[...state.types]});
  };
  // 课程列表：点哪门刷哪门（空值 = 全部课程整体顺序）
  document.querySelectorAll("[data-course]").forEach(el=>{
    el.onclick=()=>startSession({mode:"seq",bank:v.bank,src:"all",types:null,course:el.dataset.course||null});
  });
  // 断点续练（按题目 id 定位，斩杀/恢复不影响）
  const pool=buildPool(v.bank,"all",null,true);
  const rIdx=seqResumeIdx(pool,v.bank);
  if(rIdx>0&&rIdx<pool.length){
    const qAt=pool[rIdx];
    const where=qAt?`《${esc(qAt.bank)}》 `:"";
    $("#resume-info").innerHTML=`上次顺序练习到 ${where}第 <b>${rIdx+1}</b> 题　<button class="chip on" id="btn-resume">继续</button>`;
    $("#btn-resume").onclick=()=>startSession({mode:"seq",bank:v.bank,src:"all",types:null});
  }
  $("#exam-card").onclick=()=>go({name:"examsetup",bank:v.bank});
}

/* ================= 启动 ================= */
loadState();
$("#btn-back").onclick=back;
$("#btn-dk").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",cur?"light":"dark");
  try{localStorage.setItem("tiku_theme",cur?"light":"dark");}catch(e){}
};
try{
  const th=localStorage.getItem("tiku_theme");
  if(th==="dark"||( !th && false ))document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
$("#nav").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  stack=[];
  go({name:t.dataset.t},true);
});
go({name:"home"},true);
</script>
</body>
