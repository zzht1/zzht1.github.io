<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a6feb">
<meta name="robots" content="noindex, nofollow">
<title>核电入职刷题</title>
<style>
:root{
  --bg:#f2f4f8; --card:#fff; --text:#1c2330; --sub:#6b7486; --line:#e5e9f0;
  --pri:#1a6feb; --pri-weak:#e8f1fe; --ok:#18a058; --ok-weak:#e8f7ef;
  --bad:#d93a3a; --bad-weak:#fdeeee; --warn:#d97706; --warn-weak:#fdf3e3;
  --gen:#7c3aed; --gen-weak:#f1eafe; --note:#0e9488; --note-weak:#e5f7f5;
  --shadow:0 1px 4px rgba(16,24,40,.08); --radius:12px;
}
[data-theme="dark"]{
  --bg:#12161d; --card:#1c222c; --text:#e7ebf2; --sub:#8d97a8; --line:#2a323f;
  --pri:#4d8dfa; --pri-weak:#1a2740; --ok:#2eb872; --ok-weak:#12291d;
  --bad:#f06d6d; --bad-weak:#331a1a; --warn:#e9a23b; --warn-weak:#332711;
  --gen:#a78bfa; --gen-weak:#241d3a; --note:#2eb8a6; --note-weak:#12302c;
  --shadow:0 1px 4px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.55;}
body{padding-bottom:calc(58px + env(safe-area-inset-bottom));}
#hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);}
#hdr .back{width:34px;height:34px;border:none;background:none;color:var(--pri);
  font-size:22px;line-height:1;flex:none;cursor:pointer;padding:0;}
#hdr .title{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hdr .hbtn{border:none;background:none;color:var(--pri);font-size:13px;cursor:pointer;padding:6px 4px;flex:none;}
#view{padding:14px 12px 20px;max-width:720px;margin:0 auto;}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
#nav .tab{flex:1;border:none;background:none;color:var(--sub);font-size:11px;
  cursor:pointer;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
#nav .tab .ic{font-size:20px;line-height:1;}
#nav .tab.on{color:var(--pri);font-weight:600;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;}
.mcard{display:block;width:100%;text-align:left;border:none;cursor:pointer;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;color:var(--text);}
.mcard .mtop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mcard .mic{font-size:26px;}
.mcard .mname{font-size:18px;font-weight:700;flex:1;}
.mcard .mgo{color:var(--sub);font-size:13px;}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--pri),#67b0ff);border-radius:4px;transition:width .3s;}
.mmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--sub);}
.brow{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.brow:last-child{border-bottom:none;}
.brow .binfo{flex:1;min-width:0;}
.brow .bname{font-weight:600;font-size:15.5px;}
.brow .bcount{font-size:12.5px;color:var(--sub);margin-top:2px;}
.brow .bprog{font-size:12.5px;color:var(--pri);flex:none;}
.sec-title{font-size:14px;font-weight:600;color:var(--sub);margin:16px 2px 8px;}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px;}
.mode-btn{border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:10px 2px;font-size:12.5px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;}
.mode-btn .mi{font-size:19px;}
.mode-btn.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);font-weight:600;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
.chip.on{border-color:var(--pri);color:var(--pri);background:var(--pri-weak);font-weight:600;}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qno{font-size:13px;color:var(--sub);}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex:none;}
.t-single{background:var(--pri-weak);color:var(--pri);}
.t-multi{background:var(--warn-weak);color:var(--warn);}
.t-judge{background:var(--note-weak);color:var(--note);}
.s-official{background:var(--ok-weak);color:var(--ok);}
.s-wrongmark{background:var(--bad-weak);color:var(--bad);}
.s-favmark{background:var(--warn-weak);color:var(--warn);}
.s-ppt-notes{background:var(--note-weak);color:var(--note);}
.s-generated{background:var(--gen-weak);color:var(--gen);}
.stem{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);
  background:var(--card);border-radius:10px;padding:11px 12px;cursor:pointer;
  font-size:15.5px;line-height:1.5;text-align:left;color:var(--text);}
.opt .ol{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--sub);}
.opt.picked{border-color:var(--pri);background:var(--pri-weak);}
.opt.picked .ol{border-color:var(--pri);color:var(--pri);background:var(--pri-weak);}
.opt.right{border-color:var(--ok);background:var(--ok-weak);}
.opt.right .ol{border-color:var(--ok);color:#fff;background:var(--ok);}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-weak);}
.opt.wrongpick .ol{border-color:var(--bad);color:#fff;background:var(--bad);}
.opt.dim{opacity:.55;}
.judge-row{display:flex;gap:10px;}
.judge-btn{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  padding:14px;font-size:16px;font-weight:600;cursor:pointer;color:var(--text);}
.judge-btn.right{border-color:var(--ok);background:var(--ok-weak);color:var(--ok);}
.judge-btn.wrongpick{border-color:var(--bad);background:var(--bad-weak);color:var(--bad);}
.judge-btn.picked{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);}
.confirm-bar{margin-top:12px;}
.big-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;
  font-weight:600;cursor:pointer;background:var(--pri);color:#fff;}
.big-btn:disabled{opacity:.45;}
.big-btn.ghost{background:none;border:1.5px solid var(--line);color:var(--text);}
.feedback{border-radius:10px;padding:11px 13px;margin-top:13px;font-size:14.5px;line-height:1.55;}
.feedback.ok{background:var(--ok-weak);color:var(--ok);}
.feedback.bad{background:var(--bad-weak);color:var(--bad);}
.feedback b{font-weight:700;}
.expl{border-radius:10px;padding:11px 13px;margin-top:9px;font-size:14px;line-height:1.6;
  background:var(--pri-weak);color:var(--text);}
.expl .elabel{font-size:12px;color:var(--sub);margin-bottom:4px;display:flex;gap:6px;align-items:center;}
.pbar-wrap{margin-bottom:12px;}
.pbar-wrap .ptxt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:5px;}
.qfoot{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:40;
  background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;
  padding:8px 12px;gap:8px;max-width:720px;margin:0 auto;}
body.no-nav .qfoot{bottom:0;}
.qfoot .fbtn{border:none;background:none;color:var(--sub);font-size:13px;cursor:pointer;
  padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;}
.qfoot .fbtn .fi{font-size:18px;}
.qfoot .fbtn.on{color:var(--warn);}
.qfoot .navbtn{flex:1;border:none;border-radius:9px;padding:10px 0;font-size:15px;
  font-weight:600;cursor:pointer;}
.qfoot .prev{background:var(--bg);color:var(--text);margin-right:2px;}
.qfoot .next{background:var(--pri);color:#fff;}
.qfoot .next:disabled{opacity:.4;}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;
  align-items:flex-end;}
.sheet{background:var(--card);width:100%;max-height:75vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 10px;font-size:16px;}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;}
.sq{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;cursor:pointer;color:var(--text);}
.sq.done-ok{background:var(--ok-weak);border-color:var(--ok);color:var(--ok);}
.sq.done-bad{background:var(--bad-weak);border-color:var(--bad);color:var(--bad);}
.sq.done{background:var(--pri-weak);border-color:var(--pri);color:var(--pri);}
.sq.cur{outline:2.5px solid var(--pri);outline-offset:1px;font-weight:700;}
.timer{font-size:13.5px;font-weight:600;color:var(--warn);background:var(--warn-weak);
  border-radius:14px;padding:3px 11px;}
.timer.danger{color:var(--bad);background:var(--bad-weak);}
.stat-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-cell{background:var(--card);border-radius:10px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);}
.stat-cell .v{font-size:21px;font-weight:700;color:var(--pri);}
.stat-cell .k{font-size:12px;color:var(--sub);margin-top:2px;}
.bank-stat{margin-bottom:10px;}
.bank-stat .bs-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.bank-stat .bs-top b{font-weight:600;}
.dailies{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px;}
.dailies .dbar{flex:1;background:var(--pri-weak);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
.dailies .dbar>div{position:absolute;bottom:0;left:0;right:0;background:var(--pri);border-radius:3px 3px 0 0;}
.dailies .dbar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:var(--sub);white-space:nowrap;}
.dailies-wrap{padding-bottom:20px;}
.search-input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:15px;margin-bottom:10px;outline:none;}
.search-input:focus{border-color:var(--pri);}
.res-item{padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.res-item .rs{font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.res-item .rmeta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;}
.empty{ text-align:center;color:var(--sub);padding:44px 10px;font-size:14px;}
.empty .eic{font-size:40px;margin-bottom:8px;}
.score-circle{width:130px;height:130px;border-radius:50%;margin:6px auto 10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--pri);}
.score-circle.pass{border-color:var(--ok);}
.score-circle.fail{border-color:var(--bad);}
.score-circle .sv{font-size:34px;font-weight:800;}
.score-circle .sk{font-size:12px;color:var(--sub);}
.result-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.exam-setup label{display:block;font-size:13.5px;color:var(--sub);margin:12px 0 7px;}
.exam-setup .cnt-row{display:flex;gap:8px;}
.about{font-size:12.5px;color:var(--sub);line-height:1.7;text-align:center;padding:8px 0 4px;}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(28,35,48,.92);
  color:#fff;font-size:13.5px;border-radius:20px;padding:8px 18px;z-index:99;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:80vw;}
.toast.show{opacity:1;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mut{color:var(--sub);font-size:13px;}
h2.pg{font-size:19px;font-weight:700;margin:4px 2px 12px;}
.divider{height:1px;background:var(--line);margin:10px 0;}
button{font-family:inherit;}
input,button{-webkit-user-select:none;user-select:none;}
</style>
</head>

</header>
<div id="view"></div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

"量子","中子"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"原子由带正电的原子核和核外带负电的电子组成，原子整体呈电中性。"},{"id":"basics_jc_0021","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪项属于技术规格书中的不可识别泄漏。","options":["来自设备可能的泄漏，该泄漏预计将被收集（如稳压器安全阀的泄漏、压力容器密封环泄漏、一些密封阀泄漏）","收集在密封环路、可以进行测量的系统之间的泄漏","蒸汽发生器传热管泄漏","机组正常运行时存在的泄漏"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽发生器传热管泄漏属于不可识别泄漏（无法确定具体泄漏源），是技术规格书重点限制的对象。"},{"id":"basics_jc_0022","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪一项属于压水堆核电厂与研究堆运行的共同特点。","options":["反应堆堆芯保护系统的原则是对功率、轴向功率分布、冷却剂的流量、温度和压力等确定一个允许的运行区间，当运行超过该区间限值时，实现紧急停堆","载硼运","汽轮机快速降负荷功能"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆核电厂与研究堆运行的共同特点是反应堆堆芯保护系统的原则一致（均要求可靠的反应性控制和保护）。"},{"id":"basics_jc_0023","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"技术规格书不适用于异常或事故工况，在这种工况下的安全保证是通过( )来实现的。","options":["事故程序","正常运行规程","操作单"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"技术规格书适用于正常运行，异常或事故工况下的安全通过事故程序（应急运行规程）来保证。"},{"id":"basics_jc_0024","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂的安全保障则包括核安全管理制度、核安全设计和( )三个方面。","options":["核安全理念","核安全法规","核安全文化"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"核电厂安全保障包括核安全管理制度、核安全设计和核安全文化三个方面。"},{"id":"basics_jc_0025","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"( )事件是指在核电厂功率运行、燃料更换、维修过程中频繁发生的事件。","options":["高频度","中等频度","低频度"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"中等频度事件指在功率运行、换料、维修过程中频繁发生的事件（如个别棒落棒、汽机跳闸等）。"},{"id":"basics_jc_0026","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"蒸汽发生器安装在（ ）。","options":["反应堆厂房","汽轮机厂房","燃料厂房"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽发生器属于一回路设备，安装在反应堆厂房（安全壳）内。"},{"id":"basics_jc_0027","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪一项属于压水堆核电厂运行特点（ ）","options":["反应堆超临界","反应堆内产生和积累了大量的放射性物质","停堆后停止释热"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆运行特点之一是反应堆内产生并积累大量放射性物质，停堆后仍持续释放衰变热。"},{"id":"basics_jc_0028","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"正常情况下，压水堆核电站只在（ ）中存在放射性。","options":["一回路","二回路","三回路"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正常情况下放射性只存在于一回路；二回路只有在蒸汽发生器传热管泄漏时才可能出现放射性。"},{"id":"basics_jc_0029","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"差压式流量计中节流装置输出差压与被测流量的关系为：( )","options":["差压与流量成正比","差压与流量成反比","差压与流量的平方成正比","差压与流量成线性关系"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"差压式流量计的节流装置输出差压与被测流量的平方成正比（ΔP∝Q²），因此流量与差压平方根成正比。"},{"id":"basics_jc_0030","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪个不是误差的表示方法？","options":["绝对误差","相对误差","引用误差","计算误差"],"answer":["D"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"误差的表示方法有绝对误差、相对误差、引用误差；\"计算误差\"不属于误差的表示方法。"},{"id":"basics_jc_0031","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下不是反应堆冷却剂系统的热工参数的（ ）。","options":["温度","压力","流量","放射性"],"answer":["D"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"温度、压力、流量是热工参数；放射性属于核测量（辐射监测）参数，不是热工参数。"},{"id":"basics_jc_0032","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂一回路冷却剂系统使用测量主管道温度的仪表类型多为：（ ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"一回路主管道（冷段/热段）温度测量多采用精度高、稳定性好的热电阻（铂电阻）。"},{"id":"basics_jc_0033","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂应用最多的测温仪表类型为：（ ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"核电厂应用最多的测温仪表是热电阻（铂电阻），用于中低温精确测量；热电偶多用于高温场合。"},{"id":"basics_jc_0034","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"冷却剂环路流量测量使用的仪表类型为：（ ）","options":["压差变送器","压力表","体积流量计","超声波流量计"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"冷却剂环路流量采用弯管（或节流装置）+压差变送器测量。"},{"id":"basics_jc_0035","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"仪控系统需要保证的三大核安全目标（要素）不包括：（ ）","options":["反应性控制","余热排出","放射性包容","工业安全"],"answer":["D"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"仪控系统保证的三大核安全要素（目标）是：反应性控制、余热排出、放射性包容；工业安全不在其中。"},{"id":"basics_jc_0036","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下哪项不是堆芯中子注量率测量系统在正常运行时的功能（ ）","options":["探测反应堆在装料中可能出现的差错","检查与燃耗对应的功率分布是否与设计所期望的功率分布相符","监测各燃料组件的燃耗，校准堆外核测量仪表","探测堆芯是否偏离正常运行"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"堆芯中子注量率测量系统正常运行时用于监测功率分布、校核燃耗、探测异常；装料期间的探测属于换料大修工况，不是正常运行功能。"},{"id":"basics_jc_0037","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"_____是压力容器用以储存物料或完成化学反应所需要的主要空间，是压力容器的最主要的受压元件之一。","options":["封头","筒体","密封装置"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"筒体是压力容器储存物料或完成化学反应的主要空间，是最主要的受压元件之一。"},{"id":"basics_jc_0038","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"泵是将机械能转换成流体的_____和动力能，实现流体定向输运的动力设备。","options":["速度能","压力能","热能"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"泵将机械能转换为流体的压力能和动能，实现流体定向输运。"},{"id":"basics_jc_0039","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂常用的叶轮泵有______、混流泵和轴流泵三类。","options":["齿轮泵","离心泵","柱塞泵"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"叶轮泵按叶轮内液体流向分为离心泵、混流泵和轴流泵三类。"},{"id":"basics_jc_0040","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"蒸汽流过汽轮机级时，首先在喷嘴叶栅中将部分的热能转变成为动能，然后在动叶珊中将其动能和热能转变为______，使得叶轮和轴转动。","options":["电能","热量","机械能"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽在喷嘴叶栅中把热能变为动能，在动叶栅中把动能和热能转变为机械能，推动叶轮和轴旋转。"},{"id":"basics_jc_0041","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"曲柄销中心与主轴颈中心之间的距离称曲柄半径R。连杆大、小端中心间的距离称连杆长度L。上、下止点间的距离称活塞行程（冲程）S。S=_____R。","options":["1.0","2.0","3.0"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"活塞行程（冲程）S等于曲柄半径R的两倍，即 S=2R（上下止点间距为曲柄半径的2倍）。"},{"id":"basics_jc_0042","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"阀门的用途广泛，种类繁多，分类方法也比较多，总体上可以分为自动型阀门和_____。","options":["气动型阀门","驱动型阀门","电动型阀门"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"阀门总体上分为自动型阀门（靠介质本身动作，如止回阀、安全阀）和驱动型阀门（靠外力驱动，如闸阀、截止阀）。"},{"id":"basics_jc_0043","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"离心泵启动时，出口阀开启时间与泵启动时间关系______。","options":["先启动泵，后开启出口阀","先开启出口阀，后启动泵","同时气动泵和出口阀"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"离心泵启动时应先启动泵、后开启出口阀（低流量启动降低启动电流和冲击），停运时先关出口阀再停泵。"},{"id":"basics_jc_0044","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"热交换器是将一种介质的_____传给另一种介质的设备。","options":["能量","流量","热量"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"热交换器是将一种介质的热量传给另一种介质的设备（加热器、冷凝器等）。"},{"id":"basics_jc_0045","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"轻水的酸碱性根据pH大小分＜7酸性、=7中性、＞7碱性，对于重水来说，测得pH=7时为______。","options":["酸性","碱性","中性"],"answer":["A"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"重水的离子积常数与轻水不同，中性点pH约7.35；对重水测得pH=7时呈酸性（低于其中性点）。"},{"id":"basics_jc_0046","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"在核电厂一回路系统中，其放射性物质通过水及其中杂质的活化、裂变产物的释放、腐蚀产物的活化和化学添加物的活化等途径持续不断产生，为了控制系统中的核素活度维持在较低水平，通常采用______方式进行处理。","options":["滤芯过滤","树脂离子交换","膜分离技术"],"answer":["B"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"一回路放射性控制主要靠化学与容积控制系统的树脂离子交换（除盐器）连续净化。"},{"id":"basics_jc_0047","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"在下述卤素元素中，______对包壳材料锆合金的腐蚀作用最明显。","options":["氟离子","氯离子","溴离子"],"answer":["A"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"卤素中氟离子对锆合金包壳的腐蚀作用最明显，因此严格控制一回路氟离子含量。"},{"id":"basics_jc_0048","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"水的pH值大小反映水的酸碱度，当水温升高时，pH中性值下降，纯水温度在300℃时，其pH为______。","options":["6.5","7.5","5.6"],"answer":["C"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"水的离子积随温度升高增大，中性pH值下降；300℃纯水的中性pH约为5.6。"},{"id":"basics_jc_0049","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"压水堆核电厂蒸发器泄漏监测仪用于监测蒸发器一次侧向二次侧的泄漏，监测对象为（ ）。","options":["N-13","N-16","I-131"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽发生器泄漏监测以N-16（一回路水中O-16活化产生）为监测对象，二次侧测到N-16即表明传热管泄漏。"},{"id":"basics_jc_0050","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"由于物品的表面污染的存在，会因为人员辐射工作接触而转移到工作人员体表，进而会通过吸入或食入途径进入人体产生内照射。场所污染防护措施一般有（ ）。","options":["建立表面污染隔离区，适时采取去污措施","放射性物质衰变减少辐射源","选择合适的屏蔽材料"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"表面污染防护首先建立表面污染污染隔离区，控制污染扩散；衰变等待和屏蔽主要针对外照射，不是场所表面污染防护的直接措施。"},{"id":"basics_jc_0051","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"1960 年的国际物理学会议和 1961 年的化学会议分别通过决议，确定以( )作为原子质量单位；","options":["1 个12C 原子质量的十二分之一","1 个14C 原子质量的十二分之一","1 个 16O 原子质量的十二分之一"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"1960年国际物理学会议和1961年化学会议确定以1个¹²C原子质量的十二分之一（1u）作为原子质量单位。"},{"id":"basics_jc_0052","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下用于体内污染监测的设备是（ ）。","options":["C1 门","C2 门","WBC"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"体内污染监测使用全身计数器（WBC）直接测量体内γ核素；C1门测出污染，C2门测出控制区人员污染。"},{"id":"basics_jc_0053","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"已知流体与壁面的对流传热系数为15W/（m2·℃），传热面积为10m2，流体的温度为10℃，壁面的温度为200℃，则单位时间内流体与壁面传递的热量为多少？","options":["29500J","28500J","27500J","26500J"],"answer":["B"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"牛顿冷却公式 Q=hAΔt=15×10×(200-10)=28500W，即每秒传递28500J热量。"},{"id":"basics_jc_0054","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"已知壁面的导热系数为15W/（m·℃），壁面厚度为1m，面积为1 m2，壁面的两侧的温度分别为10℃，和100℃，则单位时间内流体与壁面传递的热量为多少？","options":["1350J","1450J","1550J","1650J"],"answer":["A"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"傅里叶导热公式 Q=λAΔt/δ=15×1×(100-10)/1=1350W。"},{"id":"basics_jc_0055","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"防止水锤的措施包括（ ）。","options":["截止阀慢开慢关，尽可能降低压力的冲击","对不宜慢开、慢关的阀门，可采用小流量旁通阀先开（或后关）旁通阀，再开（或先关）主管道上截止阀","对管道进行疏水","以上都是"],"answer":["D"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"防止水锤：截止阀慢开慢关、不宜慢开慢关的阀门设置旁路、管道充分疏水排气等措施都有效，故选\"以上都是\"。"},{"id":"basics_jc_0056","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"在水与水蒸汽的温熵图（T-s图）中饱和水线和干饱和蒸汽线下方的区域对应的状态是：（ ）。","options":["饱和水","湿饱和蒸汽","过热蒸汽","超临界水或超临界蒸汽"],"answer":["B"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"T-s图中饱和水线与干饱和蒸汽线之间的区域是湿饱和蒸汽（两相区）。"},{"id":"basics_jc_0057","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"反应堆功率正比于反应堆的（ ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量"],"answer":["B"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"反应堆功率正比于堆芯热中子平均通量密度（功率是全堆裂变率的总和，对应平均通量）。"},{"id":"basics_jc_0058","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"比焓h的定义式：（ ）。","options":["u+pv","s+pv","u+s","u+Ts"],"answer":["A"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"比焓定义式 h=u+pv（比内能加压力位能项）。"},{"id":"basics_jc_0059","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"以下选项中是影响对流传热系数的因素是（ ）。","options":["换热面的几何形状","流体有无相变","流体的比容","以上都是"],"answer":["D"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"影响对流传热系数的因素包括换热面几何形状、流体有无相变、流体物性（比容/密度等），故\"以上都是\"。"},{"id":"basics_jc_0060","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下面描述不正确的是( )","options":["控制材料是指中子吸收截面小的元素、合金或陶瓷等材料，它是反应堆实现可控和自持核裂变反应不可缺少的材料。人们利用它来对反应堆的反应性进行控制。","慢化材料是指其在与高能中子发生弹性碰撞中能有效地吸收中子能量，将核裂变时放出的快中子能量降到对裂变元素反应截面大的热中子水平的材料；","冷却剂是在反应堆一回路循环的载热流体。它的功能除了将核裂变能带出反应堆外，还有冷却堆内所有部件、携带流体可燃毒物(如硼酸)、携带除氧剂和调节pH的添加剂、事故工况下能迅速带走燃料发出的热量，避免堆芯烧毁等功能。"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"控制材料（硼、镉、银铟镉等）是中子吸收截面大的材料，用于补偿和控制反应性；慢化剂用于慢化中子；冷却剂带出堆芯热量。"},{"id":"basics_jc_0061","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电站的寿命取决于（ ）","options":["核燃料","结构材料","功能材料"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"核电站寿命主要取决于结构材料的老化（如压力容器辐照脆化、混凝土老化等），燃料可更换。"},{"id":"basics_jc_0062","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"拉伸实验时，试样拉断前所能承受的最大应力称为材料的 ( )。","options":["屈服强度","抗拉强度","弹性极限"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"拉伸试验中试样拉断前承受的最大应力是抗拉强度（强度极限σb）。"},{"id":"basics_jc_0063","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"中国核电，反应堆设计和建造采用的核电标准是（ ）等。","options":["ASME、RCC-M、CSA、ГОСТ","ASME、RCC-M、ГОСТ、JIS","ASME、RCC-M、JIS、CSA"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"中国核电反应堆设计和建造采用ASME、RCC-M等核电标准。"},{"id":"basics_jc_0064","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"PWR反应堆中，引起燃料裂变的中子主要是（ ）","options":["热中子","快中子","超热中子","缓发中子"],"answer":["A"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆中引发燃料裂变的中子主要是热中子（经慢化剂慢化至热能区）。"},{"id":"basics_jc_0065","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"中子与原子核的相互作用常用截面来度量，它实际上是中子与原子核发生某类核反应的（ ）","options":["面积","长度","体积","几率"],"answer":["D"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"微观截面表征中子与原子核发生某类核反应的几率（几何意义为等效面积，物理本质是几率度量）。"},{"id":"basics_jc_0066","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"U-235吸收热中子会产生（ ）","options":["只会发生裂变反应","只会发生辐射俘获反应","会发生裂变反应或辐射俘获反应","不确定"],"answer":["C"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"U-235吸收热中子后可能发生裂变反应，也可能发生辐射俘获反应（生成U-236），两者都存在。"},{"id":"basics_jc_0067","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下图为中子循环的基本过程，其中按顺序填写括号中的内容为（ ）。","options":["热中子、热中子、快中子、快中子","热中子、快中子、热中子、快中子","快中子、热中子、快中子、热中子","快中子、快中子、热中子、热中子"],"answer":["D"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"中子循环：裂变放出快中子→慢化剂慢化成热中子→热中子被燃料吸收再引发裂变；按图序为快中子、快中子、热中子（以题库标注为准）。"},{"id":"basics_jc_0068","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"反应堆功率正比于反应堆的（ ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量","快中子平均通量密度"],"answer":["B"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"反应堆功率正比于热中子平均通量密度。"},{"id":"basics_jc_0069","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核反应堆的反应性ρ=0，则表示该反应堆（ ）","options":["临界","超临界","次临界","无法判断"],"answer":["A"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"反应性ρ=0（即keff=1）时反应堆恰好临界，中子产生与消失平衡，功率维持不变。"},{"id":"basics_jc_0070","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"压水堆的自稳定性能是由（ ）实现的。","options":["调节控制棒","负温度系数反馈","A+B","正温度系数反馈"],"answer":["B"],"score":1.55,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆的自稳定性由燃料多普勒系数和慢化剂温度系数等负温度系数反馈实现：功率升高→温度升高→负反应性反馈→功率回落。"},{"id":"basics_jc_0071","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"一个质量为1kg的Sr-90的半衰期为25小时，另外一个质量为mCo的Co-60的半衰期为6小时，两个碎片的放射性活度一样，则另外一片Co-60的质量为（ ）。","options":["mCo =0.16kg","mCo =0.238kg","mCo =0.25kg","mCo =1kg"],"answer":["A"],"score":1.73,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"活度 A=λN∝(m/M)/T½。活度相等：m_Sr/(M_Sr·T_Sr)=m_Co/(M_Co·T_Co)，代入 Sr-90（M≈90，T½=25h）、Co-60（M≈59，T½=6h，注意Co半衰期此处按题设6h计算）得 mCo≈0.16kg。"},{"id":"basics_jc_0072","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"游离过程大于去游离过程，电弧将持续燃烧；游离过程小于去游离过程，电弧将最终熄灭。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。游离（电离）过程强于去游离（复合）过程时电弧持续燃烧；去游离占优则电弧最终熄灭。"},{"id":"basics_jc_0073","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"发电机逆功率保护的目标是发电机定子。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。逆功率保护的目标是保护汽轮机（防止主汽门关闭后发电机变为电动机运行、汽轮机叶片鼓风过热），不是发电机定子。"},{"id":"basics_jc_0074","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电压互感器为二次设备。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。互感器一次侧接于一次高压回路，是连接一次与二次回路的元件，其本体不属于二次设备。"},{"id":"basics_jc_0075","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电流互感器二次侧禁止短路，电压互感器二次侧禁止开路。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。正好说反：电流互感器二次侧禁止开路（会产生高压），电压互感器二次侧禁止短路（会产生大电流）。"},{"id":"basics_jc_0076","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反时限过电流保护的特点是当通过保护装置的电流越大，保护动作时间越长。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。反时限过电流保护的特点是电流越大、动作时间越短。"},{"id":"basics_jc_0077","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电力系统主要是由电源、输配电和用户等环节组成的电能生产与消费的系统。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。电力系统由电源（发电）、输配电网络和用户（用电）等环节组成电能生产与消费系统。"},{"id":"basics_jc_0078","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"变压器能改变电压大小和频率。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。变压器只能改变电压（和电流）的大小，不能改变频率，频率由原动机转速决定。"},{"id":"basics_jc_0079","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"电力系统故障时，仅距故障点最近的保护装置动作，将故障元件从电力系统中切除，体现的是继电保护的灵敏性。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。仅由距故障点最近的保护动作切除故障，体现的是继电保护的选择性，不是灵敏性。"},{"id":"basics_jc_0080","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"用余热排出系统维持反应堆冷却剂系统温度时，冷却剂温度不能超过160℃。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。余热排出系统运行时一回路温度上限通常为180℃（投入下限约160℃），并非不能超过160℃。"},{"id":"basics_jc_0081","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"压水堆核电厂运行有汽轮机快速降负荷功能。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。压水堆核电厂具有汽轮机快速降负荷（甩负荷）功能，配合蒸汽排放系统实现。"},{"id":"basics_jc_0082","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"沸水堆二回路介质没有放射性。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。沸水堆的蒸汽直接在堆芯产生并进入汽轮机，汽轮机侧介质带有放射性。"},{"id":"basics_jc_0083","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"α粒子没有静止质量，不带电荷，穿透力很强。应选择具有较大原子量的物质来屏蔽，比如铅板。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。该描述的是γ射线（无静止质量、不带电、穿透强、用铅等重物质屏蔽）；α粒子有质量、带正电、穿透力弱，一张纸即可屏蔽。"},{"id":"basics_jc_0084","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"国家核安全局对全国核设施安全实施统一监督，独立行使核安全监督权。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。国家核安全局（NNSA）对全国核设施安全实施统一监督，独立行使核安全监督权。"},{"id":"basics_jc_0085","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反应堆停闭后，堆芯不再有热量，可以立即停止冷却。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。停堆后堆芯仍有衰变热（余热），必须持续冷却，否则会烧毁燃料。"},{"id":"basics_jc_0086","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"高温气冷堆核电站发电效率比压水堆核电站高。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。高温气冷堆氦气出口温度高（可达700~950℃），发电效率高于压水堆。"},{"id":"basics_jc_0087","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"稀有事件所产生的放射性污染会导致停止或者限制使用隔离半径以外的公用地区，失去冷却剂系统或安全壳屏蔽的功能。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。稀有事件的放射性后果较小，不至于导致隔离半径外公用地区停止使用；题中描述的是更严重事故（极限事故）的后果。"},{"id":"basics_jc_0088","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂准备启动时，必须至少有一台反应堆冷却剂泵或余热排出系统处于运行状态，才能开始稀释反应堆冷却剂的硼浓度。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。稀释硼浓度前必须至少有一台主泵或余热排出系统运行，保证硼充分混合、避免局部低硼。"},{"id":"basics_jc_0089","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"我国总的核安全目标为：在核动力厂中建立并保持对放射性危害的有效防御，以保护人员、社会和环境免受危害。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。这是我国总的核安全目标：建立并保持对放射性危害的有效防御，保护人员、社会和环境。"},{"id":"basics_jc_0090","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"重水堆的慢化剂是重水。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。重水堆（如CANDU）以重水作慢化剂（重水吸收中子少，可用天然铀）。"},{"id":"basics_jc_0091","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"我国的核安全法规体系中，第一层次是国务院行政法规。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。我国核安全法规体系第一层次是国家法律（如《核安全法》），第二层次才是国务院行政法规。"},{"id":"basics_jc_0092","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"技术规格书是机组正常运行时所必须遵守的技术条件，任何对技术规格书的偏离，甚至是暂时的偏离都必须得到国家核安全局(NNSA)的批准。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。技术规格书是运行必须遵守的技术条件，任何偏离（包括暂时偏离）都必须得到国家核安全局批准。"},{"id":"basics_jc_0093","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂绝大多数使用过饱和蒸汽","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。压水堆核电厂绝大多数使用饱和蒸汽（蒸汽发生器产生的是饱和蒸汽，只带少量湿度）。"},{"id":"basics_jc_0094","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"快堆最大的特点是核燃料增殖。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。快堆最大的特点是核燃料增殖：快中子使U-238转变为Pu-239，可实现燃料增殖。"},{"id":"basics_jc_0095","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"技术规格书中监测要求部分与运行限制条件部分条数相同，即一条运行限制条件规范紧跟一条监测要求的形式。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。技术规格书中每条运行限制条件（LCO）都紧跟相应的监测要求（SR）。"},{"id":"basics_jc_0096","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"安全系统整定值是各种自动保护装置的触发点，它触发保护动作，以防止超过安全限值，并应付超设计基准事故。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。安全系统整定值用于防止超过安全限值，应对的是设计基准事故范围，并非超设计基准事故。"},{"id":"basics_jc_0097","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"轻核聚变的特点是不产生放射性。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。轻核聚变反应产物主要是氦核，反应本身不产生裂变产物那样的放射性（活化产物可控制）。"},{"id":"basics_jc_0098","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂棒控系统设计中，能够满足负荷变化率 ≤ ± 5%/min的负荷线性变化。","options":null,"answer":["正确"],"score":1.24,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。棒控系统设计能满足负荷线性变化率≤±5%/min的要求。"},{"id":"basics_jc_0099","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"当在各种运行模式或所指定的其他工况下，对技术规格书中运行限制条件的规定都要求遵从，如果不能满足其中的规定，则必须满足其相应的动作的要求。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。不满足运行限制条件时必须执行相应的动作（Action）要求，这是技术规格书的基本逻辑。"},{"id":"basics_jc_0100","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"汽轮发电机组通过汽轮机调节系统实现机组转速和负荷调节。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。汽轮发电机组通过汽轮机调节系统（DEH）实现转速和负荷调节。"},{"id":"basics_jc_0101","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂仪表与控制系统的功能可以归纳为三种：即监视功能、控制功能和保护功能。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。仪控系统三大功能：监视（测量显示）功能、控制功能、保护功能。"},{"id":"basics_jc_0102","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"流体流经节流装置时遵循伯努力方程。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。流体流经节流装置遵循伯努利方程（能量守恒），部分动能转为压力能形成差压。"},{"id":"basics_jc_0103","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"远程停堆站属于主控制室设备。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。远程（备用）停堆站是主控制室不可用时使用的独立设施，不属于主控制室设备。"},{"id":"basics_jc_0104","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"所谓控制就是为了达到一定的目的，对生产过程的设备进行控制操作，使其满足生产过程要求。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。控制就是为达到一定目的对生产过程设备进行操作，使其满足生产要求。"},{"id":"basics_jc_0105","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"控制对象：被控制的设备或生产过程为控制对象或被控制过程。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。被控制的设备或生产过程称为控制对象（被控对象/被控过程）。"},{"id":"basics_jc_0106","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"按安全等级划分，DCS系统设备可以分为安全级设备和非安全级设备。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。按安全等级DCS设备分为安全级（1E级）设备和非安全级设备。"},{"id":"basics_jc_0107","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"蒸汽排放控制系统只有一种模式，即蒸汽压力控制模式。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。蒸汽排放控制系统（GCT）有蒸汽压力控制模式、温度控制模式等多种模式，不止一种。"},{"id":"basics_jc_0108","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"压力容器的设计必须满足强度、刚度、稳定度、耐久性、密封性等要求。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。压力容器设计必须满足强度、刚度、稳定性、耐久性和密封性等要求。"},{"id":"basics_jc_0109","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"离心泵一般用电动机带动,在启动前无需向壳内灌满被输送的液体。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。离心泵启动前必须向泵壳内灌满被输送液体（灌泵），否则抽不上液且会损坏密封。"},{"id":"basics_jc_0110","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"离心通风机的启动顺序: 1)关好风机进出口调节阀；2)启动通风机；3)启动润滑油泵；4)启动冷却水泵，打开冷却水阀；5)打开入口调节阀使通风流量达到运行要求的参数。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。正确顺序是先启动润滑油泵、冷却水泵，最后启动风机；题中顺序颠倒。"},{"id":"basics_jc_0111","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"标准型号的阀门，其设计、制造、试验、验收等有相应的标准、规范作出详细的规定。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。标准型号阀门的设计、制造、试验、验收都有相应标准规范详细规定。"},{"id":"basics_jc_0112","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"止回阀属于驱动型阀门。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。止回阀靠介质自身流动自动动作，属于自动型阀门。"},{"id":"basics_jc_0113","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"一般轴流式通风机叶轮安装在圆筒形机壳中,且叶轮所在轴与电动机轴通过联轴器连接。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。轴流通风机叶轮一般与电动机轴直接连接（直联）或经传动装置连接，并非都通过联轴器连接。"},{"id":"basics_jc_0114","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"汽轮机冲转前后停机后，要使转子连续转动一段时间，以保证转子均匀受热和冷却。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。汽轮机冲转前后和停机后通过盘车使转子连续转动，保证转子均匀受热和冷却、防止弯曲。"},{"id":"basics_jc_0115","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反应堆压力容器是核电厂最重要的压力容器之一。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。反应堆压力容器是核电厂最重要的大型压力容器，包容堆芯燃料。"},{"id":"basics_jc_0116","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"AP1000型压水堆和CANDU重水堆在一回路冷却剂启动期间采用添加氢气的方式来实现化学除氧。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。AP1000和CANDU在一回路启动期间均采用添加氢气的方式实现化学除氧（抑制氧腐蚀）。"},{"id":"basics_jc_0117","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺、混合胺不同发展阶段。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。二回路pH控制剂经历了磷酸盐处理、氨水、有机胺（吗啉等）、混合胺等发展阶段。"},{"id":"basics_jc_0118","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"压水堆和重水堆一回路系统设备的主要材料均为锆合金、镍基合金和不锈钢等，为了控制腐蚀，都需要将系统介质的pH值控制在合适的碱性范围内。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。压水堆和重水堆一回路主要材料均为锆合金、镍基合金、不锈钢等，都需将pH控制在合适碱性范围以控制腐蚀。"},{"id":"basics_jc_0119","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"VVER机组中，氨对降低一回路结构材料和燃料包壳表面的沉积物有利，氨可以络合四氧化三铁形成可溶的铁氨络合物，经净化系统将铁去除。","options":null,"answer":["正确"],"score":0.31,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。VVER机组中氨可络合四氧化三铁形成可溶性铁氨络合物，经净化系统除铁，减少沉积。"},{"id":"basics_jc_0120","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"辐射效应发生概率与受照剂量呈正比，剂量越大，危险性越高。无阈值为确定性效应，有阈值为随机性效应。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。说反了：无阈值的是随机性效应（概率随剂量增加），有阈值的是确定性效应。"},{"id":"basics_jc_0121","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"17N、 19O、 18F 和 14C 均属于压水堆堆芯的裂变产物。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。N-17、O-19、F-18、C-14是中子活化产物（活化腐蚀产物/活化核素），不是裂变产物。"},{"id":"basics_jc_0122","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"放射性废液排放前，首先应对排出物混匀，然后采取样品进行测量，测量达标后即可连续排放，不需要额外监测手段。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。废液排放除混匀取样测量达标外，还必须有排放连续监测等额外监测手段，确保受控排放。"},{"id":"basics_jc_0123","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"不稳定的原子核自发地放射出 α、β、γ 等各种射线的现象称为放射性，按原子核是否稳定，可把核素分为稳定性核素和放射性核素两类。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。不稳定的原子核自发放出α、β、γ射线的现象称为放射性；核素分为稳定性核素和放射性核素。"},{"id":"basics_jc_0124","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"单相流体的流动压降组成有：摩擦压降、提升压降和加速度压降。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。单相流体流动压降由摩擦压降、提升（重位）压降和加速压降组成。"},{"id":"basics_jc_0125","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"卡诺循环是一切热机循环效率最高的热力循环。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。卡诺循环是由两个等温过程和两个绝热过程组成的理想循环，是一切热机中效率最高的热力循环。"},{"id":"basics_jc_0126","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"固体导热遵循傅里叶定律。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。固体导热遵循傅里叶定律（导热速率与温度梯度和导热系数成正比）。"},{"id":"basics_jc_0127","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"自然循环是指在闭合回路内依靠热段（上行段）和冷段（下行段）的流体密度差所产生的驱动压头来实现的流动循环。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。自然循环依靠回路中热段与冷段流体密度差形成的驱动压头实现循环，无需泵驱动。"},{"id":"basics_jc_0128","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"对流传热由热传导和热对流组成。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。对流传热是热传导与热对流两种机理共同作用的结果。"},{"id":"basics_jc_0129","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"工质的热力学参数包括温度、压力、比体积、比内能、比焓、比熵。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。工质的热力学状态参数（比参数）包括温度、压力、比体积、比内能、比焓、比熵。"},{"id":"basics_jc_0130","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"对流传热遵循牛顿冷却定律。","options":null,"answer":["正确"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。对流传热遵循牛顿冷却定律 q=h·Δt。"},{"id":"basics_jc_0131","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"再热循环一定能够提高热力循环效率。","options":null,"answer":["错误"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。再热循环不一定提高热效率，再热的主要目的是降低汽轮机末级排汽湿度；只有再热温度选择合适时才可能提高效率。"},{"id":"basics_jc_0132","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"DNBR是指实际热流密度与临界热流密度之比。","options":null,"answer":["错误"],"score":0.93,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。DNBR是临界热流密度与实际（局部）热流密度之比（大于1为安全裕量指标），题中说反。"},{"id":"basics_jc_0133","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"一般来说，硬度高的材料其强度也较高。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。一般硬度高的材料强度也较高（如淬火钢），但塑韧性往往下降。"},{"id":"basics_jc_0134","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"低碳钢的强度、硬度较低，但塑性、韧性及焊接性能较好。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。低碳钢强度硬度较低，但塑性、韧性和焊接性能好。"},{"id":"basics_jc_0135","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂可以参考国家的法规标准要求，对核岛以及常规岛相关承压部件进行定期无损检测，发现使用中出现的缺陷。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。核电厂核岛承压部件的定期无损检测必须按国家核安全局批准的规范和程序执行，不能仅\"参考\"一般法规标准自行安排。"},{"id":"basics_jc_0136","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"金属是指单一元素构成的具有特殊的光泽延展性导电性导热性的物质。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。金属是具有特殊光泽、良好延展性、导电性和导热性的物质（含合金）。"},{"id":"basics_jc_0137","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"如果中子和靶核发生某类反应的微观截面为σ，靶核的核子密度为N，那么中子和靶核发生该反应的宏观截面为 Nσ 。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。宏观截面Σ=Nσ（核子密度乘以微观截面），单位是1/m。"},{"id":"basics_jc_0138","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"中子核反应微观截面的大小和中子能量无关。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。微观截面大小与中子能量密切相关（截面随中子能量变化很大，如1/v规律）。"},{"id":"basics_jc_0139","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"放射性核素的衰变速率和物理化学环境无关。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。放射性衰变是原子核固有特性，衰变速率只取决于核素种类，与温度、压力、化学状态等物理化学环境无关。"},{"id":"basics_jc_0140","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"快中子不能引起U-238的裂变。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。快中子（能量超过约1MeV阈值）可以引起U-238裂变（快裂变）。"},{"id":"basics_jc_0141","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"功率亏损指的是功率因为一些因素而减小了。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。功率亏损指反应堆功率升高时由于多普勒效应和慢化剂温度效应引入的负反应性损失（从满功率到零功率所需补偿的反应性），不是功率减小。"},{"id":"basics_jc_0142","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"反应堆的有效增值因数keff=中子的产生率/中子的吸收率。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。keff=中子产生率/中子消失率（消失=吸收+泄漏），题中漏掉了泄漏项。"},{"id":"basics_jc_0143","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"PWR常用的单位是MW/tU。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。功率的常用单位是W（MWt/MWe）；MW/tU实际是比功率单位，题干以题库标注为错误，注意区分功率与比功率的单位。"},{"id":"basics_jc_0144","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"热中子是指温度非常高的中子。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。热中子指与周围介质达到热平衡的中子（室温下能量约0.025eV），不是温度高的中子。"},{"id":"basics_th_0001","module":"basics","bank":"热工水力学","type":"judge","stem":"对流传热遵循牛顿冷却定律。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。对流传热遵循牛顿冷却定律 q=h·Δt（热流量与传热系数和温差成正比）。"},{"id":"basics_th_0002","module":"basics","bank":"热工水力学","type":"judge","stem":"固体导热遵循傅里叶定律。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。固体导热遵循傅里叶定律，导热量与温度梯度、导热系数成正比。"},{"id":"basics_th_0006","module":"basics","bank":"热工水力学","type":"single","stem":"反应堆功率正比于反应堆的（     ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"反应堆功率正比于堆芯热中子平均通量密度（功率对应全堆平均裂变率）。"},{"id":"basics_th_0007","module":"basics","bank":"热工水力学","type":"single","stem":"防止水锤的措施包括（     ）。","options":["截止阀慢开慢关，尽可能降低压力的冲击","对不宜慢开、慢关的阀门，可采用小流量旁通阀先开（或后关）旁通阀，再开（或先关）主管道上截止阀","对管道进行疏水","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"防止水锤的措施：截止阀慢开慢关、不宜慢动的阀门设旁路、管道充分疏水等都有效，故选以上都是。"},{"id":"basics_th_0008","module":"basics","bank":"热工水力学","type":"single","stem":"以下选项中是影响对流传热系数的因素是（     ）。","options":["换热面的几何形状","流体有无相变","流体的比容","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"换热面几何形状、流体有无相变、流体物性（含比容）都影响对流传热系数，故选以上都是。"},{"id":"basics_th_0009","module":"basics","bank":"热工水力学","type":"single","stem":"比焓h的定义式：（     ）。","options":["u+pv","s+pv","u+s","u+Ts"],"answer":["A"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"比焓定义式为 h=u+pv（比内能加压力比功项）。"},{"id":"basics_th_0010","module":"basics","bank":"热工水力学","type":"single","stem":"在水与水蒸汽的温熵图（T-s图）中饱和水线和干饱和蒸汽线下方的区域对应的状态是：（     ）。","options":["饱和水","湿饱和蒸汽","过热蒸汽","超临界水或超临界蒸汽"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"T-s图中饱和水线与干饱和蒸汽线之间的区域为湿饱和蒸汽区（汽液两相共存）。"},{"id":"basics_th_0011","module":"basics","bank":"热工水力学","type":"single","stem":"已知流体与壁面的对流传热系数为15W/（m2·℃），传热面积为10m2，流体的温度为10℃，壁面的温度为200℃，则单位时间内流体与壁面传递的热量为多少？","options":["29500J","28500J","27500J","26500J"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"牛顿冷却公式 Q=hAΔt=15×10×(200−10)=28500W，即每秒28500J。"},{"id":"basics_th_0012","module":"basics","bank":"热工水力学","type":"single","stem":"已知壁面的导热系数为15W/（m·℃），壁面厚度为1m，面积为1 m2，壁面的两侧的温度分别为10℃，和100℃，则单位时间内流体与壁面传递的热量为多少？","options":["1350J","1450J","1550J","1650J"],"answer":["A"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"傅里叶公式 Q=λAΔt/δ=15×1×(100−10)/1=1350W。"},{"id":"basics_th_0013","module":"basics","bank":"热工水力学","type":"multi","stem":"一定能够提高循环热效率的途径有：(      ).","options":["采取再热循环","采取回热循环","提高主蒸汽初温","提高主蒸汽初压"],"answer":["B","C","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"回热循环、提高主蒸汽初温、提高初压都能提高循环热效率；单独采用再热循环不一定提高效率（再热主要防止末级蒸汽湿度过高），故选BCD。"},{"id":"basics_th_0014","module":"basics","bank":"热工水力学","type":"multi","stem":"从燃料到冷却剂的传热过程包括：(     )。","options":["冷却剂的输热","燃料元件的导热","气隙传热","包壳导热"],"answer":["B","C","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"燃料到冷却剂的传热依次为：燃料芯块导热、气隙传热、包壳导热，之后是冷却剂的输热（对流换热带走），故选BCD（冷却剂输热属于对流输出环节，不计入\"到冷却剂\"的固体传热链）。"},{"id":"basics_th_0015","module":"basics","bank":"热工水力学","type":"multi","stem":"反应堆裂变能的释放形式有（      ）。","options":["X射线的能量","γ射线的能量","β射线的能量","α射线的能量"],"answer":["B","C"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"裂变能释放形式主要是裂变碎片的动能、裂变中子动能和γ射线（瞬发γ+衰变γ）能量以及β射线能量；α射线和X射线不是裂变能的主要形式，故选BC。"},{"id":"basics_th_0016","module":"basics","bank":"热工水力学","type":"multi","stem":"在均匀裸堆内径向热流密度分布与轴向热流密度分布分别为（      ）。","options":["截尾的零阶贝塞尔函数分布","截尾的一阶贝塞尔函数分布","截尾的正弦函数分布","截尾的余弦函数分布"],"answer":["A","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"均匀裸堆内径向热流密度服从截尾的零阶贝塞尔函数分布，轴向服从截尾的余弦函数分布，故选AD。"},{"id":"basics_th_0017","module":"basics","bank":"热工水力学","type":"multi","stem":"影响临界热流密度的因素有（     ）","options":["质量流速","工作压力","通道进口处水的欠热度","流体的传热系数"],"answer":["A","B","C"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"影响临界热流密度（CHF）的因素包括质量流速、工作压力、进口欠热度等；流体传热系数不是CHF的影响因素，故选ABC。"},{"id":"basics_th_0018","module":"basics","bank":"热工水力学","type":"judge","stem":"卡诺循环是一切热机循环效率最高的热力循环。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。卡诺循环由两个等温过程和两个绝热过程组成，是同温限下效率最高的理想热力循环。"},{"id":"basics_th_0019","module":"basics","bank":"热工水力学","type":"judge","stem":"饱和温度随饱和压力增大而增大。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。饱和温度随饱和压力升高而升高（水汽化性质，如100℃对应0.1MPa）。"},{"id":"basics_th_0020","module":"basics","bank":"热工水力学","type":"judge","stem":"对流传热由热传导和热对流组成。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。对流传热是热传导与热对流两种机理的综合作用。"},{"id":"basics_th_0021","module":"basics","bank":"热工水力学","type":"judge","stem":"DNBR是指实际热流密度与临界热流密度之比。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"错误。DNBR是临界热流密度与实际热流密度之比（大于1表示有裕量），题中说反了。"},{"id":"basics_th_0022","module":"basics","bank":"热工水力学","type":"judge","stem":"工质的热力学参数包括温度、压力、比体积、比内能、比焓、比熵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。工质的热力学（状态）参数包括温度、压力、比体积、比内能、比焓、比熵。"},{"id":"basics_th_0023","module":"basics","bank":"热工水力学","type":"judge","stem":"再热循环一定能够提高热力循环效率。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"错误。再热循环不一定提高热效率，只有再热温度等参数选择合适才可能提高；其主要目的是降低末级排汽湿度。"},{"id":"basics_th_0024","module":"basics","bank":"热工水力学","type":"judge","stem":"自然循环是指在闭合回路内依靠热段（上行段）和冷段（下行段）的流体密度差所产生的驱动压头来实现的流动循环。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。自然循环依靠闭合回路中热段与冷段流体密度差形成的驱动压头实现，无需泵驱动。"},{"id":"basics_th_0025","module":"basics","bank":"热工水力学","type":"judge","stem":"单相流体的流动压降组成有：摩擦压降、提升压降和加速度压降。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"正确。单相流压降由摩擦压降、提升（重位）压降和加速压降三部分组成。"},{"id":"safety_zb_0001","module":"safety","bank":"保护区安全准入","type":"single","stem":"独立验证验证人（组）验证设备的状态（或配置）与（ ）的一致。","options":["程序要求","执行人（组）通知","经验反馈","配置管理要求"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"独立验证是验证人将设备实际状态与程序（规程）要求进行核对确认，确保与文件要求一致。"},{"id":"safety_zb_0002","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下情况下（ ）可以使用独立验证的工具，来防止人因失误。","options":["设备维修后投用前","安全相关设备或重要设备及系统的配置","安装重要设备或系统的隔离牌/锁时","其它选项都可以"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"设备维修后投用前、安全相关/重要设备及系统的配置确认、安装隔离牌锁等场合都可使用独立验证防止人因失误，故选\"其它选项都可以\"。"},{"id":"safety_zb_0003","module":"safety","bank":"保护区安全准入","type":"single","stem":"在口头交流中，信息最少需要通过（ ）次交换可确保信息有效传达。","options":["0次","1次","2次","3次"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"口头交流（三向交流）中信息至少需通过3次交换：发送方发出→接收方复述→发送方确认，确保信息有效传达。"},{"id":"safety_zb_0004","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下各项中，哪项是使用自检工具的主要目的。（ ）","options":["强化工作态度","减少失误频率","提高交流水平","消除外界干扰"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"自检（STAR）的主要目的是通过停思行审减少执行过程中的失误频率。"},{"id":"safety_zb_0005","module":"safety","bank":"保护区安全准入","type":"single","stem":"'STAR'中的Review（审）主要是确认实际的响应结果与（ ）是否相符。","options":["预期","想象","最初"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"STAR中的Review（审）是确认实际行动结果与预期是否相符。"},{"id":"safety_zb_0006","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下属于监护的主要目的是（ ）。","options":["预防监护人失误","预防执行过程中的失误","纠正错误","其它选项全是"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"监护的主要目的是预防执行过程中执行人发生失误，监护人全程观察并及时纠正。"},{"id":"safety_zb_0007","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用独立验证工具时，应避免出现下列情况（ ）。","options":["在执行组采取行动期间，验证组距离执行组非常近","执行组尚未完成所有操作即开始进行独立验证","在执行验证前，执行组告诉验证组已经做了什么，哪些没做","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"独立验证应避免：执行组行动期间打扰、执行组未完成全部操作就验证、验证前不告知等，都是不当做法，故选\"其它选项都是\"。"},{"id":"safety_zb_0008","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用三向交流工具过程中，当接收方接收信息滞后或复述有错误时，发送方应该怎么做（ ）。","options":["要求接收方再复述或重述信息一次","告诉接收方'信息是错误的'，并要求重述原始信息","通过接收方所使用交流方式进行反馈"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"三向交流中接收方复述有误时，发送方应告知\"信息是错误的\"并要求重新复述，直至准确。"},{"id":"safety_zb_0009","module":"safety","bank":"保护区安全准入","type":"single","stem":"核电厂屏障分为（ ）、个人屏障、管理屏障、组织屏障四个层 gle","stem":"为什么使用三向交流工具。（ ）","options":["为给所有工作相关人员发表意见的机会","为在一次交流中传递多项指示","为保证信息接收方收到的信息和发送方的意图是一致的"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"使用三向交流是为保证信息接收方收到的信息与发送方意图一致，防止误解。"},{"id":"safety_zb_0023","module":"safety","bank":"保护区安全准入","type":"single","stem":"中国大陆的第一座核电站是（ ）。","options":["秦山核电站","大亚湾核电站","石岛湾核电站","海阳核电站"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"秦山核电站是我国大陆第一座核电站（1991年并网发电）。"},{"id":"safety_zb_0024","module":"safety","bank":"保护区安全准入","type":"single","stem":"错误的人工物料搬运动作可能导致的伤害不包括（ ）。","options":["手指被卡在手推车和其他物体之间","听力损伤","肩部肌肉受损","物品倾翻伤人"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误搬运可导致卡伤、肩部肌肉受损、物品倾翻伤人等，但不会造成听力损伤。"},{"id":"safety_zb_0025","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于运行处的职责？（ ）","options":["操作设备","批准设备检修工单","批准大多数核电厂的操作","反应堆功率控制"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"批准设备检修工单是维修或计划部门的职责，不属于运行处职责。"},{"id":"safety_zb_0026","module":"safety","bank":"保护区安全准入","type":"single","stem":"我国秦山第三核电厂建设两台（ ）核电机组。","options":["重水堆（PHWR）","沸水堆","高温气冷堆","快堆"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"秦山第三核电厂建设两台重水堆（CANDU PHWR）机组。"},{"id":"safety_zb_0027","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪种行为与'秉承质疑的态度'的核安全文化相悖？（）","options":["进行现场工作时，发现前一天设置的安全围栏被移动过，小张立即致电主管咨询有无异常情况；","大修期间，小李中班巡检至常规岛厂房汽轮机平台时，发现射线探伤标识牌，但交接班时并未得到通知有探伤工作，于是暂停巡检，致电主控室询问；","小王在执行现场操作单时，发现单子上有两个步骤上的编号手动涂改过，决定询问主管后再实施；","小张进行设备送电前的外观检查工作时，发现设备周围搭设有脚手架，但觉得不影响送电，于是没有报告主控室；"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"质疑的态度要求对异常状态保持疑问；进行设备送电前的外表检查等不经质疑直接操作的行为与之相悖。"},{"id":"safety_zb_0028","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪种行为与'核安全人人有责'的核安全文化相悖？（ ）","options":["设备检修后一项再鉴定指标偏差微乎其微，但工作负责人就是不签字认可；","发现工作现场的安全隐患，及时汇报处理；","安排好的培训临时有事去不了，找人代签到；","小张发现有人在电气厂房抽烟，马上进行了制止并向主管进行汇报。"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"核安全人人有责：安排好的培训因事不去参加（放弃学习责任）与该原则相悖。"},{"id":"safety_zb_0029","module":"safety","bank":"保护区安全准入","type":"single","stem":"听到应急广播后应采取的行动不包括（ ）。","options":["将正在运行的设备或和正在进行的工作置于安全状态","根据电厂程序护送所有的访问者到安全位置","赶快打电话通知家人","如果你在辐射控制区，除被特别告知的情况，都要按正常情况时的流程步骤离开"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"听到应急广播后应按指令行动，不应打电话通知家人（占用应急资源、延误撤离）。"},{"id":"safety_zb_0030","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于保卫处的职责？（ ）","options":["控制重要区域的人员进入","分发通行证","负责基本安全培训","负责厂区交通管理"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"基本安全培训由培训部门负责，不属于保卫处职责。"},{"id":"safety_zb_0031","module":"safety","bank":"保护区安全准入","type":"single","stem":"当有两个或两个以上人员进行人工搬运物料时，以下说法错误的是（ ）。","options":["尽量使用不同侧的肩膀搬运材料","注意周围的人员及物料动态","应协商指定专人负责指挥和协调物料搬运活动","搬运人员应前后一个接一个行走"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"多人搬运时应尽量使用同侧肩膀、统一口令行动（而不是不同侧），\"使用不同侧肩膀\"说法错误。"},{"id":"safety_zb_0032","module":"safety","bank":"保护区安全准入","type":"single","stem":"你休息时间正在和家人一起吃饭，并喝了一瓶葡萄酒，这时接到了来自主管的电话，要求你现在到现场来处理一下主给水泵电机端渗油问题，你的回答应该是：（ ）","options":["好的，我就过来","我过几个小时就能到","我刚喝了一瓶葡萄酒，所以我不能前往现场工作","我现在开车过来"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"饮酒后不得进入现场执行工作，应如实告知主管喝了酒，由主管另行安排人员。"},{"id":"safety_zb_0033","module":"safety","bank":"保护区安全准入","type":"single","stem":"小李是正在进行岗位培训的实习现场操作员，在经过汽轮机厂房时发现地面上有水，于是询问他的主管这是否正常。请问小李正确演示了哪项核安全基本原则？（ ）","options":["秉持质疑的态度","践行学习型组织","领导做安全的表率","建立组织内部的高度信任"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"实习生发现异常主动询问\"这是否正常\"，体现了秉持质疑的态度。"},{"id":"safety_zb_0034","module":"safety","bank":"保护区安全准入","type":"single","stem":"下面哪项材料是不属于系统或设备组成部分的'异物'？（）","options":["固定设备用的地脚螺栓","联轴器连接螺丝","破碎的清洁布","电机接线盒"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"地脚螺栓、联轴器螺丝、电机接线盒属于设备组成部件；破碎的清洁布是外来异物。"},{"id":"safety_zb_0035","module":"safety","bank":"保护区安全准入","type":"single","stem":"疲劳对人体的影响不包括：（ ）","options":["精神亢奋","失眠、入睡困难","感官系统异常，眼睛干涩、视物模糊","耳鸣、耳聋等"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"疲劳导致困倦、失眠、感官异常等，不会导致精神亢奋。"},{"id":"safety_zb_0036","module":"safety","bank":"保护区安全准入","type":"single","stem":"岗位工作适任性的影响因素不包括：（ ）。","options":["身体健康","心理健康","酒精、药物、食物","工资收入"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"岗位适任性受身体健康、心理健康、酒精药物等因素影响，与工资收入无关。"},{"id":"safety_zb_0037","module":"safety","bank":"保护区安全准入","type":"single","stem":"操作机械或高处作业等人员工作期间不宜使用的药物不包括:（ ）。","options":["可引起嗜睡的药物","可出现眩晕或幻觉的药物","可使视物模糊或辨色困难的药物","复合维生素"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"复合维生素不影响作业安全；嗜睡、眩晕幻觉、视物模糊类药物工作期间不宜使用。"},{"id":"safety_zb_0038","module":"safety","bank":"保护区安全准入","type":"single","stem":"作为主管，你工作组的某位成员近期频繁请假早退，你应如何回应该人员：（ ）","options":["当然可以。按照请假流程审批即可","尝试想了解具体的情况，但觉得侵犯了别人的隐私","询问是否需要员工心理援助项目（EAP）提供帮助","不闻不问"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"作为主管应关心员工状态，尝试了解情况并提供员工心理援助等支持。"},{"id":"safety_zb_0039","module":"safety","bank":"保护区安全准入","type":"single","stem":"直接推动汽轮发电机组发电的是（ ）。","options":["蒸汽","高温高压的水","压缩空气","原子能"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"直接推动汽轮发电机组旋转发电的是蒸汽（蒸汽热能→机械能→电能）。"},{"id":"safety_zb_0040","module":"safety","bank":"保护区安全准入","type":"single","stem":"搬运物料时，应保持（ ）的自然挺直，利用腿部肌肉发力抬起物体。","options":["手臂","腰部","脖子","小腿"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"搬运物料应保持腰部自然挺直，屈膝利用腿部肌肉发力，防止腰部损伤。"},{"id":"safety_zb_0041","module":"safety","bank":"保护区安全准入","type":"single","stem":"下列哪个物项可以作为防异物装置（ ）。","options":["橡胶手套","厚纸板","透明塑料布","设备人孔盖版"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation" safety","bank":"保护区安全准入","type":"single","stem":"面对火灾，以下哪项逃生方法是错误的（ ）？","options":["选择逃生通道自救","结绳下滑自救","向外界求救","乘坐电梯逃生"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"火灾时严禁乘坐电梯逃生（断电被困危险）。"},{"id":"safety_zb_0064","module":"safety","bank":"保护区安全准入","type":"single","stem":"A类火灾是指（ ）。","options":["固体火灾","气体火灾","液体火灾"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"A类火灾指固体物质火灾；B类液体/可熔化固体、C类气体、E类电气。"},{"id":"safety_zb_0065","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假措施描述不正确的是：（ ）。","options":["制定质量计划责任人员及焊接、无损检验等关键工艺责任人员签字备案制度，必要时对签字真实性进行抽验是防造假的重点措施之一；","防控造假必须完善质量奖惩机制，制定举报人保护和奖励制度；","对于恶意违规、弄虚作假的员工要采用通报批评、经济处罚、下岗或解除劳动合同等方式进行惩处；","强化合同管控要求，震慑不良承包商和防控弄虚作假无关。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"防控造假必须完善质量奖惩……\"项与防造假措施表述不符（防造假靠制度监督与诚信文化，不是奖励导向），题库标注该项不正确。"},{"id":"safety_zb_0066","module":"safety","bank":"保护区安全准入","type":"single","stem":"影响质量的因素可概括为人、机、料、法、环、测六个方面，其中（ ）是最活跃的因素，也是最关键的因素之一。","options":["法；","机；","料；","人。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"人机料法环测六要素中，人是最活跃、最关键的因素。"},{"id":"safety_zb_0067","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于采购不符合项的处理方案（ ）。","options":["修理；","返工；","不作改进的接收（照用）；","第三方检验。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"采购不符合项处理方案有修理、返工、照用（不作改进的接收）等；第三方检验不是处理方案。"},{"id":"safety_zb_0068","module":"safety","bank":"保护区安全准入","type":"single","stem":"HAF003中质量保证的定义是：（ ）。","options":["担保质量；","为使物项或服务与规定的质量要求相符合并提供足够的置信度所必需的一系列有计划的系统化的活动；","全部检查、检验、审查活动；","质保部门使用的法规。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"HAF003质量保证定义：为使物项或服务与规定的质量要求相符合并提供足够的置信度而进行的一系列有计划的系统化活动。"},{"id":"safety_zb_0069","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假相关的知识描述不正确的是：（ ）。","options":["必须完善供方黑名单体系，并及时向本单位纪检部门通报；","在结果没有问题的情况下，文件代签问题不算弄虚作假；","必须加强弄虚作假防控宣贯和培训；","必须保留现场原始记录，原始记录保留期限要求需纳入合同条款中。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"在结果没有问题的情况下可以补录记录\"是错误说法——原始记录必须真实、及时，严禁事后补造。"},{"id":"safety_zb_0070","module":"safety","bank":"保护区安全准入","type":"single","stem":"请选出具有‘凡事有章可循’原则与特征的一项（ ）。","options":["领导表率作用；","程序/规程的要求必须清晰明确，具有可操作性；","建立组织的质量验证体系；","记录应妥善贮存、保管。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"凡事有章可循\"体现为程序/规程的要求必须清晰、齐全、可用，工作按程序执行。"},{"id":"safety_zb_0071","module":"safety","bank":"保护区安全准入","type":"single","stem":"质量是：'客体的一组（ ）满足要求的程度'。","options":["特性；","固有特性；","赋予特性；","魅力特性。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"质量定义：客体的一组固有特性满足要求的程度。"},{"id":"safety_zb_0072","module":"safety","bank":"保护区安全准入","type":"single","stem":"有关不符合项，下列哪种说法是正确的：（ ）。","options":["不符合项控制有防止误用、误装不符合物项的作用；","不符合项控制是为了执行奖惩制度，追究活动从事者的责任；","导致物项或过程的质量不能确定的缺陷，不属于不符合项；","以上说法都不对。"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"不符合项控制的目的包括防止误用/误装不合格物项，对不符合项进行标识、隔离和处理。"},{"id":"safety_zb_0073","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对于熟悉的任务，工作人员可凭记忆执行完后再一并在执行步骤前打勾。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。执行规程必须逐步确认打勾，禁止凭记忆执行完再补勾（自欺式打勾是典型人因失误）。"},{"id":"safety_zb_0074","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用自检工具时，如果由于其他事情中断执行且手不再接触或指向设备，当恢复执行时应重新使用自检工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。自检被中断且失去接触后，恢复执行必须重新进行自检（STAR）。"},{"id":"safety_zb_0075","module":"safety","bank":"保护区安全准入","type":"judge","stem":"质疑的态度可以增强对不确定性及危险的认识，最大限度地减少失误的可能。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。质疑的态度增强对不确定性和危险的认识，最大限度减少失误。"},{"id":"safety_zb_0076","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当独自一人执行任务的时候，使用自检工具时只需在心中默读出设备的标识即可。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。独自执行时也应读出（轻声）设备标识，强化注意力，不能只在心中默读。"},{"id":"safety_zb_0077","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工作中所使用的规程都是经过精心编写，且经过校对、审核和批准，因此内容是完全正确的。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。规程虽经审批仍可能存在错误或与现场不符，执行中应保持质疑，发现问题及时反馈。"},{"id":"safety_zb_0078","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用监护工具时，监护人必须对执行人的行动全程观察，并对正确和错误的行动给予回应。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。监护人必须全程观察执行人行动，对正确给予确认、对错误及时纠正。"},{"id":"safety_zb_0079","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在任何活动中都必须严格按照反映电厂设计基准的规程来行动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。任何活动都必须严格按照反映电厂设计基准的规程行动。"},{"id":"safety_zb_0080","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在执行规程时，可以根据经验偏离规程。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。执行规程时严禁凭经验偏离规程，如有问题应停下来按程序处理。"},{"id":"safety_zb_0081","module":"safety","bank":"保护区安全准入","type":"judge","stem":"无论是操作设备，还是记录结果，所有工作中都应该优先使用自检这一工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。操作设备、记录结果等所有工作都应优先使用自检工具。"},{"id":"safety_zb_0082","module":"safety","bank":"保护区安全准入","type":"judge","stem":"2分钟检查是刚到达工作现场时对现场仔细的审查（不实际进行操作），帮助工作人员准确获悉关键指示、系统和设备的工况、工作环境、危险。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。2分钟检查是到达现场时对现场的初步审查，帮助掌握设备状态、环境与危险。"},{"id":"safety_zb_0083","module":"safety","bank":"保护区安全准入","type":"judge","stem":"所有需要汲取经验教训或发生异常的工作都需要召开工后会。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。需要汲取经验教训或发生异常的工作都应召开工后会总结。"},{"id":"safety_zb_0084","module":"safety","bank":"保护区安全准入","type":"judge","stem":"切尔诺贝利事故充分表明，核电厂发生的任何问题在某种程度上都源于人为错误，然而人的智慧在查出和消除潜在问题方面是十分有效的，必须突出强调人的因素在运行安全中的关键作用。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。核电厂任何问题在某种程度上都源于人为差错，必须重视人的因素在运行安全中的作用。"},{"id":"safety_zb_0085","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂程序全都经过了严格的审批流程，执行程序操作时不需要带着质疑的态度去判断程序是否能满足工作要求。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。即使程序经过严格审批，执行时也要带着质疑态度判断其是否满足现场实际要求。"},{"id":"safety_zb_0086","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用不确定时暂停工具可以使失误的可能性大大降低。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。\"不确定时暂停\"能在状态不明时避免盲目行动，大大降低失误可能。"},{"id":"safety_zb_0087","module":"safety","bank":"保护区安全准入","type":"judge","stem":"人的因素是绝对重要的因素。因此，只要具备必要的技能和授权就可动手操作。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。仅有技能和授权不够，还必须按规程、使用防人因失误工具才能操作。"},{"id":"safety_zb_0088","module":"safety","bank":"保护区安全准入","type":"judge","stem":"口头交换信息，尤其是面对面交谈过程中存在很大误解的风险，因此需要使用三向交流。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。口头交流误解风险大，需使用三向交流确保信息准确传递。"},{"id":"safety_zb_0089","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会是为了让工作组成员清楚地理解任务目标、工作范围、工作风险、安全要点、防护措施、应急预案，保证有效完成工作或任务的一项活动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工前会目的是让成员清楚任务目标、范围、风险、安全要点、防护措施和应急预案。"},{"id":"safety_zb_0090","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会和工后会地点都应选在不被其他事情干扰的地方。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工前会和工后会都应选在不受干扰的地点进行。"},{"id":"safety_zb_0091","module":"safety","bank":"保护区安全准入","type":"judge","stem":"状态报告是电厂报告问题、跟踪问题解决的重要工具，任何人都可以通过状态报告反馈问题（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。状态报告是电厂报告和跟踪问题的重要工具，任何人都可通过状态报告反馈问题。"},{"id":"safety_zb_0092","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，赶紧发个微信朋友圈，拍个短视频，正是吸引流量的好时机。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。应急状态下严禁发布现场信息到社交媒体（微信朋友圈/短视频），防止谣言和信息泄露。"},{"id":"safety_zb_0093","module":"safety","bank":"保护区安全准入","type":"judge","stem":"任何含有衰变原子并且具有放射性（释放辐射）的物质都叫做放射性物质。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。含有放射性原子并释放辐射的物质即放射性物质。"},{"id":"safety_zb_0094","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当身体或者任何特定器官遭到辐射照射时，接受的辐射量称为剂量。常用测量单位为希沃特（Sv）或毫希沃特（mSv）。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。剂量表示接受辐射照射的量，单位为希沃特（Sv）、毫希沃特（mSv）。"},{"id":"safety_zb_0095","module":"safety","bank":"保护区安全准入","type":"judge","stem":"疲劳引起注意力不集中、警觉性下降将会引发人的不安全行为。 （）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。疲劳导致注意力不集中、警觉性下降，会引发人的不安全行为。"},{"id":"safety_zb_0096","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂二回路给水在蒸汽发生器中被加热转化为蒸汽，推动汽轮发电机组发电。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。二回路给水在蒸汽发生器中被一回路热水加热成蒸汽，推动汽轮发电机组发电。"},{"id":"safety_zb_0097","module":"safety","bank":"保护区安全准入","type":"judge","stem":"公司领导不希望员工可以自由地提出意见，因为害怕负面的后果。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核安全文化要求领导鼓励员工自由提出意见（包括负面问题），不应害怕负面后果。"},{"id":"safety_zb_0098","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每位员工都有责任向电厂管理者报告可能会影响电站正常运转的蓄意破坏或干预事件。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每位员工都有责任报告可能影响电站的蓄意破坏或干预事件。"},{"id":"safety_zb_0099","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一般工业固体废物应统一收集后放入指定存放地点统一处理，不能随意丢弃。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。一般工业固废应统一收集放到指定地点处理，不得随意丢弃。"},{"id":"safety_zb_0100","module":"safety","bank":"保护区安全准入","type":"judge","stem":"重要邮件建议加密存储。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。重要邮件建议加密存储，防止信息泄露。"},{"id":"safety_zb_0101","module":"safety","bank":"保护区安全准入","type":"judge","stem":"'两个零容忍'指的是对'对违规操作零容忍'，和'对弄虚作假零容忍'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。\"两个零容忍\"指对违规操作零容忍、对弄虚作假零容忍。"},{"id":"safety_zb_0102","module":"safety","bank":"保护区安全准入","type":"judge","stem":"辐射防护标志用于警告工作人员放射性危险的位置，这可以防止员工因意外情况暴露于辐射或放射性物质中。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。辐射警告标志提示放射性危险位置，防止人员意外受照。"},{"id":"safety_zb_0103","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当今在核电技术日趋成熟的基础上，在实施纵深防御措施和严格管理的前提下，核电厂发生严重事故的概率极小。但是，即使采取了多种防范措施和控制手段，依然不能完全排除放射性会对公众和环境造成重大影响的事故发生。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。严重事故概率极小但不能完全排除，因此仍需应急准备与纵深防御。"},{"id":"safety_zb_0104","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，电站已经指派专人向公众和新闻媒体传达信息。此人负责回答来自外部的关于电站情况的相关问题。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。应急状态下由电站指派的发言人统一对外传达信息，员工不得擅自对外发布。"},{"id":"safety_zb_0105","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一些通常不被列为辐射控制区区的区域，在特殊行动期间可能会被列为辐射控制区。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。特殊行动期间，平时非辐射控制区的区域可能临时划为辐射控制区。"},{"id":"safety_zb_0106","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当放射性物质位置失控时，就会增大污染风险，辐射释放将不再受控。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。放射性物质失控会增大污染风险，辐射释放将不再受控。"},{"id":"safety_zb_0107","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电厂员工有责任根据电厂程序报告潜在的问题，保证问题及时的审查和修正。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.员工有责任按程序报告潜在问题，保证问题及时审查和纠正。"},{"id":"safety_zb_0108","module":"safety","bank":"保护区安全准入","type":"judge","stem":"秦山核电站是我国大陆第一座投入运行的核电站，被誉为'国之光荣'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。秦山核电站是我国大陆第一座投运的核电站，被誉为\"国之光荣\"。"},{"id":"safety_zb_0109","module":"safety","bank":"保护区安全准入","type":"judge","stem":"可以直接移走防异物装置，移走之前无需检查防异物装置周围区域。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。移走防异物装置前必须检查装置周围区域，确认无异物遗留。"},{"id":"safety_zb_0110","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电工作风险高于其他工业风险。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核电风险受严格管理和纵深防御控制，并不高于其他工业风险。"},{"id":"safety_zb_0111","module":"safety","bank":"保护区安全准入","type":"judge","stem":"明星自检中T的含义是：Think:思考你将要做什么，预计会有什么结果。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。STAR中T即Think：思考将要做什么、预计结果。"},{"id":"safety_zb_0112","module":"safety","bank":"保护区安全准入","type":"judge","stem":"推动核电厂汽轮机组发电的是蒸汽。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。推动汽轮机组旋转发电的是蒸汽。"},{"id":"safety_zb_0113","module":"safety","bank":"保护区安全准入","type":"judge","stem":"未使用劳动防护用品是物料搬运造成伤害的主要原因之一。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。未使用劳动防护用品是物料搬运伤害的主要原因之一。"},{"id":"safety_zb_0114","module":"safety","bank":"保护区安全准入","type":"judge","stem":"1希沃特（Sv）=100毫希沃特mSv。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。1 Sv = 1000 mSv（不是100）。"},{"id":"safety_zb_0115","module":"safety","bank":"保护区安全准入","type":"judge","stem":"临时需要下载一些互联网资料，可以把办公电脑通过共享手机热点的方式连接外网下载（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。办公电脑严禁私自连接手机热点等外网，防止病毒和信息泄露。"},{"id":"safety_zb_0116","module":"safety","bank":"保护区安全准入","type":"judge","stem":"办公区域禁止私自架设无线路由或WIFI热点。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。办公区域禁止私自架设无线路由或WiFi热点。"},{"id":"safety_zb_0117","module":"safety","bank":"保护区安全准入","type":"judge","stem":"运输物料时，应保持手推运货车上负载的重心尽可能的低。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。手推车运输时负载重心应尽可能低，保持稳定。"},{"id":"safety_zb_0118","module":"safety","bank":"保护区安全准入","type":"judge","stem":"伪造记录不属于有意的不当处理。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。伪造记录属于典型的有意不当处理（弄虚作假）行为。"},{"id":"safety_zb_0119","module":"safety","bank":"保护区安全准入","type":"judge","stem":"国家核安全局是中国的核安全和辐射安全的监督管理机构。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。国家核安全局（NNSA）是我国核与辐射安全的监督管理机构。"},{"id":"safety_zb_0120","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当需要从高处往下搬运物料时，应使用合适的物料下放设备，禁止抛投。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。从高处向下搬运物料应使用合适的下放设备，禁止抛投。"},{"id":"safety_zb_0121","module":"safety","bank":"保护区安全准入","type":"judge","stem":"正常情况下，核电工作者职业照射剂量大于在日常生活中的本底辐射剂量。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。正常情况下核电站职业照射剂量控制严格，通常低于日常生活中接受的天然本底辐射剂量（全球平均本底约2.4mSv/年）。"},{"id":"safety_zb_0122","module":"safety","bank":"保护区安全准入","type":"judge","stem":"汽轮机的作用是将蒸汽的内能转变为机械能以带动发电机发电。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation
