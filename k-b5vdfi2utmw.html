safety","bank":"保护区安全准入","type":"single","stem":"面对火灾，以下哪项逃生方法是错误的（ ）？","options":["选择逃生通道自救","结绳下滑自救","向外界求救","乘坐电梯逃生"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"火灾时严禁乘坐电梯逃生（断电被困危险）。"},{"id":"safety_zb_0064","module":"safety","bank":"保护区安全准入","type":"single","stem":"A类火灾是指（ ）。","options":["固体火灾","气体火灾","液体火灾"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"A类火灾指固体物质火灾；B类液体/可熔化固体、C类气体、E类电气。"},{"id":"safety_zb_0065","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假措施描述不正确的是：（ ）。","options":["制定质量计划责任人员及焊接、无损检验等关键工艺责任人员签字备案制度，必要时对签字真实性进行抽验是防造假的重点措施之一；","防控造假必须完善质量奖惩机制，制定举报人保护和奖励制度；","对于恶意违规、弄虚作假的员工要采用通报批评、经济处罚、下岗或解除劳动合同等方式进行惩处；","强化合同管控要求，震慑不良承包商和防控弄虚作假无关。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"防控造假必须完善质量奖惩……\"项与防造假措施表述不符（防造假靠制度监督与诚信文化，不是奖励导向），题库标注该项不正确。"},{"id":"safety_zb_0066","module":"safety","bank":"保护区安全准入","type":"single","stem":"影响质量的因素可概括为人、机、料、法、环、测六个方面，其中（ ）是最活跃的因素，也是最关键的因素之一。","options":["法；","机；","料；","人。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"人机料法环测六要素中，人是最活跃、最关键的因素。"},{"id":"safety_zb_0067","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于采购不符合项的处理方案（ ）。","options":["修理；","返工；","不作改进的接收（照用）；","第三方检验。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"采购不符合项处理方案有修理、返工、照用（不作改进的接收）等；第三方检验不是处理方案。"},{"id":"safety_zb_0068","module":"safety","bank":"保护区安全准入","type":"single","stem":"HAF003中质量保证的定义是：（ ）。","options":["担保质量；","为使物项或服务与规定的质量要求相符合并提供足够的置信度所必需的一系列有计划的系统化的活动；","全部检查、检验、审查活动；","质保部门使用的法规。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"HAF003质量保证定义：为使物项或服务与规定的质量要求相符合并提供足够的置信度而进行的一系列有计划的系统化活动。"},{"id":"safety_zb_0069","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假相关的知识描述不正确的是：（ ）。","options":["必须完善供方黑名单体系，并及时向本单位纪检部门通报；","在结果没有问题的情况下，文件代签问题不算弄虚作假；","必须加强弄虚作假防控宣贯和培训；","必须保留现场原始记录，原始记录保留期限要求需纳入合同条款中。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"在结果没有问题的情况下可以补录记录\"是错误说法——原始记录必须真实、及时，严禁事后补造。"},{"id":"safety_zb_0070","module":"safety","bank":"保护区安全准入","type":"single","stem":"请选出具有‘凡事有章可循’原则与特征的一项（ ）。","options":["领导表率作用；","程序/规程的要求必须清晰明确，具有可操作性；","建立组织的质量验证体系；","记录应妥善贮存、保管。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"凡事有章可循\"体现为程序/规程的要求必须清晰、齐全、可用，工作按程序执行。"},{"id":"safety_zb_0071","module":"safety","bank":"保护区安全准入","type":"single","stem":"质量是：'客体的一组（ ）满足要求的程度'。","options":["特性；","固有特性；","赋予特性；","魅力特性。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"质量定义：客体的一组固有特性满足要求的程度。"},{"id":"safety_zb_0072","module":"safety","bank":"保护区安全准入","type":"single","stem":"有关不符合项，下列哪种说法是正确的：（ ）。","options":["不符合项控制有防止误用、误装不符合物项的作用；","不符合项控制是为了执行奖惩制度，追究活动从事者的责任；","导致物项或过程的质量不能确定的缺陷，不属于不符合项；","以上说法都不对。"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"不符合项控制的目的包括防止误用/误装不合格物项，对不符合项进行标识、隔离和处理。"},{"id":"safety_zb_0073","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对于熟悉的任务，工作人员可凭记忆执行完后再一并在执行步骤前打勾。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。执行规程必须逐步确认打勾，禁止凭记忆执行完再补勾（自欺式打勾是典型人因失误）。"},{"id":"safety_zb_0074","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用自检工具时，如果由于其他事情中断执行且手不再接触或指向设备，当恢复执行时应重新使用自检工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。自检被中断且失去接触后，恢复执行必须重新进行自检（STAR）。"},{"id":"safety_zb_0075","module":"safety","bank":"保护区安全准入","type":"judge","stem":"质疑的态度可以增强对不确定性及危险的认识，最大限度地减少失误的可能。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。质疑的态度增强对不确定性和危险的认识，最大限度减少失误。"},{"id":"safety_zb_0076","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当独自一人执行任务的时候，使用自检工具时只需在心中默读出设备的标识即可。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。独自执行时也应读出（轻声）设备标识，强化注意力，不能只在心中默读。"},{"id":"safety_zb_0077","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工作中所使用的规程都是经过精心编写，且经过校对、审核和批准，因此内容是完全正确的。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。规程虽经审批仍可能存在错误或与现场不符，执行中应保持质疑，发现问题及时反馈。"},{"id":"safety_zb_0078","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用监护工具时，监护人必须对执行人的行动全程观察，并对正确和错误的行动给予回应。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。监护人必须全程观察执行人行动，对正确给予确认、对错误及时纠正。"},{"id":"safety_zb_0079","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在任何活动中都必须严格按照反映电厂设计基准的规程来行动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。任何活动都必须严格按照反映电厂设计基准的规程行动。"},{"id":"safety_zb_0080","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在执行规程时，可以根据经验偏离规程。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。执行规程时严禁凭经验偏离规程，如有问题应停下来按程序处理。"},{"id":"safety_zb_0081","module":"safety","bank":"保护区安全准入","type":"judge","stem":"无论是操作设备，还是记录结果，所有工作中都应该优先使用自检这一工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。操作设备、记录结果等所有工作都应优先使用自检工具。"},{"id":"safety_zb_0082","module":"safety","bank":"保护区安全准入","type":"judge","stem":"2分钟检查是刚到达工作现场时对现场仔细的审查（不实际进行操作），帮助工作人员准确获悉关键指示、系统和设备的工况、工作环境、危险。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。2分钟检查是到达现场时对现场的初步审查，帮助掌握设备状态、环境与危险。"},{"id":"safety_zb_0083","module":"safety","bank":"保护区安全准入","type":"judge","stem":"所有需要汲取经验教训或发生异常的工作都需要召开工后会。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。需要汲取经验教训或发生异常的工作都应召开工后会总结。"},{"id":"safety_zb_0084","module":"safety","bank":"保护区安全准入","type":"judge","stem":"切尔诺贝利事故充分表明，核电厂发生的任何问题在某种程度上都源于人为错误，然而人的智慧在查出和消除潜在问题方面是十分有效的，必须突出强调人的因素在运行安全中的关键作用。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。核电厂任何问题在某种程度上都源于人为差错，必须重视人的因素在运行安全中的作用。"},{"id":"safety_zb_0085","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂程序全都经过了严格的审批流程，执行程序操作时不需要带着质疑的态度去判断程序是否能满足工作要求。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。即使程序经过严格审批，执行时也要带着质疑态度判断其是否满足现场实际要求。"},{"id":"safety_zb_0086","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用不确定时暂停工具可以使失误的可能性大大降低。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。\"不确定时暂停\"能在状态不明时避免盲目行动，大大降低失误可能。"},{"id":"safety_zb_0087","module":"safety","bank":"保护区安全准入","type":"judge","stem":"人的因素是绝对重要的因素。因此，只要具备必要的技能和授权就可动手操作。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。仅有技能和授权不够，还必须按规程、使用防人因失误工具才能操作。"},{"id":"safety_zb_0088","module":"safety","bank":"保护区安全准入","type":"judge","stem":"口头交换信息，尤其是面对面交谈过程中存在很大误解的风险，因此需要使用三向交流。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。口头交流误解风险大，需使用三向交流确保信息准确传递。"},{"id":"safety_zb_0089","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会是为了让工作组成员清楚地理解任务目标、工作范围、工作风险、安全要点、防护措施、应急预案，保证有效完成工作或任务的一项活动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工前会目的是让成员清楚任务目标、范围、风险、安全要点、防护措施和应急预案。"},{"id":"safety_zb_0090","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会和工后会地点都应选在不被其他事情干扰的地方。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工前会和工后会都应选在不受干扰的地点进行。"},{"id":"safety_zb_0091","module":"safety","bank":"保护区安全准入","type":"judge","stem":"状态报告是电厂报告问题、跟踪问题解决的重要工具，任何人都可以通过状态报告反馈问题（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。状态报告是电厂报告和跟踪问题的重要工具，任何人都可通过状态报告反馈问题。"},{"id":"safety_zb_0092","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，赶紧发个微信朋友圈，拍个短视频，正是吸引流量的好时机。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。应急状态下严禁发布现场信息到社交媒体（微信朋友圈/短视频），防止谣言和信息泄露。"},{"id":"safety_zb_0093","module":"safety","bank":"保护区安全准入","type":"judge","stem":"任何含有衰变原子并且具有放射性（释放辐射）的物质都叫做放射性物质。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。含有放射性原子并释放辐射的物质即放射性物质。"},{"id":"safety_zb_0094","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当身体或者任何特定器官遭到辐射照射时，接受的辐射量称为剂量。常用测量单位为希沃特（Sv）或毫希沃特（mSv）。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。剂量表示接受辐射照射的量，单位为希沃特（Sv）、毫希沃特（mSv）。"},{"id":"safety_zb_0095","module":"safety","bank":"保护区安全准入","type":"judge","stem":"疲劳引起注意力不集中、警觉性下降将会引发人的不安全行为。 （）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。疲劳导致注意力不集中、警觉性下降，会引发人的不安全行为。"},{"id":"safety_zb_0096","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂二回路给水在蒸汽发生器中被加热转化为蒸汽，推动汽轮发电机组发电。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。二回路给水在蒸汽发生器中被一回路热水加热成蒸汽，推动汽轮发电机组发电。"},{"id":"safety_zb_0097","module":"safety","bank":"保护区安全准入","type":"judge","stem":"公司领导不希望员工可以自由地提出意见，因为害怕负面的后果。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核安全文化要求领导鼓励员工自由提出意见（包括负面问题），不应害怕负面后果。"},{"id":"safety_zb_0098","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每位员工都有责任向电厂管理者报告可能会影响电站正常运转的蓄意破坏或干预事件。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每位员工都有责任报告可能影响电站的蓄意破坏或干预事件。"},{"id":"safety_zb_0099","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一般工业固体废物应统一收集后放入指定存放地点统一处理，不能随意丢弃。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。一般工业固废应统一收集放到指定地点处理，不得随意丢弃。"},{"id":"safety_zb_0100","module":"safety","bank":"保护区安全准入","type":"judge","stem":"重要邮件建议加密存储。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。重要邮件建议加密存储，防止信息泄露。"},{"id":"safety_zb_0101","module":"safety","bank":"保护区安全准入","type":"judge","stem":"'两个零容忍'指的是对'对违规操作零容忍'，和'对弄虚作假零容忍'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。\"两个零容忍\"指对违规操作零容忍、对弄虚作假零容忍。"},{"id":"safety_zb_0102","module":"safety","bank":"保护区安全准入","type":"judge","stem":"辐射防护标志用于警告工作人员放射性危险的位置，这可以防止员工因意外情况暴露于辐射或放射性物质中。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。辐射警告标志提示放射性危险位置，防止人员意外受照。"},{"id":"safety_zb_0103","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当今在核电技术日趋成熟的基础上，在实施纵深防御措施和严格管理的前提下，核电厂发生严重事故的概率极小。但是，即使采取了多种防范措施和控制手段，依然不能完全排除放射性会对公众和环境造成重大影响的事故发生。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。严重事故概率极小但不能完全排除，因此仍需应急准备与纵深防御。"},{"id":"safety_zb_0104","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，电站已经指派专人向公众和新闻媒体传达信息。此人负责回答来自外部的关于电站情况的相关问题。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。应急状态下由电站指派的发言人统一对外传达信息，员工不得擅自对外发布。"},{"id":"safety_zb_0105","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一些通常不被列为辐射控制区区的区域，在特殊行动期间可能会被列为辐射控制区。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。特殊行动期间，平时非辐射控制区的区域可能临时划为辐射控制区。"},{"id":"safety_zb_0106","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当放射性物质位置失控时，就会增大污染风险，辐射释放将不再受控。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。放射性物质失控会增大污染风险，辐射释放将不再受控。"},{"id":"safety_zb_0107","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电厂员工有责任根据电厂程序报告潜在的问题，保证问题及时的审查和修正。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.员工有责任按程序报告潜在问题，保证问题及时审查和纠正。"},{"id":"safety_zb_0108","module":"safety","bank":"保护区安全准入","type":"judge","stem":"秦山核电站是我国大陆第一座投入运行的核电站，被誉为'国之光荣'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。秦山核电站是我国大陆第一座投运的核电站，被誉为\"国之光荣\"。"},{"id":"safety_zb_0109","module":"safety","bank":"保护区安全准入","type":"judge","stem":"可以直接移走防异物装置，移走之前无需检查防异物装置周围区域。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。移走防异物装置前必须检查装置周围区域，确认无异物遗留。"},{"id":"safety_zb_0110","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电工作风险高于其他工业风险。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核电风险受严格管理和纵深防御控制，并不高于其他工业风险。"},{"id":"safety_zb_0111","module":"safety","bank":"保护区安全准入","type":"judge","stem":"明星自检中T的含义是：Think:思考你将要做什么，预计会有什么结果。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。STAR中T即Think：思考将要做什么、预计结果。"},{"id":"safety_zb_0112","module":"safety","bank":"保护区安全准入","type":"judge","stem":"推动核电厂汽轮机组发电的是蒸汽。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。推动汽轮机组旋转发电的是蒸汽。"},{"id":"safety_zb_0113","module":"safety","bank":"保护区安全准入","type":"judge","stem":"未使用劳动防护用品是物料搬运造成伤害的主要原因之一。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。未使用劳动防护用品是物料搬运伤害的主要原因之一。"},{"id":"safety_zb_0114","module":"safety","bank":"保护区安全准入","type":"judge","stem":"1希沃特（Sv）=100毫希沃特mSv。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。1 Sv = 1000 mSv（不是100）。"},{"id":"safety_zb_0115","module":"safety","bank":"保护区安全准入","type":"judge","stem":"临时需要下载一些互联网资料，可以把办公电脑通过共享手机热点的方式连接外网下载（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。办公电脑严禁私自连接手机热点等外网，防止病毒和信息泄露。"},{"id":"safety_zb_0116","module":"safety","bank":"保护区安全准入","type":"judge","stem":"办公区域禁止私自架设无线路由或WIFI热点。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。办公区域禁止私自架设无线路由或WiFi热点。"},{"id":"safety_zb_0117","module":"safety","bank":"保护区安全准入","type":"judge","stem":"运输物料时，应保持手推运货车上负载的重心尽可能的低。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。手推车运输时负载重心应尽可能低，保持稳定。"},{"id":"safety_zb_0118","module":"safety","bank":"保护区安全准入","type":"judge","stem":"伪造记录不属于有意的不当处理。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。伪造记录属于典型的有意不当处理（弄虚作假）行为。"},{"id":"safety_zb_0119","module":"safety","bank":"保护区安全准入","type":"judge","stem":"国家核安全局是中国的核安全和辐射安全的监督管理机构。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。国家核安全局（NNSA）是我国核与辐射安全的监督管理机构。"},{"id":"safety_zb_0120","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当需要从高处往下搬运物料时，应使用合适的物料下放设备，禁止抛投。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。从高处向下搬运物料应使用合适的下放设备，禁止抛投。"},{"id":"safety_zb_0121","module":"safety","bank":"保护区安全准入","type":"judge","stem":"正常情况下，核电工作者职业照射剂量大于在日常生活中的本底辐射剂量。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。正常情况下核电站职业照射剂量控制严格，通常低于日常生活中接受的天然本底辐射剂量（全球平均本底约2.4mSv/年）。"},{"id":"safety_zb_0122","module":"safety","bank":"保护区安全准入","type":"judge","stem":"汽轮机的作用是将蒸汽的内能转变为机械能以带动发电机发电。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。汽轮机将蒸汽热能（内能）转变为机械能，带动发电机发电。"},{"id":"safety_zb_0123","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在搬运长条形物体时，保持双手远离物体端部以防被挤压/夹伤。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。搬运长条形物体时双手应远离端部，防止挤压夹伤。"},{"id":"safety_zb_0124","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起重设备进入防异物管理区域上空之前，无需检查有无部件松动情况。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。起重设备进入防异物区域上空前必须检查有无部件松动，防止异物掉落。"},{"id":"safety_zb_0125","module":"safety","bank":"保护区安全准入","type":"judge","stem":"我国目前的核电机组主要分布在内陆省份。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。我国核电机组主要分布在沿海省份，内陆尚无在运机组。"},{"id":"safety_zb_0126","module":"safety","bank":"保护区安全准入","type":"judge","stem":"三哩岛、切尔诺贝利核电站存在很多设计错误，加之人员培训和规程的低质量最终导致事故的发生。而目前的电站已经充分吸取了这些失败经验，加之今天的巨大技术进步，所以绝对不会发生大事故。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。不能认为\"已有电站绝对安全\"，核安全需要持续保持警惕，任何时候都不能放松（安全是相对的、动态的）。"},{"id":"safety_zb_0127","module":"safety","bank":"保护区安全准入","type":"judge","stem":"天然辐射源，如宇宙射线、某些种类岩石；人造辐射源，如CT检查等，使人们遭受的辐照剂量比从事辐射工作所接受的职业剂量更多。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。天然辐射（宇宙射线、岩石等）加上人造辐射源（CT等）使公众接受的照射剂量总体上并不比核电职业剂量少，职业剂量受严格控制在很低水平。"},{"id":"safety_zb_0128","module":"safety","bank":"保护区安全准入","type":"judge","stem":"岗位适任性的主观辨识方法，既包括对个人身体状态变化的观察也包括社会交往方面的变化。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。岗位适任性主观辨识既观察身体状态变化，也观察社会交往方面的变化。"},{"id":"safety_zb_0129","module":"safety","bank":"保护区安全准入","type":"judge","stem":"搬运物料前，如搬运人员对周围环境熟悉，即使无法观察到所搬运负载的上方及其四周也没关系。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。搬运前必须保证能看到负载上方及四周，环境不熟悉也不能例外。"},{"id":"safety_zb_0130","module":"safety","bank":"保护区安全准入","type":"judge","stem":"WBC是指全身计数测量，是监测人体内照射的重要手段。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。WBC（全身计数器）测量是监测人体内照射的重要手段。"},{"id":"safety_zb_0131","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对于在物料搬运时发生的预期外的事件，工作人员应在确保自身安全的前提下将物料放置在安全状态，再进行处理。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。搬运中发生预期外事件，应先确保自身安全并将物料置于安全状态再处理。"},{"id":"safety_zb_0132","module":"safety","bank":"保护区安全准入","type":"judge","stem":"物项只在进入防异物管理区域时需要检查，带出时不用检查。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。物项进出防异物管理区域都必须检查，防止异物带入或带出遗留。"},{"id":"safety_zb_0133","module":"safety","bank":"保护区安全准入","type":"judge","stem":"安保配置和设计文件可以随意查看。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。安保配置和设计文件属于敏感资料，须授权查阅，不能随意查看。"},{"id":"safety_zb_0134","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一旦完成初始培训成为核电一员后，后续无需再接受培训。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核电员工需要持续接受再培训（复训、授权资格考试），不是一次培训终身有效。"},{"id":"safety_zb_0135","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用螺丝刀，扳手等工具时，应使用防坠落手绳。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。高处使用螺丝刀、扳手等工具应系防坠落手绳，防止落物伤人。"},{"id":"safety_zb_0136","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在应急情况下，如果你不属于应急响应专业组成员，应按指示到达应急集合点或疏散地。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。非应急响应专业人员应按指令到应急集合点集合或疏散。"},{"id":"safety_zb_0137","module":"safety","bank":"保护区安全准入","type":"judge","stem":"只要足够优秀，就不会犯错误。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。任何人都会犯错误，优秀的员工同样需要防人因失误工具和规程约束。"},{"id":"safety_zb_0138","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用螺丝刀，扳手等工具时，可以使用胶带临时捆绑替代防坠落手绳。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。防坠落手绳不能用胶带临时捆绑替代，必须使用合格的专用手绳。"},{"id":"safety_zb_0139","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对介质是危化品的系统开展检修工作时，只要做好系统隔离，可以不佩戴防护用品。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。危化品系统检修除系统隔离外，还必须按风险分析佩戴相应防护用品。"},{"id":"safety_zb_0140","module":"safety","bank":"保护区安全准入","type":"judge","stem":"红色安全标志是禁止或制止人们想要做的某种动作。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。红色安全标志表示禁止、制止某种动作（禁止标志）。"},{"id":"safety_zb_0141","module":"safety","bank":"保护区安全准入","type":"judge","stem":"进入密闭容器前，必须对密闭容器的含氧量及有毒有害气体的浓度进行测量，空气指标合格后方可进入作业。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。进入密闭容器前必须测量含氧量和有毒有害气体浓度，合格后方可进入。"},{"id":"safety_zb_0142","module":"safety","bank":"保护区安全准入","type":"judge","stem":"安全帽主要防止高处落物的打击，在高空作业时可以不戴。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。安全帽任何时候进入现场都必须佩戴，高空作业更不能摘下。"},{"id":"safety_zb_0143","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在现场工作时衣服、袖口应扣好，长发应盘入安全帽以防止卷入转动设备。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。现场工作应扣好衣服袖口，长发盘入安全帽，防止卷入转动设备。"},{"id":"safety_zb_0144","module":"safety","bank":"保护区安全准入","type":"judge","stem":"《职业病防治法》适用于中华人民共和国境内产生职业病危害的企事业单位和个体经济组织。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。《职业病防治法》适用于境内产生职业病危害的企事业单位和个体经济组织。"},{"id":"safety_zb_0145","module":"safety","bank":"保护区安全准入","type":"judge","stem":"个人劳动防护用品是提供安全和健康防护的预防性辅助措施，可以直接替代工作中必须采取的安全技术措施。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。个人防护用品只是辅助预防措施，不能替代必须的安全技术措施。"},{"id":"safety_zb_0146","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在现场工作过程中，不管受伤多轻微都应进行报告。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.现场工作中无论伤情多轻微都应报告（及时处置、经验反馈）。"},{"id":"safety_zb_0147","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在用人单位与被雇佣人商量一致的情况下，可以不用参加工伤保险。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。工伤保险是法定强制保险，即使双方协商一致也必须参加。"},{"id":"safety_zb_0148","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工作结束后，现场设置的临时围栏应及时拆除，打开的盖板应立即恢复。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工作结束后临时围栏应及时拆除、打开的盖板立即恢复。"},{"id":"safety_zb_0149","module":"safety","bank":"保护区安全准入","type":"judge","stem":"从事高空作业人员在工作前必须检查安全带，没有带安全带的在工作中必须有专人监护。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。高处作业人员必须佩戴安全带，没有安全带根本不允许作业（不是\"专人监护\"可以替代）。"},{"id":"safety_zb_0150","module":"safety","bank":"保护区安全准入","type":"judge","stem":"人的不安全行为并不是每次都能造成事故伤害，有的不安全行为没有形成任何后果，但事故正是以大量的不安全行为为基础的。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。海因里希法则：不安全行为不一定每次都致伤，但事故以大量不安全行为为基础。"},{"id":"safety_zb_0151","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场生产厂房噪音超过85分贝的环境应使用耳塞，以防听力受损。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。噪声超过85分贝的环境应佩戴耳塞防止听力损伤。"},{"id":"safety_zb_0152","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起吊物体必须离开地面有足够的距离后，人员方可从下方通过。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误.起吊物吊起后严禁人员从吊物下方通过（无论离地多高）。"},{"id":"safety_zb_0153","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在关闭容器（坑洞、井）人孔门以前，工作负责人必须清点人员和工具，检查确实没有人员或工具遗留后才可关闭。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。关闭容器（坑洞、井）人孔前必须清点人员和工具，确认无遗留后方可关闭。"},{"id":"safety_zb_0154","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起重作业人员在操作前应检查现场风速低于五级满足起重条件，否则不准进行操作。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。起重作业前应确认现场风速低于五级（满足起重条件）方可操作。"},{"id":"safety_zb_0155","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场使用或临时存放的气瓶应进行可靠固定，使用气瓶绑扎带固定气瓶时可以只绑扎在瓶身下部牢靠即可。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。气瓶绑扎固定不能只绑瓶身下部，应固定牢靠防止倾倒（绑扎位置应确保稳定）。"},{"id":"safety_zb_0156","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电气设备必须装设保护接地（接零），不得将接地线接在金属管道上或其他金属构件上。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电气设备必须装设保护接地（接零），接地线不得接在金属管道或其他金属构件上。"},{"id":"safety_zb_0157","module":"safety","bank":"保护区安全准入","type":"judge","stem":"成人心肺复苏时，不管单人或双人进行复苏，胸外按压与通气比均为30：2。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。成人心肺复苏无论单人或双人，按压与通气比均为30:2。"},{"id":"safety_zb_0158","module":"safety","bank":"保护区安全准入","type":"judge","stem":"海因里希（Heinrich）事故法则对于职业安全卫生工作的意义是：防止人的不安全行为，消除物的不安全状态，使因果连锁中断。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。海因里希事故法则的意义：防止人的不安全行为、消除物的不安全状态，中断事故因果连锁。"},{"id":"safety_zb_0159","module":"safety","bank":"保护区安全准入","type":"judge","stem":"自己未使用或没有通行证，跟随别的工作人员进入安全门称为尾随。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.未使用本人通行证跟随他人进入安全门的行为称为尾随（防尾随是核安保基本要求）。"},{"id":"safety_zb_0160","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核安保文化的定义是预防、探测和应对涉及核材料、核设施、其他放射性物质及相关设施，以及相关活动的擅自接触、末经授权转移、盗窃、蓄意破坏或其他恶意行为。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。这是核安保文化的定义：预防、探测和应对核材料及放射性物质等的擅自接触、未经授权转移、盗窃、蓄意破坏等恶意行为。"},{"id":"safety_zb_0161","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在报警时只要说明起火的具体位置（区域、机组、厂房、层面、房间等）和着火物性质、火势大小、有无人员被困、受伤就可以了，不需要告知报警人信息并引导消防车辆。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。报警时还应告知报警人信息并引导消防车辆到达现场。"},{"id":"safety_zb_0162","module":"safety","bank":"保护区安全准入","type":"judge","stem":"保护区和要害区必须通过制卡授权系统分别进行授权，一次开门只能允许具备授权的持证者一人通行。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。保护区和要害区须分别授权，一次开门只允许一名持证授权者通行（防尾随）。"},{"id":"safety_zb_0163","module":"safety","bank":"保护区安全准入","type":"judge","stem":"各个区域使用不同的证件，人员进入某区域必须持有相应的证件。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。各区域使用不同证件，进入相应区域必须持相应证件。"},{"id":"safety_zb_0164","module":"safety","bank":"保护区安全准入","type":"judge","stem":"动火作业是指在禁火区进行焊接与切割作业及在易燃易爆场所使用喷灯、电钻、砂轮等进行可能产生火焰、火花和炽热表面的临时性作业。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。这是动火作业的定义：禁火区焊接切割及易燃易爆场所可能产生火焰、火花、炽热表面的临时作业。"},{"id":"safety_zb_0165","module":"safety","bank":"保护区安全准入","type":"judge","stem":"保卫分区的目的是为了有效地防御非法入侵，确保核电站安全。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。保卫分区目的是有效防御非法入侵，确保核电站安全。"},{"id":"safety_zb_0166","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电器开关时的打火、熔热发红的铁器和电焊产生的焊渣都是着火源。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电器开关打火、发红铁器、电焊焊渣都是着火源。"},{"id":"safety_zb_0167","module":"safety","bank":"保护区安全准入","type":"judge","stem":"任何进入管理区的车辆和人员都要接受安检。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。进入管理区的车辆和人员都要接受安检。"},{"id":"safety_zb_0168","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂内禁止流动吸烟，吸烟必须要指定吸烟点。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。核电厂内禁止流动吸烟，只能在指定吸烟点吸烟。"},{"id":"safety_zb_0169","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每项产品具有其质量特性，但表现形式不尽相同。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每项产品都有质量特性，表现形式不尽相同（性能、寿命、可靠性等）。"},{"id":"safety_zb_0170","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂质量的体现之一是：设备检修、机组运行控制、设备管理、物资采购等等生产相关各环节，符合规定的工作流程及要求。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电厂质量体现在检修、运行、设备管理、采购等各环节符合规定流程与要求。"},{"id":"safety_zb_0171","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在工程进度和时间紧张的情况下，对从事影响质量的活动的人员可安排先上岗后培训。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。影响质量活动的人员必须先培训合格后上岗，严禁先上岗后培训。"},{"id":"safety_zb_0172","module":"safety","bank":"保护区安全准入","type":"judge","stem":"维修工作记录填写原则上应在该项活动结束时同步进行填写，不能在活动未完成前就进行填写或在整个工作结束后进行事后凭记忆补签。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。维修记录应在活动结束时同步填写，严禁提前填写或事后凭记忆补签。"},{"id":"safety_zb_0173","module":"safety","bank":"保护区安全准入","type":"judge","stem":"无证作业（包括工作负责人、QC、操纵员、燃料操作员等）属于中国核电质量红线违章。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。无证作业（工作负责人、QC、操纵员、燃料操作员等）属于中国核电质量红线违章。"},{"id":"safety_zb_0174","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场工作完成后，工作人员也可以不用进行'自检'，因为工作负责人会进行确认。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。工作完成后工作人员仍需自检确认，不能依赖工作负责人确认。"},{"id":"safety_zb_0175","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂设计变更必须采用与原设计相同的设计控制措施。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。设计变更必须采用与原设计相同的设计控制措施（同等审查、验证）。"},{"id":"safety_zb_0176","module":"safety","bank":"保护区安全准入","type":"judge","stem":"记录是为各种物项或服务的质量以及影响质量的各种活动提供客观证据的文件。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。记录是为物项或服务质量及影响质量活动提供客观证据的文件。"},{"id":"safety_zb_0177","module":"safety","bank":"保护区安全准入","type":"judge","stem":"影响质量的工艺必须由合格的人员、按照认可的程序和使用合格的设备，按现有标准来完成。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。影响质量的工艺必须由合格人员、按认可程序、用合格设备并按现有标准完成。"},{"id":"safety_zb_0178","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每个人都可以拒绝超出授权范围的工作安排。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每个人都可以（且应该）拒绝超出本人授权范围的工作安排。"},{"id":"safety_zb_0179","module":"safety","bank":"保护区安全准入","type":"judge","stem":"所有质量保证记录都必须字迹清楚、完整、并与所记述的物项或服务相对应。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。质量保证记录必须字迹清楚、完整，并与所述物项或服务相对应。"},{"id":"safety_zb_0180","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当工作执行到质量计划中的'H点'时，验证人员虽然未到场，但通过电话表示放弃该点见证，也可以继续开展工作。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。H点（停工待检点）必须由验证人员到场见证签字后方可继续，电话放弃见证无效。"},{"id":"safety_fs_0001","module":"safety","bank":"辐射防护二级","type":"judge","stem":"根据辐射工作许可证（RWP）办理要求，如果你接到指令，要实施一项紧急抢修工作，可以直接使用你的其他RWP进入开展工作。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0002","module":"safety","bank":"辐射防护二级","type":"judge","stem":"办理辐射工作许可证（RWP）时，如果预计最大个人剂量为5mSv，则其分级应为高度风险2级。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0003","module":"safety","bank":"辐射防护二级","type":"judge","stem":"高辐射区域工作，应尽量减少现场工作人数，与工作暂时无关的人员应安排撤至低剂量等待区。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0004","module":"safety","bank":"辐射防护二级","type":"judge","stem":"本班组都不是辐射防护（RP）人员, 所以没有必要留心现场辐射防护标识牌上的信息。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0005","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内的物品表面是否有污染, 工作人员完全可凭自己以往的经验判断, 不必担心自身是否会被沾污。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0006","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在核岛现场，工作人员应谨防走错间隔，避免非计划照射。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0007","module":"safety","bank":"辐射防护二级","type":"judge","stem":"维修冷停期间和功率运行期间进入反应堆厂房，外照射风险是一样的。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0008","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射防护停工待检点任何情况都禁止逾越，必须经辐射防护人员检查、签字确认符合要求后才能继续后继工作。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0009","module":"safety","bank":"辐射防护二级","type":"judge","stem":"作业班组应在工作的准备阶段，分析识别作业步骤可能存在的辐射风险，以及需采取的措施等。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0010","module":"safety","bank":"辐射防护二级","type":"judge","stem":"机组功率运行期间，为了便于就地仪表状态检查，允许作业人员到反应堆厂房内环廊主管道附近区域。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0011","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内不允许吃东西、喝水、吸烟，主要目的是为了防止体内污染。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":""},{"id":"safety_fs_0012","module":"safety","bank":"辐射防护二级","type":"judge","stem":"进入表面污染隔离区工作，工作人员应穿附加防护用品，根据具体情况这些用品可以单独使用，亦可以配套使用。（  ）","options":null,"answer":["正确"] "辐射防护基础和专项安全培训","type":"judge","stem":"空气过滤呼吸器主要的净化能力来自于面罩上的呼吸器罐/盒。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0121","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在辐射控制区进行切割或者打磨活动可能会产生放射性的气载污染。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0122","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"可供应呼吸空气的呼吸器优点是呼吸器戴上或脱下操作简单。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0123","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用呼吸器不会影响视线和视野。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0124","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"气载放射性污染物主要对人体产生伤害的途径是外照射。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0125","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"若作业人员进入电缆沟、管沟开展作业，电缆沟、管沟的盖板未完全开启，则按照密闭空间作业进行风险控制。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0126","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"对于只有执行调试、维修相关作业时才允许人员进入的密闭空间（如：需打开人孔门），由工作组在密闭空间外设置临时警示标识牌。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0127","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"密闭空间作业应当严格遵守'先通风、再检测、后作业'的原则。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0128","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在密闭空间入口处建立作业隔离区，设置警示标识，防止未经授权人员与无关人员进入，出入口可以放工器具。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0129","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"为防止密闭空间易燃气体形成有爆炸性的混合物，可用惰性气体（例如氮气或二氧化碳）置换的方式。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0130","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"监测时气体采样点应有代表性，较大、较深、较复杂的密闭空间，可能存在气体分层现象，应采取上、中、下各部位取样检测，保证气体检测能够涵盖整个密闭空间（如：可采用长杆工具、吊绳等将检测仪表放置于采样点）。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0131","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"若作业人员进入电缆沟、管沟开展作业，电缆沟、管沟的盖板已完全开启，且无窒息、淹溺、中毒等风险且仪表测量气体合格时，作业人员需做好临边防护，待充分自然通风后，可进入开展作业，不按照密闭空间作业进行管理。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0132","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"打开密闭空间上部的入口盖板时，必须做好防止人员、物项坠落的措施（如：预先设置防护围栏、佩戴安全带、使用工器具防坠落绳等），盖板移除后的开口处应立即用临时围栏进行防护，以防止人员跌落。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0133","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"密闭空间内的有毒有害物质的来源很多，有可能是原来空间内盛装的气体或液体，也有可能来自作业过程中产生的有毒有害物质（例如焊接与切割），还有可能来自相邻房间/设备产生的有毒有害气体进入该受限空间，因此在作业前的风险辨识阶段要充分考虑到各种来源。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0134","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"当密闭空间内的有毒有害物质浓度大于《有毒有害气体接触限值》的规定值，或氧气含量超出允许范围时，应当采取机械通风措施。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0135","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"强制通风应使用洁净的空气，也可通入氧气。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0136","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射工作人员的全身剂量包括内照射剂量和外照射剂量的总和。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0137","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"所有在辐射控制区内进行的辐射工作必须办理《辐射工作许可证》。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0138","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"放射性物品存放点内高、低剂量率物品可以混合存放在一起。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0139","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"污染隔离区可以随意摸脸、擦汗、扶眼睛等触碰颈部以上暴露部位。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0140","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"放射性货包运输人员在厂区运输期间不用佩带个人剂量计。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0141","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区内没有饮水的地方，工作人员可以自行带水。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0142","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在辐射控制区内执行与当前辐射工作许可证无关的另外一项工作前，须进行辐射工作许可证切换。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0143","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射生物效应按照剂量与效应关系可以分为确定性效应和随机性效应。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0144","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"松散污染隔离区中的物品必须经过污染检测合格后才能带出隔离区。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0145","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射热点信息牌挂设在设备或管道等存在辐射热点的位置，热点快速通过标牌在热点信息牌附近，以提醒人员快速通过热点区域，避免在该处无故停留，从而减少人员因热点而受到的照射。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0146","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"所有非放射性物品出辐射控制区必须经过辐射和污染确认，物品如果能够过小件物品监测仪测量，无报警，则可认为是非放射性物品。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0147","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"如果皮肤有开放性伤口，尽量避免进入辐射控制区，如需进入辐射控制区，需进行必要的包扎。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0148","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"戴呼吸器可以有效限制放射性物质的吸入。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0149","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"非放射性物品可以随意带进辐射控制区并带出。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0150","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"人类每年受到来自环境的总剂量为2.5mSv左右，这些是可以避免的。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0151","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"看到有边界门标识的房间门，不可以自行开启，开启前必须通知辐射防护人员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0152","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用他人RP证进入辐射控制区是违反辐射防护管理规定的'红线违章'。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0153","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区的红区内某阀门发生泄漏，紧急情况下可以先设法进入抢修，后补审批手续。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0154","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射确定性效应的严重程度随剂量增加而增加，且存在剂量阈值，剂量越大，损伤越严重。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0155","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"某具备辐射防护工作授权人员在到达卫生出入口才想起忘了带热释光剂量计（TLD），这次可以先进入辐射控制区进行工作，下次再记得佩戴即可。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0156","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射实际是上一种能量。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0157","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"松散污染是可以去除的，如果去除不彻底，可能导致较强的外照射危害。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0158","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"工作负责人负责本工作组成员及工作所在区域的辐射安全，实施本工作组的安全监护工作。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0159","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"低剂量等待区为绿区，用于在辐射控制区内的工作人员暂时没有工作任务时的待命或休息。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":""},{"id":"safety_fsjx_0160","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"除司机和辅助人员的其他人员可 况才需召开工前会","复杂工作不一定需要召开工前会","任何操作都需要召开工前会"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":""},{"id":"safety_fry_0024","module":"safety","bank":"防人因","type":"single","stem":"工前会指在执行一项任务/工作前，所有相关工作人员之间进行的（    ） 的准备会。","options":["面对面","电话交流","视频会议","各自筹备"],"answer":["A"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":""},{"id":"basics_cl_0001","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"压水堆核电站燃料元件包壳一般采用（　）。","options":["A锆合金","B不锈钢","C铝合金","D镍基合金"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：PWR燃料元件包壳一般都采用锆合金，原因是锆合金中子吸收截面小，且在350℃下具有优良的机械性能和抗水腐蚀能力，故本题选A锆合金。不锈钢、镍基合金等中子吸收截面相对较大，不适合作为包壳材料。\n\n【知识点】\n· 燃料包壳管是压水堆的第二道安全屏障，作用是支撑、保护燃料不受冷却剂浸蚀，防止裂变产物进入冷却剂回路。\n· 包壳材料要求：中子吸收截面小、导热率好；强度高、塑韧性好、耐蚀性强、对应力腐蚀不敏感；热强性、热稳定性和抗辐照性能好。\n· 压水堆燃料组件是将UO2烧结芯块封装在锆合金（如锆-4合金、M5等）管内组成元件，再以n×n阵列排列组成燃料组件。"},{"id":"basics_cl_0002","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"反应堆压力容器广泛采用MnMoNi钢（如A508-Cl.3），为防止腐蚀，与冷却剂接触的内壁（　）。","options":["A堆焊一层或两层奥氏体不锈钢衬里","B进行镀锌处理","C涂防腐油漆","D采用外加电流阴极保护"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：反应堆压力容器广泛采用MnMoNi钢，如A508-Cl.3(16MnD5)、A533-B，为防止腐蚀，与冷却剂接触的内壁堆焊了一层或两层奥氏体不锈钢里衬（308L/309L），故本题选A。\n\n【知识点】\n· 压力容器及一回路压力边界是压水堆的第三道安全屏障，用于保持一回路系统压力、防止冷却剂沸腾。\n· 燃料元件一旦破损时，压力容器保证放射性物质或气体仍保留在一回路系统内。\n· RPV工作条件苛刻（15.5MPa、约300℃、中子辐照），属厚部件（最大300mm）且庞大不可更换，须开展全寿期监督。\n· RPV材料为体心立方结构，存在低温脆性，中子辐照会使韧脆转变温度（DBTT）升高。"},{"id":"basics_cl_0003","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"优质碳素结构钢45钢牌号中的\"45\"表示（　）。","options":["A平均含碳量为0.45%","B平均含碳量为4.5%","C抗拉强度为450MPa","D平均含锰量为0.45%"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：优质碳素结构钢牌号用两位数字表示，这两位数字表示该钢的平均含碳量的万分数，如45钢，45表示平均含碳量为0.45%的优质碳素结构钢，故本题选A。\n\n【知识点】\n· 含锰较高的优质碳素结构钢要标出Mn，例如45Mn；高级优质钢、特级优质钢分别在牌号尾加A、E表示。\n· （普通）碳素结构钢牌号由Q+屈服强度值（MPa）+质量等级（A、B、C、D依次提高）组成，必要时标注脱氧方法（F-沸腾钢、Z-镇静钢、TZ-特殊镇静钢）。\n· 合金结构钢牌号：前面两位数字表示平均含碳量万分数，元素符号表示主要合金元素，含量小于1.5%不标，1.5%~2.5%标2，依此类推。"},{"id":"basics_cl_0004","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"控制材料（如硼B-10、铪Hf、镉Cd）的特点是（　）。","options":["A中子吸收截面大","B中子吸收截面小","C导热率高","D密度大"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：控制材料的特点是中子吸收截面大，如硼B-10、铪Hf、镉Cd等，故本题选A。与堆芯其他结构材料要求中子吸收截面尽可能小正好相反。\n\n【知识点】\n· 控制材料主要用作控制棒和可燃毒物。\n· 反应堆的功率调节、后备反应性的储备以及开堆、停堆等都需要用控制材料制成的控制棒、调节棒、可燃毒物等来实现。\n· 调节棒常用Ag-In-Cd合金，同样是利用其大的中子吸收截面；而燃料包壳（锆合金）、慢化剂（水、铍）则要求中子吸收截面小。"},{"id":"basics_cl_0005","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"黑色金属是指（　）及其合金。","options":["A铁、锰、铬","B铜、镍、钛","C铝、镁、锌","D金、银、铂"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：金属材料分为黑色金属和有色金属两类，黑色金属指铁、锰、铬及其合金，铜、镍、钛、铝等属于有色金属，故本题选A。\n\n【知识点】\n· 材料按大类分为：金属材料、无机非金属材料（陶瓷）、有机高分子材料（塑料）、复合材料（金属基、陶瓷基、高分子基）。\n· 金属是具有正的电阻温度系数的物质，通常具有良好的导电性、导热性、延展性、高的密度和高的光泽。\n· 核电站大量使用钢材：以100万千瓦压水堆为例，修建厂房的普通钢约5万吨，压力容器及安全壳约3700吨，堆芯约100吨。"},{"id":"basics_cl_0006","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"淬火热处理的目的是（　）。","options":["A获得马氏体组织","B得到接近平衡状态的组织","C使组织均匀化、细化","D消除内应力"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：淬火是加热到临界点（Ac3或Ac1）之上30~50℃，保温一段时间后急冷（使之发生马氏体相变），淬火的目的是获得马氏体组织，故本题选A。\n\n【知识点】\n· 退火：加热到临界点以上，保温后随炉缓慢冷却，得到接近平衡状态的组织，目的是消除热加工缺陷、为下一工序作准备（对应选项B）。\n· 正火：加热后空冷，目的是使组织均匀化、细化，以改善合金的强度和韧性（对应选项C）。\n· 回火：在A1开始温度以下加热并冷却，目的是消除应力、得到所需性能的相应组织（对应选项D）。\n· 热处理是通过加热、保温、冷却改变金属整体或表面组织以获取所需性能的工艺，常见方法有退火、正火、淬火、回火等。"},{"id":"basics_cl_0007","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"断裂韧度KIC表征材料（　）的能力。","options":["A阻止裂纹扩展","B抵抗更硬物体压入其表面","C在冲击载荷下抵抗变形和断裂","D产生塑性变形而不被破坏"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：断裂韧度表征材料阻止裂纹扩展的能力，是度量材料韧性好坏的一个定量指标，故本题选A。当KI达到临界值KIC时，零件内裂纹将发生失稳扩展而出现低应力脆性断裂。\n\n【知识点】\n· KIC是裂纹扩展时的临界强度因子，反映材料有裂纹存在时抵抗脆性断裂的能力。\n· KIC是材料本身的特性，与材料成分、热处理及加工工艺等有关，可通过试验测定，为安全设计提供重要的力学性能指标。\n· 硬度是材料抵抗其它更硬物体压入其表面的能力（选项B）；冲击韧性是材料在冲击载荷作用下抵抗变形和断裂的能力（选项C）；塑性是材料产生塑性变形而不被破坏的能力（选项D）。"},{"id":"basics_cl_0008","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"压水堆蒸汽发生器传热管早期用不锈钢，后改用INCONEL-600，发现其晶间腐蚀敏感性后又改用（　）。","options":["AINCOLOY-800或INCONEL-690合金","B钛合金","C碳钢","D低合金钢"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：PWR蒸汽发生器传热管早期用不锈钢（如304型），后用INCONEL-600，发现其晶间腐蚀敏感性后又改用INCOLOY-800或INCONEL-690合金，经稳定化处理，故本题选A。\n\n【知识点】\n· 传热管材料需具备：导热性能好、热膨胀系数小；抗应力腐蚀能力强；热强性、热稳定性和焊接性能良好；塑韧性好以便制管、弯管和胀管加工。\n· 蒸汽发生器U形管是主要传热构件，多达几千根，总长约70~110公里，设计时留有足够堵管裕量。\n· 核设备常用材料中，蒸发器U形管使用镍基合金（Incoloy 800、Inconel 690），设备冷却器、凝汽器传热管使用钛合金。"},{"id":"basics_cl_0009","module":"basics","bank":"核电基础-材料基础","type":"judge","stem":"安全壳是压水堆的第四道安全屏障。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：反应堆材料是堆安全的基础，防止堆内放射性物质外逸，四道安全屏障分别为：第一道——核燃料芯块，第二道——燃料包壳，第三道——压力容器和一回路压力边界，第四道——安全壳。安全壳是压水堆的第四道安全屏障，本题正确。\n\n【知识点】\n· 安全壳的目的一是防止发生强烈地震或失水等严重事故时放射性物质外逸污染环境，二是防止外界自然力或人为原因损坏反应堆。\n· 安全壳体积庞大，钢制安全壳在现场组装、焊接，焊后难以进行热处理。\n· 安全壳材料要求焊接性能好、杂质少、强度高、塑韧性好；国外多采用SA516、SA517钢或16Mn钢，AP1000用SA-738-B钢。"},{"id":"basics_cl_0010","module":"basics","bank":"核电基础-材料基础","type":"judge","stem":"燃料包壳是压水堆的第三道安全屏障。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：压水堆四道安全屏障依次为：核燃料芯块（第一道）、燃料包壳（第二道）、压力容器和一回路压力边界（第三道）、安全壳（第四道）。燃料包壳是第二道安全屏障而非第三道，本题错误。\n\n【知识点】\n· 燃料包壳管作用：支撑、保护燃料不受冷却剂浸蚀，防止裂变产物进入冷却剂回路。\n· 包壳材料应具备：中子吸收截面小、导热率好，强度高、塑韧性好、耐蚀性强、对应力腐蚀不敏感，热强性、热稳定性和抗辐照性能好。\n· UO2陶瓷芯块的陶瓷性质结构可以保持大部分裂变产物，构成第一道屏障。"},{"id":"basics_cl_0011","module":"basics","bank":"核电基础-材料基础","type":"judge","stem":"金属材料的韧脆转变温度越低，其低温冲击韧性越好。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：随温度降低，冲击韧度ak急剧下降，材料由韧性转变为脆性；金属材料的韧脆转变温度越低，材料的低温冲击韧性越好，本题正确。\n\n【知识点】\n· 韧脆转变温度（DBTT）是材料由韧性断裂向脆性断裂转变的特征温度。\n· 反应堆压力容器材料为体心立方结构，存在低温脆性，中子辐照会使DBTT升高，故需进行辐照监督。\n· 冲击韧性是材料在冲击载荷作用下抵抗变形和断裂的能力；冲击韧度ak为试样缺口处单位截面积上消耗的冲击功（J/cm²）。"},{"id":"basics_cl_0012","module":"basics","bank":"核电基础-材料基础","type":"judge","stem":"辐照脆化表现为屈服极限增加，塑性、韧性下降。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：辐照效应中的辐照脆化表现为屈服极限增加，塑性、韧性下降，本题正确。\n\n【知识点】\n· 为控制辐照脆化，需控制Cu（<0.08%）、P（<0.008%）含量，并设置辐照监督试样。\n· 辐照肿胀是另一类辐照效应，主要发生在燃料芯块。\n· 反应堆用材料要求辐照期间组织、结构稳定，脆化、肿胀等辐照效应和PCI（芯块与包壳相互作用）小，杂质和气体含量少，尤其Cu、P、S含量应尽量少。"},{"id":"basics_cl_0013","module":"basics","bank":"核电基础-材料基础","type":"judge","stem":"维氏硬度试验属于划痕法硬度测量。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：硬度试验方法分为（1）压入法：布氏硬度HB、洛氏硬度HR、维氏硬度HV；（2）划痕法（金刚石→滑石）；（3）回跳法（里氏硬度HL）。维氏硬度属于压入法而非划痕法，本题错误。\n\n【知识点】\n· 硬度是材料抵抗其它更硬物体压入其表面的能力。\n· 维氏硬度试验采用锥面夹角136°的金刚石正四棱锥体压入试样，与布氏硬度试验原理基本相同，HV=F/S。\n· 布氏硬度压头为淬火钢球HBS（<450）或硬质合金钢球HBW（450~650）；洛氏硬度采用120°金刚石圆锥体（HRA、HRC）或钢球（HRB）。"},{"id":"basics_cl_0014","module":"basics","bank":"核电基础-材料基础","type":"judge","stem":"反应堆及一回路主要结构材料中，不锈钢约占80%-90%。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：反应堆及一回路主要结构材料为锆合金、合金钢、不锈钢、镍基合金，约90%以上用这些材料制造，其中不锈钢占80%-90%，本题正确。\n\n【知识点】\n· 核电站主要设备的结构材料绝大多数是金属材料。\n· 反应堆用材料分为功能类材料（核燃料、控制、慢化、冷却剂、反射、屏蔽材料）和结构类材料（包壳、堆内构件、压力容器、回路、蒸汽发生器、安全壳材料）。\n· 堆内构件用材主要是奥氏体不锈钢，部分采用镍基合金；一回路管道材料大量使用奥氏体或双相不锈钢和镍基合金。"},{"id":"basics_cl_0015","module":"basics","bank":"核电基础-材料基础","type":"multi","stem":"冷却剂材料应具备的性能包括（　）。","options":["A导热性好","B比热容大","C腐蚀性小","D中子吸收截面大"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件《核电厂材料基础》：冷却剂是将核裂变能导出堆芯的载热剂，冷却剂性能要求为：导热性好、比热容大、流动性好和腐蚀性小，故本题选ABC；冷却剂并不要求中子吸收截面大，D错误。\n\n【知识点】\n· 常用冷却剂：轻水、重水，气体He、CO2，液体金属如钠、钠钾合金、铅铋合金，现代还有熔盐等。\n· 压水堆的冷却剂与慢化剂功能合一，都用轻水或重水。\n· 慢化材料特性为质量轻、中子散射截面大，靠非弹性碰撞（弹性碰撞）降低快中子能量，将裂变快中子慢化成热中子以提高235U裂变效率。"},{"id":"basics_dq_0001","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"电力网（电网）主要由（　）组成。","options":["变压器和发电机","锅炉和汽轮机","输电线路和变电所","用户用电设备"],"answer":["C"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第12页\"电力系统的构成\"：\"电力网（电网）：由变电所和电力线路组成，主要功能为变换电压，传送电能\"。故电力网由输配电线路（电力线路）和变电所组成，选C；发电机属电源环节，锅炉、汽轮机属动力设备，用户用电设备属用电环节，均不属于电网本身。\n\n【知识点】\n· 电力网（电网）由变电所和电力线路组成，是连接电源与用户的中间环节，功能为变换电压、传送电能。\n· 动力系统是在电力系统基础上把发电厂动力部分（锅炉、汽轮机等）包含在内的系统。\n· 电力系统=发电厂的发电机+电力网+用户的用电设备整体。\n· 变电所是电力网中变换电压、汇集和分配电能的枢纽。"},{"id":"basics_dq_0002","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"我国电力系统的额定频率为（　）。","options":["60Hz","50Hz","48Hz","100Hz"],"answer":["B"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第28页\"电力系统有功功率与频率\"：\"我国电力系统额定频率为50 Hz，系统运行频率与系统额定频率之差称为频率偏移。频率偏移不得超过±0.2 Hz\"。故我国电力系统额定频率（工频）为50Hz，选B。\n\n【知识点】\n· 我国电力系统额定频率为50Hz，频率偏差不得超过±0.2Hz。\n· 在有功功率平衡的情况下，频率处在正常范围内运行；有功功率不足则频率下降。\n· 频率调整分为一次调整（靠原动机调速器调差特性自动进行）、二次调整（操作调速器调频）和三次调整（按经济负荷分配事先调度）。\n· 发电机转速与频率满足关系式 n=60f/p（p为磁极对数）。"},{"id":"basics_dq_0003","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"无功功率是指用来在电气设备中（　）的电功率。","options":["转变为机械能输出","建立和维持交变磁场（进行电磁能量转换）","直接对外做功","完全变为热能损耗"],"answer":["B"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第33页\"电力系统无功功率与电压\"：\"无功功率：用来在电气设备中建立和维持磁场的电功率\"。即无功功率并不直接转变为机械能或热能对外做功，而是用于建立和维持交变磁场、实现电磁能量的转换与传递，故选B。\n\n【知识点】\n· 无功功率用来在电气设备中建立和维持磁场，是实现电磁能量转换所必需的。\n· 无功功率平衡：系统发出的无功功率必须等于负荷消耗的无功功率与变压器、线路消耗的无功功率之和。\n· 发电机是最基本的无功功率电源，此外还有并联电容器、同步调相机和静止补偿器等。\n· 无功功率的平衡情况主要通过监测系统电压来实现，无功平衡时电压处于正常范围。"},{"id":"basics_dq_0004","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"下列属于二次设备的是（　）。","options":["发电机","电力变压器","母线","继电保护装置"],"answer":["D"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第34~35页\"核电厂的电气设备\"：\"一次设备：直接生产和输配电能的设备\"，包括发电机、变压器、母线、断路器、隔离开关、互感器等；\"二次设备：对一次设备的工作进行监察、测量、控制和保护的辅助设备\"，包括仪表和信号装置、继电保护和自动装置、远动装置和控制装置。继电保护装置属于二次设备，发电机、变压器、母线均为一次设备，故选D。\n\n【知识点】\n· 一次设备是直接生产和输配电能的设备（发电机、变压器、母线、开关电器、互感器等）。\n· 二次设备是对一次设备进行监察、测量、控制和保护的辅助设备。\n· 互感器是把一次电路与二次电路相联系的设备（一次侧属一次系统，供二次回路使用）。\n· 继电保护装置和自动装置、仪表信号、远动控制装置均属二次设备。"},{"id":"basics_dq_0005","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"关于隔离开关，下列说法正确的是（　）。","options":["能切断负荷电流","能切断短路电流","无灭弧装置、不能切断负荷电流，用于形成明显断开点隔离电源","可频繁自动操作"],"answer":["C"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第50~52页\"核电厂主要开关电器\"：\"隔离开关没有专门的灭弧装置，只能在无压和无负荷的情况下通断回路\"；\"由于隔离开关不能切断负荷电流与短路电流，因此在和断路器配合使用时要有机械或电气的闭锁\"。故隔离开关无灭弧装置、不能切断负荷电流，用于形成明显断开点隔离电源，选C。\n\n【知识点】\n· 隔离开关没有专门的灭弧装置，只能在无压、无负荷情况下通断回路，严禁带负荷操作。\n· 隔离开关的作用：隔离电源、倒闸操作、关合小电流电路。\n· 隔离开关具有明显的断开点，断口绝缘水平高于断路器，保证检修人员安全。\n· 与断路器配合时的操作顺序：先分断路器后分隔离开关；合闸时先合隔离开关后合断路器（靠机械或电气闭锁保证）。"},{"id":"basics_dq_0007","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"电流互感器二次侧严禁（　）。","options":["短路","直接接地","开路","接测量仪表"],"answer":["C"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第120页互感器使用注意事项：\"CT二次侧开路：次级阻抗无限大，次级电流为0，次级电压很高；高电压可能击穿电流互感器绝缘，使配电设备外壳带电，使检修人员触电\"，并明确\"电流互感器二次侧禁止开路！\"。故电流互感器二次侧严禁开路，选C；二次侧还应可靠接地（保护接地），不得装设熔断器。\n\n【知识点】\n· 电流互感器（TA/CT）将大电流按比例变换成标准小电流（5A或1A），一次绕组与被测电路串联。\n· CT二次侧开路会产生很高电压，可能击穿绝缘、使外壳带电、危及人身安全，因此严禁开路。\n· 电流互感器二次侧不允许装设熔断器。\n· 电压互感器和电流互感器的二次绕组均应可靠接地（保护接地），以防一次、二次绕组间绝缘损坏时高电压危及人身及设备安全。"},{"id":"basics_dq_0008","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"一台半断路器接线也称作（　）接线。","options":["单母线","双母线","桥形","3/2（每回线路经两台断路器、三回线路共用一台断路器）"],"answer":["D"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第181~184页\"典型电气主接线简述\"：\"一台半断路器接线也称作3/2断路器接线\"；\"一台半断路器接线是一种没有多回路集结点，一个回路由两台断路器供电的多环形接线，是现代国内外大型电厂和变电所超高压配电装置广泛应用的一种接线\"。即一台半断路器接线就是3/2接线，每回线路由两台断路器供电、三台断路器带两个回路（平均每回1.5台），故选D。（注：选项D括号内\"三回线路共用一台断路器\"的表述欠严谨，课件原文为\"每串为三台断路器，接两个回路\"，但不影响本题判断。）\n\n【知识点】\n· 一台半断路器接线即3/2断路器接线，一个回路由两台断路器供电，属多环形接线。\n· 有母线的电气主接线基本形式：单母线接线、双母线接线、一台半断路器接线。\n· 一台半断路器接线具有高度可靠性、运行调度灵活、操作检修方便的特点。\n· 一台半断路器接线至少应有三个串（每串三台断路器接两个回路）才能形成多环形；其二次回路和继电保护较复杂。"},{"id":"basics_dq_0009","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"下列不属于继电保护基本要求的是（　）。","options":["可靠性","经济性","选择性","速动性"],"answer":["B"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第195~196页\"继电保护的基本要求\"，四项基本要求为：选择性（由距故障点最近的保护动作，尽量缩小停电范围）、速动性（快速切除故障）、灵敏性（对保护范围内任何故障的反应能力）、可靠性（不误动、不拒动）。课件四项基本要求中并无\"经济性\"，故选B。\n\n【知识点】\n· 选择性：故障时由距故障点最近的保护装置动作，仅切除故障元件，缩小停电范围。\n· 速动性：快速切除故障，提高系统并联运行稳定性，缩小故障元件损坏程度。\n· 灵敏性：对保护范围内任何故障或不正常运行状态都能敏锐感应、正确反应。\n· 可靠性：该动时不拒动、不该动时不误动。\n· 继电保护四项基本要求为可靠性、选择性、速动性、灵敏性，简称\"四性\"。"},{"id":"basics_dq_0010","module":"basics","bank":"核电基础-电气原理与设备","type":"single","stem":"要改变三相异步电动机的转动方向，只需（　）。","options":["对调任意两根电源相线","提高电源电压","降低电源频率","更换电动机转子"],"answer":["A"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第161页\"定子旋转磁场的旋转方向\"：\"转子的转动方向与定子旋转磁场的旋转方向相同……如果要改变电动机的转动方向，只要对调电动机三相交流电电源进线的任意两相接线，这样就改变了电流的相序，即改变了旋转磁场的方向，则电动机的转动方向也相应改变\"。故只需对调任意两根电源相线即可反转，选A。\n\n【知识点】\n· 异步电动机转子转向与定子旋转磁场方向相同。\n· 旋转磁场方向与三相电流的相序一致，对调任意两相电源接线即改变相序、实现反转。\n· 三相异步电动机转动原理：转子导条切割定子旋转磁场产生感应电流，感应电流与磁场相互作用产生电磁转矩。\n· 定子旋转磁场转速（同步转速）与频率关系为 n=60f/p。"},{"id":"basics_dq_0011","module":"basics","bank":"核电基础-电气原理与设备","type":"judge","stem":"电能不能直接被储存，其生产、输送、分配和消费是同时进行的。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第14页\"电力系统运行的特点及基本要求\"电能的特点：\"电能不能直接被储存，电能的生产、输送、分配、消费是同时进行的\"。故本判断正确。这也是电力系统必须保证有功功率实时平衡、频率时刻合格的根本原因。\n\n【知识点】\n· 电能不能直接被储存，其生产、输送、分配和消费是同时进行的（同时性）。\n· 电能较其他能源转化方便，可大规模生产、集中管理、远距离输送、自动控制。\n· 人类社会对电能依赖程度极高，停电会造成重大损失，故电力系统运行必须安全可靠。\n· 由于发、输、配、用同时进行，有功功率必须时刻保持平衡，否则频率偏移。"},{"id":"basics_dq_0012","module":"basics","bank":"核电基础-电气原理与设备","type":"judge","stem":"考虑到运行的安全性，核电厂的GIS通常选用户内全封闭型。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第56页\"气体绝缘金属封闭组合电器\"：\"GIS通常有户外型和户内型，在核电厂考虑到运行的安全性，GIS通常选用户内全封闭型\"。故本判断正确。\n\n【知识点】\n· GIS（气体绝缘金属封闭组合电器）将断路器、母线、隔离开关、互感器、避雷器等高压电器封闭组合，以SF6气体为绝缘和灭弧介质。\n· GIS有户外型和户内型两种，核电厂考虑到运行安全性通常选用户内全封闭型。\n· GIS元件密封在接地金属筒中，各气室相互隔绝。\n· GIS与常规配电装置相比节省占地、可靠性高、维护量小、抗震性能好、不受外界环境影响。"},{"id":"basics_dq_0013","module":"basics","bank":"核电基础-电气原理与设备","type":"judge","stem":"蓄电池浮充电方式运行时，浮充电电流过小会导致极板硫化。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第95页\"蓄电池组浮充电方式运行\"：\"浮充电电流的大小取决于蓄电池的自放电率，浮充电电流应刚好补偿蓄电池的自放电。如果浮充电的电流过小，则蓄电池的自放电就长期得不到足够的补偿，将导致极板硫化（极板有效物质失效）\"。故本判断正确。\n\n【知识点】\n· 浮充电方式运行：充电器与蓄电池组并列运行，以较小浮充电流补偿蓄电池自放电损耗，使其保持完全充足电状态。\n· 浮充电流过小：自放电长期得不到补偿，导致极板硫化（极板有效物质失效）。\n· 浮充电流过大：长期过充电，引起极板有效物质脱落，缩短使用寿命并浪费电能。\n· 浮充电运行的蓄电池需定期进行均衡（核对性）充电，防止单体电压不均衡。"},{"id":"basics_dq_0014","module":"basics","bank":"核电基础-电气原理与设备","type":"judge","stem":"变压器铁芯采用冷轧硅钢片叠成，是为了减少磁滞和涡流损耗。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第109页变压器结构：\"铁芯是变压器的磁路部分，为了减少铁芯的磁滞和涡流损耗，铁芯通常是用厚度为0.35mm或0.5mm厚的冷轧硅钢片叠成，片与片间用绝缘漆绝缘\"。故采用冷轧硅钢片叠成并片间绝缘，是为了减少磁滞和涡流损耗，本判断正确。\n\n【知识点】\n· 铁芯是变压器的磁路部分，绕组是电路部分。\n· 铁芯用0.35mm或0.5mm厚冷轧硅钢片叠成，片间涂绝缘漆，以减少磁滞和涡流损耗。\n· 变压器是具有两个或多个绕组的静止设备，通过电磁感应在同一频率下变换电压和电流。\n· 变压器一、二次绕组通过电磁联系感应出同频率电动势，实现电能传递。"},{"id":"basics_dq_0015","module":"basics","bank":"核电基础-电气原理与设备","type":"judge","stem":"发电机逆功率保护的保护目标是发电机本身。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第205页\"逆功率保护\"：\"逆功率对发电机本身并无损坏，其危害主要是引起汽轮机低压缸末级叶片过热\"，并明确\"发电机逆功率保护的目标是汽轮机\"。即逆功率保护保护的是汽轮机而非发电机本身，故本判断错误。\n\n【知识点】\n· 汽轮机主汽门关闭后发电机变为同步电动机运行，从发出有功（P＞0）变为吸收有功（P＜0），即逆功率。\n· 逆功率对发电机本身并无损坏，危害主要是汽轮机低压缸末级叶片过热。\n· 发电机逆功率保护的目标是汽轮机，检测到逆功率即动作跳发电机。\n· 逆功率保护属于发电机的异常运行保护之一，与失磁、负序过电流等保护配合构成发电机保护体系。"},{"id":"basics_dq_0016","module":"basics","bank":"核电基础-电气原理与设备","type":"judge","stem":"异步电动机的直接启动（全压启动）方式适用于容量较大的电动机。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第166~167页\"异步电动机的启动\"：\"对于容量较小的电动机……可以在额定电压下启动\"（直接启动/全压启动）；\"对于容量较大的电动机，由于额定电流较大（因而启动电流较大），这样大的电流流过电网时将使电网的电压严重降低\"，需采用降压启动。即全压启动适用于容量较小的电动机，本判断错误。\n\n【知识点】\n· 异步电动机启动方式有直接启动（全压启动）和降压启动两种。\n· 启动电流很大，一般约为额定电流的4~7倍。\n· 容量较小的电动机可在额定电压下直接启动；容量较大的电动机应降压启动，以免电网电压显著下降。\n· 降压启动的原则是\"降压启动，全压运转\"，进入正常运转后应使电压升到额定值。"},{"id":"basics_dq_0017","module":"basics","bank":"核电基础-电气原理与设备","type":"judge","stem":"同步发电机在额定出力时，功角δ通常在30°左右。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第143页\"发电机的功角特性\"：\"通常发电机在额定出力时，δ角在30°左右，让它离90°远一些，这是设计时考虑好的\"。功角δ超过90°即超出静态稳定极限（临界状态），额定出力时δ约30°是为了保持足够的静态稳定储备，故本判断正确。\n\n【知识点】\n· 功角δ是定子磁极中心线与转子磁极中心线的夹角，也是端电压U与感应电势E0间的夹角。\n· δ在0~90°区间时输出有功随δ增大而增大，δ=90°时达到功率极限Pmax，为静态稳定临界状态。\n· 系统要保持静态稳定必须工作在功角特性曲线上升部分（δ<90°）。\n· 发电机额定出力时δ角通常在30°左右，以远离90°保持稳定；发电机过载能力一般为1.7~3。"},{"id":"basics_dq_0018","module":"basics","bank":"核电基础-电气原理与设备","type":"multi","stem":"气体绝缘金属封闭组合电器（GIS）由下列哪些高压电器组合而成？（　）","options":["断路器","隔离开关/接地开关","电流互感器、电压互感器","裸露的空气绝缘母线支架"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"电气原理与设备课件","explanation":"依据课件《核电厂电气原理与设备概述》第56页\"气体绝缘金属封闭组合电器\"：GIS\"是由断路器、母线、隔离开关、电压互感器、电流互感器、避雷器、套管、连接节等几种高压电器组合而成的高压配电装置，采用的是绝缘性能和灭弧性能优异的SF6气体作为绝缘和灭弧介质，并将所有的高压电器元件密封在接地金属筒中\"。故断路器、隔离开关/接地开关、电流互感器和电压互感器均属GIS组成元件，选ABC；而\"裸露的空气绝缘母线支架\"与GIS全封闭、SF6绝缘的特点相矛盾，不选D。\n\n【知识点】\n· GIS由断路器、母线、隔离开关、电压互感器、电流互感器、避雷器、套管、连接节等高压电器组合而成。\n· GIS以SF6气体作为绝缘和灭弧介质，所有高压元件密封在接地金属筒中，各气室相互隔绝。\n· SF6断路器开断能力强、体积小，常用于高压/超高压系统及GIS和发电机出口断路器中。\n· GIS与常规配电装置相比节省占地空间、运行可靠性高、维护量小、适应性强。"},{"id":"basics_fs_0001","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"原子核中质子数与中子数之和称为（　）。","options":["原子序数","质量亏损","质量数","摩尔质量"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件第1.2节明确指出\"原子核中质子数和中子数之和称为原子质量数，也称质量数，用符号A表示\"。故本题选C（质量数）。原子序数Z是质子数，与中子数无关；质量亏损指核子结合前后的质量差，摩尔质量与核内粒子数无直接对应。\n\n【知识点】\n· 原子核中质子数和中子数之和称为质量数，用符号A表示。\n· 原子核中质子的数目称为原子序数，用符号Z表示，它确定原子的化学特性。\n· 通常用符号AZX表示原子核，X为元素符号，Z为原子序数，A为质量数。\n· 原子序数相同而质量数不同的同一类原子叫做同位素。"},{"id":"basics_fs_0002","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"半衰期是指放射性核素的原子数目因衰变减少到原来（　）所需要的时间。","options":["一半","四分之一","十分之一","百分之一"],"answer":["A"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件第1.2节\"放射性及其衰变规律\"中给出定义：\"半衰期T1/2：放射性核素的原子数目因衰变而减少到它原来的一半所需要的时间\"。故本题选A（一半）。\n\n【知识点】\n· 半衰期是放射性核素的原子数目因衰变减少到原来一半所需的时间。\n· 衰变常数λ是单位时间内原子核发生衰变的几率。\n· 原子核数量减少遵循规律 N(t) = N0·e^(-λt)，即按指数规律衰减。\n· 半衰期、衰变速率等是原子核的固有属性，与物质的物理、化学性质无关。"},{"id":"basics_fs_0003","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"α粒子穿透力很弱，用（　）就可以挡住它。","options":["几毫米铅板","几厘米木板","一张厚纸","一张纸"],"answer":["D"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件在射线类型部分指出\"α粒子穿透力很弱，在空气中的射程只有几厘米，用一张纸就可以挡住它\"。故本题选D（一张纸），\"厚纸\"是干扰项，课件原话即普通一张纸即可。\n\n【知识点】\n· α粒子穿透力很弱，在空气中射程只有几厘米，一张纸即可挡住。\n· α粒子一般情况下不考虑外照射，仅考虑其内照射危害。\n· 核电厂只在燃料组件破损的情况下α粒子才会进入主冷却剂系统。\n· β粒子穿透力比α强，用玻璃或铅纸就可以挡住；γ射线则需厚实高密度材料（水泥墙、铅板、大量水）才能减弱。"},{"id":"basics_fs_0004","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"对中子的屏蔽材料应选择（　）。","options":["铅等重物质","含氢较多的轻物质（水、石蜡、聚乙烯）","铁板","铝板"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件在中子（n）部分明确说明：\"对中子的屏蔽材料应选择轻物质，即含有较多氢元素的物质，如石蜡、水等\"。故本题选B。铅等重物质适于屏蔽γ，对慢化中子效果差。\n\n【知识点】\n· 中子不带电，可穿透物质深部，一般只与原子核发生作用（核反应）。\n· 中子屏蔽应选择含氢较多的轻物质，如石蜡、水、聚乙烯等。\n· 中子和γ射线是穿透本领最强的两种射线。\n· 核反应会产生反冲原子核及中子、质子、α粒子等次级带电粒子。"},{"id":"basics_fs_0005","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"辐射工作人员连续5年的年平均有效剂量不得超过（　）。","options":["50mSv","100mSv","20mSv","5mSv"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件\"现行个人剂量限值的国家标准\"（2.1辐射照射概述）规定辐射工作人员\"连续5年的年平均有效剂量不大于20mSv；任何一年中的有效剂量50mSv\"。故本题选C（20mSv）。\n\n【知识点】\n· 辐射工作人员连续5年的年平均有效剂量不大于20mSv。\n· 任何一年中的有效剂量不超过50mSv。\n· 眼晶体年当量剂量150mSv；四肢（手和足）或皮肤年当量剂量500mSv。\n· 16岁-18岁学徒工或实习学生年有效剂量6mSv；公众年有效剂量不超过1mSv。"},{"id":"basics_fs_0006","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"ALARA原则是指将一切辐射照射保持在（　）水平。","options":["可合理达到的尽量低","尽可能接近零","技术上可行的最低","不计代价的最低"],"answer":["A"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件在辐射防护三原则部分指出：\"在考虑了经济和社会的因素之后，应当将一切辐射照射保持在合理达到的尽可能低的水平（ALARA）\"，\"辐射防护最优化原则也称为ALARA原则\"。故本题选A（可合理达到的尽量低），\"不计代价\"\"接近零\"等表述均不符。\n\n【知识点】\n· ALARA即\"合理达到的尽可能低\"，是辐射防护最优化原则。\n· 实施ALARA需在考虑经济和社会因素之后。\n· 辐射防护三原则为实践的正当性、辐射防护最优化、个人剂量限制。\n· 电站通风设计也要求气态放射性物质浓度保持在可合理达到的尽可能低水平。"},{"id":"basics_fs_0007","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"放射性活度的单位是（　）。","options":["希沃特（Sv）","贝克勒尔（Bq）","戈瑞（Gy）","库仑/千克"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件\"放射性活度的概念\"部分指出：\"放射性核素在单位时间内发生核衰变的数目，称为放射性活度\"，\"放射性活度的单位是贝克（Bq），1贝可表示放射源1秒发生1次衰变\"。故本题选B。Sv是剂量当量单位、Gy是吸收剂量单位。\n\n【知识点】\n· 放射性活度是放射性核素单位时间内发生核衰变的数目。\n· 活度单位是贝克勒尔（Bq），1Bq表示1秒发生1次衰变。\n· 过去习惯用居里（Ci）表示活度，1Ci=3.7×10^10 Bq（1克镭的活度）。\n· 希沃特（Sv）是剂量当量（有效剂量）单位，戈瑞（Gy）是吸收剂量单位。"},{"id":"basics_fs_0008","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"下列关于随机性效应的说法，正确的是（　）。","options":["存在剂量阈值","发生概率与受照剂量成正比，不存在阈值","只在高剂量下才发生","不会遗传给后代"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件\"确定性效应与随机性效应\"部分指出：\"随机性效应：指效应的发生不存在剂量阈值，辐射效应发生概率与受照剂量呈正比，剂量越大，危险性越高\"。故本题选B。存在剂量阈值是确定性效应的特征。\n\n【知识点】\n· 随机性效应不存在剂量阈值，发生概率与受照剂量成正比。\n· 随机性效应的严重程度与剂量大小无关。\n· 确定性效应有剂量阈值，损伤严重程度随剂量增加而加重。\n· 辐射防护目标是避免确定性效应发生，并把随机性效应发生概率限制到合理可行尽量低的水平。"},{"id":"basics_fs_0009","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"辐射控制区子区中，绿色区的辐射剂量率为（　）。","options":["小于25μSv/h","25μSv/h～100μSv/h","100μSv/h～2mSv/h","大于2mSv/h"],"answer":["A"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件\"辐射控制区子区的划分\"表格中给出：绿区辐射剂量率＜25μSv/h，黄区25～500μSv/h，橙区500～5000μSv/h，红区≥5000μSv/h。绿色区剂量率最低，故本题选A（小于25μSv/h）。\n\n【知识点】\n· 绿区：剂量率＜25μSv/h，β表面污染＜4 Bq/cm2。\n· 黄区：25～500μSv/h；橙区：500～5000μSv/h；红区：≥5000μSv/h。\n· 大部分电站控制区子区的划分主要根据场所剂量率大小，各核电厂划分标准不完全相同。\n· 辐射控制区内可根据照射水平、污染水平、工作性质及辐射源情况细分子区。"},{"id":"basics_fs_0010","module":"basics","bank":"核电基础-辐射防护基础","type":"single","stem":"核电站中对剂量贡献最大的活化产物核素是（　）。","options":["碘-131","铯-137","钴-60","氚"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件4.2核电厂辐射源源项表指出，活化产物主要核素有钴-60、钴-58、银-110m、锑-124，且\"对剂量贡献最大的核素为钴-60和钴-58，某些情况下还有银-110及锑-124\"。选项中钴-60位列第一，故选C。碘-131、铯-137属于裂变产物。\n\n【知识点】\n· 活化产物中对剂量贡献最大的核素为钴-60和钴-58。\n· 活化产物由堆芯附近物质（堆内结构、一回路腐蚀产物）被中子活化形成。\n· 碘-131、铯-134、铯-137、氙-133、氪-85等属于裂变产物。\n· 结构材料中微量钴经中子活化使60Co累积量持续升高，运行几年后60Co辐射将占主要地位。"},{"id":"basics_fs_0011","module":"basics","bank":"核电基础-辐射防护基础","type":"judge","stem":"公众的年有效剂量限值为5mSv。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件\"现行个人剂量限值的国家标准\"规定：\"公众年有效剂量当量不超过1mSv\"。题干\"5mSv\"错误，故本题判\"错误\"。\n\n【知识点】\n· 公众年有效剂量不超过1mSv。\n· 公众皮肤和眼晶体的年有效剂量当量限值为50mSv。\n· 16周岁以下人员、已怀孕妇女按公众对待。\n· 剂量限值是内、外照射产生剂量的总和，不适用于医疗照射和天然本底照射。"},{"id":"basics_fs_0012","module":"basics","bank":"核电基础-辐射防护基础","type":"judge","stem":"16周岁以下人员和已怀孕妇女按公众对待。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件个人剂量限值部分明确列出：\"16周岁以下人员、已怀孕妇女——按公众对待\"。故本题判\"正确\"。\n\n【知识点】\n· 16周岁以下人员按公众对待。\n· 已怀孕妇女按公众对待。\n· 公众年有效剂量当量不超过1mSv。\n· 16岁-18岁的学徒工或实习学生年有效剂量限值为6mSv（介于工作人员与公众之间）。"},{"id":"basics_fs_0013","module":"basics","bank":"核电基础-辐射防护基础","type":"judge","stem":"松散污染既有外照射风险，也存在内照射风险。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件表面污染部分指出：\"松散污染有可能形成空气或体表污染，造成内污染；即松散污染既有外照射风险，同时也存在内照射风险\"。故本题判\"正确\"。\n\n【知识点】\n· 松散污染是容易擦除转移的污染；固定污染是无法擦除转移的污染。\n· 松散污染既有外照射风险，也存在内照射风险。\n· 固定污染在β和γ辐射体情况下可能存在外照射危害。\n· 不用细纱手套直接接触湿表面或松散污染，必须接触时应加戴橡胶（乳胶）手套。"},{"id":"basics_fs_0014","module":"basics","bank":"核电基础-辐射防护基础","type":"judge","stem":"随机性效应的发生存在剂量阈值。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件指出\"随机性效应：指效应的发生不存在剂量阈值，辐射效应发生概率与受照剂量呈正比\"。题干\"存在剂量阈值\"与课件矛盾，故本题判\"错误\"（存在阈值的是确定性效应）。\n\n【知识点】\n· 随机性效应不存在剂量阈值。\n· 随机性效应发生几率与剂量大小有关，严重程度与剂量无关。\n· 确定性效应存在剂量阈值，剂量降到一定程度时这类效应不出现。\n· 辐射生物效应按是否存在剂量阈值分为随机性效应和确定性效应。"},{"id":"basics_fs_0015","module":"basics","bank":"核电基础-辐射防护基础","type":"judge","stem":"外照射剂量等于剂量率与受照时间的乘积。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件4.3节外照射部分明确给出：\"外照射剂量等于剂量率和受照时间的乘积，即 H＝Hr×t\"。故本题判\"正确\"。\n\n【知识点】\n· 外照射剂量 H＝Hr（剂量率）×t（受照时间）。\n· 外照射是核电站工作人员接受照射的最常见和最主要方式。\n· 常见引起外照射的射线有β、γ和中子，核电厂中γ射线是主要外照射形式。\n· 离开辐射区域时就不会受到外照射危害，这是外照射的特点。"},{"id":"basics_fs_0016","module":"basics","bank":"核电基础-辐射防护基础","type":"judge","stem":"放射性物质的活度随时间按指数规律衰减。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件给出原子核数量减少规律 N(t)=N0·e^(-λt)，并指出\"放射性物质活度减少是按照指数规律\"。故本题判\"正确\"。\n\n【知识点】\n· 原子核数量按 N(t)=N0·e^(-λt) 指数规律衰减。\n· 放射性物质活度随时间按指数规律减少。\n· 衰变常数λ是单位时间内原子核发生衰变的几率。\n· 单个原子核何时衰变是随机的，但大量原子核单位时间衰变的平均数是确定的。"},{"id":"basics_fs_0017","module":"basics","bank":"核电基础-辐射防护基础","type":"judge","stem":"活化产物在停堆检修期间造成的危害最大，占剂量贡献的90%以上。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件4.2核电厂辐射源源项表明确指出：\"活化产物在停堆检修期间造成的危害最大，占剂量贡献的90%以上\"。故本题判\"正确\"。\n\n【知识点】\n· 活化产物在停堆检修期间危害最大，占剂量贡献90%以上。\n· 停堆后主要辐射源是裂变产物和活化产物放出的γ辐射，裂变产物γ辐射强度迅速减小。\n· 停堆时腐蚀产物（活化产物）沉积在各系统及堆内构件中。\n· 反应堆内结构材料（不锈钢、锆、水）的中子活化产物是核电站运行中影响最大的辐射源。"},{"id":"basics_fs_0018","module":"basics","bank":"核电基础-辐射防护基础","type":"multi","stem":"外照射防护的基本方法包括（　）。","options":["时间防护（减少受照时间）","距离防护（增大与源的距离）","屏蔽防护（设置屏蔽体）","服用碘片等药物"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"辐射防护基础课件","explanation":"依据课件《核电厂辐射防护基础》：课件4.3节\"外照射的防护\"列出方法：屏蔽防护、距离防护、时间防护（以及源项控制）。时间、距离、屏蔽即外照射防护三大基本方法，故选ABC；服碘片只针对放射性碘的内照射防护，不属于外照射防护方法。\n\n【知识点】\n· 时间防护：缩短人在辐射场中逗留时间以降低受照剂量。\n· 距离防护：增加人与辐射源之间的距离以降低受照剂量。\n· 屏蔽防护：在人与辐射源之间加设屏蔽材料（水泥墙、铅墙、充水、铅皮等）。\n· 源项控制（去污、冲洗管道设备）也是降低工作区域剂量率的措施。\n· 外照射剂量H＝Hr×t，缩短时间、拉开距离、加屏蔽均可降低剂量。"},{"id":"basics_shx_0001","module":"basics","bank":"核电基础-水化学","type":"single","stem":"pH值的定义为水中（　）的负常用对数。","options":["A氢离子浓度","B氢氧根离子浓度","C溶解氧浓度","D总离子浓度"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》1.2.2节：\"水的离子积常数Kw为1.0×10-14，pH值定义为水中氢离子浓度的负常用对数\"。故本题选A（氢离子浓度）；pOH才是氢氧根离子浓度的负常用对数，与溶解氧、总离子浓度无关。\n\n【知识点】\n· pH值定义为水中氢离子浓度的负常用对数，pOH值定义为水中氢氧根离子浓度的负常用对数。\n· 25℃时水的离子积常数Kw为1.0×10-14。\n· 根据pH大小分：＜7酸性、=7中性、＞7碱性。\n· pH只与[H+]有关，而电导率不只与一种离子有关。"},{"id":"basics_shx_0002","module":"basics","bank":"核电基础-水化学","type":"single","stem":"核电厂水处理流程一般为（　）。","options":["A原水预处理→超滤→反渗透→离子交换","B反渗透→超滤→原水预处理→离子交换","C离子交换→超滤→反渗透→原水预处理","D原水预处理→离子交换→超滤→反渗透"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》第2章水处理技术：\"水处理流程一般为：原水预处理→超滤→反渗透→离子交换等\"。故本题选A。预处理的混凝、澄清和过滤先除去悬浮物、胶体，为后续膜分离和离子交换创造条件；超滤一般作为反渗透的预处理。\n\n【知识点】\n· 核电厂水处理流程一般为：原水预处理→超滤→反渗透→离子交换。\n· 预处理采用混凝、澄清和过滤等工艺，除去悬浮物和胶体杂质。\n· 超滤主要去除悬浮颗粒、胶体及较大分子的有机物，一般作为反渗透的预处理。\n· 反渗透和电渗析主要去除水的溶解盐类；离子交换法可制备高品质除盐水。"},{"id":"basics_shx_0003","module":"basics","bank":"核电基础-水化学","type":"single","stem":"7Li作为压水堆一回路pH控制剂的优点是（　）。","options":["A中子吸收截面很低，不产生感生放射性","B价格便宜，来源充足","C腐蚀性比NaOH和KOH都强","D能使冷却剂产生很强的感生放射性"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》第59页\"7Li作为pH控制剂优点\"：\"7Li的中子吸收截面很低，不产生感生放射性\"，同时\"用硼酸作为可溶性中子吸收剂时，10B的(n,α)反应生成7Li\"、\"腐蚀性较小，NaOH>KOH>LiOH\"。故本题选A；B、D与课件相反（7Li价格较贵、不易得到，且不产生感生放射性），C与腐蚀性顺序矛盾。\n\n【知识点】\n· 7Li的中子吸收截面很低，不产生感生放射性。\n· 用硼酸作可溶性中子吸收剂时，10B的(n,α)反应生成7Li，可自行补充pH控制剂。\n· 7Li对冷却剂净化有利，离子交换易除去杂质。\n· 三种碱腐蚀性：NaOH>KOH>LiOH；但7Li价格较贵，不易得到。\n· 西方国家的压水堆几乎都用高纯7LiOH作pH控制剂，俄罗斯压水堆多用天然KOH。"},{"id":"basics_shx_0004","module":"basics","bank":"核电基础-水化学","type":"single","stem":"LiOH、KOH、NaOH三种碱的腐蚀性强弱顺序为（　）。","options":["ANaOH>KOH>LiOH","BKOH>NaOH>LiOH","CLiOH>NaOH>KOH","DLiOH>KOH>NaOH"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》第59页，在列举7Li作为pH控制剂的优点时明确给出：\"腐蚀性较小，NaOH>KOH>LiOH\"。故三种碱的腐蚀性强弱顺序为NaOH>KOH>LiOH，本题选A。\n\n【知识点】\n· LiOH、KOH、NaOH三种碱的腐蚀性强弱顺序为NaOH>KOH>LiOH，LiOH腐蚀性最小。\n· 冷却剂水质碱性太高会增加腐蚀速率，LiOH较KOH明显。\n· 良好的pH控制剂应具有有效的pH控制能力、中子吸收截面低、不产生感生放射性、腐蚀性小等条件。\n· 首选碱金属族元素的氢氧化物（强碱、化学性质稳定），候选为锂、钠、钾的氢氧化物。"},{"id":"basics_shx_0005","module":"basics","bank":"核电基础-水化学","type":"single","stem":"反应堆运行期间，去除一回路冷却剂中溶解氧的方法是（　）。","options":["A加氢","B加联氨","C加氨","D加氯气"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》4.1.2节\"溶解氧和氢含量\"：\"去除溶解氧方法：反应堆运行期间加氢：2H2+O2→2H2O；反应堆启动期间加联氨：N2H4+O2→2H2O+N2\"。本题问运行期间，故选A（加氢）；加联氨是启动期间的除氧方式。\n\n【知识点】\n· 反应堆运行期间向一回路加氢除氧：2H2+O2→2H2O。\n· 反应堆启动期间加联氨除氧：N2H4+O2→2H2O+N2；AP1000机组启动期间也采用加氢除氧。\n· 加氢浓度控制限值为15~50ml/L（STP），期望范围25~35ml/L（STP）。\n· 溶解氧除促进材料腐蚀外，还会与氮反应使冷却剂pH降低，增大腐蚀率。"},{"id":"basics_shx_0006","module":"basics","bank":"核电基础-水化学","type":"single","stem":"压水堆一回路净化系统中的混合离子交换器，其实际运行型态为（　）。","options":["A锂-硼酸型混合离子交换器","B氢-氢氧型混合离子交换器","C钠-氯型混合离子交换器","D氨-硫酸根型混合离子交换器"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》4.2.2节净化系统组成：\"大多数压水堆都用LiOH作为冷却剂的pH控制剂……该混床内阳树脂充填状态为锂型……而以氢氧型充入床内的阴树脂在运行过程中很快被冷却剂中硼酸转换成硼酸型，即该树脂床实际运行为锂-硼酸型混合离子交换器\"。故本题选A。\n\n【知识点】\n· 压水堆一回路净化混床实际运行为锂-硼酸型混合离子交换器（VVER机型转为氨钾-硼酸型）。\n· 混床阳树脂充填状态为锂型，阴树脂以氢氧型充入后被冷却剂中硼酸转换为硼酸型。\n· 该净化床用于去除可溶性裂变产物和腐蚀产物，能有效除去大多数核素，但对137Cs稍差。\n· 净化系统来水为下泄流，顺次通过前置过滤器、离子交换树脂床和后置过滤器后回容积控制箱。\n· 净化流量通常为主回路流量的0.1%，约10~20吨/小时，冷却剂一天内可得到1~2次净化。"},{"id":"basics_shx_0007","module":"basics","bank":"核电基础-水化学","type":"single","stem":"当前核电站二回路系统普遍采取的水化学处理方式是（　）。","options":["A全挥发处理（AVT）","B磷酸盐处理","C加氧处理","D中性水处理"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》第5章二回路水化学：\"当前核电站二回路系统普遍采取全挥发处理（AVT）方式，即在给水中添加氨或有机胺来调节给水pH值，同时向二回路系统添加联氨来控制二回路系统中的溶解氧并形成还原性环境\"。故本题选A；磷酸盐处理已于二十世纪70年代末之后被淘汰。\n\n【知识点】\n· 当前核电站二回路系统普遍采取全挥发处理（AVT）方式。\n· AVT即在给水中添加氨或有机胺调节给水pH，同时添加联氨除氧并形成还原性环境。\n· 磷酸盐pH控制剂因蒸汽发生器传热管晶间腐蚀、点蚀、耗蚀等问题已被淘汰。\n· 二回路pH控制剂经历了磷酸盐、氨水、有机胺（吗啉、ETA）、混合胺等发展阶段。"},{"id":"basics_shx_0008","module":"basics","bank":"核电基础-水化学","type":"single","stem":"目前国内外核电站监测凝汽器泄漏的主要手段是（　）。","options":["A在线阳电导表和在线钠表","B在线pH表和在线钠表","C在线电导表和在线氧表","D在线钠表和在线硅表"],"answer":["A"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》5.2.5.3节凝汽器泄漏监测系统：\"目前国内外核电站中监测凝汽器泄漏的手段主要为在线阳电导表和在线钠表\"。故本题选A。凝汽器海水泄漏会使二回路水质迅速恶化甚至导致机组停堆，需及时监测判断泄漏点和漏量。\n\n【知识点】\n· 监测凝汽器泄漏的主要手段是在线阳电导表和在线钠表。\n· 凝汽器海水泄漏会对精处理不投运的二回路水质控制带来极大风险，可能导致停堆。\n· 凝汽器漏点的定位一般采用覆膜、涡检和氦检。\n· 发现泄漏后需及时隔离泄漏的凝汽器并投运凝结水精处理系统，防止凝结水水质恶化失控。"},{"id":"basics_shx_0010","module":"basics","bank":"核电基础-水化学","type":"judge","stem":"水的离解是吸热过程，当温度达到300℃时，纯水的中性pH值仅为5.6左右。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》1.2.2节：\"水的离解是个吸热过程，故水的电离常数会随温度的升高而增大，中性pH值下降，当温度达到300℃时，其中性pH值仅为5.6\"。题干陈述与课件原文一致，故判断为正确。\n\n【知识点】\n· 水的离解是吸热过程，电离常数随温度升高而增大，中性pH值下降。\n· 温度达到300℃时，纯水的中性pH值仅为5.6左右。\n· 不同温度下水的离子积和pH值不同（如300℃时pH约5.6，即高温下中性并非pH=7）。\n· 纯水中只有极少量分子发生离解，产生极少量的氢离子和氢氧根离子，具有极弱的导电性。"},{"id":"basics_shx_0011","module":"basics","bank":"核电基础-水化学","type":"judge","stem":"当溶液的pH变化时，其电导率不一定改变。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》1.2节：\"pH只与[H+]有关，而电导率不只与一种离子有关。当溶液的pH变化时，其电导率一定也改变，而当溶液的电导率变化时，pH不一定改变。例如，水中加入食盐以后，其电导率增加，但是pH不变\"。题干说\"pH变化时电导率不一定改变\"与课件相反，故判断为错误。\n\n【知识点】\n· pH只与[H+]有关，而电导率不只与一种离子有关。\n· 当溶液的pH变化时，其电导率一定也改变。\n· 当溶液的电导率变化时，pH不一定改变（如水中加入食盐，电导率增加而pH不变）。\n· 电导率可给出水中溶解离子的总体信号，常作为水质控制指标。"},{"id":"basics_shx_0012","module":"basics","bank":"核电基础-水化学","type":"judge","stem":"与轻水相比，重水的中子吸收截面明显较小，只有0.5靶。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》第1章：\"与轻水相比，重水在物理性质和核性质上存在着明显的差异。熔、沸点较高、密度大……但中子吸收截面明显小，只有0.5靶\"。题干陈述与课件原文一致，故判断为正确。\n\n【知识点】\n· 与轻水相比，重水中子吸收截面明显较小，只有0.5靶。\n· 重水的熔、沸点较轻水高，密度大，化学性质与轻水相近。\n· 普通水中重水仅占0.015%；含氘的水称为重水（如D2O、HDO）。\n· 重水的离解程度比轻水低，中性pD值大于7；以轻水校正的pH计测量时记为pHA。"},{"id":"basics_shx_0013","module":"basics","bank":"核电基础-水化学","type":"judge","stem":"西方国家的压水堆几乎都用天然KOH作为一回路pH控制剂。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》第60页：\"西方国家的压水堆几乎都用高纯7Li的氢氧化物作pH控制剂。但是其价格较贵，不易得到。俄罗斯压水堆中多使用天然KOH做pH控制剂\"。题干说西方用天然KOH与课件相反，故判断为错误。\n\n【知识点】\n· 西方国家的压水堆几乎都用高纯7LiOH作pH控制剂，但价格较贵、不易得到。\n· 俄罗斯压水堆中多使用天然KOH做pH控制剂。\n· K作pH控制剂的优点：可在较高pH下运行而不增加锆合金腐蚀、相对LiOH可提更高pH、价格便宜。\n· 天然钾中的41K与中子反应生成的42K是一种强γ辐射体。"},{"id":"basics_shx_0014","module":"basics","bank":"核电基础-水化学","type":"judge","stem":"反应堆运行期间，通过向一回路加联氨来去除冷却剂中的溶解氧。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》4.1.2节：\"去除溶解氧方法：反应堆运行期间加氢：2H2+O2→2H2O；反应堆启动期间加联氨：N2H4+O2→2H2O+N2\"。运行期间除氧应加氢而非联氨，题干将启动期间的加联氨说成运行期间，故判断为错误。\n\n【知识点】\n· 反应堆运行期间通过加氢去除冷却剂中的溶解氧（2H2+O2→2H2O）。\n· 反应堆启动期间才加联氨除氧（N2H4+O2→2H2O+N2）。\n· AP1000机组启动期间也采用加氢除氧。\n· 联氨具有热不稳定性，110℃时就会发生分解反应生成氨，故不适用于高温运行期间。"},{"id":"basics_shx_0015","module":"basics","bank":"核电基础-水化学","type":"judge","stem":"M310机组功率运行期间，一回路冷却剂中氯离子的限值为小于0.15mg/kg。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》4.1节一回路冷却剂水质指标表：氯离子限值为＜0.15mg/kg（期望值＜0.05mg/kg）；文中并指出\"氯离子一般要求的限制在0.1或0.15mg/kg以下\"。题干与课件一致，故判断为正确。\n\n【知识点】\n· 一回路冷却剂中氯离子限值为＜0.15mg/kg，期望值＜0.05mg/kg。\n· 氯离子会使不同类型的腐蚀加速，最受关注的是氯离子的应力腐蚀。\n· 不锈钢应力腐蚀开裂的概率正比于氯离子浓度和游离氧含量的乘积。\n· 氯离子和硫酸根同时侵入被认为与奥氏体不锈钢应力腐蚀破裂有关，硫酸根一般控制在0.15mg/kg以下。"},{"id":"basics_shx_0017","module":"basics","bank":"核电基础-水化学","type":"multi","stem":"M310和AP1000机组参与WANO化学性能指标计算的参数包括（　）。","options":["A蒸汽发生器排污水钠离子含量","B给水铁离子含量","C给水铜离子含量","D给水溶解氧含量"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"水化学课件","explanation":"依据课件《核电厂水化学基础》5.4节WANO化学性能指标：\"M310和AP1000机组参与计算的5个参数：SG排污水Na、Cl、SO4，给水Fe、Cu。其他类型机组稍有不同\"。选项A（SG排污水钠离子）、B（给水铁离子）、C（给水铜离子）均在5个参数之列，D溶解氧不在其中，故答案为ABC。\n\n【知识点】\n· M310和AP1000机组WANO化学性能指标参与计算的5个参数：SG排污水Na、Cl、SO4，给水Fe、Cu。\n· 各参数限值：SG Cl 1.60μg/kg、SG SO4 1.70μg/kg、SG Na 0.80μg/kg、FW Fe 5.00μg/kg、FW Cu 0.20μg/kg。\n· 只有堆功率大于30%FP时段内的样品才参与计算，采用时间加权平均值。\n· WANO化学性能指标（CPI）用于量化评估电厂的总体化学控制水平。"},{"id":"basics_thsw_0001","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"关于饱和状态的特点，下列说法正确的是（　）。","options":["A饱和温度和饱和压力是一一对应的关系","B饱和温度随饱和压力升高而降低","C汽、液两相的温度可以不同","D饱和压力与温度无关"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第8页（1.2节）明确指出饱和状态的特点为“汽水共存，汽水同温；饱和温度随饱和压力的升高而增大；饱和温度和饱和压力是一一对应的关系”。选项A“饱和温度和饱和压力是一一对应的关系”与课件表述完全一致，故正确。选项B说“随饱和压力升高而降低”与课件“升高而增大”矛盾；选项C“汽、液两相的温度可以不同”与“汽水同温”矛盾；选项D“与温度无关”与一一对应关系矛盾。\n\n【知识点】\n· 饱和状态是水和水蒸气在密闭容器中汽、液两相平衡共存的状态\n· 饱和状态特点：汽水共存、汽水同温，饱和温度随饱和压力升高而增大，两者一一对应\n· 工质处于饱和状态时的压力称饱和压力（Ps），温度称饱和温度（Ts）"},{"id":"basics_thsw_0002","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"干度是指湿蒸汽中（　）。","options":["A干饱和蒸汽的质量分数","B饱和水的质量分数","C蒸汽的体积分数","D汽化潜热所占份额"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第10页（1.2节）明确给出“干度为湿蒸汽中干饱和汽的质量分数，即在1 kg湿蒸汽中含有x kg的饱和蒸汽”。选项A“干饱和蒸汽的质量分数”与课件定义完全一致，故正确。选项B“饱和水的质量分数”恰好相反；选项C“蒸汽的体积分数”不是质量分数；选项D“汽化潜热所占份额”是另一个独立概念。\n\n【知识点】\n· 湿蒸汽为饱和水与干饱和蒸汽的混合物，干度x表示其中干饱和汽的质量分数\n· 即1 kg湿蒸汽中含有x kg的饱和蒸汽\n· 汽化潜热是单位质量饱和水全部转化为干饱和蒸汽所需热量，与干度是不同概念"},{"id":"basics_thsw_0003","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"热量传递的三种基本方式是热传导、热对流和（　）。","options":["A热辐射","B热分解","C相变传热","D摩擦生热"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第43页（3.1节）明确指出“三种基本的热传递方式，这就是：热传导、热对流、热辐射”。选项A“热辐射”与课件一致，故正确。热分解、相变传热、摩擦生热均不属于三种基本传热方式。\n\n【知识点】\n· 热量传递的三种基本方式为热传导、热对流和热辐射\n· 热流量Q是单位时间传递的热量（W），热流密度q是单位时间单位面积传递的热量（W/m²）\n· 导热依靠分子动能传递，对流依靠流体相对位移，辐射依靠电磁波传递能量"},{"id":"basics_thsw_0004","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"再热循环的根本目的是（　）。","options":["A降低汽轮机末级叶片湿度","B提高给水温度","C减小凝汽器换热面积",
