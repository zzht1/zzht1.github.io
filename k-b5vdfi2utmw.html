l,"answer":["正确"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.2节\"作业前整体检查\"原文为\"初次使用之前，应仔细辨别脚手架标识牌上的使用要求；严禁未经验收的脚手架挂绿牌，严禁使用挂红牌的脚手架\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 严禁使用挂红牌的脚手架。\n· 严禁未经验收的脚手架挂绿牌。\n· 脚手架从搭设开始至拆除结束，必须随时处于挂牌状态。\n· 脚手架标识牌分为红牌、绿牌和\"从此上下\"标牌，使用期间应由巡检人员定期检查。"},{"id":"safety_gczy_0011","module":"safety","bank":"安全-高处作业","type":"judge","stem":"脚手架使用人员可以根据作业需求对脚手架结构稍作更改。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.2节\"脚手架平台上工作\"原文为\"移动脚手架架体上站人或物料未清理前严禁移动。使用人员严禁私自更改脚手架结构\"。课件练习题（第66-67页）对同题答案即为\"错\"。故本题判\"错误\"。\n\n【知识点】\n· 使用人员严禁私自更改脚手架结构。\n· 严禁非脚手架人员违章拆除构件。\n· 作业层上的荷载应符合要求，严禁超载。\n· 严禁踩在脚手架钢管上和作业层物品上加高作业。"},{"id":"safety_gczy_0012","module":"safety","bank":"安全-高处作业","type":"judge","stem":"使用吊篮进行高处作业时，可以将安全带挂在吊篮或栓吊篮的钢丝绳上。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.4节\"吊篮使用\"原文为\"使用吊篮工作时，应使用安全带并将安全带挂在吊钩上，必要时安全带与防坠器配合使用；禁止将安全带挂在吊篮或栓吊篮的钢丝绳上\"。题干说\"可以将安全带挂在吊篮或栓吊篮的钢丝绳上\"，与课件规定相反，故本题判\"错误\"。\n\n【知识点】\n· 吊篮作业时安全带应挂在吊钩上，必要时与防坠器配合使用。\n· 禁止将安全带挂在吊篮或栓吊篮的钢丝绳上。\n· 对于临时吊篮，需要特别确认吊篮的门是向内开的。\n· 高空吊篮未经过验收属于物的不安全状态，是高处坠落事故发生的根本原因之一。"},{"id":"safety_gczy_0013","module":"safety","bank":"安全-高处作业","type":"judge","stem":"攀爬脚手架过程中不得手中持物或腋下夹物，严禁手持工具和设备。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.2节\"攀爬脚手架时的工具和材料\"原文为\"攀爬过程中不得手中持物或腋下夹物，严禁手持工具和设备\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 攀爬过程中不得手中持物或腋下夹物，严禁手持工具和设备。\n· 应优先考虑使用安全绳传递工具包。\n· 当背包攀爬时，工具包应斜跨在背后。\n· 攀爬时应面向爬梯并始终保持与爬梯三点接触状态。"},{"id":"safety_gczy_0014","module":"safety","bank":"安全-高处作业","type":"judge","stem":"折梯可以作为单梯（直梯）使用或在合拢状态使用。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.3节\"梯子使用要求\"原文为\"折梯不应作为单梯（直梯）使用或在合拢状态使用\"。题干说\"折梯可以作为单梯（直梯）使用或在合拢状态使用\"，与课件规定相反，故本题判\"错误\"。\n\n【知识点】\n· 折梯不应作为单梯（直梯）使用或在合拢状态使用。\n· 除非专门设计成多人使用，便携式梯子不应多人同时攀登。\n· 组合梯做折梯使用时，不应从其后梯段攀登。\n· 应站立在踏板中部攀登或工作，不应站立高于梯子规定或标明的踏板或踏棍上。"},{"id":"safety_gczy_0015","module":"safety","bank":"安全-高处作业","type":"judge","stem":"在脚手架平台上仅使用安全带作为坠落防护设施时，安全带双钩不允许同时解除。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.2节\"脚手架平台工作防坠落措施\"原文为\"在脚手架平台上工作时，仅使用安全带作为坠落防护设施时，安全带双钩不允许同时解除\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 仅使用安全带作为坠落防护设施时，安全带双钩不允许同时解除。\n· 应避免进行上下层垂直交叉同时进行工作。\n· 如必须上下层垂直交叉同时工作，中间必须搭设严密牢固的防护隔板、罩棚或其他隔离设施。\n· 攀爬脚手架时应选用双钩安全带，至少保持单钩可靠固定。"},{"id":"safety_gczy_0016","module":"safety","bank":"安全-高处作业","type":"multi","stem":"高处作业的三道安全防线包括（　）。","options":["A稳固的作业平台","B完整的护栏","C可靠的防坠落PPE","D充足的作业照明"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.1节\"坠落防护原则\"原文为\"高处作业应落实以下三道安全防线中的至少两道，否则应采取补偿措施或联系安全管理人员现场评估。稳固的作业平台、完整的护栏、可靠的防坠落PPE\"。故本题选ABC。选项D\"充足的作业照明\"不属于课件所列三道安全防线。\n\n【知识点】\n· 三道安全防线：稳固的作业平台、完整的护栏、可靠的防坠落PPE。\n· 高处作业应落实三道安全防线中的至少两道。\n· 未落实两道防线时，应采取补偿措施或联系安全管理人员现场评估。\n· 高处作业前应检查确认作业环境，进行风险辨识和评估，制定坠落保护措施。"},{"id":"safety_gyaq_0001","module":"safety","bank":"安全-工业安全","type":"single","stem":"海因里希事故法则中，死亡重伤、轻伤、无伤害事故的比例为（　）。","options":["1:29:300","1:10:100","1:5:55","1:50:500"],"answer":["A"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第9页指出\"海因里希（Heinrich）统计了55万件机械伤害事故……事故法则：死亡、重伤，轻伤，无伤害事故的比例为1：29：300\"。故本题选A（1:29:300）。B（1:10:100）、C（1:5:55）、D（1:50:500）均为干扰项，课件原文只给出1:29:300这一比例。\n\n【知识点】\n· 海因里希事故法则：死亡、重伤：轻伤：无伤害事故＝1:29:300。\n· 事故因果连锁顺序：人的性格缺点→人的不安全行为和物的不安全状态→事故→伤害。\n· 事故法则的意义在于防止人的不安全行为、消除物的不安全状态，使因果连锁中断。\n· 海因里希统计了55万件机械伤害事故（死亡重伤1666件、轻伤48334件、其余为无伤害事故）。"},{"id":"safety_gyaq_0002","module":"safety","bank":"安全-工业安全","type":"judge","stem":"个人防护用品（PPE）是所有安全防护措施中的最后一道屏障，不能直接替代工作中必须采取的安全技术措施。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第41页给出PPE特点：\"提供安全和健康防护的预防性辅助措施\"\"所有安全防护措施中的最后一道屏障\"\"不能直接替代工作中必须采取的安全技术措施\"。题干表述与课件完全一致，故本题判\"正确\"。\n\n【知识点】\n· PPE是所有安全防护措施中的最后一道屏障。\n· PPE是预防性辅助措施，不能直接替代工作中必须采取的安全技术措施。\n· PPE的防护性能有限，即使正确使用也不代表绝对安全。\n· 使用PPE可能导致某项感官功能下降（如耳塞），无法按程序正确使用时应说明并采取其他安全保证措施。"},{"id":"safety_gyaq_0003","module":"safety","bank":"安全-工业安全","type":"single","stem":"安全帽内侧合格证应在有效期内，安全帽的有效期为（　）。","options":["12个月","18个月","24个月","30个月"],"answer":["D"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第48页安全帽使用要求指出\"检查安全帽内侧合格证，在有效期内（30个月），严禁使用不在有效期内的安全帽\"。故本题选D（30个月）。A（12个月）、B（18个月）、C（24个月）均不是课件的有效期规定。\n\n【知识点】\n· 安全帽内侧合格证应在有效期内，有效期30个月。\n· 严禁使用无合格证、无生产日期及有效期标识的安全帽。\n· 使用前检查安全帽完整性，确保无裂纹、破损；内衬调节卡扣插牢、绳带系紧。\n· 安全帽遭受重物冲击产生裂痕或损伤必须更换；长发必须盘在安全帽内。"},{"id":"safety_gyaq_0004","module":"safety","bank":"安全-工业安全","type":"single","stem":"某高处作业的作业高度为20米，该作业属于（　）。","options":["一级高处作业","二级高处作业","三级高处作业","特级高处作业"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第67页高处作业分级规定\"三级高处作业：15m<高处作业高度≦30m\"。作业高度20米落入15米以上至30米（含）区间，故本题选C（三级高处作业）。一级（2m～5m）、二级（5m～15m）、特级（>30m）均与20米不符。\n\n【知识点】\n· 一级高处作业：2m≦高度≦5m；二级：5m<高度≦15m。\n· 三级高处作业：15m<高度≦30m；特级：高度>30m。\n· 凡离坠落高度基准面2m以上（含2m）或无栏杆脚手架且高度超1.5m的区域作业即属高处作业。\n· 高处作业须佩戴安全带，使用时应高挂低用，并挂在牢固可靠的物体上。"},{"id":"safety_gyaq_0005","module":"safety","bank":"安全-工业安全","type":"judge","stem":"高处作业佩戴安全带时，应低挂高用，安全钩挂在使用者的下方。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第45页规定\"若无特殊情况，安全带必须高挂低用，安全钩必须挂在使用者的上方\"；第68页再次强调\"高处作业须佩戴安全带，使用时应高挂低用\"。题干称\"低挂高用、安全钩挂在使用者下方\"与课件相反，故本题判\"错误\"。\n\n【知识点】\n· 安全带必须高挂低用，安全钩必须挂在使用者上方。\n· 使用双钩式安全带，始终保持一点可靠挂设；挂点应高于头部。\n· 选择牢固可靠的挂点，禁止挂在细管等不可靠部位。\n· 调整系带保持适当紧度，避免脱落；安全钩挂点低于背部属错误做法。"},{"id":"safety_gyaq_0006","module":"safety","bank":"安全-工业安全","type":"single","stem":"高处作业（　）以上必须使用防坠器。","options":["2米（含2米）","5米（含5米）","8米（含8米）","10米（含10米）"],"answer":["B"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第70页明确\"高处作业5m（含5m）以上必须使用防坠器，5m以下推荐使用防坠器\"。故本题选B（5米（含5米））。A（2米）、C（8米）、D（10米）均与课件要求不符。\n\n【知识点】\n· 高处作业5m（含5m）以上必须使用防坠器，5m以下推荐使用。\n· 速差器应满足\"高挂低用\"，使用时与垂直方向夹角不得大于30°。\n· 防坠器自身安全钩须固定在牢固、可承重的部件上。\n· 黄线标准亦规定\"超过5m（含5m）的高处作业，上下攀爬脚手架未使用防坠器\"属违章。"},{"id":"safety_gyaq_0007","module":"safety","bank":"安全-工业安全","type":"judge","stem":"脚手架搭拆期间或临时中断搭设时挂红牌，红色脚手架标识牌表示脚手架禁止使用。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第39页安全标识部分指出\"脚手架搭拆期间或临时中断搭设挂红牌，验收合格后挂绿牌，挂红色脚手架标识牌表示脚手架禁止使用\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 脚手架标识牌分红牌、绿牌和\"从此上下\"标牌。\n· 搭拆期间或临时中断搭设挂红牌，红色标识牌表示脚手架禁止使用。\n· 脚手架验收合格后挂绿牌。\n· 脚手架从搭设开始至拆除结束必须随时处于挂牌状态。"},{"id":"safety_gyaq_0008","module":"safety","bank":"安全-工业安全","type":"single","stem":"在噪音高出（　）的场所，必须使用听力防护用品（耳塞/耳罩）。","options":["75分贝","80分贝","85分贝","90分贝"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第59页听力防护部分明确\"在噪音高出85分贝的场所，必须使用听力防护用品（耳塞/耳罩）\"。故本题选C（85分贝）。A（75分贝）、B（80分贝）、D（90分贝）均低于或高于课件的85分贝要求。\n\n【知识点】\n· 噪音高出85分贝的场所必须使用听力防护用品（耳塞/耳罩）。\n· 噪声作业岗位界定：噪声≥85dB(A)场所每周≥5小时或每年≥200小时等。\n· 噪声暴露时限：85dB(A)允许8小时，每增加3dB允许暴露时间减半，任何时候不得超过115分贝。\n· 耳塞体积小便于携带但佩戴需技巧；耳罩佩戴简单但可能与眼镜、呼吸器等冲突。"},{"id":"safety_gyaq_0009","module":"safety","bank":"安全-工业安全","type":"single","stem":"以10kV设备为例，设备不停电时，一般作业人员（未授权人员）与带电设备的最小安全距离为（　）。","options":["0.35米","0.7米","1米","3米"],"answer":["B"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第88页安全距离表中列出\"10kV及以下：一般作业人员（未授权人员）最小安全距离0.7m，电工（授权人员）最小安全距离0.35m\"。题干问未授权人员与带电设备距离，故本题选B（0.7米）。A（0.35米）是授权电工作业人员的距离，C、D对应更高电压等级。\n\n【知识点】\n· 10kV及以下：未授权人员最小安全距离0.7m，授权电工0.35m。\n· 20、35kV：未授权1m、电工0.6m；220kV：未授权与电工均3m；500kV：均5m。\n· 设备不停电时人的活动空间与带电导体距离不小于0.7米。\n· 在带电设备上工作非常危险，必须经过专门培训、取得资格和授权。"},{"id":"safety_gyaq_0010","module":"safety","bank":"安全-工业安全","type":"judge","stem":"电击只会在人们接触带电导体时才会发生。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第80页指出\"并不是只有接触通电设备才会发生触电。电可以以电弧的形式穿透空气\"。故题干\"电击只会在接触带电导体时才会发生\"说法错误，本题判\"错误\"。\n\n【知识点】\n· 电可以以电弧形式穿透空气，不接触设备也可能触电。\n· 电弧可使周围空气温度升高至20000摄氏度，导致严重皮肤烧伤。\n· 电击严重程度取决于电压、电流、持续时间及流经心脏的路径。\n· 触电救护：迅速脱离电源是救护首要，要使用绝缘工具并注意摔伤等二次伤害。"},{"id":"safety_gyaq_0011","module":"safety","bank":"安全-工业安全","type":"single","stem":"临时电缆的架空高度，跨越道路时应大于（　）。","options":["2米","4米","5米","6米"],"answer":["D"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第84页临时用电布线要求规定\"临时电缆的架空高度，室内应大于2m，室外应大于4m，跨越道路应大于6m\"。题干问跨越道路的架空高度，故本题选D（6米）。A（2米）是室内标准、B（4米）是室外标准、C（5米）不符合课件。\n\n【知识点】\n· 临时电缆架空高度：室内大于2m，室外大于4m，跨越道路大于6m。\n· 架空的临时电缆至少每隔3m固定一次，绑扎线必须采用绝缘材料。\n· 绑扎线不得固定在活动部件上，禁止将导线直接缠绕在护栏、管道及脚手架上。\n· 临时电源线经过道路、通道、门口处应采取防止碾压、踩踏的安全措施。"},{"id":"safety_gyaq_0012","module":"safety","bank":"安全-工业安全","type":"judge","stem":"遇五级以上大风时，禁止露天进行起重作业。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第92页起重环境检查部分明确\"在大雾、照明不足的环境，不得进行起重作业，遇有五级以上大风时，禁止露天进行起重作业\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 遇五级以上大风时，禁止露天进行起重作业。\n· 大雾、照明不足的环境不得进行起重作业。\n· 起重\"十不吊\"中包括\"五级以上强风不吊\"。\n· 起重作业前应核实现场风速，并设置隔离区和专人监督防止人员误入。"},{"id":"safety_gyaq_0013","module":"safety","bank":"安全-工业安全","type":"single","stem":"进入密闭场所作业前须先测试气体浓度，其中氧含量应在（　）以上方可进入。","options":["15%","17%","18.5%","19.5%"],"answer":["D"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第102页有限空间作业要求指出\"进入密闭场所作业前，须先测试气体浓度，其中氧含量在19.5%以上，有毒有害气体、易燃易爆气体的含量应在法规的限值之下\"。故本题选D（19.5%）。A（15%）、B（17%）、C（18.5%）均低于课件19.5%的要求。\n\n【知识点】\n· 进入密闭场所作业前须先测试气体浓度，氧含量须在19.5%以上。\n· 有毒有害气体、易燃易爆气体含量应在法规限值之下。\n· 气体浓度不满足要求时应进行吹洗及通风置换，再测试达标后方可进入。\n· 工作期间有限空间内氧气允许范围为19.5%-21%，严禁关闭人孔门或盖板，需持续通风。"},{"id":"safety_gyaq_0014","module":"safety","bank":"安全-工业安全","type":"judge","stem":"有限空间作业必须做到“先通风、再检测、后作业”，严禁通风、检测不合格作业。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第101页有限空间作业安全要求明确\"必须做到'先通风、再检测、后作业'，严禁通风、检测不合格作业\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 有限空间作业必须做到\"先通风、再检测、后作业\"，严禁通风、检测不合格作业。\n· 必须严格实行作业审批制度，严禁擅自进入有限空间作业。\n· 必须配备个人防中毒窒息等防护装备，设置安全警示标识，严禁无防护监护措施作业。\n· 必须制定应急措施、现场配备应急装备，严禁盲目施救。"},{"id":"safety_gyaq_0015","module":"safety","bank":"安全-工业安全","type":"single","stem":"在潮湿的金属容器内、有爆炸危险的场所等处工作时，行灯电压不应超过（　）。","options":["36V","24V","12V","48V"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第106页安全电压要求指出\"行灯电压不应超过36V，在周围均是金属导体的场所和容器内工作时，不应超过24V，在潮湿的金属容器内，有爆炸危险的场所等处工作时，不应超过12V\"。题干场景属于潮湿金属容器内，故本题选C（12V）。A（36V）为一般场所、B（24V）为金属导体容器内，D（48V）超出所有限值。\n\n【知识点】\n· 行灯电压一般不应超过36V。\n· 周围均是金属导体的场所和容器内工作，行灯电压不应超过24V。\n· 潮湿金属容器内、有爆炸危险场所等处工作，行灯电压不应超过12V。\n· 行灯变压器外壳应可靠接地，不准使用自耦变压器。"},{"id":"safety_gyaq_0016","module":"safety","bank":"安全-工业安全","type":"judge","stem":"在有转动设备/机械的场所，机器、转动设备操作人员禁止佩戴手套。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第62页手部防护限制使用部分明确\"在有转动设备/机械的场所，机器、转动设备操作人员禁止佩戴手套\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 有转动设备/机械的场所，机器、转动设备操作人员禁止佩戴手套。\n· 接触腐蚀性、有毒有害化学物质时佩戴防化手套（如防酸碱手套）。\n· 可能造成割伤、划伤或磨损时佩戴防机械伤害手套。\n· 进入现场应穿长袖工装，袖口扣好以防止卷入转动设备。"},{"id":"safety_gyaq_0017","module":"safety","bank":"安全-工业安全","type":"single","stem":"气瓶使用时，乙炔瓶和氧气瓶的距离不得小于（　）。","options":["3米","5米","8米","10米"],"answer":["B"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第118页气瓶使用要求明确\"可燃、助燃性气体瓶与明火的距离一般不得小于10米；乙炔和氧气瓶距离不得小于5米\"。故本题选B（5米）。A（3米）小于课件要求，C（8米）、D（10米）是明火距离或非课件的乙炔-氧气瓶距离。\n\n【知识点】\n· 乙炔瓶和氧气瓶距离不得小于5米。\n· 可燃、助燃性气体瓶与明火的距离一般不得小于10米。\n· 气瓶必须远离热源、明火，使用时应固定牢靠。\n· 气瓶运输装卸必须佩戴瓶帽和减震圈，瓶内气体相互接触能引起燃烧、爆炸、产生毒物的不得同车运输。"},{"id":"safety_gyaq_0018","module":"safety","bank":"安全-工业安全","type":"judge","stem":"现场急救时应优先转运经救护后伤情已基本稳定的伤员。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第219-220页练习题\"现场急救应优先转运（　）\"的正确答案为\"伤情严重但救治及时可以存活的伤员\"，而非\"经救护后伤情已基本稳定的伤员\"；课件现场急救原则亦明确\"先重后轻\"。题干颠倒了优先转运对象，故本题判\"错误\"。\n\n【知识点】\n· 现场急救应优先转运伤情严重但救治及时可以存活的伤员。\n· 现场急救原则包括：迅速消除致伤因素、维持伤员基本生命体征、先重后轻。\n· 现场急救目的：保存生命、减少损害和痛苦、防止伤势或病情恶化、为医护人员争取时间。\n· 处理伤员应简单、迅速、有效，并及时安全转送伤员到医院。"},{"id":"safety_gyaq_0019","module":"safety","bank":"安全-工业安全","type":"single","stem":"心肺复苏时，胸外心脏按压与人工呼吸的比率为（　）。","options":["10:2","15:2","30:2","30:1"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第211页明确指出\"人工呼吸：在实施30次按压后，给予2次人工呼吸\"；第221-222页练习题\"胸外心脏按压与人工呼吸的比率是（　）\"的答案亦为30:2。故本题选C（30:2）。A（10:2）、B（15:2）、D（30:1）均与课件不符。\n\n【知识点】\n· 胸外心脏按压与人工呼吸的比率为30:2。\n· 胸外按压深度5-6cm，速率100-120次/分。\n· 每次按压后让胸部恢复至正常位置，按压中断时间尽量不超过10秒。\n· 心搏骤停的\"黄金时限\"为4分钟；两次吹气用时不应超过10秒。"},{"id":"safety_gyaq_0020","module":"safety","bank":"安全-工业安全","type":"multi","stem":"以下属于中国核电安全质量红黄线标准（工业安全）红线的有（　）。","options":["高处作业未系安全带","电气作业未验电即开展工作","走错间隔、工作前未核对设备","有限空间作业前未执行先通风、再检测即开展工作"],"answer":["A","B","D"],"score":null,"source":"generated","origin":"保护区准入工业安全课件","explanation":"依据课件《保护区准入·工业安全》：课件第124页\"中国核电安全质量红黄线标准（工业安全）7条红线\"明确包含\"高处作业未系安全带\"\"电气作业未验电即开展工作\"\"有限空间作业前未执行先通风、再检测（氧浓度、有毒有害气体浓度、易燃易爆物质浓度）即开展工作\"，故A、B、D正确；而\"走错间隔、工作前未核对设备\"在第125页属于\"33条黄线\"，不是红线，故C不选。\n\n【知识点】\n· 工业安全7条红线含：高处作业未系安全带、电气作业未验电即开展工作、有限空间作业前未执行先通风再检测即开展工作等。\n· 红线还包括：起重机吊装时在吊臂和吊物下停留或行走、使用失灵或有缺陷的起重机械、翻越高空作业面外围防护、未经许可踩踏重要设备。\n· 走错间隔、工作前未核对设备属于黄线，而非红线。\n· 通用8条红线含无票作业、无证作业、违章指挥强令冒险作业、饮酒后酒精含量超20mg/100ml进入生产区域等。"},{"id":"safety_hsy1_0001","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"以压水堆核电厂为例，控制棒提起后核裂变发生，一回路冷却剂在（　）被加热。","options":["蒸汽发生器","反应堆堆芯","汽轮机","凝汽器"],"answer":["B"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.1节\"核能发电基本原理\"（以压水堆核电厂为例）明确给出能量转换流程：\"控制棒提起，核裂变发生，一回路冷却剂被加热\"，随后\"主泵带动一回路冷却剂通过堆芯和蒸汽发生器形成循环\"。即一回路冷却剂是在反应堆堆芯被核裂变产生的热量加热的，故本题选B（反应堆堆芯）。蒸汽发生器是一回路冷却剂放热、二回路给水吸热成饱和蒸汽的设备；汽轮机、凝汽器均属二回路设备。\n\n【知识点】\n· 控制棒提起后核裂变发生，一回路冷却剂在反应堆堆芯被加热。\n· 主泵带动一回路冷却剂通过堆芯和蒸汽发生器形成循环。\n· 二回路给水在蒸汽发生器内被一回路冷却剂加热成为饱和蒸汽，蒸汽推动汽轮发电机组发电。\n· 完成做功的蒸汽在凝汽器内被冷凝成水，重新输送至蒸汽发生器。"},{"id":"safety_hsy1_0002","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"1希沃特（Sv）等于（　）毫希沃特（mSv）。","options":["100","10","1000","10000"],"answer":["C"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.2节\"理解辐射—辐射测量\"指出，剂量常用测量单位为\"希沃特（Sv）、毫希沃特（mSv）、微希沃特（μSv）\"，并明确给出换算关系：\"1 Sv=1000 mSv，1 mSv=1000 μSv\"。故1希沃特等于1000毫希沃特，本题选C。\n\n【知识点】\n· 剂量是身体或特定器官遭辐射照射时接受的辐射量。\n· 常用剂量单位：希沃特（Sv）、毫希沃特（mSv）、微希沃特（μSv）。\n· 1 Sv=1000 mSv，1 mSv=1000 μSv。\n· 通过测量放射性物质释放的能量来测量辐射。"},{"id":"safety_hsy1_0003","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"根据调查，近年国内核电厂工作人员的每年人均有效剂量（　）。","options":["小于2mSv","约10mSv","约20mSv","约50mSv"],"answer":["A"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.2节\"理解辐射—职业剂量\"明确指出：\"根据调查，近年国内核电厂工作人员的每年人均有效剂量小于2mSv，远低于一般放射性工作人员受照的基本限值—20mSv\"。故本题选A（小于2mSv）。\n\n【知识点】\n· 近年国内核电厂工作人员年人均有效剂量小于2mSv。\n· 一般放射性工作人员受照的基本限值为20mSv（年均有效剂量）。\n· 许多核电工作者并不是辐射工作者，其职业剂量限值与普通公民一样。\n· 核电工作接受的剂量远低于个人接受的本底辐射。"},{"id":"safety_hsy1_0004","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"电厂规定接受的辐射必须符合ALARA原则，即（　）。","options":["绝对不接受任何剂量","尽可能远离电厂","按限值上限接受剂量","合理可行尽量低"],"answer":["D"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.2节\"理解辐射—职业剂量\"指出：\"保守起见，我们假设长期暴露在低水平辐射环境中，会慢慢增加健康风险。这就是电厂规定接受的辐射必须符合'ALARA（合理可行尽量低）原则'的原因\"，并注明英文全文 As Low As Reasonably Achievable。故本题选D（合理可行尽量低）。\"绝对不接受任何剂量\"\"按限值上限接受剂量\"均与ALARA含义相悖。\n\n【知识点】\n· ALARA即 As Low As Reasonably Achievable，合理可行尽量低。\n· 电厂规定接受的辐射必须符合ALARA原则。\n· 长期暴露在低水平辐射环境中被认为会慢慢增加健康风险，故剂量要合理可行尽量低。\n· 近年国内核电厂工作人员年人均有效剂量小于2mSv，远低于基本限值20mSv。"},{"id":"safety_hsy1_0005","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"全球应用最为成熟和广泛、占比超过总运行反应堆数量60%的堆型是（　）。","options":["重水堆（PHWR）","压水堆（PWR）","高温气冷堆（HTGR）","快中子反应堆（CFR）"],"answer":["B"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.3节\"核电行业概述—核电站堆型\"介绍压水堆（PWR）时明确指出：\"压水式轻水反应堆（PWR……），通常习惯简称为'压水堆'。全球应用最为成熟和广泛的堆型，占比超过总运行反应堆数量的60%。使用轻水（普通水）作为反应堆冷却剂和中子慢化剂\"。故本题选B（压水堆PWR）。\n\n【知识点】\n· 压水堆（PWR）是全球应用最为成熟和广泛的堆型，占比超过总运行反应堆数量的60%。\n· 压水堆使用轻水（普通水）作为反应堆冷却剂和中子慢化剂。\n· 我国运行及建设的核电站堆型以压水堆为主，此外还有重水堆（PHWR）、高温气冷堆（HTGR）、快中子反应堆（CFR）。\n· 高温气冷堆采用球形燃料元件、石墨慢化剂、氦气冷却剂；快中子堆以液态钠为冷却剂。"},{"id":"safety_hsy1_0006","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"中国大陆第一座自行设计建造的核电站，1991年建成投入运行、被誉为“国之光荣”的是（　）。","options":["大亚湾核电站","石岛湾核电站","秦山核电站","徐大堡核电站"],"answer":["C"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.3节\"核电行业概述—核工业发展史\"指出：\"1985年秦山核电站开工建设，1991年建成投入运行，实现中国大陆核电'零'的突破，被誉为'国之光荣'\"，其前身为1970年周恩来总理部署的\"七二八\"工程。故本题选C（秦山核电站）。大亚湾核电站是引进外资、成套引进设备的大型商用核电站，并非大陆第一座自行设计建造的核电站。\n\n【知识点】\n· 秦山核电站1985年开工、1991年建成投入运行，是中国大陆第一座自行设计建造的核电站。\n· 秦山核电站实现中国大陆核电\"零\"的突破，被誉为\"国之光荣\"。\n· 中国第一座自行设计建造的核电站因1970年2月8日部署而得名\"七二八\"工程。\n· \"华龙一号\"（2020年并网）是我国具有完全自主知识产权的三代压水堆创新成果。"},{"id":"safety_hsy1_0007","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"三哩岛核事故的国际核事件分级（INES）等级为（　）。","options":["5级","6级","7级","4级"],"answer":["A"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件2.1节\"核安全文化—概述\"对三次重大核事故分级明确记载：\"三哩岛事故（INES 5级）\"，后果为反应堆大部分燃料元件损坏、部分熔化，安全壳完整、环境辐射很小；而\"切尔诺贝利事故（INES 7级）\"、\"福岛事故（INES 7级）\"为更严重级别。故本题选A（5级）。\n\n【知识点】\n· 三哩岛核事故发生于1979年3月28日，INES等级为5级。\n· 三哩岛事故后果：大部分燃料元件损坏、部分熔化，但安全壳完整、环境辐射很小。\n· 切尔诺贝利事故（1986年）和福岛事故（2011年）INES等级均为7级。\n· 切尔诺贝利事故后WANO成立，INSAG1首次提出安全文化概念。"},{"id":"safety_hsy1_0008","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"明星自检（STAR）四个步骤的正确顺序是（　）。","options":["思考—停止—行动—回顾","停止—行动—思考—回顾","思考—行动—停止—回顾","停止—思考—行动—回顾"],"answer":["D"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件2.3节\"现场工作要求—明星自检\"指出：\"明星自检的过程很容易记忆。由每步的首字母组成：Stop，Think，Act，Review\"，即STOP计划并准备、THINK思考你将要做什么及后果如何、ACT执行、REVIEW确认你得到了正确的结果。故正确顺序为停止—思考—行动—回顾，本题选D。\n\n【知识点】\n· 明星自检（STAR）由四步首字母组成：Stop、Think、Act、Review。\n· STOP：停止，进行计划并准备。\n· THINK：思考你将要做什么，后果如何。\n· ACT执行，REVIEW确认你得到了正确的结果。"},{"id":"safety_hsy1_0009","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"以下哪项不是卓越核安全文化十大原则中对领导的要求（　）。","options":["领导做安全的表率","决策体现安全第一","珍惜、寻求和利用一切学习的机会","建立组织内部高度信任"],"answer":["C"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件2.2节\"中国核电卓越核安全文化十大原则\"中，对领导的要求包括：第5条\"领导做安全的表率\"（各级领导做安全的表率，在决策和行为中体现对核安全的承诺）、第6条\"决策体现安全第一\"、第7条\"营造和谐的氛围\"（建立相互信任的和谐氛围，即建立组织内部高度信任）；而\"培育持续学习的氛围，珍惜、寻求和利用一切学习机会\"属于第10条\"践行学习型组织\"对全员的要求，并非专门对领导的要求。故本题选C。此题即课件2.2节练习题原题。\n\n【知识点】\n· \"领导做安全的表率\"：高层管理者是核安全的首要倡导者，各级领导做安全的表率，知行合一。\n· \"决策体现安全第一\"：支持或影响核安全的决策是系统的、严格的和全面的，高层领导支持并强化保守决策。\n· \"营造和谐的氛围\"：建立相互信任的和谐氛围，每个人的知识和贡献得到尊重和肯定。\n· \"践行学习型组织\"：珍惜、寻求和利用一切学习机会，是面向全体人员的要求。"},{"id":"safety_hsy1_0010","module":"safety","bank":"安全-核素养(上)","type":"single","stem":"以下不属于核电厂应急状态分级的是（　）。","options":["应急待命","全面动员","厂房应急","场外应急"],"answer":["B"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件3.2节\"应急预案\"明确指出：\"应急状态，有4种：应急待命、厂房应急、场区应急、场外应急\"。\"全面动员\"不在其中，故本题选B。\n\n【知识点】\n· 核电厂应急状态分为4级：应急待命、厂房应急、场区应急、场外应急。\n· 每座核电厂都有紧急情况下对公众、员工和核电站的应急响应预案。\n· 预案内容相似，但可能因设计、位置和组织而有所不同。\n· 应急情况下，厂区内每一个人都有应急响应责任，应按应急广播采取行动。"},{"id":"safety_hsy1_0011","module":"safety","bank":"安全-核素养(上)","type":"judge","stem":"核电厂发电的基本原理是将核能转变为热能，再转变为机械能/电能。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.1节\"核能发电基本原理\"以压水堆核电厂为例描述了完整的能量转换过程：控制棒提起核裂变发生（核能释放），一回路冷却剂在堆芯被加热（核能转变为热能），蒸汽推动汽轮发电机组转动发电（热能转变为机械能/电能）。课件1.1节练习题第1题即为此题，答案为\"✔\"。故本题判\"正确\"。\n\n【知识点】\n· 核电厂发电基本原理：核能转变为热能，再转变为机械能/电能。\n· 控制棒提起后核裂变发生，一回路冷却剂在堆芯被加热。\n· 二回路给水在蒸汽发生器内被加热成饱和蒸汽，推动汽轮发电机组发电。\n· 汽轮机将蒸汽内能转变为机械能，完成做功的蒸汽在凝汽器内被冷凝成水。"},{"id":"safety_hsy1_0012","module":"safety","bank":"安全-核素养(上)","type":"judge","stem":"“两个零容忍”是指对弄虚作假“零容忍”和对违规操作“零容忍”。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件2.1节\"核安全文化—概述\"\"'两个零容忍'\"部分明确列出：\"对弄虚作假'零容忍'\"和\"对违规操作'零容忍'\"。课件2.1节练习题第3题即为此题，答案为\"✔\"。故本题判\"正确\"。\n\n【知识点】\n· \"两个零容忍\"指对弄虚作假\"零容忍\"和对违规操作\"零容忍\"。\n· 弄虚作假通称为造假，包括物项实体造假、工作过程造假、文件记录造假。\n· 典型造假行为包括伪造证书、伪造测量数据、伪造检验报告、仿冒他人签字等。\n· 对已发现问题或缺陷的隐瞒不报甚至造假掩饰，也被认为是弄虚作假的一种形式。"},{"id":"safety_hsy1_0013","module":"safety","bank":"安全-核素养(上)","type":"judge","stem":"正常情况下，核电工作者职业照射剂量大于本底辐射剂量。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件1.2节\"理解辐射—职业剂量\"指出：\"作为一个辐射工作从业者，在辐射工作中将会接受'职业剂量'。工作接受的剂量远低于个人接受的本底辐射\"。课件1.2节练习题第2题即为此题，答案为\"❌\"。题干\"职业照射剂量大于本底辐射剂量\"与课件表述相反，故本题判\"错误\"。\n\n【知识点】\n· 本底辐射是每个人从自然和人造源中接受的辐射，包含宇宙射线、地壳及人体中的放射性物质等。\n· 核电工作接受的剂量远低于个人接受的本底辐射。\n· 近年国内核电厂工作人员年人均有效剂量小于2mSv。\n· 许多核电工作者并不是辐射工作者，其职业剂量限值与普通公民一样。"},{"id":"safety_hsy1_0014","module":"safety","bank":"安全-核素养(上)","type":"judge","stem":"严禁用电子剂量计（EPD）测量工作场所的剂量率。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件2.3节\"现场工作要求—辐射监测设备\"指出：\"辐射工作人员佩戴热释光剂量计(TLD)和个人电子剂量计（EPD）。它跟踪个人接受的辐射剂量，并用于创建永久的剂量记录\"，并明确规定\"严禁用电子剂量计（EPD）测量工作场所的剂量率\"。故本题判\"正确\"。\n\n【知识点】\n· EPD（个人电子剂量计）用于跟踪个人接受的辐射剂量，建立永久剂量记录。\n· 严禁用电子剂量计（EPD）测量工作场所的剂量率。\n· 辐射工作人员佩戴TLD和EPD两种个人剂量监测设备。\n· 个人剂量监测设备通常佩戴在身体前部。"},{"id":"safety_hsy1_0015","module":"safety","bank":"安全-核素养(上)","type":"judge","stem":"应急撤离时可以使用私家车，以便更快离开场区。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件3.3节\"应急响应—撤离\"明确规定：\"撤离车辆为公司大巴和中巴客车。撤离不能使用私家车，避免交通拥堵\"，且\"应急撤离由应急指挥部统一安排\"，听到撤离广播后在集合点负责人指挥下有序登车。题干\"可以使用私家车\"与课件规定相矛盾，故本题判\"错误\"。\n\n【知识点】\n· 应急撤离不能使用私家车，以避免交通拥堵。\n· 撤离车辆为公司大巴和中巴客车，由应急指挥部统一安排。\n· 撤离过程中应关闭车的门窗和通风，撤离路线由应急指挥部根据气象条件决定。\n· 非应急人员在集合点负责人指挥下有序登车撤离至烟羽应急计划区外区之外。"},{"id":"safety_hsy1_0016","module":"safety","bank":"安全-核素养(上)","type":"judge","stem":"弄虚作假（造假）的情形只包括文件记录造假。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件2.1节\"两个零容忍的内涵和相关规定\"指出：\"弄虚作假通称为造假。造假的情形包括物项实体的造假、工作过程造假以及文件记录造假\"，典型的造假行为还包括伪造证书、伪造测量数据、伪造检验报告、仿冒他人签字，以及对问题缺陷的隐瞒不报和造假掩饰。题干\"只包括文件记录造假\"以偏概全，与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 造假情形包括物项实体造假、工作过程造假、文件记录造假三类。\n· 典型造假行为包括伪造证书、伪造测量数据、伪造检验报告、仿冒他人签字等。\n· 对已发现问题或缺陷的隐瞒不报甚至造假掩饰，也被认为是弄虚作假。\n· 造假可能造成物项、活动等的质量或性能不合格或者不可确认。"},{"id":"safety_hsy1_0017","module":"safety","bank":"安全-核素养(上)","type":"judge","stem":"个人的工作适任性存在疑问时应暂停工作，在确定可以安全完成任务时再返回工作。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件4.6节\"岗位适任性管理—岗位适任性异常的管控（个人）\"明确规定：\"个人的工作适任性存在疑问时应暂停工作，在确定可以安全完成任务时再返回工作\"。课件第4章练习题第7题即为此题，答案为\"√\"。故本题判\"正确\"。\n\n【知识点】\n· 个人的工作适任性存在疑问时应暂停工作。\n· 确定可以安全完成任务时再返回工作。\n· 个人应报告自身岗位适任性方面的情况，并观察他人的异常行为适时报告。\n· 发现他人异常行为时不要正面对抗，应马上向管理人员或保卫人员报告。"},{"id":"safety_hsy1_0018","module":"safety","bank":"安全-核素养(上)","type":"multi","stem":"下列属于一般工业固体废物（不可回收）的有（　）。","options":["塑胶管","擦拭纸","保温棉","报废阀门"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核素养(上)课件","explanation":"依据课件《核素养（上）》：课件2.3节\"现场工作要求\"将常见工业固体废物分为两类：\"常见的工业固体废物（可回收）\"包括金属钢瓶、废旧滤芯、报废阀门、空气过滤器、废旧零件；\"常见的工业固体废物（不可回收）\"包括塑胶管、擦拭纸、保温棉、纸滤芯、擦拭棉、传动皮带。故塑胶管、擦拭纸、保温棉属不可回收类，本题选ABC；报废阀门属可回收类。\n\n【知识点】\n· 一般工业固体废物指未列入《国家危险废物名录》或不具有危险特性的工业固体废物。\n· 不可回收的常见工业固废：塑胶管、擦拭纸、保温棉、纸滤芯、擦拭棉、传动皮带。\n· 可回收的常见工业固废：金属钢瓶、废旧滤芯、报废阀门、空气过滤器、废旧零件。\n· 危险废物具有腐蚀性、毒性、易燃性、反应性或感染性等危险特性，应由专业对口部门统一管理和报废。"},{"id":"safety_hsy2_0001","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"防异物又称（　）。","options":["防火管理（FM）","异物排除（FME）","设备完整性管理","现场清洁管理"],"answer":["B"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件5.1节基本概念明确指出\"防异物 又称'异物排除'、'FME（Foreign Material Exclusion）'\"。故本题选B（异物排除FME）。防火管理（FM）、设备完整性管理、现场清洁管理均非课件对防异物的称谓。\n\n【知识点】\n· 防异物又称\"异物排除\"、\"FME（Foreign Material Exclusion）\"。\n· 异物（FM）指根据设计，任何非预期存留或引入系统设备、不属于系统或设备组成部分的物项，如碎片污垢、破损或丢失的部件、油、碎布、工具等。\n· 防异物是指在电站工作中采取一定措施和方法，预防因人为疏忽导致异物侵入电站系统或设备内部。\n· 异物入侵可能损坏设备、增加工时延长维修时间，严重可能导致停机、停堆。"},{"id":"safety_hsy2_0002","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"一回路开口作业及开口上方作业过程中若需要使用绑扎带，应选择（　）。","options":["白色棉质绑扎带","金属丝","可漂浮非白色绑扎带","任意颜色均可"],"answer":["C"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件5.2节明确要求\"一回路开口作业及开口上方作业过程中若需要使用绑扎带，应选择可漂浮非白色绑扎带，防止绑扎带掉入无法取出成为异物\"。故本题选C（可漂浮非白色绑扎带）。白色绑扎带掉入后难以发现、不易取出，金属丝等更属严禁进入系统的物项。\n\n【知识点】\n· 一回路开口作业及开口上方作业应使用可漂浮非白色绑扎带。\n· 选此颜色的目的是防止绑扎带掉入后无法取出成为异物。\n· 在开口水系统或异物掉入后难以取出的高异物风险区域，工具应使用绳子、工具防坠落腕带等绑住防止掉落。\n· 透明塑料布、套管、包装材料、袋子等物项在系统设备中很难被发现，在异物排除区域内禁止使用。"},{"id":"safety_hsy2_0003","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"下列物项中，不允许在防异物管理区域内使用的是（　）。","options":["手套","扳手","有彩色条纹或标记的袋子","透明塑料袋"],"answer":["D"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件5.2节指出\"透明的塑料布、套管、包装材料、袋子等物项在构筑物、系统和设备中很难被发现，因此在电站异物排除区域内禁止使用\"。故本题选D（透明塑料袋）。手套、扳手为作业常用工具，有彩色条纹或标记的袋子可见性好，均不属禁止范围。\n\n【知识点】\n· 透明塑料布、套管、包装材料、袋子在电站异物排除区域内禁止使用。\n· 确需使用透明材料时，必须经电厂相关人员或组织同意，并对透明材料做好明显标识，保证可见且不会脱落形成异物，否则严禁使用。\n· 任何物品进入防异物管理区域或经过其上方区域之前，要进行异物和部件松动情况检查。\n· 进入异物排除区域的工具、部件应清理碎片、干燥剂和过多润滑剂，防止异物进入系统。"},{"id":"safety_hsy2_0004","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"根据中国核电导则《工业安全守则》，推荐的个人能够搬运的物体最大重量为（　）。","options":["10kg","20kg","30kg","50kg"],"answer":["B"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件6.3节一般规定明确指出\"一般情况下，推荐的个人能够搬运的物体最大重量为20kg（中国核电导则《工业安全守则》（IS-AC-210.DZ）），如有必要，应寻求帮助\"。故本题选B（20kg）。\n\n【知识点】\n· 推荐个人能够搬运的物体最大重量为20kg。\n· 不得提升超过自身搬运能力范围的物料，如有必要应寻求帮助。\n· 搬运人员的肩膀上应使用衬垫/护垫，防止受伤并减轻疲劳。\n· 人工搬运前应弄清物体的重量和尺寸，确认负载受力平衡且绑扎牢固。"},{"id":"safety_hsy2_0005","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"手推运货车经过斜面上下时，正确做法是（　）。","options":["上坡时操作人员在后、下坡时操作人员在前","上坡时操作人员在前、下坡时操作人员在后","上下坡时操作人员均在前","上下坡时操作人员均在后"],"answer":["B"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件6.6节明确指出\"当运货车需要经过斜面上下时，应保持运货车的标高低于操作该运货车人员标高，即上坡时操作人员在前、下坡时操作人员在后\"。故本题选B。\n\n【知识点】\n· 手推运货车经过斜面上下时，应保持运货车标高低于操作人员标高。\n· 上坡时操作人员在前、下坡时操作人员在后。\n· 运货车的推动速度必须保持在安全速度以内，禁止跑步推动运货车。\n· 操作人员应时刻保证运货车在其控制之下。"},{"id":"safety_hsy2_0006","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"依据课件，个人账号口令的长度应（　）。","options":["不少于8位","不少于6位","不少于12位","不少于16位"],"answer":["C"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件7.3节员工网络安全行为规定\"设置密码符合复杂度要求，定期更改口令，不设置弱口令\"，具体要求为\"不少于12位\"\"需使用大小写组合\"\"需使用数字及特殊符号\"。故本题选C（不少于12位）。\n\n【知识点】\n· 账号口令长度不少于12位。\n· 口令需使用大小写组合，需使用数字及特殊符号。\n· 不使用常见字典单词，不得使用常见用户名。\n· 应设置符合复杂度要求的密码并定期更改口令，不设置弱口令。"},{"id":"safety_hsy2_0007","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"网络安全责任落实遵循的原则是（　）。","options":["谁主管、谁负责；谁运营、谁负责；谁使用、谁负责","统一由信息部门负责","出了问题个人自行负责","只追究直接领导责任"],"answer":["A"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件7.3节网络安全防护基本原则指出\"责任落实：网络安全按照'谁主管、谁负责；谁运营、谁负责；谁使用、谁负责'的原则，逐级落实信息安全责任。人人都是网络安全的最后一道屏障\"。故本题选A。\n\n【知识点】\n· 网络安全责任落实遵循\"谁主管、谁负责；谁运营、谁负责；谁使用、谁负责\"的原则。\n· 按此原则逐级落实信息安全责任。\n· 人人都是网络安全的最后一道屏障。\n· 网络安全防护基本原则还包括分区分域、等级防护、多层防御、最小授权。"},{"id":"safety_hsy2_0008","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"国家对严重污染环境的工艺、设备和产品实行（　）。","options":["保护制度","免费更新制度","重复利用制度","淘汰制度"],"answer":["D"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件8.2节环境保护基本知识明确引用环保法原文：\"淘汰制：'国家对严重污染环境的工艺、设备和产品实行淘汰制度。任何单位和个人不得生产、销售或者转移、使用严重污染环境的工艺、设备和产品。'\"故本题选D（淘汰制度）。\n\n【知识点】\n· 国家对严重污染环境的工艺、设备和产品实行淘汰制度。\n· 任何单位和个人不得生产、销售或者转移、使用严重污染环境的工艺、设备和产品。\n· 保护环境是国家的基本国策。\n· 环境保护坚持保护优先、预防为主、综合治理、公众参与、损害担责的原则。"},{"id":"safety_hsy2_0009","module":"safety","bank":"安全-核素养(下)","type":"single","stem":"建设项目中防止污染的设施，应当与主体工程（　）。","options":["同时设计、同时施工、同时投产使用","先设计、后施工、再投产","同时设计、先施工、后投产","分期设计、分期施工、分期投产"],"answer":["A"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件8.1节引用《中华人民共和国环境保护法》第四十一条：\"建设项目中防止污染的设施，应当与主体工程同时设计、同时施工、同时投产使用。防治污染的设施应当符合经批准的环境影响评价文件的要求，不得擅自拆除或者闲置\"。故本题选A（三同时）。\n\n【知识点】\n· 防治污染的设施应当与主体工程同时设计、同时施工、同时投产使用。\n· 防治污染的设施应当符合经批准的环境影响评价文件的要求。\n· 防治污染的设施不得擅自拆除或者闲置。\n· 《中华人民共和国环境保护法》是环境保护综合法，在环境保护法律体系中占核心地位，共7章70条。"},{"id":"safety_hsy2_0010","module":"safety","bank":"安全-核素养(下)","type":"judge","stem":"防异物管理员只需关注人员进出，不用关心物项进出的完整性。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件5.1节指出防异物管理员要\"在开口处控制人员和物项的进出，并做好人员和物项登记，确认物项进出后的完整性\"。题目说法\"只需关注人员进出，不用关心物项进出的完整性\"与课件要求矛盾，故判\"错误\"。\n\n【知识点】\n· 防异物管理员在开口处控制人员和物项的进出，并做好人员和物项登记。\n· 防异物管理员需确认物项进出后的完整性。\n· 必要时可中止工作活动，纠正FME问题，告知相关负责人未解决的问题。\n· 防异物管理员专门负责控制自己工作组所在防异物区域（FMEA），监督工作活动。"},{"id":"safety_hsy2_0011","module":"safety","bank":"安全-核素养(下)","type":"judge","stem":"工作人员不慎引入异物后，认为异物很小没有影响，可以不告知工作负责人。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件5.2节要求工作人员\"发现FME问题及时告知工作负责人\"，并规定\"出现防异物行为偏差或异物入侵事件时要及时向其工作负责人、主管、准备工程师、本单位防异物管理机构报告\"。题目说法\"异物很小可以不告知\"与课件要求矛盾，故判\"错误\"。\n\n【知识点】\n· 发现FME问题应及时告知工作负责人。\n· 出现防异物行为偏差或异物入侵事件要及时向工作负责人、主管、准备工程师、本单位防异物管理机构报告。\n· 防异物管理要求适用于每一位现场工作人员。\n· 异物入侵可能损坏设备、增加工时，严重可能导致停机、停堆，异物无论大小都应报告。"},{"id":"safety_hsy2_0012","module":"safety","bank":"安全-核素养(下)","type":"judge","stem":"纸张、塑料袋、碎布、聚乙烯薄膜、泡沫等易撕碎材料禁止作为防异物挡板。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件5.2节明确要求\"纸张、塑料袋、碎布、塑料包装、聚乙烯薄膜、泡沫等易撕碎材料禁止作为防异物挡板\"。题目表述与课件一致，故判\"正确\"。\n\n【知识点】\n· 纸张、塑料袋、碎布、塑料包装、聚乙烯薄膜、泡沫等易撕碎材料禁止作为防异物挡板。\n· 所有暂时不进行工作的开口必须进行封堵。\n· 工作暂停期间应使用防异物装置封堵设备开口，未经工作负责人同意，非工作人员禁止移动防异物装置。\n· 封堵严禁使用塑料袋、纸张纸板、橡胶手套等作为临时防异物装置，应使用防异物装置如防异物盲板，并用至少两颗螺栓对称固定。"},{"id":"safety_hsy2_0013","module":"safety","bank":"安全-核素养(下)","type":"judge","stem":"当需要从高处往下搬运物料时，应使用合适的物料下放设备，禁止抛投。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件6.3节一般规定明确指出\"当需要从高处往下搬运物料时，应使用合适的物料下放设备，禁止抛投\"。题目表述与课件一致，故判\"正确\"。\n\n【知识点】\n· 从高处往下搬运物料时应使用合适的物料下放设备，禁止抛投。\n· 应尽量水平方向或者利用物料的重力来搬运物料。\n· 使用的手推车和运输车等应有载重等级标识。\n· 当有两个或两个以上人员进行人工搬运时，应协商指定专人负责指挥和协调物料搬运活动。"},{"id":"safety_hsy2_0014","module":"safety","bank":"安全-核素养(下)","type":"judge","stem":"工作需要加班时，可以用U盘把公司文件拷贝到家里电脑上修改。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件7.4节将\"在生产网专用计算机、管理网计算机上使用U盘等移动存储介质，使用USB接口功能接入手机或其他私人外接设备\"列为中国核电网络安全违章行为；7.3节也规定\"（本机）严禁连接U盘、收集等设备\"。题目说法与课件要求矛盾，故判\"错误\"。\n\n【知识点】\n· 在生产网专用计算机、管理网计算机上使用U盘等移动存储介质属网络安全违章行为。\n· 严禁在办公本机连接U盘等设备，严禁使用USB接口功能接入手机或其他私人外接设备。\n· 公司办公IT终端遗失未及时上报、私自外出修理更换计算机配件也属违章行为。\n· 切勿点击陌生邮件的附件或链接，对接收的文件进行病毒查杀，不将非公司资产的终端接入公司内网。"},{"id":"safety_hsy2_0015","module":"safety","bank":"安全-核素养(下)","type":"judge","stem":"排放污染物的企业事业单位，应当建立环境保护责任制度，明确单位负责人和相关人员的责任。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件8.2节环境保护基本知识明确引用环保法原文：\"环保责任制度：'排放污染物的企业事业单位，应当建立环境保护责任制度，明确单位负责人和相关人员的责任。'\"题目表述与课件一致，故判\"正确\"。\n\n【知识点】\n· 排放污染物的企业事业单位应当建立环境保护责任制度。\n· 环境保护责任制度应明确单位负责人和相关人员的责任。\n· 损害担责：企业事业单位和其他生产经营者应当防止、减少环境污染和生态破坏，对所造成的损害依法承担责任。\n· 排放污染物的单位应当采取防治措施，防治废气、废水、废渣、医疗废物、粉尘、放射性物质、噪声、光辐射等对环境的污染和危害。"},{"id":"safety_hsy2_0016","module":"safety","bank":"安全-核素养(下)","type":"multi","stem":"以下属于中国核电网络安全违章行为的有（　）。","options":["在生产网专用计算机、管理网计算机上使用U盘等移动存储介质","冒用他人信息系统账号或窃取他人账号口令","使用漏扫、嗅探、黑客软件对公司网络进行扫描或攻击","设置符合复杂度要求的密码并定期更改"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核素养(下)课件","explanation":"依据课件《核素养（下）》：课件7.4节列出的中国核电网络安全违章行为包括\"在生产网专用计算机、管理网计算机上使用U盘等移动存储介质，使用USB接口功能接入手机或其他私人外接设备\"\"冒用他人信息系统账号或窃取他人账号口令登陆信息系统\"\"使用漏扫、嗅探、黑客软件和工具对公司生产网或管理网进行扫描或攻击\"。故ABC三项均属违章行为，选ABC。D项\"设置符合复杂度要求的密码并定期更改\"是7.3节要求员工遵守的正确行为，不属违章。\n\n【知识点】\n· 在生产网专用计算机、管理网计算机上使用U盘等移动存储介质属违章行为。\n· 冒用他人信息系统账号或窃取他人账号口令登陆信息系统属违章行为。\n· 使用漏扫、嗅探、黑客软件和工具对公司生产网或管理网进行扫描或攻击属违章行为。\n· 擅自重装办公IT终端操作系统、安装未经批准的软件、卸载防病毒软件等均属违章行为。\n· 设置符合复杂度要求的密码并定期更改口令是应遵守的正确网络行为。"},{"id":"safety_hxfh_0001","module":"safety","bank":"安全-放射性呼吸防护","type":"single","stem":"正常空气中的氧气浓度为（　）。","options":["21%","19.5%","23.5%","25%"],"answer":["A"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第1.2节（第10页）明确给出三种氧气浓度环境分类，其中“可接受的氧气浓度的工作环境：正常空气中的氧气浓度为21%；氧含量浓度为19.5%~23.5%的空气可以做呼吸使用”。故本题选A（21%）。选项B（19.5%）为缺氧环境下限，选项C（23.5%）为富氧环境下限，均非正常空气浓度。\\n\\n【知识点】\\n· 正常空气中的氧气浓度为21%。\\n· 氧含量浓度小于19.5%为缺氧工作环境，大于23.5%为富氧工作环境。\\n· 氧含量浓度在19.5%~23.5%之间的空气可做呼吸使用。\\n· 缺氧、富氧、有毒气环境均属于会对生命或健康瞬间造成危害的环境。"},{"id":"safety_hxfh_0002","module":"safety","bank":"安全-放射性呼吸防护","type":"single","stem":"环境中的氧含量浓度小于（　）时，属于缺氧的工作环境。","options":["21%","23.5%","19.5%","30%"],"answer":["C"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第1.2节（第10页）明确指出“缺氧的工作环境：环境中的氧含量浓度小于19.5%”。故本题选C（19.5%）。选项A（21%）为正常氧气浓度，选项B（23.5%）为富氧环境下限，选项D（30%）无对应分类。\\n\\n【知识点】\\n· 缺氧工作环境的判定标准为氧含量浓度小于19.5%。\\n· 富氧工作环境为氧含量浓度大于23.5%。\\n· 正常空气中氧气浓度为21%，可接受范围为19.5%~23.5%。\\n· 非放射性气载污染物环境风险包括缺氧、富氧、有毒气及IDLH环境。"},{"id":"safety_hxfh_0003","module":"safety","bank":"安全-放射性呼吸防护","type":"single","stem":"唯一可以在IDLH环境（对生命和健康有立即威胁的环境）中使用的呼吸装备是（　）。","options":["空气过滤呼吸器","自给式呼吸器","气面罩","半面罩空气过滤呼吸器"],"answer":["B"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第2.2节（第18页）指出“空气过滤呼吸器无法为缺氧环境或IDLH环境提供保护，在这种环境中只有使用自给式呼吸器才能得到防护”；第2.3节（第21页）进一步明确“自给式呼吸器是唯一可以在IDLH环境中使用的呼吸装备，也是唯一可以在进入情况不明的环境中进行急救所使用的呼吸装备”。故本题选B（自给式呼吸器）。\\n\\n【知识点】\\n· IDLH环境指对生命和健康有立即威胁的环境。\\n· 自给式呼吸器是唯一可在IDLH环境中使用的呼吸装备。\\n· 空气过滤呼吸器无法为缺氧环境或IDLH环境提供保护。\\n· 自给式呼吸器包括高压气瓶和压力调节装置，呼吸器内通常为正压状态。"},{"id":"safety_hxfh_0004","module":"safety","bank":"安全-放射性呼吸防护","type":"single","stem":"自给式呼吸器的防护因子为（　）。","options":["100","1000","10000","100000"],"answer":["C"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第2.3节（第23页）在自给式呼吸器与空气过滤呼吸器的优缺点对比中，明确列出自给式呼吸器的优点之一为“高防护因子 (10000)”。故本题选C（10000）。空气过滤呼吸器的缺点之一为“防护因子较低”，两者形成对比。\\n\\n【知识点】\\n· 自给式呼吸器的防护因子为10000，属于高防护因子。\\n· 空气过滤呼吸器防护因子较低，运行时处于负压模式。\\n· 防护因子是呼吸器内与呼吸器外空气成分比较确定的防护标准水平。\\n· 防护因子越高，呼吸器防护有害物质的能力越高。"},{"id":"safety_hxfh_0005","module":"safety","bank":"安全-放射性呼吸防护","type":"single","stem":"负压试验时，若密封完好，观察呼吸器向内凹陷应可以维持（　）以上。","options":["5秒","10秒","30秒","60秒"],"answer":["B"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第3.4节气密性检测（第36页）负压试验步骤明确表述：“轻轻吸气，呼吸器内部形成微负压，可观察到呼吸器微微向内凹陷；屏住呼吸，如果密封完好，观察呼吸器向内凹陷是否可以维持10S以上”。故本题选B（10秒）。\\n\\n【知识点】\\n· 负压试验时双手捂住呼气阀入口，轻轻吸气使呼吸器内部形成微负压。\\n· 密封完好时，呼吸器向内凹陷应可维持10秒以上。\\n· 若负压试验失败，需重新穿戴呼吸器并重新测试。\\n· 正压试验为双手捂住吸气阀出口轻轻呼气，检查密封处有无空气泄漏。"},{"id":"safety_hxfh_0006","module":"safety","bank":"安全-放射性呼吸防护","type":"single","stem":"高效过滤器对于直径大于等于（　）的微粒能过滤99.79%。","options":["0.3微米","0.03微米","3微米","0.3毫米"],"answer":["A"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第2.2节（第18页）明确指出“高效过滤器对于直径大于等于0.3微米的微粒能过滤99.79%”。故本题选A（0.3微米）。同时课件指出高效过滤器无法提供放射性、毒气和蒸汽保护。\\n\\n【知识点】\\n· 高效过滤器对直径大于等于0.3微米的微粒能过滤99.79%。\\n· 空气过滤呼吸器通常用来过滤微粒，过滤器仅对灰尘、烟雾和薄雾起过滤作用。\\n· 高效过滤器无法用来提供过滤放射性、毒气和蒸汽保护。\\n· 若存在有害气体，需使用针对工作区有害物质的特殊过滤器。"},{"id":"safety_hxfh_0007","module":"safety","bank":"安全-放射性呼吸防护","type":"single","stem":"关于气衣的脱除，正确的说法是（　）。","options":["可以自行快速脱除","必须在现场服务人员协助下脱除","拉开应急拉条后即可自行脱除","脱除方式无特殊要求"],"answer":["B"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第3.5节（第39页）气衣脱除部分明确指出“气衣必须在现场服务人员的协助下脱除，严禁自行脱除”，并描述了脱除流程：关掉供气阀、解开供气接口、封住气管口、拆除手腕胶带、擦拭应急拉条后拉开应急拉条使气衣一分为二、从里向外从上至下翻脱。故本题选B（必须在现场服务人员协助下脱除）。\\n\\n【知识点】\\n· 气衣必须在现场服务人员协助下脱除，严禁自行脱除。\\n· 气衣脱除时需拉开应急拉条使气衣一分为二，从里向外、从上至下翻脱。\\n· 气衣在呼吸器嘴部正前方设置有应急拉条，失去空气供应时可紧急打开供穿戴者呼吸。\\n· 气面罩脱除时弯腰用两手抓住顶部慢慢向下拽，与气衣脱除方式不同。"},{"id":"safety_hxfh_0008","module":"safety","bank":"安全-放射性呼吸防护","type":"judge","stem":"使用呼吸器是为了限制放射性气体污染物的吸入。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第1.1节（第7页）在气载污染物进入人体途径部分明确指出“使用呼吸器是为了限制放射性气体污染物的吸入”。无论非放射性或放射性气体污染物，都有呼吸吸入、食入、皮肤进入和裸露伤口进入四种途径，呼吸器针对的是呼吸吸入途径。故本题判“正确”。\\n\\n【知识点】\\n· 使用呼吸器是为了限制放射性气体污染物的吸入。\\n· 气载污染物进入人体有四种途径：呼吸吸入、食入、皮肤进入、裸露伤口进入。\\n· 气载污染物包括放射性气载悬浮物、微粒、雾气、水汽、烟气及其它气体。\\n· 微粒污染物可覆着在设备或楼梯表面，气体、水汽和烟气正常情况下不覆着在物体表面。"},{"id":"safety_hxfh_0009","module":"safety","bank":"安全-放射性呼吸防护","type":"judge","stem":"空气过滤呼吸器可以为缺氧环境或IDLH环境提供保护。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第2.2节（第18页）明确指出“空气过滤呼吸器无法为缺氧环境或IDLH环境（IDLH环境指对生命和健康有立即威胁的环境）提供保护，在这种环境中只有使用自给式呼吸器才能得到防护”。题干称空气过滤呼吸器可为缺氧或IDLH环境提供保护，与课件矛盾，故本题判“错误”。\\n\\n【知识点】\\n· 空气过滤呼吸器无法为缺氧环境或IDLH环境提供保护。\\n· IDLH环境指对生命和健康有立即威胁的环境。\\n· 在缺氧或IDLH环境中只有使用自给式呼吸器才能得到防护。\\n· 空气过滤呼吸器运行时处于负压模式，若密封不好外面空气会从密封处进入。"},{"id":"safety_hxfh_0010","module":"safety","bank":"安全-放射性呼吸防护","type":"judge","stem":"如果在呼吸器密封性试验中嘴里有假牙，实际工作中穿戴呼吸器也必须使用假牙。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第3.2节（第31页）假牙部分明确指出“如果在呼吸器密封性试验中使用假牙，那么在实际工作中穿戴呼吸器也必须使用假牙”，并解释原因：“不带假牙可能会导致下巴扭曲而导致与呼吸器形成的密封泄漏”。故本题判“正确”。\\n\\n【知识点】\\n· 密封性试验中使用假牙，实际工作中穿戴呼吸器也必须使用假牙。\\n· 不带假牙可能导致下巴扭曲，导致与呼吸器形成的密封泄漏。\\n· 若存在吞咽部分假牙的危险，建议在密封性试验及使用过程中不使用假牙。\\n· 面部胡须、面部伤疤等因素也会导致呼吸器不能完全密封。"},{"id":"safety_hxfh_0011","module":"safety","bank":"安全-放射性呼吸防护","type":"judge","stem":"使用呼吸器时戴安全帽的正确做法是先穿戴安全帽，再将呼吸器的绑带穿戴至头部合适处。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第3.2节（第32页）安全帽部分明确指出“正确的做法是首先将呼吸器的绑带穿戴至头部合适处，再穿戴安全帽，安全帽的绑带覆盖在呼吸器的绑带上”。题干表述“先穿戴安全帽，再将呼吸器的绑带穿戴至头部合适处”与课件顺序相反，故本题判“错误”。\\n\\n【知识点】\\n· 使用呼吸器时戴安全帽的正确顺序：先穿呼吸器绑带，再戴安全帽。\\n· 安全帽的绑带应覆盖在呼吸器的绑带上。\\n· 安全帽须正确使用，且不能影响呼吸器的正常使用。\\n· 有框眼镜一般不允许在呼吸器中使用，会影响密封，可使用特殊眼镜套件。"},{"id":"safety_hxfh_0012","module":"safety","bank":"安全-放射性呼吸防护","type":"judge","stem":"防护因子越高，呼吸器防护有害物质的能力越高。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第1.5节呼吸防护因子（第13页）明确指出“防护因子越高，呼吸器防护有害物质的能力越高”，并以举例说明：“如果呼吸器外面微粒为100个单元，呼吸器内部为1个单元，则防护因子为100，意味着穿戴此呼吸器的工作人员将会吸入外部气体微粒的1%”。故本题判“正确”。\\n\\n【知识点】\\n· 防护因子越高，呼吸器防护有害物质的能力越高。\\n· 防护因子是正常运转的呼吸器在正确安装、正确使用下能达到的防护标准水平。\\n· 防护因子通过比较呼吸器内外空气成分确定。\\n· 自给式呼吸器防护因子高达10000，空气过滤呼吸器防护因子较低。"},{"id":"safety_hxfh_0013","module":"safety","bank":"安全-放射性呼吸防护","type":"multi","stem":"可供应呼吸空气的呼吸器的型式包括（　）。","options":["自给式呼吸器","气面罩","气衣","空气过滤呼吸器"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"放射性呼吸防护课件","explanation":"依据课件《放射性呼吸防护》：课件第2.1节（第15页）将呼吸器分为两类——“空气过滤呼吸器”和“可供应呼吸空气的呼吸器”；第2.3节（第20页）明确指出“可供应呼吸空气的呼吸器的型式通常为自给式呼吸器、气面罩、气衣等”。空气过滤呼吸器属于另一大类，不属于“可供应呼吸空气的呼吸器”，故不选D。故本题选ABC。\\n\\n【知识点】\\n· 呼吸器分为空气过滤呼吸器和可供应呼吸空气的呼吸器两大类。\\n· 可供应呼吸空气的呼吸器的型式包括自给式呼吸器、气面罩、气衣等。\\n· 每类呼吸器工作方式不同，且有不同防护因子。\\n· 空气过滤呼吸器使用活性炭过滤器过滤污染物或用化学方法去除气体和蒸汽。"},{"id":"safety_qzdz_0001","module":"safety","bank":"安全-起重吊装","type":"single","stem":"正式吊运前，应将重物慢速吊离地面（　）以进行试吊。","options":["50mm以内","100-200mm","300-400mm","500mm以上"],"answer":["B"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件3.3节\"其它管理要求\"明确指出\"正式吊运前，应将重物慢速吊离地面100-200mm以进行试吊，确认吊物处于可靠的吊运状态，方可正常起升\"。故本题选B（100-200mm）。试吊是确认吊物处于可靠吊运状态、保证安全起升的必要环节，其余选项数值均与课件不符。\n\n【知识点】\n· 正式吊运前应将重物慢速吊离地面100-200mm进行试吊。\n· 试吊目的是确认吊物处于可靠的吊运状态，确认后方可正常起升。\n· 吊升载荷时应尽量保持负荷水平，既可更好地吊升，也能提高安全性。\n· 起吊大的或不规则的构件时，应在构件上系以牢固的拉绳，使其不摇摆不旋转。"},{"id":"safety_qzdz_0002","module":"safety","bank":"安全-起重吊装","type":"single","stem":"U形卸扣通常两支腿之间的夹角最大不得超过（　）。","options":["60°","90°","120°","150°"],"answer":["C"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.3节\"U型卸扣\"指出\"U形卸扣设计用于垂直方向的提升。随着提升角度的减小，U形卸扣的负重限值也降低。通常两支腿之间的夹角最大不得超过120°\"。故本题选C（120°）。两支腿夹角超过120°会显著降低卸扣负重能力、增大失效风险，课件将其作为硬性上限。\n\n【知识点】\n· U形卸扣两支腿之间的夹角最大不得超过120°。\n· U形卸扣设计用于垂直方向的提升，随提升角度减小其负重限值也降低。\n· 卸扣要正确支撑载荷，作用力应沿卸扣中心线轴线，避免弯曲、不稳定载荷，更不可过载。\n· 卸扣与钢丝绳索具配套捆绑使用时，横销部分应与钢丝绳索具锁眼连接，防止横销转动脱出。"},{"id":"safety_qzdz_0003","module":"safety","bank":"安全-起重吊装","type":"single","stem":"吊带使用时，应避免吊带软环张开角度超过（　）。","options":["20°","45°","60°","90°"],"answer":["A"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.5节\"吊带\"明确规定\"避免吊带软环张开角度超过20°角\"。故本题选A（20°）。软环张开角度过大会使吊带受力状态恶化、降低承载能力并加速损伤，故课件设定20°为安全上限。\n\n【知识点】\n· 吊带软环张开角度不得超过20°。\n· 吊带不允许交叉、扭转，不允许打结、打拧。\n· 吊带使用时不允许将吊带在吊钩上打结。\n· 吊管类物体时吊装角度不能过大，过大会产生安全隐患。"},{"id":"safety_qzdz_0004","module":"safety","bank":"安全-起重吊装","type":"single","stem":"以下符合起重作业\"十不吊\"原则的说法是（　）。","options":["超负荷经评估后可以吊","指挥信号不明或违章指挥不吊","吊物上站人时缓慢起吊","六级大风可短时吊装"],"answer":["B"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件4.1节\"十不吊\"原则第一条即为\"指挥信号不明或违章指挥不吊\"。故本题选B。A项\"超负荷经评估后可以吊\"与\"超负荷不吊\"矛盾；C项\"吊物上站人时缓慢起吊\"与\"吊物上有人或活动部件不吊\"矛盾；D项\"六级大风可短时吊装\"与\"六级以上大风或大雨，大雪，大雾等恶劣天气不吊\"矛盾。\n\n【知识点】\n· 指挥信号不明或违章指挥不吊。\n· 超负荷不吊；工件或吊物捆绑不牢不吊。\n· 吊物上有人或活动部件不吊；吊物重量不明、光线阴暗视线不清不吊。\n· 六级以上大风或大雨、大雪、大雾等恶劣天气不吊。"},{"id":"safety_qzdz_0005","module":"safety","bank":"安全-起重吊装","type":"single","stem":"单根吊带吊装时，应将吊带直接挂入（　）。","options":["吊钩钩尖部位","吊钩任意位置","吊钩受力中心位置","吊钩尾部"],"answer":["C"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.5节\"吊带\"明确要求\"单根吊装时，将吊带直接挂入吊钩受力中心位置，不能挂在吊钩钩尖部位\"。故本题选C（吊钩受力中心位置）。挂在钩尖或非受力中心会造成吊带受力不均、滑脱或损伤。\n\n【知识点】\n· 单根吊装时吊带应挂入吊钩受力中心位置，不能挂在吊钩钩尖部位。\n· 两根吊带作业时，各挂在双钩对称受力中心位置。\n· 四根吊带使用时每两根挂入双钩内，钩内吊带不能重叠和相互挤压。\n· 吊钩直径太小时与织带环眼结合不充分，应更换更大的吊钩或使用带金属钩的吊带。"},{"id":"safety_qzdz_0006","module":"safety","bank":"安全-起重吊装","type":"single","stem":"无肩有眼螺栓（　）。","options":["只用于垂直起重","可用于有角度的起重","可用于任意角度起重","仅用于水平牵引"],"answer":["A"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.2节\"有眼螺栓\"明确指出\"无肩有眼螺栓，只用于垂直起重\"，并说明\"无肩有眼螺栓在有角度拉动时会弯曲或折断，导致失败\"。故本题选A（只用于垂直起重）。有角度起重应使用有肩螺栓。\n\n【知识点】\n· 无肩（平）有眼螺栓只用于垂直起重，有角度拉动时会弯曲或折断。\n· 有肩螺栓可用于有角度的起重。\n· 如果有肩有眼螺栓没有100%接触到载荷表面，应当被当作无肩螺栓使用。\n· 有肩有眼螺栓必须被导向以便在眼平面拉动载荷，不用于<45°的角度。"},{"id":"safety_qzdz_0007","module":"safety","bank":"安全-起重吊装","type":"single","stem":"当吊装物有锋利的边时，为保护吊带免受割伤，应（　）。","options":["直接快速吊装","将保护衬（护套、护角）置于吊带和被吊物之间","使用两根吊带交叉捆绑","缩短吊装时间"],"answer":["B"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.5节\"吊带\"指出\"当吊装物有锋利的边时，锋利的边会对吊带带来破坏性的割伤，为保护吊带免受割伤，可用一保护衬(护套、护角)置于吊带和被吊物之间\"。故本题选B。直接在锋利边处吊装会割伤吊带，且\"棱角物项无防切割措施不吊\"也是\"十不吊\"原则之一。\n\n【知识点】\n· 吊装物有锋利边时，应加保护衬（护套、护角）置于吊带和被吊物之间。\n· 棱角物项无防切割措施不吊（\"十不吊\"原则第8条）。\n· 吊带不应在地面或粗糙表面拖拉。\n· 不应将物品压在吊带上，也不应试图将吊带从下面抽出来。"},{"id":"safety_qzdz_0008","module":"safety","bank":"安全-起重吊装","type":"single","stem":"吊带的WLL是指（　）。","options":["最大破断载荷","水平吊时工作载荷","垂直吊时极限工作载荷","吊带的安全系数"],"answer":["C"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.5节\"吊带\"明确给出\"WLL——垂直吊时极限工作载荷\"，并说明不同颜色吊带在正常使用条件下所允许承受的载荷，以kg或t表示。故本题选C。A项\"最大破断载荷\"是吊带的破断强度，不属于工作载荷；B、D项均与课件定义不符。\n\n【知识点】\n· WLL即垂直吊时极限工作载荷，是吊带的额定工作载荷。\n· 吊带通常以颜色和标签来表示其垂直承载能力。\n· 不同颜色吊带的WLL不同，如紫色1t、绿色2t、黄色3t、灰色4t、红色5t等。\n· 严禁超载使用吊带。"},{"id":"safety_qzdz_0009","module":"safety","bank":"安全-起重吊装","type":"judge","stem":"起重指挥、起重司机属于特种设备作业人员，工作前必须取得相应的特种设备作业人员证。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件3.1节\"人员培训要求\"明确指出\"起重指挥、起重司机属于特种设备作业人员，工作前必须取得相应的特种设备作业人员证\"。故本题判\"正确\"。此外，非特种作业人员也应经过公司专业培训并考核通过后方可进行起重吊装作业。\n\n【知识点】\n· 起重指挥、起重司机属于特种设备作业人员，工作前必须取得特种设备作业人员证。\n· 非特种作业人员也应经过公司专业培训并考核通过后方可作业。\n· 起重机、手拉葫芦、吊带、吊链等应定期检验，使用前需检查确认在检验/检定/检查有效期内。"},{"id":"safety_qzdz_0010","module":"safety","bank":"安全-起重吊装","type":"judge","stem":"人员禁止在吊物、吊臂下通过或停留。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件3.3节\"其它管理要求\"明确指出\"人员禁止在吊物、吊臂下通过或停留\"。故本题判\"正确\"。课件在风险概述部分也将\"吊物过人头顶或捆绑不牢\"列为典型安全隐患，吊装作业前还应建立隔离区域确保吊物下方无人员。\n\n【知识点】\n· 人员禁止在吊物、吊臂下通过或停留。\n· 吊物过人头顶是起重吊装作业的典型安全隐患之一。\n· 作业前应建立吊装隔离区域，确保吊物下方没有人员和影响安全的物品、设施。\n· 所有非必要人员应离开吊装区域直至吊装结束。"},{"id":"safety_qzdz_0011","module":"safety","bank":"安全-起重吊装","type":"judge","stem":"严禁将运行的设备、管道、支撑钢结构及工作平台等作为起重作业的承载点。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件3.3节\"其它管理要求\"明确指出\"严禁将运行的设备、管道、支撑钢结构及工作平台等作为起重作业的承载点\"。故本题判\"正确\"。课件同时说明，如必须运用厂房钢结构等辅助支撑，须经工程技术人员进行载荷吊拉专项评估，以确保支撑件有足够的强度。\n\n【知识点】\n· 严禁将运行的设备、管道、支撑钢结构及工作平台等作为起重作业的承载点。\n· 必须运用厂房钢结构等辅助支撑时，须经工程技术人员进行载荷吊拉专项评估。\n· 吊装路径及吊装设备运转需要应建立合理隔离区域，并安排专人负责边界管控。"},{"id":"safety_qzdz_0012","module":"safety","bank":"安全-起重吊装","type":"judge","stem":"索结无需在吊装开始前拉紧，可以在吊升过程中逐步拉紧。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.4节\"钢丝绳\"明确指出\"索结在吊装开始前就应该拉紧，而不是在吊升过程中才拉紧\"。题干\"可以在吊升过程中逐步拉紧\"与课件原文相反，故本题判\"错误\"。\n\n【知识点】\n· 索结应在吊装开始前拉紧，而非在吊升过程中才拉紧。\n· 如在一个吊物上使用两个吊索，要确保两个吊索眼是在负荷的相反的两侧。\n· 吊索应足够长以保证索套由吊索构成，而不包括吊索接合处、装配处或吊索眼。"},{"id":"safety_qzdz_0013","module":"safety","bank":"安全-起重吊装","type":"judge","stem":"使用多肢钢丝绳时，各肢长度不要求一致，只要能吊起即可。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件2.4节\"钢丝绳\"明确规定\"使用多肢钢丝绳时长度必须一致，应避免相互缠绕或挤压，且吊索肢间夹角不得大于120度\"。题干\"各肢长度不要求一致，只要能吊起即可\"与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 使用多肢钢丝绳时各肢长度必须一致。\n· 多肢钢丝绳应避免相互缠绕或挤压。\n· 吊索肢间夹角不得大于120度。"},{"id":"safety_qzdz_0014","module":"safety","bank":"安全-起重吊装","type":"multi","stem":"以下属于起重作业\"十不吊\"原则的有（　）。","options":["超负荷不吊","指挥信号不明或违章指挥不吊","工件或吊物捆绑不牢不吊","吊物重量明确、光线良好时可不吊"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"起重吊装课件","explanation":"依据课件《起重吊装》：课件4.1节\"十不吊\"原则包括\"2、超负荷不吊；1、指挥信号不明或违章指挥不吊；3、工件或吊物捆绑不牢不吊\"，故A、B、C正确。D项\"吊物重量明确、光线良好时可不吊\"与原则第7条\"吊物重量不明，光线阴暗视线不清不吊\"表述相反，故不选。\n\n【知识点】\n· 十不吊含：超负荷不吊、指挥信号不明或违章指挥不吊、工件或吊物捆绑不牢不吊。\n· 吊物重量不明、光线阴暗视线不清不吊。\n· 吊物上有人或活动部件不吊；工件埋在地下、与地面建筑物或设备有钩挂不吊。\n· 六级以上大风或大雨、大雪、大雾等恶劣天气不吊。"},{"id":"safety_xfbw_0001","module":"safety","bank":"安全-消防保卫","type":"single","stem":"物质燃烧必须具备的三个条件（燃烧三要素）是（　）。","options":["可燃物、助燃物、温度（引火源）","可燃物、氧气、水源","可燃物、助燃物、压力","燃料、空气、明火"],"answer":["A"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.1节\"消防基础知识\"明确指出\"物质燃烧过程的发生和发展，必须具备以下三个条件，即：可燃物、助燃物和温度（引火源）\"，即燃烧三要素为可燃物、助燃物、温度（引火源）。故本题选A。氧气、水源、压力、空气、明火等均非课件对燃烧三要素的表述。\n\n【知识点】\n· 燃烧的必要条件为可燃物、助燃物、温度（引火源）三大要素。\n· 可燃物是指能与空气中的氧或其他氧化剂起燃烧反应的物质，分为气体、液体、固体可燃物三类。\n· 助燃物是指凡与可燃物相结合能导致燃烧的物质。\n· 温度（引火源）是指凡使物质开始燃烧的外部热源。"},{"id":"safety_xfbw_0002","module":"safety","bank":"安全-消防保卫","type":"single","stem":"B类火灾是指（　）。","options":["固体物质火灾","气体火灾","液体和可熔化的固体物质火灾","金属火灾"],"answer":["C"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.2节\"火灾的分类\"明确列出\"B类火灾：液体和可熔化的固体物质火灾\"。故本题选C。固体物质火灾为A类，气体火灾为C类，金属火灾为D类。\n\n【知识点】\n· B类火灾指液体和可熔化的固体物质火灾。\n· A类火灾为固体物质火灾，C类火灾为气体火灾，D类火灾为金属火灾。\n· E类火灾为带电设备火灾，F类火灾为烹饪器具内的烹饪物火灾。\n· 火警报警时需说明火灾种类，便于选择正确的扑救方式。"},{"id":"safety_xfbw_0003","module":"safety","bank":"安全-消防保卫","type":"single","stem":"火灾扑救的最佳时期为（　）阶段。","options":["猛烈燃烧","发展","熄灭","初期"],"answer":["D"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.3节\"火灾四个阶段\"明确指出\"火灾扑救的最佳时期为初期！\"，四个阶段依次为初期、发展、猛烈燃烧、熄灭。故本题选D。\n\n【知识点】\n· 火灾扑救的最佳时期为初期阶段。\n· 火灾四个阶段依次为：初期阶段、发展阶段、猛烈燃烧阶段、熄灭阶段。\n· 火灾预防、火灾扑救措施都与燃烧三要素有关。\n· 任何火灾预防、火灾扑救措施都以控制燃烧三要素为目标。"},{"id":"safety_xfbw_0004","module":"safety","bank":"安全-消防保卫","type":"single","stem":"使用手提式灭火器灭火时，应迅速奔到距离燃烧物（　）左右的位置。","options":["2米","5米","8米","10米"],"answer":["B"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.7节\"消防器材\"手提式灭火器使用方法写明\"手提灭火器提把，迅速奔到距离燃烧物5米左右的位置\"。故本题选B。\n\n【知识点】\n· 使用手提式灭火器时应迅速奔到距离燃烧物5米左右的位置。\n· 使用前应检查灭火器压力是否在绿区。\n· 灭火时左右摆动喷射管、对准火焰根部，由近而远推进灭火，不留残火以防复燃。\n· 室外使用灭火器时应站在上风向。"},{"id":"safety_xfbw_0005","module":"safety","bank":"安全-消防保卫","type":"single","stem":"使用消火栓灭火时，应拿稳水枪在距离火苗（　）处对准着火部位。","options":["2-3米","5-6米","8-10米","15米以上"],"answer":["C"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.7节\"消火栓使用方法\"写明\"拿稳水枪在距离火苗8-10米对准着火部位\"，由另1人缓慢打开消火栓水阀出水灭火。故本题选C。\n\n【知识点】\n· 使用消火栓时拿稳水枪在距离火苗8-10米处对准着火部位。\n· 先由1人将水带完全展开，接上水枪和消火栓接口。\n· 另1人缓慢打开消火栓水阀，出水灭火，火扑灭后即停止射水。\n· 消火栓、水带等消防器材设施不得损坏、挪用、埋压、圈占、遮挡。"},{"id":"safety_xfbw_0006","module":"safety","bank":"安全-消防保卫","type":"single","stem":"二氧化碳灭火器不能扑救的火灾是（　）。","options":["B类火灾","C类火灾","带电设备火灾","钾、钠、镁等轻金属火灾"],"answer":["D"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.7节\"灭火器的正确使用\"写明二氧化碳灭火器\"适用于扑救B类火灾……C类火灾……和扑救E类火灾（物体带电燃烧的火灾），但不能扑救钾、钠、镁等轻金属火灾\"。故本题选D。\n\n【知识点】\n· 二氧化碳灭火器可扑救B类（液体）、C类（气体）及E类（带电设备）火灾。\n· 二氧化碳灭火器不能扑救钾、钠、镁等轻金属火灾。\n· CO2灭火器使用时应防止冻伤和窒息。\n· 干粉灭火器主要用于扑救易燃液体、可燃气体和电气设备的初期火灾，也可扑救固体物质的初起火灾。"},{"id":"safety_xfbw_0007","module":"safety","bank":"安全-消防保卫","type":"single","stem":"涉及消防系统隔离的长时间动火作业，如中途停止动火超过（　），停止动火期间需解除消防系统隔离。","options":["4小时","8小时","12小时","24小时"],"answer":["C"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.8节\"动火作业现场管理\"第7条写明\"涉及需要消防系统隔离的长时间动火作业，如中途停止动火超过12 小时，则在停止动火期间需解除消防系统隔离；待消防系统重新隔离后，方可按照动火作业流程继续实施动火作业\"。故本题选C。\n\n【知识点】\n· 涉及消防系统隔离的长时间动火作业，中途停止动火超过12小时，停止动火期间需解除消防系统隔离。\n· 待消防系统重新隔离后，方可按动火作业流程继续实施动火作业。\n· 动火作业开始前必须取得动火作业许可证。\n· 动火结束后应落实终结措施，全面检查确认无火灾隐患后人员方可离开。"},{"id":"safety_xfbw_0008","module":"safety","bank":"安全-消防保卫","type":"single","stem":"核电厂保卫区域一般分为（　）。","options":["控制区、管控区、防护区、关键区","管理区、控制区、保护区、要害区","管理区、监控区、防护区、核心区","厂区、园区、生产区、办公区"],"answer":["B"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第2.1节\"核电厂分区管理\"写明\"保卫区域一般分为：管理区、控制区、保护区、要害区\"。故本题选B。\n\n【知识点】\n· 保卫区域分为管理区、控制区、保护区和要害区四个区域。\n· 管理区为控制区、保护区、要害区以外具有企业管理权限的区域，含办公楼、宿舍、食堂、超市等。\n· 控制区指保护区实体屏障至核岛厂房外的区域，含220Kv开关站、氢气制备车间、汽轮机厂房等。\n· 要害区主要指核岛内的各区域、部位、海水泵房、保卫控制中心等，进入需要附加授权。"},{"id":"safety_xfbw_0009","module":"safety","bank":"安全-消防保卫","type":"judge","stem":"发生火灾时不要使用电梯，为防止吸入有毒气体，要用湿毛巾捂住口鼻，弯腰或匍匐前进。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.6节\"逃生自救\"第2条写明\"发生火灾时，不要使用电梯；条件允许，可结绳下滑自救。逃生时，火灾产生的有毒气体对人体伤害最大。为防止吸入有毒气体，要用湿毛巾捂住口鼻，弯腰或匍匐前进\"。题干表述与课件完全一致，故本题判\"正确\"。\n\n【知识点】\n· 发生火灾时不要使用电梯，条件允许可结绳下滑自救。\n· 火灾产生的有毒气体对人体伤害最大。\n· 逃生时应用湿毛巾捂住口鼻，弯腰或匍匐前进。\n· 发生火灾时要沉着冷静，按安全出口指示标志尽快从安全通道逃生。"},{"id":"safety_xfbw_0010","module":"safety","bank":"安全-消防保卫","type":"judge","stem":"干粉灭火后，要用水或其它灭火剂降温，防止复燃。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.7节\"消防器材注意事项\"写明\"干粉灭火后，要用水或其它灭火剂降温，防止复燃\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 干粉灭火后，要用水或其它灭火剂降温，防止复燃。\n· 使用灭火器灭火时应对准火焰根部由近而远推进灭火，不留残火，以防复燃。\n· 扑救油类等易燃液体火灾时，应避免冲击液面，防止液体飞溅。\n· 家用电器发生火灾，在没有灭火器的情况下应先切断电源。"},{"id":"safety_xfbw_0011","module":"safety","bank":"安全-消防保卫","type":"judge","stem":"在开始动火作业之前，必须取得动火作业许可证。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.5节\"现场消防管理\"写明动火作业\"在开始这类的工作之前，必需取得动火作业许可证\"；第1.8节亦明确\"采用分级动火许可证控制方式\"，动火人员须按《动火许可证》要求落实防护措施并经消防监督人员现场检查同意后方可动火。故本题判\"正确\"。\n\n【知识点】\n· 开始动火作业之前必须取得动火作业许可证。\n· 动火作业实行分级动火许可证控制方式，分一、二、三级动火作业。\n· 动火人员在动火前应按《动火许可证》要求逐项落实动火防护措施。\n· 无证动火或持无效、过期动火证动火属于消防红线行为。"},{"id":"safety_xfbw_0012","module":"safety","bank":"安全-消防保卫","type":"judge","stem":"因工作需要打开防火屏障，无需办理任何许可，工作结束后恢复即可。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.5节\"防火屏障管理\"写明\"因工作需要打开防火屏障，必须在电厂消防管理部门办理防火屏障打开许可。未办理许可，禁止将防火屏障处于失效状态\"。题干说\"无需办理任何许可\"与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 打开防火屏障必须在电厂消防管理部门办理防火屏障打开许可。\n· 未办理许可，禁止将防火屏障处于失效状态。\n· 防火屏障包括墙壁、地板、天花板、防火风管及门洞、贯穿件、通风系统通道的封堵装置等。\n· 所有防火屏障必须保持完整性（或处于常闭状态），未按要求关闭将按一般违章处理。"},{"id":"safety_xfbw_0013","module":"safety","bank":"安全-消防保卫","type":"judge","stem":"在使用易燃易爆物品的场所，可以在一个或上下交叉重叠的区域内同时进行切割、电（气）焊、打磨等动火作业。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第1.8节\"可燃物料防火管理\"第10条写明\"在使用易燃易爆物品的场所，严禁在一个或上下交叉重叠的区域内同时进行切割、电（气）焊、打磨等动火作业。水平距离10m 范围内禁止动火\"。题干做法与课件\"严禁\"要求矛盾，故本题判\"错误\"。\n\n【知识点】\n· 在使用易燃易爆物品的场所，严禁在一个或上下交叉重叠的区域内同时进行切割、电（气）焊、打磨等动火作业。\n· 在使用易燃易爆物品的场所，水平距离10m范围内禁止动火。\n· 室内使用油漆等易挥发产生易燃气体的作业时应保持良好通风，作业场所严禁明火。\n· 动火作业过程中消防监督员等应不定期监督检查，发现隐患立即要求中止动火作业。"},{"id":"safety_xfbw_0014","module":"safety","bank":"安全-消防保卫","type":"judge","stem":"酒精饮料经个人申报后可以携带进入保护区。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第2.3节\"入厂须知\"违禁物品清单明确将\"酒精饮料\"列入禁止携带范围（其余违禁品包括管制刀具、防蚊喷雾、弹药、非法毒品、燃烧装置、未经授权的武器、炸药）。题干称\"经个人申报后可携带\"与课件不符，故本题判\"错误\"。\n\n【知识点】\n· 酒精饮料属于保护区禁止携带的违禁物品。\n· 违禁物品还包括管制刀具、弹药、非法毒品、燃烧装置、未经授权的武器、炸药等。\n· 携带违禁品进入保护区属于保卫红线行为。\n· 任何进入保护区的人员都要接受搜身以及携带物品的检查，所有安检经默示或明示同意。"},{"id":"safety_xfbw_0015","module":"safety","bank":"安全-消防保卫","type":"multi","stem":"以下属于保护区禁止携带的违禁物品有（　）。","options":["管制刀具","非法毒品","酒精饮料","个人常用药品"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"消防保卫课件","explanation":"依据课件《消防保卫》：课件第2.3节\"入厂须知\"违禁物品清单列明管制刀具、弹药、非法毒品、酒精饮料、燃烧装置、未经授权的武器、炸药、防蚊喷雾等均为禁止携带物品。管制刀具、非法毒品、酒精饮料均在清单内，个人常用药品不在违禁清单中，故本题选ABC。\n\n【知识点】\n· 管制刀具、非法毒品、酒精饮料均属于保护区禁止携带的违禁物品。\n· 违禁物品还包括弹药、燃烧装置、未经授权的武器、炸药、防蚊喷雾等。\n· 任何进入保护区的人员都要接受搜身以及携带物品的检查。\n· 携带违禁品进入保护区属于保卫红线行为，禁止任何拒绝安检的人进入相应区域。"},{"id":"safety_yxkj_0001","module":"safety","bank":"安全-有限空间","type":"single","stem":"有限空间作业应严格遵守的作业基本原则是（　）。","options":["A先检测、再通风、后作业","B先通风、再作业、后检测","C先通风、再检测、后作业","D先作业、再检测、后通风"],"answer":["C"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第45页（3.2控制措施—作业前准备）明确指出\"作业基本原则：先通风、再检测、后作业\"，第52页再次强调\"有限空间作业应当严格遵守'先通风、再检测、后作业'的原则\"。故本题选C（先通风、再检测、后作业）。选项A\"先检测\"错误，检测应在通风之后进行；选项B、D顺序均与课件原则矛盾。\n\n【知识点】\n· 有限空间作业基本原则为\"先通风、再检测、后作业\"。\n· 作业前需准备人员出入登记表、气体测量记录表、《工作许可》等文件并放置在入口处。\n· 工作负责人现场确认作业风险及管控措施后召开工前会。\n· 在有限空间入口处建立作业隔离区，设置警示标识。"},{"id":"safety_yxkj_0002","module":"safety","bank":"安全-有限空间","type":"single","stem":"允许人员进入并工作的有限空间，其氧气含量应保持在（　）。","options":["15%～18%","19.5%～23.5%","23%～25%","10%～15%"],"answer":["B"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第29页（3.1风险—窒息）明确给出\"氧气含量必须保持在19.5-23.5%\"，第58页检测要求中再次写明\"测氧：允许人员进入和工作的氧含量为19.5%～23.5%\"。故本题选B（19.5%～23.5%）。15%～18%时工作能力降低、感到费力；10%～12%呼吸减弱、嘴唇变青；低于6%～8%可致死。\n\n【知识点】\n· 允许人员进入和工作的氧含量为19.5%～23.5%。\n· 氧含量＞23.5%为氧富余，易引起火灾及头昏眼花。\n· 氧含量15%～19%时工作能力降低；10%～12%呼吸减弱、嘴唇变青。\n· 氧含量4%～6%时40秒后昏迷、抽搐、呼吸停止，可致死亡。"},{"id":"safety_yxkj_0003","module":"safety","bank":"安全-有限空间","type":"single","stem":"有限空间作业时，可燃气体浓度必须低于其爆炸下限的（　）。","options":["1%","2%","5%","10%"],"answer":["D"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第34页（3.1风险—爆炸）明确指出\"可燃气体浓度必须低于其爆炸下限的10%\"，第58页测爆要求再次确认\"可燃性气体浓度必须低于爆炸下限的10%\"。故本题选D（10%）。1%、2%、5%均比课件要求更严，不是一般有限空间的通用限值。\n\n【知识点】\n· 一般有限空间可燃气体浓度必须低于爆炸下限的10%。\n· 对油箱、油罐检修，可燃性气体浓度必须低于爆炸下限的1%（更严格）。\n· 爆炸是有限空间作业的主要风险类型之一。\n· 测爆是进入前检测的必要项目，检测人员应在有限空间外上风侧使用泵吸式检测仪。"},{"id":"safety_yxkj_0004","module":"safety","bank":"安全-有限空间","type":"single","stem":"对油箱、油罐进行检修时，空气中可燃性气体的浓度必须低于爆炸下限的（　）。","options":["1%","5%","10%","0.5%"],"answer":["A"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第34页明确指出\"对油箱、油罐，空气中可燃性气体的浓度必须低于爆炸下限的1%\"，第58页测爆要求再次确认同一标准。故本题选A（1%）。一般有限空间要求低于爆炸下限10%，但油箱、油罐因盛装易燃易爆介质风险更高，标准更严，为1%。\n\n【知识点】\n· 油箱、油罐检修时空气中可燃性气体浓度必须低于爆炸下限的1%。\n· 一般有限空间可燃气体浓度限值为爆炸下限的10%。\n· 油箱、油罐属于常见的有限空间类型（槽体、罐、水/油箱、箱柜）。\n· 对存有残余易燃易爆物品的容器，应先用水蒸气吹洗或热碱水冲洗干净。"},{"id":"safety_yxkj_0005","module":"safety","bank":"安全-有限空间","type":"single","stem":"测温要求有限空间内的环境温度（　）。","options":["A不高于40℃","B不高于60℃","C不高于50℃","D不高于35℃"],"answer":["C"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第58页（检测要求）明确给出\"测温：确定有限空间内的环境温度不高于50℃\"。故本题选C（不高于50℃）。40℃、35℃过于严格且无依据，60℃则超出安全限值。\n\n【知识点】\n· 有限空间内环境温度不高于50℃。\n· 进入前检测包括测氧、测爆、测温、测毒四项。\n· 测氧：氧含量19.5%～23.5%；测爆：可燃气体低于爆炸下限10%（油箱油罐为1%）。\n· 测毒：有毒气体浓度须低于《有毒有害气体接触限值》规定值。"},{"id":"safety_yxkj_0006","module":"safety","bank":"安全-有限空间","type":"single","stem":"有限空间作业过程中，应对作业人员活动区域进行实时气体监测，并（　）。","options":["A每15分钟记录1个瞬时值","B每30分钟记录1个瞬时值","C每1小时记录1个瞬时值","D每2小时记录1个瞬时值"],"answer":["A"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第56页（检测要求）明确指出\"作业过程中应对作业人活动区域进行实时气体监测，每15分钟记录1个瞬时值\"。故本题选A（每15分钟记录1个瞬时值）。若无法完全隔离有害物质或存在改变空气质量的作业，还需持续监测并设置报警装置。\n\n【知识点】\n· 作业过程中应对作业人员活动区域进行实时气体监测，每15分钟记录1个瞬时值。\n· 检测分为进入前检测和工作中监测，工作中可定期检测或持续监测。\n· 若无法完全隔离有害物质，需持续监测并设置报警装置。\n· 有限空间内部人员应随身佩戴气体检测仪表。"},{"id":"safety_yxkj_0007","module":"safety","bank":"安全-有限空间","type":"single","stem":"在潮湿的金属容器内（如凝汽器）作业时，其照明电压不得大于（　）。","options":["36V","24V","220V","12V"],"answer":["D"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第63页（用电要求）明确给出\"有限空间作业使用临时照明电压不大于36V。金属设备内其电压不应超过24V，潮湿的金属容器内作业（如凝汽器），其电压不大于12V\"。故本题选D（12V）。36V为一般有限空间照明限值，24V为金属设备内限值，均不适用于潮湿金属容器。\n\n【知识点】\n· 潮湿金属容器内（如凝汽器）作业照明电压不大于12V。\n· 一般有限空间临时照明电压不大于36V。\n· 金属设备内电压不应超过24V。\n· 原盛有爆炸性介质的有限空间应使用防爆电筒或防爆行灯，电压不大于12V。"},{"id":"safety_yxkj_0008","module":"safety","bank":"安全-有限空间","type":"single","stem":"在可能发生有毒有害气体的情况下，应在有限空间外进行持续监护的人员至少为（　）。","options":["2人","1人","3人","4人"],"answer":["A"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第50页（安排专职监护人）明确指出\"明确有限空间作业的工作组成员，安排至少一名监护人在有限空间外进行持续监护；在可能发生有毒有害气体的情况下，至少设置2人在有限空间外进行持续监护\"。故本题选A（2人）。一般情况至少1名监护人，有毒有害气体情况下加码至2人。\n\n【知识点】\n· 可能发生有毒有害气体的情况下，有限空间外持续监护人员至少2人。\n· 一般情况下至少安排1名监护人在有限空间外持续监护。\n· 监护人需佩戴明显标识（袖标、帽贴或反光背心）。\n· 监护人不能承担与监护职责冲突的工作，须保证在有限空间外持续监护。"},{"id":"safety_yxkj_0009","module":"safety","bank":"安全-有限空间","type":"single","stem":"金属容器内作业时，必须选用的手持电动工具为（　）。","options":["AⅠ类手持电动工具","BⅡ类或Ⅲ类手持电动工具","CⅠ类或Ⅱ类均可","D任意类型均可"],"answer":["B"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第64页（用电要求）明确指出\"严禁使用Ⅰ类电气工具\"，\"金属容器内必须选用Ⅱ类或III类手持电动工具，同时保证金属容器可靠接地\"。故本题选B（Ⅱ类或Ⅲ类）。Ⅰ类工具被明确禁止使用，不存在\"任意类型均可\"的情况。\n\n【知识点】\n· 金属容器内必须选用Ⅱ类或Ⅲ类手持电动工具，禁用Ⅰ类。\n· 使用电动工具时必须同时使用漏电保护器。\n· 使用外壳为金属材料的电动工具时应戴绝缘手套。\n· 潮湿环境应穿绝缘靴或站在干燥的绝缘垫/板上，金属容器须可靠接地。"},{"id":"safety_yxkj_0010","module":"safety","bank":"安全-有限空间","type":"judge","stem":"若作业人员进入电缆沟、管沟开展作业，其盖板未完全开启，则按照密闭空间作业进行风险控制。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第21页明确指出\"若作业人员进入沟道区域盖板未完全开启（人员进出活动受限，自然通风不良），进入电缆沟、管沟开展作业则按照有限空间作业进行风险控制\"，课件练习题（第23-24页）原题即此判断题，答案为\"对\"。故本题判\"正确\"。\n\n【知识点】\n· 电缆沟、管沟盖板未完全开启时按有限空间（密闭空间）作业进行风险控制。\n· 有限空间也叫\"密闭空间\"，指封闭或部分封闭、未被设计为固定工作场所的空间。\n· 盖板未完全开启导致人员进出受限、自然通风不良，符合有限空间定义。\n· 沟道、管廊属于常见的有限空间类型。"},{"id":"safety_yxkj_0011","module":"safety","bank":"安全-有限空间","type":"judge","stem":"对于只有执行调试、维修相关作业时才允许人员进入的有限空间（如需打开人孔门），由工作组在有限空间外设置有限空间作业安全风险告知牌。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第16页（辨识方法一）明确指出\"对于只有执行调试、维修相关作业时才允许人员进入的有限空间（系统隔离或打开人孔门），由工作组在有限空间外设置有限空间作业安全风险告知牌\"，课件练习题（第25-26页）原题即此判断题，答案为\"对\"。故本题判\"正确\"。\n\n【知识点】\n· 只有调试、维修时才允许进入的有限空间，由工作组在有限空间外设置风险告知牌。\n· 人员可直接进入的有限空间，出入口设置永久性警示标识牌。\n· 《有限空间环境清单》是辨识有限空间的参考文件。\n· 尚未列入清单但需进入的，工作负责人应中止工作，待风险控制措施满足后方可开展。"},{"id":"safety_yxkj_0012","module":"safety","bank":"安全-有限空间","type":"judge","stem":"为提高有限空间内的氧含量，强制通风时可以通入氧气。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第54页（通风要求）明确指出\"强制通风应使用洁净的空气，严禁通入氧气\"。通入氧气会大幅增加爆炸和火灾风险。故本题判\"错误\"。\n\n【知识点】\n· 强制通风应使用洁净的空气，严禁通入氧气。\n· 有限空间仅有1个出入口时，应将风管置于有限空间底部（不接触底面）。\n· 有2个及以上出入口时，应在临近作业人处送风，远离处排风。\n· 进入有毒有害气体或高温有限空间前，应至少打开2个人孔并放置通风筒或导风板。"},{"id":"safety_yxkj_0013","module":"safety","bank":"安全-有限空间","type":"judge","stem":"在有限空间内进行焊接切割作业时，可以将气瓶带入有限空间内以便取用。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第65页（焊接切割要求）明确指出\"不得将各类气瓶带入有限空间\"。气瓶在密闭空间内存在泄漏、倾倒等风险。故本题判\"错误\"。\n\n【知识点】\n· 不得将各类气瓶带入有限空间。\n· 焊接切割时应严格检查连接软管和阀门没有漏气。\n· 作业点附近应放置灭火装置，电焊作业应配备漏电保护器。\n· 停止工作30分钟以上时，所有气源管线须移出有限空间或在有限空间外切断气源。"},{"id":"safety_yxkj_0014","module":"safety","bank":"安全-有限空间","type":"judge","stem":"进入开口向上的有限空间开展作业的人员必须穿戴全身式安全带，救援三脚架与安全带配套使用。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第77页（应急措施交底）明确指出\"进入开口向上的有限空间开展作业的人员必须穿戴全身式安全带，救援三脚架与安全带配套使用\"。故本题判\"正确\"。\n\n【知识点】\n· 进入开口向上的有限空间须穿戴全身式安全带，救援三脚架与安全带配套使用。\n· 进入井、坑、池等有限空间还须系好安全绳，一端握在监护人手中。\n· 进入大型有限空间前，监护人应获取内部结构/走向图纸并在工前会交底。\n· 应急措施的准备应与工作任务准备同步进行，安全交底应包括应急措施交底。"},{"id":"safety_yxkj_0015","module":"safety","bank":"安全-有限空间","type":"judge","stem":"出现人员在有限空间内窒息、中毒昏迷的现象时，有限空间外部人员可以暂不采取防护措施，立即进入救人。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第79页（自救）明确指出\"有限空间内发生窒息、中毒、触电等人身伤害事故时，工作负责人/监护人/工作组成员应迅速判断造成事故的危害因素，切忌盲目进入有限空间实施救援，采取适当措施予以消除\"。课件练习题（第82-83页）原题即此选项，标注为\"不正确\"。故本题判\"错误\"。\n\n【知识点】\n· 发生窒息、中毒等事故时切忌盲目进入有限空间实施救援。\n· 救援人员必须确保自身安全后方可进入容器开展救护。\n· 自救是安全离开有限空间的主要方式，能使人员以最快时间进入安全区域。\n· 必要时立即呼叫应急救援服务，将伤害信息告知救援人员。"},{"id":"safety_yxkj_0016","module":"safety","bank":"安全-有限空间","type":"multi","stem":"有限空间作业的风险类型包括（　）。","options":["A窒息","B中毒","C爆炸","D噪声超标"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"有限空间课件","explanation":"依据课件《有限空间》：课件第28-36页（3.1有限空间作业的风险）依次列出\"窒息\"\"中毒\"\"爆炸\"\"化学腐蚀\"\"其他（高温、高空坠物、淹没、滑倒坠落、触电）\"等风险类型。窒息、中毒、爆炸为三大主要风险类型，噪声超标未在课件中列为有限空间风险类型。故本题选ABC。\n\n【知识点】\n· 有限空间作业风险类型包括窒息、中毒、爆炸、化学腐蚀等。\n· 窒息：氧含量须保持在19.5%～23.5%，低于此范围将危及生命。\n· 中毒：有毒气体浓度须低于安全限值，数分钟甚至数秒钟可致人死亡。\n· 爆炸：可燃气体浓度须低于爆炸下限的10%（油箱油罐为1%）。"},{"id":"safety_zlbz_0001","module":"safety","bank":"安全-质量保证","type":"single","stem":"按《质量管理体系 基础和术语》（ISO 9000:2015），质量的定义是（　）。","options":["A产品符合设计图纸要求的程度","B服务满足顾客期望的程度","C客体的一组固有特性满足要求的程度","D产品的使用价值与价格之比"],"answer":["C"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.1节\"质量的含义\"明确指出：\"质量的定义：'客体的一组固有特性满足要求的程度。'摘自《质量管理体系-基础和术语》（ISO 9000:2015）\"。故本题选C。选项A\"产品符合设计图纸要求的程度\"和B\"服务满足顾客期望的程度\"仅是质量在特定客体上的表现，D\"产品的使用价值与价格之比\"属经济性范畴，均非ISO 9000对质量的标准定义。\n\n【知识点】\n· 质量的定义是\"客体的一组固有特性满足要求的程度\"（摘自ISO 9000:2015）。\n· 客体是可感知或可想象到的任何事物，可以是活动或过程、产品，也可以是组织、体系、人或上述各项的任何组合。\n· 特性指事物可以区分的特征；要求指明示的、通常隐含的或必须履行的需求或期望。\n· 核电厂输出的产品是电力能源，质量体现在设备管理、物资采购、机组运行控制、设备检修等生产相关各环节符合规定的工作流程及要求。"},{"id":"safety_zlbz_0002","module":"safety","bank":"安全-质量保证","type":"single","stem":"质量控制点中，H点是指（　）。","options":["A现场见证点，QC人员未见证时后续工作可继续进行","B停工待检点，须经QC人员批准放行后才允许继续后续工作","C记录审查点","D文件编制点"],"answer":["B"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.4节\"质量控制点及相关要求\"明确：\"H点（Hold point）：停工待检点。在特定活动实施过程中设置的现场停止点，由QC人员基于在现场的观察或进行独立检查、检验、审核，对该控制点所涉及作业的结果进行验证，QC人员予以批准放行才允许继续进行该控制点以后的工作\"。故本题选B。A\"现场见证点，未见证后续可继续\"是W点的特征，C、D均与H点定义不符。\n\n【知识点】\n· H点为停工待检点，须经QC人员验证并批准放行后才允许继续进行该控制点以后的工作。\n· W点为现场见证点，QC人员未按规定见证时该点之后的工作可继续进行。\n· R点为记录审查点，由QC人员基于原始凭证、检验报告、过程记录等资料独立检查、审核后予以放行。\n· 质量控制点按H、W、R分类，对应现场停工验证、旁站见证、记录审查三种不同的验证方式。"},{"id":"safety_zlbz_0003","module":"safety","bank":"安全-质量保证","type":"single","stem":"质量控制点中，W点是指（　）。","options":["A停工待检点，须经QC人员批准放行","B记录审查点，由QC人员审查资料后放行","C文件编制点","D现场见证点，QC人员未按规定见证时该点之后的工作可继续进行"],"answer":["D"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.4节\"质量控制点及相关要求\"明确：\"W点（Witness point）：现场见证点。在特定活动实施过程中设置的现场见证点，由QC人员基于在现场的观察或进行独立检查、检验、审核，对该控制点所涉及作业的过程进行旁站见证，如果QC人员未按规定开展此控制点的见证，此控制点之后的工作可继续进行\"。故本题选D。A是H点特征，B是R点特征。\n\n【知识点】\n· W点为现场见证点，QC人员对该控制点所涉及作业的过程进行旁站见证。\n· 若QC人员未按规定开展W点的见证，此控制点之后的工作可继续进行。\n· H点为停工待检点，须经QC人员批准放行后才允许继续后续工作。\n· R点为记录审查点，由QC人员基于原始凭证、检验报告、过程记录等资料进行独立检查、检验、审核后放行。"},{"id":"safety_zlbz_0004","module":"safety","bank":"安全-质量保证","type":"single","stem":"由QC人员基于原始凭证、检验报告、过程记录等资料进行独立检查、审核后予以放行的质量控制点是（　）。","options":["AW点（现场见证点）","BH点（停工待检点）","CR点（记录审查点）"],"answer":["C"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.4节\"质量控制点及相关要求\"明确：\"R点（Review point）：记录审查点。在特定活动实施过程中设置的见证点，由QC人员基于对原始凭证、检验报告、过程记录等资料进行独立检查、检验、审核，对该控制点所涉及作业予以放行\"。题干描述与R点完全一致，故本题选C。\n\n【知识点】\n· R点为记录审查点，由QC人员基于原始凭证、检验报告、过程记录等资料独立检查、检验、审核后予以放行。\n· W点为现场见证点，QC人员对作业过程进行旁站见证。\n· H点为停工待检点，QC人员批准放行后才允许继续该点以后的工作。\n· H、W、R三类控制点验证方式不同：现场停工验证、旁站见证、记录审查，须准确区分。"},{"id":"safety_zlbz_0005","module":"safety","bank":"安全-质量保证","type":"single","stem":"PDCA循环中，字母A代表（　）。","options":["A计划","B实施","C检查","D处理（处置、总结）"],"answer":["D"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.5节\"PDCA循环\"明确：\"P----计划 D----实施/执行 C----检查 A----处理（处置、总结）\"。故本题选D。PDCA循环又叫质量环，是管理学中的通用模型。\n\n【知识点】\n· PDCA循环中P为计划、D为实施/执行、C为检查、A为处理（处置、总结）。\n· PDCA循环又叫质量环，是质量管理的基本工作程序、管理学中的通用模型。\n· PDCA最早由休哈特于1930年构想，后由戴明博士于1950年再度挖掘并广泛运用于持续改善产品质量。\n· PDCA特点：循环前进、阶梯上升；大环套小环。"},{"id":"safety_zlbz_0006","module":"safety","bank":"安全-质量保证","type":"single","stem":"影响质量形成的六大因素可概括为（　）。","options":["A人、机、料、法、环、安","B人、机、料、法、环、测","C人、财、物、产、供、销","D人、机、电、料、法、环"],"answer":["B"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.6节\"影响质量的六大因素\"明确：\"影响质量形成的主要因素可概括为6个方面：人、机、料、法、环、测\"。故本题选B。选项A中的\"安\"、C中的\"财、物、产、供、销\"、D中的\"电\"均不在六大因素之列。\n\n【知识点】\n· 影响质量形成的六大因素可概括为：人、机、料、法、环、测。\n· 人：生产现场的所有人员，应经过适当培训、具备完成任务所需的知识和技能并得到授权后才能工作，责任心是关键。\n· 机：设备、工器具应经适当试验或评定证明功能满足要求，计量器具应处于标定的有效期内。\n· 料：备件和材料必须经检验并有出厂质量合格证书；法：工作必须按批准的规范、标准、程序要求进行；环：保持清洁度、防异物、适宜温湿度和足够照明；测：合格的测量工具和合适的测量方法。"},{"id":"safety_zlbz_0007","module":"safety","bank":"安全-质量保证","type":"single","stem":"核电厂质量保证大纲适用于（　）。","options":["A核电厂各阶段（选址、设计与建造、调试、运行、退役）所有与安全质量有关的活动","B仅设计与建造阶段的安全质量活动","C仅运行和维修阶段的安全质量活动","D仅大修期间的物项控制活动"],"answer":["A"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件3.1节\"核电厂质量保证大纲\"明确：\"质保大纲适用范围：适用于核电厂各阶段（选址、设计与建造、调试、运行、退役）所有与安全质量有关的活动。包括：设计、采购、装卸、运输、贮存、检查、试验、运行、维修、变更和改进\"。故本题选A。B、C、D选项均只涵盖部分阶段或部分活动，与课件不符。\n\n【知识点】\n· 质保大纲适用于核电厂各阶段（选址、设计与建造、调试、运行、退役）所有与安全质量有关的活动。\n· 质保大纲是核电厂的纲领性文件，表达了核电厂管理层对国家核安全局（NNSA）的承诺，增强公众对核安全的信心。\n· 广义质保大纲指为保证质量而规定的和完成的全部工作，包括管理性和技术性两种基本类型；狭义质保大纲指大纲概述（质量手册或质保手册）。\n· 核电厂与核安全、质量相关的活动都需要在质量保证大纲的框架内开展。"},{"id":"safety_zlbz_0008","module":"safety","bank":"安全-质量保证","type":"single","stem":"《核电厂质量保证安全规定》（HAF003）主要适用于（　）。","options":["A国家核安全局","B核设施营运单位，包括核安全相关的物项和服务承包商","C核电厂所在地方政府","D各行各业"],"answer":["B"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件2.2节\"《核电厂质量保证安全规定》（HAF003）简介\"明确：\"HAF003主要适用于核设施营运单位，包括核安全相关的物项和服务承包商\"。故本题选B。A\"国家核安全局\"是监管者，C\"地方政府\"、D\"各行各业\"均与课件不符。\n\n【知识点】\n· HAF003《核电厂质量保证安全规定》主要适用于核设施营运单位，包括核安全相关的物项和服务承包商。\n· HAF003的目的是为保证核设施的安全，要求营运单位在各个阶段必须制定和有效实施质量保证大纲。\n· HAF003具有强制性，其实施受到国家核安全局的监督。\n· HAF003共十三个章节，另有HAD003系列十个导则给出实施HAF003要求的具体方法和方案。"},{"id":"safety_zlbz_0009","module":"safety","bank":"安全-质量保证","type":"single","stem":"根据核安全法规及档案管理相关要求，质量保证记录的保存期限分为（　）。","options":["A永久和定期两种","B长期和短期两种","C十年和三十年两种","D仅永久一种"],"answer":["A"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件4.2节\"凡事有据可查\"明确：\"记录产生后有一定的保存期限，根据核安全法规及档案管理相关要求，分为永久和定期两种期限。永久记录：指在电站整个寿期内都具有保存价值的记录（一般指该物项的使用寿期）。定期记录：又称非永久记录，指反映一般工作活动，在一定时间内对本企业各项工作有参考利用价值的记录\"。故本题选A。\n\n【知识点】\n· 质量保证记录的保存期限分为永久和定期两种。\n· 永久记录指在电站整个寿期内都具有保存价值的记录（一般指该物项的使用寿期）。\n· 定期记录又称非永久记录，指反映一般工作活动、在一定时间内对本企业各项工作有参考利用价值的记录。\n· 记录是评价质量保证工作有效性的依据，应规范、真实、完整、有效，并及时整理、归档、妥善贮存保管。"},{"id":"safety_zlbz_0010","module":"safety","bank":"安全-质量保证","type":"single","stem":"下列不属于核电厂质保“四个凡事”内容的是（　）。","options":["A凡事有章可循","B凡事有人监督","C凡事有人验证","D凡事有据可查"],"answer":["B"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件4.2节\"四个凡事\"明确核电厂营运单位承诺\"在工作的各个环节都做到：凡事有章可循、凡事有人负责、凡事有人验证、凡事有据可查\"。四个凡事中并无\"凡事有人监督\"，故本题选B。\n\n【知识点】\n· 四个凡事：凡事有章可循、凡事有人负责、凡事有人验证、凡事有据可查。\n· 凡事有章可循：建立完整的程序文件体系，程序/规程要求清晰可操作，一切按程序实施，程序变更受控。\n· 凡事有人负责：组织机构职责分工明确、各类人员应有资格并经授权、发挥领导作用、人人均是质量最后一道防线。\n· 凡事有据可查：记录应规范、真实、完整、有效，及时整理归档、妥善贮存保管，并按规定要求处理。"},{"id":"safety_zlbz_0011","module":"safety","bank":"安全-质量保证","type":"judge","stem":"整洁的工作环境对产品的质量有正面促进作用。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.6节\"环：环境\"明确：\"工作环境对工作质量也有影响，应有保持零部件、设备和环境清洁度的措施，必要的隔离措施，防止异物掉入设备、管道和容器的措施，适宜的温湿度、足够的照明措施等\"。课件练习题中该判断题答案即为\"正确（√）\"。故本题判\"正确\"。\n\n【知识点】\n· 工作环境对工作质量有影响，整洁的工作环境对产品质量有正面促进作用。\n· 应有保持零部件、设备和环境清洁度的措施。\n· 应有必要的隔离措施，防止异物掉入设备、管道和容器。\n· 应具备适宜的温湿度、足够的照明等措施，如焊接、防腐等作业对湿度有特定要求。"},{"id":"safety_zlbz_0012","module":"safety","bank":"安全-质量保证","type":"judge","stem":"质量控制点中的“H点”含义是现场见证点，如果QC人员未按规定开展此控制点的见证，此控制点之后的工作可继续进行。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件1.4节明确：\"H点（Hold point）：停工待检点……QC人员予以批准放行才允许继续进行该控制点以后的工作\"；而\"如果QC人员未按规定开展此控制点的见证，此控制点之后的工作可继续进行\"是W点（现场见证点）的特征。题干将H点误称为\"现场见证点\"，张冠李戴，课件练习题中该题答案即为\"错误（×）\"。故本题判\"错误\"。\n\n【知识点】\n· H点为停工待检点，须经QC人员批准放行后才允许继续进行该控制点以后的工作。\n· W点为现场见证点，QC人员未按规定见证时该点之后的工作可继续进行。\n· H、W、R三类控制点见证要求不同，须准确区分。\n· 停工待检点必须由独立验证人员书面放行后，工作负责人才可安排进行该控制点以后的工作。"},{"id":"safety_zlbz_0013","module":"safety","bank":"安全-质量保证","type":"judge","stem":"《核电厂质量保证安全规定》（HAF003）是非强制性文件，工作中遇到与该法规不一致的情况，可以根据实际需求进行变通。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件2.2节\"《核电厂质量保证安全规定》（HAF003）简介\"明确：\"HAF003具有强制性，其实施受到国家核安全局的监督\"。题干称HAF003是\"非强制性文件\"且\"可根据实际需求进行变通\"，与课件矛盾，课件练习题中该判断题答案即为\"错误（×）\"。故本题判\"错误\"。\n\n【知识点】\n· HAF003《核电厂质量保证安全规定》具有强制性。\n· HAF003的实施受到国家核安全局（NNSA）的监督。\n· HAF003主要适用于核设施营运单位，包括核安全相关的物项和服务承包商。\n· 我国现行核质保法规和导则等效采用IAEA 1988年版核质保法规（50-C/SG-QA），共有1个法规、10个导则。"},{"id":"safety_zlbz_0014","module":"safety","bank":"安全-质量保证","type":"judge","stem":"核电厂的技术性工作必须满足质量保证大纲的要求，管理性工作可以和质量保证大纲不一样。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件3.1节\"核电厂质量保证大纲\"明确：广义质保大纲\"全部工作包括两种基本类型：管理性的和技术性的\"，且\"核电厂与核安全、质量相关的活动都需要在质量保证大纲的框架内开展\"。题干称\"管理性工作可以和质量保证大纲不一样\"，与课件矛盾，课件练习题中该判断题答案即为\"错误（×）\"。故本题判\"错误\"。\n\n【知识点】\n· 质保大纲广义上指为保证质量而规定的和完成的全部工作，包括管理性的和技术性的两种基本类型。\n· 核电厂与核安全、质量相关的活动都需要在质量保证大纲的框架内开展。\n· 狭义的质量保证大纲概述是纲领性文件，主要包括质量保证政策声明、单位的目标和任务、组织结构和职责分工等内容，又称质量手册或质保手册。\n· 质保大纲适用于核电厂各阶段（选址、设计与建造、调试、运行、退役）所有与安全质量有关的活动。"},{"id":"safety_zlbz_0015","module":"safety","bank":"安全-质量保证","type":"judge","stem":"检修过程中，QC工程师有权变更验收标准/准则，以决定所设定控制点是否可放行。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件4.2节\"凡事有人验证\"明确：\"验证应有标准，标准必须明确，标准的变更应受控\"，且\"执行独立验证职能的人员，应独立于所验证的工作\"。QC工程师作为验证方应依据明确标准判定放行，无权擅自变更验收标准/准则，标准变更应通过受控程序进行。课件练习题中该判断题答案即为\"错误（×）\"。故本题判\"错误\"。\n\n【知识点】\n· 验证应有标准，标准必须明确，标准的变更应受控。\n· 执行独立验证职能的人员应独立于所验证的工作。\n· 质量计划H点、W点必须工作完成后并经验证合格后，才能签字放行。\n· 验证检修结果是否合格必须要有标准且标准必须明确，工作负责人应在工作包准备阶段认真审查规程的适用性。"},{"id":"safety_zlbz_0016","module":"safety","bank":"安全-质量保证","type":"judge","stem":"归档的记录应使用碳素/蓝黑墨水或签字笔书写，不得使用铅笔、圆珠笔。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件4.2节\"凡事有据可查\"明确记录的材料要求：\"归档的记录应为原件，要求字迹工整、图样清晰，纸质优良，并须使用碳素/蓝黑墨水或签字笔书写，不得使用铅笔、圆珠笔或红色、纯蓝墨水等不符合存档要求的书写材料\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 归档的记录须使用碳素/蓝黑墨水或签字笔书写。\n· 不得使用铅笔、圆珠笔或红色、纯蓝墨水等不符合存档要求的书写材料。\n· 记录用纸一般为A4纸，归档记录应为原件，要求字迹工整、图样清晰、纸质优良。\n· 记录必须完整、系统、规范，没有空白栏，须有记录时间、记录人签字；除签字外还必须有相应的签署日期。"},{"id":"safety_zlbz_0017","module":"safety","bank":"安全-质量保证","type":"judge","stem":"不符合项是指性能、文件或程序方面的缺陷，因而使某一物项的质量变得不可接受或不能确定。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件4.2节\"凡事有人验证\"明确：\"不符合项是性能、文件或程序方面的缺陷，因而使某一物项的质量变得不可接受或不能确定\"。题干表述与课件原文一致，故本题判\"正确\"。\n\n【知识点】\n· 不符合项是性能、文件或程序方面的缺陷，因而使某一物项的质量变得不可接受或不能确定。\n· 生产运行中发现的质量缺陷经工作票或QDR处理后仍不能满足原设计要求或相关验收准则的，应作为NCR进行管理。\n· 供应商制造过程中发生的缺陷导致物项质量不可接受或不能确定的，应作为采购不符合项进行管理。\n· 发生不符合项时按程序报告（NCR），并做好标识或隔离。"},{"id":"safety_zlbz_0018","module":"safety","bank":"安全-质量保证","type":"multi","stem":"核电质量保证体系的作用包括（　）。","options":["A保证核电厂一切安全质量有关的活动能够严格遵守国家核安全局（NNSA）颁布的核安全法规及导则的要求","B可以向核电厂的股东以及社会公众提供信心，使他们相信核电厂能够安全、可靠地运行","C通过质量管理，保证核电厂各项作业活动的质量，从而提高核电厂整体业绩","D降低电厂运行成本"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"质量保证课件","explanation":"依据课件《保护区准入·质量保证》：课件3.2节\"核电质保体系\"明确核电质量保证体系的作用包括：保证核电厂一切安全质量有关的活动能够严格遵守国家核安全局（NNSA）颁布的核安全法规及导则的要求；可以向核电厂的股东以及社会公众提供信心，使他们相信核电厂能够安全、可靠地运行；通过质量管理，可以保证核电厂各项作业活动的质量，从而提高核电厂整体业绩。课件练习题中该题答案即为\"ABC\"，\"降低电厂运行成本\"不在质保体系作用之列，故本题选ABC。\n\n【知识点】\n· 质保体系作用一：保证安全质量相关活动严格遵守NNSA颁布的核安全法规及导则的要求。\n· 质保体系作用二：向核电厂的股东以及社会公众提供信心，使其相信核电厂能够安全、可靠地运行。\n· 质保体系作用三：通过质量管理保证各项作业活动的质量，提高核电厂整体业绩。\n· 核电厂质量管理的核心是建立一套书面化的质量保证体系，包括组织机构、文件程序体系、资源三个方面，对过程和要素进行有效控制。"}],"buildTime":"2026-08-31 22:45"};

/* ================= 常量与工具 ================= */

const DEFAULT_SCORE = {single:2, multi:3, judge:1};
const LETTERS = "ABCDEF";
const bankKey = m=>m;

const questions = DATA.questions;

questions.forEach(q=>{
  const k = bankKey(q.module);
  (BANKS[k] = BANKS[k] || {module:q.module, bank:DATA.modules[q.module]||q.module, list:[]}).list.push(q);

function $(s,p){return (p||document).querySelector(s);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

  return q.answer.map(l=>l+"．"+q.options[LETTERS.indexOf(l)]).join("　");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600);}

/* ================= 持久化状态 ================= */
const SKEY = "tiku_v1";
let S;
function loadState(){
  try{S=JSON.parse(localStorage.getItem(SKEY)||"{}");}
  catch(e){S={};}
  S.done=S.done||{};   // qid -> {c:对次数, w:错次数, t:最后时间}
  S.wrong=S.wrong||{}; // qid -> 1
  S.fav=S.fav||{};     // qid -> 1
  S.slay=S.slay||{};   // qid -> 1（斩杀：非常熟，不进随机/顺序/专项练习池，可在收藏页恢复）
  S.seq=S.seq||{};     // bankKey -> 已练到的下标
  S.daily=S.daily||{}; // "YYYY-MM-DD" -> 题数
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function bumpDaily(){const d=today();S.daily[d]=(S.daily[d]||0)+1;save();}

/* ================= 视图路由 ================= */
let stack = [];
function go(view, noPush){
  if(!noPush && curView) stack.push(curView);
  curView = view;
  render();
}
let curView = null;
function back(){
  if(stack.length){curView=stack.pop();render();}
  else go({name:"home"},true);
}

/* ================= 练习视图 ================= */
function buildPool(bankK, srcFilter, typeFilter, excludeSlay){
  const b=BANKS[bankK];let list=b.list;
  if(excludeSlay)list=list.filter(q=>!S.slay[q.id]); // 斩杀题不进练习池（模拟考试除外）
  if(srcFilter && srcFilter!=="all"){
    const allow=srcFilter.split("+");
    list=list.filter(q=>allow.includes(q.source));
  }
  if(typeFilter&&typeFilter.length)list=list.filter(q=>typeFilter.includes(q.type));
  return list;
}
function newSession(v){
  let list;
  if(v.mode==="wrong")list=Object.keys(S.wrong).filter(id=>QMAP[id]);
  else if(v.mode==="fav")list=Object.keys(S.fav).filter(id=>QMAP[id]);
  else{
    list=buildPool(v.bank,v.src,v.types,true);
    if(v.mode==="rand")list=shuffle(list);
  }
  return {list:list.map(q=>q.id), idx:0, mode:v.mode, bank:v.bank,
    src:v.src||"all", types:v.types||null, picked:{}, judged:{},
    seqPos: v.mode==="seq" ? (S.seq[bankKeyOf(v)]||0) : 0};
}
function bankKeyOf(v){return v.bank || v.mode;}
function startSession(v){
  const s=newSession(v);
  if(!s.list.length){toast("该筛选条件下没有题目");return;}
  if(s.mode==="seq"&&s.seqPos>=s.list.length)s.seqPos=0;
  s.idx=s.seqPos||0;
  go({name:"practice",s});
}

function practiceHeader(s){
  const idx=s.idx+1,total=s.list.length;
  const answered=Object.keys(s.judged).length;
  const pct=total?Math.round(answered/total*100):0;
  return `<div class="pbar-wrap"><div class="ptxt"><span>${s.mode==="recite"?"背题模式":s.mode==="wrong"?"错题重练":s.mode==="fav"?"收藏练习":s.mode==="rand"?"随机练习":"顺序练习"} · ${answered>idx?answered:idx}/${total}</span><span>${pct}%</span></div>
  <div class="pbar"><div style="width:${pct}%"></div></div></div>`;
}

function renderQ(s,q){
  const judged = q.id in s.judged ? s.judged[q.id] : undefined;
  const picked = s.picked[q.id]||[];
  let h=`<div class="qhead">
    <span class="tag ${SRC_CLASS[q.source]}">${SRC_NAME[q.source]}</span>
    <span class="tag t-${q.type}">${TYPE_NAME[q.type]}</span>
    <span class="qno">📚 ${esc(q.bank)}</span></div>`;
  h+=`<div class="stem">${esc(q.stem)}</div>`;
  if(q.type==="judge"){
    const right=q.answer[0];
    const p1=picked.includes("正确"),p2=picked.includes("错误");
    let c1="",c2="";
    if(judged!==undefined){
      c1 = right==="正确"?"right":(p1?"wrongpick":"");
      c2 = right==="错误"?"right":(p2?"wrongpick":"");
    }
    h+=`<div class="judge-row">
      <button class="judge-btn ${c1}" data-j="正确">✓ 正确</button>
      <button class="judge-btn ${c2}" data-j="错误">✗ 错误</button></div>`;
  }else{
    h+=`<div class="opts">`+q.options.map((o,i)=>{
      const L=LETTERS[i];let cls="";
      if(judged!==undefined){
        if(q.answer.includes(L))cls="right";
        else if(picked.includes(L))cls="wrongpick";
        else cls="dim";
      }else if(picked.includes(L))cls="picked";
      return `<button class="opt ${cls}" data-o="${L}"><span class="ol">${L}</span><span>${esc(o)}</span></button>`;
    }).join("")+`</div>`;
    if(q.type==="multi"&&!judged)
      h+=`<div class="confirm-bar"><button class="big-btn ghost" id="confirm-multi" ${picked.length?"":"disabled"}>确认（已选 ${picked.length} 项）</button></div>`;
  }
  if(judged!==undefined||s.mode==="recite"){
    const ok = s.mode==="recite"?null:judged;
    if(ok!==null)
      h+=`<div class="feedback ${ok?"ok":"bad"}">${ok?"<b>回答正确</b>":"<b>回答错误</b>"}　正确答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    else
      h+=`<div class="feedback ok">答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    if(q.type!=="judge"&&q.options)h+=`<div class="mut" style="margin-top:6px;font-size:13.5px;">${esc(ansText(q))}</div>`;
    if(q.explanation){
      const offi = q.source==="ppt-notes";
      h+=`<div class="expl"><div class="elabel">📖 ${offi?'<span class="tag s-ppt-notes" style="font-size:10px;">官方讲解</span>':'<span class="tag s-generated" style="font-size:10px;">AI 解析 · 仅供参考</span>'}</div>${esc(q.explanation)}</div>`;
    }
    if(q.source!=="official")h+=`<div class="mut" style="margin-top:6px;font-size:12px;">依据课件：${esc(q.origin||"")}</div>`;
    // 斩杀（功能4）：答对且很熟 → 斩杀，不再进随机/顺序/专项练习池
    if(judged===true&&s.mode!=="recite"){
      const slayed=!!S.slay[q.id];
      h+=`<div style="margin-top:12px;">${
        slayed
          ?`<button class="big-btn ghost" id="btn-unslay">↩ 已斩杀 · 点击恢复（重新进入练习池）</button>`
          :`<button class="big-btn" id="btn-slay" style="background:var(--warn);">⚔️ 斩杀（很熟了，不再随机出现）</button>`
      }</div>`;
    }
  }
  return h;
}

function vPractice(v){
