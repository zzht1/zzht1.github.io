"D提高蒸汽初压"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第24页（1.5.4节）明确指出“再热循环的根本目的是降低末级叶片湿度，同时兼顾考虑热效率”。选项A“降低汽轮机末级叶片湿度”与课件表述一致，故正确。选项B提高给水温度、C减小凝汽器换热面积、D提高蒸汽初压均非再热循环的根本目的。\n\n【知识点】\n· 再热循环指蒸汽在汽轮机中膨胀做功到一定压力后，回到锅炉/再热器进行第二次加热，再回到汽轮机继续膨胀做功\n· 再热循环的根本目的是降低末级叶片湿度，同时兼顾热效率\n· 核电厂朗肯循环中也设有中间汽水分离再热器（C-D过程）"},{"id":"basics_thsw_0005","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"发电厂实践表明，采用回热循环（设置给水加热器）可使热经济性提高（　）。","options":["10%～15%","1%～2%","30%～40%","50%以上"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第25页（1.5.5节）明确指出“发电厂的实践表明，采用加热循环可使热经济性提高10% ~ 15%”。选项A“10%％15%”与课件数据一致，故正确。其他选项的数据均与课件不符。\n\n【知识点】\n· 回热循环通过设置给水加热器，对返回锅炉/蒸汽发生器的给水进行加热\n· 采用回热循环可使电厂热经济性提高约10%％15%\n· 回热循环消除了朗肯循环在较低温度下吸热的不利影响，减少了向凝汽器的放热损失，减小了不可逆损失"},{"id":"basics_thsw_0006","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"压水堆采用三区装料、将最高浓缩度燃料布置在最外区的目的是（　）。","options":["A展平径向功率分布","B提高天然铀利用率","C增大冷却剂流量","D降低环路压降"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第51页（4.1节）明确指出“沿堆芯的径向分三区配置不同浓缩度燃料，具有最高浓缩度的燃料元件装在最外区，其他浓缩度的燃料元件装在内区，这样做的目的是展平径向功率分布，避免中心区出现较高的功率峰值”。选项A“展平径向功率分布”与课件一致，故正确。\n\n【知识点】\n· 压水堆采用三区装料，沿堆芯径向分三区配置不同浓缩度燃料\n· 最高浓缩度燃料布置在最外区，目的是展平径向功率分布，避免中心区功率峰值\n· 控制棒的插入也会影响径向和轴向功率分布"},{"id":"basics_thsw_0007","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"下列措施中，能使临界热流密度qDNB增大的是（　）。","options":["A提高质量流速","B降低进口水的欠热度","C降低工作压力","D降低流速"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第55页（4.2节）明确列出影响qDNB的因素：“质量流速。流速大，流体的扰动强，加热面上难以形成稳定的汽膜，因而使qDNB增大；通道进口处水的欠热度。欠热度越大qDNB越大；工作压力。压力增加会使饱和温度上升，因而两相流中的含汽率减小，这使qDNB增加”。选项A“提高质量流速”使qDNB增大，故正确。选项B“降低进口水的欠热度”会使qDNB减小（欠热度越大qDNB才越大）；选项C“降低工作压力”会使qDNB减小（压力增加才使qDNB增加）；选项D“降低流速”同样使qDNB减小。\n\n【知识点】\n· 临界热流密度qDNB是发生沸腾危机时的热流密度\n· 使qDNB增大的因素：流速大、欠热度大、压力增加、表面粗糙度大\n· 沸腾危机包括偏离泡核沸腾（DNB）和干涸（Dryout）两种类型"},{"id":"basics_thsw_0008","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"自然循环是依靠闭合回路内热段（上行段）和冷段（下行段）流体的（　）所产生的驱动压头来实现的。","options":["A密度差","B压力差","C速度差","D主泵压头"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第62页（5.4节）明确指出“自然循环是指在闭合回路内依靠热段（上行段）和冷段（下行段）的流体密度差所产生的驱动压头来实现的流动循环”。选项A“密度差”与课件一致，故正确。自然循环不依赖主泵压头或压力差，而是靠密度差驱动。\n\n【知识点】\n· 自然循环依靠闭合回路内热段和冷段流体的密度差产生驱动压头\n· 自然循环的必要条件：热源与热阱之间存在高度差、流体存在密度差、系统在重力场内\n· 自然循环可用于输出停堆后的衰变热"},{"id":"basics_thsw_0009","module":"basics","bank":"核电基础-热工水力学","type":"single","stem":"下列避免泵汽蚀的方法中，正确的是（　）。","options":["A装设前置泵，增加泵入口压力","B提高流体温度","C增大泵的转速","D减小泵入口管径"],"answer":["A"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第66页（5.5节）明确列出避免汽蚀的方法：“装设前置泵，以增加入口处压力；降低流体温度，以增加汽蚀余量；减小泵的转速，以减小泵的出口流量”。选项A“装设前置泵，增加泵入口压力”与课件一致，故正确。选项B“提高流体温度”与课件“降低流体温度”相反；选项C“增大泵的转速”与课件“减小泵的转速”相反；选项D“减小泵入口管径”会增加入口阻力，不利于防汽蚀。\n\n【知识点】\n· 汽蚀是液体局部压力降至汽化压力时汽化形成汽泡，汽泡流至高压区破裂产生冲击力的现象\n· 避免汽蚀的三种方法：装设前置泵增加入口压力、降低流体温度、减小泵转速\n· 汽蚀会造成材料侵蚀和设备损坏"},{"id":"basics_thsw_0010","module":"basics","bank":"核电基础-热工水力学","type":"judge","stem":"液体的粘性随温度升高而降低，气体的粘性随温度升高而增加。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第31页（2.1节）明确指出“液体的粘性随温度升高而降低，气体粘性随气体温度升高而增加”。题目表述与课件完全一致，故判断为正确。课件还解释了机理：液体粘性主要来源于分子间作用力，温度升高密度减小、作用力减小故粘度降低；气体粘性主要来源于分子间动量交换，温度升高热运动加剧故粘度增加。\n\n【知识点】\n· 液体粘性随温度升高而降低，气体粘性随温度升高而增加\n· 液体粘性来源于分子间作用力，气体粘性来源于分子间动量交换\n· 影响流体粘度的因素主要有压力和温度，其中温度影响较大"},{"id":"basics_thsw_0011","module":"basics","bank":"核电基础-热工水力学","type":"judge","stem":"热辐射可以在真空中传播，而导热和对流换热只能在有物质存在的条件下才能实现。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第48页（3.1.5节）明确指出“热辐射可以在真空中传播，而导热和对流换热这两种热传递方式只能在有物质存在的条件下才能实现，这是第一点区别”。题目表述与课件完全一致，故判断为正确。\n\n【知识点】\n· 热辐射依靠电磁波传递能量，可以在真空中传播\n· 导热和对流换热必须有物质介质才能实现\n· 辐射换热不仅产生能量转移，还伴随能量形式转化（热能→辐射能→热能）"},{"id":"basics_thsw_0012","module":"basics","bank":"核电基础-热工水力学","type":"judge","stem":"稳态热工设计准则要求燃料元件外表面不允许发生沸腾临界，燃料元件芯块最高温度低于熔化温度。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第56页（4.3节）明确列出稳态热工设计准则：“燃料元件外表面不允许发生沸腾临界；燃料元件芯块最高温度低于熔化温度；不发生流动不稳定性”。题目表述包含了前两条准则，与课件一致，故判断为正确。\n\n【知识点】\n· 稳态热工设计准则要求燃料元件外表面不允许发生沸腾临界\n· 燃料元件芯块最高温度须低于熔化温度\n· 同时要求不发生流动不稳定性"},{"id":"basics_thsw_0013","module":"basics","bank":"核电基础-热工水力学","type":"judge","stem":"伯努利方程适用于可压缩流体的任何流动状态。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第41页（2.3节）明确列出伯努利方程的适用条件：“稳定流动；所取的两个过流断面必须是缓变流的断面；满足连续性方程；流体必须是不可压缩流体；作用在流体上的质量力只有重力”。题目说“适用于可压缩流体的任何流动状态”与课件“流体必须是不可压缩流体”和“稳定流动”等条件矛盾，故判断为错误。\n\n【知识点】\n· 伯努利方程适用于稳定流动、不可压缩流体\n· 还要求过流断面为缓变流断面、满足连续性方程、质量力只有重力\n· 伯努利方程是机械能守恒形式，不能用于可压缩流体或非稳定流动"},{"id":"basics_thsw_0014","module":"basics","bank":"核电基础-热工水力学","type":"judge","stem":"沸腾危机是指管路工作状态突然改变，引起管内液体压力大幅度波动的现象。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第54页（4.2节）明确指出“沸腾危机：由于传热机理的变化引起传热系数陡降，导致传热壁面温度骤然升高的现象称为沸腾危机”。而课件第64页（5.5节）描述水锤为“在有压管路中，由于管路工作状态的突然改变，使流体速度突然改变，同时引起管路内液体压力大幅度波动的现象”。题目所述“管路工作状态突然改变，引起管内液体压力大幅度波动”是水锤的定义，而非沸腾危机，故判断为错误。\n\n【知识点】\n· 沸腾危机是传热系数陡降、壁面温度骤然升高的现象，包括DNB和干涸两种\n· 水锤是管路工作状态突然改变引起液体压力大幅度波动的现象\n· 发生沸腾危机时的热流密度称为临界热流密度qDNB"},{"id":"basics_thsw_0015","module":"basics","bank":"核电基础-热工水力学","type":"judge","stem":"单相冷却剂在通道内流动的压降包括提升压降、加速压降、摩擦压降和形阻压降。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第60页（5.2节）明确列出单相冷却剂的流动压降包括四类：“提升压降（由位能改变引起的压力变化）、加速压降（因流体速度变化引起的压力变化）、摩擦压降（流体沿等截面直通道流动时由沿程摩擦阻力引起的压力损失）、形阻压降（流体流过急剧变化固体边界时产生的集中压力损失）”。题目表述与课件一致，故判断为正确。\n\n【知识点】\n· 单相冷却剂通道内流动压降包括提升压降、加速压降、摩擦压降和形阻压降四类\n· 提升压降由位能改变引起，加速压降由流体速度变化引起\n· 形阻压降是流体流过截面突变处（弯管、阀门、孔板等）产生的集中压力损失"},{"id":"basics_thsw_0016","module":"basics","bank":"核电基础-热工水力学","type":"multi","stem":"影响自然循环能力的因素包括（　）。","options":["A冷源与热源的温差","B冷源与热源的位差（高度差）","C管道的流阻","D主泵的转速"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"热工水力学课件","explanation":"依据课件《热工水力学基础》第63页（5.4节）明确列出影响自然循环能力的因素：“冷源与热源温差，温差越大，自然循环能力越强；冷源与热源位差（高度差），位差越大，自然循环能力越强；管道的流阻，流阻越大，自然循环能力越小；冷却剂中含汽率的影响（含汽率的作用有正有负）”。选项A温差、B位差、C流阻均属课件所列因素，故ABC正确。选项D主泵转速与自然循环无关，自然循环不需要主泵驱动，故排除。\n\n【知识点】\n· 影响自然循环能力的因素：冷源与热源温差、位差（高度差）、管道流阻、冷却剂含汽率\n· 温差越大、位差越大，自然循环能力越强；流阻越大，自然循环能力越小\n· 自然循环不依赖主泵，靠热段与冷段流体密度差产生驱动压头"},{"id":"basics_tyjx_0001","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"依靠介质（液体、气体）本身的能力而自行动作的阀门属于（　）","options":["驱动型阀门","自动型阀门","手动阀门","调节型阀门"],"answer":["B"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在阀门分类中明确指出，\"依靠介质（液体、气体）本身的能力而自行动作的阀门\"定义为自动型阀门，包括止回阀、安全阀、减压阀、疏水阀、自力式调节阀等。与之相对，驱动型阀门需要借助手动、电动、气动、液动等执行机构来操纵其动作。因此依靠介质本身能力自行动作的阀门属于自动型阀门，选B。\n\n【知识点】\n· 自动型阀门依靠介质本身能力自行动作，包括止回阀、安全阀、减压阀、疏水阀等\n· 驱动型阀门需借助外力（手动、电动、气动、液动）操纵，包括闸阀、截止阀、蝶阀等\n· 阀门按用途可分为截断、调节流量、超压保护等类别"},{"id":"basics_tyjx_0002","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"一般情况下，截止阀采用的安装方式是（　）","options":["低进高出","高进低出","左进右出","无方向要求"],"answer":["A"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在截止阀原理部分明确指出，\"一般情况下，截止阀采用低进高出的安装方式，即介质从截止阀底部进入阀腔，经90度转弯后从出口流出\"。同时在选用及安装要求中强调\"选用及安装时要注意进出口方向，一般情况下按低进高出原则，高压截止阀及大口径截止阀可按高进低出安装\"。因此截止阀一般采用低进高出，选A。\n\n【知识点】\n· 截止阀一般按\"低进高出\"原则安装，介质从阀瓣下方进入、上方流出\n· 高压截止阀及大口径截止阀可按\"高进低出\"安装\n· 截止阀具有可靠的切断功能，阀杆行程短，也适用于流量调节或节流"},{"id":"basics_tyjx_0003","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"截止阀中流阻最小的结构形式是（　）","options":["直通式","角式","直流式（Y型）","针形"],"answer":["C"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在截止阀类型和结构中指出，直流式又称Y形截止阀，\"阀杆与通道成一定角度，使阀座密封面与进出口通道成一定角度，使流体几乎成直线流过阀门，是截止阀流阻最小的结构形式\"。截止阀按流通形式分为直通式、角式、直流式、三通式，其中直通式因介质在阀内90度转弯流阻较大。因此截止阀中流阻最小的结构形式是直流式（Y型），选C。\n\n【知识点】\n· 直流式（Y型）截止阀流阻最小，流体几乎成直线流过阀门\n· 截止阀按流通形式分为直通式、角式、直流式、三通式\n· 直通式截止阀介质在阀内90度转弯，流阻较大"},{"id":"basics_tyjx_0004","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"关于闸阀的用途，正确的说法是（　）","options":["用于全开全关切断管路介质，不作节流调节","用于调节流量","用于频繁启闭","用于防止倒流"],"answer":["A"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在闸阀工作原理中明确指出，\"闸板的运动方向与流体方向相垂直，闸阀只能作全开和全关，一般不作调节和节流使用\"。闸阀关闭时在介质压力作用下形成密封比压，具备自密封特点，适用于高压场合。因此闸阀用于全开全关切断管路介质，不作节流调节，选A。\n\n【知识点】\n· 闸阀只能作全开和全关，一般不作调节和节流使用\n· 闸阀启闭件（闸板）运动方向与流体方向垂直\n· 闸阀密封结构具备自密封特点，适用于高压场合"},{"id":"basics_tyjx_0006","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"全启式安全阀的开启高度应大于或等于流道直径的（　）","options":["1/40","1/20","1/4","1/2"],"answer":["C"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在安全阀分类中按开启高度明确划分：\"全启式安全阀：其开启高度大于或等于流道直径的1/4；微启式安全阀：其开启高度为流道直径的1/40~1/20；中启式安全阀：其开启高度为流道直径的1/20~1/4\"。因此全启式安全阀的开启高度应大于或等于流道直径的1/4，选C。\n\n【知识点】\n· 全启式安全阀开启高度≥流道直径的1/4\n· 微启式安全阀开启高度为流道直径的1/40~1/20\n· 中启式安全阀开启高度为流道直径的1/20~1/4"},{"id":"basics_tyjx_0007","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"与直通单座调节阀相比，直通双座调节阀的特点是（　）","options":["流阻大","不平衡力大、需大功率执行机构","密封泄漏等级最高","不平衡力小，但泄漏量较大"],"answer":["D"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在直通双座调节阀中明确指出，\"阀体内有两个阀芯和阀座，流体作用在上下阀芯上的力基本平衡，所以启闭力较小，允许压差大。但上下阀芯难以同时关闭，泄漏量较大\"。而直通单座阀\"只有一个阀芯和阀座\"，\"介质对阀芯推力大（不平衡力大），仅适用于低压差场合\"，但\"泄漏量小，易于保证完全关闭\"。因此与单座相比，双座不平衡力小但泄漏量较大，选D。\n\n【知识点】\n· 直通双座阀两个阀芯受力基本平衡，允许压差大（不平衡力小）\n· 双座阀上下阀芯难以同时关闭，泄漏量较大\n· 直通单座阀不平衡力大但泄漏量小，适用于低压差场合"},{"id":"basics_tyjx_0008","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"阀门的公称通径用（　）表示","options":["PN","DN","NG","De"],"answer":["B"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在阀门基本参数中明确指出，\"公称通径是管路系统中所有管路附件用数字表示的尺寸\"，\"用DN表示\"，如公称通径200mm标志为DN200。同时指出\"公称压力是一个用数字表示的与压力有关的标识代号，用PN表示\"，如公称压力2.0MPa标志为PN20。因此阀门公称通径用DN表示，选B。\n\n【知识点】\n· 公称通径用DN表示，是阀门最主要的规格参数\n· 公称压力用PN表示，如PN20表示公称压力2.0MPa\n· 阀门基本参数包括公称通径、公称压力、工作压力、结构长度等"},{"id":"basics_tyjx_0009","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"离心泵的启动要求是（　）","options":["出口阀全开状态下启动","带额定负荷启动","关闭（或微开）出口阀在低负荷下启动","关闭入口阀启动"],"answer":["C"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在泵的启动要求中明确指出，\"离心泵应在关闭出口阀的情况下启动，此时泵的轴功率最小，电机启动电流小，不易过载\"。同时还要求\"启动前泵内必须充水排气\"，高压给水泵启动前须进行暖泵。因此离心泵应在关闭或微开出口阀的低负荷下启动，选C。\n\n【知识点】\n· 离心泵应在关闭出口阀的情况下启动，此时轴功率最小\n· 关闭出口阀启动可降低电机启动电流，防止过载\n· 轴流泵、混流泵及旋涡泵则采用开阀状态启动（关阀启动消耗功率最大）"},{"id":"basics_tyjx_0010","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"相同性能泵串联工作的主要目的是（　）","options":["增大流量","提高扬程","减少汽蚀","提高效率"],"answer":["B"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在泵的联合工作中指出，\"当采用一台泵不能满足流量或扬程要求时，往往要用两台或两台以上的泵联合工作。联合工作分为并联和串联两种\"。并明确说明\"串联工作的目的是为了提高泵的扬程\"，\"并联工作的主要目的是在保证扬程相同时增加系统的流量\"。因此相同性能泵串联工作的主要目的是提高扬程，选B。\n\n【知识点】\n· 串联工作的主要目的是提高泵的扬程\n· 并联工作的主要目的是在保证扬程相同时增加系统流量\n· 当一台泵不能满足流量或扬程要求时，采用多台泵联合工作"},{"id":"basics_tyjx_0011","module":"basics","bank":"核电基础-通用机械设备","type":"single","stem":"四冲程柴油机的一个工作循环包括四个热力过程，正确的顺序是（　）","options":["进气—压缩—膨胀（做功）—排气","压缩—进气—排气—做功","进气—做功—压缩—排气","压缩—做功—进气—排气"],"answer":["A"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在四冲程柴油机工作原理中明确指出，\"柴油机必须经过进气、压缩、膨胀、排气四个热力过程之后，才能恢复到起始状态，使柴油机不断地产生机械功，上述四个热力过程称为一个工作循环\"。压缩冲程提高缸内空气压力和温度为燃烧创造条件，膨胀冲程（做功冲程）高温高压气体推动活塞下行做功。因此正确顺序是进气—压缩—膨胀（做功）—排气，选A。\n\n【知识点】\n· 四冲程柴油机工作循环包括进气、压缩、膨胀（做功）、排气四个热力过程\n· 压缩冲程提高缸内空气压力和温度，为燃料燃烧创造条件\n· 膨胀冲程（做功冲程）是高温高压气体推动活塞下行带动曲轴旋转做功"},{"id":"basics_tyjx_0012","module":"basics","bank":"核电基础-通用机械设备","type":"judge","stem":"安全阀是一种自动阀门，不需要借助外力而是利用介质本身的压力来排除额定数量的流体。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在安全阀定义中明确指出，\"安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，以防止系统内压力超过预定的安全值\"。安全阀能够防止锅炉、压力容器或压力管道等承压装置因超压而破坏，以保证设备的正常运行和人员安全。因此安全阀是利用介质本身压力排除流体的自动阀门，判断正确。\n\n【知识点】\n· 安全阀是一种自动阀门，不需要借助外力，利用介质本身压力排除流体\n· 安全阀的功能是防止系统内压力超过预定的安全值\n· 安全阀广泛应用于锅炉、压力容器、压力管道等承压装置的超压保护"},{"id":"basics_tyjx_0013","module":"basics","bank":"核电基础-通用机械设备","type":"judge","stem":"焊接连接是阀体与管道最可靠的连接之一，其唯一缺点是更换阀门时必须切割管道与阀门连接的焊缝。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在阀门连接方式中明确指出，焊接连接\"是阀体与管道最可靠的连接之一，焊接连接金属用量少，能可靠地保证完全密封，使用时间长，可靠性高，阀门与管道广泛采用焊接连接形式，焊接连接唯一缺点是更换阀门时必须切割管道与阀门连接的焊缝\"。焊接连接通常分为对焊连接和承插连接两种方式。因此焊接连接唯一缺点是换阀须切割焊缝，判断正确。\n\n【知识点】\n· 焊接连接是阀体与管道最可靠的连接方式之一\n· 焊接连接能可靠保证完全密封，使用时间长\n· 焊接连接唯一缺点是更换阀门时必须切割焊缝\n· 焊接连接通常分为对焊连接和承插连接两种方式"},{"id":"basics_tyjx_0014","module":"basics","bank":"核电基础-通用机械设备","type":"judge","stem":"稳压器的主要功能是建立压力和维持压力，避免反应堆冷却剂在反应堆内沸腾。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在稳压器部分明确指出，\"稳压器的主要功能是建立压力和维持压力，避免反应堆冷却剂在反应堆内沸腾，在正常运行时保持反应堆冷却剂系统在恒定的压力下运行，在负荷瞬变时限制压力的变化\"。稳压器借助加热和喷淋控制水—汽平衡温度来保持冷却剂所需的压力。因此稳压器主要功能是建立和维持压力、防止冷却剂沸腾，判断正确。\n\n【知识点】\n· 稳压器主要功能是建立压力和维持压力，避免冷却剂在反应堆内沸腾\n· 稳压器在正常运行时保持冷却剂系统恒定压力运行\n· 稳压器通过加热和喷淋控制水—汽平衡温度来调节压力"},{"id":"basics_tyjx_0015","module":"basics","bank":"核电基础-通用机械设备","type":"judge","stem":"反应堆压力容器为核安全II级设备。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在反应堆压力容器功能中明确指出，\"反应堆压力容器为核安全I级设备，在各种运行工况和试验条件下均能保证可靠的完整性，不会发生容器的破坏或反应堆冷却剂外泄\"。核电厂主要的压力容器为反应堆压力容器、蒸汽发生器、稳压器等。因此反应堆压力容器为核安全I级设备而非II级，题干说\"核安全II级\"是错误的，判断正确。\n\n【知识点】\n· 反应堆压力容器为核安全I级设备\n· 反应堆压力容器在各种运行工况和试验条件下均能保证可靠的完整性\n· 核电厂主要压力容器包括反应堆压力容器、蒸汽发生器、稳压器等"},{"id":"basics_tyjx_0016","module":"basics","bank":"核电基础-通用机械设备","type":"judge","stem":"离心泵运转时，当叶片入口附近的最低压强小于等于输送温度下液体的饱和蒸汽压时，会发生汽蚀现象。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在离心泵汽蚀现象中明确指出，\"离心泵运转时，液体的压强随着从泵吸入口向叶轮入口而下降，在叶片入口附近将至最低\"，\"当叶片入口附近的最低压强小于等于输送温度下液体的饱和蒸汽压时，液体就在该处发生汽化并产生气泡\"，这种现象称为汽蚀现象。汽蚀会导致泵体噪音和振动，性能参数下降，叶轮损坏。因此当最低压强小于等于饱和蒸汽压时会发生汽蚀，判断正确。\n\n【知识点】\n· 汽蚀发生在叶片入口附近最低压强处\n· 当最低压强小于等于输送温度下液体的饱和蒸汽压时发生汽化\n· 汽蚀会产生噪音和振动，导致泵性能下降，造成叶轮损坏"},{"id":"basics_tyjx_0017","module":"basics","bank":"核电基础-通用机械设备","type":"judge","stem":"轴流泵、混流泵及旋涡泵应采用关闭出口阀的状态启动。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在泵的启动要求中明确指出，\"轴流泵、混流泵及旋涡泵的启动要求：采用出口阀开阀的状态启动（因关阀启动，消耗功率最大）\"。这与离心泵关闭出口阀启动的要求正好相反。因此轴流泵、混流泵及旋涡泵应采用开阀状态启动而非关阀启动，题干说\"关闭出口阀启动\"是错误的，判断正确。\n\n【知识点】\n· 轴流泵、混流泵及旋涡泵采用出口阀开阀状态启动\n· 关阀启动时这类泵消耗功率最大，故不应关阀启动\n· 离心泵则相反，应在关闭出口阀的情况下启动"},{"id":"basics_tyjx_0019","module":"basics","bank":"核电基础-通用机械设备","type":"judge","stem":"与火电厂汽轮机相比，核电汽轮机的大多数级处于过热蒸汽区。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在核电汽轮机特点中明确指出，\"相比于火电厂汽轮机，核电汽轮机具有以下特点\"，其中第三条为\"大多数级处于湿蒸汽区\"，\"核汽轮机必须采用有效的去湿结构和防腐措施，而且还需采用外部分离器（MSR）\"。此外核电汽轮机还具有蒸汽参数低、容积流量大、容易超速等特点。因此核电汽轮机大多数级处于湿蒸汽区而非过热蒸汽区，题干说\"过热蒸汽区\"是错误的，判断正确。\n\n【知识点】\n· 核电汽轮机大多数级处于湿蒸汽区（火电汽轮机多为过热蒸汽区）\n· 核汽轮机须采用去湿结构和防腐措施及外部分离器（MSR）\n· 核电汽轮机还具有蒸汽参数低、容积流量大、容易超速等特点"},{"id":"basics_tyjx_0021","module":"basics","bank":"核电基础-通用机械设备","type":"multi","stem":"下列阀门中，属于自动型阀门的有（　）","options":["止回阀","安全阀","闸阀","截止阀"],"answer":["A","B"],"score":null,"source":"generated","origin":"通用机械设备课件","explanation":"依据课件《核电厂通用机械设备概述》：课件在自动型阀门定义中指出，\"依靠介质（液体、气体）本身的能力而自行动作的阀门。包括止回阀、安全阀、减压阀、疏水阀、自力式调节阀等\"。同时指出止回阀\"属自动阀类，又称逆止阀、单向阀\"，靠自身重量及介质压力产生动作。而闸阀、截止阀属驱动型阀门，需借助外力操纵。因此止回阀和安全阀属于自动型阀门，选AB。\n\n【知识点】\n· 自动型阀门依靠介质本身能力自行动作，包括止回阀、安全阀等\n· 止回阀靠自身重量及介质压力产生动作，属自动阀类\n· 闸阀、截止阀属驱动型阀门，需借助外力操纵"},{"id":"basics_wl01_0001","module":"basics","bank":"核电基础-反应堆原理","type":"single","stem":"反应堆是利用易裂变材料，产生可控的、自持的（　）的装置。","options":["A链式裂变反应","B核聚变反应","C剧烈化学反应","D放射性衰变"],"answer":["A"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.1节'反应堆的分类'明确定义：'反应堆是利用易裂变材料，产生可控的、自持的、链式裂变反应的装置。裂变的同时，释放大量核能、新的核素以及次级中子。'\n本题四个选项中，只有'链式裂变反应'符合该定义。核聚变反应、剧烈化学反应、放射性衰变均不是反应堆依靠的工作原理，故本题选A。\n\n【知识点】\n· 反应堆是利用易裂变材料，产生可控的、自持的、链式裂变反应的装置。\n· 裂变的同时释放大量核能、新的核素以及次级中子，反应堆是一个强大的各种粒子（中子、α、β、γ粒子）的辐照场。\n· 反应堆中有燃料、慢化剂、结构材料和控制材料等，其运行建立在中子与堆内物质相互作用的基础上。"},{"id":"basics_wl01_0002","module":"basics","bank":"核电基础-反应堆原理","type":"single","stem":"按核反应堆的用途分类，反应堆可分为生产堆、试验堆和（　）。","options":["A动力堆","B压水堆","C高温气冷堆","D钠冷快堆"],"answer":["A"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.1.1节写明：'按核反应堆的用途可分为生产堆、试验堆、动力堆。'其中生产堆用于生产易裂变材料、同位素或工业规模辐照，试验堆主要包括零功率装置、实验研究堆和原型堆，动力堆用作动力和直接发电。\n压水堆、高温气冷堆、钠冷快堆是按冷却剂类型划分的堆型，而非按用途划分，故本题选A（动力堆）。\n\n【知识点】\n· 按用途反应堆分为生产堆、试验堆、动力堆三类。\n· 动力堆分为移动式（如核潜艇、破冰船、空间电源）和固定式（发电），国内核电厂中的反应堆属此类。\n· 按冷却剂类型可分为压水堆、重水堆、高温气冷堆和钠冷快堆。\n· 生产堆的主要反应式如238U+n→239Pu、232Th+n→233Th→233U。"},{"id":"basics_wl01_0004","module":"basics","bank":"核电基础-反应堆原理","type":"judge","stem":"压水堆采用轻水作冷却剂和慢化剂，一回路高压（14～16兆帕）使水温在300℃左右而不沸腾。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.1节压水堆部分写明：'高压（14-16兆帕）使得水温在300℃左右而不沸腾。'题干'一回路高压（14～16兆帕）使水温在300℃左右而不沸腾'与课件原文一致。\n压水堆以轻水作冷却剂和慢化剂，正是依靠一回路高压抑制沸腾，使冷却剂保持液态带走堆芯热量，故本题判断为正确。\n\n【知识点】\n· 压水堆采用轻水作冷却剂、慢化剂，燃料一般采用低富集的二氧化铀。\n· 高压（14-16兆帕）使得水温在300℃左右而不沸腾。\n· 压水堆结构紧凑、功率密度高，平均燃耗深、负温度系数，比较安全可靠。"},{"id":"basics_wl01_0005","module":"basics","bank":"核电基础-反应堆原理","type":"single","stem":"与压水堆相比，沸水堆的突出特点是（　）。","options":["A只有一个回路，一回路与二回路合二为一","B采用重水作冷却剂","C一回路工作压力更高","D必须采用天然铀燃料"],"answer":["A"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.2节沸水堆部分写明：'与压水堆一样，冷却剂为轻水，但允许沸腾，压力低，省去一个回路（一回路与二回路合二为一）'，并说明'沸水堆只有一个回路，省去了容易发生泄漏的蒸汽发生器'。\n重水堆才以重水作冷却剂；沸水堆一回路工作压力低于压水堆；沸水堆与压水堆同属轻水堆、都须使用低浓铀而非天然铀，故本题选A。\n\n【知识点】\n· 沸水堆冷却剂为轻水、允许沸腾、压力低，一回路与二回路合二为一，只有一个回路。\n· 沸水堆与压水堆同属轻水堆，都有结构紧凑、安全可靠、建造费用低和负荷跟随能力强等优点，都须使用低浓铀、须停堆换料。\n· 水沸腾使堆芯内中子的慢化性能变差，须增大堆芯体积，燃料装载量比同功率压水堆大50%左右。\n· 沸水堆冷却水压力约为70个大气压，经堆芯变成约285℃的蒸汽并直接引入汽轮机。"},{"id":"basics_wl01_0006","module":"basics","bank":"核电基础-反应堆原理","type":"judge","stem":"最著名的CANDU型重水堆以天然铀作燃料，并采用不停堆更换燃料。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.3节重水堆部分写明：'最著名的重水堆堆型为CANDU型堆，其特点是堆芯使用压力管（代替压水堆的压力容器），用重水作为慢化剂和冷却剂，以天然铀作燃料，采用不停堆更换燃料。'\n题干表述与该课件原文完全一致，故本题判断为正确。\n\n【知识点】\n· CANDU型堆是重水堆代表，以天然铀作燃料，采用不停堆更换燃料。\n· CANDU堆用压力管代替压水堆的压力容器，重水兼作慢化剂和冷却剂。\n· 重水堆燃料是天然的二氧化铀压制、烧结而成的圆柱形芯块，装入锆合金包壳管。\n· 反应堆本体为水平放置的筒形容器（称排管容器），内盛低温低压的重水慢化剂。"},{"id":"basics_wl01_0007","module":"basics","bank":"核电基础-反应堆原理","type":"single","stem":"钠冷快堆中钚-239裂变放出的快中子被再生区铀-238吸收后生成新的钚-239，且再生速度高于消耗速度，所以这种反应堆又称（　）。","options":["A快速增殖堆","B慢化增殖堆","C热中子堆","D生产堆"],"answer":["A"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.5节钠冷快堆部分写明：'钚-239产生裂变反应时放出来的快中子，被装在外围再生区的铀-238吸收，铀-238就会很快变成钚-239'，'而且再生速度高于消耗速度，核燃料越烧越多，快速增殖，所以这种反应堆又称“快速增殖堆”'。\n题干完整描述了这一增殖过程，与课件原文一致，故本题选A（快速增殖堆）。\n\n【知识点】\n· 快中子反应堆不用铀-235，而用钚-239作燃料，外围再生区放置铀-238。\n· 再生速度高于消耗速度、核燃料越烧越多、快速增殖，故又称“快速增殖堆”。\n· 如快中子反应堆推广应用，将使铀资源的利用率提高50-60倍。\n· 钠冷快堆没有慢化剂，金属钠作冷却剂，燃料要求高富集铀或铀钚混合燃料。"},{"id":"basics_wl01_0008","module":"basics","bank":"核电基础-反应堆原理","type":"judge","stem":"快中子反应堆中热中子几乎不存在，因此不存在氙中毒问题。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.5节'毒物效应'部分写明：'在快堆中，热中子几乎是不存在的。因此，在热堆设计中十分关键的热中子吸收截面高的材料在快堆中并不重要，比如不存在氙中毒问题。'\n题干'快中子反应堆中热中子几乎不存在，因此不存在氙中毒问题'正是对课件原文的归纳，因果逻辑成立，故本题判断为正确。\n\n【知识点】\n· 快堆中热中子几乎不存在，故不存在氙中毒问题。\n· 快堆采用钠作冷却剂，无法使用硼酸等可溶性毒物控制反应性，一般采取单一控制棒方式，须设两套独立控制棒停堆系统以保证冗余和安全。\n· 钠冷快堆堆芯富集度高、能谱硬、多普勒效应比热堆小，且缓发中子份额小、中子代时间短。\n· 快堆一般设计成三个回路，比压水堆多一个中间回路（二次钠回路）。"},{"id":"basics_wl01_0009","module":"basics","bank":"核电基础-反应堆原理","type":"single","stem":"高温气冷堆获得良好固有安全性的基础是采用（　）。","options":["A优异的包覆颗粒燃料","B大直径实心燃料棒","C高浓度可溶性硼","D重水慢化剂"],"answer":["A"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.4节高温气冷堆'安全性高'部分写明：'高温气冷堆采用优异的包覆颗粒燃料是获得其良好安全性的基础。'\n包覆层将包覆颗粒中产生的裂变产物充分阻留在颗粒内，1600℃高温下加热几百小时仍保持完整性、裂变气体释放率低于10-4，这正是其固有安全性的基础，故本题选A。\n\n【知识点】\n· 高温气冷堆采用优异的包覆颗粒燃料是获得其良好安全性的基础。\n· 包覆颗粒直径小于1mm，包覆层由低密度热介碳、两层高密度热介碳和一层碳化硅构成，均匀弥散在石墨慢化材料基体中制成直径6cm的球形燃料元件。\n· 实验表明1600℃高温下加热几百小时，包覆颗粒燃料仍保持完整性，裂变气体释放率低于10-4。\n· 高温气冷堆热效率高（40%~41%）、燃耗深（最大高达20GWd/tU）、转换比高（0.7~0.8）。"},{"id":"basics_wl01_0010","module":"basics","bank":"核电基础-反应堆原理","type":"judge","stem":"在整个温度范围内，高温气冷堆堆芯反应性温度系数（燃料和慢化剂温度系数之和）均为负。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.4节'基本安全特性'写明：'在整个温度范围内，高温气冷堆堆芯反应性温度系数（燃料和慢化剂温度系数之和）均为负，具有瞬发效应的燃料温度系数也为负。'\n题干表述与该课件原文完全一致，因此在任何正反应性引入事故情况下，堆芯均能依靠固有反应性反馈补偿能力实现自动停堆，故本题判断为正确。\n\n【知识点】\n· 在整个温度范围内，高温气冷堆堆芯反应性温度系数（燃料和慢化剂温度系数之和）均为负。\n· 具有瞬发效应的燃料温度系数也为负，任何正反应性引入事故下堆芯均能依靠固有反应性反馈自动停堆。\n· 事故中负反应性温度系数能迅速抑制功率上升，燃料最高温度远低于燃料元件最高温度限值。\n· 堆芯衰变热可借助导热、对流和辐射等非能动机制导出，事故工况下不需专设的余热冷却系统。"},{"id":"basics_wl01_0011","module":"basics","bank":"核电基础-反应堆原理","type":"single","stem":"下列不属于核电工程要解决的三大问题的是（　）。","options":["A提高天然铀的富集度","B将堆芯中的能量带出来利用或安全疏导","C控制反应性","D包容和控制核裂变产生的放射性产物"],"answer":["A"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件'核电工程要解决的三大问题'部分写明三大问题为：（1）将堆芯中的能量带出来加以利用或安全地加以疏导；（2）控制反应性，控制好堆芯内的反应性就控制了裂变中子数，从而控制了裂变能量；（3）包容和控制核裂变所产生的放射性产物。\n选项A'提高天然铀的富集度'不在三大问题之列（富集度属于燃料制备环节），故本题选A。\n\n【知识点】\n· 三大问题之一：将堆芯中的能量带出来加以利用或安全地加以疏导。\n· 三大问题之二：控制反应性，即控制裂变中子数、控制裂变能量，满足电网需求。\n· 三大问题之三：包容和控制核裂变所产生的放射性产物，实现对放射性产物的屏障控制功能。\n· 需要特别关注与功率及功率分布、反应性、放射性屏障完整性相关的物理问题。"},{"id":"basics_wl01_0012","module":"basics","bank":"核电基础-反应堆原理","type":"judge","stem":"压水堆核电站一回路由反应堆压力容器、稳压器、蒸汽发生器、冷却剂泵和管道构成。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.3节压水堆核电站基本原理写明：'在由反应堆压力容器、稳压器、蒸汽发生器、冷却剂泵和管道构成的一回路中循环'。\n题干列出的部件与课件原文完全一致，故本题判断为正确。堆芯冷却剂吸收裂变能量后在一回路循环，流经蒸汽发生器一次侧时把热量传给二次侧给水产生蒸汽。\n\n【知识点】\n· 一回路由反应堆压力容器、稳压器、蒸汽发生器、冷却剂泵和管道构成。\n· 堆芯中的冷却剂在吸收核裂变产生的热能后，在冷却剂泵作用下流出反应堆压力容器，在一回路中循环。\n· 冷却剂流经蒸汽发生器一次侧时，把热量传给二次侧给水，使其由水变为蒸汽。\n· 蒸汽推动汽轮机的叶片，使汽轮发电机组转动、发出电力。"},{"id":"basics_wl01_0013","module":"basics","bank":"核电基础-反应堆原理","type":"multi","stem":"压水堆的优点包括（　）。","options":["A结构紧凑，功率密度高","B平均燃耗深","C具有负温度系数，比较安全可靠","D冷却剂在堆芯内大量沸腾直接产生蒸汽"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"反应堆原理课件","explanation":"依据课件《核反应堆的核物理基础·第一章 反应堆原理》：课件1.2.1节压水堆部分写明该堆型'结构紧凑，功率密度高''平均燃耗深，负温度系数，比较安全可靠'，故A、B、C均属压水堆优点。\n而'冷却剂在堆芯内大量沸腾直接产生蒸汽'是沸水堆的特征——课件写明压水堆依靠高压（14-16兆帕）使水温在300℃左右而不沸腾，不属压水堆优点，故本题选ABC。\n\n【知识点】\n· 压水堆结构紧凑，功率密度高。\n· 压水堆平均燃耗深、负温度系数，比较安全可靠。\n· 压水堆高压（14-16兆帕）使水温在300℃左右而不沸腾，堆芯内不发生大量沸腾。\n· 沸水堆允许冷却剂在堆芯内沸腾、直接产生蒸汽引入汽轮机，与压水堆形成对照。"},{"id":"basics_wl02_0001","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"同位素是含有相同质子数、不同（　）的原子。","options":["A中子数","B电子数","C核子数","D原子序数"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.1节原文：“同位素—含有相同质子数（Z）、不同中子数（N）的原子称为同位素，它们在元素周期表上占有相同的位置。”故本题选A（中子数）。B电子数由质子数决定（原子呈电中性），同位素电子数相同；C核子数=质子数+中子数，核子数必然不同；D原子序数等于质子数，同位素原子序数相同。\n\n【知识点】\n· 同位素是质子数（Z）相同、中子数（N）不同的一类原子，在元素周期表上占同一位置。\n· 元素以原子序数（即质子数）描述；核素指具有特定质子数和中子数并处于同一能态的一类原子。\n· 大多数元素都有几种同位素，化学性质一般无法区别，但核特性不同（如235U可裂变而238U不能）。\n· 氢有三种同位素1H、2H(D)、3H(T)，其中T在自然界中不存在。"},{"id":"basics_wl02_0002","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"丰度是指某一同位素在其所属的天然元素中所占的（　）。","options":["A原子百分比","B质量百分比","C体积百分比","D摩尔浓度"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.1.2节原文：“丰度—某一同位素在其所属的天然元素中所占的原子百分比。”故本题选A。课件强调丰度按原子数目占比统计，而非质量、体积或浓度。\n\n【知识点】\n· 丰度的定义：某一同位素在其所属天然元素中所占的原子百分比。\n· 天然氧的三种稳定同位素16O、17O、18O份额分别为99.756%、0.039%、0.205%，均为原子百分比。\n· 天然铀含234U、235U、238U三种同位素，其中235U丰度仅约0.72%，238U占约99.27%。\n· 丰度是描述天然同位素组成的基本概念，是本章节分解培训目标第1条要求掌握的内容。"},{"id":"basics_wl02_0003","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"天然铀中U-235的丰度约为（　）。","options":["0.72%","3%","20%","99.28%"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.1.2节表2-1：天然铀中235U的丰度为0.720%，238U为99.274%，234U为0.0055%。故本题选A（0.72%）。3%接近压水堆燃料的富集度而非天然丰度，20%、99.28%均与课件数据不符（99.28%为238U的丰度）。\n\n【知识点】\n· 天然铀中235U丰度约0.72%，238U约99.27%，234U仅0.0055%。\n· 235U是易裂变同位素，在任何能量中子作用下都能产生裂变反应，是压水堆释放核能的关键。\n· 压水堆常用燃料UO2需将235U富集到约3%左右，远高于天然丰度。\n· 铀是能通过裂变释放核能的重要元素之一，自然界至少存在234、235、238三种同位素。"},{"id":"basics_wl02_0004","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"按中子能量分类，热中子的能量范围为（　）。","options":["AEn≤1eV","B1eV＜En≤0.1MeV","CEn＞0.1MeV","DEn＞1MeV"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.3节开头：“按中子能量大小分为：热中子（En≤1eV）；超热中子（1eV＜En≤0.1MeV）；快中子（En＞0.1MeV）。”故本题选A（En≤1eV）。\n\n【知识点】\n· 按能量分类：热中子En≤1eV，超热中子1eV＜En≤0.1MeV，快中子En＞0.1MeV。\n· 易裂变同位素（235U等）在低能（热）中子作用下发生裂变的可能性较大，压水堆即利用热中子引发裂变。\n· 中子核反应指中子与原子核相互作用、致使原子核质量、电荷或能量状态改变的过程。\n· 中子核反应遵守核子数守恒、电荷数守恒、动量守恒、能量守恒四条基本定律。"},{"id":"basics_wl02_0005","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"微观截面的常用单位靶恩（b）等于（　）。","options":["10⁻²⁴cm²","10⁻²⁴m²","10⁻²⁸cm²","10⁻²¹m²"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.4.1节原文：“微观截面常常在10-26~10-30m2数量级，数值太小，习惯上常用靶恩（barn缩写为b）来作单位，即1b等于10-28m2，或10-24cm²。”故本题选A（10⁻²⁴cm²）。注意B选项10⁻²⁴m²漏了单位换算（1m²=10⁴cm²），两者相差四个数量级。\n\n【知识点】\n· 微观截面σ表示一个靶核与一个中子发生某类核反应的几率，量纲为面积。\n· 1靶恩（b）=10⁻²⁸m²=10⁻²⁴cm²。\n· 微观总截面σt＝σs＋σa（散射截面加吸收截面），σs＝σe＋σin（弹性加非弹性）。\n· 截面大小与中子能量及核素种类有关，是描述中子与核相互作用概率的基本物理量。"},{"id":"basics_wl02_0006","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"中子核反应率R与中子通量密度φ、宏观截面Σ的关系为（　）。","options":["AR=Σφ","BR=φ/Σ","CR=Σ/φ","DR=Σ+φ"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.4.4节原文：“单位时间单位体积靶核内中子与核发生核反应的总次数为：核反应率R=Σnv=Σϕ（核反应数/m³·s）。”故本题选A（R=Σφ）。\n\n【知识点】\n· 核反应率R=Σφ，即宏观截面Σ与中子通量密度φ的乘积。\n· 中子通量密度φ=nv，指单位时间、单位体积内中子穿行的总距离。\n· 宏观截面Σ表示一个中子在单位飞行程长上与靶核发生某类反应的概率，单位是长度的倒数（m⁻¹）。\n· “描述核反应率和中子通量密度的关系”是本章分解培训目标第6条要求掌握的内容。"},{"id":"basics_wl02_0007","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"下列同位素中，在各种能量中子作用下均能产生裂变反应的易裂变同位素是（　）。","options":["AU-235","BU-238","CTh-232","DPu-240"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.3.2节裂变反应部分原文：“易裂变同位素（如233U、235U、239Pu和241Pu等）在各种能量的中子作用下均能产生裂变反应，并且在低能中子作用下发生裂变的可能性较大；而可裂变同位素（如232Th、238U和240Pu等）只有在能量高于某一阈值的中子作用下才能发生裂变反应。”四个选项中只有U-235属于易裂变同位素，故选A。\n\n【知识点】\n· 易裂变同位素：233U、235U、239Pu、241Pu，各种能量中子作用下均能裂变。\n· 可裂变同位素：232Th、238U、240Pu，只有高于阈值能量的中子才能引发裂变。\n· 裂变反应是反应堆内最重要的核反应；压水堆最常用燃料UO2中的235U即易裂变同位素。\n· 235U吸收中子后并不都发生裂变，还可能发生俘获反应。"},{"id":"basics_wl02_0008","module":"basics","bank":"核电基础-核物理基础","type":"single","stem":"放射性活度单位中，1居里（Ci）等于（　）。","options":["3.7×10¹⁰Bq","1×10⁹Bq","3.7×10⁸Bq","1×10¹²Bq"],"answer":["A"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.2.2节放射性活度部分原文：“活度单位为贝可勒尔，简称贝可（Bq），(1居里)1Ci=3.7×10¹⁰/s=3.7×10¹⁰Bq。”故本题选A。\n\n【知识点】\n· 放射性活度指放射性同位素样品在单位时间内衰变的次数。\n· 活度的国际单位是贝可勒尔（Bq），1次衰变/秒=1Bq；常用单位居里，1Ci=3.7×10¹⁰Bq。\n· 半衰期也可定义为某同位素活度A降为一半所需的时间。\n· 衰变常数λ表示每个核在单位时间内的衰变概率，取决于核的种类和衰变类型且为常数。"},{"id":"basics_wl02_0009","module":"basics","bank":"核电基础-核物理基础","type":"judge","stem":"U-238在热中子轰击下不能裂变，它俘获中子生成U-239，经两次β-衰变转化为Pu-239。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.1.1节原文：“在热中子的轰击下235U原子核能分裂成两个碎片；而238U不能产生裂变反应，它俘获中子后生成239U，经过两次β-衰变而转化为239Pu。”2.3.2节辐射俘获反应部分也重申：“238U吸收中子后生成239U，239U是不稳定的放射性同位素，经过两次β-衰变可转换成239Pu。”本题表述与课件完全一致，判断正确。\n\n【知识点】\n· 238U在热中子轰击下不能裂变，属于可裂变（阈值）同位素。\n· 238U俘获中子生成239U，经两次β-衰变转化为239Pu（人工易裂变燃料）。\n· 235U与238U核特性不同但化学性质极为相似，这是同位素核特性不同的典型例子。\n· β-衰变是核内中子多于质子时不稳定核的转变方式：中子转化为质子并放出电子和反中微子。"},{"id":"basics_wl02_0010","module":"basics","bank":"核电基础-核物理基础","type":"judge","stem":"压水堆一回路水中O-16吸收中子发生(n,p)反应生成N-16，N-16衰变放出很硬的γ射线，是一回路水放射性剂量的重要来源。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.3.2节放出带电粒子反应部分原文：“压水堆一回路中的水流经堆芯时，水中的16O、17O等核吸收中子后都放出一个质子，发生16O(n,p)16N、17O(n,p)17N等反应。这些反应的生成核并不稳定，要发生放射性衰变，例如16N要发生β-衰变，同时放出很硬的γ射线……这是一回路水放射性剂量的一个重要来源。”本题表述与课件一致，判断正确。\n\n【知识点】\n· 16O(n,p)16N是典型的放出带电粒子反应，生成核16N不稳定。\n· 16N发生β-衰变（16N→16O+β-+γ），同时放出很硬的γ射线。\n· 16N衰变是一回路水放射性剂量的重要来源；16N半衰期约7.4s（课件练习题数据）。\n· 在反应堆物理分析中，放出带电粒子的反应可以不加考虑。"},{"id":"basics_wl02_0011","module":"basics","bank":"核电基础-核物理基础","type":"judge","stem":"弹性散射前后中子-靶核系统的动能和动量均守恒；非弹性散射动量守恒但动能不守恒。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.3.1节原文：“弹性散射的特点是散射前后的中子－靶核系统的动能守恒和动量守恒”（又分势散射和共振弹性散射）；“（非弹性散射）散射前后的中子－靶核系统的动量守恒，但动能不守恒。具有阈能。”本题表述与课件完全一致，判断正确。\n\n【知识点】\n· 弹性散射：中子-靶核系统散射前后动能和动量均守恒。\n· 非弹性散射：动量守恒但动能不守恒（部分动能转为核激发能），且具有阈能。\n· 弹性散射按机制分为势散射和共振（复合）弹性散射。\n· 中子与原子核的核反应分为中子的散射（弹性、非弹性）和中子的吸收（辐射俘获、放出带电粒子、裂变）两大类。"},{"id":"basics_wl02_0012","module":"basics","bank":"核电基础-核物理基础","type":"judge","stem":"原子核衰变到初始值的十分之一所需的平均时间称为半衰期。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.2.2节原文：“原子核衰变一半所需的平均时间T1/2称为半衰期。”即半衰期对应衰变到初始值的1/2，而非1/10，故本题判断错误。课件练习题中16N衰变到初始值的1/10约需24.6s（约为3.3个半衰期），也说明1/10所需时间不叫半衰期。\n\n【知识点】\n· 半衰期T1/2是原子核衰变一半（N=0.5N0）所需的平均时间。\n· 半衰期与衰变常数的关系为T1/2=ln2/λ；半衰期也可定义为活度A降为一半所需时间。\n· 衰变到初始值1/10所需时间约为3.32个半衰期（如16N半衰期7.4s，衰变到1/10约24.6s）。\n· 衰变常数λ是每种放射性核素固有的常数，取决于核的种类和衰变类型。"},{"id":"basics_wl02_0013","module":"basics","bank":"核电基础-核物理基础","type":"judge","stem":"中子平均自由程λ在数值上等于宏观截面Σ的倒数。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.4.2节原文：宏观截面“解释为一个中子在每单位飞行程长上与靶核发生某类反应的概率，那么发生一次反应，中子飞行的平均距离为（1/Σ），习惯上称此距离为中子平均自由程，用λ表示”；2.4.4节亦写明“平均自由程为λ=1/Σ”。故本题判断正确。\n\n【知识点】\n· 中子平均自由程λ=1/Σ，数值上等于宏观截面的倒数。\n· 宏观截面Σ是一个中子在单位飞行程长上与靶核发生某类核反应的概率，单位为长度的倒数（m⁻¹）。\n· 宏观截面等于微观截面与核子数密度的乘积；多种核素共存时Σa=Σ(Ni·σi)（课件练习题结论）。\n· 描述微观截面和宏观截面的物理意义是本章分解培训目标第5条要求掌握的内容。"},{"id":"basics_wl02_0014","module":"basics","bank":"核电基础-核物理基础","type":"multi","stem":"本书中，中子的吸收反应包括（　）。","options":["A辐射俘获反应","B裂变反应","C放出带电粒子反应","D弹性散射"],"answer":["A","B"],"score":null,"source":"generated","origin":"核物理基础课件","explanation":"依据课件《核反应堆的核物理基础·第二章 核物理基础》2.3.2节裂变反应部分原文：“在本书中，中子的吸收反应指辐射俘获反应和裂变反应，不包括放出带电粒子的核反应。”故本题选AB：A辐射俘获反应（堆内最常见的吸收反应）和B裂变反应属于吸收；C放出带电粒子反应按本书约定不计入吸收；D弹性散射属于中子的散射而非吸收。课件在2.3.1节也把中子核反应分为散射（弹性、非弹性）与吸收（辐射俘获、放出带电粒子、裂变）两大类，而“吸收反应”在本教材语境下特指辐射俘获和裂变。\n\n【知识点】\n· 本书约定：中子的吸收反应指辐射俘获反应和裂变反应，不包括放出带电粒子的反应。\n· 辐射俘获反应(n,γ)是反应堆内最常见的吸收反应，如238U(n,γ)239U。\n· 裂变反应是反应堆内最重要的核反应，易裂变同位素在各种能量中子作用下均能裂变。\n· 弹性散射、非弹性散射属于中子散射，不属于吸收反应。"},{"id":"basics_wl03_0001","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"每次核裂变可回收的能量大约为（　）。","options":["200MeV","200keV","20MeV","2000MeV"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第10页明确指出\"每次裂变可回收的能量大约为200MeV，即Ef=200MeV\"。课件第9页给出了裂变能量分配表，裂变碎片动能168MeV、裂变中子动能5MeV、瞬发γ射线7MeV、缓发β射线8MeV、缓发γ射线7MeV等，总释放能量约207MeV，其中中微子带走的约12MeV不可回收，故可回收能量约198~207MeV，取约200MeV。答案A正确。\n\n【知识点】\n· 每次裂变可回收能量约200MeV（Ef=200MeV），是反应堆热功率计算的基础\n· 裂变能量以多种形式释放，裂变碎片动能（168MeV）占最大份额\n· 中微子带走的约12MeV能量不可回收，可回收能量总计约198~207MeV"},{"id":"basics_wl03_0002","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"瞬发中子占裂变中子总数的（　）。","options":["A99%以上","B约90%","C约50%","D约0.65%"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第12页\"3.2.1 瞬发中子\"明确指出\"瞬发中子占裂变中子总数99%以上，中子在裂变后10^-14s（或更短）的裂变瞬间内被释放\"。缓发中子仅占不到1%（U-235的缓发中子份额β约0.65%）。选项A\"99%以上\"与课件原文一致。\n\n【知识点】\n· 瞬发中子占裂变中子总数99%以上，在裂变后10^-14s内瞬间释放\n· 缓发中子仅占不到1%（β≈0.65%），但对反应堆控制至关重要\n· 裂变中子分为瞬发中子和缓发中子两类"},{"id":"basics_wl03_0003","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"U-235各组缓发中子份额之和（缓发中子份额β）约为（　）。","options":["0.65%","0.065%","6.5%","0.021%"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第15页\"3.2.2 缓发中子\"给出了U-235六组缓发中子的份额数据表，各组份额βi分别为0.000215、0.001424、0.001274、0.002568、0.000748、0.000273，总计β=0.006502，即约0.65%。课件指出\"各组缓发中子份额之和称为缓发中子份额（β）\"。答案A（0.65%）正确。\n\n【知识点】\n· U-235缓发中子份额β≈0.0065（0.65%），是反应堆动力学的重要参数\n· 缓发中子分为6组，各组半衰期从55.72s到0.23s不等\n· β虽小但对反应堆控制极为重要，是反应堆能够可控运行的关键"},{"id":"basics_wl03_0004","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"无限介质的增殖因数k∞（四因子公式）等于（　）。","options":["Aεpfη","BεpfηPFPT","CεfηPFPT","DpfηPT"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第29页指出\"无限大反应堆，中子不泄漏几率P=1。这时的增殖因数称为无限介质的增殖因数k∞\"，并给出\"k∞=εpfη\"即四因子公式。当考虑有限介质的泄漏时，加上快中子不泄漏概率PF和热中子不泄漏概率PT，则为六因子公式keff=εpfηPFPT。答案A（εpfη）正确。\n\n【知识点】\n· 四因子公式：k∞=εpfη（无限大介质，不泄漏几率P=1）\n· 六因子公式：keff=εpfηPFPT（有限介质，考虑中子泄漏）\n· ε为快中子增殖因数，p为逃脱共振吸收几率，f为热中子利用因数，η为有效裂变中子数"},{"id":"basics_wl03_0005","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"六因子公式中，逃脱共振吸收几率p是指中子（　）。","options":["A经过共振能区而不被U-238吸收的几率","B慢化时不泄漏到堆外的几率","C被燃料吸收的热中子份额","D每吸收一个热中子产生的裂变中子数"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第22页\"3.3.3 逃脱共振吸收几率p\"明确指出\"238U在中能中子区有很多共振峰，能强烈吸收中子。中子在慢化过程中，要经过共振能区（1eV至10^4eV），所以会被238U共振吸收。p为一个中子经过共振能区而不被吸收的几率，即逃脱共振吸收几率\"。答案A正确。\n\n【知识点】\n· p定义为中子经过共振能区（1eV~10^4eV）不被238U吸收的几率\n· 238U在中能中子区有多个共振峰，能强烈吸收中子\n· p是四因子/六因子公式中的重要因子之一"},{"id":"basics_wl03_0006","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"keff＞1时，反应堆处于（　）。","options":["A超临界状态","B临界状态","C次临界状态","D停堆状态"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第30页明确指出\"keff>1，说明随着裂变链的进行，中子的消失率小于产生率。因而，系统中的中子将越来越多，该系统处于超临界状态\"。同时课件给出：keff=1为临界状态（中子产生率与消失率平衡），keff<1为次临界状态（中子越来越少）。答案A正确。\n\n【知识点】\n· keff>1：中子产生率大于消失率，系统超临界，中子数越来越多\n· keff=1：产生率与消失率平衡，系统临界，中子通量稳定\n· keff<1：消失率大于产生率，系统次临界，中子数越来越少"},{"id":"basics_wl03_0007","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"中子慢化过程中经过的U-238共振能区为（　）。","options":["1eV～10⁴eV","0.1MeV～1MeV","10MeV～100MeV","0.025eV以下"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第22页\"3.3.3 逃脱共振吸收几率p\"指出\"238U在中能中子区有很多共振峰，能强烈吸收中子。中子在慢化过程中，要经过共振能区（1eV至10^4eV），所以会被238U共振吸收\"。课件原文明确给出了共振能区范围为1eV至10^4eV。答案A（1eV～10^4eV）与课件一致。\n\n【知识点】\n· U-238的共振吸收能区为1eV~10^4eV（中能中子区）\n· 238U在该能区有多个共振峰，能强烈吸收中子\n· 中子慢化过程中需经过此共振能区，逃脱共振吸收的几率为p"},{"id":"basics_wl03_0008","module":"basics","bank":"核电基础-裂变与中子循环","type":"single","stem":"设1000个初始裂变中子经U-238快裂变后最后得到1031个裂变阈能以下的中子，则快中子增殖因数ε为（　）。","options":["1.031","0.969","1.46","0.985"],"answer":["A"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第20页\"3.3.1 快中子增殖因数ε\"给出了具体算例：\"堆内某代中子循环开始，假定共有1000个初始裂变中子，其中被238U核吸收15个裂变阈能以上的中子，产生46个裂变中子，最后得到1031个238U裂变阈能以下的中子，那么ε=1.031\"。ε的定义为快裂变后中子数与初始裂变中子数之比，即ε=1031/1000=1.031。答案A正确。\n\n【知识点】\n· ε=快裂变后中子数/初始裂变中子数，反映238U快裂变对中子数的增殖效果\n· 压水堆中238U占燃料绝大部分（235U仅约3%），快中子可引起238U裂变\n· 课件算例：1000个初始中子经238U快裂变后得到1031个阈能以下中子，ε=1.031"},{"id":"basics_wl03_0009","module":"basics","bank":"核电基础-裂变与中子循环","type":"judge","stem":"对于U-235，每次热裂变平均释放2.43个中子。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第11页\"3.2 裂变中子\"明确指出\"裂变中子是指在裂变反应过程中放出的新的次级中子。对于235U，每次热裂变（由热中子引发的裂变）平均释放2.43个中子\"。该数值（ν=2.43）是中子循环和临界计算的基础参数。判断正确。\n\n【知识点】\n· U-235每次热裂变平均释放2.43个中子（即ν=2.43）\n· 裂变中子是裂变过程中放出的次级中子，是维持链式反应的关键\n· 裂变中子分为瞬发中子（>99%）和缓发中子（约0.65%）两类"},{"id":"basics_wl03_0010","module":"basics","bank":"核电基础-裂变与中子循环","type":"judge","stem":"裂变碎片的动能是瞬发释放的，约为168MeV。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第9页给出了裂变能量分配表，其中\"裂变碎片的动能 | 瞬发 | 168 | 168\"，即裂变碎片动能为瞬发释放，能量约168MeV，且全部可回收（可回收能量也为168MeV）。裂变碎片动能是裂变能量中最大的组成部分。判断正确。\n\n【知识点】\n· 裂变碎片动能约168MeV，是裂变能量中最大的组成部分\n· 裂变碎片动能为瞬发释放（裂变瞬间产生）\n· 该能量全部可回收（可回收能量168MeV）"},{"id":"basics_wl03_0011","module":"basics","bank":"核电基础-裂变与中子循环","type":"judge","stem":"每次裂变释放的总能量中，中微子带走的约12MeV能量是不可回收的。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第9页裂变能量分配表中列出\"中微子 | 缓发 | 12 | -\"，即中微子能量约12MeV，可回收能量为\"-\"（即不可回收，为0）。中微子不带电、几乎不与物质相互作用，其能量无法回收利用。判断正确。\n\n【知识点】\n· 中微子带走约12MeV能量，可回收能量为0（不可回收）\n· 中微子是缓发释放的，不带电，几乎不与物质相互作用\n· 这是总释放能量（约207MeV）与可回收能量（约200MeV）之间存在差额的主要原因"},{"id":"basics_wl03_0012","module":"basics","bank":"核电基础-裂变与中子循环","type":"judge","stem":"缓发中子与瞬发中子一样，是在裂变后10^-14s内瞬间释放的。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第12页指出\"瞬发中子占裂变中子总数99%以上，中子在裂变后10^-14s（或更短）的裂变瞬间内被释放\"，即10^-14s内释放的是瞬发中子。而课件第13页\"3.2.2 缓发中子\"说明缓发中子是裂变碎片经β衰变后才释放的，例如裂变碎片87Br半衰期为55.6s，其放出的中子在裂变后相当一段时间才发射出来。因此缓发中子不是在10^-14s内瞬间释放的，判断错误。\n\n【知识点】\n· 瞬发中子在裂变后10^-14s内瞬间释放，占裂变中子总数99%以上\n· 缓发中子是裂变碎片经β衰变后释放的，延迟时间可达数秒至数十秒\n· 缓发中子虽份额小（约0.65%），但对反应堆控制至关重要"},{"id":"basics_wl03_0013","module":"basics","bank":"核电基础-裂变与中子循环","type":"judge","stem":"无限大反应堆的中子不泄漏几率P等于1。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第29页明确指出\"无限大反应堆，中子不泄漏几率P=1。这时的增殖因数称为无限介质的增殖因数k∞\"。P=PF×PT（快中子不泄漏概率与热中子不泄漏概率的乘积），无限大反应堆中中子不会泄漏到堆外，故P=1。判断正确。\n\n【知识点】\n· 无限大反应堆中子不泄漏几率P=1（无中子泄漏）\n· P=PF×PT，分别为快中子不泄漏概率和热中子不泄漏概率\n· P=1时增殖因数即为k∞=εpfη（四因子公式）"},{"id":"basics_wl03_0014","module":"basics","bank":"核电基础-裂变与中子循环","type":"multi","stem":"下列属于六因子公式中因子的是（　）。","options":["A快中子增殖因数ε","B热中子利用因数f","C热中子不泄漏概率PT","D缓发中子份额β"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"裂变与中子循环课件","explanation":"依据课件《核反应堆的核物理基础·第三章 核裂变反应与中子循环》：课件第29页给出六因子公式keff=εpfηPFPT，其中包含六个因子：快中子增殖因数ε、逃脱共振吸收几率p、热中子利用因数f、有效裂变中子数η、快中子不泄漏概率PF、热中子不泄漏概率PT。缓发中子份额β不属于六因子公式的因子，故选项D错误。选项A（快中子增殖因数ε）、B（热中子利用因数f）、C（热中子不泄漏概率PT）均属于六因子公式的因子，答案ABC正确。\n\n【知识点】\n· 六因子公式：keff=εpfηPFPT，包含ε、p、f、η、PF、PT六个因子\n· 四因子公式：k∞=εpfη（无限大介质，P=PF×PT=1）\n· 缓发中子份额β不属于中子循环公式因子，是反应堆动力学参数"},{"id":"basics_wl04_0001","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"反应性ρ与有效增殖因数k的关系为（　）。","options":["Aρ＞0时k＞1，系统超临界","Bρ＞0时k＜1，系统次临界","Cρ=0时k＞1，系统超临界","Dρ＜0时k＞1，系统超临界"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第9页明确给出反应性与有效增殖因数的关系——\"ρ=0，k=1系统临界；ρ＞0，k＞1系统超临界；ρ＜0，k＜1系统次临界\"。因此ρ＞0时k＞1，系统超临界，选A。选项B将ρ＞0对应次临界有误，选项C将ρ=0对应超临界有误，选项D将ρ＜0对应超临界有误。\n\n【知识点】\n· 反应性ρ表示系统偏离临界状态程度的物理量，定义为ρ=(k-1)/k。\n· ρ=0时k=1为临界，ρ＞0时k＞1为超临界，ρ＜0时k＜1为次临界。\n· 反应性大小主要取决于燃料的装量和富集度，也取决于反应堆的堆型和结构组成。"},{"id":"basics_wl04_0002","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"反应性单位中，1pcm等于（　）。","options":["10⁻⁵Δk/k","10⁻⁶Δk/k","10⁻⁴Δk/k","10⁻³Δk/k"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第10页明确列出反应性的单位有Δk/k、Δk、$(元)、pcm、mk，并给出\"1pcm=10⁻⁵Δk/k\"。因此1 pcm等于10⁻⁵Δk/k，选A。\n\n【知识点】\n· 反应性的常用单位包括Δk/k、Δk、$(元)、pcm、mk。\n· 1 pcm = 10⁻⁵ Δk/k，是反应性的微小单位，常用于精确描述反应性变化量。\n· 反应性大小主要取决于燃料装量和富集度，也取决于堆型和结构组成。"},{"id":"basics_wl04_0003","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"热中子反应堆运行中对反应性影响特别重要的两种裂变产物毒物是（　）。","options":["氙-135和钐-149","碘-131和铯-137","氙-133和锶-90","钴-60和氚"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第12页指出\"其中重要的裂变产物是135Xe和149Sm\"，第14页进一步说明\"热中子反应堆中，有两种裂变产物是特别重要的，它们是135Xe和149Sm\"，因为它们\"具有非常大的热中子吸收截面和裂变产额，因而其浓度在反应堆启动后便迅速增长\"。因此选A（氙-135和钐-149）。\n\n【知识点】\n· 135Xe和149Sm是热中子反应堆运行中对反应性影响最重要的两种裂变产物毒物。\n· 它们具有非常大的热中子吸收截面（135Xe约3×10⁶ b，149Sm约4.1×10⁴ b）和较大的裂变产额。\n· 具有较大热中子吸收截面的裂变产物称为中子毒物，其对反应性的影响称中毒效应，主要通过改变热中子利用因数f来影响增殖因数。"},{"id":"basics_wl04_0004","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"氙-135达到平衡浓度的时间约为（　）。","options":["A48小时","B约500小时","C7.4秒","D2小时"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第17页明确指出\"氙-135达平衡的时间约为48h\"。第25页比较表也列出135Xe平衡中毒达到时间为48小时。因此选A（48小时）。\n\n【知识点】\n· 氙-135达平衡浓度的时间约为48小时（约2天）。\n· 135Xe热中子吸收截面很大（0.025eV时约2.7×10⁶ b），是重要的裂变产物毒物。\n· 反应堆长期运行后停堆或降功率时会出现碘坑现象，与135Xe浓度变化有关；氙峰足够负时可导致氙阻碍启动和氙死时间。"},{"id":"basics_wl04_0005","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"反应堆的平衡149Sm中毒反应性与功率水平的关系是（　）。","options":["A与功率水平无关","B与功率水平成正比","C与功率水平成反比","D仅满功率时存在"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第25页比较表明确列出149Sm平衡中毒与功率关系为\"无关\"，第26-27页练习题进一步确认：已知100%FP的平衡149Sm毒反应性为600pcm，则50%FP时也为600pcm，\"理由：平衡149Sm毒反应性与功率水平无关\"。因此选A（与功率水平无关）。\n\n【知识点】\n· 平衡149Sm中毒反应性与功率水平无关，不同功率下平衡值相同。\n· 149Sm从零浓度达到平衡值大约需要20天（500小时）左右的时间。\n· 149Sm是稳定核素，运行过程中其平衡浓度基本保持不变；停堆后因钷-149衰变而浓度增大，与氙-135中毒相比较中毒效应较小。"},{"id":"basics_wl04_0006","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"燃耗深度的常用单位是（　）。","options":["A兆瓦日/吨铀（MWd/tU）","Bpcm","C百分比（%）","D贝可（Bq）"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第29页指出\"单位质量的燃料所发出的能量称为燃耗深度\"，并明确\"燃耗深度单位常用兆瓦日/吨铀(MWd/tU)来表示\"，其中tU为反应堆铀（235U和238U）的总装量。因此选A（兆瓦日/吨铀MWd/tU）。\n\n【知识点】\n· 燃耗深度是单位质量燃料所发出的能量，表示反应堆积分能量的输出。\n· 燃耗深度常用单位为兆瓦日/吨铀（MWd/tU），tU为铀的总装量（氧化铀需扣除氧的质量）。\n· 等效满功率天（EFPD）和等效满功率小时（EFPH）也是度量燃耗的常用方式。"},{"id":"basics_wl04_0007","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"以低富集铀为燃料的反应堆中，燃料反应性温度系数（多普勒系数）（　）。","options":["A总是负的","B总是正的","C正负取决于功率","D恒为零"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第47页指出\"以低富集铀为燃料的反应堆中，燃料反应性温度系数总是负的\"，第48页进一步说明\"由于燃料的温度效应主要是238U共振吸收的多普勒效应所引起的，因而也称多普勒效应，燃料温度系数也称多普勒系数\"。因此选A（总是负的）。\n\n【知识点】\n· 以低富集铀为燃料的反应堆中，燃料反应性温度系数（多普勒系数）总是负的。\n· 温度升高时238U共振吸收增强，逃脱共振吸收几率p随温度升高而减小，导致反应性下降。\n· 燃料温度系数又称瞬发温度系数，因为燃料温度对功率变化的响应几乎是瞬时的。"},{"id":"basics_wl04_0008","module":"basics","bank":"核电基础-反应性变化与控制","type":"single","stem":"在50%满功率下运行（　）等于一个等效满功率天（EFPD）。","options":["A二天","B一天","C半天","D四天"],"answer":["A"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第30页指出\"一个等效满功率天(EFPD)等于在100%满功率下运行一天；若在50%满功率下运行，则一个等效满功率天(EFPD)等于运行二天\"。因此在50%满功率下运行二天等于一个EFPD，选A。\n\n【知识点】\n· 等效满功率天（EFPD）是将燃耗用达到该燃耗深度所需运行的满功率天数来表示。\n· 100%满功率运行一天等于1个EFPD；50%满功率运行二天等于1个EFPD。\n· 等效满功率小时（EFPH）与EFPD同理，用于度量燃料的燃耗程度。"},{"id":"basics_wl04_0009","module":"basics","bank":"核电基础-反应性变化与控制","type":"judge","stem":"压水堆堆芯的设计处于欠慢化区，因而慢化剂温度系数是负的。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第52页指出\"对于压水堆而言，堆芯的设计处于欠慢化区，因而温度系数是负的\"。在欠慢化区，水温升高时密度减小、水铀比减小、有效增殖因数k减小，因而温度系数为负。判断正确。\n\n【知识点】\n· 压水堆堆芯设计处于欠慢化区，慢化剂温度系数为负。\n· 在欠慢化区，水温升高使水密度减小、水铀比减小，k减小，温度系数为负；过慢化区情况相反。\n· 负的反应性温度系数使反应堆具有温度变化的自稳性和一定范围内的功率自调性，是安全运行必不可少的条件。"},{"id":"basics_wl04_0010","module":"basics","bank":"核电基础-反应性变化与控制","type":"judge","stem":"全部控制毒物都投入堆芯时反应堆所达到的负反应性称为停堆深度。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第66页明确给出停堆深度的定义——\"全部控制毒物都投入堆芯时，反应堆所达到的负反应性，称为停堆深度\"，并指出\"停堆深度与反应堆运行时间和运行工况有关\"。判断正确。\n\n【知识点】\n· 停堆深度是全部控制毒物都投入堆芯时反应堆所达到的负反应性。\n· 要求在热态、平衡氙中毒工况下应有足够大的停堆深度，否则停堆后氙-135衰减可能导致反应性增加而重新临界。\n· 控制毒物包括控制棒、可燃毒物棒和化学补偿控制毒物等。"},{"id":"basics_wl04_0011","module":"basics","bank":"核电基础-反应性变化与控制","type":"judge","stem":"控制棒控制的特点是控制速度快、可靠有效，但对堆内功率分布扰动较大。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第68页指出\"控制棒控制的特点是控制速度快，可靠有效\"，同时\"带来的另一个问题是对反应堆的功率分布、中子通量密度分布扰动大，从而影响反应堆的运行品质\"。判断正确。\n\n【知识点】\n· 控制棒控制的特点是控制速度快、可靠有效，吸收体材料吸收截面大因而价值高。\n· 控制棒对堆内功率分布和中子通量密度分布扰动较大，影响反应堆运行品质。\n· 停堆棒组反应性价值大专门用于停堆；控制棒组用于功率细调，跟踪微小的反应性扰动。"},{"id":"basics_wl04_0012","module":"basics","bank":"核电基础-反应性变化与控制","type":"judge","stem":"化学补偿控制（冷却剂中加硼酸）的特点是变化快，适合用于紧急停堆。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第82页列出化学补偿控制的缺点，其中第一条即为\"变化慢\"；第80页也指出化控\"主要用于补偿时间过程较慢的那些反应性变化\"，包括燃耗效应、冷态到热态过渡的温度效应、Xe和Sm中毒效应等。化控变化慢，不适合用于紧急停堆。判断错误。\n\n【知识点】\n· 化学补偿控制（冷却剂中加硼酸）的缺点之一是变化慢，不适合紧急停堆。\n· 化控主要用于补偿较慢的反应性变化：燃耗和裂变产物效应、冷态到热态过渡的慢化剂温度效应、135Xe和149Sm中毒效应、可燃毒物燃耗效应。\n· 化控优点包括不引起局部中子通量密度分布畸变、不占栅格位置、可调节硼浓度、与燃料分区配合可降低功率峰因子等。"},{"id":"basics_wl04_0013","module":"basics","bank":"核电基础-反应性变化与控制","type":"judge","stem":"压水堆中，反应性功率系数为正值。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第54页明确指出\"压水堆中，功率系数为负值\"。功率系数是燃料温度系数、慢化剂温度系数和空泡系数的复合量，压水堆中这三者共同决定了功率系数为负。判断错误。\n\n【知识点】\n· 反应性功率系数是指功率变化1%额定功率时反应性的变化量，压水堆中为负值。\n· 功率系数是复合量，主要受燃料温度系数、慢化剂温度系数和空泡系数影响。\n· 功率系数为负保证了反应堆具有功率自调性，是安全运行的重要条件。"},{"id":"basics_wl04_0014","module":"basics","bank":"核电基础-反应性变化与控制","type":"multi","stem":"压水堆采用（　）三种方式联合控制反应性。","options":["A控制棒","B可燃毒物棒","C冷却剂中添加硼酸","D提高燃料富集度"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"反应性变化与控制课件","explanation":"依据课件《核反应堆的核物理基础·第四章 反应性变化和控制》：课件第67页指出\"目前在压水堆中采用控制棒、可燃毒物棒和冷却剂中添加硼酸3种方式联合控制反应性，以减少控制棒的数目\"。因此选A（控制棒）、B（可燃毒物棒）、C（冷却剂中添加硼酸），不选D（提高燃料富集度）。\n\n【知识点】\n· 压水堆采用控制棒、可燃毒物棒和化学补偿（硼酸）三种方式联合控制反应性。\n· 控制棒速度快用于紧急停堆和功率调节；可燃毒物棒补偿运行初期剩余反应性，自动进行无需外部控制。\n· 化学补偿控制补偿较慢的反应性变化（燃耗、温度效应、中毒效应等），三者配合以减少控制棒数目。"},{"id":"basics_yk_0001","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"核电厂是以核反应堆来代替常规火电厂的（　）。","options":["A锅炉","B汽轮机","C发电机","D凝汽器"],"answer":["A"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件1.1节'核电厂的基本概念'写明：'核电厂是以核反应堆来代替常规火电厂的锅炉，以核燃料在核反应堆中发生原子核裂变时产生的热量，来加热水变成蒸汽，蒸汽通过管路进入汽轮机，推动汽轮发电机发电。'\n即反应堆正是取代了常规火电厂锅炉'烧水制汽'的职能；汽轮机是将蒸汽热能转为机械能、发电机将机械能转为电能的设备，凝汽器属二回路辅助设备，均不构成'替代对象'，故本题选A。\n\n【知识点】\n· 核电厂以核反应堆代替常规火电厂的锅炉，靠核裂变产生的热量加热水变成蒸汽。\n· 核电厂产生的蒸汽常被称为核蒸汽，与常规火电厂不同之处在于释放热能的'燃烧炉'。\n· 常规火电厂燃烧化石燃料利用化学能，核电厂利用可裂变原子核的核能，通过一回路传输热能到蒸汽发生器产生蒸汽。\n· 能量转换链为：核能（燃料）→热能→机械能→电能。"},{"id":"basics_yk_0002","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"核电厂仪表与控制系统的功能可以归纳为三种类型，即（　）。","options":["A监视功能、控制功能和保护功能","B测量功能、显示功能和记录功能","C报警功能、联锁功能和停机功能","D数据采集、处理和传输功能"],"answer":["A"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件2.2节写明：'核电厂仪表与控制系统的功能可以归纳为三种类型:即监视功能、控制功能和保护功能。'\n监视功能用于监测显示大量参数，控制功能用于对变量进行控制调节，保护功能用于重要核参数和过程变量参与保护，三者与选项A完全对应；测量/显示/记录、报警/联锁/停机、数据采集/处理/传输等均属具体手段而非功能归纳类型，故本题选A。\n\n【知识点】\n· 核电厂仪表与控制系统的功能归纳为监视功能、控制功能、保护功能三种类型。\n· 整个核电厂有几百个系统，要监测显示的参数很多，有的变量需要控制调节，重要核参数和过程变量还要参与保护功能。\n· 仪控系统组成包括堆外核测系统、堆内核测系统、反应堆功率调节系统、反应堆保护系统、辐射监测系统、汽轮机监测调节和保护系统等。\n· 核电厂控制对象工艺管线复杂、参数联系紧密、可靠性要求高，要求高度自动化和集中控制。"},{"id":"basics_yk_0003","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"核电厂仪表和控制系统设备按其所在系统功能对电厂安全的重要性分为（　）。","options":["A一级","B两级","C三级","D四级"],"answer":["C"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件2.4节'安全分级'写明：'仪表和控制系统设备按其所在系统功能对电厂安全的重要性分为三级:安全级设备、安全有关的设备和非安全重要设备。'\n题干问'分为几级'，课件原文明确为三级（选项C）；两级是供电设备的分法（安全级和非安全重要），一级/四级均不成立，故本题选C。\n\n【知识点】\n· 仪表和控制系统设备按对电厂安全的重要性分为三级：安全级设备、安全有关的设备和非安全重要设备。\n· 安全级设备承担反应堆安全停堆、安全壳隔离、堆芯冷却、防止放射性物质过量排放等核安全功能。\n· 安全有关设备在实现或保持核电厂安全方面起补充、支持或间接作用，可避免或缓解事故后果。\n· 非安全重要设备在实现或保持核电厂安全方面无明显作用。\n· 不同安全级别设备在设计、加工、安装及运行中的功能、可靠性、性能等要求不同，特别关注1E级设备。"},{"id":"basics_yk_0004","module":"basics","bank":"核电基础-仪表与控制","type":"judge","stem":"核电厂仪控系统的供电设备按其对电厂安全的重要性分为安全级设备和非安全重要设备两级。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件2.4节'安全分级'写明：'仪表和控制系统设备按其所在系统功能对电厂安全的重要性分为三级……它们的供电设备按其所在系统功能对电厂安全的重要性分为两级:安全级设备和非安全重要设备。'\n题干表述'供电设备分为安全级设备和非安全重要设备两级'与课件原文完全一致，故本题判断为正确。\n\n【知识点】\n· 仪控设备的供电设备按其所在系统功能对电厂安全的重要性分为两级：安全级设备和非安全重要设备。\n· 设备本体分三级（安全级、安全有关、非安全重要），供电设备分两级，注意两者分级数目不同。\n· 安全有关仪表的供电设备可以是1E级的，也可以是非安全重要的，根据此类仪表对供电的要求决定。\n· 非安全重要仪表及其供电设备在实现或保持核电厂安全方面无明显作用。"},{"id":"basics_yk_0005","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"微差式测量法的特点是（　）。","options":["A反应快、测量精度高，特别适用于在线测量","B精度低但测量过程简单迅速","C可获得较高精度但只适用于慢信号测量","D须改变测试条件并求解联立方程组"],"answer":["A"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件3.1节'微差式测量法'写明：'这种测量方法是偏差式、零位式两种测量方法的组合。被测量对仪表比较装置的作用，大部分先与已知标准量抵消，剩余部分即两者的差值，再用偏差法测量'，并指出'这种方法反应快、测量精度高，特别适用于在线测量。'\n选项A与课件原文一致；选项B、C与课件对微差式'反应快、精度高'的定性相反，选项D描述的是组合测量法需改变测试条件、解联立方程的特点，均不属微差式特点，故本题选A。\n\n【知识点】\n· 微差式测量法是偏差式、零位式两种测量方法的组合。\n· 微差式测量中被测量大部分先与已知标准量抵消，剩余差值再用偏差法测量。\n· 用不平衡电桥测量电阻的方法就是微差式测量。\n· 微差式测量反应快、测量精度高，特别适用于在线测量。"},{"id":"basics_yk_0006","module":"basics","bank":"核电基础-仪表与控制","type":"judge","stem":"零位式测量法可获得较高的精度，但较复杂、费时，只适用于慢信号测量。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件3.1节'零位式测量法'写明：'被测量对仪表比较装置的作用，由已知标准量全部抵消，测量系统达到平衡，则被测量值就等于该已知标准量值'，并明确'这种方法可获得较高的精度，但较复杂、费时，只适用于慢信号测量。'\n题干表述与该课件原文完全一致，故本题判断为正确。\n\n【知识点】\n· 零位式测量中，被测量对比较装置的作用由已知标准量全部抵消，测量系统达平衡时被测量值等于已知标准量值。\n· 零位式测量电桥失衡时，伺服机构自动调节R3使电桥恢复平衡，由R3的变化量得出被测量值。\n· 零位式可获得较高的精度，但较复杂、费时，只适用于慢信号测量。\n· 与微差式（反应快、精度高、适用在线测量）相比，零位式更慢但精度高。"},{"id":"basics_yk_0007","module":"basics","bank":"核电基础-仪表与控制","type":"judge","stem":"偏差式测量法精度较高、过程复杂费时，只适用于科学实验或特殊场合。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件3.1节'偏差式测量法'写明：'这种方法为了有足够灵敏度的输出信号，要消耗被测对象较多的能量，而且精度较低（一般不高于0.5%）……但测量过程简单、迅速，在工程测量中得到广泛应用。'\n题干称偏差式'精度较高、过程复杂费时、只适用于科学实验或特殊场合'，与课件'精度较低、过程简单迅速、工程测量广泛应用'完全相反；'繁杂费时、只适用于科学实验或特殊场合'实为组合测量法的特点，故本题判断为错误。\n\n【知识点】\n· 偏差式测量中被测量作用于仪表比较装置，使其参数按已知关系变化并'显示'被测量，如磁电式电压表以指针偏转角显示电压。\n· 偏差式测量精度较低（一般不高于0.5%），但测量过程简单、迅速，在工程测量中得到广泛应用。\n· 偏差式要消耗被测对象较多的能量，以保证有足够灵敏度的输出信号。\n· 注意区分：'繁杂费时、只适用于科学实验或特殊场合'是组合测量法的特点，而非偏差式。"},{"id":"basics_yk_0008","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"在三种不同温度下测量铂电阻的电阻值，组成联立方程组求解温度系数a、b，这种测量方法属于（　）。","options":["A直接测量法","B间接测量法","C组合测量法","D零位式测量法"],"answer":["C"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件3.1节'组合测量法'写明：'组合测量是在测量中，使各个未知量（与被测量之间存在一定的关系）以不同的组合形式出现，根据测量得到的数据，求解联立方程组以求得被测量的数值。组合测量时，一般需要改变测试条件'，并以铂电阻为例：'在三种温度t1、t2、t3下，分别测出对应的电阻值Rt1、Rt2、Rt3组成联立方程组'求解温度系数a、b。\n题干'在三种不同温度下测量铂电阻电阻值、组成联立方程组求解a、b'与课件原文几乎一致，属组合测量法；直接/间接测量不需求解联立方程，零位式靠标准量抵消平衡，故本题选C。\n\n【知识点】\n· 组合测量是使未知量以不同组合形式出现，根据测得数据求解联立方程组以求得被测量数值。\n· 组合测量一般需要改变测试条件，才能得到一组联立方程所需要的数据。\n· 测定铂电阻温度系数时，按Rt=R0(1+at+bt²)，在三种温度下分别测出电阻值组成联立方程组求解a、b、R0。\n· 组合测量法是一种特殊的精密测量方法，但繁杂费时，只适用于科学实验或特殊场合。"},{"id":"basics_yk_0009","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"根据反应堆运行工况不同划分的反应性控制三种类型中，补偿控制的特点是（　）。","options":["A反应性当量大，动作过程十分缓慢","B动作迅速，及时补偿反应性瞬态变化","C能迅速引入负反应性实现紧急停堆","D通过改变堆内燃料浓度实现"],"answer":["A"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件3.2.2节'反应性控制的方法'写明：'（3）补偿控制：补偿控制元件用于补偿燃料、裂变产物积累所需的过剩反应性。也用于改变堆内功率分布……这种控制元件的反应性当量大，并且它的动作过程是十分缓慢的。'\n选项A与课件对补偿控制的定性完全一致；'动作迅速、及时补偿反应性瞬态变化'是功率控制（调节控制）的特点，'迅速引入负反应性实现紧急停堆'是紧急停堆控制的特点，故本题选A。\n\n【知识点】\n· 按反应堆运行工况不同，反应性控制分为紧急停堆控制、功率控制和补偿控制三种类型。\n· 补偿控制用于补偿燃料、裂变产物积累所需的过剩反应性，也用于改变堆内功率分布以获得更好的热工性能和更均匀的燃耗。\n· 补偿控制元件的反应性当量大，且动作过程十分缓慢。\n· 紧急停堆控制要求迅速引入负反应性；功率控制动作迅速，及时补偿负荷变化、温度变化和变更功率水平引起的反应性瞬态变化。"},{"id":"basics_yk_0010","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"可燃毒物通常选用（　），将其制成小片弥散在燃料中。","options":["A钆或硼","B银或铟","C镉或铪","D锂或钾"],"answer":["A"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件3.2.2节'反应性控制的方法'部分写明：'可燃毒物通常选用钆（Gd）或硼，将其制成小片弥散在燃料中。'\n选项A'钆或硼'与课件原文完全一致；银-铟-镉是控制棒（吸收体）常用材料，锂、钾不具高中子吸收截面，均不属可燃毒物选材，故本题选A。\n\n【知识点】\n· 可燃毒物是装入堆芯固定不动、中子吸收截面较大的物质，用于补偿堆芯寿命初期的过剩反应性。\n· 可燃毒物的吸收截面应比燃料的吸收截面大，从而能比核燃料更快地烧完，燃料循环末期其负反应性贡献可忽略。\n· 可燃毒物通常选用钆（Gd）或硼，制成小片弥散在燃料中；压水堆堆芯初始装载时用硼硅酸盐装入。\n· 采用可燃毒物可增加燃料燃耗周期、延长堆芯寿命，减少可移动控制棒数目、简化堆顶结构，还能改善堆芯功率分布。"},{"id":"basics_yk_0011","module":"basics","bank":"核电基础-仪表与控制","type":"multi","stem":"从纵深防御设计原则出发，反应堆控制保护系统一般要求实现的基本功能包括（　）。","options":["A预保护功能","B保护功能","C缓解事故后果功能","D汽轮机转速调节功能"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件7.1节'核反应堆保护系统'写明：'反应堆保护系统是监测电厂偏离可接受状态并发出指令维持反应堆安全的安全系统'，并明确'从纵深防御设计原则出发，控制保护系统一般要求实现以下三个基本功能：1）预保护功能……2）保护功能……3）缓解事故后果功能……'。\n选项A（预保护功能）、B（保护功能）、C（缓解事故后果功能）正是课件所列三功能；汽轮机转速调节属常规岛调节功能，不属反应堆控制保护系统的基本功能，故本题选ABC。\n\n【知识点】\n· 从纵深防御设计原则出发，控制保护系统一般要求实现预保护、保护、缓解事故后果三个基本功能。\n· 预保护功能：反应堆运行参数异常但尚不危及安全时，发出报警信号或提供必要的校正措施，使核电厂继续运行。\n· 保护功能：保护参数超过设计极限时能自动快速停堆，这是最为基本和重要的功能。\n· 缓解事故后果功能：出现超出停堆保护能力的事故时，启动安全注入系统、安全壳喷淋系统等专设安全设施，限制事故发展。"},{"id":"basics_yk_0012","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"根据所用能源的形式，执行器（执行机构）可分为（　）三大类型。","options":["A气动、电动和液动","B手动、自动和远动","C开环、闭环和前馈","D点型、线型和防爆型"],"answer":["A"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件3.7节'执行机构'写明：'执行机构是控制系统中用以执行控制指令的终端控制元件。它接受来自调节单元的控制信号……是自动控制系统中必不可少的重要组成部分'，并明确'根据所用能源的形式，可将执行器分为气动、电动和液动三大类型。'\n选项A与课件原文完全一致；手动/自动/远动是操作方式而非能源形式，开环/闭环/前馈是控制通道类型，故本题选A。\n\n【知识点】\n· 根据所用能源的形式，执行器分为气动、电动和液动三大类型。\n· 执行机构是控制系统中用以执行控制指令的终端控制元件，接受调节单元的控制信号按规定指令动作。\n· 执行器常配备阀门定位器、手轮机构等辅助装置，阀门定位器可使执行器按控制信号准确动作、提高控制精度。\n· 利用电气转换器或电气阀门定位器可将电信号转换成标准气压信号，使电动调节器与气动执行器配套使用。"},{"id":"basics_yk_0013","module":"basics","bank":"核电基础-仪表与控制","type":"single","stem":"电容式压力、差压变送器中敏感元件受压后经电子线路转换、放大，输出（　）直流信号。","options":["0～10mA","4～20mA","0～5V","1～5V"],"answer":["B"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件4.2节'一回路仪表的组成'写明：'电容式压力、差压变送器是核电厂一回路主、辅系统中的主要测压(差压)变送器。它的原理是：在电容式变送器中有一个可变电容的敏感元件，即δ小室，当δ小室两侧(或单侧)受压后，测量膜片(可动极板)产生位移，使电容量(或差动电容)发生变化，经电子线路转换、放大后输出4~20mA直流信号。'\n选项B'4～20mA'与课件原文完全一致，其余量程均非课件所述输出信号，故本题选B。\n\n【知识点】\n· 电容式压力、差压变送器是核电厂一回路主、辅系统中的主要测压（差压）变送器。\n· 其原理：δ小室受压后测量膜片位移使电容量变化，经电子线路转换、放大后输出4~20mA直流信号。\n· 4~20mA电流信号是过程控制系统中的标准信号，模拟量控制采用在0~5V电压或4~20mA电流间连续变化的信号。\n· 一回路测压仪表还有弹簧管压力表（现场指示）和电感式压力表（精度要求不高的场合）。"},{"id":"basics_yk_0014","module":"basics","bank":"核电基础-仪表与控制","type":"judge","stem":"稳压器的液位采用差压法进行测量。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件4.3节'液位测量'写明：'稳压器的液位采用差压法进行测量。'\n题干表述与课件原文完全一致；课件还说明大多数液位测量基于对液体静压头的压力测量，可将液位测量转换为对基准线以上液体压力的测量，故本题判断为正确。\n\n【知识点】\n· 稳压器的液位采用差压法进行测量。\n· 大多数液位测量基于对液体静压头的压力测量，液位测量可转换成对基准线以上液体压力的测量：H=P/γ。\n· 液位高度计算公式：H=(△P+Hr·γr)/γ，式中△P为变送器测得的差压、γ为液体密度。\n· 一回路采用冗余通道测量的典型参数中包括稳压器压力（窄量程）和稳压器液位（热态）。"},{"id":"basics_yk_0017","module":"basics","bank":"核电基础-仪表与控制","type":"judge","stem":"核电厂电站计算机系统的工作方式为在线、闭环运行，并参与电厂控制。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件9.1节'核电厂信息采集和电站计算机系统'写明：'电站计算机系统用于采集一回路、二回路的主要参数，设备及阀门状态，在正常和事故工况下对采集的数据进行处理和计算……工作方式为在线、开环运行'，并明确'本系统不参与电厂控制。'\n题干称其工作方式'为在线、闭环运行，并参与电厂控制'，'闭环'与'参与电厂控制'均与课件原文相反，故本题判断为错误。\n\n【知识点】\n· 电站计算机系统工作方式为在线、开环运行，不参与电厂控制。\n· 系统采集一回路、二回路主要参数及设备、阀门状态，在正常和事故工况下对采集数据进行处理和计算。\n· 系统通过计算机屏幕显示和打印机打印，为操作员提供大量直观的实时动态信息，用于监视工艺回路正常运行和事故后的现场分析。\n· 核电站计算机系统以100M（系统网）、10M（数据采集网）冗余工业以太双光纤环网为骨干网组成分布式系统，划分多个功能层次。"},{"id":"basics_yk_0018","module":"basics","bank":"核电基础-仪表与控制","type":"judge","stem":"保护系统给出停堆信号后，全部控制棒在重力作用下大约2s内掉入堆芯。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"仪表与控制课件","explanation":"依据课件《核电厂仪表与控制基础》：课件7.5节反应堆控制保护相关内容写明：'当保护系统给出停堆信号时，首先切断所有停堆棒组（S棒组）和控制棒组（R、N和G棒组）的供电断路器。使全部停堆棒和控制棒在重力作用下插入堆芯，反应堆进入次临界而停闭。全部控制棒组件,大约在2s内掉入堆芯。'\n题干'保护系统给出停堆信号后，全部控制棒在重力作用下大约2s内掉入堆芯'与课件原文一致，故本题判断为正确。\n\n【知识点】\n· 保护系统给出停堆信号时，首先切断所有停堆棒组（S棒组）和控制棒组（R、N和G棒组）的供电断路器。\n· 全部停堆棒和控制棒在重力作用下插入堆芯，反应堆进入次临界而停闭。\n· 全部控制棒组件大约在2s内掉入堆芯；事故停堆时切断给控制棒驱动机构供电的总电源。\n· 这体现了反应堆保护系统的基本功能：当保护参数超过设计极限时能自动快速停堆，这是最为基本和重要的功能。"},{"id":"basics_yx_0002","module":"basics","bank":"核电基础-运行概述","type":"single","stem":"压水堆核电厂中，链式裂变反应是由（　）维持的","options":["快中子","热中子","γ射线","缓发中子"],"answer":["B"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件在核能产生原理部分明确指出\"压水堆核电厂，链式裂变反应是由热中子维持的\"，故本题选B（热中子）。课件还指出\"反应堆只有在临界下，才能实现自持链式反应\"，说明维持链式反应须以临界为前提。\n\n【知识点】\n· 压水堆核电厂中，链式裂变反应由热中子维持。\n· 反应堆只有在临界状态下才能实现自持链式反应。\n· 核电厂是利用反应堆内原子核裂变产生热能转换成电能。"},{"id":"basics_yx_0003","module":"basics","bank":"核电基础-运行概述","type":"single","stem":"在压水堆核电厂最终安全分析报告（FSAR）第15章事故分析中，所分析的事件分为（　）","options":["两类：正常运行和异常运行","三类：频发、中等频度和稀有事件","四类：正常运行和运行瞬态、中等频度事件、稀有事件、极限事故","七类：按INES分级"],"answer":["C"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"4.2 核电厂运行工况分类\"中写明\"在压水堆核电厂最终安全分析报告（FSAR）中的第15章事故分析中，通常包括瞬态和事故分析。所分析的事件分为四类：工况I—正常运行和运行瞬态、工况Ⅱ—中等频度事件、工况Ⅲ—稀有事件、工况IV—极限事故\"，故本题选C。\n\n【知识点】\n· FSAR第15章事故分析的事件分为四类工况。\n· 工况I为正常运行和运行瞬态，工况Ⅱ为中等频度事件，工况Ⅲ为稀有事件，工况IV为极限事故。\n· 四类工况按事件发生频率由高到低、后果严重程度由低到低高排列，如汽轮机跳闸属工况Ⅱ、弹棒属工况IV。"},{"id":"basics_yx_0004","module":"basics","bank":"核电基础-运行概述","type":"single","stem":"在核电厂运行工况分类中，下列属于工况IV（极限事故）的事件是（　）","options":["蒸汽发生器传热管泄漏","弹棒事故（控制棒组件弹出）","汽轮机跳闸、甩负荷","单个控制棒落棒"],"answer":["B"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件工况IV（极限事故）列举的事故有\"蒸汽系统大管道破裂、给水系统管道破裂、反应堆冷却剂泵轴卡住（转子卡住）、反应堆冷却剂泵轴断裂、各种棒束控制组件弹出堆外、蒸汽发生器传热管破裂、失水事故、燃料装卸事故、乏燃料容器坠落事故\"，其中\"各种棒束控制组件弹出堆外\"即弹棒事故，故本题选B。而汽轮机跳闸属工况Ⅱ、单个控制棒（棒束控制组件下落）属工况Ⅱ，蒸汽发生器传热管\"泄漏\"（非破裂）属于小泄漏类事件。\n\n【知识点】\n· 工况IV极限事故一般是不会发生的设计假想事故，一旦发生后果严重，但不会使裂变产物向环境释放危及公众健康和安全。\n· 弹棒事故（控制棒组件弹出堆外）属于工况IV极限事故。\n· 汽轮机跳闸、棒束控制组件下落属工况Ⅱ中等频度事件；反应堆冷却剂小泄漏属工况Ⅲ稀有事件。"},{"id":"basics_yx_0005","module":"basics","bank":"核电基础-运行概述","type":"single","stem":"核电厂技术规格书由谁编写、由谁审批？（　）","options":["由核电厂营运单位编写，国家核安全局审批","由国家核安全局编写，营运单位审批","由设计单位编写，营运单位审批","由集团公司编写，国家能源局审批"],"answer":["A"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"5.1 概述\"中明确写明\"技术规格书是核电站运行和设计的接口文件之一，由核电站的设计方编写，国家核安全局审批，核电站相关部门执行\"，并指出运行技术规格书是电厂法规性文件、执照文件，经核安全局批准后生效执行。本题答案A称\"由核电厂营运单位编写\"，与课件\"由设计方编写\"的表述不符（按课件应为设计方编写、国家核安全局审批），答案与课件原文存在出入，已列入建议剔除清单。\n\n【知识点】\n· 按课件表述，技术规格书由核电站设计方编写，国家核安全局审批，核电站相关部门执行。\n· 运行技术规格书是电厂法规性文件、执照文件，经核安全局批准后生效执行。\n· 遵守技术规格书是维持和保证电站正常运行期间核安全的最低要求。\n· 国内核安全法规/导则（HAF/HAD）中更多使用\"运行限值和条件\"的表述，如HAD103/01。"},{"id":"basics_yx_0010","module":"basics","bank":"核电基础-运行概述","type":"single","stem":"国际上压水堆核电厂选定的标准临界点是中间量程电离室电流达到（　）","options":["1×10⁻⁹A","1×10⁻⁸A","1×10⁻⁷A","1×10⁻⁵A"],"answer":["B"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件第六章\"临界点的选取\"指出：\"当中间量程电离室电流读数为1×10-8A时，利用控制棒使反应堆处于稳定状态，然后记录控制棒位、硼浓度、反应堆冷却剂平均温度等参数……现在国际上压水堆核电厂都选取1×10-8A（I.R.）作为标准临界点\"，故本题选B。\n\n【知识点】\n· 国际上压水堆核电厂选取中间量程电离室电流1×10⁻⁸A作为标准临界点。\n· 选该临界点的理由之一：达到1×10⁻⁸A时堆内中子注量率水平足够高，可不考虑源中子的影响。\n· 理由之二：1×10⁻⁸A仍低于核加热点（POAH，约10⁻⁵A），反应堆发热量小，慢化剂平均温度不变化，可不考虑温度系数影响。\n· 反应堆功率升到中间量程1×10⁻⁸A时应维持中子注量率稳定并记录临界数据（棒位、平均温度、硼浓度）。"},{"id":"basics_yx_0011","module":"basics","bank":"核电基础-运行概述","type":"single","stem":"核电厂安全设计思想中，纵深防御分为（　）","options":["三个层次","四个层次","五个层次","七个层次"],"answer":["C"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"7.3 核电厂安全设计思想\"指出：\"纵深防御分为5个层次，可以简要的归纳为'预防事故、监测事故、防止事故扩大、缓解事故、应急计划'\"，故本题选C（五个层次）。课件还说明纵深防御提出的出发点是基于\"核电厂的设计总是有瑕疵的、设备有时会出故障、操纵人员有发生人因失误的可能\"这一认识。\n\n【知识点】\n· 纵深防御分为5个层次，可归纳为预防事故、监测事故、防止事故扩大、缓解事故、应急计划。\n· 纵深防御概念应用另一方面是在设计中设置一系列实体屏障（多道屏障）以包容放射性物质。\n· 三道实体屏障为：燃料元件包壳、一回路压力边界、安全壳（反应堆厂房）。\n· 核电厂安全设计基本原则包括单一故障准则、多样性原则、独立性原则、故障安全原则等。"},{"id":"basics_yx_0013","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"正常情况下，压水堆核电站只在一回路中存在放射性。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件核电原理部分明确指出\"正常情况下，压水堆核电站只在一回路中存在放射性\"。这是压水堆核电厂与化石燃料电厂的重要区别之一，也是二回路水汽系统在正常运行时放射性水平很低的依据，故本题判断为正确。\n\n【知识点】\n· 正常情况下，压水堆核电站只在一回路中存在放射性。\n· 一回路（反应堆冷却剂系统）是放射性物质的主要承载体，燃料元件包壳和一回路压力边界起包容作用。\n· 若元件包壳存在加工缺陷或运行工况变化激烈造成元件破损，裂变产物会转移到冷却剂中，造成一回路放射性升高。\n· 三道屏障（燃料包壳、一回路压力边界、安全壳）正常完好时放射性物质被包容在一回路内。"},{"id":"basics_yx_0014","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"核电厂停堆后，堆芯剩余释热由剩余裂变发热和衰变热两部分组成。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"4.1 核电厂运行特点\"指出：\"堆芯剩余释热是指反应堆停堆后堆芯内的释热。它由两部分组成：一部分是剩余裂变发热；另一部分是衰变热\"。剩余裂变发热是停堆后剩余中子（瞬发中子和缓发中子）继续引起裂变所致；衰变热包括裂变产物和中子俘获反应产物放射性衰变释放的热量，故本题判断为正确。\n\n【知识点】\n· 堆芯剩余释热由剩余裂变发热和衰变热两部分组成。\n· 剩余裂变发热由停堆后剩余中子（瞬发中子和缓发中子）继续引起裂变产生。\n· 衰变热包括裂变产物和中子俘获反应产物放射性衰变释放的热量。\n· 停堆换料期间不能停止冷却，否则衰变热会引起冷却剂沸腾甚至燃料元件过热烧毁，为此设有余热排出系统。"},{"id":"basics_yx_0015","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"绝大多数核电厂使用过热蒸汽，而现代化石燃料电厂使用饱和蒸汽。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件在压水堆核电厂与化石燃料电厂的区别中明确指出：\"绝大多数核电厂使用饱和蒸汽，而现代化石燃料电厂使用过热蒸汽，由于饱和蒸汽的热焓比过热蒸汽低，因而相同规模的核电厂使用的蒸汽管道、汽轮机、调节阀门等的尺寸都比较大\"。本题表述恰好说反，故判断为错误。\n\n【知识点】\n· 绝大多数核电厂使用饱和蒸汽，现代化石燃料电厂使用过热蒸汽。\n· 饱和蒸汽的热焓比过热蒸汽低，同规模核电厂的蒸汽管道、汽轮机、调节阀门等尺寸较大。\n· 压水堆核电厂与化石燃料电厂的区别还包括：堆内有大量放射性物质、存在相当可观的剩余释热、系统设备复杂、运行瞬变快等。"},{"id":"basics_yx_0016","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"核电厂运行特点是二回路是主动的，一回路跟踪二回路变化，即反应堆功率跟踪汽轮机负荷变化。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件第六章\"6.4.4 运行中的负荷瞬变\"明确指出：\"核电厂运行特点是，二回路是主动的，一回路是跟踪二回路变化的，即反应堆功率跟踪汽轮机负荷变化\"。课件停闭操作中也体现\"反应堆功率自动跟踪汽轮机功率\"，故本题判断为正确。\n\n【知识点】\n· 核电厂运行特点是二回路主动、一回路跟踪二回路，即反应堆功率跟踪汽轮机负荷变化。\n· 核电厂负荷变化是正常运行中经常进行的操作，电厂设计上考虑了这种运行要求。\n· 棒控系统设计满足负荷线性变化（≤±5%/min）和负荷阶跃变化（变化量≤±10%、变化率±200%/min）。\n· 停闭降负荷过程中同样由反应堆功率自动跟踪汽轮机功率，并遵守最大5%FP/min的负荷变化率。"},{"id":"basics_yx_0017","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"除再启动物理试验情况外，当堆芯功率大于等于50%Pn时，象限功率倾斜比必须低于1.02。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"5.2 定义\"明确写明：\"除再启动物理试验情况外，当堆芯功率大于等于50%Pn时，象限功率倾斜比必须低于1.02。再启动物理试验期间，需遵守《物理试验监督技术要求》的特殊规定\"，与本题表述一致，故判断为正确。\n\n【知识点】\n· 象限功率倾斜比指上（下）半部堆外探测器标定输出值的最大值与平均值之比，两者取大者。\n· 除再启动物理试验外，堆芯功率≥50%Pn时象限功率倾斜比必须低于1.02。\n· 某电厂运行限制条件：堆功率大于70%FP、倾斜值介于1.02与1.09之间时，须在8小时内降功率至70%FP以下。\n· 象限功率倾斜比超标反映堆芯中子通量空间畸变，需通过反应堆控制规范加以控制。"},{"id":"basics_yx_0018","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"定期试验是实施核电厂监督大纲的主要手段。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"4.3 核电厂的运行文件\"明确指出：\"定期试验是实施核电厂监督大纲的主要手段。定期试验规程用于定期地检查系统的可用性，或用于在检修工作完成后对系统的功能进行重新鉴定\"，与本题表述一致，故判断为正确。\n\n【知识点】\n· 定期试验是实施核电厂监督大纲的主要手段。\n· 定期试验规程用于定期检查系统可用性，或检修完成后对系统功能重新鉴定。\n· 核电厂运行规程体系包括运行规程和定期试验规程两大类。\n· 运行规程是核电厂各种运行工况下运行人员进行操作控制的依据。"},{"id":"basics_yx_0019","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"运行技术规格书适用于异常或事故工况。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"运行技术规格书的适用范围\"明确写明：\"运行技术规格书不适用于异常或事故工况，在这种工况下的安全保证是通过事故程序来实现的。事故程序覆盖的异常或事故工况下的安全目标优先于运行技术规格书的安全目标，但是对于事故规程中未涉及的设备和参数，运行技术规格书依然适用\"。故本题判断为错误。\n\n【知识点】\n· 运行技术规格书不适用于异常或事故工况，异常或事故工况下的安全通过事故程序保证。\n· 事故程序的安全目标优先于运行技术规格书的安全目标。\n· 对事故规程中未涉及的设备和参数，运行技术规格书依然适用。\n· 遵守技术规格书是维持和保证电站正常运行期间核安全的最低要求。"},{"id":"basics_yx_0020","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"核电厂的三道安全屏障是燃料元件包壳、一回路压力边界和安全壳。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"7.3.2 多道屏障\"明确指出：\"第一道屏障是燃料元件包壳。第二道屏障是将反应堆冷却剂全部包容在内的一回路压力边界。第三道屏障是安全壳，即反应堆厂房\"；\"5.3 安全限值\"中也写明\"针对核电厂的三道安全屏障，即燃料包壳、一次冷却剂压力边界、安全壳，分别设置了各自的安全限值\"，与本题表述一致，故判断为正确。\n\n【知识点】\n· 核电厂三道安全屏障为燃料元件包壳、一回路压力边界、安全壳（反应堆厂房）。\n· 针对三道屏障分别设置了各自的安全限值，如DNBR限值（包壳）、一回路压力温度限值（压力边界）、安全壳压力和泄漏率限值（安全壳）。\n· 多道屏障是纵深防御思想在实体设计上的应用，用以包容放射性物质。\n· 安全壳按LOCA严重工况设计：相对压力0.42MPa、最高平均温度145℃、24小时泄漏率小于气体质量的0.3%。"},{"id":"basics_yx_0021","module":"basics","bank":"核电基础-运行概述","type":"judge","stem":"切尔诺贝利核电厂4号机组采用的堆型是压水堆（PWR）。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"8.1 切尔诺贝利核电厂事故\"指出：事故机组为\"1000 MW的石墨管道式沸水反应堆(RBMK)\"，并进一步说明\"RBMK是一种石墨慢化、轻水冷却的压力管式反应堆\"，采用沸腾轻水作冷却剂、蒸汽直接供汽轮机，与压水堆（PWR）完全不同，故本题判断为错误。\n\n【知识点】\n· 切尔诺贝利核电厂4号机组采用的堆型是RBMK——石墨慢化、轻水冷却的压力管式沸水反应堆，不是压水堆。\n· RBMK反应堆功率和反应性由211根吸收棒控制，吸收棒完全插入约需20秒。\n· 切尔诺贝利事故的主要原因是堆型存在严重设计缺陷，运行人员违反操作规程也是直接原因，根本原因归于缺乏安全文化。\n· 事故发生于1986年4月26日，是核电历史上最严重的核事故。"},{"id":"basics_yx_0022","module":"basics","bank":"核电基础-运行概述","type":"multi","stem":"下列系统中，属于专设安全设施的有（　）","options":["安全注入系统","安全壳喷淋系统","辅助给水系统","凝结水系统"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"运行概述课件","explanation":"依据课件《核电厂运行概述》：课件\"5.2 定义\"中专设安全设施定义写明：\"事故后，用来限制事故后果并将反应堆恢复到可靠的安全状态的安全系统称之为专设安全设施。这些安全系统包括：安全注入系统（RIS）；安全壳安喷系统（EAS）；安全壳内氢含量和大气监测系统（ETY）；安全壳消氢系统（EUH）；蒸汽发生器辅助给水系统（ASG）……\"。故安全注入、安全壳喷淋、辅助给水均属专设安全设施；凝结水系统属二回路常规系统（课件将其列于二回路凝结水系统、除氧器等常规设备），故本题选ABC。\n\n【知识点】\n· 专设安全设施是事故后用来限制事故后果并将反应堆恢复到可靠安全状态的安全系统。\n· 专设安全设施包括安全注入系统（RIS）、安全壳安喷系统（EAS）、安全壳内氢含量和大气监测系统（ETY）、安全壳消氢系统（EUH）、蒸汽发生器辅助给水系统（ASG）等。\n· 凝结水系统属于二回路常规系统，不具备专设安全功能。\n· 安全系统整定值超限时可触发专设安全设施动作，以限制预计的瞬态过程。"},{"id":"notes_fs_0001","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"RP2级人员担当工作负责人时，其辐射安全责任范围是：","options":["仅对其自身的辐射安全，和其自身活动可能产生的辐射影响负责","对其负责班组所有成员（包括自身在内）的辐射安全，及其班组作业可能产生的辐射影响负责","仅对其所在班组所有成员的辐射安全，及其自身活动可能产生的辐射影响负责","对其自身的辐射安全，及交叉作业班组活动可能产生的辐射影响负责"],"answer":["B"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第8页、第13-14页：课件明确指出\"RP2级人员担当工作负责人时，对其负责班组所有成员（包括自身在内）的辐射安全，及其班组作业可能产生的辐射影响负责\"。第8页列明RP2级辐射安全责任包括：1）负责班组辐射安全，确保班组人员不发生非计划照射、体表污染、体内污染；2）突发辐射异常时组织本班组人员正确响应；3）本班组作业避免增加其他人员的辐射安全风险。\n\n【知识点】\n· RP2级培训对象是辐射工作的工作负责人员，须先取得RP1级授权\n· RP2级人员责任范围覆盖班组全体成员（含自身），不仅限于自身\n· 交叉作业时还需确保本班组作业不增加其他人员的辐射安全风险"},{"id":"notes_fs_0002","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"以下关于RP2级人员辐射安全职责描述不正确的是：（　）","options":["RP2级人员仅需对本班组的辐射安全负责","RP2级人员需要组织落实辐射防护最优化措施，发现班组成员现场工作出现偏差及时提醒并纠正，做好安全管控","RP2级人员在发现辐射异常情况时要组织本班组人员正确响应，确保人员辐射安全","RP2级人员要检查、督促班组成员遵守电厂辐射防护管理规定和要求"],"answer":["A"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第8页、第15-16页：课件练习题明确指出A选项\"RP2级人员仅需对本班组的辐射安全负责\"是错误描述。第8页原文列明RP2级人员责任包括：负责班组辐射安全、突发异常时组织正确响应、本班组作业避免增加其他人员的辐射安全风险。\"仅需对本班组辐射安全负责\"遗漏了\"避免增加其他人员辐射安全风险\"这一职责。\n\n【知识点】\n· RP2级人员不仅对本班组辐射安全负责，还需避免增加其他人员风险\n· RP2级人员需组织落实ALARA措施、纠正班组成员工作偏差\n· RP2级人员发现辐射异常时须组织班组正确响应\n· RP2级人员有检查督促班组成员遵守辐射防护管理规定的职责"},{"id":"notes_fs_0003","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"辐射防护最优化意味着要不惜一切代价使个人剂量尽可能低。","options":null,"answer":["错误"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第7页、第17-18页：课件原文指出\"最优化原则称为ALARA原则……在考虑到经济和社会因素之后，使辐射实践和辐射源产生的照射大小、受照人数和照射的可能性保持在可合理达到的尽量低的水平\"。课件练习题明确该判断题为\"错误\"，强调\"可合理达到的尽量低水平\"而非\"不惜一切代价\"。\n\n【知识点】\n· ALARA=As Low As Reasonably Achievable，即可合理达到的尽量低\n· 最优化需考虑经济和社会因素，是利益与代价的权衡\n· 目标是使纯利益最大、代价最小，而非零剂量\n· 通过缩短时间、增加距离、增加屏蔽、降低源项等方法实现"},{"id":"notes_fs_0004","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"区域污染事件包括：（　）","options":["辐射控制区内污染水平超过40贝克每平方厘米，且污染面积超过1平方米","辐射控制区内污染水平超过4贝克每平方厘米，且污染面积超过10平方米","辐射控制区外污染水平超过0.4贝克每平方厘米","A+B+C"],"answer":["D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第27页、第32-33页：课件原文明确\"区域污染事件\"判断标准为：辐射控制区内污染水平超过40贝克每平方厘米且污染面积超过1平方米；辐射控制区内污染水平超过4贝克每平方厘米且污染面积超过10平方米；辐射控制区外污染水平超过0.4贝克每平方厘米。三项均属于区域污染事件，故答案为D（A+B+C）。\n\n【知识点】\n· 区域污染事件分控制区内、控制区外三个层级\n· 控制区内高污染：>40 Bq/cm²且面积>1㎡\n· 控制区内低污染：>4 Bq/cm²且面积>10㎡\n· 控制区外污染：>0.4 Bq/cm²"},{"id":"notes_fs_0005","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"特别重大辐射事故，是指Ⅰ类、Ⅱ类放射源丢失、被盗、失控造成大范围严重辐射污染后果，或者放射性同位素和射线装置失控、辐射防护管理或技术失效导致（　）人员急性死亡。","options":["3人以上（含3人）","2人以下（含2人）","9人以下（含9人）","5人以下（含5人）"],"answer":["A"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第22页、第34-35页：课件原文明确\"特别重大辐射事故是指：I类、II类放射源丢失、被盗、失控造成大范围严重辐射污染后果；放射性同位素和射线装置失控、辐射防护管理或技术失效导致3人以上(含3人)急性死亡\"。课件练习题答案为A（3人以上含3人）。\n\n【知识点】\n· 特别重大辐射事故：I/II类源失控或导致≥3人急性死亡\n· 重大辐射事故：I/II类源失控或导致≤2人急性死亡或≥10人急性重度放射病\n· 较大辐射事故：III类源失控或导致≤9人急性重度放射病\n· 一般辐射事故：IV/V类源失控或人员受照超过年限值"},{"id":"notes_fs_0006","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"对辐射工作人员来说，每年的有效剂量限值是任何一年不得超过30mSv，连续5年内平均不得超过20mSv。","options":null,"answer":["错误"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第29页、第36-37页：课件原文引用GB18871-2002标准\"对辐射工作人员来说，每年的有效剂量限值是任何一年不得超过50豪西弗，连续5年内平均不得超过20豪西弗\"。课件练习题明确该判断题为\"错误\"，错误点在于将50mSv写成了30mSv。\n\n【知识点】\n· 辐射工作人员年限值：任一年≤50mSv，5年平均≤20mSv\n· 眼晶体当量剂量年限值≤150mSv\n· 皮肤和四肢当量剂量年限值≤500mSv\n· 国家标准限值之下电厂还设有更严格的剂量约束值和管理目标值"},{"id":"notes_fs_0007","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"辐射防护指标重点关注人的辐射安全和物的辐射安全。","options":null,"answer":["正确"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第21页、第38-39页：课件原文指出\"辐射防护指标的设置最终的目标是确保人的安全和物的安全\"。课件练习题明确该判断题为\"正确\"。辐射防护指标包括一般及以上辐射事故、非计划照射事件、体内污染事件、体表污染事件、区域污染事件、放射性物品失控事件、最大个人剂量、集体剂量等。\n\n【知识点】\n· 辐射防护指标最终目标：确保人的安全和物的安全\n· 指标涵盖事故类、事件类、剂量类三大维度\n· 人的安全：个人剂量、体内/体表污染\n· 物的安全：区域污染、放射性物品失控"},{"id":"notes_fs_0008","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"辐射工作全流程管理不包括：（　）","options":["在工作准备阶段，需要对辐射工作进行辐射风险分析","执行现场工作前，办理辐射工作许可证","到达设备检修作业场地，立刻开始作业","作业结束后对检修的工器具，检修场地、工作票等做好清点、归还和关闭"],"answer":["C"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第43页、第68页、第83-84页：课件原文描述辐射工作全流程管理包括工作准备阶段的风险分析（第43页）、执行前办理辐射工作许可证（第57页）、工作实施时按RWP和控制点文件开展先决条件检查（第68页\"开工前，强调措施。按辐射工作许可证和控制点文件开展先决条件检查\"）、工作结束后清点归还关闭（第75页）。\"到达场地立刻开始作业\"违反先决条件检查要求，故C为正确答案（即不包括的内容）。\n\n【知识点】\n· 辐射工作全流程：准备→许可→实施→总结\n· 开工前必须按RWP和控制点文件进行先决条件检查\n· 工前需使用便携式剂量率仪进行辐射水平测量\n· 工作结束后做到\"工完料尽场地清\""},{"id":"notes_fs_0009","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"正在检修设备的班组成员佩戴的电子剂量计EPD出现报警，作为工作负责人，你该如何处理：（　）","options":["当什么都没发生，指令其继续工作","征询班组成员意见，讨论是否继续作业","确保设备处于安全状态下，立即暂停工作，撤离至安全区域并报告辐射防护人员","打电话给主控，请求值长下达指令"],"answer":["C"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第74页、第85-86页：课件原文指出\"工作人员携带的电子剂量计、便携式γ剂量率仪发生报警时，需立即撤离工作现场，并报告RP人员，进行现场调查\"。课件还给出案例：某电厂保温人员在高辐射区域工作，电子剂量计声光报警后人员未撤离，继续工作9分钟，导致受照剂量达3.422豪西弗。练习题答案为C。\n\n【知识点】\n· EPD报警响应：确保设备安全状态→暂停工作→撤离→报告RP人员\n· 严禁报警后继续作业（有3.422mSv案例教训）\n· RP人员根据调查结果评估是否可继续工作\n· 复杂辐射风险工作需编制特殊异常响应预案"},{"id":"notes_fs_0010","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"辐射工作许可证（RWP）由高到低分别为4级、3级、2级和1级。","options":null,"answer":["错误"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第59页、第87-88页：课件原文明确\"辐射工作许可证由低到高分别为4级\"，即4级属于低辐射风险、3级中度、2级和1级为高辐射风险。由高到低应为1级、2级、3级、4级。课件练习题明确该判断题为\"错误\"，错误点在于将高低顺序颠倒。\n\n【知识点】\n· RWP分级：1级（最高风险）→4级（最低风险）\n· 分级要素：集体剂量、最大个人剂量、表面污染、空气污染、辐射分区、涉源\n· 按六要素中达到的最高级别定级\n· 不同级别审批权限不同：4/3级由RP工程师批准，1级需保健物理处负责人批准"},{"id":"notes_fs_0011","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"辐射防护停工待检点任何情况都禁止逾越，必须经辐射防护人员检查、签字确认符合要求后才能继续后继工作。","options":null,"answer":["正确"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第66页、第89-90页：课件原文明确\"RP-H点（停工待检点）……应由辐射防护人员到场给予放行才允许进行控制点以后的工作。放行基于辐射防护人员和工作负责人确认相关条件和措施都满足要求，并在控制点上签字\"。课件还强调\"多数跨越H点行为属于红黄线违章\"。练习题答案为\"正确\"。\n\n【知识点】\n· RP-H点：辐射防护停工待检点，须RP人员到场签字放行\n· RP-W点：辐射防护现场见证点，须RP人员见证检查\n· H点设置范围：燃料操作、堆内构件吊装、放射性容器开口等7类\n· 跨越H点行为属红黄线违章"},{"id":"notes_fs_0012","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"ALARA（辐射防护最优化）的含义是：（　）","options":["在考虑经济和社会因素后，个人受照剂量的大小、受照人数以及受照的可能性均保持在可合理达到的尽量低水平","不惜一切代价将个人剂量降到最低","只要不超过国家剂量限值即可，无需进一步优化","尽量减少进入辐射控制区的人次数"],"answer":["A"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注（简答改编）","explanation":"依据课件《辐射防护二级》第7页、第93页、第109-110页：课件原文指出\"最优化原则称为ALARA原则……在考虑到经济和社会因素之后，使辐射实践和辐射源产生的照射大小、受照人数和照射的可能性保持在可合理达到的尽量低的水平\"。课件练习题答案为\"ALARA是可合理达到的尽量低\"。A选项完整描述了ALARA的含义。\n\n【知识点】\n· ALARA = As Low As Reasonably Achievable\n· 考虑经济、社会、政治因素后的尽量低\n· 三个方面：确定防护水平、提供措施、确保措施施行\n· ALARA是利益与代价权衡下的最优解，非零剂量"},{"id":"notes_fs_0013","module":"safety","bank":"辐射防护二级（课件题）","type":"multi","stem":"减少作业人工时（从而降低集体剂量）的做法包括：（　）","options":["细致的工作准备，包括文件、器材、工器具","持续进行人员培训，提高工作技能，通过沙盘推演、模拟培训或操作演练","良好的工作实施管理，包括人员分工及作业行为（讨论待命在低剂量等待区等）","无限制地增加人员轮换次数"],"answer":["A","B","C"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注（简答改编）","explanation":"依据课件《辐射防护二级》第99页、第113-114页：课件原文明确减少人工时的方法包括：1）细致的工作准备（文件、器材、工器具）；2）持续进行人员培训（沙盘推演、模拟培训、操作演练）；3）良好的工作实施管理（人员分工及规范作业行为、待命在低剂量等待区）。第115-116页明确\"无限制增加人员轮换不是ALARA的体现\"。故ABC正确，D错误。\n\n【知识点】\n· 减少人工时=降低集体剂量（集体剂量=人工时×剂量率）\n· 工作准备：文件齐备、器材就绪、工器具充足\n· 人员培训：沙盘推演、模拟培训提高技能缩短工时\n· 人员轮换仅在可能超个人剂量控制值时合理使用"},{"id":"notes_fs_0014","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"为了降低个人受照剂量，可以无限制地增加人员采取轮换方式开展工作，这是ALARA的体现。","options":null,"answer":["错误"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第115-116页：课件原文明确\"只有在特殊情况下，例如可能超过个人剂量控制值时，合理的采取人员轮换方式进行作业，可降低个人受照剂量\"。无限制轮换会增加集体剂量，违背ALARA原则（ALARA是利益与代价的权衡，不仅看个人剂量也看集体剂量）。练习题答案为\"错误\"。\n\n【知识点】\n· ALARA同时关注个人剂量和集体剂量\n· 人员轮换仅限特殊情况（如可能超管理目标值）\n· 无限制轮换降低个人剂量但增加集体剂量，违背最优化\n· ALARA案例：1人受照0.1mSv vs 2人各0.08mSv，选前者（集体剂量更低）"},{"id":"notes_fs_0015","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"下列对于放射性物品厂内运输人员受照剂量和辐射水平监测的描述，正确的是：（　）","options":["参与运输的人员都应佩戴个人剂量计","运输工作负责人应全程跟踪","使用车辆运输结束后，辐射防护人员对车辆进行表面污染普查","A+B+C"],"answer":["D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第128页、第139-140页：课件原文明确\"放射性货包运输人员必须有RP授权，运输期间须佩带个人剂量计\"\"运输负责人按规定线路安全运输……负责运输过程的辐射安全\"\"运输结束后由辐射防护人员进行表面污染普查\"。练习题答案为D（A+B+C）。\n\n【知识点】\n· 运输人员须有RP授权并佩戴个人剂量计\n· 运输负责人全程跟踪、负责辐射安全\n· 车辆运输后须RP人员进行表面污染普查\n· 运输须遵循先审批后执行原则"},{"id":"notes_fs_0016","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"关于放射性物品厂内运输要求，下列说法错误的是：（　）","options":["货包装车时，应合理安排货包位置以降低车辆周围的剂量率（剂量率高的货包尽量放置在车厢中部）","运输车辆外表面任一点上的辐射水平不得超过2mSv/h","运输驾驶员座位处的辐射水平应尽可能低，一般不得超过0.1mSv/h","在运输的起点和终点之间，可以临时决定进行装卸工作"],"answer":["D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第128-129页、第141-142页：课件原文明确\"运输车辆必须沿规定路线行驶，并且在正常情况下不允许中途停留……严禁途中打开运输包装\"。第129页给出车辆剂量率限值：外表面任一点<2豪西弗每小时、2米处及座位处<0.1豪西弗每小时。D选项\"可以临时决定进行装卸\"违反规定，故为错误说法（即正确答案）。\n\n【知识点】\n· 运输车辆：外表面<2mSv/h，2米处及座位<0.1mSv/h\n· 正常情况不允许中途停留，严禁途中打开包装\n· 货包装车：高剂量率货包放车厢中部\n· 需避开上下班/就餐高峰期运输"},{"id":"notes_fs_0017","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"放射性物品禁止与非放射性物品混放，非放射性物品与放射性物品存放场地至少应保证的间隔距离是：（　）","options":["30cm","4m","6m","2m"],"answer":["A"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第124页、第143-144页：课件原文明确\"放射性物品存放时避免与非放射性物项混放，非放射性物品存放场地与放射性物品存放场地的间隔至少为30厘米\"。练习题答案为A（30cm）。\n\n【知识点】\n· 放射性与非放射性物品存放间隔≥30cm\n· 禁止在红橙区存放放射性物品\n· 存放场地需远离通风口、辐射监测设备\n· 剂量率>2mSv/h的存放物须隔离并标明辐射水平"},{"id":"notes_fs_0018","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"放射性物品运输和存放不当，存在污染扩散和人员接受不必要照射的风险。","options":null,"answer":["正确"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据课件《辐射防护二级》第11页、第127页、第145-146页：课件原文指出放射性物品管理需\"规范存放\"和\"安全运输\"，包括包裹完整、避免混放、办理审批、严禁按非放运出控制区等要求。第127页强调包装需\"结实可靠、不易破损\"\"密封良好，放射性内容物不会泄漏\"。运输和存放不当确实存在污染扩散和不必要照射风险。练习题答案为\"正确\"。\n\n【知识点】\n· 放射性物品存放：规范包装、禁止混放、远离通道和监测设备\n· 放射性物品运输：先审批后执行、专人负责、规定路线\n· 包装要求：结实、平整光滑易去污、密封良好\n· 经验反馈案例：包装破损导致车厢底板污染"},{"id":"notes_fs_0019","module":"safety","bank":"辐射防护二级（课件题）","type":"multi","stem":"你和你的班组，可以通过哪些方式获取现场射线探伤信息？（　）","options":["核电厂网页发布的射线探伤公告","主要出入口的探伤告示牌","就地的探伤标识和声光报警","主控广播通知"],"answer":["A","B","C","D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注（简答改编）","explanation":"依据课件《辐射防护二级》第159-160页：课件原文明确获取射线探伤信息的方式包括：1）核电厂网页发布的射线探伤公告；2）主要出入口的探伤告示牌；3）就地的探伤标识和声光报警；4）主控广播通知。四项均正确。课件还给出案例：某电厂人员擅自跨越探伤隔离带被驱逐，属红线违章。\n\n【知识点】\n· 射线探伤信息获取：网页公告、出入口告示牌、就地标识声光报警、主控广播\n· 射线探伤属高辐射风险工作，常用II类放射源\n· 100居里铱192源1米处剂量率高达400mSv/h\n· 探伤期间严禁跨越隔离带（红线违章）"},{"id":"qihang_dyk_0001","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"中核集团秉持的企业核心价值观是（　）。","options":["责任、安全、创新、卓越","诚信、责任、创新、共赢","事业、责任、严细、进取","科技赋能、产业造福"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第5页中核集团简介部分明确指出，中核集团\"以'科技赋能、产业造福'为企业使命，秉持'责任、安全、创新、卓越'的企业核心价值观\"。故本题选A（责任、安全、创新、卓越）。\"科技赋能、产业造福\"是企业的使命而非价值观，其余选项均为干扰项。\n\n【知识点】\n· 中核集团企业核心价值观：责任、安全、创新、卓越。\n· 中核集团企业使命：科技赋能、产业造福。\n· 中核集团积极践行\"两弹一星\"精神和\"四个一切\"核工业精神。\n· 中核集团是中央直接管理的特大型国有重要骨干企业，是国家核科技工业主体，资产规模超1.7万亿元。"},{"id":"qihang_dyk_0002","module":"qihang","bank":"启航-入职第一课","type":"multi","stem":"“四个一切”核工业精神包括（　）。","options":["事业高于一切","责任重于一切","严细融入一切","效率高于一切"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第17页企业精神部分指出，中国核电人大力弘扬的\"四个一切\"核工业精神为\"事业高于一切、责任重于一切、严细融入一切、进取成就一切\"，第18-19页并逐条作了阐述。选项中\"效率高于一切\"不属于\"四个一切\"，正确第四句为\"进取成就一切\"。故本题选ABC。\n\n【知识点】\n· 事业高于一切——一切为了国家、为了核科技事业，体现\"以身许国\"\"做隐姓埋名人、干惊天动地事\"的朴实抱负。\n· 责任重于一切——视\"责任\"为泰山，对国家、对人民富有高度责任感，要努力跻身世界先进水平。\n· 严细融入一切——把严格细致融入一切活动、每个环节，大力倡导\"严、细、实、快\"的工作作风。\n· 进取成就一切——积极探索、奋发向上、孜孜以求、永不言休的精神状态，要在关键领域\"卡脖子\"的地方下功夫。"},{"id":"qihang_dyk_0003","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"中国核电（股票代码601985）在上海证券交易所挂牌上市的时间是（　）。","options":["2008年1月21日","2015年6月10日","2015年6月26日","2021年6月10日"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第11页中国核能电力股份有限公司部分明确写道\"2015年6月10日，公司在上海证券交易所挂牌上市，股票代码'601985'，简称'中国核电'\"。故本题选B（2015年6月10日）。选项\"2008年1月21日\"是公司前身中核核电有限公司的注册设立日期，并非上市日期。\n\n【知识点】\n· 2015年6月10日中国核电在上海证券交易所挂牌上市，股票代码601985，简称\"中国核电\"。\n· 中国核电前身为注册设立于2008年1月21日的中核核电有限公司，总部设于北京。\n· 中国核电注册资本205.68亿元，控股股东为中国核工业集团有限公司。\n· 截至2026年6月26日，公司拥有控股子公司32家、参股公司14家，总资产规模超6800亿元。"},{"id":"qihang_dyk_0004","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"中国核电是中国最大的核电运营商之一，也是首家A股上市的纯核电公司。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第11页明确写道\"中国核电是中国最大的核电运营商之一，是首家A股上市的纯核电公司\"。题干表述与课件原文完全一致，故本题判断为正确。\n\n【知识点】\n· 中国核电是中国最大的核电运营商之一，是首家A股上市的纯核电公司。\n· 中国核电控股股东为中国核工业集团有限公司。\n· 中国核电注册资本205.68亿元，总部设于北京。\n· 截至2026年3月1日，公司核电控股在运机组27台，装机容量2621.20万千瓦。"},{"id":"qihang_dyk_0005","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"2024年国务院核准的核电机组数量为（　），核准数量创10年来新高。","options":["6台","8台","10台","11台"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第27页\"积极安全有序发展核电\"部分指出\"国务院2022年、2023年核准10台核电机组项目，2024年核准11台，核准数量创10年来新高\"。故本题选D（11台）。\n\n【知识点】\n· 2024年国务院核准11台核电机组项目，核准数量创10年来新高。\n· 2022年、2023年国务院各核准10台核电机组项目。\n· 2021年国家能源局印发《2021年能源工作指导意见》，明确\"在确保安全的前提下积极有序发展核电\"。\n· 截至2026年3月1日，公司控股在建及核准待建机组18台，装机容量2064.70万千瓦。"},{"id":"qihang_dyk_0006","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"2025年中国核电全年累计商运发电量2444.3亿千瓦时，同比增长12.98%。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第14页环境保护部分明确写道\"2025年中国核电全年累计商运发电量2444.3亿千瓦时，同比增长12.98%，其中核能发电2008.07亿千瓦时，同比增长9.66%，新能源发电量累计为436.23亿千瓦时，同比增长31.29%\"。题干数据与课件原文一致，故本题判断为正确。\n\n【知识点】\n· 2025年中国核电全年累计商运发电量2444.3亿千瓦时，同比增长12.98%。\n· 其中核能发电2008.07亿千瓦时，同比增长9.66%。\n· 新能源发电量累计436.23亿千瓦时，同比增长31.29%。\n· 该发电量相当于减少燃烧标准煤7450.23万吨，减少二氧化碳排放19516.59万吨、二氧化硫63.33万吨、氮氧化物55.13万吨。"},{"id":"qihang_dyk_0007","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"目前我国核能发电量占全部能源种类发电量的比例约为（　）。","options":["5.89%","4.95%","8.9%","10.84%"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第28页我国发电量占比图（数据来源：国家统计局）标注\"核能发电量占全部能源种类发电量比例为4.95%\"，并列出火电64.79%、水电13.53%、太阳能发电5.89%、风电10.84%、核电4.95%。故本题选B（4.95%）。选项5.89%为太阳能发电占比、10.84%为风电占比、8.9%为世界核能发电占比，均非题干所指。\n\n【知识点】\n· 我国核能发电量占全部能源种类发电量比例为4.95%。\n· 我国发电量占比：火电64.79%、水电13.53%、太阳能发电5.89%、风电10.84%、核电4.95%。\n· 世界核能发电占比为8.9%，我国仍低于世界其他能源平均水平。\n· 数据来源：国家统计局。"},{"id":"qihang_dyk_0008","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"1970年我国确定的中国发展核电站的方针是（　）。","options":["积极有序、稳妥推进","自主设计、自主建造、自主运营","安全、适用，经济、自力更生","安全第一、质量第一"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第22页\"高位起步-中央领导关注（1970年-1985年）\"部分明确指出\"1970年，中国成立核电站建设领导小组，大力推动核电厂建设，并确定'中国发展核电站的方针是：安全、适用，经济、自力更生'\"。故本题选C（安全、适用，经济、自力更生）。\n\n【知识点】\n· 1970年中国成立核电站建设领导小组，确定发展核电站方针\"安全、适用，经济、自力更生\"。\n· 自此核电研究建设全面启动，中核人筚路蓝缕、风雨兼程，开始谱写民族核电建设的奋斗史。\n· 1970-1985年为核电发展\"高位起步-中央领导关注\"阶段。\n· 1979年美国三哩岛核事故发生，助推了中国核安全文化和核监管建设。"},{"id":"qihang_dyk_0009","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"日本福岛核事故后，中国全面放缓核电建设，暂停所有内陆核电开发项目。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第26页\"再次放慢-福岛核事故影响\"部分明确指出\"福岛核事故后，中国全面放缓核电建设；对运行和在建核电站进行严格审查；暂停所有内陆核电开发项目\"。题干表述与课件原文一致，故本题判断为正确。\n\n【知识点】\n· 201
