ptions":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。独自执行时也应读出（轻声）设备标识，强化注意力，不能只在心中默读。"},{"id":"safety_zb_0077","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工作中所使用的规程都是经过精心编写，且经过校对、审核和批准，因此内容是完全正确的。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。规程虽经审批仍可能存在错误或与现场不符，执行中应保持质疑，发现问题及时反馈。"},{"id":"safety_zb_0078","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用监护工具时，监护人必须对执行人的行动全程观察，并对正确和错误的行动给予回应。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。监护人必须全程观察执行人行动，对正确给予确认、对错误及时纠正。"},{"id":"safety_zb_0079","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在任何活动中都必须严格按照反映电厂设计基准的规程来行动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。任何活动都必须严格按照反映电厂设计基准的规程行动。"},{"id":"safety_zb_0080","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在执行规程时，可以根据经验偏离规程。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。执行规程时严禁凭经验偏离规程，如有问题应停下来按程序处理。"},{"id":"safety_zb_0081","module":"safety","bank":"保护区安全准入","type":"judge","stem":"无论是操作设备，还是记录结果，所有工作中都应该优先使用自检这一工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。操作设备、记录结果等所有工作都应优先使用自检工具。"},{"id":"safety_zb_0082","module":"safety","bank":"保护区安全准入","type":"judge","stem":"2分钟检查是刚到达工作现场时对现场仔细的审查（不实际进行操作），帮助工作人员准确获悉关键指示、系统和设备的工况、工作环境、危险。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。2分钟检查是到达现场时对现场的初步审查，帮助掌握设备状态、环境与危险。"},{"id":"safety_zb_0083","module":"safety","bank":"保护区安全准入","type":"judge","stem":"所有需要汲取经验教训或发生异常的工作都需要召开工后会。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。需要汲取经验教训或发生异常的工作都应召开工后会总结。"},{"id":"safety_zb_0084","module":"safety","bank":"保护区安全准入","type":"judge","stem":"切尔诺贝利事故充分表明，核电厂发生的任何问题在某种程度上都源于人为错误，然而人的智慧在查出和消除潜在问题方面是十分有效的，必须突出强调人的因素在运行安全中的关键作用。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。核电厂任何问题在某种程度上都源于人为差错，必须重视人的因素在运行安全中的作用。"},{"id":"safety_zb_0085","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂程序全都经过了严格的审批流程，执行程序操作时不需要带着质疑的态度去判断程序是否能满足工作要求。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。即使程序经过严格审批，执行时也要带着质疑态度判断其是否满足现场实际要求。"},{"id":"safety_zb_0086","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用不确定时暂停工具可以使失误的可能性大大降低。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。\"不确定时暂停\"能在状态不明时避免盲目行动，大大降低失误可能。"},{"id":"safety_zb_0087","module":"safety","bank":"保护区安全准入","type":"judge","stem":"人的因素是绝对重要的因素。因此，只要具备必要的技能和授权就可动手操作。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。仅有技能和授权不够，还必须按规程、使用防人因失误工具才能操作。"},{"id":"safety_zb_0088","module":"safety","bank":"保护区安全准入","type":"judge","stem":"口头交换信息，尤其是面对面交谈过程中存在很大误解的风险，因此需要使用三向交流。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。口头交流误解风险大，需使用三向交流确保信息准确传递。"},{"id":"safety_zb_0089","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会是为了让工作组成员清楚地理解任务目标、工作范围、工作风险、安全要点、防护措施、应急预案，保证有效完成工作或任务的一项活动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工前会目的是让成员清楚任务目标、范围、风险、安全要点、防护措施和应急预案。"},{"id":"safety_zb_0090","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会和工后会地点都应选在不被其他事情干扰的地方。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工前会和工后会都应选在不受干扰的地点进行。"},{"id":"safety_zb_0091","module":"safety","bank":"保护区安全准入","type":"judge","stem":"状态报告是电厂报告问题、跟踪问题解决的重要工具，任何人都可以通过状态报告反馈问题（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。状态报告是电厂报告和跟踪问题的重要工具，任何人都可通过状态报告反馈问题。"},{"id":"safety_zb_0092","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，赶紧发个微信朋友圈，拍个短视频，正是吸引流量的好时机。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。应急状态下严禁发布现场信息到社交媒体（微信朋友圈/短视频），防止谣言和信息泄露。"},{"id":"safety_zb_0093","module":"safety","bank":"保护区安全准入","type":"judge","stem":"任何含有衰变原子并且具有放射性（释放辐射）的物质都叫做放射性物质。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。含有放射性原子并释放辐射的物质即放射性物质。"},{"id":"safety_zb_0094","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当身体或者任何特定器官遭到辐射照射时，接受的辐射量称为剂量。常用测量单位为希沃特（Sv）或毫希沃特（mSv）。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。剂量表示接受辐射照射的量，单位为希沃特（Sv）、毫希沃特（mSv）。"},{"id":"safety_zb_0095","module":"safety","bank":"保护区安全准入","type":"judge","stem":"疲劳引起注意力不集中、警觉性下降将会引发人的不安全行为。 （）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。疲劳导致注意力不集中、警觉性下降，会引发人的不安全行为。"},{"id":"safety_zb_0096","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂二回路给水在蒸汽发生器中被加热转化为蒸汽，推动汽轮发电机组发电。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。二回路给水在蒸汽发生器中被一回路热水加热成蒸汽，推动汽轮发电机组发电。"},{"id":"safety_zb_0097","module":"safety","bank":"保护区安全准入","type":"judge","stem":"公司领导不希望员工可以自由地提出意见，因为害怕负面的后果。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核安全文化要求领导鼓励员工自由提出意见（包括负面问题），不应害怕负面后果。"},{"id":"safety_zb_0098","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每位员工都有责任向电厂管理者报告可能会影响电站正常运转的蓄意破坏或干预事件。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每位员工都有责任报告可能影响电站的蓄意破坏或干预事件。"},{"id":"safety_zb_0099","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一般工业固体废物应统一收集后放入指定存放地点统一处理，不能随意丢弃。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。一般工业固废应统一收集放到指定地点处理，不得随意丢弃。"},{"id":"safety_zb_0100","module":"safety","bank":"保护区安全准入","type":"judge","stem":"重要邮件建议加密存储。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。重要邮件建议加密存储，防止信息泄露。"},{"id":"safety_zb_0101","module":"safety","bank":"保护区安全准入","type":"judge","stem":"'两个零容忍'指的是对'对违规操作零容忍'，和'对弄虚作假零容忍'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。\"两个零容忍\"指对违规操作零容忍、对弄虚作假零容忍。"},{"id":"safety_zb_0102","module":"safety","bank":"保护区安全准入","type":"judge","stem":"辐射防护标志用于警告工作人员放射性危险的位置，这可以防止员工因意外情况暴露于辐射或放射性物质中。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。辐射警告标志提示放射性危险位置，防止人员意外受照。"},{"id":"safety_zb_0103","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当今在核电技术日趋成熟的基础上，在实施纵深防御措施和严格管理的前提下，核电厂发生严重事故的概率极小。但是，即使采取了多种防范措施和控制手段，依然不能完全排除放射性会对公众和环境造成重大影响的事故发生。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。严重事故概率极小但不能完全排除，因此仍需应急准备与纵深防御。"},{"id":"safety_zb_0104","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，电站已经指派专人向公众和新闻媒体传达信息。此人负责回答来自外部的关于电站情况的相关问题。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。应急状态下由电站指派的发言人统一对外传达信息，员工不得擅自对外发布。"},{"id":"safety_zb_0105","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一些通常不被列为辐射控制区区的区域，在特殊行动期间可能会被列为辐射控制区。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。特殊行动期间，平时非辐射控制区的区域可能临时划为辐射控制区。"},{"id":"safety_zb_0106","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当放射性物质位置失控时，就会增大污染风险，辐射释放将不再受控。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。放射性物质失控会增大污染风险，辐射释放将不再受控。"},{"id":"safety_zb_0107","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电厂员工有责任根据电厂程序报告潜在的问题，保证问题及时的审查和修正。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.员工有责任按程序报告潜在问题，保证问题及时审查和纠正。"},{"id":"safety_zb_0108","module":"safety","bank":"保护区安全准入","type":"judge","stem":"秦山核电站是我国大陆第一座投入运行的核电站，被誉为'国之光荣'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。秦山核电站是我国大陆第一座投运的核电站，被誉为\"国之光荣\"。"},{"id":"safety_zb_0109","module":"safety","bank":"保护区安全准入","type":"judge","stem":"可以直接移走防异物装置，移走之前无需检查防异物装置周围区域。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。移走防异物装置前必须检查装置周围区域，确认无异物遗留。"},{"id":"safety_zb_0110","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电工作风险高于其他工业风险。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核电风险受严格管理和纵深防御控制，并不高于其他工业风险。"},{"id":"safety_zb_0111","module":"safety","bank":"保护区安全准入","type":"judge","stem":"明星自检中T的含义是：Think:思考你将要做什么，预计会有什么结果。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。STAR中T即Think：思考将要做什么、预计结果。"},{"id":"safety_zb_0112","module":"safety","bank":"保护区安全准入","type":"judge","stem":"推动核电厂汽轮机组发电的是蒸汽。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。推动汽轮机组旋转发电的是蒸汽。"},{"id":"safety_zb_0113","module":"safety","bank":"保护区安全准入","type":"judge","stem":"未使用劳动防护用品是物料搬运造成伤害的主要原因之一。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。未使用劳动防护用品是物料搬运伤害的主要原因之一。"},{"id":"safety_zb_0114","module":"safety","bank":"保护区安全准入","type":"judge","stem":"1希沃特（Sv）=100毫希沃特mSv。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。1 Sv = 1000 mSv（不是100）。"},{"id":"safety_zb_0115","module":"safety","bank":"保护区安全准入","type":"judge","stem":"临时需要下载一些互联网资料，可以把办公电脑通过共享手机热点的方式连接外网下载（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。办公电脑严禁私自连接手机热点等外网，防止病毒和信息泄露。"},{"id":"safety_zb_0116","module":"safety","bank":"保护区安全准入","type":"judge","stem":"办公区域禁止私自架设无线路由或WIFI热点。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。办公区域禁止私自架设无线路由或WiFi热点。"},{"id":"safety_zb_0117","module":"safety","bank":"保护区安全准入","type":"judge","stem":"运输物料时，应保持手推运货车上负载的重心尽可能的低。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。手推车运输时负载重心应尽可能低，保持稳定。"},{"id":"safety_zb_0118","module":"safety","bank":"保护区安全准入","type":"judge","stem":"伪造记录不属于有意的不当处理。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。伪造记录属于典型的有意不当处理（弄虚作假）行为。"},{"id":"safety_zb_0119","module":"safety","bank":"保护区安全准入","type":"judge","stem":"国家核安全局是中国的核安全和辐射安全的监督管理机构。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。国家核安全局（NNSA）是我国核与辐射安全的监督管理机构。"},{"id":"safety_zb_0120","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当需要从高处往下搬运物料时，应使用合适的物料下放设备，禁止抛投。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。从高处向下搬运物料应使用合适的下放设备，禁止抛投。"},{"id":"safety_zb_0121","module":"safety","bank":"保护区安全准入","type":"judge","stem":"正常情况下，核电工作者职业照射剂量大于在日常生活中的本底辐射剂量。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。正常情况下核电站职业照射剂量控制严格，通常低于日常生活中接受的天然本底辐射剂量（全球平均本底约2.4mSv/年）。"},{"id":"safety_zb_0122","module":"safety","bank":"保护区安全准入","type":"judge","stem":"汽轮机的作用是将蒸汽的内能转变为机械能以带动发电机发电。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。汽轮机将蒸汽热能（内能）转变为机械能，带动发电机发电。"},{"id":"safety_zb_0123","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在搬运长条形物体时，保持双手远离物体端部以防被挤压/夹伤。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。搬运长条形物体时双手应远离端部，防止挤压夹伤。"},{"id":"safety_zb_0124","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起重设备进入防异物管理区域上空之前，无需检查有无部件松动情况。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。起重设备进入防异物区域上空前必须检查有无部件松动，防止异物掉落。"},{"id":"safety_zb_0125","module":"safety","bank":"保护区安全准入","type":"judge","stem":"我国目前的核电机组主要分布在内陆省份。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。我国核电机组主要分布在沿海省份，内陆尚无在运机组。"},{"id":"safety_zb_0126","module":"safety","bank":"保护区安全准入","type":"judge","stem":"三哩岛、切尔诺贝利核电站存在很多设计错误，加之人员培训和规程的低质量最终导致事故的发生。而目前的电站已经充分吸取了这些失败经验，加之今天的巨大技术进步，所以绝对不会发生大事故。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。不能认为\"已有电站绝对安全\"，核安全需要持续保持警惕，任何时候都不能放松（安全是相对的、动态的）。"},{"id":"safety_zb_0127","module":"safety","bank":"保护区安全准入","type":"judge","stem":"天然辐射源，如宇宙射线、某些种类岩石；人造辐射源，如CT检查等，使人们遭受的辐照剂量比从事辐射工作所接受的职业剂量更多。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。天然辐射（宇宙射线、岩石等）加上人造辐射源（CT等）使公众接受的照射剂量总体上并不比核电职业剂量少，职业剂量受严格控制在很低水平。"},{"id":"safety_zb_0128","module":"safety","bank":"保护区安全准入","type":"judge","stem":"岗位适任性的主观辨识方法，既包括对个人身体状态变化的观察也包括社会交往方面的变化。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。岗位适任性主观辨识既观察身体状态变化，也观察社会交往方面的变化。"},{"id":"safety_zb_0129","module":"safety","bank":"保护区安全准入","type":"judge","stem":"搬运物料前，如搬运人员对周围环境熟悉，即使无法观察到所搬运负载的上方及其四周也没关系。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。搬运前必须保证能看到负载上方及四周，环境不熟悉也不能例外。"},{"id":"safety_zb_0130","module":"safety","bank":"保护区安全准入","type":"judge","stem":"WBC是指全身计数测量，是监测人体内照射的重要手段。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。WBC（全身计数器）测量是监测人体内照射的重要手段。"},{"id":"safety_zb_0131","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对于在物料搬运时发生的预期外的事件，工作人员应在确保自身安全的前提下将物料放置在安全状态，再进行处理。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。搬运中发生预期外事件，应先确保自身安全并将物料置于安全状态再处理。"},{"id":"safety_zb_0132","module":"safety","bank":"保护区安全准入","type":"judge","stem":"物项只在进入防异物管理区域时需要检查，带出时不用检查。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。物项进出防异物管理区域都必须检查，防止异物带入或带出遗留。"},{"id":"safety_zb_0133","module":"safety","bank":"保护区安全准入","type":"judge","stem":"安保配置和设计文件可以随意查看。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。安保配置和设计文件属于敏感资料，须授权查阅，不能随意查看。"},{"id":"safety_zb_0134","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一旦完成初始培训成为核电一员后，后续无需再接受培训。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核电员工需要持续接受再培训（复训、授权资格考试），不是一次培训终身有效。"},{"id":"safety_zb_0135","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用螺丝刀，扳手等工具时，应使用防坠落手绳。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。高处使用螺丝刀、扳手等工具应系防坠落手绳，防止落物伤人。"},{"id":"safety_zb_0136","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在应急情况下，如果你不属于应急响应专业组成员，应按指示到达应急集合点或疏散地。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。非应急响应专业人员应按指令到应急集合点集合或疏散。"},{"id":"safety_zb_0137","module":"safety","bank":"保护区安全准入","type":"judge","stem":"只要足够优秀，就不会犯错误。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。任何人都会犯错误，优秀的员工同样需要防人因失误工具和规程约束。"},{"id":"safety_zb_0138","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用螺丝刀，扳手等工具时，可以使用胶带临时捆绑替代防坠落手绳。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。防坠落手绳不能用胶带临时捆绑替代，必须使用合格的专用手绳。"},{"id":"safety_zb_0139","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对介质是危化品的系统开展检修工作时，只要做好系统隔离，可以不佩戴防护用品。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。危化品系统检修除系统隔离外，还必须按风险分析佩戴相应防护用品。"},{"id":"safety_zb_0140","module":"safety","bank":"保护区安全准入","type":"judge","stem":"红色安全标志是禁止或制止人们想要做的某种动作。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。红色安全标志表示禁止、制止某种动作（禁止标志）。"},{"id":"safety_zb_0141","module":"safety","bank":"保护区安全准入","type":"judge","stem":"进入密闭容器前，必须对密闭容器的含氧量及有毒有害气体的浓度进行测量，空气指标合格后方可进入作业。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。进入密闭容器前必须测量含氧量和有毒有害气体浓度，合格后方可进入。"},{"id":"safety_zb_0142","module":"safety","bank":"保护区安全准入","type":"judge","stem":"安全帽主要防止高处落物的打击，在高空作业时可以不戴。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。安全帽任何时候进入现场都必须佩戴，高空作业更不能摘下。"},{"id":"safety_zb_0143","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在现场工作时衣服、袖口应扣好，长发应盘入安全帽以防止卷入转动设备。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。现场工作应扣好衣服袖口，长发盘入安全帽，防止卷入转动设备。"},{"id":"safety_zb_0144","module":"safety","bank":"保护区安全准入","type":"judge","stem":"《职业病防治法》适用于中华人民共和国境内产生职业病危害的企事业单位和个体经济组织。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。《职业病防治法》适用于境内产生职业病危害的企事业单位和个体经济组织。"},{"id":"safety_zb_0145","module":"safety","bank":"保护区安全准入","type":"judge","stem":"个人劳动防护用品是提供安全和健康防护的预防性辅助措施，可以直接替代工作中必须采取的安全技术措施。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。个人防护用品只是辅助预防措施，不能替代必须的安全技术措施。"},{"id":"safety_zb_0146","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在现场工作过程中，不管受伤多轻微都应进行报告。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.现场工作中无论伤情多轻微都应报告（及时处置、经验反馈）。"},{"id":"safety_zb_0147","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在用人单位与被雇佣人商量一致的情况下，可以不用参加工伤保险。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。工伤保险是法定强制保险，即使双方协商一致也必须参加。"},{"id":"safety_zb_0148","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工作结束后，现场设置的临时围栏应及时拆除，打开的盖板应立即恢复。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工作结束后临时围栏应及时拆除、打开的盖板立即恢复。"},{"id":"safety_zb_0149","module":"safety","bank":"保护区安全准入","type":"judge","stem":"从事高空作业人员在工作前必须检查安全带，没有带安全带的在工作中必须有专人监护。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。高处作业人员必须佩戴安全带，没有安全带根本不允许作业（不是\"专人监护\"可以替代）。"},{"id":"safety_zb_0150","module":"safety","bank":"保护区安全准入","type":"judge","stem":"人的不安全行为并不是每次都能造成事故伤害，有的不安全行为没有形成任何后果，但事故正是以大量的不安全行为为基础的。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。海因里希法则：不安全行为不一定每次都致伤，但事故以大量不安全行为为基础。"},{"id":"safety_zb_0151","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场生产厂房噪音超过85分贝的环境应使用耳塞，以防听力受损。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。噪声超过85分贝的环境应佩戴耳塞防止听力损伤。"},{"id":"safety_zb_0152","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起吊物体必须离开地面有足够的距离后，人员方可从下方通过。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误.起吊物吊起后严禁人员从吊物下方通过（无论离地多高）。"},{"id":"safety_zb_0153","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在关闭容器（坑洞、井）人孔门以前，工作负责人必须清点人员和工具，检查确实没有人员或工具遗留后才可关闭。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。关闭容器（坑洞、井）人孔前必须清点人员和工具，确认无遗留后方可关闭。"},{"id":"safety_zb_0154","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起重作业人员在操作前应检查现场风速低于五级满足起重条件，否则不准进行操作。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。起重作业前应确认现场风速低于五级（满足起重条件）方可操作。"},{"id":"safety_zb_0155","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场使用或临时存放的气瓶应进行可靠固定，使用气瓶绑扎带固定气瓶时可以只绑扎在瓶身下部牢靠即可。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。气瓶绑扎固定不能只绑瓶身下部，应固定牢靠防止倾倒（绑扎位置应确保稳定）。"},{"id":"safety_zb_0156","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电气设备必须装设保护接地（接零），不得将接地线接在金属管道上或其他金属构件上。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电气设备必须装设保护接地（接零），接地线不得接在金属管道或其他金属构件上。"},{"id":"safety_zb_0157","module":"safety","bank":"保护区安全准入","type":"judge","stem":"成人心肺复苏时，不管单人或双人进行复苏，胸外按压与通气比均为30：2。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。成人心肺复苏无论单人或双人，按压与通气比均为30:2。"},{"id":"safety_zb_0158","module":"safety","bank":"保护区安全准入","type":"judge","stem":"海因里希（Heinrich）事故法则对于职业安全卫生工作的意义是：防止人的不安全行为，消除物的不安全状态，使因果连锁中断。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。海因里希事故法则的意义：防止人的不安全行为、消除物的不安全状态，中断事故因果连锁。"},{"id":"safety_zb_0159","module":"safety","bank":"保护区安全准入","type":"judge","stem":"自己未使用或没有通行证，跟随别的工作人员进入安全门称为尾随。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.未使用本人通行证跟随他人进入安全门的行为称为尾随（防尾随是核安保基本要求）。"},{"id":"safety_zb_0160","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核安保文化的定义是预防、探测和应对涉及核材料、核设施、其他放射性物质及相关设施，以及相关活动的擅自接触、末经授权转移、盗窃、蓄意破坏或其他恶意行为。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。这是核安保文化的定义：预防、探测和应对核材料及放射性物质等的擅自接触、未经授权转移、盗窃、蓄意破坏等恶意行为。"},{"id":"safety_zb_0161","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在报警时只要说明起火的具体位置（区域、机组、厂房、层面、房间等）和着火物性质、火势大小、有无人员被困、受伤就可以了，不需要告知报警人信息并引导消防车辆。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。报警时还应告知报警人信息并引导消防车辆到达现场。"},{"id":"safety_zb_0162","module":"safety","bank":"保护区安全准入","type":"judge","stem":"保护区和要害区必须通过制卡授权系统分别进行授权，一次开门只能允许具备授权的持证者一人通行。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。保护区和要害区须分别授权，一次开门只允许一名持证授权者通行（防尾随）。"},{"id":"safety_zb_0163","module":"safety","bank":"保护区安全准入","type":"judge","stem":"各个区域使用不同的证件，人员进入某区域必须持有相应的证件。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。各区域使用不同证件，进入相应区域必须持相应证件。"},{"id":"safety_zb_0164","module":"safety","bank":"保护区安全准入","type":"judge","stem":"动火作业是指在禁火区进行焊接与切割作业及在易燃易爆场所使用喷灯、电钻、砂轮等进行可能产生火焰、火花和炽热表面的临时性作业。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。这是动火作业的定义：禁火区焊接切割及易燃易爆场所可能产生火焰、火花、炽热表面的临时作业。"},{"id":"safety_zb_0165","module":"safety","bank":"保护区安全准入","type":"judge","stem":"保卫分区的目的是为了有效地防御非法入侵，确保核电站安全。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。保卫分区目的是有效防御非法入侵，确保核电站安全。"},{"id":"safety_zb_0166","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电器开关时的打火、熔热发红的铁器和电焊产生的焊渣都是着火源。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电器开关打火、发红铁器、电焊焊渣都是着火源。"},{"id":"safety_zb_0167","module":"safety","bank":"保护区安全准入","type":"judge","stem":"任何进入管理区的车辆和人员都要接受安检。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。进入管理区的车辆和人员都要接受安检。"},{"id":"safety_zb_0168","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂内禁止流动吸烟，吸烟必须要指定吸烟点。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。核电厂内禁止流动吸烟，只能在指定吸烟点吸烟。"},{"id":"safety_zb_0169","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每项产品具有其质量特性，但表现形式不尽相同。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每项产品都有质量特性，表现形式不尽相同（性能、寿命、可靠性等）。"},{"id":"safety_zb_0170","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂质量的体现之一是：设备检修、机组运行控制、设备管理、物资采购等等生产相关各环节，符合规定的工作流程及要求。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电厂质量体现在检修、运行、设备管理、采购等各环节符合规定流程与要求。"},{"id":"safety_zb_0171","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在工程进度和时间紧张的情况下，对从事影响质量的活动的人员可安排先上岗后培训。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。影响质量活动的人员必须先培训合格后上岗，严禁先上岗后培训。"},{"id":"safety_zb_0172","module":"safety","bank":"保护区安全准入","type":"judge","stem":"维修工作记录填写原则上应在该项活动结束时同步进行填写，不能在活动未完成前就进行填写或在整个工作结束后进行事后凭记忆补签。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。维修记录应在活动结束时同步填写，严禁提前填写或事后凭记忆补签。"},{"id":"safety_zb_0173","module":"safety","bank":"保护区安全准入","type":"judge","stem":"无证作业（包括工作负责人、QC、操纵员、燃料操作员等）属于中国核电质量红线违章。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。无证作业（工作负责人、QC、操纵员、燃料操作员等）属于中国核电质量红线违章。"},{"id":"safety_zb_0174","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场工作完成后，工作人员也可以不用进行'自检'，因为工作负责人会进行确认。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。工作完成后工作人员仍需自检确认，不能依赖工作负责人确认。"},{"id":"safety_zb_0175","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂设计变更必须采用与原设计相同的设计控制措施。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。设计变更必须采用与原设计相同的设计控制措施（同等审查、验证）。"},{"id":"safety_zb_0176","module":"safety","bank":"保护区安全准入","type":"judge","stem":"记录是为各种物项或服务的质量以及影响质量的各种活动提供客观证据的文件。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。记录是为物项或服务质量及影响质量活动提供客观证据的文件。"},{"id":"safety_zb_0177","module":"safety","bank":"保护区安全准入","type":"judge","stem":"影响质量的工艺必须由合格的人员、按照认可的程序和使用合格的设备，按现有标准来完成。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。影响质量的工艺必须由合格人员、按认可程序、用合格设备并按现有标准完成。"},{"id":"safety_zb_0178","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每个人都可以拒绝超出授权范围的工作安排。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每个人都可以（且应该）拒绝超出本人授权范围的工作安排。"},{"id":"safety_zb_0179","module":"safety","bank":"保护区安全准入","type":"judge","stem":"所有质量保证记录都必须字迹清楚、完整、并与所记述的物项或服务相对应。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。质量保证记录必须字迹清楚、完整，并与所述物项或服务相对应。"},{"id":"safety_zb_0180","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当工作执行到质量计划中的'H点'时，验证人员虽然未到场，但通过电话表示放弃该点见证，也可以继续开展工作。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。H点（停工待检点）必须由验证人员到场见证签字后方可继续，电话放弃见证无效。"},{"id":"safety_zbc_0001","module":"safety","bank":"保护区安全准入","type":"single","stem":"不属于金七门核电质保体系5大基石的是（）","options":["监理单位","总包单位","制造单位","勘察单位"],"answer":["D"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：质保体系5大基石指核电工程建设阶段承担安全质量责任的主要参建单位，勘察单位不在其列，而总包、监理、制造等单位属于基石范畴，故答案为D。"},{"id":"safety_zbc_0002","module":"safety","bank":"保护区安全准入","type":"judge","stem":"上级单位和监管单位发布的弄虚作假问题，以及内外部审查、监督检查发现的弄虚作假风险，金七门核电各相关部门均应及时纳入弄虚作假风险清单。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：防造假要求对弄虚作假风险实施清单化动态管理，上级单位和监管单位发布的弄虚作假问题，以及内外部审查、监督检查发现的风险，各相关部门均应及时纳入风险清单，确保全覆盖、早防控，故该说法正确。"},{"id":"safety_zbc_0003","module":"safety","bank":"保护区安全准入","type":"single","stem":"下列哪项活动不属于弄虚作假高风险因子","options":["隐蔽工程施工","无损检测","办公室资料归档","电气试验"],"answer":["C"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：弄虚作假高风险因子集中在记录易被篡改、代签或数据易造假的现场作业与检验试验环节，如隐蔽工程施工、无损检测、电气试验等；办公室资料归档不属于此类高风险活动，故答案为C。"},{"id":"safety_zbc_0004","module":"safety","bank":"保护区安全准入","type":"single","stem":"金七门核电项目安全质量环保举报信箱的开箱频次要求为（）","options":["每周一次（节假日顺延）","每两周一次（节假日顺延）","每月一次（节假日顺延）","每两月一次（节假日顺延）"],"answer":["B"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：举报信箱的开箱频次按公司规定执行为每两周一次（节假日顺延），以保证举报信息得到及时处理，故答案为B。"},{"id":"safety_zbc_0005","module":"safety","bank":"保护区安全准入","type":"judge","stem":"金七门核电发布防造假管理程序，其中已明确了各部门的防造假责任，无需明确各承包商的防造假责任。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入质量保证》：防造假措施要求强化合同管控，合同文本中必须明确供方承诺不提供假冒、欺诈和可疑物项等条款，防造假覆盖所有参建承包商，各承包商的防造假责任同样需要明确，故该说法错误。"},{"id":"safety_zbc_0006","module":"safety","bank":"保护区安全准入","type":"judge","stem":"漏报、谎报或迟报质量异常在金七门核电属于质量黄线违章行为。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入质量保证》：质量黄线条款包括\"未及时上报影响较大质量问题及质量事故事件\"。漏报、谎报或迟报质量异常属于上报不及时、不属实的情形，构成质量黄线违章，故该说法正确。"},{"id":"safety_zbc_0007","module":"safety","bank":"保护区安全准入","type":"judge","stem":"CR、NCR具备关闭条件，经督促仍长期不关闭。该行为在金七门核电属于一般违章。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：CR、NCR已具备关闭条件，经督促仍长期不关闭，属于文件与过程管理执行不到位的一般性违章行为，尚未达到弄虚作假、越点施工等红线严重程度，故该说法正确。"},{"id":"safety_zbc_0008","module":"safety","bank":"保护区安全准入","type":"judge","stem":"施工人员资格授权过期后继续作业，该行为在金七门核电仅属于一般质量违章。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入质量保证》：通用质量红线包括\"无证、超许可范围作业\"，要求持有效资质证书上岗。施工人员资格授权过期后继续作业等同于无有效授权作业，属红线级别的严重违章，并非仅属一般质量违章，故该说法错误。"},{"id":"safety_zbc_0009","module":"safety","bank":"保护区安全准入","type":"single","stem":"上道工序检查不合格，仍然开展下道工序施工。该行为在金七门核电属于（）","options":["一般质量违章","环保类违章","质量黄线违章","质量红线违章"],"answer":["C"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入质量保证》：质量黄线条款包括\"不具备先决条件或未按程序确认先决条件即开工\"。上道工序检查不合格即不具备下道工序施工的先决条件，仍继续施工正属此情形，故答案为C。"},{"id":"safety_zbc_0010","module":"safety","bank":"保护区安全准入","type":"single","stem":"下列哪一项属于金七门核电质量黄线违章条款（）","options":["施工记录填写不完整","施工作业前未进行技术交底","物项标识不规范","违反工完料净场地清"],"answer":["B"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入质量保证》：质量黄线（6条）第一条为\"未进行安全质量技术交底或未召开工前会即开工\"。施工作业前未进行技术交底与该条款对应；其余选项多属一般性质量管理问题，故答案为B。"},{"id":"safety_zbc_0011","module":"safety","bank":"保护区安全准入","type":"judge","stem":"金七门核电1、2号机组和3、4号机组共用一份质量保证大纲。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：课件仅阐述质量保证大纲是核电厂纲领性文件、表达对国家核安全局的承诺。按公司实际，金七门核电1、2号机组和3、4号机组并非共用一份质量保证大纲，故该说法错误。"},{"id":"safety_zbc_0012","module":"safety","bank":"保护区安全准入","type":"single","stem":"金七门核电质保体系1个先行是（）","options":["设计质量","人身安全","纵深防御","建造许可"],"answer":["A"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：金七门核电质保体系的\"1个先行\"是设计质量，强调以设计质量先行、从源头控制工程质量；人身安全、纵深防御、建造许可均不属于\"1个先行\"的内容，故答案为A。"},{"id":"safety_zbc_0013","module":"safety","bank":"保护区安全准入","type":"single","stem":"金七门核电质保体系3大支柱是（）","options":["质量文化、质量保证、质量控制","质量文化、安全管理、进度控制","质量保证、成本控制、技术创新","质量控制、风险管理、应急响应"],"answer":["A"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：金七门核电质保体系的3大支柱是质量文化、质量保证、质量控制；其余选项中掺入的安全管理、进度控制、成本控制、风险管理等要素均不属于3大支柱，故答案为A。"},{"id":"safety_zbc_0014","module":"safety","bank":"保护区安全准入","type":"single","stem":"金七门核电质量保证体系的目标是（）","options":["进度0延迟","质量0事故","投资0超支","安全0事件"],"answer":["B"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：金七门核电质量保证体系的目标是\"质量0事故\"；进度0延迟、投资0超支、安全0事件均不是质保体系的既定目标表述，故答案为B。"},{"id":"safety_zbc_0015","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于应急值守，下列说法错误的是（   ）","options":["ON-CALL值班期间随身携带手机","ON-CALL值班期间不离开象山县范围","ON-CALL值班期间和朋友小酌饮酒，只要不喝醉就行","值班期间，因故离开象山县时，及时通知所属应急指挥部或应急专业组"],"answer":["C"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入核素养（上）》：课件明确规定处于on-call或应急值守期间不得饮酒。因此值班期间与朋友小酌、只要不喝醉就行的做法违反应急值守要求；其余选项均为值守期间的正确做法，故答案为C。"},{"id":"safety_zbc_0016","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防护行动，下列做法正确的是(  )","options":["听到进入核事故应急状态的广播后立即收拾东西撤离","服用碘片后能百分百阻断放射性碘的摄入","隐蔽在办公楼内时，人员太多，可适当开窗透气","根据应急指挥部的指令，按要求服用稳定碘片"],"answer":["D"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入核素养（上）》：撤离须按撤离广播和应急指挥部统一安排有序登车，不能听到进入应急状态广播就自行收拾撤离；服碘片是使甲状腺吸收饱和、阻断甲状腺对放射性碘的吸收，并非百分百阻断摄入；隐蔽时应关闭门窗和通风系统，不得开窗；碘片须按应急指挥部指令或应急通知服用，故答案为D。"},{"id":"safety_zbc_0017","module":"safety","bank":"保护区安全准入","type":"single","stem":"金七门核电应急计划区分为烟羽应急计划区和（    ）","options":["隐蔽计划区","食入计划区","行动计划区","吸入计划区"],"answer":["B"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：课件仅提到场内非应急人员撤离至\"烟羽应急计划区\"外区之外，未完整说明应急计划区划分。核电厂应急计划区分为烟羽应急计划区和食入应急计划区，后者针对食入受污染食品等照射途径，故答案为B。"},{"id":"safety_zbc_0018","module":"safety","bank":"保护区安全准入","type":"judge","stem":"消防控制室无人值守属于消防红线。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：消防控制室是火灾监视与应急指挥的枢纽，无人值守会导致火情监视失效、延误初期火灾处置，属于消防红线行为，故该说法正确。"},{"id":"safety_zbc_0019","module":"safety","bank":"保护区安全准入","type":"judge","stem":"运行部门在主控室开始倒班前，要求完成二级干预队的组建、培训和授权。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：二级干预队是机组初期灭火干预的应急力量，运行部门在主控室开始倒班前必须完成其组建、培训和授权，确保倒班起即具备初期火灾响应能力，故该说法正确。"},{"id":"safety_zbc_0020","module":"safety","bank":"保护区安全准入","type":"judge","stem":"运行部门在主控室开始倒班前，应完成二级干预队个人消防防护装备器材的配备工作。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：运行部门在主控室开始倒班前，应同步完成二级干预队个人消防防护装备器材的配备，保证干预队组建后即可投入使用、随时响应，故该说法正确。"},{"id":"safety_zbc_0021","module":"safety","bank":"保护区安全准入","type":"single","stem":"消防演习频次按二级消防演习每值每年不少于（）次","options":["1","2","3"],"answer":["C"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：课件仅给出核应急演习频次（单项演习至少每年一次、综合演习至少每2年一次、联合演习至少每5年一次），未涉及消防演习。二级消防演习频次按公司规定为每值每年不少于3次，故答案为C。"},{"id":"safety_zbc_0022","module":"safety","bank":"保护区安全准入","type":"single","stem":"金七门核电火灾报警是（）","options":["0574-65757119","0574-65753119","0574-65756119"],"answer":["A"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：课件仅说明全国火警电话为119及报警要素；厂内火灾报警电话以公司公布的号码为准，即0574-65757119，故答案为A。"},{"id":"safety_zbc_0023","module":"safety","bank":"保护区安全准入","type":"judge","stem":"违章指挥、强令冒险作业，野蛮作业。是集团安全红线","options":null,"answer":["正确"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入工业安全》：\"违章指挥、强令冒险作业\"列入中国核电安全质量红黄线标准（通用）8条红线，该类条款同属集团安全红线范畴，野蛮作业亦为此类严厉禁止的行为，故该说法正确。"},{"id":"safety_zbc_0024","module":"safety","bank":"保护区安全准入","type":"judge","stem":"高处作业未系挂安全带，或在无安全防护措施情况下翻越高空作业面的外围防护。不属于安全红线违章","options":null,"answer":["错误"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"依据课件《保护区准入工业安全》：工业安全7条红线明确列出\"高处作业未系安全带\"和\"无安全防护措施情况下翻越高空作业面的外围防护\"，这两种行为均属于安全红线违章，故该说法错误。"},{"id":"safety_zbc_0025","module":"safety","bank":"保护区安全准入","type":"single","stem":"公司的工业安全违章条款数量是多少（）","options":["90","80","60","10"],"answer":["A"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：公司现行的工业安全违章条款数量为90条，选项中的80、60、10均与现行条款数量不符，故答案为A。"},{"id":"safety_zbc_0026","module":"safety","bank":"保护区安全准入","type":"single","stem":"下面对于金七门核电工业安全理念描述不正确的是（）","options":["坚决发扬业主“主人翁”精神、发挥“主心骨”作用、担当“主力军”责任","落实安全保障线主体责任，强化“安全监督线”履职担当","全面压实各方绝对责任，确保工程建设各项安全指标全面受控","努力管好自身负责部分，其余部分于己无关"],"answer":["D"],"score":null,"source":"official","origin":"保护区安全准入差异.xlsx","explanation":"课件未直接覆盖：工业安全理念强调发扬业主主人翁精神、落实安全保障线主体责任与安全监督线履职担当、全面压实各方绝对责任使安全指标全面受控。\"只管自身负责部分、其余于己无关\"与整体协同、全员全过程管理的理念相悖，描述不正确，故答案为D。"},{"id":"safety_fs_0001","module":"safety","bank":"辐射防护二级","type":"judge","stem":"根据辐射工作许可证（RWP）办理要求，如果你接到指令，要实施一项紧急抢修工作，可以直接使用你的其他RWP进入开展工作。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：RWP是针对特定工作办理的个人许可，不得超范围使用。紧急抢修工作同样属于辐射工作，须按规定办理与该工作对应的RWP，不能直接使用已有的其他RWP进入开展工作，故该说法错误。"},{"id":"safety_fs_0002","module":"safety","bank":"辐射防护二级","type":"judge","stem":"办理辐射工作许可证（RWP）时，如果预计最大个人剂量为5mSv，则其分级应为高度风险2级。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RWP按集体剂量、最大个人剂量等要素分级，2级的最大个人剂量区间为1～4mSv，预计最大个人剂量5mSv已不低于4mSv，应定为风险更高的1级RWP，故该说法错误。"},{"id":"safety_fs_0003","module":"safety","bank":"辐射防护二级","type":"judge","stem":"高辐射区域工作，应尽量减少现场工作人数，与工作暂时无关的人员应安排撤至低剂量等待区。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：高辐射风险作业现场控制要求最少人数、时间最短、路线最优，并善用低剂量等待区。因此高辐射区域工作应尽量减少现场人数，与工作无关的人员撤至低剂量等待区，该说法正确。"},{"id":"safety_fs_0004","module":"safety","bank":"辐射防护二级","type":"judge","stem":"本班组都不是辐射防护（RP）人员, 所以没有必要留心现场辐射防护标识牌上的信息。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：辐射分区标识牌表明区域辐射分区与剂量率水平，人员出入须关注标识牌信息。现场所有人员都应留心辐射防护标识信息以做好自我防护，并非只有RP人员需要，故该说法错误。"},{"id":"safety_fs_0005","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内的物品表面是否有污染, 工作人员完全可凭自己以往的经验判断, 不必担心自身是否会被沾污。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：辐射看不见摸不到，污染无法凭经验直接判断，须通过辐射仪表测量确认。课件《辐射防护(共性）》也指出只能通过辐射测量仪表判断辐射强弱。因此凭经验判断、不担心沾污的做法是错误的。"},{"id":"safety_fs_0006","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在核岛现场，工作人员应谨防走错间隔，避免非计划照射。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：案例中QC人员走错间隔误入高辐射风险房间，导致多人受到超限值照射，教训即避免走错间隔。故在核岛现场应谨防走错间隔，避免非计划照射，该说法正确。"},{"id":"safety_fs_0007","module":"safety","bank":"辐射防护二级","type":"judge","stem":"维修冷停期间和功率运行期间进入反应堆厂房，外照射风险是一样的。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：机组临界后反应堆厂房按红区管理，且不同功率、不同区域辐射风险不同。因此冷停期间与功率运行期间进入反应堆厂房，外照射风险并不相同，该说法错误。"},{"id":"safety_fs_0008","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射防护停工待检点任何情况都禁止逾越，必须经辐射防护人员检查、签字确认符合要求后才能继续后继工作。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RP-H停工待检点须RP人员到场确认、给予放行后方可进行后续工作，多数跨越H点行为属于红黄线违章，任何情况都不得逾越。该说法正确，课件练习题亦给出相同答案。"},{"id":"safety_fs_0009","module":"safety","bank":"辐射防护二级","type":"judge","stem":"作业班组应在工作的准备阶段，分析识别作业步骤可能存在的辐射风险，以及需采取的措施等。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射工作全流程管理要求在工作开始前开展辐射风险分析，工前会也要识别辐射风险、强调防护措施。故作业班组应在准备阶段识别辐射风险及措施，该说法正确。"},{"id":"safety_fs_0010","module":"safety","bank":"辐射防护二级","type":"judge","stem":"机组功率运行期间，为了便于就地仪表状态检查，允许作业人员到反应堆厂房内环廊主管道附近区域。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：机组功率运行期间反应堆厂房按红区管理，进入须申请专门许可，且案例显示人员进入燃料运输通道等区域曾受非计划照射。故以检查仪表为由进入环廊主管道附近区域不被允许，该说法错误。"},{"id":"safety_fs_0011","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内不允许吃东西、喝水、吸烟，主要目的是为了防止体内污染。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：内照射的食入防护要求禁止在辐射控制区吃、喝或吸烟，防止放射性物质经口进入人体。故该禁令的主要目的是防止体内污染，该说法正确。"},{"id":"safety_fs_0012","module":"safety","bank":"辐射防护二级","type":"judge","stem":"进入表面污染隔离区工作，工作人员应穿附加防护用品，根据具体情况这些用品可以单独使用，亦可以配套使用。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：进入污染隔离区前须按要求穿戴纸衣、橡胶手套、塑料鞋套等附加防护用品，并可根据作业风险（如潮湿环境加穿防水纸衣等）选择使用，可单独使用也可配套使用，该说法正确。"},{"id":"safety_fs_0013","module":"safety","bank":"辐射防护二级","type":"judge","stem":"作业人员可以在污染隔离区内随手擦汗或触摸脸部。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》及《辐射防护(共性）》：禁止在污染作业区内随手擦汗或触摸脸部，尤其嘴、眼、鼻等部位，以防体表沾污。案例显示有人未脱手套拉扯口罩触摸面部导致面部污染。故该说法错误。"},{"id":"safety_fs_0014","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射工作许可证RWP仅是辐射控制区内工作的一种凭证，对辐射工作的开展并无指导作用。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RWP包含辐射风险分析、防护措施制定、作业剂量预估等内容，是审核批准辐射工作的书面文件，开工前须熟悉其防护要求并严格落实。故RWP对辐射工作具有指导作用，该说法错误。"},{"id":"safety_fs_0015","module":"safety","bank":"辐射防护二级","type":"judge","stem":"射线探伤期间，射线探伤区域设置安全隔离，悬挂警示标识，发现与探伤无关人员进入隔离区域要立即制止和报告。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：射线探伤作业区域必须隔离清场、设置安全隔离区和明显警示标识，探伤开始前清场彻底，与探伤无关人员禁止进入隔离区。发现无关人员进入应立即制止和报告，该说法正确。"},{"id":"safety_fs_0016","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作中发现辐射突然异常升高，应暂停工作，撤离至安全区域并通知RP人员。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：出现辐射异常时应暂停工作，在确保安全的情况下撤离至安全区域并汇报，案例亦强调异常及时撤离可避免更严重后果。故该说法正确。"},{"id":"safety_fs_0017","module":"safety","bank":"辐射防护二级","type":"judge","stem":"跨越辐射防护停工待检点的行为属于红线线违章。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射防护停工待检点（RP-H点）任何情况禁止逾越，多数跨越H点行为属于红黄线违章，故跨越辐射防护停工待检点属于红线违章，该说法正确。"},{"id":"safety_fs_0018","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射工作许可证（RWP）由高到低分别为4级、3级、2级和1级。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RWP按辐射风险由低到高分为4级、3级、2级、1级，4级风险最低、1级风险最高。题目表述由高到低顺序颠倒，故该说法错误，课件练习题亦给出相同答案。"},{"id":"safety_fs_0019","module":"safety","bank":"辐射防护二级","type":"single","stem":"从辐射控制区外带入的专用工器具，在使用过程中被轻微污染，工作结束后应该优先：（ ）。","options":["填写《去污申请单》，交由去污人员去污 ；","报废，扔到放射性废物收集点；","放到辐射控制区内的污染工具间保管；","自行用便携式辐射仪表测量后，带出辐射控制区。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：污染隔离区内使用过的工器具，未经污染测量合格前应按污染工器具对待；课件《辐射防护(共性）》也规定发现物品污染后应包裹并交去污人员去污。故被污染的专用工器具应优先填写去污申请单交由去污人员处理，选A。"},{"id":"safety_fs_0020","module":"safety","bank":"辐射防护二级","type":"judge","stem":"针对非例行的高辐射风险稀有操作，不仅要进行正常情况下的风险识别，还要特别关注异常情况下的潜在辐射风险分析识别。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射工作风险分析要求分析应充分和保守，案例教训指出稀有操作重视度不够、风险识别不到位会导致辐射水平突变等事件。故对非例行高风险稀有操作，正常与异常情况下都要做风险识别，该说法正确。"},{"id":"safety_fs_0021","module":"safety","bank":"辐射防护二级","type":"judge","stem":"放射性设备检修工作除了按照正常情况考虑正常的防护措施外，还应考虑该项工作可能出现的异常情况和潜在风险，并制定相应的应急预案，以便在出现异常时最大限度的保护设备和工作人员的安全。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射风险分析应充分和保守，需考虑工作过程中所有可能导致辐射环境明显变化的步骤及潜在风险要素；高辐射风险工作还须制定应急方案，异常时保证安全。故该说法正确。"},{"id":"safety_fs_0022","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射风险分析，就是分析某项工作过程中存在的辐射危害及其风险大小。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射风险分析从系统设备类型、工作内容、反应堆相关度、工作步序、工器具、实施窗口等要素识别辐射风险。即分析工作过程中存在的辐射危害及其风险大小，该说法正确。"},{"id":"safety_fs_0023","module":"safety","bank":"辐射防护二级","type":"judge","stem":"人员进入负压工作棚执行作业时，应根据工作类型和空气污染风险，按要求穿戴过滤式面罩、气面罩、全面罩或气衣等进行防护。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：空气污染个人防护用品包括口罩、半面罩、全面罩、气面罩、气衣等，用于限制气载放射性物质的吸入；负压工作棚（SAS）用于防止放射性物质扩散。进入此类区域作业应按空气污染风险穿戴相应呼吸防护用品，该说法正确。"},{"id":"safety_fs_0024","module":"safety","bank":"辐射防护二级","type":"single","stem":"工作班组应按照现场的辐射标识和提示信息采取防护，以下说法错误的是（ ）。","options":["不跨越辐射防护隔离带；","远离辐射热点；","附近未放置所要求的附加防护用品，因此不必穿戴；","按照标识信息要求出入空气污染隔离区。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：进入检修场地前须穿戴好附加防护用品、做好个人防护，并按现场辐射标识和提示信息采取防护。附加防护用品未放置属于现场布置缺陷，应报告补齐而不是不穿戴，故C说法错误，选C。"},{"id":"safety_fs_0025","module":"safety","bank":"辐射防护二级","type":"single","stem":"工作负责人对严格布置的污染隔离区状态检查，发现以下哪类异常，不必联系现场服务人员处理（ ）。","options":["污染隔离区门槛之外的松散污染较高；","污染隔离内工器具未落实污染防护；","铺设的塑料布、地垫破损；","出入口废物收集桶满溢。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：污染隔离区内工器具的污染防护属于作业班组自身职责，可由班组成员自行落实和整改；而隔离区外松散污染较高、塑料布地垫破损、废物桶满溢等涉及场地边界完整性与污染扩散的问题，需联系现场服务人员处理，故选B。"},{"id":"safety_fs_0026","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于批准的放射性工作实施方案和检修规程的执行要求，正确的是（ ）。","options":["组织班组成员现场讨论后，可以变更步骤和工作范围；","严禁现场临时变更；","进度压力大，工作负责人慎重考虑后，可以变更；","以上均可。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：辐射工作人员不得从事超出RWP规定作业范围的辐射工作，否则必须办理变更或重新申请办理。故批准的实施方案和检修规程严禁现场临时变更，选B。"},{"id":"safety_fs_0027","module":"safety","bank":"辐射防护二级","type":"single","stem":"正在检修设备的班组成员佩戴的电子剂量计EPD出现报警，作为工作负责人，你该如何处理：（ ）","options":["当什么都没发生，指令其继续工作；","征询班组成员意见，讨论是否继续作业；","确保设备处于安全状态下，立即暂停工作，撤离至安全区域并报告辐射防护人员；","打电话给主控，请求值长下达指令。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》及《辐射防护(共性）》：EPD报警时应立即置手头工作于安全状态，撤离受影响区域并通知辐射防护人员。课件练习题亦给出答案：确保设备安全后立即暂停工作、撤离并报告，故选C。"},{"id":"safety_fs_0028","module":"safety","bank":"辐射防护二级","type":"single","stem":"以下属于中国核电辐射防护红线违章的是：（ ）。","options":["电子剂量计报警后未报告辐射防护人员；","未穿戴塑料鞋套等附加防护用品进入放射性污染隔离区；","未经批准，擅自进入辐射控制区红区/橙区；","越过辐射防护现场见证点作业。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：辐射防护红线包括未经批准擅自进入辐射控制区红区/橙区、射线探伤隔离区域等；EPD报警未报告、未穿附加防护用品进污染隔离区属黄线违章，越过现场见证点不属于红线。故选C。"},{"id":"safety_fs_0029","module":"safety","bank":"辐射防护二级","type":"single","stem":"工作人员进入辐射控制区工作，均要佩戴电子剂量计EPD和热释光剂量计TLD，它们统一佩戴在（ ）。","options":["左胸口袋内；","右胸口袋内；","左胸口袋外；","右胸口袋外。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：EPD、TLD应佩戴在连体服左胸处的口袋内，并确认正面朝外，不可佩戴在铅衣、气衣等防护用品外面。故选A左胸口袋内。"},{"id":"safety_fs_0030","module":"safety","bank":"辐射防护二级","type":"judge","stem":"射线探伤结束后，工作负责人不必对放射源的安全状况进行检查确认。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：探伤作业中放射源必须由专人看管回收，作业前中后执行安全检查单。探伤结束后工作负责人必须对放射源安全状况检查确认，故该说法错误。"},{"id":"safety_fs_0031","module":"safety","bank":"辐射防护二级","type":"single","stem":"放射性系统某阀门解体检修，该阀门管径200mm，且需要进行阀芯机械（电动）研磨作业，需采取（ ）防护措施。","options":["建立污染隔离区，建立动态封闭 ；","建立简单布置的污染隔离区；","建立污染隔离区和动态封闭，人员采取防表面污染和空气污染措施；","建立污染隔离区和静态封闭（SAS棚），人员采取防表面污染和空气污染措施。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：改变放射性设备完整性的工作（解体、研磨等）可能导致剂量率升高和污染扩散，须根据开口尺寸等综合评估风险；课件《辐射防护(共性）》指出切割研磨类作业有内照射风险，需负压封闭（SAS棚）并穿戴防护用品。管径200mm的阀门电动研磨应建污染隔离区和静态封闭并做防表面污染与空气污染防护，选D。"},{"id":"safety_fs_0032","module":"safety","bank":"辐射防护二级","type":"judge","stem":"使用放射源对仪表进行标定或校验，如果是V类放射源，可以不办理辐射工作许可证RWP。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：任何辐射工作均需办理RWP；且RWP分级标准中3级RWP即对应使用V类源和IV类源的工作。故使用V类放射源标定仪表也必须办理RWP，该说法错误。"},{"id":"safety_fs_0033","module":"safety","bank":"辐射防护二级","type":"judge","stem":"某电厂存放在放射源库内的化学腐蚀性物品，尽管放在放射源附近，但设置了明显的边界、标识，并进行定期巡检。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：放射源库是贮存放射源的专门场所，应严格安全管理。化学腐蚀性物品存放在放射源附近，即使设置边界标识并定期巡检，也存在腐蚀损坏放射源容器、引发安全事故的风险，不应存放，故该做法错误。"},{"id":"safety_fs_0034","module":"safety","bank":"辐射防护二级","type":"single","stem":"以下关于高辐射风险区域管理规定，错误的是：（ ）","options":["未经许可不得打开红、橙区门；","红、橙区工作任务结束后应确认所有人员均已离开方可上锁；","红、橙区辐射水平远远超出预估水平时，不用核实和报告，可直接组织工作班组人员实施作业；","工前会要告知班组成员，房间预估辐射水平和预计作业时间。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：橙、红区房间作业须申请开门许可，作业前RP人员进行风险评估并监督，无关人员禁止进入，作业后房间立即上锁；工前会应告知预估辐射水平和作业时间。辐射水平远超预估时须重新评估并报告，不得直接作业，故选C。"},{"id":"safety_fs_0035","module":"safety","bank":"辐射防护二级","type":"judge","stem":"Ⅴ类放射源为极低危险源，会对人造成致命的永久性损伤。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：V类放射源为极低危险源，不会对人造成永久性损伤；会造成致命永久性损伤的是I、II、III类等高类别放射源。故该说法错误。"},{"id":"safety_fs_0036","module":"safety","bank":"辐射防护二级","type":"single","stem":"机组处于以下哪种状态时，反应堆厂房不再整体作为高辐射区管理：（ ）","options":["50%额定功率以下 ；","冷态；","临界；","100%功率运行。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：以M310机组为例，机组临界后反应堆厂房按红区管理，即临界及功率运行期间整体作为高辐射区管理；机组处于冷态时不再整体按高辐射区管理，故选B。"},{"id":"safety_fs_0037","module":"safety","bank":"辐射防护二级","type":"judge","stem":"豁免放射源对人体的伤害，在任何情况下都要重视。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：豁免放射源的活度极低，其辐射风险可以忽略，按豁免水平管理，正常情况下的照射不会对人体造成有意义的伤害，因此\"任何情况下都要重视\"的说法过于绝对，故该说法错误。"},{"id":"safety_fs_0038","module":"safety","bank":"辐射防护二级","type":"single","stem":"作业结束后，工作负责人应：（ ）。","options":["及时组织对工作过程进行总结；","对发现的问题进行分析，并提出优化改进建议；","将工作中的良好做法进行固化，落实到相关程序文件中；","A+B+C 。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：工作结束后，工作负责人组织对工作全过程进行总结，对发现的问题进行分析并提出优化改进建议，固化良好做法并落实到相关程序文件中。A、B、C均正确，故选D。"},{"id":"safety_fs_0039","module":"safety","bank":"辐射防护二级","type":"judge","stem":"生产、销售、使用、贮存放射性同位素和射线装置的场所，应按照国家有关规定设置明显的放射性标志。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：按国家放射性同位素与射线装置安全和防护的有关规定，生产、销售、使用、贮存放射性同位素和射线装置的场所应设置明显的放射性标志，以警示辐射风险，故该说法正确。"},{"id":"safety_fs_0040","module":"safety","bank":"辐射防护二级","type":"judge","stem":"根据放射源、射线装置对人体健康和环境的潜在危害程度，我国将射线装置分为4类，将放射源分为2类。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：根据对人体健康和环境的潜在危害程度，放射源从高到低分为Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ共5类，射线装置分为Ⅰ、Ⅱ、Ⅲ共3类。题目说射线装置4类、放射源2类，故该说法错误。"},{"id":"safety_fs_0041","module":"safety","bank":"辐射防护二级","type":"single","stem":"班组如何获取现场射线探伤信息（ ）。","options":["核电厂网页发布的射线探伤公告；","主要出入口的探伤告示牌；","就地的探伤标识和声光报警；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：班组获取现场射线探伤信息的途径包括电厂网页射线探伤公告、主要出入口告示牌、就地标识和声光报警，以及主控广播通知。A、B、C均为有效途径，故选D。"},{"id":"safety_fs_0042","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于橙、红区房间作业，以下正确的是：（ ）。","options":["RP人员需监督作业过程；","作业完成后房间上锁；","制止无关人员进入作业房间；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：橙、红区房间作业要求RP人员监督作业过程、无关人员禁止进入、作业后房间立即上锁。A、B、C均为管理要求，故选D。"},{"id":"safety_fs_0043","module":"safety","bank":"辐射防护二级","type":"single","stem":"在辐射工作的现场开始实施阶段，工作负责人应：（ ）。","options":["到达作业位置，测量辐射水平，告知班组成员；","组织召开工前会，宣贯作业步骤、识别风险、制定措施；","工完料尽场地清；","A+B+C。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：现场实施阶段，工作负责人应到达作业位置测量辐射水平并告知班组成员，并做RWP和控制点文件先决条件检查；工前会在开工准备阶段召开，工完料尽场地清属完工阶段，故选A。"},{"id":"safety_fs_0044","module":"safety","bank":"辐射防护二级","type":"single","stem":"对于100居里的Ir-192放射源，距离10m远的剂量率水平约为（ ）。","options":["10μSv/h；","20mSv/h；","4mSv/h；","8Sv/h。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：100居里的Ir-192探伤源，距离1m远的剂量率高达400mSv/h，距离10m远的剂量率也有4mSv/h。故选C。"},{"id":"safety_fs_0045","module":"safety","bank":"辐射防护二级","type":"single","stem":"辐射防护控制点包括：（ ）。","options":["停工待检点（RP-H点）和辐射防护现场见证点（RP-W点）；","停工待检点（RS-H点）和辐射防护现场见证点（RS-W点）；","现场检查停工点（RP-H点）和远程见证点（RP-W点）；","停工待检点（RS-H点）和辐射安全见证点（RS -W点）。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射防护控制点是由辐射防护人员验证现场工作条件和防护措施是否满足要求而设置的控制点，包括停工待检点（RP-H点）和辐射防护现场见证点（RP-W点），故选A。"},{"id":"safety_fs_0046","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于放射源的安全使用，下列说法错误的是：（ ）。","options":["放射源（豁免源除外）使用过程中，工作人员必须佩戴个人剂量计；","非密封放射性物质的稀释、配制操作或Ⅳ类及Ⅳ类以上密封放射源的使用，可以不用编制操作规程或操作单；","放射源使用期间，使用人员对放射源的安全负责；","借出放射源原则上应于当日归还源库，现场连续作业且放射源处于有效控制情况下，可酌情延长放射源借出时间。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：任何辐射工作均需办理RWP，放射源使用须遵守严格的管理流程，课件强调不按放射源管理程序规定操作放射源属于黄线违章。操作规程、佩戴剂量计、使用人员对源安全负责、当日归还源库等均为安全使用要求，故B说法错误，选B。"},{"id":"safety_fs_0047","module":"safety","bank":"辐射防护二级","type":"single","stem":"探伤作业结束后，必须用（ ）进行监测，确定放射源收回源容器后，在检查记录上签字，方能携带探伤装置离开现场。","options":["热释光剂量计；","辐射剂量监测仪；","电子剂量计；","测温仪。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：探伤作业中放射源必须由专人看管回收，作业前中后执行安全检查单；确认放射源收回须用辐射监测仪器测量。热释光剂量计、电子剂量计是个人剂量计，不能用于确认源的安全状态，故选B。"},{"id":"safety_fs_0048","module":"safety","bank":"辐射防护二级","type":"single","stem":"根据射线装置对人体健康和环境的潜在危害程度，从高到低将射线装置分为（ ）类。","options":["1；","3；","5；","7。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：根据对人体健康和环境的潜在危害程度，从高到低将射线装置分为Ⅰ、Ⅱ、Ⅲ类，共3类，故选B。"},{"id":"safety_fs_0049","module":"safety","bank":"辐射防护二级","type":"single","stem":"在污染隔离区内工作时，应优先使用（ ）工具。","options":["自带工具；","其他班组不小心遗留的工具；","专用于污染隔离区的工具；","常规工具库房借用的工具。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：污染隔离区内应尽量减少带入物项，专用工具只在该区域内使用，可避免与洁净工具混放造成交叉污染（课件案例一即为沾污工器具与正常工器具混放运输导致交叉污染），也便于污染管理。自带工具、遗留工具和常规库房工具都可能把污染带出或造成交叉污染，故选C。"},{"id":"safety_fs_0050","module":"safety","bank":"辐射防护二级","type":"single","stem":"某日凌晨1时，某检测公司将1枚75Se放射源（活度3.7E+11Bq，Ⅲ类源）进行无损检测作业，探伤结束后，由于设备故障，放射源未能回收到探伤机内。工作人员未检查放射源是否回收到探伤机内，也未在作业结束后进行相关检测，致使放射源丢失在了施工现场而未被发现。1时30分左右，该放射源被一公司职工捡到，带回宿舍。探伤工作人员到中午12 时再次使用探伤机时，才发现放射源丢失，并开始寻找，至15时30分放射源被找回，该放射源失控达14 小时，事故造成多人受照。造成本次事故的主要原因有（ ）。","options":["探伤工作人员违反操作规程，探伤作业结束后，未检查放射源是否安全收回；","未使用辐射监测仪器进行放射源安全状态确认；","探伤设备带病作业，未能对探伤设备进行有效检查维护；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：探伤作业放射源必须由专人看管回收，作业前中后执行安全检查单，探伤后须用监测仪器确认源的安全状态。本次事故中违规操作、未用仪器确认、设备带病作业均是原因，故选D。"},{"id":"safety_fs_0051","module":"safety","bank":"辐射防护二级","type":"single","stem":"经综合评估后需要成立ALARA专项工作组的一项或多项辐射工作分类称为（  ）辐射工作。","options":["A类；","B类；","C类；","乙类。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射工作经综合评估分为A、B两类，其中经综合评估后需要成立ALARA专项工作组的一项或多项辐射工作称为A类辐射工作，故选A。"},{"id":"safety_fs_0052","module":"safety","bank":"辐射防护二级","type":"single","stem":"根据放射源对人体健康和环境的潜在危害程度，我国将放射源分为（ ）类。","options":["1；","3；","5；","7。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：根据对人体健康和环境的潜在危害程度，我国将放射源从高到低分为Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ类，共5类，故选C。"},{"id":"safety_fs_0053","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于作业过程的辐射风险分析，以下说法正确的是：（ ）。","options":["有些检修步骤和方法会引入一些新的风险；","作业步骤分析只需要考虑作业过程的主线，不需要考虑其它辅助工作；","作业过程分析可以完全根据在其他电厂的经验进行。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射风险分析需覆盖实施窗口、工作步序、系统设备类型、工作内容、反应堆相关度、工器具六要素，工器具使用可能引入额外辐射风险（如切割机引入空气污染风险），即某些检修步骤和方法会引入新的风险。而辅助工作、本电厂现场条件同样需要分析，不能完全照搬其他电厂经验，故选A。"},{"id":"safety_fs_0054","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于放射源的使用，错误的是：（ ）。","options":["制定放射源操作规程，并严格按照规程操作；","佩戴个人剂量计和便携式剂量率仪；","操作放射源两人同时在场，其中一人监护，一人操作；","使用放射源前后，不必检查确认放射源的安全状态。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射源借用使用完毕应立即归还并办理登记签字手续，探伤等作业前中后均须执行安全检查单确认源的安全状态。因此使用放射源前后必须检查确认其安全状态，D说法错误，选D。"},{"id":"safety_fs_0055","module":"safety","bank":"辐射防护二级","type":"single","stem":"辐射工作许可证主要包括以下内容：（ ）。","options":["辐射风险分析；","防护措施制定；","作业剂量预估；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RWP主要包括三方面内容：辐射风险分析（结合运行工况、作业环境、工作内容分析辐射风险）、防护措施制定（按需设置辐射防护控制点）、作业剂量预估（预估并评价个人和集体剂量），故选D。"},{"id":"safety_fs_0056","module":"safety","bank":"辐射防护二级","type":"judge","stem":"放射性物品一般是指污染设备、活化设备、放射性废物、放射性样品等，其表面污染＞4Bq/cm2，接触剂量率＞1μSv/h的物品。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射性物品的界定判断标准为表面污染水平＞0.4Bq/cm2、表面接触剂量率＞200nSv/h。题目中的4Bq/cm2和1μSv/h均不正确，故该说法错误。"},{"id":"safety_fs_0057","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作负责人应督促本班组人员，将随身携带的小件物品经CPO污染测量合格，确认无污染后才能带出。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》及《辐射防护(共性）》：随身携带的小物品必须经小件物品污染监测仪（CPO）测量，确认无污染后才能带出辐射控制区。工作负责人应督促班组成员落实，该说法正确。"},{"id":"safety_fs_0058","module":"safety","bank":"辐射防护二级","type":"judge","stem":"道路运输一类放射性物品时，可以随便选择使用运输容器。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：一类放射性物品危险性高，道路运输须使用与其危险性质相适应的、经检验合格的专用运输容器，并按国家放射性物品运输安全规定执行，不能随便选择运输容器，故该说法错误。"},{"id":"safety_fs_0059","module":"safety","bank":"辐射防护二级","type":"single","stem":"“高辐射风险区域进入许可证”可用于申请进入哪些区域的作业：（ ）。","options":["红区；","功率运行时的反应堆厂房部分区域；","橙区；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：若需进入高辐射区域（橙、红区），应办理进入高辐射控制区的专门许可，如高辐射区域进入许可、钥匙借用许可或开门许可等；课件《辐射防护二级》还指出功率运行期间反应堆厂房属高辐射风险作业场所。A、B、C均可用该许可申请进入，故选D。"},{"id":"safety_fs_0060","module":"safety","bank":"辐射防护二级","type":"judge","stem":"所有参与放射性物品运输的人员，需佩戴好个人剂量计。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射性物品厂内运输条件要求相关人员佩戴个人剂量监测设备（EPD）。参与放射性物品运输的人员均存在受照风险，须佩戴个人剂量计，该说法正确。"},{"id":"safety_fs_0061","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在运输车辆到达之前，不得将放射性物品提前转移出辐射控制区。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射性物品须规范存放，包裹或建立污染隔离区，避免与非放物品混放，远离人员通道和辐射监测设备；运输遵循先审批后执行原则。提前转移出辐射控制区会导致物品失控和污染扩散风险，故该说法正确。"},{"id":"safety_fs_0062","module":"safety","bank":"辐射防护二级","type":"judge","stem":"放射性物品存放点应远离通道、楼梯间、电梯间、消防设施、通风出入口等区域。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射性物品存放要求远离人员通道、远离通风口、避免影响辐射监测仪表，并避免与非放物品混放、红橙区禁放。故存放点应远离通道、楼梯间、电梯间、消防设施、通风出入口等区域，该说法正确。"},{"id":"safety_fs_0063","module":"safety","bank":"辐射防护二级","type":"single","stem":"一份橙区的“高辐射风险区域的进入许可证”，其最终批准人是：（ ）。","options":["相应机组的值长；","防护支持科负责人；","辐射防护科负责人；","辐射防护工程师。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RWP分级审批权限表中，2级RWP（对应橙区）的最终批准人为辐射防护科负责人或其指定授权人。橙区的高辐射风险区域进入许可证属2级许可，最终批准人为辐射防护科负责人，故选C。"},{"id":"safety_fs_0064","module":"safety","bank":"辐射防护二级","type":"judge","stem":"运输放射性物品的包装应结实可靠、密封良好，确保放射性内容物不会泄漏、扩散、溢出。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射性物品运输包装要求结实可靠、密封良好、易于去污、不易破损，运输前必须事先包装，避免放射性物质在运输过程中泄漏，故该说法正确。"},{"id":"safety_fs_0065","module":"safety","bank":"辐射防护二级","type":"judge","stem":"放射性物品运输和存放不当，存在污染扩散和人员接受不必要照射的风险。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：课件练习题明确指出放射性物品运输和存放不当，存在污染扩散和人员接受不必要照射的风险，该说法正确。课件亦有包装破损导致污染扩散的实际案例。"},{"id":"safety_fs_0066","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列不属于高辐射风险作业的是：（ ）。","options":["橙红区作业；","射线探伤；","反应堆指套管拆卸/抽拔；","绿区地面补漆。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：常见高辐射风险作业包括橙、红区作业，功率运行期间反应堆厂房作业，指套管拆卸/抽拔，高放过滤器芯更换，射线探伤等。绿区为低剂量率区域，地面补漆辐射风险低，不属于高辐射风险作业，故选D。"},{"id":"safety_fs_0067","module":"safety","bank":"辐射防护二级","type":"single","stem":"放射性物品在厂区内的运输，下列做法错误的是：（ ）。","options":["放射性物品的包装应完好整洁，货包外张贴放射性物品标签；","对于辐射风险较高的厂内运输，RP人员提供现场辐射防护指导和监督；","运输工具、车辆应定期（例如每月）进行放射性污染检查；","放射性物品按流程审批同意进入厂区后，必须直接将其运至指定存放地点，未经辐射防护人员同意，不得在中途停留或将其放在非指定地点。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：厂内运输要求货包包装完好整洁、张贴放射性标签，高风险运输由RP人员现场指导和监督，放射性物品须直接运至指定存放地点、中途不得停留。而运输工具、车辆的污染检查应在每次使用后进行，而非\"每月定期\"，故C做法错误，选C。"},{"id":"safety_fs_0068","module":"safety","bank":"辐射防护二级","type":"single","stem":"辐射工作风险分析要点包括：（ ）。","options":["识别系统设备类型；","确认和分析工作内容对放射性设备的影响；","考虑使用工器具是否会引入额外的辐射风险；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射风险分析从六方面开展，包括识别系统设备类型（判断是否放射性工艺系统及设备类型）、确认和分析工作内容对放射性设备的影响、考虑使用工器具是否会引入额外的辐射风险等。A、B、C均为分析要点，故选D。"},{"id":"safety_fs_0069","module":"safety","bank":"辐射防护二级","type":"single","stem":"放射性物品禁止与非放射性物品混放，非放射性物品与放射性物品存放场地至少应保证的间隔距离是：（ ）。","options":["30cm；","4m；","6m；","2m。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射性物品存放要求避免与非放物品混放，间隔30cm。课件练习题亦给出相同答案：非放射性物品与放射性物品存放场地至少保证30cm间隔，故选A。"},{"id":"safety_fs_0070","module":"safety","bank":"辐射防护二级","type":"single","stem":"辐射工作全流程管理不包括：（ ）。","options":["在工作准备阶段，需要对辐射工作进行辐射风险分析；","执行现场工作前，办理辐射工作许可证；","到达设备检修作业场地，立刻开始作业；","作业结束后对检修的工器具，检修场地、工作票等做好清点、归还和关闭。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射工作全流程管理包括工作开始前的辐射风险分析、许可办理、方案与控制点、先决条件，过程中的班组和场地管理、作业过程控制，以及结束后的完工验收、许可关闭、总结与经验反馈。到达现场后应先完成先决条件检查再作业，不能立刻开始，故选C。"},{"id":"safety_fs_0071","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于放射性物品运输，下列说法错误的是：（ ）","options":["应采取措施防止放射性物品吊装和运输工具污染","除司机和押运人员外，其他人员也可以搭乘装载有放射性货包的运输车辆","在运输过程中需防止因运输作业导致的就地辐射监测设备数据升高，对于可能导致异常的运输作业，运输部门需提前向保健物理处通报","与运输有关的工器具每次使用后，如发现污染，必须去污至0.4Bq/cm2水平以下，否则不得用于非放射性物品贮存或运输"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：放射性货包运输车辆上除司机和押运人员外，其他人员不得搭乘，以减少不必要的受照。A防止吊装运输工具污染、C提前向保健物理处通报可能影响就地监测数据的运输作业、D污染工器具去污至0.4Bq/cm2以下方可再用于非放物品，均为正确做法，故选B。"},{"id":"safety_fs_0072","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于放射性物品厂内运输要求，下列说法错误的是：（ ）。","options":["货包装车时，应合理安排货包位置以降低车辆周围的剂量率（剂量率高的货包尽量放置在车厢中部）；","运输车辆外表面任一点上的辐射水平不得超过2mSv/h；","运输驾驶员座位处的辐射水平应尽可能低，一般不得超过0.1mSv/h；","在运输的起点和终点之间，临时决定进行装卸工作。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：厂内运输要求车辆外表面任一点辐射水平不超过2mSv/h、座位处不超过0.1mSv/h，装车时高剂量率货包尽量放车厢中部，且明确路线、过程无停留。在起点和终点之间临时决定装卸违反运输管理要求，故选D。"},{"id":"safety_fs_0073","module":"safety","bank":"辐射防护二级","type":"judge","stem":"严重非计划照射事件：所有未经计划导致人员单次接受剂量超过20mSv（含20mSv），小于50mSv的照射事件，单位：人次。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：严重非计划照射事件是指所有未经计划导致人员单次接受剂量≥15mSv且＜50mSv，或皮肤当量剂量≥150mSv且＜500mSv的照射事件。题目表述为\"超过20mSv\"，与课件定义不符，故该说法错误。"},{"id":"safety_fs_0074","module":"safety","bank":"辐射防护二级","type":"judge","stem":"对辐射工作人员来说，每年的有效剂量限值是任何一年不得超过30mSv，连续5年内平均不得超过20mSv。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：按GB18871-2002，辐射工作人员年有效剂量限值为任何一年不得超过50mSv，连续5年内平均不得超过20mSv。题目中\"任何一年不得超过30mSv\"错误，故该说法错误，课件练习题亦给出相同答案。"},{"id":"safety_fs_0075","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列对于放射性物品厂内运输人员受照剂量和辐射水平监测的描述，正确的是：（ ）。","options":["参与运输的人员都应佩戴个人剂量计；","运输工作负责人应全程跟踪；","使用车辆运输结束后，辐射防护人员对车辆进行表面污染普查；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：放射性物品厂内运输要求参与运输人员佩戴个人剂量监测设备（EPD）、运输负责人全程跟踪。课件练习题亦确认：参与运输人员都应佩戴个人剂量计、工作负责人全程跟踪、运输结束后RP人员对车辆进行表面污染普查，故选D。"},{"id":"safety_fs_0076","module":"safety","bank":"辐射防护二级","type":"judge","stem":"颈部及以上部位的污染，工作人员可自行去污。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：C2门检出体表污染时，颈部以下部位可在RP人员指导下清洗去污，颈部以上污染须通知RP人员、由专业去污人员处理，严禁自行对颈部以上体表污染去污。故该说法错误。"},{"id":"safety_fs_0077","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射安全管理由辐射防护科负责，具体作业处室无需关心。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：辐射安全是全员责任。课件《辐射防护二级》明确班组人员负有辐射安全职责（不发生非计划照射、体表污染、体内污染等），电厂每位员工都有责任和义务制止、纠正现场发现的辐射防护不安全行为和状态。具体作业处室必须关心辐射安全，故该说法错误。"},{"id":"safety_fs_0078","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射防护指标重点关注人的辐射安全和物的辐射安全。（  ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射防护指标按\"人的安全\"和\"物的安全\"两大类设置，人的安全包括辐射事故、非计划照射事件、体内外污染事件、最大个人剂量等，物的安全包括区域污染事件、放射性物品失控事件、集体剂量等。故该说法正确，课件练习题亦给出相同答案。"},{"id":"safety_fs_0079","module":"safety","bank":"辐射防护二级","type":"single","stem":"放射性污染标示牌如下图，其中说法错误是：（ ）","options":["“污染形式”用于指明该隔离区域内放射性污染涉及的空间和介质，如地面污染、设备污 染、管道污染、墙面污染、空气污染等","“进入需穿戴的附加防护用品”用于工作人员确认，在进入隔离区域前是否已经穿戴好相应的附加防护用品","在此隔离区域内开展工作需要通知辐射防护人员，一般工作如巡检、巡视之类按照要求穿戴自行进入","工作结束后，无需对带入使用的工器具及手脚等部位进行污染测量，可以默认没有污染"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》及《辐射防护二级》：放射性污染标识牌提示隔离区污染水平、风险及进入防护要求；退出污染区须及时污染自测，离开辐射控制区时随身物品须经测量，未测量确认前应一律按污染物品对待，不能默认无污染。故D说法错误，选D。"},{"id":"safety_fs_0080","module":"safety","bank":"辐射防护二级","type":"single","stem":"特别重大辐射事故，是指Ⅰ类、Ⅱ类放射源丢失、被盗、失控造成大范围严重辐射污染后果，或者放射性同位素和射线装置失控、辐射防护管理或技术失效导致（ ）急性死亡。","options":["3人以上（含3人）；","2人以下（含2人）；","9人以下（含9人）；","5人以下（含5人）。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：特别重大辐射事故包括I类、II类放射源丢失、被盗、失控造成大范围严重辐射污染后果，或放射性同位素和射线装置失控、辐射防护管理或技术失效导致3人以上（含3人）急性死亡。课件练习题亦给出答案，故选A。"},{"id":"safety_fs_0081","module":"safety","bank":"辐射防护二级","type":"single","stem":"区域污染事件包括：（ ）。","options":["辐射控制区内污染水平超过40Bq/cm2，且污染面积超过1m2；","辐射控制区内污染水平超过4Bq/cm2，且污染面积超过10m2；","辐射控制区外污染水平超过0.4Bq/cm2；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：区域污染事件判断标准包括：辐射控制区内污染水平超过40Bq/cm2且面积超过1m2；控制区内污染水平超过4Bq/cm2且面积超过10m2；控制区外污染水平超过0.4Bq/cm2。课件练习题亦给出答案，故选D。"},{"id":"safety_fs_0082","module":"safety","bank":"辐射防护二级","type":"single","stem":"体内污染事件的定义是：（ ）。","options":["指放射性工作人员体内非氚放射性核素摄入量大于 100% ALI的事件；","指放射性工作人员体内非氚放射性核素摄入量大于 50% ALI的事件；","放射性工作人员体内非氚放射性核素摄入量大于 1% ALI的事件；","以上都不对。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：体内污染事件是指放射性工作人员体内非氚放射性核素摄入量大于1%ALI（ALI为年摄入量限值）的事件，单位：人次。故选C。"},{"id":"safety_fs_0083","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列属于放射性物品相关的指标是：（ ）。","options":["体表污染事件；","区域污染事件；","放射性物品失控事件；","严重/一般非计划照射事件。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射防护指标中\"物的安全\"类包括区域污染事件和放射性物品失控事件；体表污染事件（异常）针对人员，严重/一般非计划照射事件也针对人员受照。其中直接描述放射性物品（含放射源）非受控转移出辐射控制区的指标是放射性物品失控事件，故选C。"},{"id":"safety_fs_0084","module":"safety","bank":"辐射防护二级","type":"single","stem":"无法放入小件物品污染测量仪CPO的非放射性物品，带出辐射控制区需要经RP人员测量确认，控制标准是接触剂量率（ ），表面污染（ ）。","options":["＜200μSv/h， ＜0.4Bq/cm2；","＜200nSv/h， ＜0.4Bq/cm2 ；","＜200nSv/h， ＜0.8Bq/cm2 ；","＜200μSv/h， ＜4 Bq/cm2 。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：无法放入CPO的非放射性物品须办理带出申请，经RP人员测量确认，控制标准为接触剂量率＜200nSv/h、表面污染＜0.4Bq/cm2。故选B。"},{"id":"safety_fs_0085","module":"safety","bank":"辐射防护二级","type":"judge","stem":"为了降低个人受照剂量，可以无限制的增加人员轮换。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：课件练习题明确指出，无限制增加人员轮换不是ALARA的体现，只有在可能超过个人剂量控制值等特殊情况下，合理采取人员轮换才能降低个人受照剂量，且需权衡集体剂量。故该说法错误。"},{"id":"safety_fs_0086","module":"safety","bank":"辐射防护二级","type":"judge","stem":"为了控制作业时间、减少人员剂量，可以适当地降低检修规程要求的质量。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：剂量控制不能以牺牲检修质量为代价，降低规程质量要求会导致设备缺陷、返工甚至安全事故，反而可能增加集体剂量。ALARA是在保证工作质量前提下寻求剂量最合理低，故该说法错误。"},{"id":"safety_fs_0087","module":"safety","bank":"辐射防护二级","type":"judge","stem":"为了保证防护效果，可以尽可能地多穿戴附加防护用品。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"课件未直接覆盖：附加防护用品须按辐射风险分析确定的风险类型和防护要求选用，穿戴过多会增加人工时、降低作业效率，还可能带来热应激等新风险，反而增加受照剂量，不符合ALARA原则。故该说法错误。"},{"id":"safety_fs_0088","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列属于大多数辐射工作班组可能出现的事件/异常类型是：（ ）。","options":["体表污染异常；","重大辐射事故；","放射源丢失；","放射性物品违规厂外运输。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：体表污染异常是最常见的指标之一，课件特别提醒督促班组成员规范穿脱附加防护用品、退出污染隔离区后及时污染自测；重大辐射事故、放射源丢失、放射性物品违规厂外运输均属罕见严重事件。故大多数班组可能出现的是体表污染异常，选A。"},{"id":"safety_fs_0089","module":"safety","bank":"辐射防护二级","type":"judge","stem":"只要足够熟练和迅速，可以不按顺序脱除附加防护用品。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：脱除附加防护用品有固定顺序：先脱橡胶手套，再脱纸衣，最后脱鞋套，脱除时不得用力拉扯以防污染物溅起；不按顺序脱除曾造成工作服及体表沾污案例。故无论熟练与否都须按顺序脱除，该说法错误。"},{"id":"safety_fs_0090","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射风险分析是辐射防护人员的事，与作业班组人员无关。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射风险分析是辐射工作全流程管理中工作准备阶段的重要内容，作业班组、工作负责人均须参与，工前会由工作负责人组织识别辐射风险、强调防护措施。故辐射风险分析与作业班组人员密切相关，该说法错误。"},{"id":"safety_fs_0091","module":"safety","bank":"辐射防护二级","type":"judge","stem":"RP2级授权人员需要负责班组辐射安全，确保班组工作不会导致辐射事故事件。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射安全职责要求负责班组辐射安全，确保班组人员不发生非计划照射、体表污染、体内污染，突发辐射异常时组织正确响应，并避免本班组作业增加其他人员的辐射安全风险，即确保不会导致辐射事故事件。故该说法正确。"},{"id":"safety_fs_0092","module":"safety","bank":"辐射防护二级","type":"judge","stem":"降低高剂量区域工作人工时，能有效降低集体剂量。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：集体剂量等于人工时乘以剂量率，减少高剂量区域工作人工时能有效降低集体剂量；课件实例中通过转移检修场地、优化人数和时间创造了集体剂量历史最低成绩。故该说法正确。"},{"id":"safety_fs_0093","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射防护最优化原则：在考虑经济、社会和政治等各方面因素之后，个人受照剂量的大小、受照射的人数以及受照射的可能性均保持在可合理达到的尽量低水平。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射防护最优化原则（ALARA）即在考虑经济、社会和政治等各方面因素之后，个人受照剂量的大小、受照射的人数以及受照射的可能性均保持在可合理达到的尽量低水平。故该说法正确。"},{"id":"safety_fs_0094","module":"safety","bank":"辐射防护二级","type":"judge","stem":"具备RP2级授权的人员，需要对工作班组其他工作成员的辐射安全，同时确保本班组工作不会对其他工作人员造成辐射危害。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：辐射安全职责包括负责班组辐射安全，确保班组人员不发生非计划照射、体表污染和体内污染，且本班组作业避免增加其他人员的辐射安全风险。故RP2级人员须对班组成员的辐射安全负责，并确保不影响其他工作人员，该说法正确。"},{"id":"safety_fs_0095","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射防护最优化意味着要不惜一切代价使个人剂量尽可能低。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：ALARA是利益与代价的权衡，须考虑经济、社会等因素，保持在可合理达到的尽量低水平，并非不惜一切代价。课件练习题亦给出该说法错误（×），故该说法错误。"},{"id":"safety_fs_0096","module":"safety","bank":"辐射防护二级","type":"single","stem":"如何减少作业人工时：（ ）。","options":["细致的工作物项准备，包括文件、器材、工器具；","进行人员培训，提高工作技能，通过沙盘推演、模拟培训或操作演练；","良好的工作实施管理，包括人员分工、作业行为（转移设备到低剂量率区域检修、等待和讨论时优先考虑低剂量等待区等）；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：减少作业人工时的方法包括细致的工作准备（文件、器材、工器具），持续人员培训提高技能（沙盘推演、模拟培训或操作演练），良好的工作实施管理（人员分工及作业行为，如讨论待命在低剂量等待区等）。课件练习题亦给出相同答案，故选D。"},{"id":"safety_fs_0097","module":"safety","bank":"辐射防护二级","type":"single","stem":"RP2级人员担当工作负责人时，其辐射安全责任范围是：（ ）。","options":["仅对其自身的辐射安全，和其自身活动可能产生的辐射影响负责；","对其负责班组所有成员（包括自身在内）的辐射安全，及其班组作业可能产生的辐射影响负责；","仅对其所在班组所有成员的辐射安全，及其自身活动可能产生的辐射影响负责；","对其自身的辐射安全，及交叉作业班组活动可能产生的辐射影响负责。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RP2级人员担当工作负责人时，其辐射安全责任范围是对其负责班组所有成员（包括自身在内）的辐射安全，及其班组作业可能产生的辐射影响负责。课件练习题亦给出答案，故选B。"},{"id":"safety_fs_0098","module":"safety","bank":"辐射防护二级","type":"single","stem":"对于点源的防护可使用距离防护法，剂量率和距离的关系是：（ ）。","options":["平方反比，距离增大，剂量率平方反比降低；","正比关系，距离越大、剂量率越高；","没有任何关系；","指数关系，随着距离增大，剂量率指数升高。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》及《辐射防护(共性）》：距离防护的原理是辐射水平与距离的平方成反比，例如与热点距离2m的剂量率是距离1m时的四分之一。故选A。"},{"id":"safety_fs_0099","module":"safety","bank":"辐射防护二级","type":"single","stem":"以下关于RP2 级人员辐射安全职责描述不正确的是：（ ）。","options":["RP2级人员仅需对本班组的辐射安全负责；","RP2级人员需要组织落实辐射防护最优化措施，发现班组成员现场工作出现偏差及时提醒并纠正，做好安全管控；","RP2级人员在发现辐射异常情况时要组织本班组人员正确响应，确保人员辐射安全；","RP2级人员要检查、督促班组成员遵守电厂辐射防护管理规定和要求。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：RP2级人员职责包括组织落实辐射防护最优化措施、发现偏差及时纠正，发现辐射异常时组织班组正确响应，检查督促班组成员遵守辐射防护管理规定；且本班组作业不得增加其他人员的辐射安全风险，并非仅对本班组负责。故A描述不正确，选A。"},{"id":"safety_fs_0100","module":"safety","bank":"辐射防护二级","type":"single","stem":"不属于外照射的时间防护法措施的是：（ ）。","options":["开工前做好准备工作；","搭建临时铅屏蔽；","提高技能、熟练操作；","良好的工作组织。"],"answer":["B"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：时间防护是通过减小人员在辐射场中停留时间来降低剂量的方法，影响因素包括工作组织、物资准备、工作熟练程度等，必要时可人员轮换。而搭建临时铅屏蔽属于屏蔽防护，不属于时间防护，故选B。"},{"id":"safety_fs_0101","module":"safety","bank":"辐射防护二级","type":"single","stem":"松散的表面污染，对人员有造成（ ）的风险。","options":["外照射；","体内污染；","体表污染；","A+B+C。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：松散污染极易扩散，可经接触造成体表沾污、再悬浮造成空气污染进而被吸入导致体内污染；同时污染本身也产生外照射。故松散表面污染对人员有外照射、体内污染、体表污染三方面风险，选D。"},{"id":"safety_fs_0102","module":"safety","bank":"辐射防护二级","type":"single","stem":"外照射的（ ）防护法是在人与辐射源之间设置屏蔽层。","options":["距离；","时间；","屏蔽；","源项控制。"],"answer":["C"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护(共性）》：屏蔽防护是通过在人与辐射源之间加设屏蔽来降低人员受照剂量的方法，在核电厂主要考虑γ辐射和中子辐射的屏蔽。故选C。"},{"id":"safety_fs_0103","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于班组作业人员的描述，以下说法错误的是：（ ）。","options":["需要重点关注班组内新员工的安全意识和技能；","必须有相应的培训和授权方可执行辐射工作；","班组成员之间的沟通协调不畅，也可能带来辐射风险；","经验丰富的作业人员，对辐射风险非常熟悉，工作负责人可以甩手不管。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：工作负责人是现场工作执行中辐射风险控制的负责人，须做好安全监护、及时纠正不规范行为；同时需重点关注新员工的安全意识和技能，人员须经培训授权方可作业，沟通协调不畅也会带来辐射风险。经验丰富的班组同样需要管理，不能甩手不管，故D说法错误，选D。"},{"id":"safety_fs_0104","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列哪项措施，不是ALARA的良好实践：（ ）。","options":["选择工作位置只凭自己舒服，不用通过剂量率仪表测量选择；","避免安排冗余的工作人员；","学习人员在低剂量区域观摩；","辐射风险与作业对象有关，也与其它因素有关，作业过程分析中也需考虑。"],"answer":["A"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：高辐射风险工作人员应随身携带仪表测量辐射水平，通过测量选择工作位置、远离热点，这是ALARA良好做法。只凭自己舒服选择工作位置而不通过剂量率仪表测量，可能使人员停留在热点附近增加受照剂量，不是ALARA良好实践，故选A。"},{"id":"safety_fs_0105","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列哪项措施，不是ALARA的良好实践：（ ）。","options":["通过剂量率仪表测量选择相对“低”剂量工作位置；","配合人员在无任务时，前往低剂量区域等待；","高剂量区域作业选择技能良好的工作人员；","工作人员在放射性阀门检修场地内长时间等待QC人员检查。"],"answer":["D"],"score":null,"source":"official","origin":"辐射二级.xlsx","explanation":"依据课件《辐射防护二级》：ALARA要求善用低剂量等待区，避免在高剂量率或热点区域逗留，等待和讨论应优先安排在低剂量等待区。在放射性阀门检修场地内长时间等待QC检查会使人员持续接受不必要的照射，不是ALARA良好实践，故选D。"},{"id":"safety_fsjx_0001","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列选项中，哪个不是在辐射工作中使用呼吸防护用具的目的（ ）。","options":["降低放射性气体的吸入量","减少受到内照射的剂量","减少放射性气体进入人体的数量","获得充足的、可以呼吸的空气"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：使用呼吸器是为了限制放射性气体污染物的吸入，减少放射性气体进入人体的数量，从而降低内照射剂量；「获得充足的、可以呼吸的空气」并非呼吸防护的目的，故答案为D。"},{"id":"safety_fsjx_0002","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"气载放射性污染物进入人体的途径有（ ）。","options":["呼吸吸入","食入","通过皮肤进入","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：无论非放射性或放射性气体污染物，进入人体的途径有呼吸吸入、食入、通过皮肤进入和通过裸露伤口进入四种，选项A、B、C均在其内，故答案为D。"},{"id":"safety_fsjx_0003","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"使用呼吸器期间出现以下哪些情况时，不需要取下呼吸器（ ）。","options":["闻到异味","呼吸顺畅","恶心或者头晕","化学物渗入面部"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：使用呼吸器期间出现异味（过滤器失效）、化学物渗入面部、恶心或头晕、呼吸困难等征兆时，应迅速离开该区域并取下呼吸器；呼吸顺畅属正常状态，不需要取下，故答案为B。"},{"id":"safety_fsjx_0004","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"工作环境中的氧气含量小于（ ）时，工作人员就会有缺氧的风险。（ ）","options":["0.23","0.215","0.195","0.17"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：环境中氧含量浓度小于19.5%即为缺氧的工作环境，人员会有缺氧风险；正常空气中氧气浓度约为21%，故答案为C（19.5%）。"},{"id":"safety_fsjx_0005","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"对于呼吸器使用前的检查，错误的是（ ）。","options":["可以在进入污染隔离区区后再检查密封性","需要检查呼吸器的镜罩没有划伤裂痕","如果发现呼吸器的表带连接处有裂缝，那么需要更换呼吸器","要检查呼吸器的橡胶密封面是否完好"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：呼吸器的密封性检查非常重要，无论进入放射性控制区工作之前还是工作过程中都要进行，不能等到进入污染隔离区后再检查；检查镜罩、表带、橡胶密封面完好均是正确做法，故答案为A。"},{"id":"safety_fsjx_0006","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下属于空气过滤呼吸器的优点的是（ ）。","options":["防护因子较低","运行时处于负压模式","戴上后镜面容易形成雾气","设备移动方便"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：空气过滤呼吸器的优点是操作简单、移动方便；防护因子较低、运行时处于负压模式、戴上后容易形成雾气均为其缺点，故答案为D。"},{"id":"safety_fsjx_0007","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"对于呼吸器的使用，以下说法错误的是（ ）。","options":["遵照使用规程并正确使用呼吸器","使用呼吸器之前需要经过培训","可以让他人使用你的呼吸器","使用呼吸器之前需要做密封性测试"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：呼吸器由辐射防护人员根据工作风险发放，使用者需经过培训、使用前遵照规程检查并做密封性测试；呼吸器应个人专用，让他人使用自己的呼吸器是错误的，故答案为C。"},{"id":"safety_fsjx_0008","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"使用呼吸器是为了（ ）。","options":["限制放射性液体污染物的吸入","限制放射性气体污染物的吸入","防止放射性液体污染物通过食物进入人体","防止放射性气体污染物通过食物进入人体"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：课件明确指出「使用呼吸器是为了限制放射性气体污染物的吸入」，呼吸防护针对的是气载污染物经呼吸吸入的途径，与食入无关，故答案为B。"},{"id":"safety_fsjx_0009","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于气载污染物的说法错误的是（ ）。","options":["某些生产活动如研磨、焊接和打磨会产生气体微粒和烟气；","喷漆、系统排气和疏水、去污会产生气体悬浮物和水汽；","系统泄漏是有害气体悬浮物的来源之一","在编制工作计划时，无需考虑气载污染物的来源，仅需要考虑防护方法。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：研磨、焊接、打磨会产生气体微粒和烟气，喷漆、排气疏水、去污会产生气体悬浮物和水汽，系统泄漏也是有害气体悬浮物的来源；编制工作计划时必须考虑上述及其它潜在气载污染物来源，D说法错误，故答案为D。"},{"id":"safety_fsjx_0010","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"放射性气载悬浮物可能存在的形式有（ ）。","options":["灰尘","雾气","烟气","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：气载污染物能以多种形式存在，包括放射性气载悬浮物、微粒（例如灰尘）、雾气、水汽、烟气以及其它气体，故答案为D。"},{"id":"safety_fsjx_0011","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"使用空气过滤呼吸器的时候，下列哪项不影响呼吸器佩戴后的密封性（ ）。","options":["面部胡须","面部伤疤","呼吸器系带没有拉紧","外界气压过低"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：面部胡须、面部伤疤、系带没有拉紧等因素都会导致呼吸器不能完全密封，影响佩戴密封性；外界气压过低与佩戴密封性无关，故答案为D。"},{"id":"safety_fsjx_0012","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在辐射工作中使用呼吸防护用具，不能达到的效果是（ ）。","options":["降低放射性气体的吸入量","减少放射性气体进入人体的数量","减少γ辐射对人体造成的剂量","减少受到α辐射的内照射的剂量"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：呼吸防护用具的作用是限制气载放射性污染物吸入、减少其进入人体数量、降低内照射（如α内照射）剂量；γ辐射属外照射，呼吸防护对其无效，需靠屏蔽等方法防护，故答案为C。"},{"id":"safety_fsjx_0013","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于密闭空间作业人员职责的是（ ）。","options":["当发现异况或危险状况时不通知监督人员，自行离开；","当发现任何导致危险状况发生的征兆或症状时，应通知监督人员；","当收到监护人员或责任主管的撤离通知、撤退器报警，都应该马上离开现场；","通过口头、无线电、电话、视频或耳机和监督人员保持联系；。"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：进入人员的责任包括与监护人员保持联系、发现导致危险状况的征兆或症状时通知监护人员、收到撤离通知或撤退器报警时马上离开现场；「发现异况不通知监督人员、自行离开」不符合要求，故答案为A。"},{"id":"safety_fsjx_0014","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在密闭空间内使用的手持照明工具，电压应不大于（ ），在积水、结露的潮湿密闭空间作业，手持照明电压应不大于（ ）。（ ）","options":["36V；24V","12V；24V","36V；12V","24V；12V"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有限空间作业使用的临时照明电压不大于36V；在积水、结露等潮湿环境（如潮湿的金属容器内）作业时，使用的电压应不大于12V，故答案为C。"},{"id":"safety_fsjx_0015","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列关于密闭空间内手持电动工具与临时用电的说法不正确的是（ ）。","options":["行灯变压器、漏电保护器、电源联接器、控制箱等必须放置在密闭空间外宽敞、干燥场所，方便监护人可随时切断电源。","临时照明电压一般不大于36V，金属设备内和特别潮湿作业场所作业，其使用的电压应不大于12V 。","使用电动工具时，可以不使用漏电保护器。","当密闭空间原盛有爆炸性液体、气体等介质时，应使用防爆设备。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：使用电动工具时，必须同时使用漏电保护器，C说可以不使用是错误的；行灯变压器等放置在有限空间外干燥场所、临时照明电压要求、原盛爆炸性介质时使用防爆设备均为课件要求，故答案为C。"},{"id":"safety_fsjx_0016","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于密闭空间的是（ ）。","options":["除盐水箱","除氧器","常规岛某电气间","蒸汽发生器"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有限空间指封闭或部分封闭、未被设计为固定工作场所、易造成有毒有害物质积聚或含氧量不足的空间，槽罐（除盐水箱）、罐体设备（除氧器、蒸汽发生器）属此类；常规岛电气间是可正常出入的工作房间，不符合定义，故答案为C。"},{"id":"safety_fsjx_0017","module":"safety","bank":"辐射
