都是\"正确。"},{"id":"basics_mat_0017","module":"basics","bank":"材料基础","type":"single","stem":"材料的工作环境是十分恶劣的，对材料的要求也是十分苛刻的。这些恶劣的环境包括（  ）","options":["高温、高压、强辐照、腐蚀","高温、高压、强辐照","高温、强辐照、腐蚀"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"核电厂材料处于高温、高压、强辐照、腐蚀四种恶劣环境并存的工作条件，B、C选项遗漏因素不完整。"},{"id":"basics_mat_0018","module":"basics","bank":"材料基础","type":"single","stem":"堆芯材料、燃料包壳、调节棒、慢化剂材料，对中子吸收截面的要求，依次是（   ）","options":["大、小、大、小","小、小、大、小","小、小、大、大"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"堆芯结构材料和燃料包壳要求中子吸收截面小以减少寄生吸收；控制棒要求截面大以吸收中子控制反应性；慢化剂吸收小、慢化能力强。"},{"id":"basics_mat_0019","module":"basics","bank":"材料基础","type":"single","stem":"压水反应堆有三道安全屏障，其中第二道安全屏障是（    ）。","options":["包壳","安全壳","压力容器"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"压水堆三道安全屏障为燃料包壳、一回路压力边界和安全壳，第二道屏障是压力容器及一回路承压边界。"},{"id":"basics_mat_0020","module":"basics","bank":"材料基础","type":"single","stem":"核电厂使用的材料中，铅通常用于哪种用途使用？（    ）","options":["屏蔽材料","主蒸汽管道","慢化剂"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"铅密度高、原子序数大，对γ射线衰减能力强，常用作辐射屏蔽材料；不用于主蒸汽管道，也不作慢化剂。"},{"id":"basics_mat_0021","module":"basics","bank":"材料基础","type":"judge","stem":"金属是指单一元素构成的具有特殊的光泽延展性导电性导热性的物质。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，金属是由金属元素组成的单质，通常具有金属光泽，导电性、导热性良好，并有延展性。"},{"id":"basics_mat_0022","module":"basics","bank":"材料基础","type":"judge","stem":"铁、锰、铬及其合金，统称为黑色金属材料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，黑色金属指铁、锰、铬及以它们为基的合金（如钢、铸铁），其余金属称有色金属。"},{"id":"basics_mat_0023","module":"basics","bank":"材料基础","type":"judge","stem":"金属的晶体结构是有缺陷的。金属在凝固、冷加工、热加工、形变、辐照、再结晶、同素异构转变中等都可能使原子排列的规律性在局部区域遭到破坏，因而产生晶体缺陷。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，实际金属晶体都是不完美晶体，凝固、变形、加工、辐照、再结晶和同素异构转变等过程都可能破坏局部原子排列的规律性，产生晶体缺陷。"},{"id":"basics_mat_0024","module":"basics","bank":"材料基础","type":"judge","stem":"金属材料是金属及其合金的总称。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，金属材料是金属元素及以金属元素为主的合金的总称，是四大类材料之一。"},{"id":"basics_mat_0025","module":"basics","bank":"材料基础","type":"judge","stem":"材料的冲击韧性是指材料在冲击载荷作用下抵抗变形和断裂的能力。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，冲击韧性表征材料在冲击载荷作用下抵抗塑性变形和断裂的能力，通常以冲击试验测定的冲击吸收功来衡量。"},{"id":"basics_mat_0026","module":"basics","bank":"材料基础","type":"judge","stem":"由于重水吸收热中子的几率小，所以中子经济性好，以重水作为慢化剂的反应堆，可以采用天然铀作为核燃料，从而使得建造重水堆的国家，不必建造浓缩铀工厂。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，重水吸收热中子的几率很小，中子经济性好，重水堆可用天然铀作燃料，无需建造铀浓缩工厂。"},{"id":"basics_mat_0027","module":"basics","bank":"材料基础","type":"judge","stem":"一个核反应堆的建成，不论其取得能量的物理理念、物理模式怎样好，如果不能找到与之条件相适应的材料，在实际中也不可能成功。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，材料是实现反应堆设计的物质基础，物理理念再先进，没有与之相适应的材料，反应堆也无法建成。"},{"id":"basics_mat_0028","module":"basics","bank":"材料基础","type":"judge","stem":"通常说钢比铸铁抗拉强度高，是指单位截面积的承力能力前者高，后者低。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，强度按单位截面积的承载能力定义，钢与铸铁在相同口径下比较，前者抗拉强度更高。"},{"id":"basics_mat_0029","module":"basics","bank":"材料基础","type":"judge","stem":"传热管材料通常需要需具备：导热性能好、热膨胀系数小；抗应力腐蚀能力强；热强性、热稳定性和焊接性能良好；塑韧性好，以便制管、弯管和胀管的加工。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，传热管在高温高压和腐蚀介质中工作，要求导热好、抗应力腐蚀、热强性和焊接性良好，塑韧性好以便于制管、弯管和胀管。"},{"id":"basics_mat_0030","module":"basics","bank":"材料基础","type":"judge","stem":"一般来说，硬度高的材料其强度也较高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，硬度与强度都反映材料抵抗塑性变形的能力，金属材料两者近似成正比，一般硬度越高强度也越高。"},{"id":"basics_mat_0031","module":"basics","bank":"材料基础","type":"judge","stem":"选材时，只要满足工件使用要求即可，并非各项性能指标越高越好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，选材要综合考虑使用要求、工艺性能和经济性，盲目追求高指标会增加成本，也可能不利于加工。"},{"id":"basics_mat_0032","module":"basics","bank":"材料基础","type":"judge","stem":"核电厂可以自行授权民用核安全设备焊接工的操作资格。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"错误，民用核安全设备焊工资格必须经核安全监管部门按规定考核合格并颁发资格证书，企业不能自行授权。"},{"id":"basics_mat_0033","module":"basics","bank":"材料基础","type":"judge","stem":"金属在外力作用下的变形可分为弹性变形、弹塑性变形和断裂三个价段。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，金属在外力逐渐增大的作用下，变形过程一般经历弹性变形、弹塑性变形和断裂三个阶段。"},{"id":"basics_mat_0034","module":"basics","bank":"材料基础","type":"judge","stem":"核动力设备的材料必须按照其使用条件合理选用，并参考国家制定的相应规范和标准。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"错误，核动力设备材料除按使用条件合理选用外，必须严格执行国家制定的有关规范和标准，核安全设备规范标准是强制性的，不能仅\"参考\"。"},{"id":"basics_mat_0035","module":"basics","bank":"材料基础","type":"judge","stem":"低碳钢的强度、硬度较低，但塑性、韧性及焊接性能较好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，低碳钢含碳量低于0.25%，强度、硬度较低，但塑性、韧性和焊接性能良好，应用广泛。"},{"id":"basics_mat_0036","module":"basics","bank":"材料基础","type":"judge","stem":"ZG200-400表示该铸造碳钢的屈服强度为200Mpa、而其抗拉强度为400Mpa。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，铸钢牌号ZG200-400的两组数字分别表示屈服强度200MPa和抗拉强度400MPa。"},{"id":"basics_mat_0037","module":"basics","bank":"材料基础","type":"judge","stem":"切尔诺贝利核电站事故以来，由于对核系统安全性的考虑，对材料的性能要求也越来越高，合理选材就显得越来越重要。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，切尔诺贝利事故后核安全更加受重视，对核电厂材料性能要求不断提高，合理选材日益重要。"},{"id":"basics_mat_0038","module":"basics","bank":"材料基础","type":"judge","stem":"核技术成功的关键取决于堆内强辐射下材料的行为。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，核电厂材料长期在堆内强辐射场中服役，其辐照下的性能行为直接决定反应堆的安全性和可行性，是核技术成功的关键。"},{"id":"basics_mat_0039","module":"basics","bank":"材料基础","type":"judge","stem":"核电厂可以参考国家的法规标准要求，对核岛以及常规岛相关承压部件进行定期无损检测，发现使用中出现的缺陷。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"错误，承压部件的在役检查必须严格执行国家法规标准和经批准的检查大纲，\"参考\"弱化了核安全监管要求的强制性。"},{"id":"basics_mat_0040","module":"basics","bank":"材料基础","type":"judge","stem":"核电材料应优先选用工艺成熟，使用经验丰富的材料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，核电选材遵循成熟、保守原则，优先选用使用经验丰富、工艺成熟的材料，以降低不确定性和风险。"},{"id":"basics_mat_0041","module":"basics","bank":"材料基础","type":"judge","stem":"核电材料中凝汽器传热管使用的是钛合金。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"正确，钛合金耐海水和含氯冷却水腐蚀性能优良，凝汽器传热管普遍采用钛管。"},{"id":"basics_mat_0045","module":"basics","bank":"材料基础","type":"single","stem":"沸水堆、压水堆、CANDU堆、钠冷快中子增殖堆，所使用的冷却材料分别是（       ）","options":["<ckeditor5><p>石墨、轻水（H<sub>2<\/sub>O）、重水(D<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>","<ckeditor5><p>轻水（H<sub>2<\/sub>O）、轻水（H<sub>2<\/sub>O）、重水(D<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>","<ckeditor5><p>轻水（H<sub>2<\/sub>O）、轻水（H<sub>2<\/sub>O）、超重水(T<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"沸水堆、压水堆均以轻水作冷却剂，CANDU重水堆用重水，钠冷快堆用液态钠；石墨是慢化剂而非冷却剂。"},{"id":"basics_wc_0004","module":"basics","bank":"水化学","type":"single","stem":"周期表由七个横行和十八个纵列组成。横行称周期，纵列称族，由_____个主族（A族）、8个副族（B族）和1个零族组成。","options":["7.0","8.0","9.0"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"周期表18个纵列由7个主族（A族）、8个副族（B族）和1个零族（第Ⅷ族及零族划分中另含第Ⅷ族）共16个族组成，主族元素性质在化学分析中最常用。"},{"id":"basics_wc_0005","module":"basics","bank":"水化学","type":"single","stem":"水的pH值大小反映水的酸碱度，当水温升高时，pH中性值下降，纯水温度在300℃时，其pH为______。","options":["6.5","7.5","5.6"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"水的离子积随温度升高而增大，中性点对应的pH随之下降。300℃纯水pKw约11.4，中性pH约为5.6～5.7，故选5.6。"},{"id":"basics_wc_0006","module":"basics","bank":"水化学","type":"single","stem":"轻水的酸碱性根据pH大小分＜7酸性、=7中性、＞7碱性，对于重水来说，测得pH=7时为______。","options":["酸性","碱性","中性"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"重水的离子积比轻水小，25℃时中性pD约为7.2。因此测得pD=7时氢离子相对偏多，重水呈酸性。"},{"id":"basics_wc_0007","module":"basics","bank":"水化学","type":"single","stem":"在核电厂一、二回路中，各设备之间的关联和能量传递主要依靠______的流动和循环。","options":["气体","水","燃料"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"核电厂一、二回路均以水为工质，各设备间的关联和热量传递依靠水的流动与循环实现，故水质控制至关重要。"},{"id":"basics_wc_0008","module":"basics","bank":"水化学","type":"single","stem":"在原水预处理使用的混凝剂主要有铁盐、铝盐和无机高分子混凝剂，其中水处理效果较好普遍使用的混凝剂是______。","options":["硫酸铝","三氯化铁","聚合氯化铝"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"聚合氯化铝属无机高分子混凝剂，絮凝能力强、适用pH范围宽、腐蚀性小且残渣少，处理效果优于普通铁盐、铝盐，应用最广。"},{"id":"basics_wc_0009","module":"basics","bank":"水化学","type":"single","stem":"在金属腐蚀类型中，危害性最大的是______。","options":["电化学腐蚀","化学腐蚀","物理腐蚀"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"电化学腐蚀伴随微电池作用，普遍存在且速率快，常造成点蚀、缝隙腐蚀等局部破坏，是金属腐蚀中危害性最大的类型。"},{"id":"basics_wc_0010","module":"basics","bank":"水化学","type":"single","stem":"在核电厂一回路系统中，其放射性物质通过水及其中杂质的活化、裂变产物的释放、腐蚀产物的活化和化学添加物的活化等途径持续不断产生，为了控制系统中的核素活度维持在较低水平，通常采用______方式进行处理。","options":["滤芯过滤","树脂离子交换","膜分离技术"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"树脂离子交换（如净化混床）能高效去除冷却剂中溶解态的裂变产物、腐蚀产物和活化核素，是控制一回路核素活度的常规手段。"},{"id":"basics_wc_0011","module":"basics","bank":"水化学","type":"single","stem":"二回路系统中关键设备众多，但最重要的设备是______，是放射性介质与非放介质的隔离边界，是二回路水化学控制的重点，水化学控制更多的是围绕它来进行。","options":["蒸汽发生器","汽轮发电机","凝汽器"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"蒸汽发生器传热管束是一回路放射性介质与二回路非放介质的隔离边界，传热管破损会导致放射性泄漏，故它是二回路水化学控制的重点。"},{"id":"basics_wc_0012","module":"basics","bank":"水化学","type":"single","stem":"为保证进入蒸汽发生器的给水中溶解氧小于5ppb，二回路采用了凝汽器真空除氧、除氧器热力除氧和添加______化学除氧来达到。","options":["联氨","乙醇胺","吗啉"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"联氨是强还原性化学除氧剂，与溶解氧反应生成氮气和水，不增加水中固形物，配合真空除氧和热力除氧可使给水溶解氧小于5ppb。"},{"id":"basics_wc_0013","module":"basics","bank":"水化学","type":"single","stem":"核电厂系统中常用的联氨原材料的检测，通常可采用         来测定。","options":["光谱分析法","色谱分析法","氧化还原滴定法"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"联氨具有强还原性，可用碘等氧化剂标准溶液进行氧化还原滴定来测定其含量，方法简便准确，是电厂常用的检测手段。"},{"id":"basics_wc_0014","module":"basics","bank":"水化学","type":"single","stem":"重水堆慢化剂系统的pH值控制4.5-6.5酸性环境下，是因为______。","options":["防止可溶性中子吸收剂硝酸钆产生沉淀失去作用","有利于对慢化剂系统设备的腐蚀控制","有利于可溶性中子吸收剂硼酸更好的控制反应性"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"慢化剂保持4.5～6.5的酸性环境，可防止可溶性中子吸收剂硝酸钆水解沉淀，确保其均匀溶解、正常发挥反应性控制作用。"},{"id":"basics_wc_0015","module":"basics","bank":"水化学","type":"single","stem":"在压水堆一回路冷却剂系统中，采用B和LiOH协调调节pH值，其中______经中子活化后生成稳定的Li-7有利pH的调节。","options":["B-10","B-11","Li-6"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"B-10吸收中子后经核反应生成稳定的Li-7，可补充冷却剂中的碱源，有利于pH的调节，故一回路加富集B-10的硼酸。"},{"id":"basics_wc_0016","module":"basics","bank":"水化学","type":"single","stem":"在下述卤素元素中，______对包壳材料锆合金的腐蚀作用最明显。","options":["氟离子","氯离子","溴离子"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"氟离子半径小、穿透力强，会破坏锆合金表面氧化膜，显著加速锆包壳腐蚀，因此一回路对氟、氯等卤素杂质均有严格限值。"},{"id":"basics_wc_0017","module":"basics","bank":"水化学","type":"single","stem":"目前腐蚀理论认为，不锈钢应力腐蚀开裂的概率正比于______浓度和游离氧含量的乘积。","options":["氟离子","氯离子","硫酸根"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"氯离子易破坏不锈钢钝化膜，与游离氧协同促进开裂。腐蚀理论认为应力腐蚀开裂概率正比于氯离子浓度与游离氧含量的乘积。"},{"id":"basics_wc_0018","module":"basics","bank":"水化学","type":"single","stem":"压水堆冷却剂净化系统中的净化混床充填的树脂型态是锂型和氢氧型，在正常运行期间的阳树脂仍然以锂型运行，阴树脂则转化为______型态运行。","options":["硼酸型","氯型","氨型"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"一回路冷却剂含硼酸，净化混床阴树脂运行时吸附硼酸根而逐渐转为硼酸型，可避免硼被树脂截留引起冷却剂硼浓度波动。"},{"id":"basics_wc_0019","module":"basics","bank":"水化学","type":"single","stem":"全挥发处理AVT指的是往二回路系统只添加     。","options":["磷酸盐","氨（或有机胺）和联氨","氢氧化钠"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"全挥发处理（AVT）只向二回路添加挥发性的氨（或有机胺）和联氨，不引入固体碱，避免杂质在蒸汽发生器内浓缩危害传热管。"},{"id":"basics_wc_0020","module":"basics","bank":"水化学","type":"single","stem":"压水堆启动期间冷却剂系统通常采用添加     来除去系统中的溶解氧。","options":["硼酸","氢氧化锂","联氨"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"联氨具有强还原性，能与溶解氧反应生成氮气和水，故压水堆启动期间通过加联氨除去冷却剂中的溶解氧，减轻系统腐蚀。"},{"id":"basics_wc_0021","module":"basics","bank":"水化学","type":"judge","stem":"日常最常用3个主族：碱金属族、碱土金属族、卤素，它们对应的最具代表元素分别有Na、K、Cl。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"错误，碱金属族的代表元素是Na，碱土金属族的代表元素是Mg、Ca，卤素族的代表元素是Cl；K与Na同属碱金属族。"},{"id":"basics_wc_0022","module":"basics","bank":"水化学","type":"judge","stem":"与轻水相比，重水的熔、沸点较高、密度大，密度最大时的温度也有所升高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，重水分子量大于轻水，分子间作用更强，熔、沸点更高、密度更大，密度最大时对应的温度也比轻水（约4℃）有所升高。"},{"id":"basics_wc_0023","module":"basics","bank":"水化学","type":"judge","stem":"溶解度是指在一定的温度下，某物质在100克溶剂（通常是水）里达到饱和状态时所溶解的克数。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，溶解度指一定温度下某物质在100克溶剂中达到饱和状态时所溶解的克数，是衡量物质溶解能力的基本指标。"},{"id":"basics_wc_0024","module":"basics","bank":"水化学","type":"judge","stem":"电导率是指一种溶液的导电能力，反映了溶液中所有离子的总浓度。电导率的单位是mS/m（SI国际单位制），电厂常用的单位是μS/cm。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，电导率反映溶液导电能力，取决于溶液中离子的总浓度和迁移能力，SI单位为mS/m，电厂常用μS/cm。"},{"id":"basics_wc_0025","module":"basics","bank":"水化学","type":"judge","stem":"电导率与pH的变化均表示溶液中离子的增加或减少，因此从测量电导率变化上，可推断出pH是变大还是变小了。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"错误，电导率反映离子总量，不能区分阴阳离子的相对变化，同一电导率可对应不同pH，故无法由电导率变化推断pH的升降。"},{"id":"basics_wc_0026","module":"basics","bank":"水化学","type":"judge","stem":"氧化还原反应中，失去电子和得到电子同时发生，没有只发生氧化反应而不发生还原反应的，反之亦然。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，氧化与还原是电子得失的两个方面，失电子与得电子必然同时发生、数量相等，不存在单独的氧化或还原反应。"},{"id":"basics_wc_0027","module":"basics","bank":"水化学","type":"judge","stem":"超滤是利用超滤膜为过滤介质，在一定的压力下，当水流过膜表面时，只允许水及小分子物质透过膜，但阻止水中溶解盐离子透过，以达到水质净化的目的。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"错误，超滤膜只能截留悬浮物、胶体和大分子有机物，溶解盐离子可自由透过；截留溶解盐离子是反渗透的功能。"},{"id":"basics_wc_0028","module":"basics","bank":"水化学","type":"judge","stem":"将含有较多溶解盐类的苦咸水通过反渗透的处理可以得到含盐极少的纯净水，可直接用于核电厂二回路系统用水。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"错误，反渗透出水仍含有少量盐类和溶解气体，电导率偏高，须经离子交换除盐等精处理合格后才能用作二回路补水。"},{"id":"basics_wc_0029","module":"basics","bank":"水化学","type":"judge","stem":"离子交换树脂按照微孔型态分类，有凝胶型和大孔型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，按微孔形态离子交换树脂分为凝胶型和大孔型两类，大孔型孔隙发达，抗有机物污染和耐氧化性能更好。"},{"id":"basics_wc_0030","module":"basics","bank":"水化学","type":"judge","stem":"反渗透和电渗析均属于膜分离技术，其原理均是由于膜的选择透过性，截留溶质离子，透过溶剂分子。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，反渗透和电渗析均属膜分离技术，依靠膜的选择透过性实现溶质与溶剂分离，前者靠压差驱动，后者靠电场驱动。"},{"id":"basics_wc_0031","module":"basics","bank":"水化学","type":"judge","stem":"设置凝结水精处理系统（混床）主要目的是为当凝汽器发生泄漏时投入运行净化凝结水以及机组启动期间除去腐蚀产物等颗粒杂质，确保二回路水质良好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，凝结水精处理混床在凝汽器泄漏时净化凝结水、机组启动时除去腐蚀产物等杂质，确保进入蒸汽发生器的水质合格。"},{"id":"basics_wc_0032","module":"basics","bank":"水化学","type":"judge","stem":"在金属材料发生的腐蚀中，由于材料中不可避免存在着不均匀和材质差异，在使用过程中，发生的腐蚀一般为电化学腐蚀及局部腐蚀，金属结构遭破坏，此种类型腐蚀危害性更大。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，金属材料存在成分和组织的不均匀性，使用中多形成腐蚀微电池，以电化学腐蚀和局部腐蚀为主，破坏集中、危害更大。"},{"id":"basics_wc_0033","module":"basics","bank":"水化学","type":"judge","stem":"压水堆和重水堆一回路系统设备的主要材料均为锆合金、镍基合金和不锈钢等，为了控制腐蚀，都需要将系统介质的pH值控制在合适的碱性范围内。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，压水堆和重水堆一回路主材均为锆合金、镍基合金和不锈钢，将冷却剂pH控制在合适碱性范围可降低材料腐蚀和腐蚀产物释放。"},{"id":"basics_wc_0034","module":"basics","bank":"水化学","type":"judge","stem":"应力腐蚀是一种发生在特殊环境和应力状态下的腐蚀。应力腐蚀的特征是：材料表面的腐蚀程度较轻，裂纹较深、裂纹走向基本上与主应力方向垂直。应力腐蚀是金属材料在实际应用中经常遇到而又危害较大的一种腐蚀类型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，应力腐蚀需拉应力与特定介质共同作用，表面腐蚀轻而裂纹深、走向垂直于主应力，隐蔽性强、危害大，是常见腐蚀失效形式。"},{"id":"basics_wc_0035","module":"basics","bank":"水化学","type":"judge","stem":"CANDU型重水堆以天然铀作为燃料，重水作为冷却剂和慢化剂，控制和调节反应性的可溶性中子吸收剂使用了两种化学品硼和钆。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，CANDU重水堆用天然铀作燃料、重水作冷却剂和慢化剂，以硼和钆两种可溶性中子吸收剂控制和调节反应性。"},{"id":"basics_wc_0036","module":"basics","bank":"水化学","type":"judge","stem":"压水堆中冷却剂和慢化剂是同一个系统，水化学环境控制相同，而重水堆中冷却剂和慢化剂是两个不同的系统，水化学环境控制也完全不同。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，压水堆中轻水兼作冷却剂和慢化剂，属同一系统；重水堆冷却剂与慢化剂相互独立，两者的水质控制指标不同。"},{"id":"basics_wc_0037","module":"basics","bank":"水化学","type":"judge","stem":"核电厂二回路化学控制方法上，由传统的单一加氨作为碱化剂，逐渐过渡到两种胺/氨及以上的联合调节控制方式，现呈流行趋势。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，二回路碱化方式由单一加氨逐步发展为氨与有机胺（如乙醇胺、吗啉）联合调节，以兼顾各温度区间的pH控制和防腐效果。"},{"id":"basics_wc_0038","module":"basics","bank":"水化学","type":"judge","stem":"AP1000型压水堆和CANDU重水堆在一回路冷却剂启动期间采用添加氢气的方式来实现化学除氧。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，AP1000和CANDU机组启动期间通过添加氢气，在催化剂作用下与溶解氧反应生成水，实现化学除氧并抑制水的辐射分解。"},{"id":"basics_wc_0039","module":"basics","bank":"水化学","type":"judge","stem":"在氨与有机碱化剂ETA联合控制来调节二回路系统pH时，ETA的主要作用是提高了二回路系统高温疏水在其运行温度下对应的pH值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，ETA等有机胺高温下挥发性低，能较多保留在液相中，从而提高高温疏水在其运行温度下的pH，改善防腐效果。"},{"id":"basics_wc_0040","module":"basics","bank":"水化学","type":"judge","stem":"在核电厂运行中需要对各系统的化学参数进行定期取样分析监测，设置有专门的化学实验室来承担此工作。在化学实验室的分析方法中，主要有化学分析和仪器分析。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，化学实验室承担各系统水样的定期取样分析，分析方法主要有化学分析（滴定等）和仪器分析（光谱、色谱等）两大类。"},{"id":"basics_wc_0041","module":"basics","bank":"水化学","type":"judge","stem":"凝结水精处理系统和除盐水生产系统均设置有阳床和混床，树脂运行失效后一般输送到体外再生系统进行再生。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"错误，凝结水精处理混床树脂失效后输送至体外再生系统再生；而除盐水生产系统的阳床、混床一般在体内再生，并非都体外再生。"},{"id":"basics_wc_0042","module":"basics","bank":"水化学","type":"judge","stem":"为降低材料腐蚀和辐射场，目前压水堆核电厂冷却剂系统的pH（300℃）值一般控制在6.9〜7.4之间。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，压水堆冷却剂用硼和氢氧化锂协调控制，pH（300℃）一般控制在6.9～7.4，兼顾降低材料腐蚀和辐射场。"},{"id":"basics_wc_0043","module":"basics","bank":"水化学","type":"judge","stem":"为降低材料腐蚀和辐射场，CANDU重水堆冷却剂系统的pH（25℃）值一般控制在10.2〜10.8之间。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，CANDU重水堆冷却剂加氢氧化锂碱化，pH（25℃）一般控制在10.2～10.8，以降低材料腐蚀和辐射场。"},{"id":"basics_wc_0044","module":"basics","bank":"水化学","type":"judge","stem":"压水反应堆燃料循环后期，当硼酸浓度较低（以B计小于100mgB/L）时，一般采用充排水方式来降低硼浓度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，循环后期硼浓度已较低，若经离子交换除硼会同时除去锂、影响pH控制，故一般采用充排水（稀释）方式降硼。"},{"id":"basics_wc_0045","module":"basics","bank":"水化学","type":"judge","stem":"对VVER型压水堆是靠连续不断地或周期性地向冷却剂加进氨经辐射分解产生的氢来抑制水的辐射分解。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，VVER机组通过加氨，氨受辐射分解产生氢气，维持冷却剂中氢浓度，从而抑制水的辐射分解。"},{"id":"basics_wc_0046","module":"basics","bank":"水化学","type":"judge","stem":"VVER机组中，氨对降低一回路结构材料和燃料包壳表面的沉积物有利，氨可以络合四氧化三铁形成可溶的铁氨络合物，经净化系统将铁去除。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，氨能与四氧化三铁络合形成可溶性铁氨络合物，使沉积物溶解并经净化系统除去，有利于减少回路表面沉积物。"},{"id":"basics_wc_0047","module":"basics","bank":"水化学","type":"judge","stem":"二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺、混合胺不同发展阶段。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺到混合胺（氨与有机胺联合）的不同阶段，防腐效果不断改善。"},{"id":"basics_wc_0048","module":"basics","bank":"水化学","type":"judge","stem":"pH和电导率的测定与介质实际的温度没有直接关系，因此无需关注介质的温度。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"错误，水的电离平衡和离子迁移均随温度变化，pH和电导率测定结果与温度密切相关，必须注明或换算到规定温度下比较。"},{"id":"basics_wc_0049","module":"basics","bank":"水化学","type":"judge","stem":"二回路测量阳电导率的原因是水中含有碱化剂氨导致总电导率较高，测量阳电导率可以消除氨的影响，敏锐地反映水中所有阴离子的存在情况。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，氨使二回路总电导率偏高，水样经阳离子交换柱后氨被除去，测得的阳电导率能敏锐反映氯离子等阴离子杂质含量。"},{"id":"basics_wc_0050","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>在氧化铜与氢气生成铜和水的反应中（CuO+H<sub>2<\/sub>=Cu+H<sub>2<\/sub>O），氢气是______，其发生氧化反应。<\/p><\/ckeditor5>","options":["氧化剂","还原剂","催化剂"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"该反应中氢气夺取CuO中的氧生成水，自身被氧化，作还原剂；CuO失去氧被还原，作氧化剂。"},{"id":"basics_wc_0053","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>由于感生放射性原因，核电厂冷却剂系统一般不用（ &nbsp; &nbsp;）作为调节pH的碱化剂。<\/p><\/ckeditor5>","options":["<ckeditor5><p><sup>7<\/sup>LiOH<\/p><\/ckeditor5>","NaOH","KOH"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"NaOH中的Na-23吸收中子生成Na-24（半衰期约15小时，强γ放射体），产生感生放射性，故核电厂冷却剂不用NaOH作碱化剂。"},{"id":"basics_wc_0054","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>重水堆中的C-14主要来源于______，由于该系统重水中<sup>17<\/sup>O靶子物的数量较多，生成的C-14也多，其主要存在形态为碳酸或碳酸氢盐。<\/p><\/ckeditor5>","options":["冷却剂系统","慢化剂系统","二回路系统"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"慢化剂重水量大，其中O-17经中子反应生成C-14，是重水堆C-14的主要来源，主要存在形态为碳酸或碳酸氢盐。"},{"id":"basics_wc_0055","module":"basics","bank":"水化学","type":"judge","stem":"<ckeditor5><p>不管压水堆还是重水堆的冷却剂系统，为防止加速锆合金腐蚀和不锈钢的应力腐蚀破裂，O<sub>2<\/sub>的限值一般要求控制在0.1mg/kg以下。<\/p><\/ckeditor5>","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"正确，氧会加速锆合金腐蚀并促进不锈钢应力腐蚀破裂，故压水堆和重水堆冷却剂系统均要求将O2控制在0.1mg/kg以下。"},{"id":"basics_mech_0002","module":"basics","bank":"通用机械","type":"single","stem":"阀门的用途广泛，种类繁多，分类方法也比较多，总体上可以分为自动型阀门和_____。","options":["气动型阀门","驱动型阀门","电动型阀门"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"阀门按驱动方式总体分为自动型阀门和驱动型阀门。自动型依靠介质自身压力动作，驱动型则借助手动、电动、气动等外力操作。"},{"id":"basics_mech_0003","module":"basics","bank":"通用机械","type":"single","stem":"阀门的基本参数包括______。","options":["公称通径、公称压力、工作压力、结构长度","公称通径、工作压力、公称压力、适用介质","阀门流量、工作压力、公称通径、结构长度"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"阀门的基本参数包括公称通径、公称压力、工作压力和结构长度，它们决定阀门的通流能力、承压等级和安装尺寸，是选型的基本依据。"},{"id":"basics_mech_0004","module":"basics","bank":"通用机械","type":"single","stem":"阀门型号编制方法中首个字段代表______。","options":["传动方式代号","阀体材料代号","类型代号"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"阀门型号编制的首位是类型代号，用以表明阀门类别（如闸阀、截止阀），其后依次为传动方式、连接形式、结构形式、密封材料、公称压力、阀体材料等代号。"},{"id":"basics_mech_0005","module":"basics","bank":"通用机械","type":"single","stem":"截止阀的种类分角式、直流式、三通式、______。","options":["旋启式","直通式","升降式"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"截止阀按结构分为直通式、角式、直流式和三通式等；旋启式和升降式是止回阀的结构形式，不属于截止阀。"},{"id":"basics_mech_0006","module":"basics","bank":"通用机械","type":"single","stem":"闸阀的启闭件是闸板，闸板的运动方向与流体方向相垂直，闸阀只能做全开和全关，一般不做_____使用。","options":["调节和节流","隔离和阻断","分流和换向"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"闸阀启闭件为闸板，只能全开全关作切断用；若半开调节节流，闸板会受冲刷振动而损坏密封面，故不做调节和节流使用。"},{"id":"basics_mech_0007","module":"basics","bank":"通用机械","type":"single","stem":"安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，它能够防止锅炉、压力容器或压力管道等承压装置和设备因_____而破坏。","options":["冲刷","超压","振动"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"安全阀利用介质自身压力自动开启排放，使系统压力不超过预定安全值，从而防止锅炉、压力容器和管道等因超压而破坏。"},{"id":"basics_mech_0008","module":"basics","bank":"通用机械","type":"single","stem":"曲柄销中心与主轴颈中心之间的距离称曲柄半径R。连杆大、小端中心间的距离称连杆长度L。上、下止点间的距离称活塞行程（冲程）S。S=_____R。","options":["1.0","2.0","3.0"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"曲柄半径R是曲柄销中心到主轴颈中心的距离，曲柄回转一周活塞上下往复一次，故活塞行程为上、下止点间距离，恰为曲柄半径的两倍，即S=2R。"},{"id":"basics_mech_0009","module":"basics","bank":"通用机械","type":"single","stem":"压力容器种类繁多，如换热器、塔器、反应器、储槽等，但其基本结构是一个封闭的_____。","options":["壳体","球体","封头"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"压力容器尽管用途各异，其基本结构都是一个封闭的壳体，用以承受介质压力；封头、法兰、接管等只是其组成部分。"},{"id":"basics_mech_0010","module":"basics","bank":"通用机械","type":"single","stem":"_____是压力容器用以储存物料或完成化学反应所需要的主要空间，是压力容器的最主要的受压元件之一。","options":["封头","筒体","密封装置"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"筒体是压力容器储存物料或完成化学反应所需的主要空间，与封头组焊形成承压主体，是最主要的受压元件之一。"},{"id":"basics_mech_0011","module":"basics","bank":"通用机械","type":"single","stem":"热交换器是将一种介质的_____传给另一种介质的设备。","options":["能量","流量","热量"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"热交换器的作用就是将一种介质的热量传给另一种介质，实现加热、冷却或热量回收，传递的是热量而非能量或流量。"},{"id":"basics_mech_0012","module":"basics","bank":"通用机械","type":"single","stem":"泵是将机械能转换成流体的_____和动力能，实现流体定向输运的动力设备。","options":["速度能","压力能","热能"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"泵是动力设备，将原动机的机械能转换成流体的压力能和动力能，使流体获得能量后实现定向输送。"},{"id":"basics_mech_0013","module":"basics","bank":"通用机械","type":"single","stem":"泵的轴封装置主要有填料密封、______、浮动密封、迷宫式密封。","options":["O型圈密封","骨架密封","机械密封"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"泵的轴封装置主要有填料密封、机械密封、浮动密封和迷宫式密封，用以防止泵内流体沿转轴泄漏或空气渗入。"},{"id":"basics_mech_0014","module":"basics","bank":"通用机械","type":"single","stem":"核电厂常用的叶轮泵有______、混流泵和轴流泵三类。","options":["齿轮泵","离心泵","柱塞泵"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"核电厂常用的叶轮泵按液流方向分为离心泵、混流泵和轴流泵三类；齿轮泵、柱塞泵属于容积式泵，不在其列。"},{"id":"basics_mech_0015","module":"basics","bank":"通用机械","type":"single","stem":"离心泵启动时，出口阀开启时间与泵启动时间关系______。","options":["先启动泵，后开启出口阀","先开启出口阀，后启动泵","同时气动泵和出口阀"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"离心泵启动时应先启动泵，待转速正常后再开启出口阀，以减小启动电流，防止电机过载。"},{"id":"basics_mech_0016","module":"basics","bank":"通用机械","type":"single","stem":"离心泵启动前必须______。","options":["充水","排气","充水排气"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"离心泵启动前必须向泵内充水并排尽空气，否则泵内气体密度小无法形成足够吸力，会发生气缚而抽不上水。"},{"id":"basics_mech_0017","module":"basics","bank":"通用机械","type":"single","stem":"气流轴向进入风机叶轮后主要沿径向流动称______。","options":["离心式通风机","轴流式通风机","混流式通风机"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"气流轴向进入叶轮后主要沿径向流出的风机称离心式通风机，气体靠离心力获得压力；轴流式气体则沿轴向流动。"},{"id":"basics_mech_0018","module":"basics","bank":"通用机械","type":"single","stem":"轴流通风机与离心风机相比，其______，压力小。","options":["流量大","扬程高","风量小"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"轴流通风机流量大但压力小，适合大流量低阻力场合；离心风机压力较高。故与离心风机相比，轴流风机流量大、压力小。"},{"id":"basics_mech_0019","module":"basics","bank":"通用机械","type":"single","stem":"轮机运行时，从主蒸汽管道来的过热蒸汽通过控制阀门进入______，逐级做功后排出。","options":["低压缸","高压缸","中压缸"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"汽轮机运行时，主蒸汽管来的过热蒸汽经调节阀先进入高压缸逐级膨胀做功，之后通常经再热再进入中、低压缸继续做功。"},{"id":"basics_mech_0020","module":"basics","bank":"通用机械","type":"single","stem":"高压蒸汽从进汽管进入汽轮机，通过______时发生膨胀，压力降低，流速增加，使蒸汽的热能转变为汽流的动能。","options":["喷管","喉颈","孔板"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"蒸汽通过喷管（喷嘴叶栅）时发生膨胀，压力降低、流速增加，将热能转变为汽流动能，再到动叶中推动转子做功。"},{"id":"basics_mech_0021","module":"basics","bank":"通用机械","type":"judge","stem":"蒸汽在汽轮机中要从高参数膨胀到凝汽器的真空环境，比焓降很大，一次转化成机械能。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，蒸汽比焓降很大，不能一次转化，而是经汽轮机各级逐级膨胀做功，逐级将热能转化为机械能。"},{"id":"basics_mech_0022","module":"basics","bank":"通用机械","type":"single","stem":"蒸汽流过汽轮机级时，首先在喷嘴叶栅中将部分的热能转变成为动能，然后在动叶珊中将其动能和热能转变为______，使得叶轮和轴转动。","options":["电能","热量","机械能"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"蒸汽在喷嘴叶栅中热能变为动能，再在动叶栅中把动能和热能转化为机械能，推动叶轮和主轴旋转对外做功。"},{"id":"basics_mech_0023","module":"basics","bank":"通用机械","type":"judge","stem":"标准型号的阀门，其设计、制造、试验、验收等有相应的标准、规范作出详细的规定。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，标准型号阀门的设计、制造、试验和验收均有相应标准、规范作出详细规定，保证产品质量和互换性。"},{"id":"basics_mech_0024","module":"basics","bank":"通用机械","type":"judge","stem":"止回阀属于驱动型阀门。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，止回阀依靠介质自身流动自动启闭、防止介质倒流，属于自动型阀门而非驱动型阀门。"},{"id":"basics_mech_0025","module":"basics","bank":"通用机械","type":"judge","stem":"一般情况下，截止阀采用高进低处的安装方式。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，截止阀一般采用低进高出的安装方式，介质从阀瓣下方进入、上方流出，开启省力且关闭后阀杆处不受介质压力。"},{"id":"basics_mech_0026","module":"basics","bank":"通用机械","type":"judge","stem":"楔式闸阀的闸板呈楔形，两侧密封面与阀杆轴线成一定角度，利用闸板和阀座间的结构间隙配合作用起到密封的功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，楔式闸阀闸板呈楔形，两侧密封面与阀杆轴线成一定角度，利用闸板与阀座间的结构间隙配合作用实现密封。"},{"id":"basics_mech_0027","module":"basics","bank":"通用机械","type":"judge","stem":"安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，以防止系统内压力超过预定的安全值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，安全阀不借助外力，利用介质本身压力自动开启排出额定数量流体，使系统压力不超过预定安全值。"},{"id":"basics_mech_0028","module":"basics","bank":"通用机械","type":"judge","stem":"压力容器的设计必须满足强度、刚度、稳定度、耐久性、密封性等要求。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，压力容器设计必须同时满足强度、刚度、稳定度、耐久性和密封性等要求，才能保证在承压工况下安全可靠运行。"},{"id":"basics_mech_0029","module":"basics","bank":"通用机械","type":"judge","stem":"在役承压容器的检验，是为了使其'恢复'到现行（或原来的）设计、制造标准。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，在役承压容器检验的目的不是使其恢复到原设计制造标准，而是查明损伤缺陷、评定安全状况，判断能否继续使用。"},{"id":"basics_mech_0030","module":"basics","bank":"通用机械","type":"judge","stem":"压力容器在役检验方法主要采用无损检测方法，包括目视、射线、超声、磁粉、渗透、涡流、声发射、泄漏等。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，压力容器在役检验主要采用无损检测，包括目视、射线、超声、磁粉、渗透、涡流、声发射及泄漏检测等方法。"},{"id":"basics_mech_0031","module":"basics","bank":"通用机械","type":"judge","stem":"反应堆压力容器是核电厂最重要的压力容器之一。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，反应堆压力容器包容堆芯和冷却剂，承受高温高压及辐照，是核安全重要屏障，属核电厂最重要的压力容器之一。"},{"id":"basics_mech_0032","module":"basics","bank":"通用机械","type":"judge","stem":"离心泵一般用电动机带动,在启动前无需向壳内灌满被输送的液体。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，离心泵启动前必须向壳内灌满被输送液体并排尽空气，否则会发生气缚而无法吸水。"},{"id":"basics_mech_0033","module":"basics","bank":"通用机械","type":"judge","stem":"泵的密封装置分为密封环和轴端密封两种形式。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，泵的密封装置分密封环和轴端密封两种形式，密封环减少泵内间隙泄漏，轴端密封防止沿转轴外漏。"},{"id":"basics_mech_0034","module":"basics","bank":"通用机械","type":"judge","stem":"机械密封是由一个装在转轴上的动环和另一个固定在泵壳上的静环所组成。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，机械密封由装在转轴上的动环和固定在泵壳上的静环组成，两环端面紧密贴合并相对转动实现密封。"},{"id":"basics_mech_0035","module":"basics","bank":"通用机械","type":"judge","stem":"离心泵运转过程中发生汽蚀时,产生噪音和震动。叶轮局部地方在巨大冲击力的反复作用下,材料表面疲劳,从开始点蚀到形成严重的蜂窝状空洞，使叶片受到损坏。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，汽蚀时气泡溃灭产生巨大冲击，导致噪声和振动，叶轮材料在反复冲击下疲劳点蚀，形成蜂窝状空洞而损坏。"},{"id":"basics_mech_0036","module":"basics","bank":"通用机械","type":"judge","stem":"两台泵串联工作的主要目的是在保证扬程相同时增加系统的流量。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，两台泵串联是为了在相同流量下提高扬程；要在相同扬程下增加流量，应采用并联运行。"},{"id":"basics_mech_0037","module":"basics","bank":"通用机械","type":"judge","stem":"一般轴流式通风机叶轮安装在圆筒形机壳中,且叶轮所在轴与电动机轴通过联轴器连接。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，轴流式通风机叶轮安装在圆筒形机壳中，其叶轮轴通常与电动机轴直连（直联传动），而不是通过联轴器连接。"},{"id":"basics_mech_0038","module":"basics","bank":"通用机械","type":"judge","stem":"离心通风机性能好、效率高、体积小、重量轻、能与高速原动机直连。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，离心通风机性能好、效率高、体积小、重量轻，且能与高速原动机直连，因此得到广泛应用。"},{"id":"basics_mech_0039","module":"basics","bank":"通用机械","type":"judge","stem":"离心通风机的启动顺序: 1)关好风机进出口调节阀；2)启动通风机；3)启动润滑油泵；4)启动冷却水泵，打开冷却水阀；5)打开入口调节阀使通风流量达到运行要求的参数。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"错误，应先启动润滑油泵、冷却水泵等辅助系统，再启动通风机，最后逐渐打开入口调节阀使风量达到运行要求。"},{"id":"basics_mech_0040","module":"basics","bank":"通用机械","type":"judge","stem":"柴油发动机是将柴油喷射到气缸内与空气混合，燃烧得到热能转变为机械能的热力发动机。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，柴油机将柴油喷入气缸与空气混合燃烧，把燃烧产生的热能转变为机械能，属于热力发动机。"},{"id":"basics_mech_0041","module":"basics","bank":"通用机械","type":"judge","stem":"汽轮机冲转前后停机后，要使转子连续转动一段时间，以保证转子均匀受热和冷却。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"正确，汽轮机冲转前后及停机后需投入盘车使转子连续转动，保证转子均匀受热和冷却，防止转子热弯曲。"},{"id":"basics_elec_0001","module":"basics","bank":"电气原理","type":"judge","stem":"核电厂大多采用隐极式汽轮发电机。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"正确，核电厂汽轮发电机为与汽轮机直联的高速机，转子采用隐极式（圆柱形）结构，适合高速运行，机械强度好。"},{"id":"basics_elec_0002","module":"basics","bank":"电气原理","type":"judge","stem":"反时限过电流保护的特点是当通过保护装置的电流越大，保护动作时间越长。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"错误，反时限过电流保护的动作时间与通过电流成反比：电流越大，动作时间越短，从而尽快切除严重故障。"},{"id":"basics_elec_0003","module":"basics","bank":"电气原理","type":"single","stem":"能够切断过负荷电流和短路电流的开关电器是(    )。","options":["熔断器","隔离开关","接触器"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"熔断器靠熔体熔断切断电路，能切断过负荷电流和短路电流；隔离开关不能带负荷操作，接触器切断能力有限。"},{"id":"basics_elec_0004","module":"basics","bank":"电气原理","type":"single","stem":"在核电厂的所有工况下，包括全厂失电的情况下，要求不间断地连续供电的是(    )。","options":["第一类用户","第二类用户","第三类用户"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"第一类用户对安全最重要，在包括全厂失电的所有工况下都要求不间断连续供电（由直流或不间断电源保障）；第二、三类允许短时中断。"},{"id":"basics_elec_0005","module":"basics","bank":"电气原理","type":"single","stem":"(    )能在变压器励磁或负荷状态下进行操作，用来调换绕组的分接位置。","options":["无载分接开关","有载分接开关","满载分接开关"],"answer":["B"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"有载分接开关带专用切换装置，能在带励磁或带负荷状态下切换绕组分接位置，不停电调压；无载分接开关只能停电操作。"},{"id":"basics_elec_0006","module":"basics","bank":"电气原理","type":"single","stem":"某发电机具有2个磁极，工频50Hz，该发电机的转速为（    ）。","options":["1000r/min","1500r/min","2000r/min"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"同步转速n=60f/p（p为磁极对数）。2个磁极、工频50Hz理论上应为3000r/min，本题题库标准答案为2000r/min，建议记住公式并以题库答案为准。"},{"id":"basics_elec_0007","module":"basics","bank":"电气原理","type":"single","stem":"当主保护或断路器拒动时，用来切除故障的保护为（   ）。","options":["后备保护","辅助保护","异常运行保护"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"后备保护在主保护或断路器拒动时动作切除故障，分为近后备和远后备；辅助保护是补充主、后备保护性能的辅助性保护。"},{"id":"basics_elec_0008","module":"basics","bank":"电气原理","type":"single","stem":"下列关于发电机失磁保护的描述，正确的是（   ）。","options":["励磁系统出现故障使转子电流全部或部分消失即称发电机失磁","失磁保护动作的最终结果是使同步发电机处于稳定异步发电机状态运行","发电机失磁会引起定子电流及端电压升高"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"失磁即励磁系统故障使转子励磁电流全部或部分消失。失磁后机端电压下降、从系统吸收无功，保护动作最终跳闸，故B、C错误。"},{"id":"basics_elec_0009","module":"basics","bank":"电气原理","type":"single","stem":"下列设备中， （   ）是二次设备。","options":["母线","避雷器","电压表"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"电压表属测量仪表，接在二次回路中，是二次设备；母线、避雷器是直接参与电能生产、输送和分配的一次设备。"},{"id":"basics_elec_0010","module":"basics","bank":"电气原理","type":"single","stem":"下列不属于六氟化硫断路器特点的是（    ）。","options":["开断能力强","体积小","结构简单"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"SF6断路器开断能力强、断口电压高、体积小、噪声低，但结构较复杂、需专门的气体监视装置，\"结构简单\"不属于其特点。"},{"id":"basics_elec_0011","module":"basics","bank":"电气原理","type":"single","stem":"（    ）是变压器交变磁通的主磁路。","options":["一次绕组","二次绕组","铁芯"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"铁芯构成交变磁通的主磁路，一次、二次绕组绕在铁芯上，通过磁耦合在一次侧与二次侧间传递能量。"},{"id":"basics_elec_0012","module":"basics","bank":"电气原理","type":"judge","stem":"变压器能改变电压大小和频率。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"错误，变压器通过电磁感应改变电压、电流的大小，但一次、二次侧频率相同，不能改变频率。"},{"id":"basics_elec_0013","module":"basics","bank":"电气原理","type":"judge","stem":"电流互感器二次侧禁止短路，电压互感器二次侧禁止开路。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"错误，说反了：电流互感器二次侧禁止开路，否则会感应出危及人身和设备安全的高电压；电压互感器二次侧禁止短路，否则会因电流过大烧坏绕组。"},{"id":"basics_elec_0014","module":"basics","bank":"电气原理","type":"judge","stem":"游离过程大于去游离过程，电弧将持续燃烧；游离过程小于去游离过程，电弧将最终熄灭。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"正确，电弧的延续取决于游离与去游离的对比：游离强于去游离则电弧持续燃烧，去游离强于游离则电弧最终熄灭。"},{"id":"basics_elec_0015","module":"basics","bank":"电气原理","type":"judge","stem":"电压互感器为二次设备。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"错误，电压互感器本身是直接接入一次回路的一次设备；接在其二次侧的测量仪表、继电装置才是二次设备。"},{"id":"basics_elec_0016","module":"basics","bank":"电气原理","type":"judge","stem":"电力系统主要是由电源、输配电和用户等环节组成的电能生产与消费的系统。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"正确，电力系统由电源（发电机）、输配电网络、用户等环节组成，是电能生产、输送、分配和消费的统一系统。"},{"id":"basics_elec_0017","module":"basics","bank":"电气原理","type":"judge","stem":"发电机逆功率保护的目标是发电机定子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"错误，逆功率保护是防止发电机失去原动力后转为电动机运行、倒拖汽轮机，保护对象主要是汽轮机（低压缸末级叶片）而非定子。"},{"id":"basics_elec_0018","module":"basics","bank":"电气原理","type":"judge","stem":"低压断路器在正常情况下，触头不能接通和断开额定电流。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"错误，低压断路器正常情况下可以接通和分断额定负荷电流，并能在过负荷、短路等故障时自动切断电路。"},{"id":"basics_elec_0019","module":"basics","bank":"电气原理","type":"judge","stem":"电力系统故障时，仅距故障点最近的保护装置动作，将故障元件从电力系统中切除，体现的是继电保护的灵敏性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"错误，该描述体现的是继电保护的选择性：仅距故障点最近的保护动作切除故障元件；灵敏性指保护区内故障时保护可靠响应的能力。"},{"id":"basics_elec_0020","module":"basics","bank":"电气原理","type":"multi","stem":"GIS配电装置的优点是（     ）。","options":["占地面积小","运行可靠性高","运行维护工作量大","安装调试困难"],"answer":["A","B"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"GIS将各电气设备集成于充SF6气体的密封壳体内，结构紧凑、占地面积小、运行可靠性高；其检修工作量小、安装较方便，C、D两项表述与事实相反。"},{"id":"basics_elec_0021","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于隔离开关的描述，正确的有（     ）。","options":["隔离开关用于关合大电流电路","隔离开关具有明显的断开点与信号标记，使得运行或检修人员能清楚确认开关分、合状态","隔离开关能够切断负荷电流与短路电流","隔离开关和断路器配合使用时，应先分断路器后分隔离开关，隔离开关先合断路器后合"],"answer":["B","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"隔离开关没有灭弧装置，不能切断负荷电流、短路电流或关合大电流电路；它提供明显断开点，与断路器配合遵循先分断路器后分隔离开关、先合隔离开关后合断路器的顺序。"},{"id":"basics_elec_0022","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于一台半断路器接线的描述，正确的有(     )。","options":["一台半断路器接线成串配置时，同名回路应布置在不同串上","一台半断路器接线具备高度可靠性，且运行调度灵活，操作检修方便，继电保护简单","一台半断路器接线至少应有三个串，才能形成多环形","一台半断路器接线成串配置时，对特别重要的同名回路，应考虑'交替布置'"],"answer":["A","C","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"一台半断路器接线可靠性高、运行调度灵活，但其继电保护及配置较复杂（B错）；同名回路宜布置在不同串上，特别重要的同名回路应考虑交替布置，形成多环形至少需三个串。"},{"id":"basics_elec_0023","module":"basics","bank":"电气原理","type":"multi","stem":"核电厂厂用电设计原则包括（     )。","options":["采用双重独立配电系统","在完全失去厂外电源及厂内配电系统的任意一个通道的情况下，仍有冗余的通道，完成执行安全停堆所需的安全功能","在电厂运行期间可对电气设备及其系统进行检查、试验，以检查系统的可靠性，这一点主要指对应急电源系统进行的定期试验","在发生设计基准事故时，能保证使执行电厂安全功能或维持安全停堆的主要设备不失去电源"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"核电厂厂用电要求双重独立配电，厂外电源失去任一通道仍有冗余供电，运行中可在线检查和定期试验应急电源，设计基准事故时执行安全功能的设备不失电，四项均正确故全选。"},{"id":"basics_elec_0024","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于瓦斯保护的描述，正确的有（    ）。","options":["轻瓦斯动作于报警，重瓦斯动作于跳闸","瓦斯保护是变压器铁芯烧损的唯一保护","瓦斯保护能够反映变压器套管及引出线的故障","瓦斯保护能反映变压器油箱内部的任何故障"],"answer":["A","B","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"瓦斯保护能反映变压器油箱内部任何故障及铁芯烧损（铁芯烧损的唯一保护），轻瓦斯动作于报警、重瓦斯动作于跳闸；套管及引出线故障不在其反映范围内，C错。"},{"id":"basics_ic_0001","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂关键设备不包括：（    ）","options":["反应堆","主泵","蒸汽发生器","余热排出泵"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"核电厂关键设备通常指反应堆、主泵、蒸汽发生器、稳压器等一回路主要设备，余热排出泵属于余热排出系统，不列入关键设备。"},{"id":"basics_ic_0002","module":"basics","bank":"仪表与控制","type":"judge","stem":"远程停堆站属于主控制室设备。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"错误，远程停堆站是设在主控制室之外的独立停堆手段，不属于主控制室设备，用于主控制室不可用时实施安全停堆。"},{"id":"basics_ic_0003","module":"basics","bank":"仪表与控制","type":"single","stem":"热电阻的特性不包括以下：（     ）","options":["精确度高","输出信号大","需要冷端补偿参比端","响应速度慢"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"冷端补偿是热电偶测温才需要的措施；热电阻具有精确度高、输出信号大等特点，但热惯性较大、响应速度较慢。"},{"id":"basics_ic_0004","module":"basics","bank":"仪表与控制","type":"single","stem":"差压式流量计中节流装置输出差压与被测流量的关系为：(      )","options":["差压与流量成正比","差压与流量成反比","差压与流量的平方成正比","差压与流量成线性关系"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"节流装置基于伯努利原理工作，输出差压与被测流量的平方成正比（ΔP∝Q²），因此流量与差压的平方根成正比。"},{"id":"basics_ic_0005","module":"basics","bank":"仪表与控制","type":"single","stem":"以下设备中那个设备在稳压器压力调节系统中不受调节器控制（     ）","options":["稳压器比例式电加热器","稳压器安全阀","稳压器喷淋阀","主蒸汽隔离阀"],"answer":["B"],"score":null,"source":"official","origin":"仪表.xls","explanation":"稳压器安全阀按其整定压力自行启闭，属于保护设备，不受压力调节器控制；喷淋阀和电加热器才是压力调节系统的调节手段。"},{"id":"basics_ic_0006","module":"basics","bank":"仪表与控制","type":"single","stem":"冷却剂环路流量测量使用的仪表类型为：（     ）","options":["压差变送器","压力表","体积流量计","超声波流量计"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"冷却剂环路流量采用弯管或节流装置产生差压，再用压差变送器测量，属于差压法测流量。"},{"id":"basics_ic_0007","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂一回路冷却剂系统使用测量主管道温度的仪表类型多为：（     ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"一回路主管道（冷段/热段）温度测量要求精度高、稳定性好，多采用热电阻（铂电阻）。"},{"id":"basics_ic_0008","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不是反应堆冷却剂系统的热工参数的（    ）。","options":["温度","压力","流量","放射性"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"温度、压力、流量均为热工参数；放射性属于核测量（辐射监测）参数，不是热工参数。"},{"id":"basics_ic_0009","module":"basics","bank":"仪表与控制","type":"single","stem":"仪控系统需要保证的三大核安全目标（要素）不包括：（     ）","options":["反应性控制","余热排出","放射性包容","工业安全"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"仪控系统保证的三大核安全目标是反应性控制、余热排出和放射性包容，工业安全不在其中。"},{"id":"basics_ic_0010","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不会产生汽轮机保护跳机信号的为：（    ）","options":["润滑油油压低","汽轮机超速","阀门活动性试验","反应堆停堆"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"润滑油压低、汽轮机超速、反应堆停堆均会产生跳机信号；阀门活动性试验是定期试验，不产生跳机信号。"},{"id":"basics_ic_0011","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不属于反应堆停堆原因的是：（    ）","options":["一回路压力超限","核功率超限","汽轮机转速高","一回路向二回路泄漏"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"一回路压力超限、核功率超限、一回路向二回路泄漏均可触发停堆；汽轮机转速高产生的是汽机跳闸信号，不是停堆原因。"},{"id":"basics_ic_0012","module":"basics","bank":"仪表与控制","type":"single","stem":"在优选逻辑中，以下哪类指令优先级最高？（    ）","options":["安全级信号","后备盘信号","多样性信号","除了多样性信号的安全相关及非安信号"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"优选（优先）逻辑中安全级信号优先级最高，优先于其他信号执行，以保证反应堆安全。"},{"id":"basics_ic_0013","module":"basics","bank":"仪表与控制","type":"single","stem":"下列哪些不是专设安全设施功能：（    ）","options":["启动辅助给水","安全注入","硼水补给","安喷"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"专设安全设施功能包括安全注入、启动辅助给水、安全壳喷淋等；硼水补给属于化学和容积控制系统的功能。"},{"id":"basics_ic_0014","module":"basics","bank":"仪表与控制","type":"single","stem":"以下哪项不是堆芯中子注量率测量系统在正常运行时的功能（     ）","options":["探测反应堆在装料中可能出现的差错","检查与燃耗对应的功率分布是否与设计所期望的功率分布相符","监测各燃料组件的燃耗，校准堆外核测量仪表","探测堆芯是否偏离正常运行"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正常运行时，堆芯中子注量率测量系统用于校核功率分布、监测燃耗、校准堆外核测和探测偏离正常运行；装料差错探测属于换料工况功能。"},{"id":"basics_ic_0015","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂应用最多的测温仪表类型为：（     ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"热电阻（铂电阻）精度高、稳定性好，是核电厂应用最多的测温仪表；热电偶多用于高温场合。"},{"id":"basics_ic_0016","module":"basics","bank":"仪表与控制","type":"single","stem":"（    ）反映了系统误差的大小，表明测量结果与真值的接近程度。","options":["正确度","精密度","准确度","不确定度"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"准确度表明测量结果与真值的接近程度；严格按定义系统误差对应正确度，本题按题库标准答案为准确度。"},{"id":"basics_ic_0017","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂仪表控制系统的组成部分不包括：（     ）","options":["堆外核测系统","堆内核测系统","汽轮机控制系统","环境监测系统"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"仪表控制系统包括堆外核测、堆内核测、汽轮机控制等；环境监测系统属于辐射防护范畴，不属于其组成部分。"},{"id":"basics_ic_0018","module":"basics","bank":"仪表与控制","type":"single","stem":"下列哪个不是误差的表示方法？","options":["绝对误差","相对误差","引用误差","计算误差"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"误差的表示方法有绝对误差、相对误差、引用误差三种；\"计算误差\"不属于误差的表示方法。"},{"id":"basics_ic_0019","module":"basics","bank":"仪表与控制","type":"single","stem":"反应性控制的类型不包括：（    ）","options":["液位控制","功率控制","补偿控制","紧急停堆控制"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"反应性控制包括功率控制、补偿控制和紧急停堆控制；液位控制属于稳压器或蒸汽发生器水位控制，不属于反应性控制。"},{"id":"basics_ic_0020","module":"basics","bank":"仪表与控制","type":"judge","stem":"核电厂应用最多的测温仪表类型为热电阻。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，热电阻（铂电阻）精度高、稳定性好，是核电厂应用最多的测温仪表。"},{"id":"basics_ic_0021","module":"basics","bank":"仪表与控制","type":"judge","stem":"准确度反映了系统误差的大小，表明测量结果与真值的接近程度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，准确度表明测量结果与真值的接近程度（本题按题库口径认为其反映系统误差大小）。"},{"id":"basics_ic_0022","module":"basics","bank":"仪表与控制","type":"judge","stem":"热电阻PT100，在温度摄氏度0°C时电阻为100Ω","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，PT100为铂热电阻，其命名即指0°C时标称电阻值为100Ω。"},{"id":"basics_ic_0023","module":"basics","bank":"仪表与控制","type":"judge","stem":"功率量程高功率停棒的核功率是120%FP。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"错误，功率量程高功率停棒定值约为109%FP，而不是120%。"},{"id":"basics_ic_0024","module":"basics","bank":"仪表与控制","type":"judge","stem":"安全注入属于专设安全设施功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，安全注入是专设安全设施的重要功能，事故时向堆芯注入含硼水，保证堆芯冷却。"},{"id":"basics_ic_0025","module":"basics","bank":"仪表与控制","type":"judge","stem":"核电厂仪表与控制系统的功能可以归纳为三种：即监视功能、控制功能和保护功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，核电厂仪表与控制系统的功能可归纳为监视功能、控制功能和保护功能三种。"},{"id":"basics_ic_0026","module":"basics","bank":"仪表与控制","type":"judge","stem":"前馈是闭环控制系统。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"错误，前馈控制按扰动量调节，属于开环控制；闭环控制是按被调量与给定值的偏差进行调节。"},{"id":"basics_ic_0027","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽发生器液位计根据量程分为宽量程液位计和窄量程液位计。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，蒸汽发生器液位计按量程分为宽量程和窄量程两种，窄量程主要用于功率运行时的水位调节与保护。"},{"id":"basics_ic_0028","module":"basics","bank":"仪表与控制","type":"judge","stem":"DCS系统按功能层次可划分为四层： Level 0为工艺接口层，Level 1为控制处理层，Level 2为操作监视层，Level 3为生产管理层。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，DCS按功能层次分为四层：Level 0工艺接口层、Level 1控制处理层、Level 2操作监视层、Level 3生产管理层。"},{"id":"basics_ic_0029","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽排放控制系统只有一种模式，即蒸汽压力控制模式。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"错误，蒸汽排放控制系统有蒸汽压力控制和一回路平均温度控制两种模式，并非只有压力控制模式。"},{"id":"basics_ic_0030","module":"basics","bank":"仪表与控制","type":"judge","stem":"汽轮发电机组通过汽轮机调节系统实现机组转速和负荷调节。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，汽轮发电机组由汽轮机调节系统调节进汽量，实现机组转速和负荷的调节。"},{"id":"basics_ic_0031","module":"basics","bank":"仪表与控制","type":"judge","stem":"仪表能够测量的最大输入量与最小输入量之间的范围称作仪表的量程范围，简称量程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，仪表能测量的最大输入量与最小输入量之间的范围称为量程范围，简称量程。"},{"id":"basics_ic_0032","module":"basics","bank":"仪表与控制","type":"judge","stem":"流体流经节流装置时遵循伯努力方程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，流体流经节流装置时遵循伯努利方程，截面收缩处流速增大、静压降低，从而产生差压。"},{"id":"basics_ic_0033","module":"basics","bank":"仪表与控制","type":"judge","stem":"所谓控制就是为了达到一定的目的，对生产过程的设备进行控制操作，使其满足生产过程要求。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，控制就是为了达到一定目的，对生产过程的设备进行控制操作，使其满足生产过程要求。"},{"id":"basics_ic_0034","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽发生器水位调节系统的执行器是给水调节阀和给水泵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，蒸汽发生器水位调节系统通过改变给水调节阀开度和给水泵转速来调节给水流量，两者均为执行器。"},{"id":"basics_ic_0035","module":"basics","bank":"仪表与控制","type":"judge","stem":"按安全等级划分，DCS系统设备可以分为安全级设备和非安全级设备。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，按安全等级划分，DCS系统设备分为安全级设备和非安全级设备两类。"},{"id":"basics_ic_0036","module":"basics","bank":"仪表与控制","type":"judge","stem":"稳压器下部电加热器分为通断式电加热器和比例式电加热器两种类型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，稳压器电加热器分为通断式（开关式）和比例式两种，比例式由压力调节器连续调节。"},{"id":"basics_ic_0037","module":"basics","bank":"仪表与控制","type":"judge","stem":"汽轮机旁路系统运行时，汽机进气压力信号不能代表二回路总负荷，这时候人为设置一个功率数值，称为最终功率整定值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，汽机旁路运行时进汽压力信号不能代表二回路总负荷，故设置最终功率整定值作为控制基准。"},{"id":"basics_ic_0038","module":"basics","bank":"仪表与控制","type":"judge","stem":"控制对象：被控制的设备或生产过程为控制对象或被控制过程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"正确，被控制的设备或生产过程即控制对象（被控过程），是控制系统的基本组成概念。"},{"id":"basics_ic_0043","module":"basics","bank":"仪表与控制","type":"single","stem":"热电阻PT100，在温度摄氏度0°C时（     ）","options":["电阻为100Ω","电阻0Ω","电流4mA","电压0V"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"PT100为铂热电阻，其命名即指0°C时标称电阻值为100Ω，电阻值随温度升高而增大。"},{"id":"basics_op_0001","module":"basics","bank":"运行概述","type":"judge","stem":"我国自主知识产权三代核电机组“华龙一号”是压水堆。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，华龙一号是我国自主研发的三代压水堆核电机组，采用双安全壳和能动与非能动相结合的安全设计。"},{"id":"basics_op_0002","module":"basics","bank":"运行概述","type":"judge","stem":"汽轮发电机组并入电网才能将发出的电能源源不断地输送给电网。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，汽轮发电机组只有并入电网，才能与电网保持频率同步，将发出的电能持续稳定地输送出去。"},{"id":"basics_op_0003","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆的特点之一为不停堆换料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，重水堆采用压力管结构，燃料通道可单独操作，能在反应堆运行中更换燃料，实现不停堆换料。"},{"id":"basics_op_0004","module":"basics","bank":"运行概述","type":"judge","stem":"功率运行期间发生链式裂变反应的核燃料装载在反应堆压力容器中。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，压水堆的燃料组件装载在反应堆压力容器中，链式裂变反应在压力容器内进行并释放核能。"},{"id":"basics_op_0005","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆核电厂绝大多数使用过热蒸汽。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，压水堆核电厂蒸汽发生器产生的是饱和蒸汽，并非过热蒸汽。"},{"id":"basics_op_0006","module":"basics","bank":"运行概述","type":"single","stem":"以下哪一项不属于核安全三要素（   ）。","options":["反应性控制","余热导出","防止商用大飞机撞击","放射性包容"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"核安全三要素是反应性控制、余热导出和放射性包容；防止商用大飞机撞击属于外部事件防护设计，不属于三要素。"},{"id":"basics_op_0007","module":"basics","bank":"运行概述","type":"judge","stem":"核电厂装卸料操作都是在充满水的反应堆水池中水下操作的。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，核电厂装卸料都在充满水的反应堆水池中水下进行，水提供屏蔽和冷却，保证操作安全。"},{"id":"basics_op_0008","module":"basics","bank":"运行概述","type":"judge","stem":"非能动安全系统需要持续的电源才能保证系统设计功能。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，非能动安全系统依靠重力、自然循环、压缩气体等自然力实现功能，无需外部电源即可发挥作用。"},{"id":"basics_op_0009","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆中作为慢化剂的重水的价格昂贵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，重水生产需从大量普通水中分离同位素，能耗大、工艺复杂，价格昂贵，运行中须严格控制重水损耗。"},{"id":"basics_op_0010","module":"basics","bank":"运行概述","type":"judge","stem":"在100%满功率稳定运行时，反应堆是处于临界状态的。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，临界状态下有效增殖因数等于1，链式反应稳定进行，100%满功率稳定运行时反应堆即处于临界。"},{"id":"basics_op_0011","module":"basics","bank":"运行概述","type":"judge","stem":"福岛核电厂在海啸开始时反应堆自动保护紧急停堆。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，福岛机组是地震时自动紧急停堆，随后海啸淹没应急电源导致全厂断电，事故才逐步恶化。"},{"id":"basics_op_0012","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆核电厂启动需要对一回路进行充水排气。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，启动前须对一回路充水排气，排出系统内气体，防止泵汽蚀和流动滞塞，保证堆芯冷却。"},{"id":"basics_op_0013","module":"basics","bank":"运行概述","type":"judge","stem":"钠冷快堆使用的金属钠是不活泼金属。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，金属钠是化学性质活泼的碱金属，遇水剧烈反应甚至燃烧爆炸，与空气也会反应，须严格隔水隔气保存。"},{"id":"basics_op_0014","module":"basics","bank":"运行概述","type":"judge","stem":"核安全三要素是指反应性控制、余热导出、放射性包容。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，核安全三要素即反应性控制、余热导出、放射性包容，核电厂设计运行均围绕保障这三要素展开。"},{"id":"basics_op_0015","module":"basics","bank":"运行概述","type":"judge","stem":"两个'零容忍'是指对违规操作零容忍、对弄虚作假零容忍。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，两个零容忍指对违规操作零容忍、对弄虚作假零容忍，是核安全文化的重要内容。"},{"id":"basics_op_0016","module":"basics","bank":"运行概述","type":"judge","stem":"汽轮发电机组并网才能将发出的电能输送给电网。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，发电机必须并网后才能向电网输送电能，并网后机组与电网保持同步运行。"},{"id":"basics_op_0017","module":"basics","bank":"运行概述","type":"judge","stem":"反应堆达临界操作是核电厂重要操作，需要遵守运行规程的规定。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，达临界是反应堆升功率过程中的重要操作，必须严格遵守运行规程，在监测下逐步逼近并确认临界。"},{"id":"basics_op_0018","module":"basics","bank":"运行概述","type":"judge","stem":"反应堆停闭后，堆芯不再有热量，可以立即停止冷却。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，停堆后裂变产物衰变仍持续释放衰变热，必须保持堆芯冷却，否则燃料会过热损坏。"},{"id":"basics_op_0019","module":"basics","bank":"运行概述","type":"judge","stem":"轻核聚变的特点是不产生放射性。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，轻核聚变产物主要是稳定的氦核，不产生长寿命高放废物，放射性影响小。"},{"id":"basics_op_0020","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆最大的特点是核燃料增殖。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，压水堆的主要特点是以轻水兼作冷却剂和慢化剂、一二回路分开；核燃料增殖是快堆的特点。"},{"id":"basics_op_0021","module":"basics","bank":"运行概述","type":"judge","stem":"高温气冷堆核电站发电效率比压水堆核电站高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，高温气冷堆氦气出口温度可达700℃以上，蒸汽参数高，热力循环效率高于压水堆核电厂。"},{"id":"basics_op_0022","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂在汽轮机中做完功的乏汽的热量最终由以下哪种介质带走？____","options":["一回路冷却剂","二回路凝结水","三回路海水或冷却塔"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"乏汽在凝汽器中凝结放热，其热量最终由海水或冷却塔循环水等三回路冷却水带走。"},{"id":"basics_op_0023","module":"basics","bank":"运行概述","type":"single","stem":"熔盐堆的核燃料是以下哪种：____","options":["液态熔盐燃料","固体燃料棒","石墨燃料球"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"熔盐堆的核燃料以液态熔盐形式存在，燃料溶解在高温熔盐中，既是核燃料又起冷却剂作用。"},{"id":"basics_op_0024","module":"basics","bank":"运行概述","type":"single","stem":"快堆的冷却剂一般为以下哪种：____。","options":["金属钠","轻水","重水","氮气"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"快堆一般用液态金属钠作冷却剂，钠导热性好、对中子慢化作用小，有利于维持快中子能谱。"},{"id":"basics_op_0025","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂转变为电能的能量的最初来源于以下 ____ 。","options":["取水口的潮汐能","核燃料的裂变反应","太阳能"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"核电厂能量最初来源于核燃料的链式裂变反应，核能经热能和机械能逐级转换为电能。"},{"id":"basics_op_0026","module":"basics","bank":"运行概述","type":"single","stem":"发生切尔诺贝利核事故的核电站是以下哪种堆型？_____","options":["压水堆","石墨堆","重水堆","沸水堆"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"切尔诺贝利核电厂是石墨慢化的RBMK沸水堆，正空泡系数和控制棒设计缺陷是事故的重要原因。"},{"id":"basics_op_0027","module":"basics","bank":"运行概述","type":"single","stem":"发生福岛核事故的核电站是以下哪种堆型？____","options":["压水堆","重水堆","沸水堆","气冷堆"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"福岛第一核电厂是沸水堆，在反应堆内直接产生蒸汽推动汽轮机，属于单回路循环。"},{"id":"basics_op_0028","module":"basics","bank":"运行概述","type":"single","stem":"以下哪个设备安装在核岛厂房。____","options":["主给水泵","汽轮发电机组","主泵","应急柴油机"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"主泵布置在核岛反应堆厂房内，驱动一回路冷却剂循环；汽轮发电机组位于常规岛。"},{"id":"basics_op_0029","module":"basics","bank":"运行概述","type":"single","stem":"热停堆模式时，满足如下条件：反应堆冷却剂系统压力在15.4MPa；稳压器压力和____处于自动控制；反应堆冷却剂系统的平均温度由大气释放阀控制在约290℃；蒸汽发生器水位由辅助给水泵维持在零负荷水位。","options":["硼浓度","温度","水位"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"热停堆模式下稳压器压力和水位均应处于自动控制，一回路平均温度由大气释放阀控制在约290℃。"},{"id":"basics_op_0030","module":"basics","bank":"运行概述","type":"single","stem":"在_____已经建立之后，反应堆冷却剂的硼浓度在明显变化之前，需启动稳压器电加热器，允许稳压器喷淋阀调节稳压器至反应堆冷却系统之间的硼浓度。","options":["稳压器汽腔","稳压器水位","蒸发器水位"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"稳压器汽腔建立后才可投入电加热器，并用稳压器喷淋调节稳压器与一回路间的硼浓度平衡。"},{"id":"basics_op_0031","module":"basics","bank":"运行概述","type":"judge","stem":"中子轰击放射性同位素的重核，发生裂变反应，重核分解成两个轻一些的原子核，释放能量并产生1个中子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，重核裂变时释放的新中子平均为2～3个，而不是1个，链式反应正是靠这些中子维持。"},{"id":"basics_op_0032","module":"basics","bank":"运行概述","type":"single","stem":"我国自主知识产权三代核电机组'华龙一号'是以下哪种堆型。____","options":["重水堆","快堆","压水堆","熔盐堆"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"华龙一号是我国自主知识产权的三代压水堆机组，采用双安全壳和能动加非能动安全设计。"},{"id":"basics_op_0033","module":"basics","bank":"运行概述","type":"single","stem":"下列哪个堆型属于三代堆。____","options":["华龙一号","M310","高温气冷堆","熔盐堆"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"华龙一号属于三代压水堆；M310为二代堆型，高温气冷堆和熔盐堆属于四代堆型。"},{"id":"basics_op_0034","module":"basics","bank":"运行概述","type":"single","stem":"下列哪个设备布置在常规岛厂房。_____","options":["蒸汽发生器","汽轮发电机组","稳压器安全阀","主泵"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"常规岛主要布置汽轮发电机组及其辅助设备，蒸汽发生器、主泵、稳压器安全阀等均在核岛。"},{"id":"basics_op_0035","module":"basics","bank":"运行概述","type":"single","stem":"核电厂推动汽轮机做功发电的蒸汽是以下那个设备中产生的。_____","options":["稳压器","压力容器","蒸汽发生器"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"蒸汽发生器是一二回路的热交换设备，产生的二回路蒸汽推动汽轮机做功发电。"},{"id":"basics_op_0036","module":"basics","bank":"运行概述","type":"single","stem":"稳压器安全阀的作用是 ____ 。","options":["保证一回路不超压","排出堆芯多余的冷却剂","冷却堆芯","一回路充水"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"稳压器安全阀是一回路超压保护装置，压力超过整定值时自动开启泄压，保证一回路不超压。"},{"id":"basics_op_0037","module":"basics","bank":"运行概述","type":"single","stem":"下列哪一项属于压水堆核电厂的特点____ 。","options":["反应堆超临界","蒸汽发生器产生的是饱和蒸汽","停堆后停止释热"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"压水堆一二回路分开，蒸汽发生器产生的二回路蒸汽是饱和蒸汽，这是压水堆的重要特点。"},{"id":"basics_op_0038","module":"basics","bank":"运行概述","type":"single","stem":"蒸汽发生器安装在 ____ 。","options":["反应堆厂房","汽轮机厂房","燃料厂房"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"蒸汽发生器是一回路主设备，与反应堆压力容器、主泵、稳压器一起安装在反应堆厂房内。"},{"id":"basics_op_0039","module":"basics","bank":"运行概述","type":"single","stem":"正常情况下，压水堆核电站只在_____ 中存在放射性。","options":["一回路","二回路","三回路"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正常运行时放射性只存在于一回路，二、三回路无放射性，除非蒸汽发生器传热管发生泄漏。"},{"id":"basics_op_0040","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂，链式裂变反应是由  _____ 维持的。","options":["热中子","快中子","γ射线"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"压水堆以轻水慢化中子，热中子引发铀-235裂变的截面大，链式裂变反应由热中子维持。"},{"id":"basics_op_0041","module":"basics","bank":"运行概述","type":"single","stem":"原子是由带正电的_____ 和带负电的电子组成。","options":["原子核","量子","中子"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"原子由带正电的原子核和绕核运动的带负电电子组成，整体呈电中性。"},{"id":"basics_op_0042","module":"basics","bank":"运行概述","type":"single","stem":"以下_____，是我国目前核电发展政策。","options":["火电为主、大力发展水电、核电为补充","在保证安全的基础上适度发展核电","积极安全有序发展核电"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"我国当前核电发展政策是积极安全有序发展核电，在保证安全的基础上适度发展核电是此前表述。"},{"id":"basics_op_0043","module":"basics","bank":"运行概述","type":"judge","stem":"蒸汽发生器倒U形管部位进行一二回路热交换。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，一回路冷却剂流经蒸汽发生器倒U形传热管束，将热量传给管外二回路给水产生蒸汽。"},{"id":"basics_op_0044","module":"basics","bank":"运行概述","type":"judge","stem":"核电厂绝大多数使用过饱和蒸汽。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，压水堆核电厂使用蒸汽发生器产生的饱和蒸汽推动汽轮机做功，并非过饱和蒸汽。"},{"id":"basics_op_0045","module":"basics","bank":"运行概述","type":"judge","stem":"正常运行时，压水堆核电厂汽轮机厂房有放射性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，正常运行时二回路汽水无放射性，汽轮机厂房（常规岛）本质上不存在放射性，放射性集中在一回路。"},{"id":"basics_op_0046","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆的慢化剂是重水。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，重水堆以重水作慢化剂，重水中子吸收截面小、慢化性能好，还可兼作冷却剂。"},{"id":"safety_zb_0001","module":"safety","bank":"保护区安全准入","type":"single","stem":"独立验证验证人（组）验证设备的状态（或配置）与（ ）的一致。","options":["程序要求","执行人（组）通知","经验反馈","配置管理要求"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"独立验证是验证人将设备实际状态与程序（规程）要求进行核对确认，确保与文件要求一致。"},{"id":"safety_zb_0002","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下情况下（ ）可以使用独立验证的工具，来防止人因失误。","options":["设备维修后投用前","安全相关设备或重要设备及系统的配置","安装重要设备或系统的隔离牌/锁时","其它选项都可以"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"设备维修后投用前、安全相关/重要设备及系统的配置确认、安装隔离牌锁等场合都可使用独立验证防止人因失误，故选\"其它选项都可以\"。"},{"id":"safety_zb_0003","module":"safety","bank":"保护区安全准入","type":"single","stem":"在口头交流中，信息最少需要通过（ ）次交换可确保信息有效传达。","options":["0次","1次","2次","3次"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"口头交流（三向交流）中信息至少需通过3次交换：发送方发出→接收方复述→发送方确认，确保信息有效传达。"},{"id":"safety_zb_0004","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下各项中，哪项是使用自检工具的主要目的。（ ）","options":["强化工作态度","减少失误频率","提高交流水平","消除外界干扰"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"自检（STAR）的主要目的是通过停思行审减少执行过程中的失误频率。"},{"id":"safety_zb_0005","module":"safety","bank":"保护区安全准入","type":"single","stem":"'STAR'中的Review（审）主要是确认实际的响应结果与（ ）是否相符。","options":["预期","想象","最初"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"STAR中的Review（审）是确认实际行动结果与预期是否相符。"},{"id":"safety_zb_0006","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下属于监护的主要目的是（ ）。","options":["预防监护人失误","预防执行过程中的失误","纠正错误","其它选项全是"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"监护的主要目的是预防执行过程中执行人发生失误，监护人全程观察并及时纠正。"},{"id":"safety_zb_0007","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用独立验证工具时，应避免出现下列情况（ ）。","options":["在执行组采取行动期间，验证组距离执行组非常近","执行组尚未完成所有操作即开始进行独立验证","在执行验证前，执行组告诉验证组已经做了什么，哪些没做","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"独立验证应避免：执行组行动期间打扰、执行组未完成全部操作就验证、验证前不告知等，都是不当做法，故选\"其它选项都是\"。"},{"id":"safety_zb_0008","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用三向交流工具过程中，当接收方接收信息滞后或复述有错误时，发送方应该怎么做（ ）。","options":["要求接收方再复述或重述信息一次","告诉接收方'信息是错误的'，并要求重述原始信息","通过接收方所使用交流方式进行反馈"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"三向交流中接收方复述有误时，发送方应告知\"信息是错误的\"并要求重新复述，直至准确。"},{"id":"safety_zb_0009","module":"safety","bank":"保护区安全准入","type":"single","stem":"核电厂屏障分为（ ）、个人屏障、管理屏障、组织屏障四个层次。","options":["实物屏障","实体屏障","环境屏障","行政屏障"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"核电厂屏障分为实体屏障、个人屏障、管理屏障、组织屏障四个层次。"},{"id":"safety_zb_0010","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下属于个人屏障的是（ ）。","options":["资源配置","电厂运行规程","知识技能","专设安全设施"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"个人屏障包括个人的知识技能、资格授权、健康状态等；资源配置、规程、专设安全设施不属于个人屏障。"},{"id":"safety_zb_0011","module":"safety","bank":"保护区安全准入","type":"single","stem":"自检的防人因失误工具包括（ ）、（ ）、（ ）和（ ）四个重要步骤。（ ）","options":["停、思、行、审","停、行、审、思","思、停、行、审","思、审、停、行"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"自检STAR四步骤：Stop停、Think思、Act行、Review审。"},{"id":"safety_zb_0012","module":"safety","bank":"保护区安全准入","type":"single","stem":"下列哪项描述对应着图中工作人员在使用质疑的态度工具时应该避免出现的情况？（ ）","options":["忽视其他人的担心和质疑","对关键的参数不在意","相信技术资料来源是可靠的","认为不会出现任何风险"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"质疑的态度要避免自满：认为\"不会出现任何风险\"即丧失质疑精神，是最应避免的。"},{"id":"safety_zb_0013","module":"safety","bank":"保护区安全准入","type":"single","stem":"'明知不可为而为之'导致不良后果的行为属于（ ）。","options":["知识型失误","规则性失误","技能型失误","违规"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"明知不可为而为之\"是有意违反规定，属于违规（违章），不属于失误类型。"},{"id":"safety_zb_0014","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪些属于工后会工具使用的基本原则。（ ）","options":["工后会是以总结经验、改进工作绩效为目的，不要追究责任","工后会形式应采用对话讨论的形式","纠正行动和计划满足SMART原则","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"工后会以总结经验改进工作为目的、采用对话讨论形式、纠正行动满足SMART原则等都是基本原则，故选\"其它选项都是\"。"},{"id":"safety_zb_0015","module":"safety","bank":"保护区安全准入","type":"single","stem":"使用三向交流工具时应避免以下哪些情况（ ）。","options":["发送方试图与已经专心于另一对话的人员沟通","接收方在收到发送方第三步确认前就采取了行动","发送方没有用接收方姓名提醒其注意","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"三向交流应避免发送方干扰他人、接收方不按流程确认、不称呼姓名等，故选\"其它选项都是\"。"},{"id":"safety_zb_0016","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用自检工具的过程中，以下说法正确的是（ ）。","options":["在执行任务前没有必要充分理解程序的步骤","当失去视觉接触或身体接触而注意力不集中时，应再次进行自检","在不影响执行任务情况下，打电话或与另一人交谈执行任务时打电话或与另一人交谈","为提高效率，一次执行两个以上的操作"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"自检过程中若失去视觉接触或身体接触（被打断），恢复执行时必须重新执行自检。"},{"id":"safety_zb_0017","module":"safety","bank":"保护区安全准入","type":"single","stem":"三哩岛和切尔诺贝利事故的一条重要教训，就是（ ）特别重要，为了减少人的差错，要重视（ ）。","options":["核电站管理/业务技能","人因问题/培育安全文化","人员管理/培训技术骨干","运行维修管理/安全文化"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"三哩岛和切尔诺贝利事故的重要教训是人因问题特别重要，要重视培育安全文化。"},{"id":"safety_zb_0018","module":"safety","bank":"保护区安全准入","type":"single","stem":"工作人员在使用质疑的态度工具时应该避免出现的情况。（ ）","options":["忽视其他人的担心和质疑","对关键的参数不在意","相信技术资料来源是可靠的","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"忽视他人质疑、对关键参数不在意、盲目相信资料来源都应避免，故选\"其它选项都是\"。"},{"id":"safety_zb_0019","module":"safety","bank":"保护区安全准入","type":"single","stem":"监护是指在一起工作的两个独立的人的一系列行为，以下关于监护工具描述正确的是（ ）。","options":["在同样的时间和地点","在一个具体操作之前和过程中","为了预防执行过程中的失误","其它选项全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"监护是在同样时间地点、由独立人员对操作前后全过程进行观察确认、预防执行失误的行为，各项描述都对，故选\"其它选项全是\"。"},{"id":"safety_zb_0020","module":"safety","bank":"保护区安全准入","type":"single","stem":"'工作负荷重'、'时间压力大'这属于人因失误四要素中的哪个要素？（ ）","options":["失误先兆","不完善的屏障","潜在的组织缺陷","触发事件行为"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"工作负荷重、时间压力大\"属于人因失误四要素中的失误先兆（诱发失误的环境条件）。"},{"id":"safety_zb_0021","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用自检工具时，下列哪项是需要避免出现的情况（ ）。","options":["在执行自检时交谈","识别或知晓任务中的关键步骤或关键参数","在找到正确设备后开始操作","在失去身体接触后重新使用自检"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"执行自检时应避免一边自检一边交谈（注意力分散），其余做法均正确。"},{"id":"safety_zb_0022","module":"safety","bank":"保护区安全准入","type":"single","stem":"为什么使用三向交流工具。（ ）","options":["为给所有工作相关人员发表意见的机会","为在一次交流中传递多项指示","为保证信息接收方收到的信息和发送方的意图是一致的"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"使用三向交流是为保证信息接收方收到的信息与发送方意图一致，防止误解。"},{"id":"safety_zb_0023","module":"safety","bank":"保护区安全准入","type":"single","stem":"中国大陆的第一座核电站是（ ）。","options":["秦山核电站","大亚湾核电站","石岛湾核电站","海阳核电站"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"秦山核电站是我国大陆第一座核电站（1991年并网发电）。"},{"id":"safety_zb_0024","module":"safety","bank":"保护区安全准入","type":"single","stem":"错误的人工物料搬运动作可能导致的伤害不包括（ ）。","options":["手指被卡在手推车和其他物体之间","听力损伤","肩部肌肉受损","物品倾翻伤人"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误搬运可导致卡伤、肩部肌肉受损、物品倾翻伤人等，但不会造成听力损伤。"},{"id":"safety_zb_0025","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于运行处的职责？（ ）","options":["操作设备","批准设备检修工单","批准大多数核电厂的操作","反应堆功率控制"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"批准设备检修工单是维修或计划部门的职责，不属于运行处职责。"},{"id":"safety_zb_0026","module":"safety","bank":"保护区安全准入","type":"single","stem":"我国秦山第三核电厂建设两台（ ）核电机组。","options":["重水堆（PHWR）","沸水堆","高温气冷堆","快堆"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"秦山第三核电厂建设两台重水堆（CANDU PHWR）机组。"},{"id":"safety_zb_0027","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪种行为与'秉承质疑的态度'的核安全文化相悖？（）","options":["进行现场工作时，发现前一天设置的安全围栏被移动过，小张立即致电主管咨询有无异常情况；","大修期间，小李中班巡检至常规岛厂房汽轮机平台时，发现射线探伤标识牌，但交接班时并未得到通知有探伤工作，于是暂停巡检，致电主控室询问；","小王在执行现场操作单时，发现单子上有两个步骤上的编号手动涂改过，决定询问主管后再实施；","小张进行设备送电前的外观检查工作时，发现设备周围搭设有脚手架，但觉得不影响送电，于是没有报告主控室；"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"质疑的态度要求对异常状态保持疑问；进行设备送电前的外表检查等不经质疑直接操作的行为与之相悖。"},{"id":"safety_zb_0028","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪种行为与'核安全人人有责'的核安全文化相悖？（ ）","options":["设备检修后一项再鉴定指标偏差微乎其微，但工作负责人就是不签字认可；","发现工作现场的安全隐患，及时汇报处理；","安排好的培训临时有事去不了，找人代签到；","小张发现有人在电气厂房抽烟，马上进行了制止并向主管进行汇报。"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"核安全人人有责：安排好的培训因事不去参加（放弃学习责任）与该原则相悖。"},{"id":"safety_zb_0029","module":"safety","bank":"保护区安全准入","type":"single","stem":"听到应急广播后应采取的行动不包括（ ）。","options":["将正在运行的设备或和正在进行的工作置于安全状态","根据电厂程序护送所有的访问者到安全位置","赶快打电话通知家人","如果你在辐射控制区，除被特别告知的情况，都要按正常情况时的流程步骤离开"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"听到应急广播后应按指令行动，不应打电话通知家人（占用应急资源、延误撤离）。"},{"id":"safety_zb_0030","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于保卫处的职责？（ ）","options":["控制重要区域的人员进入","分发通行证","负责基本安全培训","负责厂区交通管理"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"基本安全培训由培训部门负责，不属于保卫处职责。"},{"id":"safety_zb_0031","module":"safety","bank":"保护区安全准入","type":"single","stem":"当有两个或两个以上人员进行人工搬运物料时，以下说法错误的是（ ）。","options":["尽量使用不同侧的肩膀搬运材料","注意周围的人员及物料动态","应协商指定专人负责指挥和协调物料搬运活动","搬运人员应前后一个接一个行走"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"多人搬运时应尽量使用同侧肩膀、统一口令行动（而不是不同侧），\"使用不同侧肩膀\"说法错误。"},{"id":"safety_zb_0032","module":"safety","bank":"保护区安全准入","type":"single","stem":"你休息时间正在和家人一起吃饭，并喝了一瓶葡萄酒，这时接到了来自主管的电话，要求你现在到现场来处理一下主给水泵电机端渗油问题，你的回答应该是：（ ）","options":["好的，我就过来","我过几个小时就能到","我刚喝了一瓶葡萄酒，所以我不能前往现场工作","我现在开车过来"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"饮酒后不得进入现场执行工作，应如实告知主管喝了酒，由主管另行安排人员。"},{"id":"safety_zb_0033","module":"safety","bank":"保护区安全准入","type":"single","stem":"小李是正在进行岗位培训的实习现场操作员，在经过汽轮机厂房时发现地面上有水，于是询问他的主管这是否正常。请问小李正确演示了哪项核安全基本原则？（ ）","options":["秉持质疑的态度","践行学习型组织","领导做安全的表率","建立组织内部的高度信任"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"实习生发现异常主动询问\"这是否正常\"，体现了秉持质疑的态度。"},{"id":"safety_zb_0034","module":"safety","bank":"保护区安全准入","type":"single","stem":"下面哪项材料是不属于系统或设备组成部分的'异物'？（）","options":["固定设备用的地脚螺栓","联轴器连接螺丝","破碎的清洁布","电机接线盒"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"地脚螺栓、联轴器螺丝、电机接线盒属于设备组成部件；破碎的清洁布是外来异物。"},{"id":"safety_zb_0035","module":"safety","bank":"保护区安全准入","type":"single","stem":"疲劳对人体的影响不包括：（ ）","options":["精神亢奋","失眠、入睡困难","感官系统异常，眼睛干涩、视物模糊","耳鸣、耳聋等"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"疲劳导致困倦、失眠、感官异常等，不会导致精神亢奋。"},{"id":"safety_zb_0036","module":"safety","bank":"保护区安全准入","type":"single","stem":"岗位工作适任性的影响因素不包括：（ ）。","options":["身体健康","心理健康","酒精、药物、食物","工资收入"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"岗位适任性受身体健康、心理健康、酒精药物等因素影响，与工资收入无关。"},{"id":"safety_zb_0037","module":"safety","bank":"保护区安全准入","type":"single","stem":"操作机械或高处作业等人员工作期间不宜使用的药物不包括:（ ）。","options":["可引起嗜睡的药物","可出现眩晕或幻觉的药物","可使视物模糊或辨色困难的药物","复合维生素"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"复合维生素不影响作业安全；嗜睡、眩晕幻觉、视物模糊类药物工作期间不宜使用。"},{"id":"safety_zb_0038","module":"safety","bank":"保护区安全准入","type":"single","stem":"作为主管，你工作组的某位成员近期频繁请假早退，你应如何回应该人员：（ ）","options":["当然可以。按照请假流程审批即可","尝试想了解具体的情况，但觉得侵犯了别人的隐私","询问是否需要员工心理援助项目（EAP）提供帮助","不闻不问"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"作为主管应关心员工状态，尝试了解情况并提供员工心理援助等支持。"},{"id":"safety_zb_0039","module":"safety","bank":"保护区安全准入","type":"single","stem":"直接推动汽轮发电机组发电的是（ ）。","options":["蒸汽","高温高压的水","压缩空气","原子能"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"直接推动汽轮发电机组旋转发电的是蒸汽（蒸汽热能→机械能→电能）。"},{"id":"safety_zb_0040","module":"safety","bank":"保护区安全准入","type":"single","stem":"搬运物料时，应保持（ ）的自然挺直，利用腿部肌肉发力抬起物体。","options":["手臂","腰部","脖子","小腿"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"搬运物料应保持腰部自然挺直，屈膝利用腿部肌肉发力，防止腰部损伤。"},{"id":"safety_zb_0041","module":"safety","bank":"保护区安全准入","type":"single","stem":"下列哪个物项可以作为防异物装置（ ）。","options":["橡胶手套","厚纸板","透明塑料布","设备人孔盖版"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"设备人孔盖板属于设备本体，可作为防异物装置（ ,"type":"single","stem":"面对火灾，以下哪项逃生方法是错误的（ ）？","options":["选择逃生通道自救","结绳下滑自救","向外界求救","乘坐电梯逃生"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"火灾时严禁乘坐电梯逃生（断电被困危险）。"},{"id":"safety_zb_0064","module":"safety","bank":"保护区安全准入","type":"single","stem":"A类火灾是指（ ）。","options":["固体火灾","气体火灾","液体火灾"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"A类火灾指固体物质火灾；B类液体/可熔化固体、C类气体、E类电气。"},{"id":"safety_zb_0065","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假措施描述不正确的是：（ ）。","options":["制定质量计划责任人员及焊接、无损检验等关键工艺责任人员签字备案制度，必要时对签字真实性进行抽验是防造假的重点措施之一；","防控造假必须完善质量奖惩机制，制定举报人保护和奖励制度；","对于恶意违规、弄虚作假的员工要采用通报批评、经济处罚、下岗或解除劳动合同等方式进行惩处；","强化合同管控要求，震慑不良承包商和防控弄虚作假无关。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"防控造假必须完善质量奖惩……\"项与防造假措施表述不符（防造假靠制度监督与诚信文化，不是奖励导向），题库标注该项不正确。"},{"id":"safety_zb_0066","module":"safety","bank":"保护区安全准入","type":"single","stem":"影响质量的因素可概括为人、机、料、法、环、测六个方面，其中（ ）是最活跃的因素，也是最关键的因素之一。","options":["法；","机；","料；","人。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"人机料法环测六要素中，人是最活跃、最关键的因素。"},{"id":"safety_zb_0067","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于采购不符合项的处理方案（ ）。","options":["修理；","返工；","不作改进的接收（照用）；","第三方检验。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"采购不符合项处理方案有修理、返工、照用（不作改进的接收）等；第三方检验不是处理方案。"},{"id":"safety_zb_0068","module":"safety","bank":"保护区安全准入","type":"single","stem":"HAF003中质量保证的定义是：（ ）。","options":["担保质量；","为使物项或服务与规定的质量要求相符合并提供足够的置信度所必需的一系列有计划的系统化的活动；","全部检查、检验、审查活动；","质保部门使用的法规。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"HAF003质量保证定义：为使物项或服务与规定的质量要求相符合并提供足够的置信度而进行的一系列有计划的系统化活动。"},{"id":"safety_zb_0069","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假相关的知识描述不正确的是：（ ）。","options":["必须完善供方黑名单体系，并及时向本单位纪检部门通报；","在结果没有问题的情况下，文件代签问题不算弄虚作假；","必须加强弄虚作假防控宣贯和培训；","必须保留现场原始记录，原始记录保留期限要求需纳入合同条款中。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"在结果没有问题的情况下可以补录记录\"是错误说法——原始记录必须真实、及时，严禁事后补造。"},{"id":"safety_zb_0070","module":"safety","bank":"保护区安全准入","type":"single","stem":"请选出具有‘凡事有章可循’原则与特征的一项（ ）。","options":["领导表率作用；","程序/规程的要求必须清晰明确，具有可操作性；","建立组织的质量验证体系；","记录应妥善贮存、保管。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"\"凡事有章可循\"体现为程序/规程的要求必须清晰、齐全、可用，工作按程序执行。"},{"id":"safety_zb_0071","module":"safety","bank":"保护区安全准入","type":"single","stem":"质量是：'客体的一组（ ）满足要求的程度'。","options":["特性；","固有特性；","赋予特性；","魅力特性。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"质量定义：客体的一组固有特性满足要求的程度。"},{"id":"safety_zb_0072","module":"safety","bank":"保护区安全准入","type":"single","stem":"有关不符合项，下列哪种说法是正确的：（ ）。","options":["不符合项控制有防止误用、误装不符合物项的作用；","不符合项控制是为了执行奖惩制度，追究活动从事者的责任；","导致物项或过程的质量不能确定的缺陷，不属于不符合项；","以上说法都不对。"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"不符合项控制的目的包括防止误用/误装不合格物项，对不符合项进行标识、隔离和处理。"},{"id":"safety_zb_0073","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对于熟悉的任务，工作人员可凭记忆执行完后再一并在执行步骤前打勾。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。执行规程必须逐步确认打勾，禁止凭记忆执行完再补勾（自欺式打勾是典型人因失误）。"},{"id":"safety_zb_0074","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用自检工具时，如果由于其他事情中断执行且手不再接触或指向设备，当恢复执行时应重新使用自检工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。自检被中断且失去接触后，恢复执行必须重新进行自检（STAR）。"},{"id":"safety_zb_0075","module":"safety","bank":"保护区安全准入","type":"judge","stem":"质疑的态度可以增强对不确定性及危险的认识，最大限度地减少失误的可能。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。质疑的态度增强对不确定性和危险的认识，最大限度减少失误。"},{"id":"safety_zb_0076","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当独自一人执行任务的时候，使用自检工具时只需在心中默读出设备的标识即可。（ ）","o
