"safety","bank":"防人因","type":"single","stem":"工前会指在执行一项任务/工作前，所有相关工作人员之间进行的（    ） 的准备会。","options":["面对面","电话交流","视频会议","各自筹备"],"answer":["A"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》定义：工前会指在执行一项工作或任务前，相关工作人员之间进行的面对面的准备会；召开形式的原则也要求面对面讨论，故答案为A。"},{"id":"qihang_dyk_0001","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"中核集团秉持的企业核心价值观是（　）。","options":["责任、安全、创新、卓越","诚信、责任、创新、共赢","事业、责任、严细、进取","科技赋能、产业造福"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第5页中核集团简介部分明确指出，中核集团\"以'科技赋能、产业造福'为企业使命，秉持'责任、安全、创新、卓越'的企业核心价值观\"。故本题选A（责任、安全、创新、卓越）。\"科技赋能、产业造福\"是企业的使命而非价值观，其余选项均为干扰项。\n\n【知识点】\n· 中核集团企业核心价值观：责任、安全、创新、卓越。\n· 中核集团企业使命：科技赋能、产业造福。\n· 中核集团积极践行\"两弹一星\"精神和\"四个一切\"核工业精神。\n· 中核集团是中央直接管理的特大型国有重要骨干企业，是国家核科技工业主体，资产规模超1.7万亿元。"},{"id":"qihang_dyk_0002","module":"qihang","bank":"启航-入职第一课","type":"multi","stem":"“四个一切”核工业精神包括（　）。","options":["事业高于一切","责任重于一切","严细融入一切","效率高于一切"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第17页企业精神部分指出，中国核电人大力弘扬的\"四个一切\"核工业精神为\"事业高于一切、责任重于一切、严细融入一切、进取成就一切\"，第18-19页并逐条作了阐述。选项中\"效率高于一切\"不属于\"四个一切\"，正确第四句为\"进取成就一切\"。故本题选ABC。\n\n【知识点】\n· 事业高于一切——一切为了国家、为了核科技事业，体现\"以身许国\"\"做隐姓埋名人、干惊天动地事\"的朴实抱负。\n· 责任重于一切——视\"责任\"为泰山，对国家、对人民富有高度责任感，要努力跻身世界先进水平。\n· 严细融入一切——把严格细致融入一切活动、每个环节，大力倡导\"严、细、实、快\"的工作作风。\n· 进取成就一切——积极探索、奋发向上、孜孜以求、永不言休的精神状态，要在关键领域\"卡脖子\"的地方下功夫。"},{"id":"qihang_dyk_0004","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"中国核电是中国最大的核电运营商之一，也是首家A股上市的纯核电公司。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第11页明确写道\"中国核电是中国最大的核电运营商之一，是首家A股上市的纯核电公司\"。题干表述与课件原文完全一致，故本题判断为正确。\n\n【知识点】\n· 中国核电是中国最大的核电运营商之一，是首家A股上市的纯核电公司。\n· 中国核电控股股东为中国核工业集团有限公司。\n· 中国核电注册资本205.68亿元，总部设于北京。\n· 截至2026年3月1日，公司核电控股在运机组27台，装机容量2621.20万千瓦。"},{"id":"qihang_dyk_0008","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"1970年我国确定的中国发展核电站的方针是（　）。","options":["积极有序、稳妥推进","自主设计、自主建造、自主运营","安全、适用，经济、自力更生","安全第一、质量第一"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第22页\"高位起步-中央领导关注（1970年-1985年）\"部分明确指出\"1970年，中国成立核电站建设领导小组，大力推动核电厂建设，并确定'中国发展核电站的方针是：安全、适用，经济、自力更生'\"。故本题选C（安全、适用，经济、自力更生）。\n\n【知识点】\n· 1970年中国成立核电站建设领导小组，确定发展核电站方针\"安全、适用，经济、自力更生\"。\n· 自此核电研究建设全面启动，中核人筚路蓝缕、风雨兼程，开始谱写民族核电建设的奋斗史。\n· 1970-1985年为核电发展\"高位起步-中央领导关注\"阶段。\n· 1979年美国三哩岛核事故发生，助推了中国核安全文化和核监管建设。"},{"id":"qihang_dyk_0009","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"日本福岛核事故后，中国全面放缓核电建设，暂停所有内陆核电开发项目。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第26页\"再次放慢-福岛核事故影响\"部分明确指出\"福岛核事故后，中国全面放缓核电建设；对运行和在建核电站进行严格审查；暂停所有内陆核电开发项目\"。题干表述与课件原文一致，故本题判断为正确。\n\n【知识点】\n· 2011年3月11日日本东北太平洋地区发生里氏9.0级地震并引发海啸，福岛第一核电厂放射性物质泄漏。\n· 福岛核事故被定为核事故最高分级7级，与切尔诺贝利核事故同级。\n· 福岛核事故后中国国务院做出四项决定：全面安全检查、加强运行核设施安全管理、全面审查在建核电站、严格审批新上核电项目。\n· 福岛核事故后中国全面放缓核电建设，暂停所有内陆核电开发项目。"},{"id":"qihang_dyk_0010","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"2015年我国核工业创建60周年之际，习近平总书记作出重要批示：“发展是第一要务，人才是（　），创新是第一动力”。","options":["第一要务","第一动力","第一责任","第一资源"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第9页领导关怀部分载明，2015年我国核工业创建60周年之际，习近平总书记作出重要批示：\"发展是第一要务，人才是第一资源，创新是第一动力\"。故本题选D（第一资源）。\"第一要务\"对应\"发展\"、\"第一动力\"对应\"创新\"，均为批示中原有的搭配。\n\n【知识点】\n· 2015年是我国核工业创建60周年。\n· 习近平总书记批示：发展是第一要务，人才是第一资源，创新是第一动力。\n· 60年来几代核工业人艰苦创业、开拓创新，推动我国核工业从无到有、从小到大。\n· 核工业是高科技战略产业，是国家安全重要基石，要坚持安全发展、创新发展，坚持和平利用核能。"},{"id":"qihang_dyk_0011","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"按照我国电力碳达峰、碳中和路径研究，2035年核电发电量在电力结构中的占比目标为（　）。","options":["5%","10%","15%","20%"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第30页\"中国核电行业前景\"部分指出\"核电发电量在电力结构中的占比：10%（2035年）；20%（2060年）\"，来源为舒印彪等《我国电力碳达峰、碳中和路径研究》。故本题选B（10%）。\n\n【知识点】\n· 按我国电力碳达峰、碳中和路径研究，2035年核电发电量在电力结构中占比目标为10%。\n· 2060年核电发电量在电力结构中占比目标为20%。\n· 中国核电建造趋势：预计每年核准6-8台机组（核能发展蓝皮书）。\n· 数据来源：舒印彪，张丽英，张运洲等，我国电力碳达峰、碳中和路径研究[J].中国工程科学,2021,23(6)。"},{"id":"qihang_dyk_0012","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"中国核电的控股股东是中国广核集团有限公司。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第11页中国核能电力股份有限公司部分明确写道，中国核电\"控股股东为中国核工业集团有限公司\"。题干称控股股东为\"中国广核集团有限公司\"，与课件原文矛盾，故本题判断为错误。\n\n【知识点】\n· 中国核电的控股股东是中国核工业集团有限公司（中核集团）。\n· 中国核电是中国最大的核电运营商之一，是首家A股上市的纯核电公司。\n· 中国核电注册资本205.68亿元，总部设于北京。\n· 2015年6月10日中国核电在上海证券交易所挂牌上市，股票代码601985。"},{"id":"qihang_flhg_0003","module":"qihang","bank":"启航-法律合规","type":"single","stem":"美国《反海外腐败法》（FCPA）的主要条款是（　）。","options":["反贿赂条款和会计条款","反垄断条款和反倾销条款","出口管制条款和制裁条款","反洗钱条款和数据合规条款"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第22页明确指出\"FCPA颁布于1977年，经过1988、1994、1998年三次修改，其主要条款为'反贿赂条款'和'会计条款'\"。故选A。课件还分别解释了反贿赂条款（禁止向外国官员行贿以取得或维持业务）和会计条款（保持记录、内部控制）的具体内容，而反垄断、出口管制、反洗钱等均为课件列出的其他合规领域，不属于FCPA条款。\n\n【知识点】\n· FCPA主要条款为\"反贿赂条款\"和\"会计条款\"。\n· 反贿赂条款：禁止个人和企业直接或间接向外国官员、政府雇员、外国政党或政治候选人等支付任何有价物品，既禁止直接贿赂也禁止通过第三方贿赂。\n· 会计条款：一是保持记录，制作并保留合理详细、精确的账簿记录；二是内部控制，设计并维持内部财务控制制度。\n· FCPA经过1988、1994、1998年三次修改。"},{"id":"qihang_flhg_0005","module":"qihang","bank":"启航-法律合规","type":"single","stem":"SDN名单（特别指定国民和被禁实体名单）的发布机构是（　）。","options":["美国司法部","美国商务部","美国财政部外国资产管制办公室（OFAC）","美国证券交易委员会"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第30页明确指出\"SDN清单（List of Specially Designated Nationals and Blocked Persons，即特别指定国民和被禁实体名单），是由OFAC（Office of Foreign Assets Control of the U.S. Department of Treasury，即美国财政部下属的外国资产管理办公室）发布并不定期更新\"。故发布机构为美国财政部外国资产管制办公室（OFAC），选C。美国司法部、商务部、证券交易委员会在课件中分别出现在FCPA执法、出口管制（中兴案）等场景，不负责发布SDN名单。\n\n【知识点】\n· SDN名单全称：特别指定国民和被禁实体名单，由美国财政部下属的OFAC发布并不定期更新。\n· 名单所含组织和个人均为受制裁目标，\"美国主体\"不得与其开展任何交易，并应冻结其在美财产。\n· 非美国人（如中国个人和实体）与SDN进行重大交易，可能受限于美国的二级制裁。\n· 若企业违反美国经济制裁法律法规，可能被列入经济制裁领域黑名单（例如SDN清单）。"},{"id":"qihang_flhg_0006","module":"qihang","bank":"启航-法律合规","type":"single","stem":"关于二级制裁（Secondary Sanctions），下列说法正确的是（　）。","options":["主要针对美国主体与受制裁对象开展的特定行为","主要针对非美国主体在美国境外从事的违反美国制裁规定的行为","只针对外国政府机关的官方行为","只适用于联合国安理会决议列明的主体"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第28页明确区分两种制裁：\"一级制裁（Primary Sanctions）主要针对美国主体与受制裁的特定国家、组织或个人开展特定行为\"；\"二级制裁（Secondary Sanctions）主要针对非美国主体在美国境外从事的非美国许可行为。如非美国主体在美国境外从事的行为违反美国制裁的规定，美国政府可对该等非美国主体实施二级制裁，包括将其列入《SDN名单》\"。故B正确。A描述的是\"一级制裁\"；C、D的表述课件中均无依据。\n\n【知识点】\n· 二级制裁主要针对非美国主体在美国境外从事的违反美国制裁规定的行为。\n· 一级制裁主要针对美国主体与受制裁的特定国家、组织或个人开展特定行为。\n· 对非美国主体实施二级制裁的措施之一是将其实施二级制裁的主体列入SDN名单，以禁止美国主体与其交易。\n· 制裁方式包括贸易制裁、金融制裁、待遇制裁；按适用范围分为一级制裁和二级制裁。"},{"id":"qihang_flhg_0008","module":"qihang","bank":"启航-法律合规","type":"single","stem":"2010年英国出台《反贿赂法》，其新增的罪名是（　）。","options":["未有防止商业贿赂罪","跨境洗钱罪","商业间谍罪","内幕交易罪"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第21页在介绍反腐败与反商业贿赂的制度发展时指出\"2010年英国出台《反贿赂法》，新增未有防止商业贿赂罪，对未有防止商业贿赂的企业加以处罚。但企业可以通过采取诸如建立有效的合规管理体系等措施来抗辩，减免责任\"。故新增罪名为\"未有防止商业贿赂罪\"，选A。洗钱罪、商业间谍罪、内幕交易罪在课件中均无对应表述。\n\n【知识点】\n· 2010年英国《反贿赂法》新增\"未有防止商业贿赂罪\"，对未防止商业贿赂的企业加以处罚。\n· 企业可通过建立有效的合规管理体系等措施进行抗辩，减免责任。\n· 2004年修订后的美国《针对机构实体的联邦量刑指南》（FSGO）明确了企业建立有效合规体系可以减轻处罚的原则。\n· 2016年法国通过《萨宾第二法案》，明确要求企业建立合规制度。"},{"id":"qihang_flhg_0009","module":"qihang","bank":"启航-法律合规","type":"single","stem":"《中华人民共和国反外国制裁法》由（　）颁布实施。","options":["国务院","商务部","全国人大常委会","国家发展改革委"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第34页明确指出\"2021年06月10日，全国人大常委会颁布实施《中华人民共和国反外国制裁法》\"。故该法由全国人大常委会颁布实施，选C。国务院、商务部、国家发展改革委虽在反制机制中承担职能（如国务院有关部门决定列入反制清单），但颁布法律的主体是全国人大常委会。\n\n【知识点】\n· 《中华人民共和国反外国制裁法》于2021年6月10日由全国人大常委会颁布实施。\n· 该法针对外国国家以各种借口或依据其本国法律对我国进行遏制打压、对我国公民和组织采取歧视性限制措施、干涉我国内政的情形。\n· 国务院有关部门可以决定将直接或间接参与制定、决定、实施歧视性限制措施的个人、组织列入反制清单。\n· 案例：2021年7月中方依据《反外国制裁法》对7个美方人员和实体实施制裁。"},{"id":"qihang_flhg_0011","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"下列属于美国实施全面制裁的国家/地区有（　）。","options":["伊朗","朝鲜","古巴","俄罗斯"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第29页\"现行美国制裁国家/地区列表\"中明确标注\"朝鲜（全面制裁）\"\"古巴（全面制裁）\"\"叙利亚（全面制裁）\"\"克里米亚地区（全面制裁）\"\"伊朗（全面制裁）\"；第33页应对措施部分再次明确：\"不得与……美国全面制裁国家和地区（即：伊朗、朝鲜、古巴、叙利亚以及乌克兰克里米亚地区）进行任何交易或向其提供任何服务\"。故伊朗、朝鲜、古巴属于全面制裁对象，选ABC。俄罗斯虽在美国制裁列表之中（第29页），但不属于\"全面制裁\"，故D不选。\n\n【知识点】\n· 美国实施全面制裁的国家/地区包括：伊朗、朝鲜、古巴、叙利亚以及乌克兰克里米亚地区。\n· 现行美国制裁的国家/地区共有20个，不同制裁计划项下措施有所不同。\n· 按被制裁主体属性，制裁分为全面制裁、行业或物品制裁、\"聪明\"制裁。\n· 中国企业应避免与SDN及美国全面制裁国家和地区进行任何交易或提供服务。"},{"id":"qihang_flhg_0012","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"课件列出的重点合规领域包括（　）。","options":["经济制裁","出口管制","反垄断与国家安全审查","劳动用工保护"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第20页以图表形式列出重点合规领域，依次为：\"经济制裁\"\"反腐败反商业贿赂\"\"出口管制\"\"反垄断与国家安全审查\"\"反不正当竞争、反倾销、反补贴\"。故经济制裁、出口管制、反垄断与国家安全审查均属于课件列出的重点合规领域，选ABC。\"劳动用工保护\"在课件中无对应表述，不属于所列重点领域，故D不选。\n\n【知识点】\n· 重点合规领域包括经济制裁、反腐败与反商业贿赂、出口管制、反垄断与国家安全审查、反不正当竞争/反倾销/反补贴。\n· 合规，就是个别国家（主要是美国）运用\"长臂管辖\"规则，运用经济制裁、出口管制、反垄断等法律制度强制外国企业遵守其法律制度。\n· 狭义的合规就是要\"遵守\"别国的\"规（法）\"。\n· 企业合规风险包括因违规行为引发法律责任、造成经济或声誉损失及其他负面影响的可能性。"},{"id":"qihang_flhg_0013","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"在中国核电合规管理组织体系中，各业务部门是第一道防线。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第37页\"合规管理组织体系\"图中明确将\"各业务部门\"标注为\"第一道防线\"，并同时列出\"法治工作第一责任人\"、第二道防线、第三道防线（纪检审计部）等主体。故题干说法正确，判\"正确\"。\n\n【知识点】\n· 在中国核电合规管理组织体系中，各业务部门是第一道防线。\n· 公司设立法律合规部，3名专职人员持证率100%。\n· 各部门配备合规管理员，明确综合部、经营部、人力部、商务部、党群部、纪审部合规管理职能。\n· 18家二级单位及重要三级单位已建立合规管理体系，实现全级次合规管理、横向协同、纵向到底。"},{"id":"qihang_flhg_0014","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"《阻断外国法律与措施不当域外适用办法》由全国人大常委会颁布。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第34页明确指出\"2021年1月9日，国务院颁布实施《阻断外国法律与措施不当域外适用办法》（商务部令2021年第1号）\"。该办法由国务院颁布实施（以商务部令形式对外发布），并非由全国人大常委会颁布。题干\"由全国人大常委会颁布\"错误，判\"错误\"。对比：同日课件记载，2021年6月10日《中华人民共和国反外国制裁法》才由全国人大常委会颁布实施。\n\n【知识点】\n· 《阻断外国法律与措施不当域外适用办法》（商务部令2021年第1号）2021年1月9日由国务院颁布实施。\n· 该办法针对外国法律与措施的不当域外适用情形，即\"二级制裁\"。\n· 当事人遵守禁令范围内的外国法律侵害中国公民、法人或其他组织合法权益的，可依法向人民法院起诉要求赔偿。\n· 《反外国制裁法》才是由全国人大常委会颁布实施的法律。"},{"id":"qihang_flhg_0016","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"长臂管辖遵循“最小接触”或称“最低联系”原则。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第18页明确指出\"长臂管辖遵循'最小接触'或称'最低联系'原则。《美国冲突法重述》列举了行使长臂管辖的十项标准\"。故题干说法正确，判\"正确\"。\n\n【知识点】\n· 长臂管辖是指在本国边境之外对非本国公民、企业、组织行使法律上的管辖权，本质上是法的域外效力，是司法上的概念。\n· 长臂管辖遵循\"最小接触\"或称\"最低联系\"原则。\n· 长臂管辖从司法领域扩展到行政执法领域：一是基于经济制裁、出口管制，经国会授权、由行政部门执行的行政管辖（如中兴事件）；二是基于商业行为由司法体系主导的司法管辖（如孟晚舟事件）。\n· 合规即个别国家运用长臂管辖规则强制外国企业遵守其法律制度。"},{"id":"qihang_gcxm_0002","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"1996-2007年我国核电建设采用大业主+技术引进模式，业主负责设备采购，直接管理施工单位，并负责系统调试工作。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第4页第二阶段（1996-2007年，大业主+技术引进阶段，核岛交钥匙）指出\"采用大业主的多合同模式进行管理：业主负责设备采购，直接管理施工单位，负责系统调试工作\"。题干表述与课件原文完全一致，故本题判\"正确\"。\n\n【知识点】\n· 第二阶段（1996-2007年）为大业主+技术引进阶段（核岛交钥匙），项目包括秦山二期、秦山三期、田湾一期。\n· 该模式业主负责设备采购，直接管理施工单位，负责系统调试工作。\n· 秦山二期、三期项目取得较好业绩，秦山二期扩建项目在安全质量受控下建设工期53.8个月。\n· 核电厂主要管理模式还包括交钥匙工程总承包（turn key）、业主负责制总承包、设计加采购（EP）、大业主自建模式。"},{"id":"qihang_gcxm_0004","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"后福岛时代至今，福清5-6号、田湾5-6号、漳州1-2号机组采用的工程建设管理模式是（　）。","options":["大业主自建模式","大业主+技术引进模式","业主负责制总承包模式","EPC总承包模式"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第6页第四阶段明确\"后福岛时代至今，业主负责制总承包阶段\"，项目为\"福清5-6号机组、田湾5-6号机组、漳州1-2号机组\"，与题干列举完全一致。故本题选C（业主负责制总承包模式）。\n\n【知识点】\n· 第四阶段（后福岛时代至今）采用业主负责制总承包管理模式，项目包括福清5-6号、田湾5-6号、漳州1-2号机组。\n· 业主负责规划和建立项目总的质量保证体系，并维护其质量保证体系的有效运作。\n· 业主督促总包、监理及其分包商建立项目质量保证体系，并监督各单位项目质量保证体系运行的有效性。\n· 该阶段各项目安全质量基本受控，按计划有序推进。"},{"id":"qihang_gcxm_0005","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"2002年5月第四代国际核能论坛（GIF）选定的第四代核电技术中，三种热中子堆不包括（　）。","options":["钠冷快堆","超临界水冷堆","高温气冷堆","熔盐堆"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第7页明确指出\"2002年5月，第四代国际核能论坛（GIF）在巴黎举行研讨会，选定第四代核电技术6种设计概念，包括三种快中子堆和三种热中子堆\"，其中\"三种快中子堆是：钠冷快堆、铅冷快堆和气冷快堆；三种热中子堆是：超临界水冷堆、高温气冷堆和熔盐堆\"。钠冷快堆属于快中子堆而非热中子堆，故本题选A。\n\n【知识点】\n· 三种快中子堆：钠冷快堆、铅冷快堆和气冷快堆。\n· 三种热中子堆：超临界水冷堆、高温气冷堆和熔盐堆。\n· 第四代核反应堆按冷却剂/慢化剂分为6种设计概念，2002年5月由GIF选定。\n· 国内主攻方向：钠冷快堆（原子能院）、高温气冷堆（清华大学）、熔盐堆（中科院）、超临界水冷堆（核动力院）。"},{"id":"qihang_gcxm_0006","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"秦山三期核电机组采用的堆型是（　）。","options":["压水堆","加拿大坎杜（CANDU）压力管式重水堆","沸水堆","高温气冷堆"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第10页\"中国常见的反应堆堆型\"部分明确标注\"秦山三期采用的是加拿大坎杜（CANDU）压力管式重水堆\"。故本题选B。压水堆用轻水作冷却剂和慢化剂，沸水堆仅一个回路，高温气冷堆用氦气作冷却剂、石墨作慢化剂，均与秦山三期不符。\n\n【知识点】\n· 秦山三期采用的是加拿大坎杜（CANDU）压力管式重水堆。\n· 重水堆以重水（氘和氧组成的化合物）作慢化剂。\n· 压水堆用轻水作冷却剂和慢化剂，水在反应堆内保持液态，世界占比62%。\n· 高温气冷堆用氦气作冷却剂、石墨作慢化剂，堆芯出口温度较高。"},{"id":"qihang_gcxm_0007","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"除秦山三期外，我国大陆地区目前运行的核电机组全部为压水堆。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第9页明确指出\"除秦山三期外，我国大陆地区目前运行的核电机组全部为压水堆\"。题干表述与课件原文一致，故本题判\"正确\"。\n\n【知识点】\n· 除秦山三期外，我国大陆地区目前运行的核电机组全部为压水堆。\n· 我国台湾地区为2个沸水堆核电站及1个压水堆核电站。\n· 压水堆用轻水作冷却剂和慢化剂，且水在反应堆内保持液态，世界占比62%。\n· 沸水堆利用轻水作慢化剂和冷却剂，只有一个回路，水在反应堆内沸腾产生蒸汽直接进入汽轮机发电。"},{"id":"qihang_gcxm_0008","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"压水堆核电站一回路的运行压力约为（　）。","options":["15.5MPa","17.0MPa","17.5MPa","330MPa"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第11页\"压水堆核电站工作原理\"明确标注一回路\"运行压力15.5Mpa，平均温度307-310摄氏度\"，\"设计压力17.0-17.5Mpa，设计温度330-350摄氏度\"。故本题选A（15.5MPa）。17.0MPa和17.5MPa是一回路设计压力的上下限，330MPa数量级与压力无关（330摄氏度为一回路设计温度），均为干扰项。\n\n【知识点】\n· 压水堆一回路运行压力15.5MPa。\n· 一回路设计压力17.0-17.5MPa，设计温度330-350摄氏度。\n· 一回路运行平均温度307-310摄氏度。\n· 一回路主要设备包括压力容器、稳压器、主泵、主管道、蒸汽发生器。"},{"id":"qihang_gcxm_0009","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电站与火电站的差异主要在于常规岛部分。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第11页\"核能发电工作原理\"明确指出\"核电站与火电站的差异主要在于核岛部分\"，同时\"常规岛的差异主要是汽轮发电机组的制造\"。题干称差异主要在于常规岛部分，与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 核电站与火电站的差异主要在于核岛部分。\n· 常规岛的差异主要是汽轮发电机组的制造。\n· 原子核裂变释放的核能转换成热能，热能加热水产生蒸汽，利用蒸汽推动汽轮发电机组发电。\n· 核反应堆相当于火电站的锅炉。"},{"id":"qihang_gcxm_0010","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"压水堆核电站的安全屏障中，第二道屏障是（　）。","options":["燃料芯块","燃料包壳","压力容器和密闭的一回路系统","反应堆安全壳"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第14页\"核电站的安全屏障\"部分列出压水堆核电站四道屏障：\"第一道屏障：燃料芯块\"、\"第二道屏障：燃料包壳\"、\"第三道屏障：压力容器和密闭的一回路系统\"、\"第四道屏障：反应堆安全壳\"。故第二道屏障是燃料包壳，本题选B。\n\n【知识点】\n· 第二道屏障：燃料包壳，燃料芯块密封在锆合金的包壳中构成核燃料棒。\n· 第一道屏障：燃料芯块，耐高温、耐腐蚀的二氧化铀陶瓷芯块。\n· 第三道屏障：压力容器和密闭的一回路系统，压力容器厚度>0.2米、直径>6米、质量>350吨。\n· 第四道屏障：反应堆安全壳，钢筋混凝土构筑、内表面设置钢衬里，抗御商用大飞机撞击。"},{"id":"qihang_gcxm_0011","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"华龙一号的三大设计特征包括（　）。","options":["177堆芯","单堆布置","双层安全壳","三环路布置"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第17页\"三大设计特征\"明确列出\"177堆芯、单堆布置、双层安全壳\"三项。故本题选ABC。\"三环路布置\"虽为华龙一号核蒸汽供应系统的设计基础（课件指出其\"基于成熟的三环路设计\"），但不属于三大设计特征，且华龙一号核岛采用单堆布置，D项错误。\n\n【知识点】\n· 华龙一号三大设计特征：177堆芯、单堆布置、双层安全壳。\n· 三大能动+非能动系统：二次侧非能动余热导出系统、安全壳热量排出系统、堆腔注水冷却系统。\n· 三大能力提高：抗震能力、抗商用大飞机撞击能力、事故应急能力。\n· 三大设计特征满足最先进的核安全法规和标准，达到三代核电技术的先进水平。"},{"id":"qihang_gcxm_0012","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"华龙一号双层安全壳延长的设计寿期为（　）。","options":["40年","50年","60年","80年"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第20页\"先进性四：双层安全壳\"明确列出\"延长的设计寿期：60年\"。故本题选C（60年）。40年、50年为常见核电站设计寿期干扰项，80年超出课件所列数值。\n\n【知识点】\n· 华龙一号双层安全壳延长设计寿期至60年。\n· 双层安全壳内壳为带钢衬里的预应力混凝土结构，外壳为钢筋混凝土结构。\n· 双层安全壳环形空间为负压，收集和过滤泄漏。\n· 双层安全壳可承受外部事件：大型商用飞机撞击、飓风、飞射物、爆炸等，自由容积大于80,000立方米。"},{"id":"qihang_gcxm_0013","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"华龙一号采用177个燃料组件，提高了功率，同时降低线功率密度，确保足够的堆芯热工裕量。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第18页\"先进性二：177堆芯和CF3先进自主燃料组件\"指出\"采用177个燃料组件，提高了功率（>120万千瓦），同时降低线功率密度，确保足够的堆芯热工裕量\"。题干表述与课件原文一致，故本题判\"正确\"。\n\n【知识点】\n· 采用177个燃料组件，提高功率至120万千瓦以上。\n· 降低线功率密度，确保足够的堆芯热工裕量。\n· 自主研发的CF3燃料组件，满足18个月长循环。\n· 包壳材料采用N36先进锆合金材料，具有良好的力学性能，满足0.3g抗震要求。"},{"id":"qihang_gcxm_0015","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"在核电工程建设过程中，核岛浇灌第一罐混凝土（FCD）标志（　）。","options":["项目核准完成","土建阶段开始","安装阶段开始","调试阶段开始"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第58页\"项目实施阶段\"明确\"核岛浇灌第一罐混凝土（FCD）标志土建开始\"，同时\"穹顶吊装完成标志土建结束\"。故FCD标志着土建阶段开始，本题选B。项目核准完成在FCD之前（开工管理阶段），安装、调试阶段的开始分别以穹顶吊装完成和冷试开始为标志。\n\n【知识点】\n· 核岛浇灌第一罐混凝土（FCD）标志土建阶段开始。\n· 穹顶吊装完成标志土建阶段结束，同时标志安装阶段开始。\n· 土建阶段包括反应堆厂房实体施工、核岛其他厂房实体施工、常规岛厂房实体施工及BOP子项实体施工。\n· 2015年5月7日福清5号机组核岛浇筑第一罐混凝土。"},{"id":"qihang_gcxm_0016","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"反应堆厂房穹顶吊装完成，标志核电站安装阶段结束。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第59页\"安装阶段\"明确\"穹顶吊装完成标志安装开始\"、\"冷试开始标志安装结束\"。题干称穹顶吊装完成标志安装阶段结束，与课件矛盾——穹顶吊装完成是安装阶段的开始标志，安装阶段结束的标志是冷试开始，故本题判\"错误\"。\n\n【知识点】\n· 穹顶吊装完成标志安装阶段开始。\n· 冷试开始标志安装阶段结束。\n· 安装阶段包括核岛主设备安装（压力容器、蒸发器、主泵、主管道、堆内构件等）、常规岛及BOP安装工作及各类专业安装。\n· 穹顶吊装完成同时标志土建阶段结束。"},{"id":"qihang_gcxm_0017","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"核电工程的“四大控制”是指（　）。","options":["安全、质量、进度、投资","安全、质量、环保、保密","质量、进度、投资、环保","安全、进度、环保、廉洁"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第46页\"六大控制七个零：高质量精细化管理\"明确指出\"如果说核电工程的'四大控制'，则指安全、质量、进度和投资\"。故本题选A。\"环保、保密\"属于\"六大控制\"（安全、质量、进度、投资、环保、保密）的组成，不属于\"四大控制\"。\n\n【知识点】\n· 核电工程\"四大控制\"指安全、质量、进度和投资。\n· \"六大控制七个零\"：安全（安全零事故）、质量（质量零事件）、进度（进度零超期）、投资（投资零超概）、环保（环保零超标）、保密（保密零泄密），以及廉洁零问题。\n· 六大控制七个零是高质量精细化管理要求。\n· 核安全事件、安全生产事故、火灾事故、环境事件、质量事故等目标值均为0，为否决项。"},{"id":"qihang_gcxm_0018","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"根据中国工程院《中国能源中长期（2030、2050）发展战略研究咨询项目报告》，2030年我国核电装机目标为2亿千瓦。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第101页\"我国核电中长期发展展望\"引用中国工程院《中国能源中长期（2030、2050）发展战略研究咨询项目报告》，明确给出\"2020年，核电装机7000万千瓦；2030年，核电装机2亿千瓦；2050年，核电装机4亿千瓦\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 2030年我国核电装机目标为2亿千瓦。\n· 2050年我国核电装机目标为4亿千瓦。\n· 2020年核电装机7000万千瓦。\n· 全球核电装机占电力装机5%左右，发电量占比10.1%；中国核电装机占电力装机2.27%，发电量占比5.1%，未来可期。"},{"id":"qihang_gjhz_0011","module":"qihang","bank":"启航-国际合作","type":"multi","stem":"中国核电派遣优秀员工赴（　）等国际组织工作。","options":["IAEA","WANO","EPRI","国际货币基金组织"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件明确\"派遣优秀员工赴国际组织: IAEA 6 名, WANO 31 名, 集团海外代表处9名, EPRI 2 名\"。故选派优秀员工赴IAEA、WANO、EPRI等国际组织工作，选ABC。国际货币基金组织不属于课件所列国际组织，不选。\n\n【知识点】\n· 中国核电派遣优秀员工赴IAEA、WANO、EPRI等国际组织工作。\n· 赴IAEA 6名，其中IAEA正式职员5人、免费专家1人。\n· 赴WANO 31名、赴EPRI 2名，集团海外代表处9名。\n· 通过人员派驻培养国际化人才队伍，提升国际经营能力与品牌影响力。"},{"id":"qihang_hdczs_0001","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"核安全三要素是指（　）。","options":["反应性控制、余热导出、放射性包容","中子控制、压力控制、温度控制","临界控制、功率控制、剂量控制","散热、屏蔽、密封"],"answer":["A"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第8页明确列出“核安全三要素”为“反应性控制、余热导出、放射性包容”，第60页核电从业者基本态度部分再次重申“核安全三要素：反应性控制、余热导出、放射性包容”。故本题选A。选项B（中子控制、压力控制、温度控制）和C（临界控制、功率控制、剂量控制）均非课件表述；选项D（散热、屏蔽、密封）为通俗化说法，不符合核安全三要素的专业定义。\n\n【知识点】\n· 核安全三要素为：反应性控制、余热导出、放射性包容。\n· 反应性控制确保反应堆处于可控临界状态，防止超临界事故。\n· 余热导出确保停堆后堆芯衰变热能有效排出，防止堆芯熔毁。\n· 放射性包容通过多道屏障（燃料包壳、一回路压力边界、安全壳）防止放射性物质外泄。"},{"id":"qihang_hdczs_0002","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"反应堆停堆3小时后，剩余功率约为额定功率的（　）。","options":["10%","5%","1%","0.1%"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第8页“核安全三要素”部分明确给出剩余功率数据：“停堆3h，1% 额定功率；停堆4周，0.1% 额定功率”。反应堆停堆后由于裂变产物的衰变仍会持续释放热量，称为剩余功率（余热），停堆3小时后约为额定功率的1%。故本题选C。\n\n【知识点】\n· 反应堆停堆后剩余功率随时间衰减：停堆3h约1%额定功率，停堆4周约0.1%额定功率。\n· 剩余功率来源于裂变产物的放射性衰变和缓发中子引起的裂变。\n· 余热导出是核安全三要素之一，停堆后必须持续冷却堆芯。\n· 即使停堆很长时间，仍需维持余热排出系统的运行以确保安全。"},{"id":"qihang_hdczs_0003","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"压水堆核电厂的链式裂变反应是由快中子维持的。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第11页章节内容回顾明确指出“压水堆核电厂，链式裂变反应是由热中子维持的”。压水堆中的慢化剂（轻水）将裂变产生的快中子慢化为热中子，再由热中子维持链式裂变反应。题干说“由快中子维持”与课件原文矛盾，故本题判“错误”。\n\n【知识点】\n· 压水堆核电厂的链式裂变反应由热中子维持，而非快中子。\n· 热中子是经过慢化剂慢化后的低能中子，更容易被铀-235吸收引起裂变。\n· 快中子堆（快堆）才是由快中子维持链式裂变反应的堆型。\n· 压水堆中的轻水同时充当冷却剂和慢化剂。"},{"id":"qihang_hdczs_0004","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"正常情况下，压水堆核电站只在一回路中存在放射性。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第11页章节内容回顾明确指出“正常情况下，压水堆核电站只在一回路中存在放射性”。压水堆核电站通过蒸汽发生器将一回路（带放射性）与二回路（不带放射性）隔离，只有在燃料包壳破损或蒸汽发生器泄漏等异常情况下二回路才可能受到放射性污染。故本题判“正确”。\n\n【知识点】\n· 正常情况下，压水堆核电站只在一回路中存在放射性。\n· 一回路冷却剂流经堆芯带有放射性，二回路蒸汽不接触堆芯故无放射性。\n· 蒸汽发生器的U型管是隔离一、二回路放射性的重要屏障。\n· 若燃料包壳破损或蒸汽发生器泄漏，二回路可能受到放射性污染。"},{"id":"qihang_hdczs_0005","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"典型的压水堆核电站每台机组共有（　）个回路。","options":["1","2","3","4"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第28页章节内容回顾明确指出“典型的压水堆核电站每台机组有三个回路”，并分别描述了各回路功能：一回路将堆芯热能传给蒸汽发生器，二回路将蒸汽热能转化为电能，三回路用海水或淡水冷却乏蒸汽。故本题选C（3个）。\n\n【知识点】\n· 典型的压水堆核电站每台机组有三个回路。\n· 一回路：冷却剂在堆芯吸收热量，经蒸汽发生器U型管传热后由主泵送回堆芯，密闭循环。\n· 二回路：给水在蒸汽发生器中受热变为蒸汽，推动汽轮机发电，乏汽在冷凝器中凝结回水。\n· 三回路：使用海水或淡水在冷凝器中冷却做功后的乏蒸汽。"},{"id":"qihang_hdczs_0006","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"人类历史上第一个反应堆“芝加哥一号”（CP-1）建成并实现首次运行的时间是（　）。","options":["1945年8月","1951年12月","1954年6月","1942年12月"],"answer":["D"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第31页明确记载“芝加哥一号（Chicago Pile1,CP-1）：1942年12月费米领导的团队在芝加哥大学建成。12月2日，首次运行成功，开启了人类原子能时代，芝加哥大学成为人类‘原子能诞生地’”。故本题选D（1942年12月）。\n\n【知识点】\n· 人类历史上第一个反应堆“芝加哥一号”（CP-1）于1942年12月建成并首次运行成功。\n· CP-1由费米领导的团队在芝加哥大学建成，标志着人类原子能时代的开启。\n· 芝加哥大学因此被称为人类“原子能诞生地”。\n· CP-1的建成验证了可控核裂变链式反应的可行性。"},{"id":"qihang_hdczs_0007","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"我国台山核电站采用的核电堆型是（　）。","options":["美国AP1000","法国EPR","俄罗斯VVER1000","加拿大CANDU6"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第33页“核电家族族谱”中明确标注“EPR——台山核电（法国）”。课件同时列出其他堆型对应关系：AP1000对应三门核电（美国）、VVER1000对应田湾核电（俄罗斯）、CANDU 6对应秦山三期（加拿大）。故本题选B（法国EPR）。\n\n【知识点】\n· 台山核电站采用法国EPR堆型。\n· 三门核电采用美国AP1000堆型。\n· 田湾核电采用俄罗斯VVER1000堆型。\n· 秦山三期采用加拿大CANDU 6重水堆型。"},{"id":"qihang_hdczs_0008","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"快中子堆（快堆）最大的特点是（　）。","options":["发电效率高","核燃料增殖","常压运行","不需要冷却剂"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第42页章节内容回顾明确指出“快堆最大的特点是核燃料增殖”。快中子堆使用快中子维持链式裂变反应，不需要慢化剂，其冷却剂为液态金属钠（课件第39页标注“一回路（钠）、二回路（钠）、三回路（水）”）。快堆在消耗裂变材料的同时可增殖新的易裂变材料（如钚-239），提高核燃料利用率。故本题选B（核燃料增殖）。\n\n【知识点】\n· 快堆最大的特点是核燃料增殖，即消耗裂变材料的同时产生更多新的易裂变材料。\n· 快堆由快中子维持链式裂变反应，不需要慢化剂。\n· 快堆冷却剂为液态金属钠，采用三条回路（钠-钠-水）设计。\n· 我国快堆发展包括CEFR（北京房山实验快堆）和CFR600（霞浦示范快堆）。"},{"id":"qihang_hdczs_0009","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"沸水堆核电站正常功率运行时，其二回路介质不带有放射性。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第42页章节内容回顾明确指出“沸水堆二回路介质带有放射性”。沸水堆与压水堆不同，其堆芯产生的蒸汽直接进入汽轮机做功，由于蒸汽接触堆芯燃料，不可避免地携带放射性物质进入二回路。题干说“其二回路介质不带有放射性”与课件原文矛盾，故本题判“错误”。\n\n【知识点】\n· 沸水堆二回路介质带有放射性，这是沸水堆与压水堆的重要区别之一。\n· 压水堆正常情况下只在一回路中存在放射性，二回路不带放射性。\n· 沸水堆中堆芯产生的蒸汽直接驱动汽轮机，蒸汽携带放射性进入二回路。\n· 沸水堆核电站的汽轮机及二回路系统需要考虑放射性防护。"},{"id":"qihang_hdczs_0010","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"高温气冷堆采用（　）作为冷却剂。","options":["轻水","重水","氦气","液态金属钠"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第32页在高温气冷堆（第3.5节）部分标注冷却剂为“氦气”。课件第42页章节内容回顾还指出“高温气冷堆核电站发电效率比压水堆核电站高”。高温气冷堆采用氦气作冷却剂，石墨作慢化剂，出口温度高，因此发电效率高于压水堆。故本题选C（氦气）。\n\n【知识点】\n· 高温气冷堆采用氦气作为冷却剂。\n· 高温气冷堆核电站发电效率比压水堆核电站高。\n· 我国高温气冷堆发展包括HTR-10（清华大学实验气冷堆）和HTR-PM（石岛湾示范气冷堆）。\n· 氦气化学性质稳定、中子吸收截面小，适合作为高温气冷堆的冷却剂。"},{"id":"qihang_hdczs_0011","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"熔盐堆的核燃料溶解在高温熔盐中形成流动的液态燃料，其工作温度约为（　）。","options":["300-400℃","500-600℃","700-800℃","900-1000℃"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第40页熔盐堆部分明确指出“核燃料（如铀-235、钚-239或钍-232）直接溶解在高温熔盐（如氟化锂、氟化铍等）中，形成流动的液态燃料”，并给出熔盐特性“常压下液态（工作温度约700–800℃），高热容、高沸点，天然具备被动安全性”。故本题选C（700-800℃）。\n\n【知识点】\n· 熔盐堆的核燃料溶解在高温熔盐中形成流动的液态燃料，工作温度约700–800℃。\n· 熔盐堆常压下运行，无高压爆炸风险，天然具备被动安全性。\n· 熔盐遇高温膨胀导致裂变反应减速（负温度系数），事故时熔盐会凝固堵塞管道被动冷却。\n· 熔盐堆可增殖钍-232或利用核废料，燃料利用率高。"},{"id":"qihang_hdczs_0012","module":"qihang","bank":"启航-核电厂概述","type":"multi","stem":"中核集团863基本动作中，全体员工“六个做到”包括（　）。","options":["做到“讲安全”","做到“守规矩”","做到“重协作”","做到“勤汇报”"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第61-62页“863基本动作要领”详细列出全体员工“六个做到”：一、做到“讲安全”；二、做到“守规矩”；三、做到“重协作”；四、做到“戒自满”；五、做到“善沟通”；六、做到“多思考”。“勤汇报”不在六个做到之列。故本题选ABC（讲安全、守规矩、重协作），D（勤汇报）不属于“六个做到”。\n\n【知识点】\n· 全体员工“六个做到”为：讲安全、守规矩、重协作、戒自满、善沟通、多思考。\n· “做到讲安全”要求每个人正确理解和认识自己支持安全的责任和权限。\n· “做到守规矩”要求遵守标准、制度、程序及工作文件，践行安全第一原则。\n· “做到重协作”要求个人、班组、部门及团队之间确保内部和跨组织的沟通与合作。\n· 中核集团863基本动作包括员工6个做到和组织3大法宝。"},{"id":"qihang_hdczs_0013","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"中核集团863基本动作中，组织“三大法宝”是指（　）。","options":["培训、监督、考核","认识核安全的重要性、问题识别与解决、持续改进","识别、评价、解决","严守设计裕量、设备可靠、高质量程序"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第63-65页详细列出组织“三大法宝”：一、认识核安全的重要性（认识核技术的复杂性和特殊敏感性，严守设计裕量，确保设备可靠性，构建和谐公众关系等）；二、问题识别与解决（识别、评价、解决、趋势分析）；三、持续改进（避免组织自满、经验反馈、开展评估、对标、培训、监督检查）。故本题选B（认识核安全的重要性、问题识别与解决、持续改进）。\n\n【知识点】\n· 组织“三大法宝”为：认识核安全的重要性、问题识别与解决、持续改进。\n· “认识核安全的重要性”包括严守设计裕量、确保设备可靠性、构建和谐公众关系等。\n· “问题识别与解决”包括识别、评价、解决和趋势分析四个环节。\n· “持续改进”包括避免组织自满、经验反馈、开展评估、对标、培训和监督检查。"},{"id":"qihang_hdczs_0014","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"福岛核事故中，1、2、3号机组堆芯融化，1、3、4号机组发生氢爆。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第57页福岛核事故部分明确记载“1、2、3号机组堆芯融化，1、3、4号机氢爆”。2011年3月11日日本东北外海9级地震引发巨大海啸，导致应急柴油发电机因水淹失效、全厂断电，热阱丧失后造成堆芯融化及氢气爆炸。题干表述与课件原文一致，故本题判“正确”。\n\n【知识点】\n· 福岛核事故中1、2、3号机组堆芯融化，1、3、4号机组发生氢爆。\n· 福岛核事故的直接原因是9级地震引发的海啸导致全厂断电（SBO）。\n· 全厂断电后余热无法导出，堆芯冷却不足导致燃料熔毁。\n· 福岛第一核电厂位于日本福岛县双叶郡，共有6台BWR机组。"},{"id":"qihang_hdczs_0015","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"2014年3月习近平总书记在第三届核安全峰会上提出要坚持的核安全观是（　）。","options":["理性、协调、并进","安全第一、预防为主","法治、忧患、自律","合作、共赢、共享"],"answer":["A"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第59页明确记载“加强核安全是一个持续过程。我们要坚持理性、协调、并进的核安全观，把核安全进程纳入健康持续发展轨道”——2014年3月第三届核安全峰会上的讲话。课件同时提出“法治意识、忧患意识、自律意识、协作意识是核安全文化的核心”。故本题选A（理性、协调、并进）。\n\n【知识点】\n· 核安全观为“理性、协调、并进”，于2014年3月第三届核安全峰会上提出。\n· 核安全文化的核心是法治意识、忧患意识、自律意识、协作意识。\n· 核安全文化核心要贯穿到每位从业人员的思想和行动中。\n· 加强核安全是一个持续过程，需将核安全进程纳入健康持续发展轨道。"},{"id":"qihang_hdczs_0016","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"核电机组大约90%的时间是在100%功率运行。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第49页“正常功率运行”部分明确指出“核电机组大约90%时间是在100%功率运行”，并说明运行日常工作包括监盘、巡检（报缺）、试验（设备切换）、水质控制、调硼等，控制系统均在自动控制状态，每一年半换料大修一次约30天。故本题判“正确”。\n\n【知识点】\n· 核电机组大约90%的时间在100%功率运行，这是核电站经济性的重要保障。\n· 功率运行期间控制系统均在自动控制状态。\n· 运行日常工作包括监盘、巡检（报缺）、试验（设备切换）、水质控制、调硼等。\n· 核电机组每一年半换料大修一次，约30天（装、卸料时间各需约3天）。"},{"id":"qihang_qywh_0001","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的企业使命是（　）。","options":["强核强国、造福人类","国际核科技发展的引领者","追求卓越、超越自我","争做最具魅力的国际一流核能企业"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：核心理念部分明确\"中国核电的企业使命是：强核强国造福人类\"，并释义\"企业使命是企业存在的根本目的，是企业肩负的最大责任，是企业前进的最强驱动力\"；同时指出中国核电核心理念与中核集团核心理念（企业愿景、企业使命、企业精神、企业核心价值观）始终保持一致。故企业使命为\"强核强国、造福人类\"，选A。\n\n【知识点】\n· 企业使命：强核强国、造福人类。\n· 企业使命是企业存在的根本目的、肩负的最大责任和前进的最强驱动力。\n· 中国核电核心理念与中核集团公司核心理念（愿景、使命、精神、核心价值观）保持一致。\n· \"争做最具魅力的国际一流核能企业\"属于奋斗目标，而非企业使命。"},{"id":"qihang_qywh_0002","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的企业愿景是（　）。","options":["成为具有全球竞争力的世界一流清洁能源服务商","国际核科技发展的引领者","强核强国、造福人类","魅力核电、美丽中国"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：核心理念部分明确\"中国核电的企业愿景为：国际核科技发展的引领者\"，并释义\"企业愿景是企业对未来发展的美好憧憬，是企业长期追求的理想\"，中国核电致力于成为全球核电/核能安全运行引领者。故企业愿景为\"国际核科技发展的引领者\"，选B。\n\n【知识点】\n· 企业愿景：国际核科技发展的引领者。\n· 企业愿景是企业对未来发展的美好憧憬，是企业长期追求的理想。\n· 中国核电致力于成为全球核电/核能安全运行引领者，树立核电安全运行的业绩标杆。\n· \"成为具有全球竞争力的世界一流清洁能源服务商\"是课件未来展望部分的管理目标，不是企业愿景。"},{"id":"qihang_qywh_0003","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的核心价值观是（　）。","options":["创新、协调、绿色、开放、共享","事业高于一切、责任重于一切、严细融入一切、进取成就一切","责任、安全、创新、协同","富强、民主、文明、和谐"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：核心理念部分指出\"企业核心价值观是企业和员工共同坚守的基本价值取向和价值判断标准，是企业价值理念体系的核心\"，中国核电的核心价值观即\"责任、安全、创新、协同\"。故选C。\n\n【知识点】\n· 核心价值观：责任、安全、创新、协同。\n· 责任是中国核电成就事业的基石，是中国核电人对国家、民族和事业的庄重承诺。\n· 安全是核工业的生命线，是核工业生存和发展的根基；创新是中国核电实现卓越的不竭动力。\n· 协同是强核强国的内在要求，要求把公司利益置于一切局部利益之上。"},{"id":"qihang_qywh_0006","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的公司品牌传播语是（　）。","options":["魅力核电、美丽中国","中国核电、国家名片","追求卓越、超越自我","可靠、可亲、低碳、赋能"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：企业宣传口号及符号部分明确公司品牌传播语为\"中国核电、国家名片\"，释义指出华龙一号被誉为\"国家名片\"，中国核电人将\"持续擦亮'中国核电、国家名片'\"。故品牌传播语为\"中国核电、国家名片\"，选B。\n\n【知识点】\n· 公司品牌传播语：中国核电、国家名片。\n· 公司形象传播语：魅力核电、美丽中国。\n· 秦山核电站被誉为\"国之光荣\"；拥有完整知识产权的三代核电品牌华龙一号被誉为\"国家名片\"。"},{"id":"qihang_qywh_0007","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的经营理念是（　）。","options":["人才优先","质量创造价值、质量成就品牌","以客户为中心","尊重自然、绿色发展"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：基本理念部分明确\"中国核电的经营理念是：以客户为中心\"，并释义\"为客户服务是企业存在的根本理由\"，要把以客户为中心的理念贯穿于市场、研发、销售、制造、服务等全业务流程。故经营理念为\"以客户为中心\"，选C。\n\n【知识点】\n· 经营理念：以客户为中心。\n· 经营理念是企业追求绩效的根据。\n· 讲求信用，严格遵守商务约定，对客户有效履约。"},{"id":"qihang_qywh_0008","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的质量理念是（　）。","options":["上下同欲、凝心聚力","合规尽责、坚守底线","质量创造价值、质量成就品牌","充分准备、一丝不苟"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：基本理念部分明确\"中国核电的质量理念是：质量创造价值、质量成就品牌\"，并释义质量理念是\"支撑企业在市场竞争制胜的基石\"。故质量理念为\"质量创造价值、质量成就品牌\"，选C。\n\n【知识点】\n· 质量理念：质量创造价值、质量成就品牌。\n· 质量理念是企业提供产品和服务时秉持的根本观念，是市场竞争制胜的基石。\n· 始终遵循核安全质量相关的\"四个凡事\"准则，力图精益求精、持续改进，不放过任何缺陷和瑕疵。"},{"id":"qihang_qywh_0009","module":"qihang","bank":"启航-企业文化","type":"single","stem":"\"充分准备，一丝不苟，万无一失，一次成功\"这十六字要求是周恩来总理在（　）中提出的。","options":["我国第一颗原子弹研制试验","秦山核电站开工建设","华龙一号全球首堆建设","核潜艇动力装置陆上模式堆启堆试验"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：工作理念部分载明\"充分准备，一丝不苟，万无一失，一次成功\"是\"周恩来总理在核潜艇动力装置陆上模式堆启堆试验中提出的要求，是核潜艇研制、建造及使用中的警语\"；1970年夏核潜艇研制进入最后关头，周恩来总理在中央专委会汇报结束后强调这16个字。故应选\"核潜艇动力装置陆上模式堆启堆试验\"，选D。\n\n【知识点】\n· 十六字要求由周恩来总理在核潜艇动力装置陆上模式堆启堆试验中提出。\n· \"充分准备\"要求做好事前控制；\"一丝不苟\"要求做好事中控制。\n· \"万无一失\"要求做好风险控制；\"一次成功\"属于事后控制，突出成果导向。\n· 该要求现为中国核电工作理念：充分准备、一丝不苟、万无一失、一次成功。"},{"id":"qihang_qywh_0010","module":"qihang","bank":"启航-企业文化","type":"single","stem":"在卓越文化树模型中，象征\"树屹立不倒的根系\"、代表公司安身立命文化根基的是（　）。","options":["核工业文化","核安全文化","中国特色社会主义文化","子公司文化"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：卓越文化树部分载明\"核安全文化为根本，这是树屹立不倒的'根系'，象征公司安身立命的文化根基\"，并强调\"核安全是核工业的生命线，核安全文化是中国核电企业文化的灵魂和内核\"。故代表树屹立不倒根系的文化根基是核安全文化，选B。\n\n【知识点】\n· 卓越文化树：中国特色社会主义文化为基础（土壤）、核工业文化为源泉（养分）、核安全文化为根本（根系）。\n· 追求卓越为导向（主干）、子公司文化为特色（枝叶）、\"国际一流\"为目标（硕果）。\n· 核安全文化是中国核电企业文化的灵魂和内核，坚持核安全第一是生存与发展的必然要求。"},{"id":"qihang_qywh_0011","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的保密理念是（　）。","options":["合规尽责、坚守底线","\"核\"铸基石、\"密\"不可分","上下同欲、凝心聚力","追求高尚情操、严守纪律底线"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：基本理念部分（8）保密理念载明中国核电的保密理念为\"'核'铸基石、'密'不可分\"，释义指出\"核\"与\"和\"\"合\"谐音，突出核工业在国家安全中的特殊地位，\"密\"包括保密、紧密、严密、亲密四层含义。故保密理念为\"'核'铸基石、'密'不可分\"，选B。\n\n【知识点】\n· 保密理念：\"核\"铸基石、\"密\"不可分。\n· \"核\"与\"和\"谐音寓意维护世界和平、促进经济社会发展；与\"合\"谐音传承核工业人齐心合力的精神。\n· \"密\"不可分含四义：保密（保障力）、紧密（融合力）、严密（执行力）、亲密（凝聚力）。"},{"id":"qihang_qywh_0012","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的公司歌曲与集团公司司歌保持一致，最新版本是（　）。","options":["《祖国需要我》","《我和我的祖国》","《核能是个好东西》","《核电小苹果》"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：企业宣传口号及符号部分（6）公司歌曲载明\"与集团公司的司歌始终保持一致，最新版本为《祖国需要我》\"。故公司歌曲最新版本为《祖国需要我》，选A。\n\n【知识点】\n· 公司歌曲与集团公司司歌保持一致，最新版本为《祖国需要我》。\n· 公司旗帜颜色为核工业蓝，代表公司的科技和严谨。\n· 公司标志色彩为核工业蓝，代表科技智慧与安全稳健、清洁低碳与环境友好。"},{"id":"qihang_qywh_0013","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"安全是核工业的生命线，核安全文化是中国核电企业文化的灵魂和内核。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：卓越文化树部分载明\"核安全是核工业的生命线，核安全文化是中国核电企业文化的灵魂和内核，始终坚持核安全第一，是中国核电生存与发展的必然要求\"；基本理念中安全理念亦表述为\"安全是核工业的生命线\"。题干表述与课件一致，故判断正确。\n\n【知识点】\n· 核安全是核工业的生命线，是中国核电生存与发展的必然要求。\n· 核安全文化是中国核电企业文化的灵魂和内核。\n· 安全是企业的生存线，是员工的幸福线；中国核电人倡导主动安全、追求卓越。"},{"id":"qihang_qywh_0014","module":"qihang","bank":"启航-企业文化","type":"judge","stem":"\"四个创造\"是指创造企业价值、创造股东利润、创造员工幸福、创造社会财富。","options":null,"answer":["正确"],"score":null,"source":"genera rce":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：课件第17页\"主控持照人员\"部分指出\"本科毕业生从入职到取得RO执照需要约5年，取得SRO执照需要约8年，成长为值长需要约10年\"。故从入职到取得RO执照约需5年，本题选B。\n\n【知识点】\n· 本科毕业生从入职到取得RO执照约需5年。\n· 取得SRO执照约需8年，成长为值长约需10年。\n· 持照人员胜任力和岗位资格要求较高，需同时具有一般经验、岗位经验和相关经验，培养周期较长。\n· 各核电营运单位均建立了完善的持照人员培养体系。"},{"id":"qihang_rlzy_0004","module":"qihang","bank":"启航-人力资源","type":"single","stem":"系统化培训方法（SAT）是由（　）推荐的培训管理方法。","options":["国际原子能机构（IAEA）","世界核电运营者协会（WANO）","世界卫生组织（WHO）","国际标准化组织（ISO）"],"answer":["A"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：课件第28页\"系统化培训方法（SAT）\"部分指出\"为确保核电厂具有足够数量的、能力合格的和具有良好安全文化素养的工作人员，以保证核电厂的安全、可靠和经济运行，采用国际原子能机构（IAEA）推荐的系统化培训方法（SAT）对培训活动进行管理和控制\"。故SAT是由国际原子能机构（IAEA）推荐，本题选A。\n\n【知识点】\n· 系统化培训方法（SAT）由国际原子能机构（IAEA）推荐。\n· SAT对培训活动进行管理和控制，以保证核电厂安全、可靠和经济运行。\n· SAT包含分析、设计、开发、实施、评价五个环节。\n· 培训课程体系分为基础理论类、基础技能类、专业理论类、专业技能类、管理培训类。"},{"id":"qihang_rlzy_0010","module":"qihang","bank":"启航-人力资源","type":"single","stem":"下列岗位中，采用选任制方式选拔的是（　）。","options":["工会主席、团委书记/副书记","部门主任","副值长","科长/副科长"],"answer":["A"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：课件第23页\"干部选拔方式\"部分明确指出\"工会主席、团委书记/副书记采用选任制\"，故本题选A。组织推荐一般适用于跨部门交流提拔，民主推荐一般适用于本部门内部提拔，均属组织选拔；部门主任、科长/副科长等一般通过组织选拔方式产生，而非选任制。\n\n【知识点】\n· 干部选拔方式包括组织选拔、竞争性选拔、选任制。\n· 工会主席、团委书记/副书记采用选任制。\n· 组织推荐一般适用于跨部门交流提拔；民主推荐一般适用于本部门内部提拔。\n· 竞争性选拔是让优秀人才脱颖而出的方式之一，后续将加大竞聘的力度和范围。"},{"id":"qihang_rlzy_0012","module":"qihang","bank":"启航-人力资源","type":"multi","stem":"中国核电标准职位体系包括（　）。","options":["经营管理序列","业务职能序列","后勤服务序列","技能作业序列"],"answer":["A","B","D"],"score":null,"source":"generated","origin":"人力资源管理与员工职业生涯发展规划课件","explanation":"依据课件《人力资源管理与员工职业生涯发展规划》：课件第14页\"标准职位体系\"部分指出标准职位体系包括经营管理序列（M）、业务职能序列（F）、专业技术序列（T）、运行操作序列（O）、技能作业序列（S）五个序列。选项中经营管理序列、业务职能序列、技能作业序列均为标准职位体系内容，故选A、B、D；\"后勤服务序列\"不属于课件所述标准职位体系，故不选C。\n\n【知识点】\n· 标准职位体系包括经营管理、业务职能、专业技术、运行操作、技能作业五个序列。\n· 经营管理序列是组织或团队的领导者、组织者或责任人。\n· 业务职能序列承担规划计划、企业管理、人事、 ,"origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第31页\"2.2.2 两评报告\"明确写道\"环境影响报告书（选址阶段）、厂址安全分析报告合称'两评'报告，是核电项目前期许可证申领的最初环节\"。故本题选A。初步安全分析报告和质量保证大纲属建造阶段文件，厂址普选报告和初可研报告属项目建议书阶段文件。\n\n【知识点】\n· \"两评\"报告即环境影响报告书（选址阶段）和厂址安全分析报告的合称，是核电项目前期许可证申领的最初环节。\n· 上报\"两评\"报告后，国家核安全局批复的《核电厂场址选择审查意见书》是项目核准的支持性文件之一，也是可研报告收口的必要条件。\n· 建造许可证申请阶段需提交环境影响报告书（建造阶段）、初步安全分析报告（PSAR）、质量保证大纲（建造阶段）等文件。\n· 两评报告须按规定与核安全监管路径衔接，是核安全监管的重要环节。"},{"id":"qihang_sckf_0008","module":"qihang","bank":"启航-市场开发","type":"single","stem":"FCD是核电站前期工作的重要节点，它是指（　）。","options":["项目获得国务院核准","取得国家核安全局颁发的建造许可证","核岛基础混凝土浇注","首台机组并网发电"],"answer":["C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第35页写明\"核电厂建造阶段，国家核安全局颁发《核电厂建造许可证》后，许可证营运单位开始核岛基础混凝土浇注（即FCD）\"，第41页进一步明确\"FCD是核电站主体工程正式开工的标志点\"。故FCD指核岛基础混凝土浇注，本题选C。\n\n【知识点】\n· FCD即核岛基础混凝土浇注，是核电站主体工程正式开工的标志点。\n· 取得国家核安全局颁发的《核电厂建造许可证》后，营运单位方可开始FCD。\n· 工程前期准备工作包括征地搬迁、\"四通一平\"工程、主体工程设计、主要设备采购、核岛基坑负挖及底板垫层浇筑等。\n· 如何快速取得《核电厂建造许可证》是制约核电厂前期阶段工作的重要因素。"},{"id":"qihang_sckf_0010","module":"qihang","bank":"启航-市场开发","type":"multi","stem":"市场开发“四方责任”包括（　）。","options":["集团产合部—主管责任","成员单位—主体责任","依托单位—保障责任","地方政府—属地责任"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第7页\"市场开发'四方责任'\"明确为：\"集团产合部-主管责任、成员单位-主体责任、依托单位-保障责任、市场开发部-属地责任\"。故本题选A、B、C。选项D将\"属地责任\"主体误写为\"地方政府\"，课件原文中属地责任主体是\"市场开发部\"。\n\n【知识点】\n· 市场开发\"四方责任\"：集团产合部—主管责任，成员单位—主体责任，依托单位—保障责任，市场开发部—属地责任。\n· 属地责任主体为市场开发部而非地方政府。\n· 各方分工包括建体系、定标准、强服务、强产业、谋发展、做协同等抓手。\n· 市场部工作抓手包括市场信息收集-分析研判、公共关系维护-互访交流、督办事项落实-跟踪上报、区域发展规划-一体化开发、重点项目推动-紧盯共谋。"},{"id":"qihang_sckf_0012","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"原则上，项目核准前不得开展长周期主设备实质性制造工作。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第44页\"4.4 主设备采购\"明确写道\"原则上，项目核准前不得开展长周期主设备实质性制造工作\"。故本题判断为\"正确\"。\n\n【知识点】\n· 原则上，项目核准前不得开展长周期主设备实质性制造工作。\n· 项目获得\"路条\"后就应启动设备采购的策划和设备设计工作。\n· 主设备采购需对长周期主设备提前开展招标策划和潜在供方确定。\n· 设备材料费用 /* ================= 常量与工具 ================= */
const TYPE_NAME = {single:"单选", multi:"多选", judge:"判断", fill:"填空", qa:"问答"};
const SRC_NAME = {official:"真题", "ppt-notes":"课件题", generated:"生成题"};
const SRC_CLASS = {official:"s-official", "ppt-notes":"s-ppt-notes", generated:"s-generated"};
const DEFAULT_SCORE = {single:2, multi:3, judge:1};
const LETTERS = "ABCDEF";
const bankKey = m=>m;

const questions = DATA.questions;
const QMAP = {}; questions.forEach(q=>QMAP[q.id]=q);
const BANKS = {}; // key=module -> {module,bank(=模块名),list}
questions.forEach(q=>{
  const k = bankKey(q.module);
  (BANKS[k] = BANKS[k] || {module:q.module, bank:DATA.modules[q.module]||q.module, list:[]}).list.push(q);
});
for(const k in BANKS)BANKS[k].list.forEach((q,i)=>q._pos=i); // 题在题库内的全序位置，断点定位用

function $(s,p){return (p||document).querySelector(s);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function qScore(q){return q.score!=null ? q.score : (DEFAULT_SCORE[q.type]||1);}
function ansText(q){
  if(q.type==="judge") return q.answer[0];
  if(!q.options) return "";
  return q.answer.map(l=>l+"．"+q.options[LETTERS.indexOf(l)]).join("　");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600);}

/* ================= 持久化状态 ================= */
const SKEY = "tiku_v1";
let S;
function loadState(){
  try{S=JSON.parse(localStorage.getItem(SKEY)||"{}");}
  catch(e){S={};}
  S.done=S.done||{};   // qid -> {c:对次数, w:错次数, t:最后时间}
  S.wrong=S.wrong||{}; // qid -> 1
  S.fav=S.fav||{};     // qid -> 1
  S.slay=S.slay||{};   // qid -> 1（斩杀：非常熟，不进随机/顺序/专项练习池，可在收藏页恢复）
  S.seq=S.seq||{};     // bankKey -> 断点：下次该练的题目 id（旧版存数字下标，读取时自动迁移）
  S.daily=S.daily||{}; // "YYYY-MM-DD" -> 题数
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function bumpDaily(){const d=today();S.daily[d]=(S.daily[d]||0)+1;save();}

/* ================= 视图路由 ================= */
let stack = [];
function go(view, noPush){
  if(!noPush && curView) stack.push(curView);
  curView = view;
  render();
}
let curView = null;
function back(){
  if(stack.length){curView=stack.pop();render();}
  else go({name:"home"},true);
}

/* ================= 底部导航 ================= */
const TABS=[
  {name:"home",ic:"⌂",label:"首页"},
  {name:"fav",ic:"★",label:"收藏/错题"},
  {name:"stats",ic:"▤",label:"统计"},
  {name:"search",ic:"⌕",label:"搜题"},
];
function curTab(){return curView&&curView.name? (TABS.some(t=>t.name===curView.name)?curView.name:null):null;}
function renderNav(){
  const ct=curTab();
  $("#nav").innerHTML = TABS.map(t=>
    `<button class="tab ${ct===t.name?"on":""}" data-t="${t.name}"><span class="ic">${t.ic}</span>${t.label}</button>`).join("");
  $("#nav").style.display = ct?"flex":"none";
  document.body.classList.toggle("no-nav",!ct);
}

/* ================= 头部 ================= */
function renderHeader(title){
  const h=$("#hdr");
  const ct=curTab();
  if(ct&&!stack.length){h.style.display="none";return;}
  h.style.display="flex";
  $("#hdr-title").textContent=title||"";
  $("#btn-back").style.visibility = stack.length?"visible":"hidden";
}

/* ================= 首页 ================= */
function modProgress(module){
  let total=0,done=0;
  for(const k in BANKS){const b=BANKS[k];if(b.module!==module)continue;
    total+=b.list.length;
    b.list.forEach(q=>{if(S.done[q.id])done++;});}
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function vHome(){
  let h='<h2 class="pg">核电入职刷题</h2>';
  const icon={qihang:"⛵",basics:"⚛",safety:"🛡"};
  const desc={qihang:"企业文化 · 战略 · 合规",basics:"反应堆 · 系统 · 设备",safety:"工业安全 · 辐射防护 · 准入"};
  for(const mid of ["qihang","basics","safety"]){
    const p=modProgress(mid);
    h+=`<button class="mcard" data-mod="${mid}">
      <div class="mtop"><span class="mic">${icon[mid]}</span>
        <span class="mname">${esc(DATA.modules[mid]||mid)}</span>
        <span class="mgo">${p.done?p.pct+"% ›":"进入 ›"}</span></div>
      <div class="pbar"><div style="width:${p.pct}%"></div></div>
      <div class="mmeta"><span>${desc[mid]}</span><span>已练 ${p.done}/${p.total} 题</span></div>
    </button>`;
  }
  h+=`<div class="about">共 ${questions.length} 题 · 构建：${DATA.buildTime}<br>
     真题为官方题库；课件题出自 PPT 备注；生成题按课件内容 AI 出题（解析仅供参考）</div>`;
  return h;
}

      ${["single","multi","judge"].map(t=>`<button class="chip on" data-type="${t}">${TYPE_NAME[t]}（0）</button>`).join("")}
    </div>
  </div>
  <div class="card" id="exam-card" style="cursor:pointer;">
    <div class="row-between"><div><b style="font-size:16px;">📝 模拟考试</b>
    <div class="mut" style="margin-top:3px;">随机组卷 · 计时 · 按原分值评分</div></div><div class="bprog">›</div></div>
  </div>
  <div class="card" style="padding:10px 14px;"><div class="mut" id="resume-info"></div>
    ${slayCnt?`<div class="mut" style="margin-top:6px;">⚔️ 已斩杀 ${slayCnt} 题，随机/顺序/专项练习会跳过，可在收藏页恢复</div>`:""}
  </div>`;
  // 课程列表：按题库（课程）分组，点哪门刷哪门
  const order=[];
  b.list.forEach(q=>{if(!order.includes(q.bank))order.push(q.bank);});
  const allDone=b.list.filter(q=>S.done[q.id]).length;
  const allPct=b.list.length?Math.round(allDone/b.list.length*100):0;
  let rows=`<div class="brow" data-course="">
    <div class="binfo"><div class="bname">📖 全部 · 从头顺到尾</div>
    <div class="bcount">${b.list.length} 题 · 已练 ${allDone}（${allPct}%）</div>
    <div class="pbar" style="margin-top:6px;"><div style="width:${allPct}%"></div></div></div>
    <div class="bprog">›</div></div>`;
  order.forEach(name=>{
    const qs=b.list.filter(q=>q.bank===name);
    const done=qs.filter(q=>S.done[q.id]).length;
    const pct=qs.length?Math.round(done/qs.length*100):0;
    const hasOff=qs.some(q=>q.source==="official");
    const hasGen=qs.some(q=>q.source!=="official");
    const tag=hasOff&&hasGen?"真题+生成":hasOff?"真题":"生成题";
    const tagCls=hasOff?"s-official":"s-generated";
    rows+=`<div class="brow" data-course="${esc(name)}">
      <div class="binfo"><div class="bname">📚 ${esc(name)}</div>
      <div class="bcount">${qs.length} 题 · 已练 ${done}（${pct}%）　<span class="tag ${tagCls}" style="font-size:10px;">${tag}</span></div>
      <div class="pbar" style="margin-top:6px;"><div style="width:${pct}%"></div></div></div>
      <div class="bprog">›</div></div>`;
  });
  h+=`<div class="sec-title">顺序练习 · 按课程</div>
  <div class="card" style="padding:2px 14px;">${rows}</div>`;
  return h;
}

function buildPool(bankK, srcFilter, typeFilter, excludeSlay){
  const b=BANKS[bankK];let list=b.list;
  if(excludeSlay)list=list.filter(q=>!S.slay[q.id]); // 斩杀题不进练习池（模拟考试除外）
  if(srcFilter && srcFilter!=="all"){
    const allow=srcFilter.split("+");
    list=list.filter(q=>allow.includes(q.source));
  }
  if(typeFilter&&typeFilter.length)list=list.filter(q=>typeFilter.includes(q.type));
  return list;
}
function newSession(v){
  let list;
  if(v.mode==="wrong")list=Object.keys(S.wrong).filter(id=>QMAP[id]);
  else if(v.mode==="fav")list=Object.keys(S.fav).filter(id=>QMAP[id]);
  else{
    list=buildPool(v.bank,v.src,v.types,true);
    if(v.course)list=list.filter(q=>q.bank===v.course);
    if(v.mode==="rand")list=shuffle(list);
  }
  return {list:list.map(q=>q.id), idx:0, mode:v.mode, bank:v.bank, course:v.course||null,
    src:v.src||"all", types:v.types||null, picked:{}, judged:{},
    seqPos: v.mode==="seq" ? seqResumeIdx(list,bankKeyOf(v)) : 0};
}
function bankKeyOf(v){return v.course? v.bank+"::"+v.course : (v.bank||v.mode);}
/* 断点定位：S.seq[bankKey] 存"下次该练的题目 id"而非数字下标——斩杀/恢复会改变
   练习池成员，数字下标会错位（跳题或清零），按 id 定位则总能落回原位。
   返回该题在当前题单 list（保持题库全序的子序列）中的下标；
   若目标题本身已被斩杀/筛掉，则落在它原位置之后的第一题；旧版数字下标首次读取时迁移。 */
function seqResumeIdx(list,key){
  let v=S.seq[key];
  if(!v)return 0;
  const idOf=x=>typeof x==="string"?x:x.id;   // 兼容题目对象数组与 id 数组
  if(typeof v==="number"){            // 旧版数据：数字下标 → 按当前题单转成 id
    v = v>0&&v<list.length ? idOf(list[v]) : "";
    S.seq[key]=v;save();
    if(!v)return 0;
  }
  const t=QMAP[v];
  if(!t||t._pos==null)return 0;
  let n=0;
  for(const it of list){const q=typeof it==="string"?QMAP[it]:it;if(q&&q._pos<t._pos)n++;else break;}
  return n;
}
/* 课节：会话题单中连续同课程（bank）题目的分组，用于顺序模式的课程导航 */
function courseRanges(s){
  if(s._ranges)return s._ranges;
  const rs=[];
  s.list.forEach((id,i)=>{
    const b=QMAP[id].bank;
    const last=rs[rs.length-1];
    if(last&&last.bank===b)last.end=i+1;
    else rs.push({bank:b,start:i,end:i+1});
  });
  return s._ranges=rs;
}
function isFullSeq(s){return s.mode==="seq"&&!s.course&&s.src==="all"&&!s.types;}
function startSession(v){
  const s=newSession(v);
  if(!s.list.length){toast("该筛选条件下没有题目");return;}
  if(s.mode==="seq"&&s.seqPos>=s.list.length)s.seqPos=0;
  s.idx=s.seqPos||0;
  go({name:"practice",s});
}

function practiceHeader(s){
  const idx=s.idx+1,total=s.list.length;
  const answered=Object.keys(s.judged).length;
  const pct=total?Math.round(answered/total*100):0;
  const modeName=s.mode==="recite"?"背题模式":s.mode==="wrong"?"错题重练":s.mode==="fav"?"收藏练习":s.mode==="rand"?"随机练习":"顺序练习";
  let courseLine="";
  if(s.mode==="seq"&&s.idx<s.list.length){
    const q=QMAP[s.list[s.idx]];
    const rs=courseRanges(s);
    const ri=rs.findIndex(r=>s.idx>=r.start&&s.idx<r.end);
    if(ri>=0){
      const r=rs[ri];
      courseLine=`<div class="course-line"><span class="tag t-course">📚 ${esc(q.bank)}</span>
        <span class="mut">第 ${ri+1}/${rs.length} 门 · 本节 ${s.idx-r.start+1}/${r.end-r.start}${s.course?"":" · 总进度 "+idx+"/"+total}</span></div>`;
    }
  }
  return `<div class="pbar-wrap"><div class="ptxt"><span>${modeName} · ${answered>idx?answered:idx}/${total}</span><span>${pct}%</span></div>
  <div class="pbar"><div style="width:${pct}%"></div></div></div>${courseLine}`;
}

function renderQ(s,q){
  const judged = q.id in s.judged ? s.judged[q.id] : undefined;
  const picked = s.picked[q.id]||[];
  let h=`<div class="qhead">
    <span class="tag ${SRC_CLASS[q.source]}">${SRC_NAME[q.source]}</span>
    <span class="tag t-${q.type}">${TYPE_NAME[q.type]}</span>
    <span class="qno">📚 ${esc(q.bank)}</span></div>`;
  h+=`<div class="stem">${esc(q.stem)}</div>`;
  if(q.type==="judge"){
    const right=q.answer[0];
    const p1=picked.includes("正确"),p2=picked.includes("错误");
    let c1="",c2="";
    if(judged!==undefined){
      c1 = right==="正确"?"right":(p1?"wrongpick":"");
      c2 = right==="错误"?"right":(p2?"wrongpick":"");
    }
    h+=`<div class="judge-row">
      <button class="judge-btn ${c1}" data-j="正确">✓ 正确</button>
      <button class="judge-btn ${c2}" data-j="错误">✗ 错误</button></div>`;
  }else{
    h+=`<div class="opts">`+q.options.map((o,i)=>{
      const L=LETTERS[i];let cls="";
      if(judged!==undefined){
        if(q.answer.includes(L))cls="right";
        else if(picked.includes(L))cls="wrongpick";
        else cls="dim";
      }else if(picked.includes(L))cls="picked";
      return `<button class="opt ${cls}" data-o="${L}"><span class="ol">${L}</span><span>${esc(o)}</span></button>`;
    }).join("")+`</div>`;
    if(q.type==="multi"&&!judged)
      h+=`<div class="confirm-bar"><button class="big-btn ghost" id="confirm-multi" ${picked.length?"":"disabled"}>确认（已选 ${picked.length} 项）</button></div>`;
  }
  if(judged!==undefined||s.mode==="recite"){
    const ok = s.mode==="recite"?null:judged;
    if(ok!==null)
      h+=`<div class="feedback ${ok?"ok":"bad"}">${ok?"<b>回答正确</b>":"<b>回答错误</b>"}　正确答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    else
      h+=`<div class="feedback ok">答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    if(q.type!=="judge"&&q.options)h+=`<div class="mut" style="margin-top:6px;font-size:13.5px;">${esc(ansText(q))}</div>`;
    if(q.explanation){
      const elabel = q.source==="ppt-notes"
        ?'<span class="tag s-ppt-notes" style="font-size:10px;">官方讲解</span>'
        :q.source==="official"
          ?'<span class="tag s-official" style="font-size:10px;">解析 · 依据培训课件</span>'
          :'<span class="tag s-generated" style="font-size:10px;">AI 解析 · 仅供参考</span>';
      h+=`<div class="expl"><div class="elabel">📖 ${elabel}</div>${esc(q.explanation)}</div>`;
    }
    if(q.source!=="official")h+=`<div class="mut" style="margin-top:6px;font-size:12px;">依据课件：${esc(q.origin||"")}</div>`;
    // 斩杀（功能4）：答对且很熟 → 斩杀，不再进随机/顺序/专项练习池
    if(judged===true&&s.mode!=="recite"){
      const slayed=!!S.slay[q.id];
      h+=`<div style="margin-top:12px;">${
        slayed
          ?`<button class="big-btn ghost" id="btn-unslay">↩ 已斩杀 · 点击恢复（重新进入练习池）</button>`
          :`<button class="big-btn" id="btn-slay" style="background:var(--warn);">⚔️ 斩杀（很熟了，不再随机出现）</button>`
      }</div>`;
    }
  }
  return h;
}

function vPractice(v){
  const s=v.s;
  if(s.idx>=s.list.length){ // 完成
    const correct=Object.values(s.judged).filter(Boolean).length;
    const total=Object.keys(s.judged).length;
    const doneTitle=isFullSeq(s)?"全部顺序练习完成！":s.course?`《${esc(s.course)}》练完了！`:"本组完成！";
    let h=`<div class="card" style="text-align:center;padding:30px 16px;">
      <div style="font-size:44px;">🎉</div><h2 style="margin:10px 0 4px;">${doneTitle}</h2>
      <div class="mut">共 ${total} 题 · 正确 ${correct} 题${total?` · 正确率 ${Math.round(correct/total*100)}%`:""}</div>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button class="big-btn ghost" id="btn-again">再来一轮</button>
        <button class="big-btn" id="btn-back-home">返回</button></div></div>`;
    return h;
  }
  if(s.gate&&isFullSeq(s))return vGate(v);
  const q=QMAP[s.list[s.idx]];
  let h=practiceHeader(s);
  h+=`<div class="card" id="qcard">${renderQ(s,q)}</div>`;
  return h;
}

/* 课程过渡关卡：顺序模式下做完一门课的最后一题、进入下一门课前显示 */
function vGate(v){
  const s=v.s;
  const rs=courseRanges(s);
  const nextR=rs.find(r=>r.start===s.idx);
  const prevR=rs.find(r=>r.end===s.idx);
  let done=0,ok=0;
  if(prevR)for(let i=prevR.start;i<prevR.end;i++){
    const id=s.list[i];
    if(id in s.judged){done++;if(s.judged[id])ok++;}
  }
  let h=`<div class="card gate-card">
    <div class="gate-ic">📚</div>`;
  if(prevR){
    h+=`<div class="gate-done">《${esc(prevR.bank)}》已完成</div>
    <div class="mut">共 ${prevR.end-prevR.start} 题 · 本次作答 ${done} 题${done?` · 对 ${ok} 题（${Math.round(ok/done*100)}%）`:""}</div>`;
  }
  if(nextR){
    h+=`<div class="gate-next">下一门：《${esc(nextR.bank)}》</div>
    <div class="mut">${nextR.end-nextR.start} 题</div>
    <button class="big-btn" id="gate-go" style="margin-top:14px;">开始《${esc(nextR.bank)}》</button>`;
  }
  h+=`<div style="display:flex;gap:10px;margin-top:10px;">
      <button class="big-btn ghost" id="gate-sheet">跳转到课程</button>
      <button class="big-btn ghost" id="gate-back">返回课程列表</button></div></div>`;
  return h;
}

/* 下一题（手动按钮与答对自动切换共用） */
function practiceNext(s){
  if(s.idx<s.list.length-1){
    s.idx++;
    if(s.mode==="seq"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}
    if(isFullSeq(s)&&courseRanges(s).some(r=>r.start===s.idx)){
      s.gateSeen=s.gateSeen||{};
      if(!s.gateSeen[s.idx]){s.gate=true;s.gateSeen[s.idx]=1;}
    }
    render();
  }
  else{s.idx++;if(s.mode==="seq"){S.seq[bankKeyOf(s)]="";save();}render();}
}
function bindPractice(v){
  const s=v.s;
  if(s.gate&&isFullSeq(s)){
    $("#gate-go").onclick=()=>{s.gate=false;render();};
    $("#gate-sheet").onclick=()=>openSheet(s,null);
    $("#gate-back").onclick=()=>{stack=[];go({name:"modes",bank:s.bank},true);};
    return;
  }
  const q = s.idx<s.list.length ? QMAP[s.list[s.idx]] : null;
  if(!q){
    const again=$("#btn-again");
    if(again){
      again.onclick=()=>{const nv={...v,s:newSession({mode:s.mode,bank:s.bank,src:s.src,types:s.types,course:s.course})};if(s.mode==="seq")S.seq[bankKeyOf(s)]="",save();nv.s.idx=0;go(nv,true);};
      $("#btn-back-home").onclick=()=>{stack=[];go({name:"home"},true);};
    }
    return;
  }
  const qcard=$("#qcard");
  if(qcard)qcard.onclick=(e)=>{
    const jb=e.target.closest("[data-j]");
    const ob=e.target.closest("[data-o]");
    const cb=e.target.closest("#confirm-multi");
    const slayBtn=e.target.closest("#btn-slay");
    const unslayBtn=e.target.closest("#btn-unslay");
    if(slayBtn){clearTimeout(s._autoT);S.slay[q.id]=1;save();toast("已斩杀，不再随机出现");render();return;}
    if(unslayBtn){clearTimeout(s._autoT);delete S.slay[q.id];save();toast("已恢复，重新进入练习池");render();return;}
    if(s.mode==="recite")return;
    if(q.id in s.judged)return;
    if(q.type==="judge"&&jb){
      judge(q,[jb.dataset.j]);
    }else if(q.type==="single"&&ob){
      judge(q,[ob.dataset.o]);
      }else if(q.type==="multi"){
      if(ob){
        const p=(s.picked[q.id]=s.picked[q.id]||[]);
        const i=p.indexOf(ob.dataset.o);
        if(i>=0)p.splice(i,1);else p.push(ob.dataset.o);
        s.picked[q.id]=p.slice().sort();
        render();
      }else if(cb){
        if((s.picked[q.id]||[]).length)judge(q,s.picked[q.id].slice().sort());
      }
    }
  };
  function judge(q,picked){
    s.picked[q.id]=picked;
    const ok = q.type==="judge"
      ? picked[0]===q.answer[0]
      : picked.length===q.answer.length && picked.every((l,i)=>l===q.answer[i]);
    s.judged[q.id]=ok;
    const d=S.done[q.id]=S.done[q.id]||{c:0,w:0};
    if(ok)d.c++;else{d.w++;S.wrong[q.id]=1;}
    if(ok&&s.mode==="wrong")delete S.wrong[q.id];
    bumpDaily();save();render();
    // 答对自动切下一题（0.8 秒缓冲，手动操作可打断）
    if(ok){
      clearTimeout(s._autoT);
      s._autoT=setTimeout(()=>{
        if(curView&&curView.name==="practice"&&curView.s===s)practiceNext(s);
      },800);
    }
  }
}
function bindPracticeFoot(v){
  const s=v.s;
  if(s.idx>=s.list.length)return;
  const q=QMAP[s.list[s.idx]];
  $("#f-prev").disabled=s.idx===0;
  $("#f-prev").onclick=()=>{clearTimeout(s._autoT);if(s.idx>0){s.idx--;render();}};
  // 功能3：多选题在点「确认」之前，下一题/完成按钮置灰禁用
  const multiUnjudged = s.mode!=="recite" && q.type==="multi" && !(q.id in s.judged);
  $("#f-next").disabled = multiUnjudged;
  $("#f-next").title = multiUnjudged ? "多选题请先点「确认」再进入下一题" : "";
  $("#f-next").onclick=()=>{clearTimeout(s._autoT);practiceNext(s);};
  const star=$("#f-star");
  star.classList.toggle("on",!!S.fav[q.id]);
  star.onclick=()=>{
    clearTimeout(s._autoT);
    if(S.fav[q.id]){delete S.fav[q.id];toast("已取消收藏");}

    save();render();
  };
  $("#f-sheet").onclick=()=>{clearTimeout(s._autoT);openSheet(s,null);};
  // 自动滚动到顶部
  window.scrollTo(0,0);
}

/* ================= 模拟考试 ================= */
function vExamSetup(v){

  const official=poolAll.filter(q=>q.source==="official").length;
  if(v.src===undefined)v.src=official?"official":"all";
  if(v.src==="official"&&!official)v.src="all";
  const caps=[];[25,50,100].forEach(n=>{const c=Math.min(n,poolAll.length);if(c>0&&!caps.includes(c))caps.push(c);});
  if(v.cnt&&!caps.includes(v.cnt))v.cnt=null;
  let h=`<h2 class="pg">模拟考试 · ${esc(BANKS[v.bank].bank)}</h2><div class="card exam-setup">`;
  if(bankNames.length>1){
    h+=`<label>选择题库（正式考试按题库分开考）</label>
    <div class="filter-row" id="exam-bank">
      <button class="chip ${!ebank?"on":""}" data-ebank="">全部混合（${all.length}）</button>
      ${bankNames.map(n=>`<button class="chip ${ebank===n?"on":""}" data-ebank="${esc(n)}">${esc(n)}（${all.filter(q=>q.bank===n).length}）</button>`).join("")}
    </div>`;
  }
  h+=`<label>题目来源</label>
    <div class="filter-row" id="exam-src">
      ${official?`<button class="chip ${v.src==="official"?"on":""}" data-src="official">仅真题（${official}）</button>`:""}
      <button class="chip ${v.src==="all"?"on":""}" data-src="all">全部题源（${poolAll.length}）</button>
    </div>
    <label>试卷题数</label>
    <div class="cnt-row" id="exam-cnt">
      ${caps.map(n=>`<button class="chip ${v.cnt===n?"on":""}" data-cnt="${n}">${n} 题</button>`).join("")}
    </div>
    <label>考试时长</label>
    <div class="filter-row" id="exam-time">
      ${[[1,"每题1分钟"],[0.5,"每题30秒"],[1.5,"每题1.5分钟"]].map(m=>
        `<button class="chip ${(v.min||1)===m[0]?"on":""}" data-min="${m[0]}">${m[1]}</button>`).join("")}
    </div>
    <div class="divider"></div>
    <button class="big-btn" id="exam-start">开始考试</button>
    <div class="mut" style="margin-top:10px;font-size:12.5px;">按题型比例随机抽题组卷；交卷后按题库原分值计分，80分及格；答错的题自动进错题本。</div>
  </div>`;
  return h;
}
function bindExamSetup(v){
  const eb=$("#exam-bank");
  if(eb)eb.onclick=e=>{const c=e.target.closest("[data-ebank]");if(!c)return;
    v.ebank=c.dataset.ebank||null;v.cnt=null;render();};
  $("#exam-src").onclick=e=>{const c=e.target.closest("[data-src]");if(!c)return;
    v.src=c.dataset.src;render();};
  $("#exam-cnt").onclick=e=>{const c=e.target.closest("[data-cnt]");if(!c)return;
    v.cnt=+c.dataset.cnt;[...$("#exam-cnt").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-time").onclick=e=>{const c=e.target.closest("[data-min]");if(!c)return;
    v.min=+c.dataset.min;[...$("#exam-time").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-start").onclick=()=>{
    if(!v.cnt){toast("请选择题数");return;}
    const base=buildPool(v.bank,v.src,null).filter(q=>["single","multi","judge"].includes(q.type));
    const pool=v.ebank?base.filter(q=>q.bank===v.ebank):base;
    if(!pool.length){toast("该题库没有题目");return;}
    const need=Math.min(v.cnt,pool.length);
    // 按题型比例抽题
    const byType={};pool.forEach(q=>(byType[q.type]=byType[q.type]||[]).push(q));
    const picked=[];const total=pool.length;
    ["single","multi","judge"].forEach(t=>{
      if(!byType[t])return;
      const n=Math.min(byType[t].length,Math.round(need*byType[t].length/total));
      picked.push(...shuffle(byType[t]).slice(0,n));
    });
    if(picked.length<need){ // 比例取整可能差一两题，从剩余题里补齐
      const have=new Set(picked.map(q=>q.id));
      picked.push(...shuffle(pool.filter(q=>!have.has(q.id))).slice(0,need-picked.length));
    }
    const mins=v.min||1;
    let exam={list:shuffle(picked).map(q=>q.id),idx:0,picked:{},submitted:false,
      bank:v.bank,ebank:v.ebank||null,
      timeLimit:Math.round(need*mins*60),remain:Math.round(need*mins*60),startAt:Date.now()};
    go({name:"exam",s:exam});
  };
}
function vExam(v){
  const s=v.s;
  if(s.submitted)return vResult(v);
  const q=QMAP[s.list[s.idx]];
  const picked=s.picked[q.id]||[];

    <span class="timer ${s.remain<60?"danger":""}" id="exam-timer">${fmtTime(s.remain)}</span></div>
    <div class="pbar"><div style="width:${Math.round(Object.keys(s.picked).length/s.list.length*100)}%"></div></div></div>`;
  h+=`<div class="card"><div class="qhead">
    <span class="tag ${SRC_CLASS[q.source]}">${SRC_NAME[q.source]}</span>
    <span class="tag t-${q.type}">${TYPE_NAME[q.type]}</span>
    <span class="qno">📚 ${esc(q.bank)}</span></div>

  if(q.type==="judge"){

      <button class="judge-btn ${picked.includes("错误")?"picked":""}" data-j="错误">✗ 错误</button></div>`;
  }else{
    h+=`<div class="opts">`+q.options.map((o,i)=>{
      const L=LETTERS[i];
      return `<button class="opt ${picked.includes(L)?"picked":""}" data-o="${L}"><span class="ol">${L}</span><span>${esc(o)}</span></button>`;
    }).join("")+`</div>`;
    if(q.type==="multi")h+=`<div class="mut" style="margin-top:8px;font-size:12.5px;">多选题：选完自动保存，无需确认</div>`;
  }
  h+=`</div>`;
  return h;
}
function bindExam(v){
  const s=v.s;
  if(s.submitted){bindResult(v);return;}
  const q=QMAP[s.list[s.idx]];
  document.querySelector(".card").onclick=e=>{
    const jb=e.target.closest("[data-j]"),ob=e.target.closest("[data-o]");
    if(q.type==="judge"&&jb){s.picked[q.id]=[jb.dataset.j];render();}
    else if(ob){
      const L=ob.dataset.o;
      if(q.type==="single"){s.picked[q.id]=[L];}
      else{const p=(s.picked[q.id]=s.picked[q.id]||[]);const i=p.indexOf(L);if(i>=0)p.splice(i,1);else p.push(L);}
      render();
    }
  };
  $("#f-prev").disabled=s.idx===0;
  $("#f-prev").onclick=()=>{if(s.idx>0){s.idx--;render();}};
  $("#f-next").onclick=()=>{if(s.idx<s.list.length-1){s.idx++;render();}else{openSheet(s,submitExam);}};
  $("#f-sheet").onclick=()=>openSheet(s,submitExam);
  const star=$("#f-star");
  star.classList.toggle("on",!!S.fav[q.id]);
  star.onclick=()=>{
    if(S.fav[q.id]){delete S.fav[q.id];toast("已取消收藏");}
    else{S.fav[q.id]=1;toast("已收藏，可在收藏页练习或导出");}
    save();render();
  };
}
let examTimer=null;
function startExamTimer(v){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    const s=v.s;
    if(!s||s.submitted||curView!==v){clearInterval(examTimer);return;}
    s.remain--;
    const t=$("#exam-timer");
    if(t){t.textContent=fmtTime(s.remain);t.classList.toggle("danger",s.remain<60);}
    if(s.remain<=0){clearInterval(examTimer);toast("时间到，自动交卷");submitExam(v);}
  },1000);
}
function submitExam(v){
  const s=v.s;if(s.submitted)return;
  const unanswered=s.list.length-Object.keys(s.picked).length;
  const doSubmit=()=>{
    s.submitted=true;
    let score=0,full=0,correct=0,wrongList=[];
    s.list.forEach(id=>{
      const q=QMAP[id];full+=qScore(q);
      const picked=s.picked[id]||[];
      const ok=q.type==="judge"?picked[0]===q.answer[0]
        :picked.length===q.answer.length&&picked.slice().sort().every((l,i)=>l===q.answer[i]);
      if(ok){score+=qScore(q);correct++;}
      else{wrongList.push(id);
        const d=S.done[id]=S.done[id]||{c:0,w:0};d.w++;S.wrong[id]=1;}
      if(ok){const d=S.done[id]=S.done[id]||{c:0,w:0};d.c++;}
      if(picked.length)bumpDaily();
    });
    s.score=score;s.full=full;s.correct=correct;s.wrongList=wrongList;
    clearInterval(examTimer);save();
    stack=stack.filter(x=>x.name!=="exam");
    go({name:"exam",s},true);
  };
  if(unanswered>0){
    if(confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`))doSubmit();
  }else doSubmit();
}
function vResult(v){
  const s=v.s;
  const pct=s.full?Math.round(s.score/s.full*100):0;
  const pass=pct>=80;
  let h=`<div class="card" style="text-align:center;">
    <div class="score-circle ${pass?"pass":"fail"}"><div class="sv">${pct}</div><div class="sk">得分 / 100</div></div>
    <div style="font-weight:700;font-size:17px;color:${pass?"var(--ok)":"var(--bad)"}">${pass?"恭喜通过":"未达 80 分，继续加油"}</div>
    <div class="result-nums">
      <div class="stat-cell"><div class="v">${s.correct}</div><div class="k">答对</div></div>
      <div class="stat-cell"><div class="v">${s.wrongList.length}</div><div class="k">答错</div></div>
      <div class="stat-cell"><div class="v">${s.score.toFixed(1)}</div><div class="k">得 / ${s.full.toFixed(1)}分</div></div>

/* ================= 答题卡 ================= */
function openSheet(s,onSubmit){
  const isExam = typeof onSubmit==="function";
  let courseNav="";
  if(s.mode==="seq"&&s.list.length){
    const rs=courseRanges(s);
    if(rs.length>1){
      courseNav=`<div class="course-nav">${rs.map((r,i)=>{
        const cur=s.idx>=r.start&&s.idx<r.end;
        return `<button class="chip ${cur?"on":""}" data-ci="${i}" title="${esc(r.bank)}">${esc(r.bank)}（${r.end-r.start}）</button>`;
      }).join("")}</div>`;
    }
  }
  let gridHTML=s.list.map((id,i)=>{
    let cls="";
    if(isExam){if(s.picked[id])cls="done";}
    else{if(s.judged[id]!=null)cls=s.judged[id]?"done-ok":"done-bad";}
    if(i===s.idx)cls+=" cur";
    return `<button class="sq ${cls}" data-i="${i}">${i+1}</button>`;
  }).join("");
  const mask=document.createElement("div");
  mask.className="sheet-mask";
  mask.innerHTML=`<div class="sheet"><h3>答题卡（共 ${s.list.length} 题）</h3>
    ${courseNav}
    <div class="grid">${gridHTML}</div>
    ${isExam?`<div style="margin-top:14px;display:flex;gap:10px;">
      <button class="big-btn ghost" id="sheet-close">继续作答</button>
      <button class="big-btn" id="sheet-submit">交 卷</button></div>`
    :`<div style="margin-top:14px;"><button class="big-btn ghost" id="sheet-close">关 闭</button></div>`}
  </div>`;
  document.body.appendChild(mask);
  mask.addEventListener("click",e=>{
    if(e.target===mask)mask.remove();
    const cchip=e.target.closest("[data-ci]");
    if(cchip){
      const r=courseRanges(s)[+cchip.dataset.ci];
      s.idx=r.start;s.gate=false;
      if(s.mode==="seq"&&curView.name==="practice"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}
      mask.remove();render();return;
    }
    const sq=e.target.closest("[data-i]");
    if(sq){s.idx=+sq.dataset.i;s.gate=false;if(s.mode==="seq"&&curView.name==="practice"){S.seq[bankKeyOf(s)]=s.list[s.idx];save();}mask.remove();render();}
    if(e.target.id==="sheet-close")mask.remove();
    if(e.target.id==="sheet-submit"){mask.remove();onSubmit(curView);}
  });
}

/* ================= 收藏 / 错题（合并页） ================= */

/* ================= 导出 ================= */
function exportQuestions(ids,label){
  const lines=[`${label}导出（核电入职刷题）`,`导出时间：${new Date().toLocaleString()}　共 ${ids.length} 题`,""];
  ids.forEach((id,i)=>{
    const q=QMAP[id];if(!q)return;
    lines.push(`${i+1}. [${DATA.modules[q.module]||""} · ${q.bank} · ${TYPE_NAME[q.type]}] ${q.stem}`);
    (q.options||[]).forEach((o,j)=>lines.push(`    ${LETTERS[j]}．${o}`));
    lines.push(`    ✅ 答案：${q.type==="judge"?q.answer[0]:q.answer.join("")}`);
    if(q.type!=="judge"&&q.options)lines.push(`    ${ansText(q)}`);
    if(q.explanation)lines.push(`    📖 解析：${q.explanation}`);
    lines.push("");
  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`核电刷题_${label}_${today()}.txt`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("已开始下载");
}
function openExport(){
  const wrongIds=Object.keys(S.wrong).filter(id=>QMAP[id]);

    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="big-btn" id="exp-wrong" ${wrongIds.length?"":"disabled"}>导出错题（${wrongIds.length}）</button>
      <button class="big-btn" id="exp-fav" ${favIds.length?"":"disabled"}>导出收藏（${favIds.length}）</button>
      ${wrongIds.length&&favIds.length?`<button class="big-btn ghost" id="exp-both">两者都导出（${wrongIds.length+favIds.length}）</button>`:""}
      <button class="big-btn ghost" id="exp-close">取 消</button>

/* ================= 统计 ================= */
function vStats(){
  const doneIds=Object.keys(S.done);
  let attempts=0,correct=0;
  doneIds.forEach(id=>{attempts+=S.done[id].c+S.done[id].w;correct+=S.done[id].c;});
  const acc=attempts?Math.round(correct/attempts*100):0;
  let h=`<h2 class="pg">学习统计</h2>
  <div class="stat-nums">
    <div class="stat-cell"><div class="v">${doneIds.length}</div><div class="k">已刷题目</div></div>
    <div class="stat-cell"><div class="v">${acc}%</div><div class="k">总体正确率</div></div>
    <div class="stat-cell"><div class="v">${Object.keys(S.wrong).length}</div><div class="k">错题待攻克</div></div>
  </div>`;
  h+=`<div class="sec-title">各科进度</div><div class="card">`;
  for(const mid of ["qihang","basics","safety"]){
    const p=modProgress(mid);
    h+=`<div class="bank-stat"><div class="bs-top"><b>${esc(DATA.modules[mid]||mid)}</b><span>${p.done}/${p.total}（${p.pct}%）</span></div>
      <div class="pbar"><div style="width:${p.pct}%"></div></div></div>`;
  }
  h+=`</div>`;
  h+=`<div class="sec-title">近 14 天刷题量</div><div class="card dailies-wrap"><div class="dailies">`;
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
  }
  const max=Math.max(1,...days.map(d=>S.daily[d]||0));
  days.forEach((d,i)=>{
    const n=S.daily[d]||0;
    h+=`<div class="dbar"><div style="height:${Math.round(n/max*72)}px"></div><span>${i%2===0?d.slice(5):""}</span></div>`;
  });
  h+=`</div></div>`;
  const slayN=Object.keys(S.slay).filter(id=>QMAP[id]).length;
  h+=`<div class="card"><div class="mut">⚔️ 已斩杀 <b>${slayN}</b> 题（答对后主动斩杀，不再进随机/顺序/专项练习；可在「收藏 / 错题」页恢复）</div></div>`;
  h+=`<div class="about">数据保存在本机浏览器中<br>共 ${questions.length} 题 · 构建时间：${DATA.buildTime}</div>`;
  return h;
}

function doSearch(kw){

  const k=kw.toLowerCase();

    q.stem.toLowerCase().includes(k)||

  if(!hits.length){res.innerHTML=`<div class="empty">没有找到「${esc(kw)}」相关题目</div>`;return;}
  res.innerHTML=`<div class="mut" style="margin:0 2px 6px;">找到 ${hits.length} 题</div><div class="card" style="padding:4px 14px;">`+
    hits.map(q=>`<div class="res-item" data-qid="${q.id}">

/* ================= 渲染分发 ================= */
function render(){
  const v=curView;
  const vw=$("#view");
  let h="",title="",showNav=true;
  switch(v.name){
    case "home":h=vHome();break;
    case "modes":h=vModes(v);title=BANKS[v.bank].bank;break;
    case "practice":h=vPractice(v);title="练习";showNav=!!(v.s.idx<v.s.list.length&&!v.s.gate);break;
    case "examsetup":h=vExamSetup(v);title="模拟考试";break;
    case "exam":
      if(v.s.submitted){h=vResult(v);title="考试结果";showNav=false;}
      else{h=vExam(v);title="模拟考试"+(v.s.ebank?" · "+v.s.ebank:"");showNav=true;}
      break;
    case "fav":h=vFav();break;
    case "stats":h=vStats();break;
    case "search":h=vSearch();break;
    case "qview":h=vQView(v);title="题目详情";showNav=false;break;
  }
  vw.innerHTML=h;
  renderNav();renderHeader(title);
  const footLive = (v.name==="practice"&&v.s.idx<v.s.list.length&&!v.s.gate)||(v.name==="exam"&&!v.s.submitted);
  if(!footLive){const qf=$("#qfoot");if(qf)qf.remove();}
  // 绑定
  document.querySelectorAll(".mcard").forEach(el=>el.onclick=()=>go({name:"modes",bank:el.dataset.mod}));
  switch(v.name){
    case "modes":bindModes(v);break;
    case "practice":
      bindPractice(v);
      if(v.s.idx<v.s.list.length)bindFoot(v);
      break;
    case "examsetup":bindExamSetup(v);break;
    case "exam":
      if(v.s.submitted)bindResult(v);
      else{bindFoot(v);startExamTimer(v);window.scrollTo(0,0);}
      break;
    case "fav":bindList();break;
    case "search":bindSearch();break;
    case "qview":bindQView(v);break;
  }
}
function bindFoot(v){
  const s=v.s;
  const q=s.idx<s.list.length?QMAP[s.list[s.idx]]:null;
  const old=$("#qfoot");if(old)old.remove();
  const foot=document.createElement("div");
  foot.className="qfoot";foot.id="qfoot";
  foot.innerHTML=`
    <button class="fbtn" id="f-star"><span class="fi">${q&&S.fav[q.id]?"★":"☆"}</span>收藏</button>
    <button class="fnav navbtn prev" id="f-prev">上一题</button>
    <button class="fnav navbtn next" id="f-next">${s.idx>=s.list.length-1?(curView.name==="exam"?"交卷":"完成"):"下一题"}</button>
    <button class="fbtn" id="f-sheet"><span class="fi">▦</span>答题卡</button>`;
  document.body.appendChild(foot);
  if(curView.name==="practice")bindPracticeFoot(v);
  else if(curView.name==="exam")bindExam(v);
}

function bindModes(v){
  const b=BANKS[v.bank];
  const state={mode:null,src:"all",types:new Set(["single","multi","judge"])};
  const srcEl=$("#src-filter"),typeEl=$("#type-filter");
  // 更新专项练习各题型数量
  const cnt={};b.list.forEach(q=>cnt[q.type]=(cnt[q.type]||0)+1);
  typeEl.querySelectorAll("[data-type]").forEach(el=>{
    el.textContent=`${TYPE_NAME[el.dataset.type]}（${cnt[el.dataset.type]||0}）`;
    el.onclick=()=>{
      const t=el.dataset.type;
      if(state.types.has(t))state.types.delete(el.dataset.type);else state.types.add(t);
      el.classList.toggle("on");
    };
  });
  srcEl.querySelectorAll("[data-src]").forEach(el=>{
    el.onclick=()=>{state.src=el.dataset.src;
      srcEl.querySelectorAll("[data-src]").forEach(x=>x.classList.toggle("on",x===el));};
  });
  $("#mode-grid").querySelectorAll("[data-mode]").forEach(el=>{
    el.onclick=()=>{
      const m=el.dataset.mode;
      if(m==="type"){
        srcEl.style.display="flex";typeEl.style.display="flex";
        el.classList.toggle("on");
        return;
      }
      startSession({mode:m,bank:v.bank,src:"all",types:null});
    };
  });
  // 专项练习开始按钮
  const startBtn=document.createElement("button");
  startBtn.className="big-btn";startBtn.textContent="开始专项练习";
  startBtn.style.marginTop="10px";
  typeEl.parentNode.appendChild(startBtn);
  startBtn.onclick=()=>{
    if(!state.types.size){toast("请先勾选题型");return;}
    startSession({mode:"seq",bank:v.bank,src:state.src,types:[...state.types]});
  };
  // 课程列表：点哪门刷哪门（空值 = 全部课程整体顺序）
  document.querySelectorAll("[data-course]").forEach(el=>{
    el.onclick=()=>startSession({mode:"seq",bank:v.bank,src:"all",types:null,course:el.dataset.course||null});
  });
  // 断点续练（按题目 id 定位，斩杀/恢复不影响）
  const pool=buildPool(v.bank,"all",null,true);
  const rIdx=seqResumeIdx(pool,v.bank);
  if(rIdx>0&&rIdx<pool.length){
    const qAt=pool[rIdx];
    const where=qAt?`《${esc(qAt.bank)}》 `:"";
    $("#resume-info").innerHTML=`上次顺序练习到 ${where}第 <b>${rIdx+1}</b> 题　<button class="chip on" id="btn-resume">继续</button>`;
    $("#btn-resume").onclick=()=>startSession({mode:"seq",bank:v.bank,src:"all",types:null});
  }
  $("#exam-card").onclick=()=>go({name:"examsetup",bank:v.bank});
}

/* ================= 启动 ================= */
loadState();
$("#btn-back").onclick=back;
$("#btn-dk").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",cur?"light":"dark");
  try{localStorage.setItem("tiku_theme",cur?"light":"dark");}catch(e){}
};
try{
  const th=localStorage.getItem("tiku_theme");
  if(th==="dark"||( !th && false ))document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
$("#nav").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  stack=[];
  go({name:t.dataset.t},true);
});
go({name:"home"},true);
</script>
</body>
</html>
