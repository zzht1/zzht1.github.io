闭空间内部人员随身佩戴气体检测仪表的方式检测气体含量。","只要看起来没问题就不用进行气体检测。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：作业遵循“先通风、再检测、后作业”；无法完全隔离有害物质时须持续监测并设置报警装置（A正确）；进行打磨、焊接、涂漆、使用强挥发性气体或内燃机等可能改变空间内空气质量的作业时必须持续监测（B正确）；并推荐密闭空间内部人员随身佩戴气体检测仪表（C正确）。凭“看起来没问题”就不检测，是拿感官判断气体危害——一氧化碳等无色无味气体会致命，D错误。【易混点】人的感官无法感知氧含量和多数有毒气体，判断必须依靠仪表。"},{"id":"safety_fsjx_0032","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在通过C1（门框式污染监测仪）或C2（全身表面污染监测仪）时提示被污染时，你应该（ ）。","options":["自己立即进行冲洗","在同伴帮助下小心冲洗","及时通知辐射防护人员","不予理会，强行通过"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：C1/C2门检测出污染时，须先通知辐射防护（RP）人员并在其指导下处理——工作服污染由RP指导脱放于污染衣物收集桶，体表污染颈部以下可在RP指导下清洗去污，故C正确。不选A、B：自行冲洗或同伴帮忙冲洗缺乏专业监测，去污方法和废液收集都不规范，且颈部以上污染严禁自行处理；不选D：不予理会强行通过属严重违章，会把污染带出控制区。【易混点】颈部以上（面部）污染须由RP人员联系专业去污人员处理。"},{"id":"safety_fsjx_0033","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"一名辐射工作人员进入辐射控制区后，看了看手表，发现时间还早，捋了捋头发，玩了会儿手机，时间差不多了，开始工作，工作现场太热，于是擦了擦汗，瞄了一眼电子式剂量计（EPD），发现接受了1μSv的剂量，随手将电子式剂量计（EPD）放在旁边的管道上，继续开始干活，突然发现电子式剂量计（EPD）报警了，于是重新将电子式剂量计（EPD）戴好，结束工作。以下关于此名辐射工作人员的行为说法错误的是（ ）。","options":["携带手表等个人物品进入辐射控制区属于违规行为","使用穿戴的连体服袖口等防护物资擦汗可能造成皮肤沾污","使用EPD测一下管道附近的辐射强度是一种小窍门","将电子式剂量计（EPD）随意放置在管道上将使剂量计无法准确监测个人所在环境的辐照剂量"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：手表、手机等个人物品不得带入辐射控制区，一旦污染既难去污又造成物品报废（A说法正确）；用连体服袖口擦汗可能造成面部沾污（B正确）；EPD须随身正确佩戴，随意放在管道上无法监测个人实际受照剂量（D正确）。EPD是个人电子剂量计，只反映佩戴者所在位置的剂量，不能当辐射测量仪去测管道辐射水平，“小窍门”说法错误，故选C。【易混点】测辐射水平应使用便携式辐射监测仪表，可在卫生出入口借用。"},{"id":"safety_fsjx_0034","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在辐射工作中，使用长杆工具操作带辐射的设备，属于以下哪种防护措施（ ）。","options":["距离防护","源强防护","屏蔽防护","时间防护"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：距离防护的原理是某位置的辐射水平同与辐射源距离的平方成反比，具体做法包括与辐射源保持距离、使用长杆工具操作带辐射的设备，使人在离源更远处完成作业，剂量率大幅降低，故属距离防护，选A。【易混点】外照射防护四法要分清：缩短受照时间=时间防护，加大间距=距离防护，加设屏蔽=屏蔽防护，降低源强度=源项控制（源强防护）。"},{"id":"safety_fsjx_0035","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下说法错误的是（ ）。","options":["辐射的生物效应按剂量效应关系分为确定性效应和随机性效应，工作中进行采取防护措施的目的是使随机性效应发生的概率尽量低。","全身有效剂量是内照射和外照射剂量的总和。","确定性效应是人体接受的剂量达到某个阈值时一定会发生的效应。","在正常情况下开展辐射工作也可能会发生确定性效应。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：确定性效应存在剂量阈值，剂量达到阈值才会发生，且课件明确“在正常的电厂活动中，所接受的辐射剂量不会导致确定性效应”，故D错误。A正确：辐射生物效应按剂量效应关系分为确定性效应和随机性效应，防护目的之一是使随机性效应发生概率尽量低；B正确：全身有效剂量是内照射和外照射剂量之和；C正确：确定性效应是达到阈值就一定会发生的效应。【易混点】确定性效应“有阈值、必然发生”，随机性效应“无阈值、概率发生”。"},{"id":"safety_fsjx_0036","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在辐射工作中，工作人员穿戴铅衣，属于以下哪种防护措施（ ）。","options":["距离防护","源强防护","屏蔽防护","时间防护"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：屏蔽防护是在人与辐射源之间加设屏蔽体来降低人员受照剂量的方法，屏蔽服（铅衣、钨衣）用于外照射剂量率较高的工作环境。穿铅衣正是在人体与辐射源之间加了重金属屏蔽层，属屏蔽防护，故选C。【易混点】铅衣防护的是γ、X等外照射；纸衣、连体服防的是表面污染，两者不可混淆。"},{"id":"safety_fsjx_0037","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于辐射工作控制以下说法错误的是（ ）。","options":["ALARA工前会上，工作负责人和辐射防护人员根据《工前会检查单》逐项进行检查和落实","当工作进行到停工待捡点时，工作组必须停止工作，联系辐射防护人员检查","当工作进行到见证点时，工作负责人可以自行检查，不必通知辐射防护人员","对于具有潜在高辐射风险的工作，工作组应借用便携式辐射监测仪表或无线电子式剂量计（EPD），在作业过程进行连续监测"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：按核电辐射工作通行做法，停工待检点是强制检查点，工作组必须停止工作、等待辐射防护人员到场检查确认后方可继续；见证点同样应通知辐射防护人员到场见证，工作负责人不得以自行检查代替，C“自行检查、不必通知”错误。A工前会按《工前会检查单》逐项检查落实、B到停工待检点停止工作联系RP检查、D潜在高辐射风险工作借用便携式监测仪表或无线EPD连续监测，均为辐射工作控制的常规要求。【易混点】课件黄线违章明确：开展高辐射风险工作，在辐射安全检查点未通知辐射防护人员检查确认，属黄线违章。"},{"id":"safety_fsjx_0038","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下具有空气污染防护功能的是（ ）。","options":["气面罩","纸衣","细纱手套","铅衣"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：空气污染的个人防护用品包括口罩、半面罩、全面罩、气衣、气面罩、自给式呼吸器等，气面罩通过供气在面部形成清洁空气环境，防止吸入放射性气载污染物，具有空气污染防护功能，故选A。不选B：纸衣防表面污染；不选C：细纱手套是基本手部防护用品，防一般表面污染；不选D：铅衣用于外照射屏蔽。【易混点】防护用品按功能三分：纸衣/橡胶手套/鞋套防表面污染，气面罩/气衣/呼吸器防空气污染，铅衣防外照射。"},{"id":"safety_fsjx_0039","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下一定属于放射性废物的是（ ）。","options":["没被污染的工作服","工作组用过的纸衣","使用过的可移动γ屏蔽墙","未使用过的破损的防护服"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：用过的纸衣存在被污染的可能，脱除后应放入红色废物收集袋按放射性废物处理，故B一定属于放射性废物。不选A：未被污染的工作服经监测确认后可正常洗涤复用；不选C：可移动γ屏蔽墙是可复用设备；不选D：课件黄线违章明确“把未使用的防护用品作为放射性废物处理”属违章，未用过的破损防护服不按放射性废物处理。【易混点】判断放射性废物的核心是“是否污染或可能污染”，不是“是否用过、是否破损”。"},{"id":"safety_fsjx_0040","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"卫生出入口污染监测设备不包括：（ ）。","options":["C1门","C2门","X光透视安检机","小件物品污染检测仪"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：退出辐射控制区的污染监测手段包括工作服污染监测门（C1门）、人员体表污染监测门（C2门）和小件物品测量仪（CPO），A、B、D均属于卫生出入口污染监测设备。X光透视安检机用于安检探查违禁品，不具备表面污染监测功能，不属于卫生出入口污染监测设备，故选C。【易混点】C1门测工作服、C2门测体表、CPO测随身小件物品（文件袋、笔、剂量计等），三者分工明确、缺一不可。"},{"id":"safety_fsjx_0041","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于降低外照射集体剂量的防护措施，以下描述正确的是（ ）。","options":["减少工作时间、增加工作人数","多人同时参与工作、穿戴新型辐射防护用品、降低源强","减少工作时间、增加与放射源距离、降低源强、搭设屏蔽","降低巡检和检修频度、降低完工验收标准"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：外照射集体剂量防护从时间、距离、源项、屏蔽四方面入手——减少工作时间对应时间防护，增加与放射源距离对应距离防护，降低源强对应源项控制，搭设屏蔽对应屏蔽防护，C完整涵盖四种方法，正确。不选A/B：增加工作人数会抬高集体剂量，穿戴新型防护用品对γ外照射收效甚微；不选D：降低巡检频度、降低验收标准属牺牲安全和质量换剂量，不可取。【易混点】集体剂量=人数×人均剂量，“人多分摊”反而增大集体剂量。"},{"id":"safety_fsjx_0042","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在人类的生活环境中，在（ ）会受到放射性照射。","options":["仅在从事放射性工作时","任何地方和任何时刻都","仅在接收放射性治疗时","仅在接触放射性物质时"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：天然放射性是自然界本身存在的，包括宇宙射线、地壳及人体内的放射性物质，天然本底照射对人均剂量的贡献无法避免。因此人们在任何地方和任何时刻都会受到放射性照射，故选B。不选A/C/D：把照射局限于“从事放射性工作”“放射性治疗”“接触放射性物质”都是误解——食物、建材、乘机旅行中都存在天然照射。【易混点】天然本底无处不在，但不属于核电厂辐射风险，剂量限值也不适用于天然本底照射。"},{"id":"safety_fsjx_0043","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下工作人员在辐射控制区内的行为，正确的是（ ）。","options":["使用连体服袖口擦汗","未将个人头发全部包在纸帽内","未脱除手套在控制区内打电话","发现佩戴的EPD突然报警，立即将手头工作置于安全状态撤离当前工作区域"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：EPD发生报警时，应立即将手头工作置于安全状态、撤离当前工作区域并通知辐射防护人员，D正确。不选A：用连体服袖口擦汗可能造成面部沾污；不选B：头发未全部包入纸帽，头发易沾污且极难去污；不选C：戴手套打电话会污染手机等个人物品并把污染带出控制区。【易混点】EPD报警后不撤离继续作业属黄线违章；正确响应是“置工作于安全状态—撤离—报告”三步。"},{"id":"safety_fsjx_0044","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下工作人员在辐射控制区内的行为，错误的是（ ）。","options":["辐射控制区内不能饮水","在卫生出入口发现忘记带热释光剂量计（TLD），回去拿","在进入辐射控制区前，可以根据自己的意愿选择是否穿戴辐射控制区专用的衬衣、衬裤、袜子","在辐射控制区内如果脸部发痒，不能用自己戴的细纱手套擦"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：对未实施“清洁电站模式”的核电厂，进入辐射控制区必须换上专用基本防护用品（连体服、纸帽、衬衣、衬裤、袜子等），这是强制要求，不能凭个人意愿选择是否穿戴，C错误。A正确：控制区内禁止饮水进食；B正确：忘带TLD应回卫生出入口补取，保证个人剂量监测完整；D正确：脸部发痒用细纱手套擦拭会把污染带到面部。【易混点】基本防护用品的作用是防体表沾污，未按规定穿戴完整属不规范/违章行为。"},{"id":"safety_fsjx_0045","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"单位换算：1mSv=（ ）μSv。","options":["0.1μSv","10μSv","100μSv","1000μSv"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射剂量单位换算为1Sv=1000mSv、1mSv=1000μSv，核电厂常用单位为mSv和μSv，故1mSv=1000μSv，选D。不选A/B/C：0.1、10、100μSv分别错了四个、两个、一个数量级，其中C（100μSv）最具迷惑性，易与千进制记混。【易混点】换算口诀“千进制”：Sv→mSv→μSv每级乘1000；做估算题先统一单位再计算。"},{"id":"safety_fsjx_0046","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于卫生出入口的功能的是（ ）。","options":["污染监测","辐射防护用品的分发","便携式仪表的借用及回收","全身计数测量（WBC）"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：卫生出入口的功能包括剂量计（TLD/EPD）的分发及回收、便携式仪表的借用及回收、辐射防护用品的分发、污染监测（C1/C2门、CPO）以及同辐射防护人员进行工作沟通，A、B、C均在其列。全身计数测量（WBC）是测量体内放射性核素活度的专项手段，在专门测量设施进行，不属于卫生出入口功能，故选D。【易混点】WBC用于内照射监测（体内核素摄入后），与出入控制区时的体表污染监测是两回事。"},{"id":"safety_fsjx_0047","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"离开松散污染控制区时，应先脱去（ ），再脱去（ ）。（ ）。","options":["橡胶手套；纸衣","纸衣；橡胶手套","橡胶手套；安全帽","安全帽；橡胶手套"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：离开表面（松散）污染隔离区时，先脱去橡胶手套丢入废物收集桶，再脱去纸衣轻轻放入收集桶，最后脱除塑料鞋套——防止污染最重的手套外侧碰到纸衣内侧或连体服造成二次污染，故先脱橡胶手套、再脱纸衣，选A。【易混点】脱除总原则“由外到内、由重到轻”，动作要轻缓防止扬尘；穿戴顺序则相反，先穿纸衣后戴手套并用胶带密封固定。"},{"id":"safety_fsjx_0048","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"工作人员在环境剂量率30μSv/h的环境中工作2小时，他所受的剂量大约为（ ）。","options":["60mSv","0.6mSv","60μSv","60Sv"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：外照射剂量估算公式为剂量=剂量率×在辐射场停留的时间，30μSv/h×2h=60μSv，故选C。不选A/B：60mSv、0.6mSv是单位换算错误，60μSv仅合0.06mSv；不选D：60Sv已是致死剂量水平，荒谬。【易混点】此题同时考“估算公式”和“μSv与mSv换算”（1mSv=1000μSv），先算数值再核对单位选项。"},{"id":"safety_fsjx_0049","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"不同年龄段群体中，对辐射最敏感的是（ ）。","options":["婴幼儿","中小学生","成年人","老年人"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：对辐射最敏感的是具有最高分裂频度、分裂能力保持时间最长、最未分化的细胞。婴幼儿处于快速生长发育期，细胞分裂旺盛、分化程度低，故对辐射最敏感，选A。中小学生、成年人、老年人细胞分裂活跃程度依次降低，辐射敏感性递减。【易混点】细胞辐射敏感度规律：“分裂快、分化低、代谢旺”的细胞（如造血细胞、生殖细胞）对辐射最敏感。"},{"id":"safety_fsjx_0050","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于辐射的说法，错误的是（ ）。","options":["手机信号、电脑对我们产生的辐射属于非电离辐射","只有核电站中才存在电离辐射","电离辐射是辐射防护关注的重点","地壳中存在一些天然放射性的物质"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：电离辐射并非核电站独有——天然放射性（宇宙射线、地壳中的放射性物质）和人工放射性（医疗照射、核技术应用等）广泛存在于生活环境中，B“只有核电站中才存在电离辐射”错误。A正确：手机信号、电脑产生的辐射属非电离辐射；C正确：电离辐射是辐射防护关注的重点；D正确：地壳中存在天然放射性物质。【易混点】区分电离/非电离的关键是辐射能量能否使原子发生电离；辐射防护针对的是电离辐射。"},{"id":"safety_fsjx_0051","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"对于理想点源，在某点处辐射场强度与该点距离放射源距离的平方成反比。假设距某理想点放射源距离为1米处剂量率为1mSv/h，则距离为2米处的剂量率为（ ）mSv/h。","options":["0.25mSv/h","0.5mSv/h","0.75mSv/h","1mSv/h"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：某位置的辐射水平同与辐射源距离的平方成反比（平方反比法则）。距离由1米增至2米即2倍，剂量率降为原来的1/2²=1/4，即1mSv/h×1/4=0.25mSv/h，故选A。不选B（0.5）：只按1/2算，漏了平方；不选C/D：距离增大剂量率只会减小，不可能为0.75或不变。【易混点】平方反比适用于理想点源；距离加倍降为1/4、距离增至3倍降为1/9。"},{"id":"safety_fsjx_0052","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列射线类型中，穿透能力最差的是（ ）。","options":["α辐射","β辐射","中子辐射","γ辐射"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：α辐射穿透能力最差，在空气中仅能传播2～3厘米，一张纸、薄衣服或皮肤即可屏蔽，故选A。不选B：β射线可在空气中传播几百厘米、能穿透皮肤，需几毫米厚铝箔阻挡；不选C/D：γ射线和中子穿透能力非常强，γ可穿透人体，中子需用含氢物质（石蜡、水）屏蔽。【易混点】穿透力弱不等于危害小：α射线一旦进入体内电离密度高，内照射危害大，故α防护重在防内污染。"},{"id":"safety_fsjx_0053","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于细纱手套的使用，以下说法正确的是（ ）。","options":["在辐射控制区内打电话时可以不用脱掉手套","在污染隔离区内不可以脱掉细纱手套签字、记录","如果不在松散污染隔离区，脸痒可以用戴着细纱手套的手擦一下","在辐射控制区内做精细操作时可以脱下细沙手套"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：在污染隔离区内脱掉细纱手套签字、记录，裸手会直接接触可能被污染的文件、设备，造成手部沾污，故B正确——记录签字应设法在不脱防护的情况下完成或另作安排。不选A：戴手套打电话会污染个人物品；不选C：即使不在松散污染隔离区，用手套擦脸仍有把手套污染带到面部的风险；不选D：精细操作脱手套会使裸手直接暴露于污染。【易混点】细纱手套仅防一般表面污染，污染较重时应在外加戴橡胶手套。"},{"id":"safety_fsjx_0054","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于辐射防护用品的说法，以下说法错误的是（ ）。","options":["防护用品可以分为基本防护用品和特殊防护用品","特殊防护用品在基本防护用品的基础上加穿，不能单独穿着","连体服可以防护外照射","在松散污染环境需要穿戴的特殊防护用品有纸衣、橡胶手套、塑料鞋套"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：连体服、纸衣等防护用品仅用于防止放射性表面污染，不具有外照射防护功能，能降低外照射剂量的是屏蔽服（铅衣、钨衣），C“连体服可以防护外照射”错误。A、B、D均正确：防护用品分为基本防护用品和特殊防护用品；特殊防护用品在基本防护用品基础上加穿、不能单独穿着；松散污染环境的特殊防护用品有纸衣、橡胶手套、塑料鞋套。【易混点】“防沾污”与“防外照”是两套体系：纸衣再厚也挡不住γ射线。"},{"id":"safety_fsjx_0055","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"如果你在安全壳厂房，遇到以下哪种情况，不需要置手头工作于安全状态后撤离，联系辐射防护人员？（ ）","options":["你所在的区域辐射监测仪报警","安全壳撤离信号报警","随身佩戴的电子式剂量计（EPD）发生报警","工作中发现辐射防护人员向你走来"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：区域辐射监测仪报警、随身EPD报警、安全壳撤离信号报警，都表明辐射环境可能发生变化或存在威胁，必须将手头工作置于安全状态后撤离并联系辐射防护人员，A、B、C均属须撤离的情形。辐射防护人员向你走来只是正常的工作接触（如现场巡查、监督检查），不是报警信号，无需撤离，故选D。【易混点】EPD报警后继续作业属黄线违章；撤离前须把手头工作置于安全状态，不能一走了之。"},{"id":"safety_fsjx_0056","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂对某些管道、设备采取氧化、冲洗等措施目的是达成以下哪种防护（ ）。","options":["距离防护","源强防护","屏蔽防护","时间防护"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：源项控制（源强防护）是通过降低辐射源的强度来降低人员受照剂量，核电厂的常用做法就是对某些管道、设备采取氧化、冲洗等措施，并对严重污染设备去污，减少腐蚀活化产物等源项，故选B。不选A/C：距离防护靠拉开人与源的距离，屏蔽防护靠加设屏蔽体，均不改变源本身强度；不选D：时间防护靠缩短受照时间。【易混点】腐蚀活化产物是造成核电厂外照射剂量的主要来源，大修前的系统冲洗净化正是源项控制措施。"},{"id":"safety_fsjx_0057","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂辐射控制区通常依据不同区域内（ ）进行子区划分。","options":["坠落风险高低","辐射水平高低（剂量率）","设备的重要程度","辐射热点的数量多少"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射控制区依据区域内辐射水平（剂量率，mSv/h）高低进行子区划分：绿区≤0.025、黄区>0.025～1、橙区>1～100、红区>100 mSv/h，分级管控进入条件，故选B。不选A：坠落风险是工业安全考虑因素；不选C：设备重要程度与辐射分区无关；不选D：热点数量不是分区依据，单一热点即可显著抬高局部剂量率。【易混点】子区管控看剂量率区间；进入橙区、红区须办理高辐射区域进入许可等专门许可。"},{"id":"safety_fsjx_0058","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射防护四原则中，下列哪一项是仅针对工作人员的要求（ )。","options":["正当性原则","个人剂量限制","最优化原则","自我防护原则"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：自我防护原则明确“辐射防护是每一个辐射工作人员自觉履行的职责”，要求工作人员遵守防护程序、运用防护知识和技能保护自己，是仅针对工作人员个体的要求，故选D。不选A/B/C：正当性原则（实践收益大于代价）、最优化原则（ALARA）、个人剂量限制都是针对辐射实践和单位的普适要求。【易混点】四原则中前三条管“实践”，自我防护管“个人”；时间/距离/屏蔽防护是实现最优化的具体方法，勿与四原则混淆。"},{"id":"safety_fsjx_0059","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂辐射风险不包括（ ）。","options":["天然本底辐射","放射性空气污染","外照射","放射性表面污染"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：核电厂辐射风险分为外照射风险、内照射风险（放射性空气污染）和表面污染风险，B、C、D均在其列。天然本底辐射是自然界本来就存在的照射，无处不在且不可避免，不属于核电厂的辐射风险，剂量限值也不适用于天然本底照射，故选A。【易混点】题眼在“核电厂辐射风险”——按来源分类时天然本底被排除，但它提示人们生活中本身就处在本底照射之中。"},{"id":"safety_fsjx_0060","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列哪些情况下，不会引起工作现场辐射情况的变化（ ）。","options":["反应堆功率改变","非工作计划下冒险打开一回路上某机械阀门","忽然发现前方某一本该关闭的一回路上的阀门漏水","工作现场照明灯突然熄灭"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：对工作现场辐射环境的变化须保持警觉。反应堆功率改变会使裂变中子等源项强度变化（A会变）；非计划冒险打开一回路上机械阀门、一回路阀门突然漏水都会造成放射性介质外泄，引起表面污染、空气污染和剂量率升高（B、C会变）。照明灯熄灭只影响照明条件，不改变辐射源的强度和分布，不会引起辐射情况变化，故选D。【易混点】照明中断虽不改变辐射水平，但影响对污染区边界和报警信号的观察，也应报告处理。"},{"id":"safety_fsjx_0061","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于中国核电辐射防护管理'红线违章'行为的是：（ ）。","options":["冒用他人辐射工作授权信息进入辐射控制区。","随意穿越射线探伤区域。","在卫生出入口借用便携式剂量计。","未按要求采取防护措施，擅自进入存在空气污染风险的场所。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》红线违章包括：冒用他人辐射工作授权信息进入辐射控制区（A）、擅自进入射线探伤隔离区域（B）、未按要求采取防护措施擅自进入存在空气污染风险的场所（D），均属红线。在卫生出入口借用便携式剂量计是卫生出入口的正常服务功能，属规范行为，不是违章，故选C。【易混点】红线是不可触碰的最高级别违章（冒用授权、擅入红区/橙区/探伤区、擅自转移放射源等）；借还便携式仪表须登记。"},{"id":"safety_fsjx_0062","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射控制区内划分的子区按照剂量率从高到低排序正确的是（ ）。","options":["绿区、橙区、红区","橙区、绿区、红区","橙区、红区、绿区","红区、橙区、黄区"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射控制区子区按剂量率划分——红区最高（>100mSv/h，禁止进入），橙区次之（>1～100mSv/h，限制进入），黄区再次（>0.025～1mSv/h），绿区最低（≤0.025mSv/h）。按剂量率从高到低排序为红区、橙区、黄区，故选D。不选A/B/C：均把剂量率最低的绿区排在橙区甚至红区之前，排序错误。【易混点】记忆口诀“红橙黄绿”：红色最危险、绿色最安全，与交通灯逻辑一致。"},{"id":"safety_fsjx_0063","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"对于需要进入辐射控制区工作的人员，以下哪种行为是错误的？（ ）","options":["小张估计管道保温作业需要铆钉30枚左右，于是带上一盒200枚的铆钉进入工作现场以备不时之需；","小李将新领用的扭力扳手的包装去掉后，再带入辐射控制区工作；","工作结束后，负责人要求工作组成员将现场未使用完的物料带走，并打扫场地；","工前会对工作方案和步骤进行详细讨论，仅携带必要的工具进入现场；"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：应尽量减少带入辐射控制区的物品数量，仅携带必要的工具，且尽可能去掉外包装以减少放射性废物产生。仅估需30枚铆钉却带整盒200枚入厂，多余物品出区须逐一监测、极易被污染变成放射性废物，A行为错误。B去掉包装后再带入、C结束后带走剩余物料并打扫场地、D工前会详细讨论仅带必要工具，均为正确做法。【易混点】控制区物品管理“少带入、去包装、带出来”，目的都是减少放射性废物产生量。"},{"id":"safety_fsjx_0064","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂中辐射的源项有（ ）。","options":["裂变中子、裂变产物、辐射探伤","裂变中子、裂变产物、腐蚀活化产物","一回路冷却剂、裂变产物、核燃料","压力容器、蒸汽发生器、主冷却剂泵"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：核电厂中辐射的源项包括裂变中子、裂变产物、腐蚀活化产物以及放射源/射线装置，其中腐蚀活化产物可在一回路设备管道中形成辐射场或热点，是造成核电厂外照射剂量的主要来源，B正确。不选A：辐射探伤是使用放射源的工作活动，不是辐射源项分类；不选C：一回路冷却剂、核燃料是放射性介质载体，非课件源项表述；不选D：压力容器等只是设备名称。【易混点】源项不等于设备：反应堆运行时裂变中子和裂变产物是主要源项，停堆检修时腐蚀活化产物成为外照射主要来源。"},{"id":"safety_fsjx_0065","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"某电站大修期间，一名阀门检修人员李某跟随工作组参与放射性阀门A开口作业，该放射性阀门所在房间场所剂量率约为0.1mSv/h，工作完成后，李某跨出松散污染控制区后依次脱去纸衣、塑料鞋套、橡胶手套等特殊防护用品，并放入指定的废物收集桶内，见时间还早，就在该房间内席地而坐，休息了半小时左右，然后前往卫生出入口，通过污染监测、更换个人衣物及证件后离开控制区。以下说法错误的是（ ）。","options":["李某不应该离开松散污染控制区再脱除附加防护用品","防护用品正确的脱除顺序应该是纸衣、橡胶手套、塑料鞋套","该房间属于黄区","李某不应席地而坐应该去低剂量等待区休息待命"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：附加防护用品应在污染隔离区内脱除，且正确脱除顺序是先脱橡胶手套、再脱纸衣、最后脱塑料鞋套，B所述“纸衣、橡胶手套、塑料鞋套”顺序错误。A正确：跨出松散污染控制区后再脱违反规定；C正确：场所剂量率0.1mSv/h落在>0.025～1mSv/h区间，属黄区；D正确：应到低剂量等待区休息，而非在黄区房间席地而坐。【易混点】判断子区看剂量率区间：0.1mSv/h按划分标准属黄区。"},{"id":"safety_fsjx_0066","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不是松散污染环境中常用的防护用品是：（ ）。","options":["纸衣","橡胶手套","耳塞","塑料鞋套"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：进入表面（松散）污染隔离区穿戴的附加防护用品包括纸衣、橡胶手套、塑料鞋套等，用于防止松散污染沾附身体和内层工作服，A、B、D均在其中。耳塞是噪声听力防护用品，与松散污染防护无关，故选C。【易混点】穿附加防护用品的要点：纸衣帽子须覆盖安全帽，橡胶手套与纸衣之间用胶带密封固定；脱除顺序为手套→纸衣→鞋套。"},{"id":"safety_fsjx_0067","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射工作负责人的职责不包括：（ ）。","options":["协助工单准备人及辐射防护人员办理辐射工作许可证及高辐射区域进入许可","确保工作组成员无犯罪记录","确保工作组成员按照辐射工作控制文件的要求执行工作","到停工待检点时，通知辐射防护人员执行现场监督检查"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射工作负责人的职责包括协助办理辐射工作许可证及高辐射区域进入许可（A）、确保工作组成员按辐射工作控制文件要求执行工作（C）、到停工待检点时通知辐射防护人员执行现场监督检查（D）——在辐射安全检查点未通知RP确认属黄线违章。“确保工作组成员无犯罪记录”属人员安保与资质管理范畴，与辐射防护无关，不属于辐射工作负责人职责，故选B。【易混点】负责人对辐射工作的“许可、执行、检查点”负管理责任，人员背景审查不在其列。"},{"id":"safety_fsjx_0068","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射控制区的哪个子区剂量率最高（ ）。","options":["红区","黄区","橙区","绿区"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射控制区按剂量率从高到低分为红、橙、黄、绿等子区，红区剂量率最高（>100mSv/h），为禁止进入区，未经批准严禁进入，故选A。不选B/C：黄区（>0.025～1mSv/h）、橙区（>1～100mSv/h）剂量率依次更低，橙区为限制进入区；不选D：绿区剂量率最低（≤0.025mSv/h）。【易混点】进入橙区、红区须办理高辐射区域进入许可、钥匙借用许可或开门许可等专门手续。"},{"id":"safety_fsjx_0069","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射控制区休息时，以下行为正确的是（ ）。","options":["寻找低剂量等待区标牌，该区域场所剂量率较低且没有放射性污染的位置，工作人员工作过程中可以在此待命或休息","太热，可以脱掉部分辐射防护用品","拿辐射防护物资作为垫板坐地上","随地坐卧"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：低剂量等待区设在现场辐射水平非常低且无放射性污染的区域，设有专门标识牌，供工作人员暂无任务时待命或休息，避免接受不必要的照射，故A正确。不选B：擅自脱掉防护用品可能造成体表沾污，且属擅自降低防护级别的违章；不选C：拿防护物资当垫板会污染损耗物资、增加废物；不选D：随地坐卧有沾污风险。【易混点】在控制区内少停留一分钟就少受一分剂量，休息待命先找低剂量等待区标识牌。"},{"id":"safety_fsjx_0070","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于中国核电辐射防护管理'黄线违章'行为的是：（ ）。","options":["未经辐射防护人员许可和现场监护，擅自打开辐射控制区边界。","在辐射控制区检修现场脱下气面罩'透透气'。","EPD报警了，抓紧时间把工作一次性干完。","检修过程中纸衣不慎破损，立即暂停工作，联系辐射防护人员。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》黄线违章：未经RP许可和现场监护擅自打开辐射控制区边界（A）、在控制区擅自降低防护级别如脱下气面罩“透透气”（B）、EPD报警后未按要求及时离开工作地点继续作业（C），均属黄线违章。检修中纸衣不慎破损后立即暂停工作、联系辐射防护人员，正是防护用品失效后的正确处置，不属于违章，故选D。【易混点】防护用品破损属于“事件”，正确响应是停工+报告RP；隐瞒继续干才是违章。"},{"id":"safety_fsjx_0071","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下具有外照射防护功能的是（ ）。","options":["连体服","纸衣","气衣","铅衣"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：屏蔽服（铅衣、钨衣）用于外照射剂量率较高的工作环境，能衰减γ、X射线，降低人员受到的外照射剂量，是四个选项中唯一具有外照射防护功能的，故选D。不选A/B：连体服、纸衣仅防表面污染；不选C：气衣属供气式防护，防的是空气污染，也不防外照射。【易混点】常用防护用品按功能三分：铅衣防外照射，纸衣/橡胶手套/鞋套防表面污染，气衣/气面罩防空气污染。"},{"id":"safety_fsjx_0072","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于辐射防护原则的描述，正确的是：（ ）。","options":["正当性原则、最优化原则、个人剂量限制、自我防护原则","正当性原则、剂量最小化、辐射防护最优化、个人防护优先","实践的正当性、剂量分摊原则、辐射防护最小化、自我防护原则","实践的正当性、剂量最优化原则、时间防护、距离防护"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射防护四原则为正当性原则、最优化原则、个人剂量限制、自我防护原则，A为课件原表述。不选B/C：其中“剂量最小化”“剂量分摊”“辐射防护最小化”“个人防护优先”均非四原则的规范表述；不选D：时间防护、距离防护属于最优化（ALARA）之下的具体防护方法，不与四原则并列。【易混点】四原则可记为“正、优、限、自”；时间/距离/屏蔽/源项控制属外照射防护方法体系，注意层级不同。"},{"id":"safety_fsjx_0073","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"哪种情况不会引起放射性进入人体（ ）。","options":["在辐射控制区内进食","在有松散表面污染的工作现场摘下防护面罩","从辐射热点前快速通过","处理放射性液体时不戴手套"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：放射性物质进入人体的途径为食入、吸入、皮肤渗入和经裸露伤口进入。控制区内进食造成食入（A）；松散污染现场摘下防护面罩造成吸入（B）；处理放射性液体不戴手套可经皮肤或伤口进入（D）。从辐射热点前快速通过只受到外照射，人并未摄入或接触放射性物质，离开辐射场照射即停止，放射性不会进入人体，故选C。【易混点】外照射“人离照停”，内照射“放射性进体内持续照射”；快速通过辐射热点正是时间+距离防护的运用。"},{"id":"safety_fsjx_0074","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"能正常使用的脚手架上应该挂有什么颜色的标识牌？（ ）","options":["红色","黄色","蓝色","绿色"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：脚手架从搭设开始至拆除结束必须随时处于挂牌状态，标识牌分为红牌、绿牌和“从此上下”标牌。严禁使用挂红牌的脚手架；验收合格后方可挂绿牌，表示可以正常使用，故选D。不选A：红色表示禁止使用；不选B/C：黄色、蓝色均不属于脚手架标识牌体系。【易混点】严禁未经验收就挂绿牌；搭拆期间或临时中断搭设时挂红牌，上脚手架前第一件事就是看牌。"},{"id":"safety_fsjx_0075","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列关于高处作业的规定，错误的是（ ）。","options":["高处作业应使用检修平台、脚手架、梯子、升降平台等作为作业平台","必须由不少于2人共同进行，1人为监护人","高处作业隔离区应设置明显的警告标志","攀爬直梯、脚手架时应面向梯子并且四肢应始终保持与梯子有至少两点接触"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬时应面向爬梯并始终保持与爬梯三点接触状态（双手和双脚四点中的三点），“至少两点接触”不足以保证攀爬稳定，一旦剩余两接触点同时失效即坠落，D错误。A、B、C均正确：高处作业应使用检修平台、脚手架、梯子、升降平台等作为作业平台；必须由不少于2人共同进行并指定监护人；高处作业隔离区应设置明显警告标志。【易混点】“三点接触”是攀爬安全的黄金规则，且攀爬过程中手中不得持物。"},{"id":"safety_fsjx_0076","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下说法正确的是（ ）。","options":["使用吊篮前，应确认吊篮的门是向外开的","使用吊篮时，安全带可以挂在吊篮上","使用软梯时，软梯可以用铁丝固定","软梯使用时，同时间只能有一个工作人员上下"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：在软梯上只准同时一个人工作或上下，且必须使用速差器，D正确。不选A：临时吊篮需特别确认门是向内开的，不是向外开（防止人员和物料向外倾出）；不选B：使用吊篮时安全带应挂在吊钩上，禁止挂在吊篮或栓吊篮的钢丝绳上；不选C：软梯上端应用卸扣或穿钢管固定，严禁用铁丝固定。【易混点】吊篮安全带挂点=吊钩；软梯三要素=单人上下、速差器、卸扣/钢管固定。"},{"id":"safety_fsjx_0077","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下对于高处作业挂点的选择，错误的是（ ）。","options":["生命线","固定锚点","电缆线","钢结构的支架"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带挂点应选择牢靠、能承受坠落冲击力的物件，如生命线、固定锚点、钢结构支架等，A、B、D均可作为挂点。电缆线是非承重部件，受冲击会断裂或造成设备损坏，既承受不了坠落冲击力又会引发电缆事故，不能作为挂点，故选C。【易混点】挂点“三不选”：不牢固的物件、可移动的物体、受力会滑脱的部件；挂点还须尽量靠近作业位置，避免钟摆效应。"},{"id":"safety_fsjx_0078","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"高处作业必须由不少于（ ）人共同进行。","options":["1人","2人","3人","4人"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：任何人不得单独进行高处作业，必须由不少于2人共同进行，且现场必须指定人员履行监护职责，以便发生坠落等意外时能及时呼救和救援，故选B。不选A：单人作业无人监护，出事无人知晓，明令禁止；不选C/D：3人、4人当然允许，但“不少于”的最低门槛是2人。【易混点】“不少于2人+指定监护人”两个条件要同时满足；攀爬高度大于2米时还必须使用安全带。"},{"id":"safety_fsjx_0079","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于高处坠落的原因的是？（ ）","options":["人的不安全行为","物的不安全状态","管理漏洞","完善的管理制度"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处坠落事故发生的根本原因分为人的不安全行为、物的不安全状态和管理漏洞三类，A、B、C均在其列。完善的管理制度是预防高处坠落的保障，制度越完善事故越少，它恰恰是坠落的“反面”，不可能成为坠落原因，故选D。【易混点】“人、物、管理”三类致因框架适用于多数工业事故：未系安全带=人的不安全行为，平台有缺陷=物的不安全状态。"},{"id":"safety_fsjx_0080","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在攀爬脚手架的过程中，以下行为错误的是（ ）。","options":["攀爬过程中不得手中持物","攀爬过程中，背包应斜跨","攀爬过程中用手腕或前臂勾住爬梯横档也可以形成有效的第三点接触","攀爬过程中要注意路径上的障碍物"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬应保持三点接触，且第三点必须是用手握牢横档——用手腕或前臂“勾住”横档在打滑时根本抓不住，不能形成有效的第三点接触，C错误。A攀爬过程中不得手中持物、B背包应斜跨、D注意攀爬路径上的障碍物，均符合课件攀爬要求。【易混点】三点接触=双手双脚四点中的三点，且要“握牢”而非“勾住”；攀爬前应先观察路径、清除障碍。"},{"id":"safety_fsjx_0081","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在脚手架上工作时，以下说法错误的是（ ）。","options":["临边堆放物料时，应有防止物料掉落的防护措施","可以在下方无人时，向下抛掷轻、小的材料","工作使用扳手，应该使用防坠落绳","不能踩在脚手架钢管上工作"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：严禁将工具及材料上下抛掷，必须用绳系牢后传递——即使下方无人，抛掷物也可能弹跳、坠落伤及他人或砸坏设备，B错误。A临边堆放物料应有防止物料掉落的防护措施、C使用扳手等工具应系防坠落绳、D不能踩在脚手架钢管上工作，均为课件规定。【易混点】“下方无人就可以抛”是典型侥幸心理；正确做法是工具袋+传递绳，随身工具配防坠落绳。"},{"id":"safety_fsjx_0082","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于梯子的使用，以下不正确的是（ ）。","options":["作业人员使用梯子时，应一人作业一人扶持，禁止两人同时上下梯子","使用梯子进入高处平面（屋顶或平台）时，梯子应延伸到超出平面上方1米","可以站立在梯子顶部和高于梯子标明的最高站立平面以上的踏板上","使用软梯时应与速差器配套使用"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：不应站立在梯子顶部和高于梯子标明的最高站立平面以上的踏板上——重心超出梯子支撑范围，极易连人带梯倾翻，C错误。A使用梯子应一人作业一人扶持、禁止两人同时上下梯子；B用梯子进入高处平面（屋顶或平台）时，梯子应延伸到超出平面上方1米，便于扶靠跨出；D使用软梯时应与速差器配套使用，均符合课件规定。【易混点】“1米延伸量”和“最高站立平面”是梯子使用两个高频考点，勿混淆。"},{"id":"safety_fsjx_0083","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"根据《电业安全工作规程》，在没有脚手架或者在没有栏杆的脚手架上工作，高度超过（ ）米时，必须使用安全带，或采取其他可靠的安全措施。","options":["1米","1.5米","2米","2.5米"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：引用《电业安全工作规程》规定——在没有脚手架或者在没有栏杆的脚手架上工作时，高度超过1.5米，必须使用安全带或采取其他可靠的安全措施，故选B。不选A/C/D：1米、2米、2.5米均非该规程规定的系安全带门槛。【易混点】两个数字并存易混：《高处作业分级》定义高处作业用2米（距坠落高度基准面），无防护平台须系安全带用1.5米，后者要求更严。"},{"id":"safety_fsjx_0084","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"不属于高处作业的风险是：（ ）。","options":["人员从高处坠落","物体坠落，造成人员伤亡","人员缺氧窒息","物体坠落，造成设备损坏"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处作业的风险主要是人员从高处坠落造成人员伤亡，以及物体坠落造成人员伤亡或设备损坏，A、B、D均属高处作业风险。人员缺氧窒息是有限空间作业的典型风险，高处作业环境一般为开放大气环境，不存在缺氧问题，故选C。【易混点】若在密闭高处空间（如罐内脚手架）作业，会同时叠加高处坠落与有限空间缺氧两类风险，须双重管控。"},{"id":"safety_fsjx_0085","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"脚手架标识牌的红色标识牌是表示（ ）。","options":["禁止使用","根据提示使用","可以正常使用"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：脚手架标识牌分为红牌、绿牌和“从此上下”标牌；严禁使用挂红牌的脚手架——红牌表示脚手架正在搭拆、临时中断搭设或未经验收，禁止使用，故选A。绿牌表示验收合格、可正常使用；“根据提示使用”无此规定。【易混点】上脚手架前第一件事是看牌：红牌禁用、绿牌可用；牌色代表安全状态，不能凭脚手架新旧程度自行判断。"},{"id":"safety_fsjx_0086","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"挂点能承受坠落冲击力，应选择（ ）。","options":["不牢固的物件","可移动的物体","牢靠的物件","受力会滑脱的部件"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：挂点（锚点）必须能承受坠落时产生的冲击力，应选择牢靠的物件，如钢结构/支架、钢筋混凝土梁柱、生命线、固定锚点等，故选C。不选A：不牢固的物件在冲击下即脱开；不选B：可移动的物体会被拉翻，挂点与人一起坠落；不选D：受力会滑脱的部件（如边缘圆滑的结构）坠落瞬间挂点失效。【易混点】挂点四要素：能承冲击、牢靠、垂直下方有足够坠落净空、尽量靠近作业位置避免钟摆效应。"},{"id":"safety_fsjx_0087","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下面哪项不是可能导致高坠事故的发生的因素？（ ）。","options":["未佩戴（或未正确佩戴）安全带","使用不可靠立足点","使用有缺陷的登高平台","有效开展了安全交底"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：可能导致高坠事故的因素包括人的不安全行为（未佩戴或未正确佩戴安全带、使用不可靠立足点、使用有缺陷的登高平台等）、物的不安全状态和管理漏洞，A、B、C均属致因。有效开展安全交底使全员知晓风险与措施，是预防高坠的管理保障，不是事故致因，故选D。【易混点】区分“致因”与“对策”是本题题眼：凡降低风险的都是对策，不会“导致”事故。"},{"id":"safety_fsjx_0088","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下对于梯子的使用方法描述，错误的是（ ）。","options":["一人作业一人扶持","禁止两人同时上下梯子","人字梯可以将两腿合并在一起作为单梯使用","不应站立高于梯子规定或标明的踏板或踏棍上"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：折梯（人字梯）不应作为单梯使用或在合拢状态使用——人字梯两侧靠铰链连接，直立单用时结构不稳、极易倾倒，C错误。A一人作业一人扶持、B禁止两人同时上下梯子、D不应站立在高于梯子规定或标明的踏板/踏棍上，均为课件规定。【易混点】梯类作业通则：一人作业一人扶持、禁止两人同时在梯上、不站最高踏板；人字梯更不可合拢或斜靠当直梯用。"},{"id":"safety_fsjx_0089","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"进行攀登作业时，不可选用的防坠落用品是（ ）。","options":["安全带","速差器","自锁器","水平生命线"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀登作业可选用的防坠落用品有安全带（配合垂直挂点）、速差器（坠落时自动收绳制动）、自锁器（沿导轨/绳索滑动并锁定）等，A、B、C均可用于攀登防护。水平生命线是为高空水平移动和水平定点作业提供连续坠落防护的系统，人员沿其水平移动而非垂直攀登，不适用于攀登作业，故选D。【易混点】速差器应“高挂低用”、与垂直方向夹角不大于30°；5米及以上脚手架重复攀爬必须使用速差器。"},{"id":"safety_fsjx_0090","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"高处传递工具材料操作错误的是（ ）。","options":["应优先考虑使用安全绳传递工具包","当不具备条件必须背包攀爬时，工具包应背在背后攀爬","可以随意摆放","禁止攀爬时腋下夹物"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处传递工具材料应优先考虑使用安全绳传递工具包；当必须背包攀爬时，工具包应斜跨在背后；攀爬过程中不得手中持物或腋下夹物，A、B、D均正确。“可以随意摆放”工具材料既造成高处坠物风险又违反现场定置管理，属错误操作，故选C。【易混点】高处工具管理三板斧：用绳传递、工具系防坠落绳、工具包斜跨——杜绝抛掷和随意摆放。"},{"id":"safety_fsjx_0091","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"《高处作业分级》将距坠落高度基准面（ ）米以上有可能坠落的高处进行的作业，都称为高处作业。","options":["1米","2米或2米以上","3米","4米"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：引用《高处作业分级》规定，凡在距坠落高度基准面2米或2米以上有可能坠落的高处进行的作业，都称为高处作业，故选B。不选A/C/D：1米、3米、4米均非定义门槛。【易混点】“2米”是高处作业的定义门槛，但无防护平台1.5米以上就须系安全带（《电业安全工作规程》），两个数字常放在一起考。"},{"id":"safety_fsjx_0092","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下属高处作业安全管理要求，错误的有（ ）。","options":["对存在高空不可达、不易达等情况的设备作业，应组织现场评估并将安全措施落实在工单风险分析和预控措施中","吊顶上作业、设备上作业（超过2 米）、临时栅格板上作业等高处作业，必须搭建脚手架并使用安全带","开展高处作业时可以在无人监护情况下进行作业","对强度不足的作业面（如铁皮板、采光浪板、装饰板、吊顶等），人员在作业时，必须采取加强措施，以防踏空坠落"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：任何人不得单独进行高处作业，必须由不少于2人共同进行并指定人员履行监护职责，“无人监护情况下进行作业”直接违反该硬性规定，C错误。A对高空不可达、不易达设备作业应组织现场评估并将安全措施落实在工单风险分析和预控措施中；B吊顶上作业、设备上作业（超2米）、临时栅格板上作业必须搭脚手架并使用安全带；D强度不足的作业面须采取加强措施防踏空，均正确。【易混点】监护不是可有可无的“陪同”，而是高处作业成立的硬性条件。"},{"id":"safety_fsjx_0093","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"锚点又称为挂点，可承受坠落时产生的冲击力。下列关于挂点的说法错误的是（ ）。","options":["挂点能承受坠落冲击力，例如钢结构/支架、钢筋混凝土梁/柱、生命线、固定锚点","使用人员吊篮时，必须将安全带或速差器挂在起重机吊钩上","挂点垂直下方有足够的坠落净空，确保人员坠落后不接触地面与任何物体","挂点应尽量远离作业位置，以避免坠落发生时产生钟摆效应"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：挂点须尽量靠近作业位置，以避免坠落发生时产生钟摆效应——人坠落时会在挂点下方摆荡撞击结构物，D“尽量远离作业位置”恰好相反，错误。A挂点应能承受坠落冲击力（钢结构/支架、钢筋混凝土梁柱、生命线、固定锚点等）；B使用人员吊篮时必须将安全带或速差器挂在起重机吊钩上；C挂点垂直下方应有足够坠落净空，均正确。【易混点】挂点四要素：承冲击、近作业、有净空、不滑脱，考试常逐条设错。"},{"id":"safety_fsjx_0094","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于在安全带使用前检查内容的是（ ）。","options":["安全带生产厂商","织带缝合牢靠","在有效期内","搭扣工作良好"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带使用前应检查织带缝合是否牢靠、搭扣工作是否良好、是否在检验有效期内等直接关系当前安全状态的项目，并定期送检。生产厂商是谁并不反映安全带的当前安全状况，不属于使用前检查内容，故选A。【易混点】检查发现织带磨损、缝合开线、搭扣失灵或超期未检，应立即停用报废；使用中还要注意垂直净空和水平角度。"},{"id":"safety_fsjx_0095","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下哪项不满足速差器检查要求（ ）。","options":["在检验合格有效期内","冲坠指示器显示红色","钢丝绳完好，制动功能良好","外壳完好，无破损"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：速差器使用前应确认在检验合格有效期内、钢丝绳完好且制动功能良好（使用前试拉2-3下验证制动）、外壳完好无破损，A、C、D均满足要求。冲坠指示器显示红色说明速差器已承受过坠落冲击、触发过保护动作，按课件要求防坠落用品触发保护动作后应立即从工作场地移除报废，不得继续使用，故B不满足检查要求。【易混点】速差器“高挂低用”，与垂直方向夹角不得大于30°，安全带双钩不得都挂在速差器上。"},{"id":"safety_fsjx_0096","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下哪一项不属于起重作业特有风险：( )。","options":["吊物未绑扎牢；","起重指挥视线受阻；","吊物上放有可活动物体；","工作人员连续工作时间超过2小时。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重作业特有风险包括超负荷吊装、指挥信号不明确、视线受阻作业、吊物捆绑不牢、吊物上站人或放有可活动物体、吊装支脚不牢靠、吊物过人头顶等，A、B、C均属起重特有风险。工作人员连续工作时间超过2小时属通用的人因疲劳管理问题，不是起重作业特有风险，故选D。【易混点】疲劳本身会诱发指挥、司索失误而间接放大起重风险，但它属于所有作业的共性风险，而非“特有”。"},{"id":"safety_fsjx_0097","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下哪一项不属于起重作业风险：( )。","options":["吊物下站人；","起重过程中指挥全程不说话；","作业时气温低于零度；","台风天吊装设备。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊物下站人是典型起重违章风险（A）；起重过程中指挥全程不说话，等于指挥信号缺失、司机无从判断动作，属指挥信号不明确的风险（B）；“十不吊”规定六级以上大风或大雨、大雪、大雾等恶劣天气不吊，台风天吊装设备（D）明显违规。课件列举的起重作业风险因素中不包含“气温低于零度”，故选C。【易混点】恶劣天气吊装是“十不吊”常考点：大风、大雨、大雪、大雾等一律不吊。"},{"id":"safety_fsjx_0098","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于有眼螺栓使用说法错误的是：( )。","options":["无肩有眼螺栓增加垫片后可以当成有肩有眼螺栓进行使用；","如果有肩有眼螺栓没有100%接触到载荷表面，那它应当被当成是无肩的；","有肩的有眼螺栓不用于受力方向和肩所在平面夹角＜45°的角度；","使用有肩有眼螺栓时，提拉的角度应该沿着有眼螺栓平面。"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：无肩有眼螺栓只用于垂直起重，在有角度拉动时会弯曲或折断；垫片的作用是使未100%接触载荷表面的有肩螺栓达到完全接触（没有100%接触就应当成无肩的用），并不能把无肩螺栓变成可角向受力的有肩螺栓，A错误。B、C、D均为课件原文：有肩有眼螺栓没有100%接触载荷表面时应被当成无肩的；有肩有眼螺栓不用于受力方向与肩所在平面夹角<45°的角度；提拉角度应沿着有眼螺栓平面。【易混点】有眼螺栓角向使用三禁：夹角<45°不吊、无肩不角拉、肩未贴实不当有肩用。"},{"id":"safety_fsjx_0099","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于起重作业计划必须包含的内容是：( )。","options":["起重作业的监督人数；","吊装总重量；","起重设备能力；","起重过程中的风险和风险解决措施；"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊装作业计划应包括吊装总重量（负荷重量和吊装器具总重）、负荷的重心、起重设备能力、所需索具清单（名称和规格）、吊装路径草图和负荷下放区域、查找并解决潜在干扰等内容，B、C、D均在其中。起重作业的监督人数不是作业计划必须包含的内容，故选A。【易混点】“吊装总重量=负荷重量+吊装器具总重”，做计划别漏算吊具自重；风险及解决方案在工前会中讨论落实。"},{"id":"safety_fsjx_0100","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于起重吊装作业工前会的说法错误的是：( )。","options":["所有起重吊装工前会上都要确保所有参与人员都取得了起重作业特种作业证书；","工前会上要明确司机和指挥的交流方法；","工前会上要讨论起重作业风险和解决方案；","工前会上要讨论以往的经验反馈；"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重指挥、起重司机属特种设备作业人员，须取得特种设备作业人员证；非特种岗位的参与人员经公司专业培训并考核通过后即可参加起重吊装作业，并非所有参与人员都要取得特种作业证书，A错误。B工前会上明确司机和指挥的交流方法（手语、无线电、语音命令）、C讨论起重作业风险和解决方案、D讨论以往经验反馈，均为工前会应有内容。【易混点】特种作业证针对“指挥、司机”等持证岗位，与一般参与人员的公司内部培训考核是两回事。"},{"id":"safety_fsjx_0101","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于吊带和吊钩使用说法错误的是：( )。","options":["两根吊带作业时，应将两根吊带直接挂入双钩内，吊带各挂在双钩对称受力中心位置；","四根吊带使用时，每两根吊带直接挂入双钩内，注意钩内吊带不能产生重叠和相互挤压；","吊带使用时，仅在吊钩上可以打结，其它地方都不能打结；","吊钩的选择应考虑配合使用的吊带的宽度。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊带使用时不允许将吊带在吊钩上打结，吊装作业中吊带不允许交叉、扭转、打结、打拧——打结会急剧降低吊带强度并造成局部磨损，故“仅在吊钩上可以打结”错误，选C。A两根吊带直接挂入双钩内、各挂在双钩对称受力中心位置；B四根吊带每两根挂入双钩且钩内吊带不能重叠和相互挤压；D吊钩选择应考虑配合使用的吊带宽度，均正确。【易混点】吊带“四不准”：不交叉、不扭转、不打结、不打拧。"},{"id":"safety_fsjx_0102","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于吊带使用说法错误的是：( )。","options":["吊带在使用时，可以进行交叉；","当吊装物有锋利的边时，可用一保护衬(护套、护角)置于吊带和被吊物之间；","吊带安装在吊钩上时，吊带两边张开角度不能超过120°；","使用吊带吊管类物体时吊装角度不能过大。"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：在吊装作业中，吊带不允许交叉、扭转，不允许打结、打拧——交叉会使吊带相互切割磨损并造成载荷受力不均，A错误。B当吊装物有锋利的边时，应用保护衬（护套、护角）置于吊带和被吊物之间；C吊带安装在吊钩上时两边张开角度不能超过120°；D吊管类物体时吊装角度不能过大，均为课件要求。【易混点】120°是吊装夹角的通用红线（吊带张开角、卸扣两支腿夹角均适用），角度越大单肢受力越大。"},{"id":"safety_fsjx_0103","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于起重设备的检查的说法错误的是：( )。","options":["属于特种设备的起重设备应进行定期检验；","普通的手拉葫芦不需要定期检验，使用前进行外观检查即可；","吊带定期检验完应在明显的地方进行标识；","所有起重用的吊具和索具在使用前均应进行外观完好性检查；"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重机、手拉葫芦、吊带、吊链等起重设备和吊具索具都应进行定期检验，使用前需检查确保在检验/检定/检查有效期内，并非“手拉葫芦不需要定期检验、外观检查即可”，B错误。A特种设备应定期检验、C吊带定期检验后在明显的地方进行标识、D所有吊具和索具使用前进行外观完好性检查，均符合课件要求。【易混点】“定期检验+使用前外观检查”两道关缺一不可：定检保证资质状态，日检保证当次完好。"},{"id":"safety_fsjx_0104","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于起重吊装作业区域管理要求的说法错误的是：( )。","options":["起重作业前应建立合理的隔离区域，并进行明显的隔断；","吊装区域应合理规划并提前进行清理；","吊装路径上可以停放私人轿车；","吊装区域应有人负责边界管控；"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重作业前应建立合理的隔离区域并进行明显隔断，安排专人负责边界管控；吊装区域应合理规划并提前清理，确保吊物下方没有人员和影响吊装安全的物品。在吊装路径上停放私人轿车，既侵入吊装区域又可能被坠物砸损、引发次生事件，明显违反区域管理要求，故选C。【易混点】吊装区域管控三件事：划区域、清场地、守边界；所有非必要人员应撤离吊装区域直至吊装结束。"},{"id":"safety_fsjx_0105","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于起重吊装作业的是：( )。","options":["使用汽车吊移动集装箱；","使用手拉葫芦移动电机；","龙门吊车吊装试运转；","使用推车移动设备。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重吊装作业指使用专门的起重设备吊运载荷的活动，包括载荷的起吊、上升、空中移动、下降、落位等环节。使用推车移动设备是水平搬运，不涉及起吊和吊运，不属于起重吊装作业，故选D。A汽车吊移动集装箱、B手拉葫芦移动电机、C龙门吊车吊装试运转，都使用了起重设备吊运载荷。【易混点】判断标准就一条：是否用起重设备把载荷“吊起来运”，水平推运不算。"},{"id":"safety_fsjx_0106","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下说法正确的是：( )。","options":["U型卸扣在使用时，如有两根吊索，两边吊索的夹角应不得超过120°；","U型卸扣在与钢丝绳或吊带配合使用时，横销可以与其活动部分连接；","如果在一个吊物上使用两个吊索，要确保两个吊索眼是在负荷的相同的方向；","吊带的颜色仅用于区分吊带的种类，无法用于判断其载荷能力。"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：U型卸扣设计用于垂直方向的提升，随着提升角度减小负重限值降低，通常两支腿之间的夹角最大不得超过120°，A正确。不选B：卸扣与钢丝绳索具配合使用时，横销应与钢丝绳锁眼连接，若横销连接活动部分，起吊摩擦会使横销转动、从扣体脱出；不选C：在一个吊物上使用两个吊索时，两个吊索眼应位于负荷相反的方向；不选D：吊带通常以颜色和标签表示其垂直承载能力。【易混点】卸扣使用要点：横销连锁眼、作用力沿卸扣中心线轴线、避免弯曲和不稳定载荷。"},{"id":"safety_fsjx_0107","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于'十不吊'的是：( )。","options":["指挥信号不明或违章指挥不吊；","超负荷不吊；","工件或吊物捆绑不牢不吊；","安全监督人员不到位不吊；"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：“十不吊”第1～3条即“指挥信号不明或违章指挥不吊”“超负荷不吊”“工件或吊物捆绑不牢不吊”，A、B、C均在其中。不选D：十不吊针对的是吊装作业自身的安全条件（信号、负荷、捆绑、吊物状态、天气等），“安全监督人员不到位不吊”并非其中条款。故答案为D。【易混点】十不吊其余条款还包括：吊物上有人或活动部件不吊、安全装置不齐全或动作不灵敏失效不吊、工件埋在地下或有钩挂不吊、棱角物项无防切割措施不吊、斜拉歪拽不吊、六级以上大风或大雨大雪大雾等恶劣天气不吊。"},{"id":"safety_fsjx_0108","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于'十不吊'的是：( )。","options":["吊物上有人或活动部件不吊；","安全装置不齐全或动作不灵敏、失效不吊；","未到开工时间不吊；","工件埋在地下、与地面建筑物或设备有钩挂不吊；"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：“十不吊”第4条“吊物上有人或活动部件不吊”、第5条“安全装置不齐全或动作不灵敏、失效不吊”、第6条“工件埋在地下、与地面建筑物或设备有钩挂不吊”，A、B、D均在其中。不选C：吊装能否进行取决于指挥信号和现场安全条件，“未到开工时间”不在十不吊之列。故答案为C。【易混点】十不吊中与视线、天气相关的是“吊物重量不明，光线阴暗视线不清不吊”和“六级以上大风或大雨、大雪、大雾等恶劣天气不吊”。"},{"id":"safety_fsjx_0109","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"空气过滤呼吸器的缺点是防护因子较低。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：空气过滤呼吸器的优点是操作简单、移动方便；缺点是防护因子较低、运行时处于负压模式、戴上后感觉较热不舒适且容易形成雾气。“防护因子较低”确为其缺点，故说法正确。易被误导处：防护因子低不等于不能用，一般空气污染作业仍可使用，但在缺氧环境或IDLH环境（对生命和健康有立即威胁的环境）中严禁使用，只能使用自给式呼吸器。【易混点】自给式呼吸器防护因子高达10000，是唯一可在IDLH环境中使用、也是唯一可用于情况不明环境急救的呼吸装备。"},{"id":"safety_fsjx_0110","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"佩戴呼吸器可以有效限制放射性物质的吸入。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：气载污染物进入人体有呼吸吸入、食入、皮肤进入和裸露伤口进入四种途径，使用呼吸器正是为了限制放射性气体污染物的吸入，故说法正确。易被误导处：呼吸器只切断“吸入”这一条途径，不能阻止食入或经皮肤、伤口进入，各项防护措施须配合使用；且是否穿戴呼吸器需经评价——穿戴会降低效率、延长工时，可能反而增加总受照剂量。【易混点】呼吸吸入之外的三种途径，分别靠禁食禁烟、穿戴防护用品和伤口防护来切断。"},{"id":"safety_fsjx_0111","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在进行可能存在放射性气体的辐射工作时，必须穿戴呼吸器。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：在辐射控制区工作是否穿戴呼吸器需要进行评价，因为穿戴呼吸器会影响工作效率、延长工作时间，进而增加受照剂量。课件举例：剂量率1mSv/h的工作，穿戴呼吸器总剂量1.5mSv，不穿戴仅1.1mSv，此情况不推荐穿戴。故并非“必须”一律穿戴，说法错误。易被误导处：评价原则不适用于缺氧或IDLH环境，此类环境必须使用自给式呼吸器。【易混点】ALARA要求总剂量（内照射＋外照射）合理可行尽量低，穿戴呼吸器不一定能降低总剂量。"},{"id":"safety_fsjx_0112","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"防护因子越高，呼吸器防护有害物质的能力越高。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：防护因子是一个正常运转的呼吸器在正确安装、正确使用下能达到的防护标准水平，通过比较呼吸器内外空气成分确定。防护因子越高，呼吸器防护有害物质的能力越高，故说法正确。课件举例：呼吸器外微粒100个单元、内部1个单元，防护因子即为100，佩戴者只吸入外部微粒的1%。易被误导处：防护因子以“正确安装、正确使用”为前提，密封不良时实际防护效果会大打折扣。【易混点】空气过滤呼吸器防护因子较低，自给式呼吸器防护因子可达10000。"},{"id":"safety_fsjx_0113","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用呼吸器可能会影响工作人员之间的交流。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：受呼吸器影响，工作人员相互之间无法看清对方的面孔，也无法使用唇部动作等进行辅助交流，确实会影响交流，故说法正确。课件建议：放慢语速、使用三向式交流，确保信息正确传递；有些电厂使用喉部扩音器等外部设备辅助。易被误导处：交流受限本身就是呼吸器使用中的常见问题之一，作业前应在工前会中明确交流方式。【易混点】使用呼吸器时视线也受限，需特别小心工作区域的障碍物或坑洞，镜罩还容易结雾。"},{"id":"safety_fsjx_0114","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"可供应呼吸空气的呼吸器，因为都是通外部空气，因此防护因子是相同的。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：可供应呼吸空气的呼吸器从可控气源获得呼吸用空气，型式有自给式呼吸器、气面罩、气衣等，每一类工作方式不同，并有不同的防护因子（如自给式呼吸器防护因子可达10000）。“防护因子相同”说法错误。易被误导处：同属“可供呼吸空气”类别不代表防护水平一致，选型时须按污染风险匹配相应防护因子。【易混点】气面罩、气衣防护因子较高，还能对面部冷却、视线无死区，但存在移动限制、安装时间长、噪声等缺点。"},{"id":"safety_fsjx_0115","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"隐形眼镜是允许在呼吸器内使用的。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：软的眼镜或隐形眼镜可以在呼吸器内使用，但需要通过密封性试验，故隐形眼镜允许使用的说法正确。易被误导处：有框眼镜一般情况下不允许佩戴，因其会影响呼吸器密封，需要时应使用特殊的眼镜套件；且佩戴隐形眼镜时连续气流可能导致眼睛干燥，须加以注意。【易混点】假牙也会影响密封：密封性试验时嘴里有假牙，实际工作中也必须戴，否则下巴扭曲可能导致密封泄漏。"},{"id":"safety_fsjx_0116","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在使用呼吸器期间，如果感觉恶心或者头晕，应立即离开工作区域，并取下呼吸器。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》应急处置：使用呼吸器可能出现交流障碍、异味（过滤器失效）、泄漏、呼吸困难、恶心或头晕等问题征兆，如果出现上述征兆或需要取下呼吸器，应迅速离开该区域。故感觉恶心或头晕时应立即离开工作区域，说法正确。易被误导处：这些征兆可能意味着过滤器失效或供气异常，带病坚持作业会危及生命，撤离才是第一位的。【易混点】若突然出现呼吸器失效或身体不适，还应迅速摘下呼吸器、尽快返回安全区域，并通知电站相关人员。"},{"id":"safety_fsjx_0117","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"如果突然出现呼吸器失效或身体不适，迅速摘下呼吸器，尽快返回到安全区域，并通知电站相关人员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》应急处置原文要求：如果突然出现呼吸器失效或身体不适，请迅速摘下呼吸器，尽快返回到安全区域，并通知电站相关人员。题干表述与课件完全一致，故说法正确。易被误导处：有人担心摘下呼吸器会吸入污染物，但在呼吸器已失效或身体严重不适的情况下，继续使用故障呼吸器停留现场风险更大，应先摘除并尽快撤离。【易混点】通知电站相关人员是处置流程的重要环节，便于电厂及时对事件和现场进行调查处置。"},{"id":"safety_fsjx_0118","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"只要空气过滤呼吸器面罩的气密性没问题，那么其上的呼吸器罐/盒就可以一直使用。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：空气过滤呼吸器依靠呼吸器罐/盒内的过滤器或化学吸附剂净化空气，使用中的常见问题之一就是异味（过滤器失效）。罐/盒的过滤和吸附能力有限、有使用寿命，并非面罩气密性完好就可以一直使用，故说法错误。易被误导处：面罩气密性只解决“外部空气不从密封处漏入”的问题，净化能力取决于罐/盒，两者是不同的检查项目。【易混点】使用中若出现异味，说明过滤器可能失效，应按应急处置要求迅速离开该区域。"},{"id":"safety_fsjx_0119","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"呼吸器在使用前需要打开呼气阀门外罩进而检查呼气阀门是否安装正确。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》检查步骤：打开呼气阀门外罩，确认呼气阀门安装正确、没有裂缝或细缝；确认隔膜没有卡住；再重新装上外罩并确认正确安装。故使用前须打开呼气阀门外罩检查，说法正确。易被误导处：呼气阀检查尤为关键——外界物质可能堵塞呼气阀而使阀门无法关闭，导致污染物进入呼吸器与新空气混合。【易混点】若检查中发现呼吸器损坏，应退回发放点并告知相关人员，不得带故障使用。"},{"id":"safety_fsjx_0120","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"空气过滤呼吸器主要的净化能力来自于面罩上的呼吸器罐/盒。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：对于空气污染物，空气过滤呼吸器使用活性炭过滤器过滤污染物，或用化学方法去除气体和蒸汽；呼吸器罐/盒内部带过滤器或化学吸附剂（或两者均有），主要净化能力确实来自罐/盒，故说法正确。易被误导处：面罩本身只负责密封和隔离，不承担净化功能，罐/盒一旦失效则整个呼吸器失去防护作用。【易混点】高效过滤器仅能过滤微粒（对直径≥0.3微米的微粒过滤99.79%），无法过滤毒气和蒸汽，存在此类有害气体时须使用针对工作区有害物质的特殊过滤器。"},{"id":"safety_fsjx_0121","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在辐射控制区进行切割或者打磨活动可能会产生放射性的气载污染。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：“带有放射性阀门或设备的切割、研磨”是可能产生空气污染的情形之一；课件《放射性呼吸防护》也指出研磨、焊接和打磨等生产活动会产生气体微粒和烟气。故在辐射控制区进行切割或打磨可能产生放射性气载污染，说法正确。易被误导处：除切割研磨外，松散表面污染的再悬浮、用压缩空气或高压水枪吹洗受污染设备和地面、放射性液体的泄漏飞溅等同样会产生空气污染。【易混点】此类作业的防护分两个层次：集体防护设负压工作棚（SAS），个人防护佩戴呼吸防护用品。"},{"id":"safety_fsjx_0122","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"可供应呼吸空气的呼吸器优点是呼吸器戴上或脱下操作简单。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：“操作简单、移动方便”是空气过滤呼吸器的优点；可供应呼吸空气的呼吸器（气面罩、气衣等）存在移动限制、安装时间长、噪声等缺点，气衣还必须由现场服务人员协助脱除、严禁自行脱除。故“戴上或脱下操作简单”不是其优点，说法错误。易被误导处：气面罩一般可自行穿脱，仅特殊情况下脱除时需寻求协助，但这类呼吸器整体上以安装费时、移动受限为主要短板。【易混点】气面罩、气衣的优点是防护因子较高、最大程度限制放射性微粒和气体的吸入、对面部冷却、视线无死区。"},{"id":"safety_fsjx_0123","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用呼吸器不会影响视线和视野。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：使用呼吸器时由于视线的限制，工作时要特别小心工作区域是否有障碍物或坑洞；镜罩容易结雾也是使用中较大的问题，常在镜罩内部使用防雾化合物解决，某些呼吸器使用鼻罩来减少雾化。故“不会影响视线和视野”说法错误。易被误导处：不要以为当时视野清晰就放松警惕，结雾和面罩边框造成的视线死角始终存在，作业前应先确认脚下及周围环境。【易混点】视线受限与环境障碍物叠加，是呼吸器作业中人员摔倒、坠落的重要诱因。"},{"id":"safety_fsjx_0124","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"气载放射性污染物主要对人体产生伤害的途径是外照射。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：气载放射性微粒能够释放射线，如果微粒和气体被吸入体内，放射性辐射将长期存在体内，对肺或其它器官产生内照射剂量（其大小按核素半衰期和生物半排期确定）。故气载放射性污染物的主要伤害途径是内照射而非外照射，说法错误。易被误导处：微粒“能够释放射线”易让人联想到外照射，但关键在于被吸入后放射性物质在体内持续照射，直到排出体外或衰变完。【易混点】α射线穿透力最差、一张纸即可屏蔽，一般只考虑其内照射危害，但它进入体内后可对敏感器官造成很大剂量。"},{"id":"safety_fsjx_0125","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"若作业人员进入电缆沟、管沟开展作业，电缆沟、管沟的盖板未完全开启，则按照密闭空间作业进行风险控制。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：管沟、管道属非典型有限空间，若进入沟道区域盖板未完全开启，即人员进出活动受限、自然通风不良，则进入电缆沟、管沟开展作业应按照有限空间（密闭空间）作业进行风险控制，故说法正确。易被误导处：电缆沟、管沟平时敞开巡视并不属于有限空间，是否按密闭空间管理取决于盖板开启程度和通风、进出条件。【易混点】若盖板已完全开启、无窒息淹溺中毒等风险且气体检测合格，做好临边防护、充分自然通风后即可进入，不按有限空间作业管理。"},{"id":"safety_fsjx_0126","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"对于只有执行调试、维修相关作业时才允许人员进入的密闭空间（如：需打开人孔门），由工作组在密闭空间外设置临时警示标识牌。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：人员可直接进入的有限空间（如入口盖板可随时打开），出入口设置永久性警示标识牌；对于只有执行调试、维修相关作业时才允许人员进入的有限空间（系统隔离或打开人孔门），由工作组在有限空间外设置有限空间作业安全风险告知牌。题干所述即这种临时警示标识的设置要求，故说法正确。易被误导处：临时告知牌由工作组负责设置，随作业开始而设、作业结束而撤，不是永久设施。【易混点】辨识有限空间的另一方法是查阅《有限空间环境清单》；清单未列但需进入时，工作负责人应中止工作，待风险控制措施满足要求后方可开展。"},{"id":"safety_fsjx_0127","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"密闭空间作业应当严格遵守'先通风、再检测、后作业'的原则。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有限空间作业的基本原则即“先通风、再检测、后作业”，进入前先通风，再经测氧、测爆、测毒、测温合格后方可作业，故说法正确。易被误导处：检测也不是一劳永逸，工作中还需定期或持续监测，对作业人员活动区域应实时监测并每15分钟记录1个瞬时值。【易混点】课件开篇的进水隧洞中毒事件，正是未通风条件下长时间使用燃油发电机、有毒气体积聚且检测频率不足所致。"},{"id":"safety_fsjx_0128","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在密闭空间入口处建立作业隔离区，设置警示标识，防止未经授权人员与无关人员进入，出入口可以放工器具。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：应在有限空间入口处建立作业隔离区，设置警示标识，防止未经授权人员与无关人员进入，但出入口不准堆积任何物品。故“出入口可以放工器具”说法错误。易被误导处：出入口是人员进出和应急撤离的生命通道，也是应急救援的必经之路，堆放物品会阻碍逃生和救援。【易混点】作业前工作负责人/监护人还应提前准备好人员出入登记表、气体测量记录表、《工作许可》等文件，并放置在有限空间入口处。"},{"id":"safety_fsjx_0129","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"为防止密闭空间易燃气体形成有爆炸性的混合物，可用惰性气体（例如氮气或二氧化碳）置换的方式。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：对存在或可能发生有害气体残留物质的有限空间，应采取通风/净化措施消除或控制有害因素，方式包括水蒸气清洁、惰性气体清洗、强制通风。用氮气、二氧化碳等惰性气体置换易燃气体、防止形成爆炸性混合物，符合课件要求，故说法正确。易被误导处：置换后仍须检测确认合格方可进入，不能仅凭“已经置换过”就省略检测环节。【易混点】测爆要求可燃气体浓度低于爆炸下限的10%；对油箱、油罐的检修，则必须低于爆炸下限的1%。"},{"id":"safety_fsjx_0130","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"监测时气体采样点应有代表性，较大、较深、较复杂的密闭空间，可能存在气体分层现象，应采取上、中、下各部位取样检测，保证气体检测能够涵盖整个密闭空间（如：可采用长杆工具、吊绳等将检测仪表放置于采样点）。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》检测方法：检测应从入口开始、沿人员进入方向进行，竖直方向由上至下，且竖直方向检测点数量不应少于3个，上、下检测点距有限空间顶部和底部均不超过1米，检测点之间不超过8米，以保证检测覆盖整个有限空间。故对较大、较深、可能存在气体分层的密闭空间上、中、下各部位取样检测的做法正确。易被误导处：只在入口处测一下并不能代表空间深处，气体分层（如重气体积于底部）可能造成漏检。【易混点】检测人员应在有限空间外上风侧使用泵吸式气体检测报警仪，至少检测氧气、可燃气体、硫化氢和一氧化碳。"},{"id":"safety_fsjx_0131","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"若作业人员进入电缆沟、管沟开展作业，电缆沟、管沟的盖板已完全开启，且无窒息、淹溺、中毒等风险且仪表测量气体合格时，作业人员需做好临边防护，待充分自然通风后，可进入开展作业，不按照密闭空间作业进行管理。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：管沟类仅在盖板未完全开启、人员进出活动受限、自然通风不良时按有限空间作业管理；盖板已完全开启、无窒息淹溺中毒等风险且仪表测量气体合格时，已不具备有限空间特征，做好临边防护、待充分自然通风后即可进入作业，不按密闭空间作业管理，故说法正确。易被误导处：“不按密闭空间管理”是有严格前提的，若任一条件不满足（如盖板只开一部分），仍须按有限空间作业管控。【易混点】盖板打开后开口四周存在坠落风险，应设防护栏杆并与警示标识配合使用。"},{"id":"safety_fsjx_0132","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"打开密闭空间上部的入口盖板时，必须做好防止人员、物项坠落的措施（如：预先设置防护围栏、佩戴安全带、使用工器具防坠落绳等），盖板移除后的开口处应立即用临时围栏进行防护，以防止人员跌落。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：打开有限空间上部的入口盖板时，必须做好防止人员、物项坠落的措施。盖板移除后的开口处立即用临时围栏进行防护、防止人员跌落，正是课件要求的具体落实，故说法正确。易被误导处：防坠落措施不只针对作业人员，物项坠落砸伤空间内人员同样致命，工具也应采取防坠落措施。【易混点】进入开口向上的有限空间（井、坑、池等）作业，人员必须穿戴全身式安全带并配套救援三脚架，还须系好安全绳，绳端握在监护人手中。"},{"id":"safety_fsjx_0133","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"密闭空间内的有毒有害物质的来源很多，有可能是原来空间内盛装的气体或液体，也有可能来自作业过程中产生的有毒有害物质（例如焊接与切割），还有可能来自相邻房间/设备产生的有毒有害气体进入该受限空间，因此在作业前的风险辨识阶段要充分考虑到各种来源。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有毒气体的来源包括三类——储存在有限空间的物品（原来盛装的气体或液体、墙壁吸附物质、材料淤泥分解变质）、有限空间内的作业（焊接、切割、喷漆、喷砂防腐）、有限空间附近的区域（相邻房间/设备产生的有毒有害气体进入）。故作业前风险辨识应充分考虑各种来源，说法正确。易被误导处：最易忽视的是第三类——本空间明明干净，相邻区域的有毒气体却可能窜入。【易混点】若怀疑有毒气体存在，应联系工作负责人对有限空间大气进行评估，并查看电厂的潜在有毒气体清单。"},{"id":"safety_fsjx_0134","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"当密闭空间内的有毒有害物质浓度大于《有毒有害气体接触限值》的规定值，或氧气含量超出允许范围时，应当采取机械通风措施。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：测毒要求有毒气体浓度低于《有毒有害气体接触限值》的规定值，测氧要求氧含量在19.5%～23.5%之间；对存在或可能发生有害气体残留物质的有限空间，应采取通风/净化措施消除或控制有害因素。故浓度超标或氧含量超出允许范围时应采取机械通风措施，说法正确。易被误导处：若经通风/净化后有毒有害物质浓度仍超标或缺氧，则不能进入，应佩戴呼吸防护用品。【易混点】经过机械通风、作业区域气体质量稳定后，可携带逃生呼吸器备用进入。"},{"id":"safety_fsjx_0135","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"强制通风应使用洁净的空气，也可通入氧气。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》通风要求：强制通风应使用洁净的空气，严禁通入氧气。故“也可通入氧气”说法错误。易被误导处：有人以为通氧能“改善缺氧”，实际氧含量超过23.5%即形成富氧环境，易引起火灾并使人头昏眼花、失去方向感，风险比缺氧更隐蔽。【易混点】通风管布置有讲究：有限空间仅有1个出入口时，应将风管置于空间底部（不接触底面）；有2个及以上出入口时，应在临近作业人处送风、远离处排风。"},{"id":"safety_fsjx_0136","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射工作人员的全身剂量包括内照射剂量和外照射剂量的总和。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》个人剂量限制：剂量限值是针对内、外照射的总剂量，总剂量＝外照射剂量＋内照射剂量。辐射工作人员的全身剂量即为两者之和，故说法正确。易被误导处：只盯着EPD读数（外照射）并不能代表全部受照，吸入、食入放射性物质造成的内照射剂量同样计入总量。【易混点】剂量限值不适用于医疗照射和天然本底照射；现行标准为任何一年不超过50mSv、连续5年平均不超过20mSv。"},{"id":"safety_fsjx_0137","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"所有在辐射控制区内进行的辐射工作必须办理《辐射工作许可证》。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：辐射工作许可证（RWP）是核电厂为审核和批准任何需要特殊辐射防护措施的运行、维修、检查、试验等活动的书面文件，在核电厂一般情况下所有辐射工作都需要办理RWP，故说法正确。易被误导处：RWP与RP证不同——RP证是人员资质授权（进入控制区必须持有），RWP是对具体工作任务的审批，两者缺一不可。【易混点】辐射工作人员不得从事超出RWP规定作业范围的辐射工作，否则必须办理RWP变更或重新申请办理。"},{"id":"safety_fsjx_0138","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"放射性物品存放点内高、低剂量率物品可以混合存放在一起。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：课件《辐射防护(共性)》仅介绍放射性物品存放点标识牌（提示存放场所辐射风险），未涉及高低剂量率物品的存放要求。按辐射防护最优化（ALARA）原则推断：高、低剂量率物品应分开存放，混合存放会使高剂量率物品抬高整个存放区域的剂量率水平，人员存取低剂量率物品时受到不必要的照射，故说法错误。易被误导处：同属放射性物品不等于可以集中混放，分区分类存放正是控制受照剂量的基本手段。【易混点】存放点标识牌通常张贴在放射性物品存放区域附近，人员接近前应关注其提示信息。"},{"id":"safety_fsjx_0139","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"污染隔离区可以随意摸脸、擦汗、扶眼睛等触碰颈部以上暴露部位。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：禁止在污染区内直接摸脸、擦汗等行为，作业过程中不要戴手套直接接触颈部以上暴露部位，食入防护也要求工作时不用手触摸面部。故污染隔离区内不可随意摸脸、擦汗、扶眼镜，说法错误。易被误导处：手套本身可能已沾污，用手套推眼镜、拉口罩、擦汗会把污染转移到面部，课件案例中就有人员未脱手套拉扯口罩触摸面部，导致面部沾污约9.3Bq/cm²。【易混点】面部（颈部以上）一旦沾污，禁止自行去污，必须通知辐射防护人员，由专业去污人员处理。"},{"id":"safety_fsjx_0140","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"放射性货包运输人员在厂区运输期间不用佩带个人剂量计。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：课件《辐射防护(共性)》未专门讲述放射性货包运输的剂量监测要求。但课件明确“从事辐射工作，未按规定进行个人剂量监测”属于辐射防护黄线违章；运输放射性货包属于辐射工作，运输人员应与其他辐射工作人员一样佩戴个人剂量计接受剂量监测，故“不用佩带”说法错误。易被误导处：运输时间短、与货包有一定距离不代表可以免除监测，个人剂量监测是辐射工作的法定要求。【易混点】进入辐射控制区前须在卫生出入口领取并激活剂量计，EPD、TLD应佩戴在连体服左胸口袋内。"},{"id":"safety_fsjx_0141","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区内没有饮水的地方，工作人员可以自行带水。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：“在辐射控制区内喝水或进食”属于辐射防护黄线违章；食入防护明确禁止在辐射控制区吃、喝或吸烟，以防止放射性物质经食入途径进入人体。故即使控制区内没有饮水的地方，也不允许自行带水进入，说法错误。易被误导处：以“控制区没有水”为由带水饮用并不成立，确需饮水应退出控制区后进行。【易混点】食入防护还要求工作时不用手触摸面部、工作结束洗手。"},{"id":"safety_fsjx_0142","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在辐射控制区内执行与当前辐射工作许可证无关的另外一项工作前，须进行辐射工作许可证切换。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》RWP使用注意事项：辐射工作人员不得从事超出RWP规定作业范围的辐射工作，否则必须办理RWP变更或重新申请办理。在辐射控制区内执行与当前许可证无关的另一项工作，即属超出许可范围，须先行办理许可证切换（变更或重新申请），故说法正确。易被误导处：不能以“顺便干一下”“工作量小”为由，借用当前RWP从事无关工作。【易混点】工作过程中若发现实际辐射水平超出RWP预估值，或预期的安全措施未建立、无效，应立即停止工作、撤离现场并报告。"},{"id":"safety_fsjx_0143","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射生物效应按照剂量与效应关系可以分为确定性效应和随机性效应。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：辐射对生物体的危害主要表现为确定性效应和随机性效应两类，即按剂量与效应关系分为这两类，故说法正确。易被误导处：两者的判定标准不同——确定性效应严重程度随剂量增加而增加且存在阈值；随机性效应发生几率与剂量有关、严重程度与剂量无关且无阈值，不能混为一谈。【易混点】核电厂正常工作中涉及的辐射生物效应主要是随机性效应，正常电厂活动的剂量水平不会导致确定性效应。"},{"id":"safety_fsjx_0144","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"松散污染隔离区中的物品必须经过污染检测合格后才能带出隔离区。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：松散污染可以去除、容易转移、极易扩散，必须加以控制；同时物品必须通过测量后方可带出控制区。故松散污染隔离区中的物品须经污染检测合格后才能带出，以防污染扩散，说法正确。易被误导处：物品外观“看起来干净”不等于无污染，表面污染无法目视判断，必须经仪表测量。【易混点】随身小件物品须经过小件物品测量仪（CPO）测量；物品过大无法放入CPO时，需办理申请经辐射控制区边界门运出。"},{"id":"safety_fsjx_0145","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射热点信息牌挂设在设备或管道等存在辐射热点的位置，热点快速通过标牌在热点信息牌附近，以提醒人员快速通过热点区域，避免在该处无故停留，从而减少人员因热点而受到的照射。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：热点警告牌通常挂设在热点（如高剂量率管道）附近，用以表明热点信息、提示工作人员注意，禁止在此区域停留。热点快速通过标牌挂设在热点信息牌附近，提醒人员快速通过、避免无故停留，从而减少因热点受到的照射，故说法正确。易被误导处：热点附近不只不能停留，还应避免在此讨论问题、查看规程，这些活动应在低剂量等待区进行。【易混点】热点信息牌与区域辐射水平信息牌不同，后者设在复杂区域主要入口，提供区域内更详细、具体的辐射水平信息。"},{"id":"safety_fsjx_0146","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"所有非放射性物品出辐射控制区必须经过辐射和污染确认，物品如果能够过小件物品监测仪测量，无报警，则可认为是非放射性物品。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：物品必须通过测量后方可带出控制区，随身携带的小件物品（如文件袋、笔、剂量计、辐射仪表等）须经过小件物品测量仪（CPO）测量。能通过CPO测量且无报警的物品即可确认无污染，按非放射性物品带出，故说法正确。易被误导处：物品测量应在人员污染监测之前完成，以防止污染扩散到人和环境；CPO报警时应复测，仍报警须联系辐射防护人员处理。【易混点】物品过大无法放入CPO时，不能拆解或绕过检测，需办理申请经辐射控制区边界门运出。"},{"id":"safety_fsjx_0147","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"如果皮肤有开放性伤口，尽量避免进入辐射控制区，如需进入辐射控制区，需进行必要的包扎。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：裸露伤口是放射性物质进入人体的途径之一（食入、吸入、从裸露伤口进入、皮肤渗入），伤口防护要求禁止带开放性伤口进入辐射控制区。故皮肤有开放性伤口应尽量避免进入控制区，确需进入时须进行必要的包扎防护，说法正确。易被误导处：包扎只是降低风险的补救措施，工作过程中造成开放性伤口的，应尽快退出辐射控制区。注意：课件表述为“禁止带开放性伤口进入辐射控制区”“存在裸露外伤的人员不得进入控制区”，较题干“包扎后可进入”更为严格，与官方答案不一致。【易混点】伤口沾污属于内照射风险，处理远比体表污染复杂，一旦发生应立即报告辐射防护人员。"},{"id":"safety_fsjx_0148","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"戴呼吸器可以有效限制放射性物质的吸入。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：无论非放射性或放射性气体污染物，都有呼吸吸入、食入、皮肤进入和裸露伤口进入四种进入人体的途径，而使用呼吸器正是为了限制放射性气体污染物的吸入。故戴呼吸器可以有效限制放射性物质的吸入，说法正确。易被误导处：呼吸器针对的仅是“吸入”途径，且是否穿戴需经评价——穿戴呼吸器可能降低效率、延长工作时间、增加外照射剂量，须权衡总剂量。【易混点】防护空气污染还有集体防护层次：空气净化、稀释、防止放射性物质扩散（如负压工作棚SAS）。"},{"id":"safety_fsjx_0149","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"非放射性物品可以随意带进辐射控制区并带出。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：应尽量减少带入辐射控制区的物品数量，能在热工具间借到的工器具就不从区外带入；不必要的工器具、耗材和外包装不带入，确需带入外包装的须经辐射防护人员登记；物品必须通过测量后方可带出控制区。故非放射性物品不可以随意带进带出，说法错误。易被误导处：“非放射性”不等于免检，物品进出控制区均受管控，随意带入还会增加放射性废物产生量。【易混点】禁止将透明塑料布等不易识别的材料带入辐射控制区，以免造成异物风险。"},{"id":"safety_fsjx_0150","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"人类每年受到来自环境的总剂量为2.5mSv左右，这些是可以避免的。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：人类所受环境天然放射性（宇宙射线、地壳及人体中的放射性物质等）的有效剂量全球每年平均约为3.1mSv，题干2.5mSv即同一量级的环境天然照射；这部分剂量是无法避免的，称之为本底。故“这些是可以避免的”说法错误。易被误导处：本底照射不由核电厂产生，也不随个人行为消失，它客观存在于任何环境中。【易混点】天然放射性对人均剂量的贡献最大；在人工放射性中贡献最大的是医疗照射，其对整个人类的影响相对很小。"},{"id":"safety_fsjx_0151","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"看到有边界门标识的房间门，不可以自行开启，开启前必须通知辐射防护人员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：辐射控制区边界标示牌表示区域边界，未经许可不得穿越；未经辐射防护人员许可和现场监护，擅自打开辐射控制区边界属于辐射防护黄线违章。故看到有边界门标识的房间门不可自行开启，开启前必须通知辐射防护人员，说法正确。易被误导处：边界门不是普通通道门，人员进出必须走卫生出入口，从边界门进出均属违章。【易混点】从边界门递出未经测量的物品同样是典型违章，存在放射性物品失控和污染扩散风险。"},{"id":"safety_fsjx_0152","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用他人RP证进入辐射控制区是违反辐射防护管理规定的'红线违章'。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：辐射防护红线明确包括“冒用他人辐射工作授权信息进入辐射控制区，或伪造个人剂量数据”。辐射控制区实行辐射防护授权通行制度，任何人员必须持本人有效RP证进入，使用他人RP证即属冒用授权信息的红线违章，故说法正确。易被误导处：借用证件看似“人已授权、只是证件不对”，但剂量会记录在他人名下，造成剂量数据失真，性质严重。【易混点】红线违章还包括未经批准转移放射源或放射性物品、擅自进入红区/橙区或探伤隔离区域等。"},{"id":"safety_fsjx_0153","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区的红区内某阀门发生泄漏，紧急情况下可以先设法进入抢修，后补审批手续。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：红区为禁止进入区、橙区为限制进入区，进入橙、红区等高辐射区域应办理高辐射区域进入许可、钥匙借用许可或开门许可等专门许可；擅自进入辐射控制区红区/橙区属于辐射防护红线违章。故紧急情况下也不得先进入抢修、后补审批手续，说法错误。易被误导处：以“紧急”为由省略审批并不能豁免违章性质，未经风险分析贸然进入反而可能造成非计划照射。【易混点】印度某电厂案例中，人员未通知RP自行开展高辐射风险工作，仅15分钟即受到124.8mSv的非计划照射。"},{"id":"safety_fsjx_0154","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射确定性效应的严重程度随剂量增加而增加，且存在剂量阈值，剂量越大，损伤越严重。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：确定性效应的严重程度随剂量增加而增加，且存在剂量阈值；剂量越大，损伤越严重，当剂量降低到一定程度时这类效应不出现。题干表述与课件一致，故说法正确。易被误导处：确定性效应须以“剂量达到阈值”为前提，且课件指出正常电厂活动中所接受的辐射剂量不会导致确定性效应。【易混点】随机性效应则相反：发生几率与剂量有关，严重程度与剂量无关，且不存在剂量阈值。"},{"id":"safety_fsjx_0155","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"某具备辐射防护工作授权人员在到达卫生出入口才想起忘了带热释光剂量计（TLD），这次可以先进入辐射控制区进行工作，下次再记得佩戴即可。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：进入辐射控制区之前，工作人员须在卫生出入口更换衣物、穿戴防护用品、佩戴个人剂量监测设备，EPD、TLD应佩戴在连体服左胸口袋内；从事辐射工作未按规定进行个人剂量监测属于辐射防护黄线违章。故忘带TLD不能先进入工作，说法错误。易被误导处：有RP证甚至带了EPD也不能替代法定剂量监测，TLD提供的是法定职业照射剂量记录。【易混点】若工作中EPD发生报警，应立即将手头工作置于安全状态，撤离可能受影响区域，并通知辐射防护人员。"},{"id":"safety_fsjx_0156","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射实际是上一种能量。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：辐射是一种自然现象，指能量以电磁波或粒子的形式向外扩散；辐射是放射性物质衰变过程中随着粒子或光子产生的能量。故辐射实质上是一种能量，说法正确。易被误导处：不要把“辐射”与“放射性”混为一谈——放射性是描述原子是否具有衰变能力的性质，辐射是衰变时释放出的能量。【易混点】该定义既包括电离辐射也包括非电离辐射；核能行业所称“辐射”是电离辐射的简称，与通信、微波等电磁辐射须加以区分。"},{"id":"safety_fsjx_0157","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"松散污染是可以去除的，如果去除不彻底，可能导致较强的外照射危害。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：松散污染可以去除、容易转移、极易扩散，其风险主要是吹扫造成空气污染和体表沾污，进而带来内照射危害，而非“较强的外照射危害”，故说法错误。易被误导处：题干前半句“松散污染可以去除”本身没错，错在后半句对危害性质的定性——去除不彻底的后果是污染扩散和沾污，不是外照射。【易混点】外照射危害主要来自γ射线等穿透性强的射线，防护靠时间、距离、屏蔽、源项控制，与污染是松散还是固定无关。"},{"id":"safety_fsjx_0158","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"工作负责人负责本工作组成员及工作所在区域的辐射安全，实施本工作组的安全监护工作。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：《辐射防护(共性)》课件未直接表述工作负责人的此项职责。但按核电现场工作安全管理的基本要求，工作负责人是现场工作的组织者和安全第一责任人，负责本工作组成员及工作所在区域的辐射安全，并实施本工作组的安全监护工作；工作组成员则须服从工作负责人要求落实防护措施。故说法正确。易被误导处：辐射安全不只是辐射防护（RP）人员的责任，自我防护原则明确辐射防护是每一位辐射工作人员自觉履行的职责。【易混点】工作过程中遇辐射异常（如仪表报警）时，应在停止工作撤离的同时向辐射防护人员和工作负责人报告。"},{"id":"safety_fsjx_0159","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"低剂量等待区为绿区，用于在辐射控制区内的工作人员暂时没有工作任务时的待命或休息。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：低剂量等待区标识牌通常挂设于现场辐射水平非常低的区域，此区域用于工作人员暂时没有工作任务时的待命或休息，避免停留在工作现场接受不必要的辐射照射。绿区为辐射控制区子区中剂量率最低的区域，低剂量等待区即依托此类区域设置，故说法正确。易被误导处：在控制区内“就地歇会儿”不是小事——在高辐射区域或热点附近讨论、休息属偏差行为。【易混点】辐射控制区内查看规程、讨论问题、休息等情况，均应在低剂量等待区进行。"},{"id":"safety_fsjx_0160","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"除司机和辅助人员的其他人员可搭乘装载有放射性货包的运输车辆。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：课件未专门讲述放射性货包运输的乘车要求。按避免不必要照射的辐射防护基本原则：运输车辆上人员仅限于司机和必要的辅助人员，其他人员搭乘装载放射性货包的车辆，会因靠近货包而受到不必要的照射，故说法错误。易被误导处：“顺路搭车”不能成为理由，辐射防护要求一切不必要的照射都应避免（正当性与最优化原则）。【易混点】与货包保持距离是降低照射的有效手段：距离加倍，剂量率约降为原来的四分之一（平方反比规律）。"},{"id":"safety_fsjx_0161","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在松散污染隔离区内工作时，如果涉及到登高作业，需要佩戴安全带，建议佩戴头部防护用品，防止面部沾污。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：单一课件未直接讲述污染区内登高作业的组合情形。但依据课件《高处作业》：攀爬高度大于2米必须使用安全带，登高作业应按规定系好安全带防坠落；依据课件《辐射防护(共性)》：进入污染隔离区须穿戴附加防护用品、严防面部沾污——课件案例中就有人员因吊带晃动碰到脸部且未采取面部防护措施而造成面部沾污。故在松散污染隔离区涉及登高作业时需佩戴安全带，并建议佩戴头部防护用品防止面部沾污，说法正确。【易混点】高处作业防坠落与污染区防沾污两类措施须同时落实，任何一项缺失都会留下风险缺口。"},{"id":"safety_fsjx_0162","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区连体服的作用是防护外照射。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：外照射的防护方法是降低工作场所剂量率、距离防护、源项控制、屏蔽防护和时间防护；连体服等衣物类防护用品的作用是保护皮肤和衣物不被污染（课件明确防水纸衣“仅用于防护表面污染，不防护外照射”）。故连体服不能防护外照射，说法错误。易被误导处：穿上防护服不等于安全，外照射剂量取决于剂量率、时间和距离，衣物挡不住γ射线。【易混点】降低外照射应使用屏蔽服（铅衣/钨衣），且电子剂量计必须佩戴在屏蔽服里面的工作服口袋内。"},{"id":"safety_fsjx_0163","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"如果工作中没有便携式辐射测量仪表，工作人员可以用自己戴的剂量计测量管道表面的剂量率水平。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：EPD、TLD用于监测和记录个人剂量当量——TLD需通过特殊设备测读，EPD也只能实时显示本人受照剂量，二者都不是辐射测量仪表。测量管道表面剂量率水平须使用便携式辐射测量仪表（可在卫生出入口借用），故说法错误。易被误导处：剂量计显示的是个人累积剂量，不是环境剂量率，两个物理量含义不同，不能互相替代。【易混点】发现便携式仪表、区域辐射监测仪或EPD读数显著增加或报警，应立即撤离该区域并通知辐射防护人员。"},{"id":"safety_fsjx_0164","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"固定污染是表面污染控制的重点。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：表面污染分为固定污染（污染物难以去除）和松散污染（可以去除、容易转移）。松散污染极易扩散，可能造成空气污染和体表沾污，必须加以控制，才是表面污染控制的重点，故“固定污染是控制重点”说法错误。易被误导处：固定污染虽然难以去除，但不易转移扩散，危害相对可控；松散污染一旦被扰动便会四处扩散。【易混点】对松散污染应做到发现污染先隔离、后去污，禁止直接接触湿表面或松散污染，必要时应穿戴橡胶手套。"},{"id":"safety_fsjx_0165","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区内划分的子区中，红区的辐射水平最高，绿区的辐射水平最低。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：辐射控制区子区按剂量率划分，绿区剂量率最低（如≤0.025mSv/h），依次为黄区、橙区，红区剂量率最高（如＞100mSv/h），红区为禁止进入区、橙区为限制进入区。故红区辐射水平最高、绿区最低，说法正确。易被误导处：各电厂堆型不同，子区剂量率划分标准不尽相同，但“绿低红高”的颜色规则一致。【易混点】进入橙、红区须办理高辐射区域进入许可、钥匙借用许可或开门许可等专门许可。"},{"id":"safety_fsjx_0166","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"当工作进行到辐射防护控制点时，工作负责人必须联系辐射防护人员检查。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性)》：开展高辐射风险工作，未提前联系辐射防护人员开展风险分析和确认防护措施，或在辐射安全检查点未通知辐射防护人员检查确认的，属于辐射防护黄线违章。故工作进行到辐射防护控制点时，工作负责人必须联系辐射防护人员检查，说法正确。易被误导处：控制点是强制性的安全关口，不因工期紧张或“自认为无风险”而跳过，未经确认继续作业即构成违章。【易混点】执行高辐射风险工作的工作组成员应优先使用无线EPD，并时刻关注自己接受的剂量。"},{"id":"safety_fsjx_0167","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"速差器应满足高挂低用，使用时与垂直方向夹角不得大于30°。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：速差器应满足高挂低用，使用时与垂直方向夹角不得大于30°，题干表述与课件要求一致，故说法正确。易被误导处：速差器钢丝绳与垂直方向夹角大于30°正是课件列出的错误示范之一，斜向使用会加大坠落冲击和摆动风险；使用前还应拉2-3下确认具备制动效果。【易混点】5米及以上脚手架重复攀爬必须使用速差器；位于系带一端的安全钩应固定在全身式安全带的D型环上。"},{"id":"safety_fsjx_0168","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架平台上作业时，如存在上下层垂直交叉同时作业，应做好相应的隔离措施。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：应避免进行上下层垂直交叉同时工作；如必须进行，中间必须搭设严密牢固的防护隔板、罩棚或其他隔离设施，防止坠物伤人。故存在上下层垂直交叉同时作业时应做好相应的隔离措施，说法正确。易被误导处：隔离设施必须“严密牢固”，仅拉警戒线、摆提示牌挡不住坠物。【易混点】这与高处作业下方设隔离区是两道不同防线：下方隔离区按作业高度划分半径（如2m≤h≤5m时R为3m，h＞30m时R为6m）。"},{"id":"safety_fsjx_0169","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"饮酒，精神不振等身体不适等情况禁止高处作业。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：作业人员作业前应无饮酒，没有精神不振、疲劳过度等身体不适状况。故饮酒、精神不振等身体不适情况禁止高处作业，说法正确。易被误导处：身体条件是高处作业的硬性要求——患高血压、心脏病、癫痫症、恐高症及其他不适应高空作业疾病的人，不得从事高处作业。【易混点】作业人员还必须身体健康并定期体检，身体或心理状况不健康正是不安全行为的常见根源。"},{"id":"safety_fsjx_0170","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在使用安全带过程中，如果沾染了化学品，应用相应的去污剂进行中和。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》维护保养要求：安全带应以水和中性洗涤剂的溶液清洗，不得使用化学剂、强去污剂；清洗后用清水漂洗，金属部件擦干，悬挂空气中晾干。故沾染化学品后“用相应的去污剂进行中和”的说法错误。易被误导处：化学剂和强去污剂会侵蚀织带纤维，降低安全带强度，造成外表看不出的隐性失效。【易混点】安全带应存放在阴凉、干燥、清洁的场所，避开湿气、紫外线以及腐蚀性气体或过冷过热的环境。"},{"id":"safety_fsjx_0171","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"当在梯子上，双手需要同时工作时，要系好安全带，安全带挂点可以在梯子上。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：在梯子上当双手需要同时工作时，或在超过2米的位置上作业时，要系好安全带，且挂点不得在梯子上。故“安全带挂点可以在梯子上”说法错误。易被误导处：梯子本身不是合格的挂点，它受力不稳、随人移动，挂在其上起不到坠落制动作用；挂点应选择牢固的可承重构件。【易混点】使用梯子还应遵守同伴原则：有人扶持，一脚踏稳最底梯级，双手紧握两边扶手。"},{"id":"safety_fsjx_0172","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"软梯应挂在可靠固定，上端应用卸扣或穿钢管固定，严禁用铁丝固定，软梯下端应固定平稳。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》梯子使用要求：软梯应挂在可靠固定，上端应用卸扣或穿钢管固定，严禁用铁丝固定，软梯下端应固定平稳。题干与课件要求一致，故说法正确。易被误导处：铁丝固定看似省事，实际承载能力和可靠性远不如卸扣或穿钢管，受力后极易松脱断裂。【易混点】在软梯上只准一人同时工作或上下，且必须使用速差器；使用中尽量不让软梯晃动，可攀登软梯侧面以减少晃动。"},{"id":"safety_fsjx_0173","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架的标识牌上应有该脚手架允许载荷的标识。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：作业前检查载荷设计，要求查看脚手架标识牌上的载荷限制要求，预估作业载荷，确保不超过脚手架的承载能力。故标识牌上应有该脚手架允许载荷的标识，说法正确。易被误导处：载荷限制是脚手架“能干什么”的核心信息，作业层上的荷载应符合要求、严禁超载。【易混点】脚手架标识牌分红牌、绿牌和“从此上下”标牌：严禁未经验收的脚手架挂绿牌，严禁使用挂红牌的脚手架。"},{"id":"safety_fsjx_0174","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"安全带挂点应尽量靠近作业位置，以避免钟摆效应。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带挂点须尽量靠近作业位置，以避免钟摆效应（坠落后沿弧线摆动撞击周边物体），故说法正确。易被误导处：挂点位置还有优劣之分——挂点高于头部最佳，平行或略高于背部挂点较佳，低于背部甚至位于脚部的挂点应尽量避免。【易混点】挂点不得选在不牢固的物件（非设计受力的工艺管道等）、可移动的物体、受力会滑脱的部件上。"},{"id":"safety_fsjx_0175","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业下方可以不设监护人员、警示隔离区。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：任何人不得单独进行高处作业，必须由不少于2人共同进行，现场必须指定人员履行监护职责；高处作业地点的下方应按作业高度设置隔离区。故“可以不设监护人员、警示隔离区”说法错误。易被误导处：监护人不是可有可无的旁观者，须熟悉高处作业各环节的坠落安全风险并掌握预控措施。【易混点】下方隔离区半径按作业高度h划分：2m≤h≤5m时R为3m，5m＜h≤15m时R为4m，15m＜h≤30m时R为5m，h＞30m时R为6m。"},{"id":"safety_fsjx_0176","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业时可以将工具及材料上下投掷。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：禁止将工具及材料上下抛掷，必须用绳系牢后传递，以免坠物伤人。故“可以将工具及材料上下投掷”说法错误。易被误导处：即使下方暂时无人也不允许抛掷——落点失控的物件可能砸坏设备或弹伤他人，物体坠落是高处作业的两大风险之一（另一为人员坠落）。【易混点】攀爬脚手架时不得手中持物或腋下夹物，应优先用安全绳传递工具包，背包攀爬时工具包应斜跨在背后。"},{"id":"safety_fsjx_0177","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"上下脚手架应走上下爬梯，不应沿绳、脚手架立杆、栏杆或借构筑物攀爬。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬脚手架时应选用专用攀爬通道（上下爬梯），不应沿绳、脚手架立杆、栏杆或借构筑物攀爬，题干表述与课件一致，故说法正确。易被误导处：立杆、栏杆看似顺手，却不是为人员攀爬设计的受力通道，攀爬时极易打滑坠落。【易混点】攀爬时应面向爬梯并始终保持三点接触，选用双钩安全带并至少保持单钩可靠固定。"},{"id":"safety_fsjx_0178","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架高度较高时，允许两人同时攀爬，但要保持一定的距离。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：脚手架爬梯上禁止两人及以上同时攀爬，一次只能上一人，等人员完全离开爬梯后另一人才能开始攀爬。故“允许两人同时攀爬、但要保持距离”说法错误。易被误导处：保持距离并不能消除风险——后一人攀爬引起的晃动会影响前者，前者滑倒也会砸伤下方人员。【易混点】当爬梯上有人时，不能站在其正下方，以防上面的人滑倒时给下面的人带来危险。"},{"id":"safety_fsjx_0179","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"应避免进行上下层垂直交叉同时进行工作。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：应避免进行上下层垂直交叉同时进行的工作；如必须进行，中间必须搭设严密牢固的防护隔板、罩棚或其他隔离设施。故说法正确。易被误导处：“避免”是首选要求，搭设隔离设施只是无法避免时的补救措施，能错开安排就不要交叉作业。【易混点】在脚手架平台上仅使用安全带作为坠落防护设施时，安全带双钩不允许同时解除。"},{"id":"safety_fsjx_0180","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"安全带应高挂低用，发生坠落时可减小坠落距离，减少坠落冲击力。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带应高挂低用，发生坠落时可减小坠落距离，减少坠落冲击力（架子工搭拆作业时可短时低挂高用），题干与课件一致，故说法正确。易被误导处：低挂高用会加长坠落距离和冲击力，除架子工搭拆等特定情形外应避免。【易混点】除挂点高低外，还应保证垂直方向有足够的坠落净空，确保人员坠落后脚部不接触地面与任何物体。"},{"id":"safety_fsjx_0181","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"为了避免安全带穿戴后出现不适感，肩部绑带与胸部绑带尽可能放宽。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带过松可能导致严重伤亡——胸部绑带过松，人员坠落后可能勒至颈部导致窒息；腿部绑带过松，坠落后可能导致腹股沟受伤。穿戴应适贴配合并通过两指试验，故为避免不适而放宽绑带的说法错误。易被误导处：课件明确“如果穿戴后没有不适感，那么你的安全带穿戴错误”，适度紧绷才是正确状态。【易混点】背部D型环应位于肩胛骨之间，位置过低会导致人员坠落后翻转。"},{"id":"safety_fsjx_0182","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业人员在每次作业前无需对脚手架、梯子、移动平台等高处作业设施进行检查。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：每次上架脚手架前应进行目视检查（架体是否倾斜、摇晃，捆绑是否松动等）；安全带在每次使用前应进行检查并定期送检；速差器使用前应拉2-3下确认制动效果。故“无需对脚手架、梯子、移动平台等设施进行检查”说法错误。易被误导处：设施状态会随使用和环境影响发生变化，昨天的合格不代表今天仍合格。【易混点】作业前还应查看脚手架标识牌，严禁使用挂红牌的脚手架，严禁使用未经验收挂绿牌的脚手架。"},{"id":"safety_fsjx_0183","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"发现安全带存在缺陷时可以继续使用。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：防坠落用品在检查中发现不合格、工作中受到损害（如焊接导致设备燃烧）或触发保护动作（如速差器动作）时，要立即将其从工作场地移除，并告知工具管理人员。故发现安全带存在缺陷时不得继续使用，说法错误。易被误导处：有缺陷的安全带看似还能穿戴，但坠落时无法保证有效制动，属于失效设备。【易混点】该移除要求同样适用于使用结束的正常防护用品，归还后由工具管理人员统一维护保管。"},{"id":"safety_fsjx_0184","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用梯子时应有人扶持，扶梯的方式是一脚踏稳最底梯级，双手紧握两边扶手。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》梯子使用同伴原则：使用梯子时应有人扶持，扶梯的方式是一脚踏稳最底梯级，双手紧握两边扶手。题干与课件一致，故说法正确。易被误导处：扶梯人必须真正“扶稳”，一手扶梯一手干别的起不到保护作用；梯上人员也应保持身体靠近梯子、避免侧向承载。【易混点】当有人在梯子上时不应挪动梯子重新定位，也不应站在折梯上以“步行”方式移动梯子。"},{"id":"safety_fsjx_0185","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在使用前的检查中，如发现设备不合格，应暂停工作，告知工具管理人员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：防坠落用品在检查过程中发现设备不合格时，要立即将其从工作场地移除，并告知工具管理人员。故发现设备不合格应暂停工作并告知，说法正确。易被误导处：暂停的不只是该设备的使用，相关高处作业也应一并停止，待更换合格设备后方可恢复。【易混点】防护用品使用结束、工作中受损或触发保护动作时，同样要立即移除并告知工具管理人员。"},{"id":"safety_fsjx_0186","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"怀疑伤员有颈椎、腰椎骨折，不要搬动伤员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》应急处置：怀疑伤员有颈椎、腰椎骨折时，不要搬动伤员，应让伤员平卧，使头、颈和脊柱保持在一条直线上，并在伤员头肩两侧用衣服夹持固定，以免加重损伤。故说法正确。易被误导处：好心搬动伤员可能造成或加重截瘫——搬运时颈部和躯干不能前屈或扭转，绝对禁止一个抬肩一个抬腿的搬法。【易混点】受伤人员出现骨折、出血、休克或心跳停止时，应立即采取止血、包扎、固定措施并进行心肺复苏；若伤口有异物不要取出。"},{"id":"safety_fsjx_0187","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"患有高血压、心脏病、癫痫症、恐高症及其他不适应高空作业的人，一律不准从事高处作业。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：作业人员必须身体健康并定期进行身体检查，患有高血压、心脏病、癫痫症、恐高症及其他不适应高空作业的人，不得从事高处作业。题干“一律不准”与课件要求一致，故说法正确。易被误导处：这不是歧视性限制，而是因为这些疾病在高处环境可能突然发作，引发坠落危及自身和他人。【易混点】身体条件之外，作业前还应无饮酒、无精神不振或疲劳过度等身体不适状况。"},{"id":"safety_fsjx_0188","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架搭设完成后，如需长期使用，应该由专业人员进行定期巡检。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：脚手架使用期间应由巡检人员进行定期检查，检查结束后在标识牌背面签名并注明日期，并填写检查记录。故长期使用的脚手架应由专业人员进行定期巡检，说法正确。易被误导处：巡检不是走过场，标识牌背面签名注明日期正是检查责任可追溯的体现。【易混点】脚手架从搭设开始至拆除结束必须随时处于挂牌状态，使用人员每次上架前还应自行目视检查。"},{"id":"safety_fsjx_0189","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"根据工作的需要，可以短时改变脚手架结构，在工作完成后回装。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：使用人员严禁私自更改脚手架结构。即使因工作需要短时改动、事后回装也不允许擅自进行，须由脚手架专业人员处理，故说法错误。易被误导处：擅自抽拆、移动杆件会破坏脚手架整体受力，哪怕“临时”改动也可能恰逢事故发生。【易混点】课件将“非脚手架人员违章拆除构件”列为典型违章，加固杆件、防护设施等构件同样不得私自更改。"},{"id":"safety_fsjx_0190","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用移动式脚手架时，应确保脚轮、机械装置锁死。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：移动式脚手架在使用过程中，脚轮、机械装置应锁死，防止架体意外移动造成人员坠落，故说法正确。易被误导处：锁死是“使用”状态下的要求；确需移动时，应先确认移动区域地面硬化平整、清除路径上的工具杂物，架上站人或物料未清理前严禁移动。【易混点】作业层上的荷载应符合要求、严禁超载，严禁踩在脚手架钢管上和作业层物品上加高作业。"},{"id":"safety_fsjx_0191","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在脚手架上攀爬时，应面向爬梯并始终保持三点接触。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬脚手架时应面向爬梯并始终保持与爬梯三点接触状态（双手和双脚四点中的三点），题干与课件一致，故说法正确。易被误导处：三点接触意味着任一时刻至少有三个支撑点，手中持物或腋下夹物都会破坏这一原则。【易混点】攀爬高度大于2米必须使用安全带，并选用双钩安全带、至少保持单钩可靠固定。"},{"id":"safety_fsjx_0192","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"安全带与速差器配合使用时，可以将安全带双钩挂在速差器上。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：速差器错误示范明确包括“安全带双钩挂在速差器上”；正确做法是位于系带一端的安全钩固定在全身式安全带的D型环上，速差器自身所带的安全钩固定在牢固的可承重部件上。故安全带双钩不得挂在速差器上，说法错误。易被误导处：双钩挂速差器形成错误连接，坠落时受力方式不符合设计，制动可能失效。【易混点】速差器还应满足高挂低用、与垂直方向夹角不大于30°；系带回收时应缓慢持续回放，禁止任其自由回收。"},{"id":"safety_fsjx_0193","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"可以从一部梯子直接攀到另一部梯子上。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》梯子使用要求：不应从一部梯子攀到另一部梯子，同时禁止背向梯子攀爬，故说法错误。易被误导处：梯间攀爬时人处于两部梯子之间，没有稳定支撑和防护，任一部梯子晃动都会导致坠落。【易混点】便携式梯子除非专门设计成多人使用，不应多人同时攀登；折梯不应作为单梯（直梯）使用或在合拢状态使用。"},{"id":"safety_fsjx_0194","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用人员可以私自更改脚手架结构（加固杆件、防护设施）。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：使用人员严禁私自更改脚手架结构，加固杆件、防护设施等构件均不得擅自拆除或改动；课件将“非脚手架人员违章拆除构件”列为典型违章，故说法错误。易被误导处：脚手架的每根杆件都参与整体受力，抽掉“看起来没用”的杆件可能使结构失稳坍塌。【易混点】确需改动脚手架时应联系脚手架专业人员处理，不得自行其是。"},{"id":"safety_fsjx_0195","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"人静止悬挂在安全带里，不会有生命危险，不需要着急救援。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》应急处置：人员静止悬挂在安全带里会造成人体损伤甚至死亡，由于血液缺氧可导致心脏、肝脏、肾脏严重损伤，悬挂超过20分钟就会有生命危险，必须快速救援。故“不会有生命危险、不需要着急救援”说法错误。易被误导处：人被安全带“接住”并非脱险，安全带悬吊本身就在持续造成伤害。【易混点】这也是高处作业必须有人监护、禁止单独作业的重要原因——一旦坠落能立即组织救援。"},{"id":"safety_fsjx_0196","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在5级及以上大风以及暴雨、雷电、冰雹、大雾等恶劣天气，应停止露天高处作业。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：在5级及以上大风以及暴雨、雷电、冰雹、大雾等恶劣天气，应停止露天高处作业，题干与课件一致，故说法正确。易被误导处：恶劣天气的影响是多重的——大风影响人员稳定和坠物轨迹，暴雨使作业面湿滑，雷电带来直击雷风险。【易混点】起重吊装“十不吊”对应的是“六级以上大风或大雨、大雪、大雾等恶劣天气不吊”，注意两处风级标准不同（5级与6级）。"},{"id":"safety_fsjx_0197","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业时，轻小物件应放入工具袋，工具袋应固定牢靠。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处作业应一律使用工具袋，轻小物件应放入工具袋，工具袋应固定牢靠；手持轻小工具还应使用工具防坠落绳。题干与课件一致，故说法正确。易被误导处：工具袋固定牢靠同样重要，随手搭在栏杆上的工具袋本身就会成为坠落物。【易混点】使用较重且难以握持或不易绑扎的工器具/物件时，应优先选用具有防坠落构件（如锚固扣、卡箍等）的工具，或采取临时加固措施并用安全绳等拉结牢固。"},{"id":"safety_fsjx_0198","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业时，禁止将工具及材料上下抛掷，必须用绳系牢后传递，以免坠物伤人。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：禁止将工具及材料上下抛掷，必须用绳系牢后传递，以免坠物伤人，题干与课件一致，故说法正确。易被误导处：即使下方无人也不允许抛掷——落点失控的物件可能砸坏设备或弹伤他人，物体坠落是高处作业的主要风险之一。【易混点】在格栅平台上工作应采取防止工具和器材掉落的措施，格栅缝隙是坠物的天然通道。"},{"id":"safety_fsjx_0199","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"格栅平台上工作，不需要采取防止工具和器材掉落的措施。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：如在格栅平台上工作，应采取防止工具和器材掉落的措施。故“不需要采取防止工具和器材掉落的措施”说法错误。易被误导处：格栅平台的缝隙使任何小件物品都可能直接坠落至下方，坠落高度越大、伤害越大。【易混点】防坠物措施包括使用工具袋并固定牢靠、手持轻小工具使用工具防坠落绳、对较重工器具采取拉结固定等，与防人员坠落同等重要。"},{"id":"safety_fsjx_0200","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"U型卸扣在使用时作用力要沿着卸扣的中心线的轴线上。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：U形卸扣要正确地支撑着载荷，即作用力要沿着卸扣的中心线的轴线上，避免弯曲、不稳定的载荷，更不可以过载，题干与课件一致，故说法正确。易被误导处：卸扣设计用于垂直方向的提升，随着提升角度减小其负重限值降低，斜向或偏心受力可能使其失效，两支腿之间夹角最大不得超过120°。【易混点】卸扣与钢丝绳索具配套捆绑使用时，横销部分应与钢丝绳索具的锁眼连接，防止提升时横销转动、与扣体脱离。"},{"id":"safety_fsjx_0201","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"严禁私自将运行的设备、管道、支撑钢结构及工作平台等作为起重作业的承载点。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：严禁将运行的设备、管道、支撑钢结构及工作平台等作为起重作业的承载点；必须利用厂房钢结构等辅助支撑的，须经工程技术人员进行载荷吊拉专项评估，确保支撑件有足够强度，故说法正确。易被误导处：设备、管道“看起来结实”，但其设计并非为吊装承载考虑，作为承载点可能造成设备损坏或吊装失败。【易混点】重要或风险较大的吊装作业应提前编制吊装计划，明确吊装总重量、负荷重心、起重设备能力、吊装路径等。"},{"id":"safety_fsjx_0202","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"正式吊运前，应将重物慢速吊离地面100-200mm以进行试吊，确认吊物处于可靠的吊运状态，方可正常起升。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：正式吊运前，应将重物慢速吊离地面100-200mm以进行试吊，确认吊物处于可靠的吊运状态，方可正常起升，题干与课件一致，故说法正确。易被误导处：试吊的价值在于让捆绑不牢、吊具缺陷、制动失灵等问题在离地最低点暴露，避免载荷升空后坠落造成更大损失。【易混点】人员禁止在吊物、吊臂下通过或停留；起吊大的或不规则构件时应在构件上系以牢固的拉绳，使其不摇摆不旋转。"},{"id":"safety_fsjx_0203","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"工作人员如发现任何起重设备有问题，有权拒绝开工。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重机、手拉葫芦、吊带、吊链等应进行定期检验，使用前须检查，确保在检验/检定/检查有效期内。发现起重设备有问题、无法保证安全时，工作人员有权拒绝开工，待问题解决后方可作业，故说法正确。易被误导处：不能因赶工期而“先干着”，使用带病设备一旦出事后果严重，安全优先于进度。【易混点】重要或风险较大
