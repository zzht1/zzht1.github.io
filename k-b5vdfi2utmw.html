gle","stem":"如果发生头颈部以上污染，工作人员经去污合格后，还应（ ）。","options":["接受尿氚检测","接受WBC测量","接受职业医生检查","无需采取额外行动"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"发生头颈部以上污染，经去污合格后还应接受WBC测量（评估可能的内污染）。"},{"id":"safety_fs_0041","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于辐射控制区边界的标示牌，下列说法错误的是：（ ）。","options":["在辐射控制区的所有边界门上（内外两侧）应当设置辐射控制区边界标示牌","标示牌包含提示信息：未经辐射防护人员许可，人员和物品不得经此门出入","标示牌包含提示信息：未经运行人员许可，人员和物品不得经此门出入","标示牌底为蓝色，文字、图案、线条为白色"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"辐射控制区边界标示牌提示信息按分区等级不同（\"各分区标示牌内容完全相同\"类说法错误）。"},{"id":"safety_fs_0042","module":"safety","bank":"辐射防护二级","type":"single","stem":"如果工作的环境剂量率为1.2mSv/h，而针对每位工作人员的剂量目标为0.6 mSv，则工作人员的最长作业时间为（）。","options":["12分钟","15分钟","20分钟","30分钟"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"剂量=剂量率×时间：0.6mSv÷1.2mSv/h=0.5h=30分钟。"},{"id":"safety_fs_0043","module":"safety","bank":"辐射防护二级","type":"single","stem":"如果你的工作场所外照射水平比较高，你想减少自身辐射剂量，可以采取哪些措施（）。","options":["提高工作熟练度，减少作业时间","增加与辐射源项距离","在人员和辐射源项之间增加屏蔽","以上全都是"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"提高熟练度减少时间、增加距离、加装屏蔽都能减少受照剂量，故\"以上全都是\"。"},{"id":"safety_fs_0044","module":"safety","bank":"辐射防护二级","type":"single","stem":"如果你在辐射控制区内检修放射性时产生了废油，正确的做法是（）。","options":["倒入辐射控制区内的地坑","倒入附近的地漏","妥善收集，放在附近废物收集点","妥善收集，放到指定废油收集点"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"放射性废油应妥善收集放到指定收集点，严禁倒入地漏地坑。"},{"id":"safety_fs_0045","module":"safety","bank":"辐射防护二级","type":"single","stem":"对于处理放射性废物的正确的做法是：（ ）。","options":["将放射性废物丢弃在工作现场","随意存放放射性废物","私自将放射性废物带出辐射控制区","对现场产生放射性固体废物分类处理，并送到指定收集点"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"对现场产生的放射性固体废物应分类收集，按指定要求存放处理。"},{"id":"safety_fs_0046","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列违章现象中一次性扣12分的是（）。","options":["不遵守射线探伤警示标识要求，违规进入射线探伤隔离区域","伪造个人剂量数据","进入辐射控制区未按要求正确佩戴个人剂量检测设备","未经许可随意存放放射性废物"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"不遵守射线探伤警示强行进入探伤隔离区属红线违章，一次性扣12分。"},{"id":"safety_fs_0047","module":"safety","bank":"辐射防护二级","type":"single","stem":"冒用他人辐射工作授权信息进入辐射控制区，一次性扣（ ）。","options":["4分","6分","9分","12分"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"冒用他人辐射工作授权信息进入辐射控制区一次性扣12分（红线）。"},{"id":"safety_fs_0048","module":"safety","bank":"辐射防护二级","type":"single","stem":"在辐射控制区内喝水或进食，一次性扣（ ）。","options":["4分","6分","9分","12分"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"在辐射控制区内喝水或进食一次性扣6分。"},{"id":"safety_fs_0049","module":"safety","bank":"辐射防护二级","type":"single","stem":"进入辐射控制区未按要求正确佩戴个人剂量监测设备，一次性扣（）。","options":["4分","6分","9分","12分"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"未按要求正确佩戴个人剂量监测设备一次性扣6分。"},{"id":"safety_fs_0050","module":"safety","bank":"辐射防护二级","type":"single","stem":"未经辐射防护人员批准，擅自开展涉及重水系统相关的工作，一次性扣（）。","options":["4分","6分","9分","12分"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"擅自开展涉及重水系统相关工作一次性扣12分。"},{"id":"safety_fs_0051","module":"safety","bank":"辐射防护二级","type":"single","stem":"全身计数器（WBC）测量是针对辐射工作人员进行的（ ）监测。","options":["A.内照射","B.外照射","C. A和B"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"全身计数器（WBC）用于内照射监测（直接测量体内γ放射性核素）。"},{"id":"safety_fs_0052","module":"safety","bank":"辐射防护二级","type":"single","stem":"负压棚在核电站主要用于（）。","options":["防止外照射","防止松散表面污染","防止空气污染扩散","防止异物进入开口的系统"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"负压棚主要用于防止空气污染扩散（棚内负压，污染物不外逸）。"},{"id":"safety_fs_0053","module":"safety","bank":"辐射防护二级","type":"single","stem":"下面的哪种放射性不属于人工放射性范畴（）。","options":["医疗照射","放射性科学研究、生产作业","放射性尘降灰","氡子体"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"氡子体属于天然放射性，不属于人工放射性范畴。"},{"id":"safety_fs_0054","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于RP证，下列说法正确的是（）。","options":["可以借给别人使用","必须一人一证","每次授权用不同的号码","由管理部门决定人员调剂转借"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"RP证必须一人一证，不得转借。"},{"id":"safety_fs_0055","module":"safety","bank":"辐射防护二级","type":"single","stem":"为了避免放射性物质进入人体内，禁止（）的人员进入辐射控制区。","options":["带有裸露外伤","带有伤疤","皮肤薄","皮肤有红斑"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"带有裸露外伤的人员禁止进入辐射控制区（放射性物质易经伤口进入体内）。"},{"id":"safety_fs_0056","module":"safety","bank":"辐射防护二级","type":"single","stem":"辐射防护常用单位中有效剂量的单位是（）。","options":["DAC","mSv/h","Bq","mSv"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"有效剂量的单位是mSv（毫希沃特）。"},{"id":"safety_fs_0057","module":"safety","bank":"辐射防护二级","type":"single","stem":"辐射防护常用单位中有效剂量率的单位是（）。","options":["DAC","mSv/h","Bq","mSv"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"有效剂量率的单位是mSv/h。"},{"id":"safety_fs_0058","module":"safety","bank":"辐射防护二级","type":"single","stem":"中核运行内照射个人剂量监测手段主要有（）和尿氚分析。","options":["全身污染仪","全身计数测量","热释光剂量计","电子剂量计"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"内照射个人剂量监测手段主要有全身计数测量（WBC）和尿氚分析。"},{"id":"safety_fs_0059","module":"safety","bank":"辐射防护二级","type":"single","stem":"辐射防护三原则中，没有包括（）。","options":["实践的正当性","防护的最优化","剂量限值","对核技术的恐惧心理和无所谓心理"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"辐射防护三原则：实践的正当性、防护的最优化、剂量限值；\"对核技术的恐惧心理\"不包括在内。"},{"id":"safety_fs_0060","module":"safety","bank":"辐射防护二级","type":"single","stem":"放射性物质进入人体的三种途径中，进入人体的最主要的途径是（）。","options":["吸入","食入","皮肤渗透","射线直接照射"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"放射性物质进入人体最主要的途径是吸入（经呼吸道）。"},{"id":"safety_fs_0061","module":"safety","bank":"辐射防护二级","type":"single","stem":"重水堆核电站，工作人员应该（）提交尿样。","options":["在开展重水相关工作后","根据个人意愿，在需要的时候","根据保健物理三处的通知定期","每次离开辐射控制区时"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"重水堆工作人员按保健物理处的计划（周期安排）提交尿样，用于尿氚分析。"},{"id":"safety_fs_0062","module":"safety","bank":"辐射防护二级","type":"single","stem":"国家标准《电离辐射防护与辐射源安全基本标准》（GB18871-2002）中规定，辐射工作人员全身有效剂量连续5年平均每年不得超过（）。","options":["20 mSv","30 mSv","40 mSv","50 mSv"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"GB18871-2002规定连续5年平均每年有效剂量不超过20mSv。"},{"id":"safety_fs_0063","module":"safety","bank":"辐射防护二级","type":"single","stem":"国家标准《电离辐射防护与辐射源安全基本标准》（GB18871-2002）中规定，辐射工作人员全身有效剂量任何1年不得超过（）。","options":["20 mSv","30 mSv","40 mSv","50 mSv"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"GB18871-2002规定任何1年有效剂量不超过50mSv。"},{"id":"safety_fs_0064","module":"safety","bank":"辐射防护二级","type":"single","stem":"中核核电运行管理公司规定辐射工作人员的个人剂量年度管理目标值为（）。","options":["8 mSv","10 mSv","12 mSv","15 mSv"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"中核核电运行管理公司个人剂量年度管理目标值为12mSv。"},{"id":"safety_fs_0065","module":"safety","bank":"辐射防护二级","type":"single","stem":"某工作区域的辐射水平为 0.2mSv/h，如果你需要在此区域工作2 小时，你预计受到的辐射剂量为（ ）。","options":["0.4mSv","4mSv","0.004mSv","0.04mSv"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"剂量=剂量率×时间=0.2mSv/h×2h=0.4mSv。"},{"id":"safety_fs_0066","module":"safety","bank":"辐射防护二级","type":"single","stem":"《电离辐射防护和辐射源安全基本标准》规定的职业照射个人剂量限值是：连续5 年的年平均有效剂量为（  ），但任何一年的有效剂量限值不超过50mSv。","options":["10mSv","20mSv","49mSv","100mSv"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"职业照射限值：连续5年年平均有效剂量20mSv，任何一年不超过50mSv。"},{"id":"safety_fs_0067","module":"safety","bank":"辐射防护二级","type":"single","stem":"当你在辐射控制区从事有表面污染风险的工作时，你应该选择下面哪种防护用品（  ）。","options":["纸衣","耳塞","铅衣","铅手套"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"有表面污染风险的工作应穿纸衣（防止污染工作服和体表）。"},{"id":"safety_fs_0068","module":"safety","bank":"辐射防护二级","type":"single","stem":"当你在辐射控制区从事有空气污染风险的工作时，你应该选择下面哪种防护用品（   ）。","options":["纸衣","塑料衣","铅衣","气衣或气面罩"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"有空气污染风险的工作应选用气衣或气面罩（隔绝式呼吸保护）。"},{"id":"safety_fs_0069","module":"safety","bank":"辐射防护二级","type":"single","stem":"当你从事涉水作业或者潮湿物品的操作式，至少需要增加下列哪一种防护用品（  ）。","options":["口罩","乳胶手套或橡胶手套","细纱手套","铅衣"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"涉水作业或潮湿物品操作至少增加乳胶手套或橡胶手套（防污染经手部接触/伤口进入）。"},{"id":"safety_fs_0070","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列用品中，（  ）不能用于防氚呼吸保护。","options":["口罩","自背式呼吸器","通风头罩","气衣"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"普通口罩不能用于防氚呼吸保护（氚化水蒸气可透过普通滤材），需用自背式呼吸器、通风头罩、气衣等隔绝式防护。"},{"id":"safety_fs_0071","module":"safety","bank":"辐射防护二级","type":"single","stem":"进入临时污染隔离区作业，应当穿（    ）以防止工作鞋被污染，退出隔离区时再脱去。","options":["塑料鞋套","防护眼镜","耳塞","雨鞋"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"进入临时污染隔离区应穿塑料鞋套防止工作鞋被污染，退出时脱去。"},{"id":"safety_fs_0072","module":"safety","bank":"辐射防护二级","type":"single","stem":"当你离开临时污染隔离区时，依次脱除附加防护用品的正确顺序是（  ）。","options":["乳胶手套 ＞ 纸衣 ＞ 塑料鞋套  ＞ 细纱手套","纸衣 ＞ 乳胶手套 ＞  塑料鞋套  ＞ 细纱手套","乳胶手套 ＞ 塑料鞋套 ＞ 纸衣 ＞ 细纱手套","纸衣 ＞ 乳胶手套 ＞ 细纱手套 ＞ 塑料鞋套"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"离开污染隔离区脱附加防护用品的正确顺序：乳胶手套→纸衣→塑料鞋套（先脱污染最重的手套）。"},{"id":"safety_fs_0073","module":"safety","bank":"辐射防护二级","type":"single","stem":"在卫生出入口，用于监测人员皮肤放射性污染的设备为（   ）。","options":["C1（门式污染监测仪）","C2门（全身污染监测仪）","WBC（全身计数器）","CPO（小件物品检测仪）"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"C2门（全身污染监测仪）用于监测人员皮肤（体表）放射性污染。"},{"id":"safety_fs_0074","module":"safety","bank":"辐射防护二级","type":"single","stem":"在卫生出入口，用于监测人员防护服放射性污染的设备为（   ）。","options":["C1门（门式污染监测仪）","C2门（全身污染监测仪）","WBC（全身计数器）","CPO（小件物品检测仪）"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"C1门（门式污染监测仪）用于监测人员防护服放射性污染。"},{"id":"safety_fs_0075","module":"safety","bank":"辐射防护二级","type":"single","stem":"在秦山核电，用于监测人员体内放射性污染的设备为（    ）。","options":["C1门（门式污染监测仪）","C2门（全身污染监测仪）","WBC（全身计数器）","CPO（小件物品检测仪）"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"WBC（全身计数器）用于监测人员体内放射性污染（内照射）。"},{"id":"safety_fs_0076","module":"safety","bank":"辐射防护二级","type":"single","stem":"在秦山核电，用于监测随身物品放射性污染的设备为（   ）。","options":["C1门（门式污染监测仪）","C2门（全身污染监测仪）","WBC（全身计数器）","CPO（小件物品检测仪）"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"CPO（小件物品检测仪）用于监测随身物品的放射性污染。"},{"id":"safety_fs_0077","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内橙区均上锁关闭，入橙区需得到生产厂长或副厂长书面批准，工作期间由辐射防护人员现场监护。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。橙区上锁管理、进入须辐射防护部门许可，但不需要生产厂长或副厂长书面批准（那是红区要求）。"},{"id":"safety_fs_0078","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内所有涉及水或者潮湿物品的操作都必须戴乳胶手套或橡胶手套。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。控制区内所有涉水或潮湿物品操作都必须戴乳胶或橡胶手套。"},{"id":"safety_fs_0079","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射防护最优化原则：对于确定实施的辐射防护实践，应根据辐射风险制定合理可行的防护措施，使得人员和环境受到的辐射照射尽量低。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。这是辐射防护最优化（ALARA）原则的表述：合理可行的措施使照射尽量低。"},{"id":"safety_fs_0080","module":"safety","bank":"辐射防护二级","type":"judge","stem":"对放射性设备进行研磨、钻孔、切割等操作时，操作人员必须通知辐射防护人员，并按照辐射防护人员的要求佩戴呼吸保护设备。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。研磨、钻孔、切割放射性设备会产生放射性粉尘/气溶胶，须通知辐射防护人员并按要求佩戴呼吸保护。"},{"id":"safety_fs_0081","module":"safety","bank":"辐射防护二级","type":"judge","stem":"一旦某项辐射工作的正当性已经得到认可，那么实施过程中必须确保合理可行尽量低地减少人员可能受到的辐射照射，但并不是无止境的降低，而是要在付出的代价和获得的利益间寻求平衡。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。最优化不是无止境降低剂量，而是代价与利益的最佳平衡（合理可行尽量低）。"},{"id":"safety_fs_0082","module":"safety","bank":"辐射防护二级","type":"judge","stem":"国家法规规定的个人剂量年度限值控制的是人员全年受到的所有职业照射，如果在多个核电厂受到职业照射，那么所有的照射剂量之和应低于法规限值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。年剂量限值控制全年所有职业照射之和，多电厂受照需累加。"},{"id":"safety_fs_0083","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射工作中收集的废水可以自行倒在反应堆厂房的地坑或地漏内。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。辐射工作收集的废水严禁自行倒入地坑地漏，必须按放射性废液收集处理。"},{"id":"safety_fs_0084","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在我们的日常生活中，很多物质是有天然放射性的。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。日常生活中很多物质具有天然放射性（如香蕉、石材、雨水）。"},{"id":"safety_fs_0085","module":"safety","bank":"辐射防护二级","type":"judge","stem":"一般来说，海拔高度越高，宇宙射线越强。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。海拔越高宇宙射线越强（高空飞行受照剂量明显增加）。"},{"id":"safety_fs_0086","module":"safety","bank":"辐射防护二级","type":"judge","stem":"日常生活中不存在辐射照射，只有在核电厂工作才会受到辐射照射。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。日常生活中到处存在天然辐射照射（本底辐射），并非只有核电厂才有。"},{"id":"safety_fs_0087","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在医院拍X光片、做CT时，人体不会受到辐射照射。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。拍X光片、做CT都会受到辐射照射（医疗照射是人工照射主要来源之一）。"},{"id":"safety_fs_0088","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射工作人员个人剂量限值的国家标准为任何一年中的有效剂量不大于50mSv且连续5年的年平均有效剂量不大于20mSv。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。个人剂量限值：任何一年不超过50mSv，连续5年平均不超过20mSv。"},{"id":"safety_fs_0089","module":"safety","bank":"辐射防护二级","type":"judge","stem":"1Sv（希伏）=100mSv（毫希伏）=10000μSv（微希伏）。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。1Sv=1000mSv=1000000μSv。"},{"id":"safety_fs_0090","module":"safety","bank":"辐射防护二级","type":"judge","stem":"剂量率用来表征放射性的强度，核电厂常用单位是mSv/h或者μSv/h。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。剂量率表征单位时间剂量，常用mSv/h或μSv/h（该单位表征剂量率而非放射性强度，以题库答案为准记忆）。"},{"id":"safety_fs_0091","module":"safety","bank":"辐射防护二级","type":"judge","stem":"核电厂表征放射性表面污染的常用单位是Bq/cm2","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。表面污染常用单位是Bq/cm²。"},{"id":"safety_fs_0092","module":"safety","bank":"辐射防护二级","type":"judge","stem":"核电厂表征放射性空气污染的常用单位为DAC,1DAC相当于10μSv/h。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。空气污染常用单位DAC，1DAC氚相当于10μSv/h。"},{"id":"safety_fs_0093","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内不允许吃东西、喝水等所有进食行为，主要目的是为了避免内照射。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。控制区禁止进食饮水，目的是防止放射性物质食入体内造成内照射。"},{"id":"safety_fs_0094","module":"safety","bank":"辐射防护二级","type":"judge","stem":"按照辐射防护要求使用呼吸保护设备，能有效降低个人内照射风险。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确.按要求使用呼吸保护设备能有效降低内照射风险。"},{"id":"safety_fs_0095","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在辐射控制区内产生的放射性废物，工作人员应该进行分类收集，并送到指定收集点。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。控制区内放射性废物应分类收集并送到指定收集点。"},{"id":"safety_fs_0096","module":"safety","bank":"辐射防护二级","type":"judge","stem":"如在辐射控制区外发现有辐射防护专用物品违规使用或遗弃，应及时通知辐射防护人员调查处理。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。发现辐射防护专用物品违规使用或遗弃应及时通知辐射防护人员处理。"},{"id":"safety_fs_0097","module":"safety","bank":"辐射防护二级","type":"judge","stem":"大多数放射性核素一旦进入人体内就很难被排出体外，其在寿期内将对人体形成持续照射。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。大多数放射性核素进入体内后很难排出，寿期内持续形成内照射。"},{"id":"safety_fs_0098","module":"safety","bank":"辐射防护二级","type":"judge","stem":"未经就业前医学检查和放射性工作适应性评价的工作人员不得从事辐射工作。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。未经就业前医学检查和适应性评价的人员不得从事辐射工作。"},{"id":"safety_fs_0099","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作人员在辐射工作过程中摄氚后，可以通过大量饮水、加大运动量、医学促排等方式加速体内水分排出体外，有效缩短氚的半减期，减少氚内照射剂量。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。摄氚后大量饮水、运动、医学促排可加速水分代谢排出氚，缩短体内滞留时间（以题库标准答案为准）。"},{"id":"safety_fs_0100","module":"safety","bank":"辐射防护二级","type":"judge","stem":"如果不开通电子剂量计，当现场辐射异常时，不会获得报警提醒。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。不开通电子剂量计就无报警功能，辐射异常时不会收到提醒。"},{"id":"safety_fs_0101","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作现场常常采用挂铅屏蔽的方法来降低工作人员内照射剂量。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。挂铅屏蔽降低的是外照射剂量，不是内照射剂量。"},{"id":"safety_fs_0102","module":"safety","bank":"辐射防护二级","type":"judge","stem":"对有放射性的设备进行研磨，应佩戴全面罩或气面罩，防止吸入放射性粉尘形成内照射。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。研磨放射性设备应戴全面罩或气面罩，防止吸入放射性粉尘。"},{"id":"safety_fs_0103","module":"safety","bank":"辐射防护二级","type":"judge","stem":"核电厂允许带有裸露伤口的工作人员进入辐射控制区从事放射性工作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。带有裸露伤口的人员禁止进入辐射控制区从事放射性工作。"},{"id":"safety_fs_0104","module":"safety","bank":"辐射防护二级","type":"judge","stem":"进入辐射控制区工作，必须将电子剂量计和热释光剂量计统一佩戴在左胸部。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。电子剂量计和热释光剂量计统一佩戴在左胸部。"},{"id":"safety_fs_0105","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区更衣间有3种颜色的连体服，工作人员可以根据自己的喜好自由选择。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误.连体服颜色对应不同分区/污染程度要求，必须按要求选择，不能按喜好选择。"},{"id":"safety_fs_0106","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作人员在门式污染监测仪（C1门）检测到有污染，可自行脱去连体服、工作鞋、手套，重新进入门式污染监测仪（C1门）检测。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。C1门检测到污染应通知辐射防护人员处理，不得自行脱去衣物重新检测了事。"},{"id":"safety_fs_0107","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作人员在卫生出入口借用的辐射仪表，应按要求正确使用，并按要求及时归还。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。卫生出入口借用的辐射仪表应正确使用并及时归还。"},{"id":"safety_fs_0108","module":"safety","bank":"辐射防护二级","type":"judge","stem":"从辐射控制区退出时，对于一些随身携带物品，可以不经过污染检测，直接从全身污染监测仪（C2门）带出。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。所有带出物品必须经过污染检测合格才能带出。"},{"id":"safety_fs_0109","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作人员在使用完全面罩、气衣等复用防护用品后可以放置在现场不必归还。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。全面罩、气衣等复用防护用品用后必须按规定归还（清洁维护备用）。"},{"id":"safety_fs_0110","module":"safety","bank":"辐射防护二级","type":"judge","stem":"模拟演练可以提高工作熟练程度、减少作业时间，是辐射防护最优化的具体措施之一。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。模拟演练提高熟练度、减少作业时间，是ALARA的具体措施。"},{"id":"safety_fs_0111","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射防护最优化意味着要不惜一切代价使个人剂量尽可能低。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。最优化是可合理达到的尽量低，要考虑代价与利益，不是不惜一切代价。"},{"id":"safety_fs_0112","module":"safety","bank":"辐射防护二级","type":"judge","stem":"表面污染是指放射性物质附着在物体表面。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。表面污染指放射性物质附着在物体（含体表）表面。"},{"id":"safety_fs_0113","module":"safety","bank":"辐射防护二级","type":"judge","stem":"空气污染是指放射性物质弥散在空气当中。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。空气污染指放射性物质弥散在空气中（气溶胶/气体）。"},{"id":"safety_fs_0114","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在实施有松散表面污染工作之前，我们需要在辐射控制区基本着装的基础上增加穿戴一些污染防护用品，以加强工作人员体表污染防护，尽量降低人员体表污染风险。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确.从事有松散污染工作前应在基本着装外加穿污染防护用品（纸衣、鞋套、手套等）。"},{"id":"safety_fs_0115","module":"safety","bank":"辐射防护二级","type":"judge","stem":"发现体表污染，如果可以自己处理，可以不通知辐射防护人员自行去污。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。发现体表污染必须通知辐射防护人员，不得自行去污了事。"},{"id":"safety_fs_0116","module":"safety","bank":"辐射防护二级","type":"judge","stem":"所有离开辐射控制区的人员和物品都必须进行表面污染检查。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。所有离开辐射控制区的人员和物品都必须进行表面污染检查。"},{"id":"safety_fs_0117","module":"safety","bank":"辐射防护二级","type":"judge","stem":"脱纸衣时，应注意避免接触纸衣的外表面，防止纸衣外表面的松散污染转移到身体其它部位。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。脱纸衣时避免接触外表面，防止污染转移到身体其他部位。"},{"id":"safety_fs_0118","module":"safety","bank":"辐射防护二级","type":"judge","stem":"如果工作过程中手部皮肤被划破，应立即停止辐射工作离开辐射控制区，并对伤口进行包扎处理。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。手部划破应立即停止辐射工作离开控制区，包扎处理（防内污染）。"},{"id":"safety_fs_0119","module":"safety","bank":"辐射防护二级","type":"judge","stem":"如果你被测量出体表有污染，应该在原地等待辐射防护人员，不要随意走动或触摸其它设备。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。测出体表污染应在原地等待辐射防护人员，不要随意走动触摸设备（防污染扩散）。"},{"id":"safety_fs_0120","module":"safety","bank":"辐射防护二级","type":"judge","stem":"气衣的呼吸部位设有紧急撕裂带，在紧急情况下使用可以防止窒息。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。气衣呼吸部位设紧急撕裂带，供气中断等紧急情况下撕开防止窒息。"},{"id":"safety_fs_0121","module":"safety","bank":"辐射防护二级","type":"judge","stem":"全身污染监测仪（C2 门）提示有污染时，工作人员可不通知辐射防护人员自行去污。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。C2门提示污染必须通知辐射防护人员，不能自行去污。"},{"id":"safety_fs_0122","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作现场闷热出汗时，可直接使用工作中的细纱手套擦汗。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。严禁用工作中的细纱手套擦汗（污染转移到面部，增加内照射风险）。"},{"id":"safety_fs_0123","module":"safety","bank":"辐射防护二级","type":"judge","stem":"女性工作人员发觉自己怀孕后应及时通知用人单位，以便必要时改善其工作条件。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。怀孕后应及时通知用人单位，必要时改善工作条件（胎儿辐射敏感）。"},{"id":"safety_fs_0124","module":"safety","bank":"辐射防护二级","type":"judge","stem":"用电子剂量计测量现场剂量率或随处乱放个人剂量计，都属于严重违章行为，一旦发现将受到重罚。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。用电子剂量计测剂量率或乱放剂量计属严重违章（剂量数据失真）。"},{"id":"safety_fs_0125","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区红区，工作人员因工作需要可直接进入。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。红区严禁直接进入，必须获得许可并采取专门防护措施。"},{"id":"safety_fs_0126","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区专用的手套、鞋套等防护用品，严禁带到非辐射控制区使用。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。控制区专用手套、鞋套等严禁带到非辐射控制区使用。"},{"id":"safety_fs_0127","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作人员因工作需要，可自行跨越辐射防护隔离边界。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。严禁自行跨越辐射防护隔离边界。"},{"id":"safety_fs_0128","module":"safety","bank":"辐射防护二级","type":"judge","stem":"进入辐射控制区的物品，应尽可能拆除外包装，反应堆水池和乏燃料水池附近禁止使用白色透明塑料袋或塑料布。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。进控制区物品尽量拆除包装；水池附近禁用白色透明塑料袋（水下辨识需要）。"},{"id":"safety_fs_0129","module":"safety","bank":"辐射防护二级","type":"judge","stem":"高辐射区域工作，应尽量减少现场工作人数，暂时与工作无关的人员应撤至低剂量等待区。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。高辐射区工作应减少现场人数，无关人员撤至低剂量等待区。"},{"id":"safety_fs_0130","module":"safety","bank":"辐射防护二级","type":"judge","stem":"高辐射区域工作，只要穿上铅衣，就可以对γ外照射百分百防护。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。铅衣只能部分屏蔽γ射线，不能百分百防护。"},{"id":"safety_fs_0131","module":"safety","bank":"辐射防护二级","type":"judge","stem":"外照射是人体外的辐射射线对人体形成的照射,在核电站外照射是工作人员接受照射的最常见和最主要方式。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。外照射是核电站工作人员受照的最常见最主要方式。"},{"id":"safety_fs_0132","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在工作场所剂量率不变的情况下，受照剂量与受照时间成正比，因此想方设法减少工作时间是降低受照剂量的有效方法。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。剂量率一定时剂量与时间成正比，减少时间是降低剂量的有效方法。"},{"id":"safety_fs_0133","module":"safety","bank":"辐射防护二级","type":"judge","stem":"低剂量等待区是为避免工作人员在暂时没有工作任务的时候，仍呆在工作现场接受无谓的辐射照射而建立的一个等待区域，低剂量等待区的辐射水平一般都非常低。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。低剂量等待区辐射水平一般非常低，避免无谓照射。"},{"id":"safety_fs_0134","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作人员可通过查看现场辐射防护标识了解现场的辐射水平。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。通过现场辐射防护标识可了解现场辐射水平。"},{"id":"safety_fs_0135","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区房间标牌不仅仅告诉你某个房间属于辐射控制区，更重要的是向工作人员提供房间内的辐射水平及进入该房间的辐射防护要求。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。控制区房间标牌提供房间辐射水平及进入的防护要求。"},{"id":"safety_fs_0136","module":"safety","bank":"辐射防护二级","type":"judge","stem":"如果房间内有热点，辐射防护人员将在房间标牌上写明，同时使用标签和标牌对热点位置进行标识。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。房间内有热点时在标牌写明，并用标签标牌标识热点位置。"},{"id":"safety_fs_0137","module":"safety","bank":"辐射防护二级","type":"judge","stem":"正常运行期间，红色标牌的房间，未经授权严禁进入。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。红色标牌房间未经授权严禁进入。"},{"id":"safety_fs_0138","module":"safety","bank":"辐射防护二级","type":"judge","stem":"正在进行射线探伤的区域，任何人员严禁进入。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。正在射线探伤的区域任何人员严禁进入。"},{"id":"safety_fs_0139","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区的红区和橙区正常均上锁管理，进入必须获得辐射防护部门许可。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。红区橙区正常均上锁管理，进入须辐射防护部门许可。"},{"id":"safety_fs_0140","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射分区标示牌上一般应包含子区区域等级、辐射水平、防护要求等内容。‘区域等级’用于标示该子区的分区状况；‘辐射水平’显示分区的环境剂量率水平；‘防护要求’用于向进入该分区的工作人员进行风险提示和防护建议。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。分区标示牌包含区域等级、辐射水平、防护要求等内容。"},{"id":"safety_fs_0141","module":"safety","bank":"辐射防护二级","type":"judge","stem":"通过全身污染监测仪（C2门）门时，人员可以携带钥匙、签字笔等尖锐物品进行测量。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。过C2门测量时严禁携带钥匙、签字笔等尖锐物品（损坏设备/影响测量）。"},{"id":"safety_fs_0142","module":"safety","bank":"辐射防护二级","type":"judge","stem":"工作人员可以带着物品设备的外包装进入辐射控制区工作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误.物品外包装不得带入辐射控制区（应去除，减少废物）。"},{"id":"safety_fs_0143","module":"safety","bank":"辐射防护二级","type":"judge","stem":"反应堆卸料停堆期间, 反应堆厂房各区域没有γ照射。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。卸料停堆期间反应堆厂房仍有γ照射（裂变产物衰变γ持续存在）。"},{"id":"safety_fs_0144","module":"safety","bank":"辐射防护二级","type":"judge","stem":"反应堆卸料停堆期间, 反应堆厂房环境中没有中子照射。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。卸料停堆后无裂变反应，环境中没有中子照射。"},{"id":"safety_fs_0145","module":"safety","bank":"辐射防护二级","type":"judge","stem":"γ射线可以穿透管道、设备的结构材料，对人体造成伤害。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。γ射线穿透力强，可穿透管道设备结构材料伤人。"},{"id":"safety_fs_0146","module":"safety","bank":"辐射防护二级","type":"judge","stem":"放射性热点为接触剂量率水平高于环境剂量率3倍，且接触剂量率达到0.5mSv/h的点或局部。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。放射性热点定义：接触剂量率高于环境3倍且达到0.5mSv/h的点或局部。"},{"id":"safety_fs_0147","module":"safety","bank":"辐射防护二级","type":"judge","stem":"离开辐射控制区，人员需要污染监测，随身携带的个人物品可以不进行污染监测。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。离开控制区时人员与随身物品都必须进行污染监测。"},{"id":"safety_fs_0148","module":"safety","bank":"辐射防护二级","type":"judge","stem":"开展高辐射风险工作，不需要提前联系辐射防护人员开展风险分析和确认防护措施。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。高辐射风险工作必须提前联系辐射防护人员开展风险分析和确认防护措施。"},{"id":"safety_fs_0149","module":"safety","bank":"辐射防护二级","type":"judge","stem":"如果需要打开辐射控制区边界，必须在在辐射防护人员许可和监护下进行。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。打开辐射控制区边界必须在辐射防护人员许可和监护下进行。"},{"id":"safety_fs_0150","module":"safety","bank":"辐射防护二级","type":"judge","stem":"在辐射控制区内从事辐射工作的过程中，工作负责人可根据工作经验，自行降低防护级别。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。严禁凭经验自行降低防护级别，须按辐射工作许可证要求执行。"},{"id":"safety_fs_0151","module":"safety","bank":"辐射防护二级","type":"judge","stem":"为保证工作进度，减少在辐射控制区内的工作时间，在电子剂量剂报警的情况下，现场工作人员可以继续工作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"错误。电子剂量计报警时严禁继续工作，必须撤离并报告。"},{"id":"safety_fs_0152","module":"safety","bank":"辐射防护二级","type":"judge","stem":"开展高辐射风险工作时，辐射安全检查点必须通知辐射防护人员现场检查确认。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。高辐射风险工作的辐射安全检查点必须通知辐射防护人员现场检查确认。"},{"id":"safety_fs_0153","module":"safety","bank":"辐射防护二级","type":"judge","stem":"高辐射风险的工作，工作人员必须在卫生出入口进行风险交底及领用特殊辐射防护用品。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确.高辐射风险工作须在卫生出入口进行风险交底并领用特殊防护用品。"},{"id":"safety_fs_0154","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射工作过程中，如果电子剂量计报警，应及时按照要求离开工作地点并告知辐射防护人员。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。电子剂量计报警应及时离开工作地点并告知辐射防护人员。"},{"id":"safety_fs_0155","module":"safety","bank":"辐射防护二级","type":"judge","stem":"核电厂个人剂量监测项目包括外照射监测和内照射监测。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。个人剂量监测包括外照射监测（EPD、TLD）和内照射监测（WBC、尿氚）。"},{"id":"safety_fs_0156","module":"safety","bank":"辐射防护二级","type":"judge","stem":"辐射控制区内红区均上锁关闭，进入红区的人员必须具备有效的RP2资格授权，并得到生产厂长或副厂长的书面批准，工作期间由辐射防护人员现场监护。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"正确。红区上锁管理，进入须RP2授权和生产厂长/副厂长书面批准，辐射防护人员现场监护。"},{"id":"basics_cl_0001","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"压水堆核电站燃料元件包壳一般采用（　）。","options":["A锆合金","B不锈钢","C铝合金","D镍基合金"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件：PWR包壳一般采用锆合金。"},{"id":"basics_cl_0002","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"反应堆压力容器广泛采用MnMoNi钢（如A508-Cl.3），为防止腐蚀，与冷却剂接触的内壁（　）。","options":["A堆焊一层或两层奥氏体不锈钢衬里","B进行镀锌处理","C涂防腐油漆","D采用外加电流阴极保护"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件：内壁堆焊奥氏体不锈钢衬里。"},{"id":"basics_cl_0003","module":"basics","bank":"核电基础-材料基础","type":"single","stem":"优质碳素结构钢45钢牌号中的\"45\"表示（　）。","options":["A平均含碳量为0.45%","B平均含碳量为4.5%","C抗拉强度为450MPa","D平均含锰量为0.45%"],"answer":["A"],"score":null,"source":"generated","origin":"材料基础课件","explanation":"依据课件：45表示平均含 ":"single","stem":"区域污染事件包括：（　）","options":["辐射控制区内污染水平超过40贝克每平方厘米，且污染面积超过1平方米","辐射控制区内污染水平超过4贝克每平方厘米，且污染面积超过10平方米","辐射控制区外污染水平超过0.4贝克每平方厘米","A+B+C"],"answer":["D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"区域污染事件的判断标准：辐射控制区内污染水平超过40Bq/cm²且污染面积超过1㎡；辐射控制区内污染水平超过4Bq/cm²且污染面积超过10㎡；辐射控制区外污染水平超过0.4Bq/cm²。三项均属于区域污染事件。"},{"id":"notes_fs_0005","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"特别重大辐射事故，是指Ⅰ类、Ⅱ类放射源丢失、被盗、失控造成大范围严重辐射污染后果，或者放射性同位素和射线装置失控、辐射防护管理或技术失效导致（　）人员急性死亡。","options":["3人以上（含3人）","2人以下（含2人）","9人以下（含9人）","5人以下（含5人）"],"answer":["A"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"特别重大辐射事故包括导致3人以上（含3人）急性死亡的情形；重大辐射事故对应2人以下（含2人）急性死亡。"},{"id":"notes_fs_0006","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"对辐射工作人员来说，每年的有效剂量限值是任何一年不得超过30mSv，连续5年内平均不得超过20mSv。","options":null,"answer":["错误"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"依据GB18871-2002，辐射工作人员每年的有效剂量限值是任何一年不得超过50mSv（不是30mSv），连续5年内平均不得超过20mSv。"},{"id":"notes_fs_0007","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"辐射防护指标重点关注人的辐射安全和物的辐射安全。","options":null,"answer":["正确"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"辐射防护指标的设置最终目标是确保人的安全和物的安全。"},{"id":"notes_fs_0008","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"辐射工作全流程管理不包括：（　）","options":["在工作准备阶段，需要对辐射工作进行辐射风险分析","执行现场工作前，办理辐射工作许可证","到达设备检修作业场地，立刻开始作业","作业结束后对检修的工器具，检修场地、工作票等做好清点、归还和关闭"],"answer":["C"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"到达作业场地后不能立刻开始作业，需先按辐射工作许可证和控制点文件开展先决条件检查、进行工前测量等。"},{"id":"notes_fs_0009","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"正在检修设备的班组成员佩戴的电子剂量计EPD出现报警，作为工作负责人，你该如何处理：（　）","options":["当什么都没发生，指令其继续工作","征询班组成员意见，讨论是否继续作业","确保设备处于安全状态下，立即暂停工作，撤离至安全区域并报告辐射防护人员","打电话给主控，请求值长下达指令"],"answer":["C"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"电子剂量计报警时应确保设备处于安全状态、立即暂停工作并撤离至安全区域，报告辐射防护人员进行调查评估。有案例显示人员报警后未撤离继续工作9分钟，导致受照剂量达3.422mSv。"},{"id":"notes_fs_0010","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"辐射工作许可证（RWP）由高到低分别为4级、3级、2级和1级。","options":null,"answer":["错误"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"辐射工作许可证（RWP）由高到低分别为1级、2级、3级和4级；1级辐射风险最高，4级最低。"},{"id":"notes_fs_0011","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"辐射防护停工待检点任何情况都禁止逾越，必须经辐射防护人员检查、签字确认符合要求后才能继续后继工作。","options":null,"answer":["正确"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"RP-H点（停工待检点）必须由辐射防护人员到场放行并签字后才能继续后续工作，多数跨越H点行为属于红黄线违章。"},{"id":"notes_fs_0012","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"ALARA（辐射防护最优化）的含义是：（　）","options":["在考虑经济和社会因素后，个人受照剂量的大小、受照人数以及受照的可能性均保持在可合理达到的尽量低水平","不惜一切代价将个人剂量降到最低","只要不超过国家剂量限值即可，无需进一步优化","尽量减少进入辐射控制区的人次数"],"answer":["A"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注（简答改编）","explanation":"ALARA即\"可合理达到的尽量低\"：在考虑经济、社会和政治等各方面因素之后，个人受照剂量大小、受照人数以及受照可能性均保持在可合理达到的尽量低水平。"},{"id":"notes_fs_0013","module":"safety","bank":"辐射防护二级（课件题）","type":"multi","stem":"减少作业人工时（从而降低集体剂量）的做法包括：（　）","options":["细致的工作准备，包括文件、器材、工器具","持续进行人员培训，提高工作技能，通过沙盘推演、模拟培训或操作演练","良好的工作实施管理，包括人员分工及作业行为（讨论待命在低剂量等待区等）","无限制地增加人员轮换次数"],"answer":["A","B","C"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注（简答改编）","explanation":"减少人工时的方法：细致的工作准备、持续人员培训、良好的工作实施管理。无限制增加人员轮换不是ALARA的体现，只有在特殊情况下（如可能超过个人剂量控制值时）才合理采取轮换方式。"},{"id":"notes_fs_0014","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"为了降低个人受照剂量，可以无限制地增加人员采取轮换方式开展工作，这是ALARA的体现。","options":null,"answer":["错误"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"只有在特殊情况下，例如可能超过个人剂量控制值时，合理地采取人员轮换方式进行作业，可降低个人受照剂量；无限制轮换会增加集体剂量，不是ALARA的体现。"},{"id":"notes_fs_0015","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"下列对于放射性物品厂内运输人员受照剂量和辐射水平监测的描述，正确的是：（　）","options":["参与运输的人员都应佩戴个人剂量计","运输工作负责人应全程跟踪","使用车辆运输结束后，辐射防护人员对车辆进行表面污染普查","A+B+C"],"answer":["D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"放射性货包运输人员必须有RP授权，运输期间须佩戴个人剂量计；运输负责人对运输过程辐射安全负责并全程跟踪；车辆运输结束后由辐射防护人员进行表面污染普查。三项均正确。"},{"id":"notes_fs_0016","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"关于放射性物品厂内运输要求，下列说法错误的是：（　）","options":["货包装车时，应合理安排货包位置以降低车辆周围的剂量率（剂量率高的货包尽量放置在车厢中部）","运输车辆外表面任一点上的辐射水平不得超过2mSv/h","运输驾驶员座位处的辐射水平应尽可能低，一般不得超过0.1mSv/h","在运输的起点和终点之间，可以临时决定进行装卸工作"],"answer":["D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"放射性物品运输车辆在正常情况下不允许中途停留，严禁途中打开运输包装，更不允许临时装卸；时间地点有变化须重新办理审批。"},{"id":"notes_fs_0017","module":"safety","bank":"辐射防护二级（课件题）","type":"single","stem":"放射性物品禁止与非放射性物品混放，非放射性物品与放射性物品存放场地至少应保证的间隔距离是：（　）","options":["30cm","4m","6m","2m"],"answer":["A"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"非放射性物品存放场地与放射性物品存放场地的间隔至少为30厘米。"},{"id":"notes_fs_0018","module":"safety","bank":"辐射防护二级（课件题）","type":"judge","stem":"放射性物品运输和存放不当，存在污染扩散和人员接受不必要照射的风险。","options":null,"answer":["正确"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注","explanation":"放射性物品运输须先包装审批，存放须规范管理，否则存在污染扩散和不必要照射的风险。"},{"id":"notes_fs_0019","module":"safety","bank":"辐射防护二级（课件题）","type":"multi","stem":"你和你的班组，可以通过哪些方式获取现场射线探伤信息？（　）","options":["核电厂网页发布的射线探伤公告","主要出入口的探伤告示牌","就地的探伤标识和声光报警","主控广播通知"],"answer":["A","B","C","D"],"score":null,"source":"ppt-notes","origin":"辐射防护二级课件备注（简答改编）","explanation":"获取射线探伤信息的方式：核电厂网页发布的射线探伤公告、主要出入口的探伤告示牌、就地的探伤标识和声光报警、主控广播通知。射线探伤期间严禁跨越隔离带。"},{"id":"qihang_dyk_0001","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"中核集团秉持的企业核心价值观是（　）。","options":["责任、安全、创新、卓越","诚信、责任、创新、共赢","事业、责任、严细、进取","科技赋能、产业造福"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件：中核集团秉持“责任、安全、创新、卓越”价值观。"},{"id":"qihang_dyk_0002","module":"qihang","bank":"启航-入职第一课","type":"multi","stem":"“四个一切”核工业精神包括（　）。","options":["事业高于一切","责任重于一切","严细融入一切","效率高于一切"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件：四个一切为事业、责 /* ================= 常量与工具 ================= */
const TYPE_NAME = {single:"单选", multi:"多选", judge:"判断", fill:"填空", qa:"问答"};
const SRC_NAME = {official:"真题", "ppt-notes":"课件题", generated:"生成题"};
const SRC_CLASS = {official:"s-official", "ppt-notes":"s-ppt-notes", generated:"s-generated"};
const DEFAULT_SCORE = {single:2, multi:3, judge:1};
const LETTERS = "ABCDEF";
const bankKey = m=>m;

const questions = DATA.questions;
const QMAP = {}; questions.forEach(q=>QMAP[q.id]=q);
const BANKS = {}; // key=module -> {module,bank(=模块名),list}
questions.forEach(q=>{
  const k = bankKey(q.module);
  (BANKS[k] = BANKS[k] || {module:q.module, bank:DATA.modules[q.module]||q.module, list:[]}).list.push(q);
});

function $(s,p){return (p||document).querySelector(s);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function qScore(q){return q.score!=null ? q.score : (DEFAULT_SCORE[q.type]||1);}
function ansText(q){
  if(q.type==="judge") return q.answer[0];
  if(!q.options) return "";
  return q.answer.map(l=>l+"．"+q.options[LETTERS.indexOf(l)]).join("　");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600);}

/* ================= 持久化状态 ================= */
const SKEY = "tiku_v1";
let S;
function loadState(){
  try{S=JSON.parse(localStorage.getItem(SKEY)||"{}");}
  catch(e){S={};}
  S.done=S.done||{};   // qid -> {c:对次数, w:错次数, t:最后时间}
  S.wrong=S.wrong||{}; // qid -> 1
  S.fav=S.fav||{};     // qid -> 1
  S.seq=S.seq||{};     // bankKey -> 已练到的下标
  S.daily=S.daily||{}; // "YYYY-MM-DD" -> 题数
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function bumpDaily(){const d=today();S.daily[d]=(S.daily[d]||0)+1;save();}

/* ================= 视图路由 ================= */
let stack = [];
function go(view, noPush){
  if(!noPush && curView) stack.push(curView);
  curView = view;
  render();
}
let curView = null;
function back(){
  if(stack.length){curView=stack.pop();render();}
  else go({name:"home"},true);
}

/* ================= 练习视图 ================= */
function buildPool(bankK, srcFilter, typeFilter){
  const b=BANKS[bankK];let list=b.list;
  if(srcFilter && srcFilter!=="all"){
    const allow=srcFilter.split("+");
    list=list.filter(q=>allow.includes(q.source));
  }
  if(typeFilter&&typeFilter.length)list=list.filter(q=>typeFilter.includes(q.type));
  return list;
}
function newSession(v){
  let list;
  if(v.mode==="wrong")list=Object.keys(S.wrong).filter(id=>QMAP[id]);
  else if(v.mode==="fav")list=Object.keys(S.fav).filter(id=>QMAP[id]);
  else{
    list=buildPool(v.bank,v.src,v.types);
    if(v.mode==="rand")list=shuffle(list);
  }
  return {list:list.map(q=>q.id), idx:0, mode:v.mode, bank:v.bank,
    src:v.src||"all", types:v.types||null, picked:{}, judged:{},
    seqPos: v.mode==="seq" ? (S.seq[bankKeyOf(v)]||0) : 0};
}
function bankKeyOf(v){return v.bank || v.mode;}
function startSession(v){
  const s=newSession(v);
  if(!s.list.length){toast("该筛选条件下没有题目");return;}
  if(s.mode==="seq"&&s.seqPos>=s.list.length)s.seqPos=0;
  s.idx=s.seqPos||0;
  go({name:"practice",s});
}

function practiceHeader(s){
  const idx=s.idx+1,total=s.list.length;
  const answered=Object.keys(s.judged).length;
  const pct=total?Math.round(answered/total*100):0;
  return `<div class="pbar-wrap"><div class="ptxt"><span>${s.mode==="recite"?"背题模式":s.mode==="wrong"?"错题重练":s.mode==="fav"?"收藏练习":s.mode==="rand"?"随机练习":"顺序练习"} · ${answered>idx?answered:idx}/${total}</span><span>${pct}%</span></div>
  <div class="pbar"><div style="width:${pct}%"></div></div></div>`;
}

function renderQ(s,q){
  const judged = q.id in s.judged ? s.judged[q.id] : undefined;
  const picked = s.picked[q.id]||[];
  let h=`<div class="qhead">
    <span class="tag ${SRC_CLASS[q.source]}">${SRC_NAME[q.source]}</span>
    <span class="tag t-${q.type}">${TYPE_NAME[q.type]}</span>
    <span class="qno">📚 ${esc(q.bank)}</span></div>`;
  h+=`<div class="stem">${esc(q.stem)}</div>`;
  if(q.type==="judge"){
    const right=q.answer[0];
    const p1=picked.includes("正确"),p2=picked.includes("错误");
    let c1="",c2="";
    if(judged!==undefined){
      c1 = right==="正确"?"right":(p1?"wrongpick":"");
      c2 = right==="错误"?"right":(p2?"wrongpick":"");
    }
    h+=`<div class="judge-row">
      <button class="judge-btn ${c1}" data-j="正确">✓ 正确</button>
      <button class="judge-btn ${c2}" data-j="错误">✗ 错误</button></div>`;
  }else{
    h+=`<div class="opts">`+q.options.map((o,i)=>{
      const L=LETTERS[i];let cls="";
      if(judged!==undefined){
        if(q.answer.includes(L))cls="right";
        else if(picked.includes(L))cls="wrongpick";
        else cls="dim";
      }else if(picked.includes(L))cls="picked";
      return `<button class="opt ${cls}" data-o="${L}"><span class="ol">${L}</span><span>${esc(o)}</span></button>`;
    }).join("")+`</div>`;
    if(q.type==="multi"&&!judged)
      h+=`<div class="confirm-bar"><button class="big-btn ghost" id="confirm-multi" ${picked.length?"":"disabled"}>确认（已选 ${picked.length} 项）</button></div>`;
  }
  if(judged!==undefined||s.mode==="recite"){
    const ok = s.mode==="recite"?null:judged;
    if(ok!==null)
      h+=`<div class="feedback ${ok?"ok":"bad"}">${ok?"<b>回答正确</b>":"<b>回答错误</b>"}　正确答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    else
      h+=`<div class="feedback ok">答案：<b>${q.type==="judge"?q.answer[0]:q.answer.join("")}</b></div>`;
    if(q.type!=="judge"&&q.options)h+=`<div class="mut" style="margin-top:6px;font-size:13.5px;">${esc(ansText(q))}</div>`;
    if(q.explanation){
      const offi = q.source==="ppt-notes";
      h+=`<div class="expl"><div class="elabel">📖 ${offi?'<span class="tag s-ppt-notes" style="font-size:10px;">官方讲解</span>':'<span class="tag s-generated" style="font-size:10px;">AI 解析 · 仅供参考</span>'}</div>${esc(q.explanation)}</div>`;
    }
    if(q.source==="generated")h+=`<div class="mut" style="margin-top:6px;font-size:12px;">出处：${esc(q.origin||"")}</div>`;
  }
  return h;
}

function bindPractice(v){
  const s=v.s;
  const q = s.idx<s.list.length ? QMAP[s.list[s.idx]] : null;
  if(!q){
    const again=$("#btn-again");
    if(again){
      again.onclick=()=>{const nv={...v,s:newSession({mode:s.mode,bank:s.bank,src:s.src,types:s.types})};if(s.mode==="seq")S.seq[bankKeyOf(s)]=0,save();nv.s.idx=0;go(nv,true);};
      $("#btn-back-home").onclick=()=>{stack=[];go({name:"home"},true);};
    }
    return;
  }
  const qcard=$("#qcard");
  qcard.onclick=(e)=>{
    const jb=e.target.closest("[data-j]");
    const ob=e.target.closest("[data-o]");
    const cb=e.target.closest("#confirm-multi");
    if(s.mode==="recite")return;
    if(q.id in s.judged)return;
    if(q.type==="judge"&&jb){
      judge(q,[jb.dataset.j]);
    }else if(q.type==="single"&&ob){
      judge(q,[ob.dataset.o]);
      }else if(q.type==="multi"){
      if(ob){
        const p=(s.picked[q.id]=s.picked[q.id]||[]);
        const i=p.indexOf(ob.dataset.o);
        if(i>=0)p.splice(i,1);else p.push(ob.dataset.o);
        s.picked[q.id]=p.slice().sort();
        render();
      }else if(cb){
        if((s.picked[q.id]||[]).length)judge(q,s.picked[q.id].slice().sort());
      }
    }
  };
  function judge(q,picked){
    s.picked[q.id]=picked;
    const ok = q.type==="judge"
      ? picked[0]===q.answer[0]
      : picked.length===q.answer.length && picked.every((l,i)=>l===q.answer[i]);
    s.judged[q.id]=ok;
    const d=S.done[q.id]=S.done[q.id]||{c:0,w:0};
    if(ok)d.c++;else{d.w++;S.wrong[q.id]=1;}
    if(ok&&s.mode==="wrong")delete S.wrong[q.id];
    bumpDaily();save();render();
  }
}

  </div>`;

function bindExamSetup(v){
  const defSrc=(v.src==="all"||buildPool(v.bank,"official",null).length===0)?"all":"official";
  const st={src:v.src||defSrc,cnt:null,min:1};
  $("#exam-src").onclick=e=>{const c=e.target.closest("[data-src]");if(!c)return;
    st.src=c.dataset.src;[...$("#exam-src").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-cnt").onclick=e=>{const c=e.target.closest("[data-cnt]");if(!c)return;
    st.cnt=+c.dataset.cnt;[...$("#exam-cnt").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-time").onclick=e=>{const c=e.target.closest("[data-min]");if(!c)return;
    st.min=+c.dataset.min;[...$("#exam-time").children].forEach(x=>x.classList.toggle("on",x===c));};
  $("#exam-start").onclick=()=>{
    if(!st.cnt){toast("请选择题数");return;}
    const pool=buildPool(v.bank,st.src,null).filter(q=>["single","multi","judge"].includes(q.type));
    // 按题型比例抽题
    const byType={};pool.forEach(q=>(byType[q.type]=byType[q.type]||[]).push(q));
    const picked=[];
    let total=pool.length, need=st.cnt;
    ["single","multi","judge"].forEach(t=>{
      if(!byType[t])return;
      const n=Math.min(byType[t].length,Math.round(need*byType[t].length/total));
      picked.push(...shuffle(byType[t]).slice(0,n));
    });
    let exam={list:shuffle(picked).map(q=>q.id),idx:0,picked:{},submitted:false,
      bank:v.bank,timeLimit:Math.round(st.cnt*st.min*60),remain:Math.round(st.cnt*st.min*60),startAt:Date.now()};
    go({name:"exam",s:exam});
  };
}

function bindExam(v){
  const s=v.s;
  if(s.submitted){bindResult(v);return;}
  const q=QMAP[s.list[s.idx]];
  document.querySelector(".card").onclick=e=>{

  $("#f-sheet").onclick=()=>openSheet(s,submitExam);

let examTimer=null;
function startExamTimer(v){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    const s=v.s;
    if(!s||s.submitted||curView!==v){clearInterval(examTimer);return;}
    s.remain--;
    const t=$("#exam-timer");
    if(t){t.textContent=fmtTime(s.remain);t.classList.toggle("danger",s.remain<60);}
    if(s.remain<=0){clearInterval(examTimer);toast("时间到，自动交卷");submitExam(v);}
  },1000);
}
function submitExam(v){
  const s=v.s;if(s.submitted)return;
  const unanswered=s.list.length-Object.keys(s.picked).length;
  const doSubmit=()=>{
    s.submitted=true;
    let score=0,full=0,correct=0,wrongList=[];
    s.list.forEach(id=>{
      const q=QMAP[id];full+=qScore(q);
      const picked=s.picked[id]||[];
      const ok=q.type==="judge"?picked[0]===q.answer[0]
        :picked.length===q.answer.length&&picked.slice().sort().every((l,i)=>l===q.answer[i]);
      if(ok){score+=qScore(q);correct++;}
      else{wrongList.push(id);
        const d=S.done[id]=S.done[id]||{c:0,w:0};d.w++;S.wrong[id]=1;}
      if(ok){const d=S.done[id]=S.done[id]||{c:0,w:0};d.c++;}
      if(picked.length)bumpDaily();
    });
    s.score=score;s.full=full;s.correct=correct;s.wrongList=wrongList;
    clearInterval(examTimer);save();
    stack=stack.filter(x=>x.name!=="exam");
    go({name:"exam",s},true);
  };
  if(unanswered>0){
    if(confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`))doSubmit();
  }else doSubmit();
}
function vResult(v){
  const s=v.s;
  const pct=s.full?Math.round(s.score/s.full*100):0;
  const pass=pct>=80;
  let h=`<div class="card" style="text-align:center;">
    <div class="score-circle ${pass?"pass":"fail"}"><div class="sv">${pct}</div><div class="sk">得分 / 100</div></div>
    <div style="font-weight:700;font-size:17px;color:${pass?"var(--ok)":"var(--bad)"}">${pass?"恭喜通过":"未达 80 分，继续加油"}</div>
    <div class="result-nums">
      <div class="stat-cell"><div class="v">${s.correct}</div><div class="k">答对</div></div>
      <div class="stat-cell"><div class="v">${s.wrongList.length}</div><div class="k">答错</div></div>
      <div class="stat-cell"><div class="v">${s.score.toFixed(1)}</div><div class="k">得 / ${s.full.toFixed(1)}分</div></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="big-btn ghost" id="res-review">错题回顾（${s.wrongList.length}）</button>
      <button class="big-btn" id="res-home">返 回</button></div>
  </div>`;
  if(!s.wrongList.length)h=h.replace("错题回顾（0）","全对啦");
  return h;
}

  const s=v.s;
  $("#res-home").onclick=()=>{stack=[];go({name:"home"},true);};
  $("#res-review").onclick=()=>{
    if(!s.wrongList.length){toast("没有错题");return;}
    go({name:"practice",s:{list:s.wrongList.slice(),idx:0,mode:"wrong",judged:{},picked:{}}});
  };
}

/* ================= 答题卡 ================= */
function openSheet(s,onSubmit){
  const isExam = typeof onSubmit==="function";
  let gridHTML=s.list.map((id,i)=>{
    let cls="";
    if(isExam){if(s.picked[id])cls="done";}
    else{if(s.judged[id]!=null)cls=s.judged[id]?"done-ok":"done-bad";}
    if(i===s.idx)cls+=" cur";
    return `<button class="sq ${cls}" data-i="${i}">${i+1}</button>`;
  }).join("");
  const mask=document.createElement("div");
  mask.className="sheet-mask";
  mask.innerHTML=`<div class="sheet"><h3>答题卡（共 ${s.list.length} 题）</h3>
    <div class="grid">${gridHTML}</div>
    ${isExam?`<div style="margin-top:14px;display:flex;gap:10px;">
      <button class="big-btn ghost" id="sheet-close">继续作答</button>
      <button class="big-btn" id="sheet-submit">交 卷</button></div>`
    :`<div style="margin-top:14px;"><button class="big-btn ghost" id="sheet-close">关 闭</button></div>`}
  </div>`;
  document.body.appendChild(mask);
  mask.addEventListener("click",e=>{
    if(e.target===mask)mask.remove();
    const sq=e.target.closest("[data-i]");
    if(sq){s.idx=+sq.dataset.i;if(s.mode==="seq"&&curView.name==="practice"){S.seq[bankKeyOf(s)]=s.idx;save();}mask.remove();render();}
    if(e.target.id==="sheet-close")mask.remove();
    if(e.target.id==="sheet-submit"){mask.remove();onSubmit(curView);}
  });
}

/* ================= 收藏 / 错题（合并页） ================= */
function vFav(){
  const wrongIds=Object.keys(S.wrong).filter(id=>QMAP[id]);
  const favIds=Object.keys(S.fav).filter(id=>QMAP[id]);
  if(!wrongIds.length&&!favIds.length)
    return `<div class="empty"><div class="eic">🗒</div>还没有收藏或错题<br>做题时点 ☆ 收藏难题；答错的题会自动收进错题</div>`;
  const item=id=>{
    const q=QMAP[id];
    const isWrong=!!S.wrong[id];
    return `<div class="res-item" data-qid="${id}">
      <div class="rs">${esc(q.stem)}</div>
      <div class="rmeta">${isWrong?`<span class="tag s-wrongmark" style="font-size:10px;">✗ 错题</span>`:""}
      ${S.fav[id]?`<span class="tag s-favmark" style="font-size:10px;">★ 收藏</span>`:""}
      <span class="tag ${SRC_CLASS[q.source]}" style="font-size:10px;">${SRC_NAME[q.source]}</span>
      <span class="tag t-${q.type}" style="font-size:10px;">${TYPE_NAME[q.type]}</span>
      <span>${esc(DATA.modules[q.module]||"")} · ${esc(q.bank)}</span></div></div>`;
  };
  let h=`<h2 class="pg">收藏 / 错题</h2>`;
  if(wrongIds.length){
    h+=`<div class="sec-title">错题（${wrongIds.length}）</div><div class="card" style="padding:4px 14px;">${wrongIds.map(item).join("")}</div>`;
  }
  if(favIds.length){
    h+=`<div class="sec-title">收藏（${favIds.length}）</div><div class="card" style="padding:4px 14px;">${favIds.map(item).join("")}</div>`;
  }
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap;">`;
  if(wrongIds.length)h+=`<button class="big-btn" style="flex:1;min-width:120px;" id="btn-practice-wrong">错题重练</button>`;
  if(favIds.length)h+=`<button class="big-btn ghost" style="flex:1;min-width:120px;" id="btn-practice-fav">收藏练习</button>`;
  h+=`<button class="big-btn ghost" id="btn-clear-list">清空</button></div>`;
  return h;
}
function bindList(){
  document.querySelectorAll("[data-qid]").forEach(el=>{
    el.onclick=()=>go({name:"qview",qid:el.dataset.qid});
  });
  const pw=$("#btn-practice-wrong");
  if(pw)pw.onclick=()=>{
    const ids=Object.keys(S.wrong).filter(id=>QMAP[id]);
    if(ids.length)go({name:"practice",s:{list:ids.slice(),idx:0,mode:"wrong",judged:{},picked:{}}});
  };
  const pf=$("#btn-practice-fav");
  if(pf)pf.onclick=()=>{
    const ids=Object.keys(S.fav).filter(id=>QMAP[id]);
    if(ids.length)go({name:"practice",s:{list:ids.slice(),idx:0,mode:"fav",judged:{},picked:{}}});
  };
  const c=$("#btn-clear-list");
  if(c)c.onclick=()=>{
    const w=Object.keys(S.wrong).length, f=Object.keys(S.fav).length;
    if(!w&&!f)return;
    const what=[];
    if(w)what.push(`错题 ${w} 条`);
    if(f)what.push(`收藏 ${f} 条`);
    if(confirm(`确定清空${what.join("和")}吗？`)){S.wrong={};S.fav={};save();render();}
  };
}
function vQView(v){
  const q=QMAP[v.qid];
  const s={list:[v.qid],idx:0,mode:"recite",judged:{},picked:{}};
  return `<h2 class="pg">题目详情</h2><div class="card" id="qcard">${renderQ(s,q)}</div>
  <div style="display:flex;gap:10px;">
    <button class="big-btn ghost" id="qv-fav">${S.fav[q.id]?"★ 取消收藏":"☆ 收藏"}</button>
    <button class="big-btn" id="qv-back">返 回</button></div>`;
}
function bindQView(v){
  const q=QMAP[v.qid];
  $("#qv-back").onclick=back;
  $("#qv-fav").onclick=()=>{if(S.fav[q.id])delete S.fav[q.id];else S.fav[q.id]=1;save();render();};
}

/* ================= 统计 ================= */
function vStats(){
  const doneIds=Object.keys(S.done);
  let attempts=0,correct=0;
  doneIds.forEach(id=>{attempts+=S.done[id].c+S.done[id].w;correct+=S.done[id].c;});
  const acc=attempts?Math.round(correct/attempts*100):0;
  let h=`<h2 class="pg">学习统计</h2>
  <div class="stat-nums">
    <div class="stat-cell"><div class="v">${doneIds.length}</div><div class="k">已刷题目</div></div>
    <div class="stat-cell"><div class="v">${acc}%</div><div class="k">总体正确率</div></div>
    <div class="stat-cell"><div class="v">${Object.keys(S.wrong).length}</div><div class="k">错题待攻克</div></div>
  </div>`;
  h+=`<div class="sec-title">各科进度</div><div class="card">`;
  for(const mid of ["qihang","basics","safety"]){
    const p=modProgress(mid);
    h+=`<div class="bank-stat"><div class="bs-top"><b>${esc(DATA.modules[mid]||mid)}</b><span>${p.done}/${p.total}（${p.pct}%）</span></div>
      <div class="pbar"><div style="width:${p.pct}%"></div></div></div>`;
  }
  h+=`</div>`;
  h+=`<div class="sec-title">近 14 天刷题量</div><div class="card dailies-wrap"><div class="dailies">`;
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
  }
  const max=Math.max(1,...days.map(d=>S.daily[d]||0));
  days.forEach((d,i)=>{
    const n=S.daily[d]||0;
    h+=`<div class="dbar"><div style="height:${Math.round(n/max*72)}px"></div><span>${i%2===0?d.slice(5):""}</span></div>`;
  });
  h+=`</div></div>`;
  h+=`<div class="about">数据保存在本机浏览器中<br>共 ${questions.length} 题 · 构建时间：${DATA.buildTime}</div>`;
  return h;
}

/* ================= 搜索 ================= */
function vSearch(){
  return `<h2 class="pg">搜题</h2>
  <input class="search-input" id="search-in" placeholder="输入关键词，搜索题干和选项…" value="${esc((curView.q||""))}">
  <div id="search-res"></div>`;
}
function doSearch(kw){
  const res=$("#search-res");
  if(!kw||kw.length<2){res.innerHTML=`<div class="empty">输入至少 2 个字开始搜索</div>`;return;}
  const k=kw.toLowerCase();
  const hits=questions.filter(q=>
    q.stem.toLowerCase().includes(k)||
    (q.options||[]).some(o=>o.toLowerCase().includes(k))).slice(0,80);
  if(!hits.length){res.innerHTML=`<div class="empty">没有找到「${esc(kw)}」相关题目</div>`;return;}
  res.innerHTML=`<div class="mut" style="margin:0 2px 6px;">找到 ${hits.length} 题</div><div class="card" style="padding:4px 14px;">`+
    hits.map(q=>`<div class="res-item" data-qid="${q.id}">
      <div class="rs">${esc(q.stem)}</div>
      <div class="rmeta"><span class="tag ${SRC_CLASS[q.source]}" style="font-size:10px;">${SRC_NAME[q.source]}</span>
      <span class="tag t-${q.type}" style="font-size:10px;">${TYPE_NAME[q.type]}</span>
      <span>${esc(DATA.modules[q.module]||"")} · ${esc(q.bank)}</span></div></div>`).join("")+`</div>`;
  res.querySelectorAll("[data-qid]").forEach(el=>el.onclick=()=>go({name:"qview",qid:el.dataset.qid}));
}
function bindSearch(){
  const inp=$("#search-in");
  inp.focus();
  let h;
  inp.oninput=()=>{clearTimeout(h);h=setTimeout(()=>{curView.q=inp.value;doSearch(inp.value);},250);};
  if(inp.value)doSearch(inp.value);
}

/* ================= 渲染分发 ================= */
function render(){
  const v=curView;
  const vw=$("#view");
  let h="",title="",showNav=true;
  switch(v.name){
    case "home":h=vHome();break;
    case "modes":h=vModes(v);title=BANKS[v.bank].bank;break;
    case "practice":h=vPractice(v);title="练习";showNav=!!(v.s.idx<v.s.list.length);break;
    case "examsetup":h=vExamSetup(v);title="模拟考试";break;
    case "exam":
      if(v.s.submitted){h=vResult(v);title="考试结果";showNav=false;}
      else{h=vExam(v);title="模拟考试";showNav=true;}
      break;
    case "fav":h=vFav();break;
    case "stats":h=vStats();break;
    case "search":h=vSearch();break;
    case "qview":h=vQView(v);title="题目详情";showNav=false;break;
  }
  vw.innerHTML=h;
  renderNav();renderHeader(title);
  const footLive = (v.name==="practice"&&v.s.idx<v.s.list.length)||(v.name==="exam"&&!v.s.submitted);
  if(!footLive){const qf=$("#qfoot");if(qf)qf.remove();}
  // 绑定
  document.querySelectorAll(".mcard").forEach(el=>el.onclick=()=>go({name:"modes",bank:el.dataset.mod}));
  switch(v.name){
    case "modes":bindModes(v);break;
    case "practice":
      bindPractice(v);
      if(v.s.idx<v.s.list.length)bindFoot(v);
      break;
    case "examsetup":bindExamSetup(v);break;
    case "exam":
      if(v.s.submitted)bindResult(v);
      else{bindFoot(v);startExamTimer(v);window.scrollTo(0,0);}
      break;
    case "fav":bindList();break;
    case "search":bindSearch();break;
    case "qview":bindQView(v);break;
  }
}
function bindFoot(v){
  const s=v.s;
  const q=s.idx<s.list.length?QMAP[s.list[s.idx]]:null;
  const old=$("#qfoot");if(old)old.remove();
  const foot=document.createElement("div");
  foot.className="qfoot";foot.id="qfoot";
  foot.innerHTML=`
    <button class="fbtn" id="f-star"><span class="fi">${q&&S.fav[q.id]?"★":"☆"}</span>收藏</button>
    <button class="fnav navbtn prev" id="f-prev">上一题</button>
    <button class="fnav navbtn next" id="f-next">${s.idx>=s.list.length-1?(curView.name==="exam"?"交卷":"完成"):"下一题"}</button>
    <button class="fbtn" id="f-sheet"><span class="fi">▦</span>答题卡</button>`;
  document.body.appendChild(foot);
  if(curView.name==="practice")bindPracticeFoot(v);
  else if(curView.name==="exam")bindExam(v);
}

function bindModes(v){
  const b=BANKS[v.bank];
  const state={mode:null,src:"all",types:new Set(["single","multi","judge"])};
  const srcEl=$("#src-filter"),typeEl=$("#type-filter");
  // 更新专项练习各题型数量
  const cnt={};b.list.forEach(q=>cnt[q.type]=(cnt[q.type]||0)+1);
  typeEl.querySelectorAll("[data-type]").forEach(el=>{
    el.textContent=`${TYPE_NAME[el.dataset.type]}（${cnt[el.dataset.type]||0}）`;
    el.onclick=()=>{
      const t=el.dataset.type;
      if(state.types.has(t))state.types.delete(el.dataset.type);else state.types.add(t);
      el.classList.toggle("on");
    };
  });
  srcEl.querySelectorAll("[data-src]").forEach(el=>{
    el.onclick=()=>{state.src=el.dataset.src;
      srcEl.querySelectorAll("[data-src]").forEach(x=>x.classList.toggle("on",x===el));};
  });
  $("#mode-grid").querySelectorAll("[data-mode]").forEach(el=>{
    el.onclick=()=>{
      const m=el.dataset.mode;
      if(m==="type"){
        srcEl.style.display="flex";typeEl.style.display="flex";
        el.classList.toggle("on");
        return;
      }
      startSession({mode:m,bank:v.bank,src:"all",types:null});
    };
  });
  // 专项练习开始按钮
  const startBtn=document.createElement("button");
  startBtn.className="big-btn";startBtn.textContent="开始专项练习";
  startBtn.style.marginTop="10px";
  typeEl.parentNode.appendChild(startBtn);
  startBtn.onclick=()=>{
    if(!state.types.size){toast("请先勾选题型");return;}
    startSession({mode:"seq",bank:v.bank,src:state.src,types:[...state.types]});
  };
  // 断点续练
  const seqIdx=S.seq[v.bank]||0;
  if(seqIdx>0&&seqIdx<b.list.length){
    $("#resume-info").innerHTML=`上次顺序练习到第 <b>${seqIdx+1}</b> 题　<button class="chip on" id="btn-resume">继续</button>`;
    $("#btn-resume").onclick=()=>startSession({mode:"seq",bank:v.bank,src:"all",types:null});
  }
  $("#exam-card").onclick=()=>go({name:"examsetup",bank:v.bank});
}

/* ================= 启动 ================= */
loadState();
$("#btn-back").onclick=back;
$("#btn-dk").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",cur?"light":"dark");
  try{localStorage.setItem("tiku_theme",cur?"light":"dark");}catch(e){}
};
try{
  const th=localStorage.getItem("tiku_theme");
  if(th==="dark"||( !th && false ))document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
$("#nav").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  stack=[];
  go({name:t.dataset.t},true);
});
go({name:"home"},true);
</script>
</body>
</html>
