油油压低","汽轮机超速","阀门活动性试验","反应堆停堆"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：汽机保护脱扣考虑的是危及机组安全的预想故障——润滑油油压低（轴承断油烧瓦）、汽轮机超速（转子飞车）、反应堆停堆（堆机联锁）都会产生跳机信号；而阀门活动性试验（C）是运行期间定期进行的试验操作，用于验证阀门能否正常动作、防止卡涩，试验本身不产生跳机信号，故选C。易被误导处：试验时参数可能短时波动，但试验设计上已避开跳机定值。【易混点】汽机脱扣信号可传送给反应堆保护系统，必要时触发紧急停堆——「机跳堆」联锁方向要记清。"},{"id":"basics_ic_0011","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不属于反应堆停堆原因的是：（    ）","options":["一回路压力超限","核功率超限","汽轮机转速高","一回路向二回路泄漏"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：一回路压力超限、核功率超限、一回路向二回路泄漏（如蒸汽发生器传热管破裂）都直接危及堆芯安全，是反应堆停堆触发条件；而汽轮机转速高（C）属汽轮机侧故障，产生的是汽机超速保护跳机信号，跳机后是否停堆由当时功率水平等条件经停堆逻辑判断，转速高本身不是停堆原因，故选C。【易混点】课件提到汽机脱扣信号可传送给反应堆保护系统参与紧急停堆——「脱扣（已跳机）」与「转速高」是两个不同信号，前者可在一定条件下触发停堆。"},{"id":"basics_ic_0012","module":"basics","bank":"仪表与控制","type":"single","stem":"在优选逻辑中，以下哪类指令优先级最高？（    ）","options":["安全级信号","后备盘信号","多样性信号","除了多样性信号的安全相关及非安信号"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：优选（优先级）逻辑用于处理多个来源指令的竞争，原则是安全级（1E级）信号优先级最高，必须优先于其他信号执行，以保证事故工况下安全功能不被其他指令压制或延迟，故选A。不选B：后备盘信号是主控室人机接口丧失时的后备操作手段；不选C：多样性信号是应对共因故障的补充手段；不选D：安全相关及非安全信号优先级均低于安全级。【易混点】优先级排序依据是「是否承担核安全功能」：安全级>安全相关>非安全。"},{"id":"basics_ic_0013","module":"basics","bank":"仪表与控制","type":"single","stem":"下列哪些不是专设安全设施功能：（    ）","options":["启动辅助给水","安全注入","硼水补给","安喷"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件反应堆保护系统一节：当出现超出停堆保护能力的事故时，保护系统启动专设安全设施，课件所举示例即包括安全注入系统（B）和安全壳喷淋系统（D，即安喷）；启动辅助给水（A）也是专设安全设施功能，事故时向蒸汽发生器二次侧供水以导出堆芯余热。不选C：硼水补给属化学和容积控制系统（RCV）功能，用于正常运行调硼，不属专设安全设施，故选C。【易混点】专设安全设施是事故工况下启用、缓解事故后果的系统；正常调硼的化容系统不是，即使注入的也是含硼水。"},{"id":"basics_ic_0014","module":"basics","bank":"仪表与控制","type":"single","stem":"以下哪项不是堆芯中子注量率测量系统在正常运行时的功能（     ）","options":["探测反应堆在装料中可能出现的差错","检查与燃耗对应的功率分布是否与设计所期望的功率分布相符","监测各燃料组件的燃耗，校准堆外核测量仪表","探测堆芯是否偏离正常运行"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件堆内核测系统一节：堆芯仪表用于提供计算冷却剂焓和燃料燃耗分布、估计冷却剂流量分布的数据，也用于校准测量轴向通量差的堆外核仪表系统——即正常运行时承担检查功率分布（B）、监测燃耗并校准堆外核测（C）、探测偏离正常运行（D）等功能。不选A：探测装料中可能出现的差错属换料、装料工况功能，不是正常运行时功能，故选A。【易混点】正常运行时每月测堆内功率分布一次以求得AO值，据此校正堆外所测轴向偏移。"},{"id":"basics_ic_0015","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂应用最多的测温仪表类型为：（     ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（课件仅列出一回路温度传感器主要为热电阻、热电偶两类）：核电厂绝大多数温度测点参数范围适中、要求精度和稳定性高，热电阻（铂电阻）输出信号大、精度高、长期稳定，便于远传和参与控制保护，是应用最多的测温仪表，选A。不选B：热电偶多用于高温或需快速响应的场合；不选C：水银温度计只能就地指示；不选D：热敏电阻非线性大、稳定性差，应用较少。【易混点】最典型型号PT100——0℃时标称电阻100Ω的铂热电阻，是核电厂测温「标配」。"},{"id":"basics_ic_0016","module":"basics","bank":"仪表与控制","type":"single","stem":"（    ）反映了系统误差的大小，表明测量结果与真值的接近程度。","options":["正确度","精密度","准确度","不确定度"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（按题库口径）：准确度表明测量结果与真值的接近程度，反映系统误差的大小，选C。不选A：正确度虽与系统误差相关，但题库口径以「与真值接近程度」的完整表述对应准确度；不选B：精密度反映重复测量结果的一致性、分散程度，对应随机误差；不选D：不确定度是对测量结果分散性的定量估计，不是误差的表示方式。【易混点】准确度管「偏不偏」（系统误差），精密度管「散不散」（随机误差）；打靶类比——弹着点聚成一簇但偏离靶心即精密度高、准确度低。"},{"id":"basics_ic_0017","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂仪表控制系统的组成部分不包括：（     ）","options":["堆外核测系统","堆内核测系统","汽轮机控制系统","环境监测系统"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件仪表控制系统综述一节，仪控系统的组成部分包括：堆外核测系统、堆内核测系统、反应堆功率调节系统、反应堆保护系统、辐射监测系统、汽轮机监测调节和保护系统、一回路仪控系统和二回路仪控系统——堆外核测（A）、堆内核测（B）、汽轮机控制（C）均在列。不选D：环境监测系统不在组成部分之列，属外围辐射环境监测范畴，故选D。【易混点】「辐射监测系统」在仪控组成清单内，「环境监测系统」不在——名称相近，取舍要分清。"},{"id":"basics_ic_0018","module":"basics","bank":"仪表与控制","type":"single","stem":"下列哪个不是误差的表示方法？","options":["绝对误差","相对误差","引用误差","计算误差"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件测量误差一节：误差的表示方法有三种——绝对误差（测量值x与真值A0之差Δx=x−A0）、相对误差（绝对误差与真值之比，常用百分数表示）、引用误差（示值误差与最大示值之比），A、B、C均为课件所列。不选D：「计算误差」不是误差的表示方法，属凑数干扰项，故选D。【易混点】引用误差用于衡量仪表准确程度，仪表精度等级（如0.5级、1.0级）即按最大引用误差划分——绝对误差看大小、相对误差看程度、引用误差评仪表。"},{"id":"basics_ic_0019","module":"basics","bank":"仪表与控制","type":"single","stem":"反应性控制的类型不包括：（    ）","options":["液位控制","功率控制","补偿控制","紧急停堆控制"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件反应性控制一节：反应性控制分三种类型——紧急停堆控制（异常工况时迅速引入负反应性停堆）、功率控制（控制元件动作迅速，及时补偿负荷、温度变化引起的反应性瞬态）、补偿控制（补偿燃料燃耗和裂变产物积累的过剩反应性，当量大、动作缓慢），B、C、D均在列。不选A：液位控制属过程参数控制（稳压器液位、蒸汽发生器水位等），与反应性控制无关，故选A。【易混点】可燃毒物（钆、硼）也是补偿手段：装入堆芯补偿寿命初期过剩反应性，随燃耗自行消耗。"},{"id":"basics_ic_0020","module":"basics","bank":"仪表与控制","type":"judge","stem":"核电厂应用最多的测温仪表类型为热电阻。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（课件列出一回路温度传感器主要为热电阻、热电偶两类）：核电厂测温点数量庞大、参数多在中低温区且要求精度高、稳定性好，热电阻（铂电阻）输出信号大、精度高、长期稳定，是应用最多的测温仪表，故说法正确。易被误导处：热电偶在高温场合（如主蒸汽温度）用得多，易让人误以为它应用最广，但按测点数量热电阻占优。【易混点】典型型号PT100：0℃时标称电阻100Ω，阻值随温度升高而增大。"},{"id":"basics_ic_0021","module":"basics","bank":"仪表与控制","type":"judge","stem":"准确度反映了系统误差的大小，表明测量结果与真值的接近程度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（按题库口径）：准确度反映系统误差的大小，表明测量结果与真值的接近程度——系统误差越小，测量结果偏离真值越近，准确度越高，题干表述与该口径一致，故说法正确。易被误导处：不要与精密度混淆——精密度反映重复测量结果的分散程度，对应随机误差；准确度高说明测得「准」，精密度高说明测得「稳、一致」，两者相互独立。【易混点】打靶类比记忆：弹着点聚在靶心是既准又精密；聚成一簇但偏离靶心是精密而不准；围着靶心散布是准而不精密。"},{"id":"basics_ic_0022","module":"basics","bank":"仪表与控制","type":"judge","stem":"热电阻PT100，在温度摄氏度0°C时电阻为100Ω","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件测量方法一节：铂电阻阻值与温度的关系为Rt=R0(1+at+bt²)，R0即为0℃时的铂电阻阻值——PT100命名的含义正是「0℃时标称电阻为100Ω」，故说法正确。易被误导处：数字100不是量程也不是分度号编号，而是0℃对应的电阻欧姆数；温度高于0℃时电阻总是大于100Ω（正温度系数）。【易混点】实际测量中通过电桥把电阻变化转换成电信号，再由变送器输出4~20mA等标准信号远传。"},{"id":"basics_ic_0023","module":"basics","bank":"仪表与控制","type":"judge","stem":"功率量程高功率停棒的核功率是120%FP。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：功率量程高功率停棒（闭锁提棒）的核功率定值按题库口径约为109%FP，而不是120%FP，题干数值错误，应判错误。易被误导处：各种保护定值数值相近容易记混，抓住「停棒定值略高于满功率、120%明显偏高」的量级感即可判断；准确数值以电厂定值手册为准。【易混点】停棒与停堆是逐级升高的两级防线：核功率异常升高时先禁止提棒（阻止功率继续上升），进一步越限才触发紧急停堆——「先闭锁、后停堆」，层层设防。"},{"id":"basics_ic_0024","module":"basics","bank":"仪表与控制","type":"judge","stem":"安全注入属于专设安全设施功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件反应堆保护系统一节：当出现超出停堆保护能力的事故时，保护系统能启动相应的专设安全设施，课件所举示例即包括安全注入系统、安全壳喷淋系统——安全注入是专设安全设施的重要功能，事故时向堆芯注入含硼水，保证堆芯淹没和冷却，故说法正确。易被误导处：安注不只是「注水冷却」，注入的是含硼水，同时引入负反应性，冷却与抑制链式反应并举。【易混点】专设安全设施还包括安喷、辅助给水等；正常运行的硼水补给属化容系统功能——同为加硼，目的和归属不同。"},{"id":"basics_ic_0025","module":"basics","bank":"仪表与控制","type":"judge","stem":"核电厂仪表与控制系统的功能可以归纳为三种：即监视功能、控制功能和保护功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件仪表控制系统功能一节原文：核电厂仪表与控制系统的功能可归纳为三种类型，即监视功能、控制功能和保护功能——监视（测量、显示、报警）、控制（过程调节回路）、保护（越限时停堆并启动专设安全设施），题干与课件一致，故说法正确。易被误导处：容易漏掉「监视」或额外加上「通讯」「记录」凑成四五种，记住是三大功能。【易混点】电站计算机系统承担数据采集、显示、报警、事故追忆等监视功能，在线开环运行、不参与控制——监视与控制可由不同系统分担。"},{"id":"basics_ic_0026","module":"basics","bank":"仪表与控制","type":"judge","stem":"前馈是闭环控制系统。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件控制通道类型一节：开环通道即前馈控制——干扰变量直接作用于控制变量，被控变量不反馈给控制器；闭环（反馈）通道则是被控变量被监测并反馈给控制器，随时与整定值比较后实施控制。故「前馈是闭环控制系统」错误。易被误导处：前馈看似「提前、高级」，容易误当成闭环的改进，其实它不检查控制效果，被控量是否达标只能由操作人员判断，这正是开环的本质。【易混点】前馈响应快但精度差，闭环精度好但响应慢，工程上常用前馈+反馈复合控制取长补短。"},{"id":"basics_ic_0027","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽发生器液位计根据量程分为宽量程液位计和窄量程液位计。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路液位测量一节：蒸汽发生器设置宽、窄量程两种液位计测量液位——题干「根据量程分为宽量程和窄量程」正确。课件还指出宽量程液位计按冷态标定，供蒸汽发生器充排水时用；窄量程用于功率运行阶段的水位监视、调节与保护。易被误导处：两种液位计不是互为备用的冗余关系，而是用途分工——冷态充排水看宽量程，功率运行看窄量程。【易混点】蒸汽发生器液位（窄量程）是冗余通道测量的典型参数，以满足单一故障准则。"},{"id":"basics_ic_0028","module":"basics","bank":"仪表与控制","type":"judge","stem":"DCS系统按功能层次可划分为四层： Level 0为工艺接口层，Level 1为控制处理层，Level 2为操作监视层，Level 3为生产管理层。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：DCS按功能层次划分为四层——Level 0工艺接口层（现场仪表与执行器）、Level 1控制处理层（完成调节和逻辑运算）、Level 2操作监视层（操作员站、工程师站）、Level 3生产管理层（全厂生产管理），题干四层名称与顺序均正确，故说法正确。易被误导处：四层顺序不能颠倒，越靠下层越贴近现场，越靠上层越贴近管理。【易混点】DCS的精髓是「危险分散、管理（显示）集中」：控制分散到各控制站，监视操作集中于操作员站。"},{"id":"basics_ic_0029","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽排放控制系统只有一种模式，即蒸汽压力控制模式。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：蒸汽排放（旁排）控制系统并非只有一种模式，按题库口径有蒸汽压力控制和一回路平均温度控制两种模式——汽机负荷骤降（甩负荷、脱扣）时经旁排阀把多余蒸汽排向冷凝器和除氧器，维持一二回路功率平衡，避免核蒸汽供应系统温度压力超过保护定值，故题干说法错误。易被误导处：模式选择与机组状态（功率水平、旁排阀可用性）有关，并非固定单一模式。【易混点】旁排的使命是「替汽机吃汽」：负荷骤降时消化汽机吃不了的蒸汽，尽量避免主蒸汽安全阀动作。"},{"id":"basics_ic_0030","module":"basics","bank":"仪表与控制","type":"judge","stem":"汽轮发电机组通过汽轮机调节系统实现机组转速和负荷调节。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件汽轮机调节保护系统一节：汽轮机调节系统根据机组负荷的变化调节进入汽轮机的蒸汽量，在稳定工况下保证转速不变且为规定值，负荷变化时保证转速偏差不超过规定范围——即通过汽轮机调节系统实现转速和负荷调节，题干正确。易被误导处：转速调节与负荷调节是同一手段（调进汽量）的两个方面——并网前调转速、并网后带负荷。【易混点】调节系统管正常运行自动调节；保护系统在故障或调节失灵时安全停机，脱扣信号还可传给反应堆保护系统参与停堆。"},{"id":"basics_ic_0031","module":"basics","bank":"仪表与控制","type":"judge","stem":"仪表能够测量的最大输入量与最小输入量之间的范围称作仪表的量程范围，简称量程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：仪表能够测量的最大输入量与最小输入量之间的范围称作量程范围，简称量程——如量程0~20MPa的压力表，其量程即20MPa，题干与该定义一致，故说法正确。易被误导处：量程是「范围」而不是「上限值」，0~20MPa与10~20MPa上限相同但测量范围不同。【易混点】量程（最大示值/满度值）是计算引用误差的基准——引用误差=示值误差/最大示值，仪表精度等级即按最大引用误差划分。"},{"id":"basics_ic_0032","module":"basics","bank":"仪表与控制","type":"judge","stem":"流体流经节流装置时遵循伯努力方程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路流量测量一节：流量测量采用孔板、喷嘴、文丘利管等一次元件建立差压，且流量与ΔP的平方根成正比——这一节流原理的理论基础正是伯努利方程：流体流经节流装置时截面收缩、流速增大、静压降低，在节流件前后形成差压，故说法正确。易被误导处：流速大处压力低，与「流速大压强大」的直觉相反，这正是伯努利方程的核心结论。【易混点】伯努利方程描述沿流线的能量守恒——动能、压力能、位能之和不变，节流过程只是能量形式的转换。"},{"id":"basics_ic_0033","module":"basics","bank":"仪表与控制","type":"judge","stem":"所谓控制就是为了达到一定的目的，对生产过程的设备进行控制操作，使其满足生产过程要求。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件控制的基本概念一节：控制必须连续地补偿控制变量因干扰或过程负荷变化而引起的一切改变——通过测量部件、比较器、控制器、执行机构构成的回路，对生产过程的设备进行控制操作，使其满足生产过程要求，题干定义与课件思想一致，故说法正确。易被误导处：控制不只是「开关设备」，其本质是不断检测被控量与给定值的偏差并消除偏差的动态过程。【易混点】完整控制通道六要素：测量部件、定值器、比较器、控制器、执行机构、被控对象，常考名称与作用对应。"},{"id":"basics_ic_0034","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽发生器水位调节系统的执行器是给水调节阀和给水泵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件蒸汽发生器水位控制系统一节：水位控制的基本功能之一是「通过控制给水阀和给水泵，使蒸汽发生器的水位满足运行工况的要求」——给水调节阀（改变开度）和给水泵（改变转速）共同调节给水流量，两者都是执行器，题干正确。易被误导处：不要以为执行器只有调节阀，泵的转速调节同样承担流量控制任务。【易混点】水位控制事关安全：水位过高使出口蒸汽含水量超标、加剧汽机冲蚀；过低会使换热管顶部裸露，影响堆芯热量导出。"},{"id":"basics_ic_0035","module":"basics","bank":"仪表与控制","type":"judge","stem":"按安全等级划分，DCS系统设备可以分为安全级设备和非安全级设备。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件仪控系统安全分级一节：仪表和控制系统的供电设备按对电厂安全的重要性分为安全级设备和非安全重要设备两级；从是否承担核安全功能、是否须满足1E级要求的角度归纳，DCS系统设备可分为安全级和非安全级两类，题干正确。易被误导处：仪控设备本身的分级严格说是三级——安全级、安全有关的设备、非安全重要设备，「安全级/非安全级」是按大类粗分。【易混点】安全级（1E级）设备须满足单一故障准则，采用冗余、实体分隔、电气隔离，并能定期试验。"},{"id":"basics_ic_0036","module":"basics","bank":"仪表与控制","type":"judge","stem":"稳压器下部电加热器分为通断式电加热器和比例式电加热器两种类型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：稳压器下部（浸没于水中）的电加热器分为通断式（开关式）和比例式两种——比例式由压力调节器连续调节功率，用于压力精细调节；通断式按整定值分组投切，用于粗调、升温及热备用，题干正确。易被误导处：两类加热器不是按功率大小或位置区分，而是按控制方式区分——「比例式连续调节、通断式分组投切」。【易混点】稳压器压力调节全景：压力低投电加热器，压力高开喷淋阀；超出调节范围由安全阀按整定值泄压——调节与保护层次分明。"},{"id":"basics_ic_0037","module":"basics","bank":"仪表与控制","type":"judge","stem":"汽轮机旁路系统运行时，汽机进气压力信号不能代表二回路总负荷，这时候人为设置一个功率数值，称为最终功率整定值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：汽机旁排系统运行时，大量蒸汽不经汽轮机而直接排向冷凝器，此时汽机进汽压力信号已不能代表二回路总负荷，控制系统需人为设置一个功率数值作为控制基准，即最终功率整定值，故说法正确。易被误导处：「最终功率整定值」是人为设定值而非实测参数，它决定旁排流量控制和一回路功率控制的参照水平。【易混点】旁排的目的是维持一二回路功率平衡、避免压力超定值；汽机负荷恢复、旁排阀关闭后，控制再切回正常负荷信号。"},{"id":"basics_ic_0038","module":"basics","bank":"仪表与控制","type":"judge","stem":"控制对象：被控制的设备或生产过程为控制对象或被控制过程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件控制的基本概念一节原文：「控制对象：被控制的设备或生产过程为控制对象或被控制过程」，并举例核电厂功率控制系统中的控制对象是反应堆装置——题干即该原文，故说法正确。易被误导处：控制对象是「设备或生产过程」这样的实体，不是「参数」——被控制的量（功率、水位、压力）称为被控制量（被调量），是控制对象的输出量。【易混点】术语链：控制对象→被控制量→测量值→比较器→控制器→执行机构→作用于控制对象，闭环由此形成。"},{"id":"basics_ic_0043","module":"basics","bank":"仪表与控制","type":"single","stem":"热电阻PT100，在温度摄氏度0°C时（     ）","options":["电阻为100Ω","电阻0Ω","电流4mA","电压0V"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件测量方法一节：铂电阻阻值与温度的关系为Rt=R0(1+at+bt²)，R0即0℃时的电阻值——PT100命名的含义就是「0℃时标称电阻为100Ω」，选A。不选B：金属导体电阻恒不为零，铂电阻0℃时绝不是0Ω；不选C：4mA是变送器输出的标准电流信号下限，与电阻无关；不选D：电压0V是电路参数，也不是PT100的电阻特性。【易混点】PT100电阻随温度升高而增大（正温度系数），测温时经电桥转换为电信号、变送器输出标准信号远传。"},{"id":"basics_op_0001","module":"basics","bank":"运行概述","type":"judge","stem":"我国自主知识产权三代核电机组“华龙一号”是压水堆。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"课件未直接覆盖：华龙一号（HPR1000）是我国自主研发、具有自主知识产权的三代核电技术，堆型为压水堆，采用能动与非能动相结合的安全设计和双层安全壳，已在福清5、6号机组及海外项目建成投运，故说法正确。易被误导处：不要因“非能动”联想到高温气冷堆等特殊堆型，华龙一号的主体仍是成熟的压水堆技术路线。【易混点】课件第21页提到华龙一号的非能动安全系统主要设备也布置在核岛（反应堆厂房）内。"},{"id":"basics_op_0002","module":"basics","bank":"运行概述","type":"judge","stem":"汽轮发电机组并入电网才能将发出的电能源源不断地输送给电网。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件《核电厂运行概述》第170、185页：发电机并网是机组升功率流程中的关键操作步骤（“（19）发电机并网”），停机时则“与电网联系解列发电机”。发电机只有并入电网、与电网保持同步运行，发出的电能才能源源不断地输送给电网，孤立的机组无法向电网稳定供电，故说法正确。易被误导处：并网前机组也可带厂用电运行，但要向电网送电必须先并网。【易混点】并网要求发电机与电网的电压、频率、相位一致，否则会产生同步冲击电流。"},{"id":"basics_op_0003","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆的特点之一为不停堆换料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"课件未直接覆盖：重水堆（如CANDU）采用压力管式结构，每根燃料通道可单独定位，由换料机在堆两端对接操作，且中子屏蔽由重水层提供，因此能在反应堆功率运行状态下更换燃料，实现不停堆换料，这是重水堆区别于压水堆（须停堆换料）的标志性特点，故说法正确。易被误导处：不停堆换料依靠的是压力管式结构布置，而非重水本身的物性。【易混点】不停堆换料使重水堆可边燃耗边补充新燃料，因此能用天然铀作燃料维持堆芯装量平衡。"},{"id":"basics_op_0004","module":"basics","bank":"运行概述","type":"judge","stem":"功率运行期间发生链式裂变反应的核燃料装载在反应堆压力容器中。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第24页：“反应堆压力容器——堆芯装载、发生核裂变、生物屏蔽、压力边界”，核燃料组件装载在压力容器内的堆芯中，功率运行期间的链式裂变反应就在压力容器内进行并释放核能，故说法正确。易被误导处：燃料只在换料时经燃料水池转运至燃料厂房，正常运行时燃料始终在压力容器内。【易混点】压力容器是第二道屏障（一回路压力边界）的核心设备，布置在核岛反应堆厂房（安全壳）内。"},{"id":"basics_op_0005","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆核电厂绝大多数使用过热蒸汽。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第57页：“绝大多数核电厂使用饱和蒸汽，而现代化石燃料电厂使用过热蒸汽”。压水堆蒸汽发生器二次侧产生的是饱和蒸汽，不带过热度，故“压水堆核电厂绝大多数使用过热蒸汽”说法错误。易被误导处：二回路设有汽水分离再热器，但它只是对高压缸排汽进行汽水分离和再热，不改变新蒸汽为饱和蒸汽的事实。【易混点】因饱和蒸汽焓值低，同容量核电汽轮机、蒸汽管道的尺寸都比火电机组大。"},{"id":"basics_op_0006","module":"basics","bank":"运行概述","type":"single","stem":"以下哪一项不属于核安全三要素（   ）。","options":["反应性控制","余热导出","防止商用大飞机撞击","放射性包容"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第203~204页，核电厂基本安全功能是“控制反应性、排出堆芯热量、包容放射性物质和控制运行排放”，归纳为核安全三要素：反应性控制、余热导出、放射性包容。“防止商用大飞机撞击”属于外部事件防护设计要求，不在三要素之列，故选C。不选A(反应性控制)、B(余热导出)、D(放射性包容)：三者正是核安全三要素内容，属“属于”项，与题意“不属于”相反。【易混点】三要素靠三道屏障与专设安全设施落实：燃料包壳、一回路压力边界、安全壳。"},{"id":"basics_op_0007","module":"basics","bank":"运行概述","type":"judge","stem":"核电厂装卸料操作都是在充满水的反应堆水池中水下操作的。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件《核电厂水化学基础》第12页：水在核电厂“在换料和燃料贮存过程中用作屏蔽材料”。核电厂装卸料在充满水的反应堆水池中水下进行，水层既提供辐射屏蔽又带走燃料余热，保证操作安全，故说法正确。易被误导处：水下操作不是为了别的目的，核心就是利用水对γ射线和中子的屏蔽与冷却能力。【易混点】换料水池的水一般含硼，兼有保证停堆几何（临界）安全的作用。"},{"id":"basics_op_0008","module":"basics","bank":"运行概述","type":"judge","stem":"非能动安全系统需要持续的电源才能保证系统设计功能。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"课件未直接覆盖：非能动安全系统的“非能动”指依靠重力、自然循环、压缩气体膨胀等自然力和固有物理过程实现安全功能，不需要外部电源、泵或风机持续驱动，这正是其在全厂断电事故（如福岛事故）中的价值所在，故“需要持续的电源”说法错误。易被误导处：非能动系统并非完全不用电（监测仪表仍需供电），但实现其设计功能不依赖持续电源。【易混点】华龙一号、AP1000均采用能动与非能动相结合的安全设计理念。"},{"id":"basics_op_0009","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆中作为慢化剂的重水的价格昂贵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件《核电厂水化学基础》第12页：氘在自然界氢中仅占0.015%，“普通水中重水仅占0.015%”。重水必须从海量普通水中经同位素分离逐级浓缩，工艺复杂、能耗巨大、产量有限，因此价格昂贵，说法正确。易被误导处：别把重水当普通水，它是重水堆电厂的贵重资产，运行中须严格监测重水损耗与泄漏。【易混点】课件还规定重水同位素纯度指标：冷却剂重水≥98.6%、慢化剂重水≥99.75%，防轻水漏入造成降级。"},{"id":"basics_op_0010","module":"basics","bank":"运行概述","type":"judge","stem":"在100%满功率稳定运行时，反应堆是处于临界状态的。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第52页：“反应堆只有在临界下，才能实现自持链式反应”。临界时有效增殖因数等于1，中子产生率与消失率平衡，功率稳定不变；100%满功率稳定运行正是这种自持链式反应的稳态，反应堆处于临界状态，故说法正确。易被误导处：临界不等于“危险”，它只是功率稳定运行的必要条件，停堆状态才是次临界。【易混点】升降功率时反应堆短暂超临界或次临界，稳定后仍回到临界状态。"},{"id":"basics_op_0011","module":"basics","bank":"运行概述","type":"judge","stem":"福岛核电厂在海啸开始时反应堆自动保护紧急停堆。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，福岛机组是地震时自动紧急停堆，随后海啸淹没应急电源导致全厂断电，事故才逐步恶化。"},{"id":"basics_op_0012","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆核电厂启动需要对一回路进行充水排气。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，启动前须对一回路充水排气，排出系统内气体，防止泵汽蚀和流动滞塞，保证堆芯冷却。"},{"id":"basics_op_0013","module":"basics","bank":"运行概述","type":"judge","stem":"钠冷快堆使用的金属钠是不活泼金属。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，金属钠是化学性质活泼的碱金属，遇水剧烈反应甚至燃烧爆炸，与空气也会反应，须严格隔水隔气保存。"},{"id":"basics_op_0014","module":"basics","bank":"运行概述","type":"judge","stem":"核安全三要素是指反应性控制、余热导出、放射性包容。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，核安全三要素即反应性控制、余热导出、放射性包容，核电厂设计运行均围绕保障这三要素展开。"},{"id":"basics_op_0015","module":"basics","bank":"运行概述","type":"judge","stem":"两个'零容忍'是指对违规操作零容忍、对弄虚作假零容忍。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，两个零容忍指对违规操作零容忍、对弄虚作假零容忍，是核安全文化的重要内容。"},{"id":"basics_op_0016","module":"basics","bank":"运行概述","type":"judge","stem":"汽轮发电机组并网才能将发出的电能输送给电网。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，发电机必须并网后才能向电网输送电能，并网后机组与电网保持同步运行。"},{"id":"basics_op_0017","module":"basics","bank":"运行概述","type":"judge","stem":"反应堆达临界操作是核电厂重要操作，需要遵守运行规程的规定。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，达临界是反应堆升功率过程中的重要操作，必须严格遵守运行规程，在监测下逐步逼近并确认临界。"},{"id":"basics_op_0018","module":"basics","bank":"运行概述","type":"judge","stem":"反应堆停闭后，堆芯不再有热量，可以立即停止冷却。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，停堆后裂变产物衰变仍持续释放衰变热，必须保持堆芯冷却，否则燃料会过热损坏。"},{"id":"basics_op_0019","module":"basics","bank":"运行概述","type":"judge","stem":"轻核聚变的特点是不产生放射性。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，轻核聚变产物主要是稳定的氦核，不产生长寿命高放废物，放射性影响小。"},{"id":"basics_op_0020","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆最大的特点是核燃料增殖。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，压水堆的主要特点是以轻水兼作冷却剂和慢化剂、一二回路分开；核燃料增殖是快堆的特点。"},{"id":"basics_op_0021","module":"basics","bank":"运行概述","type":"judge","stem":"高温气冷堆核电站发电效率比压水堆核电站高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，高温气冷堆氦气出口温度可达700℃以上，蒸汽参数高，热力循环效率高于压水堆核电厂。"},{"id":"basics_op_0022","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂在汽轮机中做完功的乏汽的热量最终由以下哪种介质带走？____","options":["一回路冷却剂","二回路凝结水","三回路海水或冷却塔"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"乏汽在凝汽器中凝结放热，其热量最终由海水或冷却塔循环水等三回路冷却水带走。"},{"id":"basics_op_0023","module":"basics","bank":"运行概述","type":"single","stem":"熔盐堆的核燃料是以下哪种：____","options":["液态熔盐燃料","固体燃料棒","石墨燃料球"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"熔盐堆的核燃料以液态熔盐形式存在，燃料溶解在高温熔盐中，既是核燃料又起冷却剂作用。"},{"id":"basics_op_0024","module":"basics","bank":"运行概述","type":"single","stem":"快堆的冷却剂一般为以下哪种：____。","options":["金属钠","轻水","重水","氮气"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"快堆一般用液态金属钠作冷却剂，钠导热性好、对中子慢化作用小，有利于维持快中子能谱。"},{"id":"basics_op_0025","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂转变为电能的能量的最初来源于以下 ____ 。","options":["取水口的潮汐能","核燃料的裂变反应","太阳能"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"核电厂能量最初来源于核燃料的链式裂变反应，核能经热能和机械能逐级转换为电能。"},{"id":"basics_op_0026","module":"basics","bank":"运行概述","type":"single","stem":"发生切尔诺贝利核事故的核电站是以下哪种堆型？_____","options":["压水堆","石墨堆","重水堆","沸水堆"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"切尔诺贝利核电厂是石墨慢化的RBMK沸水堆，正空泡系数和控制棒设计缺陷是事故的重要原因。"},{"id":"basics_op_0027","module":"basics","bank":"运行概述","type":"single","stem":"发生福岛核事故的核电站是以下哪种堆型？____","options":["压水堆","重水堆","沸水堆","气冷堆"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"福岛第一核电厂是沸水堆，在反应堆内直接产生蒸汽推动汽轮机，属于单回路循环。"},{"id":"basics_op_0028","module":"basics","bank":"运行概述","type":"single","stem":"以下哪个设备安装在核岛厂房。____","options":["主给水泵","汽轮发电机组","主泵","应急柴油机"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"主泵布置在核岛反应堆厂房内，驱动一回路冷却剂循环；汽轮发电机组位于常规岛。"},{"id":"basics_op_0029","module":"basics","bank":"运行概述","type":"single","stem":"热停堆模式时，满足如下条件：反应堆冷却剂系统压力在15.4MPa；稳压器压力和____处于自动控制；反应堆冷却剂系统的平均温度由大气释放阀控制在约290℃；蒸汽发生器水位由辅助给水泵维持在零负荷水位。","options":["硼浓度","温度","水位"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"热停堆模式下稳压器压力和水位均应处于自动控制，一回路平均温度由大气释放阀控制在约290℃。"},{"id":"basics_op_0030","module":"basics","bank":"运行概述","type":"single","stem":"在_____已经建立之后，反应堆冷却剂的硼浓度在明显变化之前，需启动稳压器电加热器，允许稳压器喷淋阀调节稳压器至反应堆冷却系统之间的硼浓度。","options":["稳压器汽腔","稳压器水位","蒸发器水位"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"稳压器汽腔建立后才可投入电加热器，并用稳压器喷淋调节稳压器与一回路间的硼浓度平衡。"},{"id":"basics_op_0031","module":"basics","bank":"运行概述","type":"judge","stem":"中子轰击放射性同位素的重核，发生裂变反应，重核分解成两个轻一些的原子核，释放能量并产生1个中子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，重核裂变时释放的新中子平均为2～3个，而不是1个，链式反应正是靠这些中子维持。"},{"id":"basics_op_0032","module":"basics","bank":"运行概述","type":"single","stem":"我国自主知识产权三代核电机组'华龙一号'是以下哪种堆型。____","options":["重水堆","快堆","压水堆","熔盐堆"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"华龙一号是我国自主知识产权的三代压水堆机组，采用双安全壳和能动加非能动安全设计。"},{"id":"basics_op_0033","module":"basics","bank":"运行概述","type":"single","stem":"下列哪个堆型属于三代堆。____","options":["华龙一号","M310","高温气冷堆","熔盐堆"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"华龙一号属于三代压水堆；M310为二代堆型，高温气冷堆和熔盐堆属于四代堆型。"},{"id":"basics_op_0034","module":"basics","bank":"运行概述","type":"single","stem":"下列哪个设备布置在常规岛厂房。_____","options":["蒸汽发生器","汽轮发电机组","稳压器安全阀","主泵"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"常规岛主要布置汽轮发电机组及其辅助设备，蒸汽发生器、主泵、稳压器安全阀等均在核岛。"},{"id":"basics_op_0035","module":"basics","bank":"运行概述","type":"single","stem":"核电厂推动汽轮机做功发电的蒸汽是以下那个设备中产生的。_____","options":["稳压器","压力容器","蒸汽发生器"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"蒸汽发生器是一二回路的热交换设备，产生的二回路蒸汽推动汽轮机做功发电。"},{"id":"basics_op_0036","module":"basics","bank":"运行概述","type":"single","stem":"稳压器安全阀的作用是 ____ 。","options":["保证一回路不超压","排出堆芯多余的冷却剂","冷却堆芯","一回路充水"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"稳压器安全阀是一回路超压保护装置，压力超过整定值时自动开启泄压，保证一回路不超压。"},{"id":"basics_op_0037","module":"basics","bank":"运行概述","type":"single","stem":"下列哪一项属于压水堆核电厂的特点____ 。","options":["反应堆超临界","蒸汽发生器产生的是饱和蒸汽","停堆后停止释热"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"压水堆一二回路分开，蒸汽发生器产生的二回路蒸汽是饱和蒸汽，这是压水堆的重要特点。"},{"id":"basics_op_0038","module":"basics","bank":"运行概述","type":"single","stem":"蒸汽发生器安装在 ____ 。","options":["反应堆厂房","汽轮机厂房","燃料厂房"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"蒸汽发生器是一回路主设备，与反应堆压力容器、主泵、稳压器一起安装在反应堆厂房内。"},{"id":"basics_op_0039","module":"basics","bank":"运行概述","type":"single","stem":"正常情况下，压水堆核电站只在_____ 中存在放射性。","options":["一回路","二回路","三回路"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正常运行时放射性只存在于一回路，二、三回路无放射性，除非蒸汽发生器传热管发生泄漏。"},{"id":"basics_op_0040","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂，链式裂变反应是由  _____ 维持的。","options":["热中子","快中子","γ射线"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"压水堆以轻水慢化中子，热中子引发铀-235裂变的截面大，链式裂变反应由热中子维持。"},{"id":"basics_op_0041","module":"basics","bank":"运行概述","type":"single","stem":"原子是由带正电的_____ 和带负电的电子组成。","options":["原子核","量子","中子"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"原子由带正电的原子核和绕核运动的带负电电子组成，整体呈电中性。"},{"id":"basics_op_0042","module":"basics","bank":"运行概述","type":"single","stem":"以下_____，是我国目前核电发展政策。","options":["火电为主、大力发展水电、核电为补充","在保证安全的基础上适度发展核电","积极安全有序发展核电"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"我国当前核电发展政策是积极安全有序发展核电，在保证安全的基础上适度发展核电是此前表述。"},{"id":"basics_op_0043","module":"basics","bank":"运行概述","type":"judge","stem":"蒸汽发生器倒U形管部位进行一二回路热交换。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，一回路冷却剂流经蒸汽发生器倒U形传热管束，将热量传给管外二回路给水产生蒸汽。"},{"id":"basics_op_0044","module":"basics","bank":"运行概述","type":"judge","stem":"核电厂绝大多数使用过饱和蒸汽。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，压水堆核电厂使用蒸汽发生器产生的饱和蒸汽推动汽轮机做功，并非过饱和蒸汽。"},{"id":"basics_op_0045","module":"basics","bank":"运行概述","type":"judge","stem":"正常运行时，压水堆核电厂汽轮机厂房有放射性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，正常运行时二回路汽水无放射性，汽轮机厂房（常规岛）本质上不存在放射性，放射性集中在一回路。"},{"id":"basics_op_0046","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆的慢化剂是重水。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，重水堆以重水作慢化剂，重水中子吸收截面小、慢化性能好，还可兼作冷却剂。"},{"id":"safety_zb_0001","module":"safety","bank":"保护区安全准入","type":"single","stem":"独立验证验证人（组）验证设备的状态（或配置）与（ ）的一致。","options":["程序要求","执行人（组）通知","经验反馈","配置管理要求"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：独立验证的使用方法明确『验证人（组）验证设备的状态（或配置）与程序要求的一致』，即以程序（规程）为核对基准，确认设备被恢复到文件规定的状态。不选B：执行人（组）通知只是『操作人向下令人报告任务完成、要求独立验证』的报告环节，验证组恰恰不能依赖执行组的口头描述，要保持思维独立；不选C：经验反馈用于改进管理，不是核对基准；不选D：配置要求最终要落实到程序文件中，课件表述以『程序要求』为准。【易混点】独立验证与监护的区别：监护是两人同时同地同步确认，独立验证是执行组、验证组在时间、空间和思维上隔离、先后进行，验证人授权应不低于执行人。"},{"id":"safety_zb_0002","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下情况下（ ）可以使用独立验证的工具，来防止人因失误。","options":["设备维修后投用前","安全相关设备或重要设备及系统的配置","安装重要设备或系统的隔离牌/锁时","其它选项都可以"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：独立验证适用于『不会立即产生严重后果但有潜在不良影响的操作』，课件列举的使用条件包括：设备维修后投用前、安全相关设备或重要设备及系统的配置、安装重要设备或系统的隔离牌/锁时，此外还有临时变更的安装及拆除等。A、B、C三项均在课件列举范围之内，故选D『其它选项都可以』，单独选任一项都不完整。【易混点】与监护的分工：一旦失误将产生立即的、不可逆重大后果的操作用监护；独立验证有滞后性（操作完成后才验证），关注的是状态和配置是否正确。"},{"id":"safety_zb_0003","module":"safety","bank":"保护区安全准入","type":"single","stem":"在口头交流中，信息最少需要通过（ ）次交换可确保信息有效传达。","options":["0次","1次","2次","3次"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：三向交流的定义是『通过信息的发送、复述和确认，从而确保信息从发送人准确无误地传输给接收人』，即发送方发出信息→接收方复述→发送方确认『正确』，三次交换缺一不可，故为3次，选D。不选A/B：0次、1次只是单向传达，无法发现曲解和误解；不选C：2次缺少发送方最后的确认环节，接收方复述有误时仍可能误以为信息已正确传达。【易混点】若复述有误，发送方应指出『信息是错误的』并重新开始整个沟通流程；设备编码等信息要一个字一个字地重复。"},{"id":"safety_zb_0004","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下各项中，哪项是使用自检工具的主要目的。（ ）","options":["强化工作态度","减少失误频率","提高交流水平","消除外界干扰"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：自检（STAR）的使用目的是『帮助操作人集中精力在合适的任务或操作上、在操作前理解所期望的结果并在执行后确认结果』，课件同时指出自检通常是『预防人因失误的最后一道屏障』，即通过停、思、行、审降低执行过程中的失误频率，故选B。不选A：强化工作态度只是间接效果，不是主要目的；不选C：提高交流水平是三向交流工具的目的；不选D：消除外界干扰不是自检所能实现的。【易混点】课件明确『所有活动中都必须使用自检』，并非只有重大操作才使用；自检主要用于设备识别和设备操作。"},{"id":"safety_zb_0005","module":"safety","bank":"保护区安全准入","type":"single","stem":"'STAR'中的Review（审）主要是确认实际的响应结果与（ ）是否相符。","options":["预期","想象","最初"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：STAR第四步『审（REVIEW）——确认获得预期的结果』，要求确认系统、设备暂态结束、状态稳定，『核实操作结果符合预期』。自检在『思』的环节就要预先想清楚预期响应，『审』就是拿实际结果与这个预期比对，故选A。不选B：凭『想象』核对容易自我暗示、自欺欺人；不选C：『最初』没有明确的核对基准含义，基准是操作前确立的预期结果。【易混点】审查发现异常时应及时汇报并按预想方案响应，而不是带着疑问继续下一步操作。"},{"id":"safety_zb_0006","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下属于监护的主要目的是（ ）。","options":["预防监护人失误","预防执行过程中的失误","纠正错误","其它选项全是"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：监护的目的是『通过设置二人小组形成预防错误的双重屏障，确保操作的正确性』，由监护人全程观察执行人操作、在错误发生前予以预防，核心是预防执行过程中的失误，故选B。不选A：监护防范的是执行人（操作人）的失误，不是监护人自己；不选C：纠正错误只是监护人的干预手段，目的在于『预防』而非事后纠正；不选D：A本身说法错误，不能全选。【易混点】监护的基本原则：监护人授权通常应等同或高于执行人；执行人和监护人意见达成一致后执行人才能行动；双方都要对设备分别自检。"},{"id":"safety_zb_0007","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用独立验证工具时，应避免出现下列情况（ ）。","options":["在执行组采取行动期间，验证组距离执行组非常近","执行组尚未完成所有操作即开始进行独立验证","在执行验证前，执行组告诉验证组已经做了什么，哪些没做","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》独立验证『应避免的风险行为』：验证人（组）在操作人采取行动期间距离执行组非常近、执行验证前操作人（组）告诉验证人（组）已经做了什么哪些没做、两组合作共同执行同一项任务等，都会破坏『独立』性；使用方法也要求操作人（组）执行完操作并报告后，验证人（组）才进行验证。A、B、C均属课件指出的不当做法，故选D。【易混点】『独立』要求验证组与执行组在时间、空间、思维三方面隔离；有多种验证手段时应分别使用不同手段/仪表，而不是共用同一个。"},{"id":"safety_zb_0008","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用三向交流工具过程中，当接收方接收信息滞后或复述有错误时，发送方应该怎么做（ ）。","options":["要求接收方再复述或重述信息一次","告诉接收方'信息是错误的'，并要求重述原始信息","通过接收方所使用交流方式进行反馈"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：三向交流第三步，发送方核实复述信息，正确时对接收者说『正确』『对的』；『如果信息错误，则重新开始以上沟通流程』，即发送方应明确告知接收方信息是错误的，并要求其重述原始信息，直至准确，故选B。不选A：只笼统要求『再复述一次』，不指出错误所在，接收方可能重复同样的误解；不选C：按接收方的交流方式反馈不符合三向交流由发送方确认的规范流程。【易混点】关键信息要减慢语速、口齿清晰；接收方没听清应主动要求对方重复，不情愿发问来确认信息是应避免的风险行为。"},{"id":"safety_zb_0009","module":"safety","bank":"保护区安全准入","type":"single","stem":"核电厂屏障分为（ ）、个人屏障、管理屏障、组织屏障四个层次。","options":["实物屏障","实体屏障","环境屏障","行政屏障"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》练习题原文：核电厂屏障分为实体屏障、个人屏障、管理屏障、组织屏障四个层次，答案为实体屏障，故选B。不选A：『实物屏障』是易混淆的近义说法，课件用词为『实体屏障』；不选C：『环境屏障』不在四层次之列，环境因素属于失误先兆中的『工作环境』；不选D：课件把规程、培训、授权等软措施归入管理屏障，四层次中没有单独的『行政屏障』。【易混点】四层次内容：实体屏障如防火门、安全阀、PPE、辐射屏障；个人屏障是知识、技能、态度、意识；管理屏障是规程、技术规格书、培训、授权、工作票；组织屏障是资源配置、组织机构、流程价值观、文化氛围。"},{"id":"safety_zb_0010","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下属于个人屏障的是（ ）。","options":["资源配置","电厂运行规程","知识技能","专设安全设施"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》屏障分类：个人屏障包括知识、技能、态度、意识，故『知识技能』属于个人屏障，选C。不选A：『资源配置』属于组织屏障；不选B：『电厂运行规程』属于管理屏障（规程、电厂政策、技术规格书、培训、人员授权、工作票等）；不选D：『专设安全设施』属于实体屏障。【易混点】记忆要领：实体屏障是看得见摸得着的硬件，管理屏障是文件制度，组织屏障是资源与价值观文化，个人屏障长在人自己身上——技能（包括使用防人因失误工具）也属个人屏障。"},{"id":"safety_zb_0011","module":"safety","bank":"保护区安全准入","type":"single","stem":"自检的防人因失误工具包括（ ）、（ ）、（ ）和（ ）四个重要步骤。（ ）","options":["停、思、行、审","停、行、审、思","思、停、行、审","思、审、停、行"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：自检STAR四步骤为Stop停、Think思、Act行、Review审——先停下手头其它工作、把注意力集中到当前对象，再思考将发生的情况和预期响应，然后手指口述执行正确操作，最后审查确认获得预期结果，正确顺序即『停、思、行、审』，故选A。不选B/C/D：均打乱顺序，先『行』后『思』等于不假思索就动手，先『思』后『停』则无法先排除干扰、集中注意力。【易混点】『行』的要点是手指口述：手指设备标牌、大声说出操作对象名称（编号）和操作内容，与程序核对无误后再执行。"},{"id":"safety_zb_0012","module":"safety","bank":"保护区安全准入","type":"single","stem":"下列哪项描述对应着图中工作人员在使用质疑的态度工具时应该避免出现的情况？（ ）","options":["忽视其他人的担心和质疑","对关键的参数不在意","相信技术资料来源是可靠的","认为不会出现任何风险"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》《核素养（上）》：应避免的风险行为中明确包括『相信不会有不好的事情发生』『认为任务是例行或者简单的』这类自满心理；『秉持质疑的态度』原则要求对当前的各种状态、异常始终保持质疑。图中情境表现的正是『认为不会出现任何风险』的自满心态，是使用质疑的态度工具时最典型、最应避免的情况，故选D。不选A/B：忽视他人质疑、对关键参数不在意固然错误，但与图中自满情境不对应；不选C：信赖可靠来源的技术资料本身是正常做法，不加核实地盲信才需要避免。【易混点】『自满』是重要失误先兆；工作被打断、第一次执行新任务、时间压力大等情况都应主动使用防人因失误工具。"},{"id":"safety_zb_0013","module":"safety","bank":"保护区安全准入","type":"single","stem":"'明知不可为而为之'导致不良后果的行为属于（ ）。","options":["知识型失误","规则性失误","技能型失误","违规"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"课件未直接覆盖知识型/规则性/技能型失误的分类，但依据课件《核素养（上）》『两个零容忍』章节：违规操作（违章操作）是指『员工不遵守规章制度进行操作的行为』。『明知不可为而为之』是明知规定而有意违反，属于违规（违章），故选D。不选A/B/C：知识型、规则性、技能型失误都是行为人无意造成的差错（分别源于缺乏知识、误用规则、执行走样），与『明知故犯』有本质区别——失误无意，违规有意。【易混点】课件强调对『违规操作』和『弄虚作假』两个零容忍；违规可只违反企业自身程序制度，也可能同时触犯行业技术规范甚至法律法规，将受惩戒。"},{"id":"safety_zb_0014","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪些属于工后会工具使用的基本原则。（ ）","options":["工后会是以总结经验、改进工作绩效为目的，不要追究责任","工后会形式应采用对话讨论的形式","纠正行动和计划满足SMART原则","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》工后会基本原则：『工后会是以总结经验、改进工作绩效为目的，不要追究责任』『工后会形式应采用对话讨论的形式』『纠正行动和计划满足SMART原则』——三项均为课件原文，故选D『其它选项都是』。【易混点】工后会应在工作完成后立即召开，地点选不被其他事情干扰的地方；总结出的良好实践、经验教训要填写工后总结报告或状态报告形成记录存档、跟踪至问题解决；主持人是工作负责人，采用对话讨论而非一人独角戏。"},{"id":"safety_zb_0015","module":"safety","bank":"保护区安全准入","type":"single","stem":"使用三向交流工具时应避免以下哪些情况（ ）。","options":["发送方试图与已经专心于另一对话的人员沟通","接收方在收到发送方第三步确认前就采取了行动","发送方没有用接收方姓名提醒其注意","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》三向交流『应避免的风险行为』：『信息发送者试图与已经专心于另一对话的人员沟通』；『信息接收者在沟通结束前就进行操作』（即未收到发送方第三步确认就行动）；『信息发送者没有引起接收者的注意』（未用姓名提醒）等均在课件所列风险行为之中。A、B、C都应避免，故选D。【易混点】课件同时提醒：在非关键信息传递时过度使用三向交流也是应避免的风险行为；有两条以上信息需要记忆时，接收者应当用纸笔记录下来。"},{"id":"safety_zb_0016","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用自检工具的过程中，以下说法正确的是（ ）。","options":["在执行任务前没有必要充分理解程序的步骤","当失去视觉接触或身体接触而注意力不集中时，应再次进行自检","在不影响执行任务情况下，打电话或与另一人交谈执行任务时打电话或与另一人交谈","为提高效率，一次执行两个以上的操作"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》自检应避免的危险行为包括：『如果视线离开操作对象或中止工作后重新开始工作时，没有再次进行自我检查』，即失去视觉接触或身体接触、注意力被打断后，恢复执行必须重新自检，B正确。不选A：课件明确『执行任务前没有理解程序的步骤』是应避免的危险行为，故『没必要理解程序步骤』说法错误；不选C：『执行任务时打电话或与另一人交谈』是应避免的危险行为；不选D：『一次或同时执行两个以上的操作』『连续、快速地执行多个操作』均应避免，为提高效率多操作并存说法错误。【易混点】自检是连续的动作序列，被打断（如有人询问问题）就要求重新开始执行。"},{"id":"safety_zb_0017","module":"safety","bank":"保护区安全准入","type":"single","stem":"三哩岛和切尔诺贝利事故的一条重要教训，就是（ ）特别重要，为了减少人的差错，要重视（ ）。","options":["核电站管理/业务技能","人因问题/培育安全文化","人员管理/培训技术骨干","运行维修管理/安全文化"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》练习题原文：三里岛和切尔诺贝利事故的一条重要教训，就是人因问题特别重要，为了减少人的差错，要重视培育安全文化，故选B。不选A/C/D：把教训归为核电站管理、人员管理或运行维修管理等某一方面都不准确——两起事故的核心都指向『人的因素』及安全文化缺失，切尔诺贝利事故后WANO成立、INSAG首次提出安全文化概念。【易混点】INSAG-4《安全文化》指出：除了『上帝的旨意』这类不可抗拒力，核电厂发生的任何问题在某种程度上都来源于人为错误。"},{"id":"safety_zb_0018","module":"safety","bank":"保护区安全准入","type":"single","stem":"工作人员在使用质疑的态度工具时应该避免出现的情况。（ ）","options":["忽视其他人的担心和质疑","对关键的参数不在意","相信技术资料来源是可靠的","其它选项都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》《核素养（上）》：使用质疑的态度工具时，对信息、参数、他人意见都应保持审慎——A忽视其他人的担心和质疑，会让有价值的预警被埋没；B对关键的参数不在意，会让偏差漏过防线；C『相信技术资料来源是可靠的』若指不加核实地盲目相信同样应避免，课件在『使用和遵守程序』应避免的风险行为中明确列有『认为程序经过精心编写，内容完全正确』。三项都应避免，故选D。【易混点】质疑的态度不是怀疑一切：对异常状态、不确定情况保持警觉，遇到不确定时停止工作、核实后再行动；对权威资料可以信赖，但不能盲信。"},{"id":"safety_zb_0019","module":"safety","bank":"保护区安全准入","type":"single","stem":"监护是指在一起工作的两个独立的人的一系列行为，以下关于监护工具描述正确的是（ ）。","options":["在同样的时间和地点","在一个具体操作之前和过程中","为了预防执行过程中的失误","其它选项全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》监护定义：『由两个人（一人是操作执行人，一人是操作监护人）在同一时间和地点共同执行同一任务，其中一人执行操作，一人同步确认』；使用方法中操作前双方分别阅读文件、形成共识并分别自检，操作中监护人全程观察、及时制止错误，目的是预防执行过程中的失误。『同样的时间和地点』『在一个具体操作之前和过程中』『为了预防执行过程中的失误』三项描述均与课件一致，故选D。【易混点】监护适用于一旦失误将产生立即的、不可逆的重大后果的操作；监护人授权应等同或高于执行人，执行过快使监护人无法干预也是应避免的风险行为。"},{"id":"safety_zb_0020","module":"safety","bank":"保护区安全准入","type":"single","stem":"'工作负荷重'、'时间压力大'这属于人因失误四要素中的哪个要素？（ ）","options":["失误先兆","不完善的屏障","潜在的组织缺陷","触发事件行为"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》练习题原文：『工作负荷重』『时间压力大』属于人因失误四要素中的失误先兆（墨菲陷阱）。课件把失误先兆按任务要求、工作环境、个人能力、人的本性分类，『工作任务重、赶时间、需要同时完成多个任务、超时工作』等均列于『任务要求』之下。不选B/C/D：不完善的屏障、潜在的组织缺陷、触发事件行为是事件发展链条上的其他要素，工作负荷重、时间压力大是诱发失误的先兆条件。【易混点】失误先兆是可预见、可管理、可预防的；工前会SAFER原则中的『预测（Anticipate）』环节正是识别这些陷阱的时机。"},{"id":"safety_zb_0021","module":"safety","bank":"保护区安全准入","type":"single","stem":"在使用自检工具时，下列哪项是需要避免出现的情况（ ）。","options":["在执行自检时交谈","识别或知晓任务中的关键步骤或关键参数","在找到正确设备后开始操作","在失去身体接触后重新使用自检"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》自检应避免的危险行为：『执行任务时打电话或与另一人交谈』。自检要求注意力高度集中于操作对象，执行自检时交谈会分散注意力、破坏停-思-行-审动作序列的连续性，故选A。不选B：识别、知晓任务中的关键步骤或关键参数是自检『思』的应有内容；不选C：找到正确设备并与程序核对无误后开始操作，是『行』的正确做法；不选D：失去身体接触后重新使用自检正是课件的要求。【易混点】自检必须以高度严谨的态度执行才能保证有效性；『手指口述』要大声说出设备名称、编号和操作内容。"},{"id":"safety_zb_0022","module":"safety","bank":"保护区安全准入","type":"single","stem":"为什么使用三向交流工具。（ ）","options":["为给所有工作相关人员发表意见的机会","为在一次交流中传递多项指示","为保证信息接收方收到的信息和发送方的意图是一致的"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》三向交流的目的：『精确、准确、清楚并无误地传输信息』『确保收到的信息就是想要传达的信息』『尽量减少失误可能性』，即保证信息接收方收到的信息和发送方的意图一致，故选C。不选A：给所有工作相关人员发表意见的机会是工前会等会议形式的目的；不选B：『一次交流中传递多项指示』恰恰是应避免的风险行为——发送者一次陈述太多内容，接收者难以记全。【易混点】三向交流适用于：下达操作指令、重要系统设备状态或参数的沟通确认、安全状况报告、职责转移、接受电网调度指令等口头信息传递场合。"},{"id":"safety_zb_0023","module":"safety","bank":"保护区安全准入","type":"single","stem":"中国大陆的第一座核电站是（ ）。","options":["秦山核电站","大亚湾核电站","石岛湾核电站","海阳核电站"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》：1985年秦山核电站开工建设，1991年建成投入运行，『实现中国大陆核电零的突破，被誉为国之光荣』，是中国大陆第一座核电站，故选A。不选B：大亚湾核电站1994年才投入商业运行；不选C：石岛湾是高温气冷堆示范电站，投运更晚；不选D：海阳核电站采用三代AP1000机组，属后建电站。【易混点】秦山核电站源于1970年『七二八』工程；『华龙一号』全球首堆（福清核电5号机组）2020年首次并网成功，是我国完全自主知识产权的三代压水堆。"},{"id":"safety_zb_0024","module":"safety","bank":"保护区安全准入","type":"single","stem":"错误的人工物料搬运动作可能导致的伤害不包括（ ）。","options":["手指被卡在手推车和其他物体之间","听力损伤","肩部肌肉受损","物品倾翻伤人"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（下）》物料搬运：因错误搬运经常造成的典型伤害包括『手指和手被卡在手推车和其它的物体之间』『脚趾、脚和小腿被手推车挤伤，肩膀和背部的肌肉损伤』等；课件案例中还有螺母放置不当引起小车侧翻挤伤人员（物品倾翻伤人）。听力损伤与人工搬运动作没有因果关系，不属于错误搬运可能导致的伤害，故选B。【易混点】听力损伤属于噪声职业危害，对应防护用品是耳塞/耳罩，在噪声高出85分贝的场所必须使用；搬运伤害的防范要点是正确穿戴防护用品、掌握正确搬举姿势。"},{"id":"safety_zb_0025","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于运行处的职责？（ ）","options":["操作设备","批准设备检修工单","批准大多数核电厂的操作","反应堆功率控制"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》电厂机构职责表：运行处『负责公司机组安全、稳定运行，对异常工况实施响应，按照规程采取纠正行动或启动应急措施；负责通过隔离措施准备工作条件，控制机组运行状态』——操作设备、反应堆功率控制、批准大多数核电厂操作均属运行职责；而『批准设备检修工单』属于维修及计划管理环节的职责（维修处负责系统设备维护保养与缺陷处理、大修准备与实施），不在运行处职能之列，故选B。【易混点】运行处通过隔离措施为检修『准备工作条件』，与『批准检修工单』是两个概念；技术处负责设备维修策略制定与性能监督。"},{"id":"safety_zb_0026","module":"safety","bank":"保护区安全准入","type":"single","stem":"我国秦山第三核电厂建设两台（ ）核电机组。","options":["重水堆（PHWR）","沸水堆","高温气冷堆","快堆"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》堆型介绍：压水式重水反应堆（PHWR）使用重水作为冷却剂和慢化剂、天然铀作燃料，『我国秦山第三核电厂建设了2台重水堆机组』，故选A。不选B：沸水堆（BWR）我国大陆没有，仅台湾省有分布；不选C：高温气冷堆（HTGR）建在华能石岛湾；不选D：先进快中子反应堆（CFR-600）示范机组建在福建霞浦。【易混点】我国运行及在建核电站以压水式轻水堆（PWR）为主，压水堆也是全球应用最成熟广泛的堆型，占比超过60%。"},{"id":"safety_zb_0027","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪种行为与'秉承质疑的态度'的核安全文化相悖？（）","options":["进行现场工作时，发现前一天设置的安全围栏被移动过，小张立即致电主管咨询有无异常情况；","大修期间，小李中班巡检至常规岛厂房汽轮机平台时，发现射线探伤标识牌，但交接班时并未得到通知有探伤工作，于是暂停巡检，致电主控室询问；","小王在执行现场操作单时，发现单子上有两个步骤上的编号手动涂改过，决定询问主管后再实施；","小张进行设备送电前的外观检查工作时，发现设备周围搭设有脚手架，但觉得不影响送电，于是没有报告主控室；"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》『秉持质疑的态度』原则：对当前的各种状态、假设、异常和活动始终保持质疑的态度，遇到不确定状态时停止工作、寻求帮助，在继续工作前对现状进行评估和风险控制。小张送电前检查发现设备周围搭设有脚手架——这是与预期不符的异常状态，却『觉得不影响送电』不作报告，属于自满、想当然，放弃了质疑，与该原则相悖，故选D。不选A：发现安全围栏被移动立即致电主管核实异常，正是质疑态度的体现；不选B：发现探伤标识牌但交接班未通知，暂停巡检询问主控室，做法正确；不选C：发现操作单编号被涂改，询问主管后再实施，做法正确。【易混点】质疑不是不信任同事，而是对异常、不确定状态保持警觉，先核实再行动。"},{"id":"safety_zb_0028","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪种行为与'核安全人人有责'的核安全文化相悖？（ ）","options":["设备检修后一项再鉴定指标偏差微乎其微，但工作负责人就是不签字认可；","发现工作现场的安全隐患，及时汇报处理；","安排好的培训临时有事去不了，找人代签到；","小张发现有人在电气厂房抽烟，马上进行了制止并向主管进行汇报。"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上)》『核安全人人有责』原则：所有从业人员应知其责、尽其职，清楚自己的核安全责任和权限，坚持『两个零容忍』；课件案例中，某操纵员『实际未参加培训但由他人代为签名』被国家核安全局处以警告、一年内不得再次申请执照的行政处罚。找人代签到既是放弃自身学习和安全责任，又属于弄虚作假（文件记录造假），与该原则相悖，故选C。不选A：再鉴定指标虽偏差微小仍不轻易签字认可，是坚持质量标准；不选B：发现安全隐患及时汇报处理是应尽职责；不选D：制止电气厂房抽烟并汇报，正是履行安全责任。【易混点】『两个零容忍』：对违规操作零容忍、对弄虚作假零容忍；人人有责，从我做起。"},{"id":"safety_zb_0029","module":"safety","bank":"保护区安全准入","type":"single","stem":"听到应急广播后应采取的行动不包括（ ）。","options":["将正在运行的设备或和正在进行的工作置于安全状态","根据电厂程序护送所有的访问者到安全位置","赶快打电话通知家人","如果你在辐射控制区，除被特别告知的情况，都要按正常情况时的流程步骤离开"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》应急响应：听到应急广播后，非应急人员应『将正在运行的设备或正在进行的工作置于安全状态』，按广播通知采取隐蔽、撤离或服碘等防护行动；短期承包商、参观等外来人员由接口处室负责组织防护行动；在辐射控制区的，除被特别告知的情况外，都按正常离开辐射控制区的流程步骤离开。『赶快打电话通知家人』不在应采取的行动之列，且课件明确应急情况下『家庭成员不应该私自向电站打电话询问，以免影响电站通讯』，故选C。【易混点】撤离使用公司大巴和中巴，不能使用私家车，避免交通拥堵；先上车人员后排就坐以便快速完成登车。"},{"id":"safety_zb_0030","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于保卫处的职责？（ ）","options":["控制重要区域的人员进入","分发通行证","负责基本安全培训","负责厂区交通管理"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》电厂机构职责表：保卫处负责『电厂消防管理与监督、治安管理；核电厂实体保护和厂区交通安全管理；对口联系地方消防、公安等部门；归口负责保密工作』；而培训处『负责公司培训及管理，开展技能培训、基本安全及操纵员培训管理、承包商人员安全培训』。『负责基本安全培训』属于培训部门职责，不属于保卫处，故选C。不选A/B/D：控制重要区域人员进入、分发通行证、厂区交通管理都是保卫处职责。【易混点】课件《消防保卫》还说明保卫负责证件办理、出入口警卫检查与安全门控制；基本安全培训可等同于三级安全教育中的『公司级』安全教育。"},{"id":"safety_zb_0031","module":"safety","bank":"保护区安全准入","type":"single","stem":"当有两个或两个以上人员进行人工搬运物料时，以下说法错误的是（ ）。","options":["尽量使用不同侧的肩膀搬运材料","注意周围的人员及物料动态","应协商指定专人负责指挥和协调物料搬运活动","搬运人员应前后一个接一个行走"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（下）》物料搬运一般规定：当有两个或两个以上人员进行人工搬运物料时，『应协商指定专人负责指挥和协调物料搬运活动』『注意周围的人员及物料动态』，每个搬运人员应尽量面朝材料所需搬运的方向、前后一个接一个行走、『尽量使用同一侧的肩膀搬运材料』，以便统一口令、协调发力。A『尽量使用不同侧的肩膀搬运材料』与课件要求相反，说法错误，故选A。不选B/C/D：均与课件规定一致。【易混点】推荐的个人最大搬运重量为20kg，超过应寻求帮助；搬运长条形物体时双手要远离物体端部，防止被挤压夹伤。"},{"id":"safety_zb_0032","module":"safety","bank":"保护区安全准入","type":"single","stem":"你休息时间正在和家人一起吃饭，并喝了一瓶葡萄酒，这时接到了来自主管的电话，要求你现在到现场来处理一下主给水泵电机端渗油问题，你的回答应该是：（ ）","options":["好的，我就过来","我过几个小时就能到","我刚喝了一瓶葡萄酒，所以我不能前往现场工作","我现在开车过来"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》值班健康要求：『在工作开始前5小时及工作中不得饮酒，酒后不得进入生产区域』；『处于on-call或应急值守期间不得饮酒』。刚喝了一瓶葡萄酒，既不满足时间间隔要求，也属酒后状态，不能进入现场执行工作，应如实告知主管喝了酒，由主管另行安排人员，故选C。不选A：立即答应前往违背酒后禁入规定；不选B：一瓶葡萄酒的酒精未必能在几小时内代谢达标，且渗油处理未必容许等待；不选D：酒后开车本身违法且危险。【易混点】饮酒后进入生产区域作业且检测酒精含量超过20mg/100ml属于工业安全红线；个人工作适任性存在疑问时应暂停工作。"},{"id":"safety_zb_0033","module":"safety","bank":"保护区安全准入","type":"single","stem":"小李是正在进行岗位培训的实习现场操作员，在经过汽轮机厂房时发现地面上有水，于是询问他的主管这是否正常。请问小李正确演示了哪项核安全基本原则？（ ）","options":["秉持质疑的态度","践行学习型组织","领导做安全的表率","建立组织内部的高度信任"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》『秉持质疑的态度』原则：『对当前的各种状态、假设、异常和活动始终保持质疑的态度，避免可能导致的错误和不当行为』，每个人都对不利于电厂安全的假设、状态或行为保持警觉。小李经过汽轮机厂房发现地面上有水——属于异常状态，他没有视而不见，而是主动询问主管『这是否正常』，正是秉持质疑的态度的体现，故选A。不选B：践行学习型组织强调珍惜、寻求和利用一切学习机会，持续改进；不选C：领导做安全的表率是对各级领导的要求；不选D：建立组织内部高度信任对应『营造和谐的氛围』，与题干行为不对应。【易混点】发现异常、拿不准时可配合『不确定时暂停』工具：停止工作，核实后再继续。"},{"id":"safety_zb_0034","module":"safety","bank":"保护区安全准入","type":"single","stem":"下面哪项材料是不属于系统或设备组成部分的'异物'？（）","options":["固定设备用的地脚螺栓","联轴器连接螺丝","破碎的清洁布","电机接线盒"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（下）》防异物基本概念：异物（FM）是『根据设计，任何非预期存留或引入系统设备、不属于系统或设备组成部分的物项』，课件举例包括『碎片污垢、破损或丢失的部件、油、碎布、工具』等。破碎的清洁布即『碎布』类外来物项，不属于系统或设备组成部分，是异物，故选C。不选A/B/D：固定设备用的地脚螺栓、联轴器连接螺丝、电机接线盒都是设备的组成部件，按设计属于系统设备本身，不是异物。【易混点】判断标准是『是否属于系统或设备的组成部分』；防异物区域内禁止使用透明塑料布、套管、包装袋等难以发现的透明材料；纸张、碎布、泡沫等易撕碎材料禁止作为防异物挡板。"},{"id":"safety_zb_0035","module":"safety","bank":"保护区安全准入","type":"single","stem":"疲劳对人体的影响不包括：（ ）","options":["精神亢奋","失眠、入睡困难","感官系统异常，眼睛干涩、视物模糊","耳鸣、耳聋等"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》疲劳的危害：生理方面包括损伤体力体能、疲惫乏力、免疫系统功能失常、『失眠、入睡困难』、『感官系统异常，眼睛干涩、视物模糊』、『耳鸣、耳聋等』；心理方面包括情绪不稳、注意力不集中、警觉性降低、反应迟钝等。『精神亢奋』不在疲劳的表现之列——疲劳使人反应迟钝、倦怠而非亢奋，故选A。不选B/C/D：均为课件列举的疲劳影响。【易混点】疲劳的缓解措施：合理膳食、适量运动、改善睡眠、心理建设；疲劳不仅降低工作效率，还容易引发事故。"},{"id":"safety_zb_0036","module":"safety","bank":"保护区安全准入","type":"single","stem":"岗位工作适任性的影响因素不包括：（ ）。","options":["身体健康","心理健康","酒精、药物、食物","工资收入"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》岗位工作适任性影响因素：身体健康、心理健康、酒精/药物/食物、疲劳四个方面——工作人员的健康状况及精神状态可能导致工作能力降低，必须确保工作人员可信、工作能力可靠。工资收入与个人的身体和精神状态无关，不是适任性影响因素，故选D。不选A/B/C：均属课件列举的因素。【易混点】每个人都有责任适应自己的岗位，也应留意身边表现出适任性问题的人；个人适任性存疑时应暂停工作，确定能安全完成任务时再返回工作。"},{"id":"safety_zb_0037","module":"safety","bank":"保护区安全准入","type":"single","stem":"操作机械或高处作业等人员工作期间不宜使用的药物不包括:（ ）。","options":["可引起嗜睡的药物","可出现眩晕或幻觉的药物","可使视物模糊或辨色困难的药物","复合维生素"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》练习题：操作机械或高处作业等人员工作期间不宜使用的药物包括『可引起嗜睡的药物、可出现眩晕或幻觉的药物、可使视物模糊或辨色困难的药物、可使出现定向力障碍的药物』。复合维生素不会引起嗜睡、眩晕、视物模糊等影响作业安全的反应，不在其列，故选D。【易混点】课件提醒：一些处方药和非处方药（抗组胺药、复方感冒药、催眠镇静药、止疼药等）会引起反应能力和警觉性减弱，使用此类药物应告知主管；使用任何会影响安全工作能力的药物都要主动报告。"},{"id":"safety_zb_0038","module":"safety","bank":"保护区安全准入","type":"single","stem":"作为主管，你工作组的某位成员近期频繁请假早退，你应如何回应该人员：（ ）","options":["当然可以。按照请假流程审批即可","尝试想了解具体的情况，但觉得侵犯了别人的隐私","询问是否需要员工心理援助项目（EAP）提供帮助","不闻不问"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》：员工心理援助项目（EAP）是由企业为员工设置的一套系统的、长期的福利与支持项目，通过专业人员对组织的诊断建议和对员工及其直系亲属提供指导、培训和咨询，帮助解决心理和行为问题、提高工作绩效。作为主管，发现下属频繁请假早退，应主动关心并询问是否需要EAP提供帮助，故选C。不选A：只按流程审批不关注原因，忽视了员工健康与适任性管理责任；不选B：以侵犯隐私为由回避沟通，放弃管理责任；不选D：不闻不问可能让问题恶化，影响安全。【易混点】主管辨识适任性既看身体状态变化，也看社会交往变化；发现异常行为不要正面对抗，应及时向管理人员报告。"},{"id":"safety_zb_0039","module":"safety","bank":"保护区安全准入","type":"single","stem":"直接推动汽轮发电机组发电的是（ ）。","options":["蒸汽","高温高压的水","压缩空气","原子能"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》核能发电原理：『二回路给水在蒸汽发生器内被一回路冷却剂加热成为饱和蒸汽，蒸汽推动汽轮发电机组转动发电，输送至电网』。直接推动汽轮发电机组的是蒸汽，故选A。不选B：高温高压的水是一回路冷却剂，只在堆芯与蒸汽发生器之间循环，通过蒸汽发生器把热量传给二回路，并不进入汽轮机；不选C：压缩空气与核电厂发电流程无关；不选D：原子能（核能）先转变为热能，再经蒸汽转化为机械能、电能，并非直接推动汽轮机。【易混点】能量转换链条：核能→热能→（蒸汽的）机械能→电能；完成做功的蒸汽在凝汽器内冷凝成水，重新送回蒸汽发生器循环。"},{"id":"safety_zb_0040","module":"safety","bank":"保护区安全准入","type":"single","stem":"搬运物料时，应保持（ ）的自然挺直，利用腿部肌肉发力抬起物体。","options":["手臂","腰部","脖子","小腿"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（下）》物料搬运练习题原文：『搬运物料时，应保持腰部的自然挺直，利用强壮的腿部肌肉抬起物体』。正确搬举方法是屈膝下蹲、腰部保持自然挺直，靠腿部肌肉发力起立，避免弯腰用腰部直接发力造成腰背损伤，故选B。不选A/C/D：手臂、脖子、小腿都不是需要刻意保持自然挺直并作为发力支点的部位；弯腰、过度伸展或用力过猛恰恰是造成背部伤害的错误方法。【易混点】搬运前应确认物料重量（推荐个人最大搬运重量20kg）、受力平衡且绑扎牢固；搬运过程中避免突然转身。"},{"id":"safety_zb_0041","module":"safety","bank":"保护区安全准入","type":"single","stem":"下列哪个物项可以作为防异物装置（ ）。","options":["橡胶手套","厚纸板","透明塑料布","设备人孔盖版"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（下）》防异物装置的使用：『设备原有部件也可以充当防异物装置，如容器人孔盖、阀盖、接线盒盖子、柜门等等』，工作暂停期间可用其封堵设备开口、防止异物进入，故选D。不选A：橡胶手套被课件明确列为禁止用作临时防异物装置的物品（图例中判定错误的做法）；不选B：纸张、纸板属易撕碎材料，禁止作为防异物挡板；不选C：透明塑料布、袋子等透明材料在防异物区域内禁止使用，因为在构筑物和设备中很难被发现。【易混点】使用防异物盲板等专用装置时应用至少两颗螺栓对称固定；移动防异物装置前须先检查附近区域无异物，并经工作负责人同意。"},{"id":"safety_zb_0042","module":"safety","bank":"保护区安全准入","type":"single","stem":"'营造一个关注安全的工作氛围，在此氛围下个人可自由地提出安全相关的问题，而不必担心受到报复、威胁、骚扰或歧视。'这属于哪条核安全文化原则？（ ）","options":["秉承质疑的态度","践行学习型组织","领导做安全的表率","营造和谐的氛围"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》卓越核安全文化十大原则之『营造和谐的氛围』：建立相互信任的和谐氛围，重视员工提出的建议和关注事项并提供适宜的工作环境；课件现场工作要求部分进一步明确『中国核电鼓励员工自由地提出意见，每个人都有权跟踪自己关心的问题，不应受到胁迫、歧视或纪律处罚』。题干描述的正是这一原则，故选D。不选A：秉承质疑的态度强调对异常状态保持疑问；不选B：践行学习型组织强调持续学习与经验反馈；不选C：领导做安全的表率是对各级领导的要求。【易混点】『营造和谐的氛围』还要求积极构建与公众、当地利益相关方、政府部门及监管部门良好的沟通关系。"},{"id":"safety_zb_0043","module":"safety","bank":"保护区安全准入","type":"single","stem":"个人劳动防护用品种类包括以下（ ）。","options":["坠落防护PPE","呼吸防护PPE","眼面部防护PPE","以上全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》个人防护用品章节：PPE按防护功能分类，坠落防护PPE包括安全带、速差器、水平生命线、双钩安全带、自锁器等；呼吸防护PPE包括空气呼吸器、过滤式防毒面具、防护口罩；眼面部防护PPE包括安全眼镜、护目镜、面罩；此外还有头部、听力、躯干、手部、足部防护等。坠落防护、呼吸防护、眼面部防护均属个人劳动防护用品种类，故选D『以上全是』。【易混点】PPE是所有安全防护措施中的最后一道屏障，不能直接替代必须采取的安全技术措施；即使正确使用PPE也不代表绝对安全。"},{"id":"safety_zb_0044","module":"safety","bank":"保护区安全准入","type":"single","stem":"安全帽所要预防的风险包含（ ）。","options":["防风","雨和日晒","高空作业坠落撞头","寒冷"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》头部防护：头部伤害的来源包括『落物伤人（孔洞临边、脚手架、起重、交叉作业）』『磕碰（支架、突出的金属部件）』『飞溅的小物体引起的打击（电钻作业、挖掘作业、爆破作业）』等。安全帽防护的核心风险就是高空坠物打击和撞碰头部，『高空作业坠落撞头』属于此类，故选C。不选A/B/D：防风、防雨防晒、御寒都不是安全帽的设计防护功能——安全帽的帽壳、帽衬和下颌带针对的是冲击防护。【易混点】安全帽有效期30个月，使用前检查合格证、完整性和帽衬卡扣；受重物冲击产生裂痕必须更换；长发必须盘在安全帽内，禁止将安全帽作盛装液体、垫坐等其它用途。"},{"id":"safety_zb_0045","module":"safety","bank":"保护区安全准入","type":"single","stem":"常用的电站安全测量仪表有（ ）。","options":["红外测温仪","测氧仪","测氢仪","以上全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》现场常用测量仪表：氧表、氢表、氨表、测温仪、甲醛检测仪、噪声测量仪、复合气体检测仪等，且『测量仪表必须经过检定，且在合格期内』。红外测温仪（测温仪）、测氧仪、测氢仪都是电站常用的安全测量仪表，故选D『以上全是』。【易混点】测量仪表是检测手段而非PPE；进入有限空间等场所前，须用检测仪表落实『先通风、再检测、后作业』，检测氧气、可燃气体、硫化氢和一氧化碳等。"},{"id":"safety_zb_0046","module":"safety","bank":"保护区安全准入","type":"single","stem":"国家颁布的《安全色》标准中，表示指令、必须遵守的标志颜色是（ ）。","options":["红色；","黄色；","蓝色；","绿色。"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》安全色：红色传递『禁止、停止』信息；黄色传递『警告、注意』信息；蓝色传递『指令、必须遵守』信息，强制人们必须做出某种动作或采用防范措施；绿色传递『提示、示意、安全状态、通行』。表示指令、必须遵守的标志颜色是蓝色，故选C。【易混点】指令标志的基本形式为圆形边框、白色图形符号、蓝色衬底（如必须戴安全帽、必须系安全带、必须戴防护手套）；禁止标志是带斜杠的红色圆形框；警告标志是黑边黑图形、黄衬底的正三角形；提示标志采用绿色方形。"},{"id":"safety_zb_0047","module":"safety","bank":"保护区安全准入","type":"single","stem":"起重作业时，下列哪些情况不能吊。（ ）","options":["吊物边缘锋利且无防护措施","吊扎不牢指挥信号不明","吊物上站人","以上全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》起重作业『十不吊』：『散装物装得太满或捆扎不牢不吊』『起重指挥信号不清楚不吊』『吊物上站人或下方有人不吊』；起吊前还应对吊具认真检查，吊物有棱角或特别光滑的部位在与吊绳吊带接触处应加以包扎保护，防止吊带受损打滑。吊物边缘锋利且无防护措施、吊扎不牢且指挥信号不明、吊物上站人，都属于不能吊的情况，故选D『以上全是』。【易混点】十不吊其余各项：吊物重量不明确不吊、斜拉斜拖不吊、超负荷不吊、埋地物件情况不明不吊、易燃易爆危险品未采取措施不吊、照明不足不吊、五级以上强风不吊。"},{"id":"safety_zb_0048","module":"safety","bank":"保护区安全准入","type":"single","stem":"PPE正确使用要求包括（ ）。","options":["会检查PPE的可靠性","会正确使用PPE","会正确维护保养PPE","以上全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》PPE正确使用要求即『三会』：会检查PPE的可靠性、会正确使用PPE、会正确维护保养PPE，三项均为课件原文，故选D『以上全是』。【易混点】PPE使用风险提示：PPE防护性能有限，正确使用也不代表绝对安全；使用PPE可能导致某项感官功能下降（如耳塞影响听觉）；因工作或客观条件无法按程序要求正确使用PPE时，应在作业风险控制文件中说明、采取其他安全保证措施并对工作组成员交底。"},{"id":"safety_zb_0049","module":"safety","bank":"保护区安全准入","type":"single","stem":"运行核电现场存在的职业病危害因素包括（ ）。","options":["电离辐射；","噪声；","化学毒物；","以上都是。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》核电职业病危害因素：放射性危害、噪声、高温、化学毒物、粉尘、工频电场六大类。电离辐射（放射性危害）、噪声、化学毒物均在课件所列危害因素之中，故选D『以上都是』。【易混点】相应防护要点：噪声高出85分贝的场所必须使用耳塞/耳罩；长期吸入生产性粉尘可致尘肺（法定职业病），应佩戴防尘口罩；放射工作人员佩戴热释光剂量计（TLD）和个人电子剂量计（EPD），严禁用EPD测量工作场所剂量率。"},{"id":"safety_zb_0050","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下不属于现场急救的原则的是（ ）。","options":["先轻后重","维持伤员基本生命体征","简单、迅速、有效地处理伤员","及时安全转送伤员到医院"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》现场急救的原则：迅速消除致伤因素、维持伤员基本生命体征、『先重后轻』、简单迅速有效地处理伤员、及时安全转送伤员到医院。急救应优先抢救危重伤员，『先轻后重』颠倒了抢救顺序，不属于现场急救原则，故选A。不选B/C/D：均为课件所列急救原则。【易混点】现场急救的目的：保存生命、减少损害和痛苦、防止伤势或病情恶化、为医护人员争取时间；心搏骤停抢救的『黄金时限』是4分钟；现场急救应优先转运『伤情严重但救治及时可以存活的伤员』。"},{"id":"safety_zb_0051","module":"safety","bank":"保护区安全准入","type":"single","stem":"进行生产现场基本的个人劳动防护用品配备包括（ ）。","options":["安全帽","工装/作业服","安全鞋","以上全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》基本PPE的配备：安全帽、工装/作业服、安全鞋。三项都是进入生产现场的基本个人劳动防护用品，故选D『以上全是』。【易混点】配套要求：进入现场应穿长袖工装、长裤，衣服袖口扣好以防卷入转动设备；执行电气等有火灾烧伤风险的作业必须使用棉质作业服；安全鞋防砸、防静电、防刺穿，电气作业人员须穿绝缘鞋/靴。"},{"id":"safety_zb_0052","module":"safety","bank":"保护区安全准入","type":"single","stem":"一般常用的几大类安全标志有（ ）。","options":["禁止标志","警告标志","指令标志、提示标志","以上全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》安全标志：分为禁止标志（禁止人们不安全行为，红色圆形带斜杠）、警告标志（提醒注意周围环境危险，黑色正三角形、黄衬底）、指令标志（强制做出某种动作或采用防范措施，蓝色圆形）、提示标志（向人们提供信息，绿色方形）四大类。禁止、警告、指令、提示标志均属常用安全标志，故选D『以上全是』。【易混点】安全标志由安全色、几何图形和图形符号构成，作用是引起注意、预防事故，但不能代替安全操作规程和防护措施；作为文字说明的补充标志必须与安全标志同时使用。"},{"id":"safety_zb_0053","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于触电救护的说法，错误的是（ ）。","options":["人触电以后，由于痉挛等原因不能自行摆脱电源，使触电者脱离电源是救护首要；","救护人必须使用适当的绝缘工具，以防自己触电；","应防止触电者脱离电源后可能的摔伤；","直接对伤者进行拖拽，及时施救。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》触电救护：『迅速脱离电源是救护首要』；『要使用绝缘工具让伤员脱离电源，注意摔伤等二次伤害』；轻症伤员平卧休息观察呼吸脉搏，重症昏迷伤员实施心肺复苏，并注意有无复合伤、骨折、颅脑、脊柱损伤等。『直接对伤者进行拖拽』既可能使救护人自身触电（触电者因痉挛不能自行摆脱电源，直接接触会导电），又可能造成摔伤等二次伤害，说法错误，故选D。【易混点】在户外雨天或高辐射区域等不便情况下，也不允许在工作完成前提前签署工作包文件——急救与记录都要按规范执行。"},{"id":"safety_zb_0054","module":"safety","bank":"保护区安全准入","type":"single","stem":"密闭空间内氧气的允许范围（ ）。","options":["15%-19%","19.5%-21%","17%-19.5%","23%-25%"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》有限空间作业：『工作期间，有限空间内氧气允许范围为19.5%-21%』；课件呼吸危害章节还说明氧含量降至12%时人会异常疲劳、判断力减退，降至10%时嘴唇发青、失去知觉——低于19.5%即有缺氧窒息风险，故选B。不选A：15%-19%低于允许下限，属缺氧；不选C：17%-19.5%大部分处于缺氧区；不选D：23%-25%氧含量过高，富氧环境有火灾风险。【易混点】进入有限空间必须『先通风、再检测、后作业』；注意有限空间专项培训课件以19.5%~23.5%为正常氧浓度范围，本准入工业安全课件明确允许范围为19.5%-21%，答题以官方答案为准。"},{"id":"safety_zb_0055","module":"safety","bank":"保护区安全准入","type":"single","stem":"如下哪处应设置作业隔离区（ ）。","options":["起重吊装作业现场","密闭空间作业密闭空间入口处","脚手架搭拆作业下方","以上全是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件：起重吊装作业时『与工作无关的人员禁止进入起重工作区域，吊装期间用警戒绳对作业区域进行隔离，并安排人员监督』（课件《工业安全》）；高处作业地点的下方应设立隔离区，不得在高处作业地点下面通行或逗留，脚手架搭拆作业下方同理（课件《高处作业》）；『在有限空间入口处建立作业隔离区，设置警示标识，防止未经授权人员与无关人员进入』（课件《有限空间》）。三处都应设置作业隔离区，故选D。【易混点】高处作业隔离区半径按作业高度h划分：2m≤h≤5m时半径为3m，高度越大半径越大；脚手架从搭设至拆除结束必须随时处于挂牌状态。"},{"id":"safety_zb_0056","module":"safety","bank":"保护区安全准入","type":"single","stem":"成人心肺复苏时胸外按压速率每分钟多少（ ）。","options":["40-60次","60-80次","80-100次","100-120次"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》心肺复苏：高质量胸外按压的要求为『提供足够深度的按压，5-6cm；提供足够速率的按压，100-120次/分；每次按压后让胸部恢复至正常位置（手掌根部始终紧贴胸骨）』，按压速率即每分钟100-120次，故选D。不选A/B/C：40-60次、60-80次、80-100次均低于要求的速率范围，按压过慢无法维持有效血液循环。【易混点】胸外按压与人工呼吸的比率为30:2；即便在人工呼吸时，按压中断的时间也尽量不超过10秒；心搏骤停抢救的『黄金时限』为4分钟，应及时取用AED快速除颤。"},{"id":"safety_zb_0057","module":"safety","bank":"保护区安全准入","type":"single","stem":"生产过程中的安全是指（ ）的状态。","options":["人不受到伤害","人不受伤害、设备和财产不受到损失","没有安全隐患","没有发生事故"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《工业安全》：安全是指『在生产过程中人不受到伤害，设备或财产不受到损失的状态』；安全的概念是相对的——做任何事都有风险，之所以还去做，是因为已经接受了这种风险，故选B。不选A：只讲人不受伤，遗漏了设备和财产不受损失；不选C：『没有安全隐患』过于绝对，安全是相对概念而非绝对无险；不选D：『没有发生事故』不等于安全，存在隐患未酿成事故时并非安全状态。【易混点】海因里希事故法则：死亡/重伤、轻伤、无伤害事故比例约为1:29:300；防止人的不安全行为、消除物的不安全状态，使因果连锁中断，即可防止伤害。"},{"id":"safety_zb_0058","module":"safety","bank":"保护区安全准入","type":"single","stem":"电器设备在发生火灾时不应该用（ ）灭火器灭火。","options":["卤代烷","干粉","泡沫","二氧化碳"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《消防保卫》灭火器适用范围：泡沫灭火器适用于一般B类火灾和A类火灾，但『不能扑救B类火灾中的水溶性可燃、易燃液体的火灾……也不能扑救带电设备等E类及C、D类火灾』——泡沫剂导电，用来扑救电气火灾会导致救火人员触电，故选C。不选A：卤代烷属洁净气体灭火器，适用于A、B、E类火灾，可用于带电火灾；不选B：干粉灭火器可扑救电气设备的初期火灾；不选D：二氧化碳灭火器适用于E类（带电燃烧）火灾。【易混点】家用电器发生火灾，在没有灭火器的情况下应先切断电源；CO2灭火器使用时防止冻伤和窒息；干粉灭火后要用水等降温防止复燃。"},{"id":"safety_zb_0059","module":"safety","bank":"保护区安全准入","type":"single","stem":"采取适当的措施，使燃烧因缺乏或断绝氧气而熄灭，这种方法称作（ ）。","options":["窒息灭火法","隔离灭火法","冷却灭火法","抑制灭火法"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《消防保卫》灭火原理及措施：窒息法是『降低着火区域氧气浓度』，措施如封闭着火空间、充惰性气体——采取适当措施使燃烧因缺乏或断绝氧气（助燃物）而熄灭，正是窒息灭火法，故选A。不选B：隔离法是使着火物与火源隔离，如转移/拆除可燃物、切断气源、保持防火间距；不选C：冷却法是降低燃烧物的温度，如用水喷射着火物；不选D：抑制法是中断燃烧的链式反应，如干粉灭火剂。【易混点】四种灭火法与燃烧三要素（可燃物、助燃物、点火源）对应：隔离法破坏可燃物，窒息法破坏助燃物，冷却法消除点火源/热量，抑制法中断链式反应。"},{"id":"safety_zb_0060","module":"safety","bank":"保护区安全准入","type":"single","stem":"燃烧三要素不包括（ ）。","options":["可燃物","助燃物（氧化剂）","烟气","点火源"],"answer":["C"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《消防保卫》：燃烧的必要条件（燃烧三要素）是可燃物、助燃物（氧化剂）和温度（引火源）——可燃物、助燃物、点火源三者缺一不可，而烟气是燃烧的产物，不是燃烧的必要条件，故选C。不选A/B/D：可燃物、助燃物、点火源正是燃烧三要素，任何火灾预防、扑救措施都与三要素相关。【易混点】防火措施的思路即破坏三要素：控制可燃物、隔绝空气控制助燃物、控制消除点火源、阻止火势蔓延（防火间距、防火门、分隔设施）；防火门必须保持常闭，未按要求关闭按一般违章处理。"},{"id":"safety_zb_0061","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项属于保卫的职责？（ ）","options":["控制重要区域的人员进入","分发通行证","控制电厂里的安全门","以上都是"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《消防保卫》《核素养（上）》：保卫部门负责核电厂实体保护（控制重要区域的人员进入、出入口警卫检查）、通行证件的办理分发（人员出入证、携物证、摄影摄像证）、控制电厂安全门，并负责消防管理监督、治安管理、厂区交通安全管理和保密工作。控制重要区域人员进入、分发通行证、控制安全门都属于保卫职责，故选D『以上都是』。【易混点】保卫区域分为管理区、控制区、保护区、要害区四级，进入各区域须持相应证件；严禁转借出入证件或尾随他人进出任何区域；人员出入厂区须逐级读卡出入。"},{"id":"safety_zb_0062","module":"safety","bank":"保护区安全准入","type":"single","stem":"灭火的最佳时期是火灾发生的（ ）。","options":["初期","旺盛期","衰退期"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《消防保卫》火灾四个阶段：火灾分为初期、发展、猛烈燃烧、熄灭四个阶段，课件明确『火灾扑救的最佳时期为初期』——初期燃烧面积小、温度低、烟气少，用灭火器、消火栓等简单手段即可扑灭，故选A。不选B：猛烈燃烧（旺盛）阶段火势已失控，扑救难度和危险性极大；不选C：衰退期火势虽减弱但损失已经造成，且存在复燃风险。【易混点】灭火器使用：距燃烧物5米左右，拔保险销、压压把，对准火焰根部左右摆动、由近而远推进灭火不留残火；使用前检查压力表指针在绿区。"},{"id":"safety_zb_0063","module":"safety","bank":"保护区安全准入","type":"single","stem":"面对火灾，以下哪项逃生方法是错误的（ ）？","options":["选择逃生通道自救","结绳下滑自救","向外界求救","乘坐电梯逃生"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《消防保卫》逃生自救：『发生火灾时，不要使用电梯』——火灾可能造成断电，电梯随时停运把人困在井道内，且电梯井如同烟囱，烟气极易侵入，乘坐电梯逃生是错误方法，故选D。不选A：按安全出口指示标志从安全通道逃生是首选方法；不选B：条件允许时可结绳下滑自救；不选C：无法及时逃生时退居室内、关闭门窗，向窗外伸出衣物或抛出小物件发出求救信号。【易混点】逃生时用湿毛巾捂住口鼻、弯腰或匍匐前进，防止吸入有毒气体（火灾中烟气伤害最大）；身上着火及时脱衣或就地打滚压灭；脱离火场后不要因任何原因返回火场。"},{"id":"safety_zb_0064","module":"safety","bank":"保护区安全准入","type":"single","stem":"A类火灾是指（ ）。","options":["固体火灾","气体火灾","液体火灾"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《消防保卫》火灾的分类：A类火灾指固体物质火灾；B类为液体和可熔化的固体物质火灾；C类为气体火灾；此外还有D类金属火灾、E类带电设备火灾、F类烹饪器具内的烹饪物火灾。A类火灾即固体火灾，故选A。不选B：气体火灾属C类；不选C：液体火灾属B类。【易混点】灭火器选用要对症：泡沫灭火器适用A、B类但不能救带电火灾；干粉、二氧化碳、洁净气体灭火器可用于扑救带电（E类）火灾；二氧化碳灭火器不能扑救钾、钠、镁等轻金属火灾。"},{"id":"safety_zb_0065","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假措施描述不正确的是：（ ）。","options":["制定质量计划责任人员及焊接、无损检验等关键工艺责任人员签字备案制度，必要时对签字真实性进行抽验是防造假的重点措施之一；","防控造假必须完善质量奖惩机制，制定举报人保护和奖励制度；","对于恶意违规、弄虚作假的员工要采用通报批评、经济处罚、下岗或解除劳动合同等方式进行惩处；","强化合同管控要求，震慑不良承包商和防控弄虚作假无关。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《质量保证》防控弄虚作假的措施，课件明确列有『强化合同管控要求，震慑不良承包商』——合同文本中必须明确供方承诺不提供假冒、欺诈和可疑物项的条款及弄虚作假的索赔条款。可见强化合同管控正是防造假的重要措施，D说它与防控弄虚作假『无关』，与课件相悖，故选D。不选A：签字备案制度、必要时对签字真实性抽验是课件所列措施；不选B：完善质量奖惩机制、制定举报人保护和奖励制度亦在措施之列；不选C：对恶意违规、弄虚作假员工通报批评、经济处罚、下岗或解除劳动合同也是课件原文。【易混点】其他防造假手段还有重点区域设摄像头、电子签/人脸识别/指纹验证防冒签、完善供方黑名单并及时向纪检部门通报。"},{"id":"safety_zb_0066","module":"safety","bank":"保护区安全准入","type":"single","stem":"影响质量的因素可概括为人、机、料、法、环、测六个方面，其中（ ）是最活跃的因素，也是最关键的因素之一。","options":["法；","机；","料；","人。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《质量保证》影响质量的六大因素（人、机、料、法、环、测）：『人是最活跃的因素，也是最关键的因素之一』——从事质量活动的人员应经培训、具备知识和技能、得到授权后才能工作，人的责任心也非常关键，故选D。不选A：法（规章制度）是被执行、受控的对象，工作必须程序先行；不选B：机（设备工具）须经试验评定、计量器具须在标定有效期内；不选C：料（备件材料）必须经检验、有合格证书，同属受控要素。【易混点】课件案例警示：未取得授权的见习辐射防护人员实施测量和去污，造成两人肢端剂量超标——人员必须授权后再从事相应工作。"},{"id":"safety_zb_0067","module":"safety","bank":"保护区安全准入","type":"single","stem":"以下哪项不属于采购不符合项的处理方案（ ）。","options":["修理；","返工；","不作改进的接收（照用）；","第三方检验。"],"answer":["D"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"课件未直接列举采购不符合项的处理方案清单，依据核质保通行做法：采购不符合项的处置是让物项满足规定要求或作出接受决定，通常包括返工（使物项完全符合原要求）、修理（恢复到可用状态）、不作改进的接收（照用，须经论证批准）等。第三方检验是采购方对供方物项质量的验证和监督手段，用于确认质量状态，本身不是对不符合物项的处置方案，故选D。不选A/B/C：修理、返工、照用都是处理不符合项的备选方案。【易混点】不符合项管理要求按程序报告（NCR）并做好标识或隔离，防止误用、误装；对已发现的问题隐瞒不报甚至造假掩饰，也被视为弄虚作假。"},{"id":"safety_zb_0068","module":"safety","bank":"保护区安全准入","type":"single","stem":"HAF003中质量保证的定义是：（ ）。","options":["担保质量；","为使物项或服务与规定的质量要求相符合并提供足够的置信度所必需的一系列有计划的系统化的活动；","全部检查、检验、审查活动；","质保部门使用的法规。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《质量保证》：HAF003《核电厂质量保证安全规定》对质量保证（QA）的定义是『为使物项或服务与规定的质量要求相符合并提供足够的置信度所必需的一系列有计划的系统化的活动』，与B选项逐字对应，故选B。不选A：『担保质量』只是字面理解，未体现『置信度』和『系统化的活动』；不选C：质保不等于检查检验，还包括组织、文件控制、设计控制、采购控制、培训等一系列有计划的活动；不选D：HAF003是核安全法规，适用于核设施营运单位及核安全相关物项和服务承包商，不是质保部门的内部工具。【易混点】HAF003具有强制性，实施受国家核安全局监督；置信度的来源：过程受控、独立验证、记录经得起历史考验。"},{"id":"safety_zb_0069","module":"safety","bank":"保护区安全准入","type":"single","stem":"关于防造假相关的知识描述不正确的是：（ ）。","options":["必须完善供方黑名单体系，并及时向本单位纪检部门通报；","在结果没有问题的情况下，文件代签问题不算弄虚作假；","必须加强弄虚作假防控宣贯和培训；","必须保留现场原始记录，原始记录保留期限要求需纳入合同条款中。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《质量保证》《核素养（上）》：弄虚作假的情形包括物项实体造假、工作过程造假、文件记录造假，典型行为包括伪造证书、伪造测量数据、伪造检验报告、仿冒他人签字等；课件案例中工前会记录单由他人代签即被认定为违规。文件代签（冒签）本身就是文件记录造假，无论结果有没有问题，性质都不变，B说法错误，故选B。不选A/C/D：完善供方黑名单并向纪检部门通报、加强防造假宣贯和培训、保留现场原始记录并将保留期限纳入合同条款，都是课件所列防控要求。【易混点】对已发现问题隐瞒不报甚至造假掩饰，也被视为弄虚作假；『两个零容忍』对弄虚作假零容忍。"},{"id":"safety_zb_0070","module":"safety","bank":"保护区安全准入","type":"single","stem":"请选出具有‘凡事有章可循’原则与特征的一项（ ）。","options":["领导表率作用；","程序/规程的要求必须清晰明确，具有可操作性；","建立组织的质量验证体系；","记录应妥善贮存、保管。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《质量保证》『四个凡事』之『凡事有章可循』的原则与特征表：建立适合自身任务的完整的程序文件体系，『程序/规程的要求必须清晰明确，具有可操作性』，对程序规程进行培训、一切按程序规定实施、程序变更受控、防止使用不适用的规程等。B正是表中原文，故选B。不选A：领导表率作用属于『凡事有人负责』中的领导作用；不选C：建立组织的质量验证体系属于『凡事有人验证』；不选D：记录应妥善贮存、保管属于『凡事有据可查』。【易混点】四个凡事：凡事有章可循、凡事有人负责、凡事有人验证、凡事有据可查；使用规程前应确认其为最新受控版本、无缺页且适用范围相符。"},{"id":"safety_zb_0071","module":"safety","bank":"保护区安全准入","type":"single","stem":"质量是：'客体的一组（ ）满足要求的程度'。","options":["特性；","固有特性；","赋予特性；","魅力特性。"],"answer":["B"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《质量保证》质量的定义（摘自《质量管理体系-基础和术语》ISO 9000:2015）：『客体的一组固有特性满足要求的程度』，关键词是『固有特性』——客体本身固有的、可区分的特征，故选B。不选A：仅说『特性』缺少『固有』限定；不选C：赋予特性是后天人为赋予的（如价格、交货期），不属于质量定义所指；不选D：『魅力特性』不是该定义的表述。【易混点】客体可以是活动或过程、产品、组织、体系、人或上述各项的组合；要求包括明示的、通常隐含的或必须履行的需求或期望；核电厂的产品是电力能源，质量体现在生产各环节符合规定的工作流程及要求。"},{"id":"safety_zb_0072","module":"safety","bank":"保护区安全准入","type":"single","stem":"有关不符合项，下列哪种说法是正确的：（ ）。","options":["不符合项控制有防止误用、误装不符合物项的作用；","不符合项控制是为了执行奖惩制度，追究活动从事者的责任；","导致物项或过程的质量不能确定的缺陷，不属于不符合项；","以上说法都不对。"],"answer":["A"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《质量保证》：不符合项是『性能、文件或程序方面的缺陷，因而使某一物项的质量变得不可接受或不能确定』；发生不符合项时按程序报告（NCR）并做好标识或隔离——标识、隔离的目的正是防止误用、误装不符合物项，A正确。不选B：不符合项控制是质量保证制度，不是奖惩追责工具；不选C：课件明确质量『变得不可接受或不能确定』的缺陷都属于不符合项，C与课件相反；不选D：A正确故D不成立。【易混点】生产运行中的质量缺陷经工作票或QDR处理后仍不能满足原设计要求或验收准则的，应作为NCR管理；供方制造过程的缺陷作为采购不符合项管理。"},{"id":"safety_zb_0073","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对于熟悉的任务，工作人员可凭记忆执行完后再一并在执行步骤前打勾。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》使用和遵守程序：程序执行中『在步骤执行前，在该步骤相应位置画圆圈，阅读并理解该步骤之后，执行操作，操作完成后，在该步骤圆圈上画杠』——即先画圈、执行、后画杠，逐步确认，防止跳步漏步；课件《质量保证》也要求记录不允许在事后凭记忆填写。对熟悉的任务凭记忆执行完再一并对多个步骤打勾，属于自欺式确认，起不到逐步把关、防止人因失误的作用，故说法错误。易被误导处：以为『任务熟悉』就可以简化程序使用——自满、认为例行或简单恰恰是课件列出的失误先兆和应避免的风险行为。【易混点】程序使用分连续使用、参照使用、记忆使用三级，运行操作三步以上的工作均需连续使用程序。"},{"id":"safety_zb_0074","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用自检工具时，如果由于其他事情中断执行且手不再接触或指向设备，当恢复执行时应重新使用自检工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》自检基本原则：『自检是一种连续的动作序列，如果这一序列被打断，例如有人向你询问问题等，则要求重新开始执行』；应避免的危险行为中也包括『如果视线离开操作对象或中止工作后重新开始工作时，没有再次进行自我检查』。中断执行且手不再接触或指向设备后，恢复执行必须重新使用自检工具，故说法正确。易被误导处：以为『刚才已经自检过、接着做就行』——被打断后注意力已经分散，恢复执行时最容易拿错设备、走错间隔，此时重新自检正是防线。【易混点】自检四步骤：停、思、行、审；『行』时手指口述，大声说出设备名称（编号）和操作内容并与程序核对。"},{"id":"safety_zb_0075","module":"safety","bank":"保护区安全准入","type":"judge","stem":"质疑的态度可以增强对不确定性及危险的认识，最大限度地减少失误的可能。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》『秉持质疑的态度』原则：『对当前的各种状态、假设、异常和活动始终保持质疑的态度，避免可能导致的错误和不当行为。每个人都对不利于电厂安全的假设、价值观、状态或行为保持警觉』。质疑的态度可以增强对不确定性及危险的认识，最大限度地减少失误的可能，说法正确。易被误导处：把『质疑』误解为不信任同事或事事抬杠——质疑针对的是异常状态和不确定情况，发现异常先核实、再行动。【易混点】质疑的态度常与『不确定时暂停』配合使用：遇到疑问先停下工作、将设备置于安全状态，澄清后再继续；忽视他人的担心和质疑是应避免的情况。"},{"id":"safety_zb_0076","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当独自一人执行任务的时候，使用自检工具时只需在心中默读出设备的标识即可。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》练习题原文判定：『当独自一人执行任务的时候，使用自检工具时只需在心中默读出设备的标识即可（错）』。自检『行』的要求是手指口述——手指设备标牌、（轻声）读出操作对象的名称（编号）和操作内容，出声口述能强化注意力、强化确认过程，只在心中默读达不到强化效果，故说法错误。易被误导处：以为周围无人、无人听见就不必出声——口述首先是说给自己听的，是自检正式性和有效性的体现。【易混点】在没有实体操作（如头脑思考）的工作中同样应使用自检，并认同其可以有效避免失误；自检必须以高度严谨的态度执行。"},{"id":"safety_zb_0077","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工作中所使用的规程都是经过精心编写，且经过校对、审核和批准，因此内容是完全正确的。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》使用和遵守程序『应避免的风险行为』，其中明确列有『认为程序经过精心编写，内容完全正确』。规程虽然经过校对、审核和批准，仍可能存在技术错误或与现场实际不符，使用条件要求『按执行程序操作时带着质疑的态度去判断程序是否能满足工作要求』，发现问题应停止执行、将设备置于安全状态并汇报，故说法错误。易被误导处：把『程序经过严格审批』等同于『程序绝对正确』——这种盲目相信正是防人因失误要克服的思维定势。【易混点】发现程序错误或无法执行时，应暂停工作并通过状态报告等正式流程反馈升版程序，不得擅自偏离或凭经验处置。"},{"id":"safety_zb_0078","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在使用监护工具时，监护人必须对执行人的行动全程观察，并对正确和错误的行动给予回应。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》监护基本原则原文：『监护人必须对执行人的行动全程观察，并对正确和错误的行动给予回应』。使用方法中，监护人核对操作人口诵指令及指向设备与程序一致后回答『正确，请执行』，发现操作与预期不一致则及时制止，故说法正确。易被误导处：以为监护人只要『在场』就算监护——课件列出的应避免风险行为包括『监护人没有全程对操作人的动作进行观察』『操作人执行速度过快以致监护人没有机会进行干预』。【易混点】执行人和监护人都必须对设备分别进行自检；监护人授权通常应等同或高于执行人；意见未达成一致操作人就开始操作也是应避免的风险行为。"},{"id":"safety_zb_0079","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在任何活动中都必须严格按照反映电厂设计基准的规程来行动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》使用和遵守程序的定义：『在任何活动中必须严格按照反映电厂设计基准的电厂适用规程来行动。该类文件包括规程、政策、工作包/说明、工作单等』。程序是防止人因失误最基本的一道屏障，按程序行动可以避开潜在的人因失误陷阱，故说法正确。易被误导处：认为简单、熟悉的操作可以不按程序——课件要求根据程序执行的级别（连续使用、参照使用、记忆使用）使用程序，运行操作三步以上的工作均需连续使用程序，跳步、漏步是应避免的风险行为。【易混点】程序执行中响应与程序描述不一致时：不影响后续步骤的画叉并记录，影响后续步骤的则暂停操作、将系统设备置于安全状态并及时汇报。"},{"id":"safety_zb_0080","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在执行规程时，可以根据经验偏离规程。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》使用和遵守程序：『除非程序中有明确说明，否则应该严格按照程序规定的顺序执行，不能跳步、漏步』；基本原则要求『当程序错误或达不到预期目的时停止执行，采取行动把电站置于安全状态』。凭经验偏离规程属于违规操作，是『两个零容忍』的对象之一，故说法错误。易被误导处：以『经验更有效』『规程不适用』为由自作主张——课件《质量保证》案例中，维修人员因规定润滑脂缺货而凭经验改用石油基润滑脂，导致阀门关闭时间超标。【易混点】认为规程有问题时的正确做法：停下工作、将设备置于安全状态、汇报，办理经批准的修订变更手续后方可实施，严禁擅改规程步骤。"},{"id":"safety_zb_0081","module":"safety","bank":"保护区安全准入","type":"judge","stem":"无论是操作设备，还是记录结果，所有工作中都应该优先使用自检这一工具。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》自检使用条件原文：『无论是操作设备还是记录结果，所有工作中都应该优先使用STAR工具！』课件同时指出『所有活动中都必须使用自检』『自检通常是预防人因失误的最后一道屏障』，故说法正确。易被误导处：以为只有操作设备才需要自检——记录结果、填写文件同样可能出错（写错数值、漏填漏签），也应用停、思、行、审把关，课件《质量保证》明确记录不允许事后凭记忆补填。【易混点】自检主要用于设备识别和设备操作；工前会、三向交流、监护、独立验证等工具按任务风险和性质配合使用。"},{"id":"safety_zb_0082","module":"safety","bank":"保护区安全准入","type":"judge","stem":"2分钟检查是刚到达工作现场时对现场仔细的审查（不实际进行操作），帮助工作人员准确获悉关键指示、系统和设备的工况、工作环境、危险。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》2分钟检查：指工作人员在到达现场后、即将开始工作前，对现场环境及周边可能潜在的风险进行检查确认（不实际进行操作），目的是提高情景意识，帮助工作人员准确获悉关键指示、系统和设备的工况、工作环境、危险。题干与课件定义一致，说法正确。易被误导处：把2分钟检查当走形式——课件列出的应避免行为包括『没有花时间察看工作现场，匆忙开工』『认为常规或简单意味着无风险』。【易混点】检查着重确认：正确的机组/系统/设备、有无工业安全与辐射风险、有无停机停堆敏感设备、现场与程序及工前会预期是否一致；长时间中断后应再次进行。"},{"id":"safety_zb_0083","module":"safety","bank":"保护区安全准入","type":"judge","stem":"所有需要汲取经验教训或发生异常的工作都需要召开工后会。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》工后会使用条件原文：『所有需要汲取经验教训或发生异常的工作都需要召开工后会』，尤其包括：工作过程中出现没有考虑到的异常或意外情况、非常规工作任务（三个月及以上才执行一次）、复杂工作任务（需三个及以上工作组紧密配合）、参与者认为需要召开的作业。题干与课件一致，说法正确。易被误导处：以为『工作顺利结束』就不用开会——顺利工作中同样存在值得总结的良好实践和有待改进的方面。【易混点】工后会应『在工作完成后立即召开』，由工作负责人主持、采用对话讨论形式，以总结经验、改进绩效为目的而不追究责任，纠正行动满足SMART原则。"},{"id":"safety_zb_0084","module":"safety","bank":"保护区安全准入","type":"judge","stem":"切尔诺贝利事故充分表明，核电厂发生的任何问题在某种程度上都源于人为错误，然而人的智慧在查出和消除潜在问题方面是十分有效的，必须突出强调人的因素在运行安全中的关键作用。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》引INSAG-4《安全文化》：『除了所谓上帝的旨意这种不可抗拒力以外，核电厂发生的任何问题在某种程度上都来源于人为的错误』；课件同时强调人的智慧在查出和消除潜在问题方面十分有效，必须突出强调人的因素在运行安全中的关键作用。题干正是这一论断，说法正确。易被误导处：由此推出『只要具备技能和授权就可动手操作』——还必须按规程行动并使用防人因失误工具，程序是最基本的屏障。【易混点】三哩岛和切尔诺贝利事故的共同教训是人因问题特别重要、要重视培育安全文化；事故后分别催生了INPO（美国）和WANO（世界范围经验共享）。"},{"id":"safety_zb_0085","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂程序全都经过了严格的审批流程，执行程序操作时不需要带着质疑的态度去判断程序是否能满足工作要求。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》使用和遵守程序使用条件：『按执行程序操作时带着质疑的态度去判断程序是否能满足工作要求』。程序虽然经过严格审批，仍可能与现场实际不符或存在错误，执行中保持质疑才能及时发现并停止、汇报，故『不需要带着质疑的态度』的说法错误。易被误导处：把程序的权威性绝对化——课件在应避免的风险行为中明确列有『认为程序经过精心编写，内容完全正确』，盲目相信程序与不使用程序同样危险。【易混点】执行程序前还要确认：程序是最新受控版本、无缺页（特别是最后一页）、适用范围与先决条件适合当前操作。"},{"id":"safety_zb_0086","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用不确定时暂停工具可以使失误的可能性大大降低。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》不确定时暂停的目的原文：『如果工作人员在执行任务时，处于疑惑或不确定状态，出错可能性会大大增加。不确定时暂停工具可以帮助工作人员解决不确定性，消除疑惑，恢复工作状态，从而使失误的可能性大大降低』；课件练习题同样判定该说法为『对』。说法正确。易被误导处：担心暂停会被认为能力不足或影响进度而不敢停工——课件强调当任何人对于工作出现不确定的情况时，都有责任和权利停止工作。【易混点】暂停四步：大声说出『暂停』并解释原因→将设备或系统置于安全状态→独立思考或联系主管、向有经验人员寻求支持→问题全部解决后大声陈述『工作继续』。"},{"id":"safety_zb_0087","module":"safety","bank":"保护区安全准入","type":"judge","stem":"人的因素是绝对重要的因素。因此，只要具备必要的技能和授权就可动手操作。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：使用和遵守程序的基本原则要求『务必满足程序要求所需的资格、必备知识和技能』，且『在任何活动中必须严格按照反映电厂设计基准的电厂适用规程来行动』——程序是防止人因失误最基本的一道屏障。仅有技能和授权还不够，还必须按规程执行、并配合自检等防人因失误工具才能操作，故说法错误。易被误导处：把『人的因素绝对重要』曲解为『人比程序可靠』——课件指出人是容易犯错误的，即使最优秀的人也会犯错，技能不能替代屏障。【易混点】监护、独立验证中验证人/监护人授权应不低于执行人，但所有操作仍以程序为依据；超出授权范围工作是『凡事有人负责』明令禁止的。"},{"id":"safety_zb_0088","module":"safety","bank":"保护区安全准入","type":"judge","stem":"口头交换信息，尤其是面对面交谈过程中存在很大误解的风险，因此需要使用三向交流。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》三向交流：『人与人在交流过程中，很容易将交流口语化，采用非正式（随意）的交流，容易造成信息的曲解』；课件练习题判定『口头交换信息，尤其是面对面交谈过程中存在很大误解的风险，因此需要使用三向交流』为『对』。通过发送、复述、确认三个步骤可确保信息准确传输，说法正确。易被误导处：以为『当面说清楚就不会错』——课件案例中操纵员说『赶快撤』被取样人员误听为『赶快测』，造成人员意外受照。【易混点】并非任何操作都必须使用三向交流：在非关键信息传递时过度使用三向交流同样是应避免的风险行为；一对一交流、保持三个步骤完整是其基本原则。"},{"id":"safety_zb_0089","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会是为了让工作组成员清楚地理解任务目标、工作范围、工作风险、安全要点、防护措施、应急预案，保证有效完成工作或任务的一项活动。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》工前会定义：『在执行一项工作或任务前，相关工作人员之间进行的面对面的准备会，以便清楚地理解任务目标、工作范围、工作风险、安全要点、防护措施、应急预案的活动，保证有效完成工作或任务』。题干与定义一致，说法正确。易被误导处：把工前会当走过场——课件指出应避免『机械式讨论清单每一项』『一人唱独角戏，缺少互动讨论』。【易混点】工前会遵循SAFER原则：综述（识别关键步骤）、预测（易错情景）、预计（失误后果）、评估（工具与屏障）、审查（回顾运行经验）；时间尽量接近活动实际开始时间并避开交接班。"},{"id":"safety_zb_0090","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工前会和工后会地点都应选在不被其他事情干扰的地方。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《防人因失误》：工前会召开形式要求『地点：不被其它事情干扰的地方』；工后会使用方法中同样要求『地点要求：不被其他事情干扰的地方』。工前会和工后会的地点都应选在不被其他事情干扰的地方，说法正确。易被误导处：为图方便在通道、嘈杂区域或工作现场随手开会——人员注意力被分散，任务交底和经验总结都会打折扣，课件也把『讨论问题时注意力分散』列为应避免的危险活动。【易混点】工前会时间应尽量接近活动的实际开始时间、选在不容易被打扰的时段；工后会应『在工作完成后立即召开』，由工作负责人主持、主要参与者都参加。"},{"id":"safety_zb_0091","module":"safety","bank":"保护区安全准入","type":"judge","stem":"状态报告是电厂报告问题、跟踪问题解决的重要工具，任何人都可以通过状态报告反馈问题（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》问题报告流程：『大多数问题可以通过提状态报告（CR）的方式解决，大部分电厂都建有自己的状态报告信息系统；如有疑问可以先咨询你的主管。对于通过正常渠道没有解决的问题，你有权继续跟踪』。状态报告是电厂报告问题、跟踪问题解决的重要工具，任何人都可以通过状态报告反馈问题，说法正确。易被误导处：以为只有管理者或专职部门才能提状态报告——组织鼓励并重视每个人及时、主动地识别和报告问题。【易混点】阀门位置不对、使用过期程序、消防屏障被破坏等隐患都应报告；对正常渠道未解决的问题，个人有权继续跟踪。"},{"id":"safety_zb_0092","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，赶紧发个微信朋友圈，拍个短视频，正是吸引流量的好时机。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》应急信息发布：『电站安排专人向上级单位及地方政府提供新闻通稿及事故信息，并回答关于电站情况的相关问题』，应急信息的对外发布由专人统一归口；课件还提醒家庭成员都不应私自向电站打电话询问，以免影响应急通讯。应急状态下发微信朋友圈、拍短视频传播现场信息，既可能引发谣言和社会恐慌、泄露电厂敏感信息，又分散自身执行应急行动的精力，与应急要求相悖，说法错误。易被误导处：以为个人发布『不算什么』——应急期间虚假或片面信息的社会影响极大，信息发布是公众信息组的职责。【易混点】应急状态下个人应做的是：将设备和工作置于安全状态，按广播指令隐蔽、撤离或服碘，按指示到达集合点或疏散地。"},{"id":"safety_zb_0093","module":"safety","bank":"保护区安全准入","type":"judge","stem":"任何含有衰变原子并且具有放射性（释放辐射）的物质都叫做放射性物质。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》理解辐射：『原子本身可能是稳定的或是不稳定的，不稳定的原子会以释放电磁波或者粒子的方式释放能量，原子的这种特性称为放射性。具有放射性的物质，称为放射性物质』；辐射是放射性物质衰变过程中随粒子或光子产生的能量。含有衰变原子并具有放射性（释放辐射）的物质就是放射性物质，题干与课件一致，说法正确。易被误导处：以为放射性物质都很罕见——天然放射性物质遍布环境，宇宙射线、地壳中的放射性核素、食物（牛奶、鱼、蔬菜等）都有放射性。【易混点】当放射性物质位置失控时将产生污染，其释放的辐射将不再受控，可能导致人员受照剂量不可追踪；火炉比喻：放射性衰变停止时，放射性物质就不再产生辐射。"},{"id":"safety_zb_0094","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当身体或者任何特定器官遭到辐射照射时，接受的辐射量称为剂量。常用测量单位为希沃特（Sv）或毫希沃特（mSv）。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》辐射测量原文：『当身体或者任何特定器官遭到辐射照射时，接受的辐射量称为剂量。常用测量单位为希沃特（Sv）、毫希沃特（mSv）、微希沃特（μSv），1Sv=1000mSv，1mSv=1000μSv』。题干与课件一致，说法正确。易被误导处：把剂量与放射性活度单位（贝克勒尔Bq，如食物比活度）混淆——剂量衡量的是人体接受辐射照射的量。【易混点】近年国内核电厂工作人员每年人均有效剂量小于2mSv，远低于放射工作人员基本限值20mSv；剂量管理遵循ALARA（合理可行尽量低）原则；职业剂量由TLD和EPD监测记录。"},{"id":"safety_zb_0095","module":"safety","bank":"保护区安全准入","type":"judge","stem":"疲劳引起注意力不集中、警觉性下降将会引发人的不安全行为。 （）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》疲劳的影响原文：『疲劳引起注意力不集中、警觉性下降将会引发人的不安全行为。所以在疲劳时不仅降低工作效率，而且容易引发事故』。题干与课件一致，说法正确。易被误导处：以为疲劳『扛一扛就过去了』——疲劳还伴随失眠、视物模糊、耳鸣、情绪不稳、反应迟钝等表现，是岗位适任性下降的信号，应主动调整或报告。【易混点】疲劳的缓解措施：合理膳食、适量运动、改善睡眠、心理建设；个人的工作适任性存在疑问时应暂停工作，确定可以安全完成任务时再返回工作。"},{"id":"safety_zb_0096","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂二回路给水在蒸汽发生器中被加热转化为蒸汽，推动汽轮发电机组发电。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》压水堆核电厂发电流程原文：『二回路给水在蒸汽发生器内被一回路冷却剂加热成为饱和蒸汽，蒸汽推动汽轮发电机组转动发电，输送至电网；完成做功的蒸汽在凝汽器内被冷凝成水，重新输送至蒸汽发生器』。题干与课件一致，说法正确。易被误导处：以为是一回路的高温高压水直接推动汽轮机——一、二回路通过蒸汽发生器间接传热、互不混合，直接进入汽轮机的是二回路饱和蒸汽。【易混点】核电厂发电的基本原理是核能转变为热能、再转变为机械能/电能；对于沿海核电站，大海是最终热阱；二回路采用的工质是水和水蒸汽。"},{"id":"safety_zb_0097","module":"safety","bank":"保护区安全准入","type":"judge","stem":"公司领导不希望员工可以自由地提出意见，因为害怕负面的后果。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》员工关心的问题：『中国核电鼓励员工自由地提出意见，每个人都有权跟踪自己关心的问题，不应受到胁迫、歧视或纪律处罚』；『营造和谐的氛围』原则也要求重视员工提出的建议和关注事项，提供适宜的工作环境。公司领导不希望员工自由提出意见、害怕负面后果，与核安全文化要求背道而驰，说法错误。易被误导处：以为提出『坏消息』会受罚而不敢报告——组织鼓励并重视主动报告问题的行为，员工可秘密或匿名提出健康安全、核安全、质量、电站绩效等方面的问题。【易混点】沟通渠道包括状态报告、快速经反简报、工作邮件、例会、总经理接待日、职代会提案、核与辐射监督站公开信箱（接受举报）等。"},{"id":"safety_zb_0098","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每位员工都有责任向电厂管理者报告可能会影响电站正常运转的蓄意破坏或干预事件。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》蓄意破坏章节原文：『每位员工都有责任向电厂管理者报告可能会影响电站正常运转的蓄意破坏或干预事件』。题干与课件一致，说法正确。易被误导处：以为防蓄意破坏只是保卫部门的事——课件列举的可疑场景（断路器或阀门在线错误、被剪断的电线电缆、机械装置或容器里的异物、管线上的异常开口或破洞、具有安全或安保功能设备的损坏）需要每位员工留意和报告。【易混点】报告安全隐患问题同样是每一位员工的责任，如操作把手丢失、梯子破损、走廊上纠缠的绳索、被故意卡在开位的防火门等；发现他人异常行为不要正面对抗，应马上向管理人员或保卫人员报告。"},{"id":"safety_zb_0099","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一般工业固体废物应统一收集后放入指定存放地点统一处理，不能随意丢弃。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》一般工业固体废物和危险废物：一般工业固体废物指未列入《国家危险废物名录》或经判定不具有危险特性的工业固废，如废金属、废保温材料等，课件原文明确『此类废物应统一收集后放入指定存放地点统一处理，不能随意丢弃』。题干与课件一致，说法正确。易被误导处：以为一般固废『不危险』就可以随手丢弃——随意丢弃同样污染环境、违反环保制度；工作结束还应做到工完料尽场地清。【易混点】危险废物（含汞荧光灯、废旧电池、润滑油/脂、玻璃胶、油漆桶等）具有腐蚀性、毒性、易燃性等危险特性，必须由专业对口部门统一管理和报废，不能随意处理；塑胶管、擦拭纸、保温棉等属不可回收的一般工业固废。"},{"id":"safety_zb_0100","module":"safety","bank":"保护区安全准入","type":"judge","stem":"重要邮件建议加密存储。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（下）》员工网络安全行为原文：『切勿点击陌生邮件的附件或连接，删除与业务无关的邮件。重要邮件建议加密存储。通过其他方式（如电话）确认对方身份。不点击陌生文件，对接收的文件进行病毒查杀』。题干『重要邮件建议加密存储』正是课件原句，说法正确。易被误导处：以为公司内网邮件绝对安全——网络钓鱼、恶意附件仍可能混入，收到无法判断来源的电子邮件或文件时应提高警惕、病毒查杀并核实对方身份。【易混点】其他网络安全要求：账号口令不少于12位、大小写字母+数字+特殊符号组合、不使用常见单词和用户名并定期更改；离开终端前及时锁屏（Win+L）；严禁在生产网/管理网计算机上使用U盘等移动存储介质。"},{"id":"safety_zb_0101","module":"safety","bank":"保护区安全准入","type":"judge","stem":"'两个零容忍'指的是对'对违规操作零容忍'，和'对弄虚作假零容忍'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》『两个零容忍』：对弄虚作假『零容忍』、对违规操作『零容忍』。题干表述与之完全一致，说法正确。易被误导处：把两个零容忍的内容记混或只记一半——既包括违规操作（违章操作，违反规章制度进行操作），也包括弄虚作假（造假），二者缺一不可。【易混点】弄虚作假的情形包括物项实体造假、工作过程造假、文件记录造假（伪造证书、伪造测量数据、伪造检验报告、仿冒他人签字等）；对已发现问题隐瞒不报甚至造假掩饰也被视为弄虚作假；触犯者将面临经济考核、重新基本安全培训、清退出厂、纳入黑名单等处理，构成犯罪的依法追究刑事责任。"},{"id":"safety_zb_0102","module":"safety","bank":"保护区安全准入","type":"judge","stem":"辐射防护标志用于警告工作人员放射性危险的位置，这可以防止员工因意外情况暴露于辐射或放射性物质中。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》现场工作要求原文：『辐射防护标志用于警告工作人员放射性危险的位置，防止员工因意外情况暴露于辐射或放射性污染中。这些标志带有醒目的三叶辐射符号，看到这类标志意味着可能存在的辐射危害，这个区域被称为辐射控制区』。题干与课件一致，说法正确。易被误导处：以为只有常设放射区才有危险——课件提醒，一些通常不被列为放射区的区域，在特殊行动期间可能会被列为放射区，要注意周围环境。【易混点】未经辐射工作培训不得进入辐射管制区域从事相关工作（包括跨越边界取回工具、移除辐射标志、在辐射标记的管道上工作等）；在辐射控制区外发现未受控或可疑的放射性物质，应立即向RP人员报告。"},{"id":"safety_zb_0103","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当今在核电技术日趋成熟的基础上，在实施纵深防御措施和严格管理的前提下，核电厂发生严重事故的概率极小。但是，即使采取了多种防范措施和控制手段，依然不能完全排除放射性会对公众和环境造成重大影响的事故发生。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"依据课件《核素养（上）》练习题原文及答案：当今核电技术日趋成熟，在实施纵深防御和严格管理的前提下，严重事故概率极小，但即使采取多种防范措施和控制手段，依然不能完全排除放射性对公众和环境造成重大影响的事故发生——判定为『对』。题干与课件一致，说法正确。易被误导处：由此走向另一极端，认为『技术进步就不会出大事故』——同课件练习题明确判定此类说法为错，三哩岛（5级）、切尔诺贝利和福岛（7级）事故即为明证。【易混点】正因如此，核电厂必须保持应急准备：制定应急预案、划分四种应急状态、定期开展应急演习，坚持纵深防御并持续培育核安全文化。"},{"id":"safety_zb_0104","module":"safety","bank":"保护区安全准入","type":"judge","stem":"应急状态下，电站已经指派专人向公众和新闻媒体传达信息。此人负责回答来自外部的关于电站情况的相关问题。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。应急状态下由电站指派的发言人统一对外传达信息，员工不得擅自对外发布。"},{"id":"safety_zb_0105","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一些通常不被列为辐射控制区区的区域，在特殊行动期间可能会被列为辐射控制区。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。特殊行动期间，平时非辐射控制区的区域可能临时划为辐射控制区。"},{"id":"safety_zb_0106","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当放射性物质位置失控时，就会增大污染风险，辐射释放将不再受控。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。放射性物质失控会增大污染风险，辐射释放将不再受控。"},{"id":"safety_zb_0107","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电厂员工有责任根据电厂程序报告潜在的问题，保证问题及时的审查和修正。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.员工有责任按程序报告潜在问题，保证问题及时审查和纠正。"},{"id":"safety_zb_0108","module":"safety","bank":"保护区安全准入","type":"judge","stem":"秦山核电站是我国大陆第一座投入运行的核电站，被誉为'国之光荣'。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。秦山核电站是我国大陆第一座投运的核电站，被誉为\"国之光荣\"。"},{"id":"safety_zb_0109","module":"safety","bank":"保护区安全准入","type":"judge","stem":"可以直接移走防异物装置，移走之前无需检查防异物装置周围区域。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。移走防异物装置前必须检查装置周围区域，确认无异物遗留。"},{"id":"safety_zb_0110","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电工作风险高于其他工业风险。（）","options":null,"answer":["错误"],"score
