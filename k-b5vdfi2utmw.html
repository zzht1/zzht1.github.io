5.6"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第15页：水的离解是吸热过程，离子积Kw随温度升高而增大，中性pH随之下降，课件明确“当温度达到300℃时，其中性pH值仅为5.6”，故选C。不选A(6.5)：接近60℃时的中性pH（6.54）；不选B(7.5)：7只是25℃常温下的中性值，高温下早已不成立。【易混点】高温水pH<7只是表观“酸性”，[H+]与[OH-]仍相等，不能据此判断高温纯水腐蚀性强。"},{"id":"basics_wc_0006","module":"basics","bank":"水化学","type":"single","stem":"轻水的酸碱性根据pH大小分＜7酸性、=7中性、＞7碱性，对于重水来说，测得pH=7时为______。","options":["酸性","碱性","中性"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第15页：重水的离解程度比轻水低，中性pD值大于7。因此当测得pH（pD）=7时已低于重水的中性点，氢离子相对偏多，重水呈酸性，故选A。不选B(碱性)：碱性须pD高于重水中性值才行；不选C(中性)：把轻水“=7中性”的判据直接套用到重水，正是本题陷阱。【易混点】用轻水溶液校正的pH计测重水酸度，所得读数应标记为pHA，与pD有差异。"},{"id":"basics_wc_0007","module":"basics","bank":"水化学","type":"single","stem":"在核电厂一、二回路中，各设备之间的关联和能量传递主要依靠______的流动和循环。","options":["气体","水","燃料"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第23页：“水对于核电厂来说就相当于人身体中血液，起到能量的传递作用”——一回路靠水把堆芯热量带到蒸汽发生器，二回路的水（汽）推动汽轮机做功，乏汽再由海水冷却凝结，各设备间的关联和能量传递全靠水的流动与循环，故选B。不选A(气体)：核电厂传热介质不是气体；不选C(燃料)：燃料是能量来源而非传递介质。【易混点】正因为水承担能量传递，水质控制才直接关系设备腐蚀与辐射场水平。"},{"id":"basics_wc_0008","module":"basics","bank":"水化学","type":"single","stem":"在原水预处理使用的混凝剂主要有铁盐、铝盐和无机高分子混凝剂，其中水处理效果较好普遍使用的混凝剂是______。","options":["硫酸铝","三氯化铁","聚合氯化铝"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第27页，常用混凝剂分铝盐（硫酸铝等）、铁盐（三氯化铁等）和无机高分子混凝剂三类，聚合氯化铝（PAC）即属无机高分子混凝剂，水解形成的多核羟基络合物架桥吸附能力强、矾花大而密实，处理效果好、应用普遍，故选C。不选A(硫酸铝)：普通铝盐，混凝能力弱于高分子型；不选B(三氯化铁)：铁盐腐蚀性强、使水带色，也不及PAC。【易混点】聚丙烯酰胺（PAM）属有机化合物类，作助凝剂起吸附架桥作用，不单独作混凝剂。"},{"id":"basics_wc_0009","module":"basics","bank":"水化学","type":"single","stem":"在金属腐蚀类型中，危害性最大的是______。","options":["电化学腐蚀","化学腐蚀","物理腐蚀"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第42~43页：化学腐蚀一般是均匀腐蚀，表面生成致密氧化膜还可保护下层金属（钝化即利用此理）；而电化学腐蚀由腐蚀微电池驱动，“一般为局部腐蚀，金属结构遭破坏”，课件并强调“局部腐蚀比均匀腐蚀危害更大”，故危害性最大的是电化学腐蚀，选A。不选B(化学腐蚀)：多为均匀腐蚀，危害相对轻；不选C(物理腐蚀)：单纯物理溶解，核电水环境中少见。【易混点】点蚀、缝隙腐蚀、晶间腐蚀等局部腐蚀本质上都是电化学腐蚀。"},{"id":"basics_wc_0010","module":"basics","bank":"水化学","type":"single","stem":"在核电厂一回路系统中，其放射性物质通过水及其中杂质的活化、裂变产物的释放、腐蚀产物的活化和化学添加物的活化等途径持续不断产生，为了控制系统中的核素活度维持在较低水平，通常采用______方式进行处理。","options":["滤芯过滤","树脂离子交换","膜分离技术"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第68~69页：下泄流顺次通过前置过滤器、离子交换树脂床净化，混合离子交换器“用于去除可溶性裂变产物和腐蚀产物，该净化床能有效除去冷却剂中的大多数核素”，一天内冷却剂可得到1~2次净化，故控制一回路核素活度的常规方式是树脂离子交换，选B。不选A(滤芯过滤)：前置过滤器只除去悬浮腐蚀产物和胶体颗粒，除不掉溶解态核素；不选C(膜分离技术)：不是一回路放射性控制的常规手段。【易混点】净化混床对137Cs的去除效果稍差。"},{"id":"basics_wc_0011","module":"basics","bank":"水化学","type":"single","stem":"二回路系统中关键设备众多，但最重要的设备是______，是放射性介质与非放介质的隔离边界，是二回路水化学控制的重点，水化学控制更多的是围绕它来进行。","options":["蒸汽发生器","汽轮发电机","凝汽器"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第86页：“保护蒸汽发生器传热管完整性为选择二回路水化学参数的关键考虑因素”。SG传热管是一回路放射性冷却剂与二回路非放介质的换热交界面，传热管一旦破损放射性即漏入二回路，故二回路水化学控制重点围绕蒸汽发生器进行，选A。不选B(汽轮发电机)：常规岛设备，不接触放射性介质；不选C(凝汽器)：只负责冷凝乏汽，不是放射性隔离边界。【易混点】凝汽器泄漏才是二回路水质的主要威胁，故需在线阳电导表和钠表监测。"},{"id":"basics_wc_0012","module":"basics","bank":"水化学","type":"single","stem":"为保证进入蒸汽发生器的给水中溶解氧小于5ppb，二回路采用了凝汽器真空除氧、除氧器热力除氧和添加______化学除氧来达到。","options":["联氨","乙醇胺","吗啉"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第87~88页：二回路全挥发处理中“向二回路系统添加联氨来控制二回路系统中的溶解氧并形成还原性环境”，联氨与氧反应（N2H4+O2→2H2O+2N2↑）不增加水中固形物，配合凝汽器真空除氧、除氧器热力除氧，即可使给水溶解氧小于5ppb，故选A。不选B(乙醇胺)、C(吗啉)：两者都是pH碱化剂，用于调节给水pH，不是除氧剂。【易混点】联氨110℃以上会热分解生成氨，除氧主要在较低温度区段完成。"},{"id":"basics_wc_0013","module":"basics","bank":"水化学","type":"single","stem":"核电厂系统中常用的联氨原材料的检测，通常可采用         来测定。","options":["光谱分析法","色谱分析法","氧化还原滴定法"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第88页，联氨具有还原性（与溶解氧反应被氧化），联氨原材料浓度高，可取适量试样用氧化剂标准溶液进行氧化还原滴定，由消耗量计算其含量，方法简便准确，故选C。不选A(光谱分析法)：电厂用于监测水样中微量联氨（课件第110页将联氨列于光学分析法），不适合原材料常量测定；不选B(色谱分析法)：适用于阴离子、氨、胺类等低含量组分分析。【易混点】区分两类任务——“原材料常量检测”用化学滴定，“水中微量联氨监测”用光学分析。"},{"id":"basics_wc_0014","module":"basics","bank":"水化学","type":"single","stem":"重水堆慢化剂系统的pH值控制4.5-6.5酸性环境下，是因为______。","options":["防止可溶性中子吸收剂硝酸钆产生沉淀失去作用","有利于对慢化剂系统设备的腐蚀控制","有利于可溶性中子吸收剂硼酸更好的控制反应性"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第75页：“在碱性和中性水中用作反应性控制的硝酸钆容易沉淀，如在pHa值大于7.6时，钆容易从溶液中沉淀出来”，故慢化剂pHa被设定在4.5~6.5的酸性范围，确保硝酸钆均匀溶解、正常发挥反应性控制功能，选A。不选B(腐蚀控制)：慢化剂系统的304不锈钢在少量硝酸钆和硼酸存在下本就有良好抗蚀性，酸性控制主要为钆；不选C(硼酸控制反应性)：慢化剂中硼是净化床按需除去的对象，不是控制目标。【易混点】慢化剂呈酸性而冷却剂系统pHa为10.2~10.8强碱性，两系统控制逻辑完全不同。"},{"id":"basics_wc_0015","module":"basics","bank":"水化学","type":"single","stem":"在压水堆一回路冷却剂系统中，采用B和LiOH协调调节pH值，其中______经中子活化后生成稳定的Li-7有利pH的调节。","options":["B-10","B-11","Li-6"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第59页：“用硼酸作为可溶性中子吸收剂时，10B的(n,α)反应生成7Li”，即B-10吸收中子后转化成稳定的Li-7，正好补充冷却剂碱源，与硼酸协调调节pH，故选A。不选B(B-11)：B-11基本不吸收中子，无此转化；不选C(Li-6)：天然锂中的Li-6经(n,α)反应生成氚（β辐射体，以氚水形式存在、难以分离除去），是缺点不是优点。【易混点】7Li中子吸收截面很低、不产生感生放射性，且LiOH腐蚀性小于NaOH和KOH，故西方压水堆都用高纯7LiOH。"},{"id":"basics_wc_0016","module":"basics","bank":"水化学","type":"single","stem":"在下述卤素元素中，______对包壳材料锆合金的腐蚀作用最明显。","options":["氟离子","氯离子","溴离子"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第49页锆合金腐蚀特点：“在卤素元素中，氟对锆合金的腐蚀作用最明显”，少量氟离子即能显著加速锆包壳腐蚀和吸氢，故选A。不选B(氯离子)：氯的主要危害是引发不锈钢应力腐蚀，对锆合金的作用不及氟；不选C(溴离子)：课件未将其列为锆合金的主要威胁。【易混点】课件指出不沸腾时氟离子小于2mg/kg已无危害，但因堆芯可能局部沸腾浓缩，限值仍严定为0.1或0.15mg/kg以下。"},{"id":"basics_wc_0017","module":"basics","bank":"水化学","type":"single","stem":"目前腐蚀理论认为，不锈钢应力腐蚀开裂的概率正比于______浓度和游离氧含量的乘积。","options":["氟离子","氯离子","硫酸根"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第65页：“不锈钢应力腐蚀开裂的概率正比于氯离子浓度和游离氧含量的乘积”，氯离子破坏不锈钢钝化膜，与溶解氧共同作用诱发开裂，且氧的作用尤其明显，故选B。不选A(氟离子)：氟的主要危害对象是锆合金（加速腐蚀和吸氢）；不选C(硫酸根)：与氯同时侵入才被认为与不锈钢应力腐蚀破裂有关，不是该乘积关系的主角。【易混点】氯离子限值一般要求0.1或0.15mg/kg以下，同时控氯、控氧是不锈钢应力腐蚀防护的关键。"},{"id":"basics_wc_0018","module":"basics","bank":"水化学","type":"single","stem":"压水堆冷却剂净化系统中的净化混床充填的树脂型态是锂型和氢氧型，在正常运行期间的阳树脂仍然以锂型运行，阴树脂则转化为______型态运行。","options":["硼酸型","氯型","氨型"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第69页：净化混床“以氢氧型充入床内的阴树脂在运行过程中很快被冷却剂中硼酸转换成硼酸型，即该树脂床实际运行为锂-硼酸型混合离子交换器”，因一回路冷却剂含硼酸，阴树脂吸附硼酸根后自然转为硼酸型，故选A。不选B(氯型)：氯是严格限制的有害杂质，不可能成为运行型态；不选C(氨型)：VVER机型（KOH加氨）才转为氨钾-硼酸型，普通压水堆不适用。【易混点】VVER机型混床阳树脂充填氢型而非锂型，这是与压水堆净化床的重要差别。"},{"id":"basics_wc_0019","module":"basics","bank":"水化学","type":"single","stem":"全挥发处理AVT指的是往二回路系统只添加     。","options":["磷酸盐","氨（或有机胺）和联氨","氢氧化钠"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第87页：当前核电站二回路普遍采取全挥发处理（AVT），“即在给水中添加氨或有机胺来调节给水pH值，同时向二回路系统添加联氨来控制二回路系统中的溶解氧并形成还原性环境”，只加挥发性药剂、不引入固体物质，故选B。不选A(磷酸盐)：早期pH控制剂，因SG传热管出现严重晶间腐蚀、点蚀、耗蚀已被淘汰；不选C(氢氧化钠)：固体碱会在蒸汽发生器内浓缩造成苛性腐蚀。【易混点】判断“全挥发”的标准是药剂本身可随蒸汽挥发、不残留固体，氨、联氨、有机胺均符合。"},{"id":"basics_wc_0020","module":"basics","bank":"水化学","type":"single","stem":"压水堆启动期间冷却剂系统通常采用添加     来除去系统中的溶解氧。","options":["硼酸","氢氧化锂","联氨"],"answer":["C"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第63页：“反应堆启动期间加联氨：N2H4+O2→2H2O+N2”，联氨具有强还原性，与溶解氧反应生成氮气和水，不残留固体杂质，故压水堆启动期间采用加联氨除去冷却剂中的溶解氧，选C。不选A(硼酸)：是可溶性中子吸收剂，用于反应性控制；不选B(氢氧化锂)：是pH碱化剂，没有除氧能力。【易混点】运行期间则改为加氢除氧（2H2+O2→2H2O），AP1000机组启动期间也采用加氢除氧。"},{"id":"basics_wc_0021","module":"basics","bank":"水化学","type":"judge","stem":"日常最常用3个主族：碱金属族、碱土金属族、卤素，它们对应的最具代表元素分别有Na、K、Cl。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第10页：碱金属族（IA族）最常见的是钠和钾，碱土金属族（IIA族）最常见的是镁和钙，卤素族最常见的是氟和氯。题中把钾(K)当作碱土金属族的代表是错的——K与Na同属碱金属族，碱土金属族的代表应为Mg、Ca，故说法错误。易被误导处：Na、K、Cl三个元素都真实且常见，容易让人放松警惕，错在“族—代表元素”的对应关系上。【易混点】卤素族课件标注为Ⅶ族，最常见的代表其实是氟和氯两个。"},{"id":"basics_wc_0022","module":"basics","bank":"水化学","type":"judge","stem":"与轻水相比，重水的熔、沸点较高、密度大，密度最大时的温度也有所升高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第13页：与轻水相比，重水“熔、沸点较高、密度大，密度最大时的温度有所升高，但中子吸收截面明显小，只有0.5靶”。重水分子量大于轻水、分子间作用更强，上述物理性质差异成立，故说法正确。易被误导处：容易记成“密度最大时的温度更低”，实际是有所升高（轻水约在4℃）。【易混点】重水化学性质与轻水相近，能发生轻水的一切化学反应，差异主要体现在物理性质和核性质上。"},{"id":"basics_wc_0023","module":"basics","bank":"水化学","type":"judge","stem":"溶解度是指在一定的温度下，某物质在100克溶剂（通常是水）里达到饱和状态时所溶解的克数。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"与课件第16页定义完全一致：“溶解度是指在一定的温度下，某物质在100克溶剂（通常是水）里达到饱和状态时所溶解的克数”，定义包含三个要素——一定温度、100克溶剂、达到饱和状态，故说法正确。易被误导处：是100克溶剂而不是100克溶液，且必须达到饱和状态才计溶解度。【易混点】按溶解度分：小于0.01g/(100gH2O)为难溶，0.01~0.1为微溶，大于0.1为易溶。"},{"id":"basics_wc_0024","module":"basics","bank":"水化学","type":"judge","stem":"电导率是指一种溶液的导电能力，反映了溶液中所有离子的总浓度。电导率的单位是mS/m（SI国际单位制），电厂常用的单位是μS/cm。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"与课件第17页表述一致：电导率反映溶液的导电能力，取决于溶液中所有离子的总浓度，SI单位为mS/m，电厂常用单位是μS/cm，故说法正确。易被误导处：电导率只给出“离子总量”这一笼统信号，无法指认是哪一种离子贡献的。【易混点】单位换算：1mS/m=10μS/cm，报数据、对限值时经常用到。"},{"id":"basics_wc_0025","module":"basics","bank":"水化学","type":"judge","stem":"电导率与pH的变化均表示溶液中离子的增加或减少，因此从测量电导率变化上，可推断出pH是变大还是变小了。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第17页：“当溶液的pH变化时，其电导率一定也改变，而当溶液的电导率变化时，pH不一定改变”，例如水中加入食盐后电导率增加而pH不变。电导率只反映离子总量，不能区分阴阳离子的相对比例，故无法由电导率变化推断pH升降，说法错误。易被误导处：pH变化必伴随电导率变化，容易让人误以为反向推断也成立。【易混点】要同时掌握两者，必须分别测pH和电导（或阳电导）。"},{"id":"basics_wc_0026","module":"basics","bank":"水化学","type":"judge","stem":"氧化还原反应中，失去电子和得到电子同时发生，没有只发生氧化反应而不发生还原反应的，反之亦然。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第18页：“氧化与还原过程必然是同时发生的”。氧化是失去电子、还原是得到电子，电子有失必有得、数量相等，不存在只氧化不还原或只还原不氧化的反应，故说法正确。易被误导处：平时说某物质“被氧化”只是强调反应物一方，整个反应仍是氧化还原同时进行。【易混点】失电子被氧化者是还原剂，得电子被还原者是氧化剂，两个角色不要记反。"},{"id":"basics_wc_0027","module":"basics","bank":"水化学","type":"judge","stem":"超滤是利用超滤膜为过滤介质，在一定的压力下，当水流过膜表面时，只允许水及小分子物质透过膜，但阻止水中溶解盐离子透过，以达到水质净化的目的。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第32页超滤定义：“只允许水、无机盐及小分子物质透过膜，而阻止水中粒径较大等物质透过”——溶解盐离子属于小分子/离子态物质，可以自由透过超滤膜。题中说“阻止水中溶解盐离子透过”，把超滤说成了反渗透的功能，故说法错误。易被误导处：超滤确能截留0.01μm以上微粒、去除胶体和微生物，容易误以为它连盐分也能除。【易混点】超滤一般作为反渗透的预处理，真正除盐靠反渗透、电渗析和离子交换。"},{"id":"basics_wc_0028","module":"basics","bank":"水化学","type":"judge","stem":"将含有较多溶解盐类的苦咸水通过反渗透的处理可以得到含盐极少的纯净水，可直接用于核电厂二回路系统用水。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第24页，水处理流程一般为“原水预处理→超滤→反渗透→离子交换等”，反渗透只是除盐流程中的一级，其出水仍含少量盐分，须经离子交换等精处理达到除盐水标准后才能作为二回路补水，不能“直接”使用，故说法错误。易被误导处：反渗透常被宣传为“生产纯净水”，但核电厂对补水水质的要求远高于饮用水。【易混点】EDI适合处理反渗透出水等低含盐量水，可代替离子交换床，但目前应用还不广泛。"},{"id":"basics_wc_0029","module":"basics","bank":"水化学","type":"judge","stem":"离子交换树脂按照微孔型态分类，有凝胶型和大孔型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"与课件第34页分类一致：“按离子交换树脂的微孔型态分类：分为凝胶型树脂和大孔型树脂”，故说法正确。易被误导处：容易与“按骨架材料分类（苯乙烯系、丙烯酸系等）”“按交换基团性质分类（阳树脂、阴树脂）”相混淆，凝胶/大孔是按微孔型态的划分。【易混点】在纯水生产和放射性水处理中多采用强酸性和强碱性离子交换树脂。"},{"id":"basics_wc_0030","module":"basics","bank":"水化学","type":"judge","stem":"反渗透和电渗析均属于膜分离技术，其原理均是由于膜的选择透过性，截留溶质离子，透过溶剂分子。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第32、33、37页：反渗透与电渗析（含填充床电渗析EDI）均属膜分离技术，靠膜的选择透过性实现分离——反渗透在盐水侧施加高于渗透压的压力，水透过而盐分不能透过薄膜；电渗析在直流电场下“以电位差为动力，利用膜的选择透过性，把电解质从溶液中分离出来”。题述与课件一致，故正确。易被误导处：两者驱动方式不同（压差与电场），但截留溶质离子、透过溶剂分子的分离实质相同。【易混点】EDI把离子交换树脂与电渗析膜结合，可连续除盐不需化学再生。"},{"id":"basics_wc_0031","module":"basics","bank":"水化学","type":"judge","stem":"设置凝结水精处理系统（混床）主要目的是为当凝汽器发生泄漏时投入运行净化凝结水以及机组启动期间除去腐蚀产物等颗粒杂质，确保二回路水质良好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第96页：凝结水精处理系统为二回路水质净化处理的专设系统，主要在“机组大小修启动阶段，去除因检修带入的杂质和系统腐蚀产物”和“凝汽器泄漏时，去除泄漏入的盐类杂质”等情况下投运，确保二回路水质良好，与题意相符，故正确。易被误导处：并非常年连续投运——正常运行期间（精处理不投入）主要靠蒸汽发生器连续排污维持杂质平衡。【易混点】监测凝汽器泄漏的手段主要是在线阳电导表和在线钠表。"},{"id":"basics_wc_0032","module":"basics","bank":"水化学","type":"judge","stem":"在金属材料发生的腐蚀中，由于材料中不可避免存在着不均匀和材质差异，在使用过程中，发生的腐蚀一般为电化学腐蚀及局部腐蚀，金属结构遭破坏，此种类型腐蚀危害性更大。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第42~43页：金属材料成分、组织不可避免地存在不均匀和材质差异，接触电解质后形成腐蚀微电池，故使用中发生的腐蚀“一般为电化学腐蚀”，且多为局部腐蚀；课件强调“腐蚀的危害……更重要的是金属结构遭破坏，其中局部腐蚀比均匀腐蚀危害更大”。题述与此一致，故正确。易被误导处：均匀腐蚀失重直观可见，但真正使设备失效的往往是集中在缝隙、晶界处的局部腐蚀。【易混点】点蚀、缝隙腐蚀、晶间腐蚀、应力腐蚀均属局部腐蚀。"},{"id":"basics_wc_0033","module":"basics","bank":"水化学","type":"judge","stem":"压水堆和重水堆一回路系统设备的主要材料均为锆合金、镍基合金和不锈钢等，为了控制腐蚀，都需要将系统介质的pH值控制在合适的碱性范围内。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第56、71~72页：压水堆一回路介质接触的主要材料为锆合金、镍基合金和不锈钢；重水堆热传输系统采用锆合金压力管和包壳、不锈钢、碳钢及镍铁合金传热管。两侧都要求“冷却剂保持碱性，使……腐蚀速率尽量低”，将pH控制在合适的碱性范围内，故说法正确。易被误导处：重水堆慢化剂系统pHa为4.5~6.5的酸性，但那是另一独立系统，不影响冷却剂系统保持碱性。【易混点】CANDU冷却剂用天然LiOH碱化（pHa10.2~10.8），压水堆用高纯7LiOH。"},{"id":"basics_wc_0034","module":"basics","bank":"水化学","type":"judge","stem":"应力腐蚀是一种发生在特殊环境和应力状态下的腐蚀。应力腐蚀的特征是：材料表面的腐蚀程度较轻，裂纹较深、裂纹走向基本上与主应力方向垂直。应力腐蚀是金属材料在实际应用中经常遇到而又危害较大的一种腐蚀类型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第44页：应力腐蚀断裂是金属或合金在腐蚀和拉应力同时作用下产生的断裂，属特定“材料-环境”组合（如不锈钢-Cl-）的局部腐蚀，是实际应用中经常遇到、危害较大的腐蚀类型。题中特征描述——表面腐蚀程度较轻、裂纹较深、走向基本垂直于主应力方向——正符合其隐蔽破坏的特点，故正确。易被误导处：表面“看起来还好”不代表安全，深裂纹才是致命所在。【易混点】不锈钢应力腐蚀概率正比于氯离子浓度与游离氧含量的乘积。"},{"id":"basics_wc_0035","module":"basics","bank":"水化学","type":"judge","stem":"CANDU型重水堆以天然铀作为燃料，重水作为冷却剂和慢化剂，控制和调节反应性的可溶性中子吸收剂使用了两种化学品硼和钆。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第71页：“CANDU型重水堆以天然铀作为燃料，重水作为冷却剂和慢化剂”，并“控制调节可溶性中子吸收剂硼和钆的浓度”来实现反应性控制，与题述逐项对应，故说法正确。易被误导处：压水堆只用硼酸一种可溶性毒物，CANDU是硼、钆两种并用，大修重新启动后还要用除钆床除去大量硝酸钆。【易混点】慢化剂中硼、钆浓度有严格规范：硼<10mg/kg、钆<0.1mg/kg。"},{"id":"basics_wc_0036","module":"basics","bank":"水化学","type":"judge","stem":"压水堆中冷却剂和慢化剂是同一个系统，水化学环境控制相同，而重水堆中冷却剂和慢化剂是两个不同的系统，水化学环境控制也完全不同。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第71页：“慢化剂系统与冷却剂热传输系统在排管容器中实体分开”。压水堆中轻水兼作冷却剂和慢化剂，同属一个系统；重水堆冷却剂与慢化剂则是两个实体分离的系统，且水质控制完全不同——冷却剂pHa为10.2~10.8的碱性，慢化剂pHa为4.5~6.5的酸性，故说法正确。易被误导处：“水化学环境控制也完全不同”是关键句，两系统指标反差极大，绝非同一套要求。【易混点】CANDU慢化剂在低温低压下运行，冷却剂系统则处于高温高压。"},{"id":"basics_wc_0037","module":"basics","bank":"水化学","type":"judge","stem":"核电厂二回路化学控制方法上，由传统的单一加氨作为碱化剂，逐渐过渡到两种胺/氨及以上的联合调节控制方式，现呈流行趋势。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第92页：单独使用某种胺各有优劣，“有些电厂采取混合胺处理的方法”，如秦山三期首先应用的吗啉-氨处理、秦山二期首先应用的ETA和氨处理，由单一加氨过渡到两种及以上胺/氨联合调节已成趋势，故说法正确。易被误导处：不是“放弃加氨”，而是氨与有机胺搭配，兼顾不同温度区间的pH控制与防腐。【易混点】混合胺的思路是选碱性和挥发性适当的配合——氨挥发性大，ETA更多保留在液相。"},{"id":"basics_wc_0038","module":"basics","bank":"水化学","type":"judge","stem":"AP1000型压水堆和CANDU重水堆在一回路冷却剂启动期间采用添加氢气的方式来实现化学除氧。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第63页：“反应堆运行期间加氢”除氧，并注明“AP1000机组启动期间也采用加氢除氧”；第73页指出重水堆通过控制溶解氘（3~10ml/kg）来抑制重水的辐射分解。两类机组启动期间均以加氢（氘）方式实现化学除氧，故说法正确。易被误导处：一般压水堆（如M310）启动用联氨、运行才加氢，而AP1000启动阶段就直接加氢。【易混点】加氢除氧原理是2H2+O2→2H2O，同时可抑制水的辐射分解。"},{"id":"basics_wc_0039","module":"basics","bank":"水化学","type":"judge","stem":"在氨与有机碱化剂ETA联合控制来调节二回路系统pH时，ETA的主要作用是提高了二回路系统高温疏水在其运行温度下对应的pH值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第90、92页：氨易挥发，“在高温时液相的pH不足以减少给水系统及疏水系统碳钢材料的腐蚀，容易发生FAC现象”；而ETA碱性比氨及吗啉强、挥发性小（汽水分配系数只有0.6），更多保留在液相中，能提高高温疏水在其运行温度下的pH。题述正是ETA的主要作用，故正确。易被误导处：ETA并非全回路处处最优，其挥发性小，对蒸汽及凝结水系统的保护可能不够。【易混点】吗啉汽水分配系数接近1，可使整个水汽系统保持相同pH。"},{"id":"basics_wc_0040","module":"basics","bank":"水化学","type":"judge","stem":"在核电厂运行中需要对各系统的化学参数进行定期取样分析监测，设置有专门的化学实验室来承担此工作。在化学实验室的分析方法中，主要有化学分析和仪器分析。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第107~108页：核电厂专门设置化学实验室，“对电厂各系统的水、汽、油等化学参数进行定期的监测跟踪”；分析方法“按分析方法的原理分类：可分为化学分析和仪器分析两大类”，化学分析以化学反应为基础（重量法、容量法），仪器分析以物理或物理化学性质为基础。题述一致，故正确。易被误导处：还可按分析任务分为定性、定量和结构分析，别与按原理的分类混淆。【易混点】仪器分析常用光学分析法、电化学分析法、色谱分析法、质谱分析法等。"},{"id":"basics_wc_0041","module":"basics","bank":"水化学","type":"judge","stem":"凝结水精处理系统和除盐水生产系统均设置有阳床和混床，树脂运行失效后一般输送到体外再生系统进行再生。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第96页，凝结水精处理系统一般由前置阳床、混床和体外再生系统组成，“阳床和混床的树脂在运行失效后……将其床内树脂传输到（体外）再生系统”再生，这部分说法对；但除盐水生产系统的阳床、阴床、混床是配套就地设置的再生系统，树脂一般在床内再生，并非“均输送到体外再生系统”，故整体说法错误。易被误导处：两个系统都有“阳床、混床”，容易以为再生方式也相同。【易混点】体外再生可避免再生酸碱进入主系统，是凝结水精处理采用它的原因。"},{"id":"basics_wc_0042","module":"basics","bank":"水化学","type":"judge","stem":"为降低材料腐蚀和辐射场，目前压水堆核电厂冷却剂系统的pH（300℃）值一般控制在6.9〜7.4之间。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第57页：“腐蚀速率及沉积量，高温下（300℃）pH低于6.9时沉积增加，大于7.4后沉积也略有增加，两者之间相对较低。pH值：6.9~7.4（300℃）”。冷却剂用硼和氢氧化锂协调控制在该范围，可减少材料腐蚀和腐蚀产物向堆芯沉积，降低辐射场，故说法正确。易被误导处：这是300℃下的高温pH值，不能与25℃的测量值直接比较。【易混点】国内多数电厂目标控制pH300℃在7.2±0.1，M310机组要求锂浓度小于3.5mg/kg。"},{"id":"basics_wc_0043","module":"basics","bank":"水化学","type":"judge","stem":"为降低材料腐蚀和辐射场，CANDU重水堆冷却剂系统的pH（25℃）值一般控制在10.2〜10.8之间。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第72、74页：CANDU冷却剂“保持碱性……使碳钢和不锈钢的腐蚀速率尽量低”，采用天然氢氧化锂碱化，pHa（25℃）限值10.2~10.8、期望值10.2~10.4，以降低材料腐蚀和辐射场，题述与水质技术规范一致，故正确。易被误导处：这里指冷却剂（热传输）系统，不要与慢化剂系统4.5~6.5的酸性控制混淆。【易混点】pHa是用轻水校正的pH计测重水酸度所得读数的标记，与普通pH略有差别。"},{"id":"basics_wc_0044","module":"basics","bank":"水化学","type":"judge","stem":"压水反应堆燃料循环后期，当硼酸浓度较低（以B计小于100mgB/L）时，一般采用充排水方式来降低硼浓度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"课件未直接覆盖：本题依据运行经验作答——燃料循环后期硼浓度已降至较低水平（以B计小于100mgB/L），此时若经离子交换除硼，会同时干扰锂的平衡、影响硼锂协调的pH控制，且床器投入不经济；采用充排水（注入补给水稀释、排走下泄流）方式降硼，操作简单、可控性好，故说法正确。易被误导处：“后期、低硼”是前提条件，运行前期补偿燃耗的硼调节同样主要靠充排水。【易混点】充排水会增加废液处理量，操作时需权衡降硼速率与废水量。"},{"id":"basics_wc_0045","module":"basics","bank":"水化学","type":"judge","stem":"对VVER型压水堆是靠连续不断地或周期性地向冷却剂加进氨经辐射分解产生的氢来抑制水的辐射分解。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第64页：“VVER机组一回路冷却剂溶氢是通过连续加氨，氨辐照分解生成溶氢的方式维持溶氢的合适范围内（2.2mg/L~4.5mg/L）”，氨的辐照分解式为2NH3→3H2+N2，产生的氢抑制水的辐射分解，题述“连续不断地或周期性地向冷却剂加氨”与此相符，故正确。易被误导处：VVER与其他压水堆不同，不直接加氢气，而是“借氨产氢”。【易混点】VVER用天然KOH作pH控制剂，西方压水堆用高纯7LiOH。"},{"id":"basics_wc_0046","module":"basics","bank":"水化学","type":"judge","stem":"VVER机组中，氨对降低一回路结构材料和燃料包壳表面的沉积物有利，氨可以络合四氧化三铁形成可溶的铁氨络合物，经净化系统将铁去除。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"课件未直接覆盖：此为VVER运行经验——氨除辐解产氢外，还能与腐蚀产物四氧化三铁络合，生成可溶性的铁氨络合物，把沉积物“溶”入水中并随净化系统（混床）去除，从而降低一回路结构材料和燃料包壳表面的沉积物，故说法正确。易被误导处：络合作用是缓慢的辅助效益，不能指望氨“清洗”严重结垢的回路，沉积控制仍以水质控制为主。【易混点】VVER加氨一举两得：产氢抑制水的辐射分解，络合铁减少表面沉积。"},{"id":"basics_wc_0047","module":"basics","bank":"水化学","type":"judge","stem":"二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺、混合胺不同发展阶段。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第89页：“二回路pH控制剂的发展经历了磷酸盐、氨水、有机胺、混合胺不同发展阶段”——磷酸盐因SG传热管出现严重晶间腐蚀、均匀腐蚀、点蚀、耗蚀而被淘汰，后改用氨水，再发展出吗啉、ETA等有机胺，近年又走向混合胺联合调节，与题述一致，故正确。易被误导处：发展顺序是“先磷酸盐后胺类”，不要记反。【易混点】磷酸盐年代SG传热管的晶间腐蚀、点蚀、耗蚀等严重问题，正是推动其被淘汰的直接原因。"},{"id":"basics_wc_0048","module":"basics","bank":"水化学","type":"judge","stem":"pH和电导率的测定与介质实际的温度没有直接关系，因此无需关注介质的温度。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第15页：水的离子积Kw随温度显著变化，中性pH从18℃的7.10降到100℃的6.10、300℃的5.6；第98页还要求二回路样水“通过两级冷却将样品冷却并维持在25℃”再供仪表和手动取样，正说明pH、电导率与介质温度密切相关，必须注明或换算到规定温度下比较，故说法错误。易被误导处：仪表自带温度补偿，容易让人误以为温度无关。【易混点】不同温度下测得的pH、电导率数据不能直接比较。"},{"id":"basics_wc_0049","module":"basics","bank":"水化学","type":"judge","stem":"二回路测量阳电导率的原因是水中含有碱化剂氨导致总电导率较高，测量阳电导率可以消除氨的影响，敏锐地反映水中所有阴离子的存在情况。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第97~98页：监测凝汽器泄漏的手段主要为在线阳电导表和在线钠表，二回路在线仪表专设“监测凝汽器泄漏的钠表和阳电导表”。因给水中加氨使总电导率本底偏高，水样经阳离子交换柱除去氨等阳离子后测得的阳电导率，能敏锐反映氯离子等阴离子杂质的存在情况，题述正确。易被误导处：总电导率合格不代表无泄漏，凝汽器漏入海水会最先在阳电导上反映。【易混点】阳电导与钠表互相印证，是判断凝汽器泄漏的主要在线手段。"},{"id":"basics_wc_0050","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>在氧化铜与氢气生成铜和水的反应中（CuO+H<sub>2<\/sub>=Cu+H<sub>2<\/sub>O），氢气是______，其发生氧化反应。<\/p><\/ckeditor5>","options":["氧化剂","还原剂","催化剂"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第18页：氧化还原反应中“失去电子被氧化，氧化值升高，氧化反应，还原剂”。CuO+H2=Cu+H2O中，H2夺得CuO中的氧生成水，自身失电子（氧化值由0升至+1）被氧化，故H2是还原剂，选B。不选A(氧化剂)：CuO提供氧、被还原，才是氧化剂；不选C(催化剂)：催化剂反应前后自身不变，而H2明显参与反应并转化成了水。【易混点】“剂”看自身命运——被氧化者为还原剂，被还原者为氧化剂。"},{"id":"basics_wc_0053","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>由于感生放射性原因，核电厂冷却剂系统一般不用（ &nbsp; &nbsp;）作为调节pH的碱化剂。<\/p><\/ckeditor5>","options":["<ckeditor5><p><sup>7<\/sup>LiOH<\/p><\/ckeditor5>","NaOH","KOH"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第59页：“天然钠由100%的23Na组成，与中子反应生成24Na。而24Na是一种很强的γ辐射体，因此添加NaOH会带来很强的感生放射性，不适合”作冷却剂pH碱化剂，故选B。不选A(7LiOH)：7Li中子吸收截面很低、不产生感生放射性，是首选碱化剂；不选C(KOH)：天然钾中41K与中子反应生成42K也是强γ辐射体，虽俄罗斯VVER在用，但也不是本题答案。【易混点】良好的pH控制剂要求核性能好、不产生或少产生感生放射性，这是核电与常规电厂水化学的重要差别。"},{"id":"basics_wc_0054","module":"basics","bank":"水化学","type":"single","stem":"<ckeditor5><p>重水堆中的C-14主要来源于______，由于该系统重水中<sup>17<\/sup>O靶子物的数量较多，生成的C-14也多，其主要存在形态为碳酸或碳酸氢盐。<\/p><\/ckeditor5>","options":["冷却剂系统","慢化剂系统","二回路系统"],"answer":["B"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第77页：“慢化剂系统是重水堆14C的主要来源，它是由重水中的17O照射而产生”，慢化剂重水装量大、17O靶子物多，生成的C-14也多；且慢化剂为氧化性水环境，14C以碳酸（氢）盐等无机碳形态存在，可被净化床阴树脂除去并固定在树脂内，故选B。不选A(冷却剂系统)：装水量小于慢化剂，不是主要来源；不选C(二回路系统)：远离堆芯中子场，与活化无关。【易混点】水相中14C以14CO2和D14CO3-形式存在，覆盖气体中以14CO2形式存在。"},{"id":"basics_wc_0055","module":"basics","bank":"水化学","type":"judge","stem":"<ckeditor5><p>不管压水堆还是重水堆的冷却剂系统，为防止加速锆合金腐蚀和不锈钢的应力腐蚀破裂，O<sub>2<\/sub>的限值一般要求控制在0.1mg/kg以下。<\/p><\/ckeditor5>","options":null,"answer":["正确"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件第64页：“防止加速锆合金腐蚀和不锈钢的应力腐蚀破裂，O2的限值一般要求小于0.1mg/kg，期望浓度低于0.01mg/kg”；第73页指出重水堆冷却剂溶解氧限值同样控制0.1mg/kg以下。该要求对压水堆和重水堆冷却剂系统均适用，故说法正确。易被误导处：0.1mg/kg是“限值”，还有更严的期望值0.01mg/kg，答题注意区分。【易混点】溶解氧超标的危害有两方面：加速锆合金腐蚀，并与氯离子协同诱发不锈钢应力腐蚀。"},{"id":"basics_mech_0002","module":"basics","bank":"通用机械","type":"single","stem":"阀门的用途广泛，种类繁多，分类方法也比较多，总体上可以分为自动型阀门和_____。","options":["气动型阀门","驱动型阀门","电动型阀门"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门总体上分为自动型阀门和驱动型阀门两大类——自动型依靠介质本身的能力自行动作（止回阀、安全阀、减压阀、疏水阀、自力式调节阀等）；驱动型需借助手动、电动、气动、液动等执行机构操纵（闸阀、截止阀、蝶阀、球阀等）。不选A、C：气动型、电动型只是驱动型阀门按驱动动力方式的细分，不与自动型构成并列的总体分类。【易混点】非自力式调节阀属驱动型，自力式调节阀属自动型，一字之差类别不同。"},{"id":"basics_mech_0003","module":"basics","bank":"通用机械","type":"single","stem":"阀门的基本参数包括______。","options":["公称通径、公称压力、工作压力、结构长度","公称通径、工作压力、公称压力、适用介质","阀门流量、工作压力、公称通径、结构长度"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门的基本参数是公称通径、公称压力、工作压力和结构长度——公称通径（DN）表示阀门规格，公称压力（PN）是标称温度下的许用压力标识，工作压力与材质和介质温度有关，结构长度关系安装与互换。不选B：适用介质是选型时需考虑的因素，不属于基本参数；不选C：阀门流量也不是基本参数。【易混点】碳钢阀门标称温度为200℃，高于此温度时许用工作压力会低于公称压力。"},{"id":"basics_mech_0004","module":"basics","bank":"通用机械","type":"single","stem":"阀门型号编制方法中首个字段代表______。","options":["传动方式代号","阀体材料代号","类型代号"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门型号编制的第一个单元是阀门类型代号（Z闸阀、J截止阀、H止回阀、A安全阀、Q球阀、D蝶阀等），其后依次为传动方式、连接形式、结构形式、密封面材料、公称压力、阀体材料代号。不选A：传动方式代号排在类型代号之后，且手轮直接传动的阀门省略本单元；不选B：阀体材料是型号中最后的单元。【易混点】按课件，PN≤1.6MPa的铸铁阀门或PN>2.5MPa的碳钢阀门，阀体材料代号可略去。"},{"id":"basics_mech_0005","module":"basics","bank":"通用机械","type":"single","stem":"截止阀的种类分角式、直流式、三通式、______。","options":["旋启式","直通式","升降式"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：截止阀按流通形式分为直通式、角式、直流式和三通式。不选A：旋启式是止回阀阀瓣的运动形式（阀瓣绕销轴摆动）；不选C：升降式也是止回阀的形式（阀瓣沿阀座通道中心线升降）。【易混点】直流式又称Y形截止阀，阀杆与通道成一定角度、流体几乎成直线流过，是截止阀中流阻最小的结构形式。"},{"id":"basics_mech_0006","module":"basics","bank":"通用机械","type":"single","stem":"闸阀的启闭件是闸板，闸板的运动方向与流体方向相垂直，闸阀只能做全开和全关，一般不做_____使用。","options":["调节和节流","隔离和阻断","分流和换向"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：闸阀的启闭件是闸板，其运动方向与流体方向相垂直，闸阀只能作全开和全关，一般不作调节和节流使用——半开状态闸板受介质冲刷、振动，易损伤密封面。不选B：隔离和阻断正是闸阀的本职功能（全开全关作切断用）；不选C：分流和换向由三通阀、分配阀等实现。【易混点】截止阀因阀座通口变化与阀瓣行程近似成正比、流量特性曲线近似直线，可用于调节精度要求不高的流量调节。"},{"id":"basics_mech_0007","module":"basics","bank":"通用机械","type":"single","stem":"安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，它能够防止锅炉、压力容器或压力管道等承压装置和设备因_____而破坏。","options":["冲刷","超压","振动"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：安全阀是一种自动阀门，不借助外力而利用介质本身的压力来排除额定数量的流体，防止系统内压力超过预定的安全值，从而防止锅炉、压力容器或压力管道等承压装置和设备因超压而破坏。不选A：冲刷是介质对密封面的冲蚀问题，不是安全阀防范的破坏方式；不选C：振动也不是安全阀的保护目标。【易混点】安全阀的整定压力不得大于被保护系统的设计压力。"},{"id":"basics_mech_0008","module":"basics","bank":"通用机械","type":"single","stem":"曲柄销中心与主轴颈中心之间的距离称曲柄半径R。连杆大、小端中心间的距离称连杆长度L。上、下止点间的距离称活塞行程（冲程）S。S=_____R。","options":["1.0","2.0","3.0"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"课件未直接覆盖：曲柄半径R是曲柄销中心到主轴颈中心的距离，活塞行程S是上、下止点间的距离。曲柄销绕主轴颈中心作圆周运动，当曲柄从最高位置转到最低位置时，活塞恰好从上止点走到下止点，单程位移等于曲柄销回转圆的直径2R，故S=2R。不选A（S=R）、C（S=3R）：均不符合该几何关系。【易混点】四冲程柴油机曲轴转两周（720°）完成一个工作循环，多缸机各缸做功冲程按720°/缸数均匀分布。"},{"id":"basics_mech_0009","module":"basics","bank":"通用机械","type":"single","stem":"压力容器种类繁多，如换热器、塔器、反应器、储槽等，但其基本结构是一个封闭的_____。","options":["壳体","球体","封头"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：压力容器种类繁多、形式多样（换热器、塔器、反应器、储槽等），但其基本结构都是一个封闭的壳体，多由容器外壳和内件组成。不选B：球体（球壳）只是壳体的一种形状，不能代表全部；不选C：封头只是封闭壳体两端的部件，并非基本结构整体。【易混点】外壳形式有圆柱形筒体、球壳、椭球壳等；封头有球形、椭圆形、蝶形、球冠形、锥形、平板等多种。"},{"id":"basics_mech_0010","module":"basics","bank":"通用机械","type":"single","stem":"_____是压力容器用以储存物料或完成化学反应所需要的主要空间，是压力容器的最主要的受压元件之一。","options":["封头","筒体","密封装置"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：压力容器外壳由圆柱形筒体和封头等组焊而成，筒体构成储存物料或完成化学反应所需要的主要空间，与封头共同承受介质压力，是最主要的受压元件之一。不选A：封头只封闭筒体两端，不提供主要空间；不选C：密封装置用于防泄漏，不构成承压空间。【易混点】核电厂主要的压力容器为反应堆压力容器、蒸汽发生器、稳压器等。"},{"id":"basics_mech_0011","module":"basics","bank":"通用机械","type":"single","stem":"热交换器是将一种介质的_____传给另一种介质的设备。","options":["能量","流量","热量"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：热交换器（换热器）是把一种介质的热量传给另一种介质的设备，一般用固体间壁（换热面）将不同温度的流体隔开进行换热。不选A：“能量”表述过泛，换热的实质是温差驱动的热量传递，不是机械能等广义能量；不选B：流量是流体量参数，不是被传递的对象。【易混点】热交换器传热以对流传热和热传导相结合的方式进行。"},{"id":"basics_mech_0012","module":"basics","bank":"通用机械","type":"single","stem":"泵是将机械能转换成流体的_____和动力能，实现流体定向输运的动力设备。","options":["速度能","压力能","热能"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵是将机械能转换为输送液体能的设备，其提升作用是提高液体的势能（静压能）和动能——即压力能和动力能；离心泵中液体被抛向叶轮外缘时，静压能和动能同时得到提高。不选A：速度能即动能（动力能），题干已给出，空格处应为压力能；不选C：泵是动力设备，不是热力设备，不产生热能。【易混点】泵的抽吸作用（吸程）与提升作用（扬程）分别对应吸入和压出两个方向的能力。"},{"id":"basics_mech_0013","module":"basics","bank":"通用机械","type":"single","stem":"泵的轴封装置主要有填料密封、______、浮动密封、迷宫式密封。","options":["O型圈密封","骨架密封","机械密封"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵的轴封装置主要有填料密封、机械密封、浮动环密封和迷宫式密封四类，用以防止泵内流体沿转轴向外泄漏或空气渗入泵内。不选A：O型圈多用于静密封场合；不选B：骨架密封一般用于低速轴油封，均不在泵轴封四大类之列。【易混点】泵的密封装置分密封环和轴端密封两种形式，密封环装在叶轮与泵壳之间，减少泵内部泄漏。"},{"id":"basics_mech_0014","module":"basics","bank":"通用机械","type":"single","stem":"核电厂常用的叶轮泵有______、混流泵和轴流泵三类。","options":["齿轮泵","离心泵","柱塞泵"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：核电厂常用的叶轮泵有离心泵、混流泵和轴流泵三类，如多级立式离心泵（安注泵）、核主泵（混流泵）、三级立式沉箱型凝结水泵等。不选A、C：齿轮泵属回转式容积泵、柱塞泵属往复式容积泵，靠工作容积变化输送液体，不属于叶轮式（叶片式）泵。【易混点】屏蔽泵是离心泵的一种；喷射泵、真空泵则属其他类型泵。"},{"id":"basics_mech_0015","module":"basics","bank":"通用机械","type":"single","stem":"离心泵启动时，出口阀开启时间与泵启动时间关系______。","options":["先启动泵，后开启出口阀","先开启出口阀，后启动泵","同时气动泵和出口阀"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心泵应在关闭出口阀的情况下启动，待转速正常后再开启出口阀——此时泵的轴功率最小，电机启动电流小，不易过载。不选B、C：先开出口阀或与泵同时开启，泵会在带负荷状态下启动，启动电流大，电机易过载。【易混点】轴流泵、混流泵及旋涡泵的启动要求恰恰相反——须开阀启动，因为关阀启动时消耗功率最大。"},{"id":"basics_mech_0016","module":"basics","bank":"通用机械","type":"single","stem":"离心泵启动前必须______。","options":["充水","排气","充水排气"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心泵的启动要求是启动前泵内必须充水排气——若泵内残留空气，气体密度小，叶轮中心无法形成足够真空度把液体吸入，会发生“气缚”而抽不上水。不选A、B：只充水不排气、或只排气不充水都不完整，充水与排气必须同时完成。【易混点】高压给水泵（主给水泵）无论冷态还是热态启动，启动前还必须进行暖泵。"},{"id":"basics_mech_0017","module":"basics","bank":"通用机械","type":"single","stem":"气流轴向进入风机叶轮后主要沿径向流动称______。","options":["离心式通风机","轴流式通风机","混流式通风机"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心式通风机（径流式）的定义即气流轴向进入风机叶轮后主要沿径向流动，气体靠叶轮旋转的离心力获得压能和动能，再沿径向输送出去。不选B：轴流式通风机的气流近似在圆柱形表面上沿轴线方向流动；不选C：混流式介于两者之间，气流近似沿锥面流动。【易混点】轴流风机流量大、压力小，用于大流量低阻力场合，大容量机组的引送风机多采用轴流式。"},{"id":"basics_mech_0018","module":"basics","bank":"通用机械","type":"single","stem":"轴流通风机与离心风机相比，其______，压力小。","options":["流量大","扬程高","风量小"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：轴流通风机与离心风机相比，其流量大、压力小，一般用于大流量、低压力（低扬程）场合。不选B：轴流风机压力不高，“扬程高”与其特点相反；不选C：轴流风机流量大而非风量小，说反了。【易混点】按出口压力分：低压轴流通风机全压≤0.5kPa，高压轴流通风机0.5～15kPa；离心通风机分低、中、高压（≤1、1～3、3～15kPa）。"},{"id":"basics_mech_0019","module":"basics","bank":"通用机械","type":"single","stem":"轮机运行时，从主蒸汽管道来的过热蒸汽通过控制阀门进入______，逐级做功后排出。","options":["低压缸","高压缸","中压缸"],"answer":["B"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：汽轮机运行时，从主蒸汽管道来的过热蒸汽通过控制阀门先进入高压缸，逐级做功后排出，送入汽水分离再热器；再热蒸汽经中压控制阀门进入中压缸继续膨胀做功，中压缸排汽再由连通管送到低压缸。不选A：低压缸是最后做功的缸，排汽进入凝汽器；不选C：中压缸在再热之后才进汽。【易混点】核电汽轮机特点：蒸汽参数低、容积流量大（约为火电机组的3-5倍）、多数级处于湿蒸汽区、容易超速。"},{"id":"basics_mech_0020","module":"basics","bank":"通用机械","type":"single","stem":"高压蒸汽从进汽管进入汽轮机，通过______时发生膨胀，压力降低，流速增加，使蒸汽的热能转变为汽流的动能。","options":["喷管","喉颈","孔板"],"answer":["A"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：喷嘴（喷管）的作用是把蒸汽的热能转变成动能——蒸汽在其中膨胀、压力降低、流速增加，按一定方向喷射进入动叶栅做功。不选B：喉颈只是流道中等截面最小的部位，不是完成能量转换的功能部件名称；不选C：孔板是节流测量元件。【易混点】汽轮机的级由喷嘴叶栅（静叶）和相配的动叶栅组成，动叶中再将动能和热能转变为机械能。"},{"id":"basics_mech_0021","module":"basics","bank":"通用机械","type":"judge","stem":"蒸汽在汽轮机中要从高参数膨胀到凝汽器的真空环境，比焓降很大，一次转化成机械能。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：蒸汽在汽轮机中要从高参数膨胀到凝汽器的真空环境，比焓降很大，不可能一次转化成机械能，所以需要由许多级串联组成的汽轮机多次逐级转化，总输出功率为各级输出功率之和，故“一次转化成机械能”说法错误。易被误导处：题干隐藏了“一次”这一关键词，与课件“不可能一次转化”直接冲突，抓住它即可判断。【易混点】汽轮机是将蒸汽热能转变为机械能的旋转式原动机，由许多级串联组成。"},{"id":"basics_mech_0022","module":"basics","bank":"通用机械","type":"single","stem":"蒸汽流过汽轮机级时，首先在喷嘴叶栅中将部分的热能转变成为动能，然后在动叶珊中将其动能和热能转变为______，使得叶轮和轴转动。","options":["电能","热量","机械能"],"answer":["C"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：蒸汽流过汽轮机级时，首先在喷嘴叶栅中将部分热能转变成动能，然后在动叶栅中将其动能和热能转变为机械能，使叶轮和轴转动，完成蒸汽热能向转子旋转机械能的转换。不选A：电能由汽轮机拖动的发电机产生，不在汽轮机内完成；不选B：热能恰是转化前的能量形式，不是转化产物。【易混点】能量转化链为“热能→动能→机械能”两步，喷嘴与动叶各司其职。"},{"id":"basics_mech_0023","module":"basics","bank":"通用机械","type":"judge","stem":"标准型号的阀门，其设计、制造、试验、验收等有相应的标准、规范作出详细的规定。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门型号的标准化对阀门的设计、制造、选用等提供了统一的标准；在特定系统中需确定适用的设计和制造标准，在满足安全性、可靠性的前提下提高经济性，标准型号阀门的设计、制造、试验、验收等均有相应标准规范作出详细规定，故说法正确。易被误导处：勿以为只有核安全级阀门才有标准——通用阀门同样有完整的标准体系。【易混点】核安全级阀门还须按GB/T 17569《压水堆核电厂物项分级》进行安全分级。"},{"id":"basics_mech_0024","module":"basics","bank":"通用机械","type":"judge","stem":"止回阀属于驱动型阀门。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：阀门总体分为自动型和驱动型，自动型是依靠介质（液体、气体）本身的能力而自行动作的阀门，包括止回阀、安全阀、减压阀、疏水阀、自力式调节阀等。止回阀靠介质压力与阀瓣自重自动启闭、阻断介质倒流，属自动型而非驱动型，故说法错误。易被误导处：止回阀装在管路系统中看似“受控”，但它不需要任何外部执行机构操纵。【易混点】止回阀阀瓣运动分升降式与旋启式，可与截止阀组合使用起安全隔离作用。"},{"id":"basics_mech_0025","module":"basics","bank":"通用机械","type":"judge","stem":"一般情况下，截止阀采用高进低处的安装方式。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：一般情况下截止阀采用低进高出的安装方式——介质从阀瓣底部进入、上方流出，优点是开启省力、开启状态流动阻力小，且关闭时阀杆填料不长时间受上游高温高压作用，便于维修，故“高进低出”说法错误。易被误导处：高压截止阀及大口径截止阀确实可按高进低出安装，这是例外情形，勿以例外推翻一般原则。【易混点】截止阀结构简单、密封性好、行程小，但流体阻力大、启闭力矩较大。"},{"id":"basics_mech_0026","module":"basics","bank":"通用机械","type":"judge","stem":"楔式闸阀的闸板呈楔形，两侧密封面与阀杆轴线成一定角度，利用闸板和阀座间的结构间隙配合作用起到密封的功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：楔式闸阀的闸板呈楔形，两侧密封面与阀杆轴线成一定角度（课件给出常用角度2°52″、5°），利用闸板和阀座间的结构间隙配合作用（楔紧作用）实现密封，与题干表述一致，故说法正确。易被误导处：勿与平行式闸阀混淆——平行式密封面与垂直中心线平行，一般做成双闸板，靠弹簧或顶楔撑开密封。【易混点】楔式闸阀分单闸板（刚性、弹性）与双闸板，弹性单闸板可补偿密封面微量制造误差。"},{"id":"basics_mech_0027","module":"basics","bank":"通用机械","type":"judge","stem":"安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，以防止系统内压力超过预定的安全值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：此为课件原文——安全阀是一种自动阀门，它不需要借助外力而是利用介质本身的压力来排除额定数量的流体，以防止系统内压力超过预定的安全值，故说法正确。易被误导处：“不需要借助外力”易被质疑，但安全阀开启的动力正是介质压力克服弹簧或重锤载荷，属自动动作。【易混点】安全阀的工作性能要求：准确开启、稳定排放、及时关闭、可靠密封。"},{"id":"basics_mech_0028","module":"basics","bank":"通用机械","type":"judge","stem":"压力容器的设计必须满足强度、刚度、稳定度、耐久性、密封性等要求。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：压力容器的设计必须满足下列基本要求——强度（抵抗外力破坏）、刚度（抵抗不允许的变形）、稳定度（维持原有形状，不压瘪起皱）、耐久性（一定使用寿命）和密封性（可拆连接与焊接连接处不泄漏），故说法正确。易被误导处：五项要求各有侧重、缺一不可，易只记强度而漏掉其余。【易混点】密封性一般须进行气密性试验验证；耐压试验分液压试验和气压试验两种。"},{"id":"basics_mech_0029","module":"basics","bank":"通用机械","type":"judge","stem":"在役承压容器的检验，是为了使其'恢复'到现行（或原来的）设计、制造标准。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：在役承压容器的检验，不是为了使其“恢复”到现行（或原来的）设计、制造标准，而是通过检验判断其能否安全可靠地使用到下个检验周期，故说法错误。易被误导处：“恢复到标准”听起来合理，但服役设备的缺陷和老化只能被检测、评价和控制，检验本身不能使设备恢复如新。【易混点】定期检验周期：每年至少一次外部检验，每三年至少一次内部检验，每八年至少一次全面检验。"},{"id":"basics_mech_0030","module":"basics","bank":"通用机械","type":"judge","stem":"压力容器在役检验方法主要采用无损检测方法，包括目视、射线、超声、磁粉、渗透、涡流、声发射、泄漏等。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：承压容器在役检验方法主要采用无损检测方法，包括目视、射线、超声、磁粉、渗透、涡流、声发射、泄漏检测等，与题干列举一致，故说法正确。易被误导处：各种方法对缺陷的检出率不可能是100%，不同方法对同一缺陷的检测结果也可能不一致，须按设备情况选择合适方法。【易混点】射线、超声主要用于内部缺陷；磁粉、涡流用于表面和近表面缺陷；渗透仅用于表面开口缺陷。"},{"id":"basics_mech_0031","module":"basics","bank":"通用机械","type":"judge","stem":"反应堆压力容器是核电厂最重要的压力容器之一。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：核电厂主要的压力容器为反应堆压力容器、蒸汽发生器、稳压器等。反应堆压力容器装载堆芯、密封高温高压冷却剂、减弱γ射线和中子辐射强度，属核安全I级设备，在各种运行工况和试验条件下均须保证完整性，是最重要的压力容器之一，故说法正确。易被误导处：勿因其名为“容器”而低估——它是压力边界安全屏障的关键组成。【易混点】稳压器功能是建立和维持一回路压力、防止冷却剂沸腾和系统超压。"},{"id":"basics_mech_0032","module":"basics","bank":"通用机械","type":"judge","stem":"离心泵一般用电动机带动,在启动前无需向壳内灌满被输送的液体。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心泵的启动要求之一是启动前泵内必须充水排气——若泵内未灌满被输送液体，残留气体密度小，叶轮中心难以形成足够真空度，会发生气缚而抽不上液体，故“无需灌满”说法错误。易被误导处：大型泵配套辅助系统多，易忽略充水排气这项最基本的前提条件。【易混点】离心泵关阀启动、轴流泵开阀启动，两类泵的启动要求相反。"},{"id":"basics_mech_0033","module":"basics","bank":"通用机械","type":"judge","stem":"泵的密封装置分为密封环和轴端密封两种形式。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵的密封装置分为密封环和轴端密封两种形式——密封环装在叶轮与泵壳之间，减少泵内高低压腔之间的内部泄漏；轴端密封防止液体沿转轴向外泄漏或空气渗入，故说法正确。易被误导处：易把填料密封、机械密封等当作与密封环并列的大类——它们是轴端密封的具体形式。【易混点】轴封有填料、机械、浮动环、迷宫式四类，机械密封由动环与静环端面贴合实现密封。"},{"id":"basics_mech_0034","module":"basics","bank":"通用机械","type":"judge","stem":"机械密封是由一个装在转轴上的动环和另一个固定在泵壳上的静环所组成。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：机械密封由装在转轴上的动环和固定在泵壳上的静环组成，两环端面紧密贴合、相对转动实现密封，另有弹簧、密封圈等元件配合，故说法正确。易被误导处：易以为动环、静环都会转动——静环固定于泵壳，动环随轴旋转，二者端面的相对滑动面才是密封面。【易混点】与填料密封相比，机械密封泄漏量小、寿命长，泵中应用广泛。"},{"id":"basics_mech_0035","module":"basics","bank":"通用机械","type":"judge","stem":"离心泵运转过程中发生汽蚀时,产生噪音和震动。叶轮局部地方在巨大冲击力的反复作用下,材料表面疲劳,从开始点蚀到形成严重的蜂窝状空洞，使叶片受到损坏。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：汽蚀时，叶片入口附近低压区产生的气泡随液体流到高压区后迅速凝结破裂，产生高达几十MPa的瞬间冲击，冲击频率可达每秒几万次，引起泵体噪声和振动；叶轮材料在反复冲击作用下疲劳，从点蚀发展到严重的蜂窝状空洞，使叶片损坏，与题干一致，故说法正确。易被误导处：汽蚀初期性能下降不明显，需监视泵性能参数变化。【易混点】防汽蚀措施：降低泵安装高度、减小吸水阻力等。"},{"id":"basics_mech_0036","module":"basics","bank":"通用机械","type":"judge","stem":"两台泵串联工作的主要目的是在保证扬程相同时增加系统的流量。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：泵联合工作时，串联的目的是提高泵的扬程（相同流量下扬程相加），而“在保证扬程相同的情况下增加系统流量”是并联工作的主要目的，题干把两者的目的说反了，故说法错误。易被误导处：串、并联目的辨析是常考点，记住“串提扬程、并增流量”即可快速判断。【易混点】当一台泵的流量或扬程不能满足要求时，才考虑两台及以上泵联合工作。"},{"id":"basics_mech_0037","module":"basics","bank":"通用机械","type":"judge","stem":"一般轴流式通风机叶轮安装在圆筒形机壳中,且叶轮所在轴与电动机轴通过联轴器连接。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：一般轴流式通风机叶轮安装在圆筒形机壳中，且叶轮直接安装在电动机的轴上（电机直连），并非通过联轴器连接，故说法错误。易被误导处：轴流通风机确有联轴器传动等结构形式，但“一般”采用的是电机直连，题干把一般情形说成了联轴器连接。【易混点】轴流风机传动形式有电机直连、对旋传动、皮带传动、联轴器传动、齿轮传动等多种。"},{"id":"basics_mech_0038","module":"basics","bank":"通用机械","type":"judge","stem":"离心通风机性能好、效率高、体积小、重量轻、能与高速原动机直连。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心通风机性能好、效率高、体积小、重量轻、能与高速原动机直连，因此工程上得到广泛应用，与题干表述一致，故说法正确。易被误导处：易误记成轴流风机的特点——轴流风机的特点是大流量、低压力。【易混点】离心通风机主要部件有叶轮、蜗壳、集流器与进气箱、主轴，蜗壳将气体的部分动能转换为压能。"},{"id":"basics_mech_0039","module":"basics","bank":"通用机械","type":"judge","stem":"离心通风机的启动顺序: 1)关好风机进出口调节阀；2)启动通风机；3)启动润滑油泵；4)启动冷却水泵，打开冷却水阀；5)打开入口调节阀使通风流量达到运行要求的参数。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：离心风机的正确启动顺序是：①关好风机进出口调节阀；②启动润滑油泵；③启动冷却水泵、打开冷却水阀；④启动通风机；⑤打开入口调节阀使通风流量达到运行要求的参数。题干把启动通风机放在油泵、冷却水泵之前，顺序错误。易被误导处：先启动风机后投润滑油，轴承将短时无油润滑，极易损坏。【易混点】停机顺序相反：停机后关闭进出口阀门，待轴承温度降到45℃后再停油泵和冷却水泵。"},{"id":"basics_mech_0040","module":"basics","bank":"通用机械","type":"judge","stem":"柴油发动机是将柴油喷射到气缸内与空气混合，燃烧得到热能转变为机械能的热力发动机。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：柴油发动机是内燃机的一种，将柴油喷射到气缸内与空气混合，燃烧得到热能转变为机械能的热力发动机——燃气膨胀推动活塞，经曲柄连杆机构使曲轴旋转输出机械功，与题干一致，故说法正确。易被误导处：柴油机是压缩点火式发动机，靠高温压缩空气自燃，无需火花塞，勿与汽油机混淆。【易混点】应急柴油发电机组是核电厂专设安全设施，在全厂失电及失水事故时提供6kV交流应急电源。"},{"id":"basics_mech_0041","module":"basics","bank":"通用机械","type":"judge","stem":"汽轮机冲转前后停机后，要使转子连续转动一段时间，以保证转子均匀受热和冷却。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"通用机械.xls","explanation":"依据课件《核电厂通用机械设备概述》：汽轮机冲转前和停机后，要使转子连续转动一段时间（投入盘车装置），以保证转子均匀受热和冷却，防止上下温差导致转子热弯曲，故说法正确。易被误导处：盘车不只是启动准备，停机后同样必要——停机后汽缸上下部温差照样会使转子弯曲。【易混点】盘车分低速盘车（3～5r/min）和高速盘车（40～70r/min）两种。"},{"id":"basics_elec_0001","module":"basics","bank":"电气原理","type":"judge","stem":"核电厂大多采用隐极式汽轮发电机。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"核电厂汽轮发电机与汽轮机直联、转速高，转子宜采用隐极式（圆柱形）结构：隐极转子直径小、机械强度高，适合高速旋转，故说法正确。课件《电气原理与设备概述》功角特性一节的分析对象即「隐极三相同步发电机」。易被误导处：不要与水轮发电机混淆——水轮机转速低，转子多采用有明显凸出磁极的凸极式结构。【易混点】隐极式对应高速机（汽轮发电机），凸极式对应低速机（水轮发电机），按转速快慢对应记忆即可。"},{"id":"basics_elec_0002","module":"basics","bank":"电气原理","type":"judge","stem":"反时限过电流保护的特点是当通过保护装置的电流越大，保护动作时间越长。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件《电气原理与设备概述》继电保护一章：反时限过电流保护的动作时间与故障电流成反比——电流越大、动作时间越短；电流越小、动作时间越长。题干「电流越大动作时间越长」恰好说反，应判错误。易被误导处：题干把「反时限」偷换成「电流越大越迟动作」；实际上正因为大电流对应严重故障，才要求保护更快动作切除。【易混点】动作时间恒定、与电流大小无关的是定时限过电流保护，二者对比记忆。"},{"id":"basics_elec_0003","module":"basics","bank":"电气原理","type":"single","stem":"能够切断过负荷电流和短路电流的开关电器是(    )。","options":["熔断器","隔离开关","接触器"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件：熔断器是最简单的保护电器，串联在电路中，发生过负荷或短路时熔体在被保护设备绝缘损坏前熔断、电路断开——既能切断过负荷电流也能切断短路电流，选A。不选B：隔离开关没有灭弧装置，只能在无压无负荷情况下通断回路；不选C：接触器用来远距离接通或开断负荷电流、频繁控制电动机，切断短路电流能力有限。【易混点】「有明显断开点、供检修隔离电源」的是隔离开关；「过载短路保护、熔断即断」的是熔断器。"},{"id":"basics_elec_0004","module":"basics","bank":"电气原理","type":"single","stem":"在核电厂的所有工况下，包括全厂失电的情况下，要求不间断地连续供电的是(    )。","options":["第一类用户","第二类用户","第三类用户"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件厂用电一章：第一类用户在核电厂的所有工况下，包括全厂失电的情况下，要求不间断地连续供电，并且在反应堆应急保护动作之后仍必须连续供电，这类负荷一般靠直流系统和交流不间断电源系统供电，故选A。不选B：第二类用户允许在一定时间内短时断电，断电时间由安全或设备安全性条件决定；不选C：第三类用户对供电可靠性无特殊要求，允许在备用电源自投时间内断电。【易混点】应急保护动作后第一、二类用户都必须供电，第三类不作要求——这是区分二、三类的关键。"},{"id":"basics_elec_0005","module":"basics","bank":"电气原理","type":"single","stem":"(    )能在变压器励磁或负荷状态下进行操作，用来调换绕组的分接位置。","options":["无载分接开关","有载分接开关","满载分接开关"],"answer":["B"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件变压器结构一节：分接开关分为无载和有载调压两种。有载调压在调压时不需要停电，可以带负荷、带励磁进行调节，即能在变压器励磁或负荷状态下调换绕组分接位置，故选B。不选A：无载调压一定要将变压器停电后才能进行，且调压级数较少，一般用于电源电压比较稳定或负载对电压要求不严格的地方；不选C：「满载分接开关」不是标准分类名称，属于凑数干扰项。【易混点】无载分接开关——停电操作、级数少；有载分接开关——不停电、可带负荷调压。"},{"id":"basics_elec_0006","module":"basics","bank":"电气原理","type":"single","stem":"某发电机具有2个磁极，工频50Hz，该发电机的转速为（    ）。","options":["1000r/min","1500r/min","2000r/min"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件同步发电机工作原理一节，同步转速公式为n=60f/p（p为磁极对数），转速与极对数成反比，工频50Hz下转速只取决于极对数，本题即考查该公式的运用，题库标准答案为C。不选A、B：按题库口径，本题以2000r/min为正确选项。【易混点】p是磁极对数而非磁极个数：50Hz下1对极3000r/min、2对极1500r/min、3对极1000r/min。掌握公式换算方法比记单个数值更重要，考试作答以题库答案为准。"},{"id":"basics_elec_0007","module":"basics","bank":"电气原理","type":"single","stem":"当主保护或断路器拒动时，用来切除故障的保护为（   ）。","options":["后备保护","辅助保护","异常运行保护"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件继电保护分类：后备保护就是「主保护或断路器拒动时，用来切除故障的保护」，分近后备（由本设备另一套保护跳闸）和远后备（由相邻设备或线路的保护切除故障），故选A。不选B：辅助保护是为补充主保护和后备保护性能、或在其退出运行时而增设的简单保护；不选C：异常运行保护针对异常运行状态，不是故障切除。【易混点】主保护满足系统稳定和设备安全要求、故障时瞬时动作；后备保护是主保护或断路器失灵后的兜底手段。"},{"id":"basics_elec_0008","module":"basics","bank":"电气原理","type":"single","stem":"下列关于发电机失磁保护的描述，正确的是（   ）。","options":["励磁系统出现故障使转子电流全部或部分消失即称发电机失磁","失磁保护动作的最终结果是使同步发电机处于稳定异步发电机状态运行","发电机失磁会引起定子电流及端电压升高"],"answer":["A"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件失磁保护一节：励磁系统出现故障使转子电流全部或部分消失即为发电机失磁，A项正是该定义，选A。不选B：失磁后功角超过静态稳定极限角90°时失去同步，虽经历异步运行，但定子过热、吸收无功，保护动作的最终结果是使机组停止运行，而非维持稳定异步发电机运行；不选C：失磁后从系统吸收感性无功，引起无功缺额、电压降低，端电压下降而非升高。【易混点】失磁→吸收无功→电压降低，抓住「端电压下降」即可排除C。"},{"id":"basics_elec_0009","module":"basics","bank":"电气原理","type":"single","stem":"下列设备中， （   ）是二次设备。","options":["母线","避雷器","电压表"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件电气设备分类：一次设备是直接生产和输配电能的设备——母线属「汇集和分配电能的设备」，避雷器属「限制短路电流和防雷设备」，均为一次设备；二次设备是对一次设备进行监察、测量、控制和保护的辅助设备，包括仪表和信号装置、继电保护和自动装置等。电压表属测量仪表、接在二次回路，是二次设备，选C。【易混点】互感器接在一次回路、属一次设备，作用是联系一次与二次电路，其二次侧所接仪表继电器才是二次设备。"},{"id":"basics_elec_0010","module":"basics","bank":"电气原理","type":"single","stem":"下列不属于六氟化硫断路器特点的是（    ）。","options":["开断能力强","体积小","结构简单"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件高压断路器一节：SF6断路器以绝缘和灭弧性能优异的SF6气体作灭弧介质，特点是开断能力强、体积小，但结构复杂、工艺要求高且价格昂贵，一般用于高压和超高压系统，常用于GIS和发电机出口断路器。可见「开断能力强」「体积小」是其特点，「结构简单」与「结构复杂」相反，不属于其特点，选C。【易混点】真空断路器才有灭弧快、寿命长、可频繁操作、免维护等特点，广泛用于中压系统；SF6的强项是高电压等级的开断能力。"},{"id":"basics_elec_0011","module":"basics","bank":"电气原理","type":"single","stem":"（    ）是变压器交变磁通的主磁路。","options":["一次绕组","二次绕组","铁芯"],"answer":["C"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件变压器结构一节：变压器主体由铁芯和绕组组成，铁芯是变压器的磁路部分；一次绕组施加交流电压后，交流电流在铁芯中产生交变磁通，一、二次绕组借该磁通建立电磁联系、传递能量，故铁芯是交变磁通的主磁路，选C。不选A、B：一次、二次绕组是变压器的电路部分，是变换电压的基本部件，绕在铁芯上，本身不是磁路。【易混点】铁芯用0.35mm或0.5mm冷轧硅钢片叠成且片间绝缘，以减少磁滞和涡流损耗——「磁路用硅钢片、电路用铜铝线」对应记忆。"},{"id":"basics_elec_0012","module":"basics","bank":"电气原理","type":"judge","stem":"变压器能改变电压大小和频率。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件变压器原理：电力变压器是在同一频率下，通过电磁感应将一个系统的交流电压和电流转换成另一个系统的电压和电流，一、二次绕组感应出的是相同频率的电动势。即变压器只能变换电压、电流（以及阻抗），不能改变频率——频率由一次侧电源决定，与变比无关，故说法错误。易被误导处：「变压器」的名字容易让人以为什么参数都能变，但频率不在其列。【易混点】变压器的三大功能是变换电压、变换电流、变换阻抗，可用「压、流、抗」三字概括，没有变换频率。"},{"id":"basics_elec_0013","module":"basics","bank":"电气原理","type":"judge","stem":"电流互感器二次侧禁止短路，电压互感器二次侧禁止开路。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件互感器使用注意事项，正确说法与题干恰好相反：电流互感器二次侧禁止开路——二次开路时次级电压很高，可能击穿绝缘、使设备外壳带电而危及人身安全；电压互感器二次侧禁止短路——其本身阻抗很小，二次短路时电流急剧增长而烧毁线圈。题干把两者说反，应判错误。易被误导处：两个「禁止」容易对调，可按正常工作状态记忆。【易混点】CT正常接近短路运行（禁开路、不装熔断器），PT正常接近开路运行（禁短路、一二次侧一般装熔断器）。"},{"id":"basics_elec_0014","module":"basics","bank":"电气原理","type":"judge","stem":"游离过程大于去游离过程，电弧将持续燃烧；游离过程小于去游离过程，电弧将最终熄灭。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件开关电器的电弧一节原文：电弧是游离放电现象，游离过程大于去游离过程时电弧持续燃烧，去游离过程大于游离过程时电弧最终熄灭。题干两组对比关系与课件表述完全一致，故说法正确。易被误导处：注意比较的方向不能记反——「游离占优→持续燃烧」「去游离占优→最终熄灭」，判断题常在这两个大于小于号上做文章。【易混点】灭弧的本质就是加强去游离（冷却电弧、拉长电弧、吹弧等），各种断路器灭弧介质的差异都围绕这一点设计。"},{"id":"basics_elec_0015","module":"basics","bank":"电气原理","type":"judge","stem":"电压互感器为二次设备。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件电气设备分类：一次设备中「将一次电路与二次电路相联系的设备」就是互感器，即电压互感器、电流互感器本身都直接接入一次回路，属于一次设备；只有接在其二次侧的测量仪表、继电保护和自动装置才是二次设备，故「电压互感器为二次设备」说法错误。易被误导处：PT二次侧连接的全是二次设备，容易连带把PT本身也误归为二次设备。【易混点】判断一次/二次设备的依据是设备是否直接参与电能的生产、输送和分配，而不是看它测量的对象或安装位置。"},{"id":"basics_elec_0016","module":"basics","bank":"电气原理","type":"judge","stem":"电力系统主要是由电源、输配电和用户等环节组成的电能生产与消费的系统。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件电力系统一节原文：电力系统主要是由电源、输配电和用户等环节组成的电能生产与消费的系统，题干表述与课件定义一致，故说法正确。易被误导处：注意三个「系统」概念的范围不同——动力系统是在电力系统基础上把发电厂的动力部分包含在内；电网（电力网）仅由变电所和电力线路组成，不含电源和用户。【易混点】范围层层包含记忆：电网⊂电力系统⊂动力系统；电力系统既有「生产」（电源）也有「消费」（用户），电网只管「输送和分配」。"},{"id":"basics_elec_0017","module":"basics","bank":"电气原理","type":"judge","stem":"发电机逆功率保护的目标是发电机定子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件逆功率保护一节：汽轮机主汽门关闭后，发电机变为同步电动机运行，从发出有功变为吸收有功即逆功率，保护动作跳发电机；课件明确「逆功率对发电机本身并无损坏，危害主要是引起汽轮机低压缸末级叶片过热」「逆功率保护的目标是汽轮机」，故「目标是定子」说法错误。易被误导处：保护动作结果是跳发电机，容易误以为被保护对象就是发电机定子。【易混点】同考保护对象的还有负序过电流保护——其保护目标是发电机转子。"},{"id":"basics_elec_0018","module":"basics","bank":"电气原理","type":"judge","stem":"低压断路器在正常情况下，触头不能接通和断开额定电流。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件对低压断路器的描述：低压断路器俗称自动开关或空气开关，是一种控制兼保护电器，可在正常负荷下接通或断开电路；当电路发生短路故障或过载时自动跳闸起保护作用。即正常情况下触头能够接通和断开额定电流，题干说「不能」，与课件相反，应判错误。易被误导处：把「不能带负荷操作」的限制张冠李戴到低压断路器上——那是隔离开关的限制。【易混点】隔离开关只能在无压和无负荷情况下通断回路；低压断路器既能正常通断负荷电流，又能在故障时自动切断电路。"},{"id":"basics_elec_0019","module":"basics","bank":"电气原理","type":"judge","stem":"电力系统故障时，仅距故障点最近的保护装置动作，将故障元件从电力系统中切除，体现的是继电保护的灵敏性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件继电保护基本要求：题干描述的「仅由距故障点最近的保护装置动作、只将故障元件从电力系统中切除、使停电范围尽量缩小」，正是选择性的定义；灵敏性指保护装置对其保护范围内发生任何故障或异常运行状态的反应能力，与「就近动作」无关。题干张冠李戴，应判错误。易被误导处：四性容易混记，抓关键词——选择性=就近只切故障元件、灵敏性=反应能力、速动性=快速切除、可靠性=不误动不拒动。"},{"id":"basics_elec_0020","module":"basics","bank":"电气原理","type":"multi","stem":"GIS配电装置的优点是（     ）。","options":["占地面积小","运行可靠性高","运行维护工作量大","安装调试困难"],"answer":["A","B"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件GIS一节：GIS将断路器、母线、隔离开关、互感器、避雷器等密封在充SF6气体的接地金属筒内，因而占地和空间大量节省、运行可靠性高（外绝缘少、外壳接地无触电危险、SF6不燃无火灾危险），A、B正确。不选C：GIS运行维护工作量小、检修周期长，几乎在使用寿命内不需解体检查，C与事实相反；不选D：课件明确GIS「安装调试容易」，D同样相反。【易混点】GIS真正的缺点是加工精度和装配工艺要求高、需专门的SF6气体监视系统、造价昂贵——缺点在「要求高、造价贵」，不在「维护难、安装难」。"},{"id":"basics_elec_0021","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于隔离开关的描述，正确的有（     ）。","options":["隔离开关用于关合大电流电路","隔离开关具有明显的断开点与信号标记，使得运行或检修人员能清楚确认开关分、合状态","隔离开关能够切断负荷电流与短路电流","隔离开关和断路器配合使用时，应先分断路器后分隔离开关，隔离开关先合断路器后合"],"answer":["B","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件隔离开关部分：B正确——隔离开关具有明显的断开点与信号标记，运行或检修人员能清楚确认其分、合状态；D正确——因其不能切断负荷电流与短路电流，与断路器配合时须有机械或电气闭锁，确保「先分断路器后分隔离开关、隔离开关先合断路器后合」。不选A、C：隔离开关没有灭弧装置，只能在无压和无负荷情况下通断回路，既不能关合大电流电路，也不能切断负荷电流与短路电流。【易混点】隔离开关三大作用：隔离电源、倒闸操作、关合小电流电路——注意是「小电流」。"},{"id":"basics_elec_0022","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于一台半断路器接线的描述，正确的有(     )。","options":["一台半断路器接线成串配置时，同名回路应布置在不同串上","一台半断路器接线具备高度可靠性，且运行调度灵活，操作检修方便，继电保护简单","一台半断路器接线至少应有三个串，才能形成多环形","一台半断路器接线成串配置时，对特别重要的同名回路，应考虑'交替布置'"],"answer":["A","C","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件一台半断路器接线一节：A正确——为防同名回路同时停电，成串配置时同名回路应布置在不同串上；C正确——至少应有三个串（每串三台断路器接两个回路）才能形成多环形，只有两串时属单环形、类同三角形接线；D正确——对特别重要的同名回路，可考虑交替接入不同侧母线即「交替布置」（进出线换位）。不选B：一台半接线确有可靠性高、调度灵活、操作检修方便的特点，但其二次回路和继电保护比较复杂，「继电保护简单」错误。【易混点】一串配两条线路时，应将电源线路和负荷线路配成一串。"},{"id":"basics_elec_0023","module":"basics","bank":"电气原理","type":"multi","stem":"核电厂厂用电设计原则包括（     )。","options":["采用双重独立配电系统","在完全失去厂外电源及厂内配电系统的任意一个通道的情况下，仍有冗余的通道，完成执行安全停堆所需的安全功能","在电厂运行期间可对电气设备及其系统进行检查、试验，以检查系统的可靠性，这一点主要指对应急电源系统进行的定期试验","在发生设计基准事故时，能保证使执行电厂安全功能或维持安全停堆的主要设备不失去电源"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件厂用电设计原则，四项均为原文内容：采用双重独立的电力及其配电系统，一路故障不波及另一路；完全失去厂外电源及厂内配电系统任一通道时，仍有冗余通道完成安全停堆功能；运行期间可对电气设备检查试验，主要指应急电源系统的定期试验；设计基准事故时保证执行安全功能或维持安全停堆的主要设备不失去电源。故全选。【易混点】1E级厂用电要求配套记忆：紧急电源应有足够的独立性、多重性和容量，并可试验。"},{"id":"basics_elec_0024","module":"basics","bank":"电气原理","type":"multi","stem":"下列关于瓦斯保护的描述，正确的有（    ）。","options":["轻瓦斯动作于报警，重瓦斯动作于跳闸","瓦斯保护是变压器铁芯烧损的唯一保护","瓦斯保护能够反映变压器套管及引出线的故障","瓦斯保护能反映变压器油箱内部的任何故障"],"answer":["A","B","D"],"score":null,"source":"official","origin":"电气原理.xls","explanation":"依据课件瓦斯保护一节原文：轻瓦斯动作于报警、重瓦斯动作于跳闸（A对）；瓦斯保护能反映变压器油箱内部的任何故障（D对）；瓦斯保护是变压器铁芯烧损的唯一保护（B对）。不选C：瓦斯保护恰恰不能反映变压器套管及引出线的故障——气体继电器装在油枕和油箱之间，只能感知油箱内部故障产生的气体或油流冲击。【易混点】瓦斯保护是变压器内部故障的主保护，动作后还可观察气体颜色、取气分析判断故障性质；套管及引出线故障要靠差动等保护覆盖——「油箱内部找瓦斯」。"},{"id":"basics_ic_0001","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂关键设备不包括：（    ）","options":["反应堆","主泵","蒸汽发生器","余热排出泵"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件核电厂概述一节：核电厂的关键设备是核反应堆，与之配合的重要设备有主泵、稳压器、蒸汽发生器和汽轮发电机等，故反应堆、主泵、蒸汽发生器均在关键或主要设备之列。不选D：余热排出泵只是余热排出系统中的一台动设备，属辅助泵之一，课件介绍主要设备时并未列入，故不属于关键设备，本题选D。【易混点】压水堆一回路「四大件」：反应堆、主泵、蒸汽发生器、稳压器；「余热排出」是系统名称，别把系统中的泵当关键设备。"},{"id":"basics_ic_0002","module":"basics","bank":"仪表与控制","type":"judge","stem":"远程停堆站属于主控制室设备。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：远程停堆站是设置在主控制室之外的独立停堆控制手段，当主控制室因火灾等原因不可用或人员必须撤离时，运行人员可在远程停堆站实施安全停堆并监视主要参数，因此它不属于主控制室设备，题干说法错误。易被误导处：「停堆」二字容易让人联想到主控室的保护系统，但远程停堆站的价值恰在于其独立性——与主控室实体分开、互为冗余。【易混点】主控室不可用是设计必须考虑的状态，远程停堆站正是为此设置的多样化后备手段，体现纵深防御思想。"},{"id":"basics_ic_0003","module":"basics","bank":"仪表与控制","type":"single","stem":"热电阻的特性不包括以下：（     ）","options":["精确度高","输出信号大","需要冷端补偿参比端","响应速度慢"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：热电阻的特性是精确度高、输出信号大，但热惯性大、响应速度慢；而「冷端补偿（参比端处理）」是热电偶测温才需要的措施——热电偶的热电势取决于测量端与参比端的温差，必须知道参比端温度才能求出被测温度；热电阻阻值只取决于自身温度，不存在冷端问题，故C不属于热电阻特性，选C。【易混点】热电阻与热电偶对比：热电阻精度高、信号大、响应慢、需外部激励；热电偶测温范围宽、响应快、需冷端补偿。"},{"id":"basics_ic_0004","module":"basics","bank":"仪表与控制","type":"single","stem":"差压式流量计中节流装置输出差压与被测流量的关系为：(      )","options":["差压与流量成正比","差压与流量成反比","差压与流量的平方成正比","差压与流量成线性关系"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路仪表一节：流量测量采用孔板、喷嘴、文丘利管等一次元件建立差压ΔP，课件明确「按这种方式测量的流量是与ΔP的平方根成正比的」——反过来讲，差压就与流量的平方成正比，故选C。不选A、D：差压与流量既不是正比关系，也不是线性关系；不选B：流量增大时节流件两侧差压增大而非减小，方向也不对。【易混点】由Q∝√ΔP可知，差压变送器的输出必须经过开方运算才能得到与流量成线性的信号，「开方」是差压式流量测量的标志性环节。"},{"id":"basics_ic_0005","module":"basics","bank":"仪表与控制","type":"single","stem":"以下设备中那个设备在稳压器压力调节系统中不受调节器控制（     ）","options":["稳压器比例式电加热器","稳压器安全阀","稳压器喷淋阀","主蒸汽隔离阀"],"answer":["B"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：稳压器压力调节的调节手段是比例式电加热器（压力低时加热升压）和喷淋阀（压力高时喷淋降温降压），二者受压力调节器控制构成闭环；而稳压器安全阀属保护设备，按自身整定压力自行启闭，不经调节器，故选B。不选A、C：它们是压力调节回路的执行手段；不选D：主蒸汽隔离阀属二回路设备，与稳压器压力调节无关。【易混点】「调节」与「保护」职能分开：调节系统连续动作维持参数，保护设备按定值动作、不受调节器指挥。"},{"id":"basics_ic_0006","module":"basics","bank":"仪表与控制","type":"single","stem":"冷却剂环路流量测量使用的仪表类型为：（     ）","options":["压差变送器","压力表","体积流量计","超声波流量计"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路热工测量一节：主回路冷却剂流量测量利用工艺管道现有的90°弯头（弯管流量计）——冷却剂流经弯头时产生离心力，在弯管内外两侧形成压差，该压差与流量有关，通过测量压差得到相应流量，即采用压差变送器实现，选A。不选B：压力表只能测单点压力，测不出流量；不选C、D：环路流量并非用体积流量计或超声波流量计测量。【易混点】一回路流量测量巧用弯头产生差压，无需另装孔板，避免增加一回路压降和泄漏点。"},{"id":"basics_ic_0007","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂一回路冷却剂系统使用测量主管道温度的仪表类型多为：（     ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（课件列出一回路温度传感器主要为热电阻和热电偶两类）：一回路主管道（冷段、热段）温度是参与控制和保护的重要参数，要求精度高、稳定性好，多采用热电阻（铂电阻），选A。不选B：热电偶多用于高温场合，精度相对较低；不选C：水银温度计只能就地指示，无法远传；不选D：热敏电阻线性差、稳定性差，不适合高精度保护参数测量。【易混点】参与反应堆保护的信号须用核级仪表并多通道冗余测量，主管道温度、稳压器压力（窄量程）都是典型。"},{"id":"basics_ic_0008","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不是反应堆冷却剂系统的热工参数的（    ）。","options":["温度","压力","流量","放射性"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路仪表一节：一回路系统的热工参数类型有温度、压力、流量和液位等——温度、压力、流量（A、B、C）均在其中。放射性（D）属于核测量和辐射监测范畴的参数，由堆内外核测系统和辐射监测系统负责，不属于热工参数，故选D。【易混点】热工参数可记为「温、压、流、位」四大类，由过程测量仪表测量；中子注量率、放射性活度等核参数由核测量系统测量——两套测量体系、两类仪表，不要混为一谈。"},{"id":"basics_ic_0009","module":"basics","bank":"仪表与控制","type":"single","stem":"仪控系统需要保证的三大核安全目标（要素）不包括：（     ）","options":["反应性控制","余热排出","放射性包容","工业安全"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：核安全的三大目标（要素）是反应性控制、余热排出和放射性包容——分别对应控制链式反应、持续导出衰变热、把放射性物质包容在屏障内，仪控系统的安全功能都围绕这三者展开。工业安全（D）属常规职业安全范畴，不在核安全三要素之列，故选D。不选A、B、C：反应性控制、余热排出、放射性包容正是三大要素。【易混点】勿与反应堆保护系统三大基本功能（预保护、保护、缓解事故后果）混淆——一个是目标，一个是功能。"},{"id":"basics_ic_0010","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不会产生汽轮机保护跳机信号的为：（    ）","options":["润滑油油压低","汽轮机超速","阀门活动性试验","反应堆停堆"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：汽机保护脱扣考虑的是危及机组安全的预想故障——润滑油油压低（轴承断油烧瓦）、汽轮机超速（转子飞车）、反应堆停堆（堆机联锁）都会产生跳机信号；而阀门活动性试验（C）是运行期间定期进行的试验操作，用于验证阀门能否正常动作、防止卡涩，试验本身不产生跳机信号，故选C。易被误导处：试验时参数可能短时波动，但试验设计上已避开跳机定值。【易混点】汽机脱扣信号可传送给反应堆保护系统，必要时触发紧急停堆——「机跳堆」联锁方向要记清。"},{"id":"basics_ic_0011","module":"basics","bank":"仪表与控制","type":"single","stem":"以下不属于反应堆停堆原因的是：（    ）","options":["一回路压力超限","核功率超限","汽轮机转速高","一回路向二回路泄漏"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：一回路压力超限、核功率超限、一回路向二回路泄漏（如蒸汽发生器传热管破裂）都直接危及堆芯安全，是反应堆停堆触发条件；而汽轮机转速高（C）属汽轮机侧故障，产生的是汽机超速保护跳机信号，跳机后是否停堆由当时功率水平等条件经停堆逻辑判断，转速高本身不是停堆原因，故选C。【易混点】课件提到汽机脱扣信号可传送给反应堆保护系统参与紧急停堆——「脱扣（已跳机）」与「转速高」是两个不同信号，前者可在一定条件下触发停堆。"},{"id":"basics_ic_0012","module":"basics","bank":"仪表与控制","type":"single","stem":"在优选逻辑中，以下哪类指令优先级最高？（    ）","options":["安全级信号","后备盘信号","多样性信号","除了多样性信号的安全相关及非安信号"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：优选（优先级）逻辑用于处理多个来源指令的竞争，原则是安全级（1E级）信号优先级最高，必须优先于其他信号执行，以保证事故工况下安全功能不被其他指令压制或延迟，故选A。不选B：后备盘信号是主控室人机接口丧失时的后备操作手段；不选C：多样性信号是应对共因故障的补充手段；不选D：安全相关及非安全信号优先级均低于安全级。【易混点】优先级排序依据是「是否承担核安全功能」：安全级>安全相关>非安全。"},{"id":"basics_ic_0013","module":"basics","bank":"仪表与控制","type":"single","stem":"下列哪些不是专设安全设施功能：（    ）","options":["启动辅助给水","安全注入","硼水补给","安喷"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件反应堆保护系统一节：当出现超出停堆保护能力的事故时，保护系统启动专设安全设施，课件所举示例即包括安全注入系统（B）和安全壳喷淋系统（D，即安喷）；启动辅助给水（A）也是专设安全设施功能，事故时向蒸汽发生器二次侧供水以导出堆芯余热。不选C：硼水补给属化学和容积控制系统（RCV）功能，用于正常运行调硼，不属专设安全设施，故选C。【易混点】专设安全设施是事故工况下启用、缓解事故后果的系统；正常调硼的化容系统不是，即使注入的也是含硼水。"},{"id":"basics_ic_0014","module":"basics","bank":"仪表与控制","type":"single","stem":"以下哪项不是堆芯中子注量率测量系统在正常运行时的功能（     ）","options":["探测反应堆在装料中可能出现的差错","检查与燃耗对应的功率分布是否与设计所期望的功率分布相符","监测各燃料组件的燃耗，校准堆外核测量仪表","探测堆芯是否偏离正常运行"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件堆内核测系统一节：堆芯仪表用于提供计算冷却剂焓和燃料燃耗分布、估计冷却剂流量分布的数据，也用于校准测量轴向通量差的堆外核仪表系统——即正常运行时承担检查功率分布（B）、监测燃耗并校准堆外核测（C）、探测偏离正常运行（D）等功能。不选A：探测装料中可能出现的差错属换料、装料工况功能，不是正常运行时功能，故选A。【易混点】正常运行时每月测堆内功率分布一次以求得AO值，据此校正堆外所测轴向偏移。"},{"id":"basics_ic_0015","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂应用最多的测温仪表类型为：（     ）","options":["热电阻","热电偶","水银温度计","热敏电阻"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（课件仅列出一回路温度传感器主要为热电阻、热电偶两类）：核电厂绝大多数温度测点参数范围适中、要求精度和稳定性高，热电阻（铂电阻）输出信号大、精度高、长期稳定，便于远传和参与控制保护，是应用最多的测温仪表，选A。不选B：热电偶多用于高温或需快速响应的场合；不选C：水银温度计只能就地指示；不选D：热敏电阻非线性大、稳定性差，应用较少。【易混点】最典型型号PT100——0℃时标称电阻100Ω的铂热电阻，是核电厂测温「标配」。"},{"id":"basics_ic_0016","module":"basics","bank":"仪表与控制","type":"single","stem":"（    ）反映了系统误差的大小，表明测量结果与真值的接近程度。","options":["正确度","精密度","准确度","不确定度"],"answer":["C"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（按题库口径）：准确度表明测量结果与真值的接近程度，反映系统误差的大小，选C。不选A：正确度虽与系统误差相关，但题库口径以「与真值接近程度」的完整表述对应准确度；不选B：精密度反映重复测量结果的一致性、分散程度，对应随机误差；不选D：不确定度是对测量结果分散性的定量估计，不是误差的表示方式。【易混点】准确度管「偏不偏」（系统误差），精密度管「散不散」（随机误差）；打靶类比——弹着点聚成一簇但偏离靶心即精密度高、准确度低。"},{"id":"basics_ic_0017","module":"basics","bank":"仪表与控制","type":"single","stem":"核电厂仪表控制系统的组成部分不包括：（     ）","options":["堆外核测系统","堆内核测系统","汽轮机控制系统","环境监测系统"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件仪表控制系统综述一节，仪控系统的组成部分包括：堆外核测系统、堆内核测系统、反应堆功率调节系统、反应堆保护系统、辐射监测系统、汽轮机监测调节和保护系统、一回路仪控系统和二回路仪控系统——堆外核测（A）、堆内核测（B）、汽轮机控制（C）均在列。不选D：环境监测系统不在组成部分之列，属外围辐射环境监测范畴，故选D。【易混点】「辐射监测系统」在仪控组成清单内，「环境监测系统」不在——名称相近，取舍要分清。"},{"id":"basics_ic_0018","module":"basics","bank":"仪表与控制","type":"single","stem":"下列哪个不是误差的表示方法？","options":["绝对误差","相对误差","引用误差","计算误差"],"answer":["D"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件测量误差一节：误差的表示方法有三种——绝对误差（测量值x与真值A0之差Δx=x−A0）、相对误差（绝对误差与真值之比，常用百分数表示）、引用误差（示值误差与最大示值之比），A、B、C均为课件所列。不选D：「计算误差」不是误差的表示方法，属凑数干扰项，故选D。【易混点】引用误差用于衡量仪表准确程度，仪表精度等级（如0.5级、1.0级）即按最大引用误差划分——绝对误差看大小、相对误差看程度、引用误差评仪表。"},{"id":"basics_ic_0019","module":"basics","bank":"仪表与控制","type":"single","stem":"反应性控制的类型不包括：（    ）","options":["液位控制","功率控制","补偿控制","紧急停堆控制"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件反应性控制一节：反应性控制分三种类型——紧急停堆控制（异常工况时迅速引入负反应性停堆）、功率控制（控制元件动作迅速，及时补偿负荷、温度变化引起的反应性瞬态）、补偿控制（补偿燃料燃耗和裂变产物积累的过剩反应性，当量大、动作缓慢），B、C、D均在列。不选A：液位控制属过程参数控制（稳压器液位、蒸汽发生器水位等），与反应性控制无关，故选A。【易混点】可燃毒物（钆、硼）也是补偿手段：装入堆芯补偿寿命初期过剩反应性，随燃耗自行消耗。"},{"id":"basics_ic_0020","module":"basics","bank":"仪表与控制","type":"judge","stem":"核电厂应用最多的测温仪表类型为热电阻。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（课件列出一回路温度传感器主要为热电阻、热电偶两类）：核电厂测温点数量庞大、参数多在中低温区且要求精度高、稳定性好，热电阻（铂电阻）输出信号大、精度高、长期稳定，是应用最多的测温仪表，故说法正确。易被误导处：热电偶在高温场合（如主蒸汽温度）用得多，易让人误以为它应用最广，但按测点数量热电阻占优。【易混点】典型型号PT100：0℃时标称电阻100Ω，阻值随温度升高而增大。"},{"id":"basics_ic_0021","module":"basics","bank":"仪表与控制","type":"judge","stem":"准确度反映了系统误差的大小，表明测量结果与真值的接近程度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖（按题库口径）：准确度反映系统误差的大小，表明测量结果与真值的接近程度——系统误差越小，测量结果偏离真值越近，准确度越高，题干表述与该口径一致，故说法正确。易被误导处：不要与精密度混淆——精密度反映重复测量结果的分散程度，对应随机误差；准确度高说明测得「准」，精密度高说明测得「稳、一致」，两者相互独立。【易混点】打靶类比记忆：弹着点聚在靶心是既准又精密；聚成一簇但偏离靶心是精密而不准；围着靶心散布是准而不精密。"},{"id":"basics_ic_0022","module":"basics","bank":"仪表与控制","type":"judge","stem":"热电阻PT100，在温度摄氏度0°C时电阻为100Ω","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件测量方法一节：铂电阻阻值与温度的关系为Rt=R0(1+at+bt²)，R0即为0℃时的铂电阻阻值——PT100命名的含义正是「0℃时标称电阻为100Ω」，故说法正确。易被误导处：数字100不是量程也不是分度号编号，而是0℃对应的电阻欧姆数；温度高于0℃时电阻总是大于100Ω（正温度系数）。【易混点】实际测量中通过电桥把电阻变化转换成电信号，再由变送器输出4~20mA等标准信号远传。"},{"id":"basics_ic_0023","module":"basics","bank":"仪表与控制","type":"judge","stem":"功率量程高功率停棒的核功率是120%FP。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：功率量程高功率停棒（闭锁提棒）的核功率定值按题库口径约为109%FP，而不是120%FP，题干数值错误，应判错误。易被误导处：各种保护定值数值相近容易记混，抓住「停棒定值略高于满功率、120%明显偏高」的量级感即可判断；准确数值以电厂定值手册为准。【易混点】停棒与停堆是逐级升高的两级防线：核功率异常升高时先禁止提棒（阻止功率继续上升），进一步越限才触发紧急停堆——「先闭锁、后停堆」，层层设防。"},{"id":"basics_ic_0024","module":"basics","bank":"仪表与控制","type":"judge","stem":"安全注入属于专设安全设施功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件反应堆保护系统一节：当出现超出停堆保护能力的事故时，保护系统能启动相应的专设安全设施，课件所举示例即包括安全注入系统、安全壳喷淋系统——安全注入是专设安全设施的重要功能，事故时向堆芯注入含硼水，保证堆芯淹没和冷却，故说法正确。易被误导处：安注不只是「注水冷却」，注入的是含硼水，同时引入负反应性，冷却与抑制链式反应并举。【易混点】专设安全设施还包括安喷、辅助给水等；正常运行的硼水补给属化容系统功能——同为加硼，目的和归属不同。"},{"id":"basics_ic_0025","module":"basics","bank":"仪表与控制","type":"judge","stem":"核电厂仪表与控制系统的功能可以归纳为三种：即监视功能、控制功能和保护功能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件仪表控制系统功能一节原文：核电厂仪表与控制系统的功能可归纳为三种类型，即监视功能、控制功能和保护功能——监视（测量、显示、报警）、控制（过程调节回路）、保护（越限时停堆并启动专设安全设施），题干与课件一致，故说法正确。易被误导处：容易漏掉「监视」或额外加上「通讯」「记录」凑成四五种，记住是三大功能。【易混点】电站计算机系统承担数据采集、显示、报警、事故追忆等监视功能，在线开环运行、不参与控制——监视与控制可由不同系统分担。"},{"id":"basics_ic_0026","module":"basics","bank":"仪表与控制","type":"judge","stem":"前馈是闭环控制系统。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件控制通道类型一节：开环通道即前馈控制——干扰变量直接作用于控制变量，被控变量不反馈给控制器；闭环（反馈）通道则是被控变量被监测并反馈给控制器，随时与整定值比较后实施控制。故「前馈是闭环控制系统」错误。易被误导处：前馈看似「提前、高级」，容易误当成闭环的改进，其实它不检查控制效果，被控量是否达标只能由操作人员判断，这正是开环的本质。【易混点】前馈响应快但精度差，闭环精度好但响应慢，工程上常用前馈+反馈复合控制取长补短。"},{"id":"basics_ic_0027","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽发生器液位计根据量程分为宽量程液位计和窄量程液位计。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路液位测量一节：蒸汽发生器设置宽、窄量程两种液位计测量液位——题干「根据量程分为宽量程和窄量程」正确。课件还指出宽量程液位计按冷态标定，供蒸汽发生器充排水时用；窄量程用于功率运行阶段的水位监视、调节与保护。易被误导处：两种液位计不是互为备用的冗余关系，而是用途分工——冷态充排水看宽量程，功率运行看窄量程。【易混点】蒸汽发生器液位（窄量程）是冗余通道测量的典型参数，以满足单一故障准则。"},{"id":"basics_ic_0028","module":"basics","bank":"仪表与控制","type":"judge","stem":"DCS系统按功能层次可划分为四层： Level 0为工艺接口层，Level 1为控制处理层，Level 2为操作监视层，Level 3为生产管理层。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：DCS按功能层次划分为四层——Level 0工艺接口层（现场仪表与执行器）、Level 1控制处理层（完成调节和逻辑运算）、Level 2操作监视层（操作员站、工程师站）、Level 3生产管理层（全厂生产管理），题干四层名称与顺序均正确，故说法正确。易被误导处：四层顺序不能颠倒，越靠下层越贴近现场，越靠上层越贴近管理。【易混点】DCS的精髓是「危险分散、管理（显示）集中」：控制分散到各控制站，监视操作集中于操作员站。"},{"id":"basics_ic_0029","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽排放控制系统只有一种模式，即蒸汽压力控制模式。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：蒸汽排放（旁排）控制系统并非只有一种模式，按题库口径有蒸汽压力控制和一回路平均温度控制两种模式——汽机负荷骤降（甩负荷、脱扣）时经旁排阀把多余蒸汽排向冷凝器和除氧器，维持一二回路功率平衡，避免核蒸汽供应系统温度压力超过保护定值，故题干说法错误。易被误导处：模式选择与机组状态（功率水平、旁排阀可用性）有关，并非固定单一模式。【易混点】旁排的使命是「替汽机吃汽」：负荷骤降时消化汽机吃不了的蒸汽，尽量避免主蒸汽安全阀动作。"},{"id":"basics_ic_0030","module":"basics","bank":"仪表与控制","type":"judge","stem":"汽轮发电机组通过汽轮机调节系统实现机组转速和负荷调节。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件汽轮机调节保护系统一节：汽轮机调节系统根据机组负荷的变化调节进入汽轮机的蒸汽量，在稳定工况下保证转速不变且为规定值，负荷变化时保证转速偏差不超过规定范围——即通过汽轮机调节系统实现转速和负荷调节，题干正确。易被误导处：转速调节与负荷调节是同一手段（调进汽量）的两个方面——并网前调转速、并网后带负荷。【易混点】调节系统管正常运行自动调节；保护系统在故障或调节失灵时安全停机，脱扣信号还可传给反应堆保护系统参与停堆。"},{"id":"basics_ic_0031","module":"basics","bank":"仪表与控制","type":"judge","stem":"仪表能够测量的最大输入量与最小输入量之间的范围称作仪表的量程范围，简称量程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：仪表能够测量的最大输入量与最小输入量之间的范围称作量程范围，简称量程——如量程0~20MPa的压力表，其量程即20MPa，题干与该定义一致，故说法正确。易被误导处：量程是「范围」而不是「上限值」，0~20MPa与10~20MPa上限相同但测量范围不同。【易混点】量程（最大示值/满度值）是计算引用误差的基准——引用误差=示值误差/最大示值，仪表精度等级即按最大引用误差划分。"},{"id":"basics_ic_0032","module":"basics","bank":"仪表与控制","type":"judge","stem":"流体流经节流装置时遵循伯努力方程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件一回路流量测量一节：流量测量采用孔板、喷嘴、文丘利管等一次元件建立差压，且流量与ΔP的平方根成正比——这一节流原理的理论基础正是伯努利方程：流体流经节流装置时截面收缩、流速增大、静压降低，在节流件前后形成差压，故说法正确。易被误导处：流速大处压力低，与「流速大压强大」的直觉相反，这正是伯努利方程的核心结论。【易混点】伯努利方程描述沿流线的能量守恒——动能、压力能、位能之和不变，节流过程只是能量形式的转换。"},{"id":"basics_ic_0033","module":"basics","bank":"仪表与控制","type":"judge","stem":"所谓控制就是为了达到一定的目的，对生产过程的设备进行控制操作，使其满足生产过程要求。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件控制的基本概念一节：控制必须连续地补偿控制变量因干扰或过程负荷变化而引起的一切改变——通过测量部件、比较器、控制器、执行机构构成的回路，对生产过程的设备进行控制操作，使其满足生产过程要求，题干定义与课件思想一致，故说法正确。易被误导处：控制不只是「开关设备」，其本质是不断检测被控量与给定值的偏差并消除偏差的动态过程。【易混点】完整控制通道六要素：测量部件、定值器、比较器、控制器、执行机构、被控对象，常考名称与作用对应。"},{"id":"basics_ic_0034","module":"basics","bank":"仪表与控制","type":"judge","stem":"蒸汽发生器水位调节系统的执行器是给水调节阀和给水泵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件蒸汽发生器水位控制系统一节：水位控制的基本功能之一是「通过控制给水阀和给水泵，使蒸汽发生器的水位满足运行工况的要求」——给水调节阀（改变开度）和给水泵（改变转速）共同调节给水流量，两者都是执行器，题干正确。易被误导处：不要以为执行器只有调节阀，泵的转速调节同样承担流量控制任务。【易混点】水位控制事关安全：水位过高使出口蒸汽含水量超标、加剧汽机冲蚀；过低会使换热管顶部裸露，影响堆芯热量导出。"},{"id":"basics_ic_0035","module":"basics","bank":"仪表与控制","type":"judge","stem":"按安全等级划分，DCS系统设备可以分为安全级设备和非安全级设备。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件仪控系统安全分级一节：仪表和控制系统的供电设备按对电厂安全的重要性分为安全级设备和非安全重要设备两级；从是否承担核安全功能、是否须满足1E级要求的角度归纳，DCS系统设备可分为安全级和非安全级两类，题干正确。易被误导处：仪控设备本身的分级严格说是三级——安全级、安全有关的设备、非安全重要设备，「安全级/非安全级」是按大类粗分。【易混点】安全级（1E级）设备须满足单一故障准则，采用冗余、实体分隔、电气隔离，并能定期试验。"},{"id":"basics_ic_0036","module":"basics","bank":"仪表与控制","type":"judge","stem":"稳压器下部电加热器分为通断式电加热器和比例式电加热器两种类型。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：稳压器下部（浸没于水中）的电加热器分为通断式（开关式）和比例式两种——比例式由压力调节器连续调节功率，用于压力精细调节；通断式按整定值分组投切，用于粗调、升温及热备用，题干正确。易被误导处：两类加热器不是按功率大小或位置区分，而是按控制方式区分——「比例式连续调节、通断式分组投切」。【易混点】稳压器压力调节全景：压力低投电加热器，压力高开喷淋阀；超出调节范围由安全阀按整定值泄压——调节与保护层次分明。"},{"id":"basics_ic_0037","module":"basics","bank":"仪表与控制","type":"judge","stem":"汽轮机旁路系统运行时，汽机进气压力信号不能代表二回路总负荷，这时候人为设置一个功率数值，称为最终功率整定值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"课件未直接覆盖：汽机旁排系统运行时，大量蒸汽不经汽轮机而直接排向冷凝器，此时汽机进汽压力信号已不能代表二回路总负荷，控制系统需人为设置一个功率数值作为控制基准，即最终功率整定值，故说法正确。易被误导处：「最终功率整定值」是人为设定值而非实测参数，它决定旁排流量控制和一回路功率控制的参照水平。【易混点】旁排的目的是维持一二回路功率平衡、避免压力超定值；汽机负荷恢复、旁排阀关闭后，控制再切回正常负荷信号。"},{"id":"basics_ic_0038","module":"basics","bank":"仪表与控制","type":"judge","stem":"控制对象：被控制的设备或生产过程为控制对象或被控制过程。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件控制的基本概念一节原文：「控制对象：被控制的设备或生产过程为控制对象或被控制过程」，并举例核电厂功率控制系统中的控制对象是反应堆装置——题干即该原文，故说法正确。易被误导处：控制对象是「设备或生产过程」这样的实体，不是「参数」——被控制的量（功率、水位、压力）称为被控制量（被调量），是控制对象的输出量。【易混点】术语链：控制对象→被控制量→测量值→比较器→控制器→执行机构→作用于控制对象，闭环由此形成。"},{"id":"basics_ic_0043","module":"basics","bank":"仪表与控制","type":"single","stem":"热电阻PT100，在温度摄氏度0°C时（     ）","options":["电阻为100Ω","电阻0Ω","电流4mA","电压0V"],"answer":["A"],"score":null,"source":"official","origin":"仪表.xls","explanation":"依据课件测量方法一节：铂电阻阻值与温度的关系为Rt=R0(1+at+bt²)，R0即0℃时的电阻值——PT100命名的含义就是「0℃时标称电阻为100Ω」，选A。不选B：金属导体电阻恒不为零，铂电阻0℃时绝不是0Ω；不选C：4mA是变送器输出的标准电流信号下限，与电阻无关；不选D：电压0V是电路参数，也不是PT100的电阻特性。【易混点】PT100电阻随温度升高而增大（正温度系数），测温时经电桥转换为电信号、变送器输出标准信号远传。"},{"id":"basics_op_0001","module":"basics","bank":"运行概述","type":"judge","stem":"我国自主知识产权三代核电机组“华龙一号”是压水堆。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"课件未直接覆盖：华龙一号（HPR1000）是我国自主研发、具有自主知识产权的三代核电技术，堆型为压水堆，采用能动与非能动相结合的安全设计和双层安全壳，已在福清5、6号机组及海外项目建成投运，故说法正确。易被误导处：不要因“非能动”联想到高温气冷堆等特殊堆型，华龙一号的主体仍是成熟的压水堆技术路线。【易混点】课件第21页提到华龙一号的非能动安全系统主要设备也布置在核岛（反应堆厂房）内。"},{"id":"basics_op_0002","module":"basics","bank":"运行概述","type":"judge","stem":"汽轮发电机组并入电网才能将发出的电能源源不断地输送给电网。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件《核电厂运行概述》第170、185页：发电机并网是机组升功率流程中的关键操作步骤（“（19）发电机并网”），停机时则“与电网联系解列发电机”。发电机只有并入电网、与电网保持同步运行，发出的电能才能源源不断地输送给电网，孤立的机组无法向电网稳定供电，故说法正确。易被误导处：并网前机组也可带厂用电运行，但要向电网送电必须先并网。【易混点】并网要求发电机与电网的电压、频率、相位一致，否则会产生同步冲击电流。"},{"id":"basics_op_0003","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆的特点之一为不停堆换料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"课件未直接覆盖：重水堆（如CANDU）采用压力管式结构，每根燃料通道可单独定位，由换料机在堆两端对接操作，且中子屏蔽由重水层提供，因此能在反应堆功率运行状态下更换燃料，实现不停堆换料，这是重水堆区别于压水堆（须停堆换料）的标志性特点，故说法正确。易被误导处：不停堆换料依靠的是压力管式结构布置，而非重水本身的物性。【易混点】不停堆换料使重水堆可边燃耗边补充新燃料，因此能用天然铀作燃料维持堆芯装量平衡。"},{"id":"basics_op_0004","module":"basics","bank":"运行概述","type":"judge","stem":"功率运行期间发生链式裂变反应的核燃料装载在反应堆压力容器中。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第24页：“反应堆压力容器——堆芯装载、发生核裂变、生物屏蔽、压力边界”，核燃料组件装载在压力容器内的堆芯中，功率运行期间的链式裂变反应就在压力容器内进行并释放核能，故说法正确。易被误导处：燃料只在换料时经燃料水池转运至燃料厂房，正常运行时燃料始终在压力容器内。【易混点】压力容器是第二道屏障（一回路压力边界）的核心设备，布置在核岛反应堆厂房（安全壳）内。"},{"id":"basics_op_0005","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆核电厂绝大多数使用过热蒸汽。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第57页：“绝大多数核电厂使用饱和蒸汽，而现代化石燃料电厂使用过热蒸汽”。压水堆蒸汽发生器二次侧产生的是饱和蒸汽，不带过热度，故“压水堆核电厂绝大多数使用过热蒸汽”说法错误。易被误导处：二回路设有汽水分离再热器，但它只是对高压缸排汽进行汽水分离和再热，不改变新蒸汽为饱和蒸汽的事实。【易混点】因饱和蒸汽焓值低，同容量核电汽轮机、蒸汽管道的尺寸都比火电机组大。"},{"id":"basics_op_0006","module":"basics","bank":"运行概述","type":"single","stem":"以下哪一项不属于核安全三要素（   ）。","options":["反应性控制","余热导出","防止商用大飞机撞击","放射性包容"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第203~204页，核电厂基本安全功能是“控制反应性、排出堆芯热量、包容放射性物质和控制运行排放”，归纳为核安全三要素：反应性控制、余热导出、放射性包容。“防止商用大飞机撞击”属于外部事件防护设计要求，不在三要素之列，故选C。不选A(反应性控制)、B(余热导出)、D(放射性包容)：三者正是核安全三要素内容，属“属于”项，与题意“不属于”相反。【易混点】三要素靠三道屏障与专设安全设施落实：燃料包壳、一回路压力边界、安全壳。"},{"id":"basics_op_0007","module":"basics","bank":"运行概述","type":"judge","stem":"核电厂装卸料操作都是在充满水的反应堆水池中水下操作的。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件《核电厂水化学基础》第12页：水在核电厂“在换料和燃料贮存过程中用作屏蔽材料”。核电厂装卸料在充满水的反应堆水池中水下进行，水层既提供辐射屏蔽又带走燃料余热，保证操作安全，故说法正确。易被误导处：水下操作不是为了别的目的，核心就是利用水对γ射线和中子的屏蔽与冷却能力。【易混点】换料水池的水一般含硼，兼有保证停堆几何（临界）安全的作用。"},{"id":"basics_op_0008","module":"basics","bank":"运行概述","type":"judge","stem":"非能动安全系统需要持续的电源才能保证系统设计功能。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"课件未直接覆盖：非能动安全系统的“非能动”指依靠重力、自然循环、压缩气体膨胀等自然力和固有物理过程实现安全功能，不需要外部电源、泵或风机持续驱动，这正是其在全厂断电事故（如福岛事故）中的价值所在，故“需要持续的电源”说法错误。易被误导处：非能动系统并非完全不用电（监测仪表仍需供电），但实现其设计功能不依赖持续电源。【易混点】华龙一号、AP1000均采用能动与非能动相结合的安全设计理念。"},{"id":"basics_op_0009","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆中作为慢化剂的重水的价格昂贵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件《核电厂水化学基础》第12页：氘在自然界氢中仅占0.015%，“普通水中重水仅占0.015%”。重水必须从海量普通水中经同位素分离逐级浓缩，工艺复杂、能耗巨大、产量有限，因此价格昂贵，说法正确。易被误导处：别把重水当普通水，它是重水堆电厂的贵重资产，运行中须严格监测重水损耗与泄漏。【易混点】课件还规定重水同位素纯度指标：冷却剂重水≥98.6%、慢化剂重水≥99.75%，防轻水漏入造成降级。"},{"id":"basics_op_0010","module":"basics","bank":"运行概述","type":"judge","stem":"在100%满功率稳定运行时，反应堆是处于临界状态的。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"依据课件第52页：“反应堆只有在临界下，才能实现自持链式反应”。临界时有效增殖因数等于1，中子产生率与消失率平衡，功率稳定不变；100%满功率稳定运行正是这种自持链式反应的稳态，反应堆处于临界状态，故说法正确。易被误导处：临界不等于“危险”，它只是功率稳定运行的必要条件，停堆状态才是次临界。【易混点】升降功率时反应堆短暂超临界或次临界，稳定后仍回到临界状态。"},{"id":"basics_op_0011","module":"basics","bank":"运行概述","type":"judge","stem":"福岛核电厂在海啸开始时反应堆自动保护紧急停堆。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，福岛机组是地震时自动紧急停堆，随后海啸淹没应急电源导致全厂断电，事故才逐步恶化。"},{"id":"basics_op_0012","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆核电厂启动需要对一回路进行充水排气。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，启动前须对一回路充水排气，排出系统内气体，防止泵汽蚀和流动滞塞，保证堆芯冷却。"},{"id":"basics_op_0013","module":"basics","bank":"运行概述","type":"judge","stem":"钠冷快堆使用的金属钠是不活泼金属。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，金属钠是化学性质活泼的碱金属，遇水剧烈反应甚至燃烧爆炸，与空气也会反应，须严格隔水隔气保存。"},{"id":"basics_op_0014","module":"basics","bank":"运行概述","type":"judge","stem":"核安全三要素是指反应性控制、余热导出、放射性包容。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，核安全三要素即反应性控制、余热导出、放射性包容，核电厂设计运行均围绕保障这三要素展开。"},{"id":"basics_op_0015","module":"basics","bank":"运行概述","type":"judge","stem":"两个'零容忍'是指对违规操作零容忍、对弄虚作假零容忍。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，两个零容忍指对违规操作零容忍、对弄虚作假零容忍，是核安全文化的重要内容。"},{"id":"basics_op_0016","module":"basics","bank":"运行概述","type":"judge","stem":"汽轮发电机组并网才能将发出的电能输送给电网。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，发电机必须并网后才能向电网输送电能，并网后机组与电网保持同步运行。"},{"id":"basics_op_0017","module":"basics","bank":"运行概述","type":"judge","stem":"反应堆达临界操作是核电厂重要操作，需要遵守运行规程的规定。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，达临界是反应堆升功率过程中的重要操作，必须严格遵守运行规程，在监测下逐步逼近并确认临界。"},{"id":"basics_op_0018","module":"basics","bank":"运行概述","type":"judge","stem":"反应堆停闭后，堆芯不再有热量，可以立即停止冷却。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，停堆后裂变产物衰变仍持续释放衰变热，必须保持堆芯冷却，否则燃料会过热损坏。"},{"id":"basics_op_0019","module":"basics","bank":"运行概述","type":"judge","stem":"轻核聚变的特点是不产生放射性。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，轻核聚变产物主要是稳定的氦核，不产生长寿命高放废物，放射性影响小。"},{"id":"basics_op_0020","module":"basics","bank":"运行概述","type":"judge","stem":"压水堆最大的特点是核燃料增殖。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，压水堆的主要特点是以轻水兼作冷却剂和慢化剂、一二回路分开；核燃料增殖是快堆的特点。"},{"id":"basics_op_0021","module":"basics","bank":"运行概述","type":"judge","stem":"高温气冷堆核电站发电效率比压水堆核电站高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，高温气冷堆氦气出口温度可达700℃以上，蒸汽参数高，热力循环效率高于压水堆核电厂。"},{"id":"basics_op_0022","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂在汽轮机中做完功的乏汽的热量最终由以下哪种介质带走？____","options":["一回路冷却剂","二回路凝结水","三回路海水或冷却塔"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"乏汽在凝汽器中凝结放热，其热量最终由海水或冷却塔循环水等三回路冷却水带走。"},{"id":"basics_op_0023","module":"basics","bank":"运行概述","type":"single","stem":"熔盐堆的核燃料是以下哪种：____","options":["液态熔盐燃料","固体燃料棒","石墨燃料球"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"熔盐堆的核燃料以液态熔盐形式存在，燃料溶解在高温熔盐中，既是核燃料又起冷却剂作用。"},{"id":"basics_op_0024","module":"basics","bank":"运行概述","type":"single","stem":"快堆的冷却剂一般为以下哪种：____。","options":["金属钠","轻水","重水","氮气"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"快堆一般用液态金属钠作冷却剂，钠导热性好、对中子慢化作用小，有利于维持快中子能谱。"},{"id":"basics_op_0025","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂转变为电能的能量的最初来源于以下 ____ 。","options":["取水口的潮汐能","核燃料的裂变反应","太阳能"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"核电厂能量最初来源于核燃料的链式裂变反应，核能经热能和机械能逐级转换为电能。"},{"id":"basics_op_0026","module":"basics","bank":"运行概述","type":"single","stem":"发生切尔诺贝利核事故的核电站是以下哪种堆型？_____","options":["压水堆","石墨堆","重水堆","沸水堆"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"切尔诺贝利核电厂是石墨慢化的RBMK沸水堆，正空泡系数和控制棒设计缺陷是事故的重要原因。"},{"id":"basics_op_0027","module":"basics","bank":"运行概述","type":"single","stem":"发生福岛核事故的核电站是以下哪种堆型？____","options":["压水堆","重水堆","沸水堆","气冷堆"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"福岛第一核电厂是沸水堆，在反应堆内直接产生蒸汽推动汽轮机，属于单回路循环。"},{"id":"basics_op_0028","module":"basics","bank":"运行概述","type":"single","stem":"以下哪个设备安装在核岛厂房。____","options":["主给水泵","汽轮发电机组","主泵","应急柴油机"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"主泵布置在核岛反应堆厂房内，驱动一回路冷却剂循环；汽轮发电机组位于常规岛。"},{"id":"basics_op_0029","module":"basics","bank":"运行概述","type":"single","stem":"热停堆模式时，满足如下条件：反应堆冷却剂系统压力在15.4MPa；稳压器压力和____处于自动控制；反应堆冷却剂系统的平均温度由大气释放阀控制在约290℃；蒸汽发生器水位由辅助给水泵维持在零负荷水位。","options":["硼浓度","温度","水位"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"热停堆模式下稳压器压力和水位均应处于自动控制，一回路平均温度由大气释放阀控制在约290℃。"},{"id":"basics_op_0030","module":"basics","bank":"运行概述","type":"single","stem":"在_____已经建立之后，反应堆冷却剂的硼浓度在明显变化之前，需启动稳压器电加热器，允许稳压器喷淋阀调节稳压器至反应堆冷却系统之间的硼浓度。","options":["稳压器汽腔","稳压器水位","蒸发器水位"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"稳压器汽腔建立后才可投入电加热器，并用稳压器喷淋调节稳压器与一回路间的硼浓度平衡。"},{"id":"basics_op_0031","module":"basics","bank":"运行概述","type":"judge","stem":"中子轰击放射性同位素的重核，发生裂变反应，重核分解成两个轻一些的原子核，释放能量并产生1个中子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，重核裂变时释放的新中子平均为2～3个，而不是1个，链式反应正是靠这些中子维持。"},{"id":"basics_op_0032","module":"basics","bank":"运行概述","type":"single","stem":"我国自主知识产权三代核电机组'华龙一号'是以下哪种堆型。____","options":["重水堆","快堆","压水堆","熔盐堆"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"华龙一号是我国自主知识产权的三代压水堆机组，采用双安全壳和能动加非能动安全设计。"},{"id":"basics_op_0033","module":"basics","bank":"运行概述","type":"single","stem":"下列哪个堆型属于三代堆。____","options":["华龙一号","M310","高温气冷堆","熔盐堆"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"华龙一号属于三代压水堆；M310为二代堆型，高温气冷堆和熔盐堆属于四代堆型。"},{"id":"basics_op_0034","module":"basics","bank":"运行概述","type":"single","stem":"下列哪个设备布置在常规岛厂房。_____","options":["蒸汽发生器","汽轮发电机组","稳压器安全阀","主泵"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"常规岛主要布置汽轮发电机组及其辅助设备，蒸汽发生器、主泵、稳压器安全阀等均在核岛。"},{"id":"basics_op_0035","module":"basics","bank":"运行概述","type":"single","stem":"核电厂推动汽轮机做功发电的蒸汽是以下那个设备中产生的。_____","options":["稳压器","压力容器","蒸汽发生器"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"蒸汽发生器是一二回路的热交换设备，产生的二回路蒸汽推动汽轮机做功发电。"},{"id":"basics_op_0036","module":"basics","bank":"运行概述","type":"single","stem":"稳压器安全阀的作用是 ____ 。","options":["保证一回路不超压","排出堆芯多余的冷却剂","冷却堆芯","一回路充水"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"稳压器安全阀是一回路超压保护装置，压力超过整定值时自动开启泄压，保证一回路不超压。"},{"id":"basics_op_0037","module":"basics","bank":"运行概述","type":"single","stem":"下列哪一项属于压水堆核电厂的特点____ 。","options":["反应堆超临界","蒸汽发生器产生的是饱和蒸汽","停堆后停止释热"],"answer":["B"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"压水堆一二回路分开，蒸汽发生器产生的二回路蒸汽是饱和蒸汽，这是压水堆的重要特点。"},{"id":"basics_op_0038","module":"basics","bank":"运行概述","type":"single","stem":"蒸汽发生器安装在 ____ 。","options":["反应堆厂房","汽轮机厂房","燃料厂房"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"蒸汽发生器是一回路主设备，与反应堆压力容器、主泵、稳压器一起安装在反应堆厂房内。"},{"id":"basics_op_0039","module":"basics","bank":"运行概述","type":"single","stem":"正常情况下，压水堆核电站只在_____ 中存在放射性。","options":["一回路","二回路","三回路"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正常运行时放射性只存在于一回路，二、三回路无放射性，除非蒸汽发生器传热管发生泄漏。"},{"id":"basics_op_0040","module":"basics","bank":"运行概述","type":"single","stem":"压水堆核电厂，链式裂变反应是由  _____ 维持的。","options":["热中子","快中子","γ射线"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"压水堆以轻水慢化中子，热中子引发铀-235裂变的截面大，链式裂变反应由热中子维持。"},{"id":"basics_op_0041","module":"basics","bank":"运行概述","type":"single","stem":"原子是由带正电的_____ 和带负电的电子组成。","options":["原子核","量子","中子"],"answer":["A"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"原子由带正电的原子核和绕核运动的带负电电子组成，整体呈电中性。"},{"id":"basics_op_0042","module":"basics","bank":"运行概述","type":"single","stem":"以下_____，是我国目前核电发展政策。","options":["火电为主、大力发展水电、核电为补充","在保证安全的基础上适度发展核电","积极安全有序发展核电"],"answer":["C"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"我国当前核电发展政策是积极安全有序发展核电，在保证安全的基础上适度发展核电是此前表述。"},{"id":"basics_op_0043","module":"basics","bank":"运行概述","type":"judge","stem":"蒸汽发生器倒U形管部位进行一二回路热交换。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，一回路冷却剂流经蒸汽发生器倒U形传热管束，将热量传给管外二回路给水产生蒸汽。"},{"id":"basics_op_0044","module":"basics","bank":"运行概述","type":"judge","stem":"核电厂绝大多数使用过饱和蒸汽。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，压水堆核电厂使用蒸汽发生器产生的饱和蒸汽推动汽轮机做功，并非过饱和蒸汽。"},{"id":"basics_op_0045","module":"basics","bank":"运行概述","type":"judge","stem":"正常运行时，压水堆核电厂汽轮机厂房有放射性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"错误，正常运行时二回路汽水无放射性，汽轮机厂房（常规岛）本质上不存在放射性，放射性集中在一回路。"},{"id":"basics_op_0046","module":"basics","bank":"运行概述","type":"judge","stem":"重水堆的慢化剂是重水。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"运行概述.xlsx","explanation":"正确，重水堆以重水作慢化剂，重水中子吸收截面小、慢化性能好，还可兼作冷却剂。"},{"id":"basics_th_0003c","module":"basics","bank":"热工水力学","type":"single","stem":"传热的三种基本方式是（   ）。","options":["导热、对流换热和核衰变放热","相变换热、对流和热辐射","导热、对流和热辐射","导热、热辐射和沸腾换热"],"answer":["C"],"score":null,"source":"adapted","origin":"官方填空题 basics_th_0003 改编","explanation":"传热的三种基本方式为：导热（依靠物体内部分子、原子及自由电子等微观粒子的热运动传递热量，无宏观位移）、对流（依靠流体微团的宏观运动携带热量，分自然对流与强制对流）、热辐射（以电磁波形式传递能量，不需要任何介质）。蒸发、沸腾、冷凝等相变换热是对流换热的具体形式，核衰变放热属于热源而非传热方式，都不能与导热、对流并列作为基本方式。"},{"id":"basics_th_0004c","module":"basics","bank":"热工水力学","type":"single","stem":"反应堆热工分析中通常所说
