<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a6feb">
<meta name="robots" content="noindex, nofollow">
<title>核电入职刷题</title>
<style>
:root{
  --bg:#f2f4f8; --card:#fff; --text:#1c2330; --sub:#6b7486; --line:#e5e9f0;
  --pri:#1a6feb; --pri-weak:#e8f1fe; --ok:#18a058; --ok-weak:#e8f7ef;
  --bad:#d93a3a; --bad-weak:#fdeeee; --warn:#d97706; --warn-weak:#fdf3e3;
  --gen:#7c3aed; --gen-weak:#f1eafe; --note:#0e9488; --note-weak:#e5f7f5;
  --shadow:0 1px 4px rgba(16,24,40,.08); --radius:12px;
}
[data-theme="dark"]{
  --bg:#12161d; --card:#1c222c; --text:#e7ebf2; --sub:#8d97a8; --line:#2a323f;
  --pri:#4d8dfa; --pri-weak:#1a2740; --ok:#2eb872; --ok-weak:#12291d;
  --bad:#f06d6d; --bad-weak:#331a1a; --warn:#e9a23b; --warn-weak:#332711;
  --gen:#a78bfa; --gen-weak:#241d3a; --note:#2eb8a6; --note-weak:#12302c;
  --shadow:0 1px 4px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.55;}
body{padding-bottom:calc(58px + env(safe-area-inset-bottom));}
#hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);}
#hdr .back{width:34px;height:34px;border:none;background:none;color:var(--pri);
  font-size:22px;line-height:1;flex:none;cursor:pointer;padding:0;}
#hdr .title{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hdr .hbtn{border:none;background:none;color:var(--pri);font-size:13px;cursor:pointer;padding:6px 4px;flex:none;}
#view{padding:14px 12px 20px;max-width:720px;margin:0 auto;}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
#nav .tab{flex:1;border:none;background:none;color:var(--sub);font-size:11px;
  cursor:pointer;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
#nav .tab .ic{font-size:20px;line-height:1;}
#nav .tab.on{color:var(--pri);font-weight:600;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;}
.mcard{display:block;width:100%;text-align:left;border:none;cursor:pointer;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;color:var(--text);}
.mcard .mtop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mcard .mic{font-size:26px;}
.mcard .mname{font-size:18px;font-weight:700;flex:1;}
.mcard .mgo{color:var(--sub);font-size:13px;}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--pri),#67b0ff);border-radius:4px;transition:width .3s;}
.mmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--sub);}
/* 未做专练入口：跨模块 / 单模块共用 */
.undone-card{display:block;width:100%;text-align:left;border:none;cursor:pointer;color:var(--text);
  background:linear-gradient(135deg,var(--pri-weak),var(--card) 72%);
  border:1px solid var(--pri);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:13px 15px;margin-bottom:12px;}
.undone-card:active{opacity:.8;}
.undone-card .utop{display:flex;align-items:center;gap:8px;}
.undone-card .uic{font-size:19px;flex:none;}
.undone-card .uname{font-size:16.5px;font-weight:700;flex:1;min-width:0;}
.undone-card .ucnt{font-size:13.5px;color:var(--pri);font-weight:700;flex:none;}
.undone-card .umeta{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:12.5px;color:var(--sub);}
.undone-card .uslay{font-size:12px;color:var(--sub);margin-top:5px;opacity:.85;}
.undone-card.cleared{border-style:dashed;}
.undone-card.cleared .ucnt{color:var(--ok);}
.brow{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.brow:last-child{border-bottom:none;}
.brow .binfo{flex:1;min-width:0;}
.brow .bname{font-weight:600;font-size:15.5px;}
.brow .bcount{font-size:12.5px;color:var(--sub);margin-top:2px;}
.brow .bprog{font-size:12.5px;color:var(--pri);flex:none;}
.sec-title{font-size:14px;font-weight:600;color:var(--sub);margin:16px 2px 8px;}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px;}
.mode-btn{border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:10px 2px;font-size:12.5px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;}
.mode-btn .mi{font-size:19px;}
.mode-btn.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);font-weight:600;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
.chip.on{border-color:var(--pri);color:var(--pri);background:var(--pri-weak);font-weight:600;}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qno{font-size:13px;color:var(--sub);}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex:none;}
.t-single{background:var(--pri-weak);color:var(--pri);}
.t-multi{background:var(--warn-weak);color:var(--warn);}
.t-judge{background:var(--note-weak);color:var(--note);}
.s-official{background:var(--ok-weak);color:var(--ok);}
.s-wrongmark{background:var(--bad-weak);color:var(--bad);}
.s-wrongx{background:var(--bad);color:#fff;}
.s-favmark{background:var(--warn-weak);color:var(--warn);}
.s-autofav{background:var(--gen-weak);color:var(--gen);}
.s-ppt-notes{background:var(--note-weak);color:var(--note);}
.s-generated{background:var(--gen-weak);color:var(--gen);}
.s-adapted{background:var(--note-weak);color:var(--note);}
.t-course{background:var(--pri-weak);color:var(--pri);}
.course-line{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:-4px 2px 10px;}
.course-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.course-nav .chip{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gate-card{text-align:center;padding:30px 16px;}
.gate-ic{font-size:40px;}
.gate-done{font-weight:700;font-size:17px;margin-top:8px;}
.gate-next{font-weight:700;font-size:16px;margin-top:16px;color:var(--pri);}
.stem{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);
  background:var(--card);border-radius:10px;padding:11px 12px;cursor:pointer;
  font-size:15.5px;line-height:1.5;text-align:left;color:var(--text);}
.opt .ol{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--sub);}
.opt.picked{border-color:var(--pri);background:var(--pri-weak);}
.opt.picked .ol{border-color:var(--pri);color:var(--pri);background:var(--pri-weak);}
.opt.right{border-color:var(--ok);background:var(--ok-weak);}
.opt.right .ol{border-color:var(--ok);color:#fff;background:var(--ok);}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-weak);}
.opt.wrongpick .ol{border-color:var(--bad);color:#fff;background:var(--bad);}
.opt.dim{opacity:.55;}
.judge-row{display:flex;gap:10px;}
.judge-btn{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  padding:14px;font-size:16px;font-weight:600;cursor:pointer;color:var(--text);}
.judge-btn.right{border-color:var(--ok);background:var(--ok-weak);color:var(--ok);}
.judge-btn.wrongpick{border-color:var(--bad);background:var(--bad-weak);color:var(--bad);}
.judge-btn.picked{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);}
.confirm-bar{margin-top:12px;}
.big-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;
  font-weight:600;cursor:pointer;background:var(--pri);color:#fff;}
.big-btn:disabled{opacity:.45;}
.big-btn.ghost{background:none;border:1.5px solid var(--line);color:var(--text);}
.feedback{border-radius:10px;padding:11px 13px;margin-top:13px;font-size:14.5px;line-height:1.55;}
.feedback.ok{background:var(--ok-weak);color:var(--ok);}
.feedback.bad{background:var(--bad-weak);color:var(--bad);}
.feedback b{font-weight:700;}
.expl{border-radius:10px;padding:11px 13px;margin-top:9px;font-size:14px;line-height:1.6;
  background:var(--pri-weak);color:var(--text);white-space:pre-wrap;}
.expl .elabel{font-size:12px;color:var(--sub);margin-bottom:4px;display:flex;gap:6px;align-items:center;}
.pbar-wrap{margin-bottom:12px;}
.pbar-wrap .ptxt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:5px;}
.qfoot{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:40;
  background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;
  padding:8px 12px;gap:8px;max-width:720px;margin:0 auto;}
body.no-nav .qfoot{bottom:0;}
.qfoot .fbtn{border:none;background:none;color:var(--sub);font-size:13px;cursor:pointer;
  padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;}
.qfoot .fbtn .fi{font-size:18px;}
.qfoot .fbtn.on{color:var(--warn);}
.qfoot .navbtn{flex:1;border:none;border-radius:9px;padding:10px 0;font-size:15px;
  font-weight:600;cursor:pointer;}
.qfoot .prev{background:var(--bg);color:var(--text);margin-right:2px;}
.qfoot .next{background:var(--pri);color:#fff;}
.qfoot .next:disabled{opacity:.4;}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;
  align-items:flex-end;}
.sheet{background:var(--card);width:100%;max-height:75vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 10px;font-size:16px;}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;}
.sq{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;cursor:pointer;color:var(--text);}
.sq.done-ok{background:var(--ok-weak);border-color:var(--ok);color:var(--ok);}
.sq.done-bad{background:var(--bad-weak);border-color:var(--bad);color:var(--bad);}
.sq.done{background:var(--pri-weak);border-color:var(--pri);color:var(--pri);}
.sq.cur{outline:2.5px solid var(--pri);outline-offset:1px;font-weight:700;}
.timer{font-size:13.5px;font-weight:600;color:var(--warn);background:var(--warn-weak);
  border-radius:14px;padding:3px 11px;}
.timer.danger{color:var(--bad);background:var(--bad-weak);}
.stat-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-cell{background:var(--card);border-radius:10px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);}
.stat-cell .v{font-size:21px;font-weight:700;color:var(--pri);}
.stat-cell .k{font-size:12px;color:var(--sub);margin-top:2px;}
.bank-stat{margin-bottom:10px;}
.bank-stat .bs-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.bank-stat .bs-top b{font-weight:600;}
.dailies{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px;}
.dailies .dbar{flex:1;background:var(--pri-weak);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
.dailies .dbar>div{position:absolute;bottom:0;left:0;right:0;background:var(--pri);border-radius:3px 3px 0 0;}
.dailies .dbar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:var(--sub);white-space:nowrap;}
.dailies-wrap{padding-bottom:20px;}
.search-input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:15px;margin-bottom:10px;outline:none;}
.search-input:focus{border-color:var(--pri);}
.res-item{padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.res-item .rs{font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.res-item .rmeta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;}
.empty{ text-align:center;color:var(--sub);padding:44px 10px;font-size:14px;}
.empty .eic{font-size:40px;margin-bottom:8px;}
.score-circle{width:130px;height:130px;border-radius:50%;margin:6px auto 10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--pri);}
.score-circle.pass{border-color:var(--ok);}
.score-circle.fail{border-color:var(--bad);}
.score-circle .sv{font-size:34px;font-weight:800;}
.score-circle .sk{font-size:12px;color:var(--sub);}
.result-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.exam-setup label{display:block;font-size:13.5px;color:var(--sub);margin:12px 0 7px;}
.exam-setup .cnt-row{display:flex;gap:8px;}
.about{font-size:12.5px;color:var(--sub);line-height:1.7;text-align:center;padding:8px 0 4px;}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(28,35,48,.92);
  color:#fff;font-size:13.5px;border-radius:20px;padding:8px 18px;z-index:99;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:80vw;}
.toast.show{opacity:1;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mut{color:var(--sub);font-size:13px;}
h2.pg{font-size:19px;font-weight:700;margin:4px 2px 12px;}
.divider{height:1px;background:var(--line);margin:10px 0;}
button{font-family:inherit;}
input,button{-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<header id="hdr" style="display:none">
  <button class="back" id="btn-back">‹</button>
  <div class="title" id="hdr-title"></div>
  <button class="hbtn" id="btn-dk" title="夜间模式">◐</button>
</header>
<div id="view"></div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

试卷","type":"single","stem":"切尔诺贝利事故本质上从( )事故开始，继之失水事故，后果是严重的，但事故过程中尚未发现未知的现象，也就是说，这类事故也是可以避免的。","options":["控制棒落棒","反应性引入","失去厂外电源"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"切尔诺贝利事故本质是从反应性引入事故开始（正空泡系数+控制棒设计缺陷），继之失水，后果严重但可以避免。"},{"id":"basics_jc_0017","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"（ ），我国自行设计、建造的秦山核电站并网发电，结束了我国大陆无核电的历史。","options":["1970年2月8日","1991年12月15日","2021年1月30日"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"1991年12月15日我国自行设计建造的秦山核电站并网发电，结束中国大陆无核电历史。"},{"id":"basics_jc_0018","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"稳压器安全阀误开启保持在卡开位置属于哪种运行工况（ ）","options":["正常运行和运行瞬态","中等频度事件","稀有事件","极限事故"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"稳压器安全阀误开启并卡开属于稀有事件（发生概率低的设计瞬态），按运行工况分类处于第四类工况。"},{"id":"basics_jc_0021","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪项属于技术规格书中的不可识别泄漏。","options":["来自设备可能的泄漏，该泄漏预计将被收集（如稳压器安全阀的泄漏、压力容器密封环泄漏、一些密封阀泄漏）","收集在密封环路、可以进行测量的系统之间的泄漏","蒸汽发生器传热管泄漏","机组正常运行时存在的泄漏"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"蒸汽发生器传热管泄漏属于不可识别泄漏（无法确定具体泄漏源），是技术规格书重点限制的对象。"},{"id":"basics_jc_0022","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪一项属于压水堆核电厂与研究堆运行的共同特点。","options":["反应堆堆芯保护系统的原则是对功率、轴向功率分布、冷却剂的流量、温度和压力等确定一个允许的运行区间，当运行超过该区间限值时，实现紧急停堆","载硼运","汽轮机快速降负荷功能"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆核电厂与研究堆运行的共同特点是反应堆堆芯保护系统的原则一致（均要求可靠的反应性控制和保护）。"},{"id":"basics_jc_0023","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"技术规格书不适用于异常或事故工况，在这种工况下的安全保证是通过( )来实现的。","options":["事故程序","正常运行规程","操作单"],"answer":["A"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"技术规格书适用于正常运行，异常或事故工况下的安全通过事故程序（应急运行规程）来保证。"},{"id":"basics_jc_0024","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"核电厂的安全保障则包括核安全管理制度、核安全设计和( )三个方面。","options":["核安全理念","核安全法规","核安全文化"],"answer":["C"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"核电厂安全保障包括核安全管理制度、核安全设计和核安全文化三个方面。"},{"id":"basics_jc_0025","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"( )事件是指在核电厂功率运行、燃料更换、维修过程中频繁发生的事件。","options":["高频度","中等频度","低频度"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"中等频度事件指在功率运行、换料、维修过程中频繁发生的事件（如个别棒落棒、汽机跳闸等）。"},{"id":"basics_jc_0027","module":"basics","bank":"核电基础知识试卷","type":"single","stem":"下列哪一项属于压水堆核电厂运行特点（ ）","options":["反应堆超临界","反应堆内产生和积累了大量的放射性物质","停堆后停止释热"],"answer":["B"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"压水堆运行特点之一是反应堆内产生并积累大量放射性物质，停堆后仍持续释放衰变热。"},{"id":"basics_jc_0080","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"用余热排出系统维持反应堆冷却剂系统温度时，冷却剂温度不能超过160℃。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。余热排出系统运行时一回路温度上限通常为180℃（投入下限约160℃），并非不能超过160℃。"},{"id":"basics_jc_0081","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"压水堆核电厂运行有汽轮机快速降负荷功能。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。压水堆核电厂具有汽轮机快速降负荷（甩负荷）功能，配合蒸汽排放系统实现。"},{"id":"basics_jc_0082","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"沸水堆二回路介质没有放射性。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。沸水堆的蒸汽直接在堆芯产生并进入汽轮机，汽轮机侧介质带有放射性。"},{"id":"basics_jc_0083","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"α粒子没有静止质量，不带电荷，穿透力很强。应选择具有较大原子量的物质来屏蔽，比如铅板。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。该描述的是γ射线（无静止质量、不带电、穿透强、用铅等重物质屏蔽）；α粒子有质量、带正电、穿透力弱，一张纸即可屏蔽。"},{"id":"basics_jc_0084","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"国家核安全局对全国核设施安全实施统一监督，独立行使核安全监督权。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。国家核安全局（NNSA）对全国核设施安全实施统一监督，独立行使核安全监督权。"},{"id":"basics_jc_0087","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"稀有事件所产生的放射性污染会导致停止或者限制使用隔离半径以外的公用地区，失去冷却剂系统或安全壳屏蔽的功能。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。稀有事件的放射性后果较小，不至于导致隔离半径外公用地区停止使用；题中描述的是更严重事故（极限事故）的后果。"},{"id":"basics_jc_0088","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂准备启动时，必须至少有一台反应堆冷却剂泵或余热排出系统处于运行状态，才能开始稀释反应堆冷却剂的硼浓度。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。稀释硼浓度前必须至少有一台主泵或余热排出系统运行，保证硼充分混合、避免局部低硼。"},{"id":"basics_jc_0089","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"我国总的核安全目标为：在核动力厂中建立并保持对放射性危害的有效防御，以保护人员、社会和环境免受危害。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。这是我国总的核安全目标：建立并保持对放射性危害的有效防御，保护人员、社会和环境。"},{"id":"basics_jc_0091","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"我国的核安全法规体系中，第一层次是国务院行政法规。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。我国核安全法规体系第一层次是国家法律（如《核安全法》），第二层次才是国务院行政法规。"},{"id":"basics_jc_0092","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"技术规格书是机组正常运行时所必须遵守的技术条件，任何对技术规格书的偏离，甚至是暂时的偏离都必须得到国家核安全局(NNSA)的批准。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。技术规格书是运行必须遵守的技术条件，任何偏离（包括暂时偏离）都必须得到国家核安全局批准。"},{"id":"basics_jc_0094","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"快堆最大的特点是核燃料增殖。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。快堆最大的特点是核燃料增殖：快中子使U-238转变为Pu-239，可实现燃料增殖。"},{"id":"basics_jc_0095","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"技术规格书中监测要求部分与运行限制条件部分条数相同，即一条运行限制条件规范紧跟一条监测要求的形式。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。技术规格书中每条运行限制条件（LCO）都紧跟相应的监测要求（SR）。"},{"id":"basics_jc_0096","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"安全系统整定值是各种自动保护装置的触发点，它触发保护动作，以防止超过安全限值，并应付超设计基准事故。","options":null,"answer":["错误"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"错误。安全系统整定值用于防止超过安全限值，应对的是设计基准事故范围，并非超设计基准事故。"},{"id":"basics_jc_0098","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"核电厂棒控系统设计中，能够满足负荷变化率 ≤ ± 5%/min的负荷线性变化。","options":null,"answer":["正确"],"score":1.24,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。棒控系统设计能满足负荷线性变化率≤±5%/min的要求。"},{"id":"basics_jc_0099","module":"basics","bank":"核电基础知识试卷","type":"judge","stem":"当在各种运行模式或所指定的其他工况下，对技术规格书中运行限制条件的规定都要求遵从，如果不能满足其中的规定，则必须满足其相应的动作的要求。","options":null,"answer":["正确"],"score":0.62,"source":"official","origin":"核电基础知识试卷(1).docx","explanation":"正确。不满足运行限制条件时必须执行相应的动作（Action）要求，这是技术规格书的基本逻辑。"},{"id":"basics_th_0001","module":"basics","bank":"热工水力学","type":"judge","stem":"对流传热遵循牛顿冷却定律。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》第三章：对流换热的计算公式即牛顿冷却公式 q=h·Δt，热流量与对流传热系数h和壁面—流体温差成正比，故说法正确。易被误导处：有人以为对流传热需另立定律，实际上工程上的对流换热正是按牛顿冷却定律、用经验系数h来计算的。【易混点】导热用傅里叶定律，辐射换热用斯蒂芬—玻尔兹曼定律，三种传热方式的定律勿混。"},{"id":"basics_th_0002","module":"basics","bank":"热工水力学","type":"judge","stem":"固体导热遵循傅里叶定律。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》第三章：'固体中的热传递完全取决于导热'，平板导热量与热导率、两侧温差成正比，与厚度成反比，此即傅里叶导热定律，故说法正确。易被误导处：不要与对流的定律混淆——对流换热按牛顿冷却定律计算。【易混点】导热依靠分子动能传递和自由电子运动，物体各部分之间不发生相对位移，这是导热区别于对流的本质。"},{"id":"basics_th_0007","module":"basics","bank":"热工水力学","type":"single","stem":"防止水锤的措施包括（     ）。","options":["截止阀慢开慢关，尽可能降低压力的冲击","对不宜慢开、慢关的阀门，可采用小流量旁通阀先开（或后关）旁通阀，再开（或先关）主管道上截止阀","对管道进行疏水","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》5.5节：降低水锤、汽锤危害的方法有①截止阀慢开慢关，尽可能降低压力冲击；②对不宜慢开慢关的阀门，先开（后关）小流量旁通阀，再开（先关）主截止阀；③对管道进行疏水。三项措施都有效，故选D。不选A/B/C：各只反映其中一项，均不全面。【易混点】水锤是管路工作状态突然改变使流速骤变、引起压力大幅波动的现象；汽锤、汽蚀机理不同，防范方法也不同。"},{"id":"basics_th_0008","module":"basics","bank":"热工水力学","type":"single","stem":"以下选项中是影响对流传热系数的因素是（     ）。","options":["换热面的几何形状","流体有无相变","流体的比容","以上都是"],"answer":["D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》3.1.3节：影响对流换热系数h的因素包括五个方面——流体流动的起因（自然/强迫对流）、流动状态（层流/紊流）、有无相变发生、流体的物理性质、换热面的几何因素。比容属于流体物性，三项均在影响之列，故选D。不选A/B/C：各只占其一，均不全面。【易混点】流速越高，热边界层（流体膜）越薄，h越大，故提高流速是强化对流换热的重要手段。"},{"id":"basics_th_0009","module":"basics","bank":"热工水力学","type":"single","stem":"比焓h的定义式：（     ）。","options":["u+pv","s+pv","u+s","u+Ts"],"answer":["A"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》1.3节：比焓h表示工质流动过程中所传输的能量，是复合参数，等于比内能u加上流动功项pv（开口系统压力与比体积的乘积），即h=u+pv，故选A。不选B：s是比熵，s+pv无定义；不选C：u+s把内能与熵相加无物理意义；不选D：u+Ts是自由能（自由焓）的构成项，不是焓。【易混点】定压过程中工质吸收的热量等于焓的增量，这是热力计算中焓特别重要的原因。"},{"id":"basics_th_0010","module":"basics","bank":"热工水力学","type":"single","stem":"在水与水蒸汽的温熵图（T-s图）中饱和水线和干饱和蒸汽线下方的区域对应的状态是：（     ）。","options":["饱和水","湿饱和蒸汽","过热蒸汽","超临界水或超临界蒸汽"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》1.2节水的三区五态图：饱和水线（下界线）与干饱和蒸汽线（上界线）之间、临界点以下的区域为湿蒸汽区，即汽液两相共存（湿饱和蒸汽），故选B。不选A：饱和水是下界线上的单相状态点；不选C：过热蒸汽位于干饱和汽线右侧的过热区；不选D：超临界状态在临界点之上，不在此两线之间。【易混点】湿蒸汽区状态用干度x描述：1kg湿蒸汽中含x kg干饱和蒸汽。"},{"id":"basics_th_0011","module":"basics","bank":"热工水力学","type":"single","stem":"已知流体与壁面的对流传热系数为15W/（m2·℃），传热面积为10m2，流体的温度为10℃，壁面的温度为200℃，则单位时间内流体与壁面传递的热量为多少？","options":["29500J","28500J","27500J","26500J"],"answer":["B"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》牛顿冷却公式：Q=hAΔt=15×10×(200−10)=28500W，即单位时间传热28500J，故选B。不选A/C/D：均为温差或数值代入错误，关键是温差取壁面与流体温度之差190℃，三个面积、系数都不变。【易混点】温差一律取两侧温度之差，与热量传递方向（流体被加热还是冷却）无关，方向只影响符号。"},{"id":"basics_th_0012","module":"basics","bank":"热工水力学","type":"single","stem":"已知壁面的导热系数为15W/（m·℃），壁面厚度为1m，面积为1 m2，壁面的两侧的温度分别为10℃，和100℃，则单位时间内流体与壁面传递的热量为多少？","options":["1350J","1450J","1550J","1650J"],"answer":["A"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》傅里叶导热公式：Q=λAΔt/δ=15×1×(100−10)/1=1350W，即单位时间传热1350J，故选A。不选B/C/D：均为计算错误，要点是温差取壁两侧温度之差90℃、壁厚δ=1m作分母。【易混点】导热公式用导热系数λ（W/(m·℃)）且除以厚度，对流公式用传热系数h（W/(m²·℃)）不除厚度，注意量纲区别。"},{"id":"basics_th_0013","module":"basics","bank":"热工水力学","type":"multi","stem":"一定能够提高循环热效率的途径有：(      ).","options":["采取再热循环","采取回热循环","提高主蒸汽初温","提高主蒸汽初压"],"answer":["B","C","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》1.5节：回热循环消除了朗肯循环在较低温度下吸热的不利影响，可使热经济性提高10%~15%，一定提高循环热效率；提高主蒸汽初温、初压可提高工质平均吸热温度，也能提高循环热效率（此点课件未直接展开，属朗肯循环通识），故选BCD。不选A：课件明确'再热循环的根本目的是降低末级叶片湿度，同时兼顾考虑热效率'，参数选择不当时效率并不提高。【易混点】与判断题'再热循环一定能提高热力循环效率'（错误）互相印证，再热主要是保安全（限末级湿度）而非保效率。"},{"id":"basics_th_0014","module":"basics","bank":"热工水力学","type":"multi","stem":"从燃料到冷却剂的传热过程包括：(     )。","options":["冷却剂的输热","燃料元件的导热","气隙传热","包壳导热"],"answer":["B","C","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"课件未直接覆盖（第四章仅给出'反应堆的热量输出过程'及燃料棒内温度分布示意）。按堆工通识：裂变热绝大部分在燃料芯块内产生（裂变碎片动能约166MeV沉积在燃料元件内），热量依次经燃料芯块导热→芯块与包壳间气隙传热→包壳导热才到达冷却剂表面，故选BCD。不选A：'冷却剂的输热'指冷却剂通过对流换热带走热量，属于到达冷却剂之后的输运环节，不计入'从燃料到冷却剂'的固体传热链。【易混点】气隙热阻很大，使芯块温度远高于包壳表面温度，这是稳态热工准则限定芯块最高温度低于熔点的依据。"},{"id":"basics_th_0015","module":"basics","bank":"热工水力学","type":"multi","stem":"反应堆裂变能的释放形式有（      ）。","options":["X射线的能量","γ射线的能量","β射线的能量","α射线的能量"],"answer":["B","C"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》4.1节反应堆热源表：裂变能的释放形式为裂变碎片动能（166MeV）、裂变中子动能（5MeV）、瞬发γ射线（7MeV）、缓发β射线（6MeV）和缓发γ射线（6MeV），故选BC。不选A：X射线不是裂变能的释放形式；不选D：α射线也不是裂变能主体（α是某些核素衰变的射线）。【易混点】每次裂变释放总能量约200MeV，其中裂变碎片动能占绝大部分且沉积在燃料元件内。"},{"id":"basics_th_0016","module":"basics","bank":"热工水力学","type":"multi","stem":"在均匀裸堆内径向热流密度分布与轴向热流密度分布分别为（      ）。","options":["截尾的零阶贝塞尔函数分布","截尾的一阶贝塞尔函数分布","截尾的正弦函数分布","截尾的余弦函数分布"],"answer":["A","D"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"课件未直接覆盖。按反应堆物理通识：均匀裸堆内中子通量密度（热流密度与之成正比）分布由扩散方程解出，圆柱形堆芯径向服从零阶贝塞尔函数J0分布、轴向服从余弦分布，且在外推边界处趋于零，故称'截尾'分布，选AD。不选B：径向是零阶而非一阶贝塞尔函数；不选C：轴向是余弦而非正弦分布。【易混点】课件4.1节的燃料分区装载（三区不同浓缩度、最高浓缩度装外区）正是为了展平这种中间高、边上低的功率分布，避免中心功率峰。"},{"id":"basics_th_0017","module":"basics","bank":"热工水力学","type":"multi","stem":"影响临界热流密度的因素有（     ）","options":["质量流速","工作压力","通道进口处水的欠热度","流体的传热系数"],"answer":["A","B","C"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》4.2节：影响临界热流密度qDNB的因素包括质量流速（流速大、扰动强，加热面难以形成稳定汽膜，qDNB增大）、通道进口处水的欠热度（欠热度越大qDNB越大）、工作压力以及加热表面粗糙度，故选ABC。不选D：流体传热系数是传热计算的结果量，不是qDNB的影响因素。【易混点】沸腾危机有偏离泡核沸腾（DNB）和干涸（Dryout）两种，稳态热工设计准则要求燃料元件外表面不允许发生沸腾临界。"},{"id":"basics_th_0018","module":"basics","bank":"热工水力学","type":"judge","stem":"卡诺循环是一切热机循环效率最高的热力循环。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》1.5.1节：卡诺循环由两个定温过程和两个绝热（定熵）过程组成且均为可逆过程，'在两个不同温度的恒温热源间工作的所有热机，没有任何热机的效率比可逆热机的效率更高'，故说法正确。易被误导处：'效率最高'限于相同温限（相同热源、冷源温度）下比较，不是任何条件下都最高。【易混点】实际工程并不采用卡诺循环：定温过程难以实现、循环净功小、所需压差或压缩比过大。"},{"id":"basics_th_0019","module":"basics","bank":"热工水力学","type":"judge","stem":"饱和温度随饱和压力增大而增大。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》1.2节饱和状态的特点：汽水共存、汽水同温，'饱和温度随饱和压力的升高而增大'，且饱和温度与饱和压力一一对应，故说法正确。易被误导处：不要把方向记反——压力升高，分子运动加剧，汽化动态平衡的温度上移。【易混点】压水堆维持14~16兆帕高压正是利用此关系，使水温在300℃左右仍不沸腾（课件《反应堆物理基础》第一章）。"},{"id":"basics_th_0020","module":"basics","bank":"热工水力学","type":"judge","stem":"对流传热由热传导和热对流组成。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》3.1.3节：'工程上对流换热不是单纯的对流方式，而是导热和热对流两种基本方式同时出现的一种较复杂的过程'，即对流传热由热传导和热对流综合组成，故说法正确。易被误导处：贴壁流体不滑移，热量穿过紧贴壁面的薄层只能靠导热，主流区才靠对流携带。【易混点】紧贴管壁的热边界层（流体膜）内集中了大部分径向温差，膜越薄对流传热系数越大。"},{"id":"basics_th_0021","module":"basics","bank":"热工水力学","type":"judge","stem":"DNBR是指实际热流密度与临界热流密度之比。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》4.2节：发生沸腾危机时的热流密度称为临界热流密度qDNB；DNBR是临界热流密度与实际热流密度之比，大于1才表示有安全裕量（运行概述课件给出的安全限值DNBR>1.20也印证其为大于1的裕量比）。题中把实际热流密度放在分子，说反了，故说法错误。易被误导处：记'临界在上'——临界值作分子、实际值作分母。【易混点】最小DNBR低于限值意味着可能提前发生沸腾临界（DNB或干涸），导致包壳烧毁。"},{"id":"basics_th_0022","module":"basics","bank":"热工水力学","type":"judge","stem":"工质的热力学参数包括温度、压力、比体积、比内能、比焓、比熵。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》1.1节：工程热力学中常用的工质状态参数有温度、压力、比体积、内能（比内能）、焓（比焓）、熵（比熵），与题干列举完全一致，故说法正确。易被误导处：功和热量不是状态参数，它们是与过程相关的过程量，不能列入。【易混点】状态参数的数值只取决于工质所处状态，与到达该状态所经历的路径无关。"},{"id":"basics_th_0023","module":"basics","bank":"热工水力学","type":"judge","stem":"再热循环一定能够提高热力循环效率。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》1.5.4节：'再热循环的根本目的是降低末级叶片湿度，同时兼顾考虑热效率'，只有再热压力、温度等参数选择得当时才可能提高热效率，并非一定提高，故说法错误。易被误导处：再热提高了蒸汽平均吸热温度，容易误以为必然提高效率，实际取决于参数匹配。【易混点】回热循环则一定提高热经济性（10%~15%），与再热'不一定'形成对比，两者常放在一起考。"},{"id":"basics_th_0024","module":"basics","bank":"热工水力学","type":"judge","stem":"自然循环是指在闭合回路内依靠热段（上行段）和冷段（下行段）的流体密度差所产生的驱动压头来实现的流动循环。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》5.4节：'自然循环是指在闭合回路内依靠热段（上行段）和冷段（下行段）的流体密度差所产生的驱动压头来实现的流动循环'，与题干表述一致，故说法正确。易被误导处：自然循环不是没有驱动压头，而是压头来自密度差，无需泵驱动。【易混点】实现条件：热阱与热源间有高度差、流体存在密度差、处于重力场内；温差和位差越大、流阻越小，自然循环能力越强。"},{"id":"basics_th_0025","module":"basics","bank":"热工水力学","type":"judge","stem":"单相流体的流动压降组成有：摩擦压降、提升压降和加速度压降。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"热工水力学.xls","explanation":"依据课件《热工水力学基础》第五章：单相冷却剂在通道内的流动压降由摩擦压降、提升（重位）压降和加速压降组成，题述三类与之相符，故说法正确。易被误导处：课件同时指出，通道内存在截面突变、弯管、阀门、定位架、孔板时还会产生集中压力损失——形阻压降ΔpC，计算总压降时应一并计入。【易混点】对闭合回路，加速压降之和为零，一回路总压降计算即利用了这一结论。"},{"id":"basics_rp_0001","module":"basics","bank":"反应堆物理","type":"judge","stem":"快中子不能引起U-238的裂变。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二、三章：U-238属可裂变同位素，'只有在能量高于某一阈值的中子作用下才能发生裂变反应'，能量超过阈值的快中子能引起U-238裂变（快裂变），中子循环中的快中子增殖因数ε正是由U-238快裂变贡献的，故'快中子不能引起U-238裂变'说法错误。易被误导处：热中子确实不能引起U-238裂变，但题目说的是快中子。【易混点】易裂变核（U-235、Pu-239等）在各种能量中子作用下都能裂变，与需过阈值的可裂变核（U-238、Th-232）不同。"},{"id":"basics_rp_0002","module":"basics","bank":"反应堆物理","type":"single","stem":"PWR反应堆中，引起燃料裂变的中子主要是（    ）","options":["热中子","快中子","超热中子","缓发中子"],"answer":["A"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第一章：热中子反应堆'引起燃料核裂变的中子能量在0.0253电子伏左右，重水堆、大多数压水堆即属于这种类型'。压水堆中裂变放出的快中子经慢化剂慢化为热中子，热中子引发U-235裂变的截面大，链式反应主要由热中子维持，故选A。不选B：快堆（如钠冷堆）才主要靠快中子裂变；不选C：超热中子只是慢化的中间能区；不选D：缓发中子份额仅约0.0065，只用于反应性控制。【易混点】压水堆燃料中U-238占绝大部分，但功率主要由仅占百分之几的U-235热裂变贡献。"},{"id":"basics_rp_0003","module":"basics","bank":"反应堆物理","type":"single","stem":"U-235吸收热中子会产生（    ）","options":["只会发生裂变反应","只会发生辐射俘获反应","会发生裂变反应或辐射俘获反应","不确定"],"answer":["C"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二章：'U-235吸收中子后并不都发生裂变反应，还有可能发生俘获反应'（辐射俘获生成U-236并放出γ），两种反应并存、比例由截面决定，故选C。不选A：忽略了辐射俘获通道；不选B：忽略了裂变通道；不选D：并非不确定，吸收后走哪条路由相应截面几率决定。【易混点】中子循环中的有效裂变中子数η正反映此点：燃料每吸收一个热中子平均产生η个裂变中子（η小于每次裂变放出中子数ν），因为部分吸收未引起裂变。"},{"id":"basics_rp_0004","module":"basics","bank":"反应堆物理","type":"single","stem":"核反应堆的反应性ρ=0，则表示该反应堆（    ）","options":["临界","超临界","次临界","无法判断"],"answer":["A"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第四章：反应性是表示系统偏离临界状态程度的物理量，ρ=0时k=1系统临界；ρ>0（k>1）超临界；ρ<0（k<1）次临界。ρ=0对应中子产生率与消失率平衡、中子通量密度稳定，故选A。不选B：那是ρ>0的情形；不选C：那是ρ<0的情形；不选D：由ρ即可直接判断。【易混点】反应性常用单位有Δk/k、Δk、$（元）、pcm、mk，其中1pcm=10⁻⁵Δk/k。"},{"id":"basics_rp_0005","module":"basics","bank":"反应堆物理","type":"single","stem":"中子与原子核的相互作用常用截面来度量，它实际上是中子与原子核发生某类核反应的（    ）","options":["面积","长度","体积","几率"],"answer":["D"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二章：'比例常数σ即一个靶核与一个中子发生某类核反应的几率'。σ的量纲虽为面积（故称微观截面，常用靶恩b作单位，1b=10⁻²⁸m²），但其物理本质是发生某类核反应几率大小的度量，故选D。不选A：'面积'只是量纲上的等效，并非真实几何面积；不选B/C：截面量纲既非长度也非体积。【易混点】宏观截面Σ=Nσ，单位是长度的倒数，其倒数即中子平均自由程λ。"},{"id":"basics_rp_0006","module":"basics","bank":"反应堆物理","type":"single","stem":"压水堆的自稳定性能是由（    ）实现的。","options":["调节控制棒","负温度系数反馈","A+B","正温度系数反馈"],"answer":["B"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第四章：以低富集铀为燃料的反应堆燃料温度系数（多普勒系数）总是负的，压水堆设计在欠慢化区，慢化剂温度系数也为负。功率升高→燃料和慢化剂温度升高→引入负反应性→功率自动回落，即温度变化的自稳性和一定范围内的功率自调性，故压水堆自稳定性能由负温度系数反馈实现，选B。不选A：调节控制棒是人为控制手段，非固有自稳机制；不选C：控制棒同属外因；不选D：正温度系数会加剧功率偏离，方向相反。【易混点】燃料温度系数响应近乎瞬发（瞬发温度系数），慢化剂温度系数需等热量传出、属缓发。"},{"id":"basics_rp_0007","module":"basics","bank":"反应堆物理","type":"single","stem":"反应堆功率正比于反应堆的（     ）。","options":["热中子最大通量","热中子平均通量","热中子最小通量","快中子平均通量密度"],"answer":["B"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第三章：反应堆热功率P正比于单位时间的裂变次数，而裂变率由核反应率R=Σφ（第二章）决定，对全堆积分对应堆芯热中子平均通量密度，故选B。不选A：最大通量只对应局部功率峰；不选C：最小通量处对全堆功率贡献很小；不选D：压水堆功率主要由热中子裂变贡献，快中子平均通量不直接表征功率。【易混点】核测量系统通过堆芯外和堆芯内中子通量测量实现功率监测和功率分布测量，防止超功率保护反应堆。"},{"id":"basics_rp_0008","module":"basics","bank":"反应堆物理","type":"single","stem":"一个质量为1kg的Sr-90的半衰期为25小时，另外一个质量为mCo的Co-60的半衰期为6小时，两个碎片的放射性活度一样，则另外一片Co-60的质量为（    ）。","options":["mCo =0.16kg","mCo =0.238kg","mCo =0.25kg","mCo =1kg"],"answer":["A"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二章活度与衰变规律：A=λN，λ=ln2/T½，核数N=(m/M)·N_A，故活度相等即 (m/M)/T½ 相等：mCo=1×(59/90)×(6/25)≈0.16kg（半衰期按题设25h与6h，摩尔质量近似取90与59），故选A。不选B/C/D：均未按'活度正比于（质量/摩尔质量）除以半衰期'的关系计算。【易混点】半衰期越短、摩尔质量越小，同等活度所需质量越小；本题数据为题设，与Sr-90真实半衰期（约29年）不同，切勿用真实值代入。"},{"id":"basics_rp_0009","module":"basics","bank":"反应堆物理","type":"judge","stem":"同位素具有相同的核特性和化学特性。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二章：同位素'在化学性质方面一般无法区别，但却具有不同的核特性'，例如热中子轰击下U-235能裂变而U-238不能裂变（俘获中子后经两次β衰变转化为Pu-239），故'具有相同的核特性'说法错误。易被误导处：由化学性质相同类推到核性质也相同是最常见陷阱。【易混点】核特性差异包括半衰期、吸收/裂变截面等；也正因化学性质无法区分，U-235与U-238只能用物理方法（如离心分离）浓缩。"},{"id":"basics_rp_0010","module":"basics","bank":"反应堆物理","type":"judge","stem":"放射性核素的衰变速率和物理化学环境无关。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二章衰变规律：衰变概率'取决于核的种类和衰变类型，而且等于常数'；《核电厂辐射防护基础》也强调'原子核发射射线、衰变速率、半衰期等都是不变的、独有的'，放射性衰变半衰期、射线能量、分支比等与物质的物理、化学性质无关，由原子核性质决定，故说法正确。易被误导处：课件练习题即考此点——堆芯温度升高，I-135的衰变速率不变。【易混点】化学状态可影响核素在人体内的代谢分布（如碘富集于甲状腺），但不能改变其衰变常数。"},{"id":"basics_rp_0011","module":"basics","bank":"反应堆物理","type":"judge","stem":"热中子是指温度非常高的中子。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二、三章：热中子是'处于与周围介质相同温度'（与介质分子热运动达到平衡）的中子，热中子反应堆中引起裂变的中子能量在0.0253eV左右（第二章按能量分类：热中子En≤1eV），并非'温度非常高'的中子，故说法错误。易被误导处：'热'指与介质热平衡，不是自身高温。【易混点】能量分类：热中子≤1eV、超热中子1eV~0.1MeV、快中子>0.1MeV；裂变瞬发中子平均能量约2MeV，属快中子。"},{"id":"basics_rp_0012","module":"basics","bank":"反应堆物理","type":"judge","stem":"中子核反应微观截面的大小和中子能量无关。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第三章：'裂变截面是靶核及入射中子能量的函数'，U-235裂变截面在低能区大、U-238裂变截面在裂变阈能以下为零；第四章还给出Xe-135的吸收截面随中子能量增加显著下降，均说明微观截面与中子能量密切相关，故说法错误。易被误导处：不要把截面当成核素一成不变的固定常数。【易混点】热中子能区许多核素的吸收截面近似服从1/v规律（与中子速率成反比），这也是堆芯温度变化引起反应性变化的原因之一。"},{"id":"basics_rp_0013","module":"basics","bank":"反应堆物理","type":"judge","stem":"中子只能引起U-235的裂变反应，而不能引起其他反应。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二章：中子与原子核的反应有散射（弹性、非弹性）和吸收（辐射俘获、放出带电粒子反应、裂变反应）等多种类型；易裂变同位素有U-233、U-235、Pu-239、Pu-241等，且U-235吸收中子后也可能只发生俘获而不裂变，故'中子只能引起U-235的裂变反应'说法错误。易被误导处：压水堆链式反应以U-235热裂变为主，不等于中子与其他核素、其他反应不发生。【易混点】U-238吸收快中子可发生快裂变，俘获（辐射俘获）则生成Pu-239——两种走向并存。"},{"id":"basics_rp_0014","module":"basics","bank":"反应堆物理","type":"judge","stem":"裂变过程中释放的总能量同反应堆可回收能量不同。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第三章能量表：每次裂变释放总能量约207MeV，其中中微子带走约12MeV——中微子几乎不与物质作用、无法回收，可回收能量约198~207MeV（还计入俘获γ的3~12MeV），总释放能量与可回收能量不同，故说法正确。易被误导处：可回收能量不是简单等于总能量减中微子能量，还包含俘获γ的贡献。【易混点】工程上取每次裂变可回收能量约200MeV（Ef=200MeV），这是反应堆热功率计算的基准。"},{"id":"basics_rp_0015","module":"basics","bank":"反应堆物理","type":"judge","stem":"可燃毒物棒毒物的含量会随着堆芯寿期的增加逐渐减小。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第四章4.4.3节：可燃毒物利用其较大的热中子吸收截面补偿堆芯运行初期较大的剩余反应性，'随着运行时间的增加，多余的反应性也减少，由于可燃毒物棒的消耗，其本身所控制的反应性也减少'，即毒物含量随堆芯寿期（燃耗加深）逐渐减小，且补偿过程不需要外部控制、自动进行，故说法正确。易被误导处：'可燃'即随中子照射逐渐'烧掉'消耗。【易混点】对可燃毒物的要求之一是寿期末残余量尽可能少，以免影响堆芯寿期。"},{"id":"basics_rp_0016","module":"basics","bank":"反应堆物理","type":"judge","stem":"功率亏损指的是功率因为一些因素而减小了。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第四章4.3.4节：功率亏损是功率系数在0~100%区间的积分（积分功率系数），'当功率增加时，反应堆产生一个负反应性，指反应性亏损了'，须补入等量正反应性才能维持临界。可见亏损的是反应性而非功率，故'功率因一些因素而减小了'的说法错误。易被误导处：'功率亏损'字面像说功率减少，实为功率升高伴随的负反应性损失（多普勒效应与慢化剂温度效应所致）。【易混点】因此同硼浓度下功率越低，控制棒插入越深（课件例题h1>h2>h3）。"},{"id":"basics_rp_0017","module":"basics","bank":"反应堆物理","type":"judge","stem":"如果中子和靶核发生某类反应的微观截面为σ，靶核的核子密度为N，那么中子和靶核发生该反应的宏观截面为 Nσ 。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第二章：宏观截面Σ表征一个中子与单位体积内原子核发生某类核反应的平均几率，其表达式为Σ=Nσ（核子密度乘微观截面），单位是长度的倒数，其倒数即中子平均自由程；课件练习题（10B与11B的宏观吸收截面=¹⁰N·¹⁰σa+¹¹N·¹¹σa）也印证了这一关系，故说法正确。易被误导处：微观截面量纲是面积、宏观截面量纲是1/长度，注意区分。【易混点】核反应率R=Σφ，正是通过宏观截面把中子通量与反应次数联系起来。"},{"id":"basics_rp_0018","module":"basics","bank":"反应堆物理","type":"judge","stem":"PWR常用的单位是MW/tU。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第四章：燃耗深度（单位质量燃料所发出的能量，燃料贫化的度量）的常用单位是兆瓦日/吨铀（MWd/tU），MW/tU这类'功率/铀装量'量纲属于燃耗（比功率）类参量，不是功率单位；反应堆功率以MW表示（课件例题'额定热功率300MW'），故说法错误。易被误导处：压水堆功率常用MWt（热功率）、MWe（电功率）表示。【易混点】课件例题：燃料装载量=热功率×燃耗时间/燃耗深度=300MW×300EFPD/30000MWd/t=3t，可见三者量纲关系。"},{"id":"basics_rp_0022","module":"basics","bank":"反应堆物理","type":"single","stem":"<ckeditor5><p>下图为中子循环的基本过程，其中按顺序填写括号中的内容为（ ）。<\/p><figure class='image'><img src='http://erpe-learning.cnnp.com.cn/sf-server/file/getFile/25bee204dbd72387b5ce746fc6ac9d5f-N_1523333333333/64eff5bce4b06e4b73b444ca_0100'><\/figure><\/ckeditor5>","options":["热中子、热中子、快中子、快中子","热中子、快中子、热中子、快中子","快中子、热中子、快中子、热中子","快中子、快中子、热中子、热中子"],"answer":["D"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第三章中子循环：裂变放出的是平均能量约2MeV的快中子（裂变后10⁻¹⁴s内瞬发释放），经U-238快裂变增殖（ε因子）后仍是快中子，再经慢化剂慢化降为热中子，热中子被燃料吸收引发裂变又放出新一代快中子。故图中顺序为快中子、快中子、热中子、热中子，选D。不选A/B/C：均把循环环节的中子能区排错。【易混点】中子循环六因子ε、PF、p、PT、f、η，keff=εpfη·PF·PT。"},{"id":"basics_rp_0023","module":"basics","bank":"反应堆物理","type":"judge","stem":"<ckeditor5><p>反应堆的有效增值因数k<sub>eff<\/sub>=中子的产生率/中子的吸收率。<\/p><\/ckeditor5>","options":null,"answer":["错误"],"score":null,"source":"official","origin":"反应堆物理.xls","explanation":"依据课件《反应堆物理基础》第三章：从中子数守恒观点，keff=1时'中子的产生率与消失率处于动态平衡'，而消失率包括堆内吸收和向堆外泄漏两部分（中子循环图中明确画有快中子泄漏、热中子泄漏两项），即keff=产生率/消失率。题中分母只写吸收率、漏掉泄漏项，故说法错误。易被误导处：只有在无限大介质（P=1）无泄漏时，增殖因数才只由吸收决定（k∞=εpfη）。【易混点】对实际的有限尺寸反应堆，keff=k∞·PF·PT恒小于k∞，泄漏总是使增殖因数下降。"},{"id":"basics_rad_0001","module":"basics","bank":"辐射防护基础","type":"single","stem":"为了用同一尺度表示不同类型辐射照射对人体造成的生物效应，辐射防护采用（   ）这个辐射量。","options":["吸收剂量","待积剂量","剂量当量"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.3节：当量剂量是组织或器官的平均吸收剂量与辐射权重因子的乘积，对不同类型辐射的生物效应差异进行修正，从而能用同一尺度衡量不同辐射照射的危害，故选C。不选A：吸收剂量只反映单位质量沉积的能量，不区分辐射类型，无法直接比较生物效应；不选B：待积剂量是针对内照射、摄入核素后一段时间内剂量的积分量。【易混点】在当量剂量基础上再乘组织权重因子并对各器官求和，即得有效剂量。"},{"id":"basics_rad_0002","module":"basics","bank":"辐射防护基础","type":"single","stem":"无论哪种照射，都应遵守辐射防护三原则，包括：（    ）原则、防护最优化原则、个人剂量限值的应用原则。","options":["正当性","ALARA","确定性"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.1节：辐射防护三原则为实践的正当性原则、辐射防护的最优化原则和个人剂量限值（个人剂量限制）原则，本空填'正当性'，故选A。不选B：ALARA（合理可行尽量低）是最优化原则的内涵和别称，不是与三原则并列的独立原则；不选C：'确定性'是辐射生物效应的分类名词，不是防护原则。【易混点】共性课件另提'辐射防护四原则'，是在上述三条外增加仅针对工作人员的自我防护原则，并非ALARA。"},{"id":"basics_rad_0003","module":"basics","bank":"辐射防护基础","type":"single","stem":"下列关于内照射防护措施，说法正确的是（     ）。","options":["包容、隔离、净化、稀释","缩短受照时间","增大与辐射源的距离"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.3节：内照射防护的关键是阻断放射性物质进入人体；对空气污染的集体防护方法为净化（空气过滤）、稀释（通风换气）、包容隔离（防止污染扩散），即包容、隔离、净化、稀释，故选A。不选B：缩短受照时间是外照射防护中的时间防护；不选C：增大与源的距离是外照射防护中的距离防护。【易混点】内照射防护对应四条进入途径：吸入（呼吸防护）、食入（控区内禁食禁烟）、伤口、皮肤渗入（穿戴防护用品、减少暴露皮肤）。"},{"id":"basics_rad_0004","module":"basics","bank":"辐射防护基础","type":"single","stem":"常用的中子屏蔽材料不包括（     ）。","options":["水","石蜡","铅"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》：'对中子的屏蔽材料应选择轻物质，即含有较多氢元素的物质，如石蜡、水等'，水和石蜡均为常用中子屏蔽材料；而铅原子序数高、密度大，主要用于减弱γ射线（铅板、铅砖、铅皮屏蔽），对中子的慢化和吸收能力弱，不属于常用中子屏蔽材料，故选C。不选A/B：均为课件明示的含氢中子屏蔽材料。【易混点】γ屏蔽选高原子序数、高密度材料（铅、混凝土），中子屏蔽选含氢轻材料（水、石蜡），两者方向正好相反，常对照出题。"},{"id":"basics_rad_0005","module":"basics","bank":"辐射防护基础","type":"single","stem":"通常情况下放射性物质进入人体的途径不包括（     ）。","options":["吸入","皮肤渗入","扩散"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》《辐射防护（共性）》：放射性物质进入人体的途径为食入、吸入、从裸露伤口进入和皮肤渗入四条，均指物质实际进入体内；'扩散'是放射性物质在空气、水等环境介质中的迁移弥散现象，不是进入人体的途径，故选C。不选A/B：吸入、皮肤渗入都是课件列明的进入途径。【易混点】内照射防护的关键就在于切断这四条途径（呼吸道、口腔、皮肤、伤口防护各有措施）。"},{"id":"basics_rad_0006","module":"basics","bank":"辐射防护基础","type":"single","stem":"液态流出物的槽式排放，在排放前由实验室进行取样分析，符合排放限值后方可排放，排放过程中在线监测仪表对（     ）。","options":["废液的剂量率进行连续监测","环境剂量率进行连续监测","废液的放射性核素浓度进行连续监测"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》5.3节：液态放射性流出物采用槽式排放，排放前应混匀并取样监测、达标后方可排放；'放射性流出物排放过程中应有在线辐射监测仪表连续监测，排放管线上应安装自动报警和排放连锁装置'。在线监测的对象是所排废液本身的放射性水平（核素浓度），确保超标时立即报警和连锁截断，故选C。不选A：废液剂量率不是排放在线监测量；不选B：环境剂量率属环境监测范畴。【易混点】槽式排放出口处H-3、C-14外的其余核素浓度不应超过1000Bq/L。"},{"id":"basics_rad_0007","module":"basics","bank":"辐射防护基础","type":"single","stem":"通常不需要专门的防护手段或安全措施，但需要经常对职业照射条件进行监督和评价的区域定为（    ）。","options":["监督区","控制区","非限制区"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.4节：辐射监督区位于控制区之外、辐射风险较小，'一般不需要专门的防护手段或安全措施'，但要求对职业照射条件进行经常性的监督和评价（监督区人员年剂量一般不超过限值的3/10但可能超过1/10），故选A。不选B：需要和可能需要专门防护手段或安全措施的区域应定为（辐射）控制区；不选C：'非限制区'不是辐射分区体系中的规范分区。【易混点】控制区内再按剂量率等细分为绿、黄、橙、红子区，红区为禁止进入区。"},{"id":"basics_rad_0008","module":"basics","bank":"辐射防护基础","type":"single","stem":"外照射是指放射源在人体之外对人体产生的照射，外照射所致的剂量占电站集体剂量的绝大部分。降低外照射的方法有（     ）。","options":["减少在放射源附近工作的时间，增大与放射源之间的距离","避免吸入、摄入放射性物质","搭设空气负压棚降低空气污染水平"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》：外照射防护方法为时间防护、距离防护、屏蔽防护（含源项控制），外照射剂量=剂量率×受照时间。A项'减少在放射源附近工作的时间、增大与源的距离'正是时间防护与距离防护，正确，故选A。不选B：避免吸入、摄入放射性物质是内照射防护；不选C：搭设空气负压棚（SAS）属空气污染（内照射）的集体防护措施。【易混点】点源辐射水平与距离平方成反比：距离增大1倍，剂量率降至1/4，故距离防护非常有效。"},{"id":"basics_rad_0009","module":"basics","bank":"辐射防护基础","type":"single","stem":"为了解控制区辐射和污染水平，必须对控制区辐射和污染水平进行监测应定期使用便携式仪表对未设固定监测点的区域和固定监测点测量结果难以代表的区域进行测量，监测的内容包括（     ）。","options":["环境剂量率、表面污染和空气污染","体表污染","外照射、内照射"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.5节：'控制区辐射监测：对环境剂量率、表面污染和空气污染进行监测，实时掌握辐射控制区辐射现状'，用便携式仪表对未设固定监测点区域定期巡测的内容即这三项，故选A。不选B：体表（人员）污染是人员退出控制区时经体表污染监测仪（C2门）等测量的项目；不选C：外照射、内照射是照射方式分类，不是仪表测量的物理量。【易混点】场所（区域）监测与个人剂量监测相对应：前者掌握场所辐射水平，后者证实个人剂量符合限值。"},{"id":"basics_rad_0010","module":"basics","bank":"辐射防护基础","type":"single","stem":"由于物品的表面污染的存在，会因为人员辐射工作接触而转移到工作人员体表，进而会通过吸入或食入途径进入人体产生内照射。场所污染防护措施一般有（     ）。","options":["建立表面污染隔离区，适时采取去污措施","放射性物质衰变减少辐射源","选择合适的屏蔽材料"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》表面污染防护一节：集体防护方法为'设置放射性污染隔离区；发现污染，及时去污'，即建立表面污染隔离区防止污染扩散和向人员体表转移，并适时采取去污措施，故选A。不选B：依靠放射性物质自身衰变来减少辐射源主要针对源项随时间衰减的情形（如停堆后短寿命核素衰减），不是场所表面污染的直接防护措施；不选C：选择合适的屏蔽材料是外照射防护手段。【易混点】松散污染既有外照射风险又可再悬浮造成内照射风险，控制要求比固定污染更严。"},{"id":"basics_rad_0011","module":"basics","bank":"辐射防护基础","type":"single","stem":"压水堆核电厂蒸发器泄漏监测仪用于监测蒸发器一次侧向二次侧的泄漏，监测对象为（     ）。","options":["N-13","N-16","I-131"],"answer":["B"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《反应堆物理基础》第二章：一回路水流经堆芯时水中16O吸收中子发生16O(n,p)16N反应，16N半衰期7.4s，衰变放出很硬的γ射线，是'一回路水放射性剂量的一个重要来源'；主冷却回路屏蔽的主要辐射源也是16N。蒸发器传热管泄漏时，含16N的一回路水进入二次侧，监测到16N即表明泄漏，故选B。不选A：13N非此监测对象；不选C：I-131是裂变产物，包壳完整时不应出现在冷却剂中。【易混点】16N半衰期极短，运行期间监测灵敏，停堆后很快衰变完。"},{"id":"basics_rad_0012","module":"basics","bank":"辐射防护基础","type":"single","stem":"1 Ci = （     ）","options":["<ckeditor5><p>3.7×10<sup>9<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>3.7×10<sup>10<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>3.7×1<span style='background-color:rgb(255,255,255);color:rgb(0,0,0);'>0<\/span><sup>12<\/sup>Bq<\/p><\/ckeditor5>"],"answer":["B"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.3节：'1Ci=3.7×10¹⁰Bq（1克镭的活度）'，《反应堆物理基础》第二章亦给出1Ci=3.7×10¹⁰/s=3.7×10¹⁰Bq，即1居里相当于每秒3.7×10¹⁰次衰变，故选B。不选A：3.7×10⁹少了一个数量级；不选C：3.7×10¹²大了两个数量级，均属数量级记错。【易混点】居里是过去的活度单位，国际单位是贝可（Bq），1Bq=1次衰变/秒；不要与剂量单位希沃特（Sv）、照射量单位伦琴混淆。"},{"id":"basics_rad_0013","module":"basics","bank":"辐射防护基础","type":"single","stem":"工作场所表面污染监测的主要目的是防止污染扩散以及检查污染控制是否失效，需要监测表面污染的主要辐射类型是（    ）。","options":["α、β放射性","γ放射性","中子"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》：表面污染来自空气中放射性微尘沉降、带放射性的管道设备维修及系统泄漏等，固定污染在β、γ辐射体情况下存在外照射危害，松散污染可再悬浮造成内污染；且全身沾污测量仪'采用大面积的β射线探测器对人体所有表面进行放射性污染测量'。可见表面污染监测针对的主要是α、β放射性，故选A。不选B：γ穿透力强，其影响以场所剂量率监测来反映；不选C：中子仅存在于堆运行等特殊场所。【易混点】松散污染易转移扩散、易进入人体，其控制要求比固定污染更严格。"},{"id":"basics_rad_0014","module":"basics","bank":"辐射防护基础","type":"single","stem":"以下用于体内污染监测的设备是（     ）。","options":["C1 门","C2 门","WBC"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《辐射防护（共性）》2.10节：压水堆核电厂常规内照射监测方法为活体测量，采用全身计数器（WBC）直接测量体内放射性核素的积存量（可监测60Co、131I、137Cs等γ核素），故选C。不选A/B：C1门是工作服污染监测门、C2门是人员体表污染监测门，测的都是体表沾污，不是体内污染。【易混点】氚等低能β核素不能用WBC测量，需用液体闪烁计数器测尿样中氚浓度来估算摄入剂量（生物样品分析法）。"},{"id":"basics_rad_0015","module":"basics","bank":"辐射防护基础","type":"single","stem":"以下不属于工艺废物的是（    ）。","options":["各种离子交换器的废树脂","蒸发的浓缩液","检修使用过的辐射防护用品"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》5.2节：放射性固体废物按来源分为工艺废物和技术废物——工艺废物来自工艺系统，主要有废离子交换树脂、水过滤器、通风过滤器、废气活性炭床、蒸残液水泥固化体等；技术废物来自生产活动中的防护用品及维修杂项物品。检修使用过的辐射防护用品属技术废物，不属于工艺废物，故选C。不选A/B：废树脂、蒸发浓缩液均为课件列举的典型工艺废物。【易混点】技术废物按可压缩/不可压缩、可燃/不可燃等分类收集，分别压缩或焚烧减容处置。"},{"id":"basics_rad_0016","module":"basics","bank":"辐射防护基础","type":"single","stem":"当燃料元件破损时，（     ）有可能进入冷却剂。","options":["活化产物","裂变产物","腐蚀产物"],"answer":["B"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.2节：裂变产物是核裂变的'碎片'及其衰变、吸收中子得到的子体，运行时'密封于燃料组件包壳内，如包壳破损，可能逸出'。燃料元件（包壳）破损时，其内积存的大量裂变产物（碘-131、铯-134/137、惰性气体等）便进入冷却剂，故选B。不选A：活化产物是堆内材料与冷却剂受中子活化生成，与元件破损无关；不选C：腐蚀产物须经中子活化才有放射性，属活化产物范畴。【易混点】燃料包壳是三道屏障之一，其完整性是核电站辐射安全最重要的问题。"},{"id":"basics_rad_0017","module":"basics","bank":"辐射防护基础","type":"judge","stem":"当重核裂变成两个中等核时，伴随很大的能量释放，这正是裂变反应堆的物理基础。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《反应堆物理基础》第三章：核裂变反应是反应堆中最重要的核反应，'裂变反应中释放的巨大能量正是我们获取核能的目的'，重核裂变成两个中等质量核时因质量亏损释放巨大能量，且裂变释放次级中子使链式反应能自动持续，能量得以持续输出——这正是裂变反应堆的物理基础，故说法正确。易被误导处：能量来自核的结合能差（质量亏损），不是化学反应热。【易混点】每次裂变约释放200MeV，其中裂变碎片动能约168MeV、占绝大部分，且沉积在燃料元件内。"},{"id":"basics_rad_0018","module":"basics","bank":"辐射防护基础","type":"judge","stem":"X 和γ射线都是电磁波，X 射线是由原子核发射出来的辐射，γ射线是在原子核外部产生的辐射。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》1.3节射线来源表：X射线产生于原子核外（外层电子跃迁发出特征X射线、高速电子韧致辐射产生连续谱X射线）；γ射线由激发态原子核退激（核内能级跃迁）发射。X和γ虽都是电磁波，但题中把两者的来源说反了（X不是核发射、γ不是核外产生），故说法错误。易被误导处：两者本质同为电磁辐射，区别仅在起源，不在波动性质。【易混点】能量范围上X与γ有重叠，不能单凭能量高低区分，要看产生机制。"},{"id":"basics_rad_0019","module":"basics","bank":"辐射防护基础","type":"judge","stem":"由于电离或激发的产生，内层轨道上一旦出现空位（空穴），外层的轨道电子便会向内层轨道跃迁，跃迁电子能级差的能量就会以电磁辐射的形式发射γ射线。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》1.7节射线类型：'由于外层的轨道电子向内层轨道跃迁，能级差的能量便以X射线发射出来'。核外电子填补内层空位（空穴）释放的电磁辐射是特征X射线（也可能发射俄歇电子）；γ射线来自原子核内部的能级跃迁（激发态核退激），题中把X射线说成γ射线，故说法错误。易被误导处：内层空位确实伴随电磁辐射发射，但其'出身'在核外电子壳层而非原子核。【易混点】γ衰变（跃迁）中原子核的质量数和原子序数都保持不变，只是能量状态改变。"},{"id":"basics_rad_0020","module":"basics","bank":"辐射防护基础","type":"judge","stem":"不稳定的原子核自发地放射出 α、β、γ 等各种射线的现象称为放射性，按原子核是否稳定，可把核素分为稳定性核素和放射性核素两类。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》1.2节：'不稳定的核素会发出射线释放能量，通过释放能量使原子核更稳定，核素的这种性质叫放射性'，常见衰变方式有α衰变、β衰变和γ衰变（重的放射性原子核还会自发裂变）；'按原子核是否稳定，可把核素分为稳定性核素和放射性核素两类'，与题干一致，故说法正确。易被误导处：放射性是原子核层面的不稳定，与物质的化学状态无关。【易混点】原子序数大于等于84的元素全部不稳定，在已知约3100种核素中仅约280种是稳定的。"},{"id":"basics_rad_0021","module":"basics","bank":"辐射防护基础","type":"judge","stem":"当电离室内的气体受到稳定照射时，离子对的产生率是恒定的，如果复合可以忽略并能有效地收集所有电荷，则所产生的稳定电流是对在该电离室内气体中离子对产生率的准确量度。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》3.1节气体探测器原理：入射粒子使气体电离产生正、负离子对，'探测气体介质中产生的正、负离子对数量正比于射线在介质中所沉积的能量，只要充分收集所产生的电荷，就可以确定射线的能量'。稳定照射下离子对产生率恒定，复合可忽略且所有电荷被有效收集时，稳定电离电流正是对离子对产生率的准确量度，故说法正确。易被误导处：若存在离子复合或电荷收集不全，电流偏低，就不再能准确量度。【易混点】按工作电压不同，气体探测器分为电离室、正比计数管和G-M计数管三类。"},{"id":"basics_rad_0022","module":"basics","bank":"辐射防护基础","type":"judge","stem":"闪烁探测器的能量分辨率主要决定于闪烁体和光电倍增管，相对于半导体探测器来说，闪烁探测器的能量分辨率更好。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"课件未直接覆盖（课件只分别介绍两类探测器的组成与原理）。按核仪器通识：闪烁探测器由闪烁体、光电倍增管和电子学仪器组成，能量需经射线→荧光光子→光电子→逐级倍增→电脉冲多个转换环节，各环节统计涨落累积，故其能量分辨率主要取决于闪烁体和光电倍增管，但整体分辨率比半导体探测器差得多，题述'更好'错误。易被误导处：闪烁体发光效率高不等于能量分辨率好，两个概念要分开。【易混点】半导体探测器（PN结）产生电子空穴对所需能量小、电荷收集直接，能量分辨率最好，γ能谱仪常用其识别核素。"},{"id":"basics_rad_0023","module":"basics","bank":"辐射防护基础","type":"judge","stem":"辐射效应发生概率与受照剂量呈正比，剂量越大，危险性越高。无阈值为确定性效应，有阈值为随机性效应。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.2节：确定性效应是'有剂量阈值特征的细胞群损伤，损伤的严重程度随剂量的增加而加重'（有阈值，看严重程度）；随机性效应'发生不存在剂量阈值，发生概率与受照剂量呈正比，剂量越大危险性越高'（无阈值，看发生概率）。题中把'无阈值'配给确定性效应、'有阈值'配给随机性效应，正好颠倒，故说法错误。易被误导处：两类效应都与剂量有关，区别在有无阈值及衡量方式。【易混点】辐射防护目标即：避免确定性效应发生，把随机性效应发生概率限制在可合理达到的尽量低水平。"},{"id":"basics_rad_0024","module":"basics","bank":"辐射防护基础","type":"judge","stem":"当量剂量的定义为：组织或器官的平均吸收剂量与辐射权重因子的乘积。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.3节：'当量剂量是组织或器官的平均吸收剂量与辐射权重因子的乘积'，专门名称为希沃特（Sv），用于定量描述不同类型辐射生物效应的差异，与题干定义一致，故说法正确。易被误导处：辐射权重因子修正的是'辐射类型'差异，组织权重因子修正的是'器官敏感性'差异，两者层级不同勿混。【易混点】有效剂量=各组织器官当量剂量×组织权重因子之和；1Sv=1J/kg，核电厂常用mSv、μSv。"},{"id":"basics_rad_0025","module":"basics","bank":"辐射防护基础","type":"judge","stem":"辐射防护三原则是指：正当性原则、防护最优化原则、ALARA原则。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.1节：辐射防护三（基本）原则是实践的正当性、辐射防护的最优化、个人剂量限值的应用三原则；ALARA（合理可行尽量低）是防护最优化原则的内涵与别称，并非与之并列的独立原则。题中用ALARA顶替剂量限值原则，把一条原则说了两遍而漏掉个人剂量限值，故说法错误。易被误导处：ALARA与最优化同义，见'最优化原则（ALARA）'的课件标题即知。【易混点】个人剂量限值是不可逾越的红线，ALARA是管理目标与方法，二者角色不同。"},{"id":"basics_rad_0026","module":"basics","bank":"辐射防护基础","type":"judge","stem":"在考虑辐射防护时，要求剂量越低越好。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.1节：最优化（ALARA）要求'在考虑了经济和社会的因素之后，应当将一切辐射照射保持在合理达到的尽可能低的水平'，即在辐射危害与防护代价之间寻求平衡，而不是无条件地把剂量降到越低越好（代价过高即不合理），故说法错误。易被误导处：'尽量低'前有'合理可行'的限定，脱离经济和社会因素谈'越低越好'是误读。【易混点】与个人剂量限值对比：限值是必须满足的硬约束，ALARA是持续追求的目标，两者常结合出题。"},{"id":"basics_rad_0027","module":"basics","bank":"辐射防护基础","type":"judge","stem":"由于利益和代价在群体中分布的不一致性，虽然实践满足了正当性要求，辐射防护也做到了最优化，但还不一定能够对每个人提供足够的保护。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》2.1节：'辐射实践满足了正当性要求，辐射防护也做到了最优化，但不一定能对每个人提供足够的防护。因此……必须用剂量限值对个人所受照射加以限制'。正当性和最优化都是群体（社会）层面对利益与代价的权衡，而利益和代价在群体中的分布并不一致，故还须应用个人剂量限值才能保证对每个人的充分保护，题干与课件表述一致，说法正确。易被误导处：集体最优不等于人人安全。【易混点】剂量限值指内外照射剂量总和，且不适用于医疗照射和天然本底照射。"},{"id":"basics_rad_0028","module":"basics","bank":"辐射防护基础","type":"judge","stem":"工作场所的表面污染控制水平只考虑松散污染。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.3节：表面污染分为固定污染（难以去除）和松散污染（容易去除、容易转移）两类，两类都有辐射危害——固定污染在β和γ辐射体情况下存在外照射危害，松散污染既有外照射风险又可能再悬浮或转移到体表造成内照射。因此表面污染控制水平须同时考虑固定污染和松散污染，不能只考虑松散污染，故说法错误。易被误导处：松散污染易扩散更受关注，但固定污染的外照射风险同样必须控制。【易混点】控制区子区划分标准中就包含β表面污染水平（Bq/cm²）指标。"},{"id":"basics_rad_0029","module":"basics","bank":"辐射防护基础","type":"judge","stem":"中子测量是通过中子与探测器灵敏介质材料原子核发生作用后产生的次级带电粒子来测量的，中子与原子核的相互作用主要有：核反应、核裂变、活化等。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》3.1节中子探测器：'中子本身不带电，中子主要是通过中子与探测器灵敏介质材料的原子核发生作用后产生的次级带电粒子来测量的；中子与原子核的相互作用主要有：核反应、核裂变、活化等'，与题干一致，故说法正确。易被误导处：探测器直接测的不是中子本身，而是核反应生成的次级带电粒子（质子、α粒子、裂变碎片等）的电离信号。【易混点】核裂变法利用重核裂变碎片（重带电粒子）测量中子；压水堆核测系统一般只测量热中子通量。"},{"id":"basics_rad_0030","module":"basics","bank":"辐射防护基础","type":"judge","stem":"核电厂把需要和可能需要专门防护手段或安全措施的区域定为监督区。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.4节：辐射控制区是'辐射风险大的且需要对放射性物质采取专门防护手段或安全措施的区域'；监督区在控制区之外、辐射风险较小，'一般不需要专门的防护手段或安全措施'，但需对职业照射条件进行经常性的监督和评价。题中把'需要和可能需要专门防护手段或安全措施'的区域定为监督区，正好说反，故说法错误。易被误导处：两区的辐射水平都可能超过公众限值，区别在于是否需要专门防护手段。【易混点】监督区人员年受照一般不超过年剂量限值的3/10，但可能超过1/10。"},{"id":"basics_rad_0031","module":"basics","bank":"辐射防护基础","type":"judge","stem":"核电厂反应堆冷却剂和结构材料在中子辐照下都会活化成放射性物质，活化产物对电站工作人员的集体剂量贡献小于裂变产物。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》4.2节：反应堆内结构材料（不锈钢、锆、水）的中子活化产物是核电站运行中影响最大的辐射源，'活化产物在停堆检修期间造成的危害最大，占剂量贡献的90%以上'，对剂量贡献最大的核素为钴-60和钴-58。故'活化产物对电站工作人员集体剂量的贡献小于裂变产物'说法错误。易被误导处：裂变产物总量虽大，但正常运行时密封在燃料包壳内，对工作人员剂量贡献反而小。【易混点】燃料无破损时，职业照射绝大部分来自一回路腐蚀活化产物（结构材料微量钴导致60Co持续累积）。"},{"id":"basics_rad_0032","module":"basics","bank":"辐射防护基础","type":"judge","stem":"放射性废液排放前，首先应对排出物混匀，然后采取样品进行测量，测量达标后即可连续排放，不需要额外监测手段。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》5.3节：液态流出物采用槽式排放，排放前应取样监测（混匀、取样分析、达标后方可排放），并且'放射性流出物排放过程中应有在线辐射监测仪表连续监测，排放管线上应安装自动报警和排放连锁装置'，绝非'不需要额外监测手段'，故说法错误。易被误导处：取样达标只是排放的前提条件，排放全程仍须在线监测与连锁保护以防超标排放。【易混点】排放量还实行分层次管控：月累计不超过年度管理目标值的1/5、季度不超过1/2、年不超过目标值。"},{"id":"basics_rad_0033","module":"basics","bank":"辐射防护基础","type":"judge","stem":"放射性废物管理包括放射性废物的预处理、处理、整备、运输、贮存和处置在内的所有行政管理和运行活动。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》第5章总结：'放射性废物管理包括预处理、处理、整备、运输、贮存和处置等环节'在内的所有行政管理和运行活动，与题干列举一致，故说法正确。易被误导处：环节容易漏记'运输'和'整备'，管理是覆盖废物从产生到处置的全过程活动。【易混点】管理方针为'减少产生、分类收集、净化浓缩、减容固化、严格包装、安全运输、就地暂存、集中处置、控制排放、加强监测'，核心是以处置为目标。"},{"id":"basics_rad_0034","module":"basics","bank":"辐射防护基础","type":"judge","stem":"废物处置是指为废物安全和废物管理经济目的而采取一系列手段，从而改变废物物理及化学特性，如衰变、净化、浓缩、减容、从废物中去除放射性核素和改变其组成等。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》5.2节：题干所述'为废物安全和经济目的采取一系列手段改变废物物理及化学特性（衰变、净化、浓缩、减容、去除核素等）'是废物'处理'的内容——固体废物处理分预处理、处理、整备三个阶段，工艺有压缩装桶、焚烧、水泥固化等；处置则是将废物包安置于经批准的处置设施、不再回取的最终安排，故说法错误。易被误导处：'处理'与'处置'一字之差，前者改变废物特性，后者是最终安置。【易混点】管理原则：以安全为目的，以处置为核心。"},{"id":"basics_rad_0035","module":"basics","bank":"辐射防护基础","type":"judge","stem":"实现废物最小化的方法包括优化管理、减少源项、再利用和再循环和减容处理。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》《辐射防护（共性）》：废物最小化通过优化管理（避免产生、不必要的物品与外包装不带入控制区、按需使用耗材、分类收集、工完料尽场地清）、减少源项、再利用（重复利用）和再循环（循环再生）以及减容处理（压缩、焚烧）等途径实现，题干列举与课件要求一致，故说法正确。易被误导处：废物最小化不只是末端减容，更要从源头减少产生。【易混点】减少放射性废物（尤其固体废物）既是经济问题（处置费用高昂）也是辐射防护良好实践的体现，是每名辐射工作人员的义务。"},{"id":"basics_rad_0039","module":"basics","bank":"辐射防护基础","type":"single","stem":"1960 年的国际物理学会议和 1961 年的化学会议分别通过决议，确定以(     )作为原子质量单位；","options":["<ckeditor5><p>1 个<sup>12<\/sup>C 原子质量的十二分之一<\/p><\/ckeditor5>","<ckeditor5><p>1 个<sup>14<\/sup>C 原子质量的十二分之一<\/p><\/ckeditor5>","<ckeditor5><p>1 个 <sup>16<\/sup>O 原子质量的十二分之一<\/p><\/ckeditor5>"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"课件未直接覆盖。按原子物理通识：1960年国际物理学会议和1961年化学会议分别通过决议，统一以'1个¹²C原子质量的十二分之一'作为原子质量单位（1u），以消除此前物理学界（曾用¹⁶O）与化学界（曾用天然氧）标准不一致的问题，故选A。不选B：¹⁴C是放射性同位素（碳测年用），不作质量基准；不选C：¹⁶O是旧物理学标准，已被统一标准取代。【易混点】1u约等于1.66×10⁻²⁷kg，近似等于一个核子（质子或中子）的质量，核素质量数即以u为单位的近似值。"},{"id":"basics_rad_0040","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p>个人剂量当量指人体某一指定点下面某一深度 d 处的软组织内的剂量当量，记为Hp(d)，单位为 J•kg<sup>-1<\/sup>，剂量当量的单位是（ ）。<\/p><\/ckeditor5>","options":["希沃特","伦琴","居里"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《辐射防护（共性）》1.8节：个人剂量当量Hp(d)是有效剂量的测量近似值，单位为希沃特（Sv），1Sv=1J/kg，核电厂常用mSv、μSv（1Sv=1000mSv=1000000μSv），故选A。不选B：伦琴是照射量的旧单位，不是剂量当量单位；不选C：居里是放射性活度单位。【易混点】剂量（当量）单位Sv、活度单位Bq/Ci、照射量单位伦琴三者务必分开记；核电厂用电子剂量计（EPD）和热释光剂量计（TLD）监测记录个人剂量当量。"},{"id":"basics_rad_0041","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p>已知<sup> 60<\/sup>Co的半衰期为5.26a，某时刻<sup>60<\/sup>Co样品的原子核数目为10<sup>14<\/sup>个，问该时刻该样品的活度是多少？<\/p><\/ckeditor5>","options":["<ckeditor5><p>4.18×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>0.625×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>0.526×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>","<ckeditor5><p>5.26×10<sup>5<\/sup>Bq<\/p><\/ckeditor5>"],"answer":["A"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《反应堆物理基础》第二章：活度A=λN，衰变常数λ=ln2/T½。半衰期5.26a≈1.66×10⁸s，λ=0.693/(1.66×10⁸)≈4.18×10⁻⁹s⁻¹，故A=λN=4.18×10⁻⁹×10¹⁴≈4.18×10⁵Bq，选A。不选B/C/D：均未正确联立A=(ln2/T½)·N，常见错误是漏掉ln2、或未把半衰期换算成秒。【易混点】同章练习：16N半衰期7.4s，衰变到初始值的1/10约需24.6s，用的正是同一条衰变规律N(t)=N₀e^(−λt)。"},{"id":"basics_rad_0042","module":"basics","bank":"辐射防护基础","type":"judge","stem":"<ckeditor5><p><sup>17<\/sup>N、 <sup>19<\/sup>O、 <sup>18<\/sup>F 和 <sup>14<\/sup>C 均属于压水堆堆芯的裂变产物。<\/p><\/ckeditor5>","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《反应堆物理基础》第二章：一回路水中的16O、17O等核吸收中子发生16O(n,p)16N、17O(n,p)17N等反应，是中子活化的产物；《核电厂辐射防护基础》指出活化产物是'位于运行堆芯附近的一切物质被中子活化'形成，而裂变产物是核裂变的'碎片'（碘-131、铯-134/137、氙-133、氪-85等）。17N、19O、18F、14C是冷却剂中氧、碳等经活化生成的核素，不属裂变产物，故说法错误。易被误导处：它们确产生于堆芯，但机制是活化而非裂变。【易混点】裂变产物多为碘、铯、氙、氪等，活化产物多为冷却剂轻核与钴等结构材料核素。"},{"id":"basics_rad_0043","module":"basics","bank":"辐射防护基础","type":"single","stem":"放射性活度为一定数量放射性原子核在单位时间内发生衰变数量大小的物理量，以下有关活度单位的描述，正确的是（    ）。","options":["1贝可表示放射源发生1次衰变","<ckeditor5><p>1Ci＝3.7×10<sup>10<\/sup>Bq/秒<\/p><\/ckeditor5>","活度的国际单位为Bq"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《辐射防护（共性）》1.8节：'放射性活度：放射性物质在单位时间内自发衰变的次数，单位贝克（Bq），1Bq＝1次衰变/秒'，故活度的国际单位为Bq，C正确。不选A：漏掉'每秒'，1Bq是每秒发生1次衰变，不是总共发生1次衰变；不选B：Bq本身已含'每秒'之意，写成'Bq/秒'属单位重复、表述错误。【易混点】1Ci=3.7×10¹⁰Bq（约1克镭的活度）；CPS是每秒计数（探测器计数率），与Bq（每秒衰变数）概念不同，存在探测效率差别。"},{"id":"basics_rad_0044","module":"basics","bank":"辐射防护基础","type":"single","stem":"<ckeditor5><p><span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线束强度减弱为入射强度一半时，吸收材料厚度称为半吸收厚度，或半值层，关于<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线的减弱系数，以下描述正确的是（ ）。<\/p><\/ckeditor5>","options":["水的减弱系数最大","<ckeditor5><p>石蜡是<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线理想的屏蔽材料<\/p><\/ckeditor5>","<ckeditor5><p>铅对<span style='background-color:rgb(255,255,255);color:rgb(68,68,68);'>γ<\/span>射线的减弱系数大于水和石蜡<\/p><\/ckeditor5>"],"answer":["C"],"score":null,"source":"official","origin":"辐射基础.xls","explanation":"依据课件《核电厂辐射防护基础》1.3节：γ射线通过物质时因光电效应、康普顿散射和电子对效应而衰减，强度随屏蔽厚度按指数规律减弱，μ为线性衰减系数；γ屏蔽要用'非常厚实且密度高的材料（水泥墙、铅板、大量的水）'。铅原子序数高、密度大，对γ的减弱系数大于水和石蜡，故选C。不选A：水可作γ屏蔽但减弱系数远小于铅；不选B：石蜡含氢多，是中子而非γ的理想屏蔽材料。【易混点】半值层（半吸收厚度）即使强度减半的厚度，减弱系数越大半值层越薄。"},{"id":"basics_mat_0001","module":"basics","bank":"材料基础","type":"single","stem":"材料品种繁多，数以十万计。为了便于认识和应用，从不同角度对其进行了分类。按化学成分、生产过程、结构及性能特点可分为（     ）。","options":["金属材料、无机非金属材料、有机高分子材料、复合材料","金属材料、结构材料、功能材料、复合材料","金属材料、无机非金属材料、有机高分子材料、结构材料"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：按化学成分、结构及性能特点，材料分为金属材料、无机非金属材料、有机高分子材料和复合材料四大类。不选B：结构材料、功能材料是按用途划分的口径（课件中反应堆材料即分功能类、结构类），不属于按化学成分的分类；不选C：把按用途划分的“结构材料”混入成分分类，且遗漏了复合材料。【易混点】黑色金属专指铁、锰、铬及其合金，其余金属为有色金属，这是金属材料内部的再细分。"},{"id":"basics_mat_0002","module":"basics","bank":"材料基础","type":"single","stem":"核电站的寿命取决于（    ）","options":["核燃料","结构材料","功能材料"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：核电站的寿命取决于结构材料。压力容器等结构材料长期在苛刻条件下服役（RPV工作条件：15.5MPa、约300℃、中子辐照），且庞大而不可更换，其性能退化直接限定核电站寿命。不选A：核燃料可定期更换，不决定电站寿命；不选C：功能材料多可补充更换，也非寿命的决定因素。【易混点】正因RPV不可更换且材料存在低温脆性（DBTT随辐照升高），才必须开展全寿期监督。"},{"id":"basics_mat_0003","module":"basics","bank":"材料基础","type":"single","stem":"材料是反应堆安全的基础，防止堆内放射性物质外逸，压水反应堆第一道安全屏障是（   ）。","options":["燃料包壳","压力容器和一回路压力边界","安全壳"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：设置安全屏障是为防止堆内放射性物质外逸。按“三道屏障”口径（燃料包壳、一回路压力边界、安全壳），燃料包壳将裂变产物封闭在燃料棒内，是第一道安全屏障。不选B：压力容器和一回路压力边界是第二道屏障；不选C：安全壳是最后一道屏障。【易混点】课件第23页按“四道屏障”表述时为：燃料芯块→燃料包壳→压力容器和一回路压力边界→安全壳，芯块为第一道，注意区分两种口径。"},{"id":"basics_mat_0004","module":"basics","bank":"材料基础","type":"single","stem":"制造反应堆的材料活化截面也应该尽可能（ ），含长半衰期元素（  ），如Co。","options":["大，多","小，少","小，多"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：为减少放射性危害，制造反应堆的材料活化截面应尽可能小，含长半衰期元素（如Co）要少，故“小、少”正确——活化截面小，材料经中子辐照后产生的感生放射性就弱，便于检修与退役。不选A：“大、多”会生成大量放射性核素，加重放射性危害；不选C：活化截面小虽对，但长半衰期元素多仍会形成长寿命放射性核素。【易混点】课件所列典型活化产物：59Co→60Co、58Ni→58Co、56Mn、59Fe。"},{"id":"basics_mat_0005","module":"basics","bank":"材料基础","type":"single","stem":"拉伸实验时，试样拉断前所能承受的最大应力称为材料的 (   )。","options":["屈服强度","抗拉强度","弹性极限"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：抗拉强度σb是试样在断裂前所能承受的最大应力，与题干“拉断前所能承受的最大应力”一致。不选A：屈服强度σs是材料发生塑性变形前的最大承载应力；不选C：弹性极限是材料保持弹性变形的上限应力，超过后即出现塑性变形。【易混点】强度还有抗压、抗弯、抗剪、抗扭等种类；塑性用断后伸长率δ和断面收缩率ψ衡量。"},{"id":"basics_mat_0006","module":"basics","bank":"材料基础","type":"single","stem":"零件在外力作用下形状和尺寸所发生的变化称为(    )。","options":["变形","断裂","磨损"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"变形指零件在外力作用下形状和尺寸所发生的变化，按卸载后能否恢复分为弹性变形与塑性变形（课件《核电厂材料基础》）。不选B：断裂指零件发生开裂或折断，属失效行为；不选C：磨损是摩擦造成的表面材料损耗，与外力直接作用无必然关系。课件将断裂、腐蚀、磨损并列为材料失效的三大类形式。【易混点】外力逐渐增大时，金属依次经历弹性变形、弹塑性变形和断裂三个阶段。"},{"id":"basics_mat_0007","module":"basics","bank":"材料基础","type":"single","stem":"零件在外力作用下发生开裂或折断称为(    )","options":["断裂","变形","磨损"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"断裂指零件在外力作用下发生开裂或折断，是材料失效的重要形式之一，课件《核电厂材料基础》将断裂、腐蚀、磨损并列为材料失效三大类。不选B：变形只是形状和尺寸的改变，零件并未断开；不选C：磨损是摩擦导致的表面损耗，不是开裂折断。【易混点】课件：按断裂性质分脆性断裂与延性（韧性）断裂；按裂纹途径分穿晶断裂与沿晶断裂，沿晶断裂多表现为脆性断裂（如回火脆）。"},{"id":"basics_mat_0008","module":"basics","bank":"材料基础","type":"single","stem":"因摩擦而使零件尺寸、表面形状和表面质量发生变化的现象称为(    )。","options":["变形","断裂","磨损"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"磨损指因摩擦而使零件尺寸、表面形状和表面质量发生变化的现象，是相对运动接触表面材料逐渐损耗的结果，课件《核电厂材料基础》将其与断裂、腐蚀并列为失效三大类。不选A：变形是外力作用下形状尺寸的变化，与摩擦无关；不选B：断裂是开裂或折断，磨损并未使零件断开。【易混点】多种失效常耦合作用，如在腐蚀性介质中承受交变载荷的腐蚀疲劳，会加速裂纹萌生和扩展。"},{"id":"basics_mat_0009","module":"basics","bank":"材料基础","type":"single","stem":"国产45钢的含碳量是（    ）。","options":["0.45","0.045","0.0045"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：优质碳素结构钢牌号用两位数字表示平均含碳量的万分数，45钢即平均含碳量0.45%（万分之四十五），以质量分数表示即0.0045。不选A：0.45是百分数口径的数值，含碳量若达45%早已不是钢；不选B：0.045对应万分之四百五十，数量级错了一位。【易混点】含锰较高的须标出Mn（如45Mn）；高级优质钢、特级优质钢分别在牌号尾加A、E。"},{"id":"basics_mat_0010","module":"basics","bank":"材料基础","type":"single","stem":"由于核反应堆材料暴露在辐照场内，经受α、β、γ射线，中子、裂变产物的强辐照，在辐照下材料会发生降级、老化；在这些辐照中，高能快中子辐照对结构材料的影响极大，它会造成材料的（    ）。","options":["软化和脆化","强化和脆化","软化和变形"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：辐照脆化表现为屈服极限增加、塑性韧性下降——高能快中子造成原子离位损伤，缺陷聚集阻碍位错运动，材料在硬化的同时变脆，即“强化和脆化”。不选A：快中子辐照使材料硬化而非软化；不选C：辐照不导致软化，变形也不是其主要后果。【易混点】压力容器钢通过控制Cu（<0.08%）、P（<0.008%）含量并设置辐照监督试样来管理辐照脆化风险。"},{"id":"basics_mat_0011","module":"basics","bank":"材料基础","type":"single","stem":"强度是指材料在外力的作用下（ ）的能力。","options":["抵抗变形和破坏","产生塑性变形而不被破坏","抵抗其它更硬物体压入其表面"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：强度是材料在外力作用下抵抗变形和破坏的能力。不选B：产生塑性变形而不被破坏是塑性，以断后伸长率δ、断面收缩率ψ衡量；不选C：抵抗其它更硬物体压入其表面是硬度，有布氏HB、洛氏HR、维氏HV等试验方法。【易混点】五大力学指标：强度（抗拉强度σb、屈服强度σs）、塑性（ψ、δ）、韧性（冲击韧性ak/冲击功Ak），分别由拉伸、硬度、冲击等试验测定。"},{"id":"basics_mat_0012","module":"basics","bank":"材料基础","type":"single","stem":"下面描述不正确的是(    )","options":["控制材料是指中子吸收截面小的元素、合金或陶瓷等材料，它是反应堆实现可控和自持核裂变反应不可缺少的材料。人们利用它来对反应堆的反应性进行控制。","慢化材料是指其在与高能中子发生弹性碰撞中能有效地吸收中子能量，将核裂变时放出的快中子能量降到对裂变元素反应截面大的热中子水平的材料；","冷却剂是在反应堆一回路循环的载热流体。它的功能除了将核裂变能带出反应堆外，还有冷却堆内所有部件、携带流体可燃毒物(如硼酸)、携带除氧剂和调节pH的添加剂、事故工况下能迅速带走燃料发出的热量，避免堆芯烧毁等功能。"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：控制材料的特点是中子吸收截面大（如硼B-10、铪Hf、镉Cd），靠吸收中子实现反应性控制，A说“截面小”恰好说反，故A不正确。B对慢化材料的描述与课件一致：将裂变快中子慢化到热中子水平，提高235U裂变效率；C对冷却剂功能的描述也正确：冷却剂是将核裂变能导出堆芯的载热剂，兼有冷却各部件等功能。【易混点】堆芯结构材料与包壳则相反，要求中子吸收截面尽可能小，以减少寄生吸收。"},{"id":"basics_mat_0013","module":"basics","bank":"材料基础","type":"single","stem":"中国核电，反应堆设计和建造采用的核电标准是（    ）等。","options":["ASME、RCC-M、CSA、ГОСТ","ASME、RCC-M、ГОСТ、JIS","ASME、RCC-M、JIS、CSA"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：国内核电项目实际采用的规范标准——秦山一期、三门等用ASME（美），秦山三期用ASME+CSA（加），M310机组及衍生机组用RCC-M（法），田湾VVER机组用ГОСТ（俄），即ASME、RCC-M、CSA、ГОСТ。不选B：含日本JIS且漏掉CSA；不选C：含日本JIS且漏掉ГОСТ——JIS未在我国核电项目中采用。【易混点】KTA（德）、JIS（日）虽属国际主要核电规范体系，但国内项目未采用，勿混淆。"},{"id":"basics_mat_0014","module":"basics","bank":"材料基础","type":"single","stem":"屏蔽材料是为了减少人体所受的放射性照射，防止结构材料和机器设备受射线照射后发热、活化和性能下降，或者为了降低测量仪器的本底，采用屏蔽材料在辐射源和被照射物之间设置屏障。以下有关屏蔽材料不正确的是（   ）","options":["屏蔽g射线：原子序数越大的元素，屏蔽效果越差。","屏蔽中子：原子序数小的元素，尤其是含有大量氢的物质，通过弹性散射能使中子能量大幅度减小，屏蔽中子效果好。","屏蔽热量：可以采用多层不锈钢弧形瓦，通过拉大距离来实现热屏蔽的功能。"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：屏蔽γ射线主要靠密度大的材料，如铅、重混凝土——原子序数（密度）越大，衰减能力越强，A说“越大效果越差”恰好说反，故A不正确。B正确：中子屏蔽用轻质材料（轻水、石墨、石蜡），含氢多，通过弹性散射使中子能量大幅度减小；C正确：热屏蔽可用不锈钢弧形瓦或增大压力容器与堆芯间距离实现。【易混点】混凝土是很好的屏蔽材料，陆上固定式反应堆都用它作为各种屏蔽。"},{"id":"basics_mat_0015","module":"basics","bank":"材料基础","type":"single","stem":"压水堆、重水堆的包壳材料采用（  ）合金；沸水堆则采用（   ）合金作包壳；而快堆用（   ）作包壳。","options":["Zr-4、Zr-2、不锈钢","Zr-4、Zr-2、Zr-2.5Nb","Zr-4、Zr-2.5Nb、Zr-2"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：压水堆、重水堆包壳采用Zr-4合金（课件提到压水堆燃料封装于锆-4、M5等锆合金管内）；沸水堆因冷却剂含氧、过氧化氢，用更耐含氧水腐蚀的Zr-2合金；钠冷快堆不需慢化中子且钠温高，用不锈钢作包壳。不选B：Zr-2.5Nb是CANDU重水堆压力管材料，不是沸水堆包壳；不选C：将Zr-2.5Nb与Zr-2的位置对调，与实际不符。【易混点】锆合金的核心优势是中子吸收截面小、耐高温水腐蚀。"},{"id":"basics_mat_0016","module":"basics","bank":"材料基础","type":"single","stem":"焊接在核电厂建造中应用广泛且重要，尤其在压力容器建造时焊接质量更显其关键性作用，影响焊接质量的因素包括（    ）。","options":["焊接材质量、焊接工艺、焊接人员资格","焊接操作、焊接检验、焊接记录","以上都是"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：焊接质量受多环节共同控制——焊接材料质量、焊接工艺（课件指出焊接应力由不均匀加热引起，直接影响制造质量和使用性能）、焊接人员资格（HAF603规定民用核安全设备焊工操作工资格必须考核持证、强制执行），以及焊接操作、检验、记录等过程管理，故“以上都是”。不选A、B：各自只列出部分因素，均不全面。【易混点】焊接产生的应力和变形包括热应力、相变应力、残余应力等，均对钢结构有不良影响。"},{"id":"basics_mat_0017","module":"basics","bank":"材料基础","type":"single","stem":"材料的工作环境是十分恶劣的，对材料的要求也是十分苛刻的。这些恶劣的环境包括（  ）","options":["高温、高压、强辐照、腐蚀","高温、高压、强辐照","高温、强辐照、腐蚀"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：核反应堆工作条件非常严峻，所使用的材料必须在高温、高压、强辐照和极大的温度梯度条件下工作，同时还有腐蚀的影响，四个因素并存、缺一不可。不选B：漏掉腐蚀；不选C：漏掉高压，均不完整。【易混点】对一回路设备材料的性能要求涵盖核性能、化学、物理、力学、辐照、工艺性能和经济性七个方面。"},{"id":"basics_mat_0018","module":"basics","bank":"材料基础","type":"single","stem":"堆芯材料、燃料包壳、调节棒、慢化剂材料，对中子吸收截面的要求，依次是（   ）","options":["大、小、大、小","小、小、大、小","小、小、大、大"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：堆芯材料中子吸收截面小（减少中子损失、提高燃耗）；燃料包壳（锆合金）截面小；调节棒用Ag-In-Cd等中子吸收截面大的材料以控制反应性；慢化剂要求吸收截面小、反射（散射）截面大。故依次为“小、小、大、小”。不选A：堆芯材料若截面大将产生寄生吸收，经济性差；不选C：慢化剂若吸收截面大则无法有效慢化中子。【易混点】反射材料同样要求原子量小、散射截面大、吸收截面小。"},{"id":"basics_mat_0019","module":"basics","bank":"材料基础","type":"single","stem":"压水反应堆有三道安全屏障，其中第二道安全屏障是（    ）。","options":["包壳","安全壳","压力容器"],"answer":["C"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：按“三道屏障”口径，第一道为燃料包壳，第二道为压力容器和一回路压力边界——保持一回路系统压力、防止冷却剂沸腾，燃料元件破损时将放射性保留在一回路系统内，故选压力容器。不选A：包壳是第一道；不选B：安全壳是第三道（最后一道）。【易混点】课件第23页按四道屏障表述：燃料芯块、燃料包壳、压力容器和一回路压力边界、安全壳，两种口径都要掌握。"},{"id":"basics_mat_0020","module":"basics","bank":"材料基础","type":"single","stem":"核电厂使用的材料中，铅通常用于哪种用途使用？（    ）","options":["屏蔽材料","主蒸汽管道","慢化剂"],"answer":["A"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：射线屏蔽材料主要靠密度大的材料，铅密度高、原子序数大，对γ射线衰减能力强，是典型屏蔽材料。不选B：主蒸汽管道属二回路设备，用低碳钢类材料（课件举例SA106B、16Mn）制造；不选C：慢化剂用轻水、重水、石墨等质量轻、散射截面大的材料，铅会大量吸收中子，绝不能作慢化剂。【易混点】中子屏蔽与γ屏蔽相反，要用含氢多的轻质材料（轻水、石墨、石蜡）。"},{"id":"basics_mat_0021","module":"basics","bank":"材料基础","type":"judge","stem":"金属是指单一元素构成的具有特殊的光泽延展性导电性导热性的物质。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：金属通常具有良好的导电性、导热性、延展性、高的密度和高的光泽，金属即由金属元素构成的单质（单一元素构成），故说法正确。易被误导处：有人会因“金属材料包括合金”而犹豫——金属材料才是金属及其合金的总称，单说“金属”指单质本身。【易混点】金属具有正的电阻温度系数，这是区别于非金属的重要电学特征。"},{"id":"basics_mat_0022","module":"basics","bank":"材料基础","type":"judge","stem":"铁、锰、铬及其合金，统称为黑色金属材料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：金属材料分黑色金属与有色金属两大类，黑色金属即铁、锰、铬及以它们为基的合金（钢、铸铁均属此类），铜、镍、钛、铝等其余金属为有色金属，故说法正确。易被误导处：易误以为“黑色”指外观颜色——不锈钢呈银白色仍属黑色金属，“黑色”只是分类习惯称谓。【易混点】核电站主要设备的结构材料绝大多数是金属材料，其中不锈钢占80%-90%。"},{"id":"basics_mat_0023","module":"basics","bank":"材料基础","type":"judge","stem":"金属的晶体结构是有缺陷的。金属在凝固、冷加工、热加工、形变、辐照、再结晶、同素异构转变中等都可能使原子排列的规律性在局部区域遭到破坏，因而产生晶体缺陷。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：课件原文指出，金属在凝固、冷加工、热加工、形变、辐照、再结晶、同素异构转变等过程中，都可能使原子排列的规律性在局部区域遭到破坏，从而产生晶体缺陷，故说法正确。易被误导处：易误以为理想晶体才是常态——实际金属都是不完美晶体，缺陷普遍存在。【易混点】晶体缺陷分三类：点缺陷（空位、间隙原子、置换原子）、线缺陷（刃型/螺型位错）、面缺陷（晶界、亚晶界、相界等）。"},{"id":"basics_mat_0024","module":"basics","bank":"材料基础","type":"judge","stem":"金属材料是金属及其合金的总称。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：材料分金属材料、无机非金属材料、有机高分子材料、复合材料四大类，金属材料即金属及其合金的总称（内部再分黑色、有色金属两类），故说法正确。易被误导处：合金由多种元素组成，但仍属金属材料，勿因“总称”二字而怀疑该定义。【易混点】无机非金属材料即陶瓷材料，有机高分子材料即塑料（聚合物），复合材料按基体分金属基、陶瓷基、高分子基。"},{"id":"basics_mat_0025","module":"basics","bank":"材料基础","type":"judge","stem":"材料的冲击韧性是指材料在冲击载荷作用下抵抗变形和断裂的能力。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：冲击韧性是材料在冲击载荷作用下抵抗变形和断裂的能力，以冲击试验测定，冲击韧度ak为试样缺口处单位截面积上消耗的冲击功（J/cm²），故说法正确。易被误导处：易与断裂韧度混淆——断裂韧度KIC表征材料阻止裂纹扩展的能力，针对低应力脆断问题。【易混点】韧脆转变温度越低，材料低温冲击韧性越好；RPV钢的DBTT随辐照而升高，是寿期监督重点。"},{"id":"basics_mat_0026","module":"basics","bank":"材料基础","type":"judge","stem":"由于重水吸收热中子的几率小，所以中子经济性好，以重水作为慢化剂的反应堆，可以采用天然铀作为核燃料，从而使得建造重水堆的国家，不必建造浓缩铀工厂。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：CANDU重水堆用重水作慢化剂和冷却剂、以天然铀作燃料。重水吸收热中子的几率小，中子经济性好，堆内中子足以维持天然铀的链式裂变反应，因此建造重水堆的国家不必建造浓缩铀工厂，故说法正确。易被误导处：易与轻水堆混淆——轻水吸收中子多，必须使用低浓铀燃料。【易混点】CANDU堆另一特点是堆芯用压力管代替压力容器，且可不停堆更换燃料。"},{"id":"basics_mat_0027","module":"basics","bank":"材料基础","type":"judge","stem":"一个核反应堆的建成，不论其取得能量的物理理念、物理模式怎样好，如果不能找到与之条件相适应的材料，在实际中也不可能成功。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：费米1946年即指出“核技术成功的关键取决于堆内强辐射下材料的行为”。材料是实现反应堆设计的物质基础，物理理念再先进，找不到与高温、高压、强辐照等条件相适应的材料，反应堆在实际中也不可能建成，故说法正确。易被误导处：易低估材料地位，以为仅靠物理设计即可决定成败。【易混点】反应堆材料对堆型的设计、建造和寿命都有密切关系，起着重要的先导作用。"},{"id":"basics_mat_0028","module":"basics","bank":"材料基础","type":"judge","stem":"通常说钢比铸铁抗拉强度高，是指单位截面积的承力能力前者高，后者低。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：强度是材料在外力作用下抵抗变形和破坏的能力，按单位截面积的承力能力（应力）定义，是材料本身的本质属性，与零件截面大小无关。钢与铸铁按同一口径比较，钢的抗拉强度更高，故说法正确。易被误导处：若把“承力”理解为整根零件能承受的总载荷，粗大的铸铁件可能承受更大总力，但单位截面积承力仍是钢高。【易混点】铸铁抗压能力可观而抗拉强度低，故多用于受压构件。"},{"id":"basics_mat_0029","module":"basics","bank":"材料基础","type":"judge","stem":"传热管材料通常需要需具备：导热性能好、热膨胀系数小；抗应力腐蚀能力强；热强性、热稳定性和焊接性能良好；塑韧性好，以便制管、弯管和胀管的加工。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：课件明确传热管材料需具备：导热性能好、热膨胀系数小；抗应力腐蚀能力强；热强性、热稳定性和焊接性能良好；塑韧性好以便制管、弯管和胀管加工，与题干完全一致，故说法正确。易被误导处：易漏掉“便于制管、弯管、胀管”这类工艺性要求——数千根U形管（总长约70-110公里）的加工离不开良好塑韧性。【易混点】传热管材料历经304不锈钢→INCONEL-600→INCOLOY-800/INCONEL-690的演变，起因正是腐蚀问题。"},{"id":"basics_mat_0030","module":"basics","bank":"材料基础","type":"judge","stem":"一般来说，硬度高的材料其强度也较高。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：硬度和强度都反映材料抵抗塑性变形的能力，对金属材料两者近似正相关，一般硬度越高强度也越高，故说法正确。易被误导处：两者并非严格一一对应，不同材料、不同强化机制下由硬度推算强度会有偏差，不能绝对化。【易混点】硬度试验方法：压入法（布氏HB、洛氏HR、维氏HV）、划痕法、回跳法（里氏硬度HL）。"},{"id":"basics_mat_0031","module":"basics","bank":"材料基础","type":"judge","stem":"选材时，只要满足工件使用要求即可，并非各项性能指标越高越好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：选材在满足使用要求的基础上还要考虑经济性——工艺简单易行、原材料来源方便、制造成本低廉，并优先选用工艺成熟、使用经验丰富的材料，并非各项指标越高越好，故说法正确。易被误导处：盲目追求高指标会推高成本，某些高强材料还可能焊接性、韧性变差，反而不利。【易混点】核电选材“成熟、保守”的原则，是降低不确定性风险的重要手段。"},{"id":"basics_mat_0032","module":"basics","bank":"材料基础","type":"judge","stem":"核电厂可以自行授权民用核安全设备焊接工的操作资格。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：国家《民用核安全设备焊工操作工资格管理规定（HAF603）》对民用核安全设备焊接工的操作资格作了规定，该规定是强制执行要求，是核安全局对核电焊接工作监管的重要内容之一，资格须按规定考核合格取得，核电厂不能自行授权，故说法错误。易被误导处：企业内部培训考核不等于国家资格许可。【易混点】无损检验人员同样须按HAF602持证上岗，同为强制要求。"},{"id":"basics_mat_0033","module":"basics","bank":"材料基础","type":"judge","stem":"金属在外力作用下的变形可分为弹性变形、弹塑性变形和断裂三个价段。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：金属在外力逐渐增大的作用下，先发生弹性变形（卸载后消失），随后进入弹塑性变形阶段（塑性部分不可恢复），最终发生断裂，即弹性变形、弹塑性变形和断裂三个阶段，故说法正确。易被误导处：易把第三阶段误写成“塑性变形”，与第二阶段的“弹塑性变形”重复——弹塑性阶段本就包含塑性成分。【易混点】与三阶段对应的特征应力依次是弹性极限、屈服强度、抗拉强度。"},{"id":"basics_mat_0034","module":"basics","bank":"材料基础","type":"judge","stem":"核动力设备的材料必须按照其使用条件合理选用，并参考国家制定的相应规范和标准。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：核动力设备的材料必须按照其使用条件合理选用，必须符合（而非仅“参考”）国家制定的相应规范和标准——核安全法规标准是强制性要求，故说法错误。易被误导处：“参考”一词看似差别不大，实则把强制性标准降格为自愿性依据，属原则性错误。【易混点】材料规范控制、设计变更中的材料替代管理，都是全厂材料管理防止错用材料的重要环节。"},{"id":"basics_mat_0035","module":"basics","bank":"材料基础","type":"judge","stem":"低碳钢的强度、硬度较低，但塑性、韧性及焊接性能较好。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：低碳钢含碳量一般低于0.25%，因含碳量低，其强度、硬度较低，但塑性、韧性和焊接性能较好，故说法正确。易被误导处：勿把“强度硬度低”当成缺点而误判——焊接性好正是其广泛用于管道和钢结构的原因。【易混点】课件举例：低碳钢（SA106B、16Mn）用于二、三级设备、主蒸汽管道、二回路管道和安全壳衬里。"},{"id":"basics_mat_0036","module":"basics","bank":"材料基础","type":"judge","stem":"ZG200-400表示该铸造碳钢的屈服强度为200Mpa、而其抗拉强度为400Mpa。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：铸造碳钢牌号由ZG加两组数字组成，分别表示屈服强度和抗拉强度（单位MPa），ZG200-400即屈服强度200MPa、抗拉强度400MPa，故说法正确。易被误导处：易与优质碳素结构钢牌号混淆——45钢的数字表示含碳量万分数，而ZG牌号的数字是强度值，与含碳量无关。【易混点】碳素结构钢Q235中的235表示屈服强度235MPa，同一位置的数字在不同钢类中含义不同。"},{"id":"basics_mat_0037","module":"basics","bank":"材料基础","type":"judge","stem":"切尔诺贝利核电站事故以来，由于对核系统安全性的考虑，对材料的性能要求也越来越高，合理选材就显得越来越重要。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"课件未直接覆盖：切尔诺贝利核电站事故以来，核安全受到空前重视，对核系统安全性的考虑不断提高，对材料的性能要求（辐照监督、老化管理等）随之越来越高，合理选材显得越来越重要，故说法正确。易被误导处：易以为事故只与运行操作有关而与材料无关——事故后果的控制很大程度上依赖材料与设备的可靠性。【易混点】老化管理正是通过监测、控制构筑物、系统和部件的老化，来提高核电厂安全性和可靠性的活动。"},{"id":"basics_mat_0038","module":"basics","bank":"材料基础","type":"judge","stem":"核技术成功的关键取决于堆内强辐射下材料的行为。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：此即费米1946年名言“核技术成功的关键取决于堆内强辐射下材料的行为”。材料长期在堆内强辐射场中服役，其辐照下的行为直接决定反应堆的安全性、可靠性和经济性，故说法正确。易被误导处：易以为关键在物理设计或运行管理，但材料才是承载一切设计的物质基础。【易混点】辐照效应主要包括辐照脆化（屈服极限增加、塑性韧性下降）、辐照肿胀（燃料芯块）和活化。"},{"id":"basics_mat_0039","module":"basics","bank":"材料基础","type":"judge","stem":"核电厂可以参考国家的法规标准要求，对核岛以及常规岛相关承压部件进行定期无损检测，发现使用中出现的缺陷。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：在役检查是电厂按照相关法规以及核安全监管部门的要求必须强制实施的工作，相应的在役检查大纲是电厂获颁运行许可证必须提交的管理性文件之一，不能只是“参考”，故说法错误。易被误导处：“参考国家法规标准”的措辞看似合理，实则把强制要求弱化为自愿行为。【易混点】役前检查提供初始状态（“零点”）数据，作为以后在役检查结果的比较依据。"},{"id":"basics_mat_0040","module":"basics","bank":"材料基础","type":"judge","stem":"核电材料应优先选用工艺成熟，使用经验丰富的材料。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：反应堆材料的性能要求中包含经济性——工艺简单易行、原材料来源方便、制造成本低廉，且在满足要求的基础上应优先选用工艺成熟、使用经验丰富的材料，故说法正确。易被误导处：并非越新、越高级的材料越好，缺乏使用经验的新材料反而引入不确定性风险。【易混点】反应堆及一回路主要结构材料约90%以上为锆合金、合金钢、不锈钢、镍基合金，其中不锈钢占80%-90%。"},{"id":"basics_mat_0041","module":"basics","bank":"材料基础","type":"judge","stem":"核电材料中凝汽器传热管使用的是钛合金。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：设备冷却器、凝汽器传热管使用钛合金——钛合金耐海水及含氯冷却水腐蚀的性能优良，故说法正确。易被误导处：凝汽器走循环冷却水（常为海水），腐蚀环境苛刻，普通不锈钢易发生点蚀、应力腐蚀，不能想当然以为都用不锈钢。【易混点】蒸发器U形管用的是镍基合金（Incoloy 800、Inconel 690），两者用途勿混。"},{"id":"basics_mat_0045","module":"basics","bank":"材料基础","type":"single","stem":"沸水堆、压水堆、CANDU堆、钠冷快中子增殖堆，所使用的冷却材料分别是（       ）","options":["<ckeditor5><p>石墨、轻水（H<sub>2<\/sub>O）、重水(D<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>","<ckeditor5><p>轻水（H<sub>2<\/sub>O）、轻水（H<sub>2<\/sub>O）、重水(D<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>","<ckeditor5><p>轻水（H<sub>2<\/sub>O）、轻水（H<sub>2<\/sub>O）、超重水(T<sub>2<\/sub>O)、液态钠<\/p><\/ckeditor5>"],"answer":["B"],"score":null,"source":"official","origin":"材料基础.xls","explanation":"依据课件《核电厂材料基础》：沸水堆和压水堆都以轻水作冷却剂（压水堆的冷却剂与慢化剂功能合一），CANDU重水堆用重水作慢化剂和冷却剂，钠冷快中子堆用液态金属钠载热，故B正确。不选A：石墨是慢化剂（如高温气冷堆用），不是冷却剂，且沸水堆用的是轻水；不选C：超重水（T2O）不是工程上实际使用的冷却剂。【易混点】常用冷却剂还有He、CO2、钠钾合金、铅铋合金以及熔盐等。"},{"id":"basics_wc_0004","module":"basics","bank":"水化学","type":"single","stem":"周期表由七个横行和十八个纵列组成。横行称周期，纵列称族，由_____个主族（A族）、8个副族（B族）和1个零族组成。","options":["7.0","8.0","9.0"],"answer":["A"],"score":null,"source":"official","origin":"水化学.xls","explanation":"依据课件《核电厂水化学基础》第10页：周期表十八个纵列组成的“族”由7个主族（A族）、8个副族（B族）和1个零族构成，7个主族即ⅠA~ⅦA，故填7.0。不选B(8.0)：8是副族（B族）的数目，不是主族；不选C(9.0)：周期表中不存在9个主族的划分。【易混点】7主族+8副族+1零族共16个族却对应18个纵列，原因是第Ⅷ族（属副族）独占3个纵列。"},{"id":"basics_wc_0005","module":"basics","bank":"水化学","type":"single","stem":"水的pH值大小反映水的酸碱度，当水温升高时，pH中性值下降，纯水温度在300℃时，其pH为______。","options":["6.5","7.5","
