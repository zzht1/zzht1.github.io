1年3月11日日本东北太平洋地区发生里氏9.0级地震并引发海啸，福岛第一核电厂放射性物质泄漏。\n· 福岛核事故被定为核事故最高分级7级，与切尔诺贝利核事故同级。\n· 福岛核事故后中国国务院做出四项决定：全面安全检查、加强运行核设施安全管理、全面审查在建核电站、严格审批新上核电项目。\n· 福岛核事故后中国全面放缓核电建设，暂停所有内陆核电开发项目。"},{"id":"qihang_dyk_0010","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"2015年我国核工业创建60周年之际，习近平总书记作出重要批示：“发展是第一要务，（　）是第一资源，创新是第一动力”。","options":["第一要务","第一动力","第一责任","第一资源"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第9页领导关怀部分载明，2015年我国核工业创建60周年之际，习近平总书记作出重要批示：\"发展是第一要务，人才是第一资源，创新是第一动力\"。故本题选D（第一资源）。\"第一要务\"对应\"发展\"、\"第一动力\"对应\"创新\"，均为批示中原有的搭配。\n\n【知识点】\n· 2015年是我国核工业创建60周年。\n· 习近平总书记批示：发展是第一要务，人才是第一资源，创新是第一动力。\n· 60年来几代核工业人艰苦创业、开拓创新，推动我国核工业从无到有、从小到大。\n· 核工业是高科技战略产业，是国家安全重要基石，要坚持安全发展、创新发展，坚持和平利用核能。"},{"id":"qihang_dyk_0011","module":"qihang","bank":"启航-入职第一课","type":"single","stem":"按照我国电力碳达峰、碳中和路径研究，2035年核电发电量在电力结构中的占比目标为（　）。","options":["5%","10%","15%","20%"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第30页\"中国核电行业前景\"部分指出\"核电发电量在电力结构中的占比：10%（2035年）；20%（2060年）\"，来源为舒印彪等《我国电力碳达峰、碳中和路径研究》。故本题选B（10%）。\n\n【知识点】\n· 按我国电力碳达峰、碳中和路径研究，2035年核电发电量在电力结构中占比目标为10%。\n· 2060年核电发电量在电力结构中占比目标为20%。\n· 中国核电建造趋势：预计每年核准6-8台机组（核能发展蓝皮书）。\n· 数据来源：舒印彪，张丽英，张运洲等，我国电力碳达峰、碳中和路径研究[J].中国工程科学,2021,23(6)。"},{"id":"qihang_dyk_0012","module":"qihang","bank":"启航-入职第一课","type":"judge","stem":"中国核电的控股股东是中国广核集团有限公司。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电2026年新员工入职第一课课件","explanation":"依据课件《中国核电2026年新员工入职第一课》：课件第11页中国核能电力股份有限公司部分明确写道，中国核电\"控股股东为中国核工业集团有限公司\"。题干称控股股东为\"中国广核集团有限公司\"，与课件原文矛盾，故本题判断为错误。\n\n【知识点】\n· 中国核电的控股股东是中国核工业集团有限公司（中核集团）。\n· 中国核电是中国最大的核电运营商之一，是首家A股上市的纯核电公司。\n· 中国核电注册资本205.68亿元，总部设于北京。\n· 2015年6月10日中国核电在上海证券交易所挂牌上市，股票代码601985。"},{"id":"qihang_flhg_0001","module":"qihang","bank":"启航-法律合规","type":"single","stem":"《中央企业合规管理办法》（国资委令42号）的施行时间是（　）。","options":["2018年11月1日","2021年1月9日","2022年10月1日","2023年1月1日"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第5页在给出合规定义时引用法规原文，明确标注\"——《中央企业合规管理办法》（国资委令42号）2022.10.01施行\"；第15页又指出\"2022年，国务院国资委'合规管理强化年'，印发《中央企业合规管理办法》\"。故施行时间为2022年10月1日，选C。干扰项中，2018年11月1日是国务院国资委颁布《中央企业合规管理指引（试行）》（国资发法规〔2018〕106号）的时间，2021年1月9日是《阻断外国法律与措施不当域外适用办法》的施行时间，均与题干法规不符。\n\n【知识点】\n· 《中央企业合规管理办法》（国资委令42号）2022年10月1日施行。\n· 该办法对合规的定义：中央企业及其员工的经营管理行为符合法律法规、监管规定、行业准则和国际条约、规则、标准，以及企业章程、规章制度等要求。\n· 2022年为国务院国资委\"合规管理强化年\"，印发《中央企业合规管理办法》。\n· 2018年11月1日国务院国资委颁布《中央企业合规管理指引（试行）》，是合规定义在国内规范文件中的源头之一。"},{"id":"qihang_flhg_0002","module":"qihang","bank":"启航-法律合规","type":"single","stem":"美国《反海外腐败法》（FCPA）颁布于（　）年。","options":["1972年","1977年","1988年","1998年"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第7页在介绍合规起源时指出\"1972年'水门事件'发生后……1977年，证券交易委员会在一份报告中披露……同年，美国国会通过FCPA\"；第21页再次明确\"1977年美国出台《反海外腐败法》\"。故FCPA颁布于1977年，选B。干扰项1972年是\"水门事件\"发生的年份，是FCPA出台的背景事件而非颁布年份。\n\n【知识点】\n· 1977年美国国会通过《反海外腐败法》（FCPA），也叫《反海外贿赂法》。\n· 1972年\"水门事件\"后民众要求加强对政府官员和大企业行为的监督，是FCPA出台的背景。\n· FCPA是第一部完全针对美国本国公司向海外政府机构贿赂行为的法律。\n· 此时的FCPA尚未把外国企业作为执法对象。"},{"id":"qihang_flhg_0003","module":"qihang","bank":"启航-法律合规","type":"single","stem":"美国《反海外腐败法》（FCPA）的主要条款是（　）。","options":["反贿赂条款和会计条款","反垄断条款和反倾销条款","出口管制条款和制裁条款","反洗钱条款和数据合规条款"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第22页明确指出\"FCPA颁布于1977年，经过1988、1994、1998年三次修改，其主要条款为'反贿赂条款'和'会计条款'\"。故选A。课件还分别解释了反贿赂条款（禁止向外国官员行贿以取得或维持业务）和会计条款（保持记录、内部控制）的具体内容，而反垄断、出口管制、反洗钱等均为课件列出的其他合规领域，不属于FCPA条款。\n\n【知识点】\n· FCPA主要条款为\"反贿赂条款\"和\"会计条款\"。\n· 反贿赂条款：禁止个人和企业直接或间接向外国官员、政府雇员、外国政党或政治候选人等支付任何有价物品，既禁止直接贿赂也禁止通过第三方贿赂。\n· 会计条款：一是保持记录，制作并保留合理详细、精确的账簿记录；二是内部控制，设计并维持内部财务控制制度。\n· FCPA经过1988、1994、1998年三次修改。"},{"id":"qihang_flhg_0004","module":"qihang","bank":"启航-法律合规","type":"single","stem":"（　）年被称为“中国企业合规元年”。","options":["2015年","2016年","2017年","2018年"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第14页介绍2018年11月国务院国资委颁布《中央企业合规管理指引（试行）》、2018年12月国家发展改革委等七部委联合下发《企业境外经营合规管理指引》之后，明确提出\"2018年'中国企业合规元年'\"。故选D。2015年、2016年、2017年虽然也有合规相关政策出台（如2015年《关于全面推进法治央企建设的意见》、2016年五家央企合规试点），但均不被称\"合规元年\"。\n\n【知识点】\n· 2018年被称为\"中国企业合规元年\"。\n· 2018年11月国务院国资委颁布《中央企业合规管理指引（试行）》。\n· 2018年12月国家发展改革委、外交部、商务部、人民银行、国资委、外汇局、全国工商联联合下发《企业境外经营合规管理指引》。\n· 2016年国资委在中石油、中国移动、中国中铁、招商局、东方电气五家央企开展合规管理体系建设试点。"},{"id":"qihang_flhg_0005","module":"qihang","bank":"启航-法律合规","type":"single","stem":"SDN名单（特别指定国民和被禁实体名单）的发布机构是（　）。","options":["美国司法部","美国商务部","美国财政部外国资产管制办公室（OFAC）","美国证券交易委员会"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第30页明确指出\"SDN清单（List of Specially Designated Nationals and Blocked Persons，即特别指定国民和被禁实体名单），是由OFAC（Office of Foreign Assets Control of the U.S. Department of Treasury，即美国财政部下属的外国资产管理办公室）发布并不定期更新\"。故发布机构为美国财政部外国资产管制办公室（OFAC），选C。美国司法部、商务部、证券交易委员会在课件中分别出现在FCPA执法、出口管制（中兴案）等场景，不负责发布SDN名单。\n\n【知识点】\n· SDN名单全称：特别指定国民和被禁实体名单，由美国财政部下属的OFAC发布并不定期更新。\n· 名单所含组织和个人均为受制裁目标，\"美国主体\"不得与其开展任何交易，并应冻结其在美财产。\n· 非美国人（如中国个人和实体）与SDN进行重大交易，可能受限于美国的二级制裁。\n· 若企业违反美国经济制裁法律法规，可能被列入经济制裁领域黑名单（例如SDN清单）。"},{"id":"qihang_flhg_0006","module":"qihang","bank":"启航-法律合规","type":"single","stem":"关于二级制裁（Secondary Sanctions），下列说法正确的是（　）。","options":["主要针对美国主体与受制裁对象开展的特定行为","主要针对非美国主体在美国境外从事的违反美国制裁规定的行为","只针对外国政府机关的官方行为","只适用于联合国安理会决议列明的主体"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第28页明确区分两种制裁：\"一级制裁（Primary Sanctions）主要针对美国主体与受制裁的特定国家、组织或个人开展特定行为\"；\"二级制裁（Secondary Sanctions）主要针对非美国主体在美国境外从事的非美国许可行为。如非美国主体在美国境外从事的行为违反美国制裁的规定，美国政府可对该等非美国主体实施二级制裁，包括将其列入《SDN名单》\"。故B正确。A描述的是\"一级制裁\"；C、D的表述课件中均无依据。\n\n【知识点】\n· 二级制裁主要针对非美国主体在美国境外从事的违反美国制裁规定的行为。\n· 一级制裁主要针对美国主体与受制裁的特定国家、组织或个人开展特定行为。\n· 对非美国主体实施二级制裁的措施之一是将其实施二级制裁的主体列入SDN名单，以禁止美国主体与其交易。\n· 制裁方式包括贸易制裁、金融制裁、待遇制裁；按适用范围分为一级制裁和二级制裁。"},{"id":"qihang_flhg_0007","module":"qihang","bank":"启航-法律合规","type":"single","stem":"根据《国际紧急经济权力法案》（IEEPA）第1705条，违法行为人每宗违法交易可能被处以的民事罚款为（　）。","options":["10万美元或所涉交易金额一倍","25万美元或所涉交易金额两倍","50万美元或所涉交易金额三倍","100万美元固定罚款"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第30页\"违反美国经济制裁的后果\"部分明确指出：\"根据《国际紧急经济权力法案》（IEEPA）第1705条的规定，违法行为人每宗违法交易可能被处以25万美元或所涉交易金额两倍的民事罚款\"。故选B。其他数额（10万、50万、100万固定罚款）均与课件给出的标准不符。\n\n【知识点】\n· 依据IEEPA第1705条，违法行为人每宗违法交易可能被处25万美元或所涉交易金额两倍的民事罚款。\n· 违反美国经济制裁的后果之一是承担民事责任或行政处罚。\n· 此外企业可能被列入经济制裁领域黑名单（如SDN清单）。\n· 非美国人与SDN进行重大交易可能受限于美国的二级制裁。"},{"id":"qihang_flhg_0008","module":"qihang","bank":"启航-法律合规","type":"single","stem":"2010年英国出台《反贿赂法》，其新增的罪名是（　）。","options":["未有防止商业贿赂罪","跨境洗钱罪","商业间谍罪","内幕交易罪"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第21页在介绍反腐败与反商业贿赂的制度发展时指出\"2010年英国出台《反贿赂法》，新增未有防止商业贿赂罪，对未有防止商业贿赂的企业加以处罚。但企业可以通过采取诸如建立有效的合规管理体系等措施来抗辩，减免责任\"。故新增罪名为\"未有防止商业贿赂罪\"，选A。洗钱罪、商业间谍罪、内幕交易罪在课件中均无对应表述。\n\n【知识点】\n· 2010年英国《反贿赂法》新增\"未有防止商业贿赂罪\"，对未防止商业贿赂的企业加以处罚。\n· 企业可通过建立有效的合规管理体系等措施进行抗辩，减免责任。\n· 2004年修订后的美国《针对机构实体的联邦量刑指南》（FSGO）明确了企业建立有效合规体系可以减轻处罚的原则。\n· 2016年法国通过《萨宾第二法案》，明确要求企业建立合规制度。"},{"id":"qihang_flhg_0009","module":"qihang","bank":"启航-法律合规","type":"single","stem":"《中华人民共和国反外国制裁法》由（　）颁布实施。","options":["国务院","商务部","全国人大常委会","国家发展改革委"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第34页明确指出\"2021年06月10日，全国人大常委会颁布实施《中华人民共和国反外国制裁法》\"。故该法由全国人大常委会颁布实施，选C。国务院、商务部、国家发展改革委虽在反制机制中承担职能（如国务院有关部门决定列入反制清单），但颁布法律的主体是全国人大常委会。\n\n【知识点】\n· 《中华人民共和国反外国制裁法》于2021年6月10日由全国人大常委会颁布实施。\n· 该法针对外国国家以各种借口或依据其本国法律对我国进行遏制打压、对我国公民和组织采取歧视性限制措施、干涉我国内政的情形。\n· 国务院有关部门可以决定将直接或间接参与制定、决定、实施歧视性限制措施的个人、组织列入反制清单。\n· 案例：2021年7月中方依据《反外国制裁法》对7个美方人员和实体实施制裁。"},{"id":"qihang_flhg_0010","module":"qihang","bank":"启航-法律合规","type":"single","stem":"中国核电发布“601985”合规品牌时揭幕发布的合规形象（吉祥物）名称是（　）。","options":["核小合","合规侠","小核宝","中核通"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第40页\"合规文化培育\"部分明确指出\"公司发布'601985'合规品牌，公司党委书记、董事长卢铁忠和总法律顾问张勇揭幕发布'核小合'合规形象\"。故合规形象（吉祥物）名称为\"核小合\"，选A。其余选项均为干扰项，课件中无依据。\n\n【知识点】\n· 中国核电发布\"601985\"合规品牌。\n· 合规形象（吉祥物）名称为\"核小合\"，由公司党委书记、董事长卢铁忠和总法律顾问张勇揭幕发布。\n· 中国核电实施\"星火计划\"，营造人人、事事、时时的合规文化。\n· 合规文化培育是中国核电法律合规管理的组成部分。"},{"id":"qihang_flhg_0011","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"下列属于美国实施全面制裁的国家/地区有（　）。","options":["伊朗","朝鲜","古巴","俄罗斯"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第29页\"现行美国制裁国家/地区列表\"中明确标注\"朝鲜（全面制裁）\"\"古巴（全面制裁）\"\"叙利亚（全面制裁）\"\"克里米亚地区（全面制裁）\"\"伊朗（全面制裁）\"；第33页应对措施部分再次明确：\"不得与……美国全面制裁国家和地区（即：伊朗、朝鲜、古巴、叙利亚以及乌克兰克里米亚地区）进行任何交易或向其提供任何服务\"。故伊朗、朝鲜、古巴属于全面制裁对象，选ABC。俄罗斯虽在美国制裁列表之中（第29页），但不属于\"全面制裁\"，故D不选。\n\n【知识点】\n· 美国实施全面制裁的国家/地区包括：伊朗、朝鲜、古巴、叙利亚以及乌克兰克里米亚地区。\n· 现行美国制裁的国家/地区共有20个，不同制裁计划项下措施有所不同。\n· 按被制裁主体属性，制裁分为全面制裁、行业或物品制裁、\"聪明\"制裁。\n· 中国企业应避免与SDN及美国全面制裁国家和地区进行任何交易或提供服务。"},{"id":"qihang_flhg_0012","module":"qihang","bank":"启航-法律合规","type":"multi","stem":"课件列出的重点合规领域包括（　）。","options":["经济制裁","出口管制","反垄断与国家安全审查","劳动用工保护"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第20页以图表形式列出重点合规领域，依次为：\"经济制裁\"\"反腐败反商业贿赂\"\"出口管制\"\"反垄断与国家安全审查\"\"反不正当竞争、反倾销、反补贴\"。故经济制裁、出口管制、反垄断与国家安全审查均属于课件列出的重点合规领域，选ABC。\"劳动用工保护\"在课件中无对应表述，不属于所列重点领域，故D不选。\n\n【知识点】\n· 重点合规领域包括经济制裁、反腐败与反商业贿赂、出口管制、反垄断与国家安全审查、反不正当竞争/反倾销/反补贴。\n· 合规，就是个别国家（主要是美国）运用\"长臂管辖\"规则，运用经济制裁、出口管制、反垄断等法律制度强制外国企业遵守其法律制度。\n· 狭义的合规就是要\"遵守\"别国的\"规（法）\"。\n· 企业合规风险包括因违规行为引发法律责任、造成经济或声誉损失及其他负面影响的可能性。"},{"id":"qihang_flhg_0013","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"在中国核电合规管理组织体系中，各业务部门是第一道防线。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第37页\"合规管理组织体系\"图中明确将\"各业务部门\"标注为\"第一道防线\"，并同时列出\"法治工作第一责任人\"、第二道防线、第三道防线（纪检审计部）等主体。故题干说法正确，判\"正确\"。\n\n【知识点】\n· 在中国核电合规管理组织体系中，各业务部门是第一道防线。\n· 公司设立法律合规部，3名专职人员持证率100%。\n· 各部门配备合规管理员，明确综合部、经营部、人力部、商务部、党群部、纪审部合规管理职能。\n· 18家二级单位及重要三级单位已建立合规管理体系，实现全级次合规管理、横向协同、纵向到底。"},{"id":"qihang_flhg_0014","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"《阻断外国法律与措施不当域外适用办法》由全国人大常委会颁布。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第34页明确指出\"2021年1月9日，国务院颁布实施《阻断外国法律与措施不当域外适用办法》（商务部令2021年第1号）\"。该办法由国务院颁布实施（以商务部令形式对外发布），并非由全国人大常委会颁布。题干\"由全国人大常委会颁布\"错误，判\"错误\"。对比：同日课件记载，2021年6月10日《中华人民共和国反外国制裁法》才由全国人大常委会颁布实施。\n\n【知识点】\n· 《阻断外国法律与措施不当域外适用办法》（商务部令2021年第1号）2021年1月9日由国务院颁布实施。\n· 该办法针对外国法律与措施的不当域外适用情形，即\"二级制裁\"。\n· 当事人遵守禁令范围内的外国法律侵害中国公民、法人或其他组织合法权益的，可依法向人民法院起诉要求赔偿。\n· 《反外国制裁法》才是由全国人大常委会颁布实施的法律。"},{"id":"qihang_flhg_0015","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"2018年11月中国核电收到美国新泽西州财政部拟实施经济制裁的信函，经过4个多月的努力，美方最终撤销了拟采取的制裁措施。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第35页\"中国核电应对经济制裁\"部分记载：\"2018年11月19日，中国核电收到美国新泽西州财政部发来的拟对中国核电实施经济制裁措施的信函\"，其依据是ISS数据库中中国核电或其关联公司在伊朗从事涉核领域投资等信息；\"处理结果：经过4个多月的努力，美国新泽西州财政部接受了中国核电提交的证据材料和法律论证，撤销了拟对中国核电采取的经济制裁措施\"。题干表述与课件完全一致，判\"正确\"。\n\n【知识点】\n· 2018年11月19日中国核电收到美国新泽西州财政部拟实施经济制裁的信函。\n· 经4个多月努力，中国核电提交证据材料和法律论证，美方最终撤销拟采取的制裁措施。\n· 同时ISS接受了中国核电提交的证据材料，更新数据库并删除涉伊朗合作信息。\n· 应对经济制裁的合规义务包括不与美国特定制裁对象（如SDN）进行重大交易、不得牵连美国人违反美国经济制裁法律规定等。"},{"id":"qihang_flhg_0016","module":"qihang","bank":"启航-法律合规","type":"judge","stem":"长臂管辖遵循“最小接触”或称“最低联系”原则。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电新员工法律合规管理培训课件","explanation":"依据课件《新员工法律合规管理培训》：课件第18页明确指出\"长臂管辖遵循'最小接触'或称'最低联系'原则。《美国冲突法重述》列举了行使长臂管辖的十项标准\"。故题干说法正确，判\"正确\"。\n\n【知识点】\n· 长臂管辖是指在本国边境之外对非本国公民、企业、组织行使法律上的管辖权，本质上是法的域外效力，是司法上的概念。\n· 长臂管辖遵循\"最小接触\"或称\"最低联系\"原则。\n· 长臂管辖从司法领域扩展到行政执法领域：一是基于经济制裁、出口管制，经国会授权、由行政部门执行的行政管辖（如中兴事件）；二是基于商业行为由司法体系主导的司法管辖（如孟晚舟事件）。\n· 合规即个别国家运用长臂管辖规则强制外国企业遵守其法律制度。"},{"id":"qihang_gcxm_0001","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"我国核电工程建设第一阶段（1985-1996年）首堆起步阶段的代表性项目秦山一期首堆工程，其建设工期为（　）。","options":["53.8个月","68.7个月","81个月","68.9个月"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第3页\"一、核电工程建设历程\"第一阶段（1985-1996年首堆起步阶段）明确给出\"秦山一期首堆工程，建设工期81个月\"。故本题选C（81个月）。选项中53.8个月是秦山二期扩建项目的建设工期，68.7个月是华龙一号福清5号首堆实际工期，68.9个月是第三阶段EPC总承包阶段各项目平均工期，均非秦山一期首堆工期。\n\n【知识点】\n· 第一阶段（1985-1996年）为首堆起步阶段，代表性项目为秦山一期。\n· 秦山一期首堆工程建设工期81个月。\n· 该阶段从军工建设中走出核电工程项目，成立\"七二八办公室\"具体管理，100多个研究所、设计院、制造厂及大专院校参与。\n· 十年攻关先后完成30多个专业420多项重大科研项目。"},{"id":"qihang_gcxm_0002","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"1996-2007年我国核电建设采用大业主+技术引进模式，业主负责设备采购，直接管理施工单位，并负责系统调试工作。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第4页第二阶段（1996-2007年，大业主+技术引进阶段，核岛交钥匙）指出\"采用大业主的多合同模式进行管理：业主负责设备采购，直接管理施工单位，负责系统调试工作\"。题干表述与课件原文完全一致，故本题判\"正确\"。\n\n【知识点】\n· 第二阶段（1996-2007年）为大业主+技术引进阶段（核岛交钥匙），项目包括秦山二期、秦山三期、田湾一期。\n· 该模式业主负责设备采购，直接管理施工单位，负责系统调试工作。\n· 秦山二期、三期项目取得较好业绩，秦山二期扩建项目在安全质量受控下建设工期53.8个月。\n· 核电厂主要管理模式还包括交钥匙工程总承包（turn key）、业主负责制总承包、设计加采购（EP）、大业主自建模式。"},{"id":"qihang_gcxm_0003","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"2008-2017年EPC总承包阶段，各核电项目平均工期为（　）。","options":["53.8个月","68.9个月","62个月","68.7个月"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第5页第三阶段（2008-2017年，EPC总承包阶段）明确给出\"各核电项目拖期（平均工期为68.9个月），投资超概，未实现当初目标\"。故本题选B（68.9个月）。53.8个月为秦山二期扩建工期，68.7个月为华龙一号福清5号首堆实际工期，62个月为华龙一号预测工期（首堆实际68.7个月）。\n\n【知识点】\n· 第三阶段（2008-2017年）为EPC总承包阶段，项目包括福清1-4号机组、方家山、海南一期。\n· 采用小业主、专业化总包管理模式，应对核电规模化发展需要。\n· 各项目拖期（平均工期为68.9个月），投资超概，未实现当初目标。\n· 中核核电工程项目管理走上工程总承包的核电工程管理专业化之路。"},{"id":"qihang_gcxm_0004","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"后福岛时代至今，福清5-6号、田湾5-6号、漳州1-2号机组采用的工程建设管理模式是（　）。","options":["大业主自建模式","大业主+技术引进模式","业主负责制总承包模式","EPC总承包模式"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第6页第四阶段明确\"后福岛时代至今，业主负责制总承包阶段\"，项目为\"福清5-6号机组、田湾5-6号机组、漳州1-2号机组\"，与题干列举完全一致。故本题选C（业主负责制总承包模式）。\n\n【知识点】\n· 第四阶段（后福岛时代至今）采用业主负责制总承包管理模式，项目包括福清5-6号、田湾5-6号、漳州1-2号机组。\n· 业主负责规划和建立项目总的质量保证体系，并维护其质量保证体系的有效运作。\n· 业主督促总包、监理及其分包商建立项目质量保证体系，并监督各单位项目质量保证体系运行的有效性。\n· 该阶段各项目安全质量基本受控，按计划有序推进。"},{"id":"qihang_gcxm_0005","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"2002年5月第四代国际核能论坛（GIF）选定的第四代核电技术中，三种热中子堆不包括（　）。","options":["钠冷快堆","超临界水冷堆","高温气冷堆","熔盐堆"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第7页明确指出\"2002年5月，第四代国际核能论坛（GIF）在巴黎举行研讨会，选定第四代核电技术6种设计概念，包括三种快中子堆和三种热中子堆\"，其中\"三种快中子堆是：钠冷快堆、铅冷快堆和气冷快堆；三种热中子堆是：超临界水冷堆、高温气冷堆和熔盐堆\"。钠冷快堆属于快中子堆而非热中子堆，故本题选A。\n\n【知识点】\n· 三种快中子堆：钠冷快堆、铅冷快堆和气冷快堆。\n· 三种热中子堆：超临界水冷堆、高温气冷堆和熔盐堆。\n· 第四代核反应堆按冷却剂/慢化剂分为6种设计概念，2002年5月由GIF选定。\n· 国内主攻方向：钠冷快堆（原子能院）、高温气冷堆（清华大学）、熔盐堆（中科院）、超临界水冷堆（核动力院）。"},{"id":"qihang_gcxm_0006","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"秦山三期核电机组采用的堆型是（　）。","options":["压水堆","加拿大坎杜（CANDU）压力管式重水堆","沸水堆","高温气冷堆"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第10页\"中国常见的反应堆堆型\"部分明确标注\"秦山三期采用的是加拿大坎杜（CANDU）压力管式重水堆\"。故本题选B。压水堆用轻水作冷却剂和慢化剂，沸水堆仅一个回路，高温气冷堆用氦气作冷却剂、石墨作慢化剂，均与秦山三期不符。\n\n【知识点】\n· 秦山三期采用的是加拿大坎杜（CANDU）压力管式重水堆。\n· 重水堆以重水（氘和氧组成的化合物）作慢化剂。\n· 压水堆用轻水作冷却剂和慢化剂，水在反应堆内保持液态，世界占比62%。\n· 高温气冷堆用氦气作冷却剂、石墨作慢化剂，堆芯出口温度较高。"},{"id":"qihang_gcxm_0007","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"除秦山三期外，我国大陆地区目前运行的核电机组全部为压水堆。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第9页明确指出\"除秦山三期外，我国大陆地区目前运行的核电机组全部为压水堆\"。题干表述与课件原文一致，故本题判\"正确\"。\n\n【知识点】\n· 除秦山三期外，我国大陆地区目前运行的核电机组全部为压水堆。\n· 我国台湾地区为2个沸水堆核电站及1个压水堆核电站。\n· 压水堆用轻水作冷却剂和慢化剂，且水在反应堆内保持液态，世界占比62%。\n· 沸水堆利用轻水作慢化剂和冷却剂，只有一个回路，水在反应堆内沸腾产生蒸汽直接进入汽轮机发电。"},{"id":"qihang_gcxm_0008","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"压水堆核电站一回路的运行压力约为（　）。","options":["15.5MPa","17.0MPa","17.5MPa","330MPa"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第11页\"压水堆核电站工作原理\"明确标注一回路\"运行压力15.5Mpa，平均温度307-310摄氏度\"，\"设计压力17.0-17.5Mpa，设计温度330-350摄氏度\"。故本题选A（15.5MPa）。17.0MPa和17.5MPa是一回路设计压力的上下限，330MPa数量级与压力无关（330摄氏度为一回路设计温度），均为干扰项。\n\n【知识点】\n· 压水堆一回路运行压力15.5MPa。\n· 一回路设计压力17.0-17.5MPa，设计温度330-350摄氏度。\n· 一回路运行平均温度307-310摄氏度。\n· 一回路主要设备包括压力容器、稳压器、主泵、主管道、蒸汽发生器。"},{"id":"qihang_gcxm_0009","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"核电站与火电站的差异主要在于常规岛部分。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第11页\"核能发电工作原理\"明确指出\"核电站与火电站的差异主要在于核岛部分\"，同时\"常规岛的差异主要是汽轮发电机组的制造\"。题干称差异主要在于常规岛部分，与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 核电站与火电站的差异主要在于核岛部分。\n· 常规岛的差异主要是汽轮发电机组的制造。\n· 原子核裂变释放的核能转换成热能，热能加热水产生蒸汽，利用蒸汽推动汽轮发电机组发电。\n· 核反应堆相当于火电站的锅炉。"},{"id":"qihang_gcxm_0010","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"压水堆核电站的安全屏障中，第二道屏障是（　）。","options":["燃料芯块","燃料包壳","压力容器和密闭的一回路系统","反应堆安全壳"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第14页\"核电站的安全屏障\"部分列出压水堆核电站四道屏障：\"第一道屏障：燃料芯块\"、\"第二道屏障：燃料包壳\"、\"第三道屏障：压力容器和密闭的一回路系统\"、\"第四道屏障：反应堆安全壳\"。故第二道屏障是燃料包壳，本题选B。\n\n【知识点】\n· 第二道屏障：燃料包壳，燃料芯块密封在锆合金的包壳中构成核燃料棒。\n· 第一道屏障：燃料芯块，耐高温、耐腐蚀的二氧化铀陶瓷芯块。\n· 第三道屏障：压力容器和密闭的一回路系统，压力容器厚度>0.2米、直径>6米、质量>350吨。\n· 第四道屏障：反应堆安全壳，钢筋混凝土构筑、内表面设置钢衬里，抗御商用大飞机撞击。"},{"id":"qihang_gcxm_0011","module":"qihang","bank":"启航-工程项目管理","type":"multi","stem":"华龙一号的三大设计特征包括（　）。","options":["177堆芯","单堆布置","双层安全壳","三环路布置"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第17页\"三大设计特征\"明确列出\"177堆芯、单堆布置、双层安全壳\"三项。故本题选ABC。\"三环路布置\"虽为华龙一号核蒸汽供应系统的设计基础（课件指出其\"基于成熟的三环路设计\"），但不属于三大设计特征，且华龙一号核岛采用单堆布置，D项错误。\n\n【知识点】\n· 华龙一号三大设计特征：177堆芯、单堆布置、双层安全壳。\n· 三大能动+非能动系统：二次侧非能动余热导出系统、安全壳热量排出系统、堆腔注水冷却系统。\n· 三大能力提高：抗震能力、抗商用大飞机撞击能力、事故应急能力。\n· 三大设计特征满足最先进的核安全法规和标准，达到三代核电技术的先进水平。"},{"id":"qihang_gcxm_0012","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"华龙一号双层安全壳延长的设计寿期为（　）。","options":["40年","50年","60年","80年"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第20页\"先进性四：双层安全壳\"明确列出\"延长的设计寿期：60年\"。故本题选C（60年）。40年、50年为常见核电站设计寿期干扰项，80年超出课件所列数值。\n\n【知识点】\n· 华龙一号双层安全壳延长设计寿期至60年。\n· 双层安全壳内壳为带钢衬里的预应力混凝土结构，外壳为钢筋混凝土结构。\n· 双层安全壳环形空间为负压，收集和过滤泄漏。\n· 双层安全壳可承受外部事件：大型商用飞机撞击、飓风、飞射物、爆炸等，自由容积大于80,000立方米。"},{"id":"qihang_gcxm_0013","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"华龙一号采用177个燃料组件，提高了功率，同时降低线功率密度，确保足够的堆芯热工裕量。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第18页\"先进性二：177堆芯和CF3先进自主燃料组件\"指出\"采用177个燃料组件，提高了功率（>120万千瓦），同时降低线功率密度，确保足够的堆芯热工裕量\"。题干表述与课件原文一致，故本题判\"正确\"。\n\n【知识点】\n· 采用177个燃料组件，提高功率至120万千瓦以上。\n· 降低线功率密度，确保足够的堆芯热工裕量。\n· 自主研发的CF3燃料组件，满足18个月长循环。\n· 包壳材料采用N36先进锆合金材料，具有良好的力学性能，满足0.3g抗震要求。"},{"id":"qihang_gcxm_0014","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"华龙一号首堆示范工程福清5号机组实现商运的时间是（　）。","options":["2020年9月10日","2020年10月27日","2021年1月30日","2021年6月2日"],"answer":["C"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第29页\"成熟性一：已验证的技术\"明确指出\"首堆示范工程福清5号机组已于2021年1月30日商运\"，第35页再次确认\"2021年1月30日，华龙一号福清5号机组实现商运，实现三代核电首堆示范工程68.7个月工期\"。故本题选C（2021年1月30日）。2020年9月10日是福清5号首次装料日期，2020年10月27日是首次并网日期，2021年6月2日是田湾6号机组商运日期，均为干扰项。\n\n【知识点】\n· 2021年1月30日华龙一号福清5号机组实现商运。\n· 华龙一号首堆示范工程福清5号机组建设工期68.7个月，创造三代核电首堆工期最短记录。\n· 2020年9月10日福清5号机组首次装料，2020年10月27日首次并网。\n· 2021年6月2日田湾6号机组实现商运，首次装料至商运49天，创造全球最佳调试纪录。"},{"id":"qihang_gcxm_0015","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"在核电工程建设过程中，核岛浇灌第一罐混凝土（FCD）标志（　）。","options":["项目核准完成","土建阶段开始","安装阶段开始","调试阶段开始"],"answer":["B"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第58页\"项目实施阶段\"明确\"核岛浇灌第一罐混凝土（FCD）标志土建开始\"，同时\"穹顶吊装完成标志土建结束\"。故FCD标志着土建阶段开始，本题选B。项目核准完成在FCD之前（开工管理阶段），安装、调试阶段的开始分别以穹顶吊装完成和冷试开始为标志。\n\n【知识点】\n· 核岛浇灌第一罐混凝土（FCD）标志土建阶段开始。\n· 穹顶吊装完成标志土建阶段结束，同时标志安装阶段开始。\n· 土建阶段包括反应堆厂房实体施工、核岛其他厂房实体施工、常规岛厂房实体施工及BOP子项实体施工。\n· 2015年5月7日福清5号机组核岛浇筑第一罐混凝土。"},{"id":"qihang_gcxm_0016","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"反应堆厂房穹顶吊装完成，标志核电站安装阶段结束。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第59页\"安装阶段\"明确\"穹顶吊装完成标志安装开始\"、\"冷试开始标志安装结束\"。题干称穹顶吊装完成标志安装阶段结束，与课件矛盾——穹顶吊装完成是安装阶段的开始标志，安装阶段结束的标志是冷试开始，故本题判\"错误\"。\n\n【知识点】\n· 穹顶吊装完成标志安装阶段开始。\n· 冷试开始标志安装阶段结束。\n· 安装阶段包括核岛主设备安装（压力容器、蒸发器、主泵、主管道、堆内构件等）、常规岛及BOP安装工作及各类专业安装。\n· 穹顶吊装完成同时标志土建阶段结束。"},{"id":"qihang_gcxm_0017","module":"qihang","bank":"启航-工程项目管理","type":"single","stem":"核电工程的“四大控制”是指（　）。","options":["安全、质量、进度、投资","安全、质量、环保、保密","质量、进度、投资、环保","安全、进度、环保、廉洁"],"answer":["A"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第46页\"六大控制七个零：高质量精细化管理\"明确指出\"如果说核电工程的'四大控制'，则指安全、质量、进度和投资\"。故本题选A。\"环保、保密\"属于\"六大控制\"（安全、质量、进度、投资、环保、保密）的组成，不属于\"四大控制\"。\n\n【知识点】\n· 核电工程\"四大控制\"指安全、质量、进度和投资。\n· \"六大控制七个零\"：安全（安全零事故）、质量（质量零事件）、进度（进度零超期）、投资（投资零超概）、环保（环保零超标）、保密（保密零泄密），以及廉洁零问题。\n· 六大控制七个零是高质量精细化管理要求。\n· 核安全事件、安全生产事故、火灾事故、环境事件、质量事故等目标值均为0，为否决项。"},{"id":"qihang_gcxm_0018","module":"qihang","bank":"启航-工程项目管理","type":"judge","stem":"根据中国工程院《中国能源中长期（2030、2050）发展战略研究咨询项目报告》，2030年我国核电装机目标为2亿千瓦。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电工程项目管理课件","explanation":"依据课件《核电工程项目管理》：课件第101页\"我国核电中长期发展展望\"引用中国工程院《中国能源中长期（2030、2050）发展战略研究咨询项目报告》，明确给出\"2020年，核电装机7000万千瓦；2030年，核电装机2亿千瓦；2050年，核电装机4亿千瓦\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 2030年我国核电装机目标为2亿千瓦。\n· 2050年我国核电装机目标为4亿千瓦。\n· 2020年核电装机7000万千瓦。\n· 全球核电装机占电力装机5%左右，发电量占比10.1%；中国核电装机占电力装机2.27%，发电量占比5.1%，未来可期。"},{"id":"qihang_gjhz_0001","module":"qihang","bank":"启航-国际合作","type":"single","stem":"中国核电归口对接IAEA、EPRI、OECD、EDF、COG等国际组织和合作渠道的部门是（　）。","options":["科技与国际合作部","安全质量部","核能开发事业部","综合管理部"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"总部统筹\"部分明确给出归口分工，其中\"中国核电科技与国际合作部\"对应\"EPRI、IAEA、OECD、EDF、COG、中俄等\"国际组织和合作渠道。故本题选A（科技与国际合作部）。安全质量部归口对接的是WANO，核能事业部负责国际市场开发，综合管理部负责邀请函、签证、外事接待、保密等事务，均不归口对接这些国际组织。\n\n【知识点】\n· 科技与国际合作部归口对接EPRI、IAEA、OECD、EDF、COG、中俄等国际组织和合作渠道。\n· 安全质量部归口对接WANO（世界核电运营者协会）。\n· 核能事业部负责国际市场开发。\n· 综合管理部负责邀请函、签证、外事接待、保密等事务。"},{"id":"qihang_gjhz_0002","module":"qihang","bank":"启航-国际合作","type":"single","stem":"中国核电归口对接WANO（世界核电运营者协会）的部门是（　）。","options":["安全质量部","科技与国际合作部","经营管理部","运行生产部"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"总部统筹\"部分明确\"安全质量部\"归口对接\"WANO\"。故本题选A（安全质量部）。科技与国际合作部对接的是EPRI、IAEA、OECD、EDF、COG等，不负责WANO归口。\n\n【知识点】\n· 安全质量部归口对接WANO（世界核电运营者协会）。\n· 科技与国际合作部对接EPRI、IAEA、OECD、EDF、COG、中俄等渠道。\n· 中国核电实行总部归口部门统筹、各单位积极配合的国际合作管理机制。"},{"id":"qihang_gjhz_0003","module":"qihang","bank":"启航-国际合作","type":"single","stem":"中国核电派遣优秀员工赴国际组织工作，其中赴WANO的人数为（　）名。","options":["2名","6名","9名","31名"],"answer":["D"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"持续加强国际合作\"部分明确\"派遣优秀员工赴国际组织: IAEA 6 名, WANO 31 名, 集团海外代表处9名, EPRI 2 名\"。故赴WANO人数为31名，选D。干扰项6名是赴IAEA人数，9名是集团海外代表处人数，2名是赴EPRI人数。\n\n【知识点】\n· 中国核电派遣优秀员工赴国际组织，其中赴WANO 31名。\n· 赴IAEA 6名、赴EPRI 2名、集团海外代表处9名。\n· 通过人员派驻深化与国际组织合作，培养国际化人才队伍。"},{"id":"qihang_gjhz_0004","module":"qihang","bank":"启航-国际合作","type":"single","stem":"2023年9月，中国核电在海南承办的IAEA会议是（　）。","options":["小型模块堆技术发展和应用跨地区研讨会","《核安全公约》缔约方联合审议会议","“气候变化和核能的作用：核能促进净排放”国际会议","重水堆先进技术工作组会议"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"合作亮点\"部分明确\"2023年9月4-8日，中国核电在海南承办IAEA'小型模块堆技术发展和应用跨地区研讨会'\"，该会议为疫情以来核领域规模最大的国际会议，来自52个国家和地区的152名外宾参加。故本题选A。\n\n【知识点】\n· 2023年9月中国核电在海南承办IAEA\"小型模块堆技术发展和应用跨地区研讨会\"。\n· 该会议为疫情以来核领域规模最大的国际会议，邀请152名外宾来访海南。\n· 通过技术会议、双边会谈、海南核电现场参观等多种形式着力推广中核集团小堆。\n· 2023年，中国核电着力打造IAEA\"小堆培训中心\"\"卓越运营协作中心\"等合作平台。"},{"id":"qihang_gjhz_0005","module":"qihang","bank":"启航-国际合作","type":"single","stem":"IAEA小堆国际培训中心（合作周期2024年7月至2029年6月）的承办单位是（　）。","options":["海南核电","秦山核电","福清核电","三门核电"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"合作机制\"表格中明确\"小堆国际培训中心\"合作范围是\"为IAEA成员国提供小堆相关培训\"，合作周期为\"2024年7月1日至2029年6月30日\"，承办单位为\"海南核电\"。故本题选A（海南核电）。\n\n【知识点】\n· IAEA小堆国际培训中心由海南核电承办，合作周期为2024年7月至2029年6月。\n· 小堆国际培训中心为IAEA成员国提供小堆相关培训。\n· 海南核电拟与IAEA签订\"小堆国际合作培训协议\"，目前协议已提交国家原子能机构（CAEA）。\n· 依托小堆培训中心等平台开展\"走出去\"与\"引进来\"合作。"},{"id":"qihang_gjhz_0006","module":"qihang","bank":"启航-国际合作","type":"single","stem":"2023年3月，运行研究院牵头完成IAEA“小型模块堆通用用户要求文件（GURC）”中方承担的7项交付工作，成为第一个提交GURC文件的国家是（　）。","options":["美国","中国","法国","俄罗斯"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"合作亮点\"部分明确\"2023年3月15日，中国核电组织，运行研究院牵头完成IAEA'小型模块堆通用用户要求文件中方承担7项政策（美国7项、欧洲6项）'的交付工作，成为第一个提交GURC文件的国家\"。故本题选B（中国）。\n\n【知识点】\n· 2023年3月，运行研究院牵头完成IAEA\"小型模块堆通用用户要求文件（GURC）\"中方承担的7项交付工作。\n· 中国成为第一个提交GURC文件的国家，并形成阶段性成果文件。\n· GURC即小型模块堆通用用户要求文件，中方承担7项、美国7项、欧洲6项。"},{"id":"qihang_gjhz_0007","module":"qihang","bank":"启航-国际合作","type":"single","stem":"COG（CANDU业主组）成立于（　）年。","options":["1979年","1984年","1990年","2003年"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"与COG（CANDU业主组）合作情况\"部分明确\"CANDU Owners Group 成立于1984年，是一家为全球CANDU电站提供合作研发和信息共享的非营利组织\"。故本题选B（1984年）。\n\n【知识点】\n· COG（CANDU Owners Group）成立于1984年。\n· COG为全球CANDU电站提供合作研发和信息共享，是私营、非营利公司。\n· COG业主联盟办公室位于加拿大多伦多。\n· COG由全球CANDU运营商和加拿大国家实验室（CNL）资助，每年用于研发和成员发起项目的资金超过7000万美元。"},{"id":"qihang_gjhz_0008","module":"qihang","bank":"启航-国际合作","type":"single","stem":"2003年正式加入COG（CANDU业主组）的中国核电成员单位是（　）。","options":["秦山第三核电有限公司","江苏核电有限公司","海南核电有限公司","福建福清核电有限公司"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件明确\"2003年，TQNPC（秦山第三核电有限公司）正式加入COG，重点在技术联合项目和服务、信息交流与经验反馈两个板块与COG开展技术合作与交流\"。故本题选A（秦山第三核电有限公司）。\n\n【知识点】\n· 2003年秦山第三核电有限公司（TQNPC）正式加入COG。\n· 秦山核电重点在技术联合项目和服务、信息交流与经验反馈两个板块与COG开展技术合作与交流。\n· 2019年，CNNO正式加入COG研发板块下设的安全执照模块。\n· 秦山核电先后六次派驻COG人员，代表CNNO参加COG各种会议、对标等工作。"},{"id":"qihang_gjhz_0009","module":"qihang","bank":"启航-国际合作","type":"single","stem":"秦山核电2018年8月加入COG的IST模块后，获得使用权的重要基础性事故分析软件是（　）。","options":["MAAP-CANDU","RELAP5","RETAIN","PCTRAN"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"秦山与COG业务合作情况-R&D板块\"部分明确\"2018年8月IST模块（Industry Standard Toolset）\"下\"通过IST项目获得MAAP-CANDU软件及使用权，MAAP-CANDU作为重要基础性事故分析软件，为秦山核电开展二级PSA、运行培训处开发模拟机程序提供有力支撑\"。故本题选A（MAAP-CANDU）。\n\n【知识点】\n· 2018年8月秦山核电加入COG的IST模块（Industry Standard Toolset）。\n· 通过IST项目获得MAAP-CANDU软件及使用权。\n· MAAP-CANDU是重要基础性事故分析软件，为开展二级PSA、开发模拟机程序提供支撑。\n· 2019年3月秦山核电加入S&L模块（Safety & Licensing），COG开放R&D板块1600份历史研发报告下载权限，秦山委托728院对171份重要报告进行消化吸收。"},{"id":"qihang_gjhz_0010","module":"qihang","bank":"启航-国际合作","type":"single","stem":"2024年3月中国核电承办的俄罗斯国际核工业展（ATOMEXPO-2024）上，中核集团展台的主题是（　）。","options":["核创未来","核靓未来","绿色发展，核领未来","创新驱动，走向世界"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"承办中核集团2024年俄罗斯核工展\"部分明确\"中核集团展台以'核创未来'为主题\"，展示集团在核能发展、核能产业技术创新，展示集团公司的核工业全产业链及核电产业、核电建设、核电运维、核技术应用等内容。故本题选A（核创未来）。\n\n【知识点】\n· 中国核电承办2024俄罗斯国际核工业展（ATOMEXPO-2024），展会于2024年3月25日至26日在俄罗斯索契举办。\n· 中核集团展台以\"核创未来\"为主题。\n· 展台展示核工业全产业链、核电建设、核电运维、核技术应用等内容，推动核能产业科技创新发展。"},{"id":"qihang_gjhz_0011","module":"qihang","bank":"启航-国际合作","type":"multi","stem":"中国核电派遣优秀员工赴（　）等国际组织工作。","options":["IAEA","WANO","EPRI","国际货币基金组织"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件明确\"派遣优秀员工赴国际组织: IAEA 6 名, WANO 31 名, 集团海外代表处9名, EPRI 2 名\"。故选派优秀员工赴IAEA、WANO、EPRI等国际组织工作，选ABC。国际货币基金组织不属于课件所列国际组织，不选。\n\n【知识点】\n· 中国核电派遣优秀员工赴IAEA、WANO、EPRI等国际组织工作。\n· 赴IAEA 6名，其中IAEA正式职员5人、免费专家1人。\n· 赴WANO 31名、赴EPRI 2名，集团海外代表处9名。\n· 通过人员派驻培养国际化人才队伍，提升国际经营能力与品牌影响力。"},{"id":"qihang_gjhz_0012","module":"qihang","bank":"启航-国际合作","type":"judge","stem":"截止2023年底，中国核电各成员单位与IAEA共开展相关活动57项。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"合作情况-多种活动全方位开展（截止2023年底）\"部分明确\"中国核电各成员单位与IAEA共开展相关活动57项，包含会议、技术研讨会、科访、论坛、培训及其他相关活动\"。题干表述与课件一致，故判\"正确\"。\n\n【知识点】\n· 截止2023年底，中国核电各成员单位与IAEA共开展相关活动57项。\n· 活动类型包括会议、技术研讨会、科访、论坛、培训及其他相关活动。\n· 中国核电各成员单位向IAEA派遣工作人员6人，其中正式职员5人、免费专家1人。\n· 2019年至今与IAEA开展全方位合作，如承办PRIS中国培训会、签署首个CRP协作研发项目等。"},{"id":"qihang_gjhz_0013","module":"qihang","bank":"启航-国际合作","type":"judge","stem":"COG业主联盟办公室位于加拿大渥太华。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件明确\"CANDU Owners Group 成立于1984年……COG业主联盟办公室位于加拿大多伦多\"。题干表述为\"渥太华\"，与课件\"多伦多\"不符，故判\"错误\"。\n\n【知识点】\n· COG业主联盟办公室位于加拿大多伦多，而非渥太华。\n· COG成立于1984年，为全球CANDU电站提供合作研发和信息共享。\n· COG是私营、非营利公司，代表加拿大电厂与EPRI直接接口联络。\n· COG成员包括6个国家的9名电站成员，其它参与方包括3个组织、40多家供应商、8个SMR供应商。"},{"id":"qihang_gjhz_0014","module":"qihang","bank":"启航-国际合作","type":"judge","stem":"委托COG举办的NPDS核职业领导力培训共10期，参与人员182人，形成200余条行动。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"中国核电国际合作介绍课件","explanation":"依据课件《中国核电国际合作介绍》：课件\"核职业领导力培训\"部分明确\"委托COG举办NPDS核职业领导力培训10期，参与人员182人，形成200余条行动\"。题干表述与课件一致，故判\"正确\"。\n\n【知识点】\n· 委托COG举办NPDS核职业领导力培训共10期。\n· 参与人员182人，形成200余条行动。\n· NPDS项目属于秦山与COG业务合作中信息交流与经验反馈（IE）板块。\n· 秦山核电还通过SPOC（单点联系人）积极组织参与16个COG同行小组的会议。"},{"id":"qihang_hdczs_0001","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"核安全三要素是指（　）。","options":["反应性控制、余热导出、放射性包容","中子控制、压力控制、温度控制","临界控制、功率控制、剂量控制","散热、屏蔽、密封"],"answer":["A"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第8页明确列出“核安全三要素”为“反应性控制、余热导出、放射性包容”，第60页核电从业者基本态度部分再次重申“核安全三要素：反应性控制、余热导出、放射性包容”。故本题选A。选项B（中子控制、压力控制、温度控制）和C（临界控制、功率控制、剂量控制）均非课件表述；选项D（散热、屏蔽、密封）为通俗化说法，不符合核安全三要素的专业定义。\n\n【知识点】\n· 核安全三要素为：反应性控制、余热导出、放射性包容。\n· 反应性控制确保反应堆处于可控临界状态，防止超临界事故。\n· 余热导出确保停堆后堆芯衰变热能有效排出，防止堆芯熔毁。\n· 放射性包容通过多道屏障（燃料包壳、一回路压力边界、安全壳）防止放射性物质外泄。"},{"id":"qihang_hdczs_0002","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"反应堆停堆3小时后，剩余功率约为额定功率的（　）。","options":["10%","5%","1%","0.1%"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第8页“核安全三要素”部分明确给出剩余功率数据：“停堆3h，1% 额定功率；停堆4周，0.1% 额定功率”。反应堆停堆后由于裂变产物的衰变仍会持续释放热量，称为剩余功率（余热），停堆3小时后约为额定功率的1%。故本题选C。\n\n【知识点】\n· 反应堆停堆后剩余功率随时间衰减：停堆3h约1%额定功率，停堆4周约0.1%额定功率。\n· 剩余功率来源于裂变产物的放射性衰变和缓发中子引起的裂变。\n· 余热导出是核安全三要素之一，停堆后必须持续冷却堆芯。\n· 即使停堆很长时间，仍需维持余热排出系统的运行以确保安全。"},{"id":"qihang_hdczs_0003","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"压水堆核电厂的链式裂变反应是由快中子维持的。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第11页章节内容回顾明确指出“压水堆核电厂，链式裂变反应是由热中子维持的”。压水堆中的慢化剂（轻水）将裂变产生的快中子慢化为热中子，再由热中子维持链式裂变反应。题干说“由快中子维持”与课件原文矛盾，故本题判“错误”。\n\n【知识点】\n· 压水堆核电厂的链式裂变反应由热中子维持，而非快中子。\n· 热中子是经过慢化剂慢化后的低能中子，更容易被铀-235吸收引起裂变。\n· 快中子堆（快堆）才是由快中子维持链式裂变反应的堆型。\n· 压水堆中的轻水同时充当冷却剂和慢化剂。"},{"id":"qihang_hdczs_0004","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"正常情况下，压水堆核电站只在一回路中存在放射性。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第11页章节内容回顾明确指出“正常情况下，压水堆核电站只在一回路中存在放射性”。压水堆核电站通过蒸汽发生器将一回路（带放射性）与二回路（不带放射性）隔离，只有在燃料包壳破损或蒸汽发生器泄漏等异常情况下二回路才可能受到放射性污染。故本题判“正确”。\n\n【知识点】\n· 正常情况下，压水堆核电站只在一回路中存在放射性。\n· 一回路冷却剂流经堆芯带有放射性，二回路蒸汽不接触堆芯故无放射性。\n· 蒸汽发生器的U型管是隔离一、二回路放射性的重要屏障。\n· 若燃料包壳破损或蒸汽发生器泄漏，二回路可能受到放射性污染。"},{"id":"qihang_hdczs_0005","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"典型的压水堆核电站每台机组共有（　）个回路。","options":["1","2","3","4"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第28页章节内容回顾明确指出“典型的压水堆核电站每台机组有三个回路”，并分别描述了各回路功能：一回路将堆芯热能传给蒸汽发生器，二回路将蒸汽热能转化为电能，三回路用海水或淡水冷却乏蒸汽。故本题选C（3个）。\n\n【知识点】\n· 典型的压水堆核电站每台机组有三个回路。\n· 一回路：冷却剂在堆芯吸收热量，经蒸汽发生器U型管传热后由主泵送回堆芯，密闭循环。\n· 二回路：给水在蒸汽发生器中受热变为蒸汽，推动汽轮机发电，乏汽在冷凝器中凝结回水。\n· 三回路：使用海水或淡水在冷凝器中冷却做功后的乏蒸汽。"},{"id":"qihang_hdczs_0006","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"人类历史上第一个反应堆“芝加哥一号”（CP-1）建成并实现首次运行的时间是（　）。","options":["1945年8月","1951年12月","1954年6月","1942年12月"],"answer":["D"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第31页明确记载“芝加哥一号（Chicago Pile1,CP-1）：1942年12月费米领导的团队在芝加哥大学建成。12月2日，首次运行成功，开启了人类原子能时代，芝加哥大学成为人类‘原子能诞生地’”。故本题选D（1942年12月）。\n\n【知识点】\n· 人类历史上第一个反应堆“芝加哥一号”（CP-1）于1942年12月建成并首次运行成功。\n· CP-1由费米领导的团队在芝加哥大学建成，标志着人类原子能时代的开启。\n· 芝加哥大学因此被称为人类“原子能诞生地”。\n· CP-1的建成验证了可控核裂变链式反应的可行性。"},{"id":"qihang_hdczs_0007","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"我国台山核电站采用的核电堆型是（　）。","options":["美国AP1000","法国EPR","俄罗斯VVER1000","加拿大CANDU6"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第33页“核电家族族谱”中明确标注“EPR——台山核电（法国）”。课件同时列出其他堆型对应关系：AP1000对应三门核电（美国）、VVER1000对应田湾核电（俄罗斯）、CANDU 6对应秦山三期（加拿大）。故本题选B（法国EPR）。\n\n【知识点】\n· 台山核电站采用法国EPR堆型。\n· 三门核电采用美国AP1000堆型。\n· 田湾核电采用俄罗斯VVER1000堆型。\n· 秦山三期采用加拿大CANDU 6重水堆型。"},{"id":"qihang_hdczs_0008","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"快中子堆（快堆）最大的特点是（　）。","options":["发电效率高","核燃料增殖","常压运行","不需要冷却剂"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第42页章节内容回顾明确指出“快堆最大的特点是核燃料增殖”。快中子堆使用快中子维持链式裂变反应，不需要慢化剂，其冷却剂为液态金属钠（课件第39页标注“一回路（钠）、二回路（钠）、三回路（水）”）。快堆在消耗裂变材料的同时可增殖新的易裂变材料（如钚-239），提高核燃料利用率。故本题选B（核燃料增殖）。\n\n【知识点】\n· 快堆最大的特点是核燃料增殖，即消耗裂变材料的同时产生更多新的易裂变材料。\n· 快堆由快中子维持链式裂变反应，不需要慢化剂。\n· 快堆冷却剂为液态金属钠，采用三条回路（钠-钠-水）设计。\n· 我国快堆发展包括CEFR（北京房山实验快堆）和CFR600（霞浦示范快堆）。"},{"id":"qihang_hdczs_0009","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"沸水堆核电站正常功率运行时，其二回路介质不带有放射性。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第42页章节内容回顾明确指出“沸水堆二回路介质带有放射性”。沸水堆与压水堆不同，其堆芯产生的蒸汽直接进入汽轮机做功，由于蒸汽接触堆芯燃料，不可避免地携带放射性物质进入二回路。题干说“其二回路介质不带有放射性”与课件原文矛盾，故本题判“错误”。\n\n【知识点】\n· 沸水堆二回路介质带有放射性，这是沸水堆与压水堆的重要区别之一。\n· 压水堆正常情况下只在一回路中存在放射性，二回路不带放射性。\n· 沸水堆中堆芯产生的蒸汽直接驱动汽轮机，蒸汽携带放射性进入二回路。\n· 沸水堆核电站的汽轮机及二回路系统需要考虑放射性防护。"},{"id":"qihang_hdczs_0010","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"高温气冷堆采用（　）作为冷却剂。","options":["轻水","重水","氦气","液态金属钠"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第32页在高温气冷堆（第3.5节）部分标注冷却剂为“氦气”。课件第42页章节内容回顾还指出“高温气冷堆核电站发电效率比压水堆核电站高”。高温气冷堆采用氦气作冷却剂，石墨作慢化剂，出口温度高，因此发电效率高于压水堆。故本题选C（氦气）。\n\n【知识点】\n· 高温气冷堆采用氦气作为冷却剂。\n· 高温气冷堆核电站发电效率比压水堆核电站高。\n· 我国高温气冷堆发展包括HTR-10（清华大学实验气冷堆）和HTR-PM（石岛湾示范气冷堆）。\n· 氦气化学性质稳定、中子吸收截面小，适合作为高温气冷堆的冷却剂。"},{"id":"qihang_hdczs_0011","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"熔盐堆的核燃料溶解在高温熔盐中形成流动的液态燃料，其工作温度约为（　）。","options":["300-400℃","500-600℃","700-800℃","900-1000℃"],"answer":["C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第40页熔盐堆部分明确指出“核燃料（如铀-235、钚-239或钍-232）直接溶解在高温熔盐（如氟化锂、氟化铍等）中，形成流动的液态燃料”，并给出熔盐特性“常压下液态（工作温度约700–800℃），高热容、高沸点，天然具备被动安全性”。故本题选C（700-800℃）。\n\n【知识点】\n· 熔盐堆的核燃料溶解在高温熔盐中形成流动的液态燃料，工作温度约700–800℃。\n· 熔盐堆常压下运行，无高压爆炸风险，天然具备被动安全性。\n· 熔盐遇高温膨胀导致裂变反应减速（负温度系数），事故时熔盐会凝固堵塞管道被动冷却。\n· 熔盐堆可增殖钍-232或利用核废料，燃料利用率高。"},{"id":"qihang_hdczs_0012","module":"qihang","bank":"启航-核电厂概述","type":"multi","stem":"中核集团863基本动作中，全体员工“六个做到”包括（　）。","options":["做到“讲安全”","做到“守规矩”","做到“重协作”","做到“勤汇报”"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第61-62页“863基本动作要领”详细列出全体员工“六个做到”：一、做到“讲安全”；二、做到“守规矩”；三、做到“重协作”；四、做到“戒自满”；五、做到“善沟通”；六、做到“多思考”。“勤汇报”不在六个做到之列。故本题选ABC（讲安全、守规矩、重协作），D（勤汇报）不属于“六个做到”。\n\n【知识点】\n· 全体员工“六个做到”为：讲安全、守规矩、重协作、戒自满、善沟通、多思考。\n· “做到讲安全”要求每个人正确理解和认识自己支持安全的责任和权限。\n· “做到守规矩”要求遵守标准、制度、程序及工作文件，践行安全第一原则。\n· “做到重协作”要求个人、班组、部门及团队之间确保内部和跨组织的沟通与合作。\n· 中核集团863基本动作包括员工6个做到和组织3大法宝。"},{"id":"qihang_hdczs_0013","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"中核集团863基本动作中，组织“三大法宝”是指（　）。","options":["培训、监督、考核","认识核安全的重要性、问题识别与解决、持续改进","识别、评价、解决","严守设计裕量、设备可靠、高质量程序"],"answer":["B"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第63-65页详细列出组织“三大法宝”：一、认识核安全的重要性（认识核技术的复杂性和特殊敏感性，严守设计裕量，确保设备可靠性，构建和谐公众关系等）；二、问题识别与解决（识别、评价、解决、趋势分析）；三、持续改进（避免组织自满、经验反馈、开展评估、对标、培训、监督检查）。故本题选B（认识核安全的重要性、问题识别与解决、持续改进）。\n\n【知识点】\n· 组织“三大法宝”为：认识核安全的重要性、问题识别与解决、持续改进。\n· “认识核安全的重要性”包括严守设计裕量、确保设备可靠性、构建和谐公众关系等。\n· “问题识别与解决”包括识别、评价、解决和趋势分析四个环节。\n· “持续改进”包括避免组织自满、经验反馈、开展评估、对标、培训和监督检查。"},{"id":"qihang_hdczs_0014","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"福岛核事故中，1、2、3号机组堆芯融化，1、3、4号机组发生氢爆。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第57页福岛核事故部分明确记载“1、2、3号机组堆芯融化，1、3、4号机氢爆”。2011年3月11日日本东北外海9级地震引发巨大海啸，导致应急柴油发电机因水淹失效、全厂断电，热阱丧失后造成堆芯融化及氢气爆炸。题干表述与课件原文一致，故本题判“正确”。\n\n【知识点】\n· 福岛核事故中1、2、3号机组堆芯融化，1、3、4号机组发生氢爆。\n· 福岛核事故的直接原因是9级地震引发的海啸导致全厂断电（SBO）。\n· 全厂断电后余热无法导出，堆芯冷却不足导致燃料熔毁。\n· 福岛第一核电厂位于日本福岛县双叶郡，共有6台BWR机组。"},{"id":"qihang_hdczs_0015","module":"qihang","bank":"启航-核电厂概述","type":"single","stem":"2014年3月习近平总书记在第三届核安全峰会上提出要坚持的核安全观是（　）。","options":["理性、协调、并进","安全第一、预防为主","法治、忧患、自律","合作、共赢、共享"],"answer":["A"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第59页明确记载“加强核安全是一个持续过程。我们要坚持理性、协调、并进的核安全观，把核安全进程纳入健康持续发展轨道”——2014年3月第三届核安全峰会上的讲话。课件同时提出“法治意识、忧患意识、自律意识、协作意识是核安全文化的核心”。故本题选A（理性、协调、并进）。\n\n【知识点】\n· 核安全观为“理性、协调、并进”，于2014年3月第三届核安全峰会上提出。\n· 核安全文化的核心是法治意识、忧患意识、自律意识、协作意识。\n· 核安全文化核心要贯穿到每位从业人员的思想和行动中。\n· 加强核安全是一个持续过程，需将核安全进程纳入健康持续发展轨道。"},{"id":"qihang_hdczs_0016","module":"qihang","bank":"启航-核电厂概述","type":"judge","stem":"核电机组大约90%的时间是在100%功率运行。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"核电厂概述课件","explanation":"依据课件《核电厂概述》：课件第49页“正常功率运行”部分明确指出“核电机组大约90%时间是在100%功率运行”，并说明运行日常工作包括监盘、巡检（报缺）、试验（设备切换）、水质控制、调硼等，控制系统均在自动控制状态，每一年半换料大修一次约30天。故本题判“正确”。\n\n【知识点】\n· 核电机组大约90%的时间在100%功率运行，这是核电站经济性的重要保障。\n· 功率运行期间控制系统均在自动控制状态。\n· 运行日常工作包括监盘、巡检（报缺）、试验（设备切换）、水质控制、调硼等。\n· 核电机组每一年半换料大修一次，约30天（装、卸料时间各需约3天）。"},{"id":"qihang_qywh_0001","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的企业使命是（　）。","options":["强核强国、造福人类","国际核科技发展的引领者","追求卓越、超越自我","争做最具魅力的国际一流核能企业"],"answer":["A"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：核心理念部分明确\"中国核电的企业使命是：强核强国造福人类\"，并释义\"企业使命是企业存在的根本目的，是企业肩负的最大责任，是企业前进的最强驱动力\"；同时指出中国核电核心理念与中核集团核心理念（企业愿景、企业使命、企业精神、企业核心价值观）始终保持一致。故企业使命为\"强核强国、造福人类\"，选A。\n\n【知识点】\n· 企业使命：强核强国、造福人类。\n· 企业使命是企业存在的根本目的、肩负的最大责任和前进的最强驱动力。\n· 中国核电核心理念与中核集团公司核心理念（愿景、使命、精神、核心价值观）保持一致。\n· \"争做最具魅力的国际一流核能企业\"属于奋斗目标，而非企业使命。"},{"id":"qihang_qywh_0002","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的企业愿景是（　）。","options":["成为具有全球竞争力的世界一流清洁能源服务商","国际核科技发展的引领者","强核强国、造福人类","魅力核电、美丽中国"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：核心理念部分明确\"中国核电的企业愿景为：国际核科技发展的引领者\"，并释义\"企业愿景是企业对未来发展的美好憧憬，是企业长期追求的理想\"，中国核电致力于成为全球核电/核能安全运行引领者。故企业愿景为\"国际核科技发展的引领者\"，选B。\n\n【知识点】\n· 企业愿景：国际核科技发展的引领者。\n· 企业愿景是企业对未来发展的美好憧憬，是企业长期追求的理想。\n· 中国核电致力于成为全球核电/核能安全运行引领者，树立核电安全运行的业绩标杆。\n· \"成为具有全球竞争力的世界一流清洁能源服务商\"是课件未来展望部分的管理目标，不是企业愿景。"},{"id":"qihang_qywh_0003","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的核心价值观是（　）。","options":["创新、协调、绿色、开放、共享","事业高于一切、责任重于一切、严细融入一切、进取成就一切","责任、安全、创新、协同","富强、民主、文明、和谐"],"answer":["C"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：核心理念部分指出\"企业核心价值观是企业和员工共同坚守的基本价值取向和价值判断标准，是企业价值理念体系的核心\"，中国核电的核心价值观即\"责任、安全、创新、协同\"。故选C。\n\n【知识点】\n· 核心价值观：责任、安全、创新、协同。\n· 责任是中国核电成就事业的基石，是中国核电人对国家、民族和事业的庄重承诺。\n· 安全是核工业的生命线，是核工业生存和发展的根基；创新是中国核电实现卓越的不竭动力。\n· 协同是强核强国的内在要求，要求把公司利益置于一切局部利益之上。"},{"id":"qihang_qywh_0006","module":"qihang","bank":"启航-企业文化","type":"single","stem":"中国核电的公司品牌传播语是（　）。","options":["魅力核电、美丽中国","中国核电、国家名片","追求卓越、超越自我","可靠、可亲、低碳、赋能"],"answer":["B"],"score":null,"source":"generated","origin":"中国核电企业文化课件","explanation":"依据课件《中国核电企业文化》：企业宣传口号及符号部分明确公司品牌传播语为\"中国核电、国家名片\"，释义指出华龙一号被誉为\"国家名片\"，中国核电人将\"持续擦亮'中国核电、国家 概要》：第3页公司简介明确写出\"简称：中国核电，股票代码：601985\"，同时介绍\"2015年6月10日，在A股上市\"。故本题选A（601985）。其余选项601988、601899、600019均非中国核电的股票代码。\n\n【知识点】\n· 中国核能电力股份有限公司简称\"中国核电\"，股票代码601985。\n· 公司由中国核工业集团有限公司作为控股股东，联合中国长江三峡集团有限公司、中国远洋海运集团有限公司和航天投资控股有限公司共同出资设立。\n· 2015年6月10日公司在A股上市。\n· 公司经营范围涵盖核电项目的开发、投资、建设、运营与管理，清洁能源项目投资、开发及售电等领域。"},{"id":"qihang_sckf_0002","module":"qihang","bank":"启航-市场开发","type":"single","stem":"截至2023年底，公司核电控股在运机组数量为（　）台。","options":["20台","23台","25台","28台"],"answer":["C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第3页明确写到\"截至2023年底，公司核电控股在运机组25台，装机容量2375.00万千瓦；控股在建及核准待建机组15台，装机容量1756.50万千瓦\"。故在运机组数量为25台，本题选C。\n\n【知识点】\n· 截至2023年底，公司核电控股在运机组25台，装机容量2375.00万千瓦。\n· 控股在建及核准待建机组15台，装机容量1756.50万千瓦。\n· 核电装机容量合计4131.50万千瓦。\n· 公司控股非核清洁能源在运装机容量1851.59万千瓦，包括风电595.15万千瓦、光伏1256.44万千瓦。"},{"id":"qihang_sckf_0003","module":"qihang","bank":"启航-市场开发","type":"single","stem":"核能前期开发工作的首要原则是（　）。","options":["经济合理","核安全","进度优先","效益优先"],"answer":["B"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第12页\"前期开发工作主要原则\"第1条即明确\"首要原则：核安全\"。故核能前期开发工作的首要原则是核安全，本题选B。\"经济合理、进度优先、效益优先\"均非课件所述首要原则。\n\n【知识点】\n· 核能前期开发工作的首要原则是核安全。\n· 总体工作原则为\"设计先行、设备跟进、积极核准、现场慎动\"。\n· 前期开发工作还包括与地方融合发展原则，以及\"稳健、可预期、适度超前\"原则。\n· 核电项目前期工作具有持续时间长、涉及专业广、接口多、投资大、风险高等特点。"},{"id":"qihang_sckf_0004","module":"qihang","bank":"启航-市场开发","type":"single","stem":"核能前期工作的总体工作原则是（　）。","options":["设计先行、设备跟进、积极核准、现场慎动","安全第一、预防为主、综合治理、持续改进","计划先行、投资匹配、动态调整、量入为出","国家主导、企业为辅、协同规划、循序渐进"],"answer":["A"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第12页\"前期开发工作主要原则\"第2条写明\"总体工作原则：设计先行、设备跟进、积极核准、现场慎动\"，即十六字方针。故本题选A。其余选项中的\"安全第一、预防为主\"等表述均不是课件所述的总体工作原则。\n\n【知识点】\n· 核能前期工作总体工作原则为\"设计先行、设备跟进、积极核准、现场慎动\"。\n· 核能前期开发工作的首要原则是核安全。\n· 前期开发工作还包括与地方融合发展原则和\"稳健、可预期、适度超前\"原则。\n· 该总体原则贯穿厂址开发与项目核准、建造许可证申请、工程准备等核能开发工作三个重要阶段。"},{"id":"qihang_sckf_0005","module":"qihang","bank":"启航-市场开发","type":"single","stem":"厂址普选工作中，提出的候选厂址数量不宜少于（　）个。","options":["1","2","3","5"],"answer":["B"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第18页\"2.1.1 厂址普选\"写明\"提出综合条件相对优越的可能厂址作为候选厂址（候选厂址不宜少于2个），形成《厂址普选报告》\"。故候选厂址不宜少于2个，本题选B。\n\n【知识点】\n· 厂址普选通过图上选点和现场踏勘，从安全可靠性、环境相容性、技术可行性和经济合理性等方面对可能厂址综合分析、比选和排序。\n· 综合条件相对优越的可能厂址作为候选厂址，候选厂址不宜少于2个。\n· 厂址普选工作最终形成《厂址普选报告》。\n· 厂址普选依据《核电厂厂址选择基本程序》（NB/T20293-2014）、《核电厂厂址选择安全规定》（HAF101）等开展工作。"},{"id":"qihang_sckf_0006","module":"qihang","bank":"启航-市场开发","type":"single","stem":"可行性研究的工期一般在（　）左右。","options":["12-18个月","18-24个月","26-30个月","36-48个月"],"answer":["C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第25页\"2.2 项目申请阶段\"写明项目申请阶段\"工作周期较长，具体包括：可行性研究，工期一般在26-30个月左右\"。故可研工期一般在26-30个月左右，本题选C。\n\n【知识点】\n· 可行性研究的工期一般在26-30个月左右。\n· 项目申请阶段是项目前期工作的冲刺阶段，也是前期开发的最关键阶段。\n· 项目申请阶段一般指从取得\"国家能源局座谈会纪要\"后，到获得国务院常务会议研究同意项目核准、国家发展改革委下发项目核准文件为止。\n· 可行性研究依据《核电厂可行性研究报告内容深度规定》（NB/T20034-2010）开展。"},{"id":"qihang_sckf_0007","module":"qihang","bank":"启航-市场开发","type":"single","stem":"核电项目前期许可证申领最初环节中的“两评报告”是指（　）。","options":["环境影响报告书（选址阶段）和厂址安全分析报告","初步安全分析报告和质量保证大纲（建造阶段）","厂址普选报告和初步可行性研究报告","环境影响报告书（建造阶段）和初步安全分析报告"],"answer":["A"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第31页\"2.2.2 两评报告\"明确写道\"环境影响报告书（选址阶段）、厂址安全分析报告合称'两评'报告，是核电项目前期许可证申领的最初环节\"。故本题选A。初步安全分析报告和质量保证大纲属建造阶段文件，厂址普选报告和初可研报告属项目建议书阶段文件。\n\n【知识点】\n· \"两评\"报告即环境影响报告书（选址阶段）和厂址安全分析报告的合称，是核电项目前期许可证申领的最初环节。\n· 上报\"两评\"报告后，国家核安全局批复的《核电厂场址选择审查意见书》是项目核准的支持性文件之一，也是可研报告收口的必要条件。\n· 建造许可证申请阶段需提交环境影响报告书（建造阶段）、初步安全分析报告（PSAR）、质量保证大纲（建造阶段）等文件。\n· 两评报告须按规定与核安全监管路径衔接，是核安全监管的重要环节。"},{"id":"qihang_sckf_0008","module":"qihang","bank":"启航-市场开发","type":"single","stem":"FCD是核电站前期工作的重要节点，它是指（　）。","options":["项目获得国务院核准","取得国家核安全局颁发的建造许可证","核岛基础混凝土浇注","首台机组并网发电"],"answer":["C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第35页写明\"核电厂建造阶段，国家核安全局颁发《核电厂建造许可证》后，许可证营运单位开始核岛基础混凝土浇注（即FCD）\"，第41页进一步明确\"FCD是核电站主体工程正式开工的标志点\"。故FCD指核岛基础混凝土浇注，本题选C。\n\n【知识点】\n· FCD即核岛基础混凝土浇注，是核电站主体工程正式开工的标志点。\n· 取得国家核安全局颁发的《核电厂建造许可证》后，营运单位方可开始FCD。\n· 工程前期准备工作包括征地搬迁、\"四通一平\"工程、主体工程设计、主要设备采购、核岛基坑负挖及底板垫层浇筑等。\n· 如何快速取得《核电厂建造许可证》是制约核电厂前期阶段工作的重要因素。"},{"id":"qihang_sckf_0009","module":"qihang","bank":"启航-市场开发","type":"single","stem":"设备材料费用在核电工程的建设总费用中所占比重达到（　）。","options":["10%-20%","20%-40%","40%-70%","70%-85%"],"answer":["C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第44页\"4.4 主设备采购\"明确写道\"设备材料费用在核电工程的建设总费用中所占比重达到40%-70%，设备采购的质量和进度对于整个核电工程的质量与进度有着举足轻重的影响\"。故本题选C。\n\n【知识点】\n· 设备材料费用在核电工程的建设总费用中所占比重达到40%-70%。\n· 设备采购的质量和进度对整个核电工程的质量与进度有举足轻重的影响。\n· 项目获得\"路条\"后就应启动设备采购的策划和设备设计工作。\n· 原则上，项目核准前不得开展长周期主设备实质性制造工作。"},{"id":"qihang_sckf_0010","module":"qihang","bank":"启航-市场开发","type":"multi","stem":"市场开发“四方责任”包括（　）。","options":["集团产合部—主管责任","成员单位—主体责任","依托单位—保障责任","地方政府—属地责任"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第7页\"市场开发'四方责任'\"明确为：\"集团产合部-主管责任、成员单位-主体责任、依托单位-保障责任、市场开发部-属地责任\"。故本题选A、B、C。选项D将\"属地责任\"主体误写为\"地方政府\"，课件原文中属地责任主体是\"市场开发部\"。\n\n【知识点】\n· 市场开发\"四方责任\"：集团产合部—主管责任，成员单位—主体责任，依托单位—保障责任，市场开发部—属地责任。\n· 属地责任主体为市场开发部而非地方政府。\n· 各方分工包括建体系、定标准、强服务、强产业、谋发展、做协同等抓手。\n· 市场部工作抓手包括市场信息收集-分析研判、公共关系维护-互访交流、督办事项落实-跟踪上报、区域发展规划-一体化开发、重点项目推动-紧盯共谋。"},{"id":"qihang_sckf_0011","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"中国核电于2015年6月10日在A股上市。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第3页公司简介写明\"2015年6月10日，在A股上市\"。故本题判断为\"正确\"。\n\n【知识点】\n· 中国核电于2015年6月10日在A股上市。\n· 中国核电股票代码为601985，简称\"中国核电\"。\n· 公司由中国核工业集团有限公司作为控股股东联合中国长江三峡集团、中国远洋海运集团和航天投资控股共同出资设立。\n· 公司经营范围涵盖核电项目的开发、投资、建设、运营与管理及清洁能源项目投资开发等领域。"},{"id":"qihang_sckf_0012","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"原则上，项目核准前不得开展长周期主设备实质性制造工作。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第44页\"4.4 主设备采购\"明确写道\"原则上，项目核准前不得开展长周期主设备实质性制造工作\"。故本题判断为\"正确\"。\n\n【知识点】\n· 原则上，项目核准前不得开展长周期主设备实质性制造工作。\n· 项目获得\"路条\"后就应启动设备采购的策划和设备设计工作。\n· 主设备采购需对长周期主设备提前开展招标策划和潜在供方确定。\n· 设备材料费用占核电工程建设总费用40%-70%，设备采购的质量和进度影响重大。"},{"id":"qihang_sckf_0013","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"已获得选址阶段环境影响报告书批复的厂址，可开展“四通一平”等工作，但未经国家核安全局同意不得进行核岛负挖。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第31页\"2.2.2 两评报告\"写明\"对于已获得选址阶段环境影响报告书批复的厂址，可开展'四通一平'等工作，但未经国家核安全局同意不得进行核岛负挖\"。题干表述与课件完全一致，故判断为\"正确\"。\n\n【知识点】\n· 已获得选址阶段环境影响报告书批复的厂址，可开展\"四通一平\"等工作。\n· 未经国家核安全局同意不得进行核岛负挖。\n· \"四通一平\"工程指由项目业主负责的通路、通水、通电、通信和场平等工程，北方地区还需纳入通暖工程。\n· 对于未开工的新核电厂址，在选址阶段环境影响报告书批复前，不得开展\"四通一平\"等工作（环函〔2015〕164号文规定）。"},{"id":"qihang_sckf_0014","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"对于未开工的新核电厂址，在选址阶段环境影响报告书批复前即可开展“四通一平”等工作。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第31页\"2.2.2 两评报告\"写明\"根据环函〔2015〕164号文规定，对于未开工的新核电厂址，在选址阶段环境影响报告书批复前，不得'四通一平'等工作\"。题干\"批复前即可开展'四通一平'\"与课件规定相反，故判断为\"错误\"。\n\n【知识点】\n· 对于未开工的新核电厂址，在选址阶段环境影响报告书批复前，不得开展\"四通一平\"等工作。\n· 已获得选址阶段环境影响报告书批复的厂址，可开展\"四通一平\"等工作，但未经国家核安全局同意不得进行核岛负挖。\n· \"四通一平\"工程是指核电厂主体工程动工前，由项目业主负责完成通路、通水、通电、通信和场平等工程的总称。\n· 上述规定依据环函〔2015〕164号文，属于核安全监管与两评报告环节的重要合规要求。"},{"id":"qihang_sckf_0015","module":"qihang","bank":"启航-市场开发","type":"judge","stem":"新建厂址项目前期投资安排，华龙一号堆型原则上控制在15%以内。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"市场开发工作概要课件","explanation":"依据课件《市场开发工作概要》：第53页\"投资控制\"明确写道\"对于新建厂址，原则上华龙一号堆型控制在10%以内，AP1000堆型控制在15%以内，其他三代核电机型可参照执行\"。题干将华龙一号写成15%以内，与课件\"10%以内\"矛盾，故判断为\"错误\"。\n\n【知识点】\n· 新建厂址项目前期投资安排，华龙一号堆型原则上控制在可研投资估算中项目计划总资金的10%以内。\n· AP1000堆型原则上控制在15%以内，其他三代核电机型可参照执行。\n· 扩建项目前期投资安排比例原则上应低于新厂址项目。\n· 项目前期投资安排遵循\"动软不动硬\"原则和\"计划先行、投资匹配\"原则。"},{"id":"qihang_zlgh_0001","module":"qihang","bank":"启航-战略规划","type":"single","stem":"当前我国核电发展的基本方针是（　）。","options":["积极稳妥发展核电","高速大规模发展核电","安全高效发展核电","适度 课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.1 自检”部分在给出自检定义时标注“STAR”，即“Stop（停）”“Think（思）”“Act（行）”“Review（审）”，四个步骤依次为停、思、行、审。故本题选A。选项B将“行”与“思”顺序颠倒，C、D顺序均与课件不符。\n\n【知识点】\n· 自检是指人员在执行一项工作前对整个工作进行了清晰的思考，在工作中给予了正确的执行，并在工作后对预期响应进行了审查。\n· STAR即“停—思—行—审”，分别对应Stop、Think、Act、Review。\n· 自检主要用于设备识别和设备的操作。\n· 自检通常是预防人因失误的最后一道屏障。"},{"id":"safety_fryin_0002","module":"safety","bank":"安全-防人因失误","type":"judge","stem":"防人因失误工具概念基于INPO提出的人员绩效方法论产生，并由WANO于2002年开始在全球范围内推荐使用。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“1.1 人员绩效历史”部分明确指出：“INPO首次正式发布的概念是‘人员绩效工具’（Human Performance Tools），这一概念和方法由WANO于2002年开始在全球范围内推荐使用。防人因失误工具的概念是基于INPO提出的人员绩效方法论而产生的。”题干表述与课件一致，故本题判断正确。\n\n【知识点】\n· INPO首次正式发布的概念是“人员绩效工具”（Human Performance Tools）。\n· 防人因失误工具的概念是基于INPO提出的人员绩效方法论而产生的。\n· WANO于2002年开始在全球范围内推荐使用人员绩效工具。\n· 人员绩效：人员为完成特定任务目标而实施的一系列行为。"},{"id":"safety_fryin_0003","module":"safety","bank":"安全-防人因失误","type":"single","stem":"中国核电防人因失误工具中，通常作为预防人因失误最后一道屏障的是（　）。","options":["监护","自检","工前会","独立验证"],"answer":["B"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.1 自检”部分“3）使用条件”中明确指出“自检通常是预防人因失误的最后一道屏障”，且“所有活动中都必须使用自检”。故本题选B（自检）。监护、工前会、独立验证均无“最后一道屏障”的定位。\n\n【知识点】\n· 自检通常是预防人因失误的最后一道屏障。\n· 所有活动中都必须使用自检。\n· 自检主要用于设备识别和设备的操作。\n· 自检的使用条件包括可能导致重大后果的工作、工作中断或注意力被分散时、存在时间压力时等情形。"},{"id":"safety_fryin_0004","module":"safety","bank":"安全-防人因失误","type":"judge","stem":"并非所有的活动都必须使用自检。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.1 自检”部分“3）使用条件”明确指出“所有活动中都必须使用自检”，即自检适用于所有活动。题干“并非所有的活动都必须使用自检”与课件表述矛盾，故本题判断错误。课件配套练习题也给出同样判定（错）。\n\n【知识点】\n· 所有活动中都必须使用自检。\n· 自检通常是预防人因失误的最后一道屏障。\n· 无论是操作设备还是记录结果，所有工作中都应该优先使用STAR工具。\n· 自检主要用于设备识别和设备的操作。"},{"id":"safety_fryin_0005","module":"safety","bank":"安全-防人因失误","type":"single","stem":"监护工具适用于一旦失误可能产生（　）重大后果的操作任务或步骤。","options":["立即的、可逆的","延迟的、可逆的","潜在的、轻微的","立即的、不可逆的"],"answer":["D"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.2 监护”部分“3）使用条件”指出：监护适用于“涉及核安全、工业安全、辐射安全、环境安全以及电厂的稳定运行，可能产生立即的、不可逆的影响的重大后果的操作任务或步骤”。故本题选D（立即的、不可逆的），“延迟的”“可逆的”“轻微的”均与课件不符。\n\n【知识点】\n· 监护：由操作执行人和操作监护人两人在同一时间和地点共同执行同一任务，一人执行操作，一人同步确认。\n· 监护的使用条件是可能产生立即的、不可逆的影响的重大后果的操作任务或步骤。\n· 监护通过设置“二人小组”形成预防错误的双重屏障，确保操作的正确性。\n· 监护人的授权通常应当等同或高于执行人的授权。"},{"id":"safety_fryin_0006","module":"safety","bank":"安全-防人因失误","type":"judge","stem":"使用监护工具时，监护人的授权可以低于操作人的授权。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.2 监护”部分“5）基本原则”指出“监护人的授权通常应当等同或高于执行人的授权”，同时“6）应避免的风险行为”中明确包含“监护人的授权低于操作人的授权”。题干“监护人的授权可以低于操作人的授权”与课件相反，故本题判断错误。\n\n【知识点】\n· 监护人的授权通常应当等同或高于执行人的授权。\n· 监护人的授权低于操作人的授权属于应避免的风险行为。\n· 执行人和监护人都必须对正确设备进行自检。\n· 监护人必须对执行人的行动全程观察，并对正确和错误的行动给予回应。"},{"id":"safety_fryin_0007","module":"safety","bank":"安全-防人因失误","type":"single","stem":"独立验证通过验证人（组）和操作人（组）在（　）方面进行隔离，为操作提供最大程度的可靠性保证。","options":["时间","空间","思维","时间、空间和思维"],"answer":["D"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.3 独立验证”部分“2）目的”指出：“独立验证通过验证人（组）和操作人（组）在时间、空间和思维方面进行隔离，从而对于操作提供了最大程度的可靠性保证，确保任务的完成符合相关标准和程序。”故本题选D（时间、空间和思维），三个要素缺一不可。\n\n【知识点】\n· 独立验证通过验证人（组）和操作人（组）在时间、空间和思维方面进行隔离。\n· 独立验证是将工作人员分为执行组和验证组两个小组，执行组和验证组先后派出，后派出的小组对先派出的小组的执行结果加以确认。\n· 独立验证适用于不会立即产生严重后果但是有潜在不良影响的操作。\n· 验证人授权应等同或高于执行人的授权。"},{"id":"safety_fryin_0008","module":"safety","bank":"安全-防人因失误","type":"single","stem":"三向交流的三个步骤依次是（　）。","options":["发送、记录、签字","复述、记录、确认","发送、复述、确认","陈述、提问、确认"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.4 三向交流”部分定义指出：“三向交流：指通过信息的发送、复述和确认，从而确保信息从发送人准确无误地传输给接收人的一套特定口头交流原则”，即三个步骤依次为发送、复述、确认。故本题选C。\n\n【知识点】\n· 三向交流的三个步骤依次为：发送信息、复述听到的内容、确认复述的信息是否正确。\n· 三向交流的目的是精确、准确、清楚并无误地传输信息，确保收到的信息就是想要传达的信息。\n· 在电厂运行工作的口头信息传递过程中必须使用三向交流。\n· 发送者核实信息正确后对接收者说“正确”“对的”等表示肯定；如果信息错误，则重新开始以上沟通流程。"},{"id":"safety_fryin_0009","module":"safety","bank":"安全-防人因失误","type":"judge","stem":"使用三向交流工具可以有效避免沟通失误，因此任何一项操作任务都必须使用三向交流。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.4 三向交流”部分使用条件规定“在电厂运行工作的口头信息传递过程中必须使用三向交流”，但并未要求“任何一项操作任务都必须使用三向交流”，其“6）应避免的风险行为”中明确包含“在非关键信息传递时，过度使用三向交流”。题干表述绝对化，与课件不符，故本题判断错误。课件配套练习题（第82页）亦判定该说法为错。\n\n【知识点】\n· 三向交流适用于口头信息传递，包括下达操作指令、重要系统设备状态确认、安全状况报告、职责转移等。\n· 在非关键信息传递时过度使用三向交流属于应避免的风险行为。\n· 三向交流的三个步骤为发送、复述、确认。\n· 交流过程中必须保持一对一交流，信息表述要清晰、简洁、完整、没有双重含义。"},{"id":"safety_fryin_0010","module":"safety","bank":"安全-防人因失误","type":"single","stem":"程序的使用级别分为（　）。","options":["连续使用、参照使用、记忆使用","连续使用、间断使用、记忆使用","参照使用、抽查使用、连续使用","连续使用、参照使用、口头使用"],"answer":["A"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.5 使用和遵守程序”部分使用条件指出“根据程序执行的级别（连续使用、参照使用、记忆使用）使用程序”。故程序的使用级别分为连续使用、参照使用、记忆使用三级，本题选A。选项B将“参照使用”误为“间断使用”，C、D混入“抽查使用”“口头使用”，均与课件不符。\n\n【知识点】\n· 程序的使用级别分为连续使用、参照使用、记忆使用。\n· 运行操作三步以上的工作均需要“连续使用程序”。\n· 使用和遵守程序：指在任何活动中必须严格按照反映电厂设计基准的电厂适用规程来行动。\n· 程序是防止人因失误最基本的一道屏障。"},{"id":"safety_fryin_0011","module":"safety","bank":"安全-防人因失误","type":"single","stem":"运行操作（　）以上的工作均需要“连续使用程序”。","options":["一步","两步","三步","五步"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.5 使用和遵守程序”部分使用条件明确“运行操作三步以上的工作均需要‘连续使用程序’”。故本题选C（三步），“一步”“两步”“五步”均与课件不符。\n\n【知识点】\n· 运行操作三步以上的工作均需要“连续使用程序”。\n· 程序的使用级别分为连续使用、参照使用、记忆使用。\n· 凡是程序中有执行步骤确认框的均需按照划圈划杠的形式作为使用程序的标记方式。\n· 程序是防止人因失误最基本的一道屏障。"},{"id":"safety_fryin_0012","module":"safety","bank":"安全-防人因失误","type":"judge","stem":"执行程序时如出现响应与程序描述不一致且影响后续步骤执行，应暂停当前操作，将系统、设备置于安全状态并及时汇报。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.5 使用和遵守程序”部分使用方法明确指出：“如果在程序执行过程中，出现的响应和程序描写不一致……如果影响后续步骤的执行，则暂停当前操作将系统、设备置于安全状态并及时汇报。”题干表述与课件一致，故本题判断正确。\n\n【知识点】\n· 响应与程序描述不一致且影响后续步骤执行时，应暂停当前操作，将系统、设备置于安全状态并及时汇报。\n· 响应与程序描述不一致但不影响后续步骤执行时，在该步骤圆圈上画叉“×”，并在该步骤边上做好信息描述。\n· 如发现程序错误或无法执行、步骤不成功或信息未能得到确认，应暂停当前工作，将系统、设备置于安全状态并及时汇报。\n· 除非程序中有明确说明，否则应严格按照程序规定的顺序执行，不能跳步、漏步。"},{"id":"safety_fryin_0013","module":"safety","bank":"安全-防人因失误","type":"single","stem":"工前会SAFER原则中，“R”代表的含义是（　）。","options":["预测","评估","审查","综述"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.6 工前会”部分“工前会SAFER原则”明确指出“5) Review审查：审查回顾有关的运行经验”。故SAFER中“R”代表审查，本题选C。A“预测”对应Anticipate，B“评估”对应Evaluate，D“综述”对应Summary，均不对应R。\n\n【知识点】\n· 工前会SAFER原则：Summary综述、Anticipate预测、Foresee预计、Evaluate评估、Review审查。\n· Review审查即审查回顾有关的运行经验。\n· Summary综述是对任务进行分析，识别关键步骤；关键步骤包括产生立即后果或影响的步骤。\n· 工前会原则上由直接参与到工作的工作负责人主持召开。"},{"id":"safety_fryin_0014","module":"safety","bank":"安全-防人因失误","type":"judge","stem":"在工作完成后应立即召开工后会。（　）","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.7 工后会”部分“4）使用方法”时间要求明确“在工作完成后应立即召开工后会”。题干表述与课件一致，故本题判断正确。课件配套练习题（第123页）亦判定该说法为对。\n\n【知识点】\n· 在工作完成后应立即召开工后会。\n· 工后会指在一项任务/工作执行完后，工作人员之间进行的面对面的总结会。\n· 工后会以总结经验、改进工作绩效为目的，不要追究责任。\n· 工后会由工作负责人主持，采用对话讨论的开放形式。"},{"id":"safety_fryin_0015","module":"safety","bank":"安全-防人因失误","type":"single","stem":"使用“不确定时暂停”工具时，暂停后应把设备或者系统置于（　）。","options":["安全状态","运行状态","试验状态","备用状态"],"answer":["A"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.8 不确定时暂停”部分使用方法明确“二、把设备或者系统置于安全状态”，其“5）基本原则”也要求“工作暂停一定要保证设备或者系统处于安全状态下”。故本题选A（安全状态），“运行状态”“试验状态”“备用状态”均不符。\n\n【知识点】\n· 不确定时暂停：当实施任务过程中遇到有疑问或不能确信是正确时，停止工作，向他人求助或澄清后再继续执行任务。\n· 暂停后应把设备或者系统置于安全状态。\n· 在消除疑惑或不确定性之后才能继续工作。\n· 只要个人感觉疑惑或不确定时就应该暂停。"},{"id":"safety_fryin_0016","module":"safety","bank":"安全-防人因失误","type":"judge","stem":"在同一项任务实施过程中，2分钟检查工具只能使用一次。（　）","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.9 2分钟检查”部分“5）基本原则”明确指出“在同一项任务实施过程中，可以根据需要多次使用2分钟检查工具”。题干“只能使用一次”与课件矛盾，故本题判断错误。\n\n【知识点】\n· 在同一项任务实施过程中，可以根据需要多次使用2分钟检查工具。\n· 2分钟检查指工作人员在到达现场后，即将开始工作前，对现场环境及周边可能潜在的风险进行检查确认，不实际进行操作。\n· 2分钟检查用于帮助工作人员提高人员的情景意识，减少人因失误。\n· 现场检查如果遇到任何风险或存在任何不确定性或疑惑时，应停止工作，在继续工作前解决风险/不利情形。"},{"id":"safety_fryin_0017","module":"safety","bank":"安全-防人因失误","type":"single","stem":"2分钟检查是指工作人员（　），对现场环境及周边可能潜在的风险进行检查确认。","options":["工作完成后","执行操作过程中","到达现场即将开始工作前","召开工前会之前"],"answer":["C"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.3.9 2分钟检查”部分定义指出：“2分钟检查：指工作人员在到达现场后，即将开始工作前，对现场环境及周边可能潜在的风险进行检查确认，不实际进行操作。”故本题选C（到达现场即将开始工作前）。选项A“工作完成后”对应工后会场景，B“执行操作过程中”与“不实际进行操作”矛盾，D“召开工前会之前”并非2分钟检查的时机。\n\n【知识点】\n· 2分钟检查是到达现场后、即将开始工作前对现场环境及周边潜在风险的检查确认。\n· 2分钟检查不实际进行操作。\n· 2分钟检查的使用条件包括刚到达工作地点时、对重要风险设备操作前、较长时间暂停或中断后（如午餐）等。\n· 2分钟检查用于帮助工作人员提高人员的情景意识，减少人因失误。"},{"id":"safety_fryin_0018","module":"safety","bank":"安全-防人因失误","type":"multi","stem":"以下属于中国核电防人因失误工具的有（　）。","options":["自检","监护","三向交流","危险源辨识"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"保护区准入防人因失误课件","explanation":"依据课件《保护区准入·防人因失误》：课件“3.2 中国核电防人因失误工具”列出中国核电技术标准《防人因失误工具使用方法》（Q/CNNP OE.J 2101-2024）规定的九种工具：自检、监护、独立验证、三向交流、使用和遵守程序、工前会、工后会、不确定时暂停、2分钟检查。选项中自检、监护、三向交流均在其中，危险源辨识不在该工具清单内（属预防策略中“识别可能的失误工况”的内容），故本题选ABC。\n\n【知识点】\n· 中国核电防人因失误工具共九种：自检、监护、独立验证、三向交流、使用和遵守程序、工前会、工后会、不确定时暂停、2分钟检查。\n· 中国核电防人因失误工具依据Q/CNNP OE.J 2101-2024《防人因失误工具使用方法》。\n· 防人因失误工具是一种行为方式、工作方式或思考方式，应用其可帮助工作人员减少工作中的人因失误。\n· 危险源辨识不属于中国核电防人因失误工具清单。"},{"id":"safety_fsej_0001","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"根据放射源分类，没有防护的情况下接触几分钟到1小时就可致人死亡的极高危险源是（　）","options":["Ⅰ类放射源","Ⅱ类放射源","Ⅲ类放射源","Ⅳ类放射源"],"answer":["A"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第151页（6.1 定义与分类）明确指出\"I类放射源：极高危险源，没有防护情况下，接触这类源几分钟到1小时就可致人死亡\"。故本题选A（Ⅰ类放射源）。II类为高危险源（几小时至几天致死），III类为危险源，IV类为低危险源。\n\n【知识点】\n· I类放射源为极高危险源，无防护下接触几分钟到1小时可致人死亡。\n· II类放射源为高危险源（探伤常用源），无防护下接触几小时至几天可致人死亡。\n· III类放射源为危险源，无防护下接触几小时可造成永久性损伤。\n· 根据对人体健康和环境的潜在危害程度，放射源从高到低分为Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ五类。"},{"id":"safety_fsej_0002","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"根据对人体健康和环境的潜在危害程度，射线装置从高到低分为（　）","options":["Ⅰ、Ⅱ两类","Ⅰ、Ⅱ、Ⅲ三类","Ⅰ、Ⅱ、Ⅲ、Ⅳ四类","Ⅰ至Ⅴ五类"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第152页（6.1 定义与分类）明确指出\"根据对人体健康和环境的潜在危害程度，从高到低将射线装置分为Ⅰ、Ⅱ、Ⅲ类\"。故本题选B（Ⅰ、Ⅱ、Ⅲ三类）。放射源分五类，但射线装置仅分三类，注意区分。\n\n【知识点】\n· 射线装置从高到低分为Ⅰ、Ⅱ、Ⅲ三类。\n· I类射线装置为高危险射线装置，事故时可使短时间受照人员产生严重放射损伤甚至死亡。\n· II类射线装置为中危险射线装置，事故时可使受照人员产生较严重放射损伤。\n· III类射线装置为低危险射线装置，事故时一般不会造成受照人员的放射损伤。"},{"id":"safety_fsej_0003","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"Ⅳ类、Ⅴ类放射源丢失、被盗、失控，或辐射防护管理失效导致人员受到超过年剂量限值的照射，该事故等级为（　）","options":["特别重大辐射事故","重大辐射事故","较大辐射事故","一般辐射事故"],"answer":["D"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第23页（辐射防护指标介绍）在一般辐射事故部分明确列出\"a)IV类、V类放射源丢失、被盗、失控；b)放射性同位素和射线装置失控、辐射防护管理或技术失效导致人员受到超过年剂量限值的照射\"。故本题选D（一般辐射事故）。III类放射源失控对应较大辐射事故，I/II类对应重大或特别重大辐射事故。\n\n【知识点】\n· IV类、V类放射源丢失、被盗、失控属于一般辐射事故。\n· III类放射源丢失、被盗、失控属于较大辐射事故。\n· I类、II类放射源丢失、被盗、失控属于重大或特别重大辐射事故。\n· 一般辐射事故还包括辐射防护管理失效导致人员受到超过年剂量限值的照射。"},{"id":"safety_fsej_0004","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"体内污染事件是指放射性工作人员体内非氚放射性核素摄入量（　）的事件。","options":["大于0.1%ALI","大于1%ALI","大于10%ALI","大于1个ALI"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第25页（辐射防护指标介绍）明确给出定义：\"指放射性工作人员体内非氚放射性核素摄入量大于1%ALI（ALI：年摄入量限值）的事件，单位：人次\"。故本题选B（大于1%ALI）。\n\n【知识点】\n· 体内污染事件指放射性工作人员体内非氚放射性核素摄入量大于1%ALI的事件。\n· ALI即年摄入量限值，是衡量体内污染的参考基准。\n· 体内污染事件是辐射防护指标中\"人的安全\"类指标之一。\n· 辐射工作人员应确保不发生体内污染，是RP2级辐射安全职责的要求。"},{"id":"safety_fsej_0005","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"根据RWP分级标准，预估集体剂量CD≥20man·mSv或最大个人剂量D≥4mSv的辐射工作，应办理（　）","options":["4级RWP","3级RWP","2级RWP","1级RWP"],"answer":["D"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第59页（RWP分级标准表）明确列出\"1级B | CD≥20 | D≥4 | C1≥400 | C2≥20 | 红区 | N/A\"，即预估集体剂量CD≥20man·mSv或最大个人剂量D≥4mSv的辐射工作应办理1级RWP。故本题选D（1级RWP）。\n\n【知识点】\n· RWP分级由低到高为4级、3级、2级、1级，1级风险最高。\n· 1级RWP标准：CD≥20man·mSv或D≥4mSv或C1≥400Bq/cm²或辐射分区为红区。\n· 2级RWP标准：5≤CD＜20，1≤D＜4；3级：0.2≤CD＜5，0.1≤D＜1。\n· 若存在重大辐射风险且风险失控会导致剂量约束值突破事件，直接办理1级RWP。"},{"id":"safety_fsej_0006","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"根据RWP审批权限，1级RWP的最终批准人是（　）","options":["辐射防护工程师","辐射防护科负责人或其指定授权人","保健物理处负责人或其指定授权人","工作负责人"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第60页（各级RWP审批权限表）明确列出\"1级 | 是（打印纸质RWP） | 是（需编制辐射防护实施方案） | 保健物理处负责人或其指定授权人\"。故本题选C（保健物理处负责人或其指定授权人）。4级和3级由辐射防护工程师审批，2级由辐射防护科负责人审批。\n\n【知识点】\n· 1级RWP最终批准人为保健物理处负责人或其指定授权人。\n· 2级RWP由辐射防护科负责人或其指定授权人审批。\n· 3级和4级RWP由辐射防护工程师审批。\n· 审批人指该级别RWP的最终审批人，审批前需逐级进行审批。"},{"id":"safety_fsej_0007","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"未经计划导致人员单次接受剂量≥15mSv且＜50mSv，或皮肤当量剂量≥150mSv且＜500mSv的照射事件，属于（　）","options":["严重非计划照射事件","一般非计划照射事件","较大辐射事故","体表污染事件"],"answer":["A"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第24页（辐射防护指标介绍）在非计划照射事件部分明确指出\"严重非计划照射事件：所有未经计划导致人员单次接受剂量≥15mSv，＜50mSv，或皮肤当量剂量≥150mSv，＜500mSv的照射事件\"。故本题选A（严重非计划照射事件）。一般非计划照射事件为≥1mSv且＜15mSv。\n\n【知识点】\n· 严重非计划照射事件：未经计划单次接受剂量≥15mSv且＜50mSv，或皮肤当量剂量≥150mSv且＜500mSv。\n· 一般非计划照射事件：未经计划单次接受剂量≥1mSv且＜15mSv，或皮肤当量剂量≥10mSv且＜150mSv。\n· 非计划照射事件包含严重和一般两个等级。\n· 辐射工作人员应确保不发生非计划照射，是RP2级辐射安全职责要求。"},{"id":"safety_fsej_0008","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"放射性物品厂内运输前必须进行包装，其包装外表面应无松散污染（＜0.4Bq/cm²），且表面接触剂量率应小于（　）","options":["0.1mSv/h","0.4mSv/h","2mSv/h","10mSv/h"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第127页（5.3 放射性物品厂内运输管理）在运输包装要求部分明确列出\"包装外表面无松散污染 <0.4Bq/cm²，表面接触剂量率 <2mSv/h\"。故本题选C（2mSv/h）。运输前必须对放射性物品进行包装，避免运输过程中泄漏。\n\n【知识点】\n· 放射性物品运输包装外表面无松散污染（＜0.4Bq/cm²）。\n· 运输包装表面接触剂量率应小于2mSv/h。\n· 运输前必须对放射性物品进行包装，避免放射性物质在运输过程中泄漏。\n· 包装不完整时禁止运输，运输负责人应全程跟踪。"},{"id":"safety_fsej_0009","module":"safety","bank":"安全-辐射防护二级课件","type":"single","stem":"无法放入CPO测量的大件物品办理物项带出许可证带出辐射控制区时，经RP人员测量确认的合格标准是（　）","options":["接触剂量率＜200nSv/h且表面污染＜0.4Bq/cm²","接触剂量率＜2mSv/h且表面污染＜0.4Bq/cm²","接触剂量率＜0.1mSv/h且表面污染＜0.04Bq/cm²","接触剂量率＜200nSv/h且表面污染＜4Bq/cm²"],"answer":["A"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第121页（5.1 非放射性物品管理要求）在非放射性物品出辐射控制区申请部分明确指出\"经RP人员测量确认（接触剂量率＜200nSv/h，表面污染＜0.4Bq/cm²）\"，且\"无法放入CPO的物品需办理物项带出许可证\"。故本题选A。\n\n【知识点】\n· 无法放入CPO测量的物品需办理物项带出许可证带出辐射控制区。\n· 带出合格标准：接触剂量率＜200nSv/h且表面污染＜0.4Bq/cm²。\n· 随身携带的小物品经CPO测量确认无污染后可直接带出（无需办理申请）。\n· 拟带出物项须由工作负责人确认未直接接触过放射性介质且未用于放射性工艺系统。"},{"id":"safety_fsej_0010","module":"safety","bank":"安全-辐射防护二级课件","type":"multi","stem":"对高辐射风险工作，通常采取的辐射风险控制措施包括（　）","options":["冲洗去污","加装屏蔽","区域隔离、远程操作","延长人员现场作业时间"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第78页（3.4 高辐射风险工作管控）明确指出\"为控制作业中的辐射风险、保证人员辐射安全，通常采取冲洗去污、加装屏蔽、区域隔离、远程操作、作业时间控制、连续辐射监测等措施\"。故选A（冲洗去污）、B（加装屏蔽）、C（区域隔离、远程操作）。D项\"延长人员现场作业时间\"与辐射防护原则相反，应缩短作业时间。\n\n【知识点】\n· 高辐射风险工作通常采取冲洗去污、加装屏蔽、区域隔离、远程操作等措施。\n· 作业时间控制是重要措施之一，应缩短而非延长人员在辐射场的作业时间。\n· 连续辐射监测也是高辐射风险工作的管控措施。\n· 高辐射风险工作是指辐射风险高、容易导致人员污染或非计划照射事件甚至辐射事故的作业。"},{"id":"safety_fsej_0011","module":"safety","bank":"安全-辐射防护二级课件","type":"judge","stem":"放射源使用完毕后，可以待大修结束后统一归还源库。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第153页（6.2 放射源存放与借用）在放射源借用部分明确要求\"放射源使用完毕，应立即归还，办理登记签字手续\"。题干\"待大修结束后统一归还\"与课件\"立即归还\"的要求矛盾，故本题判\"错误\"。\n\n【知识点】\n· 放射源使用完毕应立即归还，并办理登记签字手续。\n· 放射源借用期间需专人负责放射源安全。\n· 放射源借用需办理申请，借用人员须具备相应资质。\n· 发生异常事件时应立刻正确响应并报告。"},{"id":"safety_fsej_0012","module":"safety","bank":"安全-辐射防护二级课件","type":"judge","stem":"放射性物品进入厂区前，拥有部门须至少提前1个工作日办理进厂审批。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第1314行（5.4 放射性物品进厂运输管理）明确指出\"放射性物品进入厂区前，放射性物品拥有部门（如非本电站单位，则由电站接口部门联系）须至少提前1个工作日办理放射性物品进厂审批\"。故本题判\"正确\"。\n\n【知识点】\n· 放射性物品进入厂区前须至少提前1个工作日办理进厂审批。\n· 进厂审批由放射性物品拥有部门办理，非本电站单位由电站接口部门联系。\n· 进厂运输需遵循先审批后执行的原则。\n· 进厂审批表需写明承运单位、拥有单位、运输车辆牌号、存放位置、货包信息等。"},{"id":"safety_fsej_0013","module":"safety","bank":"安全-辐射防护二级课件","type":"judge","stem":"厂内运输放射性物品，可以在辐射控制区与非辐射控制区之间进行。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第1275行（5.3 放射性物品厂内运输管理）明确指出\"厂内运输放射性物品只允许在RCA（辐射控制区）之间进行\"。题干\"可以在辐射控制区与非辐射控制区之间进行\"与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 厂内运输放射性物品只允许在RCA（辐射控制区）之间进行。\n· 厂内运输遵循先审批后执行的原则，按要求办理审批。\n· 严禁放射性物品按非放运出辐射控制区。\n· 运输需满足包装完整、全程跟踪、禁止恶劣天气运输等要求。"},{"id":"safety_fsej_0014","module":"safety","bank":"安全-辐射防护二级课件","type":"judge","stem":"按照放射性物品存放要求，红区、橙区内禁止存放放射性物品。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第124页（5.2 放射性物品存放要求）在存放原则图中明确标注\"红橙区：红橙区禁放\"。即红区、橙区内禁止存放放射性物品。故本题判\"正确\"。\n\n【知识点】\n· 红区、橙区内禁止存放放射性物品。\n· 放射性物品存放须避免与非放物品混放，间隔30cm以上。\n· 存放场地应远离人员通道、辐射监测设备，且远离通风口。\n· 存放需办理申请，张贴\"放射性物品存放点\"标识和\"放射性污染标识牌\"。"},{"id":"safety_fsej_0015","module":"safety","bank":"安全-辐射防护二级课件","type":"judge","stem":"体表污染事件是指工作人员体表受到放射性污染致其皮肤当量剂量大于1mSv的事件。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第25页（辐射防护指标介绍）明确给出定义\"是指工作人员身体表面受到放射性污染致其皮肤当量剂量大于1mSv（皮肤当量剂量年限值500mSv的0.2%）的事件，单位：人次\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 体表污染事件指工作人员体表受放射性污染致皮肤当量剂量大于1mSv的事件。\n· 1mSv对应皮肤当量剂量年限值（500mSv）的0.2%。\n· 体表污染异常是指污染水平大于控制标准（β＜0.4Bq/cm²，α＜0.04Bq/cm²）但未达到体表污染事件标准。\n· 辐射工作人员应确保不发生体表污染，是RP2级辐射安全职责要求。"},{"id":"safety_fsej_0016","module":"safety","bank":"安全-辐射防护二级课件","type":"judge","stem":"通用类辐射工作（如日常巡检、取样测量、管理巡视等）一般直接按4级RWP审批。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第58页（3.2 辐射工作许可）指出\"通用类辐射工作一般为4级RWP，主要包括各部门的日常巡检操作、取样测量、管理巡视等工作\"，第61页（RWP办理）明确\"通用类RWP：直接按4级RWP审批\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 通用类辐射工作一般为4级RWP，包括日常巡检、取样测量、管理巡视等。\n· 通用类RWP直接按4级RWP审批，无需逐级审批。\n· 工单类辐射工作需通过触发工作工单来进行辐射工作许可申请，按分级逐级审批。\n· 4级RWP由辐射防护工程师审批，无需打印纸质RWP。"},{"id":"safety_fsej_0017","module":"safety","bank":"安全-辐射防护二级课件","type":"judge","stem":"按照ALARA理念，每人每次进入控制区减少1μSv，大修就能降低约10%的集体剂量。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护二级课件","explanation":"依据课件《辐射防护二级》：课件第98页（4.3 ALARA的应用）以某电厂统计数据为例明确指出\"每人每次进入控制区减少1μSv，大修就能降低10%的集体剂量！每个人都践行ALARA理念，其产生的收益是巨大的！\"。题干表述与课件一致，故本题判\"正确\"。\n\n【知识点】\n· 每人每次进入控制区减少1μSv，大修就能降低约10%的集体剂量。\n· ALARA理念强调节约每一个微西弗，人人参与辐射防护最优化。\n· 集体剂量是所有工作人员接受外照射和内照射剂量的总和，单位man·mSv。\n· 减少人工时、增大距离、设置屏蔽、降低辐射源项等都是ALARA应用的具体措施。"},{"id":"safety_fsgx_0001","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"年摄入量限值（ALI）是指参考人在一年时间内经吸入、食入或通过皮肤所摄入的某种给定放射性核素的量，其单位是（　）","options":["希沃特（Sv）","贝克（Bq）","贝克每平方厘米（Bq/cm²）","希沃特每小时（Sv/h）"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.8节\"辐射防护常用量及单位\"在评估内照射常用量部分明确给出：\"年摄入量限值（ALI）：指参考人在一年时间内经吸入、食入或通过皮肤所摄入的某种给定放射性核素的量，其所产生待积剂量等于相应的剂量限值。单位：贝克（Bq）\"。故本题选B。Sv是有效剂量（剂量当量）单位，Sv/h是剂量率单位，Bq/cm²是表面污染水平单位，均不符合。\n\n【知识点】\n· 年摄入量限值（ALI）是指参考人在一年时间内经吸入、食入或通过皮肤摄入的某种给定放射性核素的量。\n· ALI的单位是贝克（Bq），1Bq＝1次衰变/秒。\n· 待积当量剂量（H50）是摄入放射性核素后在一个器官或组织中50年内的剂量当量率时间积分。\n· 导出空气浓度（DAC）：在1DAC的某一核素空气污染环境中停留1小时，造成的内照射剂量是0.01mSv。"},{"id":"safety_fsgx_0002","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"核电厂四种射线中，穿透能力最差、在空气中仅能传播2-3厘米、用纸张即可屏蔽的射线是（　）","options":["β射线","γ射线","α射线","中子射线"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.7节\"核电厂的射线类型\"α射线部分以表格形式明确：\"穿透能力：最差，在空气中仅能传播2-3厘米。屏蔽方法：纸张、薄衣服、皮肤（角质层）\"。故本题选C（α射线）。β射线在空气中可传播几百厘米，用铝板、塑料板屏蔽；γ射线穿透能力非常强；中子穿透能力也非常强。\n\n【知识点】\n· α射线穿透能力最差，在空气中仅能传播2-3厘米，用纸张即可屏蔽。\n· α射线一般情况下不考虑外照射，仅考虑其内照射危害，可对敏感器官造成很大剂量。\n· 核电厂只在燃料组件破损的情况下α粒子才会进入主冷却剂系统。\n· β射线是高速运动的电子，穿透力比α强，可被一张几毫米厚的铝箔完全阻挡；γ射线需非常厚实且密度高的材料（混凝土墙、铅板、大量的水）屏蔽。"},{"id":"safety_fsgx_0003","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"对中子射线进行屏蔽，应选择的屏蔽材料是（　）","options":["铅板","厚钢板","铝板","水、石蜡等含氢较多的轻物质"],"answer":["D"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.7节中子射线部分明确指出：\"对中子的屏蔽材料应选择轻物质，即含有较多氢元素的物质，如石蜡、水等\"，并给出屏蔽方法为\"水，石蜡，或混凝土\"。故本题选D。铅板、厚钢板等重物质主要用于屏蔽γ射线，对中子慢化效果差。\n\n【知识点】\n· 中子屏蔽应选择轻物质，即含有较多氢元素的物质，如石蜡、水等。\n· 中子不带电，与物质的电离通过间接方式进行，能量损失较慢，在介质中穿透力很强。\n· 中子不存在内照射危害问题，风险类型为外照射风险，造成全身剂量。\n· 中子和γ射线是核电厂四种射线中穿透本领最强的射线。"},{"id":"safety_fsgx_0004","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"下列关于随机性效应的说法，正确的是（　）","options":["发生几率与剂量大小有关，严重程度与剂量无关，且不存在剂量阈值","存在剂量阈值，剂量低于阈值就不会发生","严重程度随受照剂量增加而不断加重","只有在短时间内接受大剂量急性照射后才会发生"],"answer":["A"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.9节\"辐射对人体的影响\"随机性效应部分明确指出：\"随机性效应发生几率与剂量大小有关，严重程度与剂量无关，而且不存在剂量阈值\"。故本题选A。B、C选项是确定性效应的特征（存在剂量阈值、严重程度随剂量增加而加重）。\n\n【知识点】\n· 随机性效应发生几率与剂量大小有关，严重程度与剂量无关，不存在剂量阈值。\n· 确定性效应的严重程度随剂量增加而增加，且存在剂量阈值，剂量降低到一定程度时这类效应不出现。\n· 辐射防护目的是避免发生确定性效应，并把随机性效应的发生几率限制在可以接受的水平内。\n· 核电厂中工作涉及到的辐射生物效应主要是随机性效应。"},{"id":"safety_fsgx_0005","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"根据国家标准，辐射工作人员眼晶体的年当量剂量限值为（　）","options":["50mSv/年","150mSv/年","500mSv/年","15mSv/年"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.10节\"现行个人剂量限值的国家标准\"表格明确规定：辐射工作人员\"眼晶体当量剂量150mSv/年\"。故本题选B。50mSv是年有效剂量限值，500mSv是皮肤和四肢当量剂量限值，15mSv是公众眼晶体当量剂量限值。\n\n【知识点】\n· 辐射工作人员眼晶体年当量剂量限值为150mSv。\n· 辐射工作人员年有效剂量任何一年不得超过50mSv，连续5年内平均不得超过20mSv。\n· 辐射工作人员皮肤当量剂量、四肢当量剂量限值均为500mSv/年。\n· 16-18岁实习或培训的学徒眼晶体当量剂量限值为50mSv/年，公众为15mSv/年。"},{"id":"safety_fsgx_0006","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"根据国家标准，个人剂量限值不适用于（　）","options":["职业照射","公众照射","医疗照射和天然本底照射","内照射和外照射"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.10节个人剂量限制部分明确指出：\"剂量限值是针对内、外照射的总剂量。它不适用于医疗照射和天然本底照射\"。故本题选C。职业照射和公众照射均适用剂量限值；内照射和外照射剂量均计入总剂量受限值约束。\n\n【知识点】\n· 个人剂量限值不适用于医疗照射和天然本底照射。\n· 剂量限值是针对内、外照射的总剂量。\n· 剂量限值是对人员剂量的约束，确保受照剂量不得高于剂量限值是一条不可逾越的红线。\n· 在国家标准限值之下，各电厂均制定和执行电厂的剂量约束值和管理目标值。"},{"id":"safety_fsgx_0007","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"辐射防护四原则中，仅明确为辐射工作人员应履行职责的要求是（　）","options":["正当性原则","最优化原则（ALARA）","个人剂量限制","自我防护原则"],"answer":["D"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.10节\"辐射防护四原则之间的关系\"明确指出：\"自我防护主要明确辐射防护是工作人员应该履行的职责\"。课件练习题也给出答案\"辐射防护四原则中仅针对工作人员的职责要求是自我防护原则\"。故本题选D。\n\n【知识点】\n· 辐射防护四原则为：正当性原则、最优化原则（ALARA）、个人剂量限制、自我防护原则。\n· 自我防护原则明确辐射防护是每一个辐射工作人员自觉履行的职责。\n· 正当性是辐射工作开展的前提，最优化是辐射工作开展的方法，剂量限制是对人员剂量的约束。\n· 自我防护要求工作人员遵守辐射防护程序规定，运用辐射防护知识和技能，在工作各环节贯彻最优化原则。"},{"id":"safety_fsgx_0008","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"大修期间，热粒子主要存在于（　）","options":["主控制室","常规岛汽轮机厂房","乏燃料水池和换料水池","卫生出入口更衣间"],"answer":["C"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件2.4节\"消除/控制热粒子\"部分明确指出：\"典型工作或场所：物项吊出乏池或换料水池，部分放射性设备内壁可能会吸附热粒子。大修期间，热粒子主要存在于乏池和换料水池\"。故本题选C。热粒子防护措施为距离防护、冲洗、屏蔽。\n\n【知识点】\n· 热粒子指体积微少而放射性较高的微粒。\n· 热粒子来源一般以一回路设备的腐蚀与磨损产生的微粒为主。\n· 大修期间，热粒子主要存在于乏池和换料水池。\n· 热粒子的防护措施包括距离防护、冲洗、屏蔽。"},{"id":"safety_fsgx_0009","module":"safety","bank":"安全-辐射防护共性","type":"single","stem":"表面污染中，污染物可以去除、容易转移、极易扩散而必须加以控制的是（　）","options":["固定污染","松散污染","均匀污染","感生污染"],"answer":["B"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件2.5节\"表面污染及其特点\"明确分类：\"固定污染：污染物难以去除。松散污染：污染物可以去除，容易转移\"，并指出\"松散污染极易扩散，必须加以控制\"。故本题选B（松散污染）。\n\n【知识点】\n· 表面污染分为固定污染和松散污染两种。\n· 固定污染的污染物难以去除；松散污染的污染物可以去除、容易转移。\n· 松散污染极易扩散，必须加以控制，其风险包括吹扫造成空气污染和体表沾污。\n· 表面污染来源于空气中放射性微尘的沉降、一回路相关系统/设备泄漏或溢流、带放射性设备的维修工作等。"},{"id":"safety_fsgx_0010","module":"safety","bank":"安全-辐射防护共性","type":"multi","stem":"下列属于表面污染集体防护方法的有（　）","options":["布置表面污染隔离区","召开工前会，明确作业人员辐射风险和防护措施","发现污染，及时去污","作业人员穿戴纸衣、橡胶手套、塑料鞋套"],"answer":["A","B","C"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件2.6节\"表面污染的防护\"明确列出集体防护方法：\"布置表面污染隔离区；召开工前会，明确作业人员辐射风险和防护措施；发现污染，及时去污\"。故选ABC。D项穿戴纸衣、橡胶手套、塑料鞋套属于个人防护方法，不属于集体防护方法。\n\n【知识点】\n· 表面污染集体防护方法：布置表面污染隔离区、召开工前会明确辐射风险和防护措施、发现污染及时去污。\n· 表面污染个人防护方法：按要求穿戴附加防护用品（纸衣、橡胶手套、塑料鞋套）。\n· 发现污染应遵循先隔离、后去污的原则。\n· 避免工器具污染的方法：减少带入污染区物项、使用塑料布包裹、采用易去污的材料及工艺。"},{"id":"safety_fsgx_0011","module":"safety","bank":"安全-辐射防护共性","type":"judge","stem":"电离辐射与非电离辐射最大的区别在于射线的穿透能力。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.2节\"电离辐射与非电离辐射的区别\"明确指出：\"电离辐射与非电离辐射最大的区别为能量的大小\"。电离辐射是电磁波或粒子带有足够能量将原子中的电子剥离；非电离辐射能量较小，不足以使原子中的电子转移。题干称\"最大的区别在于穿透能力\"与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 电离辐射与非电离辐射最大的区别为能量的大小。\n· 电离辐射可将原子中的电子剥离，使原子带电即被电离。\n· 非电离辐射能量较小，不足以使原子中的电子转移。\n· 4G/5G通信、WIFI、蓝牙、可见光、微波炉等属于非电离辐射。"},{"id":"safety_fsgx_0012","module":"safety","bank":"安全-辐射防护共性","type":"judge","stem":"天然放射性对人均剂量贡献最大，全球每年平均约3.1mSv，这部分无法避免的剂量称为本底。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.5节\"天然放射性与人工放射性来源及人均剂量对比\"明确指出：\"天然放射性对人均剂量的贡献最大，全球每年平均所受的天然放射性的有效剂量约为3.1mSv。这部分剂量是无法避免的，我们称之为本底\"。与题干表述一致，故本题判\"正确\"。\n\n【知识点】\n· 天然放射性对人均剂量的贡献最大，全球每年平均约3.1mSv。\n· 这部分无法避免的剂量称为本底。\n· 天然放射性包含宇宙射线、地壳及人体中的放射性物质等。\n· 人工放射性只对局部区域、局部人群造成较大剂量，其中贡献最大的是医疗照射。"},{"id":"safety_fsgx_0013","module":"safety","bank":"安全-辐射防护共性","type":"judge","stem":"在正常的电厂活动中，所接受的辐射剂量不会导致确定性效应。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.9节确定性效应部分明确指出：\"确定性效应的严重程度随剂量增加而增加，且存在剂量阈值。当剂量降低到一定程度时，这类效应不出现。在正常的电厂活动中，所接受的辐射剂量不会导致确定性效应\"。与题干一致，故本题判\"正确\"。\n\n【知识点】\n· 在正常的电厂活动中，所接受的辐射剂量不会导致确定性效应。\n· 确定性效应存在剂量阈值，如眼晶体白内障阈值3Sv、骨髓造血抑制阈值0.5Sv。\n· 确定性效应的严重程度随剂量增加而增加。\n· 确定性效应是辐射导致组织或器官中足够多的细胞被杀死或失去正常功能，如白内障、造血功能障碍。"},{"id":"safety_fsgx_0014","module":"safety","bank":"安全-辐射防护共性","type":"judge","stem":"β射线实际上是高速运动的电子，一张几毫米厚的铝箔可将其完全阻挡。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件1.7节β射线部分明确指出：\"β射线：实际上是高速运动的电子\"，\"β粒子能被体外衣服消减、阻挡或一张几毫米厚的铝箔完全阻挡\"。与题干一致，故本题判\"正确\"。\n\n【知识点】\n· β射线实际上是高速运动的电子。\n· β射线在空气中可传播几百厘米，穿透力比α射线强。\n· β粒子能被一张几毫米厚的铝箔完全阻挡，屏蔽材料为铝板、塑料板等。\n· β射线风险类型为内照射/外照射，眼睛和皮肤最容易受到β辐射影响，其主要来源为腐蚀活化产物和裂变产物。"},{"id":"safety_fsgx_0015","module":"safety","bank":"安全-辐射防护共性","type":"judge","stem":"防水纸衣既能防护表面污染，也能有效降低人员受到的外照射剂量。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件2.6节防水纸衣部分明确指出：\"防水纸衣对一般的放射性液体或潮湿的作业环境有较好防护效果，一般用于需接触放射性液体或潮湿的污染环境作业。仅用于防护表面污染，不防护外照射\"。题干称其\"能有效降低外照射剂量\"与课件矛盾，故本题判\"错误\"。\n\n【知识点】\n· 防水纸衣仅用于防护表面污染，不防护外照射。\n· 防水纸衣适用于需接触放射性液体或潮湿的污染环境作业。\n· 普通纸衣不防水，不得用于潮湿或有水的工作环境。\n· 用于降低外照射剂量的屏蔽用品是屏蔽服（铅衣/钨衣），用于外照射剂量率较高的工作环境。"},{"id":"safety_fsgx_0016","module":"safety","bank":"安全-辐射防护共性","type":"judge","stem":"自给式呼吸器使用压缩空气，瓶内气体正常供气时间只有60分钟左右，使用过程中应严格控制在45分钟以内。","options":null,"answer":["正确"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件2.11节自给式呼吸器部分明确指出：\"自给式呼吸器使用的是压缩空气，瓶内气体的供气时间正常只有60分钟左右。使用过程中请严格控制在45分钟以内\"。与题干一致，故本题判\"正确\"。\n\n【知识点】\n· 自给式呼吸器用于严重空气污染但供气存在困难的环境中。\n· 自给式呼吸器使用压缩空气，正常供气时间只有60分钟左右。\n· 自给式呼吸器使用过程中应严格控制在45分钟以内，可重复使用，使用后及时充气。\n· 呼吸防护用品还包括口罩、半面罩、全面罩、气面罩、气衣等。"},{"id":"safety_fsgx_0017","module":"safety","bank":"安全-辐射防护共性","type":"judge","stem":"发现表面污染后，应先去污、确认去污有效后再进行隔离。","options":null,"answer":["错误"],"score":null,"source":"generated","origin":"辐射防护共性课件","explanation":"依据课件《辐射防护（共性）》：课件2.6节\"表面污染的防护\"明确给出要求：\"发现污染，先隔离、后去污\"。题干称\"先去污、确认去污有效后再进行隔离\"与课件规定的顺序相反，故本题判\"错误\"。\n\n【知识点】\n· 发现污染应先隔离、后去污。\n· 表面污染集体防护方法包括布置表面污染隔离区、召开工前会、发现污染及时去污。\n· 表面污染隔离区通常通过粘贴地面标识、划定场地隔离边界来布置。\n· 离开污染隔离区时应按顺序规范脱除附加防护用品：先脱橡胶手套，再脱纸衣，最后脱塑料鞋套。"},{"id":"safety_gczy_0001","module":"safety","bank":"安全-高处作业","type":"single","stem":"按《高处作业分级》，凡在距坠落高度基准面（　）及以上有可能坠落的高处进行的作业称为高处作业。","options":["2米","3米","5米","1.5米"],"answer":["A"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第1.1节\"高处作业的定义\"原文为\"《高处作业分级》（GBT3608-202X）：凡在距坠落高度基准面2米或2米以上有可能坠落的高处进行的作业，都称为高处作业\"。故本题选A（2米）。3米、5米、1.5米均与课件规定的2米标准不符；注意1.5米是《电业安全工作规程》中无脚手架或无栏杆时强制使用安全带的高度界限，不能与分级标准混用。\n\n【知识点】\n· 距坠落高度基准面2米或2米以上有可能坠落的高处进行的作业即为高处作业。\n· 《高处作业分级》标准号为GBT3608-202X。\n· 《电业安全工作规程》规定无脚手架或无栏杆的脚手架高度超过1.5米必须使用安全带或采取其他可靠安全措施，也称为高处作业。\n· 高处作业人员应身体健康、无饮酒、无精神不振等身体不适状况。"},{"id":"safety_gczy_0002","module":"safety","bank":"安全-高处作业","type":"single","stem":"按《电业安全工作规程》，在没有脚手架或没有栏杆的脚手架上工作时，高度超过（　）必须使用安全带或采取其他可靠的安全措施。","options":["1米","1.5米","2米","3米"],"answer":["B"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第1.1节原文为\"《电业安全工作规程》（GB26164.1-2010）：在没有脚手架或没有栏杆的脚手架上工作时，高度超过1.5米，必须使用安全带或采取其他可靠的安全措施，也称为高处作业\"。故本题选B（1.5米）。\n\n【知识点】\n· 无脚手架或无栏杆的脚手架高度超过1.5米必须使用安全带或采取其他可靠安全措施。\n· 该情形在《电业安全工作规程》中同样定义为高处作业。\n· 《电业安全工作规程》标准号为GB26164.1-2010。\n· 与《高处作业分级》\"距坠落高度基准面2米及以上\"的分级标准不同，注意区分两本规程的界定。"},{"id":"safety_gczy_0003","module":"safety","bank":"安全-高处作业","type":"single","stem":"使用梯子进入高处平面（屋顶或平台）时，梯子应延伸到超出平面上方（　）。","options":["0.5米","1米","1.5米","2米"],"answer":["B"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.3节\"梯子使用-顶部支撑\"原文为\"两梯框同时和支撑面靠紧。使用梯子进入高处平面（屋顶或平台）时，梯子应延伸到超出平面上方1米\"。故本题选B（1米）。\n\n【知识点】\n· 使用梯子进入屋顶或平台等高处的平面时，梯子应延伸超出平面上方1米。\n· 架设时两梯框应同时和支撑面靠紧。\n· 当有人在梯子上时，不应挪动梯子进行重新定位。\n· 不应站在折梯上以\"步行\"方式移动梯子。"},{"id":"safety_gczy_0004","module":"safety","bank":"安全-高处作业","type":"single","stem":"高处作业地点下方设置隔离区，当作业位置至底部的垂直距离h满足5m＜h≤15m时，隔离区半径R为（　）。","options":["2米","3米","4米","5米"],"answer":["C"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.1节\"高处作业隔离区\"原文明确给出划分原则\"当5m＜h≤15m时，R为4m\"（h为作业位置至其底部的垂直距离，R为半径）。故本题选C（4米）。\n\n【知识点】\n· 当2m≤h≤5m时，隔离区半径R为3m。\n· 当5m＜h≤15m时，R为4m；当15m＜h≤30m时，R为5m。\n· 当30m＜h时，R为6m。\n· 高处作业地点的下方应设置隔离区，隔离区半径随作业高度增大而增大。"},{"id":"safety_gczy_0005","module":"safety","bank":"安全-高处作业","type":"single","stem":"临边防护栏杆为双层，其上杆的高度为（　）。","options":["0.8米","0.9米","1.0米","1.2米"],"answer":["D"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.1节\"临边防护\"原文为\"防护栏杆为双层，上杆高1200mm，下杆高600mm，架设180mm高的挡脚板\"。1200mm即1.2米，故本题选D（1.2米）。\n\n【知识点】\n· 临边防护栏杆为双层，上杆高1200mm（1.2米）。\n· 下杆高600mm，并架设180mm高的挡脚板。\n· 防护栏杆应与警示标识配合使用。\n· 工作中应避免踩踏孔洞盖板，充分重视孔洞坠落风险。"},{"id":"safety_gczy_0006","module":"safety","bank":"安全-高处作业","type":"single","stem":"（　）及以上大风以及暴雨、雷电、冰雹、大雾等恶劣天气，应停止露天高处作业。","options":["四级","五级","六级","八级"],"answer":["B"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.2节\"作业前检查周围环境\"原文为\"在5级及以上大风以及暴雨、雷电、冰雹、大雾等恶劣天气，应停止露天高处作业\"。故本题选B（五级）。\n\n【知识点】\n· 5级及以上大风应停止露天高处作业。\n· 暴雨、雷电、冰雹、大雾等恶劣天气也应停止露天高处作业。\n· 脚手架接近裸露带电体时，应保持安全距离并做好防止触电的措施。\n· 作业前检查周围环境是脚手架使用前整体检查的重要环节之一。"},{"id":"safety_gczy_0007","module":"safety","bank":"安全-高处作业","type":"single","stem":"人字梯使用时，上部夹角以（　）为宜。","options":["35°～45°","20°～30°","60°～75°","10°～15°"],"answer":["A"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第2.3节\"梯子使用-架设角度\"原文为\"人字梯上部夹角以35-45°为宜；金属延伸梯、单梯与水平面倾斜75°架设，以实现最佳的防滑移效果\"。故本题选A（35°～45°）。\n\n【知识点】\n· 人字梯上部夹角以35°～45°为宜。\n· 金属延伸梯、单梯与水平面倾斜75°架设。\n· 梯子底部应放置在平稳的表面并做好防滑措施。\n· 不得将梯子放在不稳定基础上以获得附加高度（如脚手架）。"},{"id":"safety_gczy_0008","module":"safety","bank":"安全-高处作业","type":"single","stem":"速差器应满足高挂低用，使用时与垂直方向的夹角不得大于（　）。","options":["15°","20°","30°","45°"],"answer":["C"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第3.2节\"速差器挂设及使用\"原文为\"速差器应满足高挂低用，使用时与垂直方向夹角不得大于30°\"。故本题选C（30°）。\n\n【知识点】\n· 速差器应满足高挂低用，与垂直方向夹角不得大于30°。\n· 5米及以上脚手架重复攀爬必须使用速差器。\n· 速差器在使用前应拉2-3下确保具备制动效果。\n· 速差器系带被收进时应缓慢持续回放，禁止任其自由回收，否则易造成速差器损坏。"},{"id":"safety_gczy_0009","module":"safety","bank":"安全-高处作业","type":"single","stem":"人静止悬挂在安全带里，超过（　）就会有生命危险。","options":["5分钟","10分钟","15分钟","20分钟"],"answer":["D"],"score":null,"source":"generated","origin":"高处作业课件","explanation":"依据课件《高处作业》：第4.1节\"高坠伤害\"原文为\"人静止悬挂在安全带里，超过20分钟，就会有生命危险\"。故本题选D（20分钟）。\n\n【知识点】\n· 人静止悬挂在安全带里超过20分钟就会有生命危险。\n· 静止悬挂会因血液缺氧导致心脏、肝脏、肾脏严重损伤。\n· 使用防坠落设备时如出现高处坠落事件，应快速进行救援，以防持续伤害。\n· 静止悬挂在安全带里会造成人体损伤甚至死亡，属于悬吊创伤。"},{"id":"safety_gczy_0010","module":"safety","bank":"安全-高处作业","type":"judge","stem":"严禁使用挂红牌的脚手架，严禁未经验收的脚手架挂绿牌。","options":nul
