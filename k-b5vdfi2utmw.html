防护基础和专项安全培训","type":"single","stem":"以下不属于密闭空间作业监护人职责的是（ ）。","options":["在工作组成员工作期间，适时与密闭空间内作业人员沟通，监护工作组成员行为是否正常，履行监测和保护职责，保证在密闭空间外持续监护。","清楚应急联络电话，熟悉密闭空间各类危险源、预防措施及事故应急，在应急情况下开展救援工作。","准确掌握工作组成员的数量和身份，做好密闭空间人员和物项出入记录，对未经允许靠近或者试图进入密闭空间者予以警告并劝离。","对工作人员开展密闭空间培训"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：监护人职责包括在有限空间外持续监护并适时与作业人员沟通、清楚应急信息并在应急情况下开展救援、掌握人员数量身份并做好出入记录、劝离无关人员；对工作人员开展培训不属于监护人职责，故答案为D。"},{"id":"safety_fsjx_0018","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"密闭空间作业完成后，在确认一些事项后方可离开工作现场，不包括：（ ）。","options":["所有工作组成员已撤离","携带的设备和物品已撤离","清理并恢复至开工前状态","向部门领导汇报"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：作业完成后，工作负责人、监护人应检查确认所有工作组成员已撤离、携带的设备和物品已撤离、现场清理并恢复至开工前状态；向部门领导汇报不在确认事项之列，故答案为D。"},{"id":"safety_fsjx_0019","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"出现以下哪种异常情况时，应立即通知密闭空间内人员撤出。（ ）","options":["测氧仪报警或有毒有害气瓶浓度、爆炸性气体浓度超过标准","通风异常停止","内部人员出现身体不适","其他各项都是"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：发现禁止作业的条件（如通风异常、氧表报警等）、作业人员感到身体不适或出现异常行为、有限空间外出现威胁安全的险情时，均应命令作业者立即撤离，题列三种情况都属于，故答案为D。"},{"id":"safety_fsjx_0020","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"高风险的密闭空间作业前需提前准备文件与表格，不包括：（ ）。","options":["《人员出入登记表》","《气体测量记录表》","《作业危害分析》","核电厂技术规格书"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：作业前工作负责人/监护人需提前准备好人员出入登记表、气体测量记录表、《工作许可》等文件并放置在入口处，作业危害分析属作业准备内容；核电厂技术规格书与密闭空间作业文件无关，故答案为D。"},{"id":"safety_fsjx_0021","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"多个工作组需同时进入同一密闭空间开展作业，进入前，工作负责人应在其他各工作组所持的《人员出入记录表》内签字，同时各工作组应做好以下工作，不正确的是（ ）。","options":["确认已知悉其他工作组所从事的作业对本工作组产生的危害及需要各方注意的安全事项","仅在工作负责人之间进行安全交底","各工作负责人在工作过程中应及时沟通、相互协调，保证本工作组的作业不会对其他各方工作组造成威胁","工作负责人向本组成员进行传达和交底"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：多个工作组同时进入同一有限空间前，各组应确认已知悉相互作业的危害及注意事项，工作负责人要向本组成员进行传达和交底，各负责人及时沟通协调；「仅在工作负责人之间交底」而不向组员传达是不正确的，故答案为B。"},{"id":"safety_fsjx_0022","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列哪项不是密闭空间作业的安全违章行为（ ）。","options":["进入密闭空间作业前未按照规定建立有效通风。","按照规定进行氧含量、有毒气体浓度、爆炸性气体浓度测量。","工作监护人、工作负责人擅自离开作业现场。","密闭空间焊接作业将气瓶放在密闭空间内部。"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有限空间作业须遵循「先通风、再检测、后作业」原则，按规定测量氧含量、有毒气体和爆炸性气体浓度是必须执行的安全措施，不属于违章；未建立通风、监护人擅自离场、将气瓶放入密闭空间内焊接均属违章，故答案为B。"},{"id":"safety_fsjx_0023","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下对于在密闭空间进行作业的说法，不正确的是（ ）。","options":["可以在密闭空间内使用柴油机，但要做好通风措施","在密闭空间内进行焊接作业时，不应把气瓶带入密闭空间","当发现有无关人员试图进入密闭空间时，予以警告并劝离","强制通风应使用洁净的空气，严禁通入氧气"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：课件案例表明，在无通风的隧洞内长时间使用燃油发电机导致有毒有害气体积聚、人员中毒死亡，柴油机这类燃油动力设备不应在密闭空间内使用，A说法不正确；B、C、D均为课件明确要求，故答案为A。"},{"id":"safety_fsjx_0024","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"密闭空间可能存在危害不包括：（ ）。","options":["窒息","中毒","爆炸","台风"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有限空间作业的风险包括窒息、中毒、爆炸、化学腐蚀、高温、高空坠物、淹没、滑倒和坠落、触电等；台风属外部自然灾害，不是密闭空间内部可能存在的危害，故答案为D。"},{"id":"safety_fsjx_0025","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列关于密闭空间内进行焊接与切割作业的说法不正确的是（ ）。","options":["各类气瓶必须放在密闭空间/容器外部。","作业点附近应放置灭火装置。","当停止工作30分钟以上，不需要将所有的气源管线移出密闭空间或在密闭空间外切断气源。","严格检查，确保连接软管和阀门没有漏气。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：不得将各类气瓶带入有限空间、应检查软管阀门无漏气、作业点附近放置灭火装置；当停止工作30分钟以上，所有气源管线必须移出有限空间或在有限空间外切断气源，C说法不正确，故答案为C。"},{"id":"safety_fsjx_0026","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"属于密闭空间作业负责人职责的是（ ）。","options":["决定整个密闭空间的环境条件是否具备工作要求、进行授权进入密闭空间、监视工作过程和确认结束工作；","确保实际空间工作和许可进入的条件要求相一致；","认识密闭空间工作有哪些危险，包括征兆、症状和暴露在空间中导致的后果；","其他各项都是"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：工作负责人职责包括决定环境条件是否具备工作要求、明确进入人员、监视工作过程和确认结束工作，确保实际条件与许可进入条件一致，并认识密闭空间工作的危险（征兆、症状和后果），题列各项均属其职责，故答案为D。"},{"id":"safety_fsjx_0027","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"密闭空间监护人与作业人员的联系极其重要，监护人要根据实际情况采取适用的联系方式。以下哪种联系方式是错误的。（ ）","options":["直接喊话","对讲机、手机","绳索、手势","监护人进入密闭空间查看"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：监护人与作业人员的沟通方式有语言、对讲机手机、绳索、手势等，须提前明确且可操作；监护人必须在有限空间外持续监护，进入密闭空间查看违背监护要求且自身有危险，故答案为D。"},{"id":"safety_fsjx_0028","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"密闭空间氧气浓度含量应为（ ）。","options":["19.5%--21%","大于19.5%","不作要求","大于23.5%"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"密闭空间氧含量过低会缺氧窒息、过高则富氧增加火灾风险（课件指出氧浓度大于23.5%为氧富余、易引起火灾），应严格控制氧浓度范围；选项B、D无上限、C不作要求，只有A给出19.5%～21%的明确界限范围，故答案为A。注意：课件表述为「氧气含量必须保持在19.5-23.5%」「允许人员进入和工作的氧含量为19.5%～23.5%」，与官方答案不一致。"},{"id":"safety_fsjx_0029","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于监护人如何有效履行职责的说法，错误的是（ ）。","options":["监护人必须在密闭空间外进行持续监护，不能承担与监护职责冲突的工作；","监视作业条件的变化情况，适时与工作组成员进行必要的、有效的安全、报警、撤离等信息交流。","监护人应监督人员、物项进出记录情况、气体测量等情况，并做好人员物项出入记录、气体检测记录等并确保其准确性。","当发现密闭空间内人员没有应答时，第一时间进入密闭空间查看情况，争取最佳的救援时间。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：监护人必须在有限空间外持续监护、不承担与监护职责冲突的工作，监视作业条件变化并适时进行安全、报警、撤离等信息交流，做好出入记录和气体检测记录；发现人员无应答时切忌盲目进入空间查看施救，D说法错误，故答案为D。"},{"id":"safety_fsjx_0030","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于密闭空间应急救援，不正确的是：（ ）。","options":["作业前准备必要的应急救援器材（例如安全带、救援三脚架），以便监护人在确保个人安全的情况下使用应急救援设备将作业人员救出。","监护人应立即拨打应急救援电话","出现人员在密闭空间内窒息、中毒等导致昏迷的现象，密闭空间外部人员可以暂不采取防护措施，立即进入救人。","救援人员必须要在确保自身安全的前提下，方可进入容器开展救护。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：作业前应准备安全带、救援三脚架等应急救援器材，必要时监护人立即拨打应急救援电话，救援人员必须在确保自身安全的前提下方可进入救护，切忌盲目施救；外部人员不采取防护措施立即进入救人是错误的，故答案为C。"},{"id":"safety_fsjx_0031","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于密闭空间作业气体检测的说法，不正确的是（ ）。","options":["若实际工作中无法完全隔离有害物质，则需要持续监测并设置报警装置。","当有潜在改变密闭空间内空气质量的作业（例如进行打磨、焊接、涂漆、使用强挥发性气体，使用内燃机等工作）必须进行持续监测。","推荐密闭空间内部人员随身佩戴气体检测仪表的方式检测气体含量。","只要看起来没问题就不用进行气体检测。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：作业应遵循「先通风、再检测、后作业」；无法完全隔离有害物质或进行可能改变空气质量的作业（打磨、焊接、涂漆、使用内燃机等）时必须持续监测，并推荐内部人员随身佩戴气体检测仪表；「看起来没问题就不用检测」是错误的，故答案为D。"},{"id":"safety_fsjx_0032","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在通过C1（门框式污染监测仪）或C2（全身表面污染监测仪）时提示被污染时，你应该（ ）。","options":["自己立即进行冲洗","在同伴帮助下小心冲洗","及时通知辐射防护人员","不予理会，强行通过"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：人员污染监测出现报警时，应迅速报告辐射防护人员；C1、C2门检测出污染时须先通知RP人员并在其指导下处理，颈部以上污染严禁自行去污；自行冲洗或强行通过都不正确，故答案为C。"},{"id":"safety_fsjx_0033","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"一名辐射工作人员进入辐射控制区后，看了看手表，发现时间还早，捋了捋头发，玩了会儿手机，时间差不多了，开始工作，工作现场太热，于是擦了擦汗，瞄了一眼电子式剂量计（EPD），发现接受了1μSv的剂量，随手将电子式剂量计（EPD）放在旁边的管道上，继续开始干活，突然发现电子式剂量计（EPD）报警了，于是重新将电子式剂量计（EPD）戴好，结束工作。以下关于此名辐射工作人员的行为说法错误的是（ ）。","options":["携带手表等个人物品进入辐射控制区属于违规行为","使用穿戴的连体服袖口等防护物资擦汗可能造成皮肤沾污","使用EPD测一下管道附近的辐射强度是一种小窍门","将电子式剂量计（EPD）随意放置在管道上将使剂量计无法准确监测个人所在环境的辐照剂量"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：手表等私人物品不得带入辐射控制区；用穿戴的防护用品擦汗可能造成面部沾污；EPD须随身正确佩戴，随意放置将无法准确监测个人受照剂量。EPD是个人剂量计，用它测量管道附近辐射强度属误用，并非「小窍门」，C说法错误，故答案为C。"},{"id":"safety_fsjx_0034","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在辐射工作中，使用长杆工具操作带辐射的设备，属于以下哪种防护措施（ ）。","options":["距离防护","源强防护","屏蔽防护","时间防护"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：距离防护是通过增大人与辐射源之间的距离来降低人员受照剂量的方法，具体做法包括与辐射源保持距离、使用长杆工具；用长杆工具操作带辐射的设备属于距离防护，故答案为A。"},{"id":"safety_fsjx_0035","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下说法错误的是（ ）。","options":["辐射的生物效应按剂量效应关系分为确定性效应和随机性效应，工作中进行采取防护措施的目的是使随机性效应发生的概率尽量低。","全身有效剂量是内照射和外照射剂量的总和。","确定性效应是人体接受的剂量达到某个阈值时一定会发生的效应。","在正常情况下开展辐射工作也可能会发生确定性效应。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：确定性效应存在剂量阈值，剂量达到阈值才会发生；课件明确「在正常的电厂活动中，所接受的辐射剂量不会导致确定性效应」，D说法错误；A、B、C表述均与课件一致，故答案为D。"},{"id":"safety_fsjx_0036","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在辐射工作中，工作人员穿戴铅衣，属于以下哪种防护措施（ ）。","options":["距离防护","源强防护","屏蔽防护","时间防护"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：屏蔽防护是通过在人与辐射源之间加设屏蔽来降低人员受照剂量的方法；屏蔽服（铅衣/钨衣）用于外照射剂量率较高的工作环境，属屏蔽防护措施，故答案为C。"},{"id":"safety_fsjx_0037","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于辐射工作控制以下说法错误的是（ ）。","options":["ALARA工前会上，工作负责人和辐射防护人员根据《工前会检查单》逐项进行检查和落实","当工作进行到停工待捡点时，工作组必须停止工作，联系辐射防护人员检查","当工作进行到见证点时，工作负责人可以自行检查，不必通知辐射防护人员","对于具有潜在高辐射风险的工作，工作组应借用便携式辐射监测仪表或无线电子式剂量计（EPD），在作业过程进行连续监测"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：按核电辐射工作通行做法，停工待检点（H点）必须停止工作、等待辐射防护人员检查确认后方可继续；见证点（W点）同样应通知辐射防护人员到场见证，工作负责人不能自行检查而不通知，C说法错误；A、B、D均为高辐射风险工作的常规控制要求，故答案为C。"},{"id":"safety_fsjx_0038","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下具有空气污染防护功能的是（ ）。","options":["气面罩","纸衣","细纱手套","铅衣"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：空气污染的个人防护用品包括口罩、半面罩、全面罩、气衣、气面罩、自给式呼吸器等，气面罩用于存在空气污染的环境、防止吸入放射性物质；纸衣防表面污染、细纱手套为基本防护用品、铅衣用于外照射屏蔽，故答案为A。"},{"id":"safety_fsjx_0039","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下一定属于放射性废物的是（ ）。","options":["没被污染的工作服","工作组用过的纸衣","使用过的可移动γ屏蔽墙","未使用过的破损的防护服"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：使用过的纸衣存在污染风险，脱除后应放入红色废物收集袋按放射性废物处理；课件同时规定把未使用的防护用品作为放射性废物处理属黄线违章，故未污染工作服、未用过的破损防护服及可复用的γ屏蔽墙都不一定属于放射性废物，答案为B。"},{"id":"safety_fsjx_0040","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"卫生出入口污染监测设备不包括：（ ）。","options":["C1门","C2门","X光透视安检机","小件物品污染检测仪"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：退出辐射控制区的污染监测使用工作服污染监测门（C1门）、人员体表污染监测门（C2门）和小件物品测量仪（CPO）；X光透视安检机不属于卫生出入口污染监测设备，故答案为C。"},{"id":"safety_fsjx_0041","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于降低外照射集体剂量的防护措施，以下描述正确的是（ ）。","options":["减少工作时间、增加工作人数","多人同时参与工作、穿戴新型辐射防护用品、降低源强","减少工作时间、增加与放射源距离、降低源强、搭设屏蔽","降低巡检和检修频度、降低完工验收标准"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：外照射集体防护从时间防护、距离防护、源项控制、屏蔽防护四方面考虑；减少工作时间、增加与放射源距离、降低源强、搭设屏蔽正对应这四种方法，故答案为C。增加人数会增大集体剂量，降低巡检频度和验收标准均不可取。"},{"id":"safety_fsjx_0042","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在人类的生活环境中，在（ ）会受到放射性照射。","options":["仅在从事放射性工作时","任何地方和任何时刻都","仅在接收放射性治疗时","仅在接触放射性物质时"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：天然放射性是自然界本身存在的，包括宇宙射线、地壳及人体中的放射性物质等，天然放射性对人均剂量的贡献（本底）是无法避免的，故人们在任何地方和任何时刻都会受到放射性照射，答案为B。"},{"id":"safety_fsjx_0043","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下工作人员在辐射控制区内的行为，正确的是（ ）。","options":["使用连体服袖口擦汗","未将个人头发全部包在纸帽内","未脱除手套在控制区内打电话","发现佩戴的EPD突然报警，立即将手头工作置于安全状态撤离当前工作区域"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：工作中EPD发生报警，应立即置手头工作于安全状态、撤离可能受影响的区域并通知辐射防护人员，D是正确行为；用连体服袖口擦汗易致面部沾污、头发未包入纸帽属防护穿戴不完整、戴手套打电话有污染扩散风险，均不正确，故答案为D。"},{"id":"safety_fsjx_0044","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下工作人员在辐射控制区内的行为，错误的是（ ）。","options":["辐射控制区内不能饮水","在卫生出入口发现忘记带热释光剂量计（TLD），回去拿","在进入辐射控制区前，可以根据自己的意愿选择是否穿戴辐射控制区专用的衬衣、衬裤、袜子","在辐射控制区内如果脸部发痒，不能用自己戴的细纱手套擦"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：对未实施「清洁电站模式」的核电厂或区域，进入辐射控制区必须换上专用基本防护用品，这是强制要求，不能凭个人意愿选择是否穿戴，C行为错误；不在控制区饮水、忘带TLD回去补取、脸部发痒不用手套擦拭均为合规要求，故答案为C。"},{"id":"safety_fsjx_0045","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"单位换算：1mSv=（ ）μSv。","options":["0.1μSv","10μSv","100μSv","1000μSv"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射剂量单位换算为1Sv=1000mSv、1mSv=1000μSv，核电厂常用单位为mSv和μSv，故答案为D。"},{"id":"safety_fsjx_0046","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于卫生出入口的功能的是（ ）。","options":["污染监测","辐射防护用品的分发","便携式仪表的借用及回收","全身计数测量（WBC）"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：卫生出入口的功能包括剂量计的分发及回收、便携式仪表的借用及回收、辐射防护用品的分发、污染监测、同辐射防护人员进行工作沟通；全身计数测量（WBC）是内照射活体测量手段，不属于卫生出入口功能，故答案为D。"},{"id":"safety_fsjx_0047","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"离开松散污染控制区时，应先脱去（ ），再脱去（ ）。（ ）。","options":["橡胶手套；纸衣","纸衣；橡胶手套","橡胶手套；安全帽","安全帽；橡胶手套"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：离开污染隔离区时，先脱去橡胶手套丢入废物收集桶，再脱去纸衣轻轻放入收集桶，最后脱除塑料鞋套，故先脱橡胶手套、再脱纸衣，答案为A。"},{"id":"safety_fsjx_0048","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"工作人员在环境剂量率30μSv/h的环境中工作2小时，他所受的剂量大约为（ ）。","options":["60mSv","0.6mSv","60μSv","60Sv"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：外照射剂量估算=剂量率×在辐射场停留的时间，故所受剂量约为30μSv/h×2h=60μSv，答案为C。"},{"id":"safety_fsjx_0049","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"不同年龄段群体中，对辐射最敏感的是（ ）。","options":["婴幼儿","中小学生","成年人","老年人"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：具有最高分裂频度、分裂能力保持时间最长、最未分化的细胞对辐射最敏感；不同年龄段群体中，对辐射最敏感的是婴幼儿（课件练习题答案亦为婴幼儿），故答案为A。"},{"id":"safety_fsjx_0050","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于辐射的说法，错误的是（ ）。","options":["手机信号、电脑对我们产生的辐射属于非电离辐射","只有核电站中才存在电离辐射","电离辐射是辐射防护关注的重点","地壳中存在一些天然放射性的物质"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：电离辐射并非只有核电站才存在，天然放射性（宇宙射线、地壳中的放射性物质等）和人工放射性（医疗照射、核技术应用等）广泛存在于生活中；手机信号属非电离辐射，电离辐射是辐射防护的重点，B说法错误，故答案为B。"},{"id":"safety_fsjx_0051","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"对于理想点源，在某点处辐射场强度与该点距离放射源距离的平方成反比。假设距某理想点放射源距离为1米处剂量率为1mSv/h，则距离为2米处的剂量率为（ ）mSv/h。","options":["0.25mSv/h","0.5mSv/h","0.75mSv/h","1mSv/h"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：某位置的辐射水平同与辐射源距离的平方成反比，距离由1米增至2米（2倍），剂量率降为原来的1/4，即1mSv/h×1/4=0.25mSv/h，故答案为A。"},{"id":"safety_fsjx_0052","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列射线类型中，穿透能力最差的是（ ）。","options":["α辐射","β辐射","中子辐射","γ辐射"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：α辐射穿透能力最差，在空气中仅能传播2～3厘米，纸张、薄衣服、皮肤即可屏蔽；β射线可在空气中传播几百厘米，γ射线和中子射线穿透能力非常强，故答案为A。"},{"id":"safety_fsjx_0053","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于细纱手套的使用，以下说法正确的是（ ）。","options":["在辐射控制区内打电话时可以不用脱掉手套","在污染隔离区内不可以脱掉细纱手套签字、记录","如果不在松散污染隔离区，脸痒可以用戴着细纱手套的手擦一下","在辐射控制区内做精细操作时可以脱下细沙手套"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：在污染场所脱细纱手套接触设备属不规范行为，在污染隔离区内不得触摸面部等以防沾污，因此在污染隔离区内不应脱掉细纱手套签字、记录，B正确；戴手套打电话、戴手套擦脸、做精细操作时脱手套均有沾污风险，故答案为B。"},{"id":"safety_fsjx_0054","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于辐射防护用品的说法，以下说法错误的是（ ）。","options":["防护用品可以分为基本防护用品和特殊防护用品","特殊防护用品在基本防护用品的基础上加穿，不能单独穿着","连体服可以防护外照射","在松散污染环境需要穿戴的特殊防护用品有纸衣、橡胶手套、塑料鞋套"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：纸衣等污染防护用品仅用于防护表面污染、不防护外照射；连体服同属防表面污染的基本防护用品，不具有外照射防护功能，能降低外照射剂量的是屏蔽服（铅衣等），C说法错误，故答案为C。"},{"id":"safety_fsjx_0055","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"如果你在安全壳厂房，遇到以下哪种情况，不需要置手头工作于安全状态后撤离，联系辐射防护人员？（ ）","options":["你所在的区域辐射监测仪报警","安全壳撤离信号报警","随身佩戴的电子式剂量计（EPD）发生报警","工作中发现辐射防护人员向你走来"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：区域辐射监测仪、便携式仪表或EPD读数显著增加或报警时，说明辐射环境可能发生变化，应立即撤离并联系辐射防护人员（安全壳撤离信号报警同属须撤离的报警信号）；辐射防护人员向你走来是正常工作接触，无需撤离，故答案为D。"},{"id":"safety_fsjx_0056","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂对某些管道、设备采取氧化、冲洗等措施目的是达成以下哪种防护（ ）。","options":["距离防护","源强防护","屏蔽防护","时间防护"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：源项控制（源强防护）指通过降低辐射源强度来降低人员受照剂量，核电厂常用方法是对某些管道、设备采取氧化、冲洗等措施，以及对严重污染设备采取去污操作，故答案为B。"},{"id":"safety_fsjx_0057","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂辐射控制区通常依据不同区域内（ ）进行子区划分。","options":["坠落风险高低","辐射水平高低（剂量率）","设备的重要程度","辐射热点的数量多少"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：中国核电运行机组辐射分区划分标准以剂量率（mSv/h）为依据，辐射控制区按剂量率水平高低划分绿区、蓝区、黄区、橙区、红区等子区，故答案为B。"},{"id":"safety_fsjx_0058","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射防护四原则中，下列哪一项是仅针对工作人员的要求（ )。","options":["正当性原则","个人剂量限制","最优化原则","自我防护原则"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：自我防护原则明确辐射防护是每一个辐射工作人员自觉履行的职责，要求工作人员遵守防护程序、运用防护知识和技能，是仅针对工作人员的要求；正当性、最优化、个人剂量限制是对辐射实践本身的约束和方法，故答案为D。"},{"id":"safety_fsjx_0059","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂辐射风险不包括（ ）。","options":["天然本底辐射","放射性空气污染","外照射","放射性表面污染"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：核电厂常见辐射风险分为外照射风险、内照射风险（含放射性空气污染）和表面污染风险；天然本底辐射是无处不在的天然照射，不属于核电厂的辐射风险（剂量限值也不适用于天然本底照射），故答案为A。"},{"id":"safety_fsjx_0060","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列哪些情况下，不会引起工作现场辐射情况的变化（ ）。","options":["反应堆功率改变","非工作计划下冒险打开一回路上某机械阀门","忽然发现前方某一本该关闭的一回路上的阀门漏水","工作现场照明灯突然熄灭"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：反应堆功率改变会改变裂变中子等源项强度；一回路阀门被擅自打开或发生泄漏会带来放射性介质外泄、表面污染和空气污染，均可能引起现场辐射情况变化（课件要求对辐射环境改变保持警觉）；照明灯熄灭只影响照明，不改变辐射水平，故答案为D。"},{"id":"safety_fsjx_0061","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于中国核电辐射防护管理'红线违章'行为的是：（ ）。","options":["冒用他人辐射工作授权信息进入辐射控制区。","随意穿越射线探伤区域。","在卫生出入口借用便携式剂量计。","未按要求采取防护措施，擅自进入存在空气污染风险的场所。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射防护红线违章包括冒用他人辐射工作授权信息进入控制区、擅自进入红区/橙区及射线探伤隔离区域、未按要求采取防护措施擅自进入存在空气污染风险的场所等；在卫生出入口借用便携式剂量计是卫生出入口的正常功能，不是违章，故答案为C。"},{"id":"safety_fsjx_0062","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射控制区内划分的子区按照剂量率从高到低排序正确的是（ ）。","options":["绿区、橙区、红区","橙区、绿区、红区","橙区、红区、绿区","红区、橙区、黄区"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射控制区子区按剂量率划分，红区剂量率最高（＞100mSv/h），橙区次之（＞1～100mSv/h），黄区再次（＞0.025～1mSv/h），绿区最低；按剂量率从高到低排序为红区、橙区、黄区，故答案为D。"},{"id":"safety_fsjx_0063","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"对于需要进入辐射控制区工作的人员，以下哪种行为是错误的？（ ）","options":["小张估计管道保温作业需要铆钉30枚左右，于是带上一盒200枚的铆钉进入工作现场以备不时之需；","小李将新领用的扭力扳手的包装去掉后，再带入辐射控制区工作；","工作结束后，负责人要求工作组成员将现场未使用完的物料带走，并打扫场地；","工前会对工作方案和步骤进行详细讨论，仅携带必要的工具进入现场；"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：应尽量减少带入辐射控制区的物品数量，不必要的工器具、耗材不带入，且尽可能去掉外包装以减小放射性废物产生量；仅估需30枚铆钉却带入200枚违反该要求，其余三项均为合规做法，故答案为A。"},{"id":"safety_fsjx_0064","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"核电厂中辐射的源项有（ ）。","options":["裂变中子、裂变产物、辐射探伤","裂变中子、裂变产物、腐蚀活化产物","一回路冷却剂、裂变产物、核燃料","压力容器、蒸汽发生器、主冷却剂泵"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：核电厂中辐射的来源包括裂变中子、裂变产物、腐蚀活化产物以及放射源/射线装置，其中腐蚀活化产物是造成核电厂外照射剂量的主要来源，故答案为B。"},{"id":"safety_fsjx_0065","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"某电站大修期间，一名阀门检修人员李某跟随工作组参与放射性阀门A开口作业，该放射性阀门所在房间场所剂量率约为0.1mSv/h，工作完成后，李某跨出松散污染控制区后依次脱去纸衣、塑料鞋套、橡胶手套等特殊防护用品，并放入指定的废物收集桶内，见时间还早，就在该房间内席地而坐，休息了半小时左右，然后前往卫生出入口，通过污染监测、更换个人衣物及证件后离开控制区。以下说法错误的是（ ）。","options":["李某不应该离开松散污染控制区再脱除附加防护用品","防护用品正确的脱除顺序应该是纸衣、橡胶手套、塑料鞋套","该房间属于黄区","李某不应席地而坐应该去低剂量等待区休息待命"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：附加防护用品应在污染隔离区内脱除，且正确脱除顺序为先脱橡胶手套、再脱纸衣、最后脱鞋套，B说法错误；0.1mSv/h的房间属黄区，人员应到低剂量等待区休息而非席地而坐，A、C、D说法均正确，故答案为B。"},{"id":"safety_fsjx_0066","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不是松散污染环境中常用的防护用品是：（ ）。","options":["纸衣","橡胶手套","耳塞","塑料鞋套"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：进入表面污染隔离区穿戴的附加防护用品有纸衣、橡胶手套、塑料鞋套等，用于防护松散污染；耳塞是听力防护用品，不属于松散污染环境常用的防护用品，故答案为C。"},{"id":"safety_fsjx_0067","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射工作负责人的职责不包括：（ ）。","options":["协助工单准备人及辐射防护人员办理辐射工作许可证及高辐射区域进入许可","确保工作组成员无犯罪记录","确保工作组成员按照辐射工作控制文件的要求执行工作","到停工待检点时，通知辐射防护人员执行现场监督检查"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射工作须办理辐射工作许可证，工作组成员应按控制文件要求执行工作，在辐射安全检查点（停工待检点）应通知辐射防护人员检查确认（未通知属黄线违章），这些都属工作负责人职责范畴；核查成员有无犯罪记录与辐射防护管理无关，故答案为B。"},{"id":"safety_fsjx_0068","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射控制区的哪个子区剂量率最高（ ）。","options":["红区","黄区","橙区","绿区"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射控制区子区按剂量率水平划分，红区剂量率最高（＞100mSv/h），为禁止进入区；橙区为限制进入区，黄区、绿区剂量率依次更低，故答案为A。"},{"id":"safety_fsjx_0069","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"辐射控制区休息时，以下行为正确的是（ ）。","options":["寻找低剂量等待区标牌，该区域场所剂量率较低且没有放射性污染的位置，工作人员工作过程中可以在此待命或休息","太热，可以脱掉部分辐射防护用品","拿辐射防护物资作为垫板坐地上","随地坐卧"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：低剂量等待区设在现场辐射水平非常低的区域，用于工作人员暂无任务时待命或休息，避免在现场接受不必要的照射；控制区内休息应寻找低剂量等待区，擅自脱防护用品、用防护物资当垫板、随地坐卧均不规范，故答案为A。"},{"id":"safety_fsjx_0070","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于中国核电辐射防护管理'黄线违章'行为的是：（ ）。","options":["未经辐射防护人员许可和现场监护，擅自打开辐射控制区边界。","在辐射控制区检修现场脱下气面罩'透透气'。","EPD报警了，抓紧时间把工作一次性干完。","检修过程中纸衣不慎破损，立即暂停工作，联系辐射防护人员。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：擅自打开辐射控制区边界、在控制区脱下气面罩等擅自降低防护级别的行为、EPD报警后未及时撤离继续作业，均属黄线违章；纸衣破损立即暂停工作并联系辐射防护人员是正确处置，不属于违章，故答案为D。"},{"id":"safety_fsjx_0071","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下具有外照射防护功能的是（ ）。","options":["连体服","纸衣","气衣","铅衣"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：屏蔽服（铅衣/钨衣）用于外照射剂量率较高的工作环境，用于降低人员受到的外照射剂量，具有外照射防护功能；连体服、纸衣防表面污染，气衣防空气污染，均无外照射防护功能，故答案为D。"},{"id":"safety_fsjx_0072","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于辐射防护原则的描述，正确的是：（ ）。","options":["正当性原则、最优化原则、个人剂量限制、自我防护原则","正当性原则、剂量最小化、辐射防护最优化、个人防护优先","实践的正当性、剂量分摊原则、辐射防护最小化、自我防护原则","实践的正当性、剂量最优化原则、时间防护、距离防护"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性）》：辐射防护四原则为正当性原则、最优化原则、个人剂量限制、自我防护原则，课件练习题答案即为此表述。选项B、C、D中的“剂量最小化”“剂量分摊”“时间防护、距离防护”等均不属于四原则的表述（时间、距离防护属于最优化ALARA的具体方法）。故答案为A。"},{"id":"safety_fsjx_0073","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"哪种情况不会引起放射性进入人体（ ）。","options":["在辐射控制区内进食","在有松散表面污染的工作现场摘下防护面罩","从辐射热点前快速通过","处理放射性液体时不戴手套"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性）》：放射性物质进入人体的途径为食入、吸入、皮肤渗入和从裸露伤口进入，内照射防护的关键在于切断这些途径。控制区内进食可造成食入；松散污染现场摘面罩可造成吸入；处理放射性液体不戴手套可经皮肤或伤口进入。从辐射热点前快速通过只受到外照射（离开辐射场即不再受照），放射性物质不会进入人体。故答案为C。"},{"id":"safety_fsjx_0074","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"能正常使用的脚手架上应该挂有什么颜色的标识牌？（ ）","options":["红色","黄色","蓝色","绿色"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》《保护区准入工业安全》：脚手架标识牌分为红牌、绿牌和“从此上下”标牌；脚手架搭拆期间或临时中断搭设挂红牌表示禁止使用，验收合格后挂绿牌。故能正常使用的脚手架应挂绿色标识牌，答案为D。"},{"id":"safety_fsjx_0075","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下列关于高处作业的规定，错误的是（ ）。","options":["高处作业应使用检修平台、脚手架、梯子、升降平台等作为作业平台","必须由不少于2人共同进行，1人为监护人","高处作业隔离区应设置明显的警告标志","攀爬直梯、脚手架时应面向梯子并且四肢应始终保持与梯子有至少两点接触"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬时应面向爬梯并始终保持与爬梯三点接触（双手和双脚四点中的三点），选项D说“至少两点接触”错误。其余各项符合课件要求：高处作业应使用检修平台、脚手架、梯子、升降平台等作业平台；不得单独作业，必须由不少于2人共同进行并指定监护人；高处作业隔离区应设置明显警告标志。故答案为D。"},{"id":"safety_fsjx_0076","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下说法正确的是（ ）。","options":["使用吊篮前，应确认吊篮的门是向外开的","使用吊篮时，安全带可以挂在吊篮上","使用软梯时，软梯可以用铁丝固定","软梯使用时，同时间只能有一个工作人员上下"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：对于临时吊篮需特别确认吊篮的门是向内开的（A错）；使用吊篮时安全带应挂在吊钩上，禁止挂在吊篮或栓吊篮的钢丝绳上（B错）；软梯上端应用卸扣或穿钢管固定，严禁用铁丝固定（C错）；在软梯上只准同时一个人工作或上下（D正确）。故答案为D。"},{"id":"safety_fsjx_0077","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下对于高处作业挂点的选择，错误的是（ ）。","options":["生命线","固定锚点","电缆线","钢结构的支架"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：挂点应选择牢靠、能承受坠落冲击力的物件，如生命线、固定锚点、钢结构支架等；不应选择不牢固的物件、可移动的物体、受力会滑脱的部件。电缆线非承重结构，不能承受坠落冲击力，不可作为挂点。故答案为C。"},{"id":"safety_fsjx_0078","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"高处作业必须由不少于（ ）人共同进行。","options":["1人","2人","3人","4人"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：任何人不得单独进行高处作业，必须由不少于2人共同进行，现场必须指定人员履行监护职责。故答案为B。"},{"id":"safety_fsjx_0079","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于高处坠落的原因的是？（ ）","options":["人的不安全行为","物的不安全状态","管理漏洞","完善的管理制度"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处坠落事故发生的根本原因包括人的不安全行为、物的不安全状态和管理漏洞三类。完善的管理制度是预防高处坠落的保障措施，而不是导致坠落的原因。故答案为D。"},{"id":"safety_fsjx_0080","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在攀爬脚手架的过程中，以下行为错误的是（ ）。","options":["攀爬过程中不得手中持物","攀爬过程中，背包应斜跨","攀爬过程中用手腕或前臂勾住爬梯横档也可以形成有效的第三点接触","攀爬过程中要注意路径上的障碍物"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬脚手架应面向爬梯并始终保持三点接触（双手和双脚四点中的三点），要求用手握牢横档；用手腕或前臂勾住横档不能形成可靠的第三点接触，属错误行为。选项中不得手中持物、工具包应斜跨、注意攀爬路径障碍物均符合课件要求。故答案为C。"},{"id":"safety_fsjx_0081","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"在脚手架上工作时，以下说法错误的是（ ）。","options":["临边堆放物料时，应有防止物料掉落的防护措施","可以在下方无人时，向下抛掷轻、小的材料","工作使用扳手，应该使用防坠落绳","不能踩在脚手架钢管上工作"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：禁止将工具及材料上下抛掷，必须用绳系牢后传递，因此即使下方无人也不得向下抛掷材料，B说法错误。临边堆放物料应采取防坠落措施、手持轻小工具应使用防坠落绳、严禁踩在脚手架钢管上工作，均与课件规定一致。故答案为B。"},{"id":"safety_fsjx_0082","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"关于梯子的使用，以下不正确的是（ ）。","options":["作业人员使用梯子时，应一人作业一人扶持，禁止两人同时上下梯子","使用梯子进入高处平面（屋顶或平台）时，梯子应延伸到超出平面上方1米","可以站立在梯子顶部和高于梯子标明的最高站立平面以上的踏板上","使用软梯时应与速差器配套使用"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：不应站立在梯子顶部和高于梯子标明的最高站立平面以上的踏板上，C说法错误。其余各项符合课件规定：使用梯子应一人作业一人扶持、禁止两人同时上下；使用梯子进入高处平面时梯子应延伸到超出平面上方1米；软梯上只准同时一人工作或上下且必须使用速差器。故答案为C。"},{"id":"safety_fsjx_0083","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"根据《电业安全工作规程》，在没有脚手架或者在没有栏杆的脚手架上工作，高度超过（ ）米时，必须使用安全带，或采取其他可靠的安全措施。","options":["1米","1.5米","2米","2.5米"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：《电业安全工作规程》（GB26164.1-2010）规定，在没有脚手架或没有栏杆的脚手架上工作时，高度超过1.5米，必须使用安全带或采取其他可靠的安全措施。故答案为B。"},{"id":"safety_fsjx_0084","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"不属于高处作业的风险是：（ ）。","options":["人员从高处坠落","物体坠落，造成人员伤亡","人员缺氧窒息","物体坠落，造成设备损坏"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处作业的风险包括人员从高处坠落造成人员伤亡，以及物体坠落造成人员伤亡或设备损坏。人员缺氧窒息是有限空间作业的典型风险，不属于高处作业风险。故答案为C。"},{"id":"safety_fsjx_0085","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"脚手架标识牌的红色标识牌是表示（ ）。","options":["禁止使用","根据提示使用","可以正常使用"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》《保护区准入工业安全》：脚手架标识牌分为红牌、绿牌和“从此上下”标牌；严禁使用挂红牌的脚手架，即红色标识牌表示脚手架禁止使用，验收合格后才挂绿牌允许使用。故答案为A。"},{"id":"safety_fsjx_0086","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"挂点能承受坠落冲击力，应选择（ ）。","options":["不牢固的物件","可移动的物体","牢靠的物件","受力会滑脱的部件"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：挂点应选择能承受坠落冲击力的牢靠物件；不应选择不牢固的物件（非承重结构）、可移动的物体和受力会滑脱的部件。故答案为C。"},{"id":"safety_fsjx_0087","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下面哪项不是可能导致高坠事故的发生的因素？（ ）。","options":["未佩戴（或未正确佩戴）安全带","使用不可靠立足点","使用有缺陷的登高平台","有效开展了安全交底"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：导致高坠的因素包括人的不安全行为（如未佩戴或未正确佩戴安全带、使用不可靠立足点、使用有缺陷的登高平台）、物的不安全状态和管理漏洞。有效开展安全交底是预防事故的管理措施，不是导致高坠的因素。故答案为D。"},{"id":"safety_fsjx_0088","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下对于梯子的使用方法描述，错误的是（ ）。","options":["一人作业一人扶持","禁止两人同时上下梯子","人字梯可以将两腿合并在一起作为单梯使用","不应站立高于梯子规定或标明的踏板或踏棍上"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：折梯（人字梯）不应作为单梯（直梯）使用或在合拢状态使用，故“将两腿合并作为单梯使用”错误。一人作业一人扶持、禁止两人同时上下梯子、不应站立高于梯子规定或标明的踏板或踏棍上，均为课件规定。故答案为C。"},{"id":"safety_fsjx_0089","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"进行攀登作业时，不可选用的防坠落用品是（ ）。","options":["安全带","速差器","自锁器","水平生命线"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带、速差器、自锁器均可用于攀登作业的防坠落保护；水平生命线是为高空水平移动和水平定点作业提供连续坠落防护的系统，不适用于攀登作业。故答案为D。"},{"id":"safety_fsjx_0090","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"高处传递工具材料操作错误的是（ ）。","options":["应优先考虑使用安全绳传递工具包","当不具备条件必须背包攀爬时，工具包应背在背后攀爬","可以随意摆放","禁止攀爬时腋下夹物"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处传递工具材料应优先考虑使用安全绳传递工具包；当必须背包攀爬时，工具包应斜跨在背后；攀爬过程中不得手中持物或腋下夹物。“可以随意摆放”明显违反规定，属错误操作。故答案为C。"},{"id":"safety_fsjx_0091","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"《高处作业分级》将距坠落高度基准面（ ）米以上有可能坠落的高处进行的作业，都称为高处作业。","options":["1米","2米或2米以上","3米","4米"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：《高处作业分级》（GBT3608-202X）规定，凡在距坠落高度基准面2米或2米以上有可能坠落的高处进行的作业，都称为高处作业。故答案为B。"},{"id":"safety_fsjx_0092","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"下属高处作业安全管理要求，错误的有（ ）。","options":["对存在高空不可达、不易达等情况的设备作业，应组织现场评估并将安全措施落实在工单风险分析和预控措施中","吊顶上作业、设备上作业（超过2 米）、临时栅格板上作业等高处作业，必须搭建脚手架并使用安全带","开展高处作业时可以在无人监护情况下进行作业","对强度不足的作业面（如铁皮板、采光浪板、装饰板、吊顶等），人员在作业时，必须采取加强措施，以防踏空坠落"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：任何人不得单独进行高处作业，必须由不少于2人共同进行，现场必须指定人员履行监护职责，因此“可以在无人监护情况下进行作业”错误。其余各项均为高处作业应落实的安全管理要求。故答案为C。"},{"id":"safety_fsjx_0093","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"锚点又称为挂点，可承受坠落时产生的冲击力。下列关于挂点的说法错误的是（ ）。","options":["挂点能承受坠落冲击力，例如钢结构/支架、钢筋混凝土梁/柱、生命线、固定锚点","使用人员吊篮时，必须将安全带或速差器挂在起重机吊钩上","挂点垂直下方有足够的坠落净空，确保人员坠落后不接触地面与任何物体","挂点应尽量远离作业位置，以避免坠落发生时产生钟摆效应"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：挂点须尽量靠近作业位置，以避免钟摆效应，选项D“尽量远离作业位置”错误。挂点应能承受坠落冲击力（如钢结构/支架、生命线、固定锚点）、使用人员吊篮时安全带或速差器挂在吊钩上、挂点垂直下方有足够坠落净空，均符合课件要求。故答案为D。"},{"id":"safety_fsjx_0094","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于在安全带使用前检查内容的是（ ）。","options":["安全带生产厂商","织带缝合牢靠","在有效期内","搭扣工作良好"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带在每次使用前应进行检查，并定期送检，检查重点是织带缝合是否牢靠、搭扣是否工作良好、是否在检验有效期内等与安全状态相关的内容。安全带生产厂商与安全带当前安全状况无关，不属于使用前检查内容。故答案为A。"},{"id":"safety_fsjx_0095","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下哪项不满足速差器检查要求（ ）。","options":["在检验合格有效期内","冲坠指示器显示红色","钢丝绳完好，制动功能良好","外壳完好，无破损"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：速差器使用前应检查其完好性和制动功能，确保在检验合格有效期内；防坠落用品触发保护动作（如速差器动作）时应立即移除。冲坠指示器显示红色说明速差器已承受过冲坠冲击，不得继续使用，不满足检查要求。故答案为B。"},{"id":"safety_fsjx_0096","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下哪一项不属于起重作业特有风险：( )。","options":["吊物未绑扎牢；","起重指挥视线受阻；","吊物上放有可活动物体；","工作人员连续工作时间超过2小时。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重吊装作业的主要风险包括超负荷吊装、指挥信号不明确、吊埋在地下的物件、视线不明作业、吊物上站人或放有活动物体、吊装支脚不牢靠、吊物过人头顶或捆绑不牢等。工作人员连续工作超过2小时属疲劳管理问题，不属于起重作业特有风险。故答案为D。"},{"id":"safety_fsjx_0097","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下哪一项不属于起重作业风险：( )。","options":["吊物下站人；","起重过程中指挥全程不说话；","作业时气温低于零度；","台风天吊装设备。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊物下站人、起重过程中指挥全程不说话（相当于指挥信号不明确，会造成误操作）、台风天吊装（“十不吊”规定六级以上大风等恶劣天气不吊）均属起重作业风险；气温低于零度不是课件列举的起重作业风险因素。故答案为C。"},{"id":"safety_fsjx_0098","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于有眼螺栓使用说法错误的是：( )。","options":["无肩有眼螺栓增加垫片后可以当成有肩有眼螺栓进行使用；","如果有肩有眼螺栓没有100%接触到载荷表面，那它应当被当成是无肩的；","有肩的有眼螺栓不用于受力方向和肩所在平面夹角＜45°的角度；","使用有肩有眼螺栓时，提拉的角度应该沿着有眼螺栓平面。"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：无肩有眼螺栓只用于垂直起重，在有角度拉动时会弯曲或折断；垫片用于使未100%接触载荷表面的有肩螺栓达到完全接触，并不能把无肩螺栓当作有肩螺栓用于角向吊装，A说法错误。B、C、D均为课件原文规定。故答案为A。"},{"id":"safety_fsjx_0099","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于起重作业计划必须包含的内容是：( )。","options":["起重作业的监督人数；","吊装总重量；","起重设备能力；","起重过程中的风险和风险解决措施；"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊装作业计划应包括吊装总重量、负荷的重心、起重设备能力、所需索具清单、吊装路径草图和负荷下放区域、潜在干扰的查找与解决等内容。起重作业的监督人数不属于作业计划必须包含的内容。故答案为A。"},{"id":"safety_fsjx_0100","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于起重吊装作业工前会的说法错误的是：( )。","options":["所有起重吊装工前会上都要确保所有参与人员都取得了起重作业特种作业证书；","工前会上要明确司机和指挥的交流方法；","工前会上要讨论起重作业风险和解决方案；","工前会上要讨论以往的经验反馈；"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重指挥、起重司机属于特种设备作业人员，须取得特种设备作业人员证；非特种作业人员经公司专业培训并考核通过后也可进行起重吊装作业，并非所有参与人员都要取得特种作业证书，A说法错误。明确交流方法、讨论风险和解决方案、讨论经验反馈均为工前会内容。故答案为A。"},{"id":"safety_fsjx_0101","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于吊带和吊钩使用说法错误的是：( )。","options":["两根吊带作业时，应将两根吊带直接挂入双钩内，吊带各挂在双钩对称受力中心位置；","四根吊带使用时，每两根吊带直接挂入双钩内，注意钩内吊带不能产生重叠和相互挤压；","吊带使用时，仅在吊钩上可以打结，其它地方都不能打结；","吊钩的选择应考虑配合使用的吊带的宽度。"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊带使用时不允许将吊带在吊钩上打结，吊装作业中吊带不允许交叉、扭转、打结、打拧，故C“仅在吊钩上可以打结”错误。两根吊带挂入双钩对称受力中心、四根吊带每两根挂入双钩且不重叠挤压、吊钩选择应考虑吊带宽度，均与课件一致。故答案为C。"},{"id":"safety_fsjx_0102","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于吊带使用说法错误的是：( )。","options":["吊带在使用时，可以进行交叉；","当吊装物有锋利的边时，可用一保护衬(护套、护角)置于吊带和被吊物之间；","吊带安装在吊钩上时，吊带两边张开角度不能超过120°；","使用吊带吊管类物体时吊装角度不能过大。"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：在吊装作业中，吊带不允许交叉、扭转，不允许打结、打拧，故“可以进行交叉”错误。吊装物有锋利的边时加保护衬（护套、护角）、吊带挂在吊钩上张开角度不超过120°、吊管类物体时吊装角度不能过大，均为课件要求。故答案为A。"},{"id":"safety_fsjx_0103","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于起重设备的检查的说法错误的是：( )。","options":["属于特种设备的起重设备应进行定期检验；","普通的手拉葫芦不需要定期检验，使用前进行外观检查即可；","吊带定期检验完应在明显的地方进行标识；","所有起重用的吊具和索具在使用前均应进行外观完好性检查；"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重机、手拉葫芦、吊带、吊链等应进行定期检验，使用前需检查确保在检验/检定/检查有效期内，故“手拉葫芦不需要定期检验”说法错误。特种设备定期检验、吊带检验后明显标识、吊具索具使用前外观检查均符合要求。故答案为B。"},{"id":"safety_fsjx_0104","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下关于起重吊装作业区域管理要求的说法错误的是：( )。","options":["起重作业前应建立合理的隔离区域，并进行明显的隔断；","吊装区域应合理规划并提前进行清理；","吊装路径上可以停放私人轿车；","吊装区域应有人负责边界管控；"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重作业前应建立合理的隔离区域并进行明显隔断，安排专人负责边界管控；吊装区域应合理规划并提前清理，确保吊物下方没有人员和影响吊装安全的物品。吊装路径上停放私人轿车明显违反区域管理要求。故答案为C。"},{"id":"safety_fsjx_0105","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于起重吊装作业的是：( )。","options":["使用汽车吊移动集装箱；","使用手拉葫芦移动电机；","龙门吊车吊装试运转；","使用推车移动设备。"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重吊装作业指使用专门的起重设备吊运载荷的活动，包括载荷的起吊、上升、空中移动、下降、落位等动作。使用推车移动设备不使用起重设备，不属于起重吊装作业。故答案为D。"},{"id":"safety_fsjx_0106","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下说法正确的是：( )。","options":["U型卸扣在使用时，如有两根吊索，两边吊索的夹角应不得超过120°；","U型卸扣在与钢丝绳或吊带配合使用时，横销可以与其活动部分连接；","如果在一个吊物上使用两个吊索，要确保两个吊索眼是在负荷的相同的方向；","吊带的颜色仅用于区分吊带的种类，无法用于判断其载荷能力。"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：U型卸扣设计用于垂直方向的提升，两支腿之间的夹角最大不得超过120°，A正确。B错误：卸扣横销应与吊索锁眼连接，连接活动部分横销可能转动脱出；C错误：两个吊索眼应在负荷相反的两侧；D错误：吊带颜色即用于表示其垂直承载能力。故答案为A。"},{"id":"safety_fsjx_0107","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于'十不吊'的是：( )。","options":["指挥信号不明或违章指挥不吊；","超负荷不吊；","工件或吊物捆绑不牢不吊；","安全监督人员不到位不吊；"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：“十不吊”包括指挥信号不明或违章指挥不吊、超负荷不吊、工件或吊物捆绑不牢不吊、吊物上有人或活动部件不吊等十条。“安全监督人员不到位不吊”不在十不吊之列。故答案为D。"},{"id":"safety_fsjx_0108","module":"safety","bank":"辐射防护基础和专项安全培训","type":"single","stem":"以下不属于'十不吊'的是：( )。","options":["吊物上有人或活动部件不吊；","安全装置不齐全或动作不灵敏、失效不吊；","未到开工时间不吊；","工件埋在地下、与地面建筑物或设备有钩挂不吊；"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：“十不吊”包括吊物上有人或活动部件不吊、安全装置不齐全或动作不灵敏失效不吊、工件埋在地下或与地面建筑物设备有钩挂不吊等。“未到开工时间不吊”不属于十不吊内容。故答案为C。"},{"id":"safety_fsjx_0109","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"空气过滤呼吸器的缺点是防护因子较低。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：空气过滤呼吸器的优点是操作简单、移动方便；缺点是防护因子较低、运行时处于负压模式、戴上后感觉较热不舒适且容易形成雾气。“防护因子较低”确为其缺点，故本题正确。"},{"id":"safety_fsjx_0110","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"佩戴呼吸器可以有效限制放射性物质的吸入。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：气载污染物有呼吸吸入、食入、皮肤进入和裸露伤口进入四种进入人体的途径，使用呼吸器的目的正是为了限制放射性气体污染物的吸入。故本题正确。"},{"id":"safety_fsjx_0111","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在进行可能存在放射性气体的辐射工作时，必须穿戴呼吸器。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：在辐射控制区工作人员是否穿戴呼吸器需要进行评价，因为穿戴呼吸器会影响工作效率、延长工作时间，进而可能增加受照剂量，课件所举例子即不推荐穿戴。因此并非“必须”一律穿戴，故本题错误。"},{"id":"safety_fsjx_0112","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"防护因子越高，呼吸器防护有害物质的能力越高。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：防护因子是正常运转的呼吸器在正确安装、正确使用下能达到的防护标准水平，防护因子越高，呼吸器防护有害物质的能力越高。故本题正确。"},{"id":"safety_fsjx_0113","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用呼吸器可能会影响工作人员之间的交流。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：穿戴呼吸器后工作人员之间无法看清对方面孔，也无法使用唇部动作辅助交流，会影响交流；课件建议放慢语速、使用三向式交流确保信息正确传递。故本题正确。"},{"id":"safety_fsjx_0114","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"可供应呼吸空气的呼吸器，因为都是通外部空气，因此防护因子是相同的。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：可供应呼吸空气的呼吸器从可控气源获得呼吸用空气，型式有自给式呼吸器、气面罩、气衣等，每一类呼吸器工作方式不同，并且有不同的防护因子（如自给式呼吸器防护因子可达10000），“防护因子相同”说法错误。故本题错误。"},{"id":"safety_fsjx_0115","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"隐形眼镜是允许在呼吸器内使用的。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：软的眼镜或隐形眼镜可以在呼吸器内使用，但需要通过密封性试验；需注意佩戴隐形眼镜时连续气流可能导致眼睛干燥。故本题正确。"},{"id":"safety_fsjx_0116","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在使用呼吸器期间，如果感觉恶心或者头晕，应立即离开工作区域，并取下呼吸器。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：使用呼吸器时如出现恶心或头晕等问题征兆，或需要取下呼吸器时，应迅速离开该区域。故本题正确。"},{"id":"safety_fsjx_0117","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"如果突然出现呼吸器失效或身体不适，迅速摘下呼吸器，尽快返回到安全区域，并通知电站相关人员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》应急处置要求：如果突然出现呼吸器失效或身体不适，请迅速摘下呼吸器，尽快返回到安全区域，并通知电站相关人员。故本题正确。"},{"id":"safety_fsjx_0118","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"只要空气过滤呼吸器面罩的气密性没问题，那么其上的呼吸器罐/盒就可以一直使用。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：空气过滤呼吸器依靠呼吸器罐/盒内的过滤器或化学吸附剂净化空气，过滤器失效（出现异味等）是使用中的常见问题之一，罐/盒的过滤和吸附能力有限、有使用寿命，并非面罩气密性完好就可以一直使用。故本题错误。"},{"id":"safety_fsjx_0119","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"呼吸器在使用前需要打开呼气阀门外罩进而检查呼气阀门是否安装正确。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：呼吸器检查步骤要求打开呼气阀门外罩，确认呼气阀门安装正确、没有裂缝或细缝，确认隔膜没有卡住，再重新装上外罩并确认正确安装。故本题正确。"},{"id":"safety_fsjx_0120","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"空气过滤呼吸器主要的净化能力来自于面罩上的呼吸器罐/盒。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：空气过滤呼吸器使用呼吸器罐/盒内的活性炭过滤器过滤污染物，或用化学方法去除气体和蒸汽，罐/盒内部带过滤器或化学吸附剂，主要净化能力来自罐/盒。故本题正确。"},{"id":"safety_fsjx_0121","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在辐射控制区进行切割或者打磨活动可能会产生放射性的气载污染。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性）》：带有放射性阀门或设备的切割、研磨是可能产生空气污染的情形；课件《放射性呼吸防护》也指出研磨、焊接和打磨等生产活动会产生气体微粒和烟气，形成气载污染。故本题正确。"},{"id":"safety_fsjx_0122","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"可供应呼吸空气的呼吸器优点是呼吸器戴上或脱下操作简单。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：操作简单是空气过滤呼吸器的优点；气面罩、气衣等可供应呼吸空气的呼吸器存在移动限制、安装时间长、噪声等缺点，气衣还必须在现场服务人员协助下脱除、严禁自行脱除。故本题错误。"},{"id":"safety_fsjx_0123","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用呼吸器不会影响视线和视野。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：使用呼吸器时由于视线的限制，工作时要特别小心工作区域是否有障碍物或坑洞，且镜罩容易结雾影响视线。故“不会影响视线和视野”说法错误。"},{"id":"safety_fsjx_0124","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"气载放射性污染物主要对人体产生伤害的途径是外照射。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：气载放射性微粒和气体如果被吸入体内，放射性辐射将长期存在体内，对肺或其它器官产生内照射剂量；课件《辐射防护(共性）》也指出吸入是放射性物质进入人体、造成内照射的途径。故其主要伤害途径是内照射而非外照射，本题错误。"},{"id":"safety_fsjx_0125","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"若作业人员进入电缆沟、管沟开展作业，电缆沟、管沟的盖板未完全开启，则按照密闭空间作业进行风险控制。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：管沟、管道属非典型有限空间，若进入沟道区域盖板未完全开启（人员进出活动受限，自然通风不良），进入电缆沟、管沟开展作业则按照有限空间（密闭空间）作业进行风险控制。故本题正确。"},{"id":"safety_fsjx_0126","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"对于只有执行调试、维修相关作业时才允许人员进入的密闭空间（如：需打开人孔门），由工作组在密闭空间外设置临时警示标识牌。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：对于只有执行调试、维修相关作业时才允许人员进入的有限空间（系统隔离或打开人孔门），由工作组在有限空间外设置有限空间作业安全风险告知牌（即临时警示标识）予以警示。故本题正确。"},{"id":"safety_fsjx_0127","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"密闭空间作业应当严格遵守'先通风、再检测、后作业'的原则。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有限空间作业应当严格遵守“先通风、再检测、后作业”的原则，进入前先通风、检测合格后方可作业。故本题正确。"},{"id":"safety_fsjx_0128","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在密闭空间入口处建立作业隔离区，设置警示标识，防止未经授权人员与无关人员进入，出入口可以放工器具。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：应在有限空间入口处建立作业隔离区，设置警示标识，防止未经授权人员与无关人员进入，但出入口不准堆积任何物品，“出入口可以放工器具”说法错误。故本题错误。"},{"id":"safety_fsjx_0129","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"为防止密闭空间易燃气体形成有爆炸性的混合物，可用惰性气体（例如氮气或二氧化碳）置换的方式。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：对存在或可能发生有害气体残留物质的有限空间，应采取通风/净化措施消除或控制有害因素，方式包括水蒸气清洁、惰性气体清洗、强制通风。用氮气、二氧化碳等惰性气体置换易燃气体、防止形成爆炸性混合物符合要求。故本题正确。"},{"id":"safety_fsjx_0130","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"监测时气体采样点应有代表性，较大、较深、较复杂的密闭空间，可能存在气体分层现象，应采取上、中、下各部位取样检测，保证气体检测能够涵盖整个密闭空间（如：可采用长杆工具、吊绳等将检测仪表放置于采样点）。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：检测应从入口开始沿人员进入方向进行，竖直方向由上至下，竖直方向检测点不应少于3个，以覆盖整个有限空间；对较大、较深、可能存在气体分层的密闭空间，应上、中、下各部位取样检测。故本题正确。"},{"id":"safety_fsjx_0131","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"若作业人员进入电缆沟、管沟开展作业，电缆沟、管沟的盖板已完全开启，且无窒息、淹溺、中毒等风险且仪表测量气体合格时，作业人员需做好临边防护，待充分自然通风后，可进入开展作业，不按照密闭空间作业进行管理。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：电缆沟、管沟仅在盖板未完全开启、人员进出活动受限、自然通风不良时按有限空间作业管理；盖板已完全开启、无窒息淹溺中毒等风险且气体检测合格时，已不具备有限空间特征，做好临边防护并充分自然通风后即可进入作业，不按有限空间作业管理。故本题正确。"},{"id":"safety_fsjx_0132","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"打开密闭空间上部的入口盖板时，必须做好防止人员、物项坠落的措施（如：预先设置防护围栏、佩戴安全带、使用工器具防坠落绳等），盖板移除后的开口处应立即用临时围栏进行防护，以防止人员跌落。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：打开有限空间上部的入口盖板时，必须做好防止人员、物项坠落的措施；盖板移除后立即用临时围栏防护开口，正是防止人员跌落的具体措施，与课件要求一致。故本题正确。"},{"id":"safety_fsjx_0133","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"密闭空间内的有毒有害物质的来源很多，有可能是原来空间内盛装的气体或液体，也有可能来自作业过程中产生的有毒有害物质（例如焊接与切割），还有可能来自相邻房间/设备产生的有毒有害气体进入该受限空间，因此在作业前的风险辨识阶段要充分考虑到各种来源。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：有毒气体来源包括有限空间内储存的物品（原来盛装的气体或液体、墙壁吸附物质、材料分解变质）、有限空间内的作业（焊接、切割、喷漆等）以及附近区域（相邻房间/设备产生的有毒有害气体进入），作业前风险辨识应充分考虑各种来源。故本题正确。"},{"id":"safety_fsjx_0134","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"当密闭空间内的有毒有害物质浓度大于《有毒有害气体接触限值》的规定值，或氧气含量超出允许范围时，应当采取机械通风措施。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：测毒要求有毒气体浓度低于《有毒有害气体接触限值》的规定值，测氧要求氧含量在19.5%～23.5%之间；超标时应采取通风/净化（含强制通风）等措施消除或控制有害因素。故本题正确。"},{"id":"safety_fsjx_0135","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"强制通风应使用洁净的空气，也可通入氧气。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《有限空间》：强制通风应使用洁净的空气，严禁通入氧气（通氧会形成富氧环境，增大火灾爆炸风险）。故本题错误。"},{"id":"safety_fsjx_0136","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射工作人员的全身剂量包括内照射剂量和外照射剂量的总和。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性）》：剂量限值是针对内、外照射的总剂量，总剂量=外照射剂量+内照射剂量。辐射工作人员的全身剂量即为内照射剂量与外照射剂量之和。故本题正确。"},{"id":"safety_fsjx_0137","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"所有在辐射控制区内进行的辐射工作必须办理《辐射工作许可证》。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性）》：辐射工作许可证（RWP）是核电厂为审核和批准任何需要特殊辐射防护措施的运行、维修、检查、试验等活动的书面文件，在核电厂一般情况下所有辐射工作都需要办理RWP。故本题正确。"},{"id":"safety_fsjx_0138","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"放射性物品存放点内高、低剂量率物品可以混合存放在一起。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：课件《辐射防护(共性）》仅介绍了放射性物品存放点的标识牌，未涉及高低剂量率物品存放要求。按辐射防护最优化（ALARA）的一般要求，高剂量率物品应与低剂量率物品分开存放，混合存放会抬高整个存放区域的剂量率水平、增加人员受照剂量。故本题错误。"},{"id":"safety_fsjx_0139","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"污染隔离区可以随意摸脸、擦汗、扶眼睛等触碰颈部以上暴露部位。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性）》：禁止在污染区内直接摸脸、擦汗等行为，食入防护要求工作时不用手触摸面部、工作结束洗手，且颈部以上污染禁止自行去污。在污染隔离区不可随意触碰颈部以上暴露部位，故本题错误。"},{"id":"safety_fsjx_0140","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"放射性货包运输人员在厂区运输期间不用佩带个人剂量计。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：课件《辐射防护(共性）》未专门讲述放射性货包运输要求，但课件明确“从事辐射工作，未按规定进行个人剂量监测”属于辐射防护违章行为；运输放射性货包属于辐射工作，运输人员应佩戴个人剂量计接受剂量监测。故本题错误。"},{"id":"safety_fsjx_0141","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区内没有饮水的地方，工作人员可以自行带水。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护(共性）》：在辐射控制区内喝水或进食属于辐射防护违章行为，食入防护要求禁止在辐射控制区吃、喝或吸烟，以防止放射性物质经食入途径进入人体。因此不允许自行带水进入。故本题错误。"},{"id":"safety_fsjx_0142","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在辐射控制区内执行与当前辐射工作许可证无关的另外一项工作前，须进行辐射工作许可证切换。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：课件《辐射防护(共性）》未提及辐射工作许可证切换流程，但课件明确RWP是批准需要特殊辐射防护措施的活动的书面文件，不执行RWP规定的防护要求属于违章行为，工作必须在许可范围内开展；执行与当前RWP无关的另一项工作前，须办理许可证切换手续。故本题正确。"},{"id":"safety_fsjx_0143","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射生物效应按照剂量与效应关系可以分为确定性效应和随机性效应。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射生物效应按剂量与效应关系分为确定性效应和随机性效应两类。确定性效应严重程度随剂量增加而增加且存在阈值；随机性效应发生几率与剂量有关、严重程度与剂量无关且无阈值。故答案为正确。"},{"id":"safety_fsjx_0144","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"松散污染隔离区中的物品必须经过污染检测合格后才能带出隔离区。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：松散污染可以去除、容易转移，极易扩散，必须加以控制；且物品必须通过测量后方可带出控制区。因此松散污染隔离区中的物品须经污染检测合格后才能带出，防止污染扩散。故答案为正确。"},{"id":"safety_fsjx_0145","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射热点信息牌挂设在设备或管道等存在辐射热点的位置，热点快速通过标牌在热点信息牌附近，以提醒人员快速通过热点区域，避免在该处无故停留，从而减少人员因热点而受到的照射。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：热点警告牌通常挂设在热点（如高剂量率管道）附近，用以表明热点信息、提示工作人员注意，禁止在此区域停留。人员快速通过热点区域、避免停留，可减少因热点受到的照射。故答案为正确。"},{"id":"safety_fsjx_0146","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"所有非放射性物品出辐射控制区必须经过辐射和污染确认，物品如果能够过小件物品监测仪测量，无报警，则可认为是非放射性物品。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：物品必须通过测量后方可带出控制区，随身携带的小件物品须经过小件物品测量仪（CPO）测量。能通过CPO测量且无报警的物品可确认无污染，按非放射性物品带出。故答案为正确。"},{"id":"safety_fsjx_0147","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"如果皮肤有开放性伤口，尽量避免进入辐射控制区，如需进入辐射控制区，需进行必要的包扎。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：裸露伤口是放射性物质进入人体的途径之一，伤口防护是内照射防护的重要内容，故皮肤有开放性伤口应尽量避免进入辐射控制区，确需进入时须进行必要包扎防护。故答案为正确。注意：课件表述为“禁止带开放性伤口进入辐射控制区”“存在裸露外伤的人员不得进入控制区”，较题干“包扎后可进入”更为严格，与官方答案不一致。"},{"id":"safety_fsjx_0148","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"戴呼吸器可以有效限制放射性物质的吸入。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《放射性呼吸防护》：气载污染物有呼吸吸入、食入、皮肤进入和通过裸露伤口进入四种途径，使用呼吸器就是为了限制放射性气体污染物的吸入。故戴呼吸器可以有效限制放射性物质的吸入，答案为正确。"},{"id":"safety_fsjx_0149","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"非放射性物品可以随意带进辐射控制区并带出。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：应尽量减少带入辐射控制区的物品数量，不必要的工器具、耗材不带入；带入外包装须登记；物品必须通过测量后方可带出控制区。非放射性物品不可随意带进带出。故答案为错误。"},{"id":"safety_fsjx_0150","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"人类每年受到来自环境的总剂量为2.5mSv左右，这些是可以避免的。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：人类所受环境天然放射性（宇宙射线、地壳及人体中放射性物质等）的有效剂量全球每年平均约为3.1mSv（题干2.5mSv为同一类环境天然照射量级），这部分剂量是无法避免的，称之为本底。故题干称“可以避免”错误，答案为错误。"},{"id":"safety_fsjx_0151","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"看到有边界门标识的房间门，不可以自行开启，开启前必须通知辐射防护人员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射控制区边界标示牌表示区域边界，未经许可不得穿越；未经辐射防护人员许可和现场监护擅自打开辐射控制区边界属于辐射防护黄线违章。故有边界门标识的房间门不可自行开启，开启前须通知辐射防护人员，答案为正确。"},{"id":"safety_fsjx_0152","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用他人RP证进入辐射控制区是违反辐射防护管理规定的'红线违章'。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射防护红线包括“冒用他人辐射工作授权信息进入辐射控制区，或伪造个人剂量数据”。辐射控制区实行授权通行制度，须持本人有效RP证进入，使用他人RP证即属冒用授权信息的红线违章。故答案为正确。"},{"id":"safety_fsjx_0153","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区的红区内某阀门发生泄漏，紧急情况下可以先设法进入抢修，后补审批手续。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：红区为禁止进入区，进入橙、红区等高辐射区域应办理高辐射区域进入许可等专门许可；擅自进入辐射控制区红区/橙区属于辐射防护红线违章。因此红区抢修也须先履行审批手续，不得先进入后补手续。故答案为错误。"},{"id":"safety_fsjx_0154","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射确定性效应的严重程度随剂量增加而增加，且存在剂量阈值，剂量越大，损伤越严重。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：确定性效应的严重程度随剂量增加而增加，且存在剂量阈值；剂量越大，损伤越严重，当剂量降低到一定程度时这类效应不出现。题干表述与课件一致。故答案为正确。"},{"id":"safety_fsjx_0155","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"某具备辐射防护工作授权人员在到达卫生出入口才想起忘了带热释光剂量计（TLD），这次可以先进入辐射控制区进行工作，下次再记得佩戴即可。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：进入辐射控制区之前须在卫生出入口佩戴个人剂量监测设备，EPD、TLD应佩戴在连体服左胸口袋内；从事辐射工作未按规定进行个人剂量监测属于辐射防护黄线违章。故忘带TLD不能先进入，答案为错误。"},{"id":"safety_fsjx_0156","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射实际是上一种能量。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射是一种自然现象，指的是能量以电磁波或粒子的形式向外扩散；辐射是放射性物质衰变过程中随着粒子或光子产生的能量。故辐射实质上是一种能量，答案为正确。"},{"id":"safety_fsjx_0157","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"松散污染是可以去除的，如果去除不彻底，可能导致较强的外照射危害。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：松散污染可以去除、容易转移，极易扩散，其风险主要是造成污染扩散、体表沾污及吸入等内照射危害，而并非“较强的外照射危害”。题干对危害性质的描述错误。故答案为错误。"},{"id":"safety_fsjx_0158","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"工作负责人负责本工作组成员及工作所在区域的辐射安全，实施本工作组的安全监护工作。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：工作负责人是现场工作的组织者和安全第一责任人，负责本工作组成员及工作所在区域的辐射安全，并实施工作组的安全监护工作；工作组成员则须服从工作负责人要求落实防护措施。这是核电工作安全责任的基本要求。故答案为正确。"},{"id":"safety_fsjx_0159","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"低剂量等待区为绿区，用于在辐射控制区内的工作人员暂时没有工作任务时的待命或休息。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：低剂量等待区标识牌挂设于现场辐射水平非常低的区域，此区域用于工作人员暂时没有工作任务时的待命或休息，避免停留在工作现场接受不必要的辐射照射。故答案为正确。"},{"id":"safety_fsjx_0160","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"除司机和辅助人员的其他人员可搭乘装载有放射性货包的运输车辆。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：放射性货包运输有严格的辐射安全管理要求，运输车辆上人员仅限于司机和必要的辅助人员，其他人员不得搭乘装载放射性货包的运输车辆，以免受到不必要的照射。故题干说法错误，答案为错误。"},{"id":"safety_fsjx_0161","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在松散污染隔离区内工作时，如果涉及到登高作业，需要佩戴安全带，建议佩戴头部防护用品，防止面部沾污。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"课件未直接覆盖：高处作业须按规定佩戴安全带防坠落；松散污染隔离区内作业须穿戴附加防护用品并严防面部沾污。因此在该区域内涉及登高作业时须佩戴安全带，并建议佩戴头部防护用品防止面部沾污。故答案为正确。"},{"id":"safety_fsjx_0162","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区连体服的作用是防护外照射。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：外照射的防护方法是降低剂量率、距离防护、源项控制、屏蔽防护和时间防护；衣物类防护用品用于保护皮肤和衣物不被污染（课件明确纸衣“仅用于防护表面污染，不防护外照射”）。连体服的作用是防止体表沾污，不能防护外照射。故答案为错误。"},{"id":"safety_fsjx_0163","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"如果工作中没有便携式辐射测量仪表，工作人员可以用自己戴的剂量计测量管道表面的剂量率水平。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：个人剂量计（EPD、TLD）用于监测记录个人剂量当量，TLD需特殊设备测读，EPD也仅显示本人受照剂量；测量管道表面剂量率水平须使用便携式辐射测量仪表。个人剂量计不能替代辐射测量仪表。故答案为错误。"},{"id":"safety_fsjx_0164","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"固定污染是表面污染控制的重点。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：表面污染分为固定污染（污染物难以去除）和松散污染（可以去除、容易转移）。松散污染极易扩散，可能造成体表沾污和空气污染，必须加以控制，才是表面污染控制的重点。故答案为错误。"},{"id":"safety_fsjx_0165","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"辐射控制区内划分的子区中，红区的辐射水平最高，绿区的辐射水平最低。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：辐射控制区子区按剂量率划分，绿区剂量率最低（如≤0.025mSv/h），依次为黄区、橙区，红区剂量率最高（如＞100mSv/h），红区为风险最高的子区。故答案为正确。"},{"id":"safety_fsjx_0166","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"当工作进行到辐射防护控制点时，工作负责人必须联系辐射防护人员检查。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《辐射防护（共性）》：开展高辐射风险工作，在辐射安全检查点（辐射防护控制点）未通知辐射防护人员检查确认的，属于辐射防护黄线违章。故工作进行到辐射防护控制点时必须联系辐射防护人员检查，答案为正确。"},{"id":"safety_fsjx_0167","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"速差器应满足高挂低用，使用时与垂直方向夹角不得大于30°。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：速差器应满足高挂低用，使用时与垂直方向夹角不得大于30°。题干表述与课件要求一致。故答案为正确。"},{"id":"safety_fsjx_0168","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架平台上作业时，如存在上下层垂直交叉同时作业，应做好相应的隔离措施。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：如必须上下层垂直交叉同时进行工作时，中间必须搭设严密牢固的防护隔板、罩棚或其他隔离设施，防止坠物伤人。故答案为正确。"},{"id":"safety_fsjx_0169","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"饮酒，精神不振等身体不适等情况禁止高处作业。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：作业人员作业前应无饮酒，没有精神不振、疲劳过度等身体不适状况。饮酒、精神不振等身体不适时禁止高处作业。故答案为正确。"},{"id":"safety_fsjx_0170","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在使用安全带过程中，如果沾染了化学品，应用相应的去污剂进行中和。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带应以水和中性洗涤剂的溶液清洗，不得使用化学剂、强去污剂，清洗后用清水漂洗、悬挂晾干。故“用相应的去污剂进行中和”的说法错误，答案为错误。"},{"id":"safety_fsjx_0171","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"当在梯子上，双手需要同时工作时，要系好安全带，安全带挂点可以在梯子上。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：在梯子上双手需要同时工作时，要系好安全带，且挂点不得在梯子上。梯子本身不是合格的安全带挂点。故答案为错误。"},{"id":"safety_fsjx_0172","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"软梯应挂在可靠固定，上端应用卸扣或穿钢管固定，严禁用铁丝固定，软梯下端应固定平稳。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：软梯应挂在可靠固定，上端应用卸扣或穿钢管固定，严禁用铁丝固定，软梯下端应固定平稳。题干与课件要求一致。故答案为正确。"},{"id":"safety_fsjx_0173","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架的标识牌上应有该脚手架允许载荷的标识。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：作业前应查看脚手架标识牌上的载荷限制要求，预估作业载荷，确保不超过脚手架的承载能力。因此标识牌上应有允许载荷标识。故答案为正确。"},{"id":"safety_fsjx_0174","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"安全带挂点应尽量靠近作业位置，以避免钟摆效应。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带挂点须尽量靠近作业位置，以避免钟摆效应（坠落后摆动撞击周边物体）。故答案为正确。"},{"id":"safety_fsjx_0175","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业下方可以不设监护人员、警示隔离区。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：任何人不得单独进行高处作业，现场必须指定人员履行监护职责；高处作业地点的下方还应按作业高度设置隔离区。故“可以不设监护人员、警示隔离区”错误，答案为错误。"},{"id":"safety_fsjx_0176","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业时可以将工具及材料上下投掷。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：禁止将工具及材料上下抛掷，必须用绳系牢后传递。抛掷工具材料极易造成坠物伤及下方人员。故题干说法错误，答案为错误。"},{"id":"safety_fsjx_0177","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"上下脚手架应走上下爬梯，不应沿绳、脚手架立杆、栏杆或借构筑物攀爬。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬脚手架应选用专用攀爬通道（上下爬梯），不应沿绳、立杆、栏杆或借构筑物攀爬，攀爬时应面向爬梯并保持三点接触。故答案为正确。"},{"id":"safety_fsjx_0178","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架高度较高时，允许两人同时攀爬，但要保持一定的距离。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：脚手架爬梯上禁止两人及以上同时攀爬，一次只能上一人，等人员完全离开爬梯后另一人才能开始攀爬。故答案为错误。"},{"id":"safety_fsjx_0179","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"应避免进行上下层垂直交叉同时进行工作。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：应避免进行上下层垂直交叉同时进行工作；如必须进行，中间必须搭设严密牢固的防护隔板、罩棚或其他隔离设施。故答案为正确。"},{"id":"safety_fsjx_0180","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"安全带应高挂低用，发生坠落时可减小坠落距离，减少坠落冲击力。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带应高挂低用，发生坠落时可减小坠落距离，减少坠落冲击力（架子工搭拆作业时可短时低挂高用）。故答案为正确。"},{"id":"safety_fsjx_0181","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"为了避免安全带穿戴后出现不适感，肩部绑带与胸部绑带尽可能放宽。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：安全带过松可能导致严重伤亡，胸部绑带过松坠落后可能勒至颈部致窒息，腿部绑带过松可能导致腹股沟受伤，穿戴后须通过两指试验确保适贴。故为求舒适而放宽绑带的说法错误，答案为错误。"},{"id":"safety_fsjx_0182","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业人员在每次作业前无需对脚手架、梯子、移动平台等高处作业设施进行检查。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：每次上架脚手架前应进行目视检查，安全带在每次使用前应进行检查并定期送检。故作业前须对脚手架、梯子、移动平台等设施进行检查，“无需检查”说法错误，答案为错误。"},{"id":"safety_fsjx_0183","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"发现安全带存在缺陷时可以继续使用。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：防坠落用品在检查中发现不合格、受到损害或触发保护动作时，要立即将其从工作场地移除并告知工具管理人员。故发现安全带存在缺陷不得继续使用，答案为错误。"},{"id":"safety_fsjx_0184","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用梯子时应有人扶持，扶梯的方式是一脚踏稳最底梯级，双手紧握两边扶手。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：同伴原则要求使用梯子时应有人扶持，扶梯的方式是一脚踏稳最底梯级，双手紧握两边扶手。故答案为正确。"},{"id":"safety_fsjx_0185","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在使用前的检查中，如发现设备不合格，应暂停工作，告知工具管理人员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：防坠落用品在使用结束、检查发现不合格、工作中受损或触发保护动作时，要立即从工作场地移除，并告知工具管理人员。故发现设备不合格应暂停工作并报告，答案为正确。"},{"id":"safety_fsjx_0186","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"怀疑伤员有颈椎、腰椎骨折，不要搬动伤员。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》应急处置：怀疑伤员有颈椎、腰椎骨折，不要搬动伤员，应让伤员平卧，使头、颈和脊柱保持在一条直线上，并在头肩两侧用衣服夹持固定，以免加重损伤。故答案为正确。"},{"id":"safety_fsjx_0187","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"患有高血压、心脏病、癫痫症、恐高症及其他不适应高空作业的人，一律不准从事高处作业。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：作业人员必须身体健康并定期体检，患有高血压、心脏病、癫痫症、恐高症及其他不适应高空作业的人，不得从事高处作业。故答案为正确。"},{"id":"safety_fsjx_0188","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"脚手架搭设完成后，如需长期使用，应该由专业人员进行定期巡检。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：脚手架使用期间应由巡检人员进行定期检查，检查结束后在标识牌背面签名并注明日期，并填写检查记录。故长期使用应由专业人员定期巡检，答案为正确。"},{"id":"safety_fsjx_0189","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"根据工作的需要，可以短时改变脚手架结构，在工作完成后回装。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：使用人员严禁私自更改脚手架结构。即使因工作需要短时改动也不允许擅自进行，须由脚手架专业人员处理。故答案为错误。"},{"id":"safety_fsjx_0190","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用移动式脚手架时，应确保脚轮、机械装置锁死。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：移动式脚手架在使用过程中，脚轮、机械装置应锁死，防止架体移动造成人员坠落。故答案为正确。"},{"id":"safety_fsjx_0191","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在脚手架上攀爬时，应面向爬梯并始终保持三点接触。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：攀爬时应面向爬梯并始终保持与爬梯三点接触状态（双手和双脚四点中的三点）。故答案为正确。"},{"id":"safety_fsjx_0192","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"安全带与速差器配合使用时，可以将安全带双钩挂在速差器上。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：速差器错误示范包括“安全带双钩挂在速差器上”；速差器系带一端的安全钩应固定在全身式安全带的D型环上。故安全带双钩不得挂在速差器上，答案为错误。"},{"id":"safety_fsjx_0193","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"可以从一部梯子直接攀到另一部梯子上。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》梯子使用要求：不应从一部梯子攀到另一部梯子，且禁止背向梯子攀爬。梯子各自独立架设，梯间攀爬失去稳定支撑，极易坠落。故答案为错误。"},{"id":"safety_fsjx_0194","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用人员可以私自更改脚手架结构（加固杆件、防护设施）。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：使用人员严禁私自更改脚手架结构，包括加固杆件、防护设施等构件，非脚手架人员违章拆除构件属典型违章。故答案为错误。"},{"id":"safety_fsjx_0195","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"人静止悬挂在安全带里，不会有生命危险，不需要着急救援。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》应急处置：人员静止悬挂在安全带里会造成人体损伤甚至死亡，由于血液缺氧可致心脏、肝脏、肾脏严重损伤，悬挂超过20分钟就会有生命危险，必须快速救援。故答案为错误。"},{"id":"safety_fsjx_0196","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"在5级及以上大风以及暴雨、雷电、冰雹、大雾等恶劣天气，应停止露天高处作业。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：在5级及以上大风以及暴雨、雷电、冰雹、大雾等恶劣天气，应停止露天高处作业。故答案为正确。"},{"id":"safety_fsjx_0197","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业时，轻小物件应放入工具袋，工具袋应固定牢靠。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：高处作业应一律使用工具袋，轻小物件应放入工具袋，工具袋应固定牢靠；手持轻小工具还应使用工具防坠落绳，防止坠物伤人。故答案为正确。"},{"id":"safety_fsjx_0198","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"高处作业时，禁止将工具及材料上下抛掷，必须用绳系牢后传递，以免坠物伤人。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：禁止将工具及材料上下抛掷，必须用绳系牢后传递，以免坠物伤人。抛掷的物件失控坠落会危及下方人员和设备安全。故答案为正确。"},{"id":"safety_fsjx_0199","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"格栅平台上工作，不需要采取防止工具和器材掉落的措施。（ ）","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《高处作业》：如在格栅平台上工作，应采取防止工具和器材掉落的措施。格栅缝隙存在坠物风险，不可不设防。故答案为错误。"},{"id":"safety_fsjx_0200","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"U型卸扣在使用时作用力要沿着卸扣的中心线的轴线上。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：卸扣要正确地支撑着载荷，即作用力要沿着卸扣的中心线的轴线上，避免弯曲、不稳定的载荷，更不可以过载。故答案为正确。"},{"id":"safety_fsjx_0201","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"严禁私自将运行的设备、管道、支撑钢结构及工作平台等作为起重作业的承载点。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：严禁将运行的设备、管道、支撑钢结构及工作平台等作为起重作业的承载点；必须利用厂房钢结构等辅助支撑的，须经工程技术人员进行载荷吊拉专项评估。故答案为正确。"},{"id":"safety_fsjx_0202","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"正式吊运前，应将重物慢速吊离地面100-200mm以进行试吊，确认吊物处于可靠的吊运状态，方可正常起升。（ ）","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：正式吊运前，应将重物慢速吊离地面100-200mm以进行试吊，确认吊物处于可靠的吊运状态，方可正常起升。故答案为正确。"},{"id":"safety_fsjx_0203","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"工作人员如发现任何起重设备有问题，有权拒绝开工。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重机、手拉葫芦、吊带、吊链等应进行定期检验，使用前须检查，确保在检验/检定/检查有效期内。发现起重设备有问题、无法保证安全时，工作人员有权拒绝开工。故答案为正确。"},{"id":"safety_fsjx_0204","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"无肩有眼螺栓，只能用于垂直起重，有肩有眼螺栓，可用于有一定角度的起重。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：无肩有眼螺栓只用于垂直起重，在有角度拉动时会弯曲或折断；有肩有眼螺栓可用于有角度的起重（若肩部未100%接触载荷表面，应按无肩螺栓对待）。故答案为正确。"},{"id":"safety_fsjx_0205","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"单根吊装时，将吊带直接挂入吊钩受力中心位置，不能挂在吊钩钩尖部位。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：单根吊装时，将吊带直接挂入吊钩受力中心位置，不能挂在吊钩钩尖部位，且严禁超载使用。故答案为正确。"},{"id":"safety_fsjx_0206","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"起重作业区域如有专人监管，可以不设置区域隔离。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：作业前应建立吊装隔离区域，进行明显隔断，并安排专人负责边界管控，确保所有非工作人员远离工作区域。即使有专人监管，隔离区域也不可省略。故答案为错误。"},{"id":"safety_fsjx_0207","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"起重操作人员在明确了工作内容后，可以根据经验判断自行开展吊装具体操作。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊装作业应编制吊装计划、召开工前会，操作人员应听从指挥信号进行操作，不明确的指挥信号会造成误操作。故操作人员不能凭经验自行判断操作，答案为错误。"},{"id":"safety_fsjx_0208","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"吊带可以用来垫在物体下方，便于使用吊带拖动物体。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：不应将物品压在吊带上，会造成吊带损坏，也不应试图将吊带从下面抽出，应用物体垫起留出空间取出吊带。故吊带不得垫在物体下方使用，答案为错误。"},{"id":"safety_fsjx_0209","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"吊升载荷时，重要的是尽量保持负荷水平。这样不仅可以更好地吊升，也可以提高安全性。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊升载荷时，重要的是尽量保持负荷水平，这样不仅可以更好地吊升，也可以提高安全性。故答案为正确。"},{"id":"safety_fsjx_0210","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"不属于特种作业范围的起重吊装工作，就不需要相应工作人员经过培训和考核。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起重指挥、起重司机属于特种设备作业人员，须持证上岗；非特种作业人员也应经过公司专业培训并考核通过后，方可进行起重吊装作业。故答案为错误。"},{"id":"safety_fsjx_0211","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"对埋在地下的物件进行评估后，可以用起吊设备进行起吊操作。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：吊埋在地下的物件会造成吊车翻车的重大事故；“十不吊”明确工件埋在地下、与地面建筑物或设备有钩挂不吊。故即使经评估也不得起吊，答案为错误。"},{"id":"safety_fsjx_0212","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"起吊大的或不规则构件时，应在构件上系以牢固的拉绳，使其不摇摆不旋转。( )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：起吊大的或不规则的构件时，应在构件上系以牢固的拉绳，使其不摇摆不旋转，便于地面人员控制构件稳定、防止摆动碰撞。故答案为正确。"},{"id":"safety_fsjx_0213","module":"safety","bank":"辐射防护基础和专项安全培训","type":"judge","stem":"使用有眼螺栓吊装时，可以用一根吊索穿过两个有眼螺栓。( )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"辐射防护基础和专项安全培训.docx","explanation":"依据课件《起重吊装》：不应该用吊索穿过两个螺栓眼之间，这会造成起吊过程中吊物滑动，且因螺栓承受横向力和纵向力而增大总受力，可能超出螺栓承受能力。故答案为错误。"},{"id":"safety_fry_0001","module":"safety","bank":"防人因","type":"judge","stem":"注意力不集中，或注意力仅集中于某一点而忽视其它方面，属于技能型失误。(        )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：技能型行为依赖于对熟悉任务的专注与自动化操作，当注意力不集中，或注意力仅集中于某一点而忽视其它方面时，最容易在执行阶段出错，这类失误属于技能型失误，故答案为正确。"},{"id":"safety_fry_0002","module":"safety","bank":"防人因","type":"judge","stem":"规则型失误是指由于工作人员使用了本身有错误的规程所致。(        )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：规则型失误是指工作人员在运用规则、规程解决问题时发生的失误，既包括误用规则、选错规则，也包括规则本身存在缺陷等情形。题干将规则型失误仅归结为“使用了本身有错误的规程”，定义过于狭窄，故答案为错误。"},{"id":"safety_fry_0003","module":"safety","bank":"防人因","type":"judge","stem":"从事规则型任务时，发生失误的概率最小。(        )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：三类任务中，技能型任务最为熟悉、自动化程度最高，发生失误的概率最小；规则型任务次之；知识型任务面临新情况、需依靠知识推理判断，失误概率相对最高。故“规则型任务失误概率最小”的说法错误，答案为错误。"},{"id":"safety_fry_0004","module":"safety","bank":"防人因","type":"judge","stem":"人因管理是为了塑造完善无缺的个人。(        )","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》人员绩效基本原理：“人是容易犯错误的，即使最优秀的人也会犯错”。人必然会犯错，人因管理的目的不是塑造完善无缺的个人，而是通过识别失误先兆、强化屏障等手段减少人因失误的发生，故答案为错误。"},{"id":"safety_fry_0005","module":"safety","bank":"防人因","type":"judge","stem":"事件可以通过分析犯错的原因和学习经验教训来避免。(        )","options":null,"answer":["正确"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》人员绩效基本原理：“可以通过分析犯错的原因和学习经验教训来避免事件的发生”，题干表述与课件一致，故答案为正确。"},{"id":"safety_fry_0006","module":"safety","bank":"防人因","type":"single","stem":"人因管理培训的复训频率为(       )。","options":["每半年一次","每一年一次","每两年一次"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：人因管理培训需要定期复训，以保持和更新人员的防人因知识与技能，复训频率为每两年一次，故答案为C。"},{"id":"safety_fry_0007","module":"safety","bank":"防人因","type":"single","stem":"以下哪一项不是无人因时钟复位原则(       )。","options":["各级无人因时钟以周期年为周期进行自动复位","发生公司级复位，各级时钟均复位","发生单元复位的，单元所属时钟均复位"],"answer":["A"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"课件未直接覆盖：无人因时钟的复位由人因事件触发——发生公司级复位时各级时钟均复位，发生单元复位时该单元所属时钟均复位；时钟并不按周期年自动定期复位，A项不属于复位原则，故答案为A。"},{"id":"safety_fry_0008","module":"safety","bank":"防人因","type":"single","stem":"屏障不包括(       )。","options":["个人屏障","管理屏障","设备屏障","制度屏障"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：核电厂屏障分为实体屏障、个人屏障、管理屏障、组织屏障四个层次，“设备屏障”不在其中，故答案为C。"},{"id":"safety_fry_0009","module":"safety","bank":"防人因","type":"single","stem":"失误先兆的四个方面不包括(       )。","options":["任务要求","个人能力","工作环境","组织机构"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：失误先兆根据任务的特点分为任务要求、个人能力、工作环境和人的本性四个方面，组织机构不属于失误先兆的方面，故答案为D。"},{"id":"safety_fry_0010","module":"safety","bank":"防人因","type":"single","stem":"组织缺陷不包括(       )。","options":["工作安排不合理","计划冲突","制度不完善"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》的屏障划分：组织屏障涉及资源配置、组织机构、组织流程和价值观、文化氛围等方面；而“制度”（规程、管理条例等）属于管理屏障范畴。制度不完善属于管理屏障缺陷，不属于组织缺陷，故答案为C。"},{"id":"safety_fry_0011","module":"safety","bank":"防人因","type":"judge","stem":"自检工具使用时可以连续快速执行多个操作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：自检应避免的危险行为中明确列有“一次或同时执行两个以上的操作”“连续、快速地执行多个操作”，自检要求对每项操作逐一完成停—思—行—审，故答案为错误。"},{"id":"safety_fry_0012","module":"safety","bank":"防人因","type":"judge","stem":"监护操作中，验证者和 执行者可以合作执行操作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：监护中一人执行操作、一人同步确认，角色必须明确；课件将“操作人和监护人在执行任务时无意间交换了角色”“操作人（组）和验证人（组）合作共同执行同一项工作任务”列为应避免的风险行为，验证者须保持独立，不能与执行者合作执行，故答案为错误。"},{"id":"safety_fry_0013","module":"safety","bank":"防人因","type":"judge","stem":"如果执行者的操作步骤与指定操作一致，监护者不必告知执行人'操作正确'。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护使用方法：监护人核对操作人的口颂指令及指向设备与程序一致后要回答“正确，请执行”，确认响应正常后还要回答“正确”；基本原则也要求监护人对正确和错误的行动都给予回应，故操作正确时也必须告知，答案为错误。"},{"id":"safety_fry_0014","module":"safety","bank":"防人因","type":"judge","stem":"监护操作中，如果执行者的操作和预期不一致，监护者立即阻止执行者。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护使用方法：操作人执行操作，监护人确认操作和预期一致，否则及时制止，故答案为正确。"},{"id":"safety_fry_0015","module":"safety","bank":"防人因","type":"judge","stem":"涉及核安全、工业安全、辐射安全、环境安全以及电厂的稳定运行，可能立即产生不可逆影响的工作任务，不一定必须使用操作监护。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》监护使用条件：涉及核安全、工业安全、辐射安全、环境安全以及电厂的稳定运行，可能产生立即的、不可逆的影响的重大后果的操作任务或步骤，正是监护的适用情形，必须使用操作监护，而非“不一定必须”，故答案为错误。"},{"id":"safety_fry_0016","module":"safety","bank":"防人因","type":"single","stem":"独立验证和操作监护的不同点，下列说法正确的是（    ）。","options":["监护操作关注的是状态和配置是否正确","独立验证用于没有立即后果的场合","独立验证用于一旦操作失误或确认不到位将会产生立即的、重大后果的场合"],"answer":["B"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：独立验证适用于不会立即产生严重后果但有潜在不良影响的操作，且关注的是状态和配置是否正确；监护适用于一旦失误将会产生立即的、不可逆重大后果的任务。A把关注状态配置归于监护，错误；C描述的是监护的适用场合，错误；B表述正确，故答案为B。"},{"id":"safety_fry_0017","module":"safety","bank":"防人因","type":"single","stem":"监护操作执行时要避免以下情况（   ）。","options":["执行人执行速度过快以致监护人没有机会","监护人密切观察执行人的行为","监护人执行此项任务经验丰富"],"answer":["A"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：监护应避免的风险行为明确包括“操作人执行速度过快以致监护人没有机会进行干预和预防错误发生”，即A；B“密切观察执行人的行为”是正确的监护要求（应避免的是不密切观察）；C监护人经验丰富不是风险（应避免的是经验不足），故答案为A。"},{"id":"safety_fry_0018","module":"safety","bank":"防人因","type":"single","stem":"关于监护操作的特殊规定，正确的是（   ）。","options":["要求监护人的操作授权不得低于操作人","监护操作的正确性由监护人和执行人共同负责","以上都正确"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：“监护人的授权通常应当等同或高于执行人的授权”（A正确）；工具对比表中监护的后果责任为“共同责任”，即监护人和执行人对操作正确性共同负责（B正确）。两项均正确，故答案为C。"},{"id":"safety_fry_0019","module":"safety","bank":"防人因","type":"single","stem":"监护操作是执行人和监护人同时检查整改操作过程，以确保整个过程（包括前提条件检查、操作过程中的确认、操作结束后的参数响应检查）的正确性，形成预防错误的（   ）屏障。","options":["第一道","第二道","第三道"],"answer":["B"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：监护的目的是通过设置“二人小组”形成预防错误的双重屏障，其中执行人的自检与执行为第一道，监护人的同步确认构成第二道屏障，故答案为B。"},{"id":"safety_fry_0020","module":"safety","bank":"防人因","type":"single","stem":"以下不属于使用三向交流工具的作用的是(    )。","options":["提供准确、简明、清晰的信息传递","接收到的信息和想要提供的信息相一致","减少沟通成本","有效避免因信息传递失效而导致的人因失误"],"answer":["C"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：三向交流的目的为精确、准确、清楚并无误地传输信息（A）、确保收到的信息就是想要传达的信息（B）、尽量减少失误可能性、避免因信息传递失效导致人因失误（D），“减少沟通成本”不在其作用之列，故答案为C。"},{"id":"safety_fry_0021","module":"safety","bank":"防人因","type":"single","stem":"在工作中遇到如下哪一种情况时，应该召开工后会（   ）。","options":["出现了没有考虑到的异常情况","非常规的操作和复杂的操作","工作的参与者认为需要召开工后会的操作","以上所有"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：需要召开工后会的情况包括工作中出现了没有考虑到的异常或意外情况（A）、非常规及复杂的工作任务（B）、工作的参与者认为需要召开工后会的操作（C），三者均属应召开工后会的情形，故答案为D。"},{"id":"safety_fry_0022","module":"safety","bank":"防人因","type":"single","stem":"以下属于使用工前会的原因的有（    ）。","options":["使参加工作的每个人更好的理解工作任务，识别风险，并明确预防风险的措施","工前会上针对人因失误陷阱，明确应该使用的防人因工具，从而降低人因失误的发生的概率","明确职责分工，减少由于职责不清导致的失误","以上所有"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：工前会帮助人员理解任务、识别风险并明确预防措施（A）；会上讨论关键步骤及应选用的防人因失误工具，以降低人因失误发生概率（B）；并明确人员分工，避免职责不清（C）。三者均为使用工前会的原因，故答案为D。"},{"id":"safety_fry_0023","module":"safety","bank":"防人因","type":"single","stem":"下列关于工前会的说法，正确的是（   ）。","options":["简单操作不需要召开工前会","复杂工作看情况才需召开工前会","复杂工作不一定需要召开工前会","任何操作都需要召开工前会"],"answer":["D"],"score":null,"source":"official","origin":"防人因.xlsx","explanation":"依据课件《保护区准入防人因失误》：在系统和设备的生产活动之前推荐使用工前会，且工前会分为简单工前会和标准工前会——简单、经常重复且无严重后果的操作采取简单工前会，失误可能造成严重后果的必须召开标准工前会，即任何操作都需以相应形式召开工前会，故答案为D。"},{"id":"safety_fry_0024","module":
