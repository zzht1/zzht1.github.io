":"正确。汽轮机将蒸汽热能（内能）转变为机械能，带动发电机发电。"},{"id":"safety_zb_0123","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在搬运长条形物体时，保持双手远离物体端部以防被挤压/夹伤。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。搬运长条形物体时双手应远离端部，防止挤压夹伤。"},{"id":"safety_zb_0124","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起重设备进入防异物管理区域上空之前，无需检查有无部件松动情况。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。起重设备进入防异物区域上空前必须检查有无部件松动，防止异物掉落。"},{"id":"safety_zb_0125","module":"safety","bank":"保护区安全准入","type":"judge","stem":"我国目前的核电机组主要分布在内陆省份。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。我国核电机组主要分布在沿海省份，内陆尚无在运机组。"},{"id":"safety_zb_0126","module":"safety","bank":"保护区安全准入","type":"judge","stem":"三哩岛、切尔诺贝利核电站存在很多设计错误，加之人员培训和规程的低质量最终导致事故的发生。而目前的电站已经充分吸取了这些失败经验，加之今天的巨大技术进步，所以绝对不会发生大事故。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。不能认为\"已有电站绝对安全\"，核安全需要持续保持警惕，任何时候都不能放松（安全是相对的、动态的）。"},{"id":"safety_zb_0127","module":"safety","bank":"保护区安全准入","type":"judge","stem":"天然辐射源，如宇宙射线、某些种类岩石；人造辐射源，如CT检查等，使人们遭受的辐照剂量比从事辐射工作所接受的职业剂量更多。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。天然辐射（宇宙射线、岩石等）加上人造辐射源（CT等）使公众接受的照射剂量总体上并不比核电职业剂量少，职业剂量受严格控制在很低水平。"},{"id":"safety_zb_0128","module":"safety","bank":"保护区安全准入","type":"judge","stem":"岗位适任性的主观辨识方法，既包括对个人身体状态变化的观察也包括社会交往方面的变化。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。岗位适任性主观辨识既观察身体状态变化，也观察社会交往方面的变化。"},{"id":"safety_zb_0129","module":"safety","bank":"保护区安全准入","type":"judge","stem":"搬运物料前，如搬运人员对周围环境熟悉，即使无法观察到所搬运负载的上方及其四周也没关系。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。搬运前必须保证能看到负载上方及四周，环境不熟悉也不能例外。"},{"id":"safety_zb_0130","module":"safety","bank":"保护区安全准入","type":"judge","stem":"WBC是指全身计数测量，是监测人体内照射的重要手段。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。WBC（全身计数器）测量是监测人体内照射的重要手段。"},{"id":"safety_zb_0131","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对于在物料搬运时发生的预期外的事件，工作人员应在确保自身安全的前提下将物料放置在安全状态，再进行处理。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。搬运中发生预期外事件，应先确保自身安全并将物料置于安全状态再处理。"},{"id":"safety_zb_0132","module":"safety","bank":"保护区安全准入","type":"judge","stem":"物项只在进入防异物管理区域时需要检查，带出时不用检查。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。物项进出防异物管理区域都必须检查，防止异物带入或带出遗留。"},{"id":"safety_zb_0133","module":"safety","bank":"保护区安全准入","type":"judge","stem":"安保配置和设计文件可以随意查看。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。安保配置和设计文件属于敏感资料，须授权查阅，不能随意查看。"},{"id":"safety_zb_0134","module":"safety","bank":"保护区安全准入","type":"judge","stem":"一旦完成初始培训成为核电一员后，后续无需再接受培训。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。核电员工需要持续接受再培训（复训、授权资格考试），不是一次培训终身有效。"},{"id":"safety_zb_0135","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用螺丝刀，扳手等工具时，应使用防坠落手绳。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。高处使用螺丝刀、扳手等工具应系防坠落手绳，防止落物伤人。"},{"id":"safety_zb_0136","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在应急情况下，如果你不属于应急响应专业组成员，应按指示到达应急集合点或疏散地。（）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。非应急响应专业人员应按指令到应急集合点集合或疏散。"},{"id":"safety_zb_0137","module":"safety","bank":"保护区安全准入","type":"judge","stem":"只要足够优秀，就不会犯错误。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。任何人都会犯错误，优秀的员工同样需要防人因失误工具和规程约束。"},{"id":"safety_zb_0138","module":"safety","bank":"保护区安全准入","type":"judge","stem":"使用螺丝刀，扳手等工具时，可以使用胶带临时捆绑替代防坠落手绳。（）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。防坠落手绳不能用胶带临时捆绑替代，必须使用合格的专用手绳。"},{"id":"safety_zb_0139","module":"safety","bank":"保护区安全准入","type":"judge","stem":"对介质是危化品的系统开展检修工作时，只要做好系统隔离，可以不佩戴防护用品。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。危化品系统检修除系统隔离外，还必须按风险分析佩戴相应防护用品。"},{"id":"safety_zb_0140","module":"safety","bank":"保护区安全准入","type":"judge","stem":"红色安全标志是禁止或制止人们想要做的某种动作。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。红色安全标志表示禁止、制止某种动作（禁止标志）。"},{"id":"safety_zb_0141","module":"safety","bank":"保护区安全准入","type":"judge","stem":"进入密闭容器前，必须对密闭容器的含氧量及有毒有害气体的浓度进行测量，空气指标合格后方可进入作业。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。进入密闭容器前必须测量含氧量和有毒有害气体浓度，合格后方可进入。"},{"id":"safety_zb_0142","module":"safety","bank":"保护区安全准入","type":"judge","stem":"安全帽主要防止高处落物的打击，在高空作业时可以不戴。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。安全帽任何时候进入现场都必须佩戴，高空作业更不能摘下。"},{"id":"safety_zb_0143","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在现场工作时衣服、袖口应扣好，长发应盘入安全帽以防止卷入转动设备。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。现场工作应扣好衣服袖口，长发盘入安全帽，防止卷入转动设备。"},{"id":"safety_zb_0144","module":"safety","bank":"保护区安全准入","type":"judge","stem":"《职业病防治法》适用于中华人民共和国境内产生职业病危害的企事业单位和个体经济组织。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。《职业病防治法》适用于境内产生职业病危害的企事业单位和个体经济组织。"},{"id":"safety_zb_0145","module":"safety","bank":"保护区安全准入","type":"judge","stem":"个人劳动防护用品是提供安全和健康防护的预防性辅助措施，可以直接替代工作中必须采取的安全技术措施。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。个人防护用品只是辅助预防措施，不能替代必须的安全技术措施。"},{"id":"safety_zb_0146","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在现场工作过程中，不管受伤多轻微都应进行报告。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.现场工作中无论伤情多轻微都应报告（及时处置、经验反馈）。"},{"id":"safety_zb_0147","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在用人单位与被雇佣人商量一致的情况下，可以不用参加工伤保险。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。工伤保险是法定强制保险，即使双方协商一致也必须参加。"},{"id":"safety_zb_0148","module":"safety","bank":"保护区安全准入","type":"judge","stem":"工作结束后，现场设置的临时围栏应及时拆除，打开的盖板应立即恢复。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。工作结束后临时围栏应及时拆除、打开的盖板立即恢复。"},{"id":"safety_zb_0149","module":"safety","bank":"保护区安全准入","type":"judge","stem":"从事高空作业人员在工作前必须检查安全带，没有带安全带的在工作中必须有专人监护。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。高处作业人员必须佩戴安全带，没有安全带根本不允许作业（不是\"专人监护\"可以替代）。"},{"id":"safety_zb_0150","module":"safety","bank":"保护区安全准入","type":"judge","stem":"人的不安全行为并不是每次都能造成事故伤害，有的不安全行为没有形成任何后果，但事故正是以大量的不安全行为为基础的。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。海因里希法则：不安全行为不一定每次都致伤，但事故以大量不安全行为为基础。"},{"id":"safety_zb_0151","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场生产厂房噪音超过85分贝的环境应使用耳塞，以防听力受损。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。噪声超过85分贝的环境应佩戴耳塞防止听力损伤。"},{"id":"safety_zb_0152","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起吊物体必须离开地面有足够的距离后，人员方可从下方通过。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误.起吊物吊起后严禁人员从吊物下方通过（无论离地多高）。"},{"id":"safety_zb_0153","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在关闭容器（坑洞、井）人孔门以前，工作负责人必须清点人员和工具，检查确实没有人员或工具遗留后才可关闭。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。关闭容器（坑洞、井）人孔前必须清点人员和工具，确认无遗留后方可关闭。"},{"id":"safety_zb_0154","module":"safety","bank":"保护区安全准入","type":"judge","stem":"起重作业人员在操作前应检查现场风速低于五级满足起重条件，否则不准进行操作。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。起重作业前应确认现场风速低于五级（满足起重条件）方可操作。"},{"id":"safety_zb_0155","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场使用或临时存放的气瓶应进行可靠固定，使用气瓶绑扎带固定气瓶时可以只绑扎在瓶身下部牢靠即可。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。气瓶绑扎固定不能只绑瓶身下部，应固定牢靠防止倾倒（绑扎位置应确保稳定）。"},{"id":"safety_zb_0156","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电气设备必须装设保护接地（接零），不得将接地线接在金属管道上或其他金属构件上。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电气设备必须装设保护接地（接零），接地线不得接在金属管道或其他金属构件上。"},{"id":"safety_zb_0157","module":"safety","bank":"保护区安全准入","type":"judge","stem":"成人心肺复苏时，不管单人或双人进行复苏，胸外按压与通气比均为30：2。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。成人心肺复苏无论单人或双人，按压与通气比均为30:2。"},{"id":"safety_zb_0158","module":"safety","bank":"保护区安全准入","type":"judge","stem":"海因里希（Heinrich）事故法则对于职业安全卫生工作的意义是：防止人的不安全行为，消除物的不安全状态，使因果连锁中断。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。海因里希事故法则的意义：防止人的不安全行为、消除物的不安全状态，中断事故因果连锁。"},{"id":"safety_zb_0159","module":"safety","bank":"保护区安全准入","type":"judge","stem":"自己未使用或没有通行证，跟随别的工作人员进入安全门称为尾随。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确.未使用本人通行证跟随他人进入安全门的行为称为尾随（防尾随是核安保基本要求）。"},{"id":"safety_zb_0160","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核安保文化的定义是预防、探测和应对涉及核材料、核设施、其他放射性物质及相关设施，以及相关活动的擅自接触、末经授权转移、盗窃、蓄意破坏或其他恶意行为。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。这是核安保文化的定义：预防、探测和应对核材料及放射性物质等的擅自接触、未经授权转移、盗窃、蓄意破坏等恶意行为。"},{"id":"safety_zb_0161","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在报警时只要说明起火的具体位置（区域、机组、厂房、层面、房间等）和着火物性质、火势大小、有无人员被困、受伤就可以了，不需要告知报警人信息并引导消防车辆。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。报警时还应告知报警人信息并引导消防车辆到达现场。"},{"id":"safety_zb_0162","module":"safety","bank":"保护区安全准入","type":"judge","stem":"保护区和要害区必须通过制卡授权系统分别进行授权，一次开门只能允许具备授权的持证者一人通行。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。保护区和要害区须分别授权，一次开门只允许一名持证授权者通行（防尾随）。"},{"id":"safety_zb_0163","module":"safety","bank":"保护区安全准入","type":"judge","stem":"各个区域使用不同的证件，人员进入某区域必须持有相应的证件。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。各区域使用不同证件，进入相应区域必须持相应证件。"},{"id":"safety_zb_0164","module":"safety","bank":"保护区安全准入","type":"judge","stem":"动火作业是指在禁火区进行焊接与切割作业及在易燃易爆场所使用喷灯、电钻、砂轮等进行可能产生火焰、火花和炽热表面的临时性作业。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。这是动火作业的定义：禁火区焊接切割及易燃易爆场所可能产生火焰、火花、炽热表面的临时作业。"},{"id":"safety_zb_0165","module":"safety","bank":"保护区安全准入","type":"judge","stem":"保卫分区的目的是为了有效地防御非法入侵，确保核电站安全。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。保卫分区目的是有效防御非法入侵，确保核电站安全。"},{"id":"safety_zb_0166","module":"safety","bank":"保护区安全准入","type":"judge","stem":"电器开关时的打火、熔热发红的铁器和电焊产生的焊渣都是着火源。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电器开关打火、发红铁器、电焊焊渣都是着火源。"},{"id":"safety_zb_0167","module":"safety","bank":"保护区安全准入","type":"judge","stem":"任何进入管理区的车辆和人员都要接受安检。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。进入管理区的车辆和人员都要接受安检。"},{"id":"safety_zb_0168","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂内禁止流动吸烟，吸烟必须要指定吸烟点。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。核电厂内禁止流动吸烟，只能在指定吸烟点吸烟。"},{"id":"safety_zb_0169","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每项产品具有其质量特性，但表现形式不尽相同。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每项产品都有质量特性，表现形式不尽相同（性能、寿命、可靠性等）。"},{"id":"safety_zb_0170","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂质量的体现之一是：设备检修、机组运行控制、设备管理、物资采购等等生产相关各环节，符合规定的工作流程及要求。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。电厂质量体现在检修、运行、设备管理、采购等各环节符合规定流程与要求。"},{"id":"safety_zb_0171","module":"safety","bank":"保护区安全准入","type":"judge","stem":"在工程进度和时间紧张的情况下，对从事影响质量的活动的人员可安排先上岗后培训。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。影响质量活动的人员必须先培训合格后上岗，严禁先上岗后培训。"},{"id":"safety_zb_0172","module":"safety","bank":"保护区安全准入","type":"judge","stem":"维修工作记录填写原则上应在该项活动结束时同步进行填写，不能在活动未完成前就进行填写或在整个工作结束后进行事后凭记忆补签。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。维修记录应在活动结束时同步填写，严禁提前填写或事后凭记忆补签。"},{"id":"safety_zb_0173","module":"safety","bank":"保护区安全准入","type":"judge","stem":"无证作业（包括工作负责人、QC、操纵员、燃料操作员等）属于中国核电质量红线违章。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。无证作业（工作负责人、QC、操纵员、燃料操作员等）属于中国核电质量红线违章。"},{"id":"safety_zb_0174","module":"safety","bank":"保护区安全准入","type":"judge","stem":"现场工作完成后，工作人员也可以不用进行'自检'，因为工作负责人会进行确认。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。工作完成后工作人员仍需自检确认，不能依赖工作负责人确认。"},{"id":"safety_zb_0175","module":"safety","bank":"保护区安全准入","type":"judge","stem":"核电厂设计变更必须采用与原设计相同的设计控制措施。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。设计变更必须采用与原设计相同的设计控制措施（同等审查、验证）。"},{"id":"safety_zb_0176","module":"safety","bank":"保护区安全准入","type":"judge","stem":"记录是为各种物项或服务的质量以及影响质量的各种活动提供客观证据的文件。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。记录是为物项或服务质量及影响质量活动提供客观证据的文件。"},{"id":"safety_zb_0177","module":"safety","bank":"保护区安全准入","type":"judge","stem":"影响质量的工艺必须由合格的人员、按照认可的程序和使用合格的设备，按现有标准来完成。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。影响质量的工艺必须由合格人员、按认可程序、用合格设备并按现有标准完成。"},{"id":"safety_zb_0178","module":"safety","bank":"保护区安全准入","type":"judge","stem":"每个人都可以拒绝超出授权范围的工作安排。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。每个人都可以（且应该）拒绝超出本人授权范围的工作安排。"},{"id":"safety_zb_0179","module":"safety","bank":"保护区安全准入","type":"judge","stem":"所有质量保证记录都必须字迹清楚、完整、并与所记述的物项或服务相对应。（ ）","options":null,"answer":["正确"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"正确。质量保证记录必须字迹清楚、完整，并与所述物项或服务相对应。"},{"id":"safety_zb_0180","module":"safety","bank":"保护区安全准入","type":"judge","stem":"当工作执行到质量计划中的'H点'时，验证人员虽然未到场，但通过电话表示放弃该点见证，也可以继续开展工作。（ ）","options":null,"answer":["错误"],"score":3.0,"source":"official","origin":"保护区安全准入.docx","explanation":"错误。H点（停工待检点）必须由验证人员到场见证签字后方可继续，电话放弃见证无效。"},{"id":"safety_gy_0001","module":"safety","bank":"工业安全二级","type":"single","stem":"新《安全生产法》立法目的是为了加强(  )，防止和减少生产安全事故，保障人民群众生命和财产安全，促进经济社会持续健康发展。","options":["安全生产工作","安全生产监督管理","处罚力度","安全生产"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"《安全生产法》立法目的是加强安全生产工作，防止和减少生产安全事故，保障人民群众生命财产安全，促进经济社会持续健康发展。"},{"id":"safety_gy_0002","module":"safety","bank":"工业安全二级","type":"single","stem":"根据新《安全生产法》要求，生产经营单位应当建立健全(  )，采取技术、管理措施，及时发现并消除事故隐患。","options":["安全生产自查制度","生产安全事故隐患排查治理制度","事故报告制度","安全生产巡检制度"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"生产经营单位应建立健全生产安全事故隐患排查治理制度，采取技术、管理措施及时发现并消除事故隐患。"},{"id":"safety_gy_0003","module":"safety","bank":"工业安全二级","type":"single","stem":"根据新《安全生产法》要求，生产经营单位必须依法参加(  )，为从业人员缴纳保险费。","options":["养老保险","工伤保险","医疗保险","失业保险"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"《安全生产法》要求生产经营单位必须依法参加工伤保险，为从业人员缴纳保险费。"},{"id":"safety_gy_0004","module":"safety","bank":"工业安全二级","type":"single","stem":"开挖深度达（  ）米时，应设置应急逃生通道。","options":["0.8","1","1.5","2"],"answer":["D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"开挖深度达2米时应设置应急逃生通道（深坑坍塌、人员被困风险）。"},{"id":"safety_gy_0005","module":"safety","bank":"工业安全二级","type":"single","stem":"爆破作业装药前检查是否是（  ）、大雾或黄昏天气，无关作业人员和机械设备是否撤离处爆破区域。","options":["晴天","雷雨","多云","大风"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"爆破装药前应检查是否雷雨、大雾或黄昏天气（雷电可能引爆雷管），并确认无关人员和设备已撤离。"},{"id":"safety_gy_0006","module":"safety","bank":"工业安全二级","type":"single","stem":"关注断路作业位置与周围用电设备或带电线路的安全距离，设置好保护措施，主要是为了避免（  ）事故","options":["机械伤害","触电","起重伤害"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"断路作业关注与周围用电设备或带电线路的安全距离，主要是避免触电事故。"},{"id":"safety_gy_0007","module":"safety","bank":"工业安全二级","type":"single","stem":"A、B 级爆破工程的安全评估应至少有（  ）名具有相应作业级别和作业范围的持证爆破工程技术人员参加；环境十分复杂的重大爆破工程应邀请专家咨询，并在专家组咨询意见的基础上，编写爆破安全评估报告。爆破安全评估报告内容应该详实，结论应当明确。","options":["2","3","4","5"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"A、B级爆破工程安全评估应至少有3名持证爆破工程技术人员参加。"},{"id":"safety_gy_0008","module":"safety","bank":"工业安全二级","type":"single","stem":"凡须经公安机关审批的爆破作业项目，爆破作业单位应于施工前（     ）发布公告，并在作业地点张贴，施工公告内容应包括：爆破作业项目名称、委托单位、设计施工单位、安全评估单位、安全监理公司、爆破作业时限等。","options":["1天","2天","3天","4天"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"须经公安机关审批的爆破作业项目，应于施工前3天发布公告并在作业地点张贴。"},{"id":"safety_gy_0009","module":"safety","bank":"工业安全二级","type":"single","stem":"露天浅孔、深孔、特种爆破，爆后如不能确认有无盲炮，应经（   ）后才能进入爆区检查。","options":["5min","10min","15min","20min"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"露天爆破后如不能确认有无盲炮，应等待15分钟后才能进入爆区检查。"},{"id":"safety_gy_0010","module":"safety","bank":"工业安全二级","type":"single","stem":"下列关于塔吊的操作错误的是（    ）","options":["塔机后臂与相邻建筑物之间的安全距离不少于50cm，塔机与输电线之间的安全距离符合要求。","多台塔吊时，在水平和垂直两个方向上都要保证不少于1.5m的安全距离，并设置防碰撞措施。","塔吊的专用开关箱满足“一机一闸一漏”的，漏电保护器的脱扣额定动作电流应不大于30mA，额定动作时间不超过0.1s。"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"多台塔吊作业应保持安全距离并采取防碰撞措施（\"相互靠近时可正常交叉作业\"说法错误）。"},{"id":"safety_gy_0011","module":"safety","bank":"工业安全二级","type":"single","stem":"购买剧毒化学品、易制爆危险化学品、易制毒危险化学品的，应按（  ）有关许可要求严格执行。","options":["安全生产监督管理部门","交通运输管理部门","公安机关"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"购买剧毒化学品、易制爆、易制毒危险化学品应按公安机关的有关许可要求严格执行。"},{"id":"safety_gy_0012","module":"safety","bank":"工业安全二级","type":"single","stem":"动土作业如采用人工挖掘时，坑的深度超过（  ）m时，要进行气体检测，需要考虑是否实行有限空间安全管理。","options":["1.0","1.2","1.4"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"人工挖掘坑深超过1.2m时应进行气体检测，考虑是否按有限空间管理。"},{"id":"safety_gy_0013","module":"safety","bank":"工业安全二级","type":"single","stem":"断路作业时，要求道路作业警示灯开启时能发出至少自（  ）m以外清晰可见的连续、闪烁或旋转的红光。","options":["50","100","150"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"断路作业警示灯应能发出至少150m以外清晰可见的连续、闪烁或旋转红光。"},{"id":"safety_gy_0014","module":"safety","bank":"工业安全二级","type":"single","stem":"生产过程中事故发生的可能性与严重性的结合称为（ ）。","options":["风险","隐患","危险"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"事故发生的可能性与严重性的结合称为风险（风险=可能性×后果严重性）。"},{"id":"safety_gy_0015","module":"safety","bank":"工业安全二级","type":"single","stem":"任何电气设备在未验明无电之前，一律认为（ ）。","options":["无电","也许有电","有电"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"任何电气设备未验明无电之前一律认为有电（安全用电基本原则）。"},{"id":"safety_gy_0016","module":"safety","bank":"工业安全二级","type":"single","stem":"手用工具不应放在工作台边缘是因为（ ）。","options":["取用不方便","会造成工作台超过负荷","工具易于坠落伤人"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"手用工具放在工作台边缘容易坠落伤人，应放置在工具袋或远离边缘处。"},{"id":"safety_gy_0017","module":"safety","bank":"工业安全二级","type":"single","stem":"特种设备主要包括锅炉，电梯，起重机械等，特种设备作业人员须经过( )的安全技术培训及考核，取得特种设备作业人员操作证后方可上岗。","options":["有关特种设备监督管理部门","电厂组织","国家核安全部门"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"特种设备作业人员须经特种设备监督管理部门培训考核，取得操作证后上岗。"},{"id":"safety_gy_0018","module":"safety","bank":"工业安全二级","type":"single","stem":"下列情况中，不属于违章的是（）。","options":["违反工作许可制度无票作业，包括工作票、操作票、动火许可证、辐射工作许可证、高风险作业许可证等","电气作业未验电即开展工作","拒绝领导违章指挥"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"拒绝领导违章指挥是员工的合法权利，不属于违章。"},{"id":"safety_gy_0019","module":"safety","bank":"工业安全二级","type":"single","stem":"现场存放易燃易爆品由（ ）负责监督审批。","options":["安全质量处","保卫处","生产准备处"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"现场存放易燃易爆品由保卫处负责监督审批。"},{"id":"safety_gy_0020","module":"safety","bank":"工业安全二级","type":"single","stem":"现场所有的工作结束之后作业区域都必须做到( )。","options":["风险分析","工完料尽场地清","质量鉴定"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"所有工作结束后作业区域必须做到\"工完、料尽、场地清\"。"},{"id":"safety_gy_0021","module":"safety","bank":"工业安全二级","type":"single","stem":"当电梯故障被困时应保持镇定，采取（）措施寻求帮助。","options":["大声呼救","利用警钟或对讲机","强行打开电梯门"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"电梯被困应保持镇定，利用警钟或对讲机求助，严禁强行打开电梯门。"},{"id":"safety_gy_0022","module":"safety","bank":"工业安全二级","type":"single","stem":"有限作业空间应当严格遵守‘先通风、再检测、后作业’的原则，进入密闭场所作业前，工作人员须先检测气体浓度，其中氧含量保持在（）之间，有毒有害气体、易燃易爆气体的含量应在法规的限值之下。如气体浓度不满足上述要求，应进行吹洗及通风置换，经再次测试气体浓度达标后，方可进入；严禁向容器内直接输送氧气。","options":["19.5%-21%","21%-24%","15%-18%"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"有限空间\"先通风、再检测、后作业\"，氧含量应保持在19.5%～21%之间。"},{"id":"safety_gy_0023","module":"safety","bank":"工业安全二级","type":"single","stem":"在潮湿的金属容器内，有爆炸危险的场所等处工作时，行灯电压不应超过 （ ） 。","options":["36V","6V","12V"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"潮湿金属容器、有爆炸危险场所行灯电压不应超过12V。"},{"id":"safety_gy_0024","module":"safety","bank":"工业安全二级","type":"single","stem":"在距坠落高度基准面（）有可能坠落的高处进行的作业称为高处作业。在没有栏杆的脚手架上且高度超过（）时，也应视为高处作业。高处作业必须使用安全带，并采取可靠的安全措施。","options":["5米及以上；3米","3米及以上；2米","2米及以上；1.5米"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"高处作业指距坠落基准面2米及以上；无栏杆脚手架高度超过1.5米视为高处作业。"},{"id":"safety_gy_0025","module":"safety","bank":"工业安全二级","type":"single","stem":"在易燃易爆场所作业的人员不能穿戴（ ）。","options":["尼龙工作服","纯棉工作服","防静电服"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"易燃易爆场所不能穿尼龙工作服（易产生静电），应穿纯棉或防静电服。"},{"id":"safety_gy_0026","module":"safety","bank":"工业安全二级","type":"single","stem":"作业安全规定中：在转动机械设备附近工作时，衣装不能肥大，衣服和袖口必须扣好，禁止戴围巾、领带、手套。主要是防止( )。","options":["衣服等被卷入设备而造成的伤亡事故","异物飞出伤害人体","润滑油飞溅到衣服上"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"转动设备附近收紧衣着，是防止衣服、围巾、手套被卷入旋转设备造成伤害。"},{"id":"safety_gy_0027","module":"safety","bank":"工业安全二级","type":"single","stem":"作业人员发现直接危及人身安全的紧急情况时，（）停止作业或者在采取可能的应急措施后撤离作业场所；","options":["不能","不必","有权"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"《安全生产法》赋予作业人员权：发现直接危及人身安全的紧急情况时，有权停止作业或在采取应急措施后撤离。"},{"id":"safety_gy_0028","module":"safety","bank":"工业安全二级","type":"single","stem":"公司制定有《工伤管理》程序，职工发生工伤应由职工或代理人事发后第一时间向安全质量处提交工伤认定申请报告，经安全质量处初审和公司批准后提交象山县人力社保局，由（ ）组织调查取证和工伤认定。","options":["象山县人力社保局","安全质量处","公司领导","所在处室负责人"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"工伤认定申请经公司初审批准后，提交象山县人力社保局认定（题库以所在地社保局为准）。"},{"id":"safety_gy_0029","module":"safety","bank":"工业安全二级","type":"single","stem":"集团公司安全警示日是哪一天？","options":["2月15日","3月21日","4月6日","6月1日"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"集团公司安全警示日是4月6日。"},{"id":"safety_gy_0030","module":"safety","bank":"工业安全二级","type":"single","stem":"上下楼梯时存在滑到、踏空等风险，为此，楼梯台阶需设置警示色，警示色的为（）色，在楼梯台阶的（）级设置。","options":["黄黑色、首末","黄色、首末","黄黑色、每","黄色、每"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"楼梯台阶警示色为黄色，设置在首末级台阶。"},{"id":"safety_gy_0031","module":"safety","bank":"工业安全二级","type":"single","stem":"楼梯栏杆和围栏栏杆的作用主要是防止人员跌倒和高处坠落，我公司栏杆的通用安全色是","options":["黄黑色","黄色","黑色","红白色"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"楼梯栏杆和围栏栏杆的通用安全色是黄色。"},{"id":"safety_gy_0032","module":"safety","bank":"工业安全二级","type":"single","stem":"各处室应每（ ）召开一次安全会议，生产相关科室应每（ ）开展一次安全活动或安全生产会议，班组应每（）召开班前会和班后会，每（）开展一次安全活动，并形成安全会议或活动记录。","options":["月、周、周、周","周、天、天、天","月、周、天、周","周、周、天、天"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"安全会议频次：各处室每月一次，生产相关科室每周一次安全活动，班组每天班前班后会、每周一次安全活动。"},{"id":"safety_gy_0033","module":"safety","bank":"工业安全二级","type":"single","stem":"在攀爬（）米以上的脚手架爬梯时，必须使用防坠器。","options":["2","5","8"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"攀爬5米以上脚手架爬梯时必须使用防坠器。"},{"id":"safety_gy_0034","module":"safety","bank":"工业安全二级","type":"single","stem":"‘安全生产事故隐患’定义为：‘生产经营单位违反安全生产法律、法规、规章、标准、规程和安全生产管理制度的规定，或者因其他因素在生产经营活动中存在可能导致事故发生的物的危险状态、人的不安全行为和（ ）’ 。","options":["管理上的缺陷","设计缺陷","培训不到位"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"事故隐患定义为：违反安全生产规定或因其他因素，存在导致事故发生的物的危险状态、人的不安全行为和管理上的缺陷。"},{"id":"safety_gy_0035","module":"safety","bank":"工业安全二级","type":"single","stem":"《中华人民共和国安全生产法》规定：我国的安全生产方针是（ ）。","options":["安全第一，预防为主，综合治理","安全第一，以人为本，综合治理","安全第一，质量第一，预防为主"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"我国安全生产方针：安全第一、预防为主、综合治理。"},{"id":"safety_gy_0036","module":"safety","bank":"工业安全二级","type":"single","stem":"（）全面负责所从事工作的安全生产，是现场安全工作的第一负责人。","options":["现场安全员","作业班组领导","现场工作负责人"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"现场工作负责人全面负责所从事工作的安全生产，是现场安全第一负责人。"},{"id":"safety_gy_0037","module":"safety","bank":"工业安全二级","type":"single","stem":"安全带的正确挂扣方法是( )。","options":["低挂高用","高挂低用","平挂平用"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"安全带应高挂低用（挂点高于作业位置，坠落时冲距小）。"},{"id":"safety_gy_0038","module":"safety","bank":"工业安全二级","type":"single","stem":"安全生产工作应当以（）为本，坚持安全发展。","options":["物","财产","人"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"安全生产工作以人为本，坚持安全发展。"},{"id":"safety_gy_0039","module":"safety","bank":"工业安全二级","type":"single","stem":"安全生产工作应立足于（ ）。","options":["事故调查与处理","安全检查","积极预防"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"安全生产工作应立足于积极预防（预防为主）。"},{"id":"safety_gy_0040","module":"safety","bank":"工业安全二级","type":"single","stem":"当高压设备接地故障时，室内不得接近故障点（）以内，室外不得接近故障点8m以内。进入上述范围的人员必须穿绝缘靴，接触设备的外壳和构架应戴绝缘手套。","options":["4m","5m","6m"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"高压设备接地故障时室内不得接近故障点4m以内，室外8m以内；进入范围须穿绝缘靴、戴绝缘手套。"},{"id":"safety_gy_0041","module":"safety","bank":"工业安全二级","type":"single","stem":"当现场发生人员受伤事件，当事人或目击者首先应该立即报告（）启动医学急救措施。","options":["当事人家属","相应电厂主控室","当事人朋友"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"现场发生人员受伤，应立即报告相应电厂主控室，启动医学急救。"},{"id":"safety_gy_0042","module":"safety","bank":"工业安全二级","type":"single","stem":"当员工感到身体不适或被发觉有精神状态不佳表现时，应( )工作。","options":["继续坚持","勉强维持","立即停止"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"员工身体不适或精神状态不佳时应立即停止工作（岗位适任性要求）。"},{"id":"safety_gy_0043","module":"safety","bank":"工业安全二级","type":"single","stem":"吊运较轻的材料或设备时，可以将吊具（）。","options":["挂在较粗的工艺管道上","挂在能承受重量的工艺管道上","经评估后挂在预留构件上"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"吊运较轻材料时吊具可经评估后挂在预留构件（专门吊点）上，严禁挂在工艺管道上。"},{"id":"safety_gy_0044","module":"safety","bank":"工业安全二级","type":"single","stem":"凡进入生产、施工区域的人员都必须（），穿安全鞋，长袖工作服和工作裤。","options":["戴安全帽","戴口罩","戴手套"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"凡进入生产施工区域必须戴安全帽、穿安全鞋、长袖工作服和工作裤。"},{"id":"safety_gy_0045","module":"safety","bank":"工业安全二级","type":"single","stem":"根据《工伤保险条例》，以下哪种情形可认定工伤？（）","options":["醉酒或者吸毒的","在上下班途中，受到非本人主要责任的交通事故","自残或者自杀的"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"上下班途中受到非本人主要责任的交通事故伤害可认定为工伤；醉酒吸毒、自残自杀不得认定。"},{"id":"safety_gy_0046","module":"safety","bank":"工业安全二级","type":"single","stem":"根据典型违章记分标准，下列哪种行为属于扣12分的‘红线’行为？（）","options":["工作监护人、工作负责人擅自离开作业现场","起重作业没有专人指挥","高空作业未系安全带"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"高空作业未系安全带属于扣12分的红线违章行为。"},{"id":"safety_gy_0047","module":"safety","bank":"工业安全二级","type":"single","stem":"根据违章处罚细则，以下不属于违章的是（ ）","options":["脚手架材质不合格，搭设不合格不规范","登梯作业未安排专人扶持保护","高处作业系安全带"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"高处作业系安全带是正确做法，不属于违章。"},{"id":"safety_gy_0048","module":"safety","bank":"工业安全二级","type":"single","stem":"工作期间工作负责人必须对（）的安全负责并进行监督。","options":["自己","本工作组全体工作人员","下属"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"工作期间工作负责人必须对本工作组全体工作人员的安全负责并监督。"},{"id":"safety_gy_0049","module":"safety","bank":"工业安全二级","type":"single","stem":"化学品进入眼睛后应立刻（ ），并尽可能请医生诊治。","options":["滴氯霉素眼药水","用干净手帕擦拭","用大量清水洗眼"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"化学品进入眼睛应立刻用大量清水冲洗，并尽快就医。"},{"id":"safety_gy_0050","module":"safety","bank":"工业安全二级","type":"single","stem":"进行切割、研磨作业时必须戴（ ）。","options":["防毒面具","防护眼镜或防护面罩","太阳眼镜"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"切割、研磨作业必须戴防护眼镜或防护面罩，防止飞溅物伤眼。"},{"id":"safety_gy_0051","module":"safety","bank":"工业安全二级","type":"single","stem":"领导违章指挥你应该（ ）。","options":["有权拒绝开工","必须开工","看同行"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"领导违章指挥时员工有权拒绝开工（法规赋予的权利）。"},{"id":"safety_gy_0052","module":"safety","bank":"工业安全二级","type":"single","stem":"起重机械作业时，起重臂和重物下方（ ）有人停留、工作或通过。","options":["可以","允许","严禁"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"起重机械作业时，起重臂和重物下方严禁有人停留、工作或通过。"},{"id":"safety_gy_0053","module":"safety","bank":"工业安全二级","type":"single","stem":"气瓶必须远离热源和明火。可燃及助燃性气体瓶与明火的距离一般不得小于（）米，乙炔和氧气瓶距离不得小于5米。","options":["2","10","6"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"可燃及助燃气体瓶与明火距离一般不得小于10米，乙炔瓶与氧气瓶间距不得小于5米。"},{"id":"safety_gy_0054","module":"safety","bank":"工业安全二级","type":"single","stem":"抢救触电者时，不可直接用（ ）或其他金属及潮湿的物体作为工具使触电者脱离电源。","options":["手","木棒","绝缘棒"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"抢救触电者不可直接用手拉拽（会连带触电），应用干燥木棒、绝缘棒使触电者脱离电源。"},{"id":"safety_gy_0055","module":"safety","bank":"工业安全二级","type":"single","stem":"下面哪一个不属于特种设备？ （  ）。","options":["电梯","压力容器","起重机","金属切削机床"],"answer":["D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"金属切削机床不属于特种设备；电梯、压力容器、起重机属于特种设备。"},{"id":"safety_gy_0056","module":"safety","bank":"工业安全二级","type":"single","stem":"安全环保风险的辨识和管控以危险源辨识为基础，各单位应全面排查危险源，重点排查（  ）。","options":["贵重设备所在场所","人员作业场所","具有能量（有害物质）或产生、释放能量（有害物质）的设施及场所"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"危险源排查重点排查具有能量（有害物质）的场所/部位（能量意外释放是事故根源）。"},{"id":"safety_gy_0057","module":"safety","bank":"工业安全二级","type":"single","stem":"工程建设项目风险管控原则上分为三级（  ），遵循风险等级越高管控层级越高的原则。","options":["重大风险、较大风险、一般风险","公司级、项目部级、施工班组级","一级、二级、三级"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"工程建设项目风险管控分三级：公司级、项目部级、施工班组级，风险越高管控层级越高。"},{"id":"safety_gy_0058","module":"safety","bank":"工业安全二级","type":"single","stem":"停电检修时，在一经合闸即可送电到工作地点的开关或刀闸的操作把手上，应悬挂如下哪种标示牌 ? ( )","options":["“在此工作”","“止步，高压危险 ”","“禁止合闸，有人工作 ”"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"一经合闸即可送电到工作地点的开关/刀闸操作把手上应悬挂\"禁止合闸，有人工作\"标示牌。"},{"id":"safety_gy_0059","module":"safety","bank":"工业安全二级","type":"single","stem":"下列哪种灭火器适于扑灭电气火灾 ?( )","options":["二氧化碳灭火器","干粉灭火器","泡沫灭火器"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"电气火灾适用二氧化碳灭火器（不导电、不留残迹）；泡沫灭火器导电不能用于电气火灾。"},{"id":"safety_gy_0060","module":"safety","bank":"工业安全二级","type":"single","stem":"人体在电磁场作用下，由于 ( ) 将使人体受到不同程度的伤害。","options":["电流","电压","电磁波辐射"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"人体在电磁场作用下，由于电磁波辐射将受到不同程度的伤害。"},{"id":"safety_gy_0061","module":"safety","bank":"工业安全二级","type":"single","stem":"下列关于高处作业防坠落的措施错误的是（  ）。","options":["高处作业所用的物料应堆放平稳，不得妨碍通行和装卸","工具应随手放入工具袋；作业中的走道、通道板和登高用具，应随时清理干净","拆卸下的物料及余料和废料如果数量少或体积小，可以临时在作业区域旁放置，待主体工作完成后在运走","传递物料时不得抛掷"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"拆卸下的物料及余料和废料不得随意放置（应及时清运），其余措施正确。"},{"id":"safety_gy_0062","module":"safety","bank":"工业安全二级","type":"single","stem":"下列哪项不属于脚手架作业高处坠落风险（  ）。","options":["脚手板没有满铺或铺设不稳","脚手架离墙面距离超过20cm，没有防护措施","脚手架超载损坏","操作层下铺设安全防护层"],"answer":["D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"\"操作层下铺设安全防护\"是防坠落措施，不属于坠落风险；其余三项是坠落风险因素。"},{"id":"safety_gy_0063","module":"safety","bank":"工业安全二级","type":"single","stem":"以下哪个不是高处作业高度的分类区段（  ）。","options":["2m至5m","5m以上至15m","15m以上至30m","30m以上至50m"],"answer":["D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"高处作业分类：2~5m、5~15m、15~30m及30m以上四级，\"30m以上至50m\"不是独立区段。"},{"id":"safety_gy_0064","module":"safety","bank":"工业安全二级","type":"single","stem":"光线阴暗看不清吊物以及（  ）以上强风天气不能开展起重吊装工作。","options":["5级","6级","7级"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"光线阴暗看不清吊物以及5级（题目选项为5级）以上强风天气不能开展起重吊装工作。"},{"id":"safety_gy_0065","module":"safety","bank":"工业安全二级","type":"single","stem":"在起重吊装中，选择设备吊点的依据是设备的（   ）。","options":["重量","重心","材料","外形尺寸"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"选择设备吊点的依据是设备的重心（保证吊运平稳不偏斜）。"},{"id":"safety_gy_0066","module":"safety","bank":"工业安全二级","type":"single","stem":"起重作业中，使用安全带应该（   ）。","options":["高挂低用","低挂高用","平挂平用"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"起重作业中安全带应高挂低用。"},{"id":"safety_gy_0067","module":"safety","bank":"工业安全二级","type":"single","stem":"在危险情况下，（  ）发出停车信号，起重司机应立即停车。","options":["指挥","司索","任何人"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"危险情况下任何人发出停车信号，起重司机都应立即停车（紧急停止原则）。"},{"id":"safety_gy_0068","module":"safety","bank":"工业安全二级","type":"single","stem":"钢丝绳端部用绳夹连接时，如钢丝绳公称直径为19~32mm，则钢丝绳连接处最少绳夹数量应为（  ）个，同时应保证连接强度不小于钢丝绳最小破断拉力的85%","options":["3","4","5","6"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"钢丝绳公称直径19~32mm时，绳夹连接最少用4个，连接强度不小于最小破断拉力的85%。"},{"id":"safety_gy_0069","module":"safety","bank":"工业安全二级","type":"single","stem":"对于室外作业的高大起重机应安装风速仪，风速仪应安置在起重机上部（   ）。","options":["臂架上","迎风面","背风面","最高处"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"室外高大起重机的风速仪应安装在起重机上部迎风面。"},{"id":"safety_gy_0070","module":"safety","bank":"工业安全二级","type":"single","stem":"以下哪项不是潜水刀的安全技术要求（  ）。","options":["尺寸尽量短小精悍","刀口锋利无缺口","有刀鞘保护"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"\"尺寸尽量短小精悍\"不是潜水刀安全技术要求；刀口锋利无缺口、有刀鞘保护才是要求。"},{"id":"safety_gy_0071","module":"safety","bank":"工业安全二级","type":"single","stem":"以下哪个不是涉水作业的安全风险（  ）。","options":["物体打击","高处坠落","机械伤害","坍塌"],"answer":["D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"坍塌不属于涉水作业的主要风险；物体打击、高处坠落、机械伤害才是。"},{"id":"safety_gy_0072","module":"safety","bank":"工业安全二级","type":"single","stem":"国际癌症研究中心已确认(　)为人类致癌物。","options":["硫化氢","甲烷","苯","石油"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"国际癌症研究中心已确认苯为人类致癌物。"},{"id":"safety_gy_0073","module":"safety","bank":"工业安全二级","type":"single","stem":"甲烷的爆炸极限为(　)。","options":["2％","5％-15％","10.5％-20％","18%"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"甲烷的爆炸极限为5%～15%（体积分数）。"},{"id":"safety_gy_0074","module":"safety","bank":"工业安全二级","type":"single","stem":"（  ）是有限空间作业危害控制中最重要且有效的措施之一。","options":["气体检测","机械通风","划定警戒区域","以上均不正确"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"机械通风是有限空间危害控制中最重要且有效的措施之一（持续置换新鲜空气）。"},{"id":"safety_gy_0075","module":"safety","bank":"工业安全二级","type":"single","stem":"从事有限空间作业时，现场人员必须严格执行(　)的原则，对有限空间有毒有害气体含量进行检测并全程监测，做好实时检测记录。","options":["边检测、边作业","先作业、后检测","先检测、后作业","不检测、就作业"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"有限空间作业必须\"先检测、后作业\"，检测合格才能进入，作业中全程监测。"},{"id":"safety_gy_0076","module":"safety","bank":"工业安全二级","type":"single","stem":"根据《缺氧危险作业安全规程》规定，作业场所空气中氧含量低于(  )时视为缺氧环境。","options":["16%","18%","19.5%","23.5%"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"《缺氧危险作业安全规程》：空气中氧含量低于19.5%视为缺氧环境（题库标注答案）。"},{"id":"safety_gy_0077","module":"safety","bank":"工业安全二级","type":"single","stem":"拆除脚手架时的拆除顺序是（   ）。","options":["先搭的后拆、后搭的先拆","先搭的先拆、后搭的后拆","不分先搭、后搭同时拆除"],"answer":["A"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"拆除脚手架顺序：先搭的后拆、后搭的先拆（与搭设顺序相反，自上而下）。"},{"id":"safety_gy_0078","module":"safety","bank":"工业安全二级","type":"single","stem":"根据《危险性较大的分部分项工程安全管理规定》的规定，搭设高度（  ）米及以上的落地式钢管脚手架工程属于危险性较大的分部分项工程。","options":["22","23","24","25"],"answer":["C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"搭设高度24米及以上的落地式钢管脚手架工程属于危险性较大的分部分项工程。"},{"id":"safety_gy_0079","module":"safety","bank":"工业安全二级","type":"single","stem":"扣件式钢管脚手架搭设时，脚手架立杆顶端外排立杆宜高出女儿墙上端（  ）。","options":["0.3m","0.5m","0.8m","1.0m"],"answer":["D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"脚手架立杆顶端外排立杆宜高出女儿墙上端1.0m。"},{"id":"safety_gy_0080","module":"safety","bank":"工业安全二级","type":"single","stem":"脚手板应铺设牢靠、严实，并应用安全网双层兜底。施工层以下每隔（  ）应用安全网封闭。","options":["8m","10m","12m","14m"],"answer":["B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"脚手板应铺设牢靠严实并双层安全网兜底，施工层以下每隔10m用安全网封闭。"},{"id":"safety_gy_0081","module":"safety","bank":"工业安全二级","type":"multi","stem":"在转动设备附近工作时，应注意做到( )。","options":["衣装不能肥大","衣服和袖口必须扣好","禁止戴围巾、领带","女同志要将辫子藏在工作帽中"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"转动设备附近：衣装不能肥大、袖口扣好、禁戴围巾领带、长发辫子藏入工作帽，四项全部正确。"},{"id":"safety_gy_0082","module":"safety","bank":"工业安全二级","type":"multi","stem":"下面关于气瓶使用的安全规定说法正确的是( )。","options":["气瓶在运输、使用过程必须轻拿轻放，不得采用抛、滑、滚、碰等作业方式；","气瓶必须远离热源、明火，可燃性气瓶与明火的距离一般不得少于10米；","瓶内气体不能用尽，必须留有剩余压力，永久性气体气瓶的剩余压力，应不小于0.05MPa；","工作人员在使用之前必须了解气瓶内的气体危害。"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"气瓶运输使用轻拿轻放、远离热源明火、瓶内气体不能用尽留余压、使用前了解性质，全部正确。"},{"id":"safety_gy_0083","module":"safety","bank":"工业安全二级","type":"multi","stem":"下面关于高处作业的安全规定说法正确的是( )。","options":["能在地面上做好的工作，尽量在地面上做，以减少高处作业；","工作人员只要身体健康，少量饮酒之后可以从事高处作业。","禁止采用上下抛掷的方式传递工器具及材料，禁止携物攀爬，应用绳系牢后往下或往上吊送，以免坠物伤人。","高处作业只要搭建了脚手架，工作人员可以不系安全带。"],"answer":["A","C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"能在地面做好的工作不在高处做、禁止上下抛掷传递物料正确；\"只要身体健康\"\"搭了脚手架就不用安全带\"错误。"},{"id":"safety_gy_0084","module":"safety","bank":"工业安全二级","type":"multi","stem":"下列哪种操作是不正确的? ( )。","options":["戴褐色眼镜从事电焊","操作机床时，戴防护手套","佩戴纱布手套进行酸碱作业","穿高压绝缘靴进行电气作业"],"answer":["A","B","C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"戴褐色眼镜电焊（应用专业护目镜）、机床戴手套（卷入风险）、纱布手套接触酸碱（腐蚀渗透）均不正确。"},{"id":"safety_gy_0085","module":"safety","bank":"工业安全二级","type":"multi","stem":"为了有效地预防事故的发生，必须做到( )。","options":["树立安全意识","掌握安全技能","保持良好的精神状态","正确使用个人劳动保护用品","遵守安全规章制度"],"answer":["A","B","C","D","E"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"预防事故五要素：安全意识、安全技能、良好精神状态、正确使用劳保用品、遵守规章制度，全选。"},{"id":"safety_gy_0086","module":"safety","bank":"工业安全二级","type":"multi","stem":"以下属于公司工业安全二级高风险作业和种类的是:（ ）。","options":["一般有限空间作业","一般高空作业","液氮冰塞作业","水（井）下作业"],"answer":["A","B","C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"一般有限空间作业、一般高空作业、液氮冰塞作业属于公司工业安全二级高风险作业；水（井）下作业不属于二级清单。"},{"id":"safety_gy_0087","module":"safety","bank":"工业安全二级","type":"multi","stem":"起重作业时，下列哪些情况不能吊( )。","options":["吊物边缘锋利且无防护措施","吊扎不牢、指挥信号不明","吊物上站人","埋在地下的构件"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"吊物边缘锋利无防护、吊扎不牢指挥不明、吊物上站人、埋在地下构件等情况都不能吊，全选。"},{"id":"safety_gy_0088","module":"safety","bank":"工业安全二级","type":"multi","stem":"有限空间作业必须( )。","options":["办理工业安全高风险作业许可证；","必须指定至少有一名监护人；","在工作前对容器内的氧气、有毒有害气体和易燃易爆气体含量进行测量","在密闭场所内使用的照明电压不得大于36伏，在潮湿的金属容器内，有爆炸危险的场所等处工作时，不应超过12V。"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"有限空间作业须办高风险作业票、至少一名监护、检测氧含量和有害气体、使用合规照明，全选。"},{"id":"safety_gy_0089","module":"safety","bank":"工业安全二级","type":"multi","stem":"下列哪些情况可以认定为工伤 (   )。","options":["在工作时间和工作场所内，因工作原因受到事故伤害的","工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的","在工作时间和工作场所内，因履行工作职责受到暴力等意外伤害的","患职业病的","因工外出期间，由于工作原因受到伤害或者发生事故下落不明的","在上下班途中，受到非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害的"],"answer":["A","B","C","D","E","F"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"工作时间场所因工受伤、工作时间前后预备收尾受伤、履职受暴力伤害、职业病、因工外出受伤、上下班非主责交通事故，均可认定工伤，全选。"},{"id":"safety_gy_0090","module":"safety","bank":"工业安全二级","type":"multi","stem":"下列哪些情形视同工伤(   )。","options":["在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的","在抢险救灾等维护国家利益、公共利益活动中受到伤害的","职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的","上班期间因醉酒受到事故伤害"],"answer":["A","B","C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"工作时间岗位突发疾病48小时内抢救无效死亡、抢险救灾受伤、军队旧伤复发，视同工伤；醉酒受伤不算。"},{"id":"safety_gy_0091","module":"safety","bank":"工业安全二级","type":"multi","stem":"进入生产区域作业人员必须穿着（ ）。","options":["安全帽","安全鞋","长袖工作服","工作裤","短袖工作服"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"进入生产区域必须穿安全帽、安全鞋、长袖工作服、工作裤（不包括短袖）。"},{"id":"safety_gy_0092","module":"safety","bank":"工业安全二级","type":"multi","stem":"起重作业属风险较高的作业，起重作业必须( )。","options":["思想集中、上下联系好","机器要检查好，将吊物扎紧","统一指挥","戴防护眼镜"],"answer":["A","B","C"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"起重作业必须思想集中联系好、机器检查好、统一指挥；\"戴防护眼镜\"不是起重作业要求。"},{"id":"safety_gy_0093","module":"safety","bank":"工业安全二级","type":"multi","stem":"按照隐患产生的原因，隐患一般分为四种类型，即(   )。","options":["人的不安全行为","物的不安全状态","环境的不安全因素","管理上的缺陷"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"按产生原因隐患分四类：人的不安全行为、物的不安全状态、环境的不安全因素、管理上的缺陷，全选。"},{"id":"safety_gy_0094","module":"safety","bank":"工业安全二级","type":"multi","stem":"使用电气工具时，不准提着电气工具的(   )部分。","options":["把手（手柄）","转动","绝缘外壳","导线"],"answer":["B","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"使用电气工具不准提着转动部分和导线（把手、绝缘外壳可以握持）。"},{"id":"safety_gy_0095","module":"safety","bank":"工业安全二级","type":"multi","stem":"有下列哪种情况时，必须加装工作接地线或使用个人保安线(   )。","options":["因设备平行布置导致检修设备可能产生感应电压时","工作人员的工作地点不能直接看到接地线时","因检修设备邻近带电设备导致检修设备可能产生感应电压时","站内工作地点与所装接地线的距离大于10 m时"],"answer":["A","B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"平行布置感应电、工作地点看不到接地线、邻近带电设备、与接地线距离远等情况，都须加装工作接地线或个人保安线，全选。"},{"id":"safety_gy_0096","module":"safety","bank":"工业安全二级","type":"multi","stem":"脚手架按平、立杆的连接方式划分可分为(   )。","options":["承插式脚手架","扣接式脚手架","操作（作业）脚手架","防护用脚手架","承重、支撑用脚手架"],"answer":["A","B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"脚手架按平立杆连接方式分为承插式和扣接式；操作/防护/承重是按用途划分。"},{"id":"safety_gy_0097","module":"safety","bank":"工业安全二级","type":"multi","stem":"脚手板的铺设应采用(   )。","options":["对接平铺","搭接铺设","对接立铺","随意铺设","焊接铺设"],"answer":["A","B"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"脚手板应采用对接平铺或搭接铺设（不能立铺、随意铺、焊接）。"},{"id":"safety_gy_0098","module":"safety","bank":"工业安全二级","type":"multi","stem":"下列属于防坠落护具的有(   )。","options":["安全帽","安全带","安全网","密目式安全立网"],"answer":["B","C","D"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"防坠落护具包括安全带、安全网、密目式安全立网；安全帽是防打击护具。"},{"id":"safety_gy_0099","module":"safety","bank":"工业安全二级","type":"judge","stem":"根据新《安全生产法》要求，有关生产经营单位按照规定提取和使用的安全生产费用，用于改善安全生产条件，也可以改善职工待遇。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。安全生产费用专门用于改善安全生产条件，不得挪作他用（不能用于改善职工待遇）。"},{"id":"safety_gy_0100","module":"safety","bank":"工业安全二级","type":"judge","stem":"根据新《安全生产法》要求，生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一座建筑物内，并应当与员工宿舍保持安全距离。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。危险物品车间、商店、仓库不得与员工宿舍在同一建筑物内，并保持安全距离。"},{"id":"safety_gy_0101","module":"safety","bank":"工业安全二级","type":"judge","stem":"根据新《安全生产法》要求，生产经营单位的安全生产管理人员在检查中发现重大事故隐患，应向本单位有关负责人报告，有关负责人不及时处理的，安全生产管理人员可以向主管的负有安全生产监督管理职责的部门报告。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。发现重大隐患应报告，负责人不及时处理时安全管理人员可向主管的负有安全生产监督管理职责的部门报告。"},{"id":"safety_gy_0102","module":"safety","bank":"工业安全二级","type":"judge","stem":"在消防主干道上的动土作业，必须分步施工，确保消防车顺利通行。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。消防主干道动土作业必须分步施工，确保消防车通行。"},{"id":"safety_gy_0103","module":"safety","bank":"工业安全二级","type":"judge","stem":"塔式起重机的机体已经接地，其电气设备的外露可导电部分可不再与PE线连接。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。塔机机体接地不能替代电气设备外露可导电部分与PE线的连接（各自独立要求）。"},{"id":"safety_gy_0104","module":"safety","bank":"工业安全二级","type":"judge","stem":"爆破作业的起爆点应设置在避炮掩体内或设置在警戒区域外的安全地点。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。起爆点应设在避炮掩体内或警戒区外安全地点。"},{"id":"safety_gy_0105","module":"safety","bank":"工业安全二级","type":"judge","stem":"断路作业可以不办理作业审批许可。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。断路作业必须办理作业审批许可。"},{"id":"safety_gy_0106","module":"safety","bank":"工业安全二级","type":"judge","stem":"A、B 级爆破工程，都应成立爆破指挥部，全面指挥和统筹安排爆破工程的各项工作。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。A、B级爆破工程应成立爆破指挥部统一指挥。"},{"id":"safety_gy_0107","module":"safety","bank":"工业安全二级","type":"judge","stem":"在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的可以视同工伤","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。工作时间和岗位突发疾病死亡或48小时内抢救无效死亡视同工伤。"},{"id":"safety_gy_0108","module":"safety","bank":"工业安全二级","type":"judge","stem":"在上下班途中，受到任何交通事故伤害都可以被认定为工伤。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。上下班途中只有受到\"非本人主要责任\"的交通事故伤害才能认定工伤。"},{"id":"safety_gy_0109","module":"safety","bank":"工业安全二级","type":"judge","stem":"职工受到事故伤害或突发疾病死亡的，由公司安全质量处组织调查取证和工伤认定。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。工伤认定由社会保险行政部门（人社局）组织，不是公司安全质量处认定。"},{"id":"safety_gy_0110","module":"safety","bank":"工业安全二级","type":"judge","stem":"现场工业安全高风险（ISP1\\ISP2）作业过程中，禁止携带和使用手机，需交由专人（如监护人）保管。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。高风险作业（ISP1/ISP2）过程中禁止携带使用手机，交专人保管。"},{"id":"safety_gy_0111","module":"safety","bank":"工业安全二级","type":"judge","stem":"在上下楼过程中只要扶好扶手，注意周边环境，就可以接打电话或使用手机。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。上下楼过程中不得接打电话或使用手机（注意力分散）。"},{"id":"safety_gy_0112","module":"safety","bank":"工业安全二级","type":"judge","stem":"上下楼梯时宜靠右行走并手握扶手，不得接打电话或使用手机。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。上下楼梯靠右行走、手握扶手、不接打电话。"},{"id":"safety_gy_0113","module":"safety","bank":"工业安全二级","type":"judge","stem":"《中共中央国务院关于推进安全生产领域改革发展的意见》中强调安全生产责任‘三管三必须’，谁主管谁负责的原则，三管三必须具体为：管行业必须管安全、管业务必须管安全、管生产经营必须管安全。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。\"三管三必须\"：管行业必须管安全、管业务必须管安全、管生产经营必须管安全。"},{"id":"safety_gy_0114","module":"safety","bank":"工业安全二级","type":"judge","stem":"安全带使用时，可以将安全绳打结使用。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。安全带安全绳严禁打结使用（强度下降）。"},{"id":"safety_gy_0115","module":"safety","bank":"工业安全二级","type":"judge","stem":"带电设备着火时，不需将电源切断，就可以进行救火。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。带电设备着火必须先切断电源再灭火（防止触电）。"},{"id":"safety_gy_0116","module":"safety","bank":"工业安全二级","type":"judge","stem":"凡是高处作业必须佩戴安全带，安全带在使用之前应当仔细检查，不得使用有变形、破损等缺陷的安全带。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。高处作业必须佩戴安全带，使用前仔细检查，有变形破损缺陷的禁用。"},{"id":"safety_gy_0117","module":"safety","bank":"工业安全二级","type":"judge","stem":"敷设临时配电线路应遵循整理、固定、高架、紧贴墙根的原则，过通道、道路、门等必须进行保护。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。临时配电线路应整理、固定、高架、紧贴墙根，过通道道路门须保护。"},{"id":"safety_gy_0118","module":"safety","bank":"工业安全二级","type":"judge","stem":"高处作业时，为防止工具从高处落下发生意外，需用工具袋携带工具，作业时将工具用绳拴在腕部或固定在高处。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。高处作业用工具袋携带工具，工具拴手绳或固定，防止坠落。"},{"id":"safety_gy_0119","module":"safety","bank":"工业安全二级","type":"judge","stem":"工作期间应确保所有电气设备的金属外壳均有良好的接地装置。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。工作期间确保所有电气设备金属外壳良好接地。"},{"id":"safety_gy_0120","module":"safety","bank":"工业安全二级","type":"judge","stem":"工作人员在维修工作开始前应仔细检查工器具，对有缺陷或超过检验周期的工器具也可适当使用。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。有缺陷或超检验周期的工器具禁止使用。"},{"id":"safety_gy_0121","module":"safety","bank":"工业安全二级","type":"judge","stem":"工作中要注意保护好现场的设备标牌，不得故意损坏或遗弃，如发现设备标牌有损坏或丢失的，应及时报告。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。保护好现场设备标牌，损坏丢失及时报告。"},{"id":"safety_gy_0122","module":"safety","bank":"工业安全二级","type":"judge","stem":"工作组成员在现场开展工作之前应当留心周围的安全标识，了解现场可能存在的工业安全风险。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。开展工作前应留心周围安全标识，了解现场工业安全风险。"},{"id":"safety_gy_0123","module":"safety","bank":"工业安全二级","type":"judge","stem":"脚手架的搭建必须由专业人员实施。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。脚手架搭建必须由专业人员实施。"},{"id":"safety_gy_0124","module":"safety","bank":"工业安全二级","type":"judge","stem":"开关气瓶阀时要慢开、慢关，开时要站在阀门的侧面，开关有毒气瓶时应站在上风处。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。开关气瓶阀慢开慢关、站阀门侧面，有毒气瓶站上风处。"},{"id":"safety_gy_0125","module":"safety","bank":"工业安全二级","type":"judge","stem":"开展任何工作都应事先进行风险分析，对于风险较大的工作还应制定详细的防护措施和安全计划。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。任何工作都应事先风险分析，风险大的制定详细防护措施和安全计划。"},{"id":"safety_gy_0126","module":"safety","bank":"工业安全二级","type":"judge","stem":"坑洞作业区域应当设置安全警戒线和硬质隔离措施并张挂安全警示牌，防止无关人员意外闯入。如遇夜间施工，需在作业区附近设置醒目的红色照明警示灯具和交通指示标志。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。坑洞作业区设警戒线硬质隔离挂警示牌，夜间设红色照明警示灯和交通指示标志。"},{"id":"safety_gy_0127","module":"safety","bank":"工业安全二级","type":"judge","stem":"临时电源线穿越通道、门洞时必须设置保护措施。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。临时电源线穿越通道门洞必须设保护措施。"},{"id":"safety_gy_0128","module":"safety","bank":"工业安全二级","type":"judge","stem":"有限空间作业必须做到‘先通风、再检测、后作业’，严禁通风、检测不合格作业。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。有限空间\"先通风、再检测、后作业\"，严禁通风检测不合格作业。"},{"id":"safety_gy_0129","module":"safety","bank":"工业安全二级","type":"judge","stem":"起重机械和安全装置必须完备、灵敏、可靠。对起重机械和电路要进行定期维护和保养，及时排除故障。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。起重机械和安全装置必须完备灵敏可靠，定期维护保养及时排除故障。"},{"id":"safety_gy_0130","module":"safety","bank":"工业安全二级","type":"judge","stem":"气瓶在运输和装卸过程中，必须佩戴好瓶帽，轻装轻卸，严禁抛、滑、滚、碰。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。气瓶运输装卸戴瓶帽、轻装轻卸，严禁抛滑滚碰。"},{"id":"safety_gy_0131","module":"safety","bank":"工业安全二级","type":"judge","stem":"使用电气工具时，因故离开工作场所或暂时停止工作以及遇到临时停电时，不必切断电源。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。使用电气工具离开、暂停或停电时必须切断电源。"},{"id":"safety_gy_0132","module":"safety","bank":"工业安全二级","type":"judge","stem":"使用化学品之前必须了解化学品的性质、危害、安全注意事项和应急处理方法。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确.使用化学品前必须了解性质、危害、注意事项和应急处理方法。"},{"id":"safety_gy_0133","module":"safety","bank":"工业安全二级","type":"judge","stem":"为了取用方便，手用工具应放置在工作台边缘。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。手用工具不应放工作台边缘（易坠落伤人）。"},{"id":"safety_gy_0134","module":"safety","bank":"工业安全二级","type":"judge","stem":"蓄电池组定期试验、维修过程中，存在酸和氢释出，现场作业时，可以用铁制的工具猛烈地进行敲打作业。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。蓄电池作业存在酸和氢气释出，严禁铁制工具猛烈敲打（火花引爆氢气）。"},{"id":"safety_gy_0135","module":"safety","bank":"工业安全二级","type":"judge","stem":"严禁酒后进入施工现场。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。严禁酒后进入施工现场。"},{"id":"safety_gy_0136","module":"safety","bank":"工业安全二级","type":"judge","stem":"因工作现场条件的限制，可以不按照原有的设计功能使用工器具，比如现场没有螺丝刀的情况下，可以用钳子去拧螺帽。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。工器具必须按设计功能使用，不得违章替代（如用钳子拧螺帽）。"},{"id":"safety_gy_0137","module":"safety","bank":"工业安全二级","type":"judge","stem":"用梯子登高作业时，梯子必须检定合格，并要有人扶持保护。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。梯子登高须检定合格并有人扶持保护。"},{"id":"safety_gy_0138","module":"safety","bank":"工业安全二级","type":"judge","stem":"在贯彻‘安全第一’的时候，应当以设备为中心，将设备的安全放在第一位。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。贯彻\"安全第一\"应以人为中心，将人的安全放在第一位。"},{"id":"safety_gy_0139","module":"safety","bank":"工业安全二级","type":"judge","stem":"在进行高处作业或起重、吊运作业时，禁止他人在工作地点或起重吊物下面停留或行走。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。高处作业或吊运时禁止他人在工作地点或吊物下停留行走。"},{"id":"safety_gy_0140","module":"safety","bank":"工业安全二级","type":"judge","stem":"在软梯上只准同时一个人上下，并应有安全带以及防坠器等附加的安全措施，使用软梯的人员，衣着必须灵便。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。软梯一次只准一人上下，配安全带防坠器，衣着灵便。"},{"id":"safety_gy_0141","module":"safety","bank":"工业安全二级","type":"judge","stem":"在梯子上工作时，梯子与地面的夹角以60度为宜，工作人员必须登在距梯顶不少于1m的梯蹬上工作。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。梯子与地面夹角60度为宜，登在距梯顶不少于1m的梯蹬上工作。"},{"id":"safety_gy_0142","module":"safety","bank":"工业安全二级","type":"judge","stem":"《安全质量环保考核和问责管理》规定：厂家服务人员、参观人员违章，业务接口管理处室承担全部责任。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。厂家服务人员、参观人员违章，业务接口管理处室承担全部责任。"},{"id":"safety_gy_0143","module":"safety","bank":"工业安全二级","type":"judge","stem":"隐患排查反差率指在一定时期内，单位自查的隐患数量与上级单位检查本单位发现的隐患数量和本单位自查的隐患数量之和的百分比值。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。这是隐患排查反差率的定义：自查隐患数/（上级检查发现+自查）×100%。"},{"id":"safety_gy_0144","module":"safety","bank":"工业安全二级","type":"judge","stem":"使用国家明令淘汰、禁止使用的危及作业安全的工艺、设备、材料的不判定为重大隐患。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。使用国家明令淘汰、禁止使用的危及安全的工艺设备材料应判定为重大隐患。"},{"id":"safety_gy_0145","module":"safety","bank":"工业安全二级","type":"judge","stem":"在潮湿或高温或有导电灰尘的场所，应该用正常电压供电。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。潮湿、高温、导电灰尘场所应使用安全电压（降低电压）供电，不能用正常电压。"},{"id":"safety_gy_0146","module":"safety","bank":"工业安全二级","type":"judge","stem":"在使用手电钻、电砂轮等手持电动工具时，为保证安全，应该装设漏电保护器。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。手持电动工具应装设漏电保护器。"},{"id":"safety_gy_0147","module":"safety","bank":"工业安全二级","type":"judge","stem":"当采取不停电工作方式进行电气装置的检查、 维护以及修理时， 应在电气装置及工作区域挂设警告标志或警告标志。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。不停电检修时应在电气装置及工作区域挂设警告标志。"},{"id":"safety_gy_0148","module":"safety","bank":"工业安全二级","type":"judge","stem":"电工可以穿防静电鞋工作。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。电工不应穿防静电鞋工作（绝缘要求，防静电鞋导电性对电工危险）。"},{"id":"safety_gy_0149","module":"safety","bank":"工业安全二级","type":"judge","stem":"安全防护设施的验收应按新旧程度逐项检查，验收合格后方可使用，并应作出验收记录。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。安全防护设施验收应按标准逐项检查（不是按新旧程度），合格后方可使用。"},{"id":"safety_gy_0150","module":"safety","bank":"工业安全二级","type":"judge","stem":"防护栏杆应张挂密目式安全立网。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。防护栏杆应张挂密目式安全立网。"},{"id":"safety_gy_0151","module":"safety","bank":"工业安全二级","type":"judge","stem":"不得两人同时在梯子上作业。在通道处使用梯子作业时，应有专人监护或设置围栏。脚手架操作层上可以使用梯子进行作业。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。脚手架操作层上不得使用梯子进行作业（其余说法正确）。"},{"id":"safety_gy_0152","module":"safety","bank":"工业安全二级","type":"judge","stem":"移动式操作平台在移动时，操作平台上不得站人。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。移动式操作平台移动时平台上不得站人。"},{"id":"safety_gy_0153","module":"safety","bank":"工业安全二级","type":"judge","stem":"在高处作业过程中建议使用三点式双钩安全带。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。高处作业应使用全身式（五点式）安全带，不建议三点式（三点式坠落时可能滑脱伤人）。"},{"id":"safety_gy_0154","module":"safety","bank":"工业安全二级","type":"judge","stem":"几台千斤顶同时使用时，通常考虑取千斤顶额定起重量的0.5~0.75倍。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。多台千斤顶同时使用时按额定起重量的0.5~0.75倍考虑（留裕量保证同步均衡）。"},{"id":"safety_gy_0155","module":"safety","bank":"工业安全二级","type":"judge","stem":"不要在易爆环境，如有易燃液体、气体或粉尘的环境下操作电动工具。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。易燃液体、气体或粉尘的易爆环境下禁止操作电动工具（电火花引爆）。"},{"id":"safety_gy_0156","module":"safety","bank":"工业安全二级","type":"judge","stem":"梯子仅限于4m以下的登高或短时间内可完成的轻工作，不得挪作他用。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。梯子仅限4m以下登高或短时间轻工作，不得挪作他用。"},{"id":"safety_gy_0157","module":"safety","bank":"工业安全二级","type":"judge","stem":"高处作业8m（含8m）以上必须使用防坠器，8m以下推荐使用防坠器。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。按公司规定攀爬高处作业防坠器使用要求以现行程序为准（题库标注本题错误：8m含以上必须使用防坠器的说法不准确）。"},{"id":"safety_gy_0158","module":"safety","bank":"工业安全二级","type":"judge","stem":"禁止两人以上(包括两人)同时攀爬同一爬梯，防止上方人员或物品意外坠落对下方人员造成伤害。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。禁止两人以上同时攀爬同一爬梯，防止上方人员物品坠落伤人。"},{"id":"safety_gy_0159","module":"safety","bank":"工业安全二级","type":"judge","stem":"液压系统应有防止过载和冲击的安全装置。采用溢流阀时，溢流阀的最高工作压力不得大于系统最大工作压力的1.5倍，同时不得大于液压泵的额定压力。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。溢流阀最高工作压力不得大于系统最大工作压力（题库标注：该\"1.5倍\"说法错误）。"},{"id":"safety_gy_0160","module":"safety","bank":"工业安全二级","type":"judge","stem":"当实际起重量超过实际幅度所对应的起重量的额定值的95%时，起重力矩限制器宜发出报警信号。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。实际起重量超过额定值95%时，起重力矩限制器宜发出报警信号。"},{"id":"safety_gy_0161","module":"safety","bank":"工业安全二级","type":"judge","stem":"室外工作的起重机,通道与平台上应采取防积水措施。通道与平台踏面应具有防滑性能。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。室外起重机通道平台应防积水、踏面防滑。"},{"id":"safety_gy_0162","module":"safety","bank":"工业安全二级","type":"judge","stem":"潜水空气压缩供气设备配备一套，1台电动潜水空压机、1台柴油动力潜水空压机。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。潜水供气设备应配备两套（一用一备），仅一套不满足安全要求。"},{"id":"safety_gy_0163","module":"safety","bank":"工业安全二级","type":"judge","stem":"潜水照料员在潜水员入出水期间要全程保持手握作业潜水员脐带和安全绳，限制潜水员在安全的释放距离范围内。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。潜水照料员全程手握脐带和安全绳，限制潜水员安全释放距离。"},{"id":"safety_gy_0164","module":"safety","bank":"工业安全二级","type":"judge","stem":"水上作业平台周边必须设置防护栏杆，人员上下通道必须设安全防护措施并设置多条安全通道。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。水上作业平台周边设防护栏杆，上下通道设防护并留多条安全通道。"},{"id":"safety_gy_0165","module":"safety","bank":"工业安全二级","type":"judge","stem":"烟道和锅炉内易存在缺氧、一氧化碳（CO）中毒危害。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。烟道和锅炉内容易缺氧并存在一氧化碳中毒危害。"},{"id":"safety_gy_0166","module":"safety","bank":"工业安全二级","type":"judge","stem":"有限空间内不适合人员在内长时间工作，人员仅仅是在少数必须的情况下才进入有限空间实施作业。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。有限空间不适合长时间工作，仅在必须时进入作业。"},{"id":"safety_gy_0167","module":"safety","bank":"工业安全二级","type":"judge","stem":"进行气体检测时，在有限空间底部要重点检测甲烷。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。有限空间底部比空气重的气体（如硫化氢、CO₂）积聚，底部应重点检测比空气重的气体；甲烷比空气轻积聚在上部。"},{"id":"safety_gy_0168","module":"safety","bank":"工业安全二级","type":"judge","stem":"某有限空间检测氧含量仅有1.8%，应使用纯氧通风快速提高环境内氧气含量。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误.严禁用纯氧通风（富氧环境剧烈燃烧爆炸风险），应用新鲜空气通风。"},{"id":"safety_gy_0169","module":"safety","bank":"工业安全二级","type":"judge","stem":"存在可燃气体的有限空间，应使用防爆风机进行通风。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确.存在可燃气体的有限空间应使用防爆风机通风。"},{"id":"safety_gy_0170","module":"safety","bank":"工业安全二级","type":"judge","stem":"作业者佩戴的安全帽，要有下颏带和后颈箍并应拴牢，以防帽子滑落与脱掉。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。安全帽要有下颏带和后颈箍并拴牢，防止滑落脱掉。"},{"id":"safety_gy_0171","module":"safety","bank":"工业安全二级","type":"judge","stem":"现场止血方法常用的有三种：指压止血法、加压包扎止血法和止血带止血法。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。常用止血方法不止三种（还有加垫屈肢止血法、止血带止血法等），题库标注该说法错误。"},{"id":"safety_gy_0172","module":"safety","bank":"工业安全二级","type":"judge","stem":"对中毒窒息人员实施救护时，应先使伤员尽快脱离有毒有害气体危险环境。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。救护中毒窒息人员应先使其尽快脱离有毒有害环境再施救。"},{"id":"safety_gy_0173","module":"safety","bank":"工业安全二级","type":"judge","stem":"所有有限空间作业，作业者作业时间均不得超过30min。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。有限空间作业时间根据检测结果和作业性质确定，并非一律不超过30min。"},{"id":"safety_gy_0174","module":"safety","bank":"工业安全二级","type":"judge","stem":"生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。生产经营单位必须提供符合标准的劳动防护用品，并监督教育正确佩戴使用。"},{"id":"safety_gy_0175","module":"safety","bank":"工业安全二级","type":"judge","stem":"某新建电缆管沟深为8m，进入其内实施电缆敷设作业可能存在高处坠落的风险，不存在窒息和中毒的风险。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。深8m电缆管沟既存在高处坠落风险，也存在缺氧窒息和中毒风险（深度越大气体积聚风险越高）。"},{"id":"safety_gy_0176","module":"safety","bank":"工业安全二级","type":"judge","stem":"发生有限空间事故后，必须采取进入式救援的，救援人员自身安全得到保障的情况下才可进入有限空间实施救援。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。有限空间事故必须进入救援时，救援人员自身安全有保障方可进入（严禁盲目施救）。"},{"id":"safety_gy_0177","module":"safety","bank":"工业安全二级","type":"judge","stem":"施工现场“三宝”是安全帽、安全带、脚手架。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。施工现场\"三宝\"是安全帽、安全带、安全网（脚手架是\"三宝\"之外的设施）。"},{"id":"safety_gy_0178","module":"safety","bank":"工业安全二级","type":"judge","stem":"脚手架搭设和拆除人员应正确佩戴安全帽、双钩安全带和防滑鞋。高处作业时应确保安全带至少有一个挂钩处于高挂低用的钩挂状态，使用的工具应系手绳。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。脚手架搭拆人员戴安全帽、双钩安全带、防滑鞋，安全带至少一钩高挂低用，工具系手绳。"},{"id":"safety_gy_0179","module":"safety","bank":"工业安全二级","type":"judge","stem":"根据厂内门式架材料的现状，为避免倾倒风险，门式钢管脚手架的搭设层数不应超过3层。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。门式钢管脚手架搭设层数限制以现行规范/评估为准（题库标注\"不超过3层\"说法错误）。"},{"id":"safety_gy_0180","module":"safety","bank":"工业安全二级","type":"judge","stem":"脚手架所用钢管上可以打孔。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。脚手架钢管严禁打孔（削弱强度）。"},{"id":"safety_gy_0181","module":"safety","bank":"工业安全二级","type":"judge","stem":"在施工作业层外侧周边应设置180mm高的挡脚板和两道栏杆，上道栏杆高度应为1.5m，下道栏杆应居中设置。挡脚板和栏杆均应设置在门架立杆的内侧。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误.挡脚板高度应为180mm、上道栏杆1.2m（题库标注：挡脚板和栏杆应设置在门架立杆的外侧，\"内侧\"说法错误）。"},{"id":"safety_gy_0182","module":"safety","bank":"工业安全二级","type":"judge","stem":"木方、砖块、脚手架管等物品堆码高度不得超过1.8米。","options":null,"answer":["错误"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"错误。木方、砖块、脚手架管等堆码高度不得超过1.5米（不是1.8米）。"},{"id":"safety_gy_0183","module":"safety","bank":"工业安全二级","type":"judge","stem":"石材切割机护罩无法防护工件下方的锯片，操作人员不得接触工件的下面，确保使用安全。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。石材切割机护罩无法防护工件下方锯片，操作人员不得接触工件下面。"},{"id":"safety_gy_0184","module":"safety","bank":"工业安全二级","type":"judge","stem":"多台塔吊时，在水平和垂直两个方向上都要保证不少于1.5m的安全距离，并设置防碰撞措施。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。多台塔吊水平和垂直方向保持不少于1.5m安全距离，并设防碰撞措施。"},{"id":"safety_gy_0185","module":"safety","bank":"工业安全二级","type":"judge","stem":"动土作业使用的材料、挖出的泥土应堆放在距坑、槽、井、沟边沿至少1m处，堆土高度不得大于1.5m，挖出的泥土不应堵塞下水道和窨井。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。动土作业材料挖土堆放距坑槽边沿至少1m，堆土高度不大于1.5m，不堵塞下水道窨井。"},{"id":"safety_gy_0186","module":"safety","bank":"工业安全二级","type":"judge","stem":"涉及断路作业在道路上进行定点作业，白天不超过 2h，夜间不超过1h 即可完工的，在有现场交通指挥人员指挥交通的情况下，只要作业区设置了完善的安全设施，可不设警示标志。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。断路定点作业白天不超2h、夜间不超1h，有交通指挥且安全设施完善时可不开具断路作业许可（按题库标准）。"},{"id":"safety_gy_0187","module":"safety","bank":"工业安全二级","type":"judge","stem":"断路作业是指生产区域内，交通主、支路与车间引道上进行工程施工、吊装、调运等各种影响正常交通的作业。","options":null,"answer":["正确"],"score":null,"source":"official","origin":"工业安全二级题库.xls","explanation":"正确。这是断路作业的定义：交通主、支路与车间引道上影响正常交通的作业。"},{"id":"safety_fs_0001","module":"safety","bank":"辐射防护二级","type":"single","stem":"未经辐射防护审批或者超出审批范围转移或带出放射源或放射性物质，一次性扣（）。","options":["4分","6分","9分","12分"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"未经审批或超范围转移、带出放射源或放射性物质属红线违章，一次性扣12分。"},{"id":"safety_fs_0002","module":"safety","bank":"辐射防护二级","type":"single","stem":"工作人员进入辐射控制区工作，均要佩戴电子剂量计和热释光剂量计，它们统一佩戴在（  ）。","options":["左胸部","右胸部","脖子上","手臂上"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"电子剂量计和热释光剂量计统一佩戴在左胸部（代表全身受照位置的参考点）。"},{"id":"safety_fs_0003","module":"safety","bank":"辐射防护二级","type":"single","stem":"在辐射控制区工作时，如果佩戴的电子剂量计出现报警，你该如何处理（  ）。","options":["当什么都没发生，继续工作","征询班组成员意见","立即离开作业现场，撤离至卫生出入口，寻求辐射防护人员帮助","打电话给主控"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"电子剂量计报警时应立即离开作业现场，撤离至卫生出入口，寻求辐射防护人员帮助。"},{"id":"safety_fs_0004","module":"safety","bank":"辐射防护二级","type":"single","stem":"对于作业过程中产生的废有机溶剂，应该（  ）。","options":["倒入辐射控制区内的地坑","倒入附近的地漏","妥善收集，放在附近废物收集点","妥善收集，放到指定收集点"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"废有机溶剂属放射性废物/危废，应妥善收集，放到指定收集点分类处理。"},{"id":"safety_fs_0005","module":"safety","bank":"辐射防护二级","type":"single","stem":"带入辐射控制区的物件要求去掉外包装（纸箱、木块等），这样做的目的是（  ）。","options":["减少放射性废物产量","更安全","保持厂房整洁","方便携带"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"去掉外包装的目的是减少放射性废物产量（外包装在控制区可能被污染成为废物）。"},{"id":"safety_fs_0006","module":"safety","bank":"辐射防护二级","type":"single","stem":"对于辐射控制区工具间已有的工器具，应尽量避免从控制区外带入，这么做的目的是（  ）。","options":["省钱","旧工具更好用","避免被污染，减少放射性废物产量"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"尽量避免从控制区外带入工器具，目的是避免被污染、减少放射性废物。"},{"id":"safety_fs_0007","module":"safety","bank":"辐射防护二级","type":"single","stem":"从辐射控制区外带入的工器具，如果在使用过程中发生了污染，应该（  ）。","options":["填写《去污申请单》，交由去污人员","报废，扔到放射性废物收集点","放到辐射控制区内的工具间保管","自行带出辐射控制区"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"带入的工器具被污染后应填写《去污申请单》联系去污，不得随意报废或带出。"},{"id":"safety_fs_0008","module":"safety","bank":"辐射防护二级","type":"single","stem":"如果你怀疑在辐射控制区内使用过的工器具受到了放射性污染，你应该（  ）。","options":["直接换回工具间或仓库","联系辐射防护人员进行测量","扔到放射性废物收集点","进行包裹，直接带出辐射控制区"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"怀疑工器具受污染应联系辐射防护人员进行污染测量确认，不得直接归还或带出。"},{"id":"safety_fs_0009","module":"safety","bank":"辐射防护二级","type":"single","stem":"核电厂的辐射类型中，（  ）是外照射剂量的主要贡献者。","options":["α射线","β射线","γ射线","中子射线"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"γ射线穿透力强，是核电厂外照射剂量的主要贡献者（α、β穿透弱，中子仅特定区域）。"},{"id":"safety_fs_0010","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列哪一种个人防护措施可以减少工作人员的外照射剂量（）。","options":["气衣","无纺布连体服","铅衣","防毒面罩"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"铅衣可有效屏蔽γ射线，减少外照射剂量；气衣、无纺布服、防毒面罩用于防污染/内照射。"},{"id":"safety_fs_0011","module":"safety","bank":"辐射防护二级","type":"single","stem":"电子剂量计用于测量（  ）剂量。","options":["中子外照射","氚内照射","γ外照射","γ外照射和中子外照射"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"电子剂量计（EPD）用于测量γ外照射剂量。"},{"id":"safety_fs_0012","module":"safety","bank":"辐射防护二级","type":"single","stem":"从减少受照射时间的角度，下列方法无法保证有效降低外照射集体剂量的是：（  ）。","options":["工前充分准备，避免工作反复或等待","加强培训和演练，提高人员熟练度","优化工作步骤，提高工作效率","尽量多安排人员，进行剂量分担"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"\"尽量多安排人员进入\"只会增加受照总人数和集体剂量，不能降低集体剂量。"},{"id":"safety_fs_0013","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列对距离防护法说法错误的是：（  ）","options":["实际的作业活动中，我们可以利用长柄工具、机械手或远距离控制装置等以尽量增加人与辐射源之间的距离","某点处γ辐射场的强度与该点同源的距离成反比","操作时应选择合适的工作位置，尽量远离辐射源或放射性 ‘热点’，以减小工作处的剂量率，从而减少受照剂量","距离防护法，就是尽量增加人体与辐射源之间的距离，通过减小剂量率，从而减少人体受照的剂量"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"γ辐射场强度与距离平方成反比，\"某点处γ辐射场强度与距离成正比\"说法错误。"},{"id":"safety_fs_0014","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列对屏蔽防护法说法错误的是：（ ）。","options":["对γ射线而言，铀、钨及铅都是很好的屏蔽材料","搭建屏蔽能够降低工作人员的外照射剂量，无需进行代价利益分析","屏蔽中子射线一般使用轻材料，如石蜡、硼等","所谓屏蔽防护法，就是在人与辐射源之间设置屏蔽物，以减小人员位置的剂量率，从而减少人体受照剂量"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"屏蔽能降低剂量率，但\"搭建屏蔽能够降低工作人员受照剂量却不影响集体剂量\"说法错误（屏蔽直接降低剂量率从而降低集体剂量）。"},{"id":"safety_fs_0015","module":"safety","bank":"辐射防护二级","type":"single","stem":"从放射源项控制的角度，下列说法错误的是：（  ）。","options":["系统或设备去污，降低工作场所剂量率","设备材料控制，减少或避免腐蚀活化产物产生","使用过滤孔径更小的过滤器，降低系统中放射性","将大修中的检修工作尽量安排在前期，保证工作顺利进行"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"将大修中的检修工作集中安排在同一时段进行会使人员集中受照，不属于源项控制措施。"},{"id":"safety_fs_0016","module":"safety","bank":"辐射防护二级","type":"single","stem":"如果随身携带的物品经检测有污染，应（ ）。","options":["自行去污后直接带离辐射控制区","联系去污，去污合格后方可带离辐射控制区","随意丢弃在辐射控制区","直接带离辐射控制区"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"随身物品检测出污染应联系去污，去污合格后经辐射防护人员确认方可带离。"},{"id":"safety_fs_0017","module":"safety","bank":"辐射防护二级","type":"single","stem":"开展辐射工作前，在辐射控制区外进行模拟演练，以提高熟练程度，这属于外照射防护方法中的（ ）。","options":["时间防护","距离防护","屏蔽防护","衰变防护"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"控制区外模拟演练提高熟练度、缩短作业时间，属于外照射防护的时间防护法。"},{"id":"safety_fs_0018","module":"safety","bank":"辐射防护二级","type":"single","stem":"秦山辐射控制区子区划分按剂量率从高到低依次是（ ）。","options":["红、橙、黄、绿","红、黄、橙、绿","绿、黄、橙、红","绿、橙、黄、红"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"秦山辐射控制区按剂量率从高到低分为红、橙、黄、绿四区。"},{"id":"safety_fs_0019","module":"safety","bank":"辐射防护二级","type":"single","stem":"在高辐射工作场所附近存在的环境剂量率明显低且没有放射性污染的位置，可设置低剂量等待标示牌。工作人员在工作过程中，可在此待命。本标示牌底色为（ ）。","options":["绿色","黄色","橙色","蓝色"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"低剂量等待标示牌底色为绿色。"},{"id":"safety_fs_0020","module":"safety","bank":"辐射防护二级","type":"single","stem":"对于射线探伤作业，作业单位应当对射线作业区域进行隔离，其中说法错误的是： （ ）。","options":["需要在隔离边界入口处设置射线探伤警告标示牌","射线探伤警示告示标牌底色为红色，上有白字：正在探伤严禁入内","如果工作中有紧急的情况需要处理，可以采取自行防护措施进入探伤隔离区处理","如果射线探伤工作无法实体隔离，需要使用射线探伤隔离带进行隔离区域"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"射线探伤工作中有紧急情况也不得随意进入隔离区（\"有紧急情况可进入\"说法错误）。"},{"id":"safety_fs_0021","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于重水作业标示牌，下列说法错误是（  ）。","options":["在重水相关系统的进行开口作业时应悬挂重水作业标示牌","重水开口作业标示牌包含开口前后的氚水平、γ辐射水平、松散污染水平、测量人员、测量日期以及联系电话等内容","未经辐射防护人员许可，无关人员请勿靠近","重水开口作业，第一次开展工作前需要辐射防护人员进行监督，后续继续工作时无需通知辐射防护人员"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"重水开口作业第一道防线等具体操作须经辐射防护评估（\"第一时间用塑料布包裹\"说法按题库标注为错误）。"},{"id":"safety_fs_0022","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于负压棚标示牌，下列说法错误是（ ）。","options":["负压棚搭设完毕并经验收合格后应悬挂负压棚标志牌","未经辐射防护人员许可其它工作人员请勿进入","标牌内容一般包含作业的名称、作业负责人、验收人员等信息","负压棚内作业，第一次开展工作前需要辐射防护人员进行验收和监督，后续继续工作时无需通知辐射防护人员"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"负压棚内作业第一项工作等要求须经辐射防护确认（\"进入即开始作业\"类说法错误，以题库标注为准）。"},{"id":"safety_fs_0023","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于辐射防护标示，下列说法错误是：（ ）。","options":["在需要提醒工作人员注意辐射危害的场所，应悬挂注意标示牌。标示牌一般包含辐射防护注意事项，由辐射防护人员依据现场情况填写","在存在较高辐射风险的区域入口应悬挂危险提示牌，提示牌内容一般应包含无关人员请勿靠近、辐射防护人员依据现场情况填写的信息等","在高辐射风险场所入口应悬挂高辐射危害警示牌，标牌内容一般应包含未经授权严禁靠近、辐射防护人员依据现场情况填写的信息等","一般情况下悬挂的注意标示牌、危险提示牌、高辐射危害警示牌均为黄色底色"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"\"一般情况下悬挂的注意事项无关紧要\"说法错误，注意事项是防护要求的重要组成部分。"},{"id":"safety_fs_0024","module":"safety","bank":"辐射防护二级","type":"single","stem":"通常用来表征放射性空气污染对人体所能造成的内照射危害强度的单位是（ ）。","options":["有效剂量","导出空气浓度","剂量率","活度"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"表征放射性空气污染造成内照射危害强度的单位是导出空气浓度（DAC）。"},{"id":"safety_fs_0025","module":"safety","bank":"辐射防护二级","type":"single","stem":"我们常用导出空气浓度表示空气中放射性浓度，其单位是（ ）。","options":["mSv/h","Bq","mSv","DAC"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"导出空气浓度（DAC）是无量纲单位（浓度占DAC值的倍数表示）。"},{"id":"safety_fs_0026","module":"safety","bank":"辐射防护二级","type":"single","stem":"某区域空气中的氚水平为1DAC，相当于（ ）的剂量率。","options":["1μSv/h","10μSv/h","100μSv/h","1mSv/h"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"1DAC氚相当于约10μSv/h的内照射剂量率（在无呼吸防护、持续吸入条件下）。"},{"id":"safety_fs_0027","module":"safety","bank":"辐射防护二级","type":"single","stem":"口罩、面罩等呼吸保护用品的主要功能是（ ）。","options":["防松散表面污染","防空气污染内照射","防中子外照射","防γ外照射"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"口罩、面罩等呼吸保护用品的主要功能是防止空气污染经呼吸道进入体内（防内照射）。"},{"id":"safety_fs_0028","module":"safety","bank":"辐射防护二级","type":"single","stem":"下列设备中，哪种防护用品不是空气污染防护用品？（ ）","options":["口罩","自背式呼吸器","铅衣","气衣"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"铅衣是外照射防护用品，不属于空气污染防护用品。"},{"id":"safety_fs_0029","module":"safety","bank":"辐射防护二级","type":"single","stem":"如果你在实施辐射工作的过程中受了外伤，你应该怎么做？（ ）","options":["自行包扎处理，继续工作","无需处理，继续工作","立即停止工作，离开工作现场，通知辐射防护人员进行伤口污染检查","请示班组长，由班组长决定"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"辐射工作中受外伤应立即停止工作、离开控制区，对伤口包扎处理并报告（防放射性物质经伤口入体）。"},{"id":"safety_fs_0030","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于内照射防护，以下做法不正确的是（ ）。","options":["在辐射控制区内禁止吃东西、喝水等所有进食行为","根据辐射防护要求穿戴相应的呼吸保护用品","工作中受伤流血，自行包扎后继续工作","遵守辐射防护规定，不擅自降低呼吸防护要求"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"\"工作中受伤流血自行简单包扎继续工作\"不正确，必须立即停止工作离开控制区处理。"},{"id":"safety_fs_0031","module":"safety","bank":"辐射防护二级","type":"single","stem":"正常情况下，工作人员进入辐射控制区，必须佩带的个人剂量监测设备有（ ）。","options":["电子剂量计","电子剂量计、中子剂量计","电子剂量计、热释光（TLD）","电子剂量计、热释光（TLD）、中子剂量计"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"进入辐射控制区必须佩戴电子剂量计和热释光剂量计（TLD）两种个人剂量计。"},{"id":"safety_fs_0032","module":"safety","bank":"辐射防护二级","type":"single","stem":"关于RP证（辐射控制区通行证）, 哪个说法是正确的（ ）","options":["可以借给别人使用","必须一人一证","每次授权用不同RP证","由管理人员调剂转借"],"answer":["B"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"RP证（辐射控制区通行证）必须一人一证，严禁转借。"},{"id":"safety_fs_0033","module":"safety","bank":"辐射防护二级","type":"single","stem":"为了减少放射性废物的产生量，工作人员携带物品进入辐射控制区时，应（ ）。","options":["不必去除物品外包装","尽量多带，避免物品不够来回进出辐射控制区","只携带必须使用的物品，并尽量去除外包装","没有特殊要求，随意带入"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"携带物品进控制区应只携带必须使用的物品，减少废物产生和污染风险。"},{"id":"safety_fs_0034","module":"safety","bank":"辐射防护二级","type":"single","stem":"人员进入辐射控制区必须穿戴的防护用品有（ ）。","options":["连体服、袜子、纸帽、手套、口罩、工作鞋、安全帽","连体服、袜子、纸帽、手套、T恤衫、加绒内衣、工作鞋、安全帽","连体服、袜子、纸帽、手套、T恤衫、口罩、工作鞋、安全帽","连体服、袜子、纸帽、手套、T恤衫、工作鞋、安全帽"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"进入辐射控制区必须穿戴连体服、袜子、纸帽、工作鞋等基本防护用品。"},{"id":"safety_fs_0035","module":"safety","bank":"辐射防护二级","type":"single","stem":"领用铅衣、气面罩等附加防护用品一般需要凭（ ）领用。","options":["辐射工作许可证","工作票","隔离票","辐射防护开门申请"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"领用铅衣、气面罩等附加防护用品一般凭辐射工作许可证（RWP）领用。"},{"id":"safety_fs_0036","module":"safety","bank":"辐射防护二级","type":"single","stem":"当工作人员经过门式污染监测仪（C1门）检测发现污染时，应（ ）。","options":["脱去连体服、工作鞋、手套，重新进入门式污染监测仪（C1门）检测","脱去可能污染的防护用品，重新进入门式污染监测仪（C1门）检测","进入污衣间脱去基本防护用品，通知辐射防护人员","通知辐射防护人员，按照辐射防护人员指示重新检测"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"C1门检测发现污染时应通知辐射防护人员，按指引处理，不得自行脱衣重测了事。"},{"id":"safety_fs_0037","module":"safety","bank":"辐射防护二级","type":"single","stem":"工作人员经过全身污染监测仪（C2门）检测发现污染时，应（ ）。","options":["联系辐射防护人员，原地等待辐射防护人员处理","直接离开辐射控制区","自行前往去污间去污","返回现场，继续工作"],"answer":["A"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"C2门（全身污染监测仪）检测发现污染时，应联系辐射防护人员，在指定位置等待处理。"},{"id":"safety_fs_0038","module":"safety","bank":"辐射防护二级","type":"single","stem":"所有从辐射控制区卫生出入口带出的物品，（ ）经过污染检测。","options":["尽可能","不必","按班组长要求","必须全部"],"answer":["D"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"所有从卫生出入口带出的物品必须全部经过污染检测，合格后方可带出。"},{"id":"safety_fs_0039","module":"safety","bank":"辐射防护二级","type":"single","stem":"放射性物品在厂内转运，必须向保健物理处提出申请，办理（ ）手续。","options":["《辐射工作许可证》","《射线探伤许可证》","《放射性物品厂内运输登记表》","《辐射控制区重水样品带出登记表》"],"answer":["C"],"score":null,"source":"official","origin":"辐射防护二级.xls","explanation":"放射性物品厂内转运必须向保健物理处申请，办理《放射性物品厂内运输》手续。"},{"id":"safety_fs_0040","module":"safety","bank":"辐射防护二级","type":"sin
